about: 1
vocabulary:
  significance:
    term: "Clinical significance"
    means: "The ACMG/AMP classification of the variant's effect on disease, as asserted by the evidence below."
    values:
      "Pathogenic": "Causes disease."
      "Likely pathogenic": "More than 90% certain to cause disease."
      "Uncertain significance": "Not enough evidence either way."
      "Likely benign": "More than 90% certain not to cause disease."
      "Benign": "Does not cause disease."
      "Risk factor": "Raises the risk without causing disease alone."
  af:
    term: "Allele frequency"
    means: "The share of chromosomes in the population that carry the variant."
    unit: "fraction (0-1)"
  vaf:
    term: "Variant allele fraction"
    means: "The share of sequencing reads at the position that show the variant. In a germline heterozygous variant it is about 0.5; in a tumour it is lower and depends on the tumour purity and the clonality of the variant."
    unit: "fraction (0-1)"
  symbol: { term: "Gene symbol", means: "The official HGNC short name of the gene, such as BRCA1 or TP53." }
  geneSymbol: { term: "Gene symbol", means: "The official HGNC short name of the gene the variant lies in." }
  location: { term: "Genomic location", means: "The chromosome and the start and end positions of the feature on the GRCh38 reference assembly (1-based coordinates)." }
kinds:
  variant:
    title: "Sequence variant"
    about: >-
      ${$.variantId} is a ${lower($.consequence)} change in ${$.geneSymbol} (${$.proteinChange}, ${$.hgvsC});
      it is classified "${$.significance}" for ${$.condition}.
    guide: genomics
    glossary:
      geneSymbol: { use: "geneSymbol" }
      significance: { use: "significance" }
      consequence:
        term: "Consequence"
        means: "The effect of the change on the gene's product, as named by Sequence Ontology terms."
        values:
          "Missense": "One amino acid is replaced by another."
          "Nonsense": "The change creates a stop codon, so the protein is cut short."
          "Frameshift": "Bases are inserted or deleted so that the reading frame shifts."
          "Synonymous": "The codon changes but the amino acid does not."
          "Splice": "The change lies at a splice site and alters how the transcript is spliced."
      hgvsC: { term: "HGVS coding name", means: "The change written against the coding DNA reference sequence (HGVS c. notation)." }
      proteinChange: { term: "Protein change", means: "The resulting amino-acid change in HGVS p. notation: the original residue, its position and the new residue." }
      rsid: { term: "dbSNP id", means: "The variant's reference SNP identifier in NCBI dbSNP." }
      frequencies.af: { use: "af" }
      frequencies.population: { term: "Population", means: "The ancestry group the allele frequency was measured in." }
      evidence.source: { term: "Evidence source", means: "The database or laboratory that asserted the classification, such as ClinVar or ClinGen." }
      evidence.assertion: { term: "Assertion", means: "The classification given by the source; sources can disagree." }
      evidence.stars: { term: "Review stars", means: "ClinVar's review status, from 0 (no assertion criteria) to 4 (practice guideline).", unit: "stars" }
  gene:
    title: "Gene"
    about: >-
      ${$.symbol} (${$.name}) lies at ${$.location} on the GRCh38 assembly, ${$.length} bases long on the ${$.strand} strand, with ${$.transcripts} known transcripts.
    guide: genomics
    glossary:
      symbol: { use: "symbol" }
      location: { use: "location" }
      length: { term: "Gene length", means: "The number of base pairs between the start and the end of the gene, introns included.", unit: "base pairs" }
      strand: { term: "Strand", means: "The DNA strand the gene is read from: + is the forward strand of the reference, - the reverse." }
      transcripts: { term: "Transcripts", means: "The number of distinct RNA transcripts annotated for the gene, from alternative splicing and start sites." }
      protein: { term: "Protein", means: "The protein record for the gene's main product." }
      variants.id: { term: "Variant", means: "A known variant in the gene." }
      variants.protein: { term: "Protein change", means: "The amino-acid change the variant causes, in HGVS p. notation." }
      variants.significance: { use: "significance" }
      expression.tpm: { term: "Expression level", means: "The abundance of the gene's transcripts in the tissue, in transcripts per million: each count is scaled by gene length and the sample's total reads so that tissues can be compared.", unit: "TPM" }
      expression.tissue: { term: "Tissue", means: "The tissue the expression was measured in." }
  protein:
    title: "Protein"
    about: >-
      ${$.name} (UniProt ${$.accession}) is ${$.length} amino acids long, about ${fmt($.massKda, 'price2')} kDa, and acts in the ${lower($.subcellular)}.
    guide: genomics
    glossary:
      accession: { term: "UniProt accession", means: "The stable identifier of the protein entry in UniProt." }
      length: { term: "Length", means: "The number of amino-acid residues in the protein chain.", unit: "amino acids" }
      massKda: { term: "Molecular mass", means: "The mass of the protein in kilodaltons, about 110 daltons per residue.", unit: "kDa" }
      subcellular: { term: "Subcellular location", means: "The part of the cell where the protein is found or acts." }
      domains.name: { term: "Domain or region", means: "A segment of the chain with its own structure or role, such as an extracellular or kinase domain." }
      domains.start: { term: "Start", means: "The first residue of the region, counted from the start of the chain.", unit: "residue" }
      domains.end: { term: "End", means: "The last residue of the region.", unit: "residue" }
  pathway:
    title: "Biological pathway"
    about: >-
      ${$.name} is a ${lower($.category)} pathway of ${$.geneCount} genes in this collection.
    guide: genomics
    glossary:
      geneCount: { term: "Genes in the pathway", means: "The number of member genes listed." }
      members.symbol: { use: "symbol" }
      members.role: { term: "Role", means: "What the gene's product does in the pathway." }
      members.location: { use: "location" }
  sample:
    title: "Sequenced sample"
    about: >-
      ${$.sampleId} is ${lower($.tissue)} tissue with a diagnosis of ${$.diagnosis}, sequenced to a mean coverage of ${fmt($.meanCoverage, 'amount0')}x;
      ${$.variantCount} variant(s) were called and the tumour purity is ${fmt($.purity, 'pct0')}.
    guide: genomics
    glossary:
      tissue: { term: "Tissue", means: "The tissue the specimen was taken from." }
      diagnosis: { term: "Diagnosis", means: "The clinical diagnosis recorded for the specimen." }
      purity: { term: "Tumour purity", means: "The share of the cells in the specimen that are tumour cells. Low purity lowers the allele fractions and makes variants harder to detect.", unit: "fraction of cells" }
      variantCount: { term: "Variants called", means: "The number of variants the pipeline reported for the sample." }
      meanCoverage: { term: "Mean coverage", means: "The average number of reads covering each targeted base. Higher coverage lets low-fraction variants be called with confidence.", unit: "reads per base (x)" }
      collected: { term: "Collection date", means: "The date the specimen was collected." }
      calls.variant: { term: "Variant", means: "The variant that was called in the sample." }
      calls.gene: { use: "symbol" }
      calls.vaf: { use: "vaf" }
      calls.depth: { term: "Read depth", means: "The number of reads covering the variant's position.", unit: "reads" }
      calls.filter: { term: "Filter", means: "The outcome of the pipeline's quality filters: PASS means the call was kept; other values name the filter that failed it, or mark the call as germline." }
  sequencing-run:
    title: "Sequencing run"
    about: >-
      ${$.runId} ran on a ${$.instrument} (flow cell ${$.flowcell}) and produced ${fmt($.yieldGb, 'amount0')} Gb; ${fmt($.q30, 'pct0')} of bases have a quality score of at least 30.
    guide: genomics
    glossary:
      instrument: { term: "Instrument", means: "The sequencer model that ran the flow cell." }
      flowcell: { term: "Flow cell", means: "The identifier of the consumable the samples were loaded onto." }
      yieldGb: { term: "Yield", means: "The total amount of sequence produced by the run.", unit: "gigabases" }
      q30: { term: "Q30", means: "The share of bases called with a Phred quality score of at least 30, that is, an error probability of 1 in 1000 or less.", unit: "% of bases" }
      clustersPf: { term: "Clusters passing filter", means: "The share of clusters on the flow cell that were clean enough to be used. Low values point to overloading or a chemistry problem.", unit: "% of clusters" }
      samples.sample: { term: "Sample", means: "A specimen loaded in the run." }
      samples.readsM: { term: "Reads", means: "The number of reads the sample received.", unit: "millions" }
      samples.coverage: { term: "Coverage", means: "The average number of reads covering each targeted base of the sample.", unit: "reads per base (x)" }
  expression-study:
    title: "Differential-expression study"
    about: >-
      ${$.title} compares ${$.comparison} across ${$.sampleCount} samples; ${fmt($.significant, 'amount0')} genes differ significantly.
    guide: genomics
    glossary:
      comparison: { term: "Comparison", means: "The two groups of samples whose gene expression is compared." }
      sampleCount: { term: "Samples", means: "The number of samples in the study." }
      significant: { term: "Significant genes", means: "The number of genes whose adjusted p-value passes the study's significance threshold." }
      results.gene: { use: "symbol" }
      results.log2fc: { term: "log2 fold change", means: "The base-2 logarithm of the ratio of the gene's expression in the first group to the second: 1 means doubled, -1 halved.", sign: "Positive is higher in the first group." }
      results.baseMean: { term: "Mean expression", means: "The average of the normalised read counts of the gene over all samples; low values make the fold change less reliable.", unit: "normalised counts" }
      results.padj: { term: "Adjusted p-value", means: "The p-value after correction for testing thousands of genes at once (Benjamini-Hochberg), controlling the false discovery rate.", unit: "probability" }
  clinical-trial:
    title: "Clinical trial"
    about: >-
      ${$.title} is a ${$.phase} trial, ${lower($.status)}: ${$.enrolled} of ${$.target} patients are enrolled, selected on the biomarker ${$.biomarkerName}.
    guide: genomics
    glossary:
      phase: { term: "Trial phase", means: "The stage of drug development: phase I tests safety and dose, phase II looks for activity in a small group, phase III confirms benefit in a large one.", values: { "Phase I": "Safety and dose.", "Phase II": "Early evidence of activity.", "Phase III": "Confirmation against standard care." } }
      enrolled: { term: "Patients enrolled", means: "The number of patients who have joined the trial so far." }
      target: { term: "Enrolment target", means: "The number of patients the trial plans to enrol." }
      biomarkerName: { term: "Biomarker", means: "The genetic change that decides who is eligible, so that the drug goes to patients likely to respond." }
      arms.arm: { term: "Arm", means: "A group of patients receiving the same treatment, such as the experimental drug or the control." }
      arms.intervention: { term: "Intervention", means: "The treatment the arm receives." }
      arms.patients: { term: "Patients in the arm", means: "The number of patients assigned to the arm." }
      arms.orr: { term: "Objective response rate", means: "The share of patients whose tumour shrank by a defined amount or disappeared.", unit: "% of patients" }
