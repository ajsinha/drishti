about: 1
vocabulary:
  significance:
    term: Clinical significance
    means: The ACMG/AMP classification of the variant's effect on disease, as asserted by the evidence below.
    values:
      Pathogenic: Causes disease
      Likely pathogenic: "> 90% certain to cause disease"
      Uncertain significance: Not enough evidence
      Risk factor: Raises the risk without causing disease alone
  af:
    term: Allele frequency
    means: Share of chromosomes in the population that carry the variant.
    unit: fraction (0-1)
kinds:
  variant:
    title: Sequence variant
    about: >-
      ${$.variantId} is a ${lower($.consequence)} change in ${$.geneSymbol} (${$.proteinChange}, ${$.hgvsC});
      it is classified "${$.significance}" for ${$.condition}.
    guide: genomics
    glossary:
      significance: { use: significance }
      hgvsC:
        term: HGVS coding name
        means: The change written against the coding DNA reference sequence (HGVS c. notation).
      proteinChange:
        term: Protein change
        means: The resulting amino-acid change in HGVS p. notation.
      rsid:
        term: dbSNP id
        means: The variant's reference SNP identifier in NCBI dbSNP.
      frequencies.af: { use: af }
      evidence.stars:
        term: Review stars
        means: ClinVar review status, 0 (no assertion criteria) to 4 (practice guideline).
        unit: stars
