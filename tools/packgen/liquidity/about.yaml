about: 1
vocabulary:
  minimum: { term: "Regulatory minimum", means: "The lowest ratio the regulation allows. Both the LCR and the NSFR must be at least 100%.", unit: "ratio (1.00 = 100%)" }
  legalEntityName: { term: "Legal entity", means: "The legal entity of the group whose balance sheet the figures describe. Liquidity requirements apply to each entity, not only to the group." }
kinds:
  lcr:
    title: Liquidity coverage ratio
    about: >-
      ${$.legalEntityName} holds ${fmt($.hqla, 'compact')} of high-quality liquid assets against ${fmt($.netOutflows, 'compact')} of
      net outflows over 30 days of stress: an LCR of ${fmt($.lcr, 'pct0')} against a minimum of ${fmt($.minimum, 'pct0')}, a buffer of
      ${fmt($.buffer, 'compact')} above the requirement as of ${$.asOf}.
    guide: liquidity-risk
    glossary:
      lcr:
        term: "Liquidity coverage ratio"
        means: "High-quality liquid assets divided by total net cash outflows over the next 30 calendar days in a prescribed stress. It shows whether the bank can survive a month of stress without outside help."
        unit: "% (100% is the minimum)"
      hqla: { term: "High-quality liquid assets", means: "The stock of unencumbered assets that can be turned into cash quickly and with little loss of value, after haircuts and caps by level.", unit: "reporting currency" }
      netOutflows: { term: "Net cash outflows", means: "Expected outflows over 30 days of stress less expected inflows, where inflows are capped at 75% of outflows.", unit: "reporting currency" }
      minimum: { use: "minimum" }
      buffer: { term: "Surplus over the minimum", means: "High-quality liquid assets less the net outflows that must be covered; the liquidity above the requirement.", unit: "reporting currency", sign: "Negative would be a shortfall." }
      hqlaByLevel.level: { term: "HQLA level", means: "Level 1 assets (cash, central-bank reserves, most sovereign bonds) count in full; Level 2A and 2B are discounted and capped." }
      hqlaByLevel.value: { term: "Value of the level", means: "The liquidity value of the assets of this level, after haircut.", unit: "reporting currency" }
      flows.category: { term: "Cash-flow category", means: "The class of liability or asset the outflow or inflow comes from, such as stable retail deposits or unsecured wholesale funding." }
      flows.balance: { term: "Balance", means: "The outstanding amount in the category.", unit: "reporting currency" }
      flows.rate: { term: "Run-off or inflow rate", means: "The share of the balance assumed to leave (outflow) or arrive (inflow) within 30 days of stress; the regulation sets it by category.", unit: "% of balance" }
      flows.flow: { term: "Stressed flow", means: "The balance multiplied by its rate.", unit: "reporting currency", sign: "Negative is an outflow." }
      trend.lcr: { term: "LCR on the date", means: "The ratio on a past reporting date, for the trend." }
    panels:
      hqla: { about: "The buffer of ${fmt($.hqla, 'compact')} is shown after haircuts. The regulation also caps Level 2 assets at 40% of the buffer, and Level 2B assets at 15%." }
      outflows: { about: "The outflows of these categories, less capped inflows, give the net outflows of ${fmt($.netOutflows, 'compact')}." }
  nsfr:
    title: Net stable funding ratio
    about: >-
      ${$.legalEntityName} has ${fmt($.asfTotal, 'compact')} of available stable funding against ${fmt($.rsfTotal, 'compact')} required:
      an NSFR of ${fmt($.nsfr, 'pct0')} against a minimum of ${fmt($.minimum, 'pct0')}.
    guide: liquidity-risk
    glossary:
      nsfr: { term: "Net stable funding ratio", means: "Available stable funding divided by required stable funding over a one-year horizon. It checks that long-term assets are funded by stable sources and so limits reliance on short-term wholesale funding.", unit: "% (100% is the minimum)" }
      asfTotal: { term: "Available stable funding", means: "The part of the bank's capital and liabilities expected to stay for a year, each weighted by an ASF factor.", unit: "reporting currency" }
      rsfTotal: { term: "Required stable funding", means: "The amount of stable funding the bank's assets and off-balance-sheet exposures need, each weighted by an RSF factor.", unit: "reporting currency" }
      minimum: { use: "minimum" }
      asf.category: { term: "Funding category", means: "A class of capital or liabilities, such as regulatory capital, retail deposits or wholesale funding." }
      asf.amount: { term: "Carrying amount", means: "The balance of the category before weighting.", unit: "reporting currency" }
      asf.factor: { term: "ASF factor", means: "The share of the category counted as stable funding, set by the regulation: 100% for regulatory capital and lower for less stable sources.", unit: "% of amount" }
      asf.weighted: { term: "Weighted amount", means: "The amount multiplied by its ASF factor.", unit: "reporting currency" }
      rsf.category: { term: "Asset category", means: "A class of asset or commitment, such as high-quality liquid assets, loans or derivatives." }
      rsf.amount: { term: "Carrying amount", means: "The balance of the category before weighting.", unit: "reporting currency" }
      rsf.factor: { term: "RSF factor", means: "The share of the category that must be funded with stable funding: the less liquid and the longer the asset, the higher it is.", unit: "% of amount" }
      rsf.weighted: { term: "Weighted amount", means: "The amount multiplied by its RSF factor.", unit: "reporting currency" }
  maturity-ladder:
    title: Liquidity maturity ladder
    about: >-
      ${$.legalEntityName}'s contractual ${$.currency} cash flows are laid out by time bucket; the cumulative gap at one month is
      ${fmt($.gap1m, 'signed0')} and the liquid-asset buffer lasts ${$.survivalDays} days.
    guide: liquidity-risk
    glossary:
      gap1m: { term: "Cumulative gap, 1 month", means: "Inflows less outflows summed over all buckets up to one month. A negative gap must be covered from the liquidity buffer or new funding.", unit: "ladder currency", sign: "Negative is a net outflow." }
      survivalDays: { term: "Survival horizon", means: "The first day on which the liquid-asset buffer plus the cumulative net flows turns negative; 365 means it lasts the whole ladder.", unit: "days" }
      buckets.bucket: { term: "Time bucket", means: "The range of days from today in which the contractual cash flows fall, from overnight to a year and longer." }
      buckets.inflows: { term: "Inflows", means: "Cash the entity contractually expects to receive in the bucket.", unit: "ladder currency" }
      buckets.outflows: { term: "Outflows", means: "Cash the entity contractually has to pay in the bucket.", unit: "ladder currency" }
      buckets.net: { term: "Net flow", means: "Inflows less outflows of the bucket.", unit: "ladder currency", sign: "Negative is a net outflow." }
      buckets.cumulative: { term: "Cumulative gap", means: "The running total of net flows from today to the end of the bucket.", unit: "ladder currency", sign: "Negative is a funding need." }
  hqla-holding:
    title: HQLA holding
    about: >-
      ${$.holdingId} is ${$.security}, a ${$.level} asset with a market value of ${fmt($.marketValue, 'compact')} and a liquidity
      value of ${fmt($.liquidityValue, 'compact')}${$.encumbered == 'No' ? '' : '; it is pledged, so it does not count'}.
    guide: liquidity-risk
    glossary:
      security: { term: "Security", means: "The bond or other asset held in the liquidity buffer." }
      level:
        term: "HQLA level"
        means: "The Basel class of high-quality liquid asset: Level 1 is the most liquid and counts in full, Level 2A and 2B count after haircuts and are capped as a share of the buffer."
        values:
          "Level 1": "Cash, central-bank reserves and most sovereign bonds; no haircut."
          "Level 2A": "Such as some covered bonds and lower-rated sovereigns; 15% haircut."
          "Level 2B": "Such as high-quality corporate bonds and equities; larger haircut and a tighter cap."
      marketValue: { term: "Market value", means: "The current market value of the holding.", unit: "holding currency" }
      haircut: { term: "Haircut", means: "The percentage taken off the market value for the regulatory liquidity value, set by the HQLA level.", unit: "% of market value" }
      liquidityValue: { term: "Liquidity value", means: "What counts towards the buffer: the market value less the haircut, and zero if the asset is encumbered.", unit: "reporting currency" }
      encumbered:
        term: "Encumbered"
        means: "Whether the asset is pledged or otherwise not freely available. Only unencumbered assets count as HQLA."
        values:
          "No": "Free to be sold or repoed; it counts."
          "Yes (pledged)": "Pledged to secure a transaction; it does not count."
  funding-source:
    title: Funding source
    about: >-
      ${$.fundingId} is ${fmt($.amount, 'compact')} ${$.currency} of ${lower($.type)} from ${$.counterpartyName}, maturing ${$.maturity};
      the LCR assumes ${fmt($.runOffRate, 'pct0')} of it leaves within 30 days of stress.
    guide: liquidity-risk
    glossary:
      counterpartyName: { term: "Funding provider", means: "The counterparty that provides the funding." }
      maturity: { term: "Maturity", means: "The date the funding falls due and has to be repaid or rolled." }
      runOffRate: { term: "Run-off rate", means: "The share of the funding the LCR assumes the provider withdraws or fails to roll over within 30 days in the stress; the regulation sets it by type of funding and provider.", unit: "% of amount" }
  liquidity-stress:
    title: Liquidity stress result
    about: >-
      Under "${$.scenarioName}" ${$.legalEntityName} survives ${$.survivalDays} days against an appetite of ${$.appetiteDays};
      its lowest liquidity position on the way is ${fmt($.minimumPosition, 'signed0')}.
    guide: liquidity-risk
    glossary:
      scenarioName: { term: "Stress scenario", means: "The assumed combination of idiosyncratic and market-wide shocks, such as a run on wholesale funding with a fall in asset values." }
      legalEntityName: { use: "legalEntityName" }
      survivalDays: { term: "Survival horizon", means: "The number of days the liquid assets cover the stressed outflows before the position turns negative.", unit: "days" }
      minimumPosition: { term: "Lowest position", means: "The smallest liquidity surplus along the path; negative means the buffer was exhausted.", unit: "reporting currency", sign: "Negative is a shortfall." }
      appetiteDays: { term: "Risk appetite", means: "The survival horizon the board requires under this scenario. A survival period shorter than the appetite is a breach.", unit: "days" }
      path.day: { term: "Day", means: "Days since the start of the stress." }
      path.position: { term: "Liquidity position", means: "Liquid assets after the outflows to that day.", unit: "reporting currency" }
      drivers.driver: { term: "Driver", means: "The source of the outflows, such as wholesale or retail run-off." }
      drivers.outflow: { term: "Outflow", means: "The cash lost through the driver over the scenario.", unit: "reporting currency" }
  intraday-liquidity:
    title: Intraday liquidity
    about: >-
      ${$.legalEntityName} used at most ${fmt($.peakUsage, 'compact')} ${$.currency} of intraday liquidity on ${$.paymentSystem}, ${fmt($.usagePct, 'pct0')}
      of the ${fmt($.available, 'compact')} available.
    guide: liquidity-risk
    glossary:
      peakUsage: { term: "Peak intraday usage", means: "The largest net amount of liquidity used during the day to settle payments, the deepest point of the day's net position.", unit: "reporting currency" }
      available: { term: "Available intraday liquidity", means: "The central-bank balances, collateral and credit lines that can be used to settle payments during the day.", unit: "reporting currency" }
      usagePct: { term: "Usage", means: "Peak usage as a share of the available intraday liquidity.", unit: "% of available" }
      paymentSystem: { term: "Payment system", means: "The system the payments settle in, such as a real-time gross settlement system." }
      usage.time: { term: "Time of day", means: "The hour of the observation." }
      usage.used: { term: "Liquidity used", means: "The intraday liquidity in use at that time.", unit: "reporting currency" }
      largePayments.time: { term: "Time", means: "When the payment settled." }
      largePayments.counterparty: { term: "Counterparty", means: "The party paid or paying." }
      largePayments.amount: { term: "Amount", means: "The size of the payment.", unit: "reporting currency" }
