# Where every pack's data comes from, for the "Data retrieval" section of each pack's guide (tools/packgen/common/guide_data.py; the
# product owner's request of 2026-10-26: data contract, data retrieval and details for all packs). The contracts say what a kind holds
# and how it is stored (config/packs/<pack>/contracts/*.contract.yaml); this file says how its data is made: an external source (with
# its refresh script), a generator of synthetic test data, or a Drishti engine. A computed kind needs no entry: its contract names its
# connector and engine, and `engines` below adds the guide that explains it. The External data help page (docs/guides/PUBLIC_DATA.md)
# documents every external source at length; a new source is a row there and an entry here.

# External sources: id -> what the guide says of it. `script` and `source` are the refresh script and its SOURCE argument.
external:
  worldbank: { title: "World Bank World Development Indicators and Worldwide Governance Indicators", url: "https://api.worldbank.org/v2",
               licence: "CC BY 4.0", internal: false, script: tools/publicdata/world_economy.py, source: worldbank }
  imf: { title: "IMF World Economic Outlook (DataMapper)", url: "https://www.imf.org/external/datamapper/api/v1",
         licence: "IMF terms: reuse with attribution; commercial reuse needs the IMF's permission", internal: true,
         script: tools/publicdata/world_economy.py, source: imf }
  undp: { title: "UNDP Human Development Index", url: "https://hdr.undp.org/data-center/documentation-and-downloads",
          licence: "CC BY 3.0 IGO", internal: false, script: tools/publicdata/world_economy.py, source: undp }
  factbook: { title: "CIA World Factbook (the factbook.json mirror at a pinned commit)", url: "https://github.com/factbook/factbook.json",
              licence: "public domain (the mirror CC0 1.0)", internal: false, script: tools/publicdata/world_economy.py, source: factbook }
  census: { title: "US Census Bureau population estimates and BEA state GDP (rounded by hand, illustrative)",
            url: "https://www.census.gov/programs-surveys/popest.html", licence: "public domain (US Government work)", internal: false,
            script: tools/packgen/world/make.py, source: "(typed into the generator; no fetch)" }
  yahoo-quote: { title: "Yahoo Finance quotes and daily history (the yfinance connector)", url: "https://finance.yahoo.com",
                 licence: "Yahoo terms: personal use, no redistribution", internal: true, script: tools/publicdata/news_and_markets.py,
                 source: quote }
  google-news: { title: "Google News RSS headlines (the news connector)", url: "https://news.google.com/rss",
                 licence: "the headlines belong to their publishers", internal: true, script: tools/publicdata/news_and_markets.py,
                 source: news }
  ecb-fx: { title: "ECB euro reference FX rates", url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip",
            licence: "ECB: free reuse with the source acknowledged", internal: false, script: tools/publicdata/official_market_data.py,
            source: ecb-fx }
  us-treasury: { title: "US Treasury daily par yield curve", url: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates",
                 licence: "public domain (US Government work)", internal: false, script: tools/publicdata/official_market_data.py,
                 source: us-treasury }
  sofr: { title: "SOFR, Federal Reserve Bank of New York", url: "https://markets.newyorkfed.org/api/rates/secured/sofr",
          licence: "NY Fed terms of use: reuse with attribution", internal: false, script: tools/publicdata/official_market_data.py, source: sofr }
  estr: { title: "Euro short-term rate (ECB)", url: "https://data-api.ecb.europa.eu/service/data/EST",
          licence: "ECB: free reuse with the source acknowledged", internal: false, script: tools/publicdata/official_market_data.py,
          source: estr }
  wikidata: { title: "Wikidata: index membership and company facts", url: "https://query.wikidata.org/sparql", licence: "CC0 1.0",
              internal: false, script: tools/publicdata/us_equities.py, source: wikidata }
  nasdaq: { title: "Nasdaq Trader symbol directory", url: "https://www.nasdaqtrader.com/dynamic/SymDir/", licence: "public symbol directory files",
            internal: false, script: tools/publicdata/us_equities.py, source: nasdaq }
  sec: { title: "SEC EDGAR: tickers, submissions, XBRL company facts", url: "https://data.sec.gov",
         licence: "public domain (US Government work); EDGAR fair access policy", internal: false, script: tools/publicdata/us_equities.py,
         source: sec }
  gleif-us: { title: "GLEIF LEI records (each company's LEI)", url: "https://api.gleif.org/api/v1", licence: "CC0 1.0", internal: false,
              script: tools/publicdata/us_equities.py, source: gleif }
  yahoo-prices: { title: "Yahoo Finance daily prices (the us-equities-prices connector)", url: "https://finance.yahoo.com",
                  licence: "Yahoo terms: personal use, no redistribution", internal: true, script: tools/publicdata/us_equities.py, source: prices }
  gleif-golden: { title: "GLEIF golden copy, level 2: relationship records and reporting exceptions", url: "https://goldencopy.gleif.org",
                  licence: "CC0 1.0 (attribution appreciated)", internal: false, script: tools/publicdata/gleif.py, source: golden }
  gleif-api: { title: "GLEIF LEI API: LEI records, legal forms, countries, LEI issuers", url: "https://api.gleif.org/api/v1",
               licence: "CC0 1.0 (attribution appreciated)", internal: false, script: tools/publicdata/gleif.py, source: api }
  gleif-mapping: { title: "GLEIF mapping files: BIC, ISIN, MIC and OpenCorporates to LEI", url: "https://mapping.gleif.org",
                   licence: "CC0 1.0", internal: false, script: tools/publicdata/gleif.py, source: mapping }

# The refresh scripts (tools/publicdata/): their wrappers' pack name and the examples each guide shows besides status and --dry-run.
scripts:
  tools/publicdata/world_economy.py:
    wrapper: world-economy
    examples:
      - ["refresh", "a full build in <data>/publicdata/world-economy (the IMF data never goes to a committed folder by default)"]
      - ["refresh --internal-ok", "refresh the committed dataset and pack (they carry IMF data: internal demos only)"]
      - ["refresh --no-imf", "a build without any IMF data, for anything shown outside the organisation"]
  tools/publicdata/news_and_markets.py:
    wrapper: news-and-markets
    examples:
      - ["refresh", "a new snapshot in <data>/publicdata/news-and-markets/testdata (through a scratch server's live connectors)"]
      - ["refresh --internal-ok", "replace the committed snapshot in data/testdata (internal demos only), then lake demo"]
  tools/publicdata/official_market_data.py:
    wrapper: market-data
    examples:
      - ["refresh", "a year of official history into <data>/publicdata/market-data (never over the synthetic samples)"]
      - ["refresh ecb-fx --years 5 --scope USDMXN,EURSEK", "more history and more pairs"]
  tools/publicdata/us_equities.py:
    wrapper: us-equities
    examples:
      - ["refresh", "the committed pack: data/testdata/us-equities, samples/ and this guide, then make.py --check"]
      - ["refresh --offline", "the same from the download cache only"]
      - ["refresh --scope TSLA,FILINGS:40", "a widened build in <data>/publicdata/us-equities"]
  tools/publicdata/gleif.py:
    wrapper: gleif
    examples:
      - ["refresh", "the committed pack: data/testdata/gleif, samples/ and this guide, then make.py --check"]
      - ["refresh --offline", "the same from the download cache only"]
      - ["refresh --scope NAME:allianz,CAP:200", "a widened build in <data>/publicdata/gleif"]

# Generators of synthetic (or hand-written) data: id -> the command, what it writes and its check.
generators:
  testdata: { run: "python3 tools/testdata/make_testdata.py", check: "python3 tools/testdata/make_testdata.py --check",
              what: "sixty business days of every dataset of the seven packs into data/testdata/<pack>/<kind>/ (the universe: tools/testdata/universe.py; deterministic, fictitious names)" }
  banking-samples: { run: "python3 tools/packgen/banking/make_data.py", check: "python3 tools/packgen/banking/make_data.py --check",
                     what: "the pack's few reference documents in samples/ (from the taxonomy, tools/packgen/banking/taxonomy.py)" }
  trades: { run: "python3 tools/testdata/make_testdata.py", check: "python3 tools/testdata/make_testdata.py --check",
            what: "5,000 trades a booking system into data/testdata/trades/{endur,calypso,murex}/ in the common 47-attribute UPPER_SNAKE schema (tools/packgen/trades/schema.py)" }
  var: { run: "python3 tools/packgen/var/make_var_data.py", check: "python3 -m pytest -q tools/packgen/var/test_var_data.py",
         what: "the VaR engine's inputs into data/testdata/market-risk/<kind>/, as an upstream risk batch would deliver them, from the committed trades (VAR_GUIDE.md)" }
  ccr: { run: "python3 tools/packgen/ccr/make_ccr_data.py", check: "python3 -m pytest -q tools/packgen/ccr/test_ccr_data.py",
         what: "the exposure engine's inputs into data/testdata/counterparty-risk/<kind>/, as an upstream exposure simulator would deliver them, from the committed netting sets (EXPOSURE_GUIDE.md)" }
  news-reference: { run: "python3 config/packs/news-and-markets/tools/make_samples.py",
                    what: "hand-written reference data (topics and listed companies) into the pack's samples/" }
  compute-demo: { run: "python3 config/packs/compute-demo/tools/make_samples.py",
                  what: "synthetic P&L strips (a seeded random walk) into the pack's samples/" }

# The guide that explains each engine (by the connector named in a computed kind's contract).
engines:
  var-engine: "[VaR guide](../../../../docs/guides/VAR_GUIDE.md)"
  var-whatif: "[VaR guide](../../../../docs/guides/VAR_GUIDE.md)"
  var-results: "[VaR guide](../../../../docs/guides/VAR_GUIDE.md) (official results)"
  var-positions: "[VaR guide](../../../../docs/guides/VAR_GUIDE.md) (positions)"
  exposure-engine: "[Exposure guide](../../../../docs/guides/EXPOSURE_GUIDE.md)"
  exposure-whatif: "[Exposure guide](../../../../docs/guides/EXPOSURE_GUIDE.md)"
  exposure-results: "[Exposure guide](../../../../docs/guides/EXPOSURE_GUIDE.md) (official results)"
  correlation-engine: "[Groupings and analytics guide](../../../../docs/guides/GROUPINGS_ANALYTICS_GUIDE.md)"
  equity-analytics: "[Groupings and analytics guide](../../../../docs/guides/GROUPINGS_ANALYTICS_GUIDE.md)"
  gleif-groupings: "[Groupings and analytics guide](../../../../docs/guides/GROUPINGS_ANALYTICS_GUIDE.md)"
  us-equities-groupings: "[Groupings and analytics guide](../../../../docs/guides/GROUPINGS_ANALYTICS_GUIDE.md)"
  macro-groupings: "[Groupings and analytics guide](../../../../docs/guides/GROUPINGS_ANALYTICS_GUIDE.md)"
  trade-pages: "the derived connector's settings in the trading pack's pack.yaml (`trade-pages`)"
  path-sum-python: "[reactive connectors](../../../../docs/architecture/REACTIVE_CONNECTORS.md)"
  path-sum-java: "[reactive connectors](../../../../docs/architecture/REACTIVE_CONNECTORS.md)"

# Each pack: the default origin of its stored kinds and the kinds that differ. An entry is {generator: id} or {external: [ids]};
# `live` names the external sources a connector reads live when switched on (off as shipped), next to the committed data.
packs:
  core:
    default: { generator: testdata, also: banking-samples }
  market-data:
    default: { generator: testdata, also: banking-samples }
    kinds:
      fx-spot: { generator: testdata, also: banking-samples, official: [ecb-fx] }
      ir-curve: { generator: testdata, also: banking-samples, official: [us-treasury] }
      rate-fixing: { generator: testdata, also: banking-samples, official: [sofr, estr] }
  trading:
    default: { generator: trades }
  market-risk:
    default: { generator: testdata, also: banking-samples }
    kinds:
      pnl-vector: { generator: var }
      scenario-set: { generator: var }
      risk-hierarchy: { generator: var }
      portfolio: { generator: var }
  counterparty-risk:
    default: { generator: testdata, also: banking-samples }
    kinds:
      exposure-path: { generator: ccr }
      simulation-run: { generator: ccr }
  world-economy:
    kinds:
      economy: { external: [worldbank, imf] }
      economic-forecast: { external: [imf] }
      fiscal-position: { external: [worldbank, imf] }
      labour-market: { external: [worldbank] }
      macro-indicator: { external: [worldbank] }
      social-indicator: { external: [worldbank, undp] }
      jurisdiction: { external: [factbook, worldbank] }
      region: { external: [worldbank, factbook] }
      election: { external: [factbook] }
      office-holder: { external: [factbook] }
      party: { external: [factbook] }
      region-economy: { external: [census] }
  news-and-markets:
    default: { generator: news-reference }
    kinds:
      quote: { external: [yahoo-quote] }
      news: { external: [google-news] }
  us-equities:
    default: { external: [sec, wikidata, nasdaq, gleif-us] }
    kinds:
      index-membership: { external: [wikidata] }
      filing-feed: { external: [sec] }
      filing: { external: [sec] }
      financial-fact: { external: [sec] }
      price-history: { external: [yahoo-prices] }
  gleif:
    default: { external: [gleif-api, gleif-golden, gleif-mapping] }
  compute-demo:
    default: { generator: compute-demo }
