# The hand-written README intros of the two genomics packs; files.py appends the pack's own to its config/about.yaml.
genomics-showcase:
  intro:
    generator: tools/packgen/genomics_showcase/make.py
    refresh: python3 tools/packgen/genomics_showcase/make.py
    sources:
    - name: Synthetic and seeded (tools/packgen/genomics_showcase/make.py, seed 20261116)
      licence: Proprietary (part of Drishti)
      internal-only: false
      used-for: every kind (nothing in it is real)
    sections:
      What it is: |-
        A synthetic cohort of 1,500 patients read against one invented gene, `HLXK7`, in the genomics module: 2,000 genes (24 of them planted
        drivers), 12,000 variant sites, 45,000 variant calls, 3,000 copy-number segments, 500 pathway memberships and 36,000 association tests
        of three traits. The tests are computed from the generated calls and traits, so the peaks, the figures and the records behind them
        agree. It is the genomics half of the showcase; the protein-engineering pack is the other. Every
        gene, patient and number is invented; nothing is real.
      Screens and commands: |-
        `ASSOC` opens one association test; `SGENE`, `SSAMPLE`, `SVARIANT`, `VCALL`, `CNV` and `PATHWAY` open the other kinds. Each is a plain record
        page; linked fields (a variant's gene, a call's sample) open their kinds. The showcase's screens (association plot, cohort matrix, map of
        samples, variant lollipop) are drawn from these kinds.
      Refreshing the data: |-
        Nothing is pulled: `python3 tools/packgen/genomics_showcase/make.py` writes the committed data (`data/testdata/genomics-showcase/`) from
        a seed, the same bytes every time; `drishti.py lake demo --only genomics-showcase` builds it into the demo lake.
protein-engineering:
  intro:
    generator: tools/packgen/genomics_showcase/make.py
    refresh: python3 tools/packgen/genomics_showcase/make.py
    sources:
    - name: Synthetic and seeded (tools/packgen/genomics_showcase/make.py, seed 20261116)
      licence: Proprietary (part of Drishti)
      internal-only: false
      used-for: every kind (nothing in it is real)
    sections:
      What it is: |-
        Four invented proteins and the campaign that redesigned one of them, Helixase-7 (gene `HLXK7`, 312 amino acids): the fold with its
        coordinates, burial and contacts; a deep mutational scan of every position and every amino acid in two assays (47,840 scores); and eight
        rounds of 1,500 designs that climb to about fifteen times the natural activity, 33,000 changes in all. It is the protein half of the
        showcase; the genomics-showcase pack is the other, joined through the gene, the position and the
        amino acid. Every protein, number and design is invented; nothing is real.
      Screens and commands: |-
        `PROT` opens a protein and `DESIGN` a design; `RESIDUE`, `DMS`, `CONTACT`, `DMUT` and `DROUND` open the other kinds. Each is a plain
        record page; linked fields open their kinds. The workbench's screens (scan heatmap, structure, design campaign, leaderboard) are drawn
        from these kinds.
      Refreshing the data: |-
        Nothing is pulled: `python3 tools/packgen/genomics_showcase/make.py` writes the committed data (`data/testdata/protein-engineering/`) from
        a seed, the same bytes every time; `drishti.py lake demo --only protein-engineering` builds it into the demo lake.
