about: 1
vocabulary:
  var99:
    term: "Value at risk, 99%, 1 day"
    means: "The loss the portfolio is expected not to exceed on 99 of 100 trading days, read from the 1st percentile of the revalued scenario P&L (historical simulation)."
    unit: "USD"
    sign: "A loss, written as a positive number."
  es975:
    term: "Expected shortfall, 97.5%"
    means: "The average loss on the worst 2.5% of scenario days. It looks into the tail that VaR ignores, and it is the measure the FRTB internal-models approach uses for capital."
    unit: "USD"
    sign: "A loss, written as a positive number."
  svar:
    term: "Stressed VaR"
    means: "VaR calculated with the same model but over a 12-month period of significant stress for the portfolio, instead of the recent past. It feeds the market-risk capital requirement (Basel 2.5)."
    unit: "USD"
    sign: "A loss, written as a positive number."
  pnl:
    term: "Profit and loss"
    means: "The change in value over the period of the result. In a stress result, the revaluation of the portfolio under the scenario."
    unit: "USD"
    sign: "Positive is a gain, negative a loss."
kinds:
  var:
    title: Value-at-risk result
    about: >-
      ${$.RESULT_ID} is a 1-day 99% historical VaR for ${coalesce($.DESK_NAME, $.DESK, 'this portfolio')}:
      ${fmt($.VAR_99, 'compact')} USD, ${fmt($.VAR_99 / $.LIMIT, 'pct0')} of its ${fmt($.LIMIT, 'compact')} limit,
      with ${$.EXCEPTIONS} exception(s) in 250 days.
    guide: market-risk
    glossary:
      VAR_99: { use: "var99" }
      ES_975: { use: "es975" }
      SVAR: { use: "svar" }
      EXCEPTIONS:
        term: "Backtesting exceptions"
        means: "The days in the last 250 on which the day's loss was larger than the 99% VaR. Basel's traffic lights count them to judge the model."
        unit: "days"
        note: "0-4 is the Basel green zone, 5-9 amber and 10 or more red."
      LIMIT:
        term: "VaR limit"
        means: "The VaR the desk is approved to run. VaR above it is a limit breach."
        unit: "USD"
        sign: "A positive amount; compare it with the VaR above."
      SCENARIO_PNL:
        term: "Scenario P&L"
        means: "The portfolio revalued under each of the 500 historical scenario days; the 1st percentile of this distribution is the VaR."
        unit: "USD"
        sign: "Positive is a gain."
      CONTRIBUTIONS.VAR:
        term: "Contribution to VaR"
        means: "The VaR of one book on its own. Books diversify against each other, so the contributions need not add up to the desk's VaR."
        unit: "USD"
        sign: "A loss, written as a positive number."
    panels:
      scenarios: { about: "The markers are -VaR (${fmt($.VAR_99, 'compact')}) and -ES (${fmt($.ES_975, 'compact')}); scenario days to their left lost more than VaR." }
      pnl: { about: "The daily hypothetical P&L the backtest compares with VaR; a day below -${fmt($.VAR_99, 'compact')} is an exception." }
  stress-scenario:
    title: Stress scenario
    about: >-
      ${$.NAME} is a ${lower($.TYPE)} stress scenario of ${lower($.SEVERITY)} severity: ${size($.SHOCKS)} risk factors are shocked
      together and the portfolio is revalued.
    guide: market-risk
    glossary:
      TYPE:
        term: "Scenario type"
        means: "A historical scenario replays the moves of a past episode; a hypothetical one is a designed set of moves that need not have happened."
        values:
          Historical: "Replays the market moves of a past episode."
          Hypothetical: "A designed set of moves chosen by risk managers."
      SEVERITY:
        term: "Severity"
        means: "The rating the risk function gives the scenario, which decides how it is used in limits and reporting."
        values:
          Severe: "An extreme but plausible market event."
          Moderate: "A material move in one or a few markets."
          Mild: "A small or narrow move."
      SHOCKS.FACTOR:
        term: "Risk factor"
        means: "The market variable the scenario moves, such as an equity index, a spread or a curve."
      SHOCKS.SHOCK:
        term: "Shock"
        means: "How far the factor moves. The unit follows the factor: a proportional change for prices and spreads, percentage points for interest rates, points for volatility."
        sign: "Positive raises the factor, negative lowers it."
    panels:
      shocks: { about: "These are the moves applied together; the stress results of ${$.NAME} revalue each desk's books under them." }
  stress-result:
    title: Stress result
    about: >-
      ${$.RESULT_ID}: under "${$.SCENARIO_NAME}" the portfolio changes in value by ${fmt($.PNL, 'compact')} USD against a limit of
      ${fmt($.LIMIT, 'compact')}.
    guide: market-risk
    glossary:
      SCENARIO_NAME:
        term: "Scenario"
        means: "The stress scenario the portfolio was revalued under."
      PNL: { use: "pnl" }
      LIMIT:
        term: "Stress loss limit"
        means: "The largest loss the desk accepts under this scenario. A P&L below the limit is a breach."
        unit: "USD"
        sign: "Negative, like the loss it caps."
      BY_BOOK.PNL:
        term: "P&L of the book"
        means: "The book's share of the scenario P&L."
        unit: "USD"
        sign: "Positive is a gain."
    panels:
      books: { about: "The books add up to the desk's stress P&L of ${fmt($.PNL, 'compact')} USD." }
  frtb-sensitivity:
    title: FRTB sensitivities-based charge
    about: >-
      ${$.RESULT_ID} is the FRTB standardised sensitivities-based method for ${$.BOOK}: delta ${fmt($.DELTA_CHARGE, 'compact')},
      vega ${fmt($.VEGA_CHARGE, 'compact')} and curvature ${fmt($.CURVATURE_CHARGE, 'compact')} add up to ${fmt($.TOTAL, 'compact')} USD.
    guide: market-risk
    glossary:
      BOOK:
        term: "Book"
        means: "The trading book the charge is computed for."
      DELTA_CHARGE:
        term: "Delta risk charge"
        means: "Capital for the first-order sensitivity of the book to its risk factors, after the regulatory risk weights and the correlations within and between buckets."
        unit: "USD"
        sign: "A capital charge, positive."
      VEGA_CHARGE:
        term: "Vega risk charge"
        means: "Capital for the sensitivity of option values to implied volatility, aggregated like delta."
        unit: "USD"
        sign: "A capital charge, positive."
      CURVATURE_CHARGE:
        term: "Curvature risk charge"
        means: "Capital for the loss that delta alone does not capture when an option's value is not linear in the underlying move (the gamma risk)."
        unit: "USD"
        sign: "A capital charge, positive."
      TOTAL:
        term: "Sensitivities-based charge"
        means: "The sum of the delta, vega and curvature charges of the book. The full standardised charge adds the default-risk and residual-risk add-ons."
        unit: "USD"
        sign: "A capital charge, positive."
      SENSITIVITIES.RISK_CLASS:
        term: "Risk class"
        means: "One of the regulatory risk classes: general interest-rate, credit spread (non-securitisation, securitisation), equity, commodity or FX."
      SENSITIVITIES.BUCKET:
        term: "Bucket"
        means: "The regulatory grouping of risk factors inside a risk class, such as a sector, rating or tenor group, with its own risk weight and correlation."
      SENSITIVITIES.MEASURE:
        term: "Measure"
        means: "Which risk the sensitivity measures: delta (to the price or rate), vega (to volatility) or curvature."
        values:
          Delta: "The first-order change for a small move in the risk factor."
          Vega: "The change for a small move in implied volatility."
          Curvature: "The loss beyond the linear estimate under the prescribed up and down shocks."
      SENSITIVITIES.VALUE:
        term: "Sensitivity"
        means: "The change in the value of the book's positions for the prescribed unit move in the factor, before the risk weight is applied."
        unit: "USD"
        sign: "Positive gains when the factor rises, negative loses."
      BY_CLASS.CHARGE:
        term: "Charge by risk class"
        means: "The class's contribution to the book's sensitivities-based charge."
        unit: "USD"
  pnl-explain:
    title: P&L explain
    about: >-
      On ${$.DATE} ${$.BOOK} made ${fmt($.ACTUAL, 'signed0')} USD. Its risk factors explain ${fmt($.EXPLAINED, 'signed0')};
      ${fmt($.UNEXPLAINED, 'signed0')} is unexplained.
    guide: market-risk
    glossary:
      DATE:
        term: "Business date"
        means: "The trading day the P&L belongs to."
      ACTUAL:
        term: "Actual P&L"
        means: "The change in the book's value over the day as booked, including new trades, fees and carry."
        unit: "USD"
        sign: "Positive is a gain."
      EXPLAINED:
        term: "Explained P&L"
        means: "The part of the actual P&L that the risk factors account for: each sensitivity multiplied by that day's move in its factor, plus carry and roll-down."
        unit: "USD"
        sign: "Positive is a gain."
      UNEXPLAINED:
        term: "Unexplained P&L"
        means: "Actual minus explained. A large or persistent residual points to a missing risk factor, a stale parameter or a pricing difference between the front office and risk."
        unit: "USD"
        sign: "Positive means the book did better than its risk factors predict."
      ATTRIBUTION.PNL:
        term: "P&L from the factor"
        means: "The explained P&L assigned to this risk factor."
        unit: "USD"
        sign: "Positive is a gain."
      EXPLAIN_STEPS.PNL:
        term: "Step in the waterfall"
        means: "Each step moves the running total from zero to the actual P&L; the last step is the unexplained rest."
        unit: "USD"
        sign: "Positive adds, negative subtracts."
  trade-valuation:
    title: Trade valuation
    about: >-
      The risk engine values ${$.TRADE_ID} (${$.PRODUCT_TYPE}, booked in ${$.SOURCE_SYSTEM}) at ${fmt($.MTM, 'signed0')} USD on ${$.VALUATION_DATE};
      it moved ${fmt($.PNL_1D, 'signed0')} USD over the last day.
    guide: market-risk
    glossary:
      MTM: { use: "MTM" }
  position:
    title: Position
    about: >-
      ${$.POSITION_ID} holds ${fmt($.QUANTITY, 'compact')} of ${$.INSTRUMENT} in ${$.TT_BOOK}: ${$.DIRECTION}, built from ${$.TRADE_COUNT} trade(s).
      On its own its 1-day 99% VaR is ${fmt($.VAR_99, 'compact')} USD; in its book it contributes ${fmt($.COMPONENT_VAR, 'compact')}.
    guide: market-risk
    glossary:
      DIRECTION:
        term: "Direction"
        means: "LONG when the position's net quantity is above zero (more bought than sold), SHORT when below. Its trades may be of both directions: they net."
      QUANTITY:
        term: "Net quantity"
        means: "The signed sum of the position's trades' quantities (notional for swaps, units for securities): a buy adds, a sell takes away."
      MARKET_VALUE:
        term: "Market value"
        means: "The sum of the trades' present values (their mark-to-market) on the business date."
        unit: "USD"
        sign: "Positive is an asset."
      VAR_99: { use: "var99" }
      ES_975: { use: "es975" }
      COMPONENT_VAR:
        term: "Component VaR"
        means: "The position's share of its book's VaR (Euler allocation): the shares of a book's positions add up to the book's VaR; a hedge has a negative share."
        unit: "USD"
      INSTRUMENT:
        term: "Instrument"
        means: "What the position holds: the product, its currency, its underlying and its maturity. Trades of the same instrument in one book are one position."
      TRADE_QUANTITIES.QUANTITY:
        term: "Trade quantity"
        means: "The trade's signed quantity in the position: a buy positive, a sell negative."
      TRADE_QUANTITIES.VAR_99:
        term: "Trade's own VaR"
        means: "The trade's 1-day 99% VaR as if it were alone."
        unit: "USD"
      TRADE_QUANTITIES.COMPONENT_VAR:
        term: "Trade's component VaR"
        means: "The trade's share of the position's VaR. The shares of a long and a short of one instrument have opposite signs and add up to the position's VaR."
        unit: "USD"
      TT_BOOK: { term: "Book", means: "The book the position is held in: its trades are all booked there." }
      DESK: { term: "Desk", means: "The desk the book belongs to." }
      LEGAL_ENTITY: { term: "Legal entity", means: "The bank's legal entity that holds the book." }
      PRODUCT_TYPE: { term: "Product type", means: "The product of the instrument, as the booking systems name it." }
      CURRENCY: { term: "Currency", means: "The instrument's currency. Every P&L and value is in USD, the reporting currency." }
      COUNTERPARTY: { term: "Counterparty", means: "The counterparty of the position's trades when they all share one; empty otherwise." }
      NOTIONAL: { term: "Gross notional", means: "The sum of the trades' quantities without their signs." }
      OPENED_ON: { term: "Opened", means: "The trade date of the position's first trade." }
      BOOK_VAR: { term: "Book VaR", means: "The 1-day 99% VaR of the whole book the position is held in.", unit: "USD" }
      PCT_OF_BOOK_VAR: { term: "Share of the book's VaR", means: "The component VaR over the book's VaR." }
      PNL: { term: "P&L vector", means: "The position's P&L under each historical scenario day (509 of them): the sum of its trades' vectors.", unit: "USD", sign: "Positive is a gain." }
  pnl-vector:
    title: P&L vector of a trade
    about: >-
      ${$.TRADE_ID}'s P&L under each of the ${size($.PNL)} scenario days of ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}, in USD: the grain every
      VaR is summed from. The trade is ${$.DIRECTION} in position ${$.POSITION_ID} of ${$.TT_BOOK}.
    guide: market-risk
    glossary:
      PNL: { term: "P&L vector", means: "The trade's P&L under each historical scenario day, oldest first: index i is the scenario set's day i.", unit: "USD", sign: "Positive is a gain." }
      POSITION_ID: { term: "Position", means: "The holding the trade builds or reduces: its vector is the sum of its trades'." }
      QUANTITY: { term: "Signed quantity", means: "The trade's quantity: positive for a buy, negative for a sell." }
      PV: { term: "Present value", means: "The trade's value on the business date.", unit: "USD" }
      STATUS: { term: "Batch status", means: "ok, proxied (priced by a proxy) or failed (no vector: counted, never taken as zero)." }
  scenario-set:
    title: Scenario set
    about: >-
      ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}: ${$.SCENARIO_COUNT} historical scenario days from ${$.WINDOW_START} to ${$.WINDOW_END}, each
      day's market move applied to the business date's market, ${$.HORIZON_DAYS}-day horizon.
    guide: market-risk
    glossary:
      SCENARIO_DATES: { term: "Scenario days", means: "The historical days whose moves make the scenarios, oldest first: position i of every P&L vector is day i." }
      WINDOW_START: { term: "Window start", means: "The oldest scenario day." }
      WINDOW_END: { term: "Window end", means: "The newest scenario day: the business day before the business date." }
      REVALUATION: { term: "Revaluation", means: "full (every trade repriced under each scenario) or sensitivities (a Taylor expansion), as the batch did it." }
  risk-hierarchy:
    title: Risk hierarchy node
    about: >-
      ${$.NAME} is a ${$.LEVEL} of the ${$.HIERARCHY} hierarchy, under ${coalesce($.PARENT_ID, 'nothing: the root')}, with
      ${size($.BOOKS)} book(s) beneath it and a VaR limit of ${fmt($.LIMIT_VAR, 'compact')} USD.
    guide: market-risk
    glossary:
      HIERARCHY: { term: "Hierarchy", means: "MGMT: bank, division, desk, book. LEGAL: bank, legal entity, desk, book. A book is in one leaf of each." }
      LEVEL: { term: "Level", means: "bank, division, legal-entity, desk or book." }
      BOOKS: { term: "Books", means: "Every book beneath the node: its positions are the node's." }
      LIMIT_VAR: { term: "VaR limit", means: "The 1-day 99% VaR the node may take.", unit: "USD" }
  var-node:
    title: Official VaR of a node
    about: >-
      ${$.NAME} (${$.HIERARCHY} ${$.LEVEL}) on ${$.BUSINESS_DATE}: VaR ${fmt($.VAR_99, 'compact')} USD, ES ${fmt($.ES_975, 'compact')},
      hypothetical P&L of the day ${fmt($.HYPO_PNL, 'signed0')}.
    guide: market-risk
    glossary:
      VAR_99: { use: "var99" }
      ES_975: { use: "es975" }
      HYPO_PNL: { term: "Hypothetical P&L", means: "The node's P&L of the day with its positions of the day before unchanged: what the backtest compares with VaR.", unit: "USD", sign: "Positive is a gain." }
      EXCEPTION: { term: "Backtest exception", means: "True when the day's loss was larger than the previous day's VaR." }
      LIMIT: { term: "VaR limit", means: "The node's VaR limit on the day.", unit: "USD" }
  portfolio:
    title: Portfolio
    about: >-
      ${$.NAME} (${$.TYPE}, owned by ${$.OWNER}) holds ${$.POSITION_COUNT} positions, ${$.LONG_COUNT} long and ${$.SHORT_COUNT} short.
      Its 1-day 99% VaR is ${fmt($.VAR_99, 'compact')} USD, ${fmt($.LIMIT_USE, 'pct0')} of its ${fmt($.LIMIT_VAR, 'compact')} limit.
    guide: market-risk
    glossary:
      TYPE:
        term: "Portfolio type"
        means: "HIERARCHY: a node of the bank's hierarchy (a desk, a book). RULE: every position whose columns meet a condition. BASKET: positions and trades someone picked."
      POSITION_COUNT: { term: "Positions", means: "The positions in the portfolio on the business date (a basket naming one trade of a position holds that part of it)." }
      LONG_COUNT: { term: "Long positions", means: "Positions whose net quantity is above zero." }
      SHORT_COUNT: { term: "Short positions", means: "Positions whose net quantity is below zero." }
      GROSS_MV: { term: "Gross market value", means: "The sum of the positions' market values without their signs.", unit: "USD" }
      NET_MV: { term: "Net market value", means: "The sum of the positions' market values: longs and shorts offset.", unit: "USD", sign: "Positive is a net asset." }
      VAR_99: { use: "var99" }
      ES_975: { use: "es975" }
      LIMIT_USE: { term: "Limit use", means: "The VaR over the portfolio's VaR limit." }
      LIMIT_VAR: { term: "VaR limit", means: "The VaR the portfolio may take.", unit: "USD" }
      POSITIONS.COMPONENT_VAR:
        term: "Component VaR"
        means: "The position's share of the portfolio's VaR (Euler): the shares add up to the portfolio's VaR; a hedge has a negative share."
        unit: "USD"
      POSITIONS.VAR_99: { term: "VaR on its own", means: "The position's own 1-day 99% VaR, as if it were alone.", unit: "USD" }
      POSITIONS.PCT_OF_VAR: { term: "Share of VaR", means: "The component VaR over the portfolio's VaR." }
      POSITIONS.DIRECTION: { term: "Direction", means: "LONG or SHORT: the sign of the position's net quantity." }
      POSITIONS.QUANTITY: { term: "Net quantity", means: "The signed sum of the position's trades' quantities held in the portfolio." }
      POSITIONS.MARKET_VALUE: { term: "Market value", means: "The position's present value on the business date.", unit: "USD" }
      POSITIONS.POSITION_ID: { term: "Position", means: "The position's id: its book and its instrument (one holding nets every trade of that instrument in the book)." }
      POSITIONS.INSTRUMENT: { term: "Instrument", means: "What the position holds: the product, its currency and its maturity." }
      DEFINITION.NODE: { term: "Hierarchy node", means: "For a HIERARCHY portfolio: the node of the bank's hierarchy whose positions it holds (every book under it)." }
      DEFINITION.RULE: { term: "Rule", means: "For a RULE portfolio: the condition a position's columns must meet to be in it, checked on each business date." }
      DEFINITION.MEMBERS: { term: "Members", means: "For a BASKET portfolio: the positions and trades someone picked (a trade brings that part of its position)." }
      ROLLS_UP_TO.ID: { term: "Rolls up to", means: "The desk or book the portfolio reports under." }
      VALID_FROM: { term: "Valid from", means: "The first business date the portfolio's definition applies to; an earlier date uses the definition then in force." }
      OWNER: { term: "Owner", means: "Who keeps the portfolio's definition." }
      PNL: { term: "P&L vector", means: "The portfolio's P&L under each historical scenario day: the sum of its members' vectors, each trade counted once.", unit: "USD", sign: "Positive is a gain." }
