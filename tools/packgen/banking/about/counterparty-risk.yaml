about: 1
vocabulary:
  utilisation: { term: "Utilisation", means: "The share of the limit that is used: used divided by limit. Above 100% is a breach.", unit: "% of limit" }
  ce: { term: "Current exposure", means: "What the counterparty would owe the bank if it defaulted today: the netting set's value less the collateral held, never below zero.", unit: "USD" }
  ee: { term: "Expected exposure", means: "The average over the simulated paths of the exposure at a date, after netting and collateral (what the bank would lose).", unit: "USD" }
  epe: { term: "Expected positive exposure", means: "The time-weighted average of the expected exposure over the first year (or to the last maturity when sooner). CVA and the internal-model capital are built on it.", unit: "USD" }
  eepe: { term: "Effective expected positive exposure", means: "The average over the first year of the effective expected exposure, which may not fall from one date to the next: the internal-model exposure (Basel CRE53).", unit: "USD" }
  pfe95: { term: "Potential future exposure, 95%", means: "The exposure exceeded on 5 of 100 simulated paths at a date.", unit: "USD" }
  pfe99: { term: "Potential future exposure, 99%", means: "The exposure exceeded on 1 of 100 simulated paths at a date.", unit: "USD" }
  peakPfe: { term: "Peak potential future exposure", means: "The highest potential future exposure over the primary dates; credit limits are set against it. A counterparty's is read from its netting sets' exposures summed path by path, never a sum of their peaks.", unit: "USD" }
kinds:
  agreement:
    title: Master agreement
    about: >-
      ${$.AGREEMENT_ID} is the ${$.TYPE} the bank signed with ${$.COUNTERPARTY_NAME} on ${$.SIGNED}, under ${$.GOVERNING_LAW} law;
      close-out netting is ${$.CLOSE_OUT_NETTING}, so the trades under it net to one amount if either side defaults.
    guide: counterparty-risk
    glossary:
      TYPE: { term: "Agreement type", means: "The master agreement form, for example the ISDA 2002 Master Agreement." }
      COUNTERPARTY_NAME: { term: "Counterparty", means: "The legal entity that signed the agreement with the bank." }
      GOVERNING_LAW: { term: "Governing law", means: "The law the agreement is read under, which decides how close-out netting is enforced." }
      SIGNED: { term: "Signed", means: "The date the agreement was signed." }
      CLOSE_OUT_NETTING: { term: "Close-out netting", means: "Whether a legal opinion confirms that on default the trades net to one amount; only then may exposure be netted." }
      ELECTIONS.AUTOMATIC_EARLY_TERMINATION: { term: "Automatic early termination", means: "Whether the trades end by themselves on certain defaults, without a notice." }
      ELECTIONS.CROSS_DEFAULT: { term: "Cross default", means: "The threshold above which a default on other debt is a default under this agreement." }
      ELECTIONS.SET_OFF: { term: "Set-off", means: "Whether amounts owed under other contracts may be set off against the close-out amount." }
      ELECTIONS.TERMINATION_CURRENCY: { term: "Termination currency", means: "The currency the close-out amount is paid in." }
      ELECTIONS.ADDITIONAL_TERMINATION_EVENTS: { term: "Additional termination events", means: "Further events, such as a downgrade, that let a party end the trades." }
      ELECTIONS.PROTOCOLS: { term: "Protocols", means: "The ISDA protocols both parties adhered to, which amend the agreement." }
  csa:
    title: Credit support annex
    about: >-
      ${$.CSA_ID} secures ${$.AGREEMENT} with ${$.MARGIN_TYPE} margin, called ${$.FREQUENCY}: the bank's threshold is
      ${fmt($.THRESHOLD_US, 'compact')} and the counterparty's ${fmt($.THRESHOLD_THEM, 'compact')}, with a minimum transfer of ${fmt($.MTA, 'compact')}.
    guide: counterparty-risk
    glossary:
      MARGIN_TYPE: { term: "Margin type", means: "Variation margin (VM) covers today's value; initial margin (IM) covers how it may move before a default is closed out." }
      THRESHOLD_US: { term: "Threshold (bank)", means: "The exposure the counterparty may have to the bank before the bank must post collateral.", unit: "USD" }
      THRESHOLD_THEM: { term: "Threshold (counterparty)", means: "The exposure the bank accepts before the counterparty must post collateral.", unit: "USD" }
      MTA: { term: "Minimum transfer amount", means: "The smallest collateral movement either side may call.", unit: "USD" }
      INDEPENDENT_AMOUNT: { term: "Independent amount", means: "Collateral posted up front, whatever the exposure.", unit: "USD" }
      FREQUENCY: { term: "Call frequency", means: "How often margin is called." }
      MPOR: { term: "Margin period of risk", means: "The time assumed between the last margin received and closing out a defaulted counterparty." }
      ELIGIBLE.ASSET: { term: "Eligible collateral", means: "An asset the counterparty may deliver as collateral." }
      ELIGIBLE.HAIRCUT: { term: "Haircut", means: "The share taken off the asset's value when it is counted as collateral." }
  netting-set:
    title: Netting set
    about: >-
      ${$.NETTING_SET_ID} groups ${$.TRADE_COUNT} trades that net on close-out under one agreement: they are worth
      ${fmt($.NET_MTM, 'signed0')} USD together, secured by ${fmt($.COLLATERAL, 'signed0')} of collateral. Its exposure profile is the
      exposure engine's, computed from the simulated paths as the page opens: ${coalesce($.EXPOSURE_ENGINE.NOTE, 'not computed here')}.
    guide: counterparty-risk
    glossary:
      TRADE_COUNT: { term: "Trades", means: "The number of trades that are netted together under the agreement." }
      NET_MTM:
        term: "Net mark to market"
        means: "The sum of the members' mark to market, positive and negative together. Netting lets a loss on one trade cancel a gain on another if the counterparty defaults."
        unit: "USD"
        sign: "Positive is owed to the bank."
      COLLATERAL:
        term: "Collateral"
        means: "The net collateral against the netting set: what is held less what has been posted."
        unit: "USD"
        sign: "Positive is held by the bank, negative is posted to the counterparty."
      EXPOSURE_ENGINE.EPE: { use: "epe" }
      EXPOSURE_ENGINE.EEPE: { use: "eepe" }
      EXPOSURE_ENGINE.PEAK_PFE: { use: "peakPfe" }
      EXPOSURE_ENGINE.CE: { use: "ce" }
      EXPOSURE_ENGINE.STATUS:
        term: "Exposure status"
        means: "Whether the exposure engine computed the figures: ok, no-paths (the day's simulation run does not cover this netting set), or unavailable with the reason."
      EXPOSURE_ENGINE.PROFILE.EE: { use: "ee" }
      EXPOSURE_ENGINE.PROFILE.PFE: { use: "pfe95" }
      EXPOSURE_ENGINE.PROFILE.PFE_99: { use: "pfe99" }
      LIMIT: { term: "Credit limit", means: "The limit on the counterparty's peak potential future exposure approved for this netting set.", unit: "USD" }
      UTILISATION: { use: "utilisation" }
      CVA:
        term: "Credit valuation adjustment"
        means: "The reduction in the value of the trades for the risk that the counterparty defaults before they mature."
        unit: "USD"
        sign: "Negative is a cost."
      TRADES.TRADE_ID: { term: "Trade", means: "The member trade." }
      TRADES.PRODUCT: { term: "Product", means: "The kind of instrument the trade is." }
      TRADES.NOTIONAL: { term: "Notional", means: "The reference amount of the trade, in the trade's own currency.", unit: "trade currency" }
      TRADES.MATURITY: { term: "Maturity", means: "The date the trade ends." }
      TRADES.MTM: { term: "Mark to market", means: "The trade's current value, from the bank's side.", unit: "USD", sign: "Positive is owed to the bank." }
    panels:
      exposure: { about: "The curves show how the exposure of the ${$.TRADE_COUNT} trades may develop, computed from the simulated paths; the PFE 95 peak (${fmt($.EXPOSURE_ENGINE.PEAK_PFE, 'compact')} USD) is the figure compared with the limit." }
  credit-limit:
    title: Counterparty credit limit
    about: >-
      ${$.COUNTERPARTY_NAME} may be exposed up to ${fmt($.LIMIT, 'compact')} USD on the measure "${$.MEASURE}": it uses
      ${fmt($.USED, 'compact')}, which is ${fmt($.UTILISATION, 'pct0')}. Status: ${$.STATUS}.
    guide: counterparty-risk
    glossary:
      COUNTERPARTY_NAME: { term: "Counterparty", means: "The legal entity the limit applies to." }
      MEASURE: { term: "Limit measure", means: "The exposure measure the limit is set on, for example the peak of the 95th-percentile potential future exposure." }
      LIMIT: { term: "Limit", means: "The most exposure the bank accepts to the counterparty on this measure.", unit: "USD" }
      USED: { term: "Used", means: "The exposure measured today against the limit.", unit: "USD" }
      UTILISATION: { use: "utilisation" }
      BUCKETS.BUCKET: { term: "Tenor bucket", means: "The range of years to maturity the limit is split into; exposure on trades that mature within it is counted against it." }
      BUCKETS.LIMIT: { term: "Bucket limit", means: "The limit that applies to this tenor bucket.", unit: "USD" }
      BUCKETS.USED: { term: "Bucket exposure", means: "The exposure in this tenor bucket.", unit: "USD" }
      BUCKETS.UTILISATION: { use: "utilisation" }
  exposure-result:
    title: Exposure profile of a scope
    about: >-
      ${$.LABEL} on ${$.BUSINESS_DATE}: expected positive exposure ${fmt($.EPE, 'compact')} USD, effective ${fmt($.EEPE, 'compact')},
      peak ${fmt($.CONFIDENCE, 'pct0')} potential future exposure ${fmt($.PEAK_PFE, 'compact')} on ${$.PEAK_PFE_DATE}, computed by the
      exposure engine from the ${$.PATHS} paths of run ${$.RUN_ID} when asked, never stored.
    guide: counterparty-risk
    glossary:
      SCOPE: { term: "Scope", means: "What the exposure is computed for, in the scope grammar: a netting set (NSET:), a counterparty (CPTY:), a group (GROUP:), a legal entity (LE:), a trade alone (TRD:), or a combination." }
      STATUS: { term: "Status", means: "ok, or no-paths when the day's simulation run covers none of the scope's netting sets." }
      CE: { use: "ce" }
      EPE: { use: "epe" }
      EEPE: { use: "eepe" }
      PEAK_EE: { term: "Peak expected exposure", means: "The highest expected exposure over the primary dates.", unit: "USD" }
      PEAK_PFE: { use: "peakPfe" }
      PEAK_PFE_DATE: { term: "Peak PFE date", means: "The primary date where the potential future exposure is highest." }
      EAD_IMM: { term: "Exposure at default (internal model, informational)", means: "1.4 times the effective EPE: the internal-model exposure, meaningful only with the regulator's approval of the bank's model.", unit: "USD" }
      CONFIDENCE: { term: "Confidence", means: "The percentile of the potential future exposure fields, 95% unless asked otherwise." }
      PATHS: { term: "Simulation paths", means: "The number of Monte Carlo scenarios of the market the run simulated; every trade is valued on the same paths, so values add path by path." }
      RUN_ID: { term: "Simulation run", means: "The upstream exposure simulation the figures are computed from." }
      MPOR_DAYS: { term: "Margin period of risk", means: "The days between the last margin call that is met and the close-out of a defaulted counterparty: the collateral on each path lags its value by this long.", unit: "business days" }
      COLLATERAL_MODEL: { term: "Collateral model", means: "lagged (the CSA's call at the value a margin period of risk earlier), current (today's collateral held throughout) or none." }
      PROFILE.TENOR: { term: "Future date", means: "A primary date of the run's grid, labelled by the nearest standard tenor." }
      PROFILE.EE: { use: "ee" }
      PROFILE.ENE: { term: "Expected negative exposure", means: "The average over the paths of what the bank would owe the counterparty at this date, after collateral.", unit: "USD", sign: "Negative, an amount owed." }
      PROFILE.EEE: { term: "Effective expected exposure", means: "The expected exposure never allowed to fall from one date to the next (the Basel rule), from today's exposure on.", unit: "USD" }
      PROFILE.PFE: { use: "pfe95" }
      PROFILE.PFE_99: { use: "pfe99" }
      PROFILE.EE_UNCOLL: { term: "Expected exposure without collateral", means: "The expected exposure before any collateral: what the CSA saves is the difference.", unit: "USD" }
      BY_NETTING_SET.PFE_CONTRIBUTION: { term: "PFE contribution", means: "The netting set's share of the scope's peak PFE: its mean exposure on the paths around the quantile at the peak date, scaled so the shares add up to the peak.", unit: "USD" }
    panels:
      profile: { about: "The expected exposure and the 95% and 99% potential future exposure at each primary date, computed from the simulated paths after netting and collateral." }
  exposure-whatif:
    title: Exposure what-if before dealing
    about: >-
      ${$.CANONICAL} on ${$.BUSINESS_DATE}: peak ${fmt($.CONFIDENCE, 'pct0')} potential future exposure ${fmt($.BEFORE_PEAK_PFE, 'compact')}
      USD before and ${fmt($.AFTER_PEAK_PFE, 'compact')} after the ${$.ITEMS} candidate trade(s) of your sandbox, each added path by path
      to its netting set and collateralised again by the Python exposure engine (exact, run ${$.RUN_ID}).
    guide: counterparty-risk
    glossary:
      BEFORE_PEAK_PFE: { term: "Peak PFE before", means: "The scope's peak potential future exposure as booked.", unit: "USD" }
      AFTER_PEAK_PFE: { term: "Peak PFE after", means: "The scope's peak potential future exposure with the candidate trades added to their netting sets.", unit: "USD" }
      CHANGE_PEAK_PFE: { term: "Incremental peak PFE", means: "Peak PFE after minus before: what the candidates add to the exposure the credit limit is set on.", unit: "USD" }
      BEFORE_EPE: { term: "EPE before", means: "The scope's expected positive exposure over the first year as booked.", unit: "USD" }
      AFTER_EPE: { term: "EPE after", means: "The expected positive exposure with the candidates.", unit: "USD" }
      CHANGE_EPE: { term: "Incremental EPE", means: "EPE after minus before.", unit: "USD" }
      ITEMS: { term: "Candidate trades", means: "The trades of your private sandbox, each with its values on every path of the day's run at every grid date." }
      METHOD: { term: "Method", means: "paths: the exact method, the candidates' own simulated values netted and collateralised with their netting set." }
      COLLATERAL_MODEL: { term: "Collateral model", means: "lagged (the CSA's call at the value a margin period of risk earlier), current (today's collateral held throughout) or none." }
    panels:
      profile: { about: "Expected exposure and potential future exposure at each primary date, before and after the candidates." }
  exposure-official-cpty:
    title: Exposure official result
    about: >-
      ${$.NODE_NAME} (${$.LEVEL}) on ${$.BUSINESS_DATE}: the official end-of-day peak expected exposure of ${fmt($.PEAK_EE, 'compact')} USD
      and peak 95% potential future exposure of ${fmt($.PEAK_PFE_95, 'compact')} USD, result version ${$.RESULT_VERSION}, as the server
      captured and published it (read only; EXP ${$.NODE_ID} computes it again now).
    guide: counterparty-risk
    glossary:
      HIERARCHY: { term: "Row type", means: "NSET for a netting set, CPTY for a counterparty (all its netting sets netted path by path), GROUP for a connected group." }
      NODE_ID: { term: "Scope", means: "The scope the figures are for, in the scope grammar: NSET:<set>, CPTY:<counterparty> or GROUP:<group>." }
      RESULT_VERSION: { term: "Result version", means: "1, then 2, 3 ... when the date is restated; the latest version is the date's figure." }
      CE: { use: "ce" }
      EPE: { use: "epe" }
      EEPE: { use: "eepe" }
      PEAK_EE: { term: "Peak expected exposure", means: "The highest expected exposure over the primary dates.", unit: "USD" }
      PEAK_PFE_95: { term: "Peak PFE (95%)", means: "The highest 95% potential future exposure over the primary dates. Not additive: a counterparty's is its own row, never a sum of its netting sets'.", unit: "USD" }
      PEAK_PFE_99: { term: "Peak PFE (99%)", means: "The highest 99% potential future exposure over the primary dates. Not additive.", unit: "USD" }
      EAD_IMM: { term: "Exposure at default (internal model, informational)", means: "1.4 times the effective EPE.", unit: "USD" }
  simulation-run:
    title: Exposure simulation run
    about: >-
      ${$.RUN_ID} is the upstream exposure simulation of ${$.BUSINESS_DATE}: ${$.PATHS} market paths over a grid of future dates
      (${$.CALIBRATION} calibration); every trade was valued on every path and date, and the exposure engine reads them.
    guide: counterparty-risk
    glossary:
      PATHS: { term: "Paths", means: "The number of simulated market scenarios; every trade's values are on the same paths." }
      CALIBRATION: { term: "Calibration", means: "REAL_WORLD (for PFE and limits) or RISK_NEUTRAL (for CVA and pricing) or STRESSED." }
      GRID_DATES: { term: "Grid dates", means: "The future dates the trades were valued at: the primary dates where exposure is reported and the look-back dates a margin period of risk before them." }
      LOOKBACK_DAYS: { term: "Look-back", means: "How many business days before each primary date its look-back date is: the margin period of risk the run assumes.", unit: "business days" }
      PRECISION: { term: "Precision", means: "float32 or float64: how the path values are stored." }
  exposure-path:
    title: Exposure path
    about: >-
      ${$.TRADE_ID}'s value on every one of the run's paths at ${$.GRID_DATE} (grid index ${$.GRID_INDEX}), in netting set
      ${$.NETTING_SET}: the input the exposure engine nets, collateralises and counts.
    guide: counterparty-risk
    glossary:
      MTM: { term: "Path values", means: "The trade's mark to market on each simulated path at the grid date, from the bank's side.", unit: "USD", sign: "Positive is owed to the bank." }
      GRID_INDEX: { term: "Grid index", means: "The position of the date in the run's grid." }
      GRID_DATE: { term: "Grid date", means: "The future date the values are for." }
      NETTING_SET: { term: "Netting set", means: "The netting set the trade belongs to (its membership wins when they differ)." }
      STATUS: { term: "Status", means: "ok, proxied (an approximate model) or failed (no values)." }
  cva:
    title: Valuation adjustments
    about: >-
      The valuation adjustments of ${$.NETTING_SET} are CVA ${fmt($.CVA, 'signed0')}, DVA ${fmt($.DVA, 'signed0')}, FVA ${fmt($.FVA, 'signed0')}
      and KVA ${fmt($.KVA, 'signed0')} USD; a one basis point rise in the counterparty's credit spread moves the CVA by
      ${fmt($.CS01, 'signed0')}.
    guide: counterparty-risk
    glossary:
      CVA: { term: "Credit valuation adjustment", means: "The expected loss from the counterparty defaulting, valued at market spreads and taken off the value of the trades.", unit: "USD", sign: "Negative is a cost." }
      DVA: { term: "Debit valuation adjustment", means: "The mirror image of CVA: the gain from the bank's own possible default, which reduces what it would owe.", unit: "USD", sign: "Positive is a gain." }
      FVA: { term: "Funding valuation adjustment", means: "The cost, or benefit, of funding the collateral and the hedges of uncollateralised trades.", unit: "USD", sign: "Negative is a cost." }
      KVA: { term: "Capital valuation adjustment", means: "The cost of holding regulatory capital against the trades over their life.", unit: "USD", sign: "Negative is a cost." }
      CS01: { term: "Counterparty CS01", means: "The change in the CVA for a one basis point rise in the counterparty's credit spread.", unit: "USD per bp" }
      SENSITIVITIES.FACTOR: { term: "Market factor", means: "The market input that is bumped to see how the adjustment changes." }
      SENSITIVITIES.BUMP: { term: "Bump", means: "The size of the move applied to the factor." }
      SENSITIVITIES.DELTA: { term: "Change in CVA", means: "The change in the adjustment for the bump.", unit: "USD" }
  sa-ccr:
    title: SA-CCR exposure
    about: >-
      The regulatory exposure at default of ${$.NETTING_SET} is ${fmt($.EAD, 'compact')} USD: replacement cost ${fmt($.REPLACEMENT_COST, 'compact')}
      plus an add-on of ${fmt($.ADD_ON, 'compact')} scaled by a multiplier of ${fmt($.MULTIPLIER, 'price2')}; its risk-weighted assets are
      ${fmt($.RWA, 'compact')}.
    guide: counterparty-risk
    glossary:
      REPLACEMENT_COST:
        term: "Replacement cost"
        means: "The loss if the counterparty defaulted today and the trades were replaced at current market value, less collateral; never below zero."
        unit: "USD"
      ADD_ON:
        term: "Aggregate add-on"
        means: "The potential increase in exposure over the next year, built from the add-ons of each asset class with supervisory factors and correlations."
        unit: "USD"
      MULTIPLIER:
        term: "PFE multiplier"
        means: "A factor between 5% and 1 that reduces the add-on when the netting set is over-collateralised or its value is negative."
        unit: "factor"
      EAD:
        term: "Exposure at default"
        means: "The SA-CCR exposure: 1.4 times the replacement cost plus the potential future exposure, where the potential future exposure is the multiplier times the add-on."
        unit: "USD"
      RWA: { term: "Risk-weighted assets", means: "The exposure at default multiplied by the risk weight of the counterparty. Capital is a percentage of it.", unit: "USD" }
      HEDGING_SETS.ASSET_CLASS: { term: "Asset class", means: "The regulatory asset class: interest rate, FX, credit, equity or commodity." }
      HEDGING_SETS.HEDGING_SET: { term: "Hedging set", means: "The group of trades within an asset class that can offset one another, for example by currency for interest rates." }
      HEDGING_SETS.EFFECTIVE_NOTIONAL: { term: "Effective notional", means: "The hedging set's notional after supervisory delta and maturity adjustments and netting inside the set.", unit: "USD", sign: "Positive is net long, negative net short." }
      HEDGING_SETS.SF: { term: "Supervisory factor", means: "The regulatory percentage applied to the effective notional to get the add-on.", unit: "% of effective notional" }
  collateral-balance:
    title: Collateral balance
    about: >-
      Under ${coalesce($.CSA, 'the CSA')} the bank holds ${fmt($.HELD, 'compact')} and has posted ${fmt($.POSTED, 'compact')} USD of collateral
      for netting set ${$.NETTING_SET}, a net ${fmt($.NET, 'signed0')} as of ${$.AS_OF}.
    guide: counterparty-risk
    glossary:
      HELD: { term: "Collateral held", means: "The collateral the bank has received from the counterparty.", unit: "USD" }
      POSTED: { term: "Collateral posted", means: "The collateral the bank has delivered to the counterparty.", unit: "USD" }
      NET: { term: "Net collateral", means: "Held minus posted.", unit: "USD", sign: "Positive means the bank holds more than it has posted." }
      POSITIONS.ASSET: { term: "Collateral asset", means: "The cash or security that is held or posted." }
      POSITIONS.DIRECTION:
        term: "Direction"
        means: "Whether the bank posted the asset or received it."
        values:
          Posted: "The bank delivered it to the counterparty."
          Received: "The counterparty delivered it to the bank."
      POSITIONS.MARKET_VALUE: { term: "Market value", means: "The current market value of the asset before the haircut.", unit: "USD" }
      POSITIONS.HAIRCUT: { term: "Haircut", means: "The percentage taken off the market value to allow for the price moving before the asset can be sold. The CSA sets it by asset type and maturity.", unit: "% of market value" }
      POSITIONS.VALUE: { term: "Collateral value", means: "The market value after the haircut, the amount that counts as collateral.", unit: "USD" }
  margin-call:
    title: Margin call
    about: >-
      ${$.CALL_ID} is a ${lower($.MARGIN_TYPE)} margin call of ${fmt($.AMOUNT, 'amount0')} ${$.CURRENCY} dated ${$.CALL_DATE}
      (${lower($.DIRECTION)}); its status is ${$.STATUS}.
    guide: counterparty-risk
    glossary:
      CALL_DATE: { term: "Call date", means: "The day the margin call was issued." }
      MARGIN_TYPE:
        term: "Margin type"
        means: "Variation margin settles the change in the value of the trades each day; initial margin is held against the risk of the value moving before a defaulted counterparty can be replaced."
        values:
          Variation: "Covers the daily change in the market value of the trades."
          Initial: "A buffer against future price moves, calculated with a model such as SIMM."
      DIRECTION:
        term: "Direction"
        means: "Who calls on whom."
        values:
          We call: "The bank asks the counterparty for collateral."
          They call: "The counterparty asks the bank for collateral."
      DISPUTE_AMOUNT: { term: "Disputed amount", means: "The part of the call the other party does not accept. Undisputed margin is still due on time; the difference goes to dispute resolution.", unit: "call currency" }
      EVENTS.AT: { term: "Time", means: "When the step happened." }
      EVENTS.EVENT: { term: "Step", means: "The stage of the call, from issue to agreement and settlement." }
      EVENTS.BY: { term: "By", means: "The party or system that took the step." }
  simm:
    title: Initial margin (SIMM)
    about: >-
      ${$.CALC_ID} is the ${$.VERSION} initial margin for the netting set: ${fmt($.TOTAL, 'compact')} USD in total, of which the bank has
      posted ${fmt($.POSTED, 'compact')} and received ${fmt($.RECEIVED, 'compact')}.
    guide: counterparty-risk
    glossary:
      POSTED: { term: "Initial margin posted", means: "The initial margin the bank has delivered to the counterparty or a custodian.", unit: "USD" }
      RECEIVED: { term: "Initial margin received", means: "The initial margin the counterparty has delivered to the bank.", unit: "USD" }
      TOTAL: { term: "Total initial margin", means: "The margin the ISDA SIMM model requires, built from the sensitivities of the trades by risk class and product class.", unit: "USD" }
      VERSION: { term: "SIMM version", means: "The version of the ISDA Standard Initial Margin Model the calculation used; the model is recalibrated each year." }
      RISK_CLASSES.IM: { term: "Margin of the risk class", means: "The initial margin of one SIMM risk class: interest rate, credit qualifying, credit non-qualifying, equity, commodity or FX.", unit: "USD" }
