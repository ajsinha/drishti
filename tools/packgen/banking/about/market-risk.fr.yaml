about: 1
vocabulary:
  var99:
    term: "Valeur à risque, 99 %, 1 jour"
    means: "La perte que le portefeuille ne devrait pas dépasser 99 jours de bourse sur 100, lue au 1er centile du résultat des scénarios réévalués (simulation historique)."
    unit: "USD"
    sign: "Une perte, écrite comme un nombre positif."
  es975:
    term: "Perte attendue (expected shortfall), 97,5 %"
    means: "La perte moyenne des 2,5 % de jours de scénario les plus défavorables. Elle regarde la queue de distribution que la VaR ignore et sert de mesure de capital dans l'approche des modèles internes de FRTB."
    unit: "USD"
    sign: "Une perte, écrite comme un nombre positif."
kinds:
  var:
    title: "Résultat de valeur à risque"
    about: >-
      ${$.resultId} est une VaR historique à 1 jour et 99 % pour ${coalesce($.deskName, $.desk, 'ce portefeuille')} : ${fmt($.var99, 'compact')} USD,
      soit ${fmt($.var99 / $.limit, 'pct0')} de sa limite de ${fmt($.limit, 'compact')}, avec ${$.exceptions} exception(s) sur 250 jours.
    glossary:
      exceptions:
        term: "Exceptions de backtesting"
        means: "Les jours, parmi les 250 derniers, où la perte du jour a dépassé la VaR à 99 %. Les feux tricolores de Bâle les comptent pour juger le modèle."
        unit: "jours"
        note: "0 à 4 : zone verte ; 5 à 9 : orange ; 10 ou plus : rouge."
      limit:
        term: "Limite de VaR"
        means: "La VaR que la table est autorisée à prendre. Une VaR supérieure est un dépassement de limite."
        unit: "USD"
    panels:
      scenarios: { about: "Les repères sont -VaR (${fmt($.var99, 'compact')}) et -ES (${fmt($.es975, 'compact')}) ; les jours de scénario à leur gauche ont perdu plus que la VaR." }
