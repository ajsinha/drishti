# Hand-kept sections of the counterparty-risk pack's manifest: tools/packgen/banking/make_packs.py appends them to
# config/packs/counterparty-risk/pack.yaml as written. Edit them here, not there.

# History queries (TRD 1000015 30, docs/architecture/HISTORY_QUERIES.md section 6): how this pack's kinds look over time.
# Only the shape: any dated kind has a history without an entry here.
history:
  netting-set:
    columns: [NET_MTM, COLLATERAL, LIMIT, UTILISATION, CVA, TRADE_COUNT]
  credit-limit:
    columns: [LIMIT, USED, UTILISATION]
  cva:
    columns: [CVA, DVA, FVA, KVA, CS01]
