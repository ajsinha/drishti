# Hand-kept sections of the trading pack's manifest: tools/packgen/banking/make_packs.py appends them to
# config/packs/trading/pack.yaml as written. Edit them here, not there.

# Read by drishti.py lake build (ignored by the server): each trade's key, and values inside its legs written as plain fields and
# columns at load, so searches, totals and BI need no document (docs/admin/CLUSTER_DEPLOYMENT.md › Scale strategy: millions of trades, fast, in a bounded heap, phase 3)
ingest:
  trade:
    key: TRADE_ID
    flatten:
      NOTIONAL: LEGS[0].NOTIONAL
      INDEX_NAME: LEGS[0].INDEX.NAME
# History queries (TRD 1000015 30, docs/architecture/DATA_ARCHITECTURE.md › History queries: an entity over time, section 6): how this pack's kinds look over time.
# Only the shape: any dated kind has a history without an entry here.
history:
  trade:
    # what a trader reads first: the status and version, then the economics, then where it sits
    columns: [TRADE_STATUS, TRADE_ACTION, TRADE_VERSION, QUANTITY, PRICE, BUY_SELL_CODE, CURRENCY, PORTFOLIO, COUNTERPARTY,
              MATURITY_DATE, PRODUCT_TYPE, SOURCE_SYSTEM, TRADE_DATE]
    exclude: [_meta]
    ignore-changes: [SOURCE_UPDATE_TIME, INPUT_DATE]
    parts: [LEGS, EVENTS]
    default-days: 30
  # derived kinds: their pages are rebuilt from every member trade per day (DATA_ARCHITECTURE.md open question 2)
  counterparty-trades: {enabled: false}
  portfolio-trades: {enabled: false}
  legal-entity-trades: {enabled: false}
  index-trades: {enabled: false}
