# The product documents copied into docs/products/ so Help shows them offline (tools/docs/product_docs.py). `tag` is the product tag this
# Drishti release pins (the release's row in the platform index repository's platform.yaml; its version is the pom's); `files` are the
# repository paths copied. A Drishti document that links one of these files at that tag opens the local Help page.
products:
  rachana:
    repo: drishti-rachana
    tag: v1.1.1
    files: [docs/WRITING_SUTRAS.md, docs/PANEL_KINDS.md, docs/IN_YOUR_APP.md, docs/TUTORIAL.md, docs/ROADMAP.md, spec/1/SPEC.md]
  elements:
    repo: drishti-elements
    tag: v3.3.2-ide3
    files: [docs/USING.md, docs/VIEWS.md, docs/EVENTS.md, docs/CONTRACTS.md, docs/API.md, docs/DESIGN.md]
