# The data section of each measure or feature guide: read by tools/docs/guide_data.py, which writes it between the guide's
# <!-- guide-data:begin <id> --> and <!-- guide-data:end --> markers (docs/guides/TOOLS.md). The section is a short table: each kind the
# feature reads, whether it is needed, what for, and a link to its data contract (the one home of its fields and its example record).
#
# Per guide:   id, file, number (the section's number), contract_page (the measure's own contract, when it has one), note (after the table).
# Per dataset: kind; contract (the contract's kind when it differs, null when the kind has none); label (instead of `kind`); required;
#              for (the table's one line); contract_note (said instead of the link when there is no contract).

guides:
- id: var
  file: docs/guides/VAR_GUIDE.md
  number: 36
  contract_page: docs/contracts/VAR.md
  note: |
    **The minimum for a VaR number:** `scenario-set`, a `risk-hierarchy` (or hierarchy columns on the vectors), and for every trade either a
    `scenario-pv` row or a `pnl-vector` row. Everything else adds a feature: currencies, portfolios, limits, backtesting, the trade pages.
  datasets:
  - kind: scenario-set
    required: '**yes**'
    for: the ordered scenario days every vector lines up with
  - kind: scenario-pv
    required: '**one of the two**, per trade'
    for: each trade's base PV and its PV under each scenario; Drishti computes the P&L
  - kind: pnl-vector
    required: '**one of the two**, per trade'
    for: each trade's scenario P&L, computed by the source
  - kind: fx-scenario
    required: when scenario PVs are in other currencies (else derived from `fx-spot`)
    for: each currency's rate on each scenario day, to convert scenario PVs to USD
  - kind: fx-spot
    required: for other currencies
    for: 'FX history: today''s rates, reporting currencies, scenario FX when not supplied'
  - kind: risk-hierarchy
    required: '**yes** (or built from the trades'' columns)'
    for: the trees (MGMT, LEGAL, limit letters…) that make the scopes
  - kind: portfolio
    required: optional
    for: 'stored portfolios: hierarchy, rule and basket portfolios'
  - kind: var-limit
    required: optional
    for: a node's VaR limit (the Limit column, limit use)
  - kind: desk-pnl
    required: for backtesting
    for: actual and hypothetical P&L of each desk, per day
  - kind: pnl-history
    required: for stressed VaR and long-history views
    for: a node's P&L over many years
  - kind: trade-valuation
    required: optional (the position page, What-if)
    for: each trade's MTM today and its attributes
  - kind: trade_murex
    contract: trade
    label: The trades
    required: optional for the number, used by the screens
    for: the trades themselves, linked from every position
- id: exposure
  file: docs/guides/EXPOSURE_GUIDE.md
  number: 29
  contract_page: docs/contracts/EXP.md
  note: |
    **The minimum for an exposure profile:** a `simulation-run`, its `exposure-path` rows and the `netting-set` rows that group the trades.
    The kinds are the engine's `drishti.ccr.exposure.kinds.*` settings (`config/engines/exposure.yaml`); a bank names its own there.
  datasets:
  - kind: simulation-run
    required: '**yes**'
    for: the run, its time grid, the number of paths and the seed
  - kind: exposure-path
    required: '**yes**'
    for: one row per trade and grid date, a vector of MtM over the paths
  - kind: netting-set
    required: '**yes**'
    for: which trades net together, the counterparty and the CSA
  - kind: csa
    required: for margined netting sets
    for: thresholds, minimum transfer, independent amount, margin period of risk
  - kind: collateral-balance
    required: optional (the `current` collateral model)
    for: the collateral held and posted today per account
  - kind: counterparty
    required: for `CPTY:` scopes
    for: names, ratings and groups of the counterparties
  - kind: counterparty-group
    required: for `GROUP:` scopes
    for: the connected groups of counterparties
  - kind: risk-hierarchy
    required: for hierarchy scopes (`LE:` and the trees)
    for: the legal entity and management trees, shared with VaR
- id: frtb-sa
  file: docs/guides/FRTB_SA_GUIDE.md
  number: 13
  contract_page: docs/contracts/FRTB.md
  datasets:
  - kind: position-sensitivity
    required: '**yes**'
    for: each position's sensitivities, a sparse list per record
  - kind: risk-factor
    required: '**yes**'
    for: each factor's class, type, buckets, tenor and the source systems' names
  - kind: default-risk
    required: for the default risk charge
    for: obligor, seniority, credit quality and notional per position
  - kind: residual-risk
    required: optional
    for: the residual risk add-on's class and notional per trade
- id: simm
  file: docs/guides/SIMM_GUIDE.md
  number: 13
  contract_page: docs/contracts/SIMM.md
  datasets:
  - kind: parameters
    contract: null
    label: The parameter file
    required: '**yes** (the bank''s licensed file)'
    for: the risk weights, correlations and thresholds of the SIMM version
    contract_note: not a dataset kind; a YAML file the engine reads (`docs/architecture/capital-parameters/simm.yaml`).
  - kind: position-sensitivity
    required: '**yes**'
    for: the delta and vega elements of each trade or position
  - kind: risk-factor
    required: '**yes**'
    for: each factor's SIMM risk class, bucket and labels
  - kind: netting-set
    required: '**yes**'
    for: which trades a netting set holds, its counterparty and CSA
  - kind: csa
    required: optional (the SIMM terms when present)
    for: SIMM version, collect and post regimes, calculation currency, add-ons
  - kind: simm-addon
    contract: null
    required: optional
    for: the notional add-on per trade
    contract_note: no data contract yet; the fields are listed in [SIMM.md](../contracts/SIMM.md).
  - kind: crif-external
    contract: null
    required: optional
    for: the counterparty's own SIMM, for the comparison
    contract_note: no data contract yet; the fields are listed in [SIMM.md](../contracts/SIMM.md).
  - kind: simm
    required: optional
    for: stored figures, shown *stored, not computed* for netting sets without sensitivities
  - kind: fx-spot
    required: for other currencies
    for: converting sensitivities and thresholds to the calculation currency
- id: mr-cube
  file: docs/guides/MR_CUBE_GUIDE.md
  number: 14
  note: |
    The cube adds no input of its own: these are the VaR engine's inputs and the FRTB-SA engine's sensitivities
    ([section 3](#3-the-inputs-and-their-data-contract)).
  datasets:
  - kind: pnl-vector
    required: '**one of the two**, per trade'
    for: every trade's vector; its columns as dimensions
  - kind: scenario-pv
    required: '**one of the two**, per trade'
    for: the same, as PVs that VaR turns into P&L
  - kind: scenario-set
    required: '**yes**'
    for: the scenario days of the histogram and the explain
  - kind: risk-hierarchy
    required: '**yes**'
    for: the hierarchy levels as dimensions
  - kind: var-limit
    required: optional
    for: '`limit()` and `limit_use()`'
  - kind: position-sensitivity
    required: for the sensitivity measures
    for: '`dv01()`, `cs01()`, the ladder and the heat map'
  - kind: risk-factor
    required: for the sensitivity measures
    for: each factor's class, tenor and curve for the ladder
- id: funds
  file: docs/guides/FUNDS_GUIDE.md
  number: 18
  datasets:
  - kind: fund
    required: '**yes**'
    for: the FUND page, its holdings and look-through
  - kind: fund-holder
    required: for HELD and the company page
    for: the funds holding each issuer
  - kind: index-funds
    required: for TRACK and the index page
    for: the funds tracking each index
- id: groupings
  file: docs/guides/GROUPINGS_ANALYTICS_GUIDE.md
  number: 25
  note: |
    These are the inputs; every grouping and analytic is computed from them when asked ([section 22](#22-where-the-inputs-come-from)).
  datasets:
  - kind: lei-entity
    required: for LEIG and LEIC
    for: each entity's group, parent, country and status
  - kind: us-company
    required: for SIC and the USEQ ratios
    for: each company's sector and financials
  - kind: economy
    required: for ECG
    for: each economy's region, income group, GDP and population
  - kind: correlation-matrix
    required: for CORR
    for: the factors of each correlation set
  - kind: equity
    required: for CORR and EQB
    for: each equity's quote and `HISTORY[]`
  - kind: equity-index
    required: for EQB
    for: each index's level and `HISTORY[]`
  - kind: fx-spot
    required: for CORR
    for: each currency pair's quote and `HISTORY[]`
  - kind: financial-fact
    required: for FACT changes
    for: a reported figure's `HISTORY[]`
  - kind: index-membership
    required: for IDX totals
    for: an index's members, `ROWS[]`
  - kind: price-history
    required: for PXH (off as shipped)
    for: a ticker's prices, read live
- id: pivot
  file: docs/guides/PIVOT_GUIDE.md
  number: 27
  note: |
    The pivot reads any stored kind through its connector ([section 3](#3-sources-and-fields)); these are the sources the guide's examples
    use. A field's type and unit (money, rate) come from the kind's data contract.
  datasets:
  - kind: trade_murex
    contract: trade
    label: The trades
    required: for the table source `trade`
    for: 'the rows of the guide''s examples (`"source": "trade"`)'
  - kind: scenario-pv
    required: for the source `var`
    for: the positions' columns and vectors behind `var()`, `es()`, `pv()`
  - kind: position
    required: optional (a table source)
    for: a stored position table, when the bank delivers one
