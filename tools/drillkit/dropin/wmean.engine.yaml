# The sample engine's engine file for the drop-in test (docs/architecture/TEST_HARNESS.md 3.33): copied to <home>/config/engines/wmean.yaml.
drishti:
  engines:
    wmean:
      enabled: true
      snapshot: { hot: 2 }
      inputs:
        observations: { table: dropin_observation }
      triggers:
        - { on: request }
      outputs:
        mean-by-group: { serve: [ protocol ], live: false }
      limits: { memory-mb: 64, request-seconds: 10 }
