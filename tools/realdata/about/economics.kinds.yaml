# The hand-written part of the about.yaml of the economics pack: what each kind and field means. The vocabulary (one entry per indicator)
# comes from tools/realdata/sources.yaml. tools/realdata/about.py joins the two into tools/packgen/economics/about.yaml; edit here, not there.

kinds:
  economy:
    title: Economy
    about: ${$.name} (${$.regionName}) had a GDP of ${fmt($.gdpUsdBn, 'amount0')} billion USD in ${$.year}; real GDP grew ${fmt($.growth, 'pc2')}, inflation was ${fmt($.inflation,
      'pc2')} and unemployment ${fmt($.unemployment, 'pc2')}. Figures are published World Bank, IMF and CIA data.
    guide: economics
    glossary:
      name:
        term: Economy
        means: The country or territory, with the name the World Bank uses.
      regionName:
        term: World Bank region
        means: The World Bank geographic region the economy belongs to.
      gdpUsdBn:
        term: Gross domestic product
        means: The value of all goods and services produced in the economy in a year, in current US dollars at market exchange rates.
        unit: USD billions
      gdpPerCapita:
        term: GDP per capita
        means: GDP divided by the mid-year population, in current US dollars.
        unit: USD
      growth:
        term: Real GDP growth
        means: The yearly change of GDP after removing inflation, so it measures the growth of output rather than of prices.
        unit: '% a year'
        sign: Negative is a contraction.
      inflation:
        term: Inflation
        means: The yearly change of consumer prices (the consumer price index).
        unit: '% a year'
      unemployment:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment (ILO modelled estimate).
        unit: '% of labour force'
      debtToGdp:
        term: Government debt to GDP
        means: General government gross debt as a share of a year's GDP (IMF), the usual measure of how heavy public debt is.
        unit: '% of GDP'
      currentAccount:
        term: Current account balance
        means: Net exports of goods and services plus net income and transfers, as a share of GDP.
        unit: '% of GDP'
        sign: Negative means the economy borrows from abroad.
      growthPath.year:
        term: Year
        means: The calendar year of the observation.
      growthPath.growth:
        term: Real GDP growth
        means: Real GDP growth in that year.
        unit: '% a year'
        sign: Negative is a contraction.
      gdpPath.year:
        term: Year
        means: The calendar year of the observation.
      gdpPath.gdp:
        term: GDP
        means: GDP in current US dollars in that year.
        unit: USD billions
      sectors.sector:
        term: Sector
        means: Agriculture, industry or services, as the World Bank groups value added.
      sectors.share:
        term: Share of GDP
        means: The sector's value added as a share of GDP.
        unit: '% of GDP'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  macro-indicator:
    title: Macro indicator
    about: ${$.name} was ${fmt($.latest, 'price2')} (${$.unit}) in ${$.latestYear}; its rank among economies with recent data is ${fmt($.rank, 'amount0')}.
    guide: economics
    glossary:
      name:
        term: Indicator
        means: The economy and the statistic, as one name.
      latest:
        term: Latest value
        means: The most recent published value of the statistic, in the unit shown.
      unit:
        term: Unit
        means: 'What the value measures: a rate, a share of GDP, a level in US dollars.'
      latestYear:
        term: Year of the latest value
        means: The calendar year the latest value refers to.
      previous:
        term: Previous value
        means: The value one year before the latest observation, where published.
      rank:
        term: Rank
        means: The position of the economy among all economies with a value from 2022 or later, highest value first.
      history.year:
        term: Year
        means: The calendar year of the observation.
      history.value:
        term: Value
        means: The published value for that year, in the unit shown.
      facts.indicator:
        term: Indicator
        means: The statistic's name.
      facts.unit:
        term: Unit
        means: What the value measures.
      facts.latestYear:
        term: Latest year
        means: The year of the latest value.
      facts.rank:
        term: Rank
        means: The economy's position among economies with recent data, highest value first.
      facts.worldBankCode:
        term: World Bank code
        means: The indicator code in the World Bank API, for looking the series up at the source.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  economic-forecast:
    title: Economic forecast
    about: The ${$.vintage} has ${$.economyName} growing ${fmt($.growth2027, 'pc2')} in 2027 with inflation of ${fmt($.inflation2027, 'pc2')}.
    guide: economics
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      vintage:
        term: Vintage
        means: The IMF World Economic Outlook edition the figures come from; the IMF revises them twice a year.
      growth2027:
        term: Real GDP growth in 2027
        means: The IMF projection of real GDP growth in 2027.
        unit: '% a year'
      inflation2027:
        term: Inflation in 2027
        means: The IMF projection of average consumer-price inflation in 2027.
        unit: '% a year'
      debt2030:
        term: Government debt to GDP in 2030
        means: The IMF projection of general government gross debt as a share of GDP in 2030.
        unit: '% of GDP'
      projections.year:
        term: Year
        means: The calendar year.
      projections.basis:
        term: Basis
        means: Projection for years from the vintage year on, otherwise outturn or estimate.
      projections.growth:
        term: Real GDP growth
        means: Yearly change of real GDP.
        unit: '% a year'
      projections.inflation:
        term: Inflation
        means: Average consumer-price inflation.
        unit: '% a year'
      projections.unemployment:
        term: Unemployment rate
        means: Share of the labour force without a job.
        unit: '% of labour force'
      projections.currentAccount:
        term: Current account balance
        means: Balance of trade, income and transfers with the rest of the world.
        unit: '% of GDP'
        sign: Negative is a deficit.
      projections.debt:
        term: Government gross debt
        means: General government gross debt.
        unit: '% of GDP'
      projections.netLending:
        term: Net lending / borrowing
        means: General government revenue minus expenditure.
        unit: '% of GDP'
        sign: Negative is a deficit.
      projections.gdp:
        term: GDP
        means: GDP in current US dollars.
        unit: USD billions
      path.year:
        term: Year
        means: The calendar year.
      path.growth:
        term: Real GDP growth
        means: Yearly change of real GDP, outturn then projection.
        unit: '% a year'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  labour-market:
    title: Labour market
    about: In ${$.year} ${$.economyName} had unemployment of ${fmt($.unemployment, 'pc2')} and a labour-force participation rate of ${fmt($.participation, 'pc1')}.
    guide: economics
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      unemployment:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment.
        unit: '% of labour force'
      participation:
        term: Labour force participation
        means: The share of people aged 15 and over who work or look for work.
        unit: '% of population 15+'
      youthUnemployment:
        term: Youth unemployment
        means: The unemployment rate of 15 to 24 year-olds.
        unit: '% of youth labour force'
      employmentRatio:
        term: Employment ratio
        means: The share of people aged 15 and over who are employed.
        unit: '% of population 15+'
      femaleParticipation:
        term: Female participation
        means: The labour force participation rate of women aged 15 and over.
        unit: '% of women 15+'
      unemploymentPath.year:
        term: Year
        means: The calendar year.
      unemploymentPath.rate:
        term: Unemployment rate
        means: The unemployment rate in that year.
        unit: '% of labour force'
      bySector.sector:
        term: Sector
        means: Agriculture, industry or services.
      bySector.employmentShare:
        term: Share of jobs
        means: The sector's share of total employment.
        unit: '% of employment'
      bySector.valueAddedShare:
        term: Share of GDP
        means: The sector's share of GDP (value added).
        unit: '% of GDP'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  fiscal-position:
    title: Fiscal position
    about: ${$.economyName}'s general government gross debt was ${fmt($.debt, 'pc1')} of GDP and its net lending ${fmt($.balance, 'pc2')} of GDP (IMF).
    guide: economics
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      debt:
        term: Government gross debt
        means: All liabilities of the general government that require payment of interest or principal, as a share of GDP (IMF).
        unit: '% of GDP'
      balance:
        term: Net lending / borrowing
        means: General government revenue minus total expenditure, as a share of GDP (IMF).
        unit: '% of GDP'
        sign: Negative is a deficit.
      revenue:
        term: Revenue
        means: Central government revenue excluding grants, as a share of GDP (World Bank).
        unit: '% of GDP'
      spending:
        term: Expense
        means: Central government cash payments for operating activities, as a share of GDP (World Bank).
        unit: '% of GDP'
      military:
        term: Military expenditure
        means: All spending on the armed forces, as a share of GDP (SIPRI via the World Bank).
        unit: '% of GDP'
      ratios.item:
        term: Item
        means: A central-government ratio.
      ratios.value:
        term: Share of GDP
        means: The item as a share of GDP.
        unit: '% of GDP'
      debtPath.year:
        term: Year
        means: The calendar year.
      debtPath.debt:
        term: Government gross debt
        means: General government gross debt in that year (IMF; later years are projections).
        unit: '% of GDP'
      balancePath.year:
        term: Year
        means: The calendar year.
      balancePath.balance:
        term: Net lending / borrowing
        means: General government balance in that year (IMF; later years are projections).
        unit: '% of GDP'
        sign: Negative is a deficit.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  country-group:
    title: Country group
    about: ${$.name} (${$.groupType}) groups ${fmt($.economies, 'amount0')} economies with GDP of ${fmt($.gdpUsdBn, 'amount0')} billion USD.
    guide: economics
    glossary:
      name:
        term: Group
        means: The World Bank region, income group or the world.
      groupType:
        term: Type
        means: Whether the group is a region, an income group or the world.
      economies:
        term: Economies
        means: The number of economies in the group that the pack covers.
      gdpUsdBn:
        term: Gross domestic product
        means: The group's GDP in current US dollars (World Bank aggregate).
        unit: USD billions
      gdpPerCapita:
        term: GDP per capita
        means: The group's GDP per head, in current US dollars.
        unit: USD
      populationM:
        term: Population
        means: The group's total population.
        unit: millions
      growth:
        term: Real GDP growth
        means: The group's yearly real GDP growth (World Bank aggregate).
        unit: '% a year'
        sign: Negative is a contraction.
      growthPath.year:
        term: Year
        means: The calendar year.
      growthPath.growth:
        term: Real GDP growth
        means: Group growth in that year.
        unit: '% a year'
      gdpPath.year:
        term: Year
        means: The calendar year.
      gdpPath.gdp:
        term: GDP
        means: Group GDP in that year.
        unit: USD billions
      topEconomies.economy:
        term: Economy
        means: One of the ten largest economies of the group.
      topEconomies.gdpUsdBn:
        term: GDP
        means: The economy's GDP in its latest year.
        unit: USD billions
      topEconomies.growth:
        term: Real GDP growth
        means: The economy's latest real GDP growth.
        unit: '% a year'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
