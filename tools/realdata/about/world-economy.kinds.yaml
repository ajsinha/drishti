# The hand-written part of the about.yaml of the world-economy pack (economics, then politics and society): what each kind and field
# means. The vocabulary (one entry per indicator) comes from tools/realdata/sources.yaml. tools/realdata/about.py joins the two into
# tools/packgen/world/about.yaml; edit here, not there.

kinds:
  economy:
    title: Economy
    about: ${$.NAME} (${$.REGION_NAME}) had a GDP of ${fmt($.GDP_USD_BN, 'amount0')} billion USD in ${$.YEAR}; real GDP grew ${fmt($.GROWTH, 'pc2')}, inflation was ${fmt($.INFLATION,
      'pc2')} and unemployment ${fmt($.UNEMPLOYMENT, 'pc2')}. Figures are published World Bank, IMF and CIA data.
    guide: world-economy
    glossary:
      NAME:
        term: Economy
        means: The country or territory, with the name the World Bank uses.
      REGION_NAME:
        term: World Bank region
        means: The World Bank geographic region the economy belongs to.
      GDP_USD_BN:
        term: Gross domestic product
        means: The value of all goods and services produced in the economy in a year, in current US dollars at market exchange rates.
        unit: USD billions
      GDP_PER_CAPITA:
        term: GDP per capita
        means: GDP divided by the mid-year population, in current US dollars.
        unit: USD
      GROWTH:
        term: Real GDP growth
        means: The yearly change of GDP after removing inflation, so it measures the growth of output rather than of prices.
        unit: '% a year'
        sign: Negative is a contraction.
      INFLATION:
        term: Inflation
        means: The yearly change of consumer prices (the consumer price index).
        unit: '% a year'
      UNEMPLOYMENT:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment (ILO modelled estimate).
        unit: '% of labour force'
      DEBT_TO_GDP:
        term: Government debt to GDP
        means: General government gross debt as a share of a year's GDP (IMF), the usual measure of how heavy public debt is.
        unit: '% of GDP'
      CURRENT_ACCOUNT:
        term: Current account balance
        means: Net exports of goods and services plus net income and transfers, as a share of GDP.
        unit: '% of GDP'
        sign: Negative means the economy borrows from abroad.
      GROWTH_PATH.YEAR:
        term: Year
        means: The calendar year of the observation.
      GROWTH_PATH.GROWTH:
        term: Real GDP growth
        means: Real GDP growth in that year.
        unit: '% a year'
        sign: Negative is a contraction.
      GDP_PATH.YEAR:
        term: Year
        means: The calendar year of the observation.
      GDP_PATH.GDP:
        term: GDP
        means: GDP in current US dollars in that year.
        unit: USD billions
      SECTORS.SECTOR:
        term: Sector
        means: Agriculture, industry or services, as the World Bank groups value added.
      SECTORS.SHARE:
        term: Share of GDP
        means: The sector's value added as a share of GDP.
        unit: '% of GDP'
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  macro-indicator:
    title: Macro indicator
    about: ${$.NAME} was ${fmt($.LATEST, 'price2')} (${$.UNIT}) in ${$.LATEST_YEAR}; its rank among economies with recent data is ${fmt($.RANK, 'amount0')}.
    guide: world-economy
    glossary:
      NAME:
        term: Indicator
        means: The economy and the statistic, as one name.
      LATEST:
        term: Latest value
        means: The most recent published value of the statistic, in the unit shown.
      UNIT:
        term: Unit
        means: 'What the value measures: a rate, a share of GDP, a level in US dollars.'
      LATEST_YEAR:
        term: Year of the latest value
        means: The calendar year the latest value refers to.
      PREVIOUS:
        term: Previous value
        means: The value one year before the latest observation, where published.
      RANK:
        term: Rank
        means: The position of the economy among all economies with a value from 2022 or later, highest value first.
      HISTORY.YEAR:
        term: Year
        means: The calendar year of the observation.
      HISTORY.VALUE:
        term: Value
        means: The published value for that year, in the unit shown.
      FACTS.INDICATOR:
        term: Indicator
        means: The statistic's name.
      FACTS.UNIT:
        term: Unit
        means: What the value measures.
      FACTS.LATEST_YEAR:
        term: Latest year
        means: The year of the latest value.
      FACTS.RANK:
        term: Rank
        means: The economy's position among economies with recent data, highest value first.
      FACTS.WORLD_BANK_CODE:
        term: World Bank code
        means: The indicator code in the World Bank API, for looking the series up at the source.
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  economic-forecast:
    title: Economic forecast
    about: The ${$.VINTAGE} has ${$.ECONOMY_NAME} growing ${fmt($.GROWTH_2027, 'pc2')} in 2027 with inflation of ${fmt($.INFLATION_2027, 'pc2')}.
    guide: world-economy
    glossary:
      ECONOMY_NAME:
        term: Economy
        means: The country or territory the figures describe.
      VINTAGE:
        term: Vintage
        means: The IMF World Economic Outlook edition the figures come from; the IMF revises them twice a year.
      GROWTH_2027:
        term: Real GDP growth in 2027
        means: The IMF projection of real GDP growth in 2027.
        unit: '% a year'
      INFLATION_2027:
        term: Inflation in 2027
        means: The IMF projection of average consumer-price inflation in 2027.
        unit: '% a year'
      DEBT_2030:
        term: Government debt to GDP in 2030
        means: The IMF projection of general government gross debt as a share of GDP in 2030.
        unit: '% of GDP'
      PROJECTIONS.YEAR:
        term: Year
        means: The calendar year.
      PROJECTIONS.BASIS:
        term: Basis
        means: Projection for years from the vintage year on, otherwise outturn or estimate.
      PROJECTIONS.GROWTH:
        term: Real GDP growth
        means: Yearly change of real GDP.
        unit: '% a year'
      PROJECTIONS.INFLATION:
        term: Inflation
        means: Average consumer-price inflation.
        unit: '% a year'
      PROJECTIONS.UNEMPLOYMENT:
        term: Unemployment rate
        means: Share of the labour force without a job.
        unit: '% of labour force'
      PROJECTIONS.CURRENT_ACCOUNT:
        term: Current account balance
        means: Balance of trade, income and transfers with the rest of the world.
        unit: '% of GDP'
        sign: Negative is a deficit.
      PROJECTIONS.DEBT:
        term: Government gross debt
        means: General government gross debt.
        unit: '% of GDP'
      PROJECTIONS.NET_LENDING:
        term: Net lending / borrowing
        means: General government revenue minus expenditure.
        unit: '% of GDP'
        sign: Negative is a deficit.
      PROJECTIONS.GDP:
        term: GDP
        means: GDP in current US dollars.
        unit: USD billions
      PATH.YEAR:
        term: Year
        means: The calendar year.
      PATH.GROWTH:
        term: Real GDP growth
        means: Yearly change of real GDP, outturn then projection.
        unit: '% a year'
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  labour-market:
    title: Labour market
    about: In ${$.YEAR} ${$.ECONOMY_NAME} had unemployment of ${fmt($.UNEMPLOYMENT, 'pc2')} and a labour-force participation rate of ${fmt($.PARTICIPATION, 'pc1')}.
    guide: world-economy
    glossary:
      ECONOMY_NAME:
        term: Economy
        means: The country or territory the figures describe.
      UNEMPLOYMENT:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment.
        unit: '% of labour force'
      PARTICIPATION:
        term: Labour force participation
        means: The share of people aged 15 and over who work or look for work.
        unit: '% of population 15+'
      YOUTH_UNEMPLOYMENT:
        term: Youth unemployment
        means: The unemployment rate of 15 to 24 year-olds.
        unit: '% of youth labour force'
      EMPLOYMENT_RATIO:
        term: Employment ratio
        means: The share of people aged 15 and over who are employed.
        unit: '% of population 15+'
      FEMALE_PARTICIPATION:
        term: Female participation
        means: The labour force participation rate of women aged 15 and over.
        unit: '% of women 15+'
      UNEMPLOYMENT_PATH.YEAR:
        term: Year
        means: The calendar year.
      UNEMPLOYMENT_PATH.RATE:
        term: Unemployment rate
        means: The unemployment rate in that year.
        unit: '% of labour force'
      BY_SECTOR.SECTOR:
        term: Sector
        means: Agriculture, industry or services.
      BY_SECTOR.EMPLOYMENT_SHARE:
        term: Share of jobs
        means: The sector's share of total employment.
        unit: '% of employment'
      BY_SECTOR.VALUE_ADDED_SHARE:
        term: Share of GDP
        means: The sector's share of GDP (value added).
        unit: '% of GDP'
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  fiscal-position:
    title: Fiscal position
    about: ${$.ECONOMY_NAME}'s general government gross debt was ${fmt($.DEBT, 'pc1')} of GDP and its net lending ${fmt($.BALANCE, 'pc2')} of GDP (IMF).
    guide: world-economy
    glossary:
      ECONOMY_NAME:
        term: Economy
        means: The country or territory the figures describe.
      DEBT:
        term: Government gross debt
        means: All liabilities of the general government that require payment of interest or principal, as a share of GDP (IMF).
        unit: '% of GDP'
      BALANCE:
        term: Net lending / borrowing
        means: General government revenue minus total expenditure, as a share of GDP (IMF).
        unit: '% of GDP'
        sign: Negative is a deficit.
      REVENUE:
        term: Revenue
        means: Central government revenue excluding grants, as a share of GDP (World Bank).
        unit: '% of GDP'
      SPENDING:
        term: Expense
        means: Central government cash payments for operating activities, as a share of GDP (World Bank).
        unit: '% of GDP'
      MILITARY:
        term: Military expenditure
        means: All spending on the armed forces, as a share of GDP (SIPRI via the World Bank).
        unit: '% of GDP'
      RATIOS.ITEM:
        term: Item
        means: A central-government ratio.
      RATIOS.VALUE:
        term: Share of GDP
        means: The item as a share of GDP.
        unit: '% of GDP'
      DEBT_PATH.YEAR:
        term: Year
        means: The calendar year.
      DEBT_PATH.DEBT:
        term: Government gross debt
        means: General government gross debt in that year (IMF; later years are projections).
        unit: '% of GDP'
      BALANCE_PATH.YEAR:
        term: Year
        means: The calendar year.
      BALANCE_PATH.BALANCE:
        term: Net lending / borrowing
        means: General government balance in that year (IMF; later years are projections).
        unit: '% of GDP'
        sign: Negative is a deficit.
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  country-group:
    title: Country group
    about: ${$.NAME} (${$.GROUP_TYPE}) groups ${fmt($.ECONOMIES, 'amount0')} economies with GDP of ${fmt($.GDP_USD_BN, 'amount0')} billion USD.
    guide: world-economy
    glossary:
      NAME:
        term: Group
        means: The World Bank region, income group or the world.
      GROUP_TYPE:
        term: Type
        means: Whether the group is a region, an income group or the world.
      ECONOMIES:
        term: Economies
        means: The number of economies in the group that the pack covers.
      GDP_USD_BN:
        term: Gross domestic product
        means: The group's GDP in current US dollars (World Bank aggregate).
        unit: USD billions
      GDP_PER_CAPITA:
        term: GDP per capita
        means: The group's GDP per head, in current US dollars.
        unit: USD
      POPULATION_M:
        term: Population
        means: The group's total population.
        unit: millions
      GROWTH:
        term: Real GDP growth
        means: The group's yearly real GDP growth (World Bank aggregate).
        unit: '% a year'
        sign: Negative is a contraction.
      GROWTH_PATH.YEAR:
        term: Year
        means: The calendar year.
      GROWTH_PATH.GROWTH:
        term: Real GDP growth
        means: Group growth in that year.
        unit: '% a year'
      GDP_PATH.YEAR:
        term: Year
        means: The calendar year.
      GDP_PATH.GDP:
        term: GDP
        means: Group GDP in that year.
        unit: USD billions
      TOP_ECONOMIES.ECONOMY:
        term: Economy
        means: One of the ten largest economies of the group.
      TOP_ECONOMIES.GDP_USD_BN:
        term: GDP
        means: The economy's GDP in its latest year.
        unit: USD billions
      TOP_ECONOMIES.GROWTH:
        term: Real GDP growth
        means: The economy's latest real GDP growth.
        unit: '% a year'
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  region-economy:
    title: Region economy
    about: ${$.NAME} (${$.REGION_CODE}) has about ${fmt($.POPULATION_M, 'price2')} million people and GDP of ${fmt($.GDP_USD_BN, 'amount0')} billion USD. Illustrative, rounded from public figures, not for reporting.
    guide: world-economy
    glossary:
      NAME:
        term: Region
        means: The state or territory.
      REGION_CODE:
        term: Region code
        means: The ISO 3166-2 code of the region (AU-NSW, US-CA); the BI map shades the region it names.
      COUNTRY_NAME:
        term: Country
        means: The country the region belongs to.
      POPULATION_M:
        term: Population
        means: People living in the region, rounded to the nearest 10,000 and shown in millions. Illustrative.
        unit: millions
      GDP_USD_BN:
        term: Gross domestic product
        means: The region's output in US dollars, rounded to the nearest billion. Illustrative, not for reporting.
        unit: USD billions
      GDP_PER_CAPITA:
        term: GDP per capita
        means: GDP over population, in US dollars. Illustrative.
        unit: USD
      PROVENANCE.SOURCE:
        term: Source
        means: The public figures the illustrative numbers were rounded from.
  jurisdiction:
    title: Jurisdiction
    about: ${$.NAME} is a ${$.GOVERNMENT_TYPE} with its capital at ${$.CAPITAL}, per the CIA World Factbook; population ${fmt($.POPULATION_M, 'price2')} million.
    guide: world-economy
    glossary:
      NAME:
        term: Country
        means: The country's common name.
      CAPITAL:
        term: Capital
        means: The seat of government.
      GOVERNMENT_TYPE:
        term: Government type
        means: The form of government, as the CIA World Factbook describes it.
      POPULATION_M:
        term: Population
        means: The number of residents (World Bank, mid-year).
        unit: millions
      AREA_KM2:
        term: Area
        means: Total area, land and water.
        unit: square kilometres
      CURRENCY:
        term: Currency
        means: The ISO 4217 code of the currency, from the Factbook exchange-rate entry.
      LEGISLATURE.PARTY:
        term: Party
        means: A party or group in the lower chamber, as the Factbook lists it.
      LEGISLATURE.SEATS:
        term: Seats
        means: The seats the party won at the most recent election.
      INDICATORS.INDICATOR:
        term: Indicator
        means: A society or governance statistic.
      INDICATORS.VALUE:
        term: Value
        means: The latest published value.
      INDICATORS.YEAR:
        term: Year
        means: The year of the value.
      INDICATORS.UNIT:
        term: Unit
        means: What the value measures.
      PARTIES_LISTED.PARTY:
        term: Party
        means: A political party as the Factbook publishes the name.
      PROFILE.OFFICIAL_NAME:
        term: Official name
        means: The conventional long form of the country's name.
      PROFILE.LANGUAGES:
        term: Languages
        means: The languages spoken and their shares, as published.
      PROFILE.RELIGIONS:
        term: Religions
        means: The religious affiliations and their shares, as published.
      PROFILE.LEGAL_SYSTEM:
        term: Legal system
        means: The legal tradition of the country.
      PROFILE.SUFFRAGE:
        term: Suffrage
        means: The voting age and who may vote.
      PROFILE.INDEPENDENCE:
        term: Independence
        means: When and from whom the country became independent.
      PROFILE.NATIONAL_HOLIDAY:
        term: National holiday
        means: The national day.
      PROFILE.LOCATION:
        term: Location
        means: Where the country is.
      PROFILE.CURRENCY_TEXT:
        term: Currency
        means: The currency and its exchange-rate basis, as published.
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  party:
    title: Party
    about: ${$.NAME} won ${fmt($.SEATS, 'amount0')} seats (${fmt($.SEAT_SHARE, 'pc1')}) in the ${$.CHAMBER} of ${$.COUNTRY_NAME}.
    guide: world-economy
    glossary:
      NAME:
        term: Party
        means: The party's name as the CIA World Factbook lists it in the election result.
      COUNTRY_NAME:
        term: Country
        means: The country the party competes in.
      SEATS:
        term: Seats
        means: The seats the party won in the chamber at the most recent election.
      SEAT_SHARE:
        term: Seat share
        means: The party's seats as a share of the seats the Factbook lists.
        unit: '% of seats'
      CHAMBER:
        term: Chamber
        means: The legislative chamber the result is for.
      ELECTION_DATE:
        term: Election date
        means: When the most recent election was held, as published.
      RESULTS.PARTY:
        term: Party
        means: A party or group in the chamber.
      RESULTS.SEATS:
        term: Seats
        means: The seats it won.
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  office-holder:
    title: Office holder
    about: ${$.COUNTRY_NAME}'s ${lower($.ROLE)} is ${$.HOLDER}, as the CIA World Factbook publishes it.
    guide: world-economy
    glossary:
      COUNTRY_NAME:
        term: Country
        means: The country the office belongs to.
      ROLE:
        term: Role
        means: Chief of state (the ceremonial or constitutional head) or head of government (who leads the executive).
      HOLDER:
        term: Holder
        means: The title and name of the office holder as the Factbook publishes them; surnames are in capitals.
      SINCE:
        term: Since
        means: The date the holder took office, as published.
      GOVERNMENT_TYPE:
        term: Government type
        means: The form of government.
      MANDATE.SELECTION:
        term: Selection
        means: How the office is filled.
      MANDATE.HELD_ON:
        term: Most recent election
        means: When the office was last filled by election, as published.
      MANDATE.NEXT_ELECTION:
        term: Expected next election
        means: When the next election is due, as published.
      MANDATE.RESULTS:
        term: Published results
        means: The result of the last election, as published.
      MANDATE.AS_PUBLISHED:
        term: As published
        means: The Factbook's full entry for the office holder.
      MANDATE.CABINET:
        term: Cabinet
        means: How the cabinet is chosen.
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  election:
    title: Election
    about: '${$.TITLE}: held ${$.DATE_TEXT}; the largest party was ${$.WINNER}; the next election is expected ${$.NEXT_ELECTION}.'
    guide: world-economy
    glossary:
      TITLE:
        term: Election
        means: The country and the chamber or office.
      DATE_TEXT:
        term: Held
        means: When the most recent election took place, as the Factbook publishes the date.
      SYSTEM:
        term: System
        means: The electoral system, for example plurality, proportional representation or an electoral college.
      WINNER:
        term: Largest party
        means: The party with the most seats, or the elected head of state.
      NEXT_ELECTION:
        term: Next election
        means: When the next election is expected, as published.
      RESULTS.PARTY:
        term: Party
        means: A party or group.
      RESULTS.SEATS:
        term: Seats
        means: The seats it won.
      RESULTS.SHARE:
