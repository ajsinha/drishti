# The hand-written part of the about.yaml of the world-economy pack (economics, then politics and society): what each kind and field
# means. The vocabulary (one entry per indicator) comes from tools/realdata/sources.yaml. tools/realdata/about.py joins the two into
# tools/packgen/world/about.yaml; edit here, not there.

kinds:
  economy:
    title: Economy
    about: ${$.name} (${$.regionName}) had a GDP of ${fmt($.gdpUsdBn, 'amount0')} billion USD in ${$.year}; real GDP grew ${fmt($.growth, 'pc2')}, inflation was ${fmt($.inflation,
      'pc2')} and unemployment ${fmt($.unemployment, 'pc2')}. Figures are published World Bank, IMF and CIA data.
    guide: world-economy
    glossary:
      name:
        term: Economy
        means: The country or territory, with the name the World Bank uses.
      regionName:
        term: World Bank region
        means: The World Bank geographic region the economy belongs to.
      gdpUsdBn:
        term: Gross domestic product
        means: The value of all goods and services produced in the economy in a year, in current US dollars at market exchange rates.
        unit: USD billions
      gdpPerCapita:
        term: GDP per capita
        means: GDP divided by the mid-year population, in current US dollars.
        unit: USD
      growth:
        term: Real GDP growth
        means: The yearly change of GDP after removing inflation, so it measures the growth of output rather than of prices.
        unit: '% a year'
        sign: Negative is a contraction.
      inflation:
        term: Inflation
        means: The yearly change of consumer prices (the consumer price index).
        unit: '% a year'
      unemployment:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment (ILO modelled estimate).
        unit: '% of labour force'
      debtToGdp:
        term: Government debt to GDP
        means: General government gross debt as a share of a year's GDP (IMF), the usual measure of how heavy public debt is.
        unit: '% of GDP'
      currentAccount:
        term: Current account balance
        means: Net exports of goods and services plus net income and transfers, as a share of GDP.
        unit: '% of GDP'
        sign: Negative means the economy borrows from abroad.
      growthPath.year:
        term: Year
        means: The calendar year of the observation.
      growthPath.growth:
        term: Real GDP growth
        means: Real GDP growth in that year.
        unit: '% a year'
        sign: Negative is a contraction.
      gdpPath.year:
        term: Year
        means: The calendar year of the observation.
      gdpPath.gdp:
        term: GDP
        means: GDP in current US dollars in that year.
        unit: USD billions
      sectors.sector:
        term: Sector
        means: Agriculture, industry or services, as the World Bank groups value added.
      sectors.share:
        term: Share of GDP
        means: The sector's value added as a share of GDP.
        unit: '% of GDP'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  macro-indicator:
    title: Macro indicator
    about: ${$.name} was ${fmt($.latest, 'price2')} (${$.unit}) in ${$.latestYear}; its rank among economies with recent data is ${fmt($.rank, 'amount0')}.
    guide: world-economy
    glossary:
      name:
        term: Indicator
        means: The economy and the statistic, as one name.
      latest:
        term: Latest value
        means: The most recent published value of the statistic, in the unit shown.
      unit:
        term: Unit
        means: 'What the value measures: a rate, a share of GDP, a level in US dollars.'
      latestYear:
        term: Year of the latest value
        means: The calendar year the latest value refers to.
      previous:
        term: Previous value
        means: The value one year before the latest observation, where published.
      rank:
        term: Rank
        means: The position of the economy among all economies with a value from 2022 or later, highest value first.
      history.year:
        term: Year
        means: The calendar year of the observation.
      history.value:
        term: Value
        means: The published value for that year, in the unit shown.
      facts.indicator:
        term: Indicator
        means: The statistic's name.
      facts.unit:
        term: Unit
        means: What the value measures.
      facts.latestYear:
        term: Latest year
        means: The year of the latest value.
      facts.rank:
        term: Rank
        means: The economy's position among economies with recent data, highest value first.
      facts.worldBankCode:
        term: World Bank code
        means: The indicator code in the World Bank API, for looking the series up at the source.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  economic-forecast:
    title: Economic forecast
    about: The ${$.vintage} has ${$.economyName} growing ${fmt($.growth2027, 'pc2')} in 2027 with inflation of ${fmt($.inflation2027, 'pc2')}.
    guide: world-economy
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      vintage:
        term: Vintage
        means: The IMF World Economic Outlook edition the figures come from; the IMF revises them twice a year.
      growth2027:
        term: Real GDP growth in 2027
        means: The IMF projection of real GDP growth in 2027.
        unit: '% a year'
      inflation2027:
        term: Inflation in 2027
        means: The IMF projection of average consumer-price inflation in 2027.
        unit: '% a year'
      debt2030:
        term: Government debt to GDP in 2030
        means: The IMF projection of general government gross debt as a share of GDP in 2030.
        unit: '% of GDP'
      projections.year:
        term: Year
        means: The calendar year.
      projections.basis:
        term: Basis
        means: Projection for years from the vintage year on, otherwise outturn or estimate.
      projections.growth:
        term: Real GDP growth
        means: Yearly change of real GDP.
        unit: '% a year'
      projections.inflation:
        term: Inflation
        means: Average consumer-price inflation.
        unit: '% a year'
      projections.unemployment:
        term: Unemployment rate
        means: Share of the labour force without a job.
        unit: '% of labour force'
      projections.currentAccount:
        term: Current account balance
        means: Balance of trade, income and transfers with the rest of the world.
        unit: '% of GDP'
        sign: Negative is a deficit.
      projections.debt:
        term: Government gross debt
        means: General government gross debt.
        unit: '% of GDP'
      projections.netLending:
        term: Net lending / borrowing
        means: General government revenue minus expenditure.
        unit: '% of GDP'
        sign: Negative is a deficit.
      projections.gdp:
        term: GDP
        means: GDP in current US dollars.
        unit: USD billions
      path.year:
        term: Year
        means: The calendar year.
      path.growth:
        term: Real GDP growth
        means: Yearly change of real GDP, outturn then projection.
        unit: '% a year'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  labour-market:
    title: Labour market
    about: In ${$.year} ${$.economyName} had unemployment of ${fmt($.unemployment, 'pc2')} and a labour-force participation rate of ${fmt($.participation, 'pc1')}.
    guide: world-economy
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      unemployment:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment.
        unit: '% of labour force'
      participation:
        term: Labour force participation
        means: The share of people aged 15 and over who work or look for work.
        unit: '% of population 15+'
      youthUnemployment:
        term: Youth unemployment
        means: The unemployment rate of 15 to 24 year-olds.
        unit: '% of youth labour force'
      employmentRatio:
        term: Employment ratio
        means: The share of people aged 15 and over who are employed.
        unit: '% of population 15+'
      femaleParticipation:
        term: Female participation
        means: The labour force participation rate of women aged 15 and over.
        unit: '% of women 15+'
      unemploymentPath.year:
        term: Year
        means: The calendar year.
      unemploymentPath.rate:
        term: Unemployment rate
        means: The unemployment rate in that year.
        unit: '% of labour force'
      bySector.sector:
        term: Sector
        means: Agriculture, industry or services.
      bySector.employmentShare:
        term: Share of jobs
        means: The sector's share of total employment.
        unit: '% of employment'
      bySector.valueAddedShare:
        term: Share of GDP
        means: The sector's share of GDP (value added).
        unit: '% of GDP'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  fiscal-position:
    title: Fiscal position
    about: ${$.economyName}'s general government gross debt was ${fmt($.debt, 'pc1')} of GDP and its net lending ${fmt($.balance, 'pc2')} of GDP (IMF).
    guide: world-economy
    glossary:
      economyName:
        term: Economy
        means: The country or territory the figures describe.
      debt:
        term: Government gross debt
        means: All liabilities of the general government that require payment of interest or principal, as a share of GDP (IMF).
        unit: '% of GDP'
      balance:
        term: Net lending / borrowing
        means: General government revenue minus total expenditure, as a share of GDP (IMF).
        unit: '% of GDP'
        sign: Negative is a deficit.
      revenue:
        term: Revenue
        means: Central government revenue excluding grants, as a share of GDP (World Bank).
        unit: '% of GDP'
      spending:
        term: Expense
        means: Central government cash payments for operating activities, as a share of GDP (World Bank).
        unit: '% of GDP'
      military:
        term: Military expenditure
        means: All spending on the armed forces, as a share of GDP (SIPRI via the World Bank).
        unit: '% of GDP'
      ratios.item:
        term: Item
        means: A central-government ratio.
      ratios.value:
        term: Share of GDP
        means: The item as a share of GDP.
        unit: '% of GDP'
      debtPath.year:
        term: Year
        means: The calendar year.
      debtPath.debt:
        term: Government gross debt
        means: General government gross debt in that year (IMF; later years are projections).
        unit: '% of GDP'
      balancePath.year:
        term: Year
        means: The calendar year.
      balancePath.balance:
        term: Net lending / borrowing
        means: General government balance in that year (IMF; later years are projections).
        unit: '% of GDP'
        sign: Negative is a deficit.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  country-group:
    title: Country group
    about: ${$.name} (${$.groupType}) groups ${fmt($.economies, 'amount0')} economies with GDP of ${fmt($.gdpUsdBn, 'amount0')} billion USD.
    guide: world-economy
    glossary:
      name:
        term: Group
        means: The World Bank region, income group or the world.
      groupType:
        term: Type
        means: Whether the group is a region, an income group or the world.
      economies:
        term: Economies
        means: The number of economies in the group that the pack covers.
      gdpUsdBn:
        term: Gross domestic product
        means: The group's GDP in current US dollars (World Bank aggregate).
        unit: USD billions
      gdpPerCapita:
        term: GDP per capita
        means: The group's GDP per head, in current US dollars.
        unit: USD
      populationM:
        term: Population
        means: The group's total population.
        unit: millions
      growth:
        term: Real GDP growth
        means: The group's yearly real GDP growth (World Bank aggregate).
        unit: '% a year'
        sign: Negative is a contraction.
      growthPath.year:
        term: Year
        means: The calendar year.
      growthPath.growth:
        term: Real GDP growth
        means: Group growth in that year.
        unit: '% a year'
      gdpPath.year:
        term: Year
        means: The calendar year.
      gdpPath.gdp:
        term: GDP
        means: Group GDP in that year.
        unit: USD billions
      topEconomies.economy:
        term: Economy
        means: One of the ten largest economies of the group.
      topEconomies.gdpUsdBn:
        term: GDP
        means: The economy's GDP in its latest year.
        unit: USD billions
      topEconomies.growth:
        term: Real GDP growth
        means: The economy's latest real GDP growth.
        unit: '% a year'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  region-economy:
    title: Region economy
    about: ${$.name} (${$.regionCode}) has about ${fmt($.populationM, 'price2')} million people and GDP of ${fmt($.gdpUsdBn, 'amount0')} billion USD. Illustrative, rounded from public figures, not for reporting.
    guide: world-economy
    glossary:
      name:
        term: Region
        means: The state or territory.
      regionCode:
        term: Region code
        means: The ISO 3166-2 code of the region (AU-NSW, US-CA); the BI map shades the region it names.
      countryName:
        term: Country
        means: The country the region belongs to.
      populationM:
        term: Population
        means: People living in the region, rounded to the nearest 10,000 and shown in millions. Illustrative.
        unit: millions
      gdpUsdBn:
        term: Gross domestic product
        means: The region's output in US dollars, rounded to the nearest billion. Illustrative, not for reporting.
        unit: USD billions
      gdpPerCapita:
        term: GDP per capita
        means: GDP over population, in US dollars. Illustrative.
        unit: USD
      provenance.source:
        term: Source
        means: The public figures the illustrative numbers were rounded from.
  jurisdiction:
    title: Jurisdiction
    about: ${$.name} is a ${$.governmentType} with its capital at ${$.capital}, per the CIA World Factbook; population ${fmt($.populationM, 'price2')} million.
    guide: world-economy
    glossary:
      name:
        term: Country
        means: The country's common name.
      capital:
        term: Capital
        means: The seat of government.
      governmentType:
        term: Government type
        means: The form of government, as the CIA World Factbook describes it.
      populationM:
        term: Population
        means: The number of residents (World Bank, mid-year).
        unit: millions
      areaKm2:
        term: Area
        means: Total area, land and water.
        unit: square kilometres
      currency:
        term: Currency
        means: The ISO 4217 code of the currency, from the Factbook exchange-rate entry.
      legislature.party:
        term: Party
        means: A party or group in the lower chamber, as the Factbook lists it.
      legislature.seats:
        term: Seats
        means: The seats the party won at the most recent election.
      indicators.indicator:
        term: Indicator
        means: A society or governance statistic.
      indicators.value:
        term: Value
        means: The latest published value.
      indicators.year:
        term: Year
        means: The year of the value.
      indicators.unit:
        term: Unit
        means: What the value measures.
      partiesListed.party:
        term: Party
        means: A political party as the Factbook publishes the name.
      profile.officialName:
        term: Official name
        means: The conventional long form of the country's name.
      profile.languages:
        term: Languages
        means: The languages spoken and their shares, as published.
      profile.religions:
        term: Religions
        means: The religious affiliations and their shares, as published.
      profile.legalSystem:
        term: Legal system
        means: The legal tradition of the country.
      profile.suffrage:
        term: Suffrage
        means: The voting age and who may vote.
      profile.independence:
        term: Independence
        means: When and from whom the country became independent.
      profile.nationalHoliday:
        term: National holiday
        means: The national day.
      profile.location:
        term: Location
        means: Where the country is.
      profile.currencyText:
        term: Currency
        means: The currency and its exchange-rate basis, as published.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  party:
    title: Party
    about: ${$.name} won ${fmt($.seats, 'amount0')} seats (${fmt($.seatShare, 'pc1')}) in the ${$.chamber} of ${$.countryName}.
    guide: world-economy
    glossary:
      name:
        term: Party
        means: The party's name as the CIA World Factbook lists it in the election result.
      countryName:
        term: Country
        means: The country the party competes in.
      seats:
        term: Seats
        means: The seats the party won in the chamber at the most recent election.
      seatShare:
        term: Seat share
        means: The party's seats as a share of the seats the Factbook lists.
        unit: '% of seats'
      chamber:
        term: Chamber
        means: The legislative chamber the result is for.
      electionDate:
        term: Election date
        means: When the most recent election was held, as published.
      results.party:
        term: Party
        means: A party or group in the chamber.
      results.seats:
        term: Seats
        means: The seats it won.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  office-holder:
    title: Office holder
    about: ${$.countryName}'s ${lower($.role)} is ${$.holder}, as the CIA World Factbook publishes it.
    guide: world-economy
    glossary:
      countryName:
        term: Country
        means: The country the office belongs to.
      role:
        term: Role
        means: Chief of state (the ceremonial or constitutional head) or head of government (who leads the executive).
      holder:
        term: Holder
        means: The title and name of the office holder as the Factbook publishes them; surnames are in capitals.
      since:
        term: Since
        means: The date the holder took office, as published.
      governmentType:
        term: Government type
        means: The form of government.
      mandate.selection:
        term: Selection
        means: How the office is filled.
      mandate.heldOn:
        term: Most recent election
        means: When the office was last filled by election, as published.
      mandate.nextElection:
        term: Expected next election
        means: When the next election is due, as published.
      mandate.results:
        term: Published results
        means: The result of the last election, as published.
      mandate.asPublished:
        term: As published
        means: The Factbook's full entry for the office holder.
      mandate.cabinet:
        term: Cabinet
        means: How the cabinet is chosen.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  election:
    title: Election
    about: '${$.title}: held ${$.dateText}; the largest party was ${$.winner}; the next election is expected ${$.nextElection}.'
    guide: world-economy
    glossary:
      title:
        term: Election
        means: The country and the chamber or office.
      dateText:
        term: Held
        means: When the most recent election took place, as the Factbook publishes the date.
      system:
        term: System
        means: The electoral system, for example plurality, proportional representation or an electoral college.
      winner:
        term: Largest party
        means: The party with the most seats, or the elected head of state.
      nextElection:
        term: Next election
        means: When the next election is expected, as published.
      results.party:
        term: Party
        means: A party or group.
      results.seats:
        term: Seats
        means: The seats it won.
      results.share:
        term: Share of seats
        means: Its seats as a share of the seats listed.
        unit: '% of seats'
      summary.chamber:
        term: Chamber
        means: The legislative chamber.
      summary.seats:
        term: Seats
        means: The number of seats and how many are elected.
      summary.electoralSystem:
        term: Electoral system
        means: How votes become seats.
      summary.term:
        term: Term
        means: How long members serve.
      summary.heldOn:
        term: Most recent election
        means: The date, as published.
      summary.nextElection:
        term: Expected next election
        means: The date, as published.
      summary.women:
        term: Women in chamber
        means: The share of seats held by women.
        unit: '% of seats'
      summary.selection:
        term: Selection
        means: How the head of state is chosen.
      summary.results:
        term: Published results
        means: The result as the Factbook publishes it.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  region:
    title: World region
    about: ${$.name} has ${fmt($.countries, 'amount0')} countries and ${fmt($.populationM, 'price2')} million people; life expectancy is ${fmt($.lifeExpectancy, 'price2')}
      years.
    guide: world-economy
    glossary:
      name:
        term: Region
        means: A World Bank geographic region.
      countries:
        term: Countries
        means: The number of countries of the region in the pack.
      populationM:
        term: Population
        means: The region's total population (World Bank aggregate).
        unit: millions
      lifeExpectancy:
        term: Life expectancy
        means: Years a newborn would live at current mortality (World Bank aggregate).
        unit: years
      womenParliament:
        term: Women in parliament
        means: The share of parliamentary seats held by women (Inter-Parliamentary Union, via the World Bank).
        unit: '% of seats'
      internet:
        term: Internet users
        means: The share of the population that used the Internet in the last three months.
        unit: '% of population'
      governmentTypes.type:
        term: Government type
        means: The form of government as the CIA World Factbook words it.
      governmentTypes.count:
        term: Countries
        means: How many countries of the region have this government type.
      lifeTrend.year:
        term: Year
        means: The calendar year.
      lifeTrend.value:
        term: Life expectancy
        means: Years at birth in that year.
        unit: years
      internetTrend.year:
        term: Year
        means: The calendar year.
      internetTrend.value:
        term: Internet users
        means: Share of the population using the Internet in that year.
        unit: '% of population'
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
  social-indicator:
    title: Social indicator
    about: ${$.name} was ${fmt($.latest, 'price2')} (${$.unit}) in ${$.latestYear}.
    guide: world-economy
    glossary:
      name:
        term: Indicator
        means: The country and the statistic.
      latest:
        term: Latest value
        means: The most recent published value.
      unit:
        term: Unit
        means: What the value measures.
      latestYear:
        term: Year
        means: The year of the latest value.
      change5y:
        term: Change over five years
        means: The latest value minus the value about five years earlier.
        sign: Positive is a rise; whether that is good depends on the indicator.
      sourceName:
        term: Source
        means: The dataset the series comes from.
      series.year:
        term: Year
        means: The calendar year.
      series.value:
        term: Value
        means: The published value in that year.
      byRegion.country:
        term: Country
        means: The country, from the same World Bank region.
      byRegion.value:
        term: Value
        means: The latest value (2022 or later) for that country.
      meaning.indicator:
        term: Indicator
        means: The statistic's name.
      meaning.unit:
        term: Unit
        means: What the value measures.
      meaning.definition:
        term: Definition
        means: The source's definition of the statistic.
      meaning.comparedWith:
        term: Compared with
        means: The countries the bar chart compares with.
      provenance.source:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      provenance.dataset:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      provenance.retrievedAt:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      provenance.licence:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      provenance.attribution:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      provenance.url:
        term: Source address
        means: The web page of the dataset.
