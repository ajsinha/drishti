# Which sample documents of the economics and politics-society packs ship as the packs' Sutra tests (config/packs/<pack>/tests/), what each test expects,
# and the help-coverage ratchet (the lowest share of shown fields with a glossary entry, per Sutra; raise it when about.yaml grows, never lower it).
# tools/realdata/pack_tests.py writes the tests from this file and the generated documents.

world-economy:
  helpCoverage:
    country-group: 1
    economic-forecast: 1
    economy: 1
    fiscal-position: 1
    labour-market: 1
    macro-indicator: 1
    region-economy: 1
    election: 1
    jurisdiction: 1
    office-holder: 1
    party: 1
    region: 1
    social-indicator: 1
  kinds:
    country-group:
      samples:
      - ECG-HIC
      - ECG-SAS
      - ECG-WLD
      nonEmpty:
      - topEconomies
    economic-forecast:
      samples:
      - FCST-IND-WEO
      - FCST-JPN-WEO
      nonEmpty:
      - projections
    economy:
      samples:
      - ECON-BRA
      - ECON-IND
      - ECON-JPN
      - ECON-NGA
      - ECON-USA
      nonEmpty:
      - growthPath
      - sectors
    fiscal-position:
      samples:
      - FISC-JPN
      - FISC-USA
      nonEmpty:
      - ratios
    labour-market:
      samples:
      - LABR-BRA
      - LABR-NGA
      nonEmpty:
      - unemploymentPath
    macro-indicator:
      samples:
      - MACRO-IND-GDP-GROWTH
      - MACRO-NGA-GDP
      - MACRO-USA-INFLATION
      nonEmpty:
      - history
    region-economy:
      samples:
      - REGE-AU-NSW
      - REGE-US-CA
      nonEmpty:
      - facts
    election:
      samples:
      - ELEC-BRA-LOW
      - ELEC-IND-LOW
      - ELEC-USA-LOW
      nonEmpty:
      - results
    jurisdiction:
      samples:
      - JUR-BRA
      - JUR-IND
      - JUR-JPN
      - JUR-NGA
      - JUR-USA
      nonEmpty:
      - indicators
    office-holder:
      samples:
      - OFFC-IND-HOG
      - OFFC-JPN-HOG
      - OFFC-USA-COS
      nonEmpty:
      - mandate
    party:
      samples:
      - PARTY-BRA-01
      - PARTY-IND-01
      nonEmpty:
      - results
    region:
      samples:
      - REGN-SAS
      - REGN-SSF
      nonEmpty:
      - governmentTypes
    social-indicator:
      samples:
      - SOCI-BRA-LIFE-EXPECTANCY
      - SOCI-IND-HDI
      - SOCI-NGA-WGI-LAW
      nonEmpty:
      - series
