# The schemas of the files that are content rather than commented settings, and the environment variables no settings file names
# (read by tools/settings_catalogue.py; docs/admin/CONFIGURATION.md, "Every setting"). Each schema lists every key its files may
# use: `key` (a list's items are key[], a name the site chooses is <name>, a trailing .* covers everything under it), type, default,
# meaning, and where it differs from the schema's own: change (restart or live), applies. --check fails when a shipped file uses a key
# its schema does not list. `maps` names the mappings whose keys are names (each becomes <name>).
#
# `tiers` is the one home of every setting's tier, the three of Admin → Configuration (docs/guides/OPERATIONS_GUIDE.md, "The configuration
# editor") and of CONFIGURATION.md's Tier column:
#   everyday  what a business lead changes: a short list of keys, each written area:key (keep it small);
#   expert    performance and internals (pools, caches, buffers, timeouts, threads, sharding, native code, admission):
#             patterns over the key, * any characters, applied in the areas expert-in names;
#   admin     everything else an operator sets (security, connectors, lakes, engines, retention, paths, branding, the UI kit).
# `areas` gives each area its tier when neither list takes a key; --check fails when an area has none, or an everyday key or an expert
# pattern matches no setting.
tiers:
  everyday:
    - server:drishti.lenses
    - engines:drishti.var.confidence
    - engines:drishti.var.es-confidence
    - engines:drishti.var.confidences
    - engines:drishti.var.es-confidences
    - engines:drishti.var.scenario-window
    - engines:drishti.ccr.exposure.confidence
    - engines:drishti.ccr.exposure.limit-confidence
    - console:features.build
    - console:features.forms
    - console:features.datamap
    - console:features.data
    - console:features.workspaces
    - console:features.monitors
    - console:features.alerts
    - console:features.lakes
    - console:features.reports
    - console:features.collaboration
  expert: ["*pool*", "*cache*", "*buffer*", "*timeout*", "*shard*", "*native*", "*admission*", "*.threads", "*-threads",
           "*threads.virtual*", "*worker*", "*batch*", "*queue*", "*concurren*", "*memory*", "*heap*", "*prefetch*", "*chunk*",
           "*parallel*", "*spill*", "*retry*", "*backoff*", "*blas*", "*-ms", "*latency*",
           "*warm*", "*squeeze*", "*pinned*", "*page-size*", "*bytes*", "*-mb", "*_mb", "*max-rows*", "*interval*",
           "*poll*", "*debounce*", "*coalesce*", "*jvm*", "*duckdb*", "*kafka.*"]
  expert-in: [server, engines, console, connectors, store, runs, edit, compute, net, ai, dataload]
  areas: { server: admin, engines: admin, modules: admin, console: admin, console-files: admin, connectors: admin, packs: admin, editions: admin,
           store: admin, runs: admin, edit: admin, compute: admin, net: admin, alerts: admin, reports: admin, simm: admin,
           dataload: admin, feeds: admin, ui-kit: admin, ai: admin, modules: admin }
schemas:
  sitemap:
    area: console-files
    title: "`sitemap.yaml`: the one home of navigation (the top bar, the Admin tabs, the BI rail, Help's sections, the footer)"
    file: drishti-console/config/sitemap.yaml
    applies: console
    change: live
    maps: [in-context]
    keys:
      - { key: menus, type: list, default: shipped, meaning: "The top bar's menus, in order (core/menus.py draws them; an edition's menus.<menu-id> lists the items it keeps)" }
      - { key: "menus[].id", type: string, meaning: "The menu's id (what an edition's menus.<id> names)" }
      - { key: "menus[].label", type: string, meaning: "Its name in the top bar" }
      - { key: "menus[].icon", type: string, meaning: "Its Bootstrap icon name" }
      - { key: "menus[].domain", type: string, default: core, meaning: "The domain module the menu belongs to (banking, economy; core when not said): the domain split moves its entries" }
      - { key: "menus[].also", type: list, default: "[]", meaning: "Items listed in other menus that this menu's strip also draws, by id (the Admin tabs' BI settings and My account, the BI rail's Pivot and Build home), without listing them twice" }
      - { key: "menus[].personal", type: boolean, default: "false", meaning: "The person's own menu (My account): never drawn as a top menu" }
      - { key: "menus[].subject", type: boolean, default: "false", meaning: "A lens's subject menu (Curves, Economies ...): drawn only where an edition's menus.top names it" }
      - { key: "menus[].gather", type: list, default: none, meaning: "A menu that gathers the columns of other menus by id (the Trading lens's one Markets menu gathers Curves, Volatility, FX and Credit), each drawn as its own column" }
      - { key: "menus[].engines", type: boolean, default: "false", meaning: "The Engines menu: a column per compute engine, drawn for the engines running in the cluster that the person's role opens" }
      - { key: "menus[].search-over", type: number, default: "4", meaning: "The Engines menu: its search box shows when more engines than this run" }
      - { key: "menus[].admin-link", type: map, default: none, meaning: "The Engines menu: its Admin -> Engines link {href, label, requires} (administrators)" }
      - { key: "menus[].admin-link.href", type: string, meaning: "Where it goes (/admin/engines)" }
      - { key: "menus[].admin-link.label", type: string, meaning: "Its text" }
      - { key: "menus[].admin-link.requires", type: list, default: "[]", meaning: "Conditions that must all hold for it to show (as an item's requires)" }
      - { key: "menus[].columns", type: list, meaning: "The menu's columns, each a title and its items" }
      - { key: "menus[].columns[].title", type: string, meaning: "A column's heading" }
      - { key: "menus[].columns[].domain", type: string, default: "the menu's", meaning: "The domain module of the column's items" }
      - { key: "menus[].columns[].engine", type: string, default: none, meaning: "The Engines menu: the column's engine (its id in config/engines.yaml); drawn only while it runs on a server of the cluster" }
      - { key: "menus[].columns[].word", type: string, default: "", meaning: "The Engines menu: the engine's command word, shown in the column's head" }
      - { key: "menus[].columns[].opens", type: list, default: "[]", meaning: "The Engines menu: who opens the engine, any of role:<name> or pack:<name> (a pack assigned to the person); administrators always; none: everyone. The engine's command words follow it (left out of the type-ahead, refused when typed); Help does not" }
      - { key: "menus[].columns[].items", type: list, meaning: "A column's items" }
      - { key: "menus[].columns[].items[].id", type: string, meaning: "The item's id (what an edition lists to keep it)" }
      - { key: "menus[].columns[].items[].href", type: string, meaning: "Where it goes (blank with cmd: the command run; with fill: the command line filled)" }
      - { key: "menus[].columns[].items[].cmd", type: string, default: "", meaning: "The command it runs (VAR BANK), shown beside its label" }
      - { key: "menus[].columns[].items[].fill", type: string, default: "", meaning: "Words it puts in the command line for the person to finish (EXP CPTY), shown beside its label" }
      - { key: "menus[].columns[].items[].icon", type: string, meaning: "Its icon" }
      - { key: "menus[].columns[].items[].label", type: string, meaning: "Its name ({product} and {tutorials} filled in)" }
      - { key: "menus[].columns[].items[].desc", type: string, meaning: "The line under it" }
      - { key: "menus[].columns[].items[].match", type: string, default: "", meaning: "The path prefix that marks it current; blank: the href only" }
      - { key: "menus[].columns[].items[].tab", type: string, default: "its id", meaning: "The Admin tab it marks current (the page's tab)" }
      - { key: "menus[].columns[].items[].rail", type: boolean, default: "true", meaning: "The BI menu: false keeps the item out of the BI rail (the top bar's menu only)" }
      - { key: "menus[].columns[].items[].domain", type: string, default: "the column's", meaning: "The domain module of the item" }
      - { key: "menus[].columns[].items[].requires", type: list, default: "[]", meaning: "Conditions that must all hold for it to show: admin, bi, bi-admin, designer, edition, feature:<name>, word:<WORD>, admin-page:<id>, pack:<name>, cmd:<WORD>, route:<path>" }
      - { key: footer, type: list, default: shipped, meaning: "The footer's links: {id, item, label} each, each an item of the menus" }
      - { key: "footer[].id", type: string, meaning: "The link's id (what an edition's menus.footer names)" }
      - { key: "footer[].item", type: string, meaning: "The menu item it links to, by id (its address and icon)" }
      - { key: "footer[].label", type: string, default: "the item's", meaning: "Its shorter text" }
      - { key: help-sections, type: list, default: shipped, meaning: "Help's sections, in display order: a tile each on the help centre's front door, opening /help/section/<id>; their pages are in help.yaml" }
      - { key: "help-sections[].id", type: string, meaning: "The section's id (help.yaml's sections[].id; an edition's help.categories names it)" }
      - { key: "help-sections[].name", type: string, meaning: "Its name" }
      - { key: "help-sections[].icon", type: string, meaning: "Its icon" }
      - { key: "help-sections[].blurb", type: string, meaning: "Its one line on the tile" }
      - { key: "help-sections[].roles", type: list, default: "[]", meaning: "Who sees the section: none, everyone; else administrators and holders of these roles (Internal: administrators)" }
      - { key: "help-sections[].domain", type: string, default: core, meaning: "The domain module the section belongs to" }
      - { key: in-context, type: map, default: shipped, meaning: "Pages no menu lists because they open from another page: the address and where it is reached from (the sitemap guard holds each to a listed page)" }
      - { key: "in-context.<name>", type: string, meaning: "One address and the page it is reached from" }
      - { key: not-pages, type: list, default: shipped, meaning: "Addresses the console answers that are not pages (data for a page's script, redirects of old addresses, sign-in, health, files)" }
      - { key: placeholder, type: string, default: shipped, meaning: "The command line's placeholder (ui.placeholder or an edition's menus.placeholder wins)" }
  help:
    area: console-files
    title: "`help.yaml`: the help centre's catalogue"
    file: drishti-console/config/help.yaml
    applies: console
    change: live
    maps: [contextual, knowledge, moved, aliases, documents]
    keys:
      - { key: most-used, type: list, default: shipped, meaning: "The most used pages, under the search box of the help centre's front door: {slug, label} each (a page the person cannot see is left out)" }
      - { key: "most-used[].slug", type: string, meaning: "The page" }
      - { key: "most-used[].label", type: string, default: "its title", meaning: "A shorter name on its chip" }
      - { key: aliases, type: map, default: shipped, meaning: "Old section names to the section that took them over (a pack guide's category, an edition's help.categories, /help#cat-<id>)" }
      - { key: "aliases.<name>", type: string, meaning: "One old name and its section's id" }
      - { key: documents, type: map, default: shipped, meaning: "An unlisted document's section by its top folder under docs/ (\"\" the top-level *.md, default any other)" }
      - { key: "documents.<name>", type: string, meaning: "One folder and its section's id" }
      - { key: pack-group, type: string, default: "From the packs", meaning: "The group a pack's own guides join, at the end of their section" }
      - { key: sections, type: list, default: shipped, meaning: "The pages of the help centre's sections, by section id (the sections' order and names: sitemap.yaml help-sections:): a tile each on the front door, opening /help/section/<id>" }
      - { key: "sections[].id", type: string, meaning: "The section's id: its name, icon, line and who sees it are the sitemap's (sitemap.yaml help-sections:)" }
      - { key: "sections[].groups", type: list, meaning: "Its groups of pages, in order" }
      - { key: "sections[].groups[].title", type: string, meaning: "A group's heading" }
      - { key: "sections[].groups[].words", type: list, default: "[]", meaning: "Command words shown beside the heading" }
      - { key: "sections[].groups[].guides", type: list, meaning: "Its pages, in order; each page belongs to exactly one section" }
      - { key: "sections[].groups[].guides[].slug", type: string, meaning: "The page's address, /help/<slug>" }
      - { key: "sections[].groups[].guides[].doc", type: string, default: none, meaning: "A repository document under docs/ rendered as it is; none: the console's own web/guides/<slug>.md" }
      - { key: "sections[].groups[].guides[].title", type: string, meaning: "Its title ({product} filled in)" }
      - { key: "sections[].groups[].guides[].icon", type: string, meaning: "Its icon" }
      - { key: "sections[].groups[].guides[].kind", type: string, default: guide, meaning: "guide, tutorial or knowledge: the badge shown" }
      - { key: "sections[].groups[].guides[].summary", type: string, meaning: "The row's summary, also searched" }
      - { key: "sections[].groups[].guides[].packs", type: list, default: "[]", meaning: "The packs it is about: an edition that keeps none of them hides it" }
      - { key: "sections[].groups[].guides[].roles", type: list, default: "[]", meaning: "Who may see it: none, everyone; else only an administrator or a person holding one of these roles (others get 404 and do not find it)" }
      - { key: "sections[].groups[].guides[].engine", type: string, default: none, meaning: "The compute engine it is about: left out while it runs on no server (an administrator sees it greyed); open to anyone who can open Help otherwise" }
      - { key: "sections[].groups[].guides[].pair", type: string, default: none, meaning: "The tutorial drawn beside this guide on its row (a page of the same group)" }
      - { key: moved, type: map, default: shipped, meaning: "Retired addresses: old slug -> slug or slug#anchor, answered with a 301" }
      - { key: "moved.<name>", type: string, meaning: "One retired slug and the page (and section) that took it over" }
      - { key: knowledge, type: map, default: shipped, meaning: "\"What does this mean?\" beside a data page: screen or kind -> the Knowledge page or glossary entry that explains it" }
      - { key: "knowledge.<name>", type: string, meaning: "One screen or kind and its Knowledge target" }
      - { key: contextual, type: map, default: shipped, meaning: "F1: screen -> the guide it opens" }
      - { key: "contextual.<name>", type: string, meaning: "One screen and its guide's slug" }
  workspaces:
    area: console-files
    title: "`workspaces.yaml`: the starter workspaces"
    file: drishti-console/config/workspaces.yaml
    applies: console
    change: live
    maps: [templates]
    keys:
      - { key: templates, type: map, default: "{}", meaning: "Core starter workspaces by name (packs add their own in config/packs/<domain>/<pack>/config/workspaces.yaml)" }
      - { key: "templates.*", type: map, meaning: "One starter workspace: its layout and panes, as blank below" }
      - { key: blank, type: map, default: shipped, meaning: "What a new, blank workspace starts as" }
      - { key: blank.layout, type: string, default: 2col, meaning: "Its layout: 2col, 3col, 2x2 or 1+2" }
      - { key: blank.panes, type: list, default: "two empty panes", meaning: "1 to 4 panes, each {ref, follows, title}: the command it shows, the pane it follows, its title" }
      - { key: "blank.panes[].ref", type: string, default: none, meaning: "The command a pane opens with; none: empty" }
      - { key: "blank.panes[].follows", type: string, default: none, meaning: "The pane whose selection it follows" }
      - { key: "blank.panes[].title", type: string, default: "", meaning: "The pane's title" }
  datamap:
    area: console-files
    title: "`datamap.yaml`: the data map's presentation"
    file: drishti-console/config/datamap.yaml
    applies: console
    change: live
    keys:
      - { key: domains, type: list, default: "one domain per pack", meaning: "The order domains are drawn in, each domain's name and the packs it holds; a pack not named becomes a domain of its own after these" }
      - { key: "domains[].id", type: string, meaning: "The domain's id" }
      - { key: "domains[].title", type: string, meaning: "Its name on the map" }
      - { key: "domains[].packs", type: list, meaning: "The packs it holds" }
      - { key: computed, type: list, default: "[]", meaning: "Kinds drawn dashed as computed on demand, besides those whose data contract says class: computed" }
      - { key: low-coverage, type: number, default: "0.95", meaning: "A join is a finding when fewer than this share of the ids it holds name an entity that exists" }
  prep-snippets:
    area: console-files
    title: "`prep-snippets.yaml`: the Transform editor's data-prep snippets"
    file: drishti-console/config/prep-snippets.yaml
    applies: console
    change: restart
    keys:
      - { key: snippets, type: list, default: shipped, meaning: "The snippets offered in the Transform editor (bi.transform.snippets_file adds more)" }
      - { key: "snippets[].id", type: string, meaning: "The snippet's id" }
      - { key: "snippets[].title", type: string, meaning: "Its name in the list" }
      - { key: "snippets[].group", type: string, meaning: "The group it is listed under" }
      - { key: "snippets[].description", type: string, meaning: "What it does" }
      - { key: "snippets[].code", type: text, meaning: "The Python it writes, with {name} for each parameter" }
      - { key: "snippets[].params", type: list, meaning: "Its parameters, each {name, label, kind, default, options}" }
      - { key: "snippets[].params[].name", type: string, meaning: "The parameter's name in the code" }
      - { key: "snippets[].params[].label", type: string, meaning: "Its label in the form" }
      - { key: "snippets[].params[].kind", type: string, meaning: "Its input: column, columns, text, number, choice, ..." }
      - { key: "snippets[].params[].default", type: string, meaning: "Its value until changed" }
      - { key: "snippets[].params[].options", type: list, meaning: "The choices of a choice parameter" }
      - { key: "snippets[].example.*", type: map, meaning: "A worked example the tests run: inputs (tables), params and the expected output" }
  report-definition:
    area: reports
    title: "A report definition: `config/reports/banking/<report>.yaml` (docs/guides/VAR_GUIDE.md section 18.14)"
    file: "config/reports/banking/*.yaml"
    files: ["config/reports/banking/*.yaml"]
    applies: server
    change: live (read when a run is made)
    keys:
      - { key: report, type: string, meaning: "The report's id: the file's name without .yaml" }
      - { key: title, type: string, default: "the id", meaning: "Its title on the screens and in the files" }
      - { key: description, type: string, default: "", meaning: "A line in the list of reports" }
      - { key: type, type: string, default: var-table, meaning: "var-table (rows of official nodes, a diversification row and a total) or backtesting-chart (a node's backtest)" }
      - { key: period, type: string, default: fiscal-year, meaning: "fiscal-year or fiscal-quarter, on drishti.regulatory.fiscal-year-end" }
      - { key: measure, type: string, default: var, meaning: "The official record's figure: var, es, svar or ses" }
      - { key: units, type: string, default: units, meaning: "units or thousands: how the files show the figures" }
      - { key: node, type: string, meaning: "backtesting-chart: the node (MGMT~BANK)" }
      - { key: rows, type: list, meaning: "var-table: the rows, in order" }
      - { key: "rows[].label", type: string, meaning: "The row's label" }
      - { key: "rows[].code", type: string, meaning: "A short code shown beside it (IR, FX)" }
      - { key: "rows[].node", type: string, meaning: "The official node the row reads" }
      - { key: "rows[].compute", type: string, meaning: "diversification: the total less the rows (instead of a node)" }
      - { key: "rows[].total", type: boolean, default: "false", meaning: "The total row (one per var-table)" }
      - { key: columns, type: list, default: "[period-end, average, high, low, prior-period-end, movement]", meaning: "The period statistics shown" }
      - { key: checks, type: list, default: "[]", meaning: "The checks run before review: total-equals-official, rows-sum-to-total, no-missing-records, same-total-as (report), movement-needs-note (threshold), backtesting-exceptions, window-complete" }
      - { key: "checks[].check", type: string, meaning: "The check's name" }
      - { key: "checks[].report", type: string, meaning: "same-total-as: the other report" }
      - { key: "checks[].threshold", type: number, default: "0.10", meaning: "movement-needs-note: the movement that needs a note" }
      - { key: outputs, type: list, default: "[xlsx, csv, pdf]", meaning: "The files the run gives after its last approval" }
      - { key: sign-off, type: list, default: "[maker, checker, approver]", meaning: "The sign-off steps in order, maker first, one person a step" }
      - { key: step-titles, type: map, default: "{}", meaning: "A step's title on the screens ({approver: CRO})" }
      - { key: "step-titles.*", type: string, meaning: "One step's title" }
  simm-parameters:
    area: simm
    title: "A SIMM version's parameter file: `<drishti.simm.parameters-dir>/<version>.yaml` (docs/guides/SIMM_GUIDE.md section 4)"
    file: docs/architecture/capital-parameters/simm.yaml
    applies: server
    change: restart
    no-default: "none (licensed)"
    keys:
      - { key: version, type: string, meaning: "The SIMM version as the CSA names it (2.8+2512); a netting set's CSA picks its file by it" }
      - { key: effective-from, type: date, meaning: "The version's effective date; the default version is the installed one with the latest" }
      - { key: source, type: string, default: "", meaning: "Where the numbers come from (the licensed methodology document)" }
      - { key: holding-period-days, type: integer, default: "10", meaning: "SIMM's margin period of risk (a methodology constant)" }
      - { key: calculation-currency, type: string, default: USD, meaning: "The currency the thresholds are set in; converted at the date's FX for another calculation currency" }
      - { key: regimes, type: list, meaning: "The regime codes the version recognises; a CSA's other code is ignored and named (DRS-5334)" }
      - { key: product-classes, type: list, default: "[RatesFX, Credit, Equity, Commodity]", meaning: "SIMM's four product classes (added, no correlation between them)" }
      - { key: risk-classes, type: list, default: "[InterestRate, CreditQ, CreditNonQ, Equity, Commodity, FX]", meaning: "The six risk classes, the axis of risk-class-correlation" }
      - { key: risk-class-correlation, type: list, meaning: "ψ: the 6 × 6 correlation between risk classes within a product class (symmetric, unit diagonal)" }
      - { key: InterestRate, type: map, meaning: "The InterestRate risk class's numbers (the keys below)" }
      - { key: InterestRate.tenors, type: list, meaning: "The rates vertices (2w to 30y), the axis of the risk weights and the tenor correlation" }
      - { key: InterestRate.buckets, type: list, meaning: "The volatility groups (the dictionary's SIMM_BUCKET of a rates factor)" }
      - { key: "InterestRate.delta-risk-weights.*", type: list, meaning: "Per bucket, one risk weight per tenor (per bp)" }
      - { key: InterestRate.inflation-risk-weight, type: number, meaning: "The inflation delta risk weight (per bp)" }
      - { key: InterestRate.cross-currency-basis-risk-weight, type: number, meaning: "The cross-currency basis risk weight (per bp)" }
      - { key: InterestRate.tenor-correlation, type: list, meaning: "The tenor × tenor correlation (also the vega and, squared, the curvature correlation)" }
      - { key: InterestRate.sub-curve-correlation, type: number, meaning: "φ: two sub-curves of one currency" }
      - { key: InterestRate.inflation-correlation, type: number, meaning: "Inflation to a curve of its currency" }
      - { key: InterestRate.cross-currency-basis-correlation, type: number, meaning: "The basis to anything of its currency" }
      - { key: InterestRate.across-currencies, type: number, meaning: "γ across currencies (with g_bc from the currencies' concentration factors)" }
      - { key: InterestRate.vega-risk-weight, type: number, meaning: "The rates vega risk weight" }
      - { key: InterestRate.historical-volatility-ratio, type: number, meaning: "HVR_IR: the rates curvature margin is multiplied by HVR_IR⁻²" }
      - { key: "InterestRate.threshold-groups.*", type: list, meaning: "The currencies of each concentration group (any other currency: other)" }
      - { key: "InterestRate.concentration-thresholds.*", type: map, meaning: "delta (per bp) and vega thresholds by group, other included" }
      - { key: "CreditQ.*", type: map, meaning: "tenors, buckets, delta-risk-weights (by bucket and Residual, per bp), correlation (same-issuer, different-issuer, residual-same-issuer, residual-different-issuer), across-buckets (bucket × bucket), base-correlation-risk-weight, base-correlation-correlation, vega-risk-weight, concentration-thresholds (delta and vega by bucket)" }
      - { key: "CreditNonQ.*", type: map, meaning: "as CreditQ, with across-buckets one number and no base correlation" }
      - { key: "Equity.*", type: map, meaning: "buckets, delta-risk-weights (by bucket and Residual, per 1 %), correlation (by bucket), across-buckets (bucket × bucket), vega-risk-weight (one number or by bucket), historical-volatility-ratio, zero-curvature-buckets (volatility indices), concentration-thresholds" }
      - { key: "Commodity.*", type: map, meaning: "buckets, delta-risk-weights (by bucket, per 1 %), correlation (by bucket), across-buckets, vega-risk-weight, historical-volatility-ratio, concentration-thresholds" }
      - { key: "FX.*", type: map, meaning: "high-volatility-currencies, delta-risk-weights (regular-regular, regular-high, high-regular, high-high), correlation (by the calculation currency's group: regular-regular, regular-high, high-high), vega-correlation, vega-risk-weight, historical-volatility-ratio, threshold-groups, concentration-thresholds" }
  connector-file:
    area: connectors
    title: "A connector file: `config/connectors/<name>.yaml`"
    file: "config/connectors.examples/*/*.yaml"
    files: ["config/connectors.examples/*/*.yaml"]
    applies: the connector
    change: live (the connector restarts)
    keys:
      - { key: plugin, type: string, meaning: "The plugin it runs (delta, jdbc, file, rest, kafka, aerospike, cassandra, redis, mongodb, iceberg, iceberg-external, duckdb, activemq, rabbitmq, s3, feed, news, yfinance, ...)" }
      - { key: enabled, type: boolean, default: "true", meaning: "false: the connector stays stopped, its file kept" }
      - { key: description, type: string, default: "", meaning: "A line shown in Admin -> Connectors" }
      - { key: kinds, type: list, default: "what the plugin reports", meaning: "The kinds it serves" }
      - { key: settings, type: map, default: "{}", meaning: "The plugin's settings, as the tables above (every plugin, the shared tls.* and proxy.*, the plugin's own)" }
      - { key: "settings.*", type: map, meaning: "One setting of the plugin" }
  module-file:
    area: modules
    title: "A module's switch: `config/modules/<module>.yaml` (docs/architecture/ACCESS_MODEL.md)"
    file: "config/modules/*.yaml"
    files: ["config/modules/*.yaml"]
    applies: the module, on this server
    change: restart (a module's beans, engines, jobs and API load at start)
    keys:
      - { key: enabled, type: boolean, default: "the manifest's (true)", meaning: "false: the module is off here (Admin -> Modules writes it); drishti.modules.<id>.enabled wins over it" }
      - { key: module, type: map, default: "none", meaning: "The module named at this site: a server without the module's jar knows it and leaves it off as not installed (its packs, lakes, tables, models and reports in its domain folders are not read); with the jar, the jar's manifest wins and this is ignored" }
      - { key: module.id, type: string, default: "none", meaning: "The module's id (banking)" }
      - { key: module.domain, type: string, default: "none", meaning: "Its domain: the folder name of its packs, lakes, tables and reports (config/packs/banking/)" }
      - { key: module.title, type: string, default: "none", meaning: "Its name on Admin -> Modules" }
  lake-file:
    area: connectors
    title: "A lake file: `config/lakes/<lake>.yaml` (docs/guides/DATA_LAKE_GUIDE.md)"
    file: "config/lakes/*.yaml"
    files: ["config/lakes/*.yaml", "config/lakes.examples/*/*.yaml"]
    applies: every writer and reader of the lake
    change: "live for connectors (read again when a file changes); the next load for writers"
    keys:
      - { key: lake, type: string, meaning: "The lake's name: the file's name; connectors (lake:), loads (target.lake) and lake build (--lake) refer to it" }
      - { key: description, type: string, default: "", meaning: "A line about the lake" }
      - { key: format, type: string, default: delta, meaning: "delta or iceberg; a table may say otherwise" }
      - { key: root, type: string, meaning: "Where the lake is: a local folder, s3://bucket/prefix, or mem://<store> for an in-memory store" }
      - { key: storage, type: map, default: "{}", meaning: "How to reach the root (region, endpoint, path-style ...): the platform's role or ${ENV} references, never a secret" }
      - { key: "storage.*", type: string, meaning: "One storage setting (given to a Delta connector as s3.<key>)" }
      - { key: catalog, type: map, default: none, meaning: "Iceberg's catalog: type none (path tables), rest, glue or s3tables, with its settings (uri, warehouse, token as ${ENV})" }
      - { key: "catalog.*", type: string, meaning: "One catalog setting" }
      - { key: memory, type: map, default: none, meaning: "An in-memory store's (root: mem://<store>) max-mb (the hard cap), chunk-kb, contract, owner, idle-trim-minutes" }
      - { key: "memory.*", type: string, meaning: "One memory setting of the store" }
      - { key: defaults, type: map, default: "{}", meaning: "Table keys that apply to every table unless it says otherwise" }
      - { key: "defaults.*", type: string, meaning: "One table key's default" }
      - { key: tables, type: map, default: "{}", meaning: "The tables by <domain>.<kind> (or <domain>.<table> with kind: when a kind has several tables)" }
      - { key: "tables.*", type: map, meaning: "One table's entry: kind, path, format, partition-by (after business_date, which is always first; at most four), promote, vectors, flatten, id, date, latest-by, load-mode (replace or append), sort-by, file-rows, row-group-rows, file-size-mb, row-group-mb, compression, vector-compression, retention, maintenance, time-travel, properties" }
  pack:
    area: packs
    title: "`pack.yaml`"
    file: config/packs/<domain>/<pack>/pack.yaml
    files: ["config/packs/*/pack.yaml", "examples/packs/*/pack.yaml"]
    applies: the pack
    change: live
    maps: [columns, connectors, connector-templates, form, graph.fields, graph.badges, graph.impact.measures, graph.impact.formats, history,
           mnemonics, pivot, roles, routes, ingest, hierarchies, console.monitors]
    keys:
      - { key: pack, type: string, meaning: "Required: the pack's name, equal to its folder's name (else the pack is refused)" }
      - { key: version, type: string, default: "0", meaning: "X.Y.Z, shown in About, Admin -> Health and Admin -> Packs and checked by deploys and the registry" }
      - { key: code, type: string, default: none, meaning: "The pack's short code: typed alone it opens the pack's overview (/p/<pack>); must not equal a mnemonic" }
      - { key: domain, type: string, default: core, meaning: "The domain it serves (core, banking, economy, capitalmarkets): a pack of a domain loads only while a module of that domain is on (docs/architecture/ACCESS_MODEL.md)" }
      - { key: title, type: string, default: "the pack's name", meaning: "Its name in menus, help and admin pages" }
      - { key: description, type: string, default: "", meaning: "One paragraph for About and the help centre" }
      - { key: sample, type: boolean, default: "false", meaning: "A demonstration pack: drishti.packs.samples can hide it from business users" }
      - { key: extends, type: list, default: "[]", meaning: "Packs inherited (their kinds, links, roles, connectors), loaded with this one; requires is the older name" }
      - { key: requires, type: list, default: "[]", meaning: "The older name of extends" }
      - { key: kinds, type: list, default: "[]", meaning: "The kinds this pack owns; a kind belongs to exactly one installed pack" }
      - { key: mnemonics, type: map, default: "{}", meaning: "The commands: MNEMONIC -> {kind, label}" }
      - { key: "mnemonics.<name>", type: map, meaning: "One command" }
      - { key: "mnemonics.<name>.kind", type: string, meaning: "The kind it opens" }
      - { key: "mnemonics.<name>.label", type: string, default: "the mnemonic", meaning: "Its name in FUNC, menus and the type-ahead" }
      - { key: graph, type: map, default: "{}", meaning: "How the pack's entities link" }
      - { key: graph.id-patterns, type: list, default: "[]", meaning: "A bare id's kind recognised by a regular expression" }
      - { key: "graph.id-patterns[].pattern", type: string, meaning: "The regular expression" }
      - { key: "graph.id-patterns[].kind", type: string, meaning: "The kind an id it matches is" }
      - { key: graph.fields, type: map, default: "{}", meaning: "Document fields whose values are ids of another kind, so they become links" }
      - { key: "graph.fields.<name>", type: map, meaning: "One linking field" }
      - { key: "graph.fields.<name>.kind", type: string, meaning: "The kind its values are ids of" }
      - { key: "graph.fields.<name>.label", type: string, default: none, meaning: "The link's label" }
      - { key: "graph.fields.<name>.scope", type: string, default: all, meaning: "pack: a link in this pack's kinds only; all: everywhere" }
      - { key: graph.badges, type: map, default: "{}", meaning: "kind -> an expression whose text is shown beside a link to it, read from the target" }
      - { key: "graph.badges.<name>", type: string, meaning: "One kind's badge expression" }
      - { key: graph.impact, type: map, default: "{}", meaning: "What F8 (Impact) rolls up and sums" }
      - { key: graph.impact.follow, type: list, default: "[]", meaning: "The link fields Impact follows" }
      - { key: graph.impact.measures, type: map, default: "{}", meaning: "kind -> the expression Impact sums" }
      - { key: "graph.impact.measures.<name>", type: string, meaning: "One kind's measure" }
      - { key: graph.impact.formats, type: map, default: "{}", meaning: "kind -> the format of its measure" }
      - { key: "graph.impact.formats.<name>", type: string, meaning: "One kind's format" }
      - { key: columns, type: map, default: "{}", meaning: "kind -> the key fields of its pick lists and search results" }
      - { key: "columns.<name>", type: list, meaning: "One kind's key fields" }
      - { key: pivot, type: map, default: "{}", meaning: "kind -> Pivot (the pivot screen on the kind) on its search results: rows, columns, values, filters, fields" }
      - { key: "pivot.<name>", type: map, meaning: "One kind's pivot" }
      - { key: "pivot.<name>.rows", type: list, meaning: "Fields down the side" }
      - { key: "pivot.<name>.columns", type: list, meaning: "Fields across the top" }
      - { key: "pivot.<name>.values", type: list, meaning: "The cells, {field, agg} each" }
      - { key: "pivot.<name>.values[].field", type: string, meaning: "The field summed (or counted)" }
      - { key: "pivot.<name>.values[].agg", type: string, default: sum, meaning: "sum, count, avg, min or max" }
      - { key: "pivot.<name>.filters", type: list, meaning: "Fields offered as filters" }
      - { key: "pivot.<name>.fields", type: list, meaning: "Further fields the person may drag in" }
      - { key: form, type: map, default: "{}", meaning: "kind -> its search form (FORM <pack>): the fields, in order" }
      - { key: "form.<name>", type: list, meaning: "One kind's form fields" }
      - { key: "form.<name>[].path", type: string, meaning: "The field's path in the document" }
      - { key: "form.<name>[].label", type: string, default: "the path in words", meaning: "Its heading" }
      - { key: "form.<name>[].type", type: string, default: text, meaning: "text, number, amount, date, enum, id or bool" }
      - { key: "form.<name>[].operators", type: list, default: "the type's", meaning: "The operators offered, the first the default" }
      - { key: "form.<name>[].order", type: integer, default: "as written", meaning: "Its position (lower first)" }
      - { key: "form.<name>[].group", type: string, default: none, meaning: "A heading the field sits under" }
      - { key: "form.<name>[].help", type: string, default: none, meaning: "One line under the field" }
      - { key: "form.<name>[].values", type: list, default: "the values in the data", meaning: "For an enum: the values offered" }
      - { key: "form.<name>[].depends", type: string, default: none, meaning: "For an enum: another field; only values that occur with its chosen values are offered" }
      - { key: history, type: map, default: "{}", meaning: "kind -> how it looks over time (EQ EQ-CSCA 3M); any dated kind has a history without it" }
      - { key: "history.<name>", type: map, meaning: "One kind's history" }
      - { key: "history.<name>.enabled", type: boolean, default: "true", meaning: "false: the kind has no history (DRS-1012)" }
      - { key: "history.<name>.shape", type: string, default: "market with chart, else document", meaning: "How the history page is laid out" }
      - { key: "history.<name>.columns", type: list, default: "the kind's key fields", meaning: "The table's columns, {path, format} each" }
      - { key: "history.<name>.columns[].path", type: string, meaning: "A column's field" }
      - { key: "history.<name>.columns[].format", type: string, default: "inferred", meaning: "Its format" }
      - { key: "history.<name>.chart", type: list, default: none, meaning: "Numeric fields charted (at most 4), {path, format} each; a chart field is always a column" }
      - { key: "history.<name>.chart[].path", type: string, meaning: "A charted field" }
      - { key: "history.<name>.chart[].format", type: string, default: "inferred", meaning: "Its format" }
      - { key: "history.<name>.headline", type: string, default: "the first chart field", meaning: "The field the last, change, high, low, range and average are taken on" }
      - { key: "history.<name>.exclude", type: list, default: none, meaning: "Paths left out of the comparison of days" }
      - { key: "history.<name>.ignore-changes", type: list, default: none, meaning: "Paths whose changes do not count as a change" }
      - { key: "history.<name>.parts", type: list, default: "every top-level list or object", meaning: "The parts compared day by day" }
      - { key: "history.<name>.series", type: map, default: none, meaning: "A list inside the newest document with a date per item: {path, date, value or values}" }
      - { key: "history.<name>.series.path", type: string, meaning: "The list's path" }
      - { key: "history.<name>.series.date", type: string, meaning: "Each item's date field" }
      - { key: "history.<name>.series.value", type: string, meaning: "Each item's value field" }
      - { key: "history.<name>.default-days", type: integer, default: "drishti.history.default-days (30)", meaning: "The range when none is named" }
      - { key: "history.<name>.max-days", type: integer, default: "drishti.history.max-days (366)", meaning: "Can only lower the server's" }
      - { key: roles, type: map, default: "{}", meaning: "Roles this pack adds: name -> its powers" }
      - { key: "roles.<name>", type: map, meaning: "One role" }
      - { key: "roles.<name>.kinds", type: list, meaning: "The kinds the role may open (\"*\": all)" }
      - { key: "roles.<name>.raw", type: boolean, default: "false", meaning: "Sees every field: nothing in drishti.security.redact is masked" }
      - { key: "roles.<name>.calc", type: boolean, default: "false", meaning: "May use Calc (Python in the browser)" }
      - { key: "roles.<name>.*", type: boolean, default: "false", meaning: "The other powers, as drishti.security.roles: author, approve, admin, layout, edit, bi" }
      - { key: python, type: map, default: "{}", meaning: "Calc on this pack's kinds and its starter snippets" }
      - { key: python.enabled, type: boolean, default: "false", meaning: "Calc offered on the pack's kinds" }
      - { key: python.snippets, type: list, default: "[]", meaning: "Starter snippets, {title, description, kinds, code} each (also python/*.py)" }
      - { key: "python.snippets[].title", type: string, meaning: "The snippet's name" }
      - { key: "python.snippets[].description", type: string, meaning: "What it does" }
      - { key: "python.snippets[].kinds", type: list, meaning: "The kinds it is offered on" }
      - { key: "python.snippets[].code", type: text, meaning: "The Python" }
      - { key: connectors, type: "list or map", default: "[]", meaning: "The connectors the pack reads through: a list names site connectors; a mapping names them and is each one's template, written to config/connectors/<name>.yaml at the first start when no such file exists" }
      - { key: "connectors.<name>", type: map, meaning: "One connector's template: plugin, enabled, kinds, settings (the connector file's keys), or a reactive connector's engine, triggers, cache, limits" }
      - { key: "connectors.<name>.*", type: map, meaning: "A template's keys, as a connector file (above) or a reactive connector (docs/connectors/types/reactive/README.md)" }
      - { key: connector-templates, type: map, default: "{}", meaning: "Templates to go with a list of connector names, as connectors.<name>" }
      - { key: "connector-templates.<name>", type: map, meaning: "One template" }
      - { key: "connector-templates.<name>.*", type: map, meaning: "Its keys, as a connector file" }
      - { key: routes, type: map, default: "{}", meaning: "kind -> the connector that answers it (drishti.sources.routes)" }
      - { key: "routes.<name>", type: string, meaning: "One kind's connector" }
      - { key: ingest, type: map, default: "{}", meaning: "For the tools only (drishti.py data ingest --pack, lake build --pack, pack check): each kind's id and business-date fields; ignored by the server" }
      - { key: lake, type: map, default: none, meaning: "The tables the pack recommends (docs/guides/DATA_LAKE_GUIDE.md section 12): lake.tables, the shape of a lake file's tables:, copied into a lake file the first time a writer meets the kind; its Delta and Iceberg templates name lake: and lake-tables:" }
      - { key: "lake.*", type: map, meaning: "lake.tables.<domain>.<table>: one recommended entry (kind, path, partition-by, promote, vectors, sort-by, file-rows, row-group-rows, flatten, ...)" }
      - { key: "ingest.<name>", type: map, meaning: "One kind" }
      - { key: "ingest.<name>.key", type: string, meaning: "Its id field" }
      - { key: "ingest.<name>.date", type: string, default: BUSINESS_DATE, meaning: "Its business-date field" }
      - { key: "ingest.<name>.flatten", type: map, default: "{}", meaning: "Values inside lists that lake build writes as plain fields and columns: field -> path" }
      - { key: "ingest.<name>.flatten.*", type: string, meaning: "One flattened field" }
      - { key: alerts, type: list, default: "[]", meaning: "Suggested alert rules, {kind, name, when, message, severity} each" }
      - { key: "alerts[].kind", type: string, meaning: "The kind watched" }
      - { key: "alerts[].name", type: string, meaning: "The rule's name" }
      - { key: "alerts[].when", type: string, meaning: "The condition, an expression on the document" }
      - { key: "alerts[].message", type: string, meaning: "What the alert says" }
      - { key: "alerts[].severity", type: string, default: info, meaning: "info, warning or critical" }
      - { key: positions, type: map, default: "drishti.var.positions", meaning: "How the VaR engine derives positions from the trades of a date (VAR_GUIDE.md section 15.6)" }
      - { key: positions.live-statuses, type: list, meaning: "The TRADE_STATUS values that count" }
      - { key: positions.rules, type: list, meaning: "The rules, the first that holds a trade keys its position" }
      - { key: "positions.rules[].name", type: string, meaning: "The rule's name" }
      - { key: "positions.rules[].groups", type: list, default: "[]", meaning: "PRODUCT_GROUP values it holds" }
      - { key: "positions.rules[].types", type: list, default: "[]", meaning: "PRODUCT_TYPE values it holds" }
      - { key: "positions.rules[].key", type: list, default: "none: one position per trade", meaning: "The fields keying the position, the first the trade carries" }
      - { key: hierarchies, type: map, default: "{}", meaning: "The hierarchies the VaR and exposure engines build (VAR_GUIDE.md section 16); drishti.var.hierarchies wins" }
      - { key: "hierarchies.<name>", type: map, meaning: "One hierarchy" }
      - { key: "hierarchies.<name>.title", type: string, meaning: "Its name" }
      - { key: "hierarchies.<name>.source", type: string, default: "columns when levels are given", meaning: "risk-hierarchy (the stored rows) or columns (built from the trades' own columns)" }
      - { key: "hierarchies.<name>.levels", type: string, default: none, meaning: "The columns, top first: LIMIT_LETTER > DESK" }
      - { key: "hierarchies.<name>.ids", type: string, default: path, meaning: "path or leaf: how node ids are made" }
      - { key: "hierarchies.<name>.word", type: string, default: none, meaning: "The scope word naming a node (LL:LL-0003)" }
      - { key: "hierarchies.<name>.limits", type: string, default: none, meaning: "The kind its nodes' VaR limits come from (var-limit)" }
      - { key: loads, type: map, default: "{}", meaning: "Which kinds the ETL is expected to land each business day, by when, and who is told (DATA_GUIDE.md)" }
      - { key: "loads.*", type: map, meaning: "The data-load expectations (DATA_GUIDE.md › Telling Drishti new data has landed, section 6)" }
      - { key: sutras, type: string, default: sutras, meaning: "The pack's Sutra folder, read recursively" }
      - { key: formats, type: string, default: config/formats.yaml, meaning: "The pack's named formats" }
      - { key: semantics, type: string, default: config/semantics.yaml, meaning: "Inference hints: roles, labels, acronyms, idFields" }
      - { key: samples, type: string, default: samples, meaning: "Sample documents for the demo source" }
      - { key: about, type: string, default: config/about.yaml, meaning: "The About this page words and glossary" }
      - { key: console, type: map, default: "{}", meaning: "What the console reads from the pack" }
      - { key: console.examples, type: list, default: "[]", meaning: "Example commands, [command, description] each, on /t and the landing page" }
      - { key: console.workspaces, type: string, default: none, meaning: "The pack's starter workspaces file" }
      - { key: console.help, type: string, default: none, meaning: "The pack's help cards and F1 targets file" }
      - { key: console.monitors, type: map, default: "{}", meaning: "Starter monitors: name -> [{kind, id}]" }
      - { key: "console.monitors.<name>", type: list, meaning: "One monitor's entities" }
      - { key: "console.monitors.<name>[].kind", type: string, meaning: "An entity's kind" }
      - { key: "console.monitors.<name>[].id", type: string, meaning: "Its id" }

# Environment variables no settings file above names: read by the packs' manifests, the server's profile files, the code or the tools.
# by: server, console, packs, profile, tools.
env:
  # the packs' connectors (config/packs/<domain>/<pack>/pack.yaml)
  - { name: DRISHTI_DELTA_ROOT, by: packs, default: "./data/delta/demo", sets: "the demo lake's root (config/lakes/demo.yaml)", meaning: "Root of the demo lake, which every pack's Delta connector reads (lake: demo); every lake's own default is <data>/delta/<lake>" }
  - { name: DRISHTI_LAKES_RELOCATE_ON_START, by: server, default: "true", sets: "drishti.lakes.relocate-on-start", meaning: "At start, move a demo lake built in the older layout (<data>/delta/<domain>) into <data>/delta/demo once, safely (verified, moved back on any error, never a delete); false: only by drishti.py lake relocate demo (docs/guides/OPERATIONS_GUIDE.md)" }
  - { name: DRISHTI_LAKES_DIR, by: server, default: "./config/lakes", sets: "drishti.lakes.dir", meaning: "The lake folder: one config/lakes/<lake>.yaml per lake, read by the server, the loader, the data inbox and the tools (docs/guides/DATA_LAKE_GUIDE.md)" }
  - { name: DRISHTI_DATALOAD_LAKE, by: server, default: demo, sets: "drishti.dataload.lake", meaning: "The lake (config/lakes/<lake>.yaml) the data inbox writes to; a folder is the older form" }
  - { name: DRISHTI_DELTA_ENGINE, by: packs, default: native, sets: "delta engine", meaning: "native, hadoop or auto, for every Delta connector without its own engine" }
  - { name: DRISHTI_LAKE_ENABLED, by: packs, default: "true", sets: "the packs' data connectors", meaning: "false switches every pack's data connector off (the demo samples still answer)" }
  - { name: DRISHTI_CONSOLE_RELAY_KEY, by: console, default: ~, sets: "the live-channel relay key", meaning: "Signs the relay messages between the console's workers and, with live.relay.across_hosts, between consoles: the same secret on every console (the launcher makes one for its own workers when it is not set; CLUSTER_GUIDE.md section 9.4)" }
  - { name: DRISHTI_CONSOLE_RELAY_KEY_MADE, by: console, default: ~, sets: "(set by the launcher)", meaning: "Set by run_drishti_web.py when it made the relay key itself: the relay then stays on this host" }
  - { name: DRISHTI_ALLOW_INSECURE_TLS, by: server, default: ~, sets: "tls.insecure-trust-all", meaning: "Must be true for a connector to run with tls.insecure-trust-all: true (development only)" }
  - { name: DRISHTI_CCR_DERIVED_ENABLED, by: packs, default: "true", sets: "counterparty-risk's derived connector", meaning: "The counterparty-risk pack's derived kinds (netting-set and counterparty totals) on or off" }
  - { name: DRISHTI_MR_DERIVED_ENABLED, by: packs, default: "true", sets: "market-risk's derived connector", meaning: "The market-risk pack's derived kinds on or off" }
  - { name: DRISHTI_STREAM_TRADING, by: packs, default: "false", sets: "trading-stream enabled", meaning: "Turn on the trading pack's trading-stream Kafka connector" }
  - { name: DRISHTI_KAFKA_BOOTSTRAP, by: packs, default: "localhost:9092", sets: "Kafka brokers", meaning: "The brokers of the trading stream and the VaR PV topic" }
  - { name: DRISHTI_TRADING_TOPIC, by: packs, default: drishti.trading.trades, sets: "trading-stream topic", meaning: "The trading stream's topic" }
  - { name: DRISHTI_STREAM_STALE_AFTER, by: packs, default: 15m, sets: "trading-stream stale-after", meaning: "The trading stream is stale after this long without a message" }
