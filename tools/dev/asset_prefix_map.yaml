patches:
- file: drishti-console/routes/embed_routes.py
  old: path = WEB / "static/js" / f"{name}.js"
  new: path = WEB / "static/js" / f"drishti_{name}.js"
  why: 'the Elements 1.x enhancer route: the URL keeps the public name, the file is drishti_<name>.js'
- file: drishti-console/routes/embed_v2_routes.py
  old: STATIC / "js" / f"{name}.js"
  new: STATIC / "js" / f"drishti_{name}.js"
  why: 'the v2 behaviour-script route: the public name in the URL, the drishti_ file'
- file: drishti-console/routes/embed_v2_routes.py
  old: STATIC / "css" / f"{name}.css"
  new: STATIC / "css" / f"drishti_{name}.css"
  why: 'the v2 sheet route: the public name in the URL, the drishti_ file'
- file: drishti-console/web/templates/landing.html
  old: /static/img/shot-{{ s.slug }}.png
  new: /static/img/drishti_shot-{{ s.slug }}.png
  why: 'the showcase pictures: the name is built from the slug'
- file: drishti-console/tests/test_landing.py
  old: f"shot-{shot}.png"
  new: f"drishti_shot-{shot}.png"
  why: as landing.html
- file: drishti-console/config/application.yaml
  old: web/static/img/shot-<slug>.png
  new: web/static/img/drishti_shot-<slug>.png
  why: the setting's description
- file: drishti-console/web/templates/build/design.html
  old: /static/js/build/{{ f }}.js
  new: /static/js/build/drishti_{{ f }}.js
  why: 'the workbench scripts: a loop over their names'
- file: drishti-console/tests/test_live_deleted.py
  old: 'global.window = { DrishtiChannel: { subscribe: (ch, h) => { handlers = h; return () => {}; } } };'
  new: 'global.window = { Drishti: { Channel: { subscribe: (ch, h) => { handlers = h; return () => {}; } } } };'
  why: 'a Node stub of window: the global moved into the namespace'
- file: testing/drishti-it/src/test/java/com/ash/drishti/it/AggregationOwnerTest.java
  old: rel.contains("/static/js/pivot")
  new: rel.contains("/static/js/drishti_pivot")
  why: the pivot scripts by the start of their name
- file: drishti-console/web/templates/bi/design.html
  old: static/js/bi-design*.js
  new: static/js/drishti_bi-design*.js
  why: a pattern of names in a comment
- file: drishti-console/tests/test_bi_reports.py
  old: re.findall(r"/static/js/([a-z-]+)\.js"
  new: re.findall(r"/static/js/drishti_([a-z-]+)\.js"
  why: the page's scripts by name, read with a pattern
- file: drishti-console/tests/test_bi_runs_page.py
  old: re.findall(r"/static/js/([a-z-]+)\.js"
  new: re.findall(r"/static/js/drishti_([a-z-]+)\.js"
  why: the page's scripts by name, read with a pattern
- file: drishti-console/routes/embed_routes.py
  old: "async def enhancer_js(request: Request, name: str):\n    if name not in ENHANCERS:"
  new: "async def enhancer_js(request: Request, name: str):\n    name = name.removeprefix(\"drishti_\")\n    if name not in ENHANCERS:"
  why: the public name in the address; the drishti_ name too, which a script finding its siblings beside itself asks for
- file: drishti-console/routes/embed_v2_routes.py
  old: "async def script(request: Request, name: str):\n    if name not in SCRIPTS:"
  new: "async def script(request: Request, name: str):\n    name = name.removeprefix(\"drishti_\")\n    if name not in SCRIPTS:"
