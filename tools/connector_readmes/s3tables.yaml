# The hand-written text of config/connectors.examples/s3tables/README.md; tools/connector_readmes.py writes the README from this and the folder's files (`{{files}}` is their table). Edit here, not there.
summary: |-
  The risk domain and the Endur trades read from AWS S3 Tables (managed Iceberg tables) through the iceberg connector with catalog s3tables, the table bucket named by its ARN.
doc: plugins/drishti-plugin-iceberg/README.md
body: "# S3 Tables connector templates\n\nReady-made connector files for **AWS S3 Tables**: the `iceberg` plugin with `catalog: s3tables`, which reads (and, for the loaders,\nwrites) Iceberg tables in an S3 table bucket through the S3 Tables Iceberg REST endpoint, every request signed with SigV4. One\nsetting names the table bucket, its ARN; everything else follows from it. The AWS side (the table bucket, the namespace, the IAM\npolicy) is made, checked and removed by [`deploy/aws/s3-tables/`](../../../docs/guides/CLUSTER_GUIDE.md).\n\n## What it reads\n\n`risk-store.yaml` reads the market-risk pack's risk domain (P&L vectors, scenario PVs, VaR limits, desk P&L) and\nThe Endur trades are a template of the source module, `modules/source-endur/connectors/examples/s3tables.yaml`, not a file of this folder.\nA kind is read from the table of its name with hyphens made underscores (`pnl-vector` is the table `pnl_vector`), because S3 Tables\nallows lower-case letters, digits and underscores only. Nothing is written by the server; the loaders write the same tables\n(`drishti.py lake build --format iceberg`, the parallel loader with `target.iceberg`) with the same settings.\n\n## Settings\n\n| Setting or variable | Default in the files | Meaning |\n|---|---|---|\n| `catalog` | `s3tables` | AWS S3 Tables through its Iceberg REST endpoint |\n| `DRISHTI_S3TABLES_ARN` (`table-bucket-arn`) | empty: the connector stays idle until it is set | The table bucket, `arn:aws:s3tables:<region>:<account>:bucket/<name>` |\n| `domain` | `risk`, `trading` | The namespace (as an S3 Tables name) |\n| `uri` | `https://s3tables.<region>.amazonaws.com/iceberg`, from the ARN | Give it for a VPC interface endpoint |\n| `layout.<kind>.*` | the packs' promoted columns, vectors and file layout | As for every Iceberg connector |\n\nThe region, the SigV4 signing name `s3tables`, the warehouse (the ARN), the REST path prefix and `vended-credentials: false` follow\nfrom the ARN. Credentials come from the AWS default chain: on ECS the task role, else a profile or `AWS_ACCESS_KEY_ID`. No key is in\nthe files.\n\n## Data structure\n\nThe namespace holds one Iceberg table per kind in the iceberg connector's layout\n([its README](../../../plugins/drishti-plugin-iceberg/README.md)): columns `id`, `doc`, `business_date` and the promoted fields,\npartitioned by `identity(business_date)`, sorted by `id`; vectors as `list<double>`.\n\n| Namespace | Tables (one per kind) |\n|---|---|\n| `risk` | `stress_scenario`, `stress_result`, `frtb_sensitivity`, `pnl_explain`, `trade_valuation`, `pnl_vector`, `scenario_pv`, `fx_scenario`, `scenario_set`, `var_limit`, `desk_pnl`, `pnl_history` |\n| `trading` | `trade` |\n\n## Examples\n\nRun these from the Drishti folder (the repository root, or the install folder of a release).\n\n```bash\ndeploy/aws/s3-tables/s3-tables.sh create --bucket drishti-risk --namespace risk --role drishti-server\nexport DRISHTI_S3TABLES_ARN=arn:aws:s3tables:eu-west-2:123456789012:bucket/drishti-risk\ncp config/connectors.examples/s3tables/risk-store.yaml config/connectors/\ndeploy/aws/s3-tables/s3-tables.sh check --bucket drishti-risk --namespace risk --table pnl-vector\n```\n\n<!-- files:begin (generated by tools/connector_readmes.py from the files in this folder) -->\n{{files}}\n<!-- files:end -->\n\n## Troubleshooting\n\n- Idle with `needs settings.table-bucket-arn`: `DRISHTI_S3TABLES_ARN` is not set.\n- `HTTP 403` from `s3tables.<region>.amazonaws.com`: the principal lacks the policy of `s3-tables.sh create` (`s3tables:Get*`,\n  `s3tables:GetTableData`); `s3-tables.sh check` names the step.\n- `no table pnl_vector`: the loader has not written that kind yet, or wrote it under another namespace.\n\n## See also\n\n- [The Iceberg connector, section 20](../../../plugins/drishti-plugin-iceberg/README.md#aws-s3-tables) and the [iceberg connector README](../../../plugins/drishti-plugin-iceberg/README.md).\n- [The tool scripts](../../../docs/guides/CLUSTER_GUIDE.md) and [Connector files](../../../docs/guides/DATA_GUIDE.md#9-connector-files-and-admin--connectors).\n\nThe Delta and Iceberg files here name a lake (`lake:`, `lake-tables:`); the lake itself, its root or catalog, storage and tables, is the matching\nfile in [config/lakes.examples/s3tables/](../../lakes.examples/s3tables/): copy both (docs/guides/DATA_LAKE_GUIDE.md).\n"
