# The hand-written text of config/connectors.examples/duckdb/README.md; tools/connector_readmes.py writes the README from this and the folder's files (`{{files}}` is their table). Edit here, not there.
summary: |-
  The six banking data domains read from one embedded DuckDB file through the duckdb connector, a schema per domain; they replace the former application-duckdb.yaml profile.
doc: plugins/drishti-plugin-duckdb/README.md
body: "# DuckDB connector templates\n\nReady-made connector files for the `duckdb` plugin: one file per banking data domain (`trading`, `reference`, `market`, `risk`,\n`credit`, `collateral`), all reading the same DuckDB file, which `python tools/drishti.py data load --store duckdb` writes.\n\n## What it reads\n\nEach file reads the table `<domain>.entities` of one DuckDB file and serves the kinds listed in it. All six share one read-only DuckDB\ninstance (one memory limit); the first connector on the file sets `memory-limit`, so the files give the same value. The reference kinds\nare read in `effective` mode; every other kind in `snapshot` mode. Nothing is written. The files carry no promoted columns: add the\npack's `layout.<kind>.columns` to a copied file.\n\n## Settings\n\n| Setting or variable | Default in the files | Meaning |\n|---|---|---|\n| `DRISHTI_DUCKDB_PATH` (`path`) | `${drishti.data.dir}/duckdb/drishti.duckdb` | The DuckDB file; files with the same path share one instance |\n| `DRISHTI_DUCKDB_MEMORY` (`memory-limit`) | `1GB` | DuckDB's native memory limit for the shared instance |\n| `domain` | the file's domain (`trading`, …) | The data domain |\n| `table` | `<domain>.entities` | The domain's table |\n| `pool-size` | `8` for `trading-store`, `4` for the others | Reads of this connector at once |\n| `mode.<kind>` | `effective` for the 12 reference kinds | How a date is read |\n\n## Data structure\n\nThe file holds, per domain, the layout of the [duckdb connector README](../../../plugins/drishti-plugin-duckdb/README.md):\n`<domain>.entities (kind, id, business_date, doc, promoted columns…)` written in `(kind, business_date, id)` order, and\n`<domain>.entity_dates (kind, business_date, rows, loaded_at)`.\n\n| Schema | Kinds the file serves |\n|---|---|\n| `trading` | `trade` |\n| `reference` | `counterparty`, `counterparty-group`, `issuer`, `agreement`, `ccp`, `legal-entity`, `book`, `desk`, `trader`, `calendar`, `csa`, `clearing-account` |\n| `market` | 20 kinds: curves (`ir-curve`, `repo-curve`, `fx-forward-curve`, `credit-curve`, …), surfaces, `fx-spot`, `equity`, `bond`, `rate-fixing`, `correlation-matrix` |\n| `risk` | `var`, `stress-scenario`, `stress-result`, `frtb-sensitivity`, `pnl-explain` |\n| `credit` | `netting-set`, `credit-limit`, `cva`, `sa-ccr` |\n| `collateral` | `collateral-balance`, `margin-call`, `simm` |\n\n## Examples\n\nRun these from the Drishti folder (the repository root, or the install folder of a release).\n\n```bash\npython tools/drishti.py data load --store duckdb data/duckdb/drishti.duckdb                 # the samples: 1,791 documents x 10 business days\ncp config/connectors.examples/duckdb/*-store.yaml config/connectors/\n```\n\nSet `DRISHTI_DUCKDB_PATH` when the file is elsewhere. `trading-store.yaml` is a single trade connector, while the trading pack routes\n`trade` to `trade-endur`, `trade-calypso` and `trade-murex` as a union: save it as `trade-endur.yaml` (and the other two, each with\n`union: \"true\"`), or keep one file and switch the other two off.\n\n<!-- files:begin (generated by tools/connector_readmes.py from the files in this folder) -->\n{{files}}\n<!-- files:end -->\n\n## Troubleshooting\n\n- `DOWN: no DuckDB file at …`: run the loader, or set `DRISHTI_DUCKDB_PATH`.\n- `UP (catalogue not refreshed: <domain>.entities is not in …)`: that domain was not loaded.\n- On Windows a load cannot replace a file the server holds open: load into a new path and change `DRISHTI_DUCKDB_PATH`, or stop the\n  server first.\n\n## See also\n\n- The [duckdb connector README](../../../plugins/drishti-plugin-duckdb/README.md).\n- [Connector files](../../../docs/guides/DATA_GUIDE.md#9-connector-files-and-admin--connectors) (copying examples, the trade union note) and [Demo data](../../../docs/guides/DATA_GUIDE.md#11-the-demo-data).\n"
