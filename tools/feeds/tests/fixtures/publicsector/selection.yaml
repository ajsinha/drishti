# The narrower selection the recorded fixtures were made with (each feed's options overridden by these, as --set would; the responses
# kept by tools/feeds/sources/publicsector.py's Recorder): a few countries and series, so the fixtures stay small. The tests, the packs' samples and the browser test read the same recordings, each
# recorded on 2026-11-07 for the business date 2026-11-06 (the first pull and the incremental one after it). Two exceptions, said in their
# index.json: FRED was answered in its API's documented JSON shape from the series' public fredgraph.csv values (no key yet), and each GDELT
# day is the real file cut to its first 4000 rows.
world-development:
  countries: [CAN, USA, MEX, BRA, GBR, DEU, IND, CHN, JPN, NGA, ZAF, AUS]
  years: 8
central-banks:
  history-days: 400
national-statistics:
  history-periods: 24
oecd:
  countries: [CAN, USA, MEX, GBR, DEU, FRA, ITA, JPN, KOR, AUS]
  start-period: "2024-01"
official-news:
  keep-per-source: 12
gdelt-events:
  backfill-days: 2
  rows-per-day: 4000
