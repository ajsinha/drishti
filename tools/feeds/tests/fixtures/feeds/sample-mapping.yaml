# A test feed (tools/feeds/tests): recorded responses only, never the network.
feed: sample-mapping
title: Sample identifier mappings (test feed)
class: sample_mapping.SampleMapping
source: {provider: Example, url: "https://mappings.example.test", pause: 0, retries: 2, cache-hours: 0}
lake: feedtestlake
load: none
schedule: {at: "07:15", days: weekdays}
licence: {name: Test data, url: "https://mappings.example.test/terms", redistribution: allowed}
keys:
  token: {env: "${SAMPLE_FEED_TOKEN}", required: false}
history: {first-run-days: 2}
datasets:
  mapping: {pack: gleif, kind: lei-mapping, key: IDENTIFIER, dated: source}
  country: {pack: gleif, kind: lei-country, table: lei-country}
