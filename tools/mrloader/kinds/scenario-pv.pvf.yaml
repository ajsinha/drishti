# The logical mapping of a joined PVF row (tools/mrloader/pvf_join.py) to one scenario-pv record (the market-risk pack's contract:
# modules/banking/packs/market-risk/contracts/scenario-pv.contract.yaml, found by the kind). Read by tools/mrloader/pvf_export_gz.py; every
# decision is explained in docs/guides/BANK_DATA_GUIDE.md, "The mapping, field by field". The id rules shared with every other kind of the PVF
# source (legal entity, division, desk, book, position) are in kinds/shared/ids.pvf.yaml: a change there changes every kind that uses it.
#
# NAMES: every attribute name in the output is UPPER_SNAKE (the contract's names, and any pass-through column upper-cased); the joined
# rows' columns are already UPPER_SNAKE (SRC_POSITION_ID, PORTFOLIO_NM_D2 ...), so `from:` and `{COLUMN}` name them that way. Values are
# never changed by the name rule.
#
# A field's rule, applied in this order (README.md, "The mapping grammar"):
#   const: V                  a fixed value                         | from: COL or [COL1, COL2]  the first non-empty column
#   template: "A-{COL}"       {COL} a joined column, {$name} a run value (below), {@FIELD} a field mapped above; empty when any part is empty
#   regex: '...'              keep the first group (no match: empty)
#   map: {K: V}, else: V      a lookup; a value not in it takes `else` (a template), and without `else` the row is audited (UNMAPPED_VALUE)
#   sign: {negative, zero, positive}   by the number's sign
#   sign_from: {column: C, negative: [..], positive: [..], only_for: [COL]}   the number's magnitude, signed by column C's value
#                             (only_for: only when the `from` list's value came from one of these columns, e.g. an unsigned amount)
#   slug: true                upper case, every run of other characters one '-'   | upper: true
#   prefix: P                 put in front unless the value starts with it
#   type: text | number | integer | date | list    (list: one value as a one-element list of text)
#   default: V                when the result is empty (a template)
#   use: RULE                 the rule RULE of a shared fragment named in `use:` at the top (kinds/shared/ids.pvf.yaml)
# A required contract field that ends empty excludes the row (audit MISSING_REQUIRED); an optional one is left out of the record.
# A field with no rule is left out: a required one only when `omit-required` names it with its reason (the export and pvf_validate.py
# then report it as a known contract gap, not an error).

format: 1
kind: scenario-pv
source: pvf
about: "The PVF extract's per-path PVs, one record per position with its 251 scenario PVs, joined to its position and portfolio."
after: [scenario-set, fx-scenario]
use: [shared/ids.pvf]

# run values: {$name} in templates; the command line overrides each (--scenario-set-id, --batch-id, --computed-at, --restatement)
run:
  scenario_set_id: HS-PVF-251               # DECISION (owner): the scenario set's id; ^HS-; the date's one set (README.md, "The scenario set")
  batch_id: "B-{$business_date}-PVF"         # one batch per date for the full run (DRS-5203)
  computed_at: "{$pv_file_modified}"        # the extract has no run time: the PV file's last-modified time, UTC (pvf_join.py records it);
                                            # COMPUTED_AT orders an intraday update after this run and is the loader's latest-by
  restatement: 0

# The scenario set the vectors are indexed by. Never padded: a vector whose length is not `count` is refused.
scenario-set:
  count: 251                                # paths 0..250 (pvf_join.py --max-path 250)
  path-order: newest-first                  # owner 2026-11-18: path_num 0 is the LATEST scenario day; the vector is reversed to Drishti's oldest-first order
  emit: true                                # write scenario-set/<date>/cob.jsonl.gz beside the PVs (the date has no set otherwise)
  dates: weekdays                           # DECISION (owner): the `count` weekdays before the business date (no holiday calendar), or a
                                            # file of dates, one YYYY-MM-DD a line, oldest first: dates: data/pvf/scenario_dates_20261029.txt
  horizon_days: 1
  revaluation: full
  description: "Historical simulation from the PVF extract (HistoVAR, shock group ALL): {count} scenario days, equal weights; days {dates_rule}"

fields:
  VALUE_TYPE: {const: PV}                                   # scenario PVs, not a P&L vector
  GRAIN: {const: POSITION}                                  # the extract is keyed by position
  POSITION_ID: {use: POSITION_ID}                          # the extract's surrogate id, prefixed so it cannot meet another system's
  TRADE_IDS: {from: TRADE_ID, type: list}                   # the one trade the position carries (navigation only)
  CURRENCY: {from: CURRENCY_CD, upper: true}                # enum CAD, EUR, USD: another currency is refused by the contract check
  SOURCE_SYSTEM:                                            # from SRC_POSITION_ID's prefix (CAL:...); SYSTEM_ID numbers have no names yet
    from: SRC_POSITION_ID
    regex: '^([A-Za-z]+):'
    map: {CAL: CALYPSO, END: ENDUR, MX: MUREX}
    else: "SYSTEM-{SYSTEM_ID}"
  SCENARIO_PV_ID: {template: "SPV-{@POSITION_ID}-{$scenario_set_id}"}
  INSTRUMENT: {template: "{TV_PRODUCT_TYPE} {CURRENCY_CD} {TRADE_ID}"}       # the extract has no instrument name: product, currency, trade
  BUSINESS_DATE: {from: BUSINESS_DATE, type: date}
  SCENARIO_SET_ID: {template: "{$scenario_set_id}"}
  LEGAL_ENTITY: {use: LEGAL_ENTITY}                        # the id rules: kinds/shared/ids.pvf.yaml
  DIVISION: {use: DIVISION}
  DESK: {use: DESK}
  TT_BOOK: {use: TT_BOOK}                                   # PORTFOLIO_D2's portfolio name (PORT_100000 -> BOOK-PORT-100000)
  PORTFOLIO: {template: "{@TT_BOOK}"}                       # the booking portfolio: the same as TT_BOOK, as in the demo
  LIMIT_LETTER: {from: [LIMIT_LETTER_NM, LOSS_LIMIT_NM]}    # optional: empty in the extract, left out (the (Blank) node)
  STRATEGY: {from: STRATEGY}                                # optional: left out when empty
  PRODUCT_GROUP: {from: TV_PRODUCT_TYPE}                    # required; the extract has a product type only (no grouping invented)
  PRODUCT_TYPE: {from: TV_PRODUCT_TYPE}
  # The extract carries no sign: every position_amt is a positive amount or notional and there is no buy/sell column (owner,
  # 2026-11-18, option B). QUANTITY is position_amt as given, so DIRECTION is LONG by the contract's rule (QUANTITY >= 0) and is NOT
  # meaningful for this source. VaR does not depend on either: it reads BASE_PV and SCENARIO_PV, which carry their own signs.
  # When the extract gains a sign column, uncomment sign_from: it signs QUANTITY by that column and DIRECTION follows (a value in neither
  # list is audited UNMAPPED_VALUE, never guessed). The export summary counts QUANTITY's signs ("position_amt unsigned: N of N positive").
  # QUANTITY's source is a priority list (owner, 2026-11-18): a signed quantity column when the extract has one, else position_amt.
  # The current extract has no QUANTITY or QTY column, so every row falls back to POSITION_AMT; the export summary counts which column
  # fed QUANTITY (QUANTITY_SOURCE) and notes "position_amt unsigned: N of N positive" when the unsigned amount was used.
  QUANTITY:
    from: [QUANTITY, QTY, POSITION_AMT]
    type: number
    # sign_from: {column: BUY_SELL_CD, negative: [SELL, S, SHORT], positive: [BUY, B, LONG], only_for: [POSITION_AMT]}
  DIRECTION: {template: "{@QUANTITY}", sign: {negative: SHORT, zero: LONG, positive: LONG}}
  BASE_PV: {from: BASE_PV, type: number}                    # path -1
  VALUATION_DATE: {from: BUSINESS_DATE, type: date}
  BASE_VALUATION_DATE: {from: BUSINESS_DATE, type: date}
  SCENARIO_PV: {from: PATH_PV, type: vector}                # paths 0..250 in scenario-set.path_order
  STATUS: {const: ok}                                       # required; the PVs are supplied and priced (failed rows have no PVs and are
                                                            # never written); filled paths are reported as PATH0_FROM_BASE/PATHS_FILLED
                                                            # and in the .fills.csv list, not by relabelling a real price 'proxied'
  COMPUTED_AT: {template: "{$computed_at}"}                 # required; see run.computed_at
  BATCH_ID: {template: "{$batch_id}"}                       # required; the engine checks one batch per date (DRS-5203); a re-run says --batch-id
  RESTATEMENT: {template: "{$restatement}", type: integer}  # required; 0 = the date's first run (--restatement 1, 2 ... for a re-send)
  RUN_KIND: {const: FULL}                                   # the extract is the day's full run (not an intraday update)

# Required by the contract, but the extract has no value for them and the VaR engine does not need them (VarIntake reads them only when
# present): left out rather than invented. pvf_validate.py reports them as known gaps.
omit-required:
  MATURITY_DATE: "no maturity in the extract; the engine drops only rows whose maturity is before the date, a row without one counts"
  TRADE_STATUS: "no trade status in the extract; the engine counts a row with no status as live"
  PRICER: "no pricer in the extract; kept for audit only, not read by the engine"
  MODEL_VERSION: "no model version in the extract; kept for audit only, not read by the engine"

# The source attributes kept beside the contract's fields (owner, 2026-11-18): every joined column (already UPPER_SNAKE: SRC_POSITION_ID,
# TRANSIT_CD, MF1_PNL_TYPE, TV_PRODUCT_TYPE, PORTFOLIO_ID, the PORTFOLIO_D2 columns ...) except `exclude`; a column whose name is a
# contract field (POSITION_ID, TRADE_ID, LEGAL_ENTITY, STRATEGY ...) is kept as <prefix><NAME> (PVF_POSITION_ID: the extract's own id;
# PVF_TRADE_ID, since a POSITION-grain record carries no TRADE_ID). The contract's delivery note says "exactly its fields": the loader
# keeps the extra attributes and the engine ignores them; pvf_validate.py counts them as extra, an error only with --strict.
pass-through:
  columns: "*"                              # or a list of joined columns
  exclude: [PATH_PV, BASE_PV, BUSINESS_DATE] # already in the record as SCENARIO_PV, BASE_PV, BUSINESS_DATE
  collision-prefix: PVF_
