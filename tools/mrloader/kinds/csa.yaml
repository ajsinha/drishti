# The credit support annexes (docs/guides/BANK_DATA_GUIDE.md section 3.2): thresholds, minimum transfer amounts, independent amount, margin
# frequency and margin period of risk; the eligible collateral from an optional child file.
format: 1
kind: csa
source: canonical
about: "The credit support annexes, one row each: thresholds, minimum transfer amounts, independent amount, margin frequency and period of risk."
after: [agreement]
on-reject: refuse

inputs:
  main: {option: --csv, required: [CSA_ID, MARGIN_TYPE, AGREEMENT, COUNTERPARTY, LEGAL_ENTITY]}
  children:
    ELIGIBLE:                            # one row a CSA and eligible asset (optional file)
      option: --child ELIGIBLE
      on: CSA_ID
      required: [ASSET, HAIRCUT]
      optional: true                     # no file: no list
      empty: keep
      unique: [ASSET]

fields:
  CSA_ID:                {from: CSA_ID, slug: true, prefix: CSA-}
  MARGIN_TYPE:           {from: MARGIN_TYPE}                   # VM, VM + IM ...
  THRESHOLD_US:          {from: THRESHOLD_US, type: amount}
  THRESHOLD_THEM:        {from: THRESHOLD_THEM, type: amount}
  MTA:                   {from: [MTA, MTA_US], type: integer}
  INDEPENDENT_AMOUNT:    {from: INDEPENDENT_AMOUNT, type: amount, default: "0"}
  FREQUENCY:             {from: FREQUENCY}                     # Daily, Weekly ...
  CSA_CURRENCY:          {from: CSA_CURRENCY, upper: true}
  MTA_US:                {from: MTA_US, type: amount}
  MTA_THEM:              {from: MTA_THEM, type: amount}
  MARGIN_FREQUENCY_DAYS: {from: MARGIN_FREQUENCY_DAYS, type: integer}
  MPOR_DAYS:             {from: MPOR_DAYS, type: integer}       # the margin period of risk, business days
  LEGAL_ENTITY:          {from: LEGAL_ENTITY, slug: true, prefix: LE-}
  AGREEMENT:             {from: AGREEMENT, slug: true, prefix: AGR-}
  COUNTERPARTY:          {from: COUNTERPARTY, slug: true, prefix: CP-}
  ELIGIBLE[].ASSET:      {from: ASSET}
  ELIGIBLE[].HAIRCUT:    {from: HAIRCUT, type: rate}           # a fraction: 0.02 is 2%

refuse-columns:
  NETTING_SETS: "the netting sets name their CSA; the reverse list is derived"
  COLLATERAL_BALANCES: "the balances name their CSA; the reverse list is derived"

checks:
  links:
    AGREEMENT: {to: agreement, policy: warn}
