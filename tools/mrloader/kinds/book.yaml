# The bank's books (docs/guides/BANK_DATA_GUIDE.md sections 3.1 and 4.1): the canonical CSV. What a bank calls a booking portfolio is the
# book: the names behind the book nodes; a full snapshot every day. The PVF source's own portfolio file: book.pvf.yaml.
format: 1
kind: book
source: canonical
about: "The bank's books (booking portfolios), one row each: name, desk and classification. The names behind the book nodes."
after: [desk]
on-reject: refuse

inputs:
  main: {option: --csv, required: [BOOK_ID, NAME, DESK]}

fields:
  BOOK_ID:              {from: BOOK_ID, slug: true, prefix: BOOK-}   # "PORT_100000" or "BOOK-PORT-100000": the id the PVs carry
  NAME:                 {from: NAME}
  DESK:                 {from: DESK, slug: true, prefix: DESK-}
  ACCOUNTING_TREATMENT: {from: ACCOUNTING_TREATMENT}                 # optional: "Fair value (FVTPL)"
  REGULATORY_BOOK:      {from: REGULATORY_BOOK}                      # optional: "Trading book"
  VOLCKER:              {from: VOLCKER}                              # optional: "Market making"

refuse-columns:
  TRADE_COUNT: "a count of the book's trade valuations, derived"
  MTM: "a roll-up of the book's trade valuations"
  DV01: "a roll-up of the book's sensitivities"
