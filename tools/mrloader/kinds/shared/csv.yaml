# The CSV dialect every kind's file is read with unless its mapping's `csv:` block says otherwise (docs/guides/BANK_DATA_GUIDE.md section 9).
# The rule behind every line: the file's format is DECLARED, never guessed cell by cell. A value that does not fit rejects its row.
delimiter: ","            # ; (European locales), \t, | or auto (chosen from the header among these four; reported in the summary); a first line sep=; is honoured
encoding: utf-8           # a byte-order mark is removed; cp1252 for Excel's plain CSV on Windows
decimal: "."              # a European file: decimal: ",", thousands: "." or " "
thousands: ","
dates: YYYY-MM-DD         # ISO and YYYYMMDD are always read; else one of DD/MM/YYYY, MM/DD/YYYY, DD-MMM-YYYY, DD.MM.YYYY, YYYY/MM/DD, excel-serial
nulls: ["NULL", "null", "N/A", "#N/A", "NaN", "-"]   # with an empty cell: null. 0 is a value; #REF! and the other errors reject the row
skip-rows: 0              # title lines above the header
