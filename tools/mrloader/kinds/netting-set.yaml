# The netting sets (docs/guides/BANK_DATA_GUIDE.md section 3.2): the terms and links only. Its trades are the trade valuations that name it;
# its MtM, collateral, limit and CVA are computed.
format: 1
kind: netting-set
source: canonical
about: "The netting sets, one row each: the counterparty, the legal entity, the agreement and CSA, and whether netting is enforceable. Terms and links only."
after: [csa, counterparty, legal-entity]
on-reject: refuse

inputs:
  main: {option: --csv, required: [NETTING_SET_ID, COUNTERPARTY, AGREEMENT, LEGAL_ENTITY, NETTING_ENFORCEABLE]}

fields:
  NETTING_SET_ID:      {from: NETTING_SET_ID, slug: true, prefix: NS-}
  COUNTERPARTY:        {from: COUNTERPARTY, slug: true, prefix: CP-}
  AGREEMENT:           {from: AGREEMENT, slug: true, prefix: AGR-}
  CSA:                 {from: CSA, slug: true, prefix: CSA-}            # empty: an unmargined set
  CREDIT_LIMIT:        {from: CREDIT_LIMIT, slug: true, prefix: LIM-}
  COLLATERAL_BALANCE:  {from: COLLATERAL_BALANCE, slug: true, prefix: COLL-}
  LEGAL_ENTITY:        {from: LEGAL_ENTITY, slug: true, prefix: LE-}
  NETTING_ENFORCEABLE: {from: NETTING_ENFORCEABLE, type: boolean}       # true when close-out netting holds in law

refuse-columns:
  TRADE_COUNT: "the set's trades are the valuations that name it"
  NET_MTM: "computed from the set's trade valuations"
  COLLATERAL: "computed from the set's collateral balance"
  CVA: "computed by the CVA engine"

checks:
  links:
    CSA: {to: csa, policy: refuse}                         # a margined set treated as unmargined changes the exposure
    COUNTERPARTY: {to: counterparty, policy: refuse}       # exposure not attributed
