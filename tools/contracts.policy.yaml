# What `drishti.py contract bootstrap` (tools/contracts.py) cannot read from the data: the product owner's decisions of 2026-10-25
# (docs/architecture/IMPLEMENTATION_PLAN.md, "The computed-measures roadmap"; docs/contracts/README.md). A draft contract takes its
# class, status and the fields that are computed figures from here; everything else comes from the pack and its data.
#
#   classes      kind -> class when it is not "fundamental" (a kind listed under retiring is "computed")
#   retiring     kinds whose stored version is retired: release, the contract that replaces it, the measure that computes it, and
#                the fields that are computed figures (path A[].B for a field of every element of list A)
#   split        kinds whose terms are kept and whose figures are computed: status stays active, the figures are derived and retiring
#   retired      kinds retired in a release: removed with their contracts, samples, test data and Sutras; a guard test fails the build
#                when one returns (tools/test_contracts.py; docs/contracts/README.md section 14)
#   removed      kind -> the computed figures removed from its stored record in a release: they never return (the same guard)
#   engine-columns  measure -> the columns its engine produces: no input or fundamental kind, test data or sample may carry one
#   notes        kind -> notes copied into the draft
#   review       kind -> questions copied into the draft's review list

classes:
  input: [pnl-vector, scenario-set, risk-hierarchy, portfolio, path-book, path-strip]
  drishti-owned: [position]
  computed: [path-sum, path-sum-java]

retiring: {}

split: {}

retired:
  var:
    release: 2.8.0
    contract: VAR.md
    measure: the VaR engine
    note: "VAR <id> and /v/var/<id> open the VaR explorer at the matching scope (VAR-COMM: DESK:COMM)"
  var-node:
    release: 2.8.0
    contract: VAR.md
    measure: the VaR engine's official end-of-day captures
    note: "a node's history is its official end-of-day captures; VN-<node> opens the explorer at NODE:<node>"

removed:
  position:
    release: 2.8.0
    contract: VAR.md
    figures: [VAR_99, ES_975, COMPONENT_VAR, BOOK_VAR, PCT_OF_BOOK_VAR, PNL, "TRADE_QUANTITIES[].VAR_99", "TRADE_QUANTITIES[].COMPONENT_VAR"]
  desk:
    release: 2.8.0
    contract: VAR.md
    figures: [VAR_99, VAR_RESULT]
  portfolio:
    release: 2.8.0
    contract: VAR.md
    figures: [VAR_99, ES_975, LIMIT_USE, POSITION_COUNT, TRADE_COUNT, LONG_COUNT, SHORT_COUNT, GROSS_MV, NET_MV, POSITIONS, BY_PRODUCT,
              BY_CURRENCY, BY_DIRECTION, TOP_CONTRIBUTORS, PNL, ALL_TRADES, SCENARIO_SET_ID]

engine-columns:
  var: [VAR_99, ES_975, COMPONENT_VAR, BOOK_VAR, PCT_OF_BOOK_VAR, PCT_OF_VAR, HYPO_PNL, EXCEPTIONS_250, VAR_RESULT, VAR_ENGINE]

notes:
  trade-valuation:
    - "The boundary (IMPLEMENTATION_PLAN.md): a trade's MtM stays an input from the upstream engines; what TVAL computes is the valuation totals over any scope, so no field of this per-trade record is marked derived."
  margin-call:
    - "Actual calls and their events are kept (workflow); the expected call (MtM minus collateral minus threshold, then minimum transfer and rounding) is computed and shown beside the call. No stored field is the expected call today."
  position:
    - "Positions are derived by Drishti when a date loads (docs/contracts/VAR.md section 3.7), by the market-risk pack's positions: rules (securities by book and security id, listed by book and contract, OTC by book and trade), and served from the VaR engine's memory by the var-positions connector: no upstream delivers them and nothing stores them. Their VaR figures are computed as the page opens (VAR_ENGINE), never stored."
  portfolio:
    - "The portfolio definitions are an engine input (IMPLEMENTATION_PLAN.md); the figures of the retired stored record (VaR, ES, positions, contributions, P&L) are computed as the page opens (VAR_ENGINE), never stored."
  desk:
    - "The desk's VaR is the engine's (DESK:<id>), computed as the page opens (VAR_ENGINE); VAR_99 and VAR_RESULT left the record in 2.8.0."

review:
  netting-set:
    - "TRADE_COUNT and TRADES[].MTM: confirm TRADE_COUNT is computed from the membership and TRADES[].MTM is read from the trade valuations (an input), not stored here."
    - "LIMIT is copied from the credit limit: confirm it is read from LIM instead of stored."
  credit-limit:
    - "STATUS (Within limit, ...) follows from UTILISATION: confirm it is computed, not set by the limits system."
  collateral-balance:
    - "POSITIONS[].HAIRCUT is a CSA term: confirm it is kept on the holding or read from the CSA."
  frtb-sensitivity:
    - "SENSITIVITIES[] are per-bucket inputs: confirm they become the per-trade sensitivity table (FRTB.md) and are not kept on this record."
  pnl-explain:
    - "ACTUAL is the day-over-day MtM change: confirm it is computed from trade valuations, not delivered."
  sa-ccr:
    - "ALPHA (1.4) is a regulatory parameter: confirm it becomes a setting of the SA-CCR engine."
  exposure-profile:
    - "PATHS, MODEL and CONFIDENCE describe the simulation run: confirm they move to the exposure-path input's run metadata (EXP.md)."
  lei-group: &grouping-release
    - "The release is 2.9.0 or 2.10.0 (Track B, shipped as each is ready): confirm which."
  lei-country: *grouping-release
  sic-sector: *grouping-release
  country-group: *grouping-release
  correlation-matrix: *grouping-release
  us-company:
    - "The ratios (USEQ ratios) become computed from the financial facts (GROUPINGS_AND_ANALYTICS.md): confirm which fields are ratios and mark them derived."
  price-history:
    - "PXH analytics (returns, volatility, beta) become computed (GROUPINGS_AND_ANALYTICS.md): confirm which fields are analytics."
  counterparty:
    - "NET_MTM, PFE_PEAK and NETTING_SETS[].NET_MTM are computed figures on a fundamental master (docs/contracts/README.md section 3): confirm they are removed when NSET's figures are computed (2.10.0)."

# PARKED (product owner, 2026-10-25: "Just fundamentals and VaR is good for now"). The tool does not read this section: these
# kinds stay active and fundamental. Each entry is the plan of record for when the product owner brings it back (docs/contracts/
# README.md section 1; the parked contracts are kept as designs).
parked:
  retiring:
    counterparty-trades: &groupings
      release: 2.9.0
      contract: TRADING_GROUPINGS.md
      measure: the scope engine
      figures: from-derived-connector
    portfolio-trades: *groupings
    legal-entity-trades: *groupings
    index-trades: *groupings
    trade-valuation:
      release: 2.9.0
      contract: TVAL.md
      measure: valuation totals (TVAL)
      figures: []
    stress-result:
      release: 2.9.0
      contract: STR.md
      measure: stress P&L (STR)
      figures: [PNL, BY_BOOK]
    frtb-sensitivity:
      release: 2.9.0
      contract: FRTB.md
      measure: the FRTB standardised charge
      figures: [DELTA_CHARGE, VEGA_CHARGE, CURVATURE_CHARGE, TOTAL, BY_CLASS]
    simm:
      release: 2.9.0
      contract: SIMM.md
      measure: ISDA SIMM
      figures: [TOTAL, POSTED, RECEIVED, RISK_CLASSES]
    pnl-explain:
      release: 2.9.0
      contract: PNL.md
      measure: P&L explain
      figures: [ACTUAL, EXPLAINED, UNEXPLAINED, ATTRIBUTION, EXPLAIN_STEPS]
    sa-ccr:
      release: 2.10.0
      contract: SACCR.md
      measure: SA-CCR
      figures: [REPLACEMENT_COST, ADD_ON, MULTIPLIER, EAD, RWA, ADD_ONS, HEDGING_SETS]
    exposure-profile:
      release: 2.10.0
      contract: EXP.md
      measure: the exposure engine (EXP)
      figures: [EPE, EEPE, PFE_PEAK, BUCKETS]
    cva:
      release: 2.10.0
      contract: CVA.md
      measure: CVA / XVA
      figures: [CVA, DVA, FVA, KVA, CS01, COMPONENTS, SENSITIVITIES]
    lei-group:
      release: 2.9.0 or 2.10.0
      contract: GROUPINGS_AND_ANALYTICS.md
      measure: the GLEIF ownership grouping
      figures: [MEMBERS, MEMBERS_IN_GLEIF, CAPPED, CAP_NOTE, LEVELS, COUNTRIES, LATE_RENEWALS, TREE, ROWS, BY_COUNTRY, BY_LEGAL_FORM]
    lei-country:
      release: 2.9.0 or 2.10.0
      contract: GROUPINGS_AND_ANALYTICS.md
      measure: the GLEIF country grouping
      figures: [ENTITIES, GROUPS_PRESENT, GROUPS_HEADQUARTERED, LAPSED, LATE_RENEWALS, ROWS, ROWS_NOTE, GROUP_ROWS, BY_LEGAL_FORM, BY_CITY]
    sic-sector:
      release: 2.9.0 or 2.10.0
      contract: GROUPINGS_AND_ANALYTICS.md
      measure: the SIC sector grouping
      figures: [COMPANIES, REVENUE, NET_INCOME, ROWS, BY_REVENUE]
    country-group:
      release: 2.9.0 or 2.10.0
      contract: GROUPINGS_AND_ANALYTICS.md
      measure: the country-group aggregation
      figures: [ECONOMIES, GDP_USD_BN, GDP_PER_CAPITA, POPULATION_M, GROWTH, INFLATION, GROWTH_PATH, GDP_PATH, TOP_ECONOMIES]
    correlation-matrix:
      release: 2.9.0 or 2.10.0
      contract: GROUPINGS_AND_ANALYTICS.md
      measure: correlations from price history (CORR)
      figures: [AVERAGE, PAIRS]
  split:
    book:
      release: 2.8.0
      contract: VAR.md
      measure: the scope engine (counts, MtM and DV01 summed from the trades and their valuations)
      figures: [TRADE_COUNT, MTM, DV01, TOP_TRADES]
    trader:
      release: 2.8.0
      contract: VAR.md
      measure: the scope engine (TRDR:, counted from the trades)
      figures: [TRADE_COUNT]
    counterparty:
      release: 2.10.0
      contract: NSET.md
      measure: the counterparty's figures (CPTY:, net MtM from the trade valuations, PFE from EXP)
      figures: [NET_MTM, PFE_PEAK, "NETTING_SETS[].NET_MTM"]
    netting-set:
      release: 2.10.0
      contract: NSET.md
      measure: the netting-set figures (NSET)
      figures: [NET_MTM, COLLATERAL, EE_PEAK, PFE_PEAK, UTILISATION, CVA, PROFILE, BY_ASSET]
    credit-limit:
      release: 2.10.0
      contract: LIM.md
      measure: limit usage (LIM)
      figures: [USED, UTILISATION, STATUS, "BUCKETS[].USED", "BUCKETS[].UTILISATION"]
    counterparty-group:
      release: 2.10.0
      contract: GRP.md
      measure: group utilisation (GRP)
      figures: [UTILISATION]
    collateral-balance:
      release: 2.10.0
      contract: COLL.md
      measure: collateral valuation (COLL)
      figures: [HELD, POSTED, NET, "POSITIONS[].MARKET_VALUE", "POSITIONS[].VALUE"]
    margin-call:
      release: 2.10.0
      contract: MC.md
      measure: the expected margin call (MC)
      figures: []
