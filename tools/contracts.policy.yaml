# What `drishti.py contract bootstrap` (tools/contracts.py) cannot read from the data: the product owner's decisions of 2026-10-25
# (docs/architecture/IMPLEMENTATION_PLAN.md, "The computed-measures roadmap"; docs/contracts/README.md). A draft contract takes its
# class, status and the fields that are computed figures from here; everything else comes from the pack and its data.
#
#   classes      kind -> class when it is not "fundamental" (a kind listed under retiring is "computed")
#   retiring     kinds whose stored version is retired: release, the contract that replaces it (a path under docs/contracts/; VaR's
#                is ../guides/VAR_GUIDE.md and exposure's ../guides/EXPOSURE_GUIDE.md, Part II of each, since their documents were
#                consolidated on 2026-10-26), the measure that computes it, and
#                the fields that are computed figures (path A[].B for a field of every element of list A)
#   split        kinds whose terms are kept and whose figures are computed: status stays active, the figures are derived and retiring
#   retired      kinds retired in a release: removed with their contracts, samples, test data and Sutras; a guard test fails the build
#                when one returns (tools/test_contracts.py; docs/contracts/README.md section 14)
#   removed      kind -> the computed figures removed from its stored record in a release: they never return (the same guard)
#   computed-in-place  kinds whose stored version is retired in a release and which are computed under the same kind, command and ids
#                since (a derived connector): no Delta table, test data, samples or generator writes them again (the same guard)
#   engine-columns  measure -> the columns its engine produces: no input or fundamental kind, test data or sample may carry one
#   notes        kind -> notes copied into the draft
#   review       kind -> questions copied into the draft's review list

classes:
  input: [pnl-vector, scenario-set, risk-hierarchy, portfolio, path-book, path-strip, simulation-run, exposure-path]
  drishti-owned: [position]
  computed: [path-sum, path-sum-java, var-result, var-whatif, exposure-result, var-official, exposure-official-cpty,   # var-official, exposure-official-cpty: the published official VaR and exposure (read only)
             lei-group, lei-country, sic-sector, country-group, correlation-result, equity-beta]   # the groupings and analytics (2.9.2)

retiring: {}

split: {}

retired:
  var:
    release: 2.8.0
    contract: ../guides/VAR_GUIDE.md
    measure: the VaR engine
    note: "VAR <id> and /v/var/<id> open the VaR explorer at the matching scope (VAR-COMM: DESK:COMM)"
  var-node:
    release: 2.8.0
    contract: ../guides/VAR_GUIDE.md
    measure: the VaR engine's official end-of-day captures
    note: "a node's history is its official end-of-day captures; VN-<node> opens the explorer at NODE:<node>"
  exposure-profile:
    release: 2.9.0
    contract: ../guides/EXPOSURE_GUIDE.md
    measure: the exposure engine (exposure-result)
    note: "EXP EXP-<cp>-<le> and /v/exposure-profile/EXP-<cp>-<le> open EXP NSET:NS-<cp>-<le> (the computed kind exposure-result)"

# The groupings and analytics (2.9.2, docs/guides/GROUPINGS_ANALYTICS_GUIDE.md): the stored pages retired, the same commands and ids
# computed from the fundamental data when asked.
computed-in-place:
  lei-group:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    measure: the derived connector gleif-groupings (from lei-entity)
    note: "LEIG <LEI> and /v/lei-group/<LEI> open the group computed from every entity whose LEI_GROUP it is, with no member cap; LEIG ALL the pack-wide page"
  lei-country:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    measure: the derived connector gleif-groupings (from lei-entity)
    note: "LEIC <country> and /v/lei-country/<country> open the country computed from every entity with a legal address there (no 400-row cap); LEIC ALL the directory"
  sic-sector:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    measure: the derived connector us-equities-groupings (from us-company)
    note: "SIC <code> and /v/sic-sector/<code> open the sector computed from its companies (totals of the USD reporters); SIC ALL the directory"
  country-group:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    measure: the derived connector macro-groupings (from economy)
    note: "ECG ECG-<code> and /v/country-group/ECG-<code> open the group computed from its member economies (GDP and population summed, growth GDP-weighted, inflation the median)"

removed:
  us-company:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    figures: [NET_MARGIN, REVENUE_GROWTH, "FINANCIALS[].NET_MARGIN"]
  index-membership:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    figures: ["ROWS[].NET_MARGIN", SECTORS, REVENUE, NET_INCOME, BY_SECTOR]
    top-level: true          # the totals left the record; each member's row keeps its own REVENUE and NET_INCOME (facts)
  financial-fact:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    figures: [CHANGE_PCT, "HISTORY[].CHANGE_PCT"]
  equity:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    figures: [BETA]
  correlation-matrix:
    release: 2.9.2
    contract: ../guides/GROUPINGS_ANALYTICS_GUIDE.md
    figures: [AVERAGE, PAIRS, WINDOW, ESTIMATOR]
  position:
    release: 2.8.0
    contract: ../guides/VAR_GUIDE.md
    figures: [VAR_99, ES_975, COMPONENT_VAR, BOOK_VAR, PCT_OF_BOOK_VAR, PNL, "TRADE_QUANTITIES[].VAR_99", "TRADE_QUANTITIES[].COMPONENT_VAR"]
  desk:
    release: 2.8.0
    contract: ../guides/VAR_GUIDE.md
    figures: [VAR_99, VAR_RESULT]
  legal-entity:
    release: 2.9.2
    contract: ../guides/VAR_GUIDE.md
    figures: ["BOOKS[].VAR"]
  portfolio:
    release: 2.8.0
    contract: ../guides/VAR_GUIDE.md
    figures: [VAR_99, ES_975, LIMIT_USE, POSITION_COUNT, TRADE_COUNT, LONG_COUNT, SHORT_COUNT, GROSS_MV, NET_MV, POSITIONS, BY_PRODUCT,
              BY_CURRENCY, BY_DIRECTION, TOP_CONTRIBUTORS, PNL, ALL_TRADES, SCENARIO_SET_ID]
  netting-set:
    release: 2.9.0
    contract: ../guides/EXPOSURE_GUIDE.md
    figures: [EE_PEAK, PFE_PEAK, PROFILE, EXPOSURE_PROFILE]
  counterparty:
    release: 2.9.0
    contract: ../guides/EXPOSURE_GUIDE.md
    figures: [PFE_PEAK]

engine-columns:
  var: [VAR_99, ES_975, COMPONENT_VAR, BOOK_VAR, PCT_OF_BOOK_VAR, PCT_OF_VAR, HYPO_PNL, EXCEPTIONS_250, VAR_RESULT, VAR_ENGINE,
        "BOOKS[].VAR"]   # a path (A[].B: B of every element of A) where the plain name is too common to guard (legal-entity, 2.9.2)
  exposure: [EPE, EEPE, PFE_PEAK, EE_PEAK, PEAK_PFE, PEAK_EE, EAD_IMM, PFE_95, PFE_99, EXPOSURE_ENGINE, EXPOSURE_PROFILE]
  correlation: [RHO, SHRINKAGE, MIN_RHO, MAX_RHO, FACTOR_STATS]

notes:
  trade-valuation:
    - "The boundary (IMPLEMENTATION_PLAN.md): a trade's MtM stays an input from the upstream engines; what TVAL computes is the valuation totals over any scope, so no field of this per-trade record is marked derived."
  margin-call:
    - "Actual calls and their events are kept (workflow); the expected call (MtM minus collateral minus threshold, then minimum transfer and rounding) is computed and shown beside the call. No stored field is the expected call today."
  position:
    - "Positions are derived by Drishti when a date loads (docs/guides/VAR_GUIDE.md section 15.6), by the market-risk pack's positions: rules (securities by book and security id, listed by book and contract, OTC by book and trade), and served from the VaR engine's memory by the var-positions connector: no upstream delivers them and nothing stores them. Their VaR figures are computed as the page opens (VAR_ENGINE), never stored."
  portfolio:
    - "The portfolio definitions are an engine input (IMPLEMENTATION_PLAN.md); the figures of the retired stored record (VaR, ES, positions, contributions, P&L) are computed as the page opens (VAR_ENGINE), never stored."
  desk:
    - "The desk's VaR is the engine's (DESK:<id>), computed as the page opens (VAR_ENGINE); VAR_99 and VAR_RESULT left the record in 2.8.0."
  legal-entity:
    - "The legal entity's VaR and its books' are the engine's (LE:<id>, BOOK:<id>), computed as the page opens (VAR_ENGINE); BOOKS[].VAR left the record in 2.9.2."
  netting-set:
    - "The netting set's exposure is the exposure engine's (NSET:<id>), computed as the page opens (EXPOSURE_ENGINE); EE_PEAK, PFE_PEAK, PROFILE and the EXPOSURE_PROFILE link left the record in 2.9.0 (EXPOSURE_GUIDE.md section 22). UTILISATION and CVA stay stored (LIM and CVA are parked)."
  counterparty:
    - "The counterparty's peak PFE is the exposure engine's (CPTY:<id>), computed as the page opens (EXPOSURE_ENGINE); PFE_PEAK left the record in 2.9.0 (EXPOSURE_GUIDE.md section 22)."
  simulation-run:
    - "An upstream exposure simulation's record (EXPOSURE_GUIDE.md section 15.2): the grid, the paths, the model; one per run and business date. Drishti reads it; nothing in it is computed by Drishti."
  exposure-path:
    - "One trade's MtM on every path of the run at one grid date (EXPOSURE_GUIDE.md section 15.3), the vector column MTM; sparse by maturity (no row after maturity plus 10 business days). DESK, TT_BOOK, ASSET_CLASS, PRODUCT, NOTIONAL and MATURITY_DATE are denormalised for the scopes and checks (as built, 2.9.0)."

review:
  netting-set:
    - "TRADE_COUNT and TRADES[].MTM: confirm TRADE_COUNT is computed from the membership and TRADES[].MTM is read from the trade valuations (an input), not stored here."
    - "LIMIT is copied from the credit limit: confirm it is read from LIM instead of stored."
  credit-limit:
    - "STATUS (Within limit, ...) follows from UTILISATION: confirm it is computed, not set by the limits system."
  collateral-balance:
    - "POSITIONS[].HAIRCUT is a CSA term: confirm it is kept on the holding or read from the CSA."
  frtb-sensitivity:
    - "SENSITIVITIES[] are per-bucket inputs: confirm they become the per-trade sensitivity table (FRTB.md) and are not kept on this record."
  pnl-explain:
    - "ACTUAL is the day-over-day MtM change: confirm it is computed from trade valuations, not delivered."
  sa-ccr:
    - "ALPHA (1.4) is a regulatory parameter: confirm it becomes a setting of the SA-CCR engine."
  counterparty:
    - "NET_MTM and NETTING_SETS[].NET_MTM are computed figures on a fundamental master (docs/contracts/README.md section 3): confirm they are removed when NSET's figures are computed (2.10.0); PFE_PEAK left in 2.9.0 (the exposure engine's)."

# PARKED (product owner, 2026-10-25: "Just fundamentals and VaR is good for now"). The tool does not read this section: these
# kinds stay active and fundamental. Each entry is the plan of record for when the product owner brings it back (docs/contracts/
# README.md section 1; the parked contracts are kept as designs).
parked:
  retiring:
    counterparty-trades: &groupings
      release: 2.9.0
      contract: TRADING_GROUPINGS.md
      measure: the scope engine
      figures: from-derived-connector
    portfolio-trades: *groupings
    legal-entity-trades: *groupings
    index-trades: *groupings
    trade-valuation:
      release: 2.9.0
      contract: TVAL.md
      measure: valuation totals (TVAL)
      figures: []
    stress-result:
      release: 2.9.0
      contract: STR.md
      measure: stress P&L (STR)
      figures: [PNL, BY_BOOK]
    frtb-sensitivity:
      release: 2.9.0
      contract: FRTB.md
      measure: the FRTB standardised charge
      figures: [DELTA_CHARGE, VEGA_CHARGE, CURVATURE_CHARGE, TOTAL, BY_CLASS]
    simm:
      release: 2.9.0
      contract: SIMM.md
      measure: ISDA SIMM
      figures: [TOTAL, POSTED, RECEIVED, RISK_CLASSES]
    pnl-explain:
      release: 2.9.0
      contract: PNL.md
      measure: P&L explain
      figures: [ACTUAL, EXPLAINED, UNEXPLAINED, ATTRIBUTION, EXPLAIN_STEPS]
    sa-ccr:
      release: 2.10.0
      contract: SACCR.md
      measure: SA-CCR
      figures: [REPLACEMENT_COST, ADD_ON, MULTIPLIER, EAD, RWA, ADD_ONS, HEDGING_SETS]
    cva:
      release: 2.10.0
      contract: CVA.md
      measure: CVA / XVA
      figures: [CVA, DVA, FVA, KVA, CS01, COMPONENTS, SENSITIVITIES]
  split:
    book:
      release: 2.8.0
      contract: ../guides/VAR_GUIDE.md
      measure: the scope engine (counts, MtM and DV01 summed from the trades and their valuations)
      figures: [TRADE_COUNT, MTM, DV01, TOP_TRADES]
    trader:
      release: 2.8.0
      contract: ../guides/VAR_GUIDE.md
      measure: the scope engine (TRDR:, counted from the trades)
      figures: [TRADE_COUNT]
    counterparty:
      release: 2.10.0
      contract: NSET.md
      measure: the counterparty's figures (CPTY:, net MtM from the trade valuations; PFE_PEAK left in 2.9.0, EXP)
      figures: [NET_MTM, "NETTING_SETS[].NET_MTM"]
    netting-set:
      release: 2.10.0
      contract: NSET.md
      measure: the netting-set figures (NSET; EE_PEAK, PFE_PEAK and PROFILE left in 2.9.0, EXP)
      figures: [NET_MTM, COLLATERAL, UTILISATION, CVA, BY_ASSET]
    credit-limit:
      release: 2.10.0
      contract: LIM.md
      measure: limit usage (LIM)
      figures: [USED, UTILISATION, STATUS, "BUCKETS[].USED", "BUCKETS[].UTILISATION"]
    counterparty-group:
      release: 2.10.0
      contract: GRP.md
      measure: group utilisation (GRP)
      figures: [UTILISATION]
    collateral-balance:
      release: 2.10.0
      contract: COLL.md
      measure: collateral valuation (COLL)
      figures: [HELD, POSTED, NET, "POSITIONS[].MARKET_VALUE", "POSITIONS[].VALUE"]
    margin-call:
      release: 2.10.0
      contract: MC.md
      measure: the expected margin call (MC)
      figures: []
