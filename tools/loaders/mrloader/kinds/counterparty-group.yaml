# The counterparty groups (ultimate parents) (docs/guides/BANK_DATA_GUIDE.md section 3.2): the canonical CSV. A group's members are the
# counterparties that name it (their GROUP); its use of the limit is computed by the exposure engine.
format: 1
kind: counterparty-group
source: canonical
about: "The counterparty groups (ultimate parents), one row each: name and the group's own approved limit. Members come from the counterparties."
after: [legal-entity]
on-reject: refuse

inputs:
  main: {option: --csv, required: [GROUP_ID, NAME]}

fields:
  GROUP_ID: {from: GROUP_ID, slug: true, prefix: GRP-}        # "Aldershot" or "GRP-ALDERSHOT": both give GRP-ALDERSHOT
  NAME:     {from: NAME}
  LIMIT:    {from: LIMIT, type: amount}                       # optional: the group's own approved limit, USD

refuse-columns:
  UTILISATION: "limit use is computed by the exposure engine"
  MEMBERS: "the counterparties name their group; the group's members are derived"
