# Today's collateral held and posted, per netting set (docs/guides/BANK_DATA_GUIDE.md section 3.2): the balance's terms in one file, its
# holdings in a child file. The totals (held, posted, net) and each holding's value after haircut are computed.
format: 1
kind: collateral-balance
source: canonical
about: "Today's collateral per netting set and CSA: one record a balance, its holdings (asset, direction, market value, haircut) a list."
after: [netting-set]
on-reject: refuse

inputs:
  main: {option: --csv, required: [BALANCE_ID, CSA, NETTING_SET]}
  children:
    POSITIONS:                           # one row a balance and holding
      option: --child POSITIONS
      on: BALANCE_ID
      required: [ASSET, DIRECTION, MARKET_VALUE, HAIRCUT]
      empty: reject
      unique: [ASSET, DIRECTION]

fields:
  BALANCE_ID:                {from: BALANCE_ID, slug: true, prefix: COLL-}
  AS_OF:                     {from: AS_OF, type: date, default: "{$business_date}"}
  CSA:                       {from: CSA, slug: true, prefix: CSA-}
  NETTING_SET:               {from: NETTING_SET, slug: true, prefix: NS-}
  POSITIONS[].ASSET:         {from: ASSET}
  POSITIONS[].DIRECTION:     {from: DIRECTION, map: {POSTED: Posted, RECEIVED: Received, HELD: Held, Posted: Posted, Received: Received, Held: Held}}
  POSITIONS[].MARKET_VALUE:  {from: MARKET_VALUE, type: amount}
  POSITIONS[].HAIRCUT:       {from: HAIRCUT, type: rate}

refuse-columns:
  HELD: "computed from the holdings"
  POSTED: "computed from the holdings"
  NET: "computed from the holdings"
  VALUE: "market value less haircut, computed"

checks:
  links:
    NETTING_SET: {to: netting-set, policy: refuse}         # collateral of no set is ignored by the engine
