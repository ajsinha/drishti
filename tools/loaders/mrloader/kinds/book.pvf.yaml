# The PVF source's portfolio file (PORTFOLIO_D2, portfolio_d2.csv) as the book master (docs/guides/BANK_DATA_GUIDE.md section 4.1): one book
# per portfolio valid on the date. The ids come from kinds/shared/ids.pvf.yaml, the rules the scenario-PV run uses, so a book here is
# the book of its PV rows. The two columns the PVF join suffixes (_D2: the positions file has them too) are renamed the same way, so the
# shared rules read them unchanged.
format: 1
kind: book
source: pvf
about: "The PVF extract's portfolio file (PORTFOLIO_D2) as the book master: one book per portfolio valid on the date, ids as the PV run builds them."
after: [desk]
on-reject: refuse
use: [shared/ids.pvf]

inputs:
  main:
    option: --csv
    required: [PORTFOLIO_NM, VALID_DT, VALID_TO_DT]
    valid: {from: VALID_DT, to: VALID_TO_DT}                 # only the rows valid on the date (VALID_DT <= date < VALID_TO_DT), as the join
    rename: {PORTFOLIO_NM: PORTFOLIO_NM_D2, PORTFOLIO_ID: PORTFOLIO_ID_D2}

fields:
  BOOK_ID: {use: TT_BOOK}                                    # PORT_100000 -> BOOK-PORT-100000
  NAME:    {from: [PORTFOLIO_DESC, PORTFOLIO_NM_D2]}         # the description, else the portfolio's name
  DESK:    {use: DESK}                                       # DESK_NM, else PORTFOLIO_GROUP_NM; DESK-UNKNOWN when neither
