# Drishti: server + console. Secrets come from the environment or an .env file that is never committed:
#   DRISHTI_TOKEN_SECRET, DRISHTI_SESSION_SECRET (>= 32 characters each)
#   docker compose -f deploy/compose.yaml up
services:
  server:
    image: drishti-server:1.1.0
    build: { context: .., dockerfile: deploy/server.Dockerfile }
    environment:
      DRISHTI_SECURITY_ENABLED: "true"
      DRISHTI_TOKEN_SECRET: ${DRISHTI_TOKEN_SECRET:?set DRISHTI_TOKEN_SECRET}
      DRISHTI_SUTRAS: /opt/drishti/sutras
    volumes:
      - ../sutras:/opt/drishti/sutras:ro
      - ../data/feeds:/opt/drishti/data/feeds:ro
      - drishti-identity:/opt/drishti/data/identity
    ports: ["18480:18480"]
  console:
    image: drishti-console:1.1.0
    build: { context: .., dockerfile: deploy/console.Dockerfile }
    depends_on: [server]
    environment:
      DRISHTI_BACKEND_URL: http://server:18480
      DRISHTI_AUTH_ENABLED: "true"
      DRISHTI_TOKEN_SECRET: ${DRISHTI_TOKEN_SECRET:?set DRISHTI_TOKEN_SECRET}
      DRISHTI_SESSION_SECRET: ${DRISHTI_SESSION_SECRET:?set DRISHTI_SESSION_SECRET}
    ports: ["17480:17480"]
volumes:
  drishti-identity: {}
