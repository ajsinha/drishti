# Delta Lake maintenance (tools/lake/maintain.py): run once, or as a daemon at schedule.at every day.
schedule:
  at: "02:30"                    # after the nightly load, before the day starts
  zone: America/New_York
lakes:
  - root: ./data/delta           # a local lake: every domain, every table
    domains: ["*"]
    keep-business-days: 520      # about two years of business dates; older partitions are deleted (null keeps all)
    max-drop-share: 0.5          # a run that would delete more of a table's rows deletes nothing (--force-drop overrides)
    compact: true                # merge each day's small files
    target-file-mb: 128
    checkpoint: true             # readers replay a short log
    vacuum-hours: 168            # files unreferenced for 7 days are removed; "known at" reaches back 7 days
  # - root: s3://risk-lake/banking      # a lake in S3 or an S3-compatible store
  #   storage-options: { AWS_REGION: us-east-1 }   # credentials from the environment, or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
  #                                                 # AWS_ENDPOINT_URL for S3-compatible stores, AWS_ALLOW_HTTP: "true" for plain http
  #   keep-business-days: 1300
  #   vacuum-hours: 720
