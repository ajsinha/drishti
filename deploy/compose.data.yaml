# The databases the banking packs can read instead of Delta Lake: PostgreSQL 18 and Aerospike Community Edition.
#   docker compose -f deploy/compose.data.yaml up -d
#   uv run --with "psycopg[binary]" python tools/packgen/banking/make_data.py --postgres postgresql://drishti:drishti@localhost:5432/drishti
#   tools/load-aerospike.sh localhost:3000 test
# Then start the server with SPRING_PROFILES_ACTIVE=postgres (or aerospike) and DRISHTI_PACKS=market-risk,counterparty-risk.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: ${DRISHTI_PG_USER:-drishti}
      POSTGRES_PASSWORD: ${DRISHTI_PG_PASSWORD:-drishti}
    ports: ["5432:5432"]
    volumes: [drishti-pg:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"], interval: 5s, retries: 20 }
  aerospike:
    image: aerospike/aerospike-server:latest      # Community Edition; namespace `test`
    ports: ["3000:3000"]
    volumes: [drishti-aerospike:/opt/aerospike/data]
volumes:
  drishti-pg: {}
  drishti-aerospike: {}
