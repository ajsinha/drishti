# The stores the banking packs can read instead of Delta Lake (PostgreSQL 18, Aerospike CE) and a Kafka broker for live trades.
#   docker compose -f deploy/compose.data.yaml up -d
#   uv run --with "psycopg[binary]" python tools/packgen/banking/make_data.py --postgres postgresql://drishti:drishti@localhost:5432/drishti
#   tools/load-aerospike.sh localhost:3000 test
#   uv run --with kafka-python python tools/samplegen/stream.py          (live trades; DRISHTI_STREAM_TRADING=true)
# Then start the server with SPRING_PROFILES_ACTIVE=postgres (or aerospike) and DRISHTI_PACKS=market-risk,counterparty-risk.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: ${DRISHTI_PG_USER:-drishti}
      POSTGRES_PASSWORD: ${DRISHTI_PG_PASSWORD:-drishti}
    ports: ["${DRISHTI_PG_PORT:-5432}:5432"]
    volumes: [drishti-pg:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"], interval: 5s, retries: 20 }
  kafka:
    image: apache/kafka:3.9.1                     # single-node KRaft broker for the trading stream
    ports: ["${DRISHTI_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${DRISHTI_KAFKA_PORT:-9092}   # what clients on the host dial
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_CLEANUP_POLICY: compact
  aerospike:
    image: aerospike/aerospike-server:8.1.2.5     # Community Edition; namespace `test`
    ports: ["${DRISHTI_AEROSPIKE_PORT:-3000}:3000"]
    ulimits: { nofile: { soft: 15000, hard: 15000 } }   # Aerospike will not start with fewer file descriptors
    volumes: [drishti-aerospike:/opt/aerospike/data]
volumes:
  drishti-pg: {}
  drishti-aerospike: {}
