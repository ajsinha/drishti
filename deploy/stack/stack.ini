# The cluster's own settings (deploy/stack/stack.yaml settings-file:), read after its profile (config/profiles/demo.ini), so they win:
# what this lab cluster runs differently from the offline demo. Every node and the console read it.
[stack]
# live news and quotes: this cluster is on a machine with internet (the demo profile is offline)
drishti.offline.enabled=false
DRISHTI_NEWS_ENABLED=true
# linked entities wait up to 3 s before showing as pending (the product default is 40 ms): this lab cluster reads live sources
drishti.graph.link-budget=3s
