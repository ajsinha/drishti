# The local Drishti*net cluster of deploy/stack/ (README.md): every node, its port, packs, lake and the connectors it switches off, and
# the console. drishti.py start cluster reads this file; adding a node is one entry under nodes (its net folder is made from it on the first start).
# No secret here: the keys are in secrets.env (git-ignored), made by drishti.py start cluster on the first start.
# What every node and the console run is a profile (config/profiles/<profile>.ini, the same file the IDE launchers and start --demo read),
# then this cluster's own settings file (a node's off: list becomes an 'enabled: false' override file in that node's own connectors folder, data/stack/nodes/<node>/connectors/; a home: repo node takes no off:, switch its connectors off in config/connectors/); this file holds only what makes it a cluster: the nodes, their ports, packs and lakes, what is off.

# host: 192.168.1.20              # the address every node advertises and the console is given; empty: this machine's primary IPv4
                                   # (the default route's interface, never a docker bridge). Members never advertise 127.0.0.1.
seed: drishti-main                 # the node every other node knows first (its peers/<seed>.yaml); it learns the rest by gossip
profile: demo                      # config/profiles/demo.ini for every node and the console (the IDE's Drishti: run server (demo) reads it too)
settings-file: stack.ini           # beside this file: the cluster's own settings, after the profile (live news, the designer)
admin: drishti-dev-admin           # the administrator drishti.py status asks /api/v1/net/members as (a token signed with DRISHTI_TOKEN_SECRET)

gossip:                            # nodes/<node>/net/gossip.yaml of a new node
  interval: 1s
  suspect-after: 3s
  dead-after: 10s

# The business day: the newest business date of the demo lake (data/delta/demo), found by drishti.py start cluster; set
# DRISHTI_BUSINESS_TODAY in the environment to pin another. The JDK: the one lookup of every tool (drishti.java.home of --settings,
# DRISHTI_JAVA_HOME, JAVA_HOME, the PATH).

lakes:                             # synthetic trades (tools/bench/trades.py), built into data/stack/lakes/<name> when missing, laid out as the demo
                                   # lake file says (config/lakes/demo.yaml); a node with lake: reads that lake file with its root there
  shared: { systems: endur,calypso, per-day: 1500, days: 60, counterparties: 300 }
  murex:  { systems: murex, per-day: 1500, days: 60, counterparties: 300 }

nodes:
  # your own stack: home: repo, so its data is the repository's data/ (the demo lake), exactly as when you start the server from
  # the IDE; its connectors are the modules' templates (with any override of yours in config/connectors/)
  - name: drishti-main
    port: 18480
    home: repo
    heap: 3g
    jvm: [-XX:G1PeriodicGCInterval=60000]
    env: { DRISHTI_COMPUTE_ENABLED: "true" }   # the Python compute workers (the exact what-ifs); its packs and the data inbox are the profile's

  # synthetic ENDUR and CALYPSO trades (ids 10000000+, CLY-30000000+); its data and connectors under data/stack/nodes/drishti-b
  - name: drishti-b
    port: 18791
    heap: 1536m
    lake: shared
    packs: trading
    settings: member.ini            # after the profile: no data inbox on this node (drishti-main runs it)
    off: [trade-murex]
    args: [--drishti.security.registered-users-only=false]

  # synthetic MUREX trades (MX-50000000+)
  - name: drishti-c
    port: 18792
    heap: 1536m
    lake: murex
    packs: trading,counterparty-risk,market-risk
    settings: member.ini
    off: [trade-endur, trade-calypso]
    args: [--drishti.security.registered-users-only=false]

console:
  port: 17480
  servers: [drishti-main]          # the console is given these alone and learns the other servers from the cluster
  settings:
    DRISHTI_CONSOLE_HOST: 0.0.0.0
    DRISHTI_UI_DESIGNER: "true"           # the Sutra designer (Customize, Describe, Outline, Grid; docs/guides/RACHANA_REFERENCE.md 3.31)
