# The content modules the core server ships (docs/architecture/ACCESS_MODEL.md): modules without code of their own (packs, lenses, reports),
# switched, licensed and decided like any other. The core itself is not a module here: it is always on. A word no module declares is a core
# function (BI, PIVOT, FORM, CAL, LE, BOOK ...).
modules:
  - id: economy
    domain: economy
    title: Economy and markets
    about: "Public economic and public-sector data: the IMF and World Bank economy, elections and governments, news and markets; development indicators, central banks, national statistics, the OECD, official press releases and GDELT world events"
    code: false
    feature: economy
    enabled: true
    contributes:
      # the public sector's packs (the owner, 2026-11-07: one module; their own lens, Public sector): each filled daily by its feed
      packs: [world-economy, news-and-markets, world-development, central-banks, national-statistics, oecd, official-news, gdelt-events]
      functions: [ECON, MACRO, FCST, LABR, FISC, ECG, REGE, JUR, PARTY, OFFC, ELEC, REGN, SOCI, TOPIC, NEWS, CO, QUOTE,
        WDI, WDIS, CBANK, CBSER, NSTAT, OECD, OECDS, PRESS, PREL, GDELT]
  # market data (the owner, 2026-11-10: in both Drishti Risk and Drishti Finance): curves, FX, quotes and surfaces, their own module
  # (modules/market-data); banking requires it, because its engines read the curves and surfaces.
  - id: market-data
    domain: market-data
    title: Market data
    about: "Curves, volatility surfaces, FX, equities, credit, inflation, commodities, fixings and bonds"
    code: false
    feature: market-data
    enabled: true
    contributes:
      packs: [market-data]
      functions: [MKT, CRV, REPO, FX, FXF, FXV, IRV, CPV, EQ, EQX, DIV, EQV, CDS, INF, INFC, CMD, CMDC, CMDV, FIX, BND, CORR, CORRC, EQB]
  # capital markets (the owner, 2026-11-07): listed companies and funds (modules/capital-markets). GLEIF's legal entities are core
  # reference data (every domain uses them).
  - id: capitalmarkets
    domain: capitalmarkets
    title: Capital markets
    about: "US equities (SEC EDGAR filings and facts, indices, prices), funds and ETFs"
    code: false
    feature: capitalmarkets
    enabled: true
    contributes:
      packs: [us-equities, funds]
      functions: [USEQ, IDX, SIC, EDGAR, FILING, FACT, PXH, FUND, HELD, TRACK]
