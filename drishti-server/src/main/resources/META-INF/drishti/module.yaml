# The content modules the core server ships (docs/architecture/ACCESS_MODEL.md): modules without code of their own (packs, lenses, reports),
# switched, licensed and decided like any other. The core itself is not a module here: it is always on. A word no module declares is a core
# function (BI, PIVOT, FORM, CAL, LE, BOOK ...).
modules:
  - id: economy
    domain: economy
    title: Economy and markets
    about: "Public economic and public-sector data: the IMF and World Bank economy, elections and governments, news and markets"
    code: false
    feature: economy
    enabled: true
    contributes:
      packs: [world-economy, news-and-markets]
      functions: [ECON, MACRO, FCST, LABR, FISC, ECG, REGE, JUR, PARTY, OFFC, ELEC, REGN, SOCI, TOPIC, NEWS, CO, QUOTE]
  # capital markets (the owner, 2026-11-07): listed companies, funds, and the market data's prices, curves and volatilities as functions.
  # The market-data pack itself stays the banking module's while the banking engines read it (it moves here when banking can require this
  # module); its commands are this module's functions already. GLEIF's legal entities are core reference data (every domain uses them).
  - id: capitalmarkets
    domain: capitalmarkets
    title: Capital markets
    about: "US equities (SEC EDGAR filings and facts, indices, prices), funds and ETFs, and the market data's functions (curves, FX, vols, equities, bonds)"
    code: false
    feature: capitalmarkets
    enabled: true
    contributes:
      packs: [us-equities, funds]
      functions: [USEQ, IDX, SIC, EDGAR, FILING, FACT, PXH, FUND, HELD, TRACK, CRV, REPO, FX, FXF, FXV, IRV, CPV, EQ, EQX, DIV, EQV, CDS, INF, INFC, CMD, CMDC, CMDV, FIX, BND, CORR, CORRC, EQB]
