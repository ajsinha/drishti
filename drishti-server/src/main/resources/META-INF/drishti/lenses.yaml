# The lenses the core server ships (docs/architecture/ACCESS_MODEL.md, docs/lenses/): the core's own and the economy module's. Each names
# the modules it needs (offered only while they are all on) and the functions it bundles. A domain module ships its own lenses in its jar.
lenses:
  - id: world
    title: World
    modules: [economy]                 # the World edition also opens us-equities and funds: capital markets' functions, on while that module is
    home: home/world_landing.html
    functions: [ECON, MACRO, FCST, LABR, FISC, ECG, REGE, JUR, PARTY, OFFC, ELEC, REGN, SOCI, TOPIC, NEWS, CO, QUOTE, USEQ, IDX, SIC, EDGAR, FILING,
      FACT, PXH, LEI, LEIG, LEIR, LEIC, LEIM, FUND, HELD, TRACK,
      PRESS, PREL, GDELT]               # the public sector's free news (official press releases, GDELT world events), on while that module is
  # the public-sector module's lens: development indicators, central banks, national statistics, the OECD, official news, world events
  - id: publicsector
    title: Public sector
    modules: [publicsector]
    functions: [WDI, WDIS, CBANK, CBSER, NSTAT, OECD, OECDS, PRESS, PREL, GDELT]
  - id: cio
    title: Chief information officer
    modules: []
    functions: []
  - id: oversight
    title: Oversight
    modules: []
    functions: []
