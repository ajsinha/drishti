# Profile `postgres` (SPRING_PROFILES_ACTIVE=postgres): the banking packs' data domains are read from PostgreSQL
# Profile `files` (SPRING_PROFILES_ACTIVE=files): the banking packs' data domains are read from JSON-lines files, one
# per kind per business day (<root>/<domain>/<yyyy-MM-dd>/<kind>.jsonl, written by tools/load-files.sh), instead of
# Delta Lake. The packs still decide the kinds, routes, modes and promoted columns of each <domain>-store connector;
# this profile only changes the store.
drishti:
  sources:
    connectors:
      reference-store:  { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
      market-store:     { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
      trading-store:    { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
      risk-store:       { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
      credit-store:     { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
      collateral-store: { plugin: file, settings: { root: "${DRISHTI_FILES_ROOT:./data/files}" } }
