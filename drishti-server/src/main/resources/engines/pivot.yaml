# config/engines/pivot.yaml: the pivot engine (docs/guides/PIVOT_GUIDE.md). Read at start, imported by application.yaml after the jar's copy of this
# file, so a key here wins over the shipped one and application.local.yaml and the environment win over both
# (docs/architecture/COMPUTE_ENGINES.md section 3). Admin -> Engines writes the switch and changed: only; every other key is edited here.
drishti:
  engines:
    pivot:
      enabled: ${DRISHTI_PIVOT_ENGINE_ENABLED:true}   # run the pivot engine on this node: /api/v1/pivot, PIVOT, Views -> Pivot, drishti.py pivot (live); its old name drishti.pivot.enabled still works
      changed: { by: "", at: "", reason: "" }   # the last change made from Admin -> Engines or drishti.py (written by the server)
  pivot:                             # the pivot engine (docs/guides/PIVOT_GUIDE.md); the Pivot tab's keys stay in application.yaml
    max-cells: 20000                 # visible cells a view may have, totals included; over it: refused with the count (DRS-5702), never cut short
    max-holistic-cells: 5000         # the same for a view with a holistic measure (VaR, an exact median, an exact distinct count)
    busy-cells: 2000                 # a view of more cells asks busy protection before it opens deeper levels (DRS-9507)
    cache-mb: 512                    # the partial-state cache, weighed in bytes, in the one memory budget (pivot.states)
    provenance-kept: 500             # answers whose provenance (per cell) is kept for the popover
    local-shards: 1                  # split a mergeable plan into this many parts on this node and merge them in a fixed order (1: one pass)
    stage-max-rows: 5000000          # the most rows of one table read for a pivot (a table over it is refused in words, never cut short)
    stage-keep: 16                   # tables read for pivots kept in the executor (least recently used dropped)
    duckdb:
      connections: 0                 # statements at once (0: one per four cores)
      threads: 0                     # DuckDB's threads per statement (0: its default)
      memory-limit-mb: 4096          # DuckDB's memory limit
      temp-directory: ""             # where DuckDB may spill (blank: nowhere, so memory-only data is never written)
    estimate:
      confirm-above-seconds: 60      # an estimate over this asks the person first
      confirm-above-rows: 500000000  # an estimate over this many rows asks the person first
    aggregate-only:
      min-members-per-cell: 1        # a cell with fewer members shows no figures (1: no limit; a site may set 5)
    export:
      xlsx-max-rows: 1000000         # the most rows of an xlsx export (Excel holds 1,048,576 a sheet): over it, CSV or Arrow is offered
      rows-max: 1000000              # the most member rows an export of the underlying rows writes
    sketches:                        # distinct counts, percentiles and top values with a stated error (PIVOT_GUIDE.md, scale)
      hll-precision: 12              # HyperLogLog: 2^p registers (11 to 16); 12: 4,096 registers, ±1.6% (1.04/√m)
      kll-k: 200                     # KLL's k: ±1.65% of rank at 200 (with SQL's quantile points ±1.8%)
      top-capacity-factor: 10        # Space-Saving keeps this many counters per value shown by top(x, n)
      approximate-above-rows: 10000000   # a view reading more rows answers count_distinct, median and percentile by their sketches (≈; exact on request); 0: never by size
    progressive:                     # ≈ first, then exact (never for VaR or any holistic measure)
      enabled: true                  # false: one exact answer only
      after-ms: 2000                 # a view estimated over this answers ≈ from a sample first
      sample-fraction: 0.02          # the share of rows the first answer reads
    rollups:                         # rollups of partial states, refreshed on load, chosen automatically (aggregate awareness)
      enabled: true                  # rollups answer views and are refreshed
      refresh-seconds: 60            # how often each rollup's source version is checked: a load is merged in within this
      advise-after-scans: 10         # a grain scanned this many times is proposed as a rollup (GET /api/v1/pivot/rollups, advice)
      dir: ""                        # where rollups are kept (blank: <data dir>/pivot/rollups)
      definitions: []                # rollups: {id, source, grain: [DESK, TRADE_DATE:month], functions: [sum(NOTIONAL_USD), count()], dates: latest|all}
    cluster:                         # a view's partial states computed on every node running the engine and merged in node order
      enabled: true                  # false: this node computes its views alone
      hedge-after-seconds: 20        # a node's share not answered by then is asked of the next node too; the first answer wins
      deadline-seconds: 300          # a share with no answer by then refuses the view in words (DRS-5720), never a partial figure
      min-rows: 5000000              # views estimated under this many rows stay on this node
