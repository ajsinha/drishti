# Profile `dev` (--spring.profiles.active=dev, SPRING_PROFILES_ACTIVE=dev, or beside another: dev,duckdb): local development only.
# Sign-in off unless DRISHTI_SECURITY_ENABLED says otherwise, and the development admin (drishti-dev-admin) seeded on the first start
# with no users. Never in production: there security is on by default and the server refuses to start without DRISHTI_TOKEN_SECRET.
drishti:
  security:
    enabled: ${DRISHTI_SECURITY_ENABLED:false}
  identity:
    seed-admin: ${DRISHTI_SEED_ADMIN:true}
