     source: "The operating system and its own services."}
  - {name: "ConsoleGB", value: 1, unit: "GB", status: "estimate",
     source: "The console's 4 worker processes on the same machine."}
  - {name: "RamStepGB", value: 8, unit: "GB", status: "formula",
     source: "RAM recommendations are rounded up to a multiple of this."}
  - {name: "MeasuredCores", value: 12, unit: "cores", status: "measured",
     source: "The benchmark machine: nproc says 24 hardware threads, 12 cores of 2 threads each (BENCHMARK.md 3). Cores in Results are physical cores."}
  - {name: "ReqPerCoreTrades", value: 22.5, unit: "requests/s a core", status: "measured",
     source: "REQ/S PER CORE, trade questions (trades, counterparty pages, netting sets, searches). BENCHMARK.md 4.3, trades only: 270 requests a second at 50 users on 12 cores."}
  - {name: "ReqPerCoreVarAtRef", value: 11.56, unit: "requests/s a core", status: "calibrated",
     source: "REQ/S PER CORE, VaR questions at 1,000,000 positions. The users run: 183.3 requests a second at 50 users on 12 cores, 0 failures, p95 0.6 to 1.1 s, 50.5% of them VaR (5,582 of 11,050); with trade questions at 22.5 a core, the VaR ones are 11.56 a core. 137.5 a second at 100 users and 123.8 at 200 (queueing: p95 about 2 and 5 s)."}
  - {name: "VarRefPositions", value: 1000000, unit: "positions", status: "formula",
     source: "The size the VaR rate above was measured at."}
  - {name: "VarCostExponent", value: 1.0, unit: "exponent", status: "estimate",
     source: "How a VaR question's cost grows with positions away from 1,000,000 (1: in proportion; the bank minus a desk reads every position)."}
  - {name: "CpuTarget", value: 0.7, unit: "share", status: "estimate",
     source: "Plan the cores to be 70% busy at the peak, so queues stay short."}
  - {name: "CoresReserve", value: 2, unit: "cores", status: "estimate",
     source: "Cores kept for a date's load, the collector and the operating system."}
  - {name: "MinCores", value: 4, unit: "cores", status: "estimate",
     source: "The fewest cores recommended."}
  - {name: "FirstOpenSecPer1M", value: 18.5, unit: "s", status: "measured",
     source: "Re-benchmark: a date's first open took 18 to 19 s at 1,000,000 positions."}
  - {name: "LakeLoadSecPer1M", value: 14.2, unit: "s", status: "measured",
     source: "Re-benchmark: the lake load took 28.4 s for two dates of 1,000,000 vectors."}
  - {name: "ReopenSecPer1M", value: 0.25, unit: "s", status: "estimate",
     source: "BENCHMARK.md 5.1: reopening a date from its hot file, about 0.25 s a million trades."}

results:
  - band: "Heap: one VaR book (VAR_GUIDE.md 27.1, term by term)"
    rows:
      - {name: "HbRuns", label: "Node members as runs", unit: "MB",
         expression: "BytesPerRun*RunsPerNode*Nodes/BytesPerMB",
         why: "8·R: each node's books and cells kept as runs of positions."}
      - {name: "HbNames", label: "Names, runs, nodes", unit: "MB",
         expression: "BytesPerNamedRow*(BooksCells+Nodes)/BytesPerMB",
         why: "~150·(B + K + N): book and cell names and runs, the nodes and their book lists."}
      - {name: "HbAggIndex", label: "Index of the aggregates", unit: "MB",
         expression: "BytesPerAggIndexRow*(BooksCells+Nodes)/BytesPerMB",
         why: "64·A: the aggregates themselves stay in the hot file; the heap keeps where each row is."}
      - {name: "HbColumns", label: "Columns and position runs", unit: "MB",
         expression: "(BytesPerTradeCols*Trades+BytesPerPositionCols*Positions)/BytesPerMB",
         why: "108·T + 136·P: the coded columns, the position runs, positionOf, the id indexes."}
      - {name: "HbIds", label: "Trade and position ids", unit: "MB",
         expression: "BytesPerId*(2*Trades+3*Positions)/BytesPerMB",
         why: "72·(2T + 3P): the ids and the high-cardinality dictionaries; the largest term."}
      - {name: "HbCtot", label: "Per-currency totals of every node", unit: "MB",
         expression: "BytesPerCtotValue*(Scenarios+1)*Nodes*TradeCcysPerNode/BytesPerMB",
         why: "8·(S + 1)·N·C: each node's totals per trade currency, in float64."}
      - {name: "HbPortfolios", label: "Portfolio definitions", unit: "MB",
         expression: "(BytesPerPortfolio*Portfolios+BytesPerBasketMember*BasketMembers)/BytesPerMB",
         why: "About 30 MB at 15,000 portfolios and 2 million basket members."}
      - {name: "HbFormula", label: "One book by the formula", unit: "MB",
         expression: "HbRuns+HbNames+HbAggIndex+HbColumns+HbIds+HbCtot+HbPortfolios",
         why: "The sum of the terms above."}
      - {name: "JavaHeapFactor", label: "Java version factor", unit: "factor",
         expression: "IF(JavaVersion>=25,Java25HeapFactor,1)",
         why: "Compact object headers on Java 25 save a little (the heap is mostly arrays)."}
      - {name: "HeapBook", label: "One book, calibrated", unit: "MB",
         expression: "HbFormula*BookHeapCalibration*JavaHeapFactor",
         why: "The formula scaled to what the 1,000,000-position re-benchmark measured."}
      - {name: "BooksPerDate", label: "Books a date", unit: "books",
         expression: "1+CcysAhead+StressOn",
         why: "The USD book, one more per reporting currency built ahead, one for the stress set."}
      - {name: "HeapDate", label: "One date", unit: "MB",
         expression: "HeapBook*BooksPerDate",
         why: "H_date ≈ H_book × (1 + currency books + stress book)."}
      - {name: "DatesInMemory", label: "Dates in memory", unit: "dates",
         expression: "MAX(HotDates,PinnedMem+ProtectedAlways)",
         why: "hot-dates, unless the protected dates (pinned + the newest + the one just used) are more."}
      - {name: "DatesAtPeak", label: "Dates at the peak", unit: "dates",
         expression: "DatesInMemory+1",
         why: "While a new date opens, the date it pushes out stays open until its readers finish."}
      - {name: "HeapDates", label: "All open dates", unit: "MB",
         expression: "DatesAtPeak*HeapDate",
         why: "Dates at the peak × one date."}
      - {name: "IntradayUpdatesDay", label: "Intraday updates a day", unit: "updates",
         expression: "IntradayBatches*UpdatesPerBatch",
         why: "Batches a day × updates per batch."}
      - {name: "IntradayTrades", label: "Trades changed by the day's layer", unit: "trades",
         expression: "MIN(Trades,IntradayUpdatesDay*IntradayDistinctShare)",
         why: "The layer keeps each changed trade's latest P&L only, so it grows with the trades changed, not the batches."}
      - {name: "HeapIntradayTrades", label: "Intraday layer: changed trades", unit: "MB",
         expression: "IntradayTrades*(IntradayTradeCopies*AggBytes*Scenarios+IntradayTradeOverheadB)/BytesPerMB",
         why: "Three float64 vectors a changed trade (its difference, its P&L, its USD P&L) and its entries."}
      - {name: "HeapIntradayAggs", label: "Intraday layer: changed aggregates", unit: "MB",
         expression: "IF(IntradayTrades>0,(BooksCells+Nodes)*AggBytes*Scenarios*IntradayAggShare/BytesPerMB,0)",
         why: "Every book and node above a changed trade holds its changed aggregate on the heap (the morning's stays in the hot file)."}
      - {name: "HeapIntradayTotals", label: "Intraday layer: currency totals", unit: "MB",
         expression: "IF(IntradayTrades>0,Nodes*TradeCcysPerNode*(Scenarios+1)*AggBytes/BytesPerMB,0)",
         why: "The per-trade-currency totals' changes, per node and currency."}
      - {name: "HeapIntraday", label: "Intraday layers (today's date)", unit: "MB",
         expression: "(1+CcysAhead)*(IF(IntradayTrades>0,IntradayLayerMB,0)+HeapIntradayTrades+HeapIntradayAggs+HeapIntradayTotals)",
         why: "About 5 MB and the updates per layer (VAR_GUIDE.md 27.1); the USD book and each currency book carry one."}
      - {name: "IntradayApplyMB", label: "Applying a batch", unit: "MB",
         expression: "IF(IntradayTrades>0,(1+CcysAhead)*(UpdatesPerBatch*(2*AggBytes*Scenarios+IntradayUpdateOverheadB)/BytesPerMB+HeapIntradayAggs),0)",
         why: "A batch's updates in flight, and the layer's aggregates copied (the previous book stays readable until its requests finish)."}
      - {name: "HeapFirstOpen", label: "Warmed by the first date", unit: "MB",
         expression: "FirstOpenOnceMB*Positions/Scale1M*JavaHeapFactor",
         why: "What the first open warms once (answers, views, connector caches)."}
  - band: "Heap: exposure"
    rows:
      - {name: "ExpOpenDateMB", label: "One open exposure date", unit: "MB",
         expression: "ExposureOn*ExpTrades*ExpOpenBytesPerTrade/BytesPerMB",
         why: "The sets and trades of a date; its matrices are mapped, not on the heap."}
      - {name: "HeapExposure", label: "Exposure dates and paths cache", unit: "MB",
         expression: "ExpHotDates*ExpOpenDateMB+ExposureOn*ExpPathsCacheMB",
         why: "Exposure dates in memory × one date, and the 256 MB trade-paths cache."}
      - {name: "ExpLoadMB", label: "Loading an exposure date", unit: "MB",
         expression: "ExposureOn*NettingSets*Paths*TimeSteps*ExpLoadBytesPerValue/BytesPerMB",
         why: "Every netting set's value matrix in float64 while the date loads."}
  - band: "Heap: the server, caches and users"
    rows:
      - {name: "HeapBase", label: "The server at start", unit: "MB",
         expression: "(BaseFixedMB+BasePerPositionB*Positions/BytesPerMB)*JavaHeapFactor",
         why: "Measured after GC with no date open: the lake's footers' residue and the entity index grow with positions."}
      - {name: "FooterCacheMB", label: "Parquet footer cache", unit: "MB",
         expression: "MAX(FooterCacheDefaultMB,CEILING(TradeRowsPerDay*TradeDaysKept/RowsPerRowGroup*ColumnsPerTable*FooterBytesPerChunk/BytesPerMB,1))",
         why: "64 MB, or the footers of every trade table kept when they are more."}
      - {name: "HeapSearch", label: "Type-ahead index", unit: "MB",
         expression: "MIN(SearchIndexCapMB,TradeRowsPerDay*SearchBytesPerRow/BytesPerMB)",
         why: "The kept day's index of trade rows, capped by index.max-memory."}
      - {name: "HeapBiCaches", label: "BI, history and VaR answer caches", unit: "MB",
         expression: "BiQueryCacheMB+BiPlanAnswersMB+HistoryCacheMB+VarAnswersMB",
         why: "Each cache at its budget."}
      - {name: "HeapTradeRows", label: "Trade rows beyond the measured", unit: "MB",
         expression: "MAX(0,TradeRowsPerDay-BaseTradeRows)*TradeCacheBytesPerRow/BytesPerMB",
         why: "The trade connectors' working set for rows above the 60,000 a day already in the start heap."}
      - {name: "HeapUsers", label: "Requests in flight", unit: "MB",
         expression: "Users*PerUserMB",
         why: "Working memory per concurrent user (measured: about 2.5 MB)."}
      - {name: "HeapSteady", label: "Heap after GC, all dates open", unit: "MB",
         expression: "HeapBase+FooterCacheMB+HeapFirstOpen+HeapDates+HeapIntraday+HeapExposure+HeapSearch+HeapBiCaches+HeapTradeRows+HeapUsers",
         why: "What survives a collection at the busiest steady moment."}
      - {name: "HeapLoadTransient", label: "Loads in progress", unit: "MB",
         expression: "LoadThreads*(PerLoadMBAt1M*Positions/Scale1M+ReadBufferMB)+ExpLoadMB+IntradayApplyMB",
         why: "Each load thread's build (1.6 GB at 1,000,000 positions) and read buffer, an exposure load and an intraday batch being applied."}
  - band: "The heap to set"
    rows:
      - {name: "XmxRawMB", label: "Heap needed", unit: "MB",
         expression: "HeapSteady/LiveShare+HeapLoadTransient",
         why: "The steady heap with the collector's 39% headroom, plus the loads."}
      - {name: "XmxGB", label: "Recommended -Xmx", unit: "GB",
         expression: "CEILING(XmxRawMB/1024,1)",
         why: "Rounded up to a whole GB."}
      - {name: "OopsMode", label: "Compressed object references", unit: "text",
         expression: "IF(XmxGB<=CompressedOopsMaxGB,\"on: the heap is under 32 GB\",IF(XmxGB<=AlignedOopsMaxGB,\"on only with -XX:ObjectAlignmentInBytes=16 (added below)\",\"off: past 64 GB, plan a cluster\"))",
         why: "Under 32 GB Java uses 4-byte references; from 32 GB they double unless objects align to 16 bytes (up to 64 GB)."}
      - {name: "GcChoice", label: "Garbage collector", unit: "text",
         expression: "IF(Collector=\"auto\",IF(XmxGB>=ZgcFromGB,\"ZGC\",\"G1\"),Collector)",
         why: "Generational ZGC from 16 GB of heap, G1 below (RESOURCES_AND_SCALE.md 5.5)."}
  - band: "Page cache and RAM"
    rows:
      - {name: "TmatRows", label: "Trade rows of shared positions", unit: "rows",
         expression: "IF(Trades>Positions,TradesPerFungible*(Trades-Positions)/MAX(TradesPerFungible-1,1),0)",
         why: "Trades of positions that hold several get rows of their own in the hot file."}
      - {name: "HotFileBookMB", label: "Hot file of one book", unit: "MB",
         expression: "(Positions*Scenarios*HotRowBytes+TmatRows*Scenarios*HotRowBytes+(BooksCells+Nodes)*Scenarios*AggBytes+Nodes*TradeCcysPerNode*(Scenarios+1)*AggBytes+HotSmallBytesPerTrade*Trades)/BytesPerMB",
         why: "P·S·4 + Q·S·4 + A·S·8 + N·C·(S+1)·8 + the small sections (VAR_GUIDE.md 27.1)."}
      - {name: "StressFileMB", label: "Hot file of the stress book", unit: "MB",
         expression: "StressOn*HotFileBookMB*StressScenarios/Scenarios",
         why: "The stress set's book, about 250 scenarios."}
      - {name: "HotFileDateMB", label: "Hot files of one date", unit: "MB",
         expression: "HotFileBookMB*(1+CcysAhead)+StressFileMB",
         why: "The USD book, each currency book and the stress book."}
      - {name: "ExpHotFileMB", label: "Exposure hot file of a date", unit: "MB",
         expression: "ExposureOn*(NettingSets*Paths*TimeSteps*ExpHotBytesPerValue+ExpTrades*ExpHotBytesPerTrade)/BytesPerMB",
         why: "V and E in float32 and the sets and trades."}
      - {name: "PageCacheMB", label: "Page cache for the open dates", unit: "MB",
         expression: "(DatesInMemory*HotFileDateMB+ExpHotDates*ExpHotFileMB)*ResidentShare",
         why: "The open dates' hot files resident while people read them."}
      - {name: "NativeMB", label: "Native memory beside the heap", unit: "MB",
         expression: "MetaspaceCodeMB+DirectMaxMB+OtherNativeMB",
         why: "Metaspace and code, direct buffers at their cap, threads, the collector and the allocator."}
      - {name: "RssPlannedMB", label: "Resident memory planned", unit: "MB",
         expression: "XmxGB*1024+NativeMB+PageCacheMB",
         why: "RSS = heap (fully committed over a long run) + native + the page cache of the open dates."}
      - {name: "RamRecommendedGB", label: "Recommended machine RAM", unit: "GB",
         expression: "CEILING(RssPlannedMB/1024+OsReserveGB+ConsoleGB,RamStepGB)",
         why: "RSS + the operating system + the console, rounded up to 8 GB."}
      - {name: "RamMinimumGB", label: "Smallest workable RAM", unit: "GB",
         expression: "CEILING(XmxGB+NativeMB/1024+OsReserveGB+ConsoleGB+HotFileDateMB/1024,RamStepGB)",
         why: "Only the date being read resident: it works, but other dates read from disk first (slower)."}
  - band: "Disk, by folder"
    rows:
      - {name: "LakeDates", label: "Business dates in the lake", unit: "dates",
         expression: "LakeYears*BusinessDaysYear",
         why: "Years kept × 252."}
      - {name: "LakeVarDateMB", label: "VaR lake, one date", unit: "MB",
         expression: "Trades*Scenarios*LakeBytesPerValue/BytesPerMB*(1+StressOn*StressScenarios/Scenarios)",
         why: "The P&L vectors as Parquet (2.8 GB for two dates at 1,000,000)."}
      - {name: "DiskLakeVarGB", label: "VaR lake (the lake folder)", unit: "GB",
         expression: "LakeDates*LakeVarDateMB/1024",
         why: "Every date kept."}
      - {name: "HotDatesOnDisk", label: "VaR hot files kept", unit: "dates",
         expression: "MIN(LakeDates,DiskDates)+PinnedDisk",
         why: "disk-dates (60) and the pinned dates on disk."}
      - {name: "DiskHotGB", label: "VaR hot files (var/hot)", unit: "GB",
         expression: "(HotDatesOnDisk*(HotFileBookMB+StressFileMB)+CcysAhead*MIN(HotDatesOnDisk,CurrencyRetentionDates)*HotFileBookMB)/1024",
         why: "Each kept date's book and stress book; currency books for the 5 newest dates."}
      - {name: "DiskSpillGB", label: "Spill and temporary files (tmp/server)", unit: "GB",
         expression: "LoadThreads*SpillFactor*HotFileBookMB/1024",
         why: "The disk guard reserves 3 × the largest hot file for each load running."}
      - {name: "DiskExpHotGB", label: "Exposure hot files (ccr/hot)", unit: "GB",
         expression: "MIN(LakeDates,ExpDiskDates)*ExpHotFileMB/1024",
         why: "60 dates of exposure hot files."}
      - {name: "DiskExpLakeGB", label: "Exposure trade paths (the lake)", unit: "GB",
         expression: "ExposureOn*MIN(LakeDates,ExpPathDaysKept)*ExpTrades*Paths*TimeSteps*ExpPathBytes/BytesPerMB/1024",
         why: "20 business days of trade paths in float32."}
      - {name: "DiskIntradayLakeGB", label: "Intraday batches in the lake", unit: "GB",
         expression: "LakeDates*IntradayUpdatesDay*Scenarios*LakeBytesPerValue/BytesPerMB/1024",
         why: "Each batch is appended to the P&L lake (the record: a restart rebuilds the layer from it); the layer itself is never written to disk."}
      - {name: "DiskIntradayTmpGB", label: "An intraday batch file (tmp)", unit: "GB",
         expression: "UpdatesPerBatch*Scenarios*IntradayJsonBytesPerValue/BytesPerMB/1024",
         why: "One batch's JSON Lines under tmp while lake build appends it; no spill (the layer stays in memory)."}
      - {name: "DiskTradesLakeGB", label: "Trades lake", unit: "GB",
         expression: "TradeRowsPerDay*TradeDaysKept*TradeLakeBytesPerRow/BytesPerMB/1024",
         why: "About 1.5 KB a trade a day."}
      - {name: "DiskTradeCachesGB", label: "Trade connectors' caches (cache/, derived/, index/)", unit: "GB",
         expression: "(TradeRowsPerDay*TradeDaysKept*IdMapBytesPerRow+TradeRowsPerDay*MIN(TradeDaysKept,GroupedPagesDates)*GroupedPagesBytesPerRow)/BytesPerMB/1024+TradeConnectors*(DocCacheGB+IndexDiskGB)",
         why: "Id maps, grouped pages, the document cache and the type-ahead index of each connector."}
      - {name: "DiskBiGB", label: "BI layers and runs (bi-store, bi-runs)", unit: "GB",
         expression: "TradeRowsPerDay*TradeDaysKept*BiLayerBytesPerRow/BytesPerMB/1024+BiRunsGB",
         why: "Layers of the dates read, and the runs' 20 GB."}
      - {name: "DiskLogsGB", label: "Logs (logs)", unit: "GB",
         expression: "LogsGB",
         why: "The server log and the GC log, both rotated."}
      - {name: "DiskDumpsGB", label: "Heap dumps (dumps)", unit: "GB",
         expression: "DumpsKept*XmxGB",
         why: "A dump on OutOfMemoryError is about the heap's size."}
      - {name: "DiskUsedGB", label: "Disk in use", unit: "GB",
         expression: "DiskLakeVarGB+DiskIntradayLakeGB+DiskIntradayTmpGB+DiskHotGB+DiskSpillGB+DiskExpHotGB+DiskExpLakeGB+DiskTradesLakeGB+DiskTradeCachesGB+DiskBiGB+DiskLogsGB+DiskDumpsGB",
         why: "Every folder together."}
      - {name: "DiskRecommendedGB", label: "Recommended disk (lake local)", unit: "GB",
         expression: "CEILING(MAX(DiskUsedGB/(1-MinFreePercent/100),DiskUsedGB+MinFreeGB),DiskStepGB)",
         why: "With the free-space guard's margin: 10% and 20 GB must stay free."}
      - {name: "DiskLocalGB", label: "Local disk without the lakes", unit: "GB",
         expression: "DiskUsedGB-DiskLakeVarGB-DiskIntradayLakeGB-DiskTradesLakeGB-DiskExpLakeGB",
         why: "When the lakes live elsewhere (object storage): hot files, spill, caches, logs, dumps."}
      - {name: "DiskLocalRecommendedGB", label: "Recommended local disk (lake elsewhere)", unit: "GB",
         expression: "CEILING(MAX(DiskLocalGB/(1-MinFreePercent/100),DiskLocalGB+MinFreeGB),DiskStepGB)",
         why: "Fast local disk (NVMe) for the hot files."}
  - band: "CPU and times"
    rows:
      - {name: "VarRatePerCore", label: "VaR questions a second a core", unit: "requests/s",
         expression: "ReqPerCoreVarAtRef*(VarRefPositions/Positions)^VarCostExponent",
         why: "The rate measured at 1,000,000 positions, scaled by positions."}
      - {name: "MixRatePerCore", label: "Mixed requests a second a core", unit: "requests/s",
         expression: "1/(VarShare/VarRatePerCore+(1-VarShare)/ReqPerCoreTrades)",
         why: "The VaR and other questions in their shares."}
      - {name: "CoresForRequests", label: "Cores for the requests", unit: "cores",
         expression: "CEILING(PeakRps/MixRatePerCore/CpuTarget,1)",
         why: "The peak at 70% busy."}
      - {name: "CoresRecommended", label: "Recommended cores", unit: "cores",
         expression: "MAX(MinCores,CoresForRequests+CoresReserve)",
         why: "Plus 2 for loads, the collector and the operating system."}
      - {name: "FirstOpenSec", label: "First open of a date", unit: "s",
         expression: "FirstOpenSecPer1M*Positions/Scale1M",
         why: "Lake read, sort, sums and the hot file written."}
      - {name: "LakeLoadSec", label: "Loading a date into the lake", unit: "s",
         expression: "LakeLoadSecPer1M*Trades/Scale1M",
         why: "The Java loader, P&L vectors of one date."}
      - {name: "ReopenSec", label: "Reopening a date from its hot file", unit: "s",
         expression: "ReopenSecPer1M*Trades/Scale1M",
         why: "No lake read."}
  - band: "The settings to put in the configuration: each with its exact key, in YAML, as an environment variable and as an argument"
    settings: true
    rows:
      - {name: "AutoNetMB", label: "(the automatic safety net, for comparison)", unit: "MB",
         expression: "MAX(NetShare*XmxGB*1024-NetReserveMB-LoadThreads*NetLoadMB,XmxGB*1024*NetFloorShare)",
         why: "What open-heap-mb 0 would give: 0.4 × heap − 512 MB − load-threads × 1.6 GB, at least a tenth of the heap."}
      - {name: "HeapTierBudgetMB", label: "(the heap tier would need, a date)", unit: "MB",
         expression: "Trades*Scenarios*AggBytes/BytesPerMB",
         why: "Only with drishti.var.tier.mode: heap, every vector in float64 on the heap."}

settings:
  - {name: "SetHotDates", key: "drishti.var.hot-dates", unit: "dates", env: "DRISHTI_VAR_HOT_DATES", envSource: "docs",
     expression: "DatesInMemory",
     why: "Dates in memory."}
  - {name: "SetOpenHeapMB", key: "drishti.var.open-heap-mb", unit: "MB", env: "DRISHTI_VAR_OPEN_HEAP_MB", envSource: "docs",
     expression: "CEILING(DatesInMemory*HeapDate*(1+OpenHeapMargin)+HeapIntraday,OpenHeapStepMB)",
     why: "The byte safety net: every open date with 10% room, and today's intraday layer; set it rather than leave the automatic value."}
  - {name: "SetMemoryBudgetMB", key: "drishti.var.memory-budget-mb", unit: "MB", env: "DRISHTI_VAR_MEMORY_MB", envSource: "docs",
     expression: "0",
     why: "0 (the default): it bounds the heap tier only; the mapped tier (the default) keeps vectors on disk."}
  - {name: "SetLoadThreads", key: "drishti.var.load-threads", unit: "threads", env: "DRISHTI_VAR_LOADTHREADS", envSource: "relaxed",
     expression: "LoadThreads",
     why: "Dates loading at once; each needs its transient and its spill."}
  - {name: "SetCurrencies", key: "drishti.var.currencies", unit: "text", env: "DRISHTI_VAR_CURRENCIES", envSource: "docs",
     expression: "IF(CcysAhead=0,\"USD\",IF(CcysAhead=1,\"USD,EUR\",IF(CcysAhead=2,\"USD,EUR,CAD\",IF(CcysAhead=3,\"USD,EUR,CAD,JPY\",\"USD,EUR,CAD,JPY,GBP\"))))",
     why: "USD and the currencies built ahead the planner counted, in the shipped order (name your own). The shipped default builds four."}
  - {name: "SetStress", key: "drishti.var.stress.enabled", unit: "text", env: "DRISHTI_VAR_STRESS_ENABLED", envSource: "docs",
     expression: "IF(StressOn=1,\"true\",\"false\")",
     why: "Offer stressed VaR."}
  - {name: "SetMaxDiskGB", key: "drishti.var.tier.max-disk-gb", unit: "GB", env: "DRISHTI_VAR_MAX_DISK_GB", envSource: "docs",
     expression: "CEILING(DiskHotGB+DiskSpillGB,1)",
     why: "Every hot file kept plus the reserve of the builds."}
  - {name: "SetDiskDates", key: "drishti.var.tier.disk-dates", unit: "files", env: "DRISHTI_VAR_TIER_DISKDATES", envSource: "relaxed",
     expression: "DiskDates",
     why: "The default, 60."}
  - {name: "SetExpHotDates", key: "drishti.ccr.exposure.hot-dates", unit: "dates", env: "DRISHTI_EXPOSURE_HOT_DATES", envSource: "docs", condition: "ExposureOn=1",
     expression: "ExpHotDates",
     why: "Exposure dates in memory (only when exposure is on)."}
  - {name: "SetMinFreePercent", key: "drishti.disk.min-free-percent", unit: "%", env: "DRISHTI_DISK_MINFREEPERCENT", envSource: "relaxed",
     expression: "MinFreePercent",
     why: "The free-space guard the disk line keeps (the default)."}
  - {name: "SetMinFreeGB", key: "drishti.disk.min-free-gb", unit: "GB", env: "DRISHTI_DISK_MINFREEGB", envSource: "relaxed",
     expression: "MinFreeGB",
     why: "The guard in GB (the default); both must hold."}

jvm:
  - {name: "JvmXmx", flag: "-Xmx", source: "documented", condition: "always",
     expression: "\"-Xmx\"&XmxGB&\"g\"",
     why: "The heap computed above."}
  - {name: "JvmXms", flag: "-Xms", source: "suggested", condition: "a server",
     expression: "\"-Xms\"&XmxGB&\"g\"",
     why: "The whole heap reserved and committed from the start: no growth pauses, and RSS is known from day one."}
  - {name: "JvmGc", flag: "Collector", source: "documented", condition: "heap ≥ 16 GB: ZGC; Java 21 needs -XX:+ZGenerational",
     expression: "IF(GcChoice=\"ZGC\",IF(JavaVersion>=25,\"-XX:+UseZGC\",\"-XX:+UseZGC -XX:+ZGenerational\"),\"-XX:+UseG1GC\")",
     why: "ZGC pauses under a millisecond whatever the heap; G1 costs less on a small heap. Measured: ZGC doubled RSS at the same -Xmx and stalled allocations at 200,000 positions; choose G1 (Collector) when RAM is tight."}
  - {name: "JvmGcExtra", flag: "Collector tuning", source: "documented", condition: "ZGC: 0.8 × heap; G1: always",
     expression: "IF(GcChoice=\"ZGC\",\"-XX:SoftMaxHeapSize=\"&INT(XmxGB*1024*ZgcSoftMaxShare)&\"m\",\"-XX:G1PeriodicGCInterval=60000\")",
     why: "ZGC collects early to stay under 80% of the heap (planned in the docs); G1's periodic collection returns unused memory."}
  - {name: "JvmPause", flag: "-XX:MaxGCPauseMillis", source: "documented", condition: "not set",
     expression: "\"\"",
     why: "The docs give no pause goal; G1's default (200 ms) stays."}
  - {name: "JvmOops", flag: "-XX:ObjectAlignmentInBytes", source: "suggested", condition: "heap over 31 GB, up to 64 GB",
     expression: "IF(XmxGB>CompressedOopsMaxGB,IF(XmxGB<=AlignedOopsMaxGB,\"-XX:ObjectAlignmentInBytes=16\",\"\"),\"\")",
     why: "Keeps 4-byte references above 32 GB, at the cost of padding objects to 16 bytes; or stay at 31g."}
  - {name: "JvmCompact", flag: "-XX:+UseCompactObjectHeaders", source: "documented", condition: "Java 25 only (21 refuses to start with it)",
     expression: "IF(JavaVersion>=25,\"-XX:+UseCompactObjectHeaders\",\"\")",
     why: "Smaller object headers, a little less heap."}
  - {name: "JvmPreTouch", flag: "-XX:+AlwaysPreTouch", source: "documented", condition: "not set",
     expression: "\"\"",
     why: "Not proposed by the docs: a slow start, and the whole heap committed at once."}
  - {name: "JvmDirect", flag: "-XX:MaxDirectMemorySize", source: "documented", condition: "always",
     expression: "\"-XX:MaxDirectMemorySize=\"&DirectMaxMB&\"m\"",
     why: "Caps direct buffers (the default cap is the heap's size)."}
  - {name: "JvmTrim", flag: "-XX:TrimNativeHeapInterval", source: "documented", condition: "Java 21.0.1 and later",
     expression: "\"-XX:TrimNativeHeapInterval=60000\"",
     why: "Returns freed native memory to the system every minute."}
  - {name: "JvmNioCache", flag: "-Djdk.nio.maxCachedBufferSize", source: "documented", condition: "always",
     expression: "\"-Djdk.nio.maxCachedBufferSize=262144\"",
     why: "Stops each thread keeping a large temporary direct buffer after a read."}
  - {name: "JvmNmt", flag: "-XX:NativeMemoryTracking", source: "documented", condition: "always",
     expression: "\"-XX:NativeMemoryTracking=summary\"",
     why: "Lets jcmd split native memory by category; a few per cent of overhead."}
  - {name: "JvmMeta", flag: "-XX:MaxMetaspaceSize", source: "suggested", condition: "always",
     expression: "\"-XX:MaxMetaspaceSize=512m\"",
     why: "A ceiling well above the 131 MB measured, so a class leak fails loudly instead of growing; the code cache keeps its default."}
  - {name: "JvmDump", flag: "-XX:+HeapDumpOnOutOfMemoryError", source: "documented", condition: "always",
     expression: "\"-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=\"&DataFolder&\"/dumps\"",
     why: "A heap dump when the heap runs out, under the data folder; the disk lines keep room for it."}
  - {name: "JvmGcLog", flag: "-Xlog:gc*", source: "documented", condition: "always",
     expression: "\"-Xlog:gc*:file=\"&DataFolder&\"/logs/gc-%p.log:time,uptime:filecount=5,filesize=20m\"",
     why: "A rotated GC log (5 × 20 MB)."}
  - {name: "JvmTmp", flag: "-Djava.io.tmpdir", source: "documented", condition: "always",
     expression: "\"-Djava.io.tmpdir=\"&DataFolder&\"/tmp/server\"",
     why: "Native libraries unpack and temporary files go under the data folder."}
  - {name: "JvmFooter", flag: "-Ddrishti.parquet.footer-cache-mb", source: "documented", condition: "always",
     expression: "\"-Ddrishti.parquet.footer-cache-mb=\"&FooterCacheMB",
     why: "The Parquet footer cache computed above."}
  - {name: "JvmGrace", flag: "-Ddrishti.open-dates.net-grace-seconds", source: "documented", condition: "always",
     expression: "\"-Ddrishti.open-dates.net-grace-seconds=\"&NetGraceSeconds",
     why: "The byte safety net never closes a date read in the last 120 s (closing it would reload it at once)."}
  - {name: "JvmPinning", flag: "virtual-thread flags", source: "documented", condition: "not set",
     expression: "\"\"",
     why: "-Djdk.tracePinnedThreads=full is a diagnostic only; the scheduler's parallelism keeps its default (the cores)."}
  - {name: "JvmNative", flag: "--enable-native-access", source: "documented", condition: "not set with -jar",
     expression: "\"\"",
     why: "The server jar's manifest already grants native access; no --add-opens is needed."}
  - {name: "JvmArenas", flag: "MALLOC_ARENA_MAX (environment)", source: "documented", condition: "Linux (glibc) only",
     expression: "\"MALLOC_ARENA_MAX=2\"",
     why: "Two malloc arenas, not one per busy thread: about 500 MB less RSS measured."}

warnings:
  - {name: "WarnProtected", label: "Protected dates",
     expression: "IF(PinnedMem+ProtectedAlways>HotDates,\"The protected dates alone (\"&(PinnedMem+ProtectedAlways)&\": pinned, the newest and the one just used) exceed hot-dates (\"&HotDates&\"): the number is exceeded; the planner counts \"&DatesInMemory&\".\",\"OK\")"}
  - {name: "WarnOops", label: "Compressed oops",
     expression: "IF(XmxGB>AlignedOopsMaxGB,\"Over 64 GB: compressed oops are off whatever the alignment; one server is past its comfortable size: plan a cluster.\",IF(XmxGB>CompressedOopsMaxGB,\"Over 31 GB: compressed oops are off unless -XX:ObjectAlignmentInBytes=16 (added below), or stay at 31g with fewer dates in memory.\",\"OK\"))"}
  - {name: "WarnAutoNet", label: "Automatic safety net",
     expression: "IF(AutoNetMB<DatesInMemory*HeapDate,\"The automatic safety net (\"&ROUND(AutoNetMB,0)&\" MB) holds fewer than the \"&DatesInMemory&\" dates in memory need (\"&ROUND(DatesInMemory*HeapDate,0)&\" MB): set drishti.var.open-heap-mb to \"&SetOpenHeapMB&\".\",\"OK\")"}
  - {name: "WarnNetOneDate", label: "Safety net under one date",
     expression: "IF(AutoNetMB<HeapDate,\"The automatic safety net is smaller than one date: dates in use stay open over it (the net's \"&NetGraceSeconds&\"-second grace), so set open-heap-mb at least to the dates in use × the date heap (\"&ROUND(HeapDate,0)&\" MB a date).\",\"OK\")"}
  - {name: "WarnZgcRss", label: "ZGC resident memory",
     expression: "IF(GcChoice=\"ZGC\",\"ZGC: measured about twice G1's resident memory at the same -Xmx, with allocation stalls (200,000 positions); the RAM line counts the whole heap resident. Choose G1 when RAM is tight.\",\"OK\")"}
  - {name: "WarnExposureLoad", label: "Exposure load",
     expression: "IF(ExpLoadMB>ExpShardLoadMB,\"Loading an exposure date needs \"&ROUND(ExpLoadMB/1024,0)&\" GB of heap for the netting sets' value matrices: past about \"&ROUND(ExpShardLoadMB/1024,0)&\" GB the load should be sharded (a cluster).\",\"OK\")"}
  - {name: "WarnSingleNode", label: "One server's limit",
     expression: "IF(OR(XmxGB>AlignedOopsMaxGB,RamRecommendedGB>SingleNodeRamGB),\"Beyond what one server should carry: plan a cluster (the cluster sheet comes later).\",\"OK\")"}
  - {name: "WarnPageCache", label: "Page cache",
     expression: "IF(PageCacheMB>XmxGB*1024*2,\"The open dates' hot files (\"&ROUND(PageCacheMB/1024,0)&\" GB) are larger than twice the heap: with less RAM than recommended, questions on dates not resident read the disk first.\",\"OK\")"}

calibration:
  - {name: "CalHbFormula", label: "One book by the formula, benchmark shape", unit: "MB",
     expression: "(BytesPerRun*RunsPerNode*BenchNodes+(BytesPerNamedRow+BytesPerAggIndexRow)*(BenchBooksCells+BenchNodes)+BytesPerTradeCols*BenchTrades+BytesPerPositionCols*BenchPositions+BytesPerId*(2*BenchTrades+3*BenchPositions)+BytesPerCtotValue*(BenchScenarios+1)*BenchNodes+BytesPerPortfolio*BenchPortfolios+BytesPerBasketMember*BenchMembers)/BytesPerMB",
     why: "The H_book formula at the Bench values (Coefficients), whatever the Inputs."}
  - {name: "CalHeapBook", label: "One book, calibrated, benchmark shape", unit: "MB",
     expression: "CalHbFormula*BookHeapCalibration",
     why: "Measured: 722 MB a date on average (the users run)."}
  - {name: "CalHotFileMB", label: "Hot file, benchmark shape", unit: "MB",
     expression: "(BenchPositions*BenchScenarios*HotRowBytes+(BenchBooksCells+BenchNodes)*BenchScenarios*AggBytes+BenchNodes*(BenchScenarios+1)*AggBytes+HotSmallBytesPerTrade*BenchTrades)/BytesPerMB",
     why: "Measured 3.14 GB a date."}
  - {name: "CalHeapStart", label: "Heap after GC at start", unit: "MB",
     expression: "BaseFixedMB+BasePerPositionB*BenchPositions/BytesPerMB+FooterCacheDefaultMB",
     why: "Measured 769 MB (the users run: 1,000,000 positions, 6 GB heap, Java 21)."}
  - {name: "CalHeapOne", label: "Heap after GC, one date open", unit: "MB",
     expression: "CalHeapStart+FirstOpenOnceMB*BenchPositions/Scale1M+CalHeapBook",
     why: "Measured 1,352 MB: the average date puts the planner 139 MB above, the safe side."}
  - {name: "CalHeapTwo", label: "Heap after GC, two dates open", unit: "MB",
     expression: "CalHeapOne+CalHeapBook",
     why: "Measured 2,213 MB."}
  - {name: "CalRssStart", label: "RSS at start (at a 6 GB heap)", unit: "MB",
     expression: "RssStartMB",
     why: "Measured 2,875 MB."}
  - {name: "CalRssOne", label: "RSS, one date open", unit: "MB",
     expression: "CalRssStart+(CalHeapOne-CalHeapStart)+ResidentFirstIdle*CalHotFileMB",
     why: "Measured 5,156 MB."}
  - {name: "CalRssTwo", label: "RSS, two dates open", unit: "MB",
     expression: "CalRssOne+CalHeapBook+ResidentNextIdle*CalHotFileMB",
     why: "Measured 6,899 MB."}
  - {name: "CalLakeTwoGB", label: "Lake, two dates", unit: "GB",
     expression: "2*BenchTrades*BenchScenarios*LakeBytesPerValue/BytesPerMB/1024",
     why: "Measured 2.8 GB."}
  - {name: "CalFirstOpen", label: "First open of a date", unit: "s",
     expression: "FirstOpenSecPer1M*BenchPositions/Scale1M",
     why: "Measured 18 to 21 s; the lake load 28.4 s for two dates."}
  - {name: "CalWarmHeap", label: "Heap after GC, warm at 50 users", unit: "MB",
     expression: "CalHeapTwo+BenchUsers*PerUserMB",
     why: "Measured 2,336 MB."}
  - {name: "CalRssEnd", label: "RSS at the end of the users run (6 GB heap)", unit: "MB",
     expression: "MeasuredXmxMB+NativeMB+ResidentShare*2*CalHotFileMB",
     why: "Measured 11,160 MB; the planner's native memory (1,071 MB) is more than the 550 MB NMT saw beyond the heap, so it lands a little above."}
  - {name: "CalReqPerSec", label: "Requests a second on the benchmark machine", unit: "requests/s",
     expression: "MeasuredCores/(BenchVarShare/(ReqPerCoreVarAtRef*(VarRefPositions/BenchPositions)^VarCostExponent)+(1-BenchVarShare)/ReqPerCoreTrades)",
     why: "Measured 183.3 at 50 users, half VaR, 0 failures."}

