# The single-node capacity planner (docs/architecture/RESOURCES_AND_SCALE.md 9.7): ONE file read by three evaluators that must agree.
#   tools/sizing_planner.py   writes docs/architecture/Drishti-Sizing-Planner.xlsx and the server's template (capacity/template/)
#   the server                GET /api/v1/admin/capacity serves this file as JSON; capacity.xlsx fills the template's Inputs
#   the console               static/js/drishti_capacity.js evaluates the expressions as you type (Admin -> Capacity)
# Expressions are a small Excel subset over the names below: + - * / ^ & (text), comparisons (= <> < > <= >=), IF, MAX, MIN, CEILING,
# INT, ROUND, AND, OR, CHAR. MB is BytesPerMB (1,024 x 1,024 bytes); GB is 1,024 MB. After a change run
# python3 tools/sizing_planner.py (the workbook, the template and the test vectors follow); --check says when they drift.
#
#   inputs        what a planner types (group, label, default, unit, kind int|dec|text, choices, hint)
#   coefficients  every constant (value, unit, status measured|formula|calibrated|estimate, source)
#   results       bands of result lines (name, label, expression, unit, why); the band with settings: true is followed by the settings
#   settings      the configuration keys (key, expression, unit, env, envSource docs|relaxed, why, condition)
#   jvm           the JVM arguments (flag, expression, condition in words, why, source documented|suggested)
#   warnings      a sentence, or OK
#   calibration   the 1,000,000-position benchmark against what it measured, whatever the inputs
#   examples      the Explain tab's two shapes and the figures it states (checked by the tests of all three evaluators)

version: 1
settingsFile: "./application.local.yaml (the server's working directory)"
settingOff: "(exposure off: leave it out)"

inputs:
  - {name: "Positions", group: "VaR", label: "Positions a business date", default: 300000, unit: "positions", kind: "int",
     hint: "How many positions one business date holds. Default: the production shape, OTC trades, one trade a position, so positions = trades."}
  - {name: "Trades", group: "VaR", label: "Trades a business date", default: 300000, unit: "trades", kind: "int",
     hint: "How many trades those positions are made of. Default: production, about 300,000 trades."}
  - {name: "TradesPerFungible", group: "VaR", label: "Trades per position, of positions that hold several", default: 2, unit: "trades", kind: "dec",
     hint: "Only used when trades exceed positions: how many trades a shared (fungible) position holds on average."}
  - {name: "Portfolios", group: "VaR", label: "Portfolios", default: 4500, unit: "portfolios", kind: "int",
     hint: "Stored portfolios: baskets, rule portfolios, desk and book portfolios. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 15,000 (desks and books grow with the positions: a desk holds 2,000 positions at both benchmark sizes, BENCHMARK.md 3)."}
  - {name: "BasketMembers", group: "VaR", label: "Basket members", default: 600000, unit: "members", kind: "int",
     hint: "Positions named by all the baskets together. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 2,000,000."}
  - {name: "Nodes", group: "VaR", label: "Hierarchy nodes", default: 8107, unit: "nodes", kind: "int",
     hint: "Nodes of every risk hierarchy (bank, legal entities, divisions, desks, limit letters...). Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 27,024."}
  - {name: "BooksCells", group: "VaR", label: "Books and cells", default: 39000, unit: "books + cells", kind: "int",
     hint: "Trading books plus the cells of column hierarchies. Default: 300,000 ÷ 1,000,000 of the 1,000,000-position benchmark's 130,000."}
  - {name: "Scenarios", group: "VaR", label: "Scenarios", default: 509, unit: "scenarios", kind: "int",
     hint: "Scenario days in a P&L vector (509: two years of history plus the base)."}
  - {name: "TradeCcysPerNode", group: "VaR", label: "Trade currencies per node", default: 1, unit: "currencies", kind: "dec",
     hint: "On average, how many trade currencies a node's trades are in."}
  - {name: "LakeYears", group: "VaR", label: "Years of business dates kept in the lake", default: 1, unit: "years", kind: "dec",
     hint: "How much history the lake keeps (the bank's rule is often 7 years)."}
  - {name: "HotDates", group: "VaR", label: "Dates in memory (hot-dates)", default: 10, unit: "dates", kind: "int",
     hint: "Business dates kept open at once; the least recently used one leaves first."}
  - {name: "PinnedMem", group: "VaR", label: "Pinned dates kept in memory", default: 0, unit: "dates", kind: "int",
     hint: "Dates that must always stay open (a month-end the desks compare with, an audit date)."}
  - {name: "PinnedDisk", group: "VaR", label: "Pinned dates kept on disk", default: 0, unit: "dates", kind: "int",
     hint: "Dates whose hot file is always kept on local disk, so they open in a second (month-ends, year-ends)."}
  - {name: "CcysAhead", group: "VaR", label: "Reporting currencies built ahead (besides USD)", default: 0, unit: "currencies", kind: "int",
     hint: "Each one is a whole extra book a date (the shipped setting builds 4: EUR, CAD, JPY, GBP)."}
  - {name: "StressOn", group: "VaR", label: "Stress set on (1) or off (0)", default: 0, unit: "0 or 1", kind: "int", choices: [0, 1],
     hint: "1 when stressed VaR is used: the stress set is a book of its own a date."}
  - {name: "IntradayBatches", group: "VaR", label: "Intraday batches a day", default: 10, unit: "batches", kind: "int",
     hint: "Intraday batches applied to today's date. Default 10 (hourly over the trading day): assumed, confirm the batch count."}
  - {name: "UpdatesPerBatch", group: "VaR", label: "Updates per intraday batch", default: 11700, unit: "trades", kind: "int",
     hint: "Trades amended, added or cancelled in one batch. Default: 39% of the 300,000 trades a day (117,000) over the 10 batches."}
  - {name: "ExposureOn", group: "Exposure", label: "Exposure on (1) or off (0)", default: 0, unit: "0 or 1", kind: "int", choices: [0, 1],
     hint: "1 when the counterparty exposure engine serves dates on this server."}
  - {name: "NettingSets", group: "Exposure", label: "Netting sets", default: 10000, unit: "sets", kind: "int",
     hint: "Netting sets a business date."}
  - {name: "ExpTrades", group: "Exposure", label: "Exposure trades", default: 100000, unit: "trades", kind: "int",
     hint: "Trades with simulated paths a business date."}
  - {name: "Paths", group: "Exposure", label: "Paths", default: 200, unit: "paths", kind: "int",
     hint: "Monte Carlo paths a trade."}
  - {name: "TimeSteps", group: "Exposure", label: "Time steps", default: 24, unit: "grid dates", kind: "int",
     hint: "Grid dates of a path."}
  - {name: "ExpHotDates", group: "Exposure", label: "Exposure dates in memory", default: 10, unit: "dates", kind: "int",
     hint: "drishti.ccr.exposure.hot-dates: exposure dates kept open."}
  - {name: "TradeRowsPerDay", group: "Trades and BI", label: "Trade and BI rows a day", default: 300000, unit: "rows", kind: "int",
     hint: "Trade rows loaded a business date, all trade systems together. Default: the same 300,000 production trades, served as trades too."}
  - {name: "TradeDaysKept", group: "Trades and BI", label: "Days of trade rows kept", default: 252, unit: "days", kind: "int",
     hint: "Business days of trades kept in the lake (252 is a year)."}
  - {name: "TradeConnectors", group: "Trades and BI", label: "Trade connectors", default: 3, unit: "connectors", kind: "int",
     hint: "Trade systems read through their own connector (for example ENDUR, CALYPSO, MUREX)."}
  - {name: "Users", group: "Users", label: "Concurrent users", default: 50, unit: "users", kind: "int",
     hint: "People (or programs) asking questions at the same moment at the busiest time."}
  - {name: "PeakRps", group: "Users", label: "Peak requests a second wanted", default: 100, unit: "requests/s", kind: "dec",
     hint: "Requests a second the server must answer at the peak."}
  - {name: "VarShare", group: "Users", label: "Share of VaR questions", default: 0.5, unit: "share", kind: "dec",
     hint: "Of those requests, the share that are VaR questions (the rest are trades, searches, pages)."}
  - {name: "JavaVersion", group: "Machine", label: "Java version (21 or 25)", default: 21, unit: "21 or 25", kind: "int", choices: [21, 25],
     hint: "The Java the server runs on; 25 adds compact object headers."}
  - {name: "LoadThreads", group: "Machine", label: "Load threads (drishti.var.load-threads)", default: 2, unit: "threads", kind: "int",
     hint: "Dates that may load from the lake at the same time."}
  - {name: "Collector", group: "Machine", label: "Garbage collector: auto, G1 or ZGC", default: "auto", unit: "text", kind: "text", choices: ["auto", "G1", "ZGC"],
     hint: "auto follows the documented rule: generational ZGC from 16 GB of heap, G1 below."}
  - {name: "DataFolder", group: "Machine", label: "Data folder", default: "/opt/drishti/data", unit: "path", kind: "text",
     hint: "Where Drishti keeps everything it writes (dumps, logs and temporary files go under it)."}
  - {name: "ServerJar", group: "Machine", label: "Server jar", default: "drishti-server-{VERSION}-exec.jar", unit: "file", kind: "text",
     hint: "The server's jar, as the command line starts it."}

coefficients:
  - {name: "BytesPerMB", value: 1048576, unit: "bytes", status: "formula",
     source: "1 MB = 1,024 × 1,024 bytes, as the JVM and Admin → Caches count it; 1 GB = 1,024 MB."}
  - {name: "Scale1M", value: 1000000, unit: "positions", status: "formula",
     source: "The size every per-million coefficient refers to."}
  - {name: "BusinessDaysYear", value: 252, unit: "days", status: "formula",
     source: "Business days a year."}
  - {name: "BytesPerRun", value: 8, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 8·R, node members kept as runs."}
  - {name: "RunsPerNode", value: 9.7, unit: "runs", status: "estimate",
     source: "VAR_GUIDE.md 27.1 worked example: about 2 MB of runs at 27,024 nodes (about 9.7 runs a node)."}
  - {name: "BytesPerNamedRow", value: 150, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: ~150·(B + K + N), names, book and cell runs, nodes and their book lists."}
  - {name: "BytesPerAggIndexRow", value: 64, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 64·A, the index of the aggregates (A = B + K + N, the rows mapped from the hot file)."}
  - {name: "BytesPerTradeCols", value: 108, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 108·T, code and number columns of a trade, positionOf, its id index."}
  - {name: "BytesPerPositionCols", value: 136, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 136·P, a position's columns, run and id index."}
  - {name: "BytesPerId", value: 72, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 72·(2T + 3P), trade and position ids and the high-cardinality dictionaries."}
  - {name: "BytesPerCtotValue", value: 8, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_book: 8·(S + 1)·N·C, every node's per-trade-currency totals (float64)."}
  - {name: "BytesPerPortfolio", value: 1000, unit: "bytes", status: "estimate",
     source: "VAR_GUIDE.md 27.1: the portfolio definitions are about 30 MB at 15,000 portfolios and 2 million basket members; half given to the portfolios."}
  - {name: "BytesPerBasketMember", value: 7.5, unit: "bytes", status: "estimate",
     source: "The other half of those 30 MB, given to the basket members."}
  - {name: "BookHeapCalibration", value: 0.9707, unit: "factor", status: "calibrated",
     source: "The final 1,000,000-position users run (tools/bench/results/2.9.10-1m.jsonl; Java 21, G1, 6 GB heap): heap after GC 769 MB at start, 1,352 MB with one date, 2,213 MB with two: 722 MB a date on average (0.72 GB, VAR_GUIDE.md 27.1, BENCHMARK.md 4.8), against 743.8 MB by the H_book formula. Every date is counted at the average (the first date measured less, 583 MB): the safe side. An earlier run that night measured 740 / 1,602 / 2,186 MB; before node members were runs and the aggregates were mapped, a date held about 3.2 GB at this size."}
  - {name: "FirstOpenOnceMB", value: 0, unit: "MB at 1M positions", status: "calibrated",
     source: "The users run shows no one-time heap of the first open beyond the average date (one date +583 MB, two +1,444 MB); kept as a coefficient to tune (the earlier run suggested 278 MB)."}
  - {name: "ProtectedAlways", value: 2, unit: "dates", status: "formula",
     source: "VAR_GUIDE.md 26.8: the date just used and the newest business date always stay open, on top of the pinned ones."}
  - {name: "IntradayLayerMB", value: 5, unit: "MB", status: "formula",
     source: "VAR_GUIDE.md 27.1, H_date: about 5 MB and the updates per intraday layer."}
  - {name: "IntradayTradeCopies", value: 3, unit: "vectors", status: "formula",
     source: "VarIntraday: each trade a layer changed keeps three float64 vectors of the scenarios (its difference from the morning, its current P&L, its current USD P&L); only the trade's latest P&L is kept, never the batches."}
  - {name: "IntradayTradeOverheadB", value: 400, unit: "bytes", status: "estimate",
     source: "VarIntraday: per changed trade its map entries, value today and texts."}
  - {name: "IntradayDistinctShare", value: 1.0, unit: "share", status: "estimate",
     source: "Share of the day's updates that are trades not updated earlier that day (1: every update a different trade, the most heap)."}
  - {name: "IntradayAggShare", value: 1.0, unit: "share", status: "estimate",
     source: "VarIntraday: share of the books and nodes whose aggregate a layer re-holds (float64 vectors); with updates spread over the bank, all of them."}
  - {name: "IntradayUpdateOverheadB", value: 500, unit: "bytes", status: "estimate",
     source: "VarIntraday.Update: an update in flight holds its P&L and USD P&L (2 float64 vectors) plus its texts and numbers."}
  - {name: "IntradayJsonBytesPerValue", value: 12, unit: "bytes", status: "estimate",
     source: "A batch file in JSON Lines: about 12 characters a scenario value, under tmp while lake build appends it."}
  - {name: "BaseFixedMB", value: 128, unit: "MB", status: "formula",
     source: "BENCHMARK.md 4.8: the fitted heap at start, 128 MB plus a share per position."}
  - {name: "BasePerPositionB", value: 605.0, unit: "bytes", status: "calibrated",
     source: "The users run: 769 MB of heap after GC at start at 1,000,000 positions; minus the 64 MB footer cache (below) and 128 MB, 577 MB over 1,000,000 positions (lake footers' residue, the entity index of the P&L rows). The earlier run: 740 MB."}
  - {name: "BaseTradeRows", value: 20000, unit: "rows a day", status: "calibrated",
     source: "The measured start heap already holds the benchmark's trades (20,000 a day over 2 days, 2,000 counterparties); only rows above it are added."}
  - {name: "FooterCacheDefaultMB", value: 64, unit: "MB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.5: -Ddrishti.parquet.footer-cache-mb, 64 MB by default."}
  - {name: "FooterBytesPerChunk", value: 700, unit: "bytes", status: "measured",
     source: "RESOURCES_AND_SCALE.md 3.5: about 700 bytes a column chunk of a Parquet footer."}
  - {name: "RowsPerRowGroup", value: 128000, unit: "rows", status: "estimate",
     source: "Rows in one Parquet row group of a trade table."}
  - {name: "ColumnsPerTable", value: 60, unit: "columns", status: "estimate",
     source: "Columns of a trade table's Parquet files (each a column chunk in the footer)."}
  - {name: "SearchIndexCapMB", value: 600, unit: "MB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.5, CONFIGURATION.md: the type-ahead index's index.max-memory, 600 MB."}
  - {name: "SearchBytesPerRow", value: 200, unit: "bytes", status: "estimate",
     source: "Heap of the type-ahead index a trade row of the kept day."}
  - {name: "BiQueryCacheMB", value: 64, unit: "MB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.3: drishti.bi.query.cache-max-bytes, 64 MB."}
  - {name: "BiPlanAnswersMB", value: 50, unit: "MB", status: "estimate",
     source: "RESOURCES_AND_SCALE.md 3.3: plan answers, 2,000 entries (drishti.bi.plan.cache-entries), about 25 KB each."}
  - {name: "HistoryCacheMB", value: 256, unit: "MB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.4, CONFIGURATION.md: drishti.history.cache-mb, 256 MB."}
  - {name: "VarAnswersMB", value: 32, unit: "MB", status: "estimate",
     source: "RESOURCES_AND_SCALE.md 3.1: the VaR answers, 512 entries, about 64 KB each."}
  - {name: "TradeCacheBytesPerRow", value: 1300, unit: "bytes", status: "estimate",
     source: "BENCHMARK.md 8.2 and 8.4: 1.2 to 1.8 GB of heap after GC with 1.16 million trades on the latest day and 50 users."}
  - {name: "PerLoadMBAt1M", value: 1600, unit: "MB", status: "formula",
     source: "VarProperties.PER_LOAD_BYTES: the heap one load holds while it builds a date (its aggregates and currency totals), 1.6 GB at 1,000,000 positions, scaled by positions."}
  - {name: "ReadBufferMB", value: 64, unit: "MB", status: "formula",
     source: "VAR_GUIDE.md 27a.6: drishti.var.read.buffer-mb, decoded rows waiting for one load."}
  - {name: "PerUserMB", value: 2.466, unit: "MB", status: "measured",
     source: "PER-USER WORKING MEMORY. The 1,000,000-position users run (6 GB heap, Java 21, G1): heap after GC 2,336.2 MB warm at 50 users against 2,212.9 MB with two dates open, (2,336.2 − 2,212.9) ÷ 50; 2,355 MB at the end after 200 users."}
  - {name: "LiveShare", value: 0.61, unit: "share", status: "formula",
     source: "RESOURCES_AND_SCALE.md 9.5 and BENCHMARK.md 11: the heap needed is the heap after collection ÷ 0.61 (39% headroom for the collector)."}
  - {name: "Java25HeapFactor", value: 0.977, unit: "factor", status: "measured",
     source: "BENCHMARK.md 4.4: Java 25 with compact object headers, 7,335 MB against 7,505 MB at 1,000,000 positions."}
  - {name: "CompressedOopsMaxGB", value: 31, unit: "GB", status: "formula",
     source: "Java: compressed object references work up to a heap just under 32 GB; 31g is the safe largest."}
  - {name: "AlignedOopsMaxGB", value: 64, unit: "GB", status: "formula",
     source: "Java: with -XX:ObjectAlignmentInBytes=16 compressed references reach 64 GB (objects pad to 16 bytes)."}
  - {name: "ZgcFromGB", value: 16, unit: "GB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 5.5, PERFORMANCE.md (JVM settings): generational ZGC for large single servers (16 to 36 GB), G1 for small ones."}
  - {name: "OpenHeapStepMB", value: 64, unit: "MB", status: "formula",
     source: "drishti.var.open-heap-mb is rounded up to a multiple of this."}
  - {name: "ZgcSoftMaxShare", value: 0.8, unit: "share", status: "formula",
     source: "RESOURCES_AND_SCALE.md 5.5: -XX:SoftMaxHeapSize = 0.8 × -Xmx with ZGC (planned in the docs)."}
  - {name: "ExpShardLoadMB", value: 8192, unit: "MB", status: "estimate",
     source: "BENCHMARK.md 6: past about 8 GB of value matrices an exposure date's load should be sharded."}
  - {name: "SingleNodeRamGB", value: 512, unit: "GB", status: "estimate",
     source: "Past about 512 GB of RAM one server is the wrong shape: plan a cluster."}
  - {name: "OpenHeapMargin", value: 0.1, unit: "share", status: "estimate",
     source: "Room in drishti.var.open-heap-mb above the dates in memory, so the safety net does not close a date for a few MB."}
  - {name: "NetShare", value: 0.4, unit: "share", status: "formula",
     source: "OpenDates.automaticNet: the automatic safety net is 0.4 × the heap − 512 MB − load-threads × 1.6 GB."}
  - {name: "NetReserveMB", value: 512, unit: "MB", status: "formula",
     source: "OpenDates.automaticNet: the 512 MB of that formula."}
  - {name: "NetLoadMB", value: 1600, unit: "MB", status: "formula",
     source: "OpenDates.automaticNet: the per-load 1.6 GB of that formula (not scaled by positions)."}
  - {name: "NetFloorShare", value: 0.1, unit: "share", status: "formula",
     source: "OpenDates.automaticNet: at least a tenth of the heap."}
  - {name: "NetGraceSeconds", value: 120, unit: "seconds", status: "formula",
     source: "-Ddrishti.open-dates.net-grace-seconds: the safety net never closes a date read in the last 120 s."}
  - {name: "ExpOpenBytesPerTrade", value: 1720, unit: "bytes", status: "measured",
     source: "BENCHMARK.md 6: an open exposure date, 172 MB of heap at 100,000 trades (matrices mapped)."}
  - {name: "ExpLoadBytesPerValue", value: 8, unit: "bytes", status: "measured",
     source: "BENCHMARK.md 6: while loading, every set's value matrix in float64 (sets × paths × steps × 8): 380 MB at 9,901 sets, 200 paths, 24 steps."}
  - {name: "ExpPathsCacheMB", value: 256, unit: "MB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.2: the exposure trade-paths cache, 256 MB."}
  - {name: "ExpHotBytesPerValue", value: 6, unit: "bytes", status: "formula",
     source: "EXPOSURE_GUIDE.md 27.2: V in float32 (4 bytes) and E on the primary dates, half the grid (2 bytes a value)."}
  - {name: "ExpHotBytesPerTrade", value: 1256, unit: "bytes", status: "calibrated",
     source: "BENCHMARK.md 6: the hot file of 100,000 trades was 410.8 MB; minus the matrices' 285 MB, 1,256 bytes a trade."}
  - {name: "ExpPathBytes", value: 4, unit: "bytes", status: "formula",
     source: "EXPOSURE_GUIDE.md 27.2: trade paths in the lake, float32."}
  - {name: "ExpPathDaysKept", value: 20, unit: "days", status: "formula",
     source: "EXPOSURE_GUIDE.md 27.3: trade paths kept at full resolution for 20 business days."}
  - {name: "ExpDiskDates", value: 60, unit: "files", status: "formula",
     source: "CONFIGURATION.md: the exposure tier's disk-dates, 60 (the retention may keep more)."}
  - {name: "HotRowBytes", value: 4, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 26.3: position and trade rows in float32."}
  - {name: "AggBytes", value: 8, unit: "bytes", status: "formula",
     source: "VAR_GUIDE.md 26.3: aggregates and currency totals in float64."}
  - {name: "HotSmallBytesPerTrade", value: 354, unit: "bytes", status: "calibrated",
     source: "BENCHMARK.md 3: the hot file measured 3.14 GB a date at 1,000,000 positions; the rows, aggregates and totals are 2.79 GB, the rest (ids, columns, runs) 354 bytes a trade (VAR_GUIDE.md 27.1 says about 120)."}
  - {name: "StressScenarios", value: 250, unit: "scenarios", status: "estimate",
     source: "RESOURCES_AND_SCALE.md 2.3: a stress window of 250 days."}
  - {name: "LakeBytesPerValue", value: 2.9535, unit: "bytes", status: "calibrated",
     source: "Re-benchmark: 2.8 GB of lake for two dates of 1,000,000 vectors of 509 values (read as GB of 1,024 MB, the larger reading)."}
  - {name: "DiskDates", value: 60, unit: "files", status: "formula",
     source: "CONFIGURATION.md: drishti.var.tier.disk-dates, 60 hot files kept on disk."}
  - {name: "CurrencyRetentionDates", value: 5, unit: "dates", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.1: currency books kept on disk for 5 dates."}
  - {name: "SpillFactor", value: 3, unit: "× hot file", status: "formula",
     source: "VAR_GUIDE.md 26.8: before a build the tier reserves three times its largest hot file (the disk guard)."}
  - {name: "LogsGB", value: 1.1, unit: "GB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.8, 6.4: the server log rotated at 1 GB in all, the GC log 5 × 20 MB."}
  - {name: "DumpsKept", value: 1, unit: "dumps", status: "estimate",
     source: "OPERATIONS.md: a heap dump is about the size of the heap; one kept."}
  - {name: "IdMapBytesPerRow", value: 15, unit: "bytes", status: "measured",
     source: "BENCHMARK.md 8.4: id maps on disk, about 15 bytes a trade a date."}
  - {name: "TradeLakeBytesPerRow", value: 1500, unit: "bytes", status: "measured",
     source: "BENCHMARK.md 8.4: about 1.5 KB a trade a day in the lake."}
  - {name: "GroupedPagesBytesPerRow", value: 550, unit: "bytes", status: "measured",
     source: "BENCHMARK.md 8.4: grouped pages, about 0.55 KB a trade a cached date."}
  - {name: "GroupedPagesDates", value: 16, unit: "dates", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.4: grouped pages keep 16 dates."}
  - {name: "DocCacheGB", value: 1, unit: "GB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.5: the document disk cache, 1 GB a connector."}
  - {name: "IndexDiskGB", value: 2, unit: "GB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.5: the type-ahead index, index.max-disk 2 GB a connector."}
  - {name: "BiLayerBytesPerRow", value: 300, unit: "bytes", status: "estimate",
     source: "BI layers on disk a trade row a day read."}
  - {name: "BiRunsGB", value: 20, unit: "GB", status: "formula",
     source: "RESOURCES_AND_SCALE.md 3.3: the BI runs' store, 20 GB."}
  - {name: "MinFreePercent", value: 10, unit: "%", status: "formula",
     source: "CONFIGURATION.md: drishti.disk.min-free-percent, 10."}
  - {name: "MinFreeGB", value: 20, unit: "GB", status: "formula",
     source: "CONFIGURATION.md: drishti.disk.min-free-gb, 20 (both must hold)."}
  - {name: "DiskStepGB", value: 50, unit: "GB", status: "formula",
     source: "Disk recommendations are rounded up to a multiple of this."}
  - {name: "ResidentShare", value: 0.7458, unit: "share", status: "calibrated",
     source: "The users run: RSS 11,160 MB at the end minus 6,694 MB committed (NMT) leaves 4,466 MB of mapped hot-file pages, 75% of the two dates' 5,988 MB, under load."}
  - {name: "BenchPositions", value: 1000000, unit: "positions", status: "measured",
     source: "The 1,000,000-position benchmark's shape (BENCHMARK.md 3): positions, one trade each. The Calibration check uses only these Bench values."}
  - {name: "BenchTrades", value: 1000000, unit: "trades", status: "measured",
     source: "The benchmark's trades."}
  - {name: "BenchNodes", value: 27024, unit: "nodes", status: "measured",
     source: "The benchmark's hierarchy nodes."}
  - {name: "BenchBooksCells", value: 130000, unit: "books + cells", status: "measured",
     source: "The benchmark's books and cells (VAR_GUIDE.md 27.1's worked example)."}
  - {name: "BenchPortfolios", value: 15000, unit: "portfolios", status: "measured",
     source: "The benchmark's portfolios."}
  - {name: "BenchMembers", value: 2000000, unit: "members", status: "measured",
     source: "The benchmark's basket members."}
  - {name: "BenchScenarios", value: 509, unit: "scenarios", status: "measured",
     source: "The benchmark's scenarios."}
  - {name: "BenchUsers", value: 50, unit: "users", status: "measured",
     source: "The users of the warm-heap measure."}
  - {name: "BenchVarShare", value: 0.5, unit: "share", status: "measured",
     source: "The users run's share of VaR questions (50.5%)."}
  - {name: "MeasuredXmxMB", value: 6144, unit: "MB", status: "measured",
     source: "The -Xmx of the 1,000,000-position runs (6 GB)."}
  - {name: "ResidentFirstIdle", value: 0.5207, unit: "share", status: "calibrated",
     source: "The users run: RSS rose 2,281 MB with the first date (2,875 → 5,156 MB); less the 722 MB of the date's heap, 52% of its 2,994 MB hot file, written and read."}
  - {name: "ResidentNextIdle", value: 0.341, unit: "share", status: "calibrated",
     source: "The users run: RSS rose 1,743 MB with the second date (→ 6,899 MB); less 722 MB of heap, 34% of its hot file."}
  - {name: "RssStartMB", value: 2875, unit: "MB", status: "measured",
     source: "The users run: RSS at start, 1,000,000 positions, 6 GB heap, Java 21 (2,708 MB in the earlier run)."}
  - {name: "MetaspaceCodeMB", value: 215, unit: "MB", status: "measured",
     source: "PERFORMANCE.md (Resident memory): metaspace 131 MB and code cache 84 MB, flat."}
  - {name: "DirectMaxMB", value: 256, unit: "MB", status: "formula",
     source: "PERFORMANCE.md, OPERATIONS.md: -XX:MaxDirectMemorySize=256m on every launcher."}
  - {name: "OtherNativeMB", value: 600, unit: "MB", status: "estimate",
     source: "PERFORMANCE.md (Resident memory): RSS levels off at about -Xmx + 0.4 GB (two malloc arenas) to + 1 GB (default allocator); the rest beyond metaspace and direct memory."}
