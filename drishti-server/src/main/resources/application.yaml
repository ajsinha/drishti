# The Drishti server configuration. Precedence (low -> high): this file, application.local.yaml
# (git-ignored), environment variables, --key=value arguments.
spring:
  application:
    name: drishti  # the application's name in logs and metrics
  mvc:
    async:
      request-timeout: ${DRISHTI_ASYNC_TIMEOUT:30m}  # how long a streamed answer may take: a workbook download (the VaR Playground, the Why it moved working, the capacity workbook), a BI export; an answer cut at this limit arrives incomplete
  threads:
    virtual:
      enabled: true          # every request runs on a virtual thread; fetches and link fan-out block cheaply
  ai:                                # Spring AI's own auto-configuration is off: Drishti builds clients from config/ai files
    model:
      chat: none  # Spring AI's chat auto-configuration: off (none)
      embedding: none  # Spring AI's embedding auto-configuration: off
      image: none  # Spring AI's image auto-configuration: off
      moderation: none  # Spring AI's moderation auto-configuration: off
      audio:
        speech: none  # Spring AI's speech auto-configuration: off
        transcription: none  # Spring AI's transcription auto-configuration: off
  main:
    banner-mode: off  # no Spring banner at start
  config:
    # files read after this one: the engines' files (config/engines/<id>.yaml), application.local.yaml in the working directory, then the packs overlay Admin -> Packs writes
    # (DRISHTI_PACKS_OVERLAY, default <data dir>/packs/added.yaml)
    import:
      # the engines' own files (docs/architecture/COMPUTE_ENGINES.md section 3): the jar's copy, then the site's, which wins key by key
      - classpath:engines/var.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/var.yaml
      - classpath:engines/exposure.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/exposure.yaml
      - classpath:engines/sensitivities.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/sensitivities.yaml
      - classpath:engines/frtb-sa.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/frtb-sa.yaml
      - classpath:engines/simm.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/simm.yaml
      - classpath:engines/mr-cube.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/mr-cube.yaml
      - classpath:engines/pivot.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/pivot.yaml
      - classpath:engines/memory-lake.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/memory-lake.yaml
      - classpath:engines/dataload.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/dataload.yaml
      - classpath:engines/flight.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/flight.yaml
      - classpath:engines/openblas.yaml
      - optional:file:${DRISHTI_ENGINES_DIR:./config/engines}/openblas.yaml
      - optional:file:./application.local.yaml
      # packs an administrator loaded from Admin → Packs (drishti.packs.added); written by the server, not by hand
      - optional:file:${DRISHTI_PACKS_OVERLAY:${drishti.data.dir:./data}/packs/added.yaml}

  # Email (docs/admin/CONFIGURATION.md, "Email"): set spring.mail.host (SPRING_MAIL_HOST) to switch the SMTP client on, with
  # port/username/password and properties.mail.smtp.* as for any Spring Boot application; leave host unset and no mail client exists.
  #   mail:
  #     host: smtp.example.com
  #     port: 587
  #     username: drishti
  #     password: ...
  #     properties.mail.smtp.starttls.required: true
  #     properties.mail.smtp.connectiontimeout: 10000
  #     properties.mail.smtp.timeout: 10000
  jpa:
    open-in-view: false      # no lazy loading while a view renders: the identity services load what they return

logging:
  # RESOURCES_AND_SCALE.md 6.4: with drishti.logging.file set the server writes its own log, rotated by size and day and kept
  # within a total (compressed); unset (containers), standard output only, as before. The stack sets it per node (run/logs/<node>.log).
  file:
    name: ${drishti.logging.file:}  # the log file, from drishti.logging.file (empty: standard output only)
  logback:
    rollingpolicy:
      max-file-size: ${drishti.logging.max-file-mb:100}MB    # one file's size before it rolls
      total-size-cap: ${drishti.logging.max-total-mb:1024}MB  # every rolled file together; the oldest go beyond
      max-history: ${drishti.logging.max-files:30}            # rolled days kept at most
  # log level per package (logging.level.<package>: DEBUG, INFO, WARN, ERROR); the shipped entries quieten the Delta kernel, Parquet and
  # Hibernate
  level:
    # expected, not a fault: a Delta table without checkpoints is read from its log (said once per table and read)
    io.delta.kernel.internal.snapshot.SnapshotManager: ERROR
    # Hibernate flags a setting Spring Boot itself sets as incubating
    org.hibernate.orm.incubating: ERROR
    # the Parquet reader and the Delta kernel say one INFO line per file read and per record looked up (thousands at start on
    # a large lake); Drishti says one line per table and date loaded, and the derived pages' progress every 100,000 records
    org.apache.parquet: WARN
    io.delta.kernel: WARN

server:
  port: ${DRISHTI_PORT:18480}  # the server's HTTP port
  shutdown: graceful  # graceful: requests in flight finish on a stop
  http2:
    # HTTP/2 on the server's port: Drishti*net peers multiplex their forwarded reads over one connection (h2c by the upgrade on
    # plain HTTP, ALPN on TLS); browsers over TLS get it too. false: HTTP/1.1 only (peers then fall back to it on the same call).
    enabled: ${DRISHTI_HTTP2:true}
  tomcat:
    # After a 413 for an oversized body, Tomcat drains up to this much of the rest so the client reads the answer, not a reset.
    max-swallow-size: ${DRISHTI_MAX_SWALLOW:64MB}
  compression:
    enabled: true  # compress JSON answers and event streams
    mime-types: application/json,text/event-stream  # the content types compressed

management:
  endpoints:
    web:
      exposure:
        # the actuator endpoints served: /actuator/health (liveness and readiness probes), info, prometheus (timer drishti.view, gauges
        # drishti.live.*), metrics
        include: health,info,prometheus,metrics
  health:
    mail:
      enabled: false         # a mail server that is down is retried by the outbox; it must not turn the server's health red
  endpoint:
    health:
      probes:
        enabled: true  # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      group:
        readiness:
          # readiness that means ready (CD1, CLUSTER_DEPLOYMENT.md section 9.1): Spring's own state and this node's (drishti.node.readiness):
          # DOWN while joining, while an engine's newest date opens or an owned shard is not ready; OUT_OF_SERVICE while drained. Only
          # here: /actuator/health itself and liveness never wait for it
          include: readinessState,nodeReadiness

drishti:
  # The edition (docs/admin/EDITIONS.md): blank is the full Drishti; risk is Drishti Risk. It names
  # config/editions/<name>.yaml, read as a layer under the site's configuration before the packs load; every member of a cluster sets the
  # same value, and the console learns it from /api/v1/about. A change needs a restart.
  edition: ${DRISHTI_EDITION:}
  editions:
    dir: ${DRISHTI_EDITIONS_DIR:./config/editions}   # the folder of the edition files (and features.yaml, default-packs.yaml)
  # Lenses (EDITIONS.md › The design as built, section 8): editions a person may open on a full instance ("Open Drishti Risk"), for their own session; no restart,
  # every pack stays loaded. A lens hides, it does not secure. On by default (product owner, 2026-10-30): the four lenses; DRISHTI_LENSES= (empty) turns them off. Ignored with an edition.
  lenses: ${DRISHTI_LENSES:risk,world,market,trading}
  data:
    # The umbrella folder every runtime path below defaults under (identity database, caches, loads, collab, designs, reports, the
    # pack overlay and settings, governance, the sample feeds). Each path's own setting still overrides its default.
    dir: ${DRISHTI_DATA_DIR:./data}
  logging:                           # RESOURCES_AND_SCALE.md 6.4: the server's own log file, read by logging: above
    file: ${DRISHTI_LOG_FILE:}       # empty: standard output only (containers); drishti-stack sets run/logs/<node>.log
    max-file-mb: 100                 # one file's size before it rolls (also daily); rolled files compressed
    max-total-mb: 1024               # every rolled file together; the oldest go beyond
    max-files: 30                    # rolled days kept at most
  memory:                            # RESOURCES_AND_SCALE.md 5.2, D3, PO-2: one cache budget for the heap
    cache-share: 0.5                 # the share of -Xmx every cache in the budget may take together, in weighted pools
    # weights: {connector.idmaps: 20, connector.columns: 20, connector.documents: 6, connector.parts: 4, engine.answers: 20, engine.layouts: 10, small: 20}
    squeeze-at: 0.85                 # the heap after a collection past this share of -Xmx halves the connectors' and small pools for a minute
  admission:                         # busy protection (docs/admin/OPERATIONS.md "Busy protection"): new heavy work waits politely instead of an out-of-memory
    enabled: ${DRISHTI_ADMISSION_ENABLED:true}  # false: nothing waits (Admin -> Health still shows the readings)
    memory-warn: 0.80                # the heap after the last collection past this share of -Xmx: Health says "getting full"
    memory-refuse-heavy: 0.85        # past this, new date loads, downloads, BI runs and bulk loads wait (503 DRS-9502 to DRS-9505, Retry-After)
    memory-refuse-sign-in: 0.92      # past this, new sign-ins wait too (DRS-9501); people signed in keep working
    memory-free-min-mb: 768          # the memory levels act only while the heap left after the last collection is also under this
    queued-loads: 2                  # date loads that may wait behind the running ones (each engine's load-threads) before a new one waits
    open-heap-refuse: 1.2            # new date loads wait when the open dates' heap passes this share of its safety net (the dates in use are well over it)
    request-handlers: 200            # requests answered at once before the server counts as full
    requests-warn: 0.75              # share of request-handlers busy: Health says "getting full"
    requests-refuse: 0.90            # past this share, new heavy work waits
    queue-refuse: 50                 # new heavy work waits when more requests than this wait beyond request-handlers
    disk-warn-gb: 20                 # free disk of the data folder under this: Health says "getting full"
    disk-refuse-gb: 10               # under this, new date loads, downloads and bulk loads wait
    retry-after:                     # the seconds each kind of work is told to wait (Retry-After); a refusal is remembered that long
      sign-in: 45                    # a new sign-in (DRS-9501)
      load: 30                       # a new VaR or exposure date (DRS-9502)
      download: 30                   # an Export data download (DRS-9503)
      bi-run: 60                     # a BI run (DRS-9504)
      bulk-load: 120                 # a bulk load of a pack's data (DRS-9505)
      pivot-view: 20                 # a large pivot view (DRS-9507)
    keep: 50                         # refusals kept for Admin -> Health (in memory)
    override-max-minutes: 240        # the longest an operator's override may last (it ends by itself)
  disk:                              # RESOURCES_AND_SCALE.md 7: the local disk
    min-free-percent: 10             # the free-space guard: a build that would leave less than this share of the disk free is refused (DRS-5218)...
    min-free-gb: 20                  # ...or less than this many GB (both must hold)
    check-interval: 60s              # every folder measured and brought under its cap this often
    max-dumps: 2                     # heap dumps kept in the -XX:HeapDumpPath folder; the oldest beyond go at start
    dumps-dir: ${drishti.data.dir:./data}/dumps   # the dump folder when -XX:HeapDumpPath does not name one
  native:                            # native libraries (docs/admin/OPERATIONS.md section 2.1; HIGH_PERFORMANCE_NATIVE.md section 6): nothing here can stop the server
    cache-dir: ${DRISHTI_NATIVE_CACHE_DIR:${drishti.data.dir:./data}/native-cache}  # where the bundled native libraries are unpacked (JavaCPP's cache), under the data folder
    max-bytes-mb: 1024               # the most off-heap memory JavaCPP may allocate itself (org.bytedeco.javacpp.maxBytes); BLAS calls take Java arrays
    blas:
      mode: ${DRISHTI_NATIVE_BLAS_MODE:auto}  # auto: the bundled OpenBLAS (Linux and Windows x86-64), else the Java kernels with a warning, an alert and Health DEGRADED; java: the Java kernels, chosen (no warning)
      max-call-mb: 256               # a BLAS call whose operands pass this many MB runs on Java (bounds what one native call copies)
      canary-interval: 6h            # the self-test against Java is run again this often (0: only at start); a failure switches OpenBLAS off for the run
      gemm-min-sets: 32              # a 1,024-row tile of many-scope sums is one dgemm when at least this many sets share it (tuned on one machine: BENCHMARK.md section 17)
      gemm-min-density: 0.25         # ...and at least this share of its (set, row) pairs are members; sparser tiles are added in Java
  engines:                           # compute engines on or off per node, each with its own file (docs/architecture/COMPUTE_ENGINES.md; Admin -> Engines)
    dir: ${DRISHTI_ENGINES_DIR:./config/engines}   # the folder of the engines' files Admin -> Engines writes (the imports above name the same folder)
    drain: 30s                       # an engine turned off live: requests in flight finish within this, then are cancelled
    watch-seconds: 5                 # how often the engine files are compared with what was read (an edit by hand takes effect as from the page)
  metrics:                           # the platform metrics and alerts (docs/admin/OPERATIONS.md section 13.6; RESOURCES_AND_SCALE.md 8.3, 8.5)
    enabled: ${DRISHTI_METRICS_ENABLED:true}  # export the platform gauges (caches, memory budget, disk, sources, feeds, loads) on /actuator/prometheus and evaluate the alert rules
    sample-interval: 15s             # how often the gauges are sampled and the alert rules evaluated
    disk-interval: 60s               # how often the disk folders are measured for the gauges (a folder's size walks its files)
    alerts:
      enabled: ${DRISHTI_ALERTS_ENABLED:true}  # evaluate the platform alert rules (Admin -> Health, Alerts; GET /api/v1/admin/alerts)
      file: ${DRISHTI_ALERTS_FILE:./config/alerts/platform-alerts.yaml}  # the rules: metric, threshold, how long, severity (a missing file: no rules, and Health says so)
      notify-roles: admin            # the roles told in their inbox (and the bell) when an alert opens, comma-separated; blank: nobody
      keep: 200                      # alerts opened and closed kept for the page, newest first (in memory: a restart starts afresh)
  store:
    # The content store (docs/architecture/DATA_ARCHITECTURE.md): user content every node of a cluster can reach. Its settings are in their own file.
    file: ${DRISHTI_STORE_FILE:./config/store/store.yaml}
    root: ${DRISHTI_STORE_ROOT:}   # the filesystem backend's root, over the file's filesystem.root (empty: the file's, else <data folder>/fstore)
  edit:
    # Write-back (docs/guides/WRITE_BACK.md): its settings are in their own folder (edit.yaml, lanes.yaml, policy.yaml, retention.yaml).
    # Off as shipped (edit.enabled: false there): a fresh install or an upgrade is read-only.
    file: ${DRISHTI_EDIT_FILE:./config/edit/edit.yaml}
  index:
    # Where the connectors' multi-day type-ahead index keeps closed days as block-compressed segment files (one subfolder per
    # connector). Blank: <data dir>/index, i.e. ./data/index. Size is capped per connector by its index.max-disk; a day that
    # rolls out of the window, is evicted by the cap or is rebuilt gives its disk back at once.
    dir: ${DRISHTI_INDEX_DIR:}
  branding:
    # The product's name and legal notices, wherever people see them (pages, the About answer, messages). Change them
    # here, not in code; the console has the same keys under ui: in drishti-console/config/application.yaml.
    product: ${DRISHTI_PRODUCT:Drishti}
    tagline: Any data. Any domain. One grammar.  # the line under the name
    owner: Ashutosh Sinha  # who holds the rights, named in the About answer
    # the copyright line of the About answer (GET /api/v1/about)
    copyright: Copyright (c) 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
    notice: Unauthorised copying, use or distribution is prohibited.  # the legal notice beside it (also in the public /public/about)
  offline:
    # Offline mode, for a machine with no internet (a demonstration laptop): connectors of the plugins below, whose data comes from public
    # web services, never start, whatever their files say; Admin -> Connectors shows them "off (offline mode)", and their kinds are served
    # by the other connectors that hold them (news-and-markets: news-store, built from the captured snapshot by `drishti.py lake demo`).
    enabled: ${DRISHTI_OFFLINE:false}
    plugins: news,yfinance,feed      # the public-data feed plugin too (US Treasury, ECB, NY Fed, FRED: market-data pack)
  net:
    # Drishti*net (docs/admin/OPERATIONS.md): several servers as one. OFF unless <dir>/node.yaml says enabled: true; without the folder
    # this server is a single server exactly as before. Everything else (this node, its seed peers, gossip timings, routing,
    # nodes per role) is in the files of that folder, managed like connector files (Admin -> Net, drishti.py net), never here.
    dir: ${DRISHTI_NET_DIR:./config/net}     # created on first write; ready-made files in config/net.examples/
    watch: ${DRISHTI_NET_WATCH:auto}         # auto (file events, polling as a fallback) | poll | off
    poll: 5s  # how often the folder is looked at when polling (and, with file events, at least this often anyway)
  node:
    # This server as one node of a cluster (CLUSTER_DEPLOYMENT.md sections 4.6, 9.1 and 10.1; CD1 and CD2)
    readiness:                       # what /actuator/health/readiness waits for (liveness and /actuator/health never wait)
      enabled: true                  # false: readiness is Spring's alone (up once started)
      joining: true                  # DOWN while this node joins Drishti*net (its peers' digests not had yet; at most join-grace)
      engines: true                  # DOWN while an enabled engine's (VaR, exposure) newest date is not open here; the check opens it
      shards: true                   # DOWN while a VaR shard this member owns of a date in use is not ready here
    drain:                           # the drain before a stop: POST /api/v1/admin/node/drain, Admin -> Net "Drain for a stop", the stop hooks
      settle-seconds: 5              # after the drain, how long until no peer forwards work here (the flag reaches every peer by gossip)
  sources:
    # Longest a single source read may take before the view shows the entity as unavailable (DRS-1004), and a panel's own source
    # (another pack's data, for example) before the panel shows that it failed. 10 s: the first read of a business date on a large
    # table loads that date's id index first (300K trades: a few seconds), and a slow source is not reported as missing.
    fetch-timeout: 10s
    # Optional directory of extra plugin jars; each gets its own class loader.
    plugin-dir: ${DRISHTI_PLUGIN_DIR:}
    # kind -> plugin. Kinds without a route try default-route first, then any plugin that serves them.
    default-route: demo
    routes: {}  # kind -> plugin or connector that serves it (packs add theirs: trade: trade-endur)
    plugins:
      demo:
        enabled: ${DRISHTI_DEMO_ENABLED:true}  # run the demo source (the packs' sample data)
      file:
        enabled: true  # run the bundled file source (JSON Lines under its root)
        settings:
          root: ${DRISHTI_FEEDS:${drishti.data.dir}/feeds}  # the folder the bundled file source reads
          source-name: feed-file  # the name its documents carry as provenance
          rescan-seconds: 30  # how often the folder is scanned for new or changed files
      rest:                         # an HTTP/JSON service; off until configured
        enabled: ${DRISHTI_REST_ENABLED:false}  # run the rest source as itself (one instance)
        settings:
          base-url: ${DRISHTI_REST_URL:http://localhost:9000/api}  # the REST service's base URL
          path: /{kind}/{id}  # the path of one entity under the base URL ({kind} and {id} filled in)
          source-name: rest  # the name its documents carry as provenance
          timeout-ms: 2000  # connect and request timeout, in milliseconds
      jdbc:                         # a database; the driver jar goes on the class path or plugin-dir
        enabled: ${DRISHTI_JDBC_ENABLED:false}  # run the jdbc source as itself (one instance)
        settings:
          url: ${DRISHTI_JDBC_URL:}  # the JDBC URL of that instance
          user: ${DRISHTI_JDBC_USER:}  # its database user
          password: ${DRISHTI_JDBC_PASSWORD:}  # its database password (from the environment)
          source-name: jdbc  # the name its documents carry as provenance
          # pool-size: inherits drishti.db.pool.size (20); set it here for this connector only
          # Named parameters :id and :asOf (the business date) make it dated, e.g.
          # query.trade: SELECT json FROM trades WHERE trade_id = :id AND business_date = (SELECT MAX(business_date)
          #              FROM trades WHERE trade_id = :id AND business_date <= :asOf)
      delta:                        # the Delta Lake plugin; runs as named connectors (packs declare them per data domain)
        enabled: false  # false: the delta plugin runs only as named connectors, never as itself
      aerospike:                    # the Aerospike plugin; runs as named connectors (profile `aerospike`)
        enabled: false  # false: only as named connectors
      cassandra:                    # the Apache Cassandra plugin (also ScyllaDB, Astra, Keyspaces); runs as named connectors
        enabled: false  # false: only as named connectors (config/connectors.examples/cassandra/)
      activemq:                     # ActiveMQ queues and topics; off until configured (or used as a named connector)
        enabled: ${DRISHTI_ACTIVEMQ_ENABLED:false}  # run the activemq source as itself
      rabbitmq:                     # RabbitMQ queues; off until configured (or used as a named connector)
        enabled: ${DRISHTI_RABBITMQ_ENABLED:false}  # run the rabbitmq source as itself
      s3:                           # documents in Amazon S3 or an S3-compatible store; off until configured
        enabled: ${DRISHTI_S3_ENABLED:false}  # run the s3 source as itself
    # Named connectors: several instances of a plugin, each with its own settings. They live in FILES, one per connector:
    #   <connectors-dir>/<name>.yaml     the file name is the connector's logical name; packs refer to it by that name.
    # The folder is watched: a changed file restarts only that connector, a new file starts one, a deleted file stops it.
    # See docs/connectors/CONNECTOR_FILES.md and Admin -> Connectors. Ready-made files: config/connectors.examples/.
    connectors-dir: ${DRISHTI_CONNECTORS_DIR:./config/connectors}   # created on first write
    connectors-watch: auto                  # auto (file events, polling as a fallback) | poll | off
    connectors-poll: 5s                     # how often the files are looked at (also the safety net beside file events)
    connectors-drain: 3s                    # a connector being restarted or stopped stays open this long so reads in flight finish
    connectors-generate: true               # write a connector file from a pack's connector template when none of that name exists
    # DEPRECATED: connectors defined here still work (and override the file of the same name, setting by setting), but the
    # server logs a warning naming the equivalent file. Move them to <connectors-dir>/<name>.yaml.
    connectors: {}
  business-date:
    # Every read is for a business date. The default is today in `zone`, rolled back to a business day of
    # `calendar` (weekends and holidays roll to the previous business day). Users pick another date in the top
    # bar; dated sources (Delta Lake, dated folders, databases with a date column) then read that date.
    calendar: ${DRISHTI_CALENDAR:USNY}      # USNY, GBLO, EUTA, JPTO, CATO or joint, e.g. USNY+GBLO
    zone: America/New_York  # whose clock decides what today is (any Java zone id: Europe/London)
    history: P5Y                            # how far back users may go
  history:
    # History queries (TRD 1000015 30): one entity over the business days it has data. docs/architecture/DATA_ARCHITECTURE.md
    enabled: true                           # off: no history is read; the endpoint answers DRS-1012
    default-days: 30                        # the range when a link or the CLI names none
    max-days: 366                           # the most business days one request may span (a pack's max-days can only lower it)
    max-rows: 1000                          # the most rows returned
    max-columns: 200                        # the most columns
    timeout: 10s                            # the whole request; days not read by then make the answer partial (DRS-1014)
    parallel-days: 8                        # days read at once per request by the default per-day loop
    max-concurrent: 16                      # history requests running at once on this server
    cache-mb: 256                           # heap for cached answers (keyed by the data's version), one budget for every caller
  security:
    # Off for local development. Production: enabled: true and DRISHTI_TOKEN_SECRET (>= 32 bytes, shared with the console).
    enabled: ${DRISHTI_SECURITY_ENABLED:false}
    secret: ${DRISHTI_TOKEN_SECRET:}  # the token signing secret (at least 32 bytes), shared with the console; from the environment only
    registered-users-only: true      # a signed token is refused when its user was deleted or disabled (false: trust the token alone)
    clock-skew: 30s  # clock difference tolerated when checking a token's expiry
    # With security on, /actuator (except /actuator/health) needs an admin token or this one, for Prometheus:
    #   scrape_configs: [{ job_name: drishti, metrics_path: /actuator/prometheus, bearer_token: <this> }]
    metrics-token: ${DRISHTI_METRICS_TOKEN:}
    # A personal API token reads by default: GET and HEAD, plus these POSTs, which carry a query in the body and change nothing
    # (a pivot of a search, a command line). Add a path only if it writes nothing.
    token-read-posts:
      - /api/v1/pivot/query              # the pivot engine (PIVOT_GUIDE.md): a view's answer, its estimate, a node opened, two dates compared,
      - /api/v1/pivot/estimate           # a cell's rows and an export: each reads as the caller and writes nothing
      - /api/v1/pivot/expand
      - /api/v1/pivot/compare
      - /api/v1/pivot/rows
      - /api/v1/pivot/export
      - /api/v1/pivot/inline             # rows the caller already holds (a chart of a table's shown rows), aggregated by the engine
      - /api/v1/explain                  # Explain any number with a body (a pivot cell's view): computed as the caller, written nowhere
      - /api/v1/tables/editor/check      # the table and model editors (TABLES_GUIDE.md section 11): checks, previews and proposals that store nothing
      - /api/v1/tables/editor/statement
      - /api/v1/tables/editor/preview
      - /api/v1/tables/editor/access
      - /api/v1/tables/editor/suggest
      - /api/v1/tables/editor/python/notebook
      - /api/v1/tables/editor/python/contract
      - /api/v1/pivot/live               # a live pivot: the same answer kept current for the caller (ended by DELETE, or when no stream reads it)
      - /api/v1/pivot/explain            # the difference between two cells in steps, computed as the caller, stored nowhere
      - /api/v1/pivot/whatif             # a view with an overlay beside the original, computed as the caller, stored nowhere
      - /api/v1/pivot/functions/test     # the custom-function playground: the harness on a sample, nothing saved
      - /api/v1/pivot/mr/headline        # the MR cube's lens (MR_CUBE_GUIDE.md): a view's headline, a cell's detail and history and the
      - /api/v1/pivot/mr/detail          # what-if side by side, each computed by the VaR engine as the caller, written nowhere
      - /api/v1/pivot/mr/history
      - /api/v1/pivot/mr/what-if
      - /api/v1/var/basket/sheet        # the basket sheet's checks and figures, computed as the caller, saved nowhere
      - /api/v1/var/basket/sheet.xlsx   # the sheet as a workbook, written nowhere on the server
      - /api/v1/command
      - /api/v1/forms/*/*/compile        # query by form: writes the criteria out as a search command, nothing else
      - /api/v1/changes/preview          # write-back's review sheet: what a change would do, written nowhere
      - /api/v1/bi/datasets/*/query     # Rupaka phase 2: a dataset query (fields, measures, filters in the body), masked and row-ruled, changes nothing
      - /api/v1/bi/datasets/validate    # checks a dataset's YAML without storing it
      - /api/v1/bi/mq                   # the model query language (docs/architecture/BI_DESIGN.md › The model layer: the specification, section 15): one query of a model as the caller, changes nothing
      - /api/v1/bi/models/*/query       # the same with the model in the path
      - /api/v1/bi/mq/validate          # checks a model query without reading data
      - /api/v1/bi/models/validate      # checks a model's or a rachana 2 dataset's YAML without storing it
      - /api/v1/bi/sql                  # one read-only Drishti SQL statement over a model as the caller (or EXPLAIN), changes nothing
      - /api/v1/bi/sql/validate         # checks a Drishti SQL statement without reading data
      - /api/v1/bi/expr/validate        # checks one expression (DEL) in its scope against a model as the caller sees it, reads no data
      - /api/v1/bi/reports/statement/preview  # a statement's pages laid out for the caller (masked), stores nothing
      - /api/v1/bi/reports/statement/file     # the same as a PDF or Excel file for the caller, stores nothing
      - /api/v1/bi/expr/convert         # converts an expression or an item's YAML from the old syntax to DEL v2, stores nothing
      - /api/v1/bi/mq/subscribe         # a standing query: the same answer kept current for the caller (ended by DELETE, or when no stream reads it)
      - /api/v1/bi/model/start          # a draft dataset from pack kinds: reads connectors, stores nothing
      - /api/v1/bi/model/infer          # relationships proposed by value matching: reads connectors, stores nothing
      - /api/v1/bi/reports/*/query      # Rupaka phase 3: one visual of a report under the page's state, through the dataset engine, masked and row-ruled
      - /api/v1/bi/reports/*/python     # Rupaka phase 6: what a python visual runs (the item, its manifest and source as the caller reads it), stores nothing
      - /api/v1/bi/python/validate      # checks a Python item's manifest without storing it
      - /api/v1/bi/python/check         # checks a Python item and runs its own tests on the compute pool as the caller; stores nothing (the runs are audited)
      - /api/v1/bi/python/visual        # one python visual of a report run on the compute pool over the caller's rows; stores nothing (audited)
      - /api/v1/bi/python/profile       # the profile of rows the caller may read, worked out on the compute pool (no authored code); stores nothing
      - /api/v1/bi/reports/query        # the same for draft YAML (authors)
      - /api/v1/bi/reports/validate     # checks a report's YAML without storing it
      - /api/v1/bi/boards/validate      # checks a board's YAML without storing it
      - /api/v1/bi/reports/format       # writes a report model as YAML
      - /api/v1/bi/boards/format        # writes a board model as YAML, stores nothing
      - /api/v1/bi/boards/convert       # a 2.3 board converted to the report with board pages it becomes (drishti.py bi migrate --boards FILE), stores nothing
      - /api/v1/bi/themes/validate      # checks a theme's YAML without storing it
      - /api/v1/bi/python/input         # one input of a Python Transform as the caller (the Transform editor's preview and profile), masked and row-ruled, stores nothing
      - /api/v1/bi/items/*/tests        # runs the expected values (tests:) of a report or dataset as the caller or a role they hold: queries only, stores nothing
      - /api/v1/bi/runs                 # BI runs (docs/architecture/BI_DESIGN.md › BI runs: every BI query as a bounded, visible job (built), section 14): one question as the caller, answered inline or as a run of theirs; changes no data
      - /api/v1/bi/runs/estimate        # a run's tier and estimate from metadata only, runs nothing
      - /api/v1/export/*                # Rupaka phase 7: a report, visual or view rendered as PDF, PNG, Excel or CSV for the caller (masked), stores nothing
      - /api/v1/subscriptions/preview   # renders what a subscription would send, for the caller, stores nothing
      - /api/v1/compute/*/*             # a reactive connector's answer for the caller (DATA_ARCHITECTURE.md): computed and cached, changes no data
      - /api/v1/exposure/what-if        # incremental exposure before dealing (EXPOSURE_GUIDE.md section 18.7) for the caller: computed, stores nothing
      - /api/v1/var/what-if             # VaR before and after hypothetical trades (VAR_GUIDE.md section 8.5) for the caller: computed by the Python engine, stores nothing
    # WRITE SCOPES (TOKEN_SCOPES in docs/guides/API_GUIDE.md): a token is made with `read` (the default: all of the above) or with
    # scopes from this list (keys in [brackets] keep the colon); each opens the METHOD path patterns under `allow` (* = any method). A scope is only a door: the
    # controller behind it still checks the roles of the token's user at the time of the call, so a token never does more than
    # its user. A write that no scope opens, and nothing in token-never, is refused. Every non-GET endpoint must be declared in
    # token-read-posts, a scope or token-never (TokenScopeGuardTest fails the build otherwise).
    token-scopes:
      "[risk:write]":
        description: "Save, share and delete your VaR baskets, capture VaR and exposure results, keep your what-if sandboxes and cancel your own computations (VAR_GUIDE.md, EXPOSURE_GUIDE.md, DATA_ARCHITECTURE.md). Your own items only (an administrator's token may also delete anyone's basket, as its user may); the bank's data is never changed."
        allow:
          - POST /api/v1/var/baskets
          - POST /api/v1/frtb/playground/recipes   # save a FRTB-SA playground recipe (yours, replayable)
          - POST /api/v1/simm/playground/recipes   # save a SIMM playground recipe
          - DELETE /api/v1/var/baskets/*/*
          - DELETE /api/v1/var/baskets/*
          - POST /api/v1/var/captures
          - POST /api/v1/var/reports/*/runs           # generate a regulatory report run (frozen, versioned); its sign-off is never a token's
          - POST /api/v1/exposure/captures
          - POST /api/v1/compute/sandboxes
          - PUT /api/v1/compute/sandboxes/*
          - DELETE /api/v1/compute/sandboxes/*
          - POST /api/v1/compute/sandboxes/*/copy
          - DELETE /api/v1/compute/requests/*
      "[data:read]":
        description: "Read data through Arrow Flight (FLIGHT_GUIDE.md): kinds, BI models, pivot views, VaR vectors and the in-memory lake, as your roles, masks and row rules allow, every read audited. It opens no HTTP call. data:read:<domain> (a pack such as trading, bi, var, a lake) opens one domain only."
        allow: []
      "[edit]":
        description: "Submit changes through write-back (WRITE_BACK.md: forms, the CLI's change propose), approve or reject other people's, withdraw your own. No token has it unless chosen; it never exceeds your roles: the edit power, the field's roles, masks and four eyes all apply, and editing must be on."
        allow:
          - POST /api/v1/changes
          - POST /api/v1/changes/*/approve
          - POST /api/v1/changes/*/reject
          - POST /api/v1/changes/*/withdraw
      "[design:write]":
        description: "Create, edit, check, propose, share and bind Designs, save Sutras from Studio (a save is a proposal with governance on), withdraw your own proposals. Needs the author role."
        allow:
          - POST /api/v1/builder/**
          - PUT /api/v1/builder/**
          - PATCH /api/v1/builder/**
          - DELETE /api/v1/builder/**
          - POST /api/v1/studio/**
          - POST /api/v1/sutras
          - POST /api/v1/sutras/proposals/*/withdraw
      "[design:approve]":
        description: "Approve or reject proposed Sutras. Needs the approver or admin role, and never your own proposal with four-eyes on."
        allow:
          - POST /api/v1/sutras/proposals/*/approve
          - POST /api/v1/sutras/proposals/*/reject
      "[bi:write]":
        description: "Business intelligence (Rupaka): create, edit, move, propose, withdraw, publish and delete your workspaces' items, restore versions and saved states, ask what a dataset change would break, mark favourites, create workspaces (when the policy lets you). Needs the bi-author power and the workspace role at call time."
        allow:
          - POST /api/v1/bi/workspaces
          - POST /api/v1/bi/workspaces/*/items
          - POST /api/v1/bi/items/*/open
          - POST /api/v1/bi/items/*/move
          - POST /api/v1/bi/items/*/propose
          - POST /api/v1/tables/editor/save
          - POST /api/v1/tables/editor/propose
          - POST /api/v1/bi/items/*/withdraw
          - POST /api/v1/bi/items/*/publish
          - POST /api/v1/bi/items/*/versions/*/restore
          - POST /api/v1/bi/items/*/history/*/restore
          - POST /api/v1/bi/items/*/impact
          - POST /api/v1/bi/datasets/*/refresh
          - POST /api/v1/bi/datasets/*/transform/run
          - DELETE /api/v1/bi/mq/subscribe/*
          - POST /api/v1/bi/runs/*/confirm
          - POST /api/v1/bi/runs/*/cancel
          - POST /api/v1/bi/runs/*/rerun
          - POST /api/v1/bi/runs/*/export
          - POST /api/v1/bi/runs/*/share
          - DELETE /api/v1/bi/runs/*/share/*
          - POST /api/v1/bi/runs/*/promote
          - POST /api/v1/bi/runs/*/keep
          - DELETE /api/v1/bi/runs/*/result
          - POST /api/v1/bi/runs/*/schedule
          - PUT /api/v1/bi/runs/schedules/*
          - DELETE /api/v1/bi/runs/schedules/*
          - PUT /api/v1/bi/items/*
          - PUT /api/v1/bi/items/*/favourite
          - DELETE /api/v1/bi/items/*
      "[bi:approve]":
        description: "Business intelligence: approve or reject proposed items (the approve power or bi-steward, never your own proposal with four-eyes on), endorse (promote; certify needs bi-steward) and import a bundle (bi-steward)."
        allow:
          - POST /api/v1/bi/items/*/approve
          - POST /api/v1/bi/items/*/reject
          - POST /api/v1/bi/items/*/endorse
          - POST /api/v1/bi/bundle/import
          - POST /api/v1/bi/imports/*/rollback   # undo an import (a steward, as the import itself)
      "[bi:admin]":
        description: "Business intelligence: change a workspace (settings, members, delete) and the BI settings. Needs the workspace admin role or the bi-admin power at call time."
        allow:
          - PUT /api/v1/bi/workspaces/*
          - DELETE /api/v1/bi/workspaces/*
          - PUT /api/v1/bi/workspaces/*/members/*
          - DELETE /api/v1/bi/workspaces/*/members/*
          - PUT /api/v1/bi/settings
          - POST /api/v1/bi/admin/runs/*/cancel
          - POST /api/v1/bi/admin/runs/suggestions/*/accept
          - POST /api/v1/bi/admin/runs/suggestions/*/dismiss
      "[pivot:write]":
        description: "Pivot: end your live pivots, save a custom function as a new version and submit it for approval (the harness must pass)."
        allow:
          - DELETE /api/v1/pivot/live/*
          - POST /api/v1/pivot/functions
          - POST /api/v1/pivot/functions/*/*/submit
      "[pivot:comment]":
        description: "Pivot: comment on a cell of a saved view you may open, and resolve, reopen or delete your comments (the view's owner: any of its comments)."
        allow:
          - POST /api/v1/pivot/views/*/*/comments
          - POST /api/v1/pivot/views/*/*/comments/*/resolve
          - POST /api/v1/pivot/views/*/*/comments/*/reopen
          - DELETE /api/v1/pivot/views/*/*/comments/*
      "[pivot:approve]":
        description: "Pivot: approve or revoke a custom function someone else wrote (the pivot-approver role or an administrator at call time; never your own)."
        allow:
          - POST /api/v1/pivot/functions/*/*/approve
          - POST /api/v1/pivot/functions/*/*/revoke
      "[pivot:admin]":
        description: "Pivot: define, remove and refresh rollups of partial states (Admin -> Pivot rollups). Needs the admin role at call time."
        allow:
          - POST /api/v1/pivot/rollups
          - DELETE /api/v1/pivot/rollups/*
          - POST /api/v1/pivot/rollups/*/refresh
      "[packs:admin]":
        description: "Load, unload, switch on and off, deploy archives, install and roll back packs, and create, change, test and delete connectors (Admin -> Connectors), and Retry now for packs, connectors, AI providers and MCP servers. Needs the admin role."
        allow:
          - POST /api/v1/admin/packs/*/load
          - POST /api/v1/admin/packs/*/unload
          - PUT /api/v1/admin/packs/*
          - POST /api/v1/admin/packs/deploy
          - POST /api/v1/admin/packs/deploy/*
          - POST /api/v1/admin/packs/deploy/*/connectors
          - DELETE /api/v1/admin/packs/deploy/*
          - POST /api/v1/admin/packs/*/rollback
          - POST /api/v1/admin/packs/*/data
          - PUT /api/v1/admin/connectors/*
          - DELETE /api/v1/admin/connectors/*
          - POST /api/v1/admin/connectors/**
          - POST /api/v1/admin/registry/**
          - POST /api/v1/admin/retry/*
          - POST /api/v1/admin/dataload/undo    # undo a load by its load id (drishti.py lake undo, Admin -> Data loads -> Undo a load; an administrator)
      "[loads:write]":
        description: "Announce that a batch of data has landed (or failed) for a pack: Drishti then refreshes, verifies, checks alerts and tells the people the pack names. Only for packs your roles reach; needs no admin role."
        allow:
          - POST /api/v1/packs/*/loads
          - POST /api/v1/admin/lakes/memory/refill/*   # run an in-memory table's refill job now (drishti.py lake memory refill; the server still requires an administrator)
          - POST /api/v1/admin/dataload/run     # the data inbox's Load now (drishti.py dataload run; the server still requires an administrator)
          - POST /api/v1/admin/dataload/retry   # a failed inbox file back into the inbox (drishti.py dataload retry; an administrator)
      "[node:drain]":
        description: "Drain this server before it stops and take it back (the stop hooks and the rolling upgrade runner, CLUSTER_DEPLOYMENT.md section 10.1): forwarded work and VaR shards handed to other members, readiness out of service. Needs the admin role at call time."
        allow:
          - POST /api/v1/admin/node/drain
      "[ai:use]":
        description: "Call the configured models and MCP tools through the AI policy (chat, MCP tool calls, and the BI hooks: report from words, ask the data, explain this number). Admin pages stay closed."
        allow:
          - POST /api/v1/ai/chat
          - POST /api/v1/ai/mcp/*/tools/*
          - POST /api/v1/bi/ai/*
      "[ai:admin]":
        description: "Send a test call to a configured model (Admin -> AI). Needs the admin role."
        allow:
          - POST /api/v1/admin/ai/test
    token-never:                       # never for a token, whatever its scopes: tokens, users, sign-in, personal and collaboration state
      - POST /api/v1/bi/python/cell      # a Notebook cell: code a person writes, run on the compute pool from the console only
      - POST /api/v1/bi/python/steps     # a Transform's step-by-step run: an author in the console
      - POST /api/v1/tables/editor/python/run   # a Python-driven table's sample run: an author in the console
      - POST /api/v1/pivot/views         # a saved pivot view: a person's, in the console
      - DELETE /api/v1/pivot/views/*
      - POST /api/v1/pivot/promote       # a panel's pivot promoted to its Sutra: an author, in the console
      - POST /api/v1/pivot/views/*/restore   # an old version of a saved view saved again: a person's, in the console
      - POST /api/v1/bi/migrate/models/convert   # migration: an administrator in the console, never a token
      - POST /api/v1/bi/migrate/models
      - POST /api/v1/bi/migrate/expressions
      - POST /api/v1/bi/migrate/boards           # the stored 2.3 boards converted into reports: an administrator in the console
      - POST /api/v1/bi/models/*/preview-as     # previews another role's answers: audited, in the console only
      - PUT /api/v1/tables/editor/prefs         # a person's editor view: personal, in the console
      - "* /api/v1/me/**"
      - "* /api/v1/drafts/**"                  # form drafts: personal, kept per person, saved from the console (WRITE_BACK.md)
      - POST /api/v1/admin/edits/**            # write-back's switches (a connector's writes, withdrawing an overlay): an administrator in the console
      - "* /api/v1/auth/**"
      - "* /api/v1/admin/tokens/**"
      - "PUT /api/v1/admin/busy/override"     # busy protection's operator override: an administrator in the console, with a reason, audited
      - "* /api/v1/net/**"                     # Drishti*net: nodes sign their calls with the cluster key; administrators use the console
      - "* /api/v1/compute/peer/**"            # compute fan-out between nodes: signed with the cluster key, never a token
      - "* /api/v1/admin/compute/**"           # compute pools, environments and four-eyes approvals: an administrator in the console
      - "POST /api/v1/compute/events"          # trigger events (the write-back hook): the server and administrators, never a token
      - "POST /api/v1/var/reload"              # reloading the VaR vectors: an administrator in the console
      - "POST /api/v1/var/official"            # running the official end-of-day VaR capture: an administrator in the console
      - "POST /api/v1/var/official/synthetic-history"   # seeding a demo server's synthetic official records: an administrator
      - "POST /api/v1/var/reports/*/runs/*/signoff"     # a report's maker, checker and approver sign as people, never a token
      - "POST /api/v1/var/stress-window/proposals"      # proposing a stress window is a governance step a person takes
      - "POST /api/v1/var/stress-window/proposals/*/decision"   # approving or rejecting one, by a second person
      - "POST /api/v1/var/intraday/streams/*/apply"   # applying a PV topic's waiting window now: an administrator in the console
      # VaR shards (docs/architecture/VAR_SHARDING.md section 10). /partial is one member's call to another, signed with the cluster key
      # and made as the caller (their on-behalf-of token; the owner applies their rights again): like /compute/peer/**, never a token's.
      # It reads data but is no read POST for a token, which would only add a door to the members' channel. /shards/drain takes a member's
      # shards away before it stops: an administrator (console, drishti.py var shards --drain, a task's stop hook signed in as one), never
      # a token, like /var/reload.
      - "POST /api/v1/var/partial"
      - "POST /api/v1/var/partials"            # many sets of one shard in one call: the same channel as /partial
      - "POST /api/v1/var/shards/drain"
