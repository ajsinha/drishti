# The Drishti server configuration. Precedence (low -> high): this file, application.local.yaml
# (git-ignored), environment variables, --key=value arguments.
spring:
  application:
    name: drishti
  threads:
    virtual:
      enabled: true          # every request runs on a virtual thread; fetches and link fan-out block cheaply
  main:
    banner-mode: off
  config:
    import: optional:file:./application.local.yaml

server:
  port: ${DRISHTI_PORT:18480}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/event-stream

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
