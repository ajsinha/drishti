# The Drishti server configuration. Precedence (low -> high): this file, application.local.yaml
# (git-ignored), environment variables, --key=value arguments.
spring:
  application:
    name: drishti
  threads:
    virtual:
      enabled: true          # every request runs on a virtual thread; fetches and link fan-out block cheaply
  ai:                                # Spring AI's own auto-configuration is off: Drishti builds clients from config/ai files
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  main:
    banner-mode: off
  config:
    import:
      - optional:file:./application.local.yaml
      # packs an administrator loaded from Admin → Packs (drishti.packs.added); written by the server, not by hand
      - optional:file:${DRISHTI_PACKS_OVERLAY:${drishti.data.dir:./data}/packs/added.yaml}

  # Email (docs/admin/CONFIGURATION.md, "Email"): set spring.mail.host (SPRING_MAIL_HOST) to switch the SMTP client on, with
  # port/username/password and properties.mail.smtp.* as for any Spring Boot application; leave host unset and no mail client exists.
  #   mail:
  #     host: smtp.example.com
  #     port: 587
  #     username: drishti
  #     password: ...
  #     properties.mail.smtp.starttls.required: true
  #     properties.mail.smtp.connectiontimeout: 10000
  #     properties.mail.smtp.timeout: 10000
  jpa:
    open-in-view: false      # no lazy loading while a view renders: the identity services load what they return

logging:
  # 2.9.7 (RESOURCES_AND_SCALE.md 6.4): with drishti.logging.file set the server writes its own log, rotated by size and day and kept
  # within a total (compressed); unset (containers), standard output only, as before. The stack sets it per node (run/logs/<node>.log).
  file:
    name: ${drishti.logging.file:}
  logback:
    rollingpolicy:
      max-file-size: ${drishti.logging.max-file-mb:100}MB    # one file's size before it rolls
      total-size-cap: ${drishti.logging.max-total-mb:1024}MB  # every rolled file together; the oldest go beyond
      max-history: ${drishti.logging.max-files:30}            # rolled days kept at most
  level:
    # expected, not a fault: a Delta table without checkpoints is read from its log (said once per table and read)
    io.delta.kernel.internal.snapshot.SnapshotManager: ERROR
    # Hibernate flags a setting Spring Boot itself sets as incubating
    org.hibernate.orm.incubating: ERROR
    # the Parquet reader and the Delta kernel say one INFO line per file read and per record looked up (thousands at start on
    # a large lake); Drishti says one line per table and date loaded, and the derived pages' progress every 100,000 records
    org.apache.parquet: WARN
    io.delta.kernel: WARN

server:
  port: ${DRISHTI_PORT:18480}
  shutdown: graceful
  http2:
    # HTTP/2 on the server's port (2.6.7): Drishti*net peers multiplex their forwarded reads over one connection (h2c by the upgrade on
    # plain HTTP, ALPN on TLS); browsers over TLS get it too. false: HTTP/1.1 only (peers then fall back to it on the same call).
    enabled: ${DRISHTI_HTTP2:true}
  tomcat:
    # After a 413 for an oversized body, Tomcat drains up to this much of the rest so the client reads the answer, not a reset.
    max-swallow-size: ${DRISHTI_MAX_SWALLOW:64MB}
  compression:
    enabled: true
    mime-types: application/json,text/event-stream

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    mail:
      enabled: false         # a mail server that is down is retried by the outbox; it must not turn the server's health red
  endpoint:
    health:
      probes:
        enabled: true

drishti:
  # The edition (docs/architecture/EDITIONS.md, docs/admin/EDITIONS_GUIDE.md): blank is the full Drishti; risk is Drishti Risk. It names
  # config/editions/<name>.yaml, read as a layer under the site's configuration before the packs load; every member of a cluster sets the
  # same value, and the console learns it from /api/v1/about. A change needs a restart.
  edition: ${DRISHTI_EDITION:}
  editions:
    dir: ${DRISHTI_EDITIONS_DIR:./config/editions}   # the folder of the edition files (and features.yaml, default-packs.yaml)
  # Lenses (EDITIONS.md section 8): editions a person may open on a full instance ("Open Drishti Risk"), for their own session; no restart,
  # every pack stays loaded. A lens hides, it does not secure. On by default (product owner, 2026-10-30): the four lenses; DRISHTI_LENSES= (empty) turns them off. Ignored with an edition.
  lenses: ${DRISHTI_LENSES:risk,world,market,trading}
  data:
    # The umbrella folder every runtime path below defaults under (identity database, caches, loads, collab, designs, reports, the
    # pack overlay and settings, governance, the sample feeds). Each path's own setting still overrides its default.
    dir: ${DRISHTI_DATA_DIR:./data}
  logging:                           # 2.9.7 (RESOURCES_AND_SCALE.md 6.4): the server's own log file, read by logging: above
    file: ${DRISHTI_LOG_FILE:}       # empty: standard output only (containers); drishti-stack sets run/logs/<node>.log
    max-file-mb: 100                 # one file's size before it rolls (also daily); rolled files compressed
    max-total-mb: 1024               # every rolled file together; the oldest go beyond
    max-files: 30                    # rolled days kept at most
  disk:                              # 2.9.7 (RESOURCES_AND_SCALE.md 7): the local disk
    max-dumps: 2                     # heap dumps kept in the -XX:HeapDumpPath folder; the oldest beyond go at start
    dumps-dir: ${drishti.data.dir:./data}/dumps   # the dump folder when -XX:HeapDumpPath does not name one
  store:
    # The content store (docs/architecture/CONTENT_STORE.md): user content every node of a cluster can reach. Its settings are in their own file.
    file: ${DRISHTI_STORE_FILE:./config/store/store.yaml}
    root: ${DRISHTI_STORE_ROOT:}   # the filesystem backend's root, over the file's filesystem.root (empty: the file's, else <data folder>/fstore)
  edit:
    # Write-back (docs/architecture/WRITE_BACK.md): its settings are in their own folder (edit.yaml, lanes.yaml, policy.yaml, retention.yaml).
    # Off as shipped (edit.enabled: false there): a fresh install or an upgrade is read-only.
    file: ${DRISHTI_EDIT_FILE:./config/edit/edit.yaml}
  index:
    # Where the connectors' multi-day type-ahead index keeps closed days as block-compressed segment files (one subfolder per
    # connector). Blank: <data dir>/index, i.e. ./data/index. Size is capped per connector by its index.max-disk; a day that
    # rolls out of the window, is evicted by the cap or is rebuilt gives its disk back at once.
    dir: ${DRISHTI_INDEX_DIR:}
  branding:
    # The product's name and legal notices, wherever people see them (pages, the About answer, messages). Change them
    # here, not in code; the console has the same keys under ui: in drishti-console/config/application.yaml.
    product: ${DRISHTI_PRODUCT:Drishti}
    tagline: Any data. Any domain. One grammar.
    owner: Ashutosh Sinha
    copyright: Copyright (c) 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
    notice: Unauthorised copying, use or distribution is prohibited.
  offline:
    # Offline mode, for a machine with no internet (a demonstration laptop): connectors of the plugins below, whose data comes from public
    # web services, never start, whatever their files say; Admin -> Connectors shows them "off (offline mode)", and their kinds are served
    # by the other connectors that hold them (news-and-markets: news-store, built from the captured snapshot by `drishti.py lake demo`).
    enabled: ${DRISHTI_OFFLINE:false}
    plugins: news,yfinance,feed      # the public-data feed plugin too (US Treasury, ECB, NY Fed, FRED: market-data pack)
  net:
    # Drishti*net (docs/admin/NET.md): several servers as one. OFF unless <dir>/node.yaml says enabled: true; without the folder
    # this server is a single server exactly as before. Everything else (this node, its seed peers, gossip timings, routing,
    # nodes per role) is in the files of that folder, managed like connector files (Admin -> Net, drishti.py net), never here.
    dir: ${DRISHTI_NET_DIR:./config/net}     # created on first write; ready-made files in config/net.examples/
    watch: ${DRISHTI_NET_WATCH:auto}         # auto (file events, polling as a fallback) | poll | off
    poll: 5s
  sources:
    # Longest a single source read may take before the view shows the entity as unavailable (DRS-1004). 5 s: the first read
    # of a business date on a large table loads that date's id index first (300K trades: a few seconds).
    fetch-timeout: 5s
    # Optional directory of extra plugin jars; each gets its own class loader.
    plugin-dir: ${DRISHTI_PLUGIN_DIR:}
    # kind -> plugin. Kinds without a route try default-route first, then any plugin that serves them.
    default-route: demo
    routes: {}
    plugins:
      demo:
        enabled: ${DRISHTI_DEMO_ENABLED:true}
      file:
        enabled: true
        settings:
          root: ${DRISHTI_FEEDS:${drishti.data.dir}/feeds}
          source-name: feed-file
          rescan-seconds: 30
      rest:                         # an HTTP/JSON service; off until configured
        enabled: ${DRISHTI_REST_ENABLED:false}
        settings:
          base-url: ${DRISHTI_REST_URL:http://localhost:9000/api}
          path: /{kind}/{id}
          source-name: rest
          timeout-ms: 2000
      jdbc:                         # a database; the driver jar goes on the class path or plugin-dir
        enabled: ${DRISHTI_JDBC_ENABLED:false}
        settings:
          url: ${DRISHTI_JDBC_URL:}
          user: ${DRISHTI_JDBC_USER:}
          password: ${DRISHTI_JDBC_PASSWORD:}
          source-name: jdbc
          # pool-size: inherits drishti.db.pool.size (20); set it here for this connector only
          # Named parameters :id and :asOf (the business date) make it dated, e.g.
          # query.trade: SELECT json FROM trades WHERE trade_id = :id AND business_date = (SELECT MAX(business_date)
          #              FROM trades WHERE trade_id = :id AND business_date <= :asOf)
      delta:                        # the Delta Lake plugin; runs as named connectors (packs declare them per data domain)
        enabled: false
      aerospike:                    # the Aerospike plugin; runs as named connectors (profile `aerospike`)
        enabled: false
      cassandra:                    # the Apache Cassandra plugin (also ScyllaDB, Astra, Keyspaces); runs as named connectors
        enabled: false
      activemq:                     # ActiveMQ queues and topics; off until configured (or used as a named connector)
        enabled: ${DRISHTI_ACTIVEMQ_ENABLED:false}
      rabbitmq:                     # RabbitMQ queues; off until configured (or used as a named connector)
        enabled: ${DRISHTI_RABBITMQ_ENABLED:false}
      s3:                           # documents in Amazon S3 or an S3-compatible store; off until configured
        enabled: ${DRISHTI_S3_ENABLED:false}
    # Named connectors: several instances of a plugin, each with its own settings. They live in FILES, one per connector:
    #   <connectors-dir>/<name>.yaml     the file name is the connector's logical name; packs refer to it by that name.
    # The folder is watched: a changed file restarts only that connector, a new file starts one, a deleted file stops it.
    # See docs/connectors/CONNECTOR_FILES.md and Admin -> Connectors. Ready-made files: config/connectors.examples/.
    connectors-dir: ${DRISHTI_CONNECTORS_DIR:./config/connectors}   # created on first write
    connectors-watch: auto                  # auto (file events, polling as a fallback) | poll | off
    connectors-poll: 5s                     # how often the files are looked at (also the safety net beside file events)
    connectors-drain: 3s                    # a connector being restarted or stopped stays open this long so reads in flight finish
    connectors-generate: true               # write a connector file from a pack's connector template when none of that name exists
    # DEPRECATED: connectors defined here still work (and override the file of the same name, setting by setting), but the
    # server logs a warning naming the equivalent file. Move them to <connectors-dir>/<name>.yaml.
    connectors: {}
  business-date:
    # Every read is for a business date. The default is today in `zone`, rolled back to a business day of
    # `calendar` (weekends and holidays roll to the previous business day). Users pick another date in the top
    # bar; dated sources (Delta Lake, dated folders, databases with a date column) then read that date.
    calendar: ${DRISHTI_CALENDAR:USNY}      # USNY, GBLO, EUTA, JPTO, CATO or joint, e.g. USNY+GBLO
    zone: America/New_York
    history: P5Y                            # how far back users may go
  history:
    # History queries (TRD 1000015 30): one entity over the business days it has data. docs/architecture/HISTORY_QUERIES.md
    enabled: true                           # off: no history is read; the endpoint answers DRS-1012
    default-days: 30                        # the range when a link or the CLI names none
    max-days: 366                           # the most business days one request may span (a pack's max-days can only lower it)
    max-rows: 1000                          # the most rows returned
    max-columns: 200                        # the most columns
    timeout: 10s                            # the whole request; days not read by then make the answer partial (DRS-1014)
    parallel-days: 8                        # days read at once per request by the default per-day loop
    max-concurrent: 16                      # history requests running at once on this server
    cache-mb: 256                           # heap for cached answers (keyed by the data's version), one budget for every caller
  security:
    # Off for local development. Production: enabled: true and DRISHTI_TOKEN_SECRET (>= 32 bytes, shared with the console).
    enabled: ${DRISHTI_SECURITY_ENABLED:false}
    secret: ${DRISHTI_TOKEN_SECRET:}
    registered-users-only: true      # a signed token is refused when its user was deleted or disabled (false: trust the token alone)
    clock-skew: 30s
    # With security on, /actuator (except /actuator/health) needs an admin token or this one, for Prometheus:
    #   scrape_configs: [{ job_name: drishti, metrics_path: /actuator/prometheus, bearer_token: <this> }]
    metrics-token: ${DRISHTI_METRICS_TOKEN:}
    # A personal API token reads by default: GET and HEAD, plus these POSTs, which carry a query in the body and change nothing
    # (a pivot of a search, a command line). Add a path only if it writes nothing.
    token-read-posts:
      - /api/v1/search/pivot/**
      - /api/v1/command
      - /api/v1/forms/*/*/compile        # query by form: writes the criteria out as a search command, nothing else
      - /api/v1/changes/preview          # write-back's review sheet: what a change would do, written nowhere
      - /api/v1/bi/datasets/*/query     # Rupaka phase 2: a dataset query (fields, measures, filters in the body), masked and row-ruled, changes nothing
      - /api/v1/bi/datasets/validate    # checks a dataset's YAML without storing it
      - /api/v1/bi/mq                   # the model query language (docs/architecture/BI_MODEL_SPEC.md section 5): one query of a model as the caller, changes nothing
      - /api/v1/bi/models/*/query       # the same with the model in the path
      - /api/v1/bi/mq/validate          # checks a model query without reading data
      - /api/v1/bi/models/validate      # checks a model's or a rachana 2 dataset's YAML without storing it
      - /api/v1/bi/sql                  # one read-only Drishti SQL statement over a model as the caller (or EXPLAIN), changes nothing
      - /api/v1/bi/sql/validate         # checks a Drishti SQL statement without reading data
      - /api/v1/bi/expr/validate        # checks one expression (DEL) in its scope against a model as the caller sees it, reads no data
      - /api/v1/bi/reports/statement/preview  # a statement's pages laid out for the caller (masked), stores nothing
      - /api/v1/bi/reports/statement/file     # the same as a PDF or Excel file for the caller, stores nothing
      - /api/v1/bi/expr/convert         # converts an expression or an item's YAML from the old syntax to DEL v2, stores nothing
      - /api/v1/bi/mq/subscribe         # a standing query: the same answer kept current for the caller (ended by DELETE, or when no stream reads it)
      - /api/v1/bi/model/start          # a draft dataset from pack kinds: reads connectors, stores nothing
      - /api/v1/bi/model/infer          # relationships proposed by value matching: reads connectors, stores nothing
      - /api/v1/bi/reports/*/query      # Rupaka phase 3: one visual of a report under the page's state, through the dataset engine, masked and row-ruled
      - /api/v1/bi/reports/*/python     # Rupaka phase 6: what the console's Python runner runs for one python visual (the item, its manifest and source as the caller reads it), stores nothing
      - /api/v1/bi/python/validate      # checks a Python item's manifest without storing it
      - /api/v1/bi/reports/query        # the same for draft YAML (authors)
      - /api/v1/bi/reports/validate     # checks a report's YAML without storing it
      - /api/v1/bi/boards/validate      # checks a board's YAML without storing it
      - /api/v1/bi/reports/format       # writes a report model as YAML
      - /api/v1/bi/boards/format        # writes a board model as YAML, stores nothing
      - /api/v1/bi/boards/convert       # a 2.3 board converted to the report with board pages it becomes (drishti.py bi migrate --boards FILE), stores nothing
      - /api/v1/bi/themes/validate      # checks a theme's YAML without storing it
      - /api/v1/bi/python/input         # one input of a Python Transform as the caller (the Transform editor's preview and profile), masked and row-ruled, stores nothing
      - /api/v1/bi/items/*/tests        # runs the expected values (tests:) of a report or dataset as the caller or a role they hold: queries only, stores nothing
      - /api/v1/bi/runs                 # BI runs (docs/architecture/BI_RUNS.md section 14): one question as the caller, answered inline or as a run of theirs; changes no data
      - /api/v1/bi/runs/estimate        # a run's tier and estimate from metadata only, runs nothing
      - /api/v1/export/*                # Rupaka phase 7: a report, visual or view rendered as PDF, PNG, Excel or CSV for the caller (masked), stores nothing
      - /api/v1/subscriptions/preview   # renders what a subscription would send, for the caller, stores nothing
      - /api/v1/compute/*/*             # a reactive connector's answer for the caller (REACTIVE_CONNECTORS.md): computed and cached, changes no data
      - /api/v1/exposure/what-if        # incremental exposure before dealing (EXPOSURE_GUIDE.md section 18.7) for the caller: computed, stores nothing
      - /api/v1/var/what-if             # VaR before and after hypothetical trades (VAR_GUIDE.md section 8.5) for the caller: computed by the Python engine, stores nothing
    # WRITE SCOPES (TOKEN_SCOPES in docs/guides/API_GUIDE.md): a token is made with `read` (the default: all of the above) or with
    # scopes from this list (keys in [brackets] keep the colon); each opens the METHOD path patterns under `allow` (* = any method). A scope is only a door: the
    # controller behind it still checks the roles of the token's user at the time of the call, so a token never does more than
    # its user. A write that no scope opens, and nothing in token-never, is refused. Every non-GET endpoint must be declared in
    # token-read-posts, a scope or token-never (TokenScopeGuardTest fails the build otherwise).
    token-scopes:
      "[risk:write]":
        description: "Save, share and delete your VaR baskets, capture VaR and exposure results, keep your what-if sandboxes and cancel your own computations (VAR_GUIDE.md, EXPOSURE_GUIDE.md, REACTIVE_CONNECTORS.md). Your own items only; the bank's data is never changed."
        allow:
          - POST /api/v1/var/baskets
          - DELETE /api/v1/var/baskets/*/*
          - POST /api/v1/var/captures
          - POST /api/v1/exposure/captures
          - POST /api/v1/compute/sandboxes
          - PUT /api/v1/compute/sandboxes/*
          - DELETE /api/v1/compute/sandboxes/*
          - POST /api/v1/compute/sandboxes/*/copy
          - DELETE /api/v1/compute/requests/*
      "[edit]":
        description: "Submit changes through write-back (WRITE_BACK.md: forms, the CLI's change propose), approve or reject other people's, withdraw your own. No token has it unless chosen; it never exceeds your roles: the edit power, the field's roles, masks and four eyes all apply, and editing must be on."
        allow:
          - POST /api/v1/changes
          - POST /api/v1/changes/*/approve
          - POST /api/v1/changes/*/reject
          - POST /api/v1/changes/*/withdraw
      "[design:write]":
        description: "Create, edit, check, propose, share and bind Designs, save Sutras from Studio (a save is a proposal with governance on), withdraw your own proposals. Needs the author role."
        allow:
          - POST /api/v1/builder/**
          - PUT /api/v1/builder/**
          - PATCH /api/v1/builder/**
          - DELETE /api/v1/builder/**
          - POST /api/v1/studio/**
          - POST /api/v1/sutras
          - POST /api/v1/sutras/proposals/*/withdraw
      "[design:approve]":
        description: "Approve or reject proposed Sutras. Needs the approver or admin role, and never your own proposal with four-eyes on."
        allow:
          - POST /api/v1/sutras/proposals/*/approve
          - POST /api/v1/sutras/proposals/*/reject
      "[bi:write]":
        description: "Business intelligence (Rupaka): create, edit, move, propose, withdraw, publish and delete your workspaces' items, restore versions and saved states, ask what a dataset change would break, mark favourites, create workspaces (when the policy lets you). Needs the bi-author power and the workspace role at call time."
        allow:
          - POST /api/v1/bi/workspaces
          - POST /api/v1/bi/workspaces/*/items
          - POST /api/v1/bi/items/*/open
          - POST /api/v1/bi/items/*/move
          - POST /api/v1/bi/items/*/propose
          - POST /api/v1/bi/items/*/withdraw
          - POST /api/v1/bi/items/*/publish
          - POST /api/v1/bi/items/*/versions/*/restore
          - POST /api/v1/bi/items/*/history/*/restore
          - POST /api/v1/bi/items/*/impact
          - POST /api/v1/bi/datasets/*/refresh
          - POST /api/v1/bi/datasets/*/transform/run
          - DELETE /api/v1/bi/mq/subscribe/*
          - POST /api/v1/bi/runs/*/confirm
          - POST /api/v1/bi/runs/*/cancel
          - POST /api/v1/bi/runs/*/rerun
          - POST /api/v1/bi/runs/*/export
          - POST /api/v1/bi/runs/*/share
          - DELETE /api/v1/bi/runs/*/share/*
          - POST /api/v1/bi/runs/*/promote
          - POST /api/v1/bi/runs/*/keep
          - DELETE /api/v1/bi/runs/*/result
          - POST /api/v1/bi/runs/*/schedule
          - PUT /api/v1/bi/runs/schedules/*
          - DELETE /api/v1/bi/runs/schedules/*
          - PUT /api/v1/bi/items/*
          - PUT /api/v1/bi/items/*/favourite
          - DELETE /api/v1/bi/items/*
      "[bi:approve]":
        description: "Business intelligence: approve or reject proposed items (the approve power or bi-steward, never your own proposal with four-eyes on), endorse (promote; certify needs bi-steward) and import a bundle (bi-steward)."
        allow:
          - POST /api/v1/bi/items/*/approve
          - POST /api/v1/bi/items/*/reject
          - POST /api/v1/bi/items/*/endorse
          - POST /api/v1/bi/bundle/import
          - POST /api/v1/bi/imports/*/rollback   # undo an import (a steward, as the import itself)
      "[bi:admin]":
        description: "Business intelligence: change a workspace (settings, members, delete) and the BI settings. Needs the workspace admin role or the bi-admin power at call time."
        allow:
          - PUT /api/v1/bi/workspaces/*
          - DELETE /api/v1/bi/workspaces/*
          - PUT /api/v1/bi/workspaces/*/members/*
          - DELETE /api/v1/bi/workspaces/*/members/*
          - PUT /api/v1/bi/settings
          - POST /api/v1/bi/admin/runs/*/cancel
          - POST /api/v1/bi/admin/runs/suggestions/*/accept
          - POST /api/v1/bi/admin/runs/suggestions/*/dismiss
      "[packs:admin]":
        description: "Load, unload, switch on and off, deploy archives, install and roll back packs, and create, change, test and delete connectors (Admin -> Connectors), and Retry now for packs, connectors, AI providers and MCP servers. Needs the admin role."
        allow:
          - POST /api/v1/admin/packs/*/load
          - POST /api/v1/admin/packs/*/unload
          - PUT /api/v1/admin/packs/*
          - POST /api/v1/admin/packs/deploy
          - POST /api/v1/admin/packs/deploy/*
          - POST /api/v1/admin/packs/deploy/*/connectors
          - DELETE /api/v1/admin/packs/deploy/*
          - POST /api/v1/admin/packs/*/rollback
          - POST /api/v1/admin/packs/*/data
          - PUT /api/v1/admin/connectors/*
          - DELETE /api/v1/admin/connectors/*
          - POST /api/v1/admin/connectors/**
          - POST /api/v1/admin/registry/**
          - POST /api/v1/admin/retry/*
      "[loads:write]":
        description: "Announce that a batch of data has landed (or failed) for a pack: Drishti then refreshes, verifies, checks alerts and tells the people the pack names. Only for packs your roles reach; needs no admin role."
        allow:
          - POST /api/v1/packs/*/loads
      "[ai:use]":
        description: "Call the configured models and MCP tools through the AI policy (chat, MCP tool calls, and the BI hooks: report from words, ask the data, explain this number). Admin pages stay closed."
        allow:
          - POST /api/v1/ai/chat
          - POST /api/v1/ai/mcp/*/tools/*
          - POST /api/v1/bi/ai/*
      "[ai:admin]":
        description: "Send a test call to a configured model (Admin -> AI). Needs the admin role."
        allow:
          - POST /api/v1/admin/ai/test
    token-never:                       # never for a token, whatever its scopes: tokens, users, sign-in, personal and collaboration state
      - POST /api/v1/bi/migrate/models/convert   # migration: an administrator in the console, never a token
      - POST /api/v1/bi/migrate/models
      - POST /api/v1/bi/migrate/expressions
      - POST /api/v1/bi/migrate/boards           # the stored 2.3 boards converted into reports: an administrator in the console
      - POST /api/v1/bi/models/*/preview-as     # previews another role's answers: audited, in the console only
      - "* /api/v1/me/**"
      - "* /api/v1/drafts/**"                  # form drafts: personal, kept per person, saved from the console (WRITE_BACK_GUIDE.md)
      - POST /api/v1/admin/edits/**            # write-back's switches (a connector's writes, withdrawing an overlay): an administrator in the console
      - "* /api/v1/auth/**"
      - "* /api/v1/admin/tokens/**"
      - "* /api/v1/net/**"                     # Drishti*net: nodes sign their calls with the cluster key; administrators use the console
      - "* /api/v1/compute/peer/**"            # compute fan-out between nodes: signed with the cluster key, never a token
      - "* /api/v1/admin/compute/**"           # compute pools, environments and four-eyes approvals: an administrator in the console
      - "POST /api/v1/compute/events"          # trigger events (the write-back hook): the server and administrators, never a token
      - "POST /api/v1/var/reload"              # reloading the VaR vectors: an administrator in the console
      - "POST /api/v1/var/official"            # running the official end-of-day VaR capture: an administrator in the console
      - "POST /api/v1/var/intraday/streams/*/apply"   # applying a PV topic's waiting window now: an administrator in the console
      # VaR shards (docs/architecture/VAR_SHARDING.md section 10). /partial is one member's call to another, signed with the cluster key
      # and made as the caller (their on-behalf-of token; the owner applies their rights again): like /compute/peer/**, never a token's.
      # It reads data but is no read POST for a token, which would only add a door to the members' channel. /shards/drain takes a member's
      # shards away before it stops: an administrator (console, drishti.py var shards --drain, a task's stop hook signed in as one), never
      # a token, like /var/reload.
      - "POST /api/v1/var/partial"
      - "POST /api/v1/var/shards/drain"
      - "POST /api/v1/exposure/reload"         # reloading the exposure paths: an administrator in the console
      - "POST /api/v1/exposure/official"       # running the official end-of-day exposure capture: an administrator in the console
      - "* /api/v1/embed/**"
      - "* /api/v1/admin/embed/**"
      - "* /api/v1/admin/users/**"
      - "* /api/v1/admin/role-definitions/**"
      - "* /api/v1/admin/caches/**"
      - "* /api/v1/admin/connectors/*/index/**"   # reloading a connector's type-ahead index: an admin from the console, not a token
      - "* /api/v1/admin/loads/**"
      - "* /api/v1/admin/artifacts/**"        # install, disable, uninstall, restore: an administrator from the console, never a token
      - "* /api/v1/admin/commands"            # Admin -> Commands: commands and packs on or off, audited with a reason; never a token
      - "* /api/v1/admin/commands/**"
      - "* /api/v1/admin/collab/**"
      - "* /api/v1/admin/reports/**"
      - "* /api/v1/admin/subscriptions/**"
      - "* /api/v1/admin/measure-alerts/**"
      - "* /api/v1/shares/**"
      - "* /api/v1/threads/**"
      - "* /api/v1/comments/**"
      - "* /api/v1/notes/**"
      - "* /api/v1/workspaces/**"
      - "* /api/v1/views/**"
      - "* /api/v1/command/aliases"
    token-write-max-days: 90           # a token with a write scope must expire, within this many days (read tokens: 1-366 or never)
    roles:
      viewer:  { kinds: ["*"], layout: false, bi: [bi] }   # packs add domain roles (trading: trader; market-risk, counterparty-risk); layout: may arrange views (default true)
      author:  { kinds: ["*"], raw: true, author: true, calc: true, bi: [bi, bi-author] }   # calc: may use Calc, Python in the browser (PYTHON_CALC.md)
      approver: { kinds: ["*"], raw: true, author: true, approve: true, calc: true, bi: [bi, bi-author] }   # reviews proposed Sutras (admins may too)
      admin:   { kinds: ["*"], raw: true, author: true, admin: true, calc: true, edit: true }   # edit: may submit write-back changes (WRITE_BACK.md; editing itself is off until config/edit/edit.yaml turns it on)
    oidc:                              # single sign-on (W20): the console runs the flow, the server verifies the ID token
      enabled: ${DRISHTI_OIDC_ENABLED:false}
      issuer: ${DRISHTI_OIDC_ISSUER:}
      client-id: ${DRISHTI_OIDC_CLIENT_ID:}
      username-claim: preferred_username
      display-claim: name
      groups-claim: groups             # a dotted path works too: realm_access.roles
      role-map: {}                     # provider group -> Drishti roles, e.g. { desk-rates: [trader], market-risk: [risk] }
      default-roles: []                # roles when no group maps; empty refuses such users
      roles-from-provider: true        # the provider's groups replace the roles at every sign-in
      algorithms: [RS256, ES256]
    # Fields masked (•••) for roles without raw: raw JSON, views, search, Impact, type-ahead, alerts. A name masks that field at any
    # depth, in any case and convention (counterpartyId masks COUNTERPARTY_ID); an entry with dots masks by the end of the path.
    # An entry that names no field of the loaded packs' samples is logged at start-up (DRS-6011) and listed in Admin -> Health.
    # trader, patientName and lifecycle.timeline.description are the camelCase example packs' (examples/packs); counterpartyId
    # masks the core pack's COUNTERPARTY_ID as it masked banking-core's counterpartyId before the 2.3.0 rename.
    redact: [trader, TRADER_ID, TRADER_FIRST_NAME, TRADER_LAST_NAME, counterpartyId, patientName, lifecycle.timeline.description]
    # Opt-in: also replace exact copies of a masked field's value found in the OTHER text of the same document (best effort: exact,
    # case-sensitive; text of at least min-length characters, numbers of 4+ digits). Documents over max-nodes are not scanned.
    mask-copies: ${DRISHTI_MASK_COPIES:false}
    mask-copies-min-length: 3
    mask-copies-max-nodes: 50000
    mask-copies-max-values: 64
  embed:                             # embedded views in other web applications (docs/architecture/ELEMENTS.md; API_GUIDE, Embedding)
    enabled: ${DRISHTI_EMBED_ENABLED:false}   # off: no token endpoint, embed tokens refused. Needs drishti.security.enabled
    issuer: ${DRISHTI_PUBLIC_URL:}            # the iss of embed tokens: this server's public URL
    audiences: ["${DRISHTI_CONSOLE_URL:}"]      # the consoles that may accept embed tokens (their public URLs); the first is the default
    signing-key: ${DRISHTI_EMBED_KEY_FILE:}   # PEM with a PKCS#8 EC PRIVATE KEY and a PUBLIC KEY block (ES256); empty = generated at start
    token-max-seconds: 900                    # longest life of an embed token (an application's own lifetime may be shorter)
    mask: always                              # embed calls always mask drishti.security.redact fields, whatever the user's roles
    allow-wildcard-origins: false             # let an application register https://*.suffix origins (review apps)
    assertion-max-age: 60s                    # longest life of a client or user assertion a host signs
    scopes:                                   # what each embed scope opens; a token calls nothing else, and never writes
      "[embed:view]":
        - GET /api/v1/views/*/*
        - GET /api/v1/views/*/*/stream
        - GET /api/v1/views/*/*/panels/*/records
        - GET /api/v1/embed/check
        - POST /api/v1/command
      "[embed:about]":
        - GET /api/v1/views/*/*/explain
      "[embed:report]":                        # a published BI report in <drishti-report>; the app's kinds must list report:<id> or report:*
        - GET /api/v1/bi/reports/*              # the definition (and /catalogue, the visual types)
        - POST /api/v1/bi/reports/*/query       # a read: one visual's rows under the page's slicers and selections
        - GET /api/v1/bi/reports/*/live         # the report's live tables: ticks and status, no data
      "[embed:search]":                        # <drishti-search>: the type-ahead across Drishti, masked, cut to the application's kinds
        - GET /api/v1/embed/search
    search:
      max-results: 10                         # most results one search returns
      min-chars: 2                            # shortest query searched
    limits:
      tokens-per-minute: 120                  # exchanges per host application
      views-per-minute: 600                   # calls per host application (the default for a new registration)
      views-per-user-per-minute: 60           # calls per user (the default for a new registration)
      searches-per-user-per-minute: 30        # searches per user and application through <drishti-search>, on top of the call rates
    apps: []                                  # host applications declared here (GitOps): read-only in Admin → Embedding ("from config"), see docs/admin/CONFIGURATION.md
  retry:                             # what failed is tried again by itself (docs/admin/OPERATIONS.md, "Retries"): packs refused, connectors, AI providers, MCP servers
    enabled: true
    initial: 5s                      # wait before the first retry
    factor: 2.0                      # each further wait is this many times the one before
    max: 5m                          # no wait is longer than this
    jitter: 0.2                      # each wait varies by up to this fraction either way
    permanent-after: 3               # a failure waiting cannot fix (refused credentials, bad settings) seen this often in a row is retried only every max
    # packs: {initial: 2s}           # drishti.retry.<area>.<key> overrides any of these for one area: packs, connectors, ai, mcp
  ai:                                # LLM provider layer (docs/architecture/AI_PROVIDERS.md): OFF by default; no file is read and no model is called while off
    enabled: ${DRISHTI_AI_ENABLED:false}
    dir: ${DRISHTI_AI_DIR:./config/ai}        # one YAML per provider: type, base-url, api-key as ${ENV}, models with logical names
    watch: auto                      # auto | poll | off: how edits to the folder are noticed (live reload, like connectors)
    poll-ms: 5000
    default-model: ${DRISHTI_AI_DEFAULT_MODEL:}   # provider/model, or a model name only one provider has; used when a call names none
    policy:
      mask-redacted: true            # mask drishti.security.redact fields (and mask-patterns) in every prompt
      mask-patterns: []              # extra regular expressions replaced by the mask in every prompt
      audit: true                    # one access-log row per call (action ai): who, feature, model, sizes, tokens, outcome; never the text
      per-user-per-minute: 0         # 0 = no limit
      per-user-per-day: 0
      cost-per-user-per-day: 0       # in the unit of the models' cost-per-1k-* prices
      features: {}                   # per feature: "[ask]": {roles: [..], per-user-per-minute: 6}
      # BI hooks use the features bi-draft, bi-ask and bi-explain (docs/guides/BI_GUIDE.md), e.g. "[bi-ask]": {roles: [analyst], per-user-per-minute: 10}
  mcp:                               # MCP client (docs/architecture/MCP_CLIENT.md): OFF by default
    enabled: ${DRISHTI_MCP_ENABLED:false}
    dir: ${DRISHTI_MCP_DIR:./config/mcp}      # one YAML per MCP server: transport, url, headers as ${ENV}, allowed-tools
    watch: auto
    poll-ms: 5000
    audit: true
    server-roles: {}                 # "[server]": [roles]   absent = every signed-in user
    tool-roles: {}                   # "[server/tool]": [roles]
    server-features: {}              # "[server]": [features]
  alerts:
    keep: 1000                      # fired alerts kept per user, in the identity database (they survive restarts)
  access-log:                        # who looked at what: views, raw, history, searches, CSV (Admin → Access)
    enabled: ${DRISHTI_ACCESS_LOG:true}
    keep-days: 90                    # older events are pruned once a day
    queue: 100000                    # events waiting to be written at most; beyond it they are dropped and counted
  collab:                            # share with a note, comment threads, the inbox (docs/architecture/COLLABORATION.md)
    enabled: ${DRISHTI_COLLAB_ENABLED:true}
    store: content                   # content: the content store, every cluster node (default) | jpa: the identity database, one node | file: one server only
    dir: ${DRISHTI_COLLAB_DIR:${drishti.data.dir}/collab}   # the file store, and exports
    console-url: ${DRISHTI_CONSOLE_URL:}       # links in emails and shares; empty turns email off
    directory:                       # the people picker
      scope: shared-packs            # shared-packs: only users who share a pack with the caller | all
      min-query: 2
      limit: 10
    mentionable-roles: ["*"]         # roles usable as groups (admin and service never)
    max-group-size: 200              # largest role a share or mention may expand to
    share:
      max-recipients: 25             # names (people and roles) in one share
      max-expanded: 200              # people after roles are expanded
      max-text: 2000                 # longest note, in characters
      undeliverable: tell            # tell: the sender learns who was not notified and why | silent
      post-to-thread: false          # the default when a share request does not say (the dialog's tick, the server)
      max-view-state: 4000           # longest view state (control values and column filters) a share carries, in characters
    threads:                         # comment threads (build step 5)
      max-text: 4000
      max-per-entity: 500
      edit-window: 15m
      page-size: 50
    text:
      on-masked-copy: warn           # a masked field's value typed into a note: warn | reject | allow (it is always scrubbed for readers without raw)
      deny-patterns: []              # regular expressions refused in notes and comments
    limits:                          # per user
      shares-per-minute: 5
      shares-per-day: 100
      comments-per-minute: 10
      directory-per-minute: 60
      mails-per-recipient-per-hour: 30
    inbox:
      keep: 1000                     # newest rows kept per user
      keep-days: 180
      poll: 5s                       # a server looks for rows other servers wrote, only while a stream is open
      coalesce: 60s
    email:                           # build step 4
      enabled: false                 # also needs spring.mail.host and console-url, and security on
      content: comment               # link-only | title | comment
      from: ${DRISHTI_MAIL_FROM:drishti@localhost}
      templates-dir: ""
      coalesce-window: 10s           # a lone notice goes after this short delay; notices for one person arriving meanwhile join it as one digest; 0 = every notice at once
    outbox:                          # build step 4
      enabled: true
      tick: 2s
      batch: 50
      max-attempts: 8
      backoff: 30s
      max-backoff: 1h
      lease: 60s
      keep-sent-days: 30
    retention:
      keep-days: 0                   # shares and threads; 0 keeps them forever
      kinds: {}                      # days per entity kind, by kind name: { trade: 2555 }; beats the pack and the default
      interval: 24h                  # how often the purge runs; it only runs when some retention above 0 is set (a pack: packs.<pack>.retention-days)
    export-keep: 24h
    packs: {}                        # per-pack overrides, by pack name: news-and-markets: { share-enabled: false }
    bridges:                         # build step 9: post "comment + link" (never a value) to Teams, Slack or a signed webhook
      enabled: false
      render-as: viewer              # the role whose masks the posted text follows (the default has no raw)
      allow: []                      # URL prefixes a bridge URL must start with; empty: no bridge can post
      per-minute: 30                 # posts per bridge per minute; the rest wait in the outbox
      timeout: 10s
      max-note: 500                  # characters of the note a post carries
      webhooks: []                   # [{ name: risk-teams, format: teams, url-env: BRIDGE_RISK_URL, routes: [{ packs: [..], kinds: [..], events: [share, comment, mention, alert] }] }]
    snapshots:                                  # a watermarked PNG of a view that a share may carry; a pack can override: packs.<pack>.snapshots.enabled
      enabled: false                            # off: no share carries a picture
      width: 960                                # pixels wide
      max-height: 1800                          # pixels tall at most; the rest of the view is left out, with a line saying so
      max-panels: 8
      max-rows: 12                              # rows drawn of a table, list or timeline
      max-bytes: 1500000                        # largest PNG; larger is refused
      timeout: 5s                               # longest one drawing may take
      cache-size: 50                            # pictures kept by view, generation and rights profile
      cache-ttl: 10m
      recipients: count                         # the watermark names: count | names
  admin:                             # Admin, Artifacts: uninstalling packs, connector files and shipped BI files safely (docs/guides/OPERATIONALISING.md)
    uninstalled-dir: ${DRISHTI_UNINSTALLED_DIR:${drishti.data.dir:./data}/uninstalled}   # an uninstall MOVES the artifact here; nothing is deleted
    uninstalled-keep: ${DRISHTI_UNINSTALLED_KEEP:30d}      # archives older than this are removed, once a day; 0 keeps them for ever
    uninstalled-prune-interval: 1d                        # how often the archive is pruned
    hidden-bi-file: ${drishti.data.dir:./data}/admin/bi-hidden.txt   # the shipped BI files an administrator disabled (hidden from the catalogue)
    bi-upload-max-bytes: 1048576                          # the largest BI file Admin, Artifacts accepts
  reports:                           # scheduled reports: a search delivered as CSV on a schedule
    enabled: ${DRISHTI_REPORTS_ENABLED:true}   # the scheduler; run it on one server of a group (reports still run by hand)
    folder: ${DRISHTI_REPORTS_DIR:${drishti.data.dir}/reports}
    webhooks: []                     # URL prefixes reports may post to, e.g. [https://hooks.bank.example/drishti/]; empty: none
    per-user: 20
    tick: 30s
    keep-runs: 20
  var:                               # the VaR engine (docs/guides/VAR_GUIDE.md): VaR of any set of trades from the stored P&L vectors
    enabled: ${DRISHTI_VAR_ENABLED:true}
    confidence: ${DRISHTI_VAR_CONFIDENCE:0.99}          # VaR's confidence: 0.99 or 0.95 (refused at start outside (0.5, 1))
    es-confidence: ${DRISHTI_VAR_ES_CONFIDENCE:0.975}   # expected shortfall's
    scenario-window: ${DRISHTI_VAR_SCENARIO_WINDOW:all}  # all (the scenario set's length, 509 in the demo) or N: the newest N scenarios (250: 1 year; at least 20)
    rank-rule: kth-worst             # kth-worst (k = ceil(N (1 - a)): the 6th worst of 509) or interpolated
    component-window: 5              # component VaR averages the scenarios ranked k-2 .. k+2, scaled to add up to the VaR
    threads: ${DRISHTI_VAR_THREADS:0}                  # cores the vector sums use (0: every core)
    memory-budget-mb: ${DRISHTI_VAR_MEMORY_MB:0}       # most memory one date's vectors take (0: a quarter of the heap); over it: 503 DRS-5204
    hot-dates: 2                     # business dates kept loaded (the newest)
    view-cache-mb: 64                # 2.9.7: most memory the viewers' views (bitsets per date, version, currency, role set) take; idle 1 h, released with the date
    load-threads: 2                  # 2.9.7: threads that load dates (and shard books, currencies) from the lake: their own pool, never the common pool
    history-days: 250                # history and backtest window
    component-scale-to-var: true     # components scaled to add up to the VaR exactly (false: to the smoothed VaR)
    parallel-rows: 4096              # the fewest rows a sum splits across threads
    rows-per-chunk: 65536            # rows per chunk of the in-memory vector store
    histogram-bins: 42               # bins of the P&L distribution sent to the screen
    max-parts: 5000                  # most parts a contribution table computes at once (more: the largest by gross size, and said)
    path-page: 60                    # rows of the ranked P&L path per page
    currencies: ${DRISHTI_VAR_CURRENCIES:USD,EUR,CAD,JPY,GBP}   # reporting currencies built ahead after the USD book (background, own hot files; USD always); others on first ask
    currency-retention-dates: ${DRISHTI_VAR_CURRENCY_RETENTION_DATES:5}   # newest business dates whose listed currencies are built ahead and kept on disk
    intraday:
      kafka:                         # the PV topic (the market-risk pack's pv-updates connector, off by default): VAR_GUIDE.md section 8.4
        window: ${DRISHTI_VAR_INTRADAY_KAFKA_WINDOW:5m}   # everything received in a window: one intraday batch in the lake, applied
        max-trades: ${DRISHTI_VAR_INTRADAY_KAFKA_MAX_TRADES:500}   # a window applied earlier once this many trades wait
    root-name: ${DRISHTI_VAR_ROOT_NAME:}   # the top of the VaR tree (every hierarchy's root node); blank keeps the hierarchy data's NAME
    # root-names: {MGMT: "Group", LEGAL: "Group legal"}   # one hierarchy's root name; wins over root-name for it
    # hierarchies:                   # 2.9.5 (VAR_GUIDE.md section 15.14): wins over a loaded pack's hierarchies: block (the market-risk pack's:
    #   LL: { title: Limit letters, levels: "LIMIT_LETTER > DESK", word: LL, limits: var-limit }   # MGMT, LEGAL from the rows; LL from columns)
    sharding:                        # VaR sharding (docs/architecture/VAR_SHARDING.md): on only with the market-risk pack's sharding: block or enabled: true
      release-after-seconds: 900     # 2.9.7: a shard book of a date nobody has open (outside the newest hot-dates), unread this long, is released
    tier:                            # the tiered memory (docs/guides/VAR_GUIDE.md section 26): where a loaded date's vectors live
      mode: ${DRISHTI_VAR_TIER:mapped}                 # mapped: each date a float32 hot file, memory-mapped (heap: aggregates, columns, links); heap: float64 rows on the heap
      dir: ${DRISHTI_VAR_HOT_DIR:${drishti.data.dir:./data}/var/hot}   # one folder per business date; never under the repository
      disk-dates: 60                 # hot files kept on disk (least recently used beyond are deleted); a date not open maps its file again, no lake read
      keep-on-shutdown: false        # false: the hot files are deleted at shutdown (and any left over at start)
      close-grace-seconds: 60        # an evicted date stays mapped this long for the requests still reading it
    kinds:                         # the kinds the engine reads (the market-risk pack's), and the kind its derived positions are served as
      vector: pnl-vector
      position: position
      hierarchy: risk-hierarchy
      scenario-set: scenario-set
      portfolio: portfolio
      scenario-pv: scenario-pv       # 2.9.4: trades sent as scenario PVs in their own currency, converted to USD P&L at load (beside or instead of vectors)
      fx-scenario: fx-scenario       # 2.9.4: each currency's rate under each scenario, when the batch supplies it (USD per unit)
      fx-spot: fx-spot               # 2.9.4: the FX history scenario rates are derived from when not supplied (the market-data pack's)
      limit: var-limit               # 2.9.5: the nodes' VaR limits by hierarchy and node id (USD), for a hierarchy whose limits: names it
    access: {}                       # per role, per node: positions | aggregate (drishti.var.access.<role>[MGMT~DESK-RATES]=aggregate)
    positions:                       # how positions are derived from the trades when no loaded pack has a positions: section (the market-risk pack's wins)
      live-statuses: [NEW, VALIDATED, AMENDED]   # trade statuses that count on their date (a row with no status counts)
      rules: []                      # first match wins: {name, groups: [PRODUCT_GROUP...], types: [PRODUCT_TYPE...], key: [SECURITY_ID, ISIN...]}; none: one position per trade
    official:                        # the official end-of-day captures (docs/guides/VAR_GUIDE.md section 19)
      enabled: ${DRISHTI_VAR_OFFICIAL:true}       # capture every node of every hierarchy when a date's inputs are complete (after the data-load signal)
      publish: true                  # also append them to <root>/risk-results/var-official (append-only) for other systems
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}   # a folder or s3://bucket/prefix (2.9.5)
      format: ${DRISHTI_VAR_OFFICIAL_FORMAT:delta}   # delta or iceberg (2.9.5); BI's var-results connector follows it (generated as plugin iceberg)
      storage: {}                    # the s3.* settings for an s3:// root (s3.region, s3.endpoint, keys; none: the default credential chain)
      retention-years: 7             # the published table keeps its log and removed files (time travel) this long
      on-start: true                 # at start, capture the newest date when it has no official record yet
      currencies: [USD]              # reporting currencies captured officially (USD always, and the only one published); e.g. [USD, EUR]
      jsonl: true                    # also write each published date as JSON Lines: <root>/risk-results/jsonl/var-official/<date>/ (2.9.4)
  ccr:
    exposure:                        # the exposure engine (docs/guides/EXPOSURE_GUIDE.md): EE, ENE, EEE, PFE, EPE, EEPE of any counterparty scope from the exposure paths
      enabled: ${DRISHTI_EXPOSURE_ENABLED:true}
      confidence: [0.95, 0.99]       # PFE confidences computed for every answer (any q in (0.5, 1) may be asked)
      limit-confidence: 0.95         # the PFE credit limits are set on; the default q of an answer
      rank-rule: kth                 # kth (the ceil(P q)-th smallest exposure) or interpolated
      collateral-model: lagged       # lagged (called at the look-back point), current (today's collateral on every path) or none
      im-model: current              # current (the initial margin held today on every path) or none
      alpha: 1.4                     # EAD_IMM = alpha x EEPE (informational)
      contribution-window: 21        # paths around the PFE quantile a PFE contribution averages over
      hot-dates: 2                   # business dates kept open (the newest)
      view-cache-mb: 16              # 2.9.7: most memory the viewers' views take; idle 1 h, released with the date
      load-threads: 2                # 2.9.7: threads that load dates from the lake: their own pool, never the common pool
      memory-budget-gb: ${DRISHTI_EXPOSURE_MEMORY_GB:0}   # most memory one date's netting-set matrices take while it loads (0: a quarter of the heap); over it: 503 DRS-5445
      hot-folder: ${DRISHTI_EXPOSURE_HOT_DIR:${drishti.data.dir:./data}/ccr/hot}   # the hot files, one folder per business date; never under the repository
      tier: ${DRISHTI_EXPOSURE_TIER:mapped}   # mapped: each date a float32 hot file, memory-mapped; heap: float64 on the heap
      disk-dates: 60                 # hot files kept on disk (least recently used beyond are deleted, unless the retention keeps them)
      keep-on-shutdown: false        # false: the hot files are deleted at shutdown (and any left over at start)
      close-grace-seconds: 60        # an evicted date stays mapped this long for the requests still reading it
      max-scope-netting-sets: 20000  # the most whole netting sets an interactive answer sums (more: 503 DRS-5443; the official capture computes it)
      max-parts: 5000                # most parts a contribution table computes at once
      histogram-bins: 42             # bins of an exposure distribution
      t0-tolerance: 0.10             # a trade's paths' mean at the first grid date is listed when it departs from its MtM today by more (or 5% of notional)
      kinds:                         # the kinds the engine reads (the counterparty-risk pack's, the core pack's and the market-risk pack's hierarchies)
        run: simulation-run
        paths: exposure-path
        netting-set: netting-set
        csa: csa
        collateral: collateral-balance
        counterparty: counterparty
        group: counterparty-group
        hierarchy: risk-hierarchy
        limit: credit-limit          # the stored credit limits, read as stored (the explorer's limit column; LIM stays parked)
      access: {}                     # per role, per counterparty, group or legal entity: trades | aggregate | none (drishti.ccr.exposure.access.<role>[CP-ALDERSHOT]=aggregate)
      official:                      # the official end-of-day captures (docs/guides/EXPOSURE_GUIDE.md section 20)
        enabled: ${DRISHTI_EXPOSURE_OFFICIAL:true}   # capture every netting set, counterparty, group and hierarchy node when a date's run is complete
        publish: true                # also append them to <root>/risk-results/exposure-official and exposure-official-cpty (append-only)
        root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}   # a folder or s3://bucket/prefix (2.9.5)
        format: ${DRISHTI_EXPOSURE_OFFICIAL_FORMAT:delta}   # delta or iceberg (2.9.5); BI's exposure-results connector follows it
        storage: {}                  # the s3.* settings for an s3:// root, as drishti.var.official.storage
        retention-years: 7           # the published tables keep their log and removed files (time travel) this long
        on-start: true               # at start, capture the newest date when it has no official record yet
        jsonl: true                  # also write each published date as JSON Lines: <root>/risk-results/jsonl/<table>/<date>/ (2.9.4)
      retention:                     # what is kept how long (EXPOSURE_GUIDE.md section 27.3, decided 2026-10-26)
        trade-paths-days: 20         # full trade paths: the last 20 business dates ...
        trade-paths-month-end-years: 1   # ... and each month-end for a year (the lake's owner applies it; GET /api/v1/exposure/retention lists the dates beyond)
        set-matrices-years: 1        # netting-set matrices (the hot files): every date for a year ...
        set-matrices-month-end-years: 7  # ... and each month-end for seven
        statistics-years: 7          # the official records (statistics per set, counterparty, group and node): every date, seven years
        trade-contributions-years: 7 # every trade's EE contributions per primary date: every date, seven years
  calc:                              # Calc: Python in the browser (docs/guides/PYTHON_CALC.md); the server never runs the code
    enabled: ${DRISHTI_CALC_ENABLED:true}   # also needs a role with calc, and a pack that enables it for the view's kind
    max-column-rows: 250000          # drishti.columns() returns at most this many entities (the browser holds them all)
    columns-budget: 20s              # how long a columns read may wait (the first read of a day loads its columns)
    max-snippet-chars: 50000         # a saved snippet's code (each user keeps at most 50 snippets)
  bi:
    enabled: true                    # Rupaka phase 1 (shell and catalogue): false answers DRS-9006 and the console hides the BI menu
    dir: ${DRISHTI_BI_DIR:./config/bi}   # Rupaka files: datasets/, reports/, boards/, notebooks/, python/ (config/bi/README.md); never inside a pack
    watch: auto                      # watch the BI folder: auto (file events + polling), poll, off. Files added, changed or deleted are picked up live; a bad file keeps its last good version
    folder-refresh: 5s               # the polling interval (with watch: off, how long a read is reused)
    workspace-creation: authors      # who creates shared workspaces: authors (bi-author), stewards (bi-steward), admins (bi-admin); Admin, BI settings changes it at run time
    max-body-bytes: 262144           # largest YAML body of one item
    versions-keep: 50                # published versions kept per item
    ai:                              # the three BI hooks on the AI layer (docs/guides/BI_GUIDE.md); they also need drishti.ai.enabled
      model: ""                      # provider/model; blank = drishti.ai.default-model
      values: labels-only            # labels-only: the model sees names, types, descriptions, never a value | aggregates: it may also word the reader's own masked aggregates
      max-question-chars: 600
      max-tokens: 2000
      timeout-seconds: 30
      ask-rows: 200                  # most rows an answer holds (and the model sees, in aggregates mode)
      explain-dimensions: 3          # explain this number: dimensions broken down
      explain-members: 5             # members listed per dimension
      suggestions: 6                 # designer copilot: most visuals proposed at once
      helper-items: 8                # dataset helper: most items proposed per kind (relationships, measures, column descriptions)
    usage-days: 30                   # days of views counted as usage
    recent: 12                       # rows under Recent, Certified and Shared on Home
    list-limit: 200                  # most rows one catalogue or workspace page returns
    query:                           # Rupaka phase 2: the dataset query engine (embedded DuckDB) and its layers; docs/admin/CONFIGURATION.md, drishti.bi.query
      store-dir: ${DRISHTI_BI_STORE:${drishti.data.dir:./data}/bi-store}   # the BI store: typed Parquet layers (columns, rollups) written here; never under the repository
      store-max-gb: 50               # 2.9.7: the most disk the layers take; beyond it the least recently built dates go (never a table's newest)
      store-max-dates: 260           # 2.9.7: the most business dates a table keeps in its layer (the oldest beyond go); checked at start and every 10 min
      timeout: 30s                   # longest a query may run (DRS-9024)
      max-rows: 100000               # most rows a query returns (DRS-9022)
      max-bytes: 67108864            # most bytes of an Arrow answer (DRS-9023)
      max-concurrent: 8              # queries running at once on the server (DRS-9025)
      max-concurrent-per-user: 3     # queries running at once for one user (DRS-9025)
      admission: 2s                  # how long a query waits for a free slot before it is refused
      json-max-rows: 5000            # most rows of an answer in JSON (larger results are asked for as Arrow)
      cache-entries: 200             # results kept; 0 switches the result cache off
      cache-max-bytes: 67108864      # the cache's budget
      cache-ttl: 15m                 # longest a cached result is served
      memory-limit: 768MB            # DuckDB's memory limit
      threads: 2                     # DuckDB's worker threads
      scan-batch-rows: 65536         # rows in one batch when a layer is built from a connector
      record-read-max: 50000         # most documents read one by one when a connector cannot scan columns (the slow path)
      record-read-budget: 60s        # how long that read may take
      latest-ttl: 30s                # how long "the latest business date" of a table is trusted
      eager-rebuild: true            # on a data-load signal, rebuild the date in the background (false: on the next query)
      live-ttl: 5s                   # how long a live table's snapshot is served
      infer-sample: 5000             # values of a column the relationship finder looks at
      infer-min-match: 0.8           # the share of values found among the other table's ids for a relationship to be proposed
    transform:                       # Python Transforms behind derived datasets, and the size of a composed dataset's sources (docs/admin/CONFIGURATION.md, drishti.bi.transform)
      enabled: true                  # false: a derived dataset answers DRS-9074
      python: ${DRISHTI_BI_TRANSFORM_PYTHON:}   # the Python with pandas and pyarrow (the console's environment); blank: drishti-console/.venv when it exists, else python3
      runner: ${DRISHTI_BI_TRANSFORM_RUNNER:}   # the console's core/transform_cli.py; blank: looked for in drishti-console/core from here and its parents
      work-dir: ""                   # scratch folders of runs; blank: <bi store>/transform-tmp
      cache-ttl: 30m                 # a Transform's result is kept for the reader it was made for this long (and until the inputs change)
      cache-entries: 20              # results kept per derived dataset; the oldest go first
      max-input-rows: 50000          # most rows of one input frame handed to a Transform
      max-rows: 100000               # most rows a Transform may return (DRS-9072)
      max-bytes: 33554432            # largest result file (DRS-9072)
      timeout: 60s                   # longest a run may take (the item's own timeout may be shorter)
      max-concurrent: 2              # Transforms running at once
      queue-wait: 5s                 # how long a run waits for a place before DRS-9074
      compose-source-max-rows: 50000 # most rows one source of a composed dataset may answer (DRS-9022)
      console-url: ${DRISHTI_BI_TRANSFORM_CONSOLE_URL:}       # wave B: the console's Py-node endpoint (http://console:17480); blank: the server runs transform_cli.py itself
      console-token: ${DRISHTI_BI_TRANSFORM_CONSOLE_TOKEN:}   # the shared secret the console checks on /internal/py/* (X-Drishti-Runner-Token)
    exec:                            # wave B: execution and scale (docs/admin/CONFIGURATION.md, drishti.bi.exec)
      per-model-share: 0.5           # the share of drishti.bi.query.max-concurrent one model may hold at once (work classes: interactive, standing, background)
      queue: 2s                      # how long a source fragment waits for its connector's pool before DRS-9025
      interactive: 30s               # longest an interactive query runs (DRS-9024)
      background: 300s               # longest background work runs (refresh, precompute, standing-query maintenance)
      max-estimated-rows: 200000000  # the planner's estimate of rows read past which a query is refused (DRS-9029) unless options.budget allows more
      max-fragments: 8               # source fragments one connector runs at once (per connector: connectors.<name>.max-fragments)
      breaker-failures: 5            # consecutive failures that open a connector's circuit breaker (DRS-9026 at once while open)
      breaker-open: 30s              # how long an open breaker refuses before one fragment may try again
      node: ${DRISHTI_BI_NODE:}      # this Java node's name when several serve the site (blank: one node)
      background-share: 0.25         # BI runs: the most of the slots background work (runs, dataset refresh) holds at once (docs/architecture/BI_RUNS.md 10.1)
      standing-share: 0.25           # the most of the slots standing-query maintenance holds at once; interactive work keeps the rest
      fragments-share: 0.5           # the most of a connector's max-fragments the layer builds of background runs hold at once
    runs:
      file: ${DRISHTI_BI_RUNS_FILE:./config/runs/runs.yaml}   # BI runs (docs/architecture/BI_RUNS.md); ready-made in config/runs.examples/
    plan:                            # the logical plan: result cache and guards (docs/admin/CONFIGURATION.md, drishti.bi.plan)
      cache-entries: 2000            # answers cached by plan hash, security signature and data generation (0: off)
      cache-ttl: 15m                 # an answer for the current state is asked again after this; as-of answers have no ttl
      cache-idle: 1h                 # an answer nobody asked for this long is dropped
      guards: refuse                 # refuse (wave A) or warn (W1): sums across currencies (DRS-9158), balances added across dates (DRS-9159)
    sql:                             # Drishti SQL over models (docs/guides/SQL.md; docs/admin/CONFIGURATION.md, drishti.bi.sql)
      enabled: true                  # false: /bi/sql answers DRS-9006 and SQL view datasets cannot be read
      max-leaves: 8                  # model queries one composite statement may ask
      composite-memory: 256MB        # memory of the in-memory engine a composite statement's outer query runs in
      composite-timeout: 30s         # longest the outer query of a composite statement may run
      max-rows: 100000               # most rows a composite statement answers
    expr:                            # the Drishti expression language, DEL v2 (docs/guides/EXPRESSIONS.md; docs/admin/CONFIGURATION.md, drishti.bi.expr)
      legacy: refuse                 # the old expression syntax: refuse (DRS-9100 with the DEL v2 text as the fix; the default from the end of wave A) or warn (read with DRS-9100)
      parse-cache: 10000             # parsed expressions kept (0: off)
    migrate:                         # migrations of STORED BI items (docs/architecture/BI_MODEL_SPEC.md 8.3; docs/guides/TROUBLESHOOTING.md "Migration problems")
      on-start: ${DRISHTI_BI_MIGRATE_ON_START:true}   # at start: old-syntax expressions to DEL v2, audited, the text before kept in each item's history; idempotent
      actor: system                  # the name the history, the item's events and the audit log give the start-up run
  layouts:                           # layout mode: each user's arrangement of a Sutra's panels (USER_GUIDE.md, Layout mode)
    enabled: ${DRISHTI_LAYOUTS_ENABLED:true}   # also needs a role with layout (every role but viewer, unless configured)
  explain:                           # About this page (docs/architecture/CONTEXT_HELP.md): GET /api/v1/views/{kind}/{id}/explain
    cache-size: 2000                 # answers kept; per user, page, business date and generation (masks and rights are per user)
    cache-ttl: 60s                   # how long an answer is served before it is derived again
    ask:                             # Ask about this page (CONTEXT_HELP.md): OFF by default; while off no call to any model is ever made
      enabled: ${DRISHTI_ASK_ENABLED:false}
      # DEPRECATED endpoint/api/api-key: Ask runs on the AI layer (docs/architecture/AI_PROVIDERS.md). Prefer a provider file in
      # drishti.ai.dir and set model below to its logical model (provider/model). Old settings keep working as provider "ask".
      endpoint: ${DRISHTI_ASK_ENDPOINT:}   # an OpenAI-compatible chat completions URL, or an Anthropic Messages URL (see api)
      api: openai                    # openai | anthropic: the request and response shape
      model: ${DRISHTI_ASK_MODEL:}
      api-key: ${DRISHTI_ASK_KEY:}   # from the environment only; never logged
      packs: []                      # packs where the Ask box is on; empty = none (per-pack opt-in)
      values: labels-only            # labels-only | shown: whether the page's rendered text (values) goes into the prompt; masked values never do
      max-question-chars: 500
      max-prompt-kb: 24              # the whole prompt; the pack guide is cut first
      max-guide-chars: 6000
      max-answer-tokens: 400
      max-answer-chars: 2000
      timeout: 15s
      per-user-per-minute: 6
      per-user-per-day: 100
      log-questions: true            # the question text goes to the access log (action ask); answers are never stored
      log-answers: false             # true also writes the answer text to the server log
  pivot:                             # the Pivot tab (USER_GUIDE.md, The Pivot tab): only where a Sutra (pivot: on a table or
                                     # ladder) or a pack (pivot: beside a kind's columns:) opts in
    enabled: ${DRISHTI_PIVOT_ENABLED:true}     # false hides every Pivot tab, whatever Sutras and packs say
    max-records: 50000               # rows of a panel sent to the browser to pivot (the table's limit does not apply)
    max-row-keys: 2000               # innermost row groups shown (further ones still count in the totals)
    max-column-keys: 200             # column groups shown
    document-scan: 20000             # entities a search pivot reads as documents, when asked to, for fields that are not columns
    drill-page: 200                  # underlying rows per drill-down page at most
    budget: 20s                      # how long a search pivot waits for a day's columns or documents
  identity:
    # Users, roles defined in Admin → Roles, saved workspaces/monitors/settings and the audit trail live in one database
    # (JPA). SQLite by default: a single file, nothing to install. For PostgreSQL:
    #   DRISHTI_IDENTITY_DB_URL=jdbc:postgresql://db:5432/drishti DRISHTI_IDENTITY_DB_USER=drishti DRISHTI_IDENTITY_DB_PASSWORD=...
    # The schema (drishti-identity: db/schema-sqlite.sql, db/schema-postgres.sql) is applied at start; no migrations.
    database-url: ${DRISHTI_IDENTITY_DB_URL:jdbc:sqlite:${drishti.data.dir}/identity/drishti.db}
    database-user: ${DRISHTI_IDENTITY_DB_USER:}
    database-password: ${DRISHTI_IDENTITY_DB_PASSWORD:}
    # database-pool-size:           # unset: drishti.db.pool.size (20) on PostgreSQL; SQLite (embedded, one writer) keeps 8
    refresh-seconds: 15              # servers sharing one database see each other's role and pack changes this soon
    # The files of releases before 1.10, imported once into an empty database and renamed *.imported.
    users-file: ${DRISHTI_USERS_FILE:${drishti.data.dir}/identity/users.json}
    audit-file: ${DRISHTI_AUDIT_FILE:${drishti.data.dir}/identity/audit.jsonl}
    iterations: 240000              # PBKDF2-HMAC-SHA256
    min-password-length: 10
    max-failed-attempts: 5
    lockout: 15m
    # Nobody is forced to change a password unless configured here (an admin can still tick it per user).
    force-password-change-on-create: ${DRISHTI_FORCE_PW_CHANGE_ON_CREATE:false}
    force-password-change-on-reset: ${DRISHTI_FORCE_PW_CHANGE_ON_RESET:false}
    # On first start with no users, create a development admin. Change its password at once;
    # the console warns until you do. Turn off (DRISHTI_SEED_ADMIN=false) for production.
    seed-admin: ${DRISHTI_SEED_ADMIN:true}
    # With DRISHTI_SEED_USERNAME / DRISHTI_SEED_PASSWORD set (deploy/docker/compose.yaml requires both) it is the first
    # administrator you chose, not the development admin.
    seed-username: ${DRISHTI_SEED_USERNAME:drishti-dev-admin}
    seed-password: ${DRISHTI_SEED_PASSWORD:drishti-dev-admin123}
    seed-roles: [admin]
    seed-display-name: Drishti dev admin
  rachana:
    # Site Sutra directories, scanned recursively, in addition to the enabled packs' Sutras.
    dirs: ${DRISHTI_SUTRAS:./sutras}
    # Edit a Sutra and the next view uses it; an invalid edit keeps the last good version.
    hot-reload: true
    reload-debounce: 250ms
    watch: ${DRISHTI_SUTRA_WATCH:auto}   # auto: file events, else polling (inotify limit reached); poll: always poll (network file systems)
    poll-interval: 2s                  # how often polling looks at the Sutra files
    # Bounds on every Rachana-EL expression (Sutras, alert rules, search conditions): deeper or longer is DRS-2101.
    max-expression-depth: 200
    max-expression-length: 10000
    # Let Sutra Studio save files (authors only). Off by default; turn on in authoring environments.
    studio-save: ${DRISHTI_STUDIO_SAVE:false}
  ui-kit:
    # The Drishti UI kit (docs/architecture/SUTRA_NEXT.md, "The Drishti UI kit"): platform UI vocabulary loaded whatever packs are
    # enabled: fragments/ (used by any Sutra as { use: series-line@1 }), assets/ (icons, images, logos) and brand.yaml.
    dir: ${DRISHTI_UI_KIT_DIR:./config/ui-kit}
    # The site's overrides: brand.yaml (its keys win over the kit's) and assets/ (a file wins over the kit's of the same path).
    site-dir: ${DRISHTI_UI_KIT_SITE_DIR:${drishti.data.dir}/ui-kit}
  governance:
    # With review on, a Studio save is a proposal; an approver (role flag approve, or an admin) makes it live.
    enabled: ${DRISHTI_SUTRA_REVIEW:true}
    four-eyes: ${DRISHTI_SUTRA_FOUR_EYES:true}   # nobody approves their own proposal (when security is on)
    dir: ${DRISHTI_GOVERNANCE_DIR:${drishti.data.dir}/governance}
  engine:
    layout-cache-size: 10000        # effective layouts, one per (Sutra version, kind, data shape)
    fingerprint-cache-size: 100000  # one per (entity, generation; in a cluster, caller signature): about 30 MB full
    bind-parallelism: 0             # 0 = one binding thread per core
  db:
    pool:                            # connection pools of every database connector and the identity database (docs/connectors/CONNECTOR_FILES.md)
      size: 20                       # most connections open at once; a connector's own pool-size wins (SQLite and DuckDB are embedded and not pooled)
      min-idle: 2                    # idle connections kept when quiet
      idle-timeout: 10m              # an idle connection beyond min-idle is closed after this long
      max-lifetime: 30m              # a connection is replaced after this long
      connection-timeout: 10s        # a caller waits this long for a free connection, then fails
      leak-threshold: 60s            # a connection borrowed longer than this is logged with the borrower's stack (0 = off)
      statement-timeout: 5m          # longest one statement may run (PostgreSQL, MongoDB and Aerospike operations; 0 = none)
  http:
    proxy:                           # the site's outbound HTTP proxy (docs/connectors/TLS.md): OFF unless url is set (or from-environment is true)
      url: ${DRISHTI_HTTP_PROXY_URL:}                 # http://host:port; http and https targets both go through it (https via CONNECT)
      username: ${DRISHTI_HTTP_PROXY_USERNAME:}       # Basic proxy authentication
      password: ${DRISHTI_HTTP_PROXY_PASSWORD:}       # only a ${ENV} placeholder (a literal in this file is refused at start)
      no-proxy: []                                    # hosts that go direct: names, .suffixes, addresses, CIDR blocks (10.0.0.0/8)
      enabled: true                                   # false switches it off without removing it
      from-environment: false                         # true: when url is empty, honour HTTPS_PROXY / HTTP_PROXY / NO_PROXY
    # A connector (or AI provider, MCP server) inherits this unless its own file has a proxy: block, or `proxy: none`.
    request-limits:                 # oversized bodies are answered 413 DRS-5005 before they are read (declared or chunked)
      enabled: true
      rules:
        - { prefix: /api/v1/builder/, max-mb: "${drishti.builder.max-total-mb}" }   # also design import and uploads
  builder:
    # Screen Builder: the shape extractor (POST /api/v1/builder/shape). Over-limit input is refused with DRS-5003.
    max-samples: 50                 # documents per request
    max-file-mb: 5                  # largest single document
    max-total-mb: 25                # largest request
    max-depth: 64                   # deepest nesting of one document
    enum-max-distinct: 12           # text with at most this many distinct values (seen at least enum-min-seen times) is an enum
    enum-min-seen: 3
    examples: 3                     # example values per path in the report
    rare-below: 0.5                 # fields present in fewer than this share of their records are listed as rare
    # Auto-design and suggest (POST /api/v1/builder/design, /suggest):
    prune-share: 0.5                # a panel or strip figure empty or failing for more than this share of the samples is dropped or demoted
    strip-max: 6                    # figures in a drafted strip
    max-panels: 16                  # panels in the drafted main column
    max-side-panels: 4              # panels in the drafted right column (besides the links panel)
    line-min-points: 5              # dated rows shorter than this are drafted as a ladder, not a line
    max-alternatives: 2             # runner-up kinds kept with each drafted panel
    limit-names: [limit, max, cap, threshold, budget, capacity]   # names that hold a limit beside a measure (a gauge's maximum)
    file-binding: false             # development servers only: a design may be bound to a file in your own folder of dev-dir (save writes it, IDE edits come back); never makes anything live
    dev-dir: ${drishti.data.dir:./data}/dev-sutras           # where bound files live, one folder per user; must be OUTSIDE drishti.rachana.dirs (going live is always propose + approve)
    sample-max-items: 50            # synthetic sampler: longest array it generates (a schema asking for more is clamped, with a problem)
    sample-max-string: 1000         # ... longest string
    sample-max-depth: 8             # ... deepest nesting
    sample-max-kb: 256              # ... most kilobytes in one generated document
    fraction-names: [utilisation, utilization, usage, used, ratio, share, coverage, fill, pct, percent]   # words in a 0..1 number's name that make it a gauge (of 1)
    code-names: [year, version, seq, sequence, no, num, number, code, zip, postcode]   # words in a whole-number field's name that make it a code (shown as a label, never summed or formatted as an amount)
    designs:
      # The Build workbench's Designs (/api/v1/builder/designs): samples, a Sutra and notes kept per user. Limits answer DRS-5005.
      store: content   # content (the content store, config/store/store.yaml: every node of a cluster sees them; docs/architecture/CONTENT_STORE.md), or, one node only: file (dir below) or jpa (the identity database)
      dir: ${drishti.data.dir}/designs   # the old file store: with store content, what is here is imported once at start and the folder renamed designs-imported-<time>
      max-per-user: 50              # named designs one user keeps (scratch ones: max-scratch)
      max-samples: 50               # samples in one design
      max-mb: 25                    # megabytes of samples, Sutra, notes and tests in one design
      max-user-mb: 250              # megabytes of samples, Sutra, notes and tests across one user's designs
      max-sutra-kb: 1024            # largest Sutra text of one design (DRS-5005 beyond it; counted in max-mb and max-user-mb)
      max-notes-kb: 256             # largest notes text
      max-tests-kb: 1024            # largest tests
      max-scratch: 10               # scratch (unnamed) designs one user keeps; the oldest is deleted to make room; they do not count toward max-per-user
      scratch-ttl: 1d               # an unnamed design is deleted this long after it was last touched
      named-ttl: 90d                # a named design, likewise
      warn-after: 75d               # a named design untouched this long is listed with an expiry warning
      sweep-interval: 1h            # how often expired designs are deleted
      max-ops: 100                  # steps of the operation log a design keeps for undo and redo
  loads:
    # "A batch landed" (docs/guides/DATA_LOADS.md): POST /api/v1/packs/{pack}/loads, its history and the late-data check.
    dir: ${DRISHTI_LOADS_DIR:${drishti.data.dir}/loads}   # history per pack, and the administrators' expectation overrides (config/<pack>.yaml)
    keep: 2000                    # loads kept per pack
    scheduler: true               # false: no late-data check (the API and the page still work)
    check-interval: 60s           # how often expectations are checked for late data
    verify-limit: 1000            # most entities counted when a load is verified
    verify-timeout: 20s           # how long the verify, alerts and smoke steps may each wait
    lookback-days: 3              # business days before today still checked for missing data
    default-notify-roles: [admin] # told when a pack names no roles or users
    smoke-max: 20                 # most sample entities a pack may ask to be opened
  packs:
    # Domain packs (config/packs/<name>/pack.yaml): Sutras, mnemonics, links, badges, roles, vocabulary, samples.
    # Site settings below always override what a pack contributes.
    dir: ${DRISHTI_PACKS_DIR:./config/packs}
    # Further pack folders, comma-separated, looked in after dir: examples/packs holds the retired example packs (finance,
    # genomics, logistics, retail-banking, climate-risk, operational-risk, liquidity-risk); name one in enabled to load it.
    extra-dirs: ${DRISHTI_PACKS_EXTRA_DIRS:}
    # Packs loaded from Admin → Packs are listed here (drishti.packs.added) and read at every start; see spring.config.import.
    overlay: ${DRISHTI_PACKS_OVERLAY:${drishti.data.dir}/packs/added.yaml}
    # Packs installed from a signed registry (Admin → Packs → From the registry); looked in before dir, so they win.
    installed-dir: ${DRISHTI_PACKS_INSTALLED:${drishti.data.dir}/packs/installed}
    registry:
      url: ${DRISHTI_PACK_REGISTRY:}         # a folder, file: or https: URL with index.json; empty: no registry
      trusted-keys: {}                       # publisher -> Ed25519 public key (tools/packreg keygen prints it)
      max-archive-mb: 50
      max-unpacked-mb: 200
    # The administrator's data-source overrides, one file per pack (Admin → Packs → Data source); redeploying a pack keeps them.
    settings-dir: ${DRISHTI_PACKS_SETTINGS:${drishti.data.dir}/packs/settings}
    deploy:                                # Admin → Packs → Deploy archive (the archive carries the pack only, never data)
      max-archive-mb: 50                   # larger uploads are refused with 413
      max-unpacked-mb: 200
      max-files: 10000
      keep-versions: 5                     # previous versions kept per pack for a rollback
      require-signature: false             # true: only archives signed by a publisher in registry.trusted-keys
      require-manifest: true               # an archive needs MANIFEST.json (drishti.py pack bundle writes it)
      staging-minutes: 30                  # a verified upload waits this long for its confirmation
      history-file: ${DRISHTI_PACKS_DEPLOY_HISTORY:${drishti.data.dir}/packs/deploy-history.jsonl}
      probe-dates: 3                       # business dates listed per kind by Test connection
      probe-timeout-seconds: 30
    enabled: ${DRISHTI_PACKS:default}      # default: the edition's packs (drishti.edition), else config/editions/default-packs.yaml
    # Sample packs (sample: true in pack.yaml) are demonstrations. visible: everyone sees them; developers: only users with the author
    # or admin power; hidden: nobody, they are not loaded and their connectors do not start. Admin -> Packs ("Hide samples from business
    # users") saves a choice that overrides this. Use developers once real packs exist.
    samples: ${DRISHTI_PACKS_SAMPLES:visible}
    samples-file: ${DRISHTI_PACKS_SAMPLES_FILE:${drishti.data.dir}/packs/samples-mode}
    # The packs folder is watched: a new pack folder is loaded, an edited one re-checked and swapped in, a deleted one unloaded,
    # with no restart. auto: file events with polling as the safety net; poll: look every `poll`; off: only Admin -> Packs acts.
    watch: ${DRISHTI_PACKS_WATCH:auto}
    poll: 5s                               # how often the folders are looked at (also the safety net beside file events)
    reload-debounce: 750ms                 # a burst of changes is acted on once it has stopped for this long
    # Packs new users get until an admin says otherwise (empty: every installed pack).
    default-for-users: ${DRISHTI_DEFAULT_PACKS:}
  commands:
    # Mnemonics come from the enabled packs; add or override site mnemonics under `mnemonics:`.
    suggest-limit: ${DRISHTI_SUGGEST_LIMIT:25}   # entries in the command line's dropdown (the list scrolls)
    suggest-budget: 30ms            # type-ahead answers with what the sources returned by then
    recent-size: 20
  datamap:                           # the data map, DATAMAP (docs/admin/CONFIGURATION.md "drishti.datamap"): counts and joins checked in the background
    max-rows: 20000                  # rows of one kind read to count it and check its joins
    ttl: PT15M                       # a built map is read again after this
    read-budget: PT30S               # one listing or column read
    threads: 4                       # kinds read at once
  live:
    frame: 50ms                     # ticks within one frame coalesce (latest wins)
    heartbeat: 15s                  # SSE keep-alive comment
    max-streams: 20000
    window: 30s                     # rolling window for the p99 shown in the top bar
  graph:
    link-budget: 40ms               # linked entities slower than this show as pending
    # id-patterns, fields and badges come from the enabled packs; add site-specific ones here.

springdoc:
  api-docs:
    path: /api/docs
    enabled: ${DRISHTI_API_DOCS:true}      # set explicitly, so a start does not warn that they are on by default
  swagger-ui:
    path: /api/docs/ui
    enabled: ${DRISHTI_API_DOCS:true}
