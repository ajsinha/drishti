# Profile `redis` (SPRING_PROFILES_ACTIVE=redis): the banking packs' data domains are read from Redis (keys prefixed
# by the domain, loaded by tools/load-redis.sh) instead of Delta Lake. The packs still decide the kinds, routes, modes
# and promoted fields of each <domain>-store connector; the key prefix is the connector's domain. Redis holds today and
# the last few days in memory: in production put a Delta Lake or Iceberg connector for the same kinds behind it for the
# years of history (docs/REDIS_CONNECTOR.md, section 7).
drishti:
  sources:
    connectors:
      reference-store:  { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
      market-store:     { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
      trading-store:    { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
      risk-store:       { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
      credit-store:     { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
      collateral-store: { plugin: redis, settings: { uri: "${DRISHTI_REDIS_URI:redis://localhost:6379}", cluster: "${DRISHTI_REDIS_CLUSTER:false}" } }
