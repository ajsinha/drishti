# Profile `mongodb` (SPRING_PROFILES_ACTIVE=mongodb): the banking packs' data domains are read from MongoDB
# (a collection per domain in database `drishti`, loaded by tools/load-mongodb.sh) instead of Delta Lake. The packs still
# decide the kinds, routes and modes of each <domain>-store connector; the collection is the connector's domain.
drishti:
  sources:
    connectors:
      reference-store:  { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
      market-store:     { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
      trading-store:    { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
      risk-store:       { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
      credit-store:     { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
      collateral-store: { plugin: mongodb, settings: { uri: "${DRISHTI_MONGODB_URI:mongodb://localhost:27017}", database: "${DRISHTI_MONGODB_DATABASE:drishti}" } }
