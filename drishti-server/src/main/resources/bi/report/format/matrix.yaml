# The format of a matrix (the finance workhorse, BI_PARITY_PLAN gap 7): subtotals at every level of the rows and for the columns, a stepped (indented)
# or tabular layout, how far it opens, measures on columns or on rows, data bars and conditional formatting. See common.yaml.

$id: matrix
x-types: [matrix]
x-order: [Title, Layout, Subtotals, Values, Conditional formatting, Frame]
allOf:
  - $ref: "common#/$defs/frame"
type: object
additionalProperties: false
properties:
  subtotals:
    type: boolean
    x-label: Subtotals and totals
    x-hint: A subtotal for each group at every level of the rows, a total per row and a grand total; true totals for measures that do not add up.
    x-hook: format-subtotals
    x-group: Subtotals
  rowSubtotals:
    type: boolean
    default: true
    x-label: Row subtotals
    x-hint: Off keeps the grand total but drops the subtotal rows.
    x-group: Subtotals
  columnSubtotals:
    type: boolean
    default: true
    x-label: Column totals
    x-group: Subtotals
  stepped:
    type: boolean
    default: true
    x-label: Stepped layout
    x-hint: "On (the default): one indented column for the row fields. Off: a column per row field."
    x-group: Layout
  expandTo:
    type: integer
    minimum: 0
    maximum: 8
    x-label: Opens at level
    x-hint: "0 shows the first row field only; leave it empty to open every level."
    x-group: Layout
  valuesOn:
    type: string
    enum: [columns, rows]
    x-label: Show the values on
    x-hint: rows lists the measures under each row instead of across.
    x-group: Layout
  numberFormat:
    $ref: "common#/$defs/numberFormat"
  rowBanding:
    type: boolean
    x-label: Banded rows
    x-group: Layout
  dataBars:
    $ref: "common#/$defs/dataBars"
  conditional:
    $ref: "common#/$defs/legacyConditional"
  rules:
    $ref: "common#/$defs/rules"
