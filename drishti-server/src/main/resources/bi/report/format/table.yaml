# The format of a table: totals, data bars, banding, wrapping and conditional formatting. See common.yaml.

$id: table
x-types: [table]
x-order: [Title, Grid, Values, Totals, Conditional formatting, Frame]
allOf:
  - $ref: "common#/$defs/frame"
type: object
additionalProperties: false
properties:
  totals:
    type: boolean
    x-label: Total row (worked out over all the rows)
    x-hook: format-totals
    x-group: Totals
  numberFormat:
    $ref: "common#/$defs/numberFormat"
  rowBanding:
    type: boolean
    x-label: Banded rows
    x-group: Grid
  wrap:
    type: boolean
    x-label: Wrap long text
    x-group: Grid
  fontSize:
    type: integer
    minimum: 9
    maximum: 20
    x-label: Text size (px)
    x-group: Grid
  dataBars:
    $ref: "common#/$defs/dataBars"
  conditional:
    $ref: "common#/$defs/legacyConditional"
  rules:
    $ref: "common#/$defs/rules"
