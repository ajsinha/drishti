# The format of the static visuals (text, image, button) and of a board tile (a visual of another report on a page with layout: board, R7; its
# colour rule is its `alert:`, not a format key). See common.yaml.

$id: static
x-types: [text, image, button, tile]
x-order: [Title, Text, Frame, Statement]
allOf:
  - $ref: "common#/$defs/frame"
  - $ref: "common#/$defs/paged"
type: object
additionalProperties: false
properties:
  size:
    type: string
    enum: [heading]
    x-label: Size
    x-group: Text
    x-types: [text]
  align:
    type: string
    enum: [left, centre, right]
    x-label: Alignment
    x-group: Text
    x-types: [text, button]
