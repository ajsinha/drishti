# Generated at first start from the connector template of pack 'trading'. Edit it freely: it is never overwritten.
plugin: derived
kinds:
- counterparty-trades
- portfolio-trades
- legal-entity-trades
- index-trades
settings:
  refresh: 60s
  store: disk
  counterparty-trades.from: trade
  counterparty-trades.group-by: $.COUNTERPARTY
  counterparty-trades.id-field: COUNTERPARTY
  counterparty-trades.members: TRADE_IDS
  counterparty-trades.max-members: '1000'
  counterparty-trades.rows-field: TRADES
  counterparty-trades.fields.TRADE_COUNT: count
  counterparty-trades.fields.NOTIONAL: sum first($.LEGS).NOTIONAL
  counterparty-trades.fields.SOURCE_SYSTEMS: distinct $.SOURCE_SYSTEM
  counterparty-trades.fields.PRODUCT_TYPES: distinct $.PRODUCT_TYPE
  counterparty-trades.fields.CURRENCIES: distinct $.CURRENCY
  counterparty-trades.fields.LAST_MATURITY: max $.MATURITY_DATE
  counterparty-trades.fields.PAY_7D: sum sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 7], 'AMOUNT')
  counterparty-trades.fields.PAY_7D_EVENTS: sum size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 7])
  counterparty-trades.fields.PAY_30D: sum sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 30], 'AMOUNT')
  counterparty-trades.fields.PAY_30D_EVENTS: sum size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 30])
  counterparty-trades.fields.PAY_90D: sum sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 90], 'AMOUNT')
  counterparty-trades.fields.PAY_90D_EVENTS: sum size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 90])
  counterparty-trades.rows.TRADE_ID: $.TRADE_ID
  counterparty-trades.rows.SOURCE_SYSTEM: $.SOURCE_SYSTEM
  counterparty-trades.rows.PRODUCT_TYPE: $.PRODUCT_TYPE
  counterparty-trades.rows.BUY_SELL_CODE: $.BUY_SELL_CODE
  counterparty-trades.rows.CURRENCY: $.CURRENCY
  counterparty-trades.rows.NOTIONAL: first($.LEGS).NOTIONAL
  counterparty-trades.rows.MATURITY_DATE: $.MATURITY_DATE
  counterparty-trades.rows.TRADE_STATUS: $.TRADE_STATUS
  counterparty-trades.rows.INDEX_NAME: nonblank($.LEGS[0].INDEX.NAME, $.LEGS[1].INDEX.NAME, '')
  counterparty-trades.rows.COUNTERPARTY: $.COUNTERPARTY
  counterparty-trades.rows.PORTFOLIO: $.PORTFOLIO
  counterparty-trades.rows.LEGAL_ENTITY: $.LEGAL_ENTITY
