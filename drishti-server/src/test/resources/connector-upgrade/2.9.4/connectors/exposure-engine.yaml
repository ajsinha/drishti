# Generated at first start from the connector template of pack 'counterparty-risk'. Edit it freely: it is never overwritten.
plugin: reactive
mode: reactive
enabled: ${DRISHTI_EXPOSURE_ENABLED:true}
description: 'Exposure profiles (EE, ENE, EEE, PFE 95 and 99, EPE, EEPE) of any counterparty scope, computed when asked by the server''s exposure engine from the exposure paths, as the viewer: EXP <scope> <GO>'
kinds:
  exposure-result:
    compute: exposure-result
    params:
      q:
        type: decimal
        default: 0.95
        min: 0.5
        max: 0.9999
      collateral:
        type: enum
        options:
        - lagged
        - current
        - none
        default: lagged
      run:
        type: text
        default: ''
      detail:
        type: enum
        options:
        - none
        - whatif
        - set
        default: none
      sets:
        type: text
        default: ''
    result:
      required:
      - SCOPE
      - STATUS
      - PROFILE
      types:
        EPE: number
        PEAK_PFE: number
engine:
  type: java
  class: com.ash.drishti.server.exposure.ExposureResultEngine
  version: '1.0'
triggers:
- 'on': data-version
  kinds:
  - simulation-run
  - exposure-path
  - netting-set
  - csa
  - collateral-balance
  affects: all
coalesce:
  quiet: 1s
  max-wait: 10s
cache:
  results: 1000
  ttl: 1h
limits:
  timeout: 60s
  wait: 5s
  max-inflight-per-user: 4
