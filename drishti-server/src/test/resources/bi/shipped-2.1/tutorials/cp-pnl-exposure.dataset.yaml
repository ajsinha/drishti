# Tutorial 18: a composed dataset. Each source is a question put to another dataset, as the person reading, grouped to one row per counterparty; the
# answers are joined on the counterparty's id (not its name: the name is masked for some readers and a join on a masked column is refused).
rachana: 1
dataset: cp-pnl-exposure
version: 1
title: Counterparty P&L and exposure
description: One row per counterparty with the MTM, one-day P&L and trade count of its trades (trading-risk) next to its expected and potential exposure (counterparty-exposure).
from:
  pnl:
    dataset: trading-risk
    by: ["counterparties.id as counterparty", "counterparties.name as name", "counterparties.sector as sector"]
    measures: [MTM, "P&L 1d as Desk P&L", Trades]
    key: [counterparty]                 # name and sector are attributes of the counterparty: one row per counterparty
  exposure:
    dataset: counterparty-exposure
    by: ["counterparties.id as counterparty"]
    measures: [Exposure (EE peak), Exposure (PFE peak)]
    key: [counterparty]
join:
  - { left: pnl, right: exposure, on: [counterparty], type: left }
measures:
  MTM per exposure:
    expr: "[MTM] / [Exposure (EE peak)]"
    format: signed2
    description: MTM divided by the expected exposure peak; the two sums are taken over the rows of the visual, then divided.
