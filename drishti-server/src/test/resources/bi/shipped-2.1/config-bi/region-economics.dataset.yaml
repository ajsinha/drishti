# STORED SAMPLE 7: "Region economics". One table over the economics pack's region-economy kind: population and GDP for the Australian states and territories and the US states
# and DC, coded by ISO 3166-2 (AU-NSW, US-CA) so a map visual can shade the regions. THE FIGURES ARE ILLUSTRATIVE, ROUNDED FROM PUBLIC FIGURES, NOT FOR REPORTING: population to the
# nearest 10,000 and GDP to the nearest US$ billion (sources named in each row: ABS, US Census Bureau, BEA). Ratio measures are worked out from sums, so a country's GDP per head
# is its GDP over its population. Report: config/bi/reports/region-economics.report.yaml. Reference: docs/guides/DATASETS.md, docs/guides/DATA_GUIDE.md.

rachana: 1
dataset: region-economics
version: 1
title: Region economics
description: >-
  Population and GDP of the Australian states and territories and the US states, by country and ISO 3166-2 region code, so a map can shade the regions.
  Illustrative, rounded from public figures, not for reporting (population to the nearest 10,000, GDP to the nearest US$ billion).
sample: true
endorsement: promoted
tags: [sample, economics, illustrative, map]

tables:
  regions:
    source: { connector: macro-store, kind: region-economy }   # pack: economics
    mode: cached
    columns:
      iso3:         string                                      # the country's ISO 3166-1 alpha-3 code
      countryName:  string
      regionCode:   string                                      # the region's ISO 3166-2 code: a map's location below the country
      name:         string                                      # the region's name
      population:   { type: decimal, format: amount0 }
      gdpUsdBn:     { type: decimal, format: amount0 }
      gdpPerCapita: { type: decimal, format: amount0 }
      year:         string
      source:       string

measures:
  Population:
    expr: "sum(regions.population)"
    format: amount0
    description: People living in the region, rounded to the nearest 10,000. Illustrative.
  GDP (USD bn):
    expr: "sum(regions.gdpUsdBn)"
    format: amount0
    description: Output in US dollars, billions, rounded to the nearest billion. Illustrative, not for reporting.
  GDP per head (USD):
    expr: "ratio(sum(regions.gdpUsdBn), sum(regions.population)) * 1000000000"
    format: amount0
    description: "GDP over population: for a country, its regions' total GDP over their total population. Illustrative."

hierarchies:
  Country and region: [regions.countryName, regions.name]
