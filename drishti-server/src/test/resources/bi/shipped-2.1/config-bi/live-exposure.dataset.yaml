# SAMPLE (streaming): live counterparty exposure. The counterparty-risk pack's netting sets as they tick, kept in memory like live-trading. It is the second
# dataset of the "Desk wall" board, to show a wall of tiles from several reports over several datasets.
# Tutorial: docs/tutorials/10-first-bi-report.md. Reference: docs/guides/BI_GUIDE.md (live tables), docs/guides/BI_GUIDE.md.

rachana: 1
dataset: live-exposure
version: 1
title: Live exposure
description: >-
  Netting sets with their net mark-to-market, collateral, expected and potential future exposure and limit utilisation, updated as they tick.
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, live, streaming]

tables:
  netting:
    source:
      kind: netting-set         # pack: counterparty-risk
    mode: live
    columns:
      nettingSetId: { type: string, key: true }
      counterparty: string
      tradeCount:   integer
      netMtm:       { type: decimal, format: signed0 }
      collateral:   { type: decimal, format: signed0 }
      eePeak:       { type: decimal, format: amount0 }
      pfePeak:      { type: decimal, format: amount0 }
      limit:        { type: decimal, format: amount0 }
      utilisation:  decimal

measures:
  Netting sets:
    expr: "count(netting)"
  Net MTM:
    expr: "sum(netting.netMtm)"
    format: signed0
  Collateral:
    expr: "sum(netting.collateral)"
    format: signed0
  EE peak:
    expr: "sum(netting.eePeak)"
    format: amount0
  PFE peak:
    expr: "sum(netting.pfePeak)"
    format: amount0
  Max utilisation:
    expr: "max(netting.utilisation)"
  Worst net MTM:
    expr: "min(netting.netMtm)"
    format: signed0
