# SAMPLE (streaming): live counterparty exposure. The counterparty-risk pack's netting sets as they tick, kept in memory like live-trading. It is the second
# dataset of the "Desk wall" board, to show a wall of tiles from several reports over several datasets.
# Tutorial: docs/tutorials/10-first-bi-report.md. Reference: docs/guides/BI_GUIDE.md (live tables), docs/guides/BI_GUIDE.md.

rachana: 1
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/BI_LANGUAGE_REFERENCE.md)
dataset: live-exposure
version: 1
title: Live exposure
description: >-
  Netting sets with their net mark-to-market, collateral, limit and trade count, updated as they tick (the computed exposure, EE and PFE peaks, is the exposure engine's official end-of-day result: the models counterparty-exposure and trading-risk).
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, live, streaming]

tables:
  netting:
    source:
      kind: netting-set         # pack: counterparty-risk
    mode: live
    columns:
      NETTING_SET_ID: { type: string, key: true }
      COUNTERPARTY: string
      TRADE_COUNT:   integer
      NET_MTM:       { type: decimal, format: signed0 }
      COLLATERAL:   { type: decimal, format: signed0 }
      LIMIT:        { type: decimal, format: amount0 }

measures:
  Netting sets:
    expr: "count(netting)"
  Net MTM:
    expr: "sum(netting.NET_MTM)"
    format: signed0
  Collateral:
    expr: "sum(netting.COLLATERAL)"
    format: signed0
  Trades:
    expr: "sum(netting.TRADE_COUNT)"
    format: amount0
  Worst net MTM:
    expr: "min(netting.NET_MTM)"
    format: signed0
