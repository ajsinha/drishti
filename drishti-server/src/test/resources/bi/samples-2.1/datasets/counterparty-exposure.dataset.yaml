# STORED SAMPLE: the SECOND dataset of the multi-dataset samples. Counterparty exposure on its own: the netting sets of the counterparty-risk pack with
# the counterparty they belong to. It has no trades, so (unlike trading-risk) it has no row rule on trades: everyone with BI sees all exposure, and the
# names stay masked for readers without the raw power.
# It is the right-hand source of the composed dataset desk-pnl-vs-exposure and of the Python Transform behind desk-pnl-vs-exposure-py: P&L comes from
# trading-risk, exposure from here, and BI joins them. Read docs/guides/DATASETS.md section 11 and docs/tutorials/10-first-bi-report.md chapter 10.

rachana: 1
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: counterparty-exposure
version: 1
title: Counterparty exposure
description: >-
  Expected and potential future exposure (peak) of the netting sets, by counterparty, sector and country. No trades and no row rule: it answers
  "how much could we lose to this counterparty" on its own, and joins to other datasets (desk P&L, for one) through the counterparty.
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, multi-dataset]

tables:
  netting_sets:
    source: { connector: credit-store, kind: netting-set }     # pack: counterparty-risk
    mode: cached
    columns:
      COUNTERPARTY: string                                      # the counterparty's id: links to counterparties
      TRADE_COUNT:   integer
      NET_MTM:       { type: decimal, format: signed0 }
      COLLATERAL:   { type: decimal, format: signed0 }
      EE_PEAK:       { type: decimal, format: amount0 }          # expected exposure, peak
      PFE_PEAK:      { type: decimal, format: amount0 }          # potential future exposure, peak
      LIMIT:        { type: decimal, format: amount0 }

  counterparties:
    source: { connector: reference-store, kind: counterparty }  # pack: core
    mode: cached
    columns:
      NAME:    string
      RATING:  string
      SECTOR:  string
      COUNTRY: string

relationships:
  - { from: netting_sets.COUNTERPARTY, to: counterparties.id, cardinality: many-to-one }

measures:
  Exposure (EE peak):  { expr: "sum(netting_sets.EE_PEAK)",  format: amount0, description: "Sum of the netting sets' expected-exposure peaks." }
  Exposure (PFE peak): { expr: "sum(netting_sets.PFE_PEAK)", format: amount0 }
  Netting sets:        { expr: "count(netting_sets)" }
  Collateral:          { expr: "sum(netting_sets.COLLATERAL)", format: signed0 }

hierarchies:
  Counterparty: [counterparties.SECTOR, counterparties.NAME]

security:
  # No row rules: every reader with BI sees every netting set. (Rules are per dataset; trading-risk restricts a desk-head to their own desks because its
  # rows are trades. Exposure is about counterparties, not desks.) The same masks as trading-risk keep names and ratings from readers without the raw power.
  masked: [counterparties.NAME, counterparties.RATING]
