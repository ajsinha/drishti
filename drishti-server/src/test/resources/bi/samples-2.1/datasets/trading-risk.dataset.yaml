# STORED SAMPLE 2 of 3: the "real" example. A cross-pack model: trades (trading pack) joined to counterparties and desks and books
# (core pack) and to netting sets (counterparty-risk pack), using the links the packs already declare.
# It also shows a date hierarchy, a rollup, a row rule per role and masked columns.
# Tutorial: docs/tutorials/../guides/BI_RECIPES.md, 4 and 8. Reference: docs/guides/DATASETS.md.

rachana: 1
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: trading-risk
version: 1
title: Trading and counterparty risk
description: >-
  Trades with their counterparties, desks, books and netting sets, across three packs. Measures: MTM, notional, P&L 1d,
  trade counts, and exposure (EE and PFE peaks) from the netting sets. A desk-head sees only the trades of their own desks;
  counterparty names and traders are masked for readers without the raw power.
sample: true
endorsement: promoted
tags: [sample, trading, counterparty-risk, cross-pack]

tables:
  # ---- the fact tables: rows you add up --------------------------------------------------------------------------------
  trades:
    source: { connector: risk-store, kind: trade-valuation }   # pack: market-risk (every trade's valuation, from every source system)
    mode: cached
    refresh: { on-load: true }
    columns:
      VALUATION_ID:  { type: string, key: true }
      TRADE_ID:      string
      SOURCE_SYSTEM: string                                    # ENDUR, CALYPSO or MUREX
      DESK:          string                                    # the desk's id, DESK-FI: links to the desks table
      PORTFOLIO:     string                                    # the book: links to the books table
      COUNTERPARTY:  string                                    # the counterparty's id: links to counterparties
      NETTING_SET:   string                                    # links to the netting_sets table (a counterparty-risk kind)
      PRODUCT_TYPE:  string
      PRODUCT_GROUP: string
      CURRENCY:      string
      TRADE_STATUS:  string
      NOTIONAL:      { type: decimal, format: amount0 }
      MTM:           { type: decimal, format: signed0 }
      PNL_1D:        { type: decimal, format: signed0 }
      DV01:          { type: decimal, format: signed0 }
      TRADE_DATE:    date
      MATURITY_DATE: date

  netting_sets:
    source: { connector: credit-store, kind: netting-set }     # pack: counterparty-risk
    mode: cached
    columns:
      counterparty: string                                      # the counterparty's id: links to counterparties
      tradeCount:   integer
      netMtm:       { type: decimal, format: signed0 }
      collateral:   { type: decimal, format: signed0 }
      eePeak:       { type: decimal, format: amount0 }          # expected exposure, peak
      pfePeak:      { type: decimal, format: amount0 }          # potential future exposure, peak
      limit:        { type: decimal, format: amount0 }
      utilisation:  decimal

  # ---- the dimension tables: what you group and filter by --------------------------------------------------------------
  counterparties:
    source: { connector: reference-store, kind: counterparty }  # pack: core
    mode: cached
    columns:
      name:    string
      rating:  string
      sector:  string
      country: string
      type:    string

  desks:
    source: { connector: reference-store, kind: desk }
    mode: cached
    columns:
      name: string
      head: string

  books:
    source: { connector: reference-store, kind: book }
    mode: cached
    columns:
      name:     string
      deskName: string

# Relationships join tables. "from" is the MANY side, "to" the ONE side. These four are the links the packs declare in their
# link graph (graph.fields: desk, book, nettingSet, counterparty); they cross packs. Every id is the entity's own id.
relationships:
  - { from: trades.DESK,             to: desks.id,           cardinality: many-to-one }   # trading -> core
  - { from: trades.PORTFOLIO,             to: books.id,           cardinality: many-to-one }   # trading -> core
  - { from: trades.COUNTERPARTY,   to: counterparties.id,  cardinality: many-to-one }   # trading -> core
  - { from: trades.NETTING_SET,        to: netting_sets.id,    cardinality: many-to-one }   # trading -> counterparty-risk
  - { from: netting_sets.counterparty, to: counterparties.id, cardinality: many-to-one }  # counterparty-risk -> core
  # Not every join is allowed in one query: a measure from trades can be grouped by anything trades reaches, many-to-one
  # (desks, books, counterparties, netting_sets). Exposure comes from netting_sets and can be grouped by counterparties,
  # but not by desks (no many-to-one path from netting sets to desks). Ask for them in separate queries.

measures:
  MTM:                { expr: "sum(trades.MTM)",      format: signed0, description: "Mark-to-market in USD, signed." }
  Notional:           { expr: "sum(trades.NOTIONAL)", format: amount0 }
  "P&L 1d":           { expr: "sum(trades.PNL_1D)",    format: signed0, description: "Profit and loss over the last day." }
  Trades:             { expr: "count(trades)" }
  Counterparties:     { expr: "distinct(trades.COUNTERPARTY)", description: "How many different counterparties the trades are with." }
  MTM per 1m notional: { expr: "ratio(sum(trades.MTM), sum(trades.NOTIONAL)) * 1000000", format: signed2 }
  Worst trade MTM:    { expr: "min(trades.MTM)",      format: signed0 }
  MTM median:         { expr: "percentile(trades.MTM, 0.5)", format: signed0, description: "The median trade MTM." }
  MTM ytd:            { expr: "ytd(sum(trades.MTM), trades.TRADE_DATE)", format: signed0, description: "MTM of the trades dated this year up to the as-of date (the end of the report's dates). Time intelligence: ytd, mtd, qtd, prior_period, same_period_last_year, running." }
  MTM rank:           { expr: "rank(sum(trades.MTM))", description: "The position of each row of the visual by MTM, 1 for the highest (a window function: rank, dense_rank, percent_rank, lag, lead, moving_avg, moving_sum, moving_min, moving_max, cumulative)." }
  MTM 3-day average:  { expr: "moving_avg(sum(trades.MTM), 3, trades.TRADE_DATE)", format: signed0, description: "The average of MTM over the row and the two before it along the trade date (the visual needs trades.TRADE_DATE as a field)." }
  Open MTM:           { expr: "sum(trades.MTM, where=trades.TRADE_STATUS != 'MATURED')", format: signed0, description: "MTM of the trades not yet matured (a condition inside the aggregate)." }
  Exposure (EE peak): { expr: "sum(netting_sets.eePeak)",  format: amount0, description: "Sum of the netting sets' expected-exposure peaks. Group by counterparty, not by desk." }
  Exposure (PFE peak): { expr: "sum(netting_sets.pfePeak)", format: amount0 }
  Netting sets:       { expr: "count(netting_sets)" }

hierarchies:
  Trade date: [trades.TRADE_DATE.year, trades.TRADE_DATE.quarter, trades.TRADE_DATE.month, trades.TRADE_DATE]   # a date column cut into parts
  Desk and book: [desks.name, books.name]
  Counterparty: [counterparties.sector, counterparties.name]

security:
  # ROW RULES. Evaluated on the server for each reader. A reader gets the rows allowed by ANY rule for a role they hold; a reader
  # with no matching rule gets no rows. (With server security switched off nobody is restricted.)
  rows:
    - { role: desk-head, where: "trades.DESK in user.desks" }   # user.desks: the desk ids on the reader's profile (several: DESK-FI; DESK-FX)
    - { role: risk,      where: "True" }                        # risk sees everything
    - { role: analyst,   where: "True" }                        # an analyst sees every row too, but without the raw power the masked columns below read •••
    - { role: admin,     where: "True" }
  # A rule names tables (here trades), and every query of that reader joins them: a desk-head asking only for exposure would need a path
  # from netting sets to trades, which the model does not have, so the question is refused rather than answered with other desks' data.
  # MASKED COLUMNS: shown as ••• to readers without the raw power. A bare name matches that column in any table; table.column names one.
  # The server's own redact list (drishti.security.redact) applies on top of these.
  masked: [trades.COUNTERPARTY, counterparties.name, counterparties.rating]

rollups:
  # A ROLLUP is a small pre-aggregated table per business date, built after the columns. A query that groups only by these
  # columns and asks only for these measures is answered from it (see "layer" in the query preview).
  - { name: by_desk_currency, table: trades, by: [DESK, CURRENCY, PRODUCT_GROUP], measures: [MTM, Notional, "P&L 1d", Trades, MTM per 1m notional] }
