# SAMPLE REPORT 8: "Region economics". The map opens at the world and shades Australia and the United States by the sum of their regions' GDP (rows that name only regions shade
# their country with the sum, so the map shows an additive measure); a click opens that country's states, shaded by GDP, and filters the table and the bar. THE FIGURES ARE ILLUSTRATIVE,
# ROUNDED FROM PUBLIC FIGURES, NOT FOR REPORTING; the text on the page says so. Reference: docs/guides/BI_GUIDE.md (the map, "Sample: Region economics").

rachana: 1
report: region-economics
version: 1
title: Region economics
description: >-
  Population and GDP of the Australian states and territories and the US states: a map you can drill from the world to a country and its regions, a table of the regions and
  the top regions by GDP per head. Illustrative, rounded from public figures, not for reporting.
sample: true
endorsement: promoted
tags: [sample, economics, illustrative, map]
dataset: region-economics
theme: { palette: default }

pages:
  - id: regions
    title: Regions
    visuals:
      - { id: note, type: text, title: About these figures, at: { x: 0, y: 0, w: 12, h: 2 }, text: "Illustrative, rounded from public figures, not for reporting: population to the nearest 10,000 and GDP to the nearest US$ billion. Sources the numbers were rounded from: ABS Australian Demographic Statistics (December 2023) and State Accounts (2022-23); US Census Bureau Vintage 2023 estimates; BEA state GDP (2023)." }
      - { id: country, type: slicer, title: Country, at: { x: 0, y: 2, w: 12, h: 2 }, wells: { field: [regions.COUNTRY_NAME] }, format: { mode: dropdown, scope: report } }

      - id: gdp-map
        type: map
        title: "GDP (USD bn, illustrative): click a country to open its regions"
        at: { x: 0, y: 4, w: 8, h: 8 }
        wells: { location: [regions.REGION_CODE], values: [GDP (USD bn)] }
        format: { drill: true }
        alt: World map shading Australia and the United States by the sum of their regions' GDP; a click opens the country's states and territories (illustrative figures)

      - id: top-per-head
        type: bar
        title: Top regions by GDP per head (USD, illustrative)
        at: { x: 8, y: 4, w: 4, h: 8 }
        wells: { axis: [regions.NAME], values: [GDP per head (USD)] }
        filters: [{ field: regions.NAME, op: top, n: 10, by: GDP per head (USD) }]
        format: { labels: true }
        alt: Bars of GDP per head for the ten regions with the highest figure (illustrative)

      - id: table
        type: table
        title: The regions (illustrative)
        at: { x: 0, y: 12, w: 12, h: 8 }
        wells: { columns: [regions.COUNTRY_NAME, regions.REGION_CODE, regions.NAME, Population, GDP (USD bn), GDP per head (USD)] }
        sort: { by: GDP (USD bn), desc: true }
        limit: 100
