# SAMPLE REPORT 2 of 3: "Counterparty risk". A cross-pack report on the dataset trading-risk (trades from the trading pack, counterparties from banking-core,
# netting sets from counterparty-risk): exposure by counterparty, two slicers that filter every page, and a drill-through from a counterparty's bar to a page
# about that counterparty. Read it with three different people to see the row rules and masks at work (docs/guides/BI_RECIPES.md, row rules and masks):
#   * a desk-head sees only the trades of their own desks, so the MTM visuals show their desk; the exposure visuals are REFUSED for them (a visual says why,
#     DRS-9020: the row rule is on trades and a netting set does not reach trades) - this is the dataset's rule, not a bug of the report;
#   * an analyst (no raw power) sees the counterparty name as ••• because the dataset masks it, so every counterparty is one bar.
# Reference: docs/guides/REPORTS.md.

rachana: 1
report: counterparty-risk
version: 1
title: Counterparty risk
description: >-
  Exposure (expected and potential future, peak) by counterparty with the trades behind it; filter by sector and country, click a counterparty and drill through
  to its own page. Cross-pack: trading, banking-core and counterparty-risk.
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, cross-pack, tutorial]
dataset: trading-risk
theme: { palette: default }

pages:
  - id: exposure
    title: Exposure
    visuals:
      - { id: ee,      type: card, title: Exposure (EE peak),   at: { x: 0, y: 0, w: 3, h: 2 }, wells: { values: [Exposure (EE peak)] } }
      - { id: pfe,     type: card, title: Exposure (PFE peak),  at: { x: 3, y: 0, w: 3, h: 2 }, wells: { values: [Exposure (PFE peak)] } }
      - { id: sets,    type: card, title: Netting sets,         at: { x: 6, y: 0, w: 2, h: 2 }, wells: { values: [Netting sets] } }
      - { id: sector,  type: slicer, title: Sector,  at: { x: 8, y: 0, w: 2, h: 2 }, wells: { field: [counterparties.sector] }, format: { mode: dropdown, scope: report } }
      - { id: country, type: slicer, title: Country, at: { x: 10, y: 0, w: 2, h: 2 }, wells: { field: [counterparties.country] }, format: { mode: dropdown, scope: report } }

      - id: by-counterparty
        type: bar
        title: Exposure by counterparty (top 10 by EE peak)
        at: { x: 0, y: 2, w: 7, h: 6 }
        wells: { axis: [counterparties.name], values: [Exposure (EE peak), Exposure (PFE peak)] }
        filters: [{ field: counterparties.id, op: top, n: 10, by: Exposure (EE peak) }]         # keep the 10 counterparties with the highest EE peak (ranked by id, so a masked name cannot break it)
        drillthrough: { page: counterparty, field: counterparties.name }                        # click a bar, choose "Drill through": opens the counterparty page
        alt: Bars of expected and potential future exposure for the ten largest counterparties

      - id: by-sector
        type: donut
        title: Exposure by sector
        at: { x: 7, y: 2, w: 5, h: 6 }
        wells: { axis: [counterparties.sector], values: [Exposure (EE peak)] }
        format: { labels: true }
        alt: Donut chart of expected exposure for each counterparty sector

      - id: mtm-by-counterparty
        type: table
        title: Trades and MTM by sector (the row rules apply here)
        at: { x: 0, y: 8, w: 12, h: 5 }
        wells: { columns: [counterparties.sector, Trades, MTM, Counterparties] }
        format: { conditional: [{ measure: MTM, op: lt, value: 0, colour: "#b3261e" }] }

      # A map of the exposure by the country of the counterparty (ISO codes; the map data is vendored, countries only), the year-to-date MTM
      # (a time-intelligence measure: BI_GUIDE.md, DATASETS.md section 4) and the spread of the trades' MTM (a histogram over the members of an axis).
      - id: exposure-map
        type: map
        title: Exposure by country (EE peak)
        at: { x: 0, y: 13, w: 8, h: 7 }
        wells: { location: [counterparties.country], values: [Exposure (EE peak)] }
        alt: World map shading each country by the expected-exposure peak of its counterparties
      - { id: mtm-ytd, type: card, title: MTM year to date, at: { x: 8, y: 13, w: 4, h: 2 }, wells: { values: [MTM ytd] } }
      - id: mtm-spread
        type: histogram
        title: How the trades' MTM is spread
        at: { x: 8, y: 15, w: 4, h: 5 }
        wells: { axis: [trades.tradeId], values: [MTM] }
        format: { bins: 12 }
        alt: Bars counting how many trades fall in each band of mark to market

  - id: counterparty
    title: Counterparty
    drillthrough: { fields: [counterparties.name] }      # this page takes a counterparty's name as a filter when another page drills through to it
    visuals:
      - { id: c-ee,     type: card, title: Exposure (EE peak),  at: { x: 0, y: 0, w: 3, h: 2 }, wells: { values: [Exposure (EE peak)] } }
      - { id: c-trades, type: card, title: Trades,              at: { x: 3, y: 0, w: 3, h: 2 }, wells: { values: [Trades] } }
      - { id: c-mtm,    type: card, title: Mark to market,      at: { x: 6, y: 0, w: 3, h: 2 }, wells: { values: [MTM] } }
      - { id: c-notional, type: card, title: Notional,          at: { x: 9, y: 0, w: 3, h: 2 }, wells: { values: [Notional] } }
      - id: c-trades-table
        type: table
        title: The counterparty's trades (open one in the terminal)
        at: { x: 0, y: 2, w: 12, h: 7 }
        wells: { columns: [trades.tradeId, trades.desk, trades.productType, trades.currency, MTM, Notional] }
        sort: { by: MTM, desc: true }
        limit: 200

  # A counterparty's own Drishti view beside the numbers (an entity view, docs/guides/REPORTS.md section 3.4): click a bar and its netting-set view opens on the right,
  # built for whoever is looking, so a person who may not see a field does not see it here either.
  - id: lookup
    title: Counterparty lookup
    visuals:
      - id: ids
        type: bar
        title: Exposure by counterparty (click one)
        at: { x: 0, y: 0, w: 5, h: 10 }
        wells: { axis: [counterparties.id], values: [Exposure (EE peak)] }
        filters: [{ field: counterparties.id, op: top, n: 10, by: Exposure (EE peak) }]
        alt: Bars of expected exposure for the ten largest counterparties, by counterparty id
      - id: counterparty-view
        type: entity-view
        title: The counterparty's view
        at: { x: 5, y: 0, w: 7, h: 10 }
        wells: { key: [counterparties.id] }
        alt: The Drishti view of the counterparty selected in the bar chart
