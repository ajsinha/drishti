# SAMPLE BOARD (Python tiles): "Python wall". Tiles may be Python visuals: each runs for the person looking, on the rows they may see, in the console's sandbox
# (or in their browser), and is drawn like any other tile. A Python measure tile shows its number for each group as bars; a Python visual tile shows its chart or its
# Vega-Lite specification. A tile that draws Python has no threshold alert of its own; to be told when a Python measure crosses a limit, make an alert on it (it is
# read for you in the sandbox on its schedule or after a load: docs/guides/BI_GUIDE.md, "Python measures in alerts").
# Reference: docs/guides/BI_GUIDE.md ("Python tiles"). The report it reads: config/bi/reports/python-desk-risk.report.yaml.

rachana: 1
board: python-wall
version: 1
title: Python wall
description: Python on a wall. Desk P&L volatility (a Python measure), the one-day P&L histogram (a Python visual) and the P&L of each desk as dots (a Python visual that returns Vega-Lite).
sample: true
endorsement: none
tags: [sample, trading, python, vega-lite]

pages:
  - id: risk
    title: Desk risk
    tiles:
      - { id: vol,   report: python-desk-risk, visual: volatility, title: Desk P&L volatility, at: { x: 0, y: 0, w: 6, h: 6 } }
      - { id: hist,  report: python-desk-risk, visual: histogram,  title: One-day P&L,          at: { x: 6, y: 0, w: 6, h: 6 } }
      - { id: strip, report: python-desk-risk, visual: strip,      title: P&L by desk,           at: { x: 0, y: 6, w: 12, h: 6 } }
