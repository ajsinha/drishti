# The economy Sutra as tools/packgen/world/make.py generated it before Sutra Next phase 1 (written inline, no fragments), as
# version 2 so it wins while SutraNextEquivalenceTest draws the "before" view. Test data only.
rachana: 1
sutra: economy
version: 2
description: "An economy: output, growth, prices, jobs, debt and external balance, and output by sector, from World Bank, IMF and CIA data."
match: { kind: economy, priority: 10 }
title: { pill: Economics · Economy, id: $.ECONOMY_ID }
strip:
  - { label: Economy, bind: $.NAME }
  - { label: Region, bind: $.REGION_NAME }
  - { label: GDP (USD bn), bind: $.GDP_USD_BN, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.GDP_PER_CAPITA, fmt: amount0 }
  - { label: Real growth, bind: $.GROWTH, fmt: pc2, tone: sign, emphasis: true }
  - { label: Inflation, bind: $.INFLATION, fmt: pc2 }
  - { label: Unemployment, bind: $.UNEMPLOYMENT, fmt: pc2 }
  - { label: Debt / GDP, bind: $.DEBT_TO_GDP, fmt: pc1 }
panels:
  - id: geography
    kind: map
    title: Where it is
    highlight: $.ISO3
    link: { kind: economy, id: "ECON-{iso3}" }
    shade: { kind: economy, field: $.GDP_PER_CAPITA, by: $.ISO3, fmt: amount0, label: GDP per capita (USD) }
    height: 11
  - id: growthPath
    kind: line
    title: "Real GDP growth, % a year"
    key: F2
    rows: $.GROWTH_PATH
    x: YEAR
    y: GROWTH
    fmt: pc2
  - id: sectors
    kind: hbar
    title: "Output by sector, % of GDP"
    key: F3
    area: right
    rows: $.SECTORS
    label: SECTOR
    value: SHARE
    fmt: pc1
  - id: gdpPath
    kind: line
    title: "GDP, USD bn"
    key: F4
    rows: $.GDP_PATH
    x: YEAR
    y: GDP
    fmt: amount0
  - id: source
    kind: kv
    title: Data source and licence
    area: right
    rows: $.PROVENANCE
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.REGION_GROUP, 'country-group')", F8: impact, F9: raw }
