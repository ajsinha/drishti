# The trading pack's flow-schedule block as make_sutras.py generated it before Sutra Next, renamed old-flow-schedule so the old deal
# layouts (version 2, beside it) draw the panels they drew. Test data only.
rachana: 1
block: old-flow-schedule
version: 1
description: "Every cash flow of every leg in one schedule."
params: { rate-fmt: price4 }   # pct4 for rates (a fraction a year), price4 for prices per unit
panels:
  - id: flows
    kind: table
    title: Cash-flow schedule, every leg
    code: FLOWS
    key: F4
    rows: "flatten($.LEGS[*].CASH_FLOWS)"
    columns:
      - { label: Flow, bind: "@.FLOW_ID" }
      - { label: Start, bind: "@.START_DATE", fmt: date }
      - { label: End, bind: "@.END_DATE", fmt: date }
      - { label: Payment, bind: "@.PAYMENT_DATE", fmt: date }
      - { label: Fixing, bind: "nonblank(@.RATE_DETERMINATION_DATE, '–')" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: amount0, total: true }
      - { label: Rate / price, bind: "nonblank(@.RATE) ? @.RATE : (size(@.RESETS[?nonblank(@.RATE)]) > 0 ? sum(@.RESETS[?nonblank(@.RATE)], 'RATE') / size(@.RESETS[?nonblank(@.RATE)]) : '')", fmt: "%{rate-fmt}" }
      - { label: Resets, bind: "size(@.RESETS)" }
