# The country-group Sutra as tools/packgen/world/make.py generated it before Sutra Next phase 1 (written inline, no fragments), as
# version 2 so it wins while SutraNextEquivalenceTest draws the "before" view. Test data only.
rachana: 1
sutra: country-group
version: 2
description: "A World Bank region or income group (or the world): output, population, growth and its largest economies."
match: { kind: country-group, priority: 10 }
title: { pill: Economics · Country group, id: $.GROUP_ID }
strip:
  - { label: Group, bind: $.NAME }
  - { label: Type, bind: $.GROUP_TYPE }
  - { label: Economies, bind: $.ECONOMIES, fmt: amount0 }
  - { label: GDP (USD bn), bind: $.GDP_USD_BN, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.GDP_PER_CAPITA, fmt: amount0 }
  - { label: Population (m), bind: $.POPULATION_M, fmt: price2 }
  - { label: Real growth, bind: $.GROWTH, fmt: pc2, tone: sign, emphasis: true }
panels:
  - id: growthPath
    kind: line
    title: "Real GDP growth, % a year"
    key: F2
    rows: $.GROWTH_PATH
    x: YEAR
    y: GROWTH
    fmt: pc2
  - id: topEconomies
    kind: table
    title: Largest economies
    key: F3
    rows: $.TOP_ECONOMIES
    columns:
      - { label: Economy, bind: "@.ECONOMY" }
      - { label: GDP (USD bn), bind: "@.GDP_USD_BN", fmt: amount0, total: true }
      - { label: "Growth, %", bind: "@.GROWTH", fmt: pc2, tone: sign }
  - id: gdpPath
    kind: line
    title: "GDP, USD bn"
    area: right
    rows: $.GDP_PATH
    x: YEAR
    y: GDP
    fmt: amount0
  - id: source
    kind: kv
    title: Data source and licence
    area: right
    rows: $.PROVENANCE
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.MEMBER_ECONOMIES, 'economy')", F8: impact, F9: raw }
