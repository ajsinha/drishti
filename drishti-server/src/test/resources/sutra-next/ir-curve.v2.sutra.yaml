# The ir-curve Sutra as make_sutras.py generated it before Sutra Next phase 1 (written inline, no fragments), as version 2 so it
# wins while SutraNextEquivalenceTest draws the "before" view. Test data only.
rachana: 1
sutra: ir-curve
version: 2
description: "Discounting (OIS), projection (IBOR/term RFR), government or basis curve for a currency."
match: { kind: ir-curve, priority: 10 }
title: { pill: Market data · Interest rate curve, id: $.CURVE_ID }
strip:
  - { label: Currency, bind: $.CURRENCY }
  - { label: Type, bind: $.CURVE_TYPE }
  - { label: Index, bind: $.INDEX }
  - { label: "10Y", bind: $.TEN_Y, fmt: pct4, emphasis: true }
  - { label: "2s10s", bind: $.SLOPE_2S_10S, fmt: bp1, tone: sign }
  - { label: Points, bind: size($.POINTS) }
  - { label: As of, bind: $.AS_OF, fmt: date }
panels:
  - id: curve
    kind: line
    title: Zero rates (%)
    code: CRV
    key: F2
    rows: $.POINTS
    x: TENOR
    y: ZERO_RATE
    fmt: price2
  - id: points
    kind: table
    title: Pillars
    key: F3
    rows: $.POINTS
    columns:
      - { label: Tenor, bind: "@.TENOR" }
      - { label: Instrument, bind: "@.INSTRUMENT" }
      - { label: Quote, bind: "@.QUOTE", fmt: pct4 }
      - { label: Zero, bind: "@.ZERO_RATE", fmt: price2 }
      - { label: DF, bind: "@.DF", fmt: df4 }
  - id: forwards
    kind: line
    title: "1Y forward rates (%)"
    area: right
    rows: $.FORWARDS
    x: TENOR
    y: RATE
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.CALENDAR, 'calendar')", F8: impact, F9: raw }
