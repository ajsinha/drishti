# The rate-fixing Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: rate-fixing
version: 2
description: "Published overnight and term rate fixings (SOFR, €STR, SONIA…)."
match: { kind: rate-fixing, priority: 10 }
title: { pill: Market data · Rate index fixings, id: $.INDEX_ID }
strip:
  - { label: Index, bind: $.NAME }
  - { label: Latest, bind: $.LATEST, fmt: pct4, emphasis: true }
  - { label: Administrator, bind: $.ADMINISTRATOR }
  - { label: Tenor, bind: $.TENOR }
panels:
  - id: fixings
    kind: ladder
    title: Recent fixings
    key: F2
    rows: $.FIXINGS
    columns:
      - { label: Date, bind: "@.DATE", fmt: date }
      - { label: Rate, bind: "@.RATE", fmt: pct4 }
      - { label: Volume (bn), bind: "@.VOLUME_BN", fmt: amount0 }
  - id: chart
    kind: line
    title: Last 30 fixings
    area: right
    rows: $.FIXINGS
    x: DATE
    y: RATE_PCT
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
