# The fx-spot Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: fx-spot
version: 2
description: Spot rate for a currency pair with bid/ask.
match: { kind: fx-spot, priority: 10 }
title: { pill: Market data · FX spot rate, id: $.PAIR }
strip:
  - { label: Pair, bind: $.PAIR }
  - { label: Mid, bind: $.MID, fmt: rate5, emphasis: true }
  - { label: Bid, bind: $.BID, fmt: rate5 }
  - { label: Ask, bind: $.ASK, fmt: rate5 }
  - { label: "1D change", bind: $.CHANGE_1D, fmt: pct2, tone: sign }
  - { label: Value date, bind: $.SPOT_DATE, fmt: date }
panels:
  - id: history
    kind: line
    title: Last 30 days
    key: F2
    rows: $.HISTORY
    x: DATE
    y: MID
    fmt: rate5
  - id: pair
    kind: kv
    title: Conventions
    area: right
    rows: $.CONVENTIONS
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.FX_FORWARD_CURVE, 'fx-forward-curve')", F8: impact, F9: raw }
