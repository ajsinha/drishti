# The commodity Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: commodity
version: 2
description: "A traded commodity with its benchmark, unit and venue."
match: { kind: commodity, priority: 10 }
title: { pill: Market data · Commodity, id: $.COMMODITY_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Front month, bind: $.FRONT, fmt: price2, emphasis: true }
  - { label: Unit, bind: $.UNIT }
  - { label: Exchange, bind: $.EXCHANGE }
  - { label: Sector, bind: $.SECTOR }
panels:
  - id: spec
    kind: kv
    title: Contract specification
    key: F2
    rows: $.SPEC
  - id: ohlc
    kind: candlestick
    title: "Front month (daily bars, last 60 days)"
    code: OHLC
    key: F3
    rows: $.OHLC
    x: DATE
    fmt: price2
    volume: VOLUME
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.COMMODITY_CURVE, 'commodity-curve')", F8: impact, F9: raw }
