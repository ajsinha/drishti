# The commodity-curve Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: commodity-curve
version: 2
description: Futures settlement prices by delivery month.
match: { kind: commodity-curve, priority: 10 }
title: { pill: Market data · Commodity forward curve, id: $.CURVE_ID }
strip:
  - { label: Commodity, bind: $.COMMODITY }
  - { label: Front, bind: $.FRONT, fmt: price2, emphasis: true }
  - { label: Shape, bind: $.SHAPE }
  - { label: "M1–M12", bind: $.ROLL, fmt: price2, tone: sign }
panels:
  - id: curve
    kind: line
    title: Forward curve
    key: F2
    rows: $.POINTS
    x: MONTH
    y: PRICE
    fmt: price2
  - id: points
    kind: table
    title: Settlements
    rows: $.POINTS
    columns:
      - { label: Month, bind: "@.MONTH" }
      - { label: Price, bind: "@.PRICE", fmt: price2 }
      - { label: OI, bind: "@.OPEN_INTEREST", fmt: amount0 }
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.COMMODITY_REF, 'commodity')", F8: impact, F9: raw }
