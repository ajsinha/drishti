# The equity-vol-surface Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: equity-vol-surface
version: 2
description: Implied vols by expiry and moneyness.
match: { kind: equity-vol-surface, priority: 10 }
title: { pill: Market data · Equity volatility surface, id: $.SURFACE_ID }
strip:
  - { label: Underlier, bind: $.UNDERLIER }
  - { label: "1M ATM", bind: $.ATM_1M, fmt: price2, emphasis: true }
  - { label: "1Y ATM", bind: $.ATM_1Y, fmt: price2 }
  - { label: "1Y skew (90–110)", bind: $.SKEW_1Y, fmt: price2, tone: sign }
panels:
  - id: surface
    kind: surface
    title: Implied vol by expiry × moneyness (%)
    code: SURF
    key: F4
    rows: $.GRID
    y: EXPIRY
    columns:
      - { label: "80%", bind: "@.M_80", fmt: price2 }
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: "100%", bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
      - { label: "120%", bind: "@.M_120", fmt: price2 }
  - id: grid
    kind: table
    title: Vol (%) by moneyness
    key: F2
    rows: $.GRID
    columns:
      - { label: Expiry, bind: "@.EXPIRY" }
      - { label: "80%", bind: "@.M_80", fmt: price2 }
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: "100%", bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
      - { label: "120%", bind: "@.M_120", fmt: price2 }
  - id: atm
    kind: line
    title: ATM term structure
    area: right
    rows: $.GRID
    x: EXPIRY
    y: M_100
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
