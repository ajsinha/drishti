# The simm Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the counterparty-risk equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: simm
version: 2
description: Initial margin by risk class and product class.
match: { kind: simm, priority: 10 }
title: { pill: Collateral and margin · ISDA SIMM initial margin, id: $.CALC_ID }
strip:
  - { label: Total IM, bind: $.TOTAL, fmt: compact, emphasis: true }
  - { label: Posted, bind: $.POSTED, fmt: compact }
  - { label: Received, bind: $.RECEIVED, fmt: compact }
  - { label: Version, bind: $.VERSION }
panels:
  - id: classes
    kind: hbar
    title: IM by risk class
    key: F2
    rows: $.RISK_CLASSES
    label: RISK_CLASS
    value: IM
    fmt: compact
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.NETTING_SET, 'netting-set')", F8: impact, F9: raw }
