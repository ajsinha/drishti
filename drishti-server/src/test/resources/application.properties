drishti.security.registered-users-only=false
# tests keep what they write in the run's folder (drishti.test.dir, see TestRun: removed when the test JVM ends), never in a data/
# folder of the module and never in a folder that outlives the run
drishti.builder.designs.dir=${drishti.test.dir}/designs
# a content store of its own for every test context (designs, BI content and BI runs live there), never shared between test classes
drishti.store.root=${drishti.test.dir}/fstore/${random.uuid}
# and an empty old collaboration folder of its own: a new content store imports what an old folder holds (CollabImport), so a shared
# one that earlier contexts wrote to would be copied into every later store
drishti.collab.dir=${drishti.test.dir}/collab/${random.uuid}
drishti.packs.installed-dir=${drishti.test.dir}/packs/installed
drishti.packs.settings-dir=${drishti.test.dir}/packs/settings
drishti.reports.folder=${drishti.test.dir}/reports
drishti.loads.dir=${drishti.test.dir}/loads
drishti.data.dir=${drishti.test.dir}/data
drishti.sources.connectors-dir=${drishti.test.dir}/connectors
drishti.sources.connectors-drain=0s
drishti.sources.connectors-poll=200ms
