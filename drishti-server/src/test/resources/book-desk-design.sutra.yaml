# A user's own page for a book, as the Sutra designer saves it (SutraNextEventsTest: ?design=<id>).
rachana: 1
sutra: my-book-page
version: 1
description: "My book page: the trades, a click shows the cash flows beside and the counterparty."
match: { kind: portfolio-trades }
title: { pill: "My book", id: $.PORTFOLIO }
panels:
  - use: row-picker@1
    with: { id: trades, title: Trades, rows: $.TRADES, event: open, key: TRADE_ID, key-label: Trade, ref: COUNTERPARTY,
            a: PRODUCT_TYPE, a-label: Product, b: COUNTERPARTY, b-label: Counterparty, amount: NOTIONAL, amount-label: Notional,
            date: MATURITY_DATE, date-label: Maturity, empty: No trades, code: TRD }
    children:
      - place: detail-right
        source: { pack: trading, kind: trade, id: "@parent.open.id" }
        panels:
          - use: cashflow-ladder@1
            with: { id: flows, title: Cash flows, rows: $src.EVENTS, date: EVENT_DATE, type: PAYMENT_TYPE, amount: AMOUNT }
  - id: counterparty
    kind: kv
    title: Counterparty
    area: right
    waits: Pick a trade
    source: { pack: core, kind: counterparty, id: "@trades.open.ref" }
    columns:
      - { label: Name, bind: $src.NAME }
