# Tests keep the identity database in the run's folder (drishti.test.dir, removed when the test JVM ends), never in a data folder
# and never in one that outlives the run (its collaboration rows and seals are imported into every new content store); tests that
# need their own set it inline.
drishti.identity.database-url=jdbc:sqlite:${drishti.test.dir}/identity/drishti.db
