  market.fx-vol-surface: {id: SURFACE_ID}
  market.ir-vol-cube: {id: CUBE_ID}
  market.cap-vol-surface: {id: SURFACE_ID}
  market.equity: {id: TICKER}
  market.equity-index: {id: INDEX_ID}
