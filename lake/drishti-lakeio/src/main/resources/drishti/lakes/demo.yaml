  credit.cva: {id: RESULT_ID}
  credit.sa-ccr: {id: CALC_ID}
  collateral.collateral-balance: {id: BALANCE_ID}
  collateral.margin-call: {id: CALL_ID}
  collateral.simm: {id: CALC_ID}
  risk.simulation-run:
