# config/lakes/demo.yaml: the demo lake (docs/guides/DATA_LAKE_GUIDE.md section 2.1). The demo lake is a lake like any other: drishti.py lake
# demo, tools/build_demo_lakes.py, the data inbox and the demo's connectors all write and read through this file. Every table is
# partitioned by business_date first, always; partition-by names only what comes after it. A table's entry is the truth: an administrator
# edits it here, never in a connector file or on a command line (a --partition-by that disagrees is refused, naming both). Like every lake
# it has its own folder, <data>/delta/demo (DRISHTI_DELTA_ROOT, when a site sets it, names the root instead); a demo lake built in the older
# layout, directly in <data>/delta, is moved into it once, safely, at start (drishti.py lake relocate demo; docs/guides/OPERATIONS_GUIDE.md).
# The file holds an entry for every table a shipped pack's connector reads from the demo lake (a test checks it; LakesCli pack-tables
# adds a missing one), so the server never writes it; a table only a site's own connector reads is added at the end, every line kept.
lake: demo
format: delta
root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta/demo}
defaults: {load-mode: replace}
tables:
  compute-demo.path-book:
    promote: [BOOK_ID, NAME, DESK, STRIP_COUNT]
  compute-demo.path-strip:
    promote: [STRIP_ID, BOOK_ID, INSTRUMENT, DAYS]
  reference.counterparty: {id: COUNTERPARTY_ID}
  reference.counterparty-group: {id: GROUP_ID}
  reference.issuer: {id: ISSUER_ID}
  reference.ccp: {id: CCP_ID}
  reference.legal-entity: {id: ENTITY_ID}
  reference.book: {id: BOOK_ID}
