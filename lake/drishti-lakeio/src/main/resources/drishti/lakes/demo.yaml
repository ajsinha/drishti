  risk.scenario-pv:
    promote: [VALUE_TYPE, GRAIN, TRADE_ID, POSITION_ID, CURRENCY, SOURCE_SYSTEM, SECURITY_ID, INSTRUMENT, LEGAL_ENTITY, DIVISION, DESK, TT_BOOK,
      LIMIT_LETTER, PORTFOLIO, STRATEGY, PRODUCT_GROUP, PRODUCT_TYPE, COUNTERPARTY, DIRECTION, QUANTITY, BASE_PV, VALUATION_DATE, BASE_VALUATION_DATE,
      TAGS, TRADE_STATUS, MATURITY_DATE, STATUS, SCENARIO_SET_ID, BATCH_ID, RUN_KIND, COMPUTED_AT, TRADE_IDS, TRADE_CURRENCY]
    vectors: [SCENARIO_PV]
    id: SCENARIO_PV_ID
    date: BUSINESS_DATE
    partition-by: [SCENARIO_SET_ID, GRAIN]
    sort-by: [LEGAL_ENTITY, DIVISION, DESK, TT_BOOK, TRADE_ID]
    compression: zstd
    vector-compression: zstd
    file-size-mb: 256
    row-group-mb: 16
    time-travel: 30d
    maintenance: {compaction: true, target-file-mb: 256, vacuum: 7d, checkpoint: true}
  risk.fx-scenario:
    promote: [CURRENCY, RATE, SCENARIO_SET_ID]
    id: FX_SCENARIO_ID
    date: BUSINESS_DATE
  risk.scenario-set: {id: SCENARIO_SET_ID, date: BUSINESS_DATE}
