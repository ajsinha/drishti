# The suppliers of the book-trades board as an author sees them (ui check --suppliers).
suppliers:
  connector:trading/trade-search:
    fields:
      TRADE_ID: { type: id, of: trading/trade }
      TRADE_DATE: date
      COUNTERPARTY_NAME: text
      NOTIONAL: { type: measure, ccy: USD }
      MTM_USD: { type: measure, ccy: USD }
    masked: [MTM_USD]
  connector:trading/trade:
    fields:
      TRADE_ID: { type: id, of: trading/trade }
      DEAL_NUMBER: text
      INSTRUMENT_TYPE: text
      BUY_SELL: text
      CCY: text
      NOTIONAL: measure
      START_DATE: date
      MATURITY_DATE: date
      STATUS: text
  model:trading-risk:
    fields:
      FLOW_AMOUNT: measure
      cashflows.PAY_DATE: date
      cashflows.CCY: dimension
      cashflows.TRADE_ID: { type: id, of: trading/trade }
  connector:secret/vault:
    readable: false
    fields: { X: text }
