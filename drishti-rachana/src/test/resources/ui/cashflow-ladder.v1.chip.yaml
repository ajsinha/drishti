# A test chip: the cash-flow ladder of UI_BOARD.md 3.1 (the seed chip of P2 replaces it).
rachana: 1
chip: cashflow-ladder
version: 1
title: Cash-flow ladder
category: charts
tags: [cash flows, ladder, dates]

manual:
  purpose: "Amounts by date as a ladder, grouped (by currency, by leg); filtered by a control pin."
  pins:
    rows:   "The flows: a date, an amount, optionally a group and the trade they belong to."
    filter: "A filter (for example the selected trade). Empty means every flow."
    picked: "Out. The date the person clicked."
  behaviour: "Clicking a rung sends its date out as 'picked'."
  defaults: "Every flow, grouped by 'group' when it is mapped."
  limits: "Paints at most 2,000 rungs."
  examples:
    - title: The flows of a model
      board: |
        chips:
          flows:
            use: cashflow-ladder@1
            supply: { model: trading-risk, query: { measures: [FLOW_AMOUNT] } }
            map: { rows.date: cashflows.PAY_DATE, rows.amount: FLOW_AMOUNT }
  not-for: "A table of flows (use filterable-table)."
  accessibility: "Each rung is a row of a table with its date and amount."

pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        date:   { type: date, required: true }
        amount: { type: measure, required: true }
        group:  { type: dimension }
        trade:  { type: id }
    filter: { role: control, type: filter }
  out:
    picked: { type: date }

body:
  panels:
    - id: ladder
      kind: ladder
      title: "%{title|Cash flows}"
      rows: "@rows"
      where: [ "%{filter|true}" ]
      date: "@.date"
      value: "@.amount"
      group: "@.group"
      on-select: { emits: picked, value: "@.date" }
