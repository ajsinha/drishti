# A test chip: the detail card of UI_BOARD.md 3.1 (the seed chip of P2 replaces it).
rachana: 1
chip: entity-card
version: 1
title: Entity card
category: records
tags: [record, detail, card]

manual:
  purpose: >
    One record of a kind as a card: a title, an id and a list of fields. Opened by an id, so it follows a master
    chip's selection through a trace.
  pins:
    id:   "The id of the record to show. Required; the card is empty with a hint until one arrives."
    doc:  "The record. Its fields are mapped onto the card's id, title and field list."
    open: "Out. The id the person opened from the card (its title link)."
  behaviour: "Clicking the title opens the record's own board and sends 'open'."
  defaults: "Without fields mapped, the card shows the id and title only."
  limits: "Shows at most 40 fields; the rest are behind 'more'."
  examples:
    - title: A card opened by a constant id
      board: |
        chips:
          ticket: { use: entity-card@1, supply: { connector: trading/trade }, map: { doc.id: TRADE_ID }, controls: { id: "1000015" } }
  not-for: "Many records (use filterable-table); a chart (use a chart chip)."
  accessibility: "The card is a region named by its title; fields are a description list."

pins:
  in:
    id:  { role: control, type: id, required: true }
    doc:
      role: data
      type: document
      required: true
      shape:
        id:     { type: id }
        title:  { type: dimension }
        fields: { type: dimension, many: true, max: 40 }
  out:
    open: { type: id, of: doc.id }

body:
  panels:
    - id: card
      kind: kv
      title: "%{title|Record}"
      rows: "@doc"
      fields:
        - { label: Id, bind: "@.id" }
        - { label: Title, bind: "@.title" }
        - { each: fields, label: "@name", bind: "@.value" }
      on-select: { emits: open, value: "@.id" }
