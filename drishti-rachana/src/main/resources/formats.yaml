# Core named formats for Sutra `fmt:` keys and fmt(...) calls (domain-neutral; packs add their own). A site can override or add formats with
# drishti.rachana.formats-file. Negative numbers use the true minus sign (U+2212).
formats:
  text:     { type: text }
  amount0:  { type: number, decimals: 0 }
  amount2:  { type: number, decimals: 2 }
  signed0:  { type: number, decimals: 0, sign: always }
  signed2:  { type: number, decimals: 2, sign: always }
  pct0:     { type: number, decimals: 0, scale: 100, suffix: "%" }
  pct2:     { type: number, decimals: 2, scale: 100, suffix: "%" }
  price2:   { type: number, decimals: 2 }
  compact:  { type: compact, decimals: 1 }
  date:     { type: date, pattern: yyyy-MM-dd }
  dmy:      { type: date, pattern: dd MMM yyyy }
