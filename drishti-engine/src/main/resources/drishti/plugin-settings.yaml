  cassandra:
    tls: true
    settings:
      - { name: "layout.*", desc: "Per-kind promoted columns: layout.<kind>.columns: a, b, c (columns the loader created)", group: mapping }
      - { name: contact-points, desc: "host:port list, comma separated (port 9042 when left out); required unless secure-connect-bundle is set", group: connection }
      - { name: local-datacenter, desc: "The data centre the driver prefers (nodetool status names it; datacenter1 on one node); required unless secure-connect-bundle is set", group: connection }
      - { name: keyspace, desc: "The keyspace (default: the domain)", group: connection }
