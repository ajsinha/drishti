# The settings of the shipped source plugins, for the connector form and validator (Admin -> Connectors).
# A plugin that overrides SourcePlugin#settingSpecs() wins over its entry here. Fields: name (a trailing .* covers a
# subtree), type (string|int|boolean|duration|path|list|enum:a|b), required, default, desc, secret, group.
# A plugin with `tls: true` also offers the shared tls.* section, which is NOT written here: it is generated from
# TlsSettings.settingSpecs (drishti-api), the class that reads the keys, so the form cannot drift from the code. A plugin
# with a second TLS endpoint lists its prefix under `tls-prefixes` (kafka: schema-registry.tls.). A plugin with `proxy: true`
# (every HTTP-based one) likewise offers the shared proxy.* section, generated from ProxySettings.settingSpecs (drishti-api).
common:
  - { name: source-name, desc: "The name documents carry as their provenance (default: the connector's name)", group: general }
  - { name: "mode.*", desc: "Per-kind read mode (mode.<kind>)", group: mapping }
  - { name: domain, desc: "The data domain (folder, schema or key prefix) the connector reads", group: connection }
  - { name: stale-after, type: duration, desc: "Mark the source stale when it has received nothing for this long (15m, 2h, 1d)", group: general }
  - { name: union, type: boolean, default: "false", desc: "This connector holds one slice of its kinds (one source system of several, ids unique across them): reads, searches, type-ahead and BI tables ask every union connector of the kind together", group: mapping }
plugins:
  jdbc:
    tls: true
    settings:
      - { name: "layout.*", desc: "Per-kind promoted columns: layout.<kind>.columns: a, b, c", group: mapping }
      - { name: url, required: true, desc: "JDBC URL, e.g. jdbc:postgresql://host:5432/db", group: connection }
      - { name: user, desc: "Database user", group: connection }
      - { name: password, secret: true, desc: "Database password: ${ENV_VAR} or file:/path", group: connection }
      - { name: table, desc: "`schema.table`; setting it turns table mode on", group: connection }
      - { name: kind-column, desc: "Column holding the kind", group: mapping, default: "kind" }
      - { name: id-column, desc: "Column holding the entity id", group: mapping, default: "id" }
      - { name: doc-column, desc: "Column holding the JSON document", group: mapping, default: "doc" }
      - { name: date-column, desc: "Column holding the business date", group: mapping, default: "business_date" }
      - { name: json-columns, type: list, desc: "Columns that hold JSON", group: mapping }
      - { name: kinds, type: list, desc: "Comma list of kinds to serve", group: mapping }
      - { name: zone, desc: "Time zone of the date column", group: mapping }
      - { name: pool-size, type: int, default: "20", desc: "Connections at most (the site default `drishti.db.pool.size`); at least `scan-threads` plus the concurrent reads you expect. All the pool settings are read too", group: pool }
      - { name: pool-min-idle, type: int, default: "2", desc: "Idle connections kept when quiet (default: drishti.db.pool.min-idle)", group: pool }
      - { name: pool-idle-timeout, type: duration, default: "10m", desc: "An idle connection beyond pool-min-idle is closed after this long", group: pool }
      - { name: pool-max-lifetime, type: duration, default: "30m", desc: "A connection is replaced after this long", group: pool }
      - { name: pool-connection-timeout, type: duration, default: "10s", desc: "How long a caller waits for a free connection before failing", group: pool }
      - { name: pool-leak-threshold, type: duration, default: "60s", desc: "A connection borrowed (or a command in flight) longer than this is logged with the borrower's stack; 0 = off", group: pool }
      - { name: statement-timeout, type: duration, default: "5m", desc: "Longest one statement or operation may run; 0 = none", group: pool }
      - { name: refresh-seconds, type: int, desc: "How often the catalogue is read again", group: tuning, default: "60" }
      - { name: lookback-days, type: int, desc: "How far back a snapshot read looks for the newest day on or before the date asked", group: tuning, default: "10" }
      - { name: max-load-rows, type: int, desc: "The most documents a reverse lookup reads for a kind without promoted link columns", group: tuning, default: "200000" }
      - { name: scan-threads, type: int, desc: "Id ranges of a day read at once", group: tuning, default: "4" }
      - { name: columns-cache-mb, type: int, desc: "Memory for days of promoted columns", group: tuning, default: "1024" }
      - { name: columns-seconds, type: int, desc: "How long a day's columns are kept (a new load clears them at once)", group: tuning, default: "300" }
      - { name: reverse-index, type: boolean, desc: "Build the reverse index", group: tuning, default: "true" }
      - { name: "query.*", desc: "Custom SQL per purpose (query.trade, ...)", group: mapping }
      - { name: "ids.*", desc: "A day's ids (and optionally a title) for type-ahead: ids.<kind>, SQL with :asOf", group: mapping }
      - { name: "columns.*", desc: "A day's id and promoted fields, one row per entity: columns.<kind>, SQL with :asOf", group: mapping }
      - { name: "reverse.*", desc: "Ids of the kind's entities that reference :target: reverse.<kind>", group: mapping }
      - { name: "part-shape.*", desc: "part-shape.<kind>.<part>: object takes the first row of a part query as an object", group: mapping }
      - { name: index.days, type: int, default: "1", desc: "Business days of ids kept for type-ahead (1 = the newest day only)", group: tuning }
      - { name: index.max-memory, default: "600MB", desc: "Most memory the kept days may use; older days drop early above it (600MB, 2GB; 0 = no cap)", group: tuning }
      - { name: index.warm, type: "enum:background|lazy", default: "background", desc: "Build past days in the background after start, or on the first search for them", group: tuning }
      - { name: index.any-recent-day, type: boolean, default: "false", desc: "A bare id on the newest day also suggests ids seen only on earlier kept days (marked last seen)", group: tuning }
      - { name: index.storage, type: "enum:heap|mmap", default: "heap", desc: "heap: closed days stay in memory until max-memory, then move to memory-mapped files; mmap: closed days go to files at once", group: tuning }
      - { name: index.max-disk, default: "2GB", desc: "Most disk the connector's index segment files may use (under drishti.index.dir); the oldest days drop above it; 0 = no cap", group: tuning }
      - { name: index.reload-every, default: "10m", desc: "How often each past day is checked against its source and rebuilt when the source changed (a source with no version is rebuilt every cycle); 0 = never; the newest day has its own faster refresh", group: tuning }
      - { name: index.block-cache, type: int, default: "16", desc: "Decoded 128-id blocks each on-disk day keeps in memory (a lookup reads one or two blocks from the file); 0 = none", group: tuning }
      - { name: "index.kinds.*", desc: "Per-kind override of any index setting (index.kinds.<kind>.days)", group: tuning }
  duckdb:
    settings:
      - { name: "layout.*", desc: "Per-kind promoted columns: layout.<kind>.columns: a, b, c", group: mapping }
      - { name: path, required: true, desc: "The DuckDB file; connectors with the same path share one instance", type: path, group: connection }
      - { name: table, desc: "`schema.entities`, the data domain this connector serves", group: connection }
      - { name: kinds, type: list, desc: "Comma list of kinds to serve", group: mapping }
      - { name: memory-limit, desc: "DuckDB's memory limit for the shared instance (native memory, outside the heap); the first connector on a file sets it", group: tuning, default: "1GB" }
      - { name: threads, type: int, desc: "DuckDB's threads for the shared instance; the first connector on a file sets it", group: tuning }
      - { name: pool-size, type: int, desc: "Reads of this connector at once; at least `scan-threads` plus the concurrent reads you expect", group: tuning, default: "4" }
      - { name: refresh-seconds, type: int, desc: "How often the file is checked for a new load (one `stat` when nothing changed)", group: tuning, default: "10" }
      - { name: lookback-days, type: int, desc: "How far back a snapshot read looks for the newest day on or before the date asked", group: tuning, default: "10" }
      - { name: max-load-rows, type: int, desc: "The most documents a reverse lookup reads for a kind without promoted link columns", group: tuning, default: "200000" }
      - { name: scan-threads, type: int, desc: "Id ranges of a day read at once", group: tuning, default: "4" }
      - { name: columns-cache-mb, type: int, desc: "Memory for days of promoted columns", group: tuning, default: "1024" }
      - { name: columns-seconds, type: int, desc: "How long a day's columns are kept (a new file clears them at once)", group: tuning, default: "300" }
      - { name: reverse-index, type: boolean, desc: "Build the reverse index", group: tuning, default: "true" }
      - { name: index.days, type: int, default: "1", desc: "Business days of ids kept for type-ahead (1 = the newest day only)", group: tuning }
      - { name: index.max-memory, default: "600MB", desc: "Most memory the kept days may use; older days drop early above it (600MB, 2GB; 0 = no cap)", group: tuning }
      - { name: index.warm, type: "enum:background|lazy", default: "background", desc: "Build past days in the background after start, or on the first search for them", group: tuning }
      - { name: index.any-recent-day, type: boolean, default: "false", desc: "A bare id on the newest day also suggests ids seen only on earlier kept days (marked last seen)", group: tuning }
      - { name: index.storage, type: "enum:heap|mmap", default: "heap", desc: "heap: closed days stay in memory until max-memory, then move to memory-mapped files; mmap: closed days go to files at once", group: tuning }
      - { name: index.max-disk, default: "2GB", desc: "Most disk the connector's index segment files may use (under drishti.index.dir); the oldest days drop above it; 0 = no cap", group: tuning }
      - { name: index.reload-every, default: "10m", desc: "How often each past day is checked against its source and rebuilt when the source changed (a source with no version is rebuilt every cycle); 0 = never; the newest day has its own faster refresh", group: tuning }
      - { name: index.block-cache, type: int, default: "16", desc: "Decoded 128-id blocks each on-disk day keeps in memory (a lookup reads one or two blocks from the file); 0 = none", group: tuning }
      - { name: "index.kinds.*", desc: "Per-kind override of any index setting (index.kinds.<kind>.days)", group: tuning }
  delta:
    tls: true
    proxy: true
    settings:
      - { name: root, type: path, default: "<data dir>/delta", desc: "Lake root (folder, or s3://bucket/prefix); default: the delta folder of the data directory", group: connection }
      - { name: domain, desc: "The data-domain folder under the root; may not contain `..` or start with `/`", group: connection }
      - { name: kinds, type: list, desc: "Kinds to serve (comma list); not set: every table found under the domain", group: mapping }
      - { name: "mode.*", desc: "Per-kind read mode", group: mapping }
      - { name: "layout.*", desc: "Per-kind layout: layout.<kind>.columns (promoted document paths), layout.<kind>.type-ahead (promoted columns whose values the type-ahead also matches: a name finds its id)", group: mapping }
      - { name: "table.*", desc: "Per-kind table folder under the domain when it is not the kind's name (table.trade: trade_endur)", group: mapping }
      - { name: "hadoop.*", desc: "Any Hadoop configuration property (hadoop.fs.s3a.connection.maximum)", group: tuning }
      - { name: engine, default: "native", desc: "Reader engine: native (Delta Kernel without Hadoop; Windows), hadoop (also abfs://, gs://) or auto (native on Windows); not set: DRISHTI_DELTA_ENGINE, else native", group: tuning }
      - { name: date-column, default: "business_date", desc: "Business date column", group: mapping }
      - { name: id-column, default: "id", desc: "Entity id column", group: mapping }
      - { name: doc-column, default: "doc", desc: "Document column", group: mapping }
      - { name: warm-dates, type: int, default: "3", desc: "After start, in the background, each table's newest N dates get their id map and one document read, so the first read of a recent past date is not the slow one (cold about 5x a warm read: 40-70 ms against 10 ms on the samples, more on a large day); the warm-up reads take their own read slots, so a page never waits behind them; `0` turns it off", group: tuning }
      - { name: refresh-seconds, type: int, default: "10", desc: "How often each table's latest version is checked; the type-ahead index is rebuilt every six checks", group: tuning }
      - { name: lookback-days, type: int, default: "10", desc: "How far back (days) a snapshot read looks for the newest day on or before the date asked; effective tables have no limit", group: tuning }
      - { name: max-load-rows, type: int, default: "200000", desc: "The largest day loaded whole for reverse lookups when a table has no promoted columns", group: tuning }
      - { name: max-concurrent-reads, type: int, default: "16", desc: "Single-document reads at once (each decodes one row group of documents)", group: tuning }
      - { name: max-queued-reads, type: int, default: "4096", desc: "Document reads that may wait for a slot; more are refused at once, and a read whose caller has gone leaves the queue", group: tuning }
      - { name: cache-mb, type: int, desc: "Memory for whole days of small tables, in MB; not set: the shared cache of every Delta connector, 5 % of the heap; set: a cache of this connector's own", group: tuning }
      - { name: doc-cache-mb, type: int, desc: "Memory for recently read documents, in MB; not set: the shared cache, 5 % of the heap; set: a cache of this connector's own", group: tuning }
      - { name: doc-disk-cache.enabled, type: bool, default: "true", desc: "Documents already read also kept on disk (RocksDB, one per connector): answered without decompressing Parquet pages, also after a restart", group: tuning }
      - { name: doc-disk-cache.dir, type: path, default: "<data dir>/cache/<connector>/docs", desc: "Documents read before, in a RocksDB on disk, kept across restarts (DELTA_CONNECTOR.md section 6.3)", group: tuning }
      - { name: doc-disk-cache.max-gb, type: number, default: "1", desc: "Its size cap; the oldest files go first", group: tuning }
      - { name: doc-disk-cache.ttl, type: duration, default: "12h", desc: "Entries written longer ago go (compacted hourly)", group: tuning }
      - { name: doc-disk-cache.reset-at, default: "02:00", desc: "Daily clearing time", group: tuning }
      - { name: doc-disk-cache.zone, default: "America/New_York", desc: "Zone of the daily clearing", group: tuning }
      - { name: id-map-disk.enabled, type: bool, default: "true", desc: "Each table date id map written once per table version and memory-mapped: no heap per id, kept across restarts", group: tuning }
      - { name: id-map-disk.dir, type: path, default: "<data dir>/cache/<connector>/idmaps", desc: "Id maps written once per table version and date, read through a memory map (DELTA_CONNECTOR.md section 6.2)", group: tuning }
      - { name: id-map-disk.max-gb, type: number, default: "5", desc: "(2.9.7) The most disk the id map files take; the least recently used beyond it are unmapped, then deleted, never a map in use (mapped, read or written in the last five minutes, a date open in VaR or exposure); a map alone over it is kept and warned about (OPERATIONS.md section 12.3)", group: tuning }
      - { name: id-map-disk.ttl, type: duration, desc: "(2.9.7) Off when empty or 0; at least 24h. Drops a map not used (mapped or read) for that long, give or take 10%; never the latest and previous dates, today, a date open in VaR or exposure (OPERATIONS.md section 12.3)", group: tuning }
      - { name: id-map-disk.idle-release, type: duration, default: "30m", desc: "(2.9.7) A map not read for that long is unmapped (the file stays; the next read maps it again), never while a read is inside it nor for a date open in VaR or exposure: the cap then trims its file when the folder is over max-gb. At least 5m (OPERATIONS.md section 12.3)", group: tuning }
      - { name: columns-cache-mb, type: int, desc: "Memory for days' column sets, in MB; not set: the shared cache, 20 % of the heap; set: a cache of this connector's own", group: tuning }
      - { name: id-map-mb, type: int, desc: "Memory for days' id maps, in MB; not set: the shared cache, 20 % of the heap; set: a cache of this connector's own", group: tuning }
      - { name: lz4-via-native, type: boolean, default: "true", desc: "hadoop engine only: read LZ4 files through the native engine's decoder", group: tuning }
      - { name: lz4-decoder, type: "enum:safe|fast", default: "safe", desc: "native engine: the LZ4 page decoder, safe (pure Java) or fast (JNI when available)", group: tuning }
      - { name: s3.endpoint, desc: "An S3-compatible store (MinIO, Ceph); also sets path-style access and TLS by scheme", group: s3 }
      - { name: s3.region, desc: "S3 region", group: s3 }
      - { name: s3.path-style, type: boolean, desc: "Path-style S3 addressing; not set: the native engine uses it only with s3.endpoint, the hadoop engine always", group: s3, default: "true" }
      - { name: s3.access-key, secret: true, desc: "S3 access key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: s3.secret-key, secret: true, desc: "S3 secret key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: index.days, type: int, default: "1", desc: "Business days of ids kept for type-ahead (1 = the newest day only)", group: tuning }
      - { name: index.max-memory, default: "600MB", desc: "Most memory the kept days may use; older days drop early above it (600MB, 2GB; 0 = no cap)", group: tuning }
      - { name: index.warm, type: "enum:background|lazy", default: "background", desc: "Build past days in the background after start, or on the first search for them", group: tuning }
      - { name: index.any-recent-day, type: boolean, default: "false", desc: "A bare id on the newest day also suggests ids seen only on earlier kept days (marked last seen)", group: tuning }
      - { name: index.storage, type: "enum:heap|mmap", default: "heap", desc: "heap: closed days stay in memory until max-memory, then move to memory-mapped files; mmap: closed days go to files at once", group: tuning }
      - { name: index.max-disk, default: "2GB", desc: "Most disk the connector's index segment files may use (under drishti.index.dir); the oldest days drop above it; 0 = no cap", group: tuning }
      - { name: index.reload-every, default: "10m", desc: "How often each past day is checked against its source and rebuilt when the source changed (a source with no version is rebuilt every cycle); 0 = never; the newest day has its own faster refresh", group: tuning }
      - { name: index.block-cache, type: int, default: "16", desc: "Decoded 128-id blocks each on-disk day keeps in memory (a lookup reads one or two blocks from the file); 0 = none", group: tuning }
      - { name: "index.kinds.*", desc: "Per-kind override of any index setting (index.kinds.<kind>.days)", group: tuning }
  iceberg:
    tls: true
    proxy: true
    settings:
      - { name: "layout.*", desc: "Per-kind layout: layout.<kind>.columns (promoted document paths), layout.<kind>.vectors (list<double> columns such as a P&L vector, read in bulk and put back into documents)", group: mapping }
      - { name: doc-disk-cache.enabled, type: bool, default: "true", desc: "Documents already read also kept on disk (RocksDB, one per connector), keyed by the date's files: answered without reading a data file, also after a restart", group: tuning }
      - { name: doc-disk-cache.dir, type: path, default: "<data dir>/cache/<connector>/docs", desc: "Its folder", group: tuning }
      - { name: doc-disk-cache.max-gb, type: number, default: "1", desc: "Its size cap; the oldest files go first", group: tuning }
      - { name: doc-disk-cache.ttl, type: duration, default: "12h", desc: "Entries written longer ago go (compacted hourly)", group: tuning }
      - { name: doc-disk-cache.reset-at, default: "02:00", desc: "Daily clearing time", group: tuning }
      - { name: doc-disk-cache.zone, default: "America/New_York", desc: "Zone of the daily clearing", group: tuning }
      - { name: id-map-disk.enabled, type: bool, default: "true", desc: "Each business date's id map written once per date's files and memory-mapped: no heap per id, kept across restarts and commits of other dates", group: tuning }
      - { name: id-map-disk.dir, type: path, default: "<data dir>/cache/<connector>/idmaps", desc: "(2.9.5) each date's id map written once and memory-mapped, kept across restarts", group: tuning }
      - { name: id-map-disk.max-gb, type: number, default: "5", desc: "(2.9.7) The most disk the id map files take; the least recently used beyond it are unmapped, then deleted, never a map in use (mapped, read or written in the last five minutes, a date open in VaR or exposure); a map alone over it is kept and warned about (OPERATIONS.md section 12.3)", group: tuning }
      - { name: id-map-disk.ttl, type: duration, desc: "(2.9.7) Off when empty or 0; at least 24h. Drops a map not used (mapped or read) for that long, give or take 10%; never the latest and previous dates, today, a date open in VaR or exposure (OPERATIONS.md section 12.3)", group: tuning }
      - { name: id-map-disk.idle-release, type: duration, default: "30m", desc: "(2.9.7) A map not read for that long is unmapped (the file stays; the next read maps it again), never while a read is inside it nor for a date open in VaR or exposure: the cap then trims its file when the folder is over max-gb. At least 5m (OPERATIONS.md section 12.3)", group: tuning }
      - { name: id-map-mb, type: int, default: "1024", desc: "Id maps kept in the heap (MB)", group: tuning }
      - { name: doc-cache-mb, type: int, default: "256", desc: "Documents kept in the heap (MB)", group: tuning }
      - { name: columns-cache-mb, type: int, default: "1024", desc: "Promoted columns kept in the heap (MB)", group: tuning }
      - { name: cache-mb, type: int, default: "512", desc: "Whole small days kept for reverse lookups (MB)", group: tuning }
      - { name: source-name, desc: "The name the connector's documents carry as their source", group: mapping }
      - { name: "table.*", desc: "Per-kind table name under the namespace when it is not the kind's name (table.trade: trade_calypso)", group: mapping }
      - { name: engine, type: "enum:native|library|auto", default: "native", desc: "native: drishti-iceberg, no Hadoop (local disk and S3; Windows without winutils.exe; left to the default, a root it cannot reach is read by the library); library: Apache Iceberg Java over Hadoop (also Azure, Google Cloud Storage, HDFS); auto: native on Windows, library elsewhere. DRISHTI_ICEBERG_ENGINE sets it for every connector", group: connection }
      - { name: "metadata-location.*", desc: "A table named by its metadata file, read-only (metadata-location.<kind>: s3://…/v12.metadata.json); native engine", group: connection }
      - { name: relocate, desc: "`native`: `<old folder> -> <new folder>; …` reads a table copied elsewhere (an S3 table synced to a laptop, a folder moved after loading: Health gives the pair to copy, ICEBERG_CONNECTOR.md section 14). Each side is a plain folder (`/data/ice1`, `C:\\lake` or `C:/lake`, `\\\\fs\\share\\lake`) or a URI (`file:/data/ice1`, `file:///C:/lake`, `s3://bucket/wh`; `s3a://` and `s3n://` are the same bucket): both are read into the `file:` form the metadata names its files in, so the plain form and the `file:` form are the same pair. A folder matches whole folders (`/data/ice1` is not `/data/ice10`). Quote the value in YAML when it holds a backslash: `relocate: 'C:\\old -> D:\\new'`. A pair that cannot be read fails the start, naming it. The library engine does not read it, and Health says so", group: connection }
      - { name: vended-credentials, type: boolean, default: "true", desc: "`native`, `rest`: ask the catalog for each table's own S3 credentials (`X-Iceberg-Access-Delegation`), renewed before they expire", group: connection }
      - { name: lz4-decoder, type: "enum:safe|fast", default: "safe", desc: "The LZ4 page decoder of the native engine: safe (pure Java) or fast (JNI when present)", group: tuning }
      - { name: "hadoop.*", desc: "Any Hadoop configuration property (hadoop.fs.s3a.connection.maximum)", group: tuning }
      - { name: "catalog.*", desc: "Any Iceberg catalog property (catalog.<property>)", group: connection }
      - { name: warehouse, desc: "REST catalog warehouse", group: connection }
      - { name: credential, secret: true, desc: "REST catalog credential: ${ENV_VAR} or file:/path", group: connection }
      - { name: root, type: path, desc: "`hadoop`: the lake, a folder or `s3a://…` (`abfs://`, `gs://`, `hdfs://`)", group: connection }
      - { name: uri, desc: "`rest`: the catalog's URI", group: connection }
      - { name: catalog, desc: "`hadoop` (path-based tables) or `rest`", group: connection, default: "hadoop" }
      - { name: namespace, desc: "`rest`: the namespace (dots separate levels)", group: connection }
      - { name: domain, desc: "Domain", group: connection }
      - { name: kinds, type: list, desc: "Comma list of kinds to serve", group: mapping }
      - { name: "mode.*", desc: "Per-kind read mode", group: mapping }
      - { name: refresh-seconds, type: int, desc: "How often each table's current snapshot is checked", group: tuning, default: "10" }
      - { name: lookback-days, type: int, desc: "How far back a snapshot read looks for the newest day on or before the date asked", group: tuning, default: "10" }
      - { name: max-load-rows, type: int, desc: "The largest day read whole for reverse lookups when a table has no promoted columns", group: tuning, default: "200000" }
      - { name: max-concurrent-reads, type: int, desc: "Single-document reads at once", group: tuning, default: "16" }
      - { name: max-queued-reads, type: int, default: "4096", desc: "Document reads that may wait for a slot; more are refused at once, and a read whose caller has gone leaves the queue", group: tuning }
      - { name: layout-cache, type: int, desc: "Layout cache entries", group: tuning, default: "64" }
      - { name: reverse-index, type: boolean, desc: "Build the reverse index", group: tuning, default: "true" }
      - { name: s3.endpoint, desc: "Object storage for S3A and S3FileIO (`s3.path-style` defaults to `true` with an endpoint)", group: s3 }
