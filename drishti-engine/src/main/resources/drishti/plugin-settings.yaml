      - { name: state.zone, default: America/New_York, desc: "Time zone of state.reset-at", group: state }
      - { name: state.durability, type: "enum:none|wal|sync", default: sync, desc: "How a received message is made safe on disk: sync survives a power loss, wal a crash, none neither", group: state }
      - { name: state.when-full, type: "enum:evict-oldest|warn", default: evict-oldest, desc: "At the size budget: drop the oldest entries, or only warn", group: state }
      - { name: state.check-seconds, type: int, default: "60", desc: "How often the budget is checked", group: state }
      - { name: declare, type: boolean, desc: "Declare queues at start", group: connection }
      - { name: prefetch, type: int, desc: "Prefetch", group: tuning }
      - { name: heartbeat-seconds, type: int, desc: "Heartbeat", group: tuning }
      - { name: recovery-interval-ms, type: int, desc: "Recovery interval", group: tuning }
