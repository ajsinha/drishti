      - { name: deny-sources, type: list, desc: "Comma list: never these publishers", group: mapping }
      - { name: "aliases.*", desc: "Other names of an entity: aliases.<Name_with_underscores>: a, b", group: mapping }
      - { name: max-items, type: int, desc: "Headlines per entity (1 to 100)", group: tuning, default: "10" }
      - { name: timeout-seconds, type: int, desc: "One HTTP attempt (1 to 120)", group: tuning, default: "10" }
      - { name: cache-ttl-seconds, type: int, desc: "How long an entity's headlines are reused; `0` never reuses", group: tuning, default: "600" }
      - { name: cache-max-entities, type: int, desc: "Entities cached", group: tuning, default: "200" }
      - { name: max-bytes, type: int, desc: "Largest response accepted", group: tuning, default: "2000000" }
      - { name: retries, type: int, desc: "Repeats of a failed request", group: tuning, default: "2" }
      - { name: retry-initial, desc: "First wait before a repeat (300ms)", group: tuning, default: "300ms" }
      - { name: retry-max, desc: "Longest wait (3s)", group: tuning, default: "3s" }
      - { name: retry-factor, desc: "Growth of the wait (2)", group: tuning, default: "2" }
      - { name: retry-jitter, desc: "Random spread of each wait, so many failing reads do not repeat together", group: tuning, default: "0.2" }
  yfinance:
    tls: true
    proxy: true
    settings:
      - { name: base-url, desc: "Chart endpoint without the symbol", group: connection, default: "https://query1.finance.yahoo.com/v8/finance/chart" }
      - { name: user-agent, desc: "The `User-Agent` header; Yahoo refuses an empty one", group: connection }
      - { name: range, desc: "History span: 1mo, 3mo, 6mo, 1y, 5y, ytd, max ...", group: mapping, default: "6mo" }
      - { name: interval, desc: "Bar size: `1m 2m 5m 15m 30m 60m 90m 1h 1d 5d 1wk 1mo 3mo` (Yahoo limits intraday bars to short ranges)", group: mapping, default: "1d" }
      - { name: id-prefix, desc: "Prefix of entity ids (QUOTE-)", group: mapping, default: "QUOTE-" }
      - { name: benchmark, desc: "Symbol the price-history analytics compute beta against (SPY)", group: mapping }
      - { name: kind, desc: "Kind served (quote)", group: mapping, default: "quote" }
      - { name: timeout-seconds, type: int, desc: "One HTTP attempt (1 to 120)", group: tuning, default: "10" }
      - { name: cache-ttl-seconds, type: int, desc: "How long a symbol's answer is reused; `0` never reuses", group: tuning, default: "60" }
      - { name: cache-max-symbols, type: int, desc: "Symbols cached (least recently used leave first)", group: tuning, default: "100" }
      - { name: max-bytes, type: int, desc: "Largest response accepted", group: tuning, default: "2000000" }
      - { name: retries, type: int, desc: "Repeats of a failed request", group: tuning, default: "2" }
      - { name: retry-initial, desc: "First wait before a repeat (400ms)", group: tuning, default: "400ms" }
      - { name: retry-max, desc: "Longest wait (4s)", group: tuning, default: "4s" }
      - { name: retry-factor, desc: "Growth of the wait (2)", group: tuning, default: "2" }
      - { name: retry-jitter, desc: "Random spread of the wait (0.2)", group: tuning, default: "0.2" }
  rest:
    tls: true
    proxy: true
    settings:
      - { name: base-url, required: true, desc: "The service root; trailing `/` are removed. Empty: the connector fails to start", group: connection }
      - { name: path, desc: "Appended to `base-url`; `{kind}` and `{id}` are replaced by the URL-encoded kind and id", group: connection, default: "/{kind}/{id}" }
      - { name: kinds, type: list, desc: "Comma list of kinds served; a connector's own `kinds:` list takes precedence", group: mapping }
      - { name: generation-header, desc: "Response header holding a numeric version (quotes removed); otherwise the fetch time in milliseconds", group: mapping, default: "ETag" }
      - { name: timeout-ms, type: int, desc: "Connect timeout and request timeout, in milliseconds", group: tuning, default: "2000" }
      - { name: "header.*", desc: "A request header: header.<Name> (header.Authorization: Bearer ${SERVICE_TOKEN})", group: connection }
  s3:
    tls: true
    proxy: true
    settings:
      - { name: bucket, required: true, desc: "Bucket", group: connection }
      - { name: prefix, desc: "Key prefix", group: connection }
      - { name: endpoint, desc: "S3-compatible endpoint", group: connection }
      - { name: region, desc: "Region", group: connection }
      - { name: path-style, type: boolean, default: "true", desc: "Path-style addressing (with an endpoint; AWS itself: virtual-hosted)", group: connection }
      - { name: access-key, secret: true, desc: "Access key: ${ENV_VAR} or file:/path", group: connection }
      - { name: secret-key, secret: true, desc: "Secret key: ${ENV_VAR} or file:/path", group: connection }
      - { name: rescan-seconds, type: int, desc: "Rescan interval", group: tuning }
      - { name: lookback-days, type: int, desc: "Days of history to index", group: tuning }
      - { name: cache-entries, type: int, desc: "Cache entries", group: tuning }
      - { name: cache-seconds, type: int, desc: "Cache lifetime", group: tuning }
      - { name: index.days, type: int, default: "1", desc: "Business days of ids kept for type-ahead (1 = the newest day only)", group: tuning }
      - { name: index.max-memory, default: "600MB", desc: "Most memory the kept days may use; older days drop early above it (600MB, 2GB; 0 = no cap)", group: tuning }
      - { name: index.warm, type: "enum:background|lazy", default: "background", desc: "Build past days in the background after start, or on the first search for them", group: tuning }
      - { name: index.any-recent-day, type: boolean, default: "false", desc: "A bare id on the newest day also suggests ids seen only on earlier kept days (marked last seen)", group: tuning }
      - { name: index.storage, type: "enum:heap|mmap", default: "heap", desc: "heap: closed days stay in memory until max-memory, then move to memory-mapped files; mmap: closed days go to files at once", group: tuning }
      - { name: index.max-disk, default: "2GB", desc: "Most disk the connector's index segment files may use (under drishti.index.dir); the oldest days drop above it; 0 = no cap", group: tuning }
      - { name: index.reload-every, default: "10m", desc: "How often each past day is checked against its source and rebuilt when the source changed (a source with no version is rebuilt every cycle); 0 = never; the newest day has its own faster refresh", group: tuning }
      - { name: index.block-cache, type: int, default: "16", desc: "Decoded 128-id blocks each on-disk day keeps in memory (a lookup reads one or two blocks from the file); 0 = none", group: tuning }
      - { name: "index.kinds.*", desc: "Per-kind override of any index setting (index.kinds.<kind>.days)", group: tuning }
  kafka:
    tls: true
    proxy: true
    settings:
      - { name: bootstrap-servers, default: "localhost:9092", desc: "Broker list host:port,...", group: connection }
      - { name: topics, type: list, required: true, desc: "Comma list; without it the plugin stays idle (`PluginNotConfigured`)", group: connection }
      - { name: kind, desc: "Mapped messages on every topic: their kind", group: mapping }
      - { name: id-field, default: id, desc: "Mapped messages without a key: the id field, every topic", group: mapping }
      - { name: "kind.*", desc: "Kind per topic: kind.<topic>", group: mapping }
      - { name: "id-field.*", desc: "Id field per kind: id-field.<kind>", group: mapping }
      - { name: mode, type: "enum:state|ticks", default: state, desc: "`state` (index, caches, reads) or `ticks` (no reads; pushes to views of its kinds)", group: mapping }
      - { name: search, type: boolean, desc: "Keep ids for type-ahead (state mode only)", group: mapping, default: "true" }
      - { name: poll-ms, type: int, desc: "Poll interval", group: tuning, default: "200" }
      - { name: cache-mb, type: int, desc: "Memory cache, weighed by message length", group: tuning, default: "256" }
      - { name: "disk-cache.*", desc: "On-disk cache (enabled, dir, max-gb, ...)", group: tuning }
      - { name: "client.*", desc: "Any Kafka client property (client.max.poll.records); applied last, wins over everything above. Fetches default to `fetch.max.bytes` 4 MB and `max.partition.fetch.bytes` 1 MB (Kafka's own default is 50 MB; each poll thread reads a fetch through a temporary direct buffer): `client.fetch.max.bytes` and `client.max.partition.fetch.bytes` raise them", group: tuning }
      - { name: value-format, type: "enum:string|confluent", desc: "string (default), or confluent to read the Confluent wire format (implied by schema-registry.url)", group: mapping }
      - { name: flavour, type: "enum:apache|confluent", default: apache, desc: "confluent: Confluent Cloud defaults (SASL PLAIN with api-key and api-secret, DNS lookup of all addresses)", group: security }
      - { name: security.protocol, type: "enum:PLAINTEXT|SSL|SASL_PLAINTEXT|SASL_SSL", desc: "`PLAINTEXT`, `SSL`, `SASL_PLAINTEXT` or `SASL_SSL`. Absent: `SASL_SSL` if `sasl.mechanism` is set and TLS is wanted (`tls.enabled: true`), `SASL_PLAINTEXT` with a mechanism and no TLS, `SSL` with `tls.enabled`, else `PLAINTEXT`. Always write it down in production.", group: security }
      - { name: sasl.mechanism, type: "enum:PLAIN|SCRAM-SHA-256|SCRAM-SHA-512|OAUTHBEARER|GSSAPI", desc: "`PLAIN`, `SCRAM-SHA-256`, `SCRAM-SHA-512`, `OAUTHBEARER` or `GSSAPI`.", group: security }
      - { name: sasl.username, desc: "PLAIN and SCRAM. Confluent Cloud calls them `api-key` and `api-secret`, accepted as aliases.", group: security }
      - { name: sasl.password, secret: true, desc: "PLAIN and SCRAM. Confluent Cloud calls them `api-key` and `api-secret`, accepted as aliases.", group: security }
      - { name: sasl.password-file, type: path, desc: "PLAIN and SCRAM. Confluent Cloud calls them `api-key` and `api-secret`, accepted as aliases.", group: security }
      - { name: api-key, desc: "Confluent Cloud API key (same as sasl.username)", group: security }
      - { name: api-secret, secret: true, desc: "Confluent Cloud API secret (same as sasl.password): ${ENV} placeholder or api-secret-file", group: security }
      - { name: api-secret-file, type: path, desc: "File whose first line is the Confluent Cloud API secret", group: security }
      - { name: sasl.oauth.token-endpoint, desc: "OAUTHBEARER: the identity provider's token URL.", group: security }
      - { name: sasl.oauth.client-id, desc: "OAUTHBEARER: the client-credentials pair.", group: security }
      - { name: sasl.oauth.client-secret, secret: true, desc: "OAUTHBEARER client secret: ${ENV} placeholder or sasl.oauth.client-secret-file", group: security }
      - { name: sasl.oauth.client-secret-file, type: path, desc: "File whose first line is the OAUTHBEARER client secret", group: security }
      - { name: sasl.oauth.scope, desc: "OAUTHBEARER: the scope to request.", group: security }
      - { name: sasl.kerberos.principal, desc: "GSSAPI: e.g. `drishti@BANK.EXAMPLE`.", group: security }
      - { name: sasl.kerberos.keytab, type: path, desc: "GSSAPI keytab file", group: security }
      - { name: sasl.kerberos.service-name, default: kafka, desc: "GSSAPI broker service name", group: security }
      - { name: sasl.kerberos.use-ticket-cache, type: boolean, default: "false", desc: "GSSAPI: use the ticket cache instead of a keytab", group: security }
      - { name: sasl.kerberos.krb5-conf, type: path, desc: "GSSAPI: path of `krb5.conf` (sets `java.security.krb5.conf` if the JVM has none yet).", group: security }
      - { name: schema-registry.url, desc: "Confluent Schema Registry URL (http:// or https://); reads Avro, Protobuf and JSON Schema payloads", group: schema-registry }
      - { name: schema-registry.basic-auth, secret: true, desc: "KEY:SECRET for the registry: ${SR_KEY}:${SR_SECRET}, or schema-registry.basic-auth-file", group: schema-registry }
      - { name: schema-registry.basic-auth-file, type: path, desc: "File whose first line is KEY:SECRET", group: schema-registry }
      - { name: schema-registry.bearer-token, secret: true, desc: "Bearer token for the registry (not with basic-auth): ${ENV} placeholder or schema-registry.bearer-token-file", group: schema-registry }
      - { name: schema-registry.bearer-token-file, type: path, desc: "File whose first line is the bearer token", group: schema-registry }
      - { name: schema-registry.timeout-ms, type: int, default: "10000", desc: "Connect and read timeout for a registry call.", group: schema-registry }
    tls-prefixes: ["schema-registry.tls."]
  activemq:
    tls: true
    settings:
      - { name: broker-url, default: "failover:(tcp://localhost:61616)?initialReconnectDelay=1000&maxReconnectDelay=30000", desc: "OpenWire URL; `failover:(…)` reconnects by itself; `ssl://` endpoints use TLS (ACTIVEMQ_CONNECTOR.md section 14.2)", group: connection }
      - { name: destinations, type: list, required: true, desc: "Comma list: `queue:<name>`, `topic:<name>`, or `<name>` (a queue)", group: connection }
      - { name: user, desc: "User", group: connection }
      - { name: password, secret: true, desc: "Password: ${ENV_VAR} or file:/path", group: connection }
      - { name: client-id, desc: "JMS client id; durable subscriptions are named `drishti-<source-name>-<topic>`", group: connection, default: "drishti-<source-name>" }
      - { name: kind, desc: "Kind of the messages (kind.<queue> sets it per queue or topic)", group: mapping }
      - { name: id-field, default: id, desc: "The body's id field, every destination", group: mapping }
      - { name: "kind.*", desc: "Kind per destination: kind.<destination>", group: mapping }
      - { name: "id-field.*", desc: "Id field per kind: id-field.<kind>", group: mapping }
      - { name: cache-mb, type: int, default: "128", desc: "Entities kept in memory", group: tuning }
      - { name: state.dir, type: path, desc: "Folder of the received-state store; default: <state.root>/<connector name>", group: state, default: "<state.root>/<source-name>" }
      - { name: state.root, type: path, default: "<data dir>/state", desc: "Parent of the per-connector state folder", group: state }
      - { name: state.max-gb, default: "10", desc: "This connector's disk budget (decimal allowed); what happens past it is `state.when-full` (ACTIVEMQ_CONNECTOR.md section 7.3)", group: state }
      - { name: state.reset-at, default: never, desc: "Clock time (HH:mm) to clear the state store each day, or never", group: state }
      - { name: state.zone, default: America/New_York, desc: "Time zone of state.reset-at", group: state }
      - { name: state.durability, type: "enum:none|wal|sync", default: sync, desc: "`sync` (write-ahead log synced on every write: no acknowledged message lost on a crash or a power loss), `wal` (not synced: survives a crash of the process, a power loss can lose the last moments), `none` (no log: a crash can lose up to the 32 MB write buffer) (ACTIVEMQ_CONNECTOR.md section 7.1)", group: state }
      - { name: state.when-full, type: "enum:evict-oldest|warn", default: evict-oldest, desc: "`evict-oldest`: past the budget, remove the entities written longest ago until under 90% of it, then compact (logged, counted in `evicted`); `warn`: remove nothing, say so in health", group: state }
      - { name: state.check-seconds, type: int, default: "60", desc: "How often the store's size is checked against the budget", group: state }
      - { name: max-redeliveries, type: int, desc: "Redeliveries of a message the state store could not keep before the broker dead-letters it; `-1`: without limit", group: tuning, default: "-1" }
  rabbitmq:
    tls: true
    settings:
      - { name: uri, default: "amqp://guest:guest@localhost:5672/%2f", desc: "AMQP URI with user, password, host, port and vhost; `amqps://` for TLS (port 5671 by default)", group: connection }
      - { name: auth-mechanism, type: "enum:plain|external", default: plain, desc: "external logs in with the client certificate (needs amqps:// and tls.cert-file or tls.keystore)", group: security }
      - { name: queues, type: list, required: true, desc: "Comma list of queues to consume; empty means the connector connects and consumes nothing", group: connection }
      - { name: "bind.*", desc: "Queue bindings", group: connection }
      - { name: kind, desc: "Kind of the messages (kind.<queue> sets it per queue or topic)", group: mapping }
      - { name: id-field, default: id, desc: "The body's id field, for every queue with a kind", group: mapping }
      - { name: "kind.*", desc: "Kind per queue: kind.<queue>", group: mapping }
      - { name: "id-field.*", desc: "Id field per kind: id-field.<kind>", group: mapping }
      - { name: cache-mb, type: int, default: "128", desc: "Entities kept in memory", group: tuning }
      - { name: state.dir, type: path, desc: "Folder of the received-state store; default: <state.root>/<connector name>", group: state, default: "<state.root>/<source-name>" }
      - { name: state.root, type: path, default: "<data dir>/state", desc: "Parent of the per-connector state folder", group: state }
      - { name: state.max-gb, default: "10", desc: "This connector's disk budget (decimal values accepted); what happens past it is `state.when-full`", group: state }
      - { name: state.reset-at, default: never, desc: "Clock time (HH:mm) to clear the state store each day, or never", group: state }
      - { name: state.zone, default: America/New_York, desc: "Time zone of state.reset-at", group: state }
      - { name: state.durability, type: "enum:none|wal|sync", default: sync, desc: "`sync` (write-ahead log synced on every write: no acknowledged message lost on a crash or a power loss), `wal` (not synced: survives a crash of the process, a power loss can lose the last moments), `none` (no log: a crash can lose up to the 32 MB memtable) (RABBITMQ_CONNECTOR.md section 6.1)", group: state }
      - { name: state.when-full, type: "enum:evict-oldest|warn", default: evict-oldest, desc: "`evict-oldest`: past the budget, remove the entities written longest ago until under 90% of it, then compact (logged, counted in `evicted`); `warn`: remove nothing, say so in health (RABBITMQ_CONNECTOR.md section 6.3)", group: state }
      - { name: state.check-seconds, type: int, default: "60", desc: "How often the store's size is checked against the budget", group: state }
      - { name: declare, type: boolean, desc: "Declare each queue durable (no arguments) and bind it; `false` uses existing queues and ignores `bind.*`", group: connection, default: "true" }
      - { name: prefetch, type: int, desc: "Unacknowledged messages in flight per consumer (`basicQos`)", group: tuning, default: "100" }
      - { name: heartbeat-seconds, type: int, desc: "The requested AMQP heartbeat", group: tuning, default: "20" }
      - { name: recovery-interval-ms, type: int, desc: "The automatic recovery's wait between reconnection attempts", group: tuning, default: "2000" }
