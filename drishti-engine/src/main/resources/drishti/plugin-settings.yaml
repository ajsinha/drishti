# The settings of the shipped source plugins, for the connector form and validator (Admin -> Connectors).
# A plugin that overrides SourcePlugin#settingSpecs() wins over its entry here. Fields: name (a trailing .* covers a
# subtree), type (string|int|boolean|duration|path|list|enum:a|b), required, default, desc, secret, group.
# A plugin with `tls: true` also offers the shared tls.* section.
common:
  - { name: source-name, desc: "The name documents carry as their provenance (default: the connector's name)", group: general }
  - { name: "mode.*", desc: "Per-kind read mode (mode.<kind>)", group: mapping }
  - { name: domain, desc: "The data domain (folder, schema or key prefix) the connector reads", group: connection }
  - { name: stale-after, type: duration, desc: "Mark the source stale when it has received nothing for this long (15m, 2h, 1d)", group: general }
tls:
  - { name: tls.enabled, type: boolean, default: "false", desc: "Use TLS for this connector", group: tls }
  - { name: tls.truststore.path, type: path, desc: "Truststore holding the CA certificates to trust (JKS or PKCS12)", group: tls }
  - { name: tls.truststore.password, secret: true, desc: "Truststore password: ${ENV_VAR} or file:/path", group: tls }
  - { name: tls.truststore.type, type: "enum:PKCS12|JKS|PEM", default: PKCS12, desc: "Truststore format", group: tls }
  - { name: tls.keystore.path, type: path, desc: "Client keystore for mutual TLS", group: tls }
  - { name: tls.keystore.password, secret: true, desc: "Keystore password: ${ENV_VAR} or file:/path", group: tls }
  - { name: tls.keystore.type, type: "enum:PKCS12|JKS|PEM", default: PKCS12, desc: "Keystore format", group: tls }
  - { name: tls.verify-hostname, type: boolean, default: "true", desc: "Check the server certificate names the host", group: tls }
plugins:
  jdbc:
    tls: true
    settings:
      - { name: url, required: true, desc: "JDBC URL, e.g. jdbc:postgresql://host:5432/db", group: connection }
      - { name: user, desc: "Database user", group: connection }
      - { name: password, secret: true, desc: "Database password: ${ENV_VAR} or file:/path", group: connection }
      - { name: table, desc: "Table holding the entities", group: connection }
      - { name: kind-column, desc: "Column holding the kind", group: mapping }
      - { name: id-column, desc: "Column holding the entity id", group: mapping }
      - { name: doc-column, desc: "Column holding the JSON document", group: mapping }
      - { name: date-column, desc: "Column holding the business date", group: mapping }
      - { name: json-columns, type: list, desc: "Columns that hold JSON", group: mapping }
      - { name: kinds, type: list, desc: "Kinds to read", group: mapping }
      - { name: zone, desc: "Time zone of the date column", group: mapping }
      - { name: pool-size, type: int, default: "4", desc: "Connections in the pool", group: tuning }
      - { name: refresh-seconds, type: int, desc: "Re-read interval", group: tuning }
      - { name: lookback-days, type: int, desc: "Days of history to index", group: tuning }
      - { name: max-load-rows, type: int, desc: "Rows to load at most", group: tuning }
      - { name: scan-threads, type: int, desc: "Threads for scans", group: tuning }
      - { name: columns-cache-mb, type: int, desc: "Column cache size", group: tuning }
      - { name: columns-seconds, type: int, desc: "Column cache lifetime", group: tuning }
      - { name: reverse-index, type: boolean, desc: "Build the reverse index", group: tuning }
      - { name: "query.*", desc: "Custom SQL per purpose (query.trade, ...)", group: mapping }
  duckdb:
    settings:
      - { name: path, required: true, desc: "DuckDB database file", type: path, group: connection }
      - { name: table, desc: "Table holding the entities", group: connection }
      - { name: kinds, type: list, desc: "Kinds to read", group: mapping }
      - { name: memory-limit, desc: "DuckDB memory limit (e.g. 2GB)", group: tuning }
      - { name: threads, type: int, desc: "DuckDB threads", group: tuning }
      - { name: pool-size, type: int, desc: "Connections in the pool", group: tuning }
      - { name: refresh-seconds, type: int, desc: "Re-read interval", group: tuning }
      - { name: lookback-days, type: int, desc: "Days of history to index", group: tuning }
      - { name: max-load-rows, type: int, desc: "Rows to load at most", group: tuning }
      - { name: scan-threads, type: int, desc: "Threads for scans", group: tuning }
      - { name: columns-cache-mb, type: int, desc: "Column cache size", group: tuning }
      - { name: columns-seconds, type: int, desc: "Column cache lifetime", group: tuning }
      - { name: reverse-index, type: boolean, desc: "Build the reverse index", group: tuning }
