      - { name: s3.endpoint, desc: "S3-compatible endpoint", group: s3 }
      - { name: s3.region, desc: "S3 region", group: s3 }
      - { name: s3.path-style, type: boolean, desc: "Path-style S3 addressing", group: s3 }
      - { name: s3.access-key, secret: true, desc: "S3 access key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: s3.secret-key, secret: true, desc: "S3 secret key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: index.days, type: int, default: "1", desc: "Business days of ids kept for type-ahead (1 = the newest day only)", group: tuning }
      - { name: index.max-memory, default: "600MB", desc: "Most memory the kept days may use; older days drop early above it (600MB, 2GB; 0 = no cap)", group: tuning }
      - { name: index.warm, type: "enum:background|lazy", default: "background", desc: "Build past days in the background after start, or on the first search for them", group: tuning }
      - { name: index.any-recent-day, type: boolean, default: "false", desc: "A bare id on the newest day also suggests ids seen only on earlier kept days (marked last seen)", group: tuning }
      - { name: index.storage, type: "enum:heap|mmap", default: "heap", desc: "heap: closed days stay in memory until max-memory, then move to memory-mapped files; mmap: closed days go to files at once", group: tuning }
      - { name: index.max-disk, default: "2GB", desc: "Most disk the connector's index segment files may use (under drishti.index.dir); the oldest days drop above it; 0 = no cap", group: tuning }
      - { name: index.reload-every, default: "10m", desc: "How often each past day is checked against its source and rebuilt when the source changed (a source with no version is rebuilt every cycle); 0 = never; the newest day has its own faster refresh", group: tuning }
      - { name: index.block-cache, type: int, default: "16", desc: "Decoded 128-id blocks each on-disk day keeps in memory (a lookup reads one or two blocks from the file); 0 = none", group: tuning }
      - { name: "index.kinds.*", desc: "Per-kind override of any index setting (index.kinds.<kind>.days)", group: tuning }
  iceberg-external:
    tls: true
    proxy: true
    settings:
      - { name: "tables.*", desc: "Per kind: tables.<kind>.table (namespace.table), id (columns, joined by id-separator), id-separator (:), date, date-from (day), date-zone (UTC), mode (snapshot|effective), document (row|column:<name>), columns.exclude, columns.rename.<column>, links.<column> (a kind), depth (2); or tables: auto with namespace", group: mapping }
      - { name: tables, desc: "auto: every table of the namespace is a kind (its name in lower case with -), its id from the identifier fields, its date from the partition spec", group: mapping }
      - { name: engine, type: "enum:native|auto", default: "auto", desc: "The engine: drishti-iceberg (no Hadoop); library is the iceberg connector's only", group: connection }
      - { name: root, type: path, desc: "Path-based tables' root (a folder or s3://…); tables.<kind>.table names the folder under it", group: connection }
      - { name: uri, desc: "A REST catalog's URI (Polaris, Snowflake Open Catalog, Glue, Unity, Nessie, Lakekeeper)", group: connection }
      - { name: catalog, desc: "hadoop (path-based, the default) or rest", group: connection }
      - { name: warehouse, desc: "REST catalog warehouse", group: connection }
      - { name: credential, secret: true, desc: "REST catalog OAuth2 client credentials (id:secret): ${ENV_VAR} or file:/path", group: connection }
      - { name: token, secret: true, desc: "A fixed REST catalog bearer token: ${ENV_VAR} or file:/path", group: connection }
      - { name: scope, desc: "The OAuth2 scope (catalog)", group: connection }
      - { name: oauth2-server-uri, desc: "Where OAuth2 tokens come from (default: the catalog's /v1/oauth/tokens)", group: connection }
      - { name: prefix, desc: "The REST catalog's path prefix (default: what /v1/config says)", group: connection }
      - { name: namespace, desc: "The namespace of tables: auto (dots separate levels)", group: connection }
      - { name: "catalog.*", desc: "Iceberg catalog properties (catalog.rest.sigv4-enabled, catalog.rest.signing-region, catalog.rest.signing-name)", group: connection }
      - { name: "metadata-location.*", desc: "A table named by its metadata file, read as kind <kind> (metadata-location.<kind>)", group: connection }
      - { name: relocate, desc: "Read tables copied elsewhere: '<old prefix> -> <new prefix>; …'", group: connection }
      - { name: vended-credentials, type: boolean, default: "true", desc: "Ask a REST catalog for each table's own S3 credentials", group: connection }
      - { name: decimals, type: "enum:number|string", default: "number", desc: "Decimals in documents as JSON numbers, or as text keeping full precision", group: mapping }
      - { name: binary, type: "enum:base64|omit", default: "base64", desc: "Fixed and binary columns in documents as Base64 text, or left out", group: mapping }
      - { name: id-index-mb, type: int, default: "1024", desc: "Memory for the id indexes of tables not sorted by their id (about 60 B per id; least-used days dropped first)", group: tuning }
      - { name: id-index-warn-rows, type: int, default: "5000000", desc: "Health suggests sorting a table by its id when one day's id index passes this", group: tuning }
      - { name: max-index-rows, type: int, default: "10000000", desc: "Most rows type-ahead and column reads take from one day (or a table with no date); partial beyond it", group: tuning }
      - { name: refresh-seconds, type: int, default: "10", desc: "How often each table's current snapshot is checked", group: tuning }
      - { name: lookback-days, type: int, default: "10", desc: "How far back a snapshot kind looks for the newest date on or before the one asked", group: tuning }
      - { name: doc-cache-mb, type: int, default: "256", desc: "Memory for recently read documents", group: tuning }
      - { name: columns-cache-mb, type: int, default: "1024", desc: "Memory for a day's searchable columns", group: tuning }
      - { name: max-concurrent-reads, type: int, default: "16", desc: "Documents read at once at most", group: tuning }
      - { name: source-name, desc: "The connector's name in provenance (iceberg-external)", group: connection }
      - { name: s3.endpoint, desc: "S3-compatible endpoint", group: s3 }
      - { name: s3.region, desc: "S3 region", group: s3 }
      - { name: s3.path-style, type: boolean, desc: "Path-style S3 addressing", group: s3 }
      - { name: s3.access-key, secret: true, desc: "S3 access key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: s3.secret-key, secret: true, desc: "S3 secret key: ${ENV_VAR} or file:/path", group: s3 }
      - { name: s3.read-block-kb, type: int, default: "1024", desc: "The smallest ranged GET", group: s3 }
  aerospike:
    tls: true
    settings:
      - { name: "layout.*", desc: "Per-kind promoted columns: layout.<kind>.columns: a, b, c", group: mapping }
      - { name: hosts, default: "localhost:3000", desc: "host:port list, comma separated", group: connection }
      - { name: namespace, default: test, desc: "Namespace", group: connection }
      - { name: set, desc: "Set", group: connection }
      - { name: domain, desc: "Domain", group: connection }
      - { name: kinds, type: list, desc: "Kinds to read", group: mapping }
      - { name: user, desc: "User (leave out with auth-mode: pki)", group: connection }
      - { name: password, secret: true, desc: "Password: ${ENV_VAR} or file:/path", group: connection }
      - { name: auth-mode, type: "enum:internal|external|pki", desc: "pki logs in with the client certificate (tls.cert-file + tls.key-file, or tls.keystore)", group: security }
      - { name: tls-name, desc: "The name the server certificate carries (the server's tls-name); default: each host's own name", group: security }
      - { name: pool-size, type: int, default: "20", desc: "Connections to each node at most (default: drishti.db.pool.size)", group: pool }
      - { name: pool-min-idle, type: int, default: "2", desc: "Idle connections kept when quiet (default: drishti.db.pool.min-idle)", group: pool }
      - { name: pool-idle-timeout, type: duration, default: "10m", desc: "An idle connection beyond pool-min-idle is closed after this long", group: pool }
      - { name: pool-leak-threshold, type: duration, default: "60s", desc: "A connection borrowed (or a command in flight) longer than this is logged with the borrower's stack; 0 = off", group: pool }
      - { name: statement-timeout, type: duration, default: "5m", desc: "Longest one statement or operation may run; 0 = none", group: pool }
