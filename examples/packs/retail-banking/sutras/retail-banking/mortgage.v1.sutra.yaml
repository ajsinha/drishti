rachana: 1.2
sutra: mortgage
version: 1
description: "A residential mortgage: balance, rate, loan-to-value, amortisation and arrears."
doc:
  summary: "A residential mortgage: balance, rate, loan-to-value, amortisation and arrears."
  description: >-
    A residential mortgage: balance, rate, loan-to-value, amortisation and arrears. One page per mortgage, its panels: scheduled
    balance; property; last payments; how the view was built; the entities it links to. The strip gives Borrower, Balance, Rate,
    LTV, Remaining term (y) and Days past due. Linked entities: borrower (customer).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/mortgage/MTG-100231"
    - "MTG MTG-100231"
  category: "Retail banking"
  tags: ["mortgage", "retail-banking", "table"]
  use-when: "You have one mortgage (its id, or a link from another screen) and want to read it in full: A residential mortgage: balance, rate, loan-to-value, amortisation and arrears."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One mortgage record (kind mortgage); the page reads loanId, borrowerName, balance, rate, ltv, remainingYears, daysPastDue, amortisation, property, payments, customer."
    sample-row: {"loanId": "MTG-100231", "borrowerName": "Priya Sharma", "balance": 551894.11, "rate": 0.0354, "ltv": 0.755, "remainingYears": 21, "daysPastDue": 0, "originalAmount": 618000.0}
  example: "MTG MTG-100231"
  see-also: ["customer"]
  keywords: ["mortgage", "retail banking"]
  since: "2.7.0"
match: { kind: mortgage, priority: 10 }
title: { pill: Retail banking · Mortgage, id: $.loanId }
strip:
  - { label: Borrower, bind: $.borrowerName }
  - { label: Balance, bind: $.balance, fmt: amount0, emphasis: true }
  - { label: Rate, bind: $.rate, fmt: pct2 }
  - { label: LTV, bind: $.ltv, fmt: pct0 }
  - { label: Remaining term (y), bind: $.remainingYears, fmt: amount0 }
  - { label: Days past due, bind: $.daysPastDue, fmt: amount0 }
panels:
  - { use: series-line@1, with: { id: amortisation, title: Scheduled balance, key: F2, rows: $.amortisation, x: year, y: balance, fmt: compact } }
  - { use: field-list@1, with: { id: property, title: Property, key: F3, area: right, rows: $.property } }
  - id: payments
    kind: table
    title: Last payments
    key: F4
    rows: $.payments
    columns:
      - { label: Due, bind: "@.due", fmt: date }
      - { label: Amount, bind: "@.amount", fmt: amount2 }
      - { label: Paid, bind: "@.paid", fmt: date }
      - { label: Status, bind: "@.status", tone: status }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.customer, 'customer')", F8: impact, F9: raw }
