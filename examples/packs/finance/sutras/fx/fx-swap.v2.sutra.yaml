rachana: 1.2
sutra: fx-swap
version: 2
description: FX swap, near and far legs (mockup drishti-fx-swap.png).
doc:
  summary: "FX swap, near and far legs."
  description: >-
    FX swap, near and far legs. A tutorial screen of the example pack: one page per fx swap, its strip, panels and linked entities as the Sutra lists them.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/trade/FXS-20931"
  category: "Trade"
  tags: ["trade", "chart", "status", "table", "tabs"]
  use-when: "You have one FX swap (its id, or a link from another screen) and want to read it in full: FX swap, near and far legs."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One FX swap record (kind trade, productType = FXSWAP); the page reads tradeId, counterparty, pair, nearValue, farValue, nearRate, farRate, swapPoints, mtm, book, legs, cashflows."
    sample-row: {"tradeId": "FXS-20931", "productType": "FXSWAP", "product": "FX swap", "pair": "EUR/USD", "nearValue": "2026-10-02", "farValue": "2027-01-04", "nearRate": 1.174, "farRate": 1.17958}
  example: "/v/trade/FXS-20931"
  see-also: ["netting-set", "curve", "book", "counterparty"]
  keywords: ["trade", "fx swap"]
  since: "2.7.0"
match: { kind: trade, where: "$.productType == 'FXSWAP'", priority: 10 }
title: { pill: "Trade · FX swap", id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Pair, bind: $.pair }
  - { label: Near value, bind: $.nearValue, fmt: date }
  - { label: Far value, bind: $.farValue, fmt: date }
  - { label: Near rate, bind: $.nearRate, fmt: rate5 }
  - { label: Far rate, bind: $.farRate, fmt: rate5 }
  - { label: Swap points, bind: $.swapPoints, fmt: pips1 }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Book, bind: "link($.book, 'book')" }
panels:
  - id: legs
    kind: tabs
    title: Legs
    key: F2
    each: $.legs
    layout: columns
    tabTitle: "@.leg + ' leg · ' + @.valueDate"
    body:
      kind: kv
      columns:
        - { label: "We buy", bind: "@.buy.ccy + ' ' + fmt(@.buy.amount, 'amount2')", tone: pos }
        - { label: "We sell", bind: "@.sell.ccy + ' ' + fmt(@.sell.amount, 'amount2')", tone: neg }
        - { label: Rate, bind: "@.rate", fmt: rate5 }
        - { label: Settlement, bind: "@.settlement" }
  - id: cashflows
    kind: table
    title: Cashflows
    code: CF · by currency
    key: F3
    rows: $.cashflows
    totalLabel: Net PV
    columns:
      - { label: Pay date, bind: "@.payDate", fmt: date }
      - { label: Leg, bind: "@.leg" }
      - { label: Currency, bind: "@.currency" }
      - { label: Direction, bind: "@.direction" }
      - { label: Amount, bind: "@.amount", fmt: signed2, tone: sign }
      - { label: DF, bind: "@.df", fmt: df4 }
      - { label: PV (USD), bind: "@.pvUsd", fmt: signed0, tone: sign, total: true }
  - id: confirmation
    kind: status
    title: Confirmation and settlement
    code: OPS
    fields:
      - { label: Status, bind: $.confirmation.status, tone: status }
      - { label: Matched, bind: $.confirmation.matched }
      - { label: CLS eligible, bind: "$.confirmation.clsEligible ? 'Yes' : 'No'" }
      - { label: Trader, bind: $.confirmation.trader }
  - { id: built, kind: provenance, title: How this view was built }
  - id: points
    kind: line
    title: EUR/USD forward points (pips)
    code: CRV
    key: F4
    area: right
    source: "link($.forwardCurve, 'curve')"
    rows: points
    x: tenor
    y: points
    fmt: pips1
    mark: "'3M'"
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
  - id: risk
    kind: hbar
    title: Risk (USD)
    code: SENS
    area: right
    rows: $.risk
    label: factor
    value: usd
    fmt: signed0
    tone: sign
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
