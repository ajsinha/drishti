rachana: 1
sutra: fx-swap
version: 2
description: FX swap, near and far legs (mockup drishti-fx-swap.png).
match: { kind: trade, where: "$.productType == 'FXSWAP'", priority: 10 }
title: { pill: "Trade · FX swap", id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Pair, bind: $.pair }
  - { label: Near value, bind: $.nearValue, fmt: date }
  - { label: Far value, bind: $.farValue, fmt: date }
  - { label: Near rate, bind: $.nearRate, fmt: rate5 }
  - { label: Far rate, bind: $.farRate, fmt: rate5 }
  - { label: Swap points, bind: $.swapPoints, fmt: pips1 }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Book, bind: "link($.book, 'book')" }
panels:
  - id: legs
    kind: tabs
    title: Legs
    key: F2
    each: $.legs
    layout: columns
    tabTitle: "@.leg + ' leg · ' + @.valueDate"
    body:
      kind: kv
      columns:
        - { label: "We buy", bind: "@.buy.ccy + ' ' + fmt(@.buy.amount, 'amount2')", tone: pos }
        - { label: "We sell", bind: "@.sell.ccy + ' ' + fmt(@.sell.amount, 'amount2')", tone: neg }
        - { label: Rate, bind: "@.rate", fmt: rate5 }
        - { label: Settlement, bind: "@.settlement" }
  - id: cashflows
    kind: table
    title: Cashflows
    code: CF · by currency
    key: F3
    rows: $.cashflows
    totalLabel: Net PV
    columns:
      - { label: Pay date, bind: "@.payDate", fmt: date }
      - { label: Leg, bind: "@.leg" }
      - { label: Currency, bind: "@.currency" }
      - { label: Direction, bind: "@.direction" }
      - { label: Amount, bind: "@.amount", fmt: signed2, tone: sign }
      - { label: DF, bind: "@.df", fmt: df4 }
      - { label: PV (USD), bind: "@.pvUsd", fmt: signed0, tone: sign, total: true }
  - id: confirmation
    kind: status
    title: Confirmation and settlement
    code: OPS
    fields:
      - { label: Status, bind: $.confirmation.status, tone: status }
      - { label: Matched, bind: $.confirmation.matched }
      - { label: CLS eligible, bind: "$.confirmation.clsEligible ? 'Yes' : 'No'" }
      - { label: Trader, bind: $.confirmation.trader }
  - { id: built, kind: provenance, title: How this view was built }
  - id: points
    kind: line
    title: EUR/USD forward points (pips)
    code: CRV
    key: F4
    area: right
    source: "link($.forwardCurve, 'curve')"
    rows: points
    x: tenor
    y: points
    fmt: pips1
    mark: "'3M'"
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
  - id: risk
    kind: hbar
    title: Risk (USD)
    code: SENS
    area: right
    rows: $.risk
    label: factor
    value: usd
    fmt: signed0
    tone: sign
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
