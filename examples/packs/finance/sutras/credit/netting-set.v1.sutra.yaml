rachana: 1.2
sutra: netting-set
version: 1
description: Netting set with exposure profile, member trades, CSA and collateral (mockup drishti-netting-set.png).
doc:
  summary: "Netting set with exposure profile, member trades, CSA and collateral."
  description: >-
    Netting set with exposure profile, member trades, CSA and collateral. A tutorial screen of the example pack: one page per netting set, its strip, panels and linked entities as the Sutra lists them.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/netting-set/NS-NORTH-01"
  category: "Netting set"
  tags: ["netting-set", "chart", "record", "table"]
  use-when: "You have one netting set (its id, or a link from another screen) and want to read it in full: netting set with exposure profile, member trades, CSA and collateral."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One netting set record (kind netting-set); the page reads nettingSetId, counterparty, trades, netMtm, collateralPosted, eePeak, pfe95Peak, limit, utilisation, asOf, exposure, memberTrades."
    sample-row: {"nettingSetId": "NS-NORTH-01", "agreement": "ISDA-2002-0417", "csa": "CSA-VM-0417", "creditLimit": "LIM-NORTH", "trades": 14, "netMtm": -1259900, "collateralPosted": 1300000, "eePeak": 4100000}
  example: "/v/netting-set/NS-NORTH-01"
  see-also: ["counterparty"]
  keywords: ["netting set"]
  since: "2.7.0"
match: { kind: netting-set, priority: 10 }
title: { pill: Netting set, id: $.nettingSetId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Trades, bind: $.trades }
  - { label: Net MTM (USD), bind: $.netMtm, fmt: signed0, tone: sign }
  - { label: Collateral posted, bind: $.collateralPosted, fmt: amount0 }
  - { label: EE peak, bind: $.eePeak, fmt: compact }
  - { label: PFE 95 peak, bind: $.pfe95Peak, fmt: compact, emphasis: true }
  - { label: Limit, bind: $.limit, fmt: compact }
  - { label: Utilisation, bind: $.utilisation, fmt: pct0 }
  - { label: As of, bind: $.asOf }
panels:
  - id: exposure
    kind: area
    title: Exposure profile (USD)
    code: EXP
    key: F2
    rows: $.exposure
    x: tenor
    series:
      - { label: Expected exposure, value: ee, tone: link }
      - { label: PFE 95, value: pfe95, tone: accent }
    limit: $.limit
    limitLabel: Credit limit
  - id: trades
    kind: table
    title: Member trades
    code: TRD
    key: F3
    rows: $.memberTrades
    limit: 4
    moreLabel: "(size($.memberTrades) - 4) + ' more trades'"
    totalLabel: Net
    # the Pivot tab: every member trade (not only the first four), MTM by product and currency to start with
    pivot:
      fields: [product, currency, maturity, notional, mtm, trade]
      rows: [product]
      columns: [currency]
      values: [{ field: mtm, agg: sum }]
      filters: [currency]
    columns:
      - { label: Trade, bind: "@.trade", link: true }
      - { label: Product, bind: "@.product" }
      - { label: Notional, bind: "@.currency + ' ' + fmt(@.notional, 'amount0')" }
      - { label: Maturity, bind: "@.maturity", fmt: date }
      - { label: MTM (USD), bind: "@.mtm", fmt: signed0, tone: sign, total: true }
  - { id: csa, kind: kv, title: CSA terms, code: CSA, key: F4, area: right, rows: $.csaTerms }
  - { id: collateral, kind: kv, title: Collateral, code: COLL, area: right, rows: $.collateral }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.counterparty.id, 'counterparty')", F9: raw }
