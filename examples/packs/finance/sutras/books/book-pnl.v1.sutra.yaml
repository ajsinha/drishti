rachana: 1.2
sutra: book-pnl
version: 1
description: A book's P&L, derived from its trades by the book-totals connector (a derived kind; see BUILD_GUIDE.md).
doc:
  summary: "A book's P&L, derived from its trades by the book-totals connector (a derived kind; see BUILD_GUIDE.md)."
  description: >-
    A book's P&L, derived from its trades by the book-totals connector (a derived kind; see BUILD_GUIDE.md). A tutorial screen of the example pack: one page per book p&l, its strip, panels and linked entities as the Sutra lists them.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/book-pnl/RATES-NY-3"
  category: "Book P&L"
  tags: ["book-pnl", "book-p-l", "table"]
  use-when: "You have one book pnl (its id, or a link from another screen) and want to read it in full: A book's P&L, derived from its trades by the book-totals connector (a derived kind; see BUILD_GUIDE.md)."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One book pnl record (kind book-pnl); the page reads book, tradeCount, mtm, dv01, worstMtm, largestNotional, currencies, rows."
  see-also: ["book"]
  example: "/v/book-pnl/RATES-NY-3"
  keywords: ["book pnl", "book p&l"]
  since: "2.7.0"
match: { kind: book-pnl, priority: 10 }
title: { pill: Book P&L, id: $.book }
strip:
  - { label: Trades, bind: $.tradeCount }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: DV01 (USD), bind: $.dv01, fmt: signed0, tone: sign }
  - { label: Worst trade MTM, bind: $.worstMtm, fmt: signed0, tone: sign }
  - { label: Largest notional, bind: $.largestNotional, fmt: compact }
  - { label: Currencies, bind: "size($.currencies)" }
panels:
  - id: trades
    kind: table
    title: Trades in the book
    code: TRD
    key: F2
    rows: $.rows
    totalLabel: Total
    pivot: { rows: [product], columns: [currency], values: [{ field: mtm, agg: sum }, { field: trade, agg: count }] }
    columns:
      - { label: Trade, bind: "@.trade", link: true }
      - { label: Product, bind: "@.product" }
      - { label: Currency, bind: "@.currency" }
      - { label: Notional, bind: "@.notional", fmt: amount0 }
      - { label: MTM (USD), bind: "@.mtm", fmt: signed0, tone: sign, total: true }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
  - { id: built, kind: provenance, title: How this view was built, area: right }
keys: { F7: "link($.book, 'book')", F9: raw }
