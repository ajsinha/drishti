rachana: 1.2
sutra: shipment
version: 1
description: An ocean shipment in transit, with its route, milestones and the reefer container's temperature.
doc:
  summary: "An ocean shipment in transit, with its route, milestones and the reefer container's temperature."
  description: >-
    An ocean shipment in transit, with its route, milestones and the reefer container's temperature. A tutorial screen of the example pack: one page per shipment, its strip, panels and linked entities as the Sutra lists them.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/shipment/SHP-10042"
  category: "Shipment"
  tags: ["shipment", "chart", "record", "schedule", "table"]
  use-when: "You have one ocean shipment (its id, or a link from another screen) and want to read it in full: an ocean shipment in transit, with its route, milestones and the reefer container's temperature."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One ocean shipment record (kind shipment, status = In transit); the page reads shipmentId, customer, status, origin, destination, eta, etaDelayHours, weightKg, currency, declaredValue, incoterm, route."
    sample-row: {"shipmentId": "SHP-10042", "status": "In transit", "origin": "PORT-SGSIN", "destination": "PORT-NLRTM", "vessel": "VSL-9811000", "container": "CTR-MSKU1234567", "departed": "2026-09-12", "eta": "2026-10-09"}
  example: "/v/shipment/SHP-10042"
  see-also: ["vessel", "container", "port"]
  keywords: ["shipment", "ocean"]
  since: "2.7.0"
match: { kind: shipment, where: "$.status == 'In transit'", priority: 10 }
title: { pill: "Shipment · ocean", id: $.shipmentId, with: $.customer.name }
strip:
  - { label: Status, bind: $.status, tone: status }
  - { label: Origin, bind: "link($.origin, 'port')" }
  - { label: Destination, bind: "link($.destination, 'port')" }
  - { label: ETA, bind: $.eta, fmt: date }
  - { label: Delay, bind: $.etaDelayHours, fmt: hours0, tone: sign, emphasis: true }
  - { label: Weight (kg), bind: $.weightKg, fmt: amount0 }
  - { label: Declared value, bind: "$.currency + ' ' + fmt($.declaredValue, 'amount0')" }
  - { label: Incoterm, bind: $.incoterm }
panels:
  - id: route
    kind: table
    title: Route
    code: LEGS
    key: F2
    rows: $.route
    columns:
      - { label: "#", bind: "@.leg" }
      - { label: From, bind: "@.from", link: true }
      - { label: To, bind: "@.to", link: true }
      - { label: Mode, bind: "@.mode" }
      - { label: Departed, bind: "coalesce(@.departed, '—')" }
      - { label: Arrived, bind: "coalesce(@.arrived, '—')" }
      - { label: Carrier, bind: "@.carrier" }
  - id: milestones
    kind: ladder
    title: Milestones
    code: EVT
    key: F3
    rows: $.milestones
    highlight: "#index == size($.milestones) - 1"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Event, bind: "@.event" }
      - { label: Location, bind: "@.location" }
  - { id: cargo, kind: kv, title: Cargo, rows: $, columns: [ { label: Commodity, bind: $.commodity }, { label: Departed, bind: $.departed, fmt: date } ] }
  - { id: built, kind: provenance, title: How this view was built }
  - id: temperature
    kind: line
    title: Reefer temperature (°C), last 24 h
    code: TEMP
    key: F4
    area: right
    source: "link($.container, 'container')"
    rows: readings
    x: hour
    y: celsius
    fmt: temp1
    mark: "'H24'"
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.vessel, 'vessel')", F9: raw }
