rachana: 1
sutra: shipment
version: 1
description: An ocean shipment in transit, with its route, milestones and the reefer container's temperature.
match: { kind: shipment, where: "$.status == 'In transit'", priority: 10 }
title: { pill: "Shipment · ocean", id: $.shipmentId, with: $.customer.name }
strip:
  - { label: Status, bind: $.status, tone: status }
  - { label: Origin, bind: "link($.origin, 'port')" }
  - { label: Destination, bind: "link($.destination, 'port')" }
  - { label: ETA, bind: $.eta, fmt: date }
  - { label: Delay, bind: $.etaDelayHours, fmt: hours0, tone: sign, emphasis: true }
  - { label: Weight (kg), bind: $.weightKg, fmt: amount0 }
  - { label: Declared value, bind: "$.currency + ' ' + fmt($.declaredValue, 'amount0')" }
  - { label: Incoterm, bind: $.incoterm }
panels:
  - id: route
    kind: table
    title: Route
    code: LEGS
    key: F2
    rows: $.route
    columns:
      - { label: "#", bind: "@.leg" }
      - { label: From, bind: "@.from", link: true }
      - { label: To, bind: "@.to", link: true }
      - { label: Mode, bind: "@.mode" }
      - { label: Departed, bind: "coalesce(@.departed, '—')" }
      - { label: Arrived, bind: "coalesce(@.arrived, '—')" }
      - { label: Carrier, bind: "@.carrier" }
  - id: milestones
    kind: ladder
    title: Milestones
    code: EVT
    key: F3
    rows: $.milestones
    highlight: "#index == size($.milestones) - 1"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Event, bind: "@.event" }
      - { label: Location, bind: "@.location" }
  - { id: cargo, kind: kv, title: Cargo, rows: $, columns: [ { label: Commodity, bind: $.commodity }, { label: Departed, bind: $.departed, fmt: date } ] }
  - { id: built, kind: provenance, title: How this view was built }
  - id: temperature
    kind: line
    title: Reefer temperature (°C), last 24 h
    code: TEMP
    key: F4
    area: right
    source: "link($.container, 'container')"
    rows: readings
    x: hour
    y: celsius
    fmt: temp1
    mark: "'H24'"
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.vessel, 'vessel')", F9: raw }
