  - pattern: ^GENE-
    kind: gene
  - pattern: ^VRNT-
    kind: variant
  - pattern: ^PROT-
    kind: protein
  - pattern: ^PWY-
    kind: pathway
  - pattern: ^SMPL-
    kind: sample
  - pattern: ^SEQ-
    kind: sequencing-run
  - pattern: ^EXPR-
    kind: expression-study
  - pattern: ^TRIAL-
    kind: clinical-trial
  fields:
    biomarker:
      kind: variant
      label: Biomarker
    gene:
      kind: gene
      label: Target gene
    pathway:
      kind: pathway
      label: Pathway
    protein:
      kind: protein
      label: Protein
    sequencingRun:
      kind: sequencing-run
      label: Sequencing run
    trial:
      kind: clinical-trial
      label: Trial
  badges:
    gene: $.location
    variant: $.significance
    sample: $.diagnosis
    sequencing-run: fmt($.yieldGb, 'price2') + ' Gb'
    clinical-trial: $.phase
connectors:
  genomics-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - gene
    - variant
    - protein
    - pathway
    - sample
    - sequencing-run
    - expression-study
    - clinical-trial
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: genomics
routes:
  gene: genomics-store
  variant: genomics-store
  protein: genomics-store
  pathway: genomics-store
  sample: genomics-store
  sequencing-run: genomics-store
  expression-study: genomics-store
  clinical-trial: genomics-store
console:
  examples:
  - - GENE GENE-TP53
    - Gene · GRCh38 location, expression by tissue, known variants
  - - VRNT VRNT-BRAF-V600E
    - Variant · significance, population frequencies
  - - PROT PROT-P00533
    - Protein · EGFR domains
  - - SMPL SMPL-104120
    - Tumour sample · variant calls with VAF and depth
  - - SEQ SEQ-2026-0917-B
    - Sequencing run · quality by cycle
  - - TRIAL TRIAL-ONC-101
    - Clinical trial · enrolment and arms
