# config/lakes/regulators.yaml: the regulators lake, for regulators' and central banks' data (the SEC, the Federal Reserve, OSFI and other central banks) (docs/guides/DATA_LAKE_GUIDE.md section 2). Its tables live in
# <data>/delta/regulators/<domain>/<table>; the folder is kept in git with only its README.md, and nothing loaded into it is ever committed.
# Add a table's entry here before its first load to choose its layout (partition-by after business_date, promote, sort-by, file sizes,
# retention, maintenance); a load into a table with no entry copies its pack's recommended entry here first. Connectors read this lake
# with lake: regulators.
lake: regulators
format: delta
root: ${drishti.data.dir:./data}/delta/regulators
defaults: {load-mode: replace}
tables: {}
