# config/lakes/risklake.yaml: the risklake lake, for the bank's own risk data (trades, positions, scenario PVs, hierarchies) (docs/guides/DATA_LAKE_GUIDE.md section 2). Its tables live in
# <data>/delta/risklake/<domain>/<table>; the folder is kept in git with only its README.md, and nothing loaded into it is ever committed.
# Add a table's entry here before its first load to choose its layout (partition-by after business_date, promote, sort-by, file sizes,
# retention, maintenance); a load into a table with no entry copies its pack's recommended entry here first. Connectors read this lake
# with lake: risklake.
lake: risklake
format: delta
root: ${drishti.data.dir:./data}/delta/risklake
defaults: {load-mode: replace}
tables: {}
