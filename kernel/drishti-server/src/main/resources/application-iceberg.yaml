# Profile `iceberg` (SPRING_PROFILES_ACTIVE=iceberg): the banking packs' data domains are read from Apache Iceberg tables
# (one table per kind, loaded by tools/load-iceberg.sh) instead of Delta Lake: path-based tables under
# DRISHTI_ICEBERG_ROOT (<root>/<domain>/<kind>, local or s3a://), or, with DRISHTI_ICEBERG_CATALOG=rest, the tables of a
# REST catalog (Apache Polaris, Snowflake Open Catalog, AWS Glue's REST endpoint) whose namespace is the domain. The
# packs still decide the kinds, routes, modes and promoted columns of each <domain>-store connector.
drishti:
  sources:
    connectors:
      reference-store:  { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
      market-store:     { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
      trading-store:    { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
      risk-store:       { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
      credit-store:     { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
      collateral-store: { plugin: iceberg, settings: { catalog: "${DRISHTI_ICEBERG_CATALOG:hadoop}", root: "${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}", uri: "${DRISHTI_ICEBERG_URI:}", warehouse: "${DRISHTI_ICEBERG_WAREHOUSE:}", credential: "${DRISHTI_ICEBERG_CREDENTIAL:}" } }
