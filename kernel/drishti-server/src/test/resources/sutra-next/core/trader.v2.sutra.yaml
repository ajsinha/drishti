# The trader Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the core equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: trader
version: 2
description: A trader and their books.
match: { kind: trader, priority: 10 }
title: { pill: Organisation · Trader, id: $.TRADER_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Desk, bind: $.DESK_NAME }
  - { label: Trades, bind: $.TRADE_COUNT, emphasis: true }
panels:
  - id: books
    kind: table
    title: Books
    key: F2
    rows: $.BOOKS
    columns:
      - { label: Book, bind: "@.ID", link: true }
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.DESK, 'desk')", F8: impact, F9: raw }
