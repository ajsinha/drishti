# The counterparty Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the core equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: counterparty
version: 2
description: "A legal entity the bank trades with: identifiers (LEI, UEN), rating, sector, country of risk and parent group."
match: { kind: counterparty, priority: 10 }
title: { pill: Counterparty and legal · Counterparty, id: $.COUNTERPARTY_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: LEI, bind: $.LEI }
  - { label: Rating, bind: $.RATING, emphasis: true }
  - { label: Sector, bind: $.SECTOR }
  - { label: Country of risk, bind: $.COUNTRY_OF_RISK }
  - { label: UEN, bind: $.UEN }
  - { label: Type, bind: $.TYPE }
  - { label: Net MTM, bind: $.NET_MTM, fmt: signed0, tone: sign }
panels:
  - id: nettingSets
    kind: table
    title: Netting sets
    key: F2
    rows: $.NETTING_SETS
    columns:
      - { label: Netting set, bind: "@.ID", link: true }
      - { label: Agreement, bind: "@.AGREEMENT" }
      - { label: Trades, bind: "@.TRADES", fmt: amount0, total: true }
      - { label: Net MTM, bind: "@.NET_MTM", fmt: signed0, tone: sign, total: true }
  - id: kyc
    kind: kv
    title: KYC and classification
    area: right
    columns:
      - { label: Status, bind: $.KYC.STATUS, tone: status }
      - { label: Risk rating, bind: $.KYC.RISK_RATING }
      - { label: Last review, bind: $.KYC.LAST_REVIEW, fmt: date }
      - { label: EMIR classification, bind: $.KYC.EMIR_CLASSIFICATION }
      - { label: PD (1 year), bind: $.KYC.PD_1Y, fmt: pct2 }
  - id: hierarchy
    kind: graph
    title: Group hierarchy (agreements and netting sets)
    code: HIER
    key: F3
    nodes: $.HIERARCHY.NODES
    edges: $.HIERARCHY.EDGES
    label: LABEL
    group: TYPE
    layout: tree
  - id: computed
    kind: kv
    title: "Computed from the trade valuations, beside the stored figures"
    code: CMP
    key: F4
    area: right
    source: { kind: cpty-mtm, id: $.COUNTERPARTY_ID }
    columns:
      - { label: Net MTM (computed), bind: $src.NET_MTM, fmt: signed0, tone: sign }
      - { label: Net MTM (stored), bind: $.NET_MTM, fmt: signed0 }
      - { label: Net MTM difference, bind: $src.NET_MTM - $.NET_MTM, fmt: signed0, tone: sign }
      - { label: "Trades (computed: live)", bind: $src.TRADE_COUNT, fmt: amount0 }
      - { label: Netting sets, bind: $src.NETTING_SET_COUNT, fmt: amount0 }
      - { label: Gross positive MTM, bind: $src.GROSS_POSITIVE_MTM, fmt: signed0 }
      - { label: Gross negative MTM, bind: $src.GROSS_NEGATIVE_MTM, fmt: signed0 }
      - { label: "Current exposure, uncollateralised (per set, then added)", bind: $src.CE_UNCOLLATERALISED, fmt: compact }
      - { label: "Past maturity, not matured (data quality)", bind: $src.PAST_MATURITY_COUNT, fmt: amount0 }
      - { label: Sum currency, bind: $src.CURRENCY_NOTE }
  - id: computedSets
    kind: table
    title: Netting sets (computed from the trade valuations)
    rows: $src.NETTING_SETS
    source: { kind: cpty-mtm, id: $.COUNTERPARTY_ID }
    columns:
      - { label: Netting set, bind: "@.label" }
      - { label: Trades, bind: "@.count", fmt: amount0, total: true }
      - { label: Net MTM, bind: "@.value", fmt: signed0, tone: sign, total: true }
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.GROUP, 'counterparty-group')", F8: impact, F9: raw }
