# The cva Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the counterparty-risk equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: cva
version: 2
description: "Credit, debit and funding valuation adjustments with sensitivities."
match: { kind: cva, priority: 10 }
title: { pill: Exposure and capital · CVA / XVA, id: $.RESULT_ID }
strip:
  - { label: CVA, bind: $.CVA, fmt: signed0, tone: sign, emphasis: true }
  - { label: DVA, bind: $.DVA, fmt: signed0, tone: sign }
  - { label: FVA, bind: $.FVA, fmt: signed0, tone: sign }
  - { label: KVA, bind: $.KVA, fmt: signed0, tone: sign }
  - { label: CS01 (cpty), bind: $.CS01, fmt: signed0, tone: sign }
panels:
  - id: components
    kind: hbar
    title: Adjustments
    key: F2
    rows: $.COMPONENTS
    label: NAME
    value: AMOUNT
    fmt: signed0
    tone: sign
  - id: sens
    kind: table
    title: Sensitivities
    rows: $.SENSITIVITIES
    columns:
      - { label: Risk factor, bind: "@.FACTOR" }
      - { label: Bump, bind: "@.BUMP" }
      - { label: "Δ CVA", bind: "@.DELTA", fmt: signed0, tone: sign }
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.NETTING_SET, 'netting-set')", F8: impact, F9: raw }
