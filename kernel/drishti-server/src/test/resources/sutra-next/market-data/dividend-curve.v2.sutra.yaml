# The dividend-curve Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: dividend-curve
version: 2
description: Expected dividends by year (implied from dividend futures and forwards).
match: { kind: dividend-curve, priority: 10 }
title: { pill: Market data · Dividend curve, id: $.CURVE_ID }
strip:
  - { label: Underlier, bind: $.UNDERLIER }
  - { label: Yield, bind: $.DIVIDEND_YIELD, fmt: pct2, emphasis: true }
panels:
  - id: divs
    kind: hbar
    title: Expected dividends
    key: F2
    rows: $.POINTS
    label: YEAR
    value: AMOUNT
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.UNDERLYING_EQUITY, 'equity')", F8: impact, F9: raw }
