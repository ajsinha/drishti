# The inflation-curve Sutra as tools/packgen/banking/make_sutras.py generated it before Sutra Next (written inline, no fragments), as version 2 so it
# wins while the market-data equivalence test draws the "before" view. Test data only.
rachana: 1
sutra: inflation-curve
version: 2
description: "Zero-coupon breakevens by tenor, with monthly seasonality."
match: { kind: inflation-curve, priority: 10 }
title: { pill: Market data · Inflation curve, id: $.CURVE_ID }
strip:
  - { label: Index, bind: $.INDEX }
  - { label: "5Y breakeven", bind: $.BE_5Y, fmt: pct2, emphasis: true }
  - { label: "10Y breakeven", bind: $.BE_10Y, fmt: pct2 }
panels:
  - id: curve
    kind: line
    title: ZC breakevens (%)
    key: F2
    rows: $.POINTS
    x: TENOR
    y: BREAKEVEN
    fmt: price2
  - id: seasonality
    kind: hbar
    title: Seasonality
    area: right
    rows: $.SEASONALITY
    label: MONTH
    value: FACTOR
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.INFLATION_INDEX, 'inflation-index')", F8: impact, F9: raw }
