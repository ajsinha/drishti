# The trading pack's deal-footer block as make_sutras.py generated it before Sutra Next, renamed old-deal-footer so the old deal
# layouts (version 2, beside it) draw the panels they drew. Test data only.
rachana: 1
block: old-deal-footer
version: 1
description: "How the view was built and the entities the deal refers to."
panels:
  - { id: built, kind: provenance, title: How this view was built }
  # 2.9.2: a trade's Risk links (risk-links@1 in the new layouts), the same panel inline so the comparison stays exact
  - id: risk
    kind: kv
    title: "Risk"
    code: RISK
    area: right
    columns:
      - { label: P&L vector, bind: "nonblank($.PNL_VECTOR_ID) ? link($.PNL_VECTOR_ID, 'pnl-vector') : nonblank($.RISK_LINKS.PNL_VECTOR_NOTE, 'no P&L vector')" }
      - { label: VaR of this trade, bind: "nonblank($.VAR_RESULT_ID) ? link($.VAR_RESULT_ID, 'var-result') : nonblank($.RISK_LINKS.VAR_NOTE, 'no VaR')" }
      - { label: Exposure of this trade, bind: "nonblank($.EXPOSURE_RESULT_ID) ? link($.EXPOSURE_RESULT_ID, 'exposure-result') : nonblank($.RISK_LINKS.EXPOSURE_NOTE, 'no exposure paths')" }
      - { label: Trade currency, bind: "nonblank($.RISK_LINKS.TRADE_CURRENCY) ? $.RISK_LINKS.TRADE_CURRENCY + ', from ' + $.RISK_LINKS.TRADE_CURRENCY_FROM : nonblank($.CURRENCY, '–') + ', from its CURRENCY'" }
      - { label: Base PV, bind: "nonblank($.RISK_LINKS.BASE_PV, '–')" }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
