rachana: 3
model: fp-model
version: 1.0.0
tables:
  trade: { table: bi.fp_trade, role: fact }
measures:
  MTM:      { expr: sum(trade.MTM) }
  NOTIONAL: { expr: sum(trade.NOTIONAL) }
  Trades:   { expr: count(trade) }
parameters: { breakdown: { kind: field, fields: [trade.DESK, trade.PORTFOLIO], default: trade.DESK, title: Break down by }, metric: { kind: field, fields: [MTM, NOTIONAL], default: MTM, title: Show }, shock: { kind: number, default: 0, min: -1, max: 1, step: 0.1 } }
