rachana: 3
table: bi.loop_a
version: 1.0.0
from: { model: "loop-model@1", query: { select: { fields: [a.desk], measures: [Total] } } }
keys: [desk]
columns:
  desk:  { path: "$.desk", type: string, role: key, key: true }
  total: { path: "$.Total", type: decimal, aggregate: sum }
materialize: none
