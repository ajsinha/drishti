rachana: 3
table: bi.counterparty_exposure_netting_sets
version: 1.0.0
title: Counterparty exposure
sample: true
from: { kind: netting-set, connector: credit-store }
columns:
  COUNTERPARTY: { path: "$.COUNTERPARTY", type: string }
  TRADE_COUNT:  { path: "$.TRADE_COUNT", type: integer }
  NET_MTM:      { path: "$.NET_MTM", type: decimal, format: signed0 }
  COLLATERAL:   { path: "$.COLLATERAL", type: decimal, format: signed0 }
  EE_PEAK:      { path: "$.EE_PEAK", type: decimal, format: amount0 }
  PFE_PEAK:     { path: "$.PFE_PEAK", type: decimal, format: amount0 }
  LIMIT:        { path: "$.LIMIT", type: decimal, format: amount0 }
materialize: on-load
