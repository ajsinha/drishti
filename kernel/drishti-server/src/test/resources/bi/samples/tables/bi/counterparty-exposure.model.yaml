rachana: 3
model: counterparty-exposure
version: 1.0.0
title: Counterparty exposure
description: "Expected and potential future exposure (peak) of the netting sets, by counterparty, sector and country. No trades and no row rule: it answers \"how much could we lose to this counterparty\" on its own, and joins to other datasets (desk P&L, for one) through the counterparty."
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, multi-dataset]
tables:
  netting_sets:   { table: bi.counterparty_exposure_netting_sets, role: fact }
  counterparties: { table: bi.counterparty_exposure_counterparties, role: fact }
relationships:
  - { from: netting_sets.COUNTERPARTY, to: counterparties.id }
measures:
  Exposure (EE peak):  { expr: sum(netting_sets.EE_PEAK), format: amount0, description: "Sum of the netting sets' expected-exposure peaks." }
  Exposure (PFE peak): { expr: sum(netting_sets.PFE_PEAK), format: amount0 }
  Netting sets:        { expr: count(netting_sets) }
  Collateral:          { expr: sum(netting_sets.COLLATERAL), format: signed0 }
hierarchies:
  Counterparty: [counterparties.SECTOR, counterparties.NAME]
