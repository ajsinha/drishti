rachana: 3
model: live-exposure
version: 1.0.0
title: Live exposure
description: "Netting sets with their net mark-to-market, collateral, expected and potential future exposure and limit utilisation, updated as they tick."
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, live, streaming]
tables:
  netting: { table: bi.live_exposure_netting, role: fact }
measures:
  Netting sets:    { expr: count(netting) }
  Net MTM:         { expr: sum(netting.NET_MTM), format: signed0 }
  Collateral:      { expr: sum(netting.COLLATERAL), format: signed0 }
  EE peak:         { expr: sum(netting.EE_PEAK), format: amount0 }
  PFE peak:        { expr: sum(netting.PFE_PEAK), format: amount0 }
  Max utilisation: { expr: max(netting.UTILISATION) }
  Worst net MTM:   { expr: min(netting.NET_MTM), format: signed0 }
