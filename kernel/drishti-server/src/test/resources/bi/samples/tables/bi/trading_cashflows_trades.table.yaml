rachana: 3
table: bi.trading_cashflows_trades
version: 1.0.0
title: Trade legs and cashflows
sample: true
from: { kind: trade }
columns:
  SOURCE_SYSTEM:    { path: "$.SOURCE_SYSTEM", type: string }
  PRODUCT_TYPE:     { path: "$.PRODUCT_TYPE", type: string }
  PRODUCT_SUB_TYPE: { path: "$.PRODUCT_SUB_TYPE", type: string }
  PORTFOLIO:        { path: "$.PORTFOLIO", type: string }
  COUNTERPARTY:     { path: "$.COUNTERPARTY", type: string }
  CURRENCY:         { path: "$.CURRENCY", type: string }
  TRADE_STATUS:     { path: "$.TRADE_STATUS", type: string }
  BUY_SELL_CODE:    { path: "$.BUY_SELL_CODE", type: string }
  QUANTITY:         { path: "$.QUANTITY", type: decimal, format: amount0 }
  MATURITY_DATE:    { path: "$.MATURITY_DATE", type: date }
materialize: on-load
