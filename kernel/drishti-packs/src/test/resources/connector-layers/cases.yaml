# The shared fixture of the connector layers (docs/architecture/KERNEL_AND_MODULES.md section 18.5): the Java resolver (ConnectorLayers,
# ConnectorLayersFixtureTest) and its Python twin (drishti-console/core/resolution.py, drishti-console/tests/test_resolution.py) read
# these cases and must give the same effective connector. Each case: a template (or null: a site-only connector), the site file's text,
# and what comes out: the layer (template, override, site), whether the file is superseded, the plugin, enabled, and every setting
# flattened to its dotted key as text (or error: the file cannot be used). A template is named from the templates: section (null: none).
templates:
  endur:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [trade]
    description: Endur trades
    settings:
      lake: demo
      lake-tables: trading.trade_endur
      union: true
      source-name: trade-endur
      set:
        SOURCE_SYSTEM: ENDUR
      map: mappings/endur-trade.yaml
  endur-live:
    plugin: kafka
    enabled: ${DRISHTI_STREAM_ENDUR:false}
    companion-of: trade-endur
    settings:
      topics: drishti.trading.endur.trades

cases:
- name: trade-endur-live
  why: a live companion's template names its data connector (companion-of, LIVE_CONNECTORS_DESIGN.md section 2.2)
  template: endur-live
  file: |
    settings:
      topics: drishti.trading.endur.site
  layer: override
  superseded: false
  plugin: kafka
  enabled: ${DRISHTI_STREAM_ENDUR:false}
  companion-of: trade-endur
  settings:
    topics: drishti.trading.endur.site

- name: trade-endur-live
  why: an override may name another data connector; the key's layer is the override's
  template: endur-live
  file: |
    companion-of: trade-endur-eu
  layer: override
  superseded: false
  plugin: kafka
  enabled: ${DRISHTI_STREAM_ENDUR:false}
  companion-of: trade-endur-eu
  settings:
    topics: drishti.trading.endur.trades
  origins:
    companion-of: override

- name: quotes-live
  why: companion-of names a connector, never anything else
  template: null
  file: |
    plugin: kafka
    companion-of: Market Store!
  error: true

- name: quotes-live
  why: a connector cannot be its own companion
  template: null
  file: |
    plugin: kafka
    companion-of: quotes-live
  error: true

- name: trade-endur
  why: an override changes a table and adds a constant; everything else is the template's
  template: endur
  file: |
    settings:
      lake-tables: trading.trade_endur_site
      set:
        BOOK: B1
  layer: override
  superseded: false
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur_site
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml
    set.BOOK: B1
  origins:
    lake-tables: override
    set.BOOK: override
    lake: template

- name: trade-endur
  why: an override that only switches the connector off
  template: endur
  file: |
    enabled: false
  layer: override
  superseded: false
  plugin: delta
  enabled: "false"
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml

- name: trade-endur
  why: dotted keys are the same setting as nested ones
  template: endur
  file: |
    plugin: delta
    settings:
      set.SOURCE_SYSTEM: ENDUR_UK
  layer: override
  superseded: false
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR_UK
    map: mappings/endur-trade.yaml

- name: trade-endur
  why: a file naming another plugin changes the plugin and still inherits every template key it does not set
  template: endur
  file: |
    plugin: cassandra
    settings:
      contact-points: db1:9042
  layer: override
  superseded: false
  plugin: cassandra
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml
    contact-points: db1:9042
  origins:
    contact-points: override
    lake: template

- name: trade-endur
  why: a key set to null removes the inherited one (and every setting under it)
  template: endur
  file: |
    template: module source-endur
    settings:
      union: null
      set: null
  layer: override
  superseded: false
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    source-name: trade-endur
    map: mappings/endur-trade.yaml

- name: trade-endur
  why: a file in the older lake form does not get the template's lake keys
  template: endur
  file: |
    settings:
      root: /data/delta
      domain: trading
  layer: override
  superseded: false
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml
    root: /data/delta
    domain: trading

- name: trade-endur
  why: a file that gives only root moves the template's lake to another folder (drishti.py lake demo --lake); it keeps the lake
  template: endur
  file: |
    settings:
      root: /scratch/delta
  layer: override
  superseded: false
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml
    root: /scratch/delta

- name: trade-endur
  why: a generated file an earlier release wrote and nobody edited is superseded; the template is in force
  template: endur
  file: |
    # Generated at first start from the connector template of pack 'trading'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
    # drishti-template: pack=trading template=0123456789abcdef text=e18b151410608ef8
    plugin: delta
    enabled: true
    description: Endur trades
    settings:
      lake: demo
      lake-tables: trading.trade_endur
  layer: template
  superseded: true
  plugin: delta
  enabled: ${DRISHTI_LAKE_ENABLED:true}
  settings:
    lake: demo
    lake-tables: trading.trade_endur
    union: "true"
    source-name: trade-endur
    set.SOURCE_SYSTEM: ENDUR
    map: mappings/endur-trade.yaml

- name: trade-endur
  why: an edited generated file is the whole connector, as before
  template: endur
  file: |
    # Generated at first start from the connector template of pack 'trading'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
    # drishti-template: pack=trading template=0123456789abcdef text=e18b151410608ef8
    plugin: delta
    enabled: true
    description: Endur trades
    settings:
      lake: demo
      lake-tables: trading.trade_endur_edited
  layer: site
  superseded: false
  plugin: delta
  enabled: "true"
  settings:
    lake: demo
    lake-tables: trading.trade_endur_edited

- name: retired-store
  why: a file with no template is a complete site-only connector
  template: null
  file: |
    plugin: jdbc
    settings:
      url: jdbc:postgresql://db/risk
  layer: site
  superseded: false
  plugin: jdbc
  enabled: "true"
  settings:
    url: jdbc:postgresql://db/risk

- name: retired-store
  why: an override whose template is gone and that names no plugin cannot be used (Admin reports it; it is never deleted)
  template: null
  file: |
    settings:
      url: jdbc:postgresql://db/risk
  error: true

- name: trade-murex
  why: an override that names its template (template:) whose template is not here (its module is off) is not used (DRS-1046)
  template: null
  file: |
    template: module source-murex
    plugin: delta
    settings:
      lake-tables: trading.trade_murex_site
  error: true

- name: trade-murex
  why: a generated file whose template is not here is not used (DRS-1046); it is never run as a site connector
  template: null
  file: |
    # Generated at first start from the connector template of pack 'trading'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
    plugin: delta
    settings:
      lake: demo
      lake-tables: trading.trade_murex
  error: true

# Live companions across connectors (Companions in Java, companion_problems and live_connectors in Python): each case is the connectors in
# force as {name: {plugin, companion-of, kinds}}, the problems by companion (a fragment of the words), and each kind's live connectors given
# its read connectors.
companions:
- why: each source system's companion serves its own connector's kinds; a companion with a problem is never live
  connectors:
    trade-endur: {plugin: delta, kinds: [trade]}
    trade-murex: {plugin: delta, kinds: [trade]}
    trade-endur-live: {plugin: kafka, companion-of: trade-endur}
    trade-murex-live: {plugin: kafka, companion-of: trade-murex, kinds: [trade]}
    trade-calypso-live: {plugin: kafka, companion-of: trade-calypso}
  problems:
    trade-calypso-live: "which is not here"
  live:
  - {kind: trade, read: [trade-endur, trade-murex], want: [trade-endur-live, trade-murex-live]}
  - {kind: trade, read: [trade-murex], want: [trade-murex-live]}
- why: a subset of the data connector's kinds; a kind outside it, a plugin that pushes nothing, a companion of a companion
  connectors:
    market-store: {plugin: delta, kinds: [fx-spot, equity, ir-curve]}
    market-store-live: {plugin: kafka, companion-of: market-store, kinds: [fx-spot, equity]}
    market-store-jdbc: {plugin: jdbc, companion-of: market-store}
    market-store-extra: {plugin: rabbitmq, companion-of: market-store, kinds: [fx-spot, weather]}
    market-store-relay: {plugin: activemq, companion-of: market-store-live}
  problems:
    market-store-jdbc: "pushes nothing"
    market-store-extra: "names weather"
    market-store-relay: "itself a live companion"
  live:
  - {kind: fx-spot, read: [market-store], want: [market-store-live]}
  - {kind: ir-curve, read: [market-store], want: []}
- why: a live connector with no data connector feeds a kind that has no lake
  connectors:
    pricing-results: {plugin: kafka, kinds: [price-result]}
  problems: {}
  live:
  - {kind: price-result, read: [], want: [pricing-results]}
