# The shared fixture of pack resolution (docs/architecture/KERNEL_AND_MODULES.md, "Configuration resolution"): the Java resolver
# (com.ash.drishti.api.PackResolver, PackResolverFixtureTest) reads every case and must give its answer (the tools read the resolver's
# answer through resolve --json, tools/resolved.py; there is no Python twin).
#
# A case: `tree` (files under a scratch root: a pack is `<folder>/<name>/pack.yaml`, a module `modules/<dir>/module.yaml` (the one
# module layout, read as source mode: ModuleHomes.source),
# `active` (the active module ids), and the expected `packs` (name -> origin: `site`, `module:<id>`, `kernel`), `off` (a pack of a module
# that is not active -> that module), `dirs` (name -> folder, where it matters) and `problems` (each a fragment one problem must contain;
# no other problem allowed). Every case's layout: site = site/, kernel = site/core/, the modules tree = modules/.
# `booted` (id -> folder): the module boot's result (KERNEL_AND_MODULES.md section 4.2.1); when given, the modules are exactly these, each
# read from its folder, and the modules tree is not read. Without it the modules are the tree's folders (source mode).
cases:
- name: the three layers, first wins
  tree:
    site/acme/pack.yaml: "pack: acme"
    site/core/core/pack.yaml: "pack: core"
    site/core/gleif/pack.yaml: "pack: gleif"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
  active: [trading]
  packs: {acme: site, core: kernel, gleif: kernel, trading: "module:trading"}
  problems: []

- name: a module that is off brings none of its packs
  tree:
    site/core/core/pack.yaml: "pack: core"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
    modules/economy/module.yaml: "id: economy\npacks: {folder: packs, list: [world-economy]}"
    modules/external-data/packs/world-economy/pack.yaml: "pack: world-economy"
  active: [economy]
  packs: {core: kernel, world-economy: "module:economy"}
  off: {trading: trading}
  problems: []

- name: only the listed packs of a module count
  tree:
    site/core/core/pack.yaml: "pack: core"
    modules/banking/module.yaml: "id: banking\npacks: {folder: packs, list: [market-risk]}"
    modules/banking/packs/market-risk/pack.yaml: "pack: market-risk"
    modules/banking/packs/scratch/pack.yaml: "pack: scratch"
  active: [banking]
  packs: {core: kernel, market-risk: "module:banking"}
  problems: []

- name: a module's folder name is not its id
  tree:
    modules/capital-markets/module.yaml: "id: capitalmarkets\npacks: {folder: packs, list: [funds]}"
    modules/external-data/packs/funds/pack.yaml: "pack: funds"
  active: [capitalmarkets]
  packs: {funds: "module:capitalmarkets"}
  problems: []

- name: a booted module is read from the boot's folder; the modules tree is not read
  tree:
    modules/genomics/module.yaml: "id: genomics\npacks: {folder: packs, list: [genes]}"
    modules/genomics/packs/genes/pack.yaml: "pack: genes"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
    cache/genomics/1.3.0-0123456789abcdef/module.yaml: "id: genomics\npacks: {folder: packs, list: [genes]}"
    cache/genomics/1.3.0-0123456789abcdef/packs/genes/pack.yaml: "pack: genes"
  booted: {genomics: cache/genomics/1.3.0-0123456789abcdef}
  active: [genomics, trading]
  packs: {genes: "module:genomics"}
  dirs: {genes: cache/genomics/1.3.0-0123456789abcdef/packs/genes}
  problems: []

- name: a boot that took no module brings no module pack
  tree:
    site/core/core/pack.yaml: "pack: core"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
  booted: {}
  active: [trading]
  packs: {core: kernel}
  problems: []

- name: a site pack replaces a shipped one only when it says so
  tree:
    site/trading/pack.yaml: "pack: trading\nreplaces: trading"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
  active: [trading]
  packs: {trading: site}
  problems: []

- name: a site pack of a shipped pack's name without replaces is refused, the shipped one read
  tree:
    site/trading/pack.yaml: "pack: trading"
    modules/trading/module.yaml: "id: trading\npacks: {folder: packs, list: [trading]}"
    modules/trading/packs/trading/pack.yaml: "pack: trading"
  active: [trading]
  packs: {trading: "module:trading"}
  problems: ["the site's pack 'trading'"]

- name: a site pack may replace a kernel pack
  tree:
    site/gleif/pack.yaml: "pack: gleif\nreplaces: gleif"
    site/core/gleif/pack.yaml: "pack: gleif"
  active: []
  packs: {gleif: site}
  problems: []

- name: the same name twice in the site is an error naming both, neither read
  tree:
    site/acme/pack.yaml: "pack: acme"
    site/domain-a/acme/pack.yaml: "pack: acme"
  active: []
  packs: {}
  problems: ["pack 'acme' is in two places of the site"]

- name: the same name in two active modules is an error naming both, neither read
  tree:
    modules/a/module.yaml: "id: a\npacks: {folder: packs, list: [shared]}"
    modules/a/packs/shared/pack.yaml: "pack: shared"
    modules/b/module.yaml: "id: b\npacks: {folder: packs, list: [shared]}"
    modules/b/packs/shared/pack.yaml: "pack: shared"
  active: [a, b]
  packs: {}
  problems: ["pack 'shared' is in two places of the modules"]

- name: a listed pack that is not there is a problem
  tree:
    modules/a/module.yaml: "id: a\npacks: {folder: packs, list: [missing]}"
  active: [a]
  packs: {}
  problems: ["the module a lists the pack 'missing'"]

- name: a pack folder whose manifest names another pack is a problem
  tree:
    site/acme/pack.yaml: "pack: other"
  active: []
  packs: {}
  problems: ["declares pack 'other'"]

- name: a module pack of a kernel pack's name is refused without replaces
  tree:
    site/core/core/pack.yaml: "pack: core"
    modules/a/module.yaml: "id: a\npacks: {folder: packs, list: [core]}"
    modules/a/packs/core/pack.yaml: "pack: core"
  active: [a]
  packs: {core: kernel}
  problems: ["the module a's pack 'core'"]

- name: a module's packs folder outside its home is refused
  tree:
    modules/a/module.yaml: "id: a\npacks: {folder: ../../site, list: [acme]}"
    site/acme/pack.yaml: "pack: acme"
  active: [a]
  packs: {acme: site}
  problems: ["the module a: its packs folder"]

- name: a module with code keeps its manifest at its top, its Maven projects under java/ are not read
  tree:
    modules/genomics/module.yaml: "id: genomics\npacks: {folder: packs, list: [genes]}"
    modules/genomics/packs/genes/pack.yaml: "pack: genes"
    modules/genomics/java/genomics/pom.xml: "<project/>"
  active: [genomics]
  packs: {genes: "module:genomics"}
  problems: []
