# The one module layout (docs/architecture/KERNEL_AND_MODULES.md sections 3.2 and 8.10): the names a module folder's top may hold.
# The ONE list: the packer (ModulePack), the overrides view (ModuleOverrides), tools/test_module_layout.py and
# `drishti.py setup` all read this file. Anything else at a module's top is not part of the module: the packer leaves it out and says so.

# the .dmod content, packed as it is (java/: only the jars directly in it)
content: [module.yaml, dataload.yaml, README.md, functions.yaml,
          packs, console, data, docs, connectors, mappings, blotters, elements, lenses,
          java, lib, python, engines, lakes, bi, feeds, settings, tokens, i18n, tests, NOTICES]

# what only builds the module: allowed at its top, never packed (content.yaml is read by the packer, then dropped)
build: [content.yaml, pom.xml, tools, target]
