<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>if(location.hash.indexOf('light')>=0)document.documentElement.classList.add('light');</script>
<style>:root{--bg:#0e1628;--bg2:#121c33;--panel:#16213a;--panel2:#1b2744;--line:#26345a;--line2:#1f2b49;--ink:#e7ecf5;--muted:#93a0b8;--faint:#8490a9;--amber:#e8a33a;--amber2:#f2b453;--amber-t:rgba(232,163,58,.14);--link:#7fb2ff;--ok:#5fd39a;--warn:#f2c14e;--bad:#ff7a7a;--onacc:#14100a;--ok-t:rgba(95,211,154,.14);--warn-t:rgba(242,193,78,.16);--bad-t:rgba(255,122,122,.15);--sy-k:#7fb2ff;--sy-s:#5fd39a;--sy-n:#f2b453;--sy-c:#8490a9;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
html.light{--bg:#f7f5f0;--bg2:#efebe3;--panel:#fff;--panel2:#faf8f4;--line:#e2dcd0;--line2:#ece7dd;--ink:#172440;--muted:#55607a;--faint:#60697e;--amber:#985b0a;--amber2:#7c4805;--amber-t:rgba(184,110,12,.10);--link:#1f5fc4;--ok:#1b784c;--warn:#8a6100;--bad:#b42323;--onacc:#fff;--ok-t:rgba(27,120,76,.10);--warn-t:rgba(138,97,0,.10);--bad-t:rgba(180,35,35,.09);--sy-k:#1f5fc4;--sy-s:#1b784c;--sy-n:#985b0a;--sy-c:#60697e;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
.cap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12px}
.cap b{color:var(--amber2);letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.cap .grp{display:flex;align-items:center;gap:3px}.cap .grp>span{color:var(--faint);margin-right:4px}
.cap button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 9px;cursor:pointer}
.cap button.on,.btn.on{background:var(--amber);border-color:var(--amber);color:var(--onacc);font-weight:600}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--onacc);font-weight:600}
.btn:hover,.cap button:hover{border-color:var(--amber)}
.top{display:flex;align-items:baseline;gap:12px;padding:10px 16px 8px;border-bottom:1px solid var(--line2)}
.top h1{font-size:15px;margin:0;font-weight:600}.top .sub{color:var(--muted);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.ph{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ph .r{margin-left:auto;text-transform:none;letter-spacing:0}
.muted{color:var(--muted)}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.amb{color:var(--amber2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:10px;background:var(--amber-t);border:1px solid var(--amber);font-size:12px}
.chip button{background:none;border:0;cursor:pointer;color:var(--amber2);padding:0 2px;font-size:13px}
.note{padding:8px 10px;border-left:3px solid var(--amber);background:var(--amber-t);font-size:12px;border-radius:0 3px 3px 0}
.refuse{padding:10px 12px;border-left:3px solid var(--bad);background:var(--bad-t);border-radius:0 3px 3px 0}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
table.g{border-collapse:collapse;width:100%;font-size:12px}table.g th{color:var(--muted);text-align:left;font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}table.g td{padding:3px 8px;border-bottom:1px solid var(--line2)}
pre.y{margin:0;padding:10px 12px;font:12px/1.5 var(--mono);white-space:pre;overflow:auto}
.y .k{color:var(--sy-k)}.y .s{color:var(--sy-s)}.y .c{color:var(--sy-c)}.y .h{background:var(--amber-t);display:inline-block;min-width:100%}
svg text{fill:var(--muted);font:11px var(--sans)}
</style>
<style>#stage{padding:12px 16px}.chips{display:flex;gap:8px;align-items:center;min-height:30px;margin-bottom:8px}
.kp{display:flex;gap:26px;margin-bottom:10px}.kp div b{display:block;font:600 19px var(--mono)}.kp div span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.gr{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.gr .panel svg{display:block;width:100%;cursor:crosshair;touch-action:none}.brush{fill:var(--amber-t);stroke:var(--amber)}
</style>
<title>Linked brushing</title>
</head><body>
<div id=cap class=cap></div><div class=top><h1>Desk P&amp;L and limit use · Jun–Nov 2026</h1><span class=sub>Drag across a chart to select; click empty space, press Esc or use ✕ to clear</span></div>
<div id=stage><div class=chips id=chips></div><div class=kp id=kp></div><div class=gr id=gr></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(t,a,...c){const e=document.createElement(t);for(const k in a||{}){if(k.startsWith('on'))e[k]=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k]);}c.flat(9).forEach(x=>e.append(x));return e;}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){return Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r());}
function money(v){const a=Math.abs(v),s=v<0?'-':'';return s+'$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(0)+'K':a.toFixed(0));}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function yaml(t){return t.split('\n').map(l=>{let h=l.endsWith('  #!');if(h)l=l.slice(0,-4);let o=esc(l).replace(/(#.*)$/,'<span class=c>$1</span>').replace(/^(\s*-?\s*)([\w.]+):/,'$1<span class=k>$2</span>:').replace(/('[^']*')/g,'<span class=s>$1</span>');return h?'<span class=h>'+o+'</span>':o;}).join('\n');}
function pct1(arr){const a=[...arr].sort((x,y)=>x-y);return -a[Math.floor(a.length*.01)];}
// The caption bar: option, state, theme; the address keeps the choice (#B-error-light)
function Caption(title,opts,states,go,extra){
 const parts=location.hash.slice(1).split('-');let o=opts.find(x=>x[0]===parts[0])?parts[0]:opts[0][0];let s=states.find(x=>x[0]===parts[1])?parts[1]:states[0][0];
 const c=$('#cap');
 function grp(l,list,cur,set){return el('span',{class:'grp'},el('span',{},l),list.map(x=>el('button',{class:x[0]===cur?'on':'',title:x[1],onclick:()=>set(x[0])},x[1])));}
 function draw(){c.innerHTML='';c.append(el('b',{},title),grp('Option',opts,o,v=>{o=v;up();}),grp('State',states,s,v=>{s=v;up();}),el('span',{class:'grp'},el('button',{onclick:()=>{document.documentElement.classList.toggle('light');up(true);}},document.documentElement.classList.contains('light')?'Dark':'Light')),el('span',{class:'muted',style:'margin-left:auto'},'Mock-up · synthetic data'));if(extra)c.append(extra());}
 function up(themeOnly){location.hash=o+'-'+s+(document.documentElement.classList.contains('light')?'-light':'');draw();if(!themeOnly)go(o,s);else if(window.onTheme)onTheme();}
 window.addEventListener('hashchange',()=>{const p=location.hash.slice(1).split('-');let ch=false;if(p[0]&&p[0]!==o&&opts.find(x=>x[0]===p[0])){o=p[0];ch=true;}if(p[1]&&p[1]!==s&&states.find(x=>x[0]===p[1])){s=p[1];ch=true;}if(ch){draw();go(o,s);}});
 draw();go(o,s);
}

const DESKS=['Rates','Credit','FX','Equities','Commod.'];const days=[];let d=new Date(Date.UTC(2026,5,1));while(days.length<112){if(d.getUTCDay()%6)days.push(d.toISOString().slice(5,10));d=new Date(+d+864e5);}
const R=[];(()=>{const r=rng(5);days.forEach((dt,i)=>{const mkt=gauss(r)*(i>55&&i<72?2.3:1);DESKS.forEach((k,j)=>{const pnl=(mkt*[.8,.6,.3,1,.4][j]+gauss(r)*.7)*4e5;R.push({i,dt,desk:k,pnl,util:Math.min(1.25,.35+Math.abs(pnl)/2.1e6+r()*.25)});});});})();
const CH={time:{t:'Daily P&L, all desks (drag a date range)',w:720,h:190},hist:{t:'P&L per desk-day, histogram (drag a range)',w:430,h:190},desk:{t:'VaR by desk of the selected days (click bars)',w:720,h:170},scat:{t:'P&L against limit use (drag a box)',w:430,h:170}};
let F={},mode='A';
function pass(r,skip){return(!F.time||skip==='time'||(r.i>=F.time[0]&&r.i<=F.time[1]))&&(!F.hist||skip==='hist'||(r.pnl>=F.hist[0]&&r.pnl<=F.hist[1]))&&(!F.desk||skip==='desk'||F.desk.has(r.desk))&&(!F.scat||skip==='scat'||(r.pnl>=F.scat[0]&&r.pnl<=F.scat[1]&&r.util>=F.scat[2]&&r.util<=F.scat[3]));}
const X0=46,Wd=c=>CH[c].w-10-X0,Hb=c=>CH[c].h-24;
const hdom=[-2.4e6,2.4e6],px={time:i=>X0+i/(days.length-1)*Wd('time'),hist:v=>X0+(v-hdom[0])/(hdom[1]-hdom[0])*Wd('hist'),sx:v=>X0+(v-hdom[0])/(hdom[1]-hdom[0])*Wd('scat'),sy:u=>Hb('scat')-(u-.3)/1*(Hb('scat')-10)};
const inv={time:x=>Math.max(0,Math.min(days.length-1,Math.round((x-X0)/Wd('time')*(days.length-1)))),hist:x=>hdom[0]+(x-X0)/Wd('hist')*(hdom[1]-hdom[0]),sx:x=>hdom[0]+(x-X0)/Wd('scat')*(hdom[1]-hdom[0]),sy:y=>(Hb('scat')-y)/(Hb('scat')-10)+.3};
// A and B: the brushed chart keeps all its own rows; every other chart filters. C: all brushes combine, each chart ignoring only its own.
const vis=c=>R.filter(r=>pass(r,c));
function axis(c){return `<line x1=${X0} x2=${CH[c].w-10} y1=${Hb(c)} y2=${Hb(c)} stroke="var(--line)"/>`;}
function perDay(rows){const a=new Array(days.length).fill(null);rows.forEach(r=>a[r.i]=(a[r.i]||0)+r.pnl);return a;}
function dTime(){const c='time',H=Hb(c),sel=perDay(vis(c)),base=perDay(R),mx=Math.max(...base.filter(v=>v!=null).map(Math.abs))*1.1,Y=v=>H/2-v/mx*(H/2-6);const pth=a=>a.map((v,i)=>v==null?'':`${i&&a[i-1]!=null?'L':'M'}${px.time(i)} ${Y(v)}`).join('');let s=axis(c)+`<line x1=${X0} x2=${CH[c].w-10} y1=${Y(0)} y2=${Y(0)} stroke="var(--line2)"/><text x=${X0-6} y=${Y(mx)+10} text-anchor=end>${money(mx)}</text><text x=${X0-6} y=${Y(-mx)} text-anchor=end>${money(-mx)}</text>`;
 const f=F.time;if(mode==='B'&&!f&&Object.keys(F).length)s+=`<path d="${pth(base)}" fill=none stroke="var(--line)"/>`;s+=`<path d="${pth(sel)}" fill=none stroke="var(--amber)" stroke-width=1.5 ${f?"opacity=.4":""} />`;if(f)s+=`<path d="${pth(sel.map((v,i)=>i>=f[0]&&i<=f[1]?v:null))}" fill=none stroke="var(--amber)" stroke-width=2 />`;[0,28,56,84,111].forEach(i=>s+=`<text x=${px.time(i)} y=${H+14} text-anchor=middle>${days[i]}</text>`);if(f)s+=`<rect class=brush x=${px.time(f[0])} y=2 width=${px.time(f[1])-px.time(f[0])} height=${H-2} />`;return s;}
function dHist(){const c='hist',H=Hb(c),n=24,bins=rows=>{const a=new Array(n).fill(0);rows.forEach(r=>{const k=Math.floor((r.pnl-hdom[0])/(hdom[1]-hdom[0])*n);if(k>=0&&k<n)a[k]++;});return a;},all=bins(R),cur=bins(vis(c)),mx=Math.max(...all);let s=axis(c);const bw=Wd(c)/n;all.forEach((v,i)=>{const x=X0+i*bw;if(mode==='B'||F.hist)s+=`<rect x=${x+1} y=${H-v/mx*(H-8)} width=${bw-2} height=${v/mx*(H-8)} fill="var(--line)"/>`;let w=cur[i];if(F.hist){const lo=hdom[0]+(i+.5)/n*(hdom[1]-hdom[0]);if(lo<F.hist[0]||lo>F.hist[1])w=0;}s+=`<rect x=${x+1} y=${H-w/mx*(H-8)} width=${bw-2} height=${w/mx*(H-8)} fill="var(--amber)"/>`;});[-2e6,0,2e6].forEach(v=>s+=`<text x=${px.hist(v)} y=${H+14} text-anchor=middle>${money(v)}</text>`);if(F.hist)s+=`<rect class=brush x=${px.hist(F.hist[0])} y=2 width=${px.hist(F.hist[1])-px.hist(F.hist[0])} height=${H-2} />`;return s;}
function dvar(rows){const a=new Float64Array(days.length),seen=new Set();rows.forEach(r=>{a[r.i]+=r.pnl;seen.add(r.i);});const v=[...seen].map(i=>a[i]);return v.length>4?Math.max(0,pct1(v)):0;}
function dDesk(){const c='desk',H=Hb(c),n=DESKS.length,bw=Wd(c)/n,cur=DESKS.map(k=>dvar(vis(c).filter(r=>r.desk===k))),all=DESKS.map(k=>dvar(R.filter(r=>r.desk===k))),mx=Math.max(...all,...cur)*1.05;let s=axis(c);DESKS.forEach((k,i)=>{const x=X0+i*bw+bw*.12,w=bw*.76;if(mode==='B')s+=`<rect x=${x} y=${H-all[i]/mx*(H-16)} width=${w} height=${all[i]/mx*(H-16)} fill="var(--line)"/>`;const on=!F.desk||F.desk.has(k);s+=`<rect x=${x} y=${H-cur[i]/mx*(H-16)} width=${w} height=${cur[i]/mx*(H-16)} fill="var(--amber)" opacity=${on?1:.3} /><text x=${x+w/2} y=${H-cur[i]/mx*(H-16)-4} text-anchor=middle style="fill:var(--ink);font-family:var(--mono)">${money(cur[i])}</text><text x=${x+w/2} y=${H+14} text-anchor=middle>${k}</text>`;});return s;}
function dScat(){const c='scat',H=Hb(c);let s=axis(c);if(mode==='B')R.forEach(r=>s+=`<circle cx=${px.sx(r.pnl)} cy=${px.sy(r.util)} r=1.6 fill="var(--line)"/>`);vis(c).forEach(r=>{const on=!F.scat||(r.pnl>=F.scat[0]&&r.pnl<=F.scat[1]&&r.util>=F.scat[2]&&r.util<=F.scat[3]);s+=`<circle cx=${px.sx(r.pnl)} cy=${px.sy(r.util)} r=1.8 fill="${r.util>1?'var(--bad)':'var(--amber)'}" opacity=${on?.8:.2} />`;});[-2e6,0,2e6].forEach(v=>s+=`<text x=${px.sx(v)} y=${H+14} text-anchor=middle>${money(v)}</text>`);s+=`<text x=${X0-6} y=${px.sy(1)+4} text-anchor=end>100%</text><line x1=${X0} x2=${CH[c].w-10} y1=${px.sy(1)} y2=${px.sy(1)} stroke="var(--bad)" stroke-dasharray="3 3" opacity=.6 />`;if(F.scat){const f=F.scat;s+=`<rect class=brush x=${px.sx(f[0])} y=${px.sy(f[3])} width=${px.sx(f[1])-px.sx(f[0])} height=${px.sy(f[2])-px.sy(f[3])} />`;}return s;}
const DR={time:dTime,hist:dHist,desk:dDesk,scat:dScat};
function draw(){for(const c in CH)$('#svg-'+c).innerHTML=DR[c]();const sel=R.filter(r=>pass(r)),ds=new Set(sel.map(r=>r.i));$('#kp').innerHTML=`<div><b>${money(sel.reduce((a,r)=>a+r.pnl,0))}</b><span>P&amp;L (adds up)</span></div><div><b>${money(dvar(sel))}</b><span>99% VaR, recomputed for the selection</span></div><div><b>${ds.size}</b><span>days</span></div><div><b>${sel.filter(r=>r.util>1).length}</b><span>limit breaches</span></div>`;
 const ch=$('#chips');ch.innerHTML='';const names={time:f=>`Date ${days[f[0]]} – ${days[f[1]]}`,hist:f=>`P&L ${money(f[0])} to ${money(f[1])}`,desk:f=>'Desk: '+[...f].join(', '),scat:f=>`P&L ${money(f[0])}–${money(f[1])}, use ${(f[2]*100).toFixed(0)}–${(f[3]*100).toFixed(0)}%`};let any=false;for(const k in F){any=true;ch.append(el('span',{class:'chip'},names[k](F[k]),el('button',{title:'Clear this selection',onclick:()=>{delete F[k];draw();}},'✕')));}if(any)ch.append(el('button',{class:'btn',onclick:()=>{F={};draw();}},'Clear all'));else ch.append(el('span',{class:'muted'},'Nothing selected: every chart shows everything'));}
function setF(c,v){if(mode!=='C'){const keep=F[c];F={};if(keep&&!v)F={};}if(v)F[c]=v;else delete F[c];draw();}
function bind(c,svg){let st=null;const pt=e=>{const m=svg.getScreenCTM().inverse(),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return[p.x,p.y];};
 svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);st=pt(e);};
 svg.onpointermove=e=>{if(!st||c==='desk')return;const p=pt(e);if(Math.abs(p[0]-st[0])<3)return;const a=Math.min(st[0],p[0]),b=Math.max(st[0],p[0]);if(c==='time')setF(c,[inv.time(a),inv.time(b)]);if(c==='hist')setF(c,[inv.hist(a),inv.hist(b)]);if(c==='scat'){const y0=Math.min(st[1],p[1]),y1=Math.max(st[1],p[1]);setF(c,[inv.sx(a),inv.sx(b),inv.sy(y1),inv.sy(y0)]);}};
 svg.onpointerup=e=>{const p=pt(e);if(st&&Math.abs(p[0]-st[0])<3){if(c==='desk'){const i=Math.floor((p[0]-X0)/(Wd('desk')/DESKS.length));if(i>=0&&i<DESKS.length){const k=DESKS[i],s=new Set(F.desk||[]);s.has(k)?s.delete(k):s.add(k);setF('desk',s.size?s:null);}else setF('desk',null);}else if(F[c])setF(c,null);}st=null;};}
const G=$('#gr');for(const c in CH){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='svg-'+c;svg.setAttribute('viewBox',`0 0 ${CH[c].w} ${CH[c].h}`);bind(c,svg);G.append(el('div',{class:'panel'},el('div',{class:'ph'},CH[c].t),svg));}
addEventListener('keydown',e=>{if(e.key==='Escape'){F={};draw();}});
const P={A:'Filter (others re-aggregate)',B:'Highlight (the rest stays ghosted)',C:'Crossfilter (several at once)'};
Caption('3 · Linked brushing',[['A',P.A],['B',P.B],['C',P.C]],[['brushed','Range selected'],['empty','Cleared']],(o,s)=>{mode=o;F={};if(s==='brushed'){F.time=[58,72];if(o==='C')F.desk=new Set(['Rates','Equities']);}draw();});
</script>
</body></html>
