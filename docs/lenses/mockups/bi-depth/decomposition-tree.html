const DIMS={desk:'Desk',region:'Region',rc:'Risk class',ccy:'Currency',book:'Book'};
const leaves=[];(function(){const r=rng(11),N=509,f=Array.from({length:6},()=>Array.from({length:N},()=>gauss(r)));

let st={splits:['desk','region','rc'],sel:['Rates','Americas'],opt:'A',m:'var'};

function free(i){return Object.keys(DIMS).filter(d=>!st.splits.slice(0,i).includes(d));}

function split(c){return st.m==='var'?`Σ standalone <span class=num>${money(c.sum)}</span> <span class=ok>− diversification ${money(c.div)}</span> = <b class=num>${money(c.pv)}</b> <span class=muted>(${(100*c.div/c.sum).toFixed(0)}% offset)</span>`:`Adds up exactly: Σ children = <b class=num>${money(c.sum)}</b>`;}
function A(){const s=$('#stage'),t=el('div',{class:'tree',id:'t'});s.append(el('div',{class:'muted',style:'margin-bottom:8px'},st.m==='var'?'Each box is its own 99% VaR over 509 scenarios, recomputed for that slice. Boxes never add to the box on their left: the dashed line shows by how much.':'A plain sum: children add exactly to their parent.'),t);
 const cs=columns(),root=val(leaves,st.m);
 t.append(el('div',{class:'col'},el('h3',{},st.m==='var'?'99% VaR':'Notional'),el('div',{class:'node sel','data-k':'root'},el('div',{class:'t'},el('span',{},'Firm'),el('span',{class:'v'},money(root))),el('div',{class:'bar'},el('i',{style:'width:100%'})))));
 cs.forEach(c=>{const mx=c.g[0].v,col=el('div',{class:'col'},el('h3',{},'Split by',dimSel(c)),el('div',{class:'div',html:split(c)}));c.g.forEach(n=>col.append(el('div',{class:'node'+(st.sel[c.i]===n.k?' sel':''),'data-c':c.i,onclick:()=>choose(c.i,n.k)},el('div',{class:'t'},el('span',{},n.k),el('span',{class:'v'},money(n.v))),el('div',{class:'bar'},el('i',{style:`width:${100*n.v/mx}%`})))));t.append(col);});

 const pos=e=>{const b=e.getBoundingClientRect();return{x0:b.left-r.left,x1:b.right-r.left,y:b.top-r.top+b.height/2};};
 cs.forEach((c,i)=>{const from=i===0?$('[data-k=root]',t):$(`.node.sel[data-c="${i-1}"]`,t);if(!from)return;const a=pos(from);$$(`.node[data-c="${i}"]`,t).forEach(n=>{const b=pos(n),p=document.createElementNS(S,'path'),mx=(a.x1+b.x0)/2;p.setAttribute('d',`M${a.x1} ${a.y}C${mx} ${a.y} ${mx} ${b.y} ${b.x0} ${b.y}`);p.setAttribute('fill','none');p.setAttribute('stroke',n.classList.contains('sel')?'var(--amber)':'var(--line)');p.setAttribute('stroke-width',n.classList.contains('sel')?2:1);svg.append(p);});});t.prepend(svg);}
function B(){const s=$('#stage'),w=el('div',{class:'ld'});s.append(w);const cs=columns();cs.forEach((c,d)=>{const box=el('div',{class:'lvl panel',style:`--d:${d}`});box.append(el('div',{class:'ph'},`${c.parent}: split by`,dimSel(c),el('span',{class:'r num'},money(c.pv))));const mx=c.g[0].v;c.g.forEach(n=>box.append(el('div',{class:'row'+(st.sel[c.i]===n.k?' sel':''),onclick:()=>choose(c.i,n.k)},el('span',{},n.k),el('div',{class:'bar'},el('i',{style:`width:${100*n.v/mx}%`})),el('span',{class:'num',style:'text-align:right'},money(n.v)),el('span',{class:'num muted',style:'text-align:right',title:st.m==='var'?'share of the sum of standalone numbers':'share of the parent'},(100*n.v/c.sum).toFixed(0)+'%'))));box.append(el('div',{class:'tally',html:split(c)}));w.append(box);});}

 rows.forEach((r,i)=>{const x=L+i*bw+6,w=bw-12;let y0,y1,col;if(r.t==='c'){y0=y(run);y1=y(run+r.v);run+=r.v;col='var(--amber)';}else if(r.t==='d'){y0=y(run+r.v);y1=y(run);run+=r.v;col='var(--ok)';}else{y0=base;y1=y(r.v);col='var(--link)';}const h=Math.abs(y0-y1),top=Math.min(y0,y1);S+=`<g ${r.t==='c'?`data-k="${r.l}" style="cursor:pointer"`:''}><rect x=${x} y=${top} width=${w} height=${h} rx=2 fill="${col}"/><text x=${x+w/2} y=${top-5} text-anchor=middle style="fill:var(--ink);font-family:var(--mono)">${money(r.v)}</text><text x=${x+w/2} y=${base+16} text-anchor=middle>${r.l.slice(0,15)}</text></g>`;});

Caption('1 · Decomposition tree',[['A','Tree'],['B','Ladder'],['C','Waterfall']],[['var','VaR (non-additive)'],['sum','Notional (sum)']],(o,m)=>{st.opt=o;st.m=m;$('#ttl').textContent=m==='var'?'99% VaR · 2026-11-06':'Notional · 2026-11-06';$('#sub').textContent='Pick any box to open it; change the split on any level';if(o==='C'){st.sel=['Rates'];st.splits=['desk','region'];}else{st.sel=['Rates','Americas'];st.splits=['desk','region','rc'];}render();});
