<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
a{color:var(--link);text-decoration:none}
kbd,.k{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;background:var(--panel2)}
.app{height:100vh;display:flex;flex-direction:column;padding:0 12px 6px;gap:6px;min-width:0}

.btn.p{background:var(--amber);border-color:var(--amber);color:var(--onacc);font-weight:600}
.btn.p kbd{color:var(--onacc);border-color:rgba(0,0,0,.25);background:transparent}

.gridwrap{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}

.hpath{font-weight:600} .hpath i{font-style:normal;color:var(--muted);font-weight:400}

.rail{width:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px;color:var(--muted);font-size:11.5px;cursor:pointer}

.fi:hover,.fi.hov{background:var(--hl)}

.fi.lvl{padding-left:28px;font-size:12px;color:var(--muted)} .fi.lvl.used{color:var(--amber)}
.fi.lvl.above{color:var(--faint);font-style:italic}
.fi.sub{padding-left:22px}

.fi.dragging{outline:1px dashed var(--amber);background:var(--sel)}
.folder{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:12px;color:var(--muted)}
.folder .ic{width:16px;text-align:center}
.well{margin:4px 2px 10px}
.well .wh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:2px 4px;font-weight:600;display:flex}

.wi{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:3px 7px;margin:3px 0;background:var(--panel2);font-size:12px;white-space:nowrap}

.line .sp{flex:1}
.cust{font-size:12px;color:var(--link);white-space:nowrap;cursor:pointer}

.viewbtn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--amber);border-radius:6px;background:var(--amber-t);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}

.vi{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:5px 8px;border-radius:6px;align-items:center}

.vi .k2{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.vi .who{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.saveas{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.inp{border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--bg2);color:var(--muted);font-size:12px;flex:1}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;font-size:11.5px}
.seg2 span{padding:3px 8px;color:var(--muted)} .seg2 span.on{background:var(--panel2);color:var(--ink)}
.dim{opacity:.55}
</style>

      {l:2,k:'pos',t:'POS-BOOK-RATES-3~CORP-BOND-ALLY-4.25-2031',v:{GIRR:3.10,CSR:4.95,T:7.22}},
      {l:2,k:'pos',t:'POS-BOOK-RATES-3~BUND-FUT-DEC26',v:{GIRR:4.65,T:4.65}},
      {l:2,k:'pos',t:'POS-BOOK-RATES-3~CDX-IG-S47-5Y',v:{CSR:2.30,T:2.30}},
      {l:1,k:'node',t:'BOOK-RATES-4',v:{GIRR:8.95,T:8.95},lim:45},
      {l:1,k:'node',t:'BOOK-RATES-EM',v:{GIRR:6.40,FX:7.25,T:10.11},lim:72},
      {l:1,k:'node',t:'BOOK-RATES-XCCY',v:{GIRR:4.20,FX:3.30,T:5.86},lim:39},
      {l:1,k:'blank',t:'(Blank)',v:{GIRR:0.84,T:0.84},tip:'3 positions of DESK-RATES carry no TT_BOOK: shown as (Blank) so the desk\'s total stays complete. No limit applies.'},
    ],
    total: null,
    div: {t:'Diversification  (Σ books − desk)',v:{T:-29.24}},
    tiles: {VaR:74.63, ES:106.71, lim:83, limv:90.00, d1:+2.31, trades:1284},
    scan: 'This view reads ≈ 1,284 rows (≈ 410 KB, 7 of 35 columns): under a second. Every figure is exact, computed by the server from the trades\' scenario P&L vectors.'
  }
};
const D = SC[SCOPE];
const esOf = (v, t) => { if (v == null) return null; let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 97; return v * (1.39 + h / 1000); };

/* ---- the field catalogue, grouped the way a person thinks of it ---- */
const CAT = {
  hier: [
    {id:'MGMT', name:'MGMT', desc:'management', levels:['Division','Desk','Book'], used:true},
    {id:'LEGAL', name:'LEGAL', desc:'legal', levels:['Legal entity','Desk','Book']},
    {id:'LL', name:'LL', desc:'limit letters', levels:['Limit letter','Desk']},
    {id:'DRILL', name:'Positions', desc:'members', levels:['Position','Trade'], used:true},
  ],
  trade: ['Risk class','Product group','Product type','Currency','PV currency','Counterparty','Strategy','Portfolio','Trade status','Instrument'],
  meas: [
    {f:'VaR', items:['VaR','ES','Parametric VaR','Stressed VaR']},
    {f:'Contribution', items:['Comp VaR','Comp ES','Incr VaR']},
    {f:'Limits', items:['Limit','Limit use']},
    {f:'Sensitivities', items:['DV01','CS01','SBM capital']},
    {f:'Book', items:['PV','Trades']},
  ],
  more: ['LEGAL_ENTITY','DIVISION','DESK','TT_BOOK','LIMIT_LETTER','BANK','POSITION_RULE','SOURCE_SYSTEM','BOOKING_DATE','MATURITY_BUCKET','PRODUCT_SUBTYPE','TRADER','SETTLEMENT_CCY','EXCHANGE'],
};
const USED_M = ['VaR','ES'];
const USED_T = ['Risk class'];

function fieldTree(o) {
  o = o || {};
  let h = '';
  const lvlUsed = lv => D.hier.includes(lv) || D.drill.includes(lv);
  h += `<div class="grp-h">Hierarchies<span class="n">${CAT.hier.length}</span></div>`;
  for (const x of CAT.hier) {
    const open = o.expand && o.expand.includes(x.id);
    const used = x.used;
    h += `<div class="fi ${used?'used':''} ${o.drag===x.id?'dragging':''} ${o.act===x.id?'act':''}" title="${esc(x.levels.join(' › '))}: drag it for drill-down, or open it to pick one level">`
       + `<span class="tw">${open?'▾':'▸'}</span><span class="ic h">⋔</span><b>${x.name}</b>`
       + `<span style="color:var(--muted)">${x.levels.join(' › ')}</span>${used?'<span class="ck">✓</span>':''}</div>`;
    if (open) for (const lv of x.levels) {
      const u = x.id==='MGMT' ? lvlUsed(lv) : x.id==='DRILL';
      const above = x.id==='MGMT' && D.above.includes(lv);
      h += `<div class="fi lvl ${o.checks?'':''} ${u?'used':''} ${above?'above':''}">`
         + (o.checks ? `<span class="cb ${u?'on':''}">${u?'✓':''}</span>` : '<span class="ic">·</span>')
         + `${lv}${above?'<span class="tag">above the scope</span>':''}${(!above&&o.checks&&u)?'<span class="tag">in Rows</span>':''}</div>`;
    }
  }
  if (o.noTrade !== true) {
    h += `<div class="grp-h">Trade &amp; position<span class="n">${CAT.trade.length}</span></div>`;
    const list = o.tradeCols ? CAT.trade : CAT.trade;
    if (o.tradeCols) {
      h += '<div class="cols2">';
      for (const t of list) h += `<div class="fi ${USED_T.includes(t)?'used':''}"><span class="ic">Aa</span>${t}${USED_T.includes(t)?'<span class="ck">in Columns</span>':''}</div>`;
      h += '</div>';
    } else for (const t of list) h += `<div class="fi ${USED_T.includes(t)?'used':''}"><span class="ic">Aa</span>${t}${USED_T.includes(t)?'<span class="ck">✓</span>':''}</div>`;
  }
  if (o.meas !== false) {
    const n = CAT.meas.reduce((a,b)=>a+b.items.length,0);
    h += `<div class="grp-h">Measures<span class="n">${n}</span></div>`;
    for (const f of CAT.meas) {
      h += `<div class="folder"><span class="ic">▾</span>${f.f}</div>`;
      for (const it of f.items) h += `<div class="fi sub ${USED_M.includes(it)?'used':''}"><span class="ic m">Σ</span>${it}${USED_M.includes(it)?'<span class="ck">✓</span>':''}</div>`;
    }
  }
  h += `<div class="grp-h">More fields<span class="n">${CAT.more.length}</span></div>`;
  h += `<div class="folder"><span class="ic">▸</span>${CAT.more.length} columns, hidden  <span style="color:var(--faint);margin-left:4px">(levels of the hierarchies, rarely used)</span></div>`;
  return h;
}

/* ---- the grid ---- */
function grid(corner) {
  const cls = D.classes;
  const meas = OPT === 'C' && !OPEN && SCOPE==='desk' ? ['VaR','ES','Limit use'] : ['VaR','ES'];
  let h = '<table class="g"><thead><tr>';
  h += `<th class="corner" rowspan="2">${corner}</th>`;
  for (const c of cls) h += `<th class="grp" colspan="2">${c}</th>`;
  h += `<th class="grp t" colspan="${meas.length}">Total</th></tr><tr>`;
  for (const c of cls) h += '<th>VaR</th><th>ES</th>';
  meas.forEach((x,i)=> h += `<th class="${i===0?'tc':''}">${x}</th>`);
  h += '</tr></thead><tbody>';
  const cell = (v, t, cl) => v == null ? `<td class="e ${cl||''}"></td>` : `<td class="${cl||''}">${m(v)}</td>`;
  const allRows = D.rows.slice();
  for (const r of allRows) {
    const tw = (r.k==='trd' || r.o==null && r.k==='pos') ? '' : (r.o ? '−' : '+');
    const path = r.k==='trd' ? 'a trade' : r.k==='pos' ? 'a position' : r.l===0 ? 'Desk' : 'Book';
    const tip = r.tip || `${r.t}  ·  ${path}  ·  scope ${r.k==='pos'?'POS:'+r.t : r.k==='node'?'NODE:MGMT~'+r.t : 'TRD:'+r.t.split(' ')[0]}`;
    h += `<tr class="l${r.l} ${r.k} ${r.sel?'sel':''}"><td class="rh" title="${esc(tip)}" style="padding-left:${10 + r.l*18}px">`
       + `<span class="tw">${tw}</span><span class="lbl">${esc(r.t)}</span>`
       + (r.k==='blank' ? '<span class="q">?</span>' : '') + '</td>';
    for (const c of cls) { h += cell(r.v[c]); h += cell(esOf(r.v[c], c + (r.v[c]||0).toFixed(2))); }
    h += cell(r.v.T, r.t, 'tc'); h += cell(r.esT != null ? r.esT : esOf(r.v.T, 'T' + (r.v.T||0).toFixed(2)));
    if (meas.length > 2) h += r.lim ? `<td><span class="meter" style="width:44px;vertical-align:middle;margin-right:6px"><i style="width:${r.lim}%;background:${r.lim>90?'var(--bad)':r.lim>75?'var(--warn)':'var(--ok)'}"></i></span>${r.lim}%</td>` : '<td class="e"></td>';
    h += '</tr>';
  }
  if (D.div) {
    h += `<tr class="div"><td class="rh" style="padding-left:28px" title="The desk's VaR is smaller than the sum of its books' VaR: VaR does not add up. This is the gap, in money.">${D.div.t}</td>`;
    for (const c of cls) h += '<td></td><td></td>';
    h += `<td class="tc">${m(D.div.v.T)}</td><td></td>${meas.length>2?'<td></td>':''}</tr>`;
  }
  h += '</tbody></table>';
  return h;
}
function gfoot() {
  const n = D.rows.length;
  return `<div class="gfoot"><span>${n} rows · ${SCOPE==='desk'?'7 books, 9 positions shown':'1 position, 3 trades'}</span><span>figures in USD m · 1d · 99% · exact</span><span class="sp"></span>`
       + `<span>selected: <b style="color:var(--ink)">${SCOPE==='desk'?'BOOK-RATES-3':'POS-BOOK-CREDIT-1~CLY-4001063'}</b> · VaR ${SCOPE==='desk'?'22.48 m':'10.60 m'}</span></div>`;
}

/* ---- the frame common to every option ---- */
function head() {
  const t = D.tiles;
  let tiles = `<div class="tile"><small>VaR</small><b>${m(t.VaR)}</b></div><div class="tile"><small>ES</small><b>${m(t.ES)}</b></div>`;
  if (t.lim) tiles += `<div class="tile lim"><small>Limit use · ${m(t.limv)}</small><b>${t.lim}% <span class="meter"><i style="width:${t.lim}%"></i></span></b></div>`;
  tiles += `<div class="tile"><small>vs 2026-11-05</small><b class="up">+${t.d1.toFixed(2)} m</b></div>`;
  tiles += `<div class="tile"><small>Trades</small><b>${t.trades.toLocaleString('en-US')}</b></div>`;
  return `<div class="head"><h2>MR cube · ${esc(D.title)}<span>2026-11-06 · 1d 99% · USD</span></h2>`
    + `<span class="info ${has('info')?'show':''}" title="">i<span class="tip"><b>What this view reads</b><br>${D.scan}<br><span style="color:var(--muted)">A large view asks before it runs, with <b>Run</b>.</span></span></span>`
    + `<div class="tiles">${tiles}</div>`
    + `<div class="tools"><span class="btn ghost">Compare <kbd>D</kbd></span><span class="btn ghost">Chart <kbd>G</kbd></span><span class="btn ghost">Export <kbd>X</kbd></span><span class="btn ghost">Share</span><span class="btn ghost" title="the lens tabs: components, DV01 ladder, what-if">Lens ▾</span></div></div>`;
}
function bar() {
  return `<div class="bar"><span class="brand">DRISHTI</span><span class="cmd">MCUBE ${esc(D.word)} &lt;GO&gt;</span>`
    + '<div class="menus"><span>Home</span><span class="on">Risk</span><span>Views</span><span>Data</span><span>Build</span><span>Help</span></div></div>';
}
function cap(txt) {
  const base = location.pathname.split('/').pop();
  const opt = x => `<a class="${x===OPT?'on':''}" href="${({A:'A-powerbi-panes',B:'B-trader-view',C:'C-saved-views'})[x]}.html#${H.join(',')}">${x}</a>`;
  const tok = (on, lab, add, drop) => { const s = H.filter(x=>!drop.includes(x)); if (add) s.push(add); return `<a class="${on?'on':''}" href="${base}#${s.join(',')}">${lab}</a>`; };
  return `<div class="cap"><b>Mock-up ${OPT}</b><span>${txt}</span><span class="sp"></span>`
    + `${opt('A')}${opt('B')}${opt('C')} · ${tok(SCOPE==='desk','desk','desk',['pos','desk'])}${tok(SCOPE==='pos','position','pos',['pos','desk'])} · ${tok(OPEN,'open','open',['open','collapsed'])}${tok(!OPEN,'closed',OPT==='A'?'collapsed':'',['open','collapsed'])} · ${tok(!has('light'),'dark','',['light'])}${tok(has('light'),'light','light',['light'])}</div>`;
}

/* ---- A: Power BI panes ---- */
function optA() {
  const corner = `<span class="hpath">MGMT <i>▸</i> Desk <i>›</i> Book <i>›</i> Position</span>`
    + `<span class="drill" title="drill: up a level · drill-down mode · next level · expand all"><span title="Drill up (Alt+↑)">↑</span><span class="on" title="Drill-down mode on: a click on a row opens it">↓</span><span title="Go to the next level (Alt+↓)">⇊</span><span title="Expand all down one level">⤓</span></span>`;
  const g = `<div class="gridwrap"><div class="gscroll">${grid(corner)}</div>${gfoot()}</div>`;
  let panes;
  if (!OPEN) {
    panes = `<div class="rail" title="Build (\\)"><span class="ic">▤</span><span>Build</span></div><div class="rail" title="Fields (\\)"><span class="ic">⌕</span><span>Fields</span></div>`;
  } else {
    const wi = (ic, t, cls) => `<div class="wi"><span class="ic ${cls||''}">${ic}</span>${t}<span class="x">×</span></div>`;
    const build = `<div class="pane build"><h4>Build <span class="x" title="collapse (\\)">»</span></h4><div class="body">`
      + `<div class="well"><div class="wh">Rows<kbd>R</kbd></div>${wi('⋔','<b>MGMT</b>&nbsp;<small>Desk › Book</small>')}${wi('⋔','<b>Positions</b>&nbsp;<small>Position › Trade</small>')}<div class="drop hot">＋ drop here</div></div>`
      + `<div class="well"><div class="wh">Columns<kbd>C</kbd></div>${wi('Aa','Risk class')}</div>`
      + `<div class="well"><div class="wh">Values<kbd>V</kbd></div>${wi('Σ','VaR','m')}${wi('Σ','ES','m')}</div>`
      + `<div class="well"><div class="wh">Filters<kbd>F</kbd></div><div class="fscope">on this view</div>${wi('Aa','Trade status <small>= LIVE</small>')}<div class="fscope">on every view of the MR cube</div><div class="drop">＋ drop here</div></div>`
      + `</div></div>`;
    const fields = `<div class="pane"><h4>Fields <span class="x" title="collapse (\\)">»</span></h4><div class="body">`
      + `<div class="search"><span>⌕</span><span class="sp">Search fields</span><kbd>/</kbd></div>`
      + fieldTree({expand:['MGMT'], drag: SCOPE==='desk'?'LEGAL':null}) + `</div></div>`;
    panes = `<div class="panes">${build}${fields}</div>`;
  }
  const ghost = OPEN && SCOPE==='desk' ? '<div class="ghostdrag" id="ghost">⋔ LEGAL  Legal entity › Desk › Book</div>' : '';
  const keys = `<div class="keys"><span><kbd>\\</kbd>show or hide the panes</span><span><kbd>/</kbd>search fields</span><span><kbd>R</kbd><kbd>C</kbd><kbd>V</kbd><kbd>F</kbd>put the selected field</span><span><kbd>Alt+↑</kbd><kbd>Alt+↓</kbd>drill up / next level</span><span><kbd>→</kbd><kbd>←</kbd>open / close a row</span><span><kbd>1</kbd>–<kbd>9</kbd>open to a level</span><span><kbd>Enter</kbd>a cell's trades</span><span><kbd>E</kbd>explain</span></div>`;
  return cap('Power BI panes: the grid fills the left; Build and Fields on the right, collapsible to a rail (\\).') + bar() + head()
    + `<div class="main">${g}${panes}</div>` + keys + ghost;
}

/* ---- B: trader view first ---- */
function wellsLine(open) {
  const hchip = `<span class="chip ${open==='rows'?'open':''}" id="rowsChip"><span class="ic">⋔</span><span class="hp">MGMT <i>▾</i> Desk <i>›</i> Book</span>`
    + `<span class="step" title="drill up / down a level ([ and ])"><span>▲</span><span>▼</span></span></span>`;
  const meas = OPT==='C' ? ['VaR','ES','Limit use','Comp VaR','Incr VaR','SVaR'] : ['VaR','ES','Comp VaR','Incr VaR','Limit use','SVaR','DV01','CS01','SBM'];
  const on = OPT==='C' && SCOPE==='desk' && !OPEN ? ['VaR','ES','Limit use'] : ['VaR','ES'];
  let tg = '<span class="tog">'; for (const x of meas) tg += `<span class="${on.includes(x)?'on':''}">${x}${on.includes(x)?'<i>▾</i>':''}</span>`; tg += '<span>⋯</span></span>';
  return `<span class="lab">Rows</span>${hchip}<span class="chip"><span class="ic">⋔</span>› Position › Trade<span class="car">▾</span></span>`
    + `<span class="dot">·</span><span class="lab">Columns</span><span class="chip ${open==='cols'?'open':''}"><span class="ic">Aa</span>Risk class<span class="car">▾</span></span>`
    + `<span class="dot">·</span><span class="lab">Filters</span><span class="chip">Trade status = LIVE<span class="car">×</span></span><span class="chip add">＋</span>`
    + `<span class="dot">·</span><span class="lab">Values</span>${tg}`
    + `<span class="sp"></span><span class="cust" title="opens the Build and Fields panes (A)">Customize ›</span>`;
}
function rowsPicker() {
  return `<div class="pop" id="pop" style="width:470px"><div class="ph">Rows <small>pick a hierarchy, then its levels; or a field</small></div>`
    + `<div class="pb"><div class="search focus"><span>⌕</span><span class="sp">Search fields…</span><kbd>/</kbd></div>`
    + fieldTree({expand:['MGMT','LEGAL'], checks:true, meas:false, tradeCols:true, act:'MGMT'})
    + `</div><div class="pf"><span><kbd>↑</kbd><kbd>↓</kbd>move</span><span><kbd>Space</kbd>level on/off</span><span><kbd>Enter</kbd>use</span><span><kbd>Esc</kbd>close</span><span class="sp"></span><a>Customize ›</a></div></div>`;
}
function keysB() {
  return `<div class="keys"><span><kbd>R</kbd><kbd>C</kbd><kbd>F</kbd>open Rows, Columns, Filters</span><span><kbd>[</kbd><kbd>]</kbd>drill up / down the hierarchy</span><span><kbd>M</kbd>measures (then <kbd>1</kbd>–<kbd>9</kbd> to toggle)</span><span><kbd>→</kbd><kbd>←</kbd>open / close a row</span><span><kbd>Enter</kbd>a cell's trades</span><span><kbd>E</kbd>explain</span><span><kbd>\\</kbd>Customize (panes)</span>${OPT==='C'?'<span><kbd>Shift+V</kbd>views</span><span><kbd>Ctrl+S</kbd>save view</span>':''}</div>`;
}
function cornerB() { return `<span class="hpath">Desk <i>›</i> Book <i>›</i> Position${SCOPE==='pos'?' <i>›</i> Trade':''}</span>`; }
function optB() {
  const g = `<div class="gridwrap"><div class="gscroll">${grid(cornerB())}</div>${gfoot()}</div>`;
  return cap('Trader view first: no field list; one compact line of pickers; the grid gets the screen. Customize › opens A\'s panes.')
    + bar() + head() + `<div class="line" id="line">${wellsLine(OPEN?'rows':null)}</div>`
    + `<div class="main">${g}</div>` + keysB() + (OPEN ? rowsPicker() : '');
}

/* ---- C: saved views + B ---- */
const VIEWS = [
  {g:'Ready-made for the MR cube'},
  {n:'By desk', d:'MGMT Desk · VaR, ES, Limit use', k:'1'},
  {n:'By book', d:'MGMT Desk › Book · VaR, ES, Limit use', k:'2', on:1},
  {n:'By limit letter', d:'LL Limit letter › Desk · VaR, Limit, Limit use', k:'3'},
  {n:'By risk class × desk', d:'MGMT Desk × Risk class · VaR, ES', k:'4'},
  {n:'Top contributors', d:'Positions by Comp VaR, top 20 · Comp VaR, Incr VaR, VaR', k:'5'},
  {n:'Trades in my scope', d:'Trade · VaR, Incr VaR, PV · sorted by Incr VaR', k:'6'},
  {g:'My views'},
  {n:'Rates books vs limits', d:'MGMT Book · VaR, Limit use, Stressed VaR', who:'personal'},
  {n:'EM and XCCY check', d:'Book × Currency · VaR, DV01', who:'personal'},
  {g:'Shared with me'},
  {n:'Rates morning view', d:'MGMT Desk › Book × Risk class · VaR, ES, DV01', who:'shared · desk head'},
];
function viewsPicker() {
  let h = `<div class="pop" id="pop" style="width:500px"><div class="ph">Views <small>the layouts for this cube</small><span class="sp" style="flex:1"></span></div>`
    + `<div class="pb"><div class="search"><span>⌕</span><span class="sp">Find a view</span><kbd>/</kbd></div><div class="vl">`;
  for (const v of VIEWS) {
    if (v.g) { h += `<div class="grp-h">${v.g}</div>`; continue; }
    h += `<div class="vi ${v.on?'on':''} ${v.n==='Top contributors'?'hov':''}"><span class="ic">${v.on?'●':'○'}</span><b>${v.n}</b>${v.who?`<span class="who">${v.who}</span>`:`<span class="k2">${v.k}</span>`}<small>${v.d}</small></div>`;
  }
  h += `</div></div><div class="saveas"><span style="font-size:12px;white-space:nowrap">Save view as…</span><span class="inp">By book, with Stressed VaR</span><span class="seg2"><span class="on">Personal</span><span>Shared</span></span><span class="btn p">Save <kbd>Ctrl+S</kbd></span></div>`
    + `<div class="pf"><span><kbd>1</kbd>–<kbd>6</kbd>pick a ready-made view</span><span><kbd>Enter</kbd>open</span><span><kbd>Esc</kbd>close</span><span class="sp"></span><a>Manage views ›</a></div></div>`;
  return h;
}
function optC() {
  const g = `<div class="gridwrap"><div class="gscroll">${grid(cornerB())}</div>${gfoot()}</div>`;
  const mod = SCOPE==='pos';
  const name = SCOPE==='pos' ? 'Trades in my scope' : 'By book';
  return cap('Saved views + B: a View picker with ready-made trader layouts first; then B\'s compact line; Save view as… personal or shared.')
    + bar() + head()
    + `<div class="line" id="line"><span class="viewbtn ${OPEN?'open':''}" id="viewBtn"><small>View</small>${name}${mod?'':''}<span class="car">▾</span></span>`
    + `<span class="dot">│</span>${wellsLine(null)}</div>`
    + `<div class="main">${g}</div>` + keysB() + (OPEN ? viewsPicker() : '');
}

const app = $('#app');
app.innerHTML = OPT === 'A' ? optA() : OPT === 'B' ? optB() : optC();
/* place the popover under its anchor */
const pop = $('#pop');
if (pop) {
  const a = OPT === 'B' ? $('#rowsChip') : $('#viewBtn');
  if (a) { a.classList.add('open'); const r = a.getBoundingClientRect(); pop.style.left = (r.left + window.scrollX) + 'px'; pop.style.top = (r.bottom + 6 + window.scrollY) + 'px'; }
}
const ghost = $('#ghost');
if (ghost) {
  const drop = document.querySelector('.drop.hot'); const src = document.querySelector('.fi.dragging');
  if (drop && src) { const r = drop.getBoundingClientRect(); ghost.style.left = (r.left - 150) + 'px'; ghost.style.top = (r.top + 16) + 'px'; }
}
})();
</script>
</body>
