<title>The module developer path</title>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ae8a33a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e8a33a"/></marker><marker id="a2bb3a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2bb3a3"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker><marker id="a6a4fb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4fb3"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="725" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">The module developer path</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">From an empty folder to a signed module at a customer, with the command at each step.</text>
<path d="M24,84 L130,84 L148,114 L130,144 L24,144 Z" fill="#1f5fbf"/>
<text x="80" y="120" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">new</text>
<rect x="160" y="84" width="576" height="60" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="174" y="108" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">drishti.py module new genomics</text>
<text x="174" y="129" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the archetype: a parent pom and compute, service, python, packs, console, docs, test</text>
<path d="M24,154 L130,154 L148,184 L130,214 L24,214 Z" fill="#2bb3a3"/>
<text x="80" y="190" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">run</text>
<rect x="160" y="154" width="576" height="60" rx="8" fill="#dcf3f0" stroke="#2bb3a3" stroke-width="1.5"/>
<text x="174" y="178" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">drishti.py module run</text>
<text x="174" y="199" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the kernel + this module only, sample data; templates, Sutras, packs, static reload live</text>
<path d="M24,224 L130,224 L148,254 L130,284 L24,284 Z" fill="#1e8a55"/>
<text x="80" y="260" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">test</text>
<rect x="160" y="224" width="576" height="60" rx="8" fill="#dff1e7" stroke="#1e8a55" stroke-width="1.5"/>
<text x="174" y="248" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">mvn verify</text>
<text x="174" y="269" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">unit tests, the kernel harness, the conformance suite (the absence test too)</text>
<path d="M24,294 L130,294 L148,324 L130,354 L24,354 Z" fill="#e8a33a"/>
<text x="80" y="330" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">package</text>
<rect x="160" y="294" width="576" height="60" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="174" y="318" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">mvn package</text>
<text x="174" y="339" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">drishti:validate → compile → test → conformance → assemble the .dmod</text>
<path d="M24,364 L130,364 L148,394 L130,424 L24,424 Z" fill="#e8a33a"/>
<text x="80" y="400" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">sign</text>
<rect x="160" y="364" width="576" height="60" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="174" y="388" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">mvn deploy -Prelease</text>
<text x="174" y="409" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">drishti:sign with the publisher key (HSM), publish .dmod + .sha256</text>
<path d="M24,434 L130,434 L148,464 L130,494 L24,494 Z" fill="#6a4fb3"/>
<text x="80" y="470" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">install</text>
<rect x="160" y="434" width="576" height="60" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="174" y="458" font-size="14" font-weight="700" fill="#1a2333" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">drishti.py module install</text>
<text x="174" y="479" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">verify V1–V9 · four eyes · pages live at once · code at the rolling restart</text>
<rect x="24" y="510" width="346" height="118" rx="8" fill="#e3eaf3" stroke="#12324f" stroke-width="1.5"/>
<text x="36" y="532" font-size="14" font-weight="700" fill="#12324f" text-anchor="start">On the developer&#x27;s machine</text>
<text x="36" y="551" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">JDK 21 · Maven 3.9 · the kernel&#x27;s Python</text>
<text x="36" y="569" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">drishti-kernel-api (scope provided)</text>
<text x="36" y="587" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">drishti-kernel-testkit (scope test)</text>
<text x="36" y="605" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">a development key (taint D)</text>
<rect x="390" y="510" width="346" height="118" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="402" y="532" font-size="14" font-weight="700" fill="#e8a33a" text-anchor="start">In the publisher&#x27;s CI</text>
<text x="402" y="551" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the same mvn verify, then -Prelease</text>
<text x="402" y="569" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the signing key never in Git or on disks</text>
<text x="402" y="587" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">release notes · licence feature</text>
<text x="402" y="605" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the .dmod to the module repository</text>
<rect x="24" y="646" width="712" height="58" rx="8" fill="#dff1e7" stroke="#1e8a55" stroke-width="1.5"/>
<text x="36" y="668" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Customer: Admin → Modules → Install → verify report → a second administrator approves</text>
<text x="36" y="686" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">copied to the placed nodes only · fingerprint gossiped · remove and roll back with the same four eyes</text>
</svg>
