<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 726" width="760" height="726" role="img" aria-label="The module developer path" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
