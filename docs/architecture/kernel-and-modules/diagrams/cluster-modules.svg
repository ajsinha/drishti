<text x="24" y="432" font-size="12" font-weight="700" fill="#e8a33a" text-anchor="start">★ singleton: one elected runner among the placed nodes</text>
<rect x="24" y="446" width="712" height="64" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="36" y="468" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">Guards</text>
<text x="36" y="486" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">no default &#x27;all nodes&#x27; · heavy: max-nodes + memory check at activation · heavy on every node only with allow-all + four eyes</text>
