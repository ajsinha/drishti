<text x="36" y="216" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Drishti*net routes each part only to nodes where it is placed and active; failover inside the placement</text>
<rect x="24" y="270" width="170" height="140" rx="8" fill="#e3eaf3" stroke="#12324f" stroke-width="1.5"/>
