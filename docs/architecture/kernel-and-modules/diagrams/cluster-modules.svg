<text x="36" y="336" font-size="12" font-weight="400" fill="#1e8a55" text-anchor="start">banking  api</text>
<text x="36" y="356" font-size="12" font-weight="700" fill="#e8a33a" text-anchor="start">banking  feeds, jobs ★</text>
<text x="36" y="376" font-size="12" font-weight="400" fill="#1e8a55" text-anchor="start">genomics  api</text>
