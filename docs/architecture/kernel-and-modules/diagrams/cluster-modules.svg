<rect x="0.5" y="0.5" width="759" height="659" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">Modules in a cluster: placed, not everywhere</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">Each part on named nodes or roles, console parts on console nodes; others forward; drift in the matrix.</text>
<rect x="24" y="84" width="350" height="74" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="36" y="106" font-size="14" font-weight="700" fill="#6a4fb3" text-anchor="start">console-1  ·  console parts only</text>
<text x="36" y="125" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">role: console · banking ✓ · capitalmarkets ✓ · genomics ✓</text>
<rect x="386" y="84" width="350" height="74" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="398" y="106" font-size="14" font-weight="700" fill="#6a4fb3" text-anchor="start">console-research  ·  console parts only</text>
<text x="398" y="125" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">role: console (+ by name) · genomics ✓ (placed by name)</text>
