<text x="218" y="376" font-size="12" font-weight="700" fill="#1f5fbf" text-anchor="start">  VaR, FRTB, exposure</text>
<path d="M291,238 L291,268" fill="none" stroke="#12324f" stroke-width="1.8" marker-end="url(#a12324f)"/>
<rect x="388" y="270" width="170" height="140" rx="8" fill="#eceff4" stroke="#5c6a80" stroke-width="1.5" stroke-dasharray="6 4"/>
