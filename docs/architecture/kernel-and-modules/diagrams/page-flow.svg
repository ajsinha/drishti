<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" role="img" aria-label="A module page, request to data" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
