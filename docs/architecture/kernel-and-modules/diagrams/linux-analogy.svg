<rect x="0.5" y="0.5" width="759" height="537" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">The Linux-module analogy</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">The owner&#x27;s frame: modules are compiled and packaged apart, and the kernel runs them.</text>
<rect x="24" y="80" width="712" height="34" rx="6" fill="#12324f"/>
<text x="40" y="102" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Linux</text>
<text x="276" y="102" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Drishti</text>
<rect x="24" y="114" width="712" height="40" fill="#ffffff"/>
<text x="40" y="140" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">kernel</text>
<text x="276" y="140" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">Drishti kernel (server, console, Elements core, connectors)</text>
<rect x="24" y="154" width="712" height="40" fill="#e3eaf3"/>
<text x="40" y="180" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">.ko module</text>
<text x="276" y="180" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">.dmod module package</text>
<rect x="24" y="194" width="712" height="40" fill="#ffffff"/>
<text x="40" y="220" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">module ABI · vermagic</text>
<text x="276" y="220" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">kernel API version · manifest&#x27;s kernel: range</text>
<rect x="24" y="234" width="712" height="40" fill="#e3eaf3"/>
<text x="40" y="260" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">modinfo</text>
<text x="276" y="260" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">module.yaml · module info</text>
<rect x="24" y="274" width="712" height="40" fill="#ffffff"/>
<text x="40" y="300" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">depmod · modprobe</text>
<text x="276" y="300" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">requires: with version ranges, resolved first</text>
<rect x="24" y="314" width="712" height="40" fill="#e3eaf3"/>
<text x="40" y="340" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">module signing · Secure Boot</text>
<text x="276" y="340" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">signed .dmod · trusted publishers · licence</text>
<rect x="24" y="354" width="712" height="40" fill="#ffffff"/>
<text x="40" y="380" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">insmod · rmmod · lsmod</text>
<text x="276" y="380" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">module install · remove · list · Admin → Modules</text>
<rect x="24" y="394" width="712" height="40" fill="#e3eaf3"/>
<text x="40" y="420" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">taint</text>
<text x="276" y="420" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">Health: TAINTED (dev-signed, override …)</text>
<rect x="24" y="434" width="712" height="40" fill="#ffffff"/>
<text x="40" y="460" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">device drivers</text>
<text x="276" y="460" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">connectors: the kernel&#x27;s, bound to kinds</text>
<rect x="24" y="474" width="712" height="40" fill="#e3eaf3"/>
<text x="40" y="500" font-size="14" font-weight="700" fill="#12324f" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">distribution (Debian …)</text>
<text x="276" y="500" font-size="14" font-weight="400" fill="#1a2333" text-anchor="start">distribution file (drishti.finance …)</text>
<rect x="24" y="80" width="712" height="434" rx="6" fill="none" stroke="#cdd6e3"/>
<line x1="262" y1="80" x2="262" y2="514" stroke="#cdd6e3"/>
</svg>
