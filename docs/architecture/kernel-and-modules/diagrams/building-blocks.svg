<title>The three building blocks</title>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ae8a33a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e8a33a"/></marker><marker id="a2bb3a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2bb3a3"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker><marker id="a6a4fb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4fb3"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="671" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">The three building blocks</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">Drishti Kernel, Drishti Console and Drishti modules; every section of the design hangs off one of them.</text>
<rect x="24" y="84" width="712" height="40" rx="8" fill="#ffffff" stroke="#5c6a80" stroke-width="1.5"/>
<text x="380.0" y="106" font-size="13" font-weight="400" fill="#1a2333" text-anchor="middle">Browsers · phones · embeds  (talk to a console&#x27;s origin only)</text>
<path d="M258,124 L258,146" fill="none" stroke="#12324f" stroke-width="1.8" marker-end="url(#a12324f)"/>
<rect x="24" y="150" width="470" height="150" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="36" y="172" font-size="14" font-weight="700" fill="#6a4fb3" text-anchor="start">DRISHTI CONSOLE  ·  Data &amp; BI Console</text>
<text x="36" y="191" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">a separate Spring Boot web app (WebMVC, virtual threads)</text>
<text x="36" y="209" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">shell: header, lenses, themes, keys, Home, Help, search</text>
<text x="36" y="227" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Drishti Elements + Sutra renderer (the one UI static set)</text>
<text x="36" y="245" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">BI and pivot screens · Admin</text>
<text x="36" y="263" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">hosts modules&#x27; CONSOLE parts · in front of 1..n kernels</text>
<path d="M258,300 L258,326" fill="none" stroke="#1e8a55" stroke-width="1.8" marker-end="url(#a1e8a55)"/>
<text x="366" y="318" font-size="12" font-weight="400" fill="#5c6a80" text-anchor="middle" font-style="italic">REST as the person, per-kernel token</text>
<rect x="24" y="330" width="470" height="172" rx="8" fill="#e3eaf3" stroke="#12324f" stroke-width="1.5"/>
<text x="36" y="352" font-size="14" font-weight="700" fill="#12324f" text-anchor="start">DRISHTI KERNEL  ·  Data &amp; BI Kernel</text>
<text x="36" y="371" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the server (Spring Boot), domain-free</text>
<text x="36" y="389" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">connectors + bindings · lakes · data load, .ready</text>
<text x="36" y="407" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Sutra grammar · pivot, BI, aggregation · Explain</text>
<text x="36" y="425" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">registry &amp; access · audit</text>
<text x="36" y="443" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">cluster: Drishti*net, placement</text>
<text x="36" y="461" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">kernel-managed Python workers (sandboxed)</text>
<text x="36" y="479" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">hosts modules&#x27; SERVER parts</text>
<rect x="514" y="150" width="222" height="352" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="526" y="172" font-size="14" font-weight="700" fill="#1f5fbf" text-anchor="start">DRISHTI MODULES</text>
<text x="526" y="191" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">.dmod, signed · banking first</text>
<text x="526" y="209" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start"></text>
<text x="526" y="227" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">packs (kinds, contracts)</text>
<text x="526" y="245" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Java + Python compute</text>
<text x="526" y="263" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Sutras, composed pages</text>
<text x="526" y="281" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">a domain Elements library</text>
<text x="526" y="299" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">functions · lenses</text>
<text x="526" y="317" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Home cards · Help · feeds</text>
<text x="526" y="335" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start"></text>
<text x="526" y="353" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">declares its data needs;</text>
<text x="526" y="371" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">never brings connectors</text>
<path d="M512,220 L496,220" fill="none" stroke="#6a4fb3" stroke-width="1.8" marker-end="url(#a6a4fb3)"/>
<text x="505" y="210" font-size="11" font-weight="400" fill="#6a4fb3" text-anchor="end" font-style="italic">console part</text>
<path d="M512,420 L496,420" fill="none" stroke="#12324f" stroke-width="1.8" marker-end="url(#a12324f)"/>
<text x="505" y="410" font-size="11" font-weight="400" fill="#12324f" text-anchor="end" font-style="italic">server parts</text>
<text x="24" y="530" font-size="12" font-weight="700" fill="#5c6a80" text-anchor="start">THE GLUE</text>
<rect x="24" y="540" width="168" height="82" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="36" y="562" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">drishti-module-runtime</text>
<text x="36" y="580" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">one library, two hosts:</text>
<text x="36" y="597" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">kernel and console</text>
<rect x="204" y="540" width="168" height="82" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="216" y="562" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">distribution file</text>
<text x="216" y="580" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">white label: brand, theme,</text>
<text x="216" y="597" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">modules, lenses, docs</text>
<rect x="384" y="540" width="168" height="82" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="396" y="562" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">Module SDK</text>
<text x="396" y="580" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">kernel API · console API</text>
<text x="396" y="597" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Elements typings · tests</text>
<rect x="564" y="540" width="168" height="82" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="576" y="562" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">placement</text>
<text x="576" y="580" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">which node runs which part;</text>
<text x="576" y="597" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">consoles = role console</text>
<text x="380" y="650" font-size="13" font-weight="400" fill="#5c6a80" text-anchor="middle">the site&#x27;s data lives in lakes and sources the kernel reaches through its connectors</text>
</svg>
