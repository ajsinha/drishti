<title>One console, many kernels</title>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ae8a33a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e8a33a"/></marker><marker id="a2bb3a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2bb3a3"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker><marker id="a6a4fb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4fb3"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="605" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">One console, many kernels</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">Per-kernel route tables, tokens and breakers; one kernel down greys only its own pages.</text>
<rect x="24" y="84" width="712" height="40" rx="6" fill="#12324f"/>
<text x="40" y="109" font-size="14" font-weight="800" fill="#e8a33a" text-anchor="start">DRISHTI RESEARCH</text>
<rect x="196" y="93" width="132" height="22" rx="11" fill="#ffffff"/>
<text x="206" y="109" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">● Finance  ▾</text>
<text x="344" y="109" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">Home   Analyse   Build   Data   Admin   Help</text>
<text x="722" y="109" font-size="11" font-weight="400" fill="#cdd6e3" text-anchor="end">kernel switcher</text>
<rect x="24" y="140" width="712" height="150" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="36" y="162" font-size="13" font-weight="700" fill="#6a4fb3" text-anchor="start">One Drishti Console  ·  kernels: [finance, genomics]</text>
<rect x="40" y="176" width="330" height="100" rx="8" fill="#ffffff" stroke="#1e8a55" stroke-width="1.5"/>
<text x="52" y="198" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">connection: finance</text>
<text x="52" y="216" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">route table: banking, capitalmarkets, economy</text>
<text x="52" y="233" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">pool · limit · circuit breaker: closed</text>
<text x="52" y="250" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">token minted for finance only</text>
<rect x="390" y="176" width="330" height="100" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
<text x="402" y="198" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">connection: genomics</text>
<text x="402" y="216" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">route table: genomics</text>
<text x="402" y="233" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">pool · limit · circuit breaker: OPEN</text>
<text x="402" y="250" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">token minted for genomics only</text>
<path d="M205,290 L205,320" fill="none" stroke="#1e8a55" stroke-width="1.8" marker-end="url(#a1e8a55)"/>
<text x="270" y="310" font-size="12" font-weight="400" fill="#5c6a80" text-anchor="middle" font-style="italic">token A only</text>
<path d="M555,290 L555,320" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ac62828)"/>
<text x="620" y="310" font-size="12" font-weight="400" fill="#5c6a80" text-anchor="middle" font-style="italic">token B only</text>
<rect x="24" y="324" width="350" height="70" rx="8" fill="#dff1e7" stroke="#1e8a55" stroke-width="1.5"/>
<text x="36" y="346" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">Finance production cluster</text>
<text x="36" y="364" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">healthy · roles per kernel (/api/v1/me)</text>
<rect x="386" y="324" width="350" height="70" rx="8" fill="#fbe3e3" stroke="#c62828" stroke-width="1.5"/>
<text x="398" y="346" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">Genomics cluster</text>
<text x="398" y="364" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">not answering · only its pages grey</text>
<rect x="24" y="410" width="712" height="176" rx="8" fill="#ffffff" stroke="#5c6a80" stroke-width="1.5"/>
<text x="36" y="432" font-size="13" font-weight="700" fill="#5c6a80" text-anchor="start">What a person sees (the union, labelled per kernel)</text>
<text x="36" y="450" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Analyse menu:  VaR (Finance) | Exposure (Finance) | Variant explorer (Genomics, unavailable)</text>
<text x="36" y="467" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Home:  VaR card (Finance) live | Cohorts card (Genomics) → notice &#x27;Genomics is not answering&#x27;</text>
<text x="36" y="484" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Search:  fan-out to both kernels, hits labelled; genomics hits omitted with a note</text>
<text x="36" y="501" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Kernel pages:  /k/finance/pivot, /k/genomics/pivot (a link always opens on its kernel)</text>
<text x="36" y="518" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Module pages:  /m/banking/…, /m/genomics/… (each module belongs to exactly one kernel)</text>
<text x="36" y="535" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">Never:  one kernel&#x27;s token or data sent to another kernel</text>
</svg>
