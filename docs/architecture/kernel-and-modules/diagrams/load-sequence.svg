<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 748" width="760" height="748" role="img" aria-label="Loading a module" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
