<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">The tiers: browser, Drishti Console, Drishti Kernel, Python workers</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">Consoles hold no data and run no compute; kernels serve no pages; Python runs only on kernel workers.</text>
