<text x="36" y="570" font-size="14" font-weight="700" fill="#12324f" text-anchor="start">How a kind finds its data (first hit wins)</text>
<text x="36" y="589" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">1  the site&#x27;s binding        2  the distribution&#x27;s default</text>
<text x="36" y="607" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">3  a lake table named by the contract&#x27;s hint (AUTO, confirm)</text>
<text x="36" y="625" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">4  the demo lake while demo is on (DEMO)    5  otherwise UNBOUND</text>
<text x="36" y="643" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">One binding per kind, shared by every module · contract ranges must meet</text>
<text x="36" y="661" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Changes: four eyes, audited, hot · credentials only in the kernel&#x27;s secret store</text>
