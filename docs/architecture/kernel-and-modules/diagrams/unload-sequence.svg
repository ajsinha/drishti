<title>Offloading a module</title>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ae8a33a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e8a33a"/></marker><marker id="a2bb3a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2bb3a3"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="739" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f">Offloading a module</text>
<text x="24" y="60" font-size="13" fill="#5c6a80">Ordered, server and console: refuse first, then drain, then withdraw every surface; data and saved work stay.</text>
<rect x="24" y="84" width="520" height="52" rx="8" fill="#e3eaf3" stroke="#12324f" stroke-width="1.5"/>
<text x="36" y="106" font-size="13" font-weight="700" fill="#12324f" text-anchor="start">0  Approved</text>
<text x="36" y="124" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">four eyes (remove) or the switch (disable) · cluster config version N+1</text>
<path d="M284,136 L284,148" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="148" width="520" height="52" rx="8" fill="#fbe3e3" stroke="#c62828" stroke-width="1.5"/>
<text x="36" y="170" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">1  Gate closes</text>
<text x="36" y="188" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">registry: module LEAVING · new requests refused · route entries → tombstones</text>
<path d="M284,200 L284,212" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="212" width="520" height="52" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="36" y="234" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">2  Tell</text>
<text x="36" y="252" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">module.leaving on the bus and drishti-net · open tabs get the notice</text>
<path d="M284,264 L284,276" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="276" width="520" height="52" rx="8" fill="#fbefd9" stroke="#e8a33a" stroke-width="1.5"/>
<text x="36" y="298" font-size="13" font-weight="700" fill="#e8a33a" text-anchor="start">3  Drain</text>
<text x="36" y="316" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">in-flight requests ≤ 30 s · jobs, feeds, Python runs: cancel after 60 s</text>
<path d="M284,328 L284,340" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="340" width="520" height="52" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="36" y="362" font-size="13" font-weight="700" fill="#1f5fbf" text-anchor="start">4  Withdraw contributions</text>
<text x="36" y="380" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">SPIs · functions, words · AI tools · exports · KindProviders · caches</text>
<path d="M284,392 L284,404" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="404" width="520" height="52" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="36" y="426" font-size="13" font-weight="700" fill="#1f5fbf" text-anchor="start">5  Withdraw content</text>
<text x="36" y="444" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">packs · Sutras · lenses · menus · Home cards · Help · search · glossary</text>
<path d="M284,456 L284,468" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="468" width="520" height="52" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="36" y="490" font-size="13" font-weight="700" fill="#1f5fbf" text-anchor="start">6  Console</text>
<text x="36" y="508" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">template namespace · static mount · Elements entries · hooks · settings pages</text>
<path d="M284,520 L284,532" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="532" width="520" height="52" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="36" y="554" font-size="13" font-weight="700" fill="#1f5fbf" text-anchor="start">7  Server</text>
<text x="36" y="572" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">stop() · child context closed (REST gone) · Python path removed · loader dropped (P5)</text>
<path d="M284,584 L284,596" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="596" width="520" height="52" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="36" y="618" font-size="13" font-weight="700" fill="#6a4fb3" text-anchor="start">8  Mark saved artefacts</text>
<text x="36" y="636" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">views, workspaces, dashboards, reports, exports: &#x27;needs module X&#x27;</text>
<path d="M284,648 L284,660" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="24" y="660" width="520" height="52" rx="8" fill="#dff1e7" stroke="#1e8a55" stroke-width="1.5"/>
<text x="36" y="682" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">9  Record</text>
<text x="36" y="700" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">audit line · metrics series ended · Health REMOVED · fingerprint · module.removed</text>
<rect x="568" y="84" width="168" height="180" rx="8" fill="#dff1e7" stroke="#1e8a55" stroke-width="1.5"/>
<text x="580" y="106" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">Stays</text>
<text x="580" y="124" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">the lake data</text>
<text x="580" y="141" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">bindings (orphaned)</text>
<text x="580" y="158" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">users&#x27; saved items</text>
<text x="580" y="175" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">  (marked, kept)</text>
<text x="580" y="192" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">the .dmod files</text>
<text x="580" y="209" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">  (until prune)</text>
<text x="580" y="226" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">its state folder</text>
<rect x="568" y="280" width="168" height="162" rx="8" fill="#fbe3e3" stroke="#c62828" stroke-width="1.5"/>
<text x="580" y="302" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">Gone</text>
<text x="580" y="320" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">every page (410)</text>
<text x="580" y="337" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">every word, menu,</text>
<text x="580" y="354" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">card, Help page,</text>
<text x="580" y="371" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">search hit, asset,</text>
<text x="580" y="388" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">API, job, AI tool,</text>
<text x="580" y="405" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">cache entry</text>
<rect x="568" y="458" width="168" height="170" rx="8" fill="#ffffff" stroke="#12324f" stroke-width="1.5"/>
<text x="580" y="480" font-size="13" font-weight="700" fill="#12324f" text-anchor="start">P2 restart?</text>
<text x="580" y="498" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">disappearance: no</text>
<text x="580" y="515" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">(steps 0–6, 8, 9 hot)</text>
<text x="580" y="532" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">code unload: at the</text>
<text x="580" y="549" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">next rolling restart</text>
<text x="580" y="566" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">P5: all hot, with</text>
<text x="580" y="583" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">the leak check</text>
</svg>
