# EXAMPLE (design, not built): the distribution file of Drishti Genomics, a HYPOTHETICAL product built from the same kernel and a sample
# genomics module (docs/architecture/KERNEL_AND_MODULES.md section 6). Its proof (phase P3): it boots from configuration only, and no banking
# word, page, Help page, function or asset appears anywhere. Never shipped to customers (question Q10).
format: 1
distribution: drishti.genomics
version: 0.1.0
kernel: ">=2.9.11 <2.10"

brand:
  product: Drishti Genomics
  product_native: ""
  tagline: "Cohorts, variants and samples. One grammar."
  owner: Ashutosh Sinha
  copyright: "Copyright © 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential."
  logo: { light: brand/genomics-logo-light.svg, dark: brand/genomics-logo-dark.svg }
  favicon: brand/genomics-favicon.svg
  about: brand/about-genomics.md

theme:
  tokens: genomics-teal
  overrides: { --ac: "#2bb3a3", --ln: "#8fd3ff" }
  mode: light
  density: comfortable

modules:
  - { id: genomics, version: ">=0.1 <1", required: true, enabled: true }   # the SDK's genomics-sample module
  # no banking, capitalmarkets or economy: their packs, functions, lenses, Help and files do not exist here

lenses:
  offered: [cohorts, variants, lab, cio]
  default: cohorts

home:
  cohorts:  { landing: home/cohorts_landing.html, cards: [COHORT BRCA-2026, "VARIANT chr17:43044295", SAMPLE S-00042, QC RUN-118] }
  welcome: "Cohorts, variant calls and sample QC for your studies."

menus:
  order: [Home, Cohorts, Variants, Lab, Analyse, Build, Data, Admin, Help]

features:
  bi: on
  python: on
  designer: on
  datamap: on

docs:
  title: Drishti Genomics Help
  sections: [get-started, genomics, analytics, data, build, admin, reference]   # kernel sections + the genomics module's
  tutorials: { first: [genomics-01-a-cohort-from-vcf] }

bindings:
  defaults:
    convention: genolake                   # a lake the site configures (config/lakes/genolake.yaml); kinds by their binding-hints

demo: { ships: true, enabled: true }       # the genomics module's samples (synthetic cohorts)
locale: { language: en, number: "#,##0.###", date: yyyy-MM-dd }
glossary: docs/genomics/glossary.yaml
