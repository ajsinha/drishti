# FRTB standardised approach, sensitivities-based method: the parameters (design draft; docs/architecture/SENSITIVITIES_AND_FRTB_SA.md
# section 5). Source: Basel Committee on Banking Supervision, "Minimum capital requirements for market risk", the consolidated Basel
# Framework chapter MAR21 (version effective 1 January 2023). Each block names its paragraph. Values are the Basel text's; a
# jurisdiction's rule (OSFI CAR chapter 9, the EU CRR3, the US proposal) may differ, and a bank's copy of this file says which it follows
# in `regime` and is checked by the engine at start (a parameter out of its allowed range refuses the file).
#
# At build time this file moves to the market-risk pack's configuration (one file per regime); the engine reads only the copy there.

regime: BCBS-MAR21
source: https://www.bis.org/basel_framework/chapter/MAR/21.htm
scenarios:                           # MAR21.6: the three correlation scenarios, applied to every rho and gamma below; for curvature
                                     # applied to the squared correlation (MAR21.100-101): square first, then the scenario
  medium: {formula: "rho"}
  high: {formula: "min(1.25 * rho, 1)"}
  low: {formula: "max(2 * rho - 1, 0.75 * rho)"}

GIRR:
  delta:
    tenors: [0.25, 0.5, 1, 2, 3, 5, 10, 15, 20, 30]            # MAR21.8(1)
    risk-weights: [0.017, 0.017, 0.016, 0.013, 0.012, 0.011, 0.011, 0.011, 0.011, 0.011]   # MAR21.42
    inflation-risk-weight: 0.016                                # MAR21.43
    cross-currency-basis-risk-weight: 0.016                     # MAR21.43
    specified-currencies: [EUR, USD, GBP, AUD, JPY, SEK, CAD]   # MAR21.44: risk weights may be divided by sqrt(2), and the reporting currency
    specified-divisor: 1.4142135623730951
    within-bucket:                                              # MAR21.46-49
      tenor-correlation: "max(exp(-theta * abs(Tk - Tl) / min(Tk, Tl)), 0.40)"
      theta: 0.03
      same-tenor-different-curve: 0.999
      inflation-to-curve: 0.40
      basis-to-anything: 0.0
    across-buckets: 0.50                                        # MAR21.50 (gamma)
  vega:
    risk-weight: 1.0                                            # MAR21.92: min(55% * sqrt(LH / 10), 100%), LH 60 for GIRR
    option-maturity-correlation: "exp(-alpha * abs(Tk - Tl) / min(Tk, Tl))"   # MAR21.93, and the same form on the underlying maturities
    alpha: 0.01
    across-buckets: 0.50                                        # MAR21.95
  curvature:
    factor: currency                                            # MAR21.8: every curve of the currency shifted together; no inflation or basis
    shock: highest-delta-risk-weight                            # MAR21.99: a parallel shift of every tenor by the 0.25-year risk weight
    correlation: delta-squared                                  # MAR21.100-101: the delta correlations squared, within and across

CSR_NS:
  delta:
    tenors: [0.5, 1, 3, 5, 10]                                  # MAR21.8(2)
    risk-weights:                                               # MAR21.53, by bucket
      1: 0.005    # sovereigns incl. central banks, multilateral development banks (IG)
      2: 0.010    # local governments, government-backed non-financials, education, public administration (IG)
      3: 0.050    # financials incl. government-backed financials (IG)
      4: 0.030    # basic materials, energy, industrials, agriculture, manufacturing, mining (IG)
      5: 0.030    # consumer goods and services, transportation and storage, administrative and support services (IG)
      6: 0.020    # technology, telecommunications (IG)
      7: 0.015    # health care, utilities, professional and technical activities (IG)
      8: 0.025    # covered bonds (MAR21.53 footnote: AA- or better may use 1.5%)
      9: 0.020    # sovereigns (HY and not rated)
      10: 0.040   # local governments ... (HY and not rated)
      11: 0.120   # financials (HY and not rated)
      12: 0.070   # basic materials ... (HY and not rated)
      13: 0.085   # consumer goods ... (HY and not rated)
      14: 0.055   # technology, telecommunications (HY and not rated)
      15: 0.050   # health care ... (HY and not rated)
      16: 0.120   # other sector
      17: 0.015   # IG indices
      18: 0.050   # HY indices
    within-bucket:                                              # MAR21.54 (buckets 1-15): the product of the three
      same-name: 1.0
      different-name: 0.35
      different-name-index-buckets: 0.80                        # MAR21.55: buckets 17 and 18
      same-tenor: 1.0
      different-tenor: 0.65
      same-basis: 1.0
      different-basis: 0.999                                    # bond curve against CDS curve
    other-sector-bucket: absolute-sum                           # MAR21.56: bucket 16 adds absolute weighted sensitivities, no correlation
    across-buckets:
      rating: {same: 1.0, different: 0.5}                       # MAR21.57: gamma = gamma_rating * gamma_sector; 0.5 only between IG and HY buckets of 1-15
      sector: see-MAR21.57-table                                # the sector table: copied in the bank's copy of this file, by bucket pair
  vega:
    risk-weight: 1.0                                            # MAR21.92, LH 120
    option-maturity-correlation: "exp(-alpha * abs(Tk - Tl) / min(Tk, Tl))"
    alpha: 0.01
  curvature:
    factor: issuer                                              # MAR21.9: bond and CDS curves of the issuer as one curve
    shock: bucket-delta-risk-weight                             # MAR21.99: a parallel shift of the issuer's curve by the bucket's risk weight
    correlation: name-only-squared                              # MAR21.100: rho_name squared; tenor and basis do not apply

EQ:
  delta:
    risk-weights:                                               # MAR21.77: spot, then repo
      spot: {1: 0.55, 2: 0.60, 3: 0.45, 4: 0.55, 5: 0.30, 6: 0.35, 7: 0.40, 8: 0.50, 9: 0.70, 10: 0.50, 11: 0.70, 12: 0.15, 13: 0.25}
      repo: {1: 0.0055, 2: 0.0060, 3: 0.0045, 4: 0.0055, 5: 0.0030, 6: 0.0035, 7: 0.0040, 8: 0.0050, 9: 0.0070, 10: 0.0050, 11: 0.0070,
             12: 0.0015, 13: 0.0025}
    within-bucket:                                              # MAR21.78-79
      spot-repo-same-name: 0.999
      large-cap-emerging: 0.15        # buckets 1-4
      large-cap-advanced: 0.25        # buckets 5-8
      small-cap-emerging: 0.075       # bucket 9
      small-cap-advanced: 0.125       # bucket 10
      indices: 0.80                   # buckets 12-13
      other-sector-bucket: absolute-sum   # bucket 11 (MAR21.79)
    across-buckets:                                             # MAR21.80
      buckets-1-to-10: 0.15
      with-bucket-11: 0.0
      buckets-12-and-13: 0.75
      bucket-12-or-13-with-1-to-10: 0.45
  vega:
    risk-weight: {large-cap-and-indices: 0.7778, small-cap-and-other: 1.0}  # MAR21.92: LH 20 (buckets 1-8, 12, 13) and 60 (9-11)
  curvature:
    factor: spot                                                # MAR21.12: no curvature for repo
    shock: bucket-delta-risk-weight                             # MAR21.98: a relative shift equal to the delta risk weight
    correlation: delta-squared

COMM:
  delta:
    tenors: [0, 0.25, 0.5, 1, 2, 3, 5, 10, 15, 20, 30]          # MAR21.8(4)
    risk-weights: {1: 0.30, 2: 0.35, 3: 0.60, 4: 0.80, 5: 0.40, 6: 0.45, 7: 0.20, 8: 0.35, 9: 0.25, 10: 0.35, 11: 0.50}   # MAR21.82
    within-bucket:                                              # MAR21.83: rho_commodity * rho_tenor * rho_basis
      commodity: {1: 0.55, 2: 0.95, 3: 0.40, 4: 0.80, 5: 0.60, 6: 0.65, 7: 0.55, 8: 0.45, 9: 0.15, 10: 0.40, 11: 0.15}
      different-tenor: 0.99
      different-location: 0.999
    across-buckets: {default: 0.20, with-bucket-11: 0.0}         # MAR21.85
  vega:
    risk-weight: 1.0                                            # MAR21.92, LH 120
  curvature:
    factor: commodity                                           # MAR21.13: the whole curve of the commodity
    shock: bucket-delta-risk-weight                             # MAR21.99: a parallel shift of every tenor by the bucket's risk weight
    correlation: commodity-only-squared                         # MAR21.100: rho_commodity squared; tenor and location do not apply

FX:
  delta:
    risk-weight: 0.15                                           # MAR21.87
    specified-pairs-divisor: 1.4142135623730951                 # MAR21.88: the specified currency pairs (the bank's copy lists them)
    across-buckets: 0.60                                        # MAR21.89
  vega:
    risk-weight: 1.0                                            # MAR21.92, LH 40: min(55% * 2, 100%)
  curvature:
    shock: delta-risk-weight                                    # MAR21.98: a relative shift equal to the delta risk weight
    correlation: delta-squared
    divisor: 1.5                                                # MAR21.98: CVR+ and CVR- of options not referencing the reporting currency
    divisor-all-fx-instruments: false                           # MAR21.98: every FX instrument, only with the supervisor's approval
