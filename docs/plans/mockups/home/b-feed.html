<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home, option B: Feed</title>
<style>:root{--bg:#f4f6f9;--card:#fff;--ink:#17202c;--muted:#566272;--line:#e1e6ed;--soft:#eef2f7;--accent:#1f5fbf;--accent-ink:#fff;--red:#b3202a;--redbg:#fdecee;--amber:#8a5a00;--amberdot:#d99a00;--amberbg:#fff6e0;--green:#1b7443;--greenbg:#e7f5ec;--shadow:0 1px 2px rgba(20,30,50,.06);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=dark]{--bg:#0e131a;--card:#161d27;--ink:#e7ecf3;--muted:#9eabbc;--line:#263140;--soft:#1d2733;--accent:#78aeff;--accent-ink:#0b1320;--red:#ff7b7b;--redbg:#3a1a1e;--amber:#e7b94a;--amberdot:#e3b341;--amberbg:#33290f;--green:#56c98e;--greenbg:#12301f;--shadow:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.big{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* mock-up controls (not part of the product) */
.mock{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;background:#101826;color:#dbe3ee;font-size:12px;position:sticky;top:0;z-index:30}
.mock b{letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#8fa3bd}
.mock .grp{display:flex;gap:2px;align-items:center}
.mock button{background:#1b2638;border:1px solid #2c3a52;color:#dbe3ee;padding:3px 10px;border-radius:5px;font-size:12px}
.mock button[aria-pressed=true]{background:#dbe3ee;color:#101826;border-color:#dbe3ee}
.mock a{color:#9cc2ff}
.stage{padding:18px 16px 60px}
.frame{container:frame/inline-size;max-width:1240px;margin:0 auto;transition:max-width .2s}
.frame.phone{max-width:390px;border:1px solid var(--line);border-radius:22px;padding:12px;background:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.12)}
/* app header */
.app{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.brand{font-weight:700;letter-spacing:.02em;font-size:16px;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);text-align:left}
.lbs{display:none}.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--soft)}
.ghost{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;color:var(--muted)}
.ghost:hover{background:var(--soft);color:var(--ink)}
.user{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.greet h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.fresh{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
.dot.late{background:var(--amberdot)}.dot.red{background:var(--red)}
/* needs you */
.needs{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amberdot);border-radius:10px;padding:10px 14px;margin:14px 0;box-shadow:var(--shadow)}
.needs h2{font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.need{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.need:first-of-type{border-top:0}
.need .t{flex:1}.need .t small{display:block;color:var(--muted)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--amberbg);color:var(--amber)}.tag.breach{background:var(--redbg);color:var(--red)}.tag.ok{background:var(--greenbg);color:var(--green)}.tag.info{background:var(--soft);color:var(--muted)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 11px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.pri:hover{color:var(--accent-ink);opacity:.9}
.calm{color:var(--muted);padding:8px 0;font-size:13px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;min-width:0}
.card.drag{opacity:.45}.card.over{outline:2px dashed var(--accent)}
.card h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;display:flex;gap:6px;align-items:center}
.card h3 .pin{color:var(--accent)}
.big{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.big small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.delta{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta.bad{color:var(--amber)}.delta.good{color:var(--green)}.delta.breach{color:var(--red);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.spark{display:block;overflow:visible}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--accent);opacity:.08;stroke:none}.spark circle{fill:var(--accent)}
.spark.warn path:not(.area){stroke:var(--amberdot)}.spark.warn circle{fill:var(--amberdot)}.spark.warn .area{fill:var(--amberdot)}
.spark.breach path:not(.area){stroke:var(--red)}.spark.breach circle{fill:var(--red)}
.sub{color:var(--muted);font-size:13px}
.rows{margin:8px 0 0;padding:0;list-style:none}
.rows li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.rows li .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rows li .v{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;width:90px;flex:none}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}.bar.warn i{background:var(--amberdot)}.bar.breach i{background:var(--red)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .12s;margin-left:auto}
.card:hover .acts,.card:focus-within .acts,.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.ib{background:none;border:1px solid transparent;border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:0}
.ib:hover:not(:disabled){background:var(--soft);color:var(--ink)}.ib:disabled{opacity:.3;cursor:default}.ib[aria-pressed=true]{color:var(--accent)}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px}
.exp{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px}
.exp:hover{text-decoration:underline}
.hidden-note{color:var(--muted);font-size:13px;margin-top:12px}
/* overlays */
#palette{position:fixed;inset:0;background:rgba(10,16,26,.5);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
#palette.open{display:flex}
.pal{width:min(560px,94vw);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:14px 16px;font:16px var(--sans);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:7px 10px;border-radius:7px;display:flex;gap:10px;cursor:pointer}
.pal li b{font-family:var(--mono);font-weight:600;min-width:130px}.pal li span{color:var(--muted)}
.pal li[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}.pal li[aria-selected=true] span{color:inherit;opacity:.85}
.pal .gh{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 2px;cursor:default}
.pal .ft{padding:7px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
#explain{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .18s;z-index:40;padding:18px 20px;overflow:auto}
#explain.open{transform:none}
#explain h2{margin:0 0 2px;font-size:17px}#explain dl{margin:14px 0}#explain dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:12px}#explain dd{margin:2px 0 0}
#explain .x{position:absolute;top:10px;right:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101826;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
@container frame (max-width:700px){.search span.lbl,.hide-s{display:none}.search span.lbs{display:inline}.greet h1{font-size:19px}.need{flex-wrap:wrap}.big{font-size:25px}.app{flex-wrap:wrap}.user .nm{display:none}.acts{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi .big{font-size:24px}
.feed{list-style:none;margin:0;padding:0;max-width:820px}
.item{display:flex;gap:12px;position:relative}
.item .tl{width:14px;flex:none;display:flex;flex-direction:column;align-items:center}
.item .tl::after{content:"";flex:1;width:2px;background:var(--line);margin-top:4px}
.item .tl .dot{margin-top:8px}
.item .body{flex:1;padding:6px 0 14px;min-width:0}
.item.old{opacity:.7}
.exb{background:none;border:0;text-align:left;padding:0;flex:1;min-width:0}
.exb:hover{text-decoration:underline}.exb::after{content:" \25BE";color:var(--muted)}
.item.open .exb::after{content:" \25B4"}
.more{display:none;margin:8px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.item.open .more{display:block}.more .row{margin-top:8px;gap:16px}
.div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:2px 0 8px 26px}.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
.more p{margin:0}
@container frame (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpis .card:nth-child(3){grid-column:1/-1}}

const CMDS=[['Risk','VAR BANK','VaR 99% for the whole bank'],['Risk','VAR DESK-CREDIT','VaR for a desk'],['Risk','ES BANK','Expected shortfall'],['Risk','LIM LE-NY','Limit LE-NY and its history'],['Risk','BT BANK','Backtest and exceptions'],

 ['Genomics','GENE HLXK7','Gene HLXK7 (genomics module)'],['Data','LOAD STATUS','Daily loads and freshness'],['Data','SUTRA NEW','New Sutra query'],['Admin','ADMIN CLUSTER','Nodes and engines'],['Admin','ADMIN ACCESS','Users and access requests'],
 ['All content','FUNCTIONS','Browse the full functions list'],['All content','HELP','Guides and tutorials'],['All content','HOME','Back to this Home']];
/* state */
const KEY='drishtiHomeMock.'+OPT;
let S={role:'risk',theme:'light',phone:false,empty:false,hidden:{},pinned:{},order:{},hint:{}};
try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(S,JSON.parse(j));}catch(e){}
try{const p=new URLSearchParams(location.search);if(p.get('role')&&ROLES[p.get('role')])S.role=p.get('role');if(p.get('theme'))S.theme=p.get('theme');if(p.get('phone'))S.phone=p.get('phone')==='1';if(p.get('empty'))S.empty=p.get('empty')==='1';}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=()=>ROLES[S.role];
const card=id=>R().cards.find(c=>c.id===id);
function allIds(){const base=[...R().cards].sort((a,b)=>b.score-a.score).map(c=>c.id);const o=(S.order[S.role]||[]).filter(i=>base.includes(i));return o.concat(base.filter(i=>!o.includes(i)));}
function visIds(){const h=S.hidden[S.role]||[],p=S.pinned[S.role]||[];const v=allIds().filter(i=>!h.includes(i));return v.filter(i=>p.includes(i)).concat(v.filter(i=>!p.includes(i)));}
const isPinned=id=>(S.pinned[S.role]||[]).includes(id);
function toggle(map,id){const a=map[S.role]=map[S.role]||[];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);}
function move(id,dir){const v=visIds(),i=v.indexOf(id),j=i+dir;if(j<0||j>=v.length||isPinned(v[j])!==isPinned(id))return;[v[i],v[j]]=[v[j],v[i]];S.order[S.role]=v.concat(allIds().filter(x=>!v.includes(x)));}
function dropOn(src,dst){if(src===dst||isPinned(src)!==isPinned(dst))return;const v=visIds().filter(x=>x!==src);v.splice(v.indexOf(dst),0,src);S.order[S.role]=v.concat(allIds().filter(x=>!v.includes(x)));}
/* helpers */
function spark(a,w,h,cls){if(!a)return'';const mn=Math.min(...a),mx=Math.max(...a),sp=(mx-mn)||1,pts=a.map((v,i)=>[(i*(w-4)/(a.length-1)+2).toFixed(1),(h-3-(v-mn)/sp*(h-6)).toFixed(1)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join('');const l=pts[pts.length-1];
 return `<svg class="spark ${cls||''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="trend, last ${a.length} days"><path class="area" d="${d}L${l[0]} ${h}L2 ${h}Z"/><path d="${d}"/><circle cx="${l[0]}" cy="${l[1]}" r="2.4"/></svg>`;}
function delta(c){const d=c.d,ar=d.dir==='up'?'▲':d.dir==='down'?'▼':'●';return `<span class="delta ${d.bad}">${ar} ${esc(d.v)} <span class="hide-s">${esc(d.txt)}</span></span>`;}
function rowsHTML(c,n){if(!c.rows)return'';return '<ul class="rows">'+c.rows.slice(0,n||9).map(r=>{if(typeof r[1]==='number'){return `<li><span class="k">${esc(r[0])}</span><span class="bar ${r[2]||''}" aria-hidden="true"><i style="width:${Math.min(100,r[1])}%"></i></span><span class="v">${r[1]}%${r[2]==='breach'?' <span class="tag breach">breach</span>':''}</span></li>`;}return `<li><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></li>`;}).join('')+'</ul>';}
function acts(c,vis){const i=vis.indexOf(c.id),n=vis.length,p=isPinned(c.id);const up=i<1||isPinned(vis[i-1])!==p,dn=i>=n-1||isPinned(vis[i+1])!==p;
 return `<span class="acts" role="group" aria-label="Card options for ${esc(c.title)}"><button class="ib" data-act="pin" data-id="${c.id}" aria-pressed="${p}" title="${p?'Unpin':'Pin to top'}" aria-label="${p?'Unpin':'Pin'} ${esc(c.title)}">&#9733;</button><button class="ib" data-act="up" data-id="${c.id}" ${up?'disabled':''} title="Move up" aria-label="Move ${esc(c.title)} up">&#8593;</button><button class="ib" data-act="down" data-id="${c.id}" ${dn?'disabled':''} title="Move down" aria-label="Move ${esc(c.title)} down">&#8595;</button><button class="ib" data-act="hide" data-id="${c.id}" title="Hide card" aria-label="Hide ${esc(c.title)}">&#10005;</button></span>`;}
function needsHTML(){const n=R().needs;if(S.empty)return '';return `<section class="needs" aria-label="Needs you"><h2>Needs you (${n.length})</h2>${n.map((x,i)=>`<div class="need"><span class="tag ${x.tag}">${esc(x.tl)}</span><div class="t">${esc(x.t)}<small>${esc(x.s)}</small></div><button class="btn" data-act="go" data-cmd="${esc(x.cmd)}">${esc(x.go)}</button><button class="ib" data-act="snooze" data-i="${i}" title="Snooze until tomorrow" aria-label="Snooze: ${esc(x.t)}">&#8987;</button></div>`).join('')}</section>`;}
function freshHTML(){const f=R().fresh;return `<div class="fresh"><span class="dot ${f.late?'late':''}"></span><span>${esc(f.text)}${f.late?' &middot; <b style="color:var(--amber);font-weight:600">'+esc(f.note)+'</b>':' &middot; '+esc(f.note)}</span></div>`;}
function greetHTML(){const r=R();return `<div class="greet"><h1>Good morning, ${esc(r.user.split(' ')[0])}</h1>${freshHTML()}</div>`;}
function hiddenHTML(){const h=S.hidden[S.role]||[];if(!h.length)return'';return `<p class="hidden-note">${h.length} hidden: ${h.map(i=>`<button class="link" data-act="restore" data-id="${i}">${esc(card(i).title)}</button>`).join(', ')}</p>`;}
function digestHTML(){return `<ul class="rows">${R().digest.map(x=>`<li><span class="k" style="white-space:normal">${esc(x)}</span></li>`).join('')}</ul>`;}
function appHeader(){const r=R();return `<header class="app"><div class="brand"><i></i>Drishti</div><button class="search" data-act="pal" aria-label="Open command bar"><span aria-hidden="true">&#8981;</span><span class="lbl">Jump to anything: VAR BANK, GENE HLXK7, TRD T-1</span><span class="lbs">Jump to anything</span><kbd>Ctrl K</kbd></button><button class="ghost hide-s" data-act="browse">All functions</button><div class="user"><span class="nm">${esc(r.title)}</span><span class="avatar" aria-hidden="true">${r.init}</span></div></header>`;}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200);}
/* explain */
let lastFocus=null;
function explain(id){const c=card(id);if(!c)return;lastFocus=document.activeElement;const x=c.ex,p=$('#explain');
 p.innerHTML=`<button class="ib x" data-act="xclose" aria-label="Close explanation">&#10005;</button><h2 id="exh">${esc(c.title)}</h2><div class="big num">${esc(c.big)}<small>${esc(c.unit)}</small></div><div>${delta(c)}</div><dl><dt>How it was calculated</dt><dd>${esc(x.how)}</dd><dt>Sources</dt><dd>${esc(x.src)}</dd><dt>As of</dt><dd class="num">${esc(x.asof)}</dd><dt>Compared with</dt><dd>${esc(x.cmp)}</dd></dl><button class="btn pri" data-act="go" data-cmd="${esc(x.open)}">Open ${esc(x.open)}</button>`;
 p.setAttribute('role','dialog');p.setAttribute('aria-labelledby','exh');p.classList.add('open');$('.x',p).focus();}
function xclose(){const p=$('#explain');p.classList.remove('open');if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();}
/* palette */
let pi=0,plist=[];
function palOpen(browse){const p=$('#palette');p.classList.add('open');lastFocus=lastFocus||document.activeElement;const i=$('#pin');i.value='';palRender();i.focus();}
function palClose(){$('#palette').classList.remove('open');}
function palRender(){const q=$('#pin').value.trim().toLowerCase();plist=CMDS.filter(c=>!q||(c[1]+' '+c[2]+' '+c[0]).toLowerCase().includes(q));if(pi>=plist.length)pi=0;let g='',h='';plist.forEach((c,i)=>{if(!q&&c[0]!==g){g=c[0];h+=`<li class="gh" role="presentation">${esc(g)}</li>`;}h+=`<li role="option" id="po${i}" data-i="${i}" aria-selected="${i===pi}"><b>${esc(c[1])}</b><span>${esc(c[2])}</span></li>`;});
 $('#plist').innerHTML=h||'<li class="gh">No match. Try VAR, TRD, GENE, EXP.</li>';$('#pin').setAttribute('aria-activedescendant',plist.length?'po'+pi:'');}
function palGo(c){palClose();toast('Would open: '+(c?c[1]+' ('+c[2]+')':''));}
/* wiring */
function applyChrome(){document.documentElement.dataset.theme=S.theme;$('#frame').classList.toggle('phone',S.phone);
 $$('[data-set]').forEach(b=>{const [k,v]=b.dataset.set.split(':');b.setAttribute('aria-pressed',String(String(S[k])===v));});}
function renderAll(){applyChrome();$('#main').innerHTML=window.render();wireDrag();save();}
function wireDrag(){$$('[data-drag]').forEach(el=>{el.draggable=true;el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.drag);el.classList.add('drag');});el.addEventListener('dragend',()=>el.classList.remove('drag'));el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over');});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();dropOn(e.dataTransfer.getData('text/plain'),el.dataset.drag);renderAll();});});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-set],#palette,.pal li[data-i]');if(!b)return;
 if(b.dataset.set){const [k,v]=b.dataset.set.split(':');S[k]=(v==='true'||v==='false')?v==='true':v;renderAll();return;}
 if(b.id==='palette'&&e.target===b){palClose();return;}
 if(b.matches('.pal li[data-i]')){palGo(plist[+b.dataset.i]);return;}
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='pin'){toggle(S.pinned,id);renderAll();}else if(a==='up'){move(id,-1);renderAll();}else if(a==='down'){move(id,1);renderAll();}
 else if(a==='hide'){toggle(S.hidden,id);renderAll();toast('Hidden. Restore it from the line at the bottom.');}else if(a==='restore'){toggle(S.hidden,id);renderAll();}
 else if(a==='explain')explain(id);else if(a==='xclose')xclose();else if(a==='pal')palOpen();else if(a==='browse')palOpen(true);
 else if(a==='go'){xclose();toast('Would open: '+b.dataset.cmd);}else if(a==='snooze'){R().needs.splice(+b.dataset.i,1);if(!R().needs.length)S.empty=true;renderAll();toast('Snoozed until tomorrow.');}
 else if(a==='reset'){S.hidden={};S.pinned={};S.order={};S.empty=false;location.reload();}
 else if(a==='expand'){const el=b.closest('.item');el.classList.toggle('open');b.setAttribute('aria-expanded',el.classList.contains('open'));}});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return;}
 if(e.key==='Escape'){if($('#palette').classList.contains('open')){palClose();}else xclose();return;}
 if($('#palette').classList.contains('open')&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')palGo(plist[pi]);else{pi=(pi+(e.key==='ArrowDown'?1:-1)+plist.length)%plist.length;palRender();const s=$('#po'+pi);s&&s.scrollIntoView({block:'nearest'});}}
 if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();palOpen();}});
document.addEventListener('input',e=>{if(e.target.id==='pin'){pi=0;palRender();}});
window.addEventListener('DOMContentLoaded',()=>{window.init&&window.init();renderAll();});

const TIMES=['06:35','06:10','06:06','06:04','06:02','05:50','05:40'];
window.init=function(){Object.keys(ROLES).forEach(r=>{if(!S.pinned[r])S.pinned[r]=[...ROLES[r].cards].sort((a,b)=>b.score-a.score).slice(0,3).map(c=>c.id);});};
function kpi(c,vis){return `<article class="card kpi" data-drag="${c.id}"><h3>${esc(c.title)}${acts(c,vis)}</h3><div class="big num">${esc(c.big)}<small>${esc(c.unit)}</small></div><div class="row">${delta(c)}<span style="margin-left:auto">${spark(c.spark,70,24,c.sk)}</span></div></article>`;}
function item(c,i,old){const bad=c.d.bad==='breach'?'breach':c.d.bad?'warn':'ok';const k=c.d.bad==='breach'?'Breach':c.d.bad?'Changed':'Update';
 return `<li class="item ${old?'old':''}"><div class="tl"><span class="dot ${bad==='breach'?'red':bad==='warn'?'late':''}"></span></div><div class="body"><div class="row"><span class="num sub">${old?'Yesterday':TIMES[i%TIMES.length]}</span><span class="tag ${bad}">${k}</span><button class="exb" data-act="expand" aria-expanded="false"><b>${esc(c.title)}</b>: ${esc(c.big)} ${esc(c.unit)}, ${esc(c.d.v)} ${esc(c.d.txt)}</button></div>
 <div class="more"><p class="sub">${esc(c.sub)}.</p>${rowsHTML(c,4)}<div class="row">${spark(c.spark,160,36,c.sk)}<button class="exp" data-act="explain" data-id="${c.id}">Explain</button><button class="exp" data-act="go" data-cmd="${esc(c.ex.open)}">Open ${esc(c.ex.open)}</button></div></div></div></li>`;}
window.render=function(){const HDR=appHeader();const all=visIds(),vis=all.map(card),pinned=vis.filter(c=>isPinned(c.id)),feed=vis.filter(c=>c.d.dir!=='flat'||c.score>=50);
 return HDR+greetHTML()+needsHTML()+`<h2 class="sec">Pinned</h2><section class="kpis" aria-label="Pinned numbers">${pinned.map(c=>kpi(c,all)).join('')||'<p class="calm">Nothing pinned. Pin a number from the feed.</p>'}</section>
 <h2 class="sec">What changed</h2><ol class="feed" aria-label="Timeline of changes">${feed.map((c,i)=>item(c,i,false)).join('')}
 <li class="div" aria-label="Your last visit"><span>Your last visit, yesterday 17:42</span></li>
 ${R().digest.map(t=>`<li class="item old"><div class="tl"><span class="dot"></span></div><div class="body"><div class="row"><span class="num sub">Yesterday</span><span class="tag info">Earlier</span><span>${esc(t)}</span></div></div></li>`).join('')}</ol>
 ${vis.filter(c=>!feed.includes(c)).length?'<p class="hidden-note">Quiet, not shown in the feed: '+vis.filter(c=>!feed.includes(c)).map(c=>`<button class="link" data-act="explain" data-id="${c.id}">${esc(c.title)}</button>`).join(', ')+'</p>':''}${hiddenHTML()}`;};
