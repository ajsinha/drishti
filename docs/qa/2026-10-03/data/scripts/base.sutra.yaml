# QA base sutra: header comment (keep me)
rachana: 1
sutra: qa-edit
version: 1
description: base for edit ops   # trailing on description
match: { kind: trade, priority: 1 }  # trailing on match
title: { pill: "QA", id: "$.id" }
strip:
  # strip comment (keep me)
  - { label: MTM, bind: $.mtm, fmt: signed0 }
panels:
  # before first panel (keep me)
  - id: terms      # trailing on terms
    kind: kv
    title: "Terms"
    span: 8
    # inside terms (keep me)
    columns:
      - { label: Coupon, bind: $.coupon, fmt: pct4 }   # trailing col
      - { label: Qty, bind: $.qty }
  # between panels (keep me)
  - { id: hist, kind: line, title: "History", rows: $.history, x: date, y: v, span: 6 }  # flow trailing
  - id: legs
    kind: table
    title: "Legs"
    rows: $.legs
    columns:
      - { label: Leg, bind: "@.name" }
      - { label: Amount, bind: "@.amount", fmt: amount0 }
  # trailing comment at end (keep me)
