<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How Drishti turns a command into a screen</title>
  <desc id="d">Sources feed connectors; the server's view pipeline runs command, fetch, match Sutra, shape, layout, links and bind
    into a ViewModel in JSON, which the console, Drishti Elements and the REST API and CLI render. Beneath: the computed engines,
    BI and the domain packs.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7781"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="1192" height="552" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="32" y="44" font-size="19" font-weight="700" fill="#293352">How a command becomes a screen</text>
  <text x="1168" y="44" font-size="12" fill="#6E7781" text-anchor="end">TRD MX-20000001 &lt;GO&gt;</text>

  <!-- column headings -->
  <g font-size="13" font-weight="700" fill="#293352">
    <text x="117" y="88" text-anchor="middle">Sources</text>
    <text x="302" y="88" text-anchor="middle">Connectors</text>
    <text x="797" y="182" text-anchor="middle">Contract</text>
    <text x="1042" y="134" text-anchor="middle">Rendered by</text>
  </g>

  <!-- sources -->
  <g font-size="12" fill="#24292F" text-anchor="middle">
    <rect x="32" y="104" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="126">Trade systems</text>
    <rect x="32" y="150" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="172">Delta Lake · Iceberg</text>
    <rect x="32" y="196" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="218">Databases</text>
    <rect x="32" y="242" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="264">Streams: Kafka, MQ</text>
    <rect x="32" y="288" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="310">Files: JSON Lines, CSV</text>
    <rect x="32" y="334" width="170" height="36" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="117" y="356">Amazon S3 · REST</text>
  </g>
  <g stroke="#6E7781" stroke-width="1.5" marker-end="url(#ag)">
    <line x1="202" y1="122" x2="230" y2="122"/>
    <line x1="202" y1="168" x2="230" y2="168"/>
    <line x1="202" y1="214" x2="230" y2="214"/>
    <line x1="202" y1="260" x2="230" y2="260"/>
    <line x1="202" y1="306" x2="230" y2="306"/>
    <line x1="202" y1="352" x2="230" y2="352"/>
  </g>

  <!-- connectors -->
  <rect x="232" y="104" width="140" height="266" rx="10" fill="#EEF1F6" stroke="#8C96A3"/>
  <g font-size="12" fill="#24292F" text-anchor="middle">
    <text x="302" y="200" font-weight="700" fill="#293352">Plugins</text>
    <text x="302" y="222">delta · iceberg</text>
    <text x="302" y="240">jdbc · duckdb · redis</text>
    <text x="302" y="258">kafka · s3 · rest</text>
    <text x="302" y="276">and more</text>
    <text x="302" y="304" fill="#57606A">one YAML file each</text>
  </g>

  <!-- server: the view pipeline -->
  <rect x="402" y="72" width="290" height="314" rx="12" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.5"/>
  <text x="547" y="94" font-size="13" font-weight="700" fill="#A51C30" text-anchor="middle">Server: the view pipeline</text>
  <g font-size="12" fill="#24292F">
    <rect x="418" y="106" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="144" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="182" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="220" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="258" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="296" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <rect x="418" y="334" width="258" height="30" rx="7" fill="#FBEFF1" stroke="#A51C30"/>
    <g fill="#A51C30">
      <circle cx="436" cy="121" r="9"/><circle cx="436" cy="159" r="9"/><circle cx="436" cy="197" r="9"/>
      <circle cx="436" cy="235" r="9"/><circle cx="436" cy="273" r="9"/><circle cx="436" cy="311" r="9"/>
      <circle cx="436" cy="349" r="9"/>
    </g>
    <g fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">
      <text x="436" y="125">1</text><text x="436" y="163">2</text><text x="436" y="201">3</text><text x="436" y="239">4</text>
      <text x="436" y="277">5</text><text x="436" y="315">6</text><text x="436" y="353">7</text>
    </g>
    <text x="454" y="125"><tspan font-weight="700">Command</tspan>  mnemonic and id</text>
    <text x="454" y="163"><tspan font-weight="700">Fetch</tspan>  from the source that holds it</text>
    <text x="454" y="201"><tspan font-weight="700">Match Sutra</tspan>  the kind's Sutra</text>
    <text x="454" y="239"><tspan font-weight="700">Shape</tspan>  fingerprint the document</text>
    <text x="454" y="277"><tspan font-weight="700">Layout</tspan>  Sutra + inference</text>
    <text x="454" y="315"><tspan font-weight="700">Links</tspan>  related entities, in parallel</text>
    <text x="454" y="353"><tspan font-weight="700">Bind</tspan>  values into the panels</text>
  </g>
  <g stroke="#A51C30" stroke-width="1.5" marker-end="url(#am)">
    <line x1="547" y1="136" x2="547" y2="143"/>
    <line x1="547" y1="174" x2="547" y2="181"/>
    <line x1="547" y1="212" x2="547" y2="219"/>
    <line x1="547" y1="250" x2="547" y2="257"/>
    <line x1="547" y1="288" x2="547" y2="295"/>
    <line x1="547" y1="326" x2="547" y2="333"/>
  </g>
  <!-- connectors to fetch -->
  <line x1="372" y1="159" x2="416" y2="159" stroke="#6E7781" stroke-width="1.5" marker-end="url(#ag)"/>
  <!-- bind to the ViewModel -->
  <path d="M676,349 H704 V236 H720" fill="none" stroke="#A51C30" stroke-width="1.5" marker-end="url(#am)"/>

  <!-- ViewModel -->
  <rect x="722" y="196" width="150" height="80" rx="10" fill="#F4F5F9" stroke="#293352" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="797" y="222" font-size="14" font-weight="700" fill="#293352">ViewModel</text>
    <text x="797" y="242" font-size="12" fill="#24292F">JSON: title, strip,</text>
    <text x="797" y="259" font-size="12" fill="#24292F">panels, links, keys</text>
    <text x="797" y="298" font-size="11" fill="#57606A">live: patches over SSE</text>
  </g>

  <!-- fan-out to the renderers -->
  <g fill="none" stroke="#6E7781" stroke-width="1.5">
    <line x1="872" y1="236" x2="892" y2="236"/>
    <line x1="892" y1="172" x2="892" y2="300"/>
  </g>
  <g stroke="#6E7781" stroke-width="1.5" marker-end="url(#ag)">
    <line x1="892" y1="172" x2="914" y2="172"/>
    <line x1="892" y1="236" x2="914" y2="236"/>
    <line x1="892" y1="300" x2="914" y2="300"/>
  </g>
  <g font-size="12" fill="#24292F" text-anchor="middle">
    <rect x="916" y="150" width="252" height="44" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="1042" y="168" font-weight="700" fill="#293352">Web console</text>
    <text x="1042" y="185">terminal, workspaces, monitors</text>
    <rect x="916" y="214" width="252" height="44" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="1042" y="232" font-weight="700" fill="#293352">Drishti Elements</text>
    <text x="1042" y="249">views and reports in other web apps</text>
    <rect x="916" y="278" width="252" height="44" rx="8" fill="#F6F8FA" stroke="#AFB8C1"/>
    <text x="1042" y="296" font-weight="700" fill="#293352">REST API · CLI</text>
    <text x="1042" y="313">scripts, Python client, Excel</text>
  </g>

  <!-- band beneath -->
  <rect x="20" y="406" width="1160" height="132" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="32" y="430" font-size="13" font-weight="700" fill="#293352">Beside the pipeline, on the same data</text>
  <g font-size="12" fill="#24292F" text-anchor="middle">
    <rect x="32" y="444" width="364" height="78" rx="9" fill="#FFFFFF" stroke="#AFB8C1"/>
    <text x="214" y="472" font-weight="700" fill="#A51C30">Computed engines</text>
    <text x="214" y="492">VaR and exposure on demand, any scope,</text>
    <text x="214" y="509">sharded across Drishti*net</text>
    <rect x="418" y="444" width="364" height="78" rx="9" fill="#FFFFFF" stroke="#AFB8C1"/>
    <text x="600" y="472" font-weight="700" fill="#A51C30">BI (Rūpaka)</text>
    <text x="600" y="492">datasets, models, reports and boards</text>
    <text x="600" y="509">over the packs' data</text>
    <rect x="804" y="444" width="364" height="78" rx="9" fill="#FFFFFF" stroke="#AFB8C1"/>
    <text x="986" y="472" font-weight="700" fill="#A51C30">Domain packs</text>
    <text x="986" y="492">YAML: kinds, mnemonics, Sutras, forms,</text>
    <text x="986" y="509">links, roles and connectors</text>
  </g>
</svg>
