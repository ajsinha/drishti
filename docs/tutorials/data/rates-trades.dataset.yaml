# Tutorial 13: the rates desk's trades, a dataset of the model layer. One row per trade per business date; the model trades-model reads it. The
# tutorial later tries to drop the `book` column, which a report uses: a change that needs a new major version.
rachana: 2
expressions: 2
dataset: rates-trades
version: 1.0.0
title: Rates trades
description: The trades of the rates desk by desk and book, one row per trade per business date.
source: { connector: risk-store, kind: trade-valuation }
grain: { says: "One row per trade per business date", keys: [TRADE_ID] }
columns:
  TRADE_ID:  { type: string, role: key }
  DESK:     { type: string }
  PORTFOLIO:    { type: string }
  NOTIONAL: { type: decimal, format: amount0 }
  MTM:      { type: decimal, format: signed0 }
