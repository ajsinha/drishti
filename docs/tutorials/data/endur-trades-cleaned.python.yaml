# Tutorial 14, step 12: the Python item the Transform editor wrote for ENDUR trades, cleaned (each step after its # step: comment).
rachana: 1
python: endur-trades-cleaned
title: ENDUR trades, cleaned
interface: transform
inputs: [trades]
packages: [pandas, numpy]
target: server
timeout: 20
memory: 512
params: {}
source: |
  import re
  import numpy as np
  import pandas as pd


  def run(trades, params):
      # step: Start from trades
      df = trades.copy()
      # step: Filter rows by values (TRADE_STATUS)
      df = df[df['TRADE_STATUS'].isin(['MATURED']) == False].reset_index(drop=True)
      # step: Type fix: text to date (TRADE_DATE)
      df['TRADE_DATE'] = pd.to_datetime(df['TRADE_DATE'], format='%Y-%m-%d', errors="coerce").dt.date
      # step: Tenor bucket (MATURITY_DATE; TRADE_DATE)
      _years = (pd.to_datetime(df['MATURITY_DATE'], errors="coerce") - pd.to_datetime(df['TRADE_DATE'], errors="coerce")).dt.days / 365.25
      _e = [float(x) for x in ['1', '2', '5', '10', '30']]
      _labels = ["<%gY" % _e[0]] + ["%g-%gY" % (a, b) for a, b in zip(_e, _e[1:])] + ["%gY+" % _e[-1]]
      df['tenor_bucket'] = pd.cut(_years, bins=[-np.inf] + _e + [np.inf], labels=_labels, right=False).astype(object).where(_years.notna(), None)
      # step: Group and total (PORTFOLIO, tenor_bucket; NOTIONAL)
      df = df.groupby(['PORTFOLIO', 'tenor_bucket'], as_index=False, dropna=False)[['NOTIONAL']].agg('sum')
      return df
