# Tutorial 14, step 12: the Python dataset the Transform editor wrote: the kind trade read straight through the connector trade-endur, as the reader.
rachana: 2
dataset: endur-trades-cleaned
title: ENDUR trades, cleaned
version: 1.0.0
source:
  python: endur-trades-cleaned
  inputs:
    trades:
      kind: trade
      pack: trading
      fields: [CURRENCY, MATURITY_DATE, NOTIONAL, PORTFOLIO, TRADE_DATE, TRADE_ID, TRADE_STATUS]
      connector: trade-endur
grain:
  keys: [PORTFOLIO, tenor_bucket]
columns:
  PORTFOLIO: {type: string, role: key}
  tenor_bucket: {type: string, role: key}
  NOTIONAL: {type: decimal, aggregate: sum}
