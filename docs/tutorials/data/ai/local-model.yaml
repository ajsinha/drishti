# Tutorial 15: a provider that is switched on but has nothing listening, to see what "Test connection" says when an endpoint does not answer.
# A real local model would be `base-url: http://localhost:11434` (Ollama's default); here the address is one where nothing runs.
type: ollama
enabled: true
base-url: http://127.0.0.1:18945
default-model: llama3.2
models:
  - name: llama3.2
