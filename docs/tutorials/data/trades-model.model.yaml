# Tutorial 13: the model of the rates desk: the dataset rates-trades as its one fact, three measures, a desk-to-book hierarchy. The tutorial edits
# it, has it reviewed and published, certifies it, follows its lineage and then asks what dropping `book` would break.
rachana: 2
expressions: 2
model: trades-model
version: 1.0.0
title: Trades model
description: Trades by desk and book, for the rates desk.
datasets:
  trade: { dataset: rates-trades, role: fact }
measures:
  Notional: { expr: "sum(trade.NOTIONAL)", format: amount0 }
  MTM:      { expr: "sum(trade.MTM)", format: signed0 }
  Trades:   { expr: "count(trade)" }
hierarchies:
  Desk and book: [trade.DESK, trade.PORTFOLIO]
security:
  rows:
    trade:
      - { role: [admin, bi-writer, bi-steward, bi-reviewer, bi-reader, viewer], where: "True" }
