# Tutorial 20, step 1: a model over the sample's trade valuations (the dataset trades-basic-trade) with two field parameters: the reader chooses the
# field a visual breaks down by (desk or portfolio) and the measure it shows (MTM or notional). docs/guides/REPORTS.md section 21.
rachana: 2
expressions: 2
model: fp-desk
version: 1.0.0
title: Desk with field parameters
datasets:
  trade: { dataset: trades-basic-trade, role: fact }
measures:
  MTM:      { expr: "sum(trade.MTM)", format: signed0 }
  NOTIONAL: { expr: "sum(trade.NOTIONAL)", format: amount0 }
  Trades:   { expr: "count(trade)" }
parameters:
  breakdown: { kind: field, fields: [trade.DESK, trade.PORTFOLIO], default: trade.DESK, title: Break down by }
  metric:    { kind: field, fields: [MTM, NOTIONAL], default: MTM, title: Show }
