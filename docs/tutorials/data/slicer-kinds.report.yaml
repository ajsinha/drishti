rachana: 2
report: slicer-kinds
version: 1
title: Slicer kinds
model: trades-basic@1
pages:
  - id: one
    title: One
    visuals:
      - { id: by-list,     type: slicer, title: Desk,     at: { x: 0, y: 0, w: 3, h: 4 }, wells: { field: [trade.DESK] },     format: { mode: list, scope: page } }
      - { id: by-dropdown, type: slicer, title: Currency, at: { x: 3, y: 0, w: 3, h: 2 }, wells: { field: [trade.CURRENCY] }, format: { mode: dropdown, scope: report } }
      - { id: by-range,    type: slicer, title: Notional, at: { x: 6, y: 0, w: 3, h: 3 }, wells: { field: [trade.NOTIONAL] }, format: { mode: range, scope: page } }
      - id: share
        type: donut
        title: Notional by book (top 8)
        at: { x: 0, y: 4, w: 6, h: 5 }
        wells: { axis: [trade.PORTFOLIO], values: [Notional] }
        filters: [{ field: trade.PORTFOLIO, op: top, n: 8, by: Notional }]
bookmarks:
  - { name: Rates only, page: one, slicers: { by-dropdown: [USD] }, filters: [{ field: trade.DESK, op: in, values: [DESK-RATES] }] }
