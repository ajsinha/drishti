# Tutorial 14: a Python VISUAL of your own. render(table, params) gets the rows its `columns` well names (as the person looking may see them) and
# returns a chart as data: an ECharts option. Here: the desks with the largest notional, as bars, with the biggest first.
rachana: 1
python: notional-by-desk
title: Notional by desk chart
description: The desks with the largest notional, drawn by Python as an ECharts option.
interface: visual
output: echarts
inputs: [DESK, NOTIONAL]
packages: [pandas]
target: server                   # the console runs it (2.3.0: there is no browser target)
timeout: 10
memory: 256
params: { top: 8 }
source: |
  def render(table, params):
      top = int(params.get("top", 8))
      g = table.groupby("DESK", as_index=False)["NOTIONAL"].sum().sort_values("NOTIONAL", ascending=False).head(top)
      return {
          "title": {"text": f"Notional of the {len(g)} largest desks", "left": "center", "textStyle": {"fontSize": 13}},
          "tooltip": {"trigger": "axis"},
          "grid": {"left": 90, "right": 20, "top": 40, "bottom": 30},
          "xAxis": {"type": "value", "name": "Notional"},
          "yAxis": {"type": "category", "data": list(g["DESK"])[::-1]},
          "series": [{"type": "bar", "data": [float(v) for v in g["NOTIONAL"]][::-1]}],
      }
