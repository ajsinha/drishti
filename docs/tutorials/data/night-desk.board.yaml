# Tutorial 12, step 8: a board of three tiles from the live desk report. Net MTM turns amber below 0 and red below -1 billion, and
# stays red until it is 25 million back above the red edge (hysteresis). Made in the board designer; created from this file with drishti.py bi item new.
rachana: 1
board: night-desk
title: Night desk
rotate: 30s
pages:
  - id: desk
    title: Trading desk
    tiles:
      - { id: net-mtm, report: live-trading-desk, visual: mtm, title: Net MTM, at: { x: 0, y: 0, w: 4, h: 3 },
          alert: { on: MTM, warn: { op: lt, value: 0 }, crit: { op: lt, value: -1000000000 }, hysteresis: 25000000 } }
      - { id: trades, report: live-trading-desk, visual: trades, at: { x: 4, y: 0, w: 2, h: 3 } }
      - { id: by-desk, report: live-trading-desk, visual: by-desk, at: { x: 0, y: 3, w: 6, h: 5 } }
