# Tutorial 18: a Python Transform, a table in and a table out. It receives the two masked answers as pandas frames, in the order of `inputs`.
rachana: 1
python: mtm-vs-exposure
title: MTM against exposure
description: Joins the MTM frame to the exposure frame on the counterparty and adds MTM per unit of exposure and the rank of the exposure.
version: 1
interface: transform
inputs: [trading-risk, counterparty-exposure]
packages: [pandas]
target: server
timeout: 20
memory: 512
params: { floor: 1.0 }
source: |
  def run(pnl, exposure, params):
      """pnl: counterparty, name, sector, MTM, Trades.  exposure: counterparty, Exposure (EE peak), Exposure (PFE peak)."""
      m = pnl.merge(exposure, on="counterparty", how="left")
      m = m.rename(columns={"MTM": "mtm", "Trades": "trades", "Exposure (EE peak)": "ee_peak", "Exposure (PFE peak)": "pfe_peak"})
      floor = float(params.get("floor", 1.0))
      m["mtm_per_exposure"] = m["mtm"] / m["ee_peak"].clip(lower=floor)
      m["exposure_rank"] = m["ee_peak"].rank(ascending=False, method="min")
      return m[["counterparty", "name", "sector", "mtm", "trades", "ee_peak", "pfe_peak", "mtm_per_exposure", "exposure_rank"]]
