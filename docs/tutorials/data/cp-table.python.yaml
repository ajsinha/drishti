# Tutorial 18: a Python Transform, a table in and a table out. It receives the answers of two model queries (asked as the reader: their rules and masks)
# as pandas frames, named as the dataset's inputs, and returns one row per counterparty.
rachana: 1
python: cp-table
title: Counterparty table
description: Joins the MTM answer to the exposure answer on the counterparty and adds MTM per unit of exposure and the rank of the exposure.
version: 1
interface: transform
inputs: [pnl, exposure]
packages: [pandas]
target: server
timeout: 20
memory: 512
params: { floor: 1.0 }
source: |
  def run(pnl, exposure, params):
      """pnl: id, NAME, SECTOR, MTM, Trades (the counterparty's fields, without their alias).  exposure: id, Exposure (EE peak)."""
      short = lambda f: f.rename(columns=lambda c: c.split(".")[-1])          # counterparty.id and id are the same column
      p = short(pnl).rename(columns={"id": "counterparty", "NAME": "name", "SECTOR": "sector", "MTM": "mtm", "Trades": "trades"})
      e = short(exposure).rename(columns={"id": "counterparty", "Exposure (EE peak)": "ee_peak"})
      m = p.merge(e, on="counterparty", how="left")
      floor = float(params.get("floor", 1.0))
      m["mtm_per_exposure"] = m["mtm"] / m["ee_peak"].clip(lower=floor)
      m["exposure_rank"] = m["ee_peak"].rank(ascending=False, method="min")
      return m[["counterparty", "name", "sector", "mtm", "trades", "ee_peak", "mtm_per_exposure", "exposure_rank"]]
