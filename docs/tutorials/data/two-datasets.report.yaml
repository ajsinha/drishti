# Tutorial 18: one report over two datasets. The report's own dataset is trading-risk (trades); the exposure visuals and the two slicers name
# counterparty-exposure (netting sets) with a `dataset:` of their own. `links:` is the author's statement that the sector of one is the sector of the
# other; the country is deliberately NOT linked, so the Country slicer reaches the exposure visuals and none of the trades.
rachana: 1
report: two-datasets
version: 1
title: P&L and exposure side by side
dataset: file:dataset:trading-risk
links:
  - fields: [counterparties.sector, counterparties.sector]
pages:
  - id: side-by-side
    title: Side by side
    visuals:
      - { id: sector, type: slicer, title: Sector, dataset: file:dataset:counterparty-exposure, at: { x: 0, y: 0, w: 3, h: 2 },
          wells: { field: [counterparties.sector] }, format: { mode: dropdown, scope: report } }
      - { id: country, type: slicer, title: Country (not linked), dataset: file:dataset:counterparty-exposure, at: { x: 3, y: 0, w: 3, h: 2 },
          wells: { field: [counterparties.country] }, format: { mode: dropdown, scope: report } }
      - { id: pnl, type: card, title: "P&L 1d", at: { x: 6, y: 0, w: 3, h: 2 }, wells: { values: [P&L 1d] } }
      - { id: ee, type: card, title: "Exposure (EE peak)", dataset: file:dataset:counterparty-exposure, at: { x: 9, y: 0, w: 3, h: 2 },
          wells: { values: [Exposure (EE peak)] } }
      - { id: pnl-by-sector, type: bar, title: "P&L 1d by sector (trades)", at: { x: 0, y: 2, w: 6, h: 6 },
          wells: { axis: [counterparties.sector], values: [P&L 1d] } }
      - { id: ee-by-sector, type: bar, title: "Exposure by sector (netting sets)", dataset: file:dataset:counterparty-exposure, at: { x: 6, y: 2, w: 6, h: 6 },
          wells: { axis: [counterparties.sector], values: [Exposure (EE peak)] } }
      - { id: pnl-by-desk, type: bar, title: "P&L 1d by desk (trades: the sector link reaches it, a country does not)", at: { x: 0, y: 8, w: 12, h: 5 },
          wells: { axis: [desks.name], values: [P&L 1d] } }
