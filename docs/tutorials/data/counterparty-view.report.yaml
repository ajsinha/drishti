# Tutorial 18: a report over the composed dataset cp-pnl-exposure: MTM and expected exposure in one visual, and a ratio measure of the dataset.
rachana: 1
report: counterparty-view
version: 1
title: MTM and exposure by sector, one table
dataset: cp-pnl-exposure
pages:
  - id: view
    title: By sector
    visuals:
      - { id: mtm, type: card, title: MTM, at: { x: 0, y: 0, w: 3, h: 2 }, wells: { values: [MTM] } }
      - { id: ee, type: card, title: Exposure (EE peak), at: { x: 3, y: 0, w: 3, h: 2 }, wells: { values: [Exposure (EE peak)] } }
      - { id: ratio, type: card, title: MTM per exposure, at: { x: 6, y: 0, w: 3, h: 2 }, wells: { values: [MTM per exposure] } }
      - { id: by-sector, type: bar, title: "MTM and exposure by sector (one visual, one dataset)", at: { x: 0, y: 2, w: 12, h: 6 },
          wells: { axis: [joined.sector], values: [MTM, Exposure (EE peak)] } }
      - { id: table, type: table, title: Counterparties, at: { x: 0, y: 8, w: 12, h: 6 },
          wells: { columns: [joined.name, joined.sector, MTM, Exposure (EE peak), MTM per exposure] },
          filters: [{ field: joined.counterparty, op: top, n: 8, by: Exposure (EE peak) }] }
