# Tutorial 11: the model over the dataset trades-daily: three measures, and the figures they must give (tests:, step 7). A test is a question in
# Drishti SQL and the number it must come to; a model whose test fails is not published.
rachana: 2
expressions: 2
model: trades-daily
version: 1.0.0
title: Trades daily
description: Notional, MTM and the number of trades, by desk, over the dataset that refreshes itself.
datasets:
  trade: { dataset: trades-daily, role: fact }
measures:
  Notional: { expr: "sum(trade.notional)", format: amount0 }
  MTM:      { expr: "sum(trade.mtm)", format: signed0 }
  Trades:   { expr: "count(trade)" }
security:
  rows:
    trade:
      - { role: [admin, risk, bi-writer], where: "True" }
