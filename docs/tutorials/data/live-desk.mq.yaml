# Tutorial 12, step 2: one model query over the live table, by desk, with the SQL it ran (explain: BI authors). The model is the one the converter
# made of the live sample (live-trading@1); the layer that answers is the in-memory live table, here its kept groups (the rollup byDeskBook).
mq: 1
model: live-trading@1
select:
  fields: [trade.DESK]
  measures: [Trades, Notional, MTM, Worst trade]
limit: 3
options: { explain: true }
