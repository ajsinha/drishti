# Tutorial 14: a report with a Python visual of your own (notional-by-desk.python.yaml) beside the shipped Python measure. `format.python` names the item;
# the visual is handed the rows of its `columns` well, under the page's slicers and filters.
rachana: 2
report: desk-python
version: 1
title: Desks in Python
model: trades-basic@1
pages:
  - id: desks
    title: Desks
    visuals:
      - { id: currency, type: slicer, title: Currency, at: { x: 0, y: 0, w: 4, h: 2 }, wells: { field: [trade.CURRENCY] }, format: { mode: dropdown, scope: page } }
      - { id: notional-chart, type: python, title: "Notional by desk (my Python visual)", at: { x: 0, y: 2, w: 6, h: 6 },
          wells: { columns: [trade.DESK, trade.NOTIONAL] }, format: { python: Notional by desk chart, params: { top: 8 }, run: auto } }
      - { id: volatility, type: python, title: "Desk P&L volatility (the shipped Python measure)", at: { x: 6, y: 2, w: 6, h: 6 },
          wells: { values: [Desk P&L volatility] }, format: { run: auto } }
