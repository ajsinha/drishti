# Tutorial 18: the trap and its cure in Analyse, on the model cp-risk. Two extracts of rows, each built by the server for the person opening it (their
# row rules, their masks): the trades and the netting sets. Cell 1 joins the rows of one to the rows of the other (wrong); cell 2 adds each side up per
# counterparty first (right), as the model does for you, and draws it.
rachana: 1
notebook: cp-risk-extracts
title: Two extracts, joined the wrong way and the right way
description: Trades and netting sets of the model cp-risk, joined by counterparty in pandas.
dataset: mq:cp-risk@1
fields: [trade.COUNTERPARTY, trade.MTM, trade.PNL_1D]
extracts:
  - { name: exposure, dataset: mq:cp-risk@1, fields: [netting_set.COUNTERPARTY, netting_set.PEAK_EE] }
cells:
  - type: python
    source: |
      ns = extract("exposure")
      naive = df.merge(ns, on="COUNTERPARTY", how="inner")
      print("trade rows", len(df), " netting-set rows", len(ns), " rows after the row join", len(naive))
      print("P&L 1d   true %.0f   row join %.0f" % (df["PNL_1D"].sum(), naive["PNL_1D"].sum()))
      print("EE peak  true %.0f   row join %.0f" % (ns["PEAK_EE"].sum(), naive["PEAK_EE"].sum()))
    target: server
  - type: python
    source: |
      mtm = df.groupby("COUNTERPARTY", as_index=False)["MTM"].sum()
      ee = extract("exposure").groupby("COUNTERPARTY", as_index=False)["PEAK_EE"].sum()
      g = mtm.merge(ee, on="COUNTERPARTY", how="left").sort_values("PEAK_EE", ascending=False).head(10)
      result = {"title": {"text": "MTM and expected exposure of the ten largest counterparties"}, "legend": {"top": 24},
                "xAxis": {"type": "category", "data": list(g["COUNTERPARTY"]), "axisLabel": {"rotate": 30}}, "yAxis": {"type": "value"},
                "series": [{"name": "MTM", "type": "bar", "data": [float(v) for v in g["MTM"]]},
                           {"name": "Exposure (EE peak)", "type": "bar", "data": [float(v) for v in g["PEAK_EE"]]}]}
    target: server
