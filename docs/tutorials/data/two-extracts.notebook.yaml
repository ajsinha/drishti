# Tutorial 18: the trap and its cure in Analyse. Two extracts, each built by the server for the person opening it (their row rules, their masks).
# Cell 1 joins the rows of the trades to the rows of the netting sets (wrong); cell 2 adds each side up per counterparty first (right) and draws it.
rachana: 1
notebook: two-extracts
title: Two extracts, joined the wrong way and the right way
description: Trades of trading-risk and netting sets of counterparty-exposure, joined by counterparty in pandas.
dataset: file:dataset:trading-risk
fields: [trades.counterpartyId, trades.mtm, trades.pnl1d]
extracts:
  - { name: exposure, dataset: file:dataset:counterparty-exposure, fields: [netting_sets.counterparty, netting_sets.eePeak] }
cells:
  - type: python
    source: |
      ns = extract("exposure")
      naive = df.merge(ns, left_on="counterpartyId", right_on="counterparty", how="inner")
      print("trade rows", len(df), " netting-set rows", len(ns), " rows after the row join", len(naive))
      print("P&L 1d   true %.0f   row join %.0f" % (df["pnl1d"].sum(), naive["pnl1d"].sum()))
      print("EE peak  true %.0f   row join %.0f" % (ns["eePeak"].sum(), naive["eePeak"].sum()))
    target: server
  - type: python
    source: |
      mtm = df.groupby("counterpartyId", as_index=False)["mtm"].sum()
      ee = extract("exposure").groupby("counterparty", as_index=False)["eePeak"].sum()
      g = mtm.merge(ee, left_on="counterpartyId", right_on="counterparty", how="left").sort_values("eePeak", ascending=False).head(10)
      result = {"title": {"text": "MTM and expected exposure of the ten largest counterparties"}, "legend": {"top": 24},
                "xAxis": {"type": "category", "data": list(g["counterpartyId"]), "axisLabel": {"rotate": 30}}, "yAxis": {"type": "value"},
                "series": [{"name": "MTM", "type": "bar", "data": [float(v) for v in g["mtm"]]},
                           {"name": "Exposure (EE peak)", "type": "bar", "data": [float(v) for v in g["eePeak"]]}]}
    target: server
