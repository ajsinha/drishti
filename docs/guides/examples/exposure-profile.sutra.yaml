rachana: 1
sutra: exposure-profile
version: 1
description: An area chart of expected and potential future exposure over tenor, with a limit line.
match: { kind: exposure }
title: { pill: "Exposure · ${$.nettingSet}", id: $.nettingSet }
panels:
  - id: exposure
    kind: area
    title: Exposure profile (USD)
    height: 11
    rows: $.profile
    x: tenor
    limit: $.limit
    series:
      - { label: EE, value: ee, tone: link }
      - { label: PFE 95, value: pfe, tone: accent }
