# About this page: what the help desk's kinds mean (docs/guides/PACK_DEVELOPER_GUIDE.md, "About text and glossary").
about: 1
kinds:
  ticket:
    title: Support ticket
    about: >-
      ${$.ticketId} ("${$.subject}") is a ${lower($.priority)}-priority ticket for ${$.clientName}, ${lower($.status)} for
      ${$.ageHours} hours and assigned to ${$.assignee}.
    glossary:
      ageHours:
        term: Age
        means: Hours since the ticket was opened. It keeps counting while the ticket is open.
        unit: hours
      priority:
        term: Priority
        means: How soon the team has promised to look at it.
        values:
          High: Within four working hours
          Normal: Within one working day
