rachana: 1
sutra: risk-distribution
version: 1
description: "How risk is spread: a histogram of scenario P&L with VaR markers, a scatter of books and a gauge of a limit."
match: { kind: risk-run }
title: { pill: "Risk · ${$.PORTFOLIO}", id: $.PORTFOLIO }
strip:
  - { label: VaR 99%, bind: $.VAR99, fmt: compact }
  - { label: ES 97.5%, bind: $.ES975, fmt: compact }
panels:
  - id: scenarios
    kind: histogram
    title: Scenario P&L (USD)
    rows: $.SCENARIO_PNL
    bins: 25
    fmt: compact
    markers:
      - { label: VaR 99%, value: "-$.VAR99", tone: neg }
      - { label: ES 97.5%, value: "-$.ES975", tone: bad }
      - { label: Mean, value: $.MEAN_PNL, tone: link }
  - { id: books, kind: scatter, title: "Books: MTM against trades", span: 8, rows: $.BOOKS, x: MTM, y: TRADES, label: ID, xFmt: compact, xLabel: MTM (USD), yLabel: Trades }
  - { id: limit, kind: gauge, title: Usage of the VaR limit, span: 4, value: $.USAGE, max: $.LIMIT }
