<text x="706" y="374" class="m" text-anchor="start">≈ /lib/modules, Tomcat webapps/</text>
<text x="706" y="398" class="b" text-anchor="start">distribution</text>
<text x="706" y="414" class="m" text-anchor="start">≈ a distro on one kernel</text>
