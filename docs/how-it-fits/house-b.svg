<svg xmlns="http://www.w3.org/2000/svg" class="hm" viewBox="0 0 1004 746" width="1004" height="746" role="img" aria-label="Option B, the cutaway: one house, Drishti Finance, in cross-section. Its rooms are modules (economy, capital markets, market data); the capital markets room is opened to show shelves (workspaces) holding books (screens such as the fund page, reports, dashboards, forms and Sutras), with the same book on two shelves. The front door is the console, with keys (access rights) and Health by the door; Admin is the manager's office; pipes are data bindings. The foundation is the kernel, drawn in layers like a Linux kernel diagram, with sockets where rooms plug in. Scaffolding with a four-eyes permit is deploy. A side panel gives the Linux parallel: .dmod is like a .ko driver, first-party like in-tree, modules/ like a drop-in folder.">
