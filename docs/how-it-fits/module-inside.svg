<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Inside a .dmod: module.yaml, the META-INF/DMOD.MF hash list, java/ and lib/ jars, packs, data/needs.yaml, console/plugin.yaml and docs, never connectors or credentials. A module&#x27;s classes are looked up in the JDK and the kernel&#x27;s shared libraries first, then its own lib/, then the server&#x27;s lib/ folder; every other kernel class is hidden. First-party modules are verified against first-party.yaml and may carry an allowance tied to one exact kernel build; third-party modules use the public kernel API only." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
