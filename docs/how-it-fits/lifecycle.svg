<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="A module&#x27;s life: built with Maven, the standalone module tool or drishti.py module pack into a checked .dmod; deployed by uploading it once, planning, approval by a second administrator, then staging and verifying on every placed node before all activate together; a failure rolls every node back and an upgrade rolls node by node. On one node a .dmod dropped into the modules folder auto-deploys; a development folder loads unverified on a developer&#x27;s own server. Unloading keeps saved work, marked needs module X." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
