<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="One build, several products: one kernel build, one console build and the module packages make Drishti Risk (banking and market-data), Drishti Finance (capital markets, economy, market-data), Drishti Genomics (the sample) and Drishti All (every module, the default), each from one distribution file. Two consoles, Risk on 17480 and Finance on 17481, can run over one cluster." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
