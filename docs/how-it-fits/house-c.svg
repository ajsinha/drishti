<title>Kernel and rooms</title>
<desc>Option C, kernel and rooms: a minimal mark. A kernel core with module tiles (banking, market data, capital markets, economy) plugged around it like Linux drivers, with an empty socket where a new .dmod plugs in. The same tiles, under a roof with a door (the console) and on one kernel bar, form the Drishti Risk, Drishti Finance and Drishti All houses. A small icon-size lockup shows it as a logo-like mark.</desc>
<style>
.hm{--bg:#0e1628;--panel:#16213a;--panel2:#1b2744;--line:#33446e;--ink:#e7ecf5;--muted:#93a0b8;--amber:#e8a33a;
--bank:#7fb2ff;--mkt:#e8a33a;--cap:#c69cf2;--eco:#5fd39a;--pipe:#4fc3dc;--kern:#1d2b4d;--kern2:#25365e}
@media (prefers-color-scheme: light){.hm{--bg:#f7f5f0;--panel:#ffffff;--panel2:#faf8f4;--line:#cfc7b8;--ink:#172440;--muted:#55607a;
--amber:#985b0a;--bank:#1f5fc4;--mkt:#b4700a;--cap:#7a3fb8;--eco:#1b784c;--pipe:#11809a;--kern:#e9e3d6;--kern2:#ded6c5}}
html:not(.light) .hm{--bg:#0e1628;--panel:#16213a;--panel2:#1b2744;--line:#33446e;--ink:#e7ecf5;--muted:#93a0b8;--amber:#e8a33a;
--bank:#7fb2ff;--mkt:#e8a33a;--cap:#c69cf2;--eco:#5fd39a;--pipe:#4fc3dc;--kern:#1d2b4d;--kern2:#25365e}
html.light .hm{--bg:#f7f5f0;--panel:#ffffff;--panel2:#faf8f4;--line:#cfc7b8;--ink:#172440;--muted:#55607a;
--amber:#985b0a;--bank:#1f5fc4;--mkt:#b4700a;--cap:#7a3fb8;--eco:#1b784c;--pipe:#11809a;--kern:#e9e3d6;--kern2:#ded6c5}
.hm{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif}
.hm .bg{fill:var(--bg)}.hm text{fill:var(--ink);font-size:12px}.hm .m{fill:var(--muted);font-size:11px}.hm .b{font-weight:700}
.hm .h1{font-size:17px;font-weight:700}.hm .cap{fill:var(--amber);font-size:11px;font-weight:700;letter-spacing:.12em}
.hm .wall{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.hm .roof{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.hm .kern{fill:var(--kern);stroke:var(--amber);stroke-width:1.5}.hm .kseg{fill:var(--kern2);stroke:var(--line)}
.hm .door{fill:var(--panel2);stroke:var(--amber);stroke-width:1.5}.hm .ln{stroke:var(--line);fill:none}
.hm .pipe{stroke:var(--pipe);stroke-width:3;fill:none;stroke-linecap:round}.hm .pipet{fill:var(--pipe)}
.hm .dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}.hm .show{fill:none;stroke:var(--amber);stroke-dasharray:6 4;stroke-width:1.2}
.hm .arrow{stroke:var(--amber);stroke-width:2;fill:none}.hm .af{fill:var(--amber)}
.hm .r-bank{fill:var(--bank);fill-opacity:.18;stroke:var(--bank);stroke-width:1.5}.hm .s-bank{fill:var(--bank)}
.hm .r-mkt{fill:var(--mkt);fill-opacity:.2;stroke:var(--mkt);stroke-width:1.5}.hm .s-mkt{fill:var(--mkt)}
.hm .r-cap{fill:var(--cap);fill-opacity:.18;stroke:var(--cap);stroke-width:1.5}.hm .s-cap{fill:var(--cap)}
.hm .r-eco{fill:var(--eco);fill-opacity:.18;stroke:var(--eco);stroke-width:1.5}.hm .s-eco{fill:var(--eco)}
.hm .book{fill:var(--panel2);stroke:var(--line)}.hm .book-hi{fill:var(--panel2);stroke:var(--amber);stroke-width:1.5}
.hm .shelf{stroke:var(--muted);stroke-width:2.5}.hm .hl{fill:var(--amber)}
</style>
<rect width="1004" height="554" class="bg"/>
<text x="30" y="34" class="h1" text-anchor="start">C · Kernel and rooms</text>
<text x="30" y="56" class="m" text-anchor="start">Modules plug into one kernel like drivers; stack the same tiles under a roof and you have a product.</text>
