<svg xmlns="http://www.w3.org/2000/svg" class="hm" viewBox="0 0 1004 554" width="1004" height="554" role="img" aria-label="Option C, kernel and rooms: a minimal mark. A kernel core with module tiles (banking, market data, capital markets, economy) plugged around it like Linux drivers, with an empty socket where a new .dmod plugs in. The same tiles, under a roof with a door (the console) and on one kernel bar, form the Drishti Risk, Drishti Finance and Drishti All houses. A small icon-size lockup shows it as a logo-like mark.">
