<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="A request&#x27;s journey in eight steps: the person types VAR BANK on the Risk console; the console calls the kernel as the person; any node takes the call; placement forwards it to a node where banking runs; the module checks access and runs the VaR engine; the engine asks for kinds, which bindings map to the risk-store connector; the connector reads the risklake Delta tables; the answer returns." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
