<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="How a kind finds its data: a module lists the kinds it needs; the kernel tries, in order, the site&#x27;s binding in config/bindings.yaml, the distribution&#x27;s default from a pack&#x27;s routes, a lake that holds the kind by convention (AUTO), the demo lake while demo is on (DEMO), and otherwise marks it UNBOUND, which switches off the functions that need it, each explaining why." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
