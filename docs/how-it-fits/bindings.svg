<title>How a kind finds its data</title>
<desc>How a kind finds its data: a module lists the kinds it needs; the kernel tries, in order, the site&#x27;s binding in config/bindings.yaml, the distribution&#x27;s default from a pack&#x27;s routes, a lake that holds the kind by convention (AUTO), the demo lake while demo is on (DEMO), and otherwise marks it UNBOUND, which switches off the functions that need it, each explaining why.</desc>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ac27a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c27a12"/></marker><marker id="a1d8c7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d8c7f"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker><marker id="a6a4fb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4fb3"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="559" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f" text-anchor="start">How a kind finds its data</text>
<text x="24" y="60" font-size="13" font-weight="400" fill="#5c6a80" text-anchor="start">A module names kinds; the site decides what serves them. First hit wins.</text>
<rect x="24" y="84" width="190" height="200" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="36" y="106" font-size="14" font-weight="700" fill="#1f5fbf" text-anchor="start">THE MODULE NEEDS</text>
<text x="36" y="124.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">banking:</text>
<text x="36" y="142.0" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">  trade</text>
<text x="36" y="159.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">  scenario-set</text>
<text x="36" y="177.0" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">  pnl-vector or</text>
<text x="36" y="194.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">  scenario-pv</text>
<text x="36" y="212.0" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace">  var-limit …</text>
<text x="36" y="229.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">(data/needs.yaml)</text>
<rect x="244" y="84" width="300" height="52" rx="8" fill="#fbefd9" stroke="#c27a12" stroke-width="1.5"/>
<text x="256" y="106" font-size="13" font-weight="700" fill="#c27a12" text-anchor="start">1  the site&#x27;s binding</text>
<text x="256" y="124" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">config/bindings.yaml</text>
<text x="554" y="116" font-size="12.5" font-weight="700" fill="#c27a12" text-anchor="start">BOUND</text>
<path d="M394,136 L394,146" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="244" y="146" width="300" height="52" rx="8" fill="#fbefd9" stroke="#c27a12" stroke-width="1.5"/>
<text x="256" y="168" font-size="13" font-weight="700" fill="#c27a12" text-anchor="start">2  the distribution&#x27;s default</text>
<text x="256" y="186" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">a pack&#x27;s routes:</text>
<text x="554" y="178" font-size="12.5" font-weight="700" fill="#c27a12" text-anchor="start">BOUND</text>
<path d="M394,198 L394,208" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="244" y="208" width="300" height="52" rx="8" fill="#dcf3f0" stroke="#1d8c7f" stroke-width="1.5"/>
<text x="256" y="230" font-size="13" font-weight="700" fill="#1d8c7f" text-anchor="start">3  a lake by convention</text>
<text x="256" y="248" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">the contract&#x27;s binding-hint</text>
<text x="554" y="240" font-size="12.5" font-weight="700" fill="#1d8c7f" text-anchor="start">AUTO</text>
<path d="M394,260 L394,270" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="244" y="270" width="300" height="52" rx="8" fill="#ffffff" stroke="#5c6a80" stroke-width="1.5"/>
<text x="256" y="292" font-size="13" font-weight="700" fill="#5c6a80" text-anchor="start">4  the demo lake</text>
<text x="256" y="310" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">only while demo is on</text>
<text x="554" y="302" font-size="12.5" font-weight="700" fill="#5c6a80" text-anchor="start">DEMO</text>
<path d="M394,322 L394,332" fill="none" stroke="#5c6a80" stroke-width="1.8" marker-end="url(#a5c6a80)"/>
<rect x="244" y="332" width="300" height="52" rx="8" fill="#fbe3e3" stroke="#c62828" stroke-width="1.5"/>
<text x="256" y="354" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">5  nothing serves it</text>
<text x="256" y="372" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">required: its functions switch off</text>
<text x="554" y="364" font-size="12.5" font-weight="700" fill="#c62828" text-anchor="start">UNBOUND</text>
<path d="M214,184 L240,184" fill="none" stroke="#1f5fbf" stroke-width="1.8" marker-end="url(#a1f5fbf)"/>
<rect x="640" y="84" width="96" height="110" rx="8" fill="#dff2ea" stroke="#1e8a55" stroke-width="1.5"/>
<text x="652" y="106" font-size="13" font-weight="700" fill="#1e8a55" text-anchor="start">SERVES</text>
<text x="652" y="124" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">connectors</text>
<text x="652" y="141" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">→ lakes</text>
<text x="652" y="158" font-size="12" font-weight="400" fill="#1a2333" text-anchor="start">→ tables</text>
<path d="M620,110 L636,110" fill="none" stroke="#1e8a55" stroke-width="1.8" marker-end="url(#a1e8a55)"/>
<rect x="24" y="400" width="712" height="124" rx="8" fill="#ffffff" stroke="#5c6a80" stroke-width="1.5"/>
<text x="36" y="422" font-size="14" font-weight="700" fill="#5c6a80" text-anchor="start">When a required kind is UNBOUND</text>
<text x="36" y="440.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">the function explains itself: &quot;Exposure needs data: exposure-path is not bound&quot;</text>
<text x="36" y="458.0" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">with links to Admin → Data bindings and Help; the API answers 409 DRS-1035 with the need</text>
<text x="36" y="475.5" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">and the command line says the same words</text>
<text x="36" y="493.0" font-size="12.5" font-weight="400" fill="#1a2333" text-anchor="start">everything else in the module keeps working; a binding change takes two administrators and no restart</text>
</svg>
