  A screen mock-up (landing-mockup.html) of the console's Home (/, landing.html) with the chosen picture C, kernel and rooms, as its hero.
  MOCK-UP ONLY: the real landing page is unchanged until the owner approves. Self-contained: system fonts, inline SVG, nothing from a CDN.
  The colours are the console's theme tokens (drishti_tokens.css, the terminal and light themes, same names). The product name, tagline and
  module list come from the distribution file's brand and modules (config/distributions/<id>.yaml); the page writes no product name itself.
  The address picks the distribution and theme: ?dist=all|risk&theme=terminal|light. Screenshots: landing-mockup-*.png beside it.
-->
<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing mock-up</title>
<script>
/* What the server would pass the template from the distribution file (config/distributions/drishti.<id>.yaml: brand.product,
   brand.tagline, modules). In landing.html these are {{ PRODUCT }}, {{ TAGLINE }} and the distribution's module list. */
var DIST = {
  all:  {product: "Drishti",      tagline: "Any data. Any domain. One grammar.",
         modules: ["banking", "market-data", "capitalmarkets", "economy"], cards: [["VAR BANK", "Value at risk"], ["EQ", "Equities"], ["ECON", "Economies"], ["BI", "Reports and boards"]]},
  risk: {product: "Drishti Risk", tagline: "VaR, exposure and limits from your own pricing data",
         modules: ["banking", "market-data"], cards: [["VAR BANK", "Value at risk"], ["EXP BANK", "Exposure"], ["SIMM", "Initial margin"], ["BI", "Reports and boards"]]}
};
var Q = new URLSearchParams(location.search), D = DIST[Q.get("dist")] || DIST.all;
document.documentElement.setAttribute("data-theme", Q.get("theme") === "light" ? "light" : "terminal");
</script>
<style>
/* the console's tokens (drishti_tokens.css), the two themes shown */
:root[data-theme="terminal"]{--d-bg:#0e1628;--d-bg-2:#121c33;--d-surface:#16213a;--d-surface-2:#1b2744;--d-border:#26345a;--d-ink:#e7ecf5;
  --d-muted:#93a0b8;--d-accent:#e8a33a;--d-accent-strong:#f2b453;--d-accent-tint:rgba(232,163,58,.14);--d-on-accent:#14100a;--d-link:#7fb2ff;
  --d-ok:#5fd39a;--d-cap-violet:#c792ea;--d-nav:rgba(14,22,40,.86);--d-shadow:0 10px 40px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="light"]{--d-bg:#f7f5f0;--d-bg-2:#efebe3;--d-surface:#ffffff;--d-surface-2:#faf8f4;--d-border:#e2dcd0;--d-ink:#172440;
  --d-muted:#55607a;--d-accent:#985b0a;--d-accent-strong:#7c4805;--d-accent-tint:rgba(184,110,12,.10);--d-on-accent:#ffffff;--d-link:#1f5fc4;
  --d-ok:#1b784c;--d-cap-violet:#7a45a8;--d-nav:rgba(247,245,240,.9);--d-shadow:0 10px 30px rgba(23,36,64,.10);color-scheme:light}
:root{--m-banking:var(--d-link);--m-market-data:var(--d-accent);--m-capitalmarkets:var(--d-cap-violet);--m-economy:var(--d-ok);
  --d-font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--d-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--d-bg);color:var(--d-ink);font-family:var(--d-font-sans);font-size:14px}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--d-nav);border-bottom:1px solid var(--d-border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.brand svg{width:26px;height:26px}
.nav .sp{flex:1}.nav .lnk{color:var(--d-muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;border:1px solid var(--d-border)}
.pill.accent{background:var(--d-accent);color:var(--d-on-accent);border-color:var(--d-accent)}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding:48px 0 28px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--d-border);border-radius:999px;padding:4px 12px;color:var(--d-muted);font-size:12.5px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--d-ok)}
h1{font-size:44px;line-height:1.1;margin:18px 0 10px;letter-spacing:-.01em}
h1 .acc{color:var(--d-accent)}
.product{font-size:15px;color:var(--d-muted);margin:0 0 4px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tagline{font-size:17px;color:var(--d-muted);margin:0 0 24px;line-height:1.5}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.stage{background:var(--d-bg-2);border:1px solid var(--d-border);border-radius:14px;padding:12px 12px 6px;box-shadow:var(--d-shadow)}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{display:flex;flex-direction:column;gap:2px;color:var(--d-muted);font-size:12px;padding:6px 6px 4px;font-family:var(--d-font-mono)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:8px 0 32px}
.qc{background:var(--d-surface);border:1px solid var(--d-border);border-radius:10px;padding:12px 14px}
.qc b{display:block;font-family:var(--d-font-mono);color:var(--d-accent);font-size:13px}.qc span{color:var(--d-muted);font-size:12.5px}
.notes{border-top:1px dashed var(--d-border);padding:16px 0 28px;color:var(--d-muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.notes .tag{color:var(--d-accent);font-weight:700;letter-spacing:.12em;font-size:11px}
.sizes{display:flex;align-items:flex-end;gap:16px}.sizes figure{margin:0;text-align:center}.sizes figcaption{font-size:11px;margin-top:4px}
.tab{display:inline-flex;align-items:center;gap:7px;background:var(--d-surface);border:1px solid var(--d-border);border-radius:8px 8px 0 0;padding:5px 12px;color:var(--d-ink);font-size:12px}
/* the hero picture: picture C, kernel and rooms, drawn from the distribution's module list */
.k-core{fill:var(--d-surface-2);stroke:var(--d-accent);stroke-width:2}
.k-cap{fill:var(--d-accent);font-weight:700;letter-spacing:.14em;font-size:15px}
.k-sub{fill:var(--d-muted);font-size:12.5px}
.k-ring{fill:none;stroke:var(--d-border);stroke-width:1.5;stroke-dasharray:3 6}
.k-wire{stroke:var(--d-accent);stroke-width:2.5}
.k-room text,.k-lbl{fill:var(--d-ink);font-weight:700;font-size:14px}
.k-free{fill:none;stroke:var(--d-muted);stroke-width:1.5;stroke-dasharray:6 5}
.k-free-t{fill:var(--d-muted);font-size:12px}
.k-roof{fill:none;stroke:var(--d-accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
@media (max-width:820px){
  .nav{padding:10px 16px}.nav .lnk{display:none}
  .wrap{padding:0 16px}
  .hero{grid-template-columns:1fr;gap:22px;padding:26px 0 16px}
  h1{font-size:31px}.tagline{font-size:15px;margin-bottom:18px}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage .cap{flex-direction:column;gap:2px}
}
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="#" aria-label="home"><span data-mark="26"></span><span data-brand="product"></span></a>
  <span class="sp"></span>
  <a class="lnk" href="#">Help</a><a class="lnk" href="#">How it fits</a>
  <a class="pill accent" href="#">Sign in</a>
</nav>
<main class="wrap">
  <section class="hero">
    <div>
      <span class="badge"><span class="dot" aria-hidden="true"></span><span data-brand="modcount"></span></span>
      <h1>One kernel. Modules plug in. <span class="acc">Your product, your way.</span></h1>
      <p class="product" data-brand="product"></p>
      <p class="tagline" data-brand="tagline"></p>
      <div class="cta">
        <a class="pill accent" href="#">Open the terminal</a>
        <a class="pill" href="#">How it fits together</a>
      </div>
    </div>
    <figure class="stage" style="margin:0">
      <div data-hero></div>
      <figcaption class="cap"><span>rooms = modules · a socket takes a .dmod</span><span data-brand="modules"></span></figcaption>
    </figure>
  </section>
  <nav class="quick" aria-label="Quick commands" data-cards></nav>
  <section class="notes" aria-label="Mock-up notes">
    <span class="tag">MOCK-UP NOTES</span>
    <div class="sizes" aria-label="The mark at every size">
      <figure><span data-mark="64"></span><figcaption>64</figcaption></figure>
      <figure><span data-mark="32"></span><figcaption>32</figcaption></figure>
      <figure><span data-mark="24"></span><figcaption>24</figcaption></figure>
      <figure><span data-mark="16"></span><figcaption>16</figcaption></figure>
      <figure><span class="tab"><span data-mark="16"></span><span data-brand="product"></span></span><figcaption>browser tab</figcaption></figure>
    </div>
    <span>Name, tagline and rooms from the distribution file's <code>brand</code> and <code>modules</code>; nothing hard-coded.</span>
  </section>
</main>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var ALL = [["banking", "banking"], ["market-data", "market data"], ["capitalmarkets", "capital markets"], ["economy", "economy"]];
  var has = function (id) { return D.modules.indexOf(id) >= 0; };
  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  /* the mark: a roof, a 2x2 of rooms (the distribution's modules lit, the rest outlined) and the kernel bar; below 20px, outlines drop */
  function mark(size) {
    var s = el("svg", {viewBox: "0 0 48 48", width: size, height: size, "aria-hidden": "true"});
    var small = size < 20, sw = small ? 4.5 : 3.2;
    el("path", {d: "M5 20 L24 6 L43 20", fill: "none", stroke: "var(--d-accent)", "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round"}, s);
    ALL.forEach(function (m, i) {
      var x = i % 2 ? 26 : 10, y = i < 2 ? 22 : 32, c = "var(--m-" + m[0] + ")";
      if (has(m[0])) el("rect", {x: x, y: y, width: 12, height: 8, rx: 1.5, fill: c}, s);
      else if (!small) el("rect", {x: x + .75, y: y + .75, width: 10.5, height: 6.5, rx: 1.5, fill: "none", stroke: "var(--d-muted)", "stroke-width": 1.2, "stroke-dasharray": "2 1.6"}, s);
    });
    el("rect", {x: 5, y: 42, width: 38, height: small ? 5 : 4, rx: 1.5, fill: "var(--d-accent)"}, s);
    return s;
  }
  /* the hero: picture C's kernel and rooms; a module the distribution lacks is an empty socket */
  function hero() {
    var s = el("svg", {viewBox: "0 0 560 404", role: "img", "aria-label": "The kernel with its rooms: " + D.modules.join(", ") + " plugged in; empty sockets take more modules"});
    var cx = 280, cy = 222;
    el("path", {d: "M130 64 L280 8 L430 64", "class": "k-roof"}, s);
    el("circle", {cx: cx, cy: cy, r: 146, "class": "k-ring"}, s);
    var pos = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    ALL.forEach(function (m, i) {
      var dx = pos[i][0], dy = pos[i][1], w = 136, h = 64;
      var tx = cx + dx * 176 - w / 2, ty = cy + dy * 128 - h / 2;
      if (has(m[0])) {
        el("line", {x1: cx + dx * 66, y1: cy + dy * 52, x2: cx + dx * (176 - w / 2), y2: cy + dy * (128 - h / 2), "class": "k-wire"}, s);
        var g = el("g", {"class": "k-room"}, s), c = "var(--m-" + m[0] + ")";
        el("rect", {x: tx, y: ty, width: w, height: h, rx: 8, fill: c, "fill-opacity": .18, stroke: c, "stroke-width": 2}, g);
        el("text", {x: tx + w / 2, y: ty + h / 2 + 5, "text-anchor": "middle"}, g, m[1]);
      } else {
        el("rect", {x: tx + 14, y: ty + 8, width: w - 28, height: h - 16, rx: 7, "class": "k-free"}, s);
        el("text", {x: tx + w / 2, y: ty + h / 2 + 4, "text-anchor": "middle", "class": "k-free-t"}, s, ".dmod");
      }
    });
    [[1, -1], [1, 1], [-1, 1], [-1, -1]].forEach(function (d) {
      el("circle", {cx: cx + d[0] * 103, cy: cy + d[1] * 103, r: 7, "class": "k-free"}, s);
    });
    el("rect", {x: cx - 66, y: cy - 52, width: 132, height: 104, rx: 12, "class": "k-core"}, s);
    el("text", {x: cx, y: cy - 2, "text-anchor": "middle", "class": "k-cap"}, s, "KERNEL");
    el("text", {x: cx, y: cy + 18, "text-anchor": "middle", "class": "k-sub"}, s, "one foundation");
    return s;
  }
  var names = {"banking": "banking", "market-data": "market data", "capitalmarkets": "capital markets", "economy": "economy"};
  var fill = {
    product: D.product, tagline: D.tagline,
    modcount: D.modules.length + " modules on one kernel",
    modules: D.modules.map(function (m) { return names[m]; }).join(" · ")
  };
  document.querySelectorAll("[data-brand]").forEach(function (e) { e.textContent = fill[e.getAttribute("data-brand")]; });
  document.querySelectorAll("[data-mark]").forEach(function (e) { e.appendChild(mark(+e.getAttribute("data-mark"))); });
  document.querySelector("[data-hero]").appendChild(hero());
  document.title = D.product + " · landing mock-up";
  var q = document.querySelector("[data-cards]");
  D.cards.forEach(function (c) {
    var a = document.createElement("a"); a.className = "qc"; a.href = "#";
    var b = document.createElement("b"); b.textContent = c[0]; var sp = document.createElement("span"); sp.textContent = c[1];
    a.appendChild(b); a.appendChild(sp); q.appendChild(a);
  });
})();
</script>
</body>
</html>
