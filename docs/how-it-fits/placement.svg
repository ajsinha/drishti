<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Where things run: placement.yaml places the sample module&#x27;s api part on nodes tagged web (drishti-main and drishti-b), its heavy compute part on one node tagged heavy (drishti-b), and its feeds on main and b with one owner; drishti-c holds nothing of it and forwards calls once to a placed node. Heavy parts are capped by max-nodes and never spread to every node without allow-all." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif">
