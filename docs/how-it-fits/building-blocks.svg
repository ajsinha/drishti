<title>The three building blocks</title>
<desc>The three building blocks: people use a console; the console calls one or many kernel nodes as the person; modules plug a console part into the console and a server part into the kernel; the kernel reads the site&#x27;s lakes and sources through bindings and connectors.</desc>
<defs><marker id="a1a2333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a2333"/></marker><marker id="a1f5fbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker><marker id="a1e8a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1e8a55"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker><marker id="ac27a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c27a12"/></marker><marker id="a1d8c7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d8c7f"/></marker><marker id="a5c6a80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5c6a80"/></marker><marker id="a12324f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12324f"/></marker><marker id="a6a4fb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6a4fb3"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="639" rx="14" fill="#f7f9fc" stroke="#cdd6e3"/>
<text x="24" y="38" font-size="20" font-weight="700" fill="#12324f" text-anchor="start">The three building blocks</text>
<text x="24" y="60" font-size="13" font-weight="400" fill="#5c6a80" text-anchor="start">A kernel that knows no industry, a console in front of it, and modules that bring one.</text>
<rect x="24" y="84" width="470" height="40" rx="8" fill="#ffffff" stroke="#5c6a80" stroke-width="1.5"/>
<text x="259.0" y="106" font-size="13" font-weight="400" fill="#1a2333" text-anchor="middle">People: browsers, phones, pages that embed Drishti</text>
<path d="M258,124 L258,146" fill="none" stroke="#12324f" stroke-width="1.8" marker-end="url(#a12324f)"/>
<rect x="24" y="150" width="470" height="140" rx="8" fill="#ebe5f7" stroke="#6a4fb3" stroke-width="1.5"/>
<text x="36" y="172" font-size="14" font-weight="700" fill="#6a4fb3" text-anchor="start">THE CONSOLE  ·  the UI tier</text>
<text x="36" y="191" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the shell: header, lenses, themes, Home, Help, search</text>
<text x="36" y="209" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Drishti Elements and the Sutra renderer</text>
<text x="36" y="227" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">the BI and pivot screens · Admin</text>
<text x="36" y="245" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">in front of one kernel or a whole cluster</text>
<text x="36" y="263" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">hosts each module&#x27;s console part under /m/&lt;id&gt;/</text>
<path d="M258,290 L258,318" fill="none" stroke="#1e8a55" stroke-width="1.8" marker-end="url(#a1e8a55)"/>
<text x="268" y="309" font-size="12" font-weight="400" fill="#1e8a55" text-anchor="start" font-style="italic">REST, as the signed-in person</text>
<rect x="24" y="322" width="470" height="176" rx="8" fill="#e3eaf3" stroke="#12324f" stroke-width="1.5"/>
<text x="36" y="344" font-size="14" font-weight="700" fill="#12324f" text-anchor="start">THE KERNEL  ·  the server, 1..n nodes</text>
<text x="36" y="363" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">domain-free: knows no bank, no gene</text>
<text x="36" y="381" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">connectors and bindings · lakes · data loads</text>
<text x="36" y="399" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Rachana (one grammar) · pivot, BI, aggregation · Explain</text>
<text x="36" y="417" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">compute engines · sandboxed Python workers</text>
<text x="36" y="435" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">access registry · audit · Drishti*net cluster · placement</text>
<text x="36" y="453" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">hosts each module&#x27;s server part</text>
<rect x="514" y="150" width="222" height="348" rx="8" fill="#e1ebfa" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="526" y="172" font-size="14" font-weight="700" fill="#1f5fbf" text-anchor="start">MODULES (.dmod)</text>
<text x="526" y="191" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">packages, built apart</text>
<text x="526" y="209" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start"></text>
<text x="526" y="227" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">banking</text>
<text x="526" y="245" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">market-data</text>
<text x="526" y="263" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">capital-markets</text>
<text x="526" y="281" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">economy</text>
<text x="526" y="299" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">genomics (a sample)</text>
<text x="526" y="317" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start"></text>
<text x="526" y="335" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">each brings packs, compute,</text>
<text x="526" y="353" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">functions, lenses, pages,</text>
<text x="526" y="371" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">Help; it names the data it</text>
<text x="526" y="389" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">needs, never connectors</text>
<text x="526" y="407" font-size="13" font-weight="400" fill="#1a2333" text-anchor="start">or secrets</text>
<path d="M512,220 L496,220" fill="none" stroke="#6a4fb3" stroke-width="1.8" marker-end="url(#a6a4fb3)"/>
<text x="506" y="210" font-size="11" font-weight="400" fill="#6a4fb3" text-anchor="end" font-style="italic">console part</text>
<path d="M512,420 L496,420" fill="none" stroke="#12324f" stroke-width="1.8" marker-end="url(#a12324f)"/>
<text x="506" y="410" font-size="11" font-weight="400" fill="#12324f" text-anchor="end" font-style="italic">server part</text>
<path d="M258,498 L258,526" fill="none" stroke="#1e8a55" stroke-width="1.8" marker-end="url(#a1e8a55)"/>
<text x="268" y="517" font-size="12" font-weight="400" fill="#1e8a55" text-anchor="start" font-style="italic">through bindings and connectors</text>
<rect x="24" y="530" width="712" height="40" rx="8" fill="#dff2ea" stroke="#1e8a55" stroke-width="1.5"/>
<text x="380.0" y="552" font-size="13" font-weight="400" fill="#1a2333" text-anchor="middle">Your data: lakes (Delta, Iceberg) and sources (Kafka, JDBC, files, Redis …)</text>
<text x="380" y="604" font-size="12.5" font-weight="400" fill="#5c6a80" text-anchor="middle">Which modules make the product: the distribution file. Which data: bindings.yaml. Which nodes: placement.yaml.</text>
</svg>
