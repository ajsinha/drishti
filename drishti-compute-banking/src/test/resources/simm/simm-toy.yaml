# TOY SIMM PARAMETERS: NOT ISDA'S. Round illustrative numbers invented for Drishti's tests and the worked examples of
# docs/architecture/SENSITIVITIES_AND_FRTB_SA.md (section 13.1, cases 6 and 11) and docs/contracts/SIMM.md (section 15). They prove the
# engine's formulas, never the licensed values: no figure computed with this file is an initial margin. The structure is
# docs/architecture/capital-parameters/simm.yaml (shipped with every number empty); a bank loads its own licensed file per version.

version: TOY-1
effective-from: 2026-01-01
source: "TOY parameters for Drishti's tests and worked examples: round illustrative numbers, NOT ISDA's (no licensed value)"
holding-period-days: 10
calculation-currency: USD        # the currency the thresholds are set in (converted at the date's FX for another calculation currency)
regimes: [CFTC, SEC, PRA, EMIR, FINMA, JFSA, OSFI, APRA, MAS, HKMA, KFSC, BACEN, NONE]   # the regime codes the version recognises
product-classes: [RatesFX, Credit, Equity, Commodity]
risk-classes: [InterestRate, CreditQ, CreditNonQ, Equity, Commodity, FX]
# psi: across the six risk classes, within a product class (rows and columns in the order of risk-classes); the four product
# classes are added, with no correlation between them
risk-class-correlation:
  - [1, 0.3, 0.25, 0.25, 0.25, 0.25]
  - [0.3, 1, 0.25, 0.25, 0.25, 0.25]
  - [0.25, 0.25, 1, 0.25, 0.25, 0.25]
  - [0.25, 0.25, 0.25, 1, 0.25, 0.25]
  - [0.25, 0.25, 0.25, 0.25, 1, 0.25]
  - [0.25, 0.25, 0.25, 0.25, 0.25, 1]

