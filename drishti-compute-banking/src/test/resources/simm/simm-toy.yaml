  inflation-correlation: 0.3      # inflation to a curve of its currency
  cross-currency-basis-correlation: 0.2   # the basis to anything of its currency
  across-currencies: 0.3          # gamma
  vega-risk-weight: 0.3
  historical-volatility-ratio: 0.8   # HVR_IR: the curvature margin is multiplied by HVR_IR^-2
  threshold-groups: {1: [USD], 2: [EUR, GBP]}   # the currencies of each concentration group; any other currency: other
  concentration-thresholds:      # per group, per bp (delta) and in the currency (vega)
    delta: {1: 1000000, 2: 1000000, other: 20000}
    vega: {1: 1000000000, 2: 1000000000, other: 50000000}

