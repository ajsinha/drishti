# The demo's data bindings when it runs with Kafka (deploy/docker/compose.data.yaml; the server started with
# DRISHTI_BINDINGS_FILE=config/demo/bindings.yaml and DRISHTI_STREAM_<SYSTEM>=true): where a correction of a trade is written, by the
# record's source system: each system's own live connector (modules/source-<system>/connectors/trade-<system>-live.yaml), never another
# system's (docs/architecture/KERNEL_AND_MODULES.md section 18.6). The read is not bound here: `trade` reads what the source modules that
# are on declare (kinds: [trade] in their templates, as a union), so a seventh source module switched on is read with no edit of this
# file, and one switched off drops out. Nothing copies this file into a site.
format: 1

bindings:
  trade:
    write:
      connectors:
        ENDUR: trade-endur-live
        CALYPSO: trade-calypso-live
        MUREX: trade-murex-live
        WSS: trade-wss-live
        SWAPONE: trade-swapone-live
        ICI: trade-ici-live
