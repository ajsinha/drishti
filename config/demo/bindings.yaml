# The demo's data bindings (docs/architecture/KERNEL_AND_MODULES.md section 5; modules/trading/docs/guide.md, "Source systems"): the one
# `trade` kind read from the six source systems' modules, as a union. Endur, Calypso and Murex keep a table each; WSS, SwapOne and ICI
# share trading.trades_shared and each connector selects its own rows with where: SOURCE_SYSTEM = ... (the connectors are written by
# `drishti.py lake demo` from modules/source-<system>/connectors/delta.yaml). `lake demo` copies this file to config/bindings.yaml
# when the site has none; a source module switched off (config/modules/source-<system>.yaml) drops out of the union.
format: 1

bindings:
  trade:
    read: [trade-endur, trade-calypso, trade-murex, trade-wss, trade-swapone, trade-ici]
    union: true
