# config/feeds/world-economy.yaml: the world economy feed (docs/guides/FEEDS_GUIDE.md; every key in its section "The feed file").
# It carries the IMF's World Economic Outlook forecasts, which are INTERNAL USE ONLY (the IMF's terms: no commercial reuse without
# permission; the owner kept them for internal use, 2026-10-10 and 2026-10-29). `-- --no-imf` builds without them.
#   python3 tools/drishti.py feed run world-economy                         pull, write data/feeds/world-economy/<date>/, load into worldlake
#   python3 tools/drishti.py feed run world-economy -- --no-imf             the same without any IMF data
#   python3 tools/drishti.py feed run world-economy --snapshot --internal-ok   refresh the committed dataset and pack instead
feed: world-economy
title: World economy (World Bank, IMF, UNDP, CIA World Factbook)
description: >-
  Economies, macro indicators, labour markets, fiscal positions and forecasts of every country and region (World Bank WDI and WGI, IMF
  World Economic Outlook, UNDP Human Development Index), and jurisdictions, parties, office holders and elections (CIA World Factbook).
class: world_economy.WorldEconomyFeed  # tools/feeds/sources/world_economy.py
source:
  provider: World Bank, IMF, UNDP, CIA World Factbook
  url: https://data.worldbank.org
  pause: 0.4
  retries: 3
  cache-hours: 20
lake: worldlake
load: java
schedule: {at: "06:45", days: daily}
licence:
  name: World Bank CC BY 4.0; IMF terms (no commercial reuse without permission); UNDP CC BY 3.0 IGO; Factbook public domain
  url: https://www.imf.org/en/About/copyright-and-terms
  redistribution: internal-only
  internal-only: true
  attribution: "World Bank World Development Indicators (CC BY 4.0); IMF World Economic Outlook; UNDP Human Development Reports; CIA World Factbook"
  notes: internal only because of the IMF forecasts; a build with -- --no-imf carries only redistributable data
datasets:
  economy:           {pack: world-economy, kind: economy}
  macro-indicator:   {pack: world-economy, kind: macro-indicator}
  economic-forecast: {pack: world-economy, kind: economic-forecast, description: "IMF WEO forecasts (internal use only)"}
  labour-market:     {pack: world-economy, kind: labour-market}
  fiscal-position:   {pack: world-economy, kind: fiscal-position}
  region-economy:    {pack: world-economy, kind: region-economy}
  jurisdiction:      {pack: world-economy, kind: jurisdiction}
  party:             {pack: world-economy, kind: party}
  office-holder:     {pack: world-economy, kind: office-holder}
  election:          {pack: world-economy, kind: election}
  region:            {pack: world-economy, kind: region}
  social-indicator:  {pack: world-economy, kind: social-indicator}
options:
  args: []
snapshot:
  note: with --internal-ok, refreshes tools/realdata/dataset, config/packs/world-economy and tools/packgen/world (carries IMF data)
