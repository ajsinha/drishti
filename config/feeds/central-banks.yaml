# The central-banks feed (docs/guides/PUBLIC_SECTOR_GUIDE.md section 5): policy rates and market series from FRED (the Federal Reserve
# Bank of St. Louis) and the Bank of Canada's Valet API into worldlake, for the central-banks pack. Class:
# tools/feeds/sources/central_banks.py. Daily; incremental (each series asked from a few days before its last observation).
# FRED needs a free API key (https://fred.stlouisfed.org/docs/api/api_key.html) in DRISHTI_FRED_API_KEY; without it the FRED series are
# left out, said in the run's log, and the Bank of Canada's (no key) still load.
# Run: python3 tools/drishti.py feed run central-banks (EXTERNAL_DATA.md); options.sources holds each source's licence and terms; the rest of
# options is the default selection.
feed: central-banks
title: Central banks (FRED and the Bank of Canada)
description: 'The public-sector module''s central-banks pack (docs/guides/PUBLIC_SECTOR_GUIDE.md): Policy rates and the market series around them: the Federal
  Reserve''s target range and effective rate, Treasury yields, the curve''s slope, US inflation, unemployment and the Fed''s balance sheet (FRED, Federal
  Reserve Bank of St. Louis), and the Bank of Canada''s target rate, CORRA, Government of Canada yields and USD/CAD (Bank of Canada Valet). A bank''s page
  shows its policy rate, its last move and its series; each series shows two years of history. Filled daily by the central-banks feed into the worldlake
  lake; FRED needs a free key in DRISHTI_FRED_API_KEY.'
class: central_banks.CentralBanksFeed
source:
  provider: FRED, Federal Reserve Bank of St. Louis, Bank of Canada
  url: https://fred.stlouisfed.org/
  pause: 0.6
  retries: 3
  timeout: 60
  cache-hours: 12
lake: worldlake
load: java
enabled: true
schedule:
  at: '18:15'
  days: weekdays
licence:
  name: 'FRED API terms (the default series: US government works, public domain); Bank of Canada terms (free use with attribution)'
  url: https://fred.stlouisfed.org/docs/api/terms_of_use.html
  redistribution: attribution
  internal-only: false
  attribution: 'Source: FRED, Federal Reserve Bank of St. Louis; Bank of Canada.'
  notes: each source's terms are its entry in options.sources; a FRED series with a third-party copyright needs internal-only there
keys:
  api_key:
    env: ${DRISHTI_FRED_API_KEY}
    required: false
datasets:
  central-bank:
    pack: central-banks
    kind: central-bank
    key: BANK_ID
  rate-series:
    pack: central-banks
    kind: rate-series
    key: SERIES_ID
options:
  module: publicsector
  sources:
  - id: fred
    name: FRED API (Federal Reserve Bank of St. Louis)
    title: FRED, Federal Reserve Bank of St. Louis
    url: https://fred.stlouisfed.org/
    terms: https://fred.stlouisfed.org/docs/api/terms_of_use.html
    licence: 'FRED API terms of use; each series keeps its owner''s terms. The default series are US government works (Federal Reserve Board, US Treasury,
      BLS): public domain'
    redistributable: true
    internal-only: false
    attribution: 'Source: FRED, Federal Reserve Bank of St. Louis; the series'' original source as FRED names it.'
  - id: boc
    name: Bank of Canada Valet API
    title: Bank of Canada
    url: https://www.bankofcanada.ca/valet/docs
    terms: https://www.bankofcanada.ca/terms/
    licence: 'Bank of Canada terms of use: free to use, copy, distribute and transmit with attribution; inside a paid service, tell buyers the data is free
      on bankofcanada.ca'
    redistributable: true
    internal-only: false
    attribution: 'Source: Bank of Canada.'
  history-days: 730
  banks:
  - id: FED
    name: Federal Reserve
    country: USA
    country-name: United States
    currency: USD
    website: https://www.federalreserve.gov
    policy-series: fred:DFEDTARU
    press: PRESS-FED
  - id: BOC
    name: Bank of Canada
    country: CAN
    country-name: Canada
    currency: CAD
    website: https://www.bankofcanada.ca
    policy-series: boc:V39079
    press: PRESS-BOC
  series:
  - source: fred
    code: DFEDTARU
    bank: FED
    title: Federal funds target range, upper limit
    unit: '%'
  - source: fred
    code: DFF
    bank: FED
    title: Federal funds effective rate
    unit: '%'
  - source: fred
    code: DGS2
    bank: FED
    title: US Treasury 2-year yield
    unit: '%'
  - source: fred
    code: DGS10
    bank: FED
    title: US Treasury 10-year yield
    unit: '%'
  - source: fred
    code: T10Y2Y
    bank: FED
    title: US 10-year less 2-year Treasury spread
    unit: percentage points
  - source: fred
    code: CPIAUCSL
    bank: FED
    title: US consumer price index, all urban consumers
    unit: index 1982-84=100, SA
  - source: fred
    code: UNRATE
    bank: FED
    title: US unemployment rate
    unit: '%'
  - source: fred
    code: WALCL
    bank: FED
    title: Federal Reserve total assets
    unit: USD millions
  - source: boc
    code: V39079
    bank: BOC
    title: Bank of Canada target for the overnight rate
    unit: '%'
  - source: boc
    code: AVG.INTWO
    bank: BOC
    title: CORRA, Canadian overnight repo rate average
    unit: '%'
  - source: boc
    code: BD.CDN.2YR.DQ.YLD
    bank: BOC
    title: Government of Canada 2-year benchmark yield
    unit: '%'
  - source: boc
    code: BD.CDN.10YR.DQ.YLD
    bank: BOC
    title: Government of Canada 10-year benchmark yield
    unit: '%'
  - source: boc
    code: FXUSDCAD
    bank: BOC
    title: USD/CAD daily exchange rate
    unit: CAD per USD
