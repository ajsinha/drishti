# The central-banks feed (docs/guides/PUBLIC_SECTOR_GUIDE.md section 5): policy rates and market series from FRED (the Federal Reserve
# Bank of St. Louis) and the Bank of Canada's Valet API into worldlake, for the central-banks pack. Pull:
# tools/feeds/publicsector/central_banks.py. Daily; incremental (each series asked from a few days before its last observation).
# FRED needs a free API key (https://fred.stlouisfed.org/docs/api/api_key.html) in DRISHTI_FRED_API_KEY; without it the feed does not
# run (exit 3) and says so. The Bank of Canada needs no key.
feed: central-banks
title: Central banks (FRED and the Bank of Canada)
module: publicsector
pack: central-banks
lake: worldlake
pull: tools/feeds/publicsector/central_banks.py
schedule: { cadence: daily, cron: "15 22 * * 1-5", timezone: UTC }   # after the US and Canadian markets close
tables:
  - { kind: central-bank, connector: centralbank-store, table: centralbank.central-bank, key: BANK_ID }
  - { kind: rate-series, connector: centralbank-store, table: centralbank.rate-series, key: SERIES_ID }
keys:
  - { for: fred, env: DRISHTI_FRED_API_KEY, required: true, register: "https://fred.stlouisfed.org/docs/api/api_key.html" }
limits: { pause-seconds: 0.6, timeout-seconds: 60 }   # FRED allows 120 requests a minute
sources:
  - id: fred
    name: FRED API (Federal Reserve Bank of St. Louis)
    title: FRED, Federal Reserve Bank of St. Louis
    url: https://fred.stlouisfed.org/
    terms: https://fred.stlouisfed.org/docs/api/terms_of_use.html
    licence: "FRED API terms of use; each series keeps its owner's terms. The default series are US government works (Federal Reserve Board, US Treasury, BLS): public domain"
    redistributable: true    # for the default series only: a series with a third-party copyright (FRED marks it in its notes) needs its own flag below
    internal-only: false
    attribution: "Source: FRED, Federal Reserve Bank of St. Louis; the series' original source as FRED names it."
  - id: boc
    name: Bank of Canada Valet API
    title: Bank of Canada
    url: https://www.bankofcanada.ca/valet/docs
    terms: https://www.bankofcanada.ca/terms/
    licence: "Bank of Canada terms of use: free to use, copy, distribute and transmit with attribution; inside a paid service, tell buyers the data is free on bankofcanada.ca"
    redistributable: true
    internal-only: false
    attribution: "Source: Bank of Canada."
selection:
  history-days: 730          # two years of history in each series' document
  banks:
    - { id: FED, name: Federal Reserve, country: USA, country-name: United States, currency: USD, website: "https://www.federalreserve.gov", policy-series: "fred:DFEDTARU", press: PRESS-FED }
    - { id: BOC, name: Bank of Canada, country: CAN, country-name: Canada, currency: CAD, website: "https://www.bankofcanada.ca", policy-series: "boc:V39079", press: PRESS-BOC }
  # the default series: each bank's policy rate, the overnight rate the market sets, two- and ten-year government yields, and for the US
  # the curve's slope, inflation, unemployment and the Fed's balance sheet; for Canada the US dollar rate
  series:
    - { source: fred, code: DFEDTARU, bank: FED, title: "Federal funds target range, upper limit", unit: "%" }
    - { source: fred, code: DFF, bank: FED, title: "Federal funds effective rate", unit: "%" }
    - { source: fred, code: DGS2, bank: FED, title: "US Treasury 2-year yield", unit: "%" }
    - { source: fred, code: DGS10, bank: FED, title: "US Treasury 10-year yield", unit: "%" }
    - { source: fred, code: T10Y2Y, bank: FED, title: "US 10-year less 2-year Treasury spread", unit: "percentage points" }
    - { source: fred, code: CPIAUCSL, bank: FED, title: "US consumer price index, all urban consumers", unit: "index 1982-84=100, SA" }
    - { source: fred, code: UNRATE, bank: FED, title: "US unemployment rate", unit: "%" }
    - { source: fred, code: WALCL, bank: FED, title: "Federal Reserve total assets", unit: "USD millions" }
    - { source: boc, code: V39079, bank: BOC, title: "Bank of Canada target for the overnight rate", unit: "%" }
    - { source: boc, code: AVG.INTWO, bank: BOC, title: "CORRA, Canadian overnight repo rate average", unit: "%" }
    - { source: boc, code: BD.CDN.2YR.DQ.YLD, bank: BOC, title: "Government of Canada 2-year benchmark yield", unit: "%" }
    - { source: boc, code: BD.CDN.10YR.DQ.YLD, bank: BOC, title: "Government of Canada 10-year benchmark yield", unit: "%" }
    - { source: boc, code: FXUSDCAD, bank: BOC, title: "USD/CAD daily exchange rate", unit: "CAD per USD" }
