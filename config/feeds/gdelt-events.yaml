# The gdelt-events feed (docs/guides/PUBLIC_SECTOR_GUIDE.md section 5): the GDELT 1.0 daily event files reduced to events and tone by
# country and CAMEO category, into newslake, for the gdelt-events pack. Pull: tools/feeds/publicsector/gdelt_events.py. Daily (a day's
# file is complete the morning after, about 06:00 UTC); incremental (only the days after the last one processed; each about 7 MB
# zipped, read as it streams, never kept). No key.
feed: gdelt-events
title: GDELT, events and tone by country
module: publicsector
pack: gdelt-events
lake: newslake
pull: tools/feeds/publicsector/gdelt_events.py
schedule: { cadence: daily, cron: "30 8 * * *", timezone: UTC }
tables:
  - { kind: event-country, connector: gdelt-store, table: gdelt.event-country, key: EVENT_COUNTRY_ID }
keys: []
limits: { pause-seconds: 1, timeout-seconds: 180 }
sources:
  - id: gdelt
    name: GDELT 1.0 daily event files
    title: The GDELT Project
    url: https://www.gdeltproject.org/data.html
    terms: https://www.gdeltproject.org/about.html#termsofuse
    licence: "GDELT terms of use: free and open for any use, commercial included, with a citation of the GDELT Project and a link to it"
    redistributable: true
    internal-only: false
    attribution: "Source: The GDELT Project (https://www.gdeltproject.org/)."
selection:
  backfill-days: 7             # the first pull (or one after a gap) reads at most this many days
  history-days: 30             # the daily history in each country's document
  min-events: 20               # a country with fewer events on the latest day is left out (too few to read its tone)
  top-stories: 5               # the most-mentioned stories' links kept a country
  # rows-per-day: (unset)      # tests only: read the first N rows of a day's file
