# config/modules/publicsector.yaml: the public-sector module at this site (docs/architecture/ACCESS_MODEL.md, docs/guides/PUBLIC_SECTOR_GUIDE.md):
# content only (the world-development, central-banks, national-statistics, oecd, official-news and gdelt-events packs, their functions and
# the Public sector lens), shipped with the core server. This file holds the administrator's switch; the setting
# drishti.modules.publicsector.enabled (DRISHTI_MODULES_PUBLICSECTOR_ENABLED) wins over it. A change takes effect at the next start: off,
# its packs and connectors do not load, its functions (WDI, CBANK, PRESS, GDELT ...) are gone and its lens is not offered.
enabled: true
