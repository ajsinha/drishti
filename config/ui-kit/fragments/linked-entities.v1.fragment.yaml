# The Drishti UI kit (SUTRA_NEXT.md): platform UI vocabulary every server loads, hand-written, versioned, used as { use: linked-entities@1, with: {...} }.
rachana: 1
fragment: linked-entities
version: 1
description: "The entities this record refers to and that refer to it, each one click away."
params:
  id: refs
  title: Linked entities
  code: REFS
  key: ''
  area: right
doc:
  summary: "The entities this record refers to and that refer to it, each one click away."
  description: >-
    The links of the record as the pack's link rules find them (its counterparty, its book, its curve, the trades that
    use it), grouped by kind, each opening its own page. Readers without the right to open a kind do not see its links.
  params:
    id: { type: id, default: refs, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: Linked entities, meaning: "The title over the links" }
    code: { type: key, default: REFS, meaning: "The panel's mnemonic code" }
    key: { type: key, default: '', meaning: "The function key (F2 to F12) that brings the panel forward; none when empty" }
    area: { type: area, default: right, meaning: "Where the panel sits: right (the default) or main" }
  emits: []
  expects: []
  examples:
    - { use: linked-entities@1 }
  since: "2.7.0"
panels:
  - id: %{id}
    kind: links
    title: "%{title}"
    code: %{code}
    key: %{key}
    area: %{area}
