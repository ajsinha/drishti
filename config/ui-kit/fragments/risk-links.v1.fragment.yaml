# The Drishti UI kit (SUTRA_NEXT.md): platform UI vocabulary every server loads, hand-written, versioned, used as { use: risk-links@1, with: {...} }.
rachana: 1
fragment: risk-links
version: 1
description: "A trade's risk, one click away: its P&L vector, its VaR and its exposure, or why it has none."
params:
  id: risk
  title: Risk
  code: RISK
  key: ''
  area: right
doc:
  summary: "A trade's risk, one click away: its P&L vector, its VaR and its exposure, or why it has none."
  description: >-
    Three links of a trade page: its P&L vector over the scenario days (the market-risk pack's pnl-vector, PNLV
    PV-<trade>-HS-509; a trade the batch sent as scenario PVs links them instead, the scenario-pv kind, SPV SPV-<trade>-HS-509), its VaR (the computed kind var-result, VRES TRD:<trade>; VAR TRD <trade> opens it in the VaR explorer)
    and its exposure (the computed kind exposure-result, EXP TRD:<trade>). The engines set the links on the view of the trade
    when the day's vectors and the exposure run hold it (PNL_VECTOR_ID or SCENARIO_PV_ID, VAR_RESULT_ID, EXPOSURE_RESULT_ID: real links, also listed
    with the linked entities); when they do not, the row says why (not live on the date: its status or its maturity, no P&L
    vector; no exposure paths).
  params:
    id: { type: id, default: risk, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: Risk, meaning: "The title over the links" }
    code: { type: key, default: RISK, meaning: "The panel's mnemonic code, typed in the command line to jump to it" }
    key: { type: key, default: '', meaning: "The function key (F2 to F12) that brings the panel forward; none when empty" }
    area: { type: area, default: right, meaning: "Where the panel sits: right (the default) or main" }
  emits: []
  expects: []
  examples:
    - { use: risk-links@1 }
  since: "2.9.2"
panels:
  - id: %{id}
    kind: kv
    title: "%{title}"
    code: %{code}
    key: %{key}
    area: %{area}
    columns:
      - { label: P&L vector, bind: "nonblank($.PNL_VECTOR_ID) ? link($.PNL_VECTOR_ID, 'pnl-vector') : (nonblank($.SCENARIO_PV_ID) ? link($.SCENARIO_PV_ID, 'scenario-pv') : nonblank($.RISK_LINKS.PNL_VECTOR_NOTE, 'no P&L vector'))" }
      - { label: VaR of this trade, bind: "nonblank($.VAR_RESULT_ID) ? link($.VAR_RESULT_ID, 'var-result') : nonblank($.RISK_LINKS.VAR_NOTE, 'no VaR')" }
      - { label: Exposure of this trade, bind: "nonblank($.EXPOSURE_RESULT_ID) ? link($.EXPOSURE_RESULT_ID, 'exposure-result') : nonblank($.RISK_LINKS.EXPOSURE_NOTE, 'no exposure paths')" }
