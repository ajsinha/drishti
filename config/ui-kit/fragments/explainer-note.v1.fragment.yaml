# The Drishti UI kit (SUTRA_NEXT.md): platform UI vocabulary every server loads, hand-written, versioned, used as { use: explainer-note@1, with: {...} }.
rachana: 1
fragment: explainer-note
version: 1
description: "A short note in Markdown that tells the reader what the screen shows and how to read it."
params:
  id: note
  title: About these figures
  text: Say what the figures mean.
  code: ''
  key: ''
  area: ''
doc:
  summary: "A short note in Markdown that tells the reader what the screen shows and how to read it."
  description: >-
    A paragraph of Markdown (a method, a caveat, a definition) set beside the figures it explains. Keep it short; long
    text belongs in the pack's guide, linked from here.
  params:
    id: { type: id, default: note, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: About these figures, meaning: "The title over the note" }
    text: { type: text, default: Say what the figures mean., meaning: "The Markdown shown" }
    code: { type: key, default: '', meaning: "The panel's mnemonic code (CRV, REFS), typed in the command line to jump to it; none when empty" }
    key: { type: key, default: '', meaning: "The function key (F2 to F12) that brings the panel forward; none when empty" }
    area: { type: area, default: '', meaning: "Where the panel sits: main (the default when empty) or right" }
  emits: []
  expects: []
  examples:
    - { use: explainer-note@1, with: { text: "Zero rates are continuously compounded, act/365." , area: right } }
  since: "2.7.0"
panels:
  - id: %{id}
    kind: markdown
    title: "%{title}"
    code: %{code}
    key: %{key}
    area: %{area}
    text: "%{text}"
