# The genomicist's Home (milestone H1): the figures first, what needs a look, what changed since the cut-off and the quick mnemonics. Built only from
# library fragments (core of drishti-rachana); every table is a home table served for the person (ROLE_HOME_SUTRAS.md 2). Your Home's cards (the
# association plot, ClinVar updates, the loads) are the module's own and are served as genomics_* home tables.
rachana: 1.2
sutra: home-genomicist
version: 1
libraries: [core@1]
title: { id: "'Genomicist'" }
data:
  meta:      { table: home_meta }
  kpis:      { table: home_kpis,      key: [LABEL] }
  kpi_hist:  { table: home_kpi_history }
  exc:       { table: home_exceptions }
  chg:       { table: home_changes }
  mnem:      { table: home_mnemonics }
layout:
  user-can-arrange: true
  areas:
    - "kpis kpis kpis"
    - "exc chg rail"
  columns: [4, 5, 3]
  phone: [kpis, exc, chg, rail]
panels:
  - use: core/kpi-strip@1
    as: kpi
    area: kpis
    with:
      items: "map($.kpis, {label: @.LABEL, value: @.VALUE, delta: @.DELTA, caption: @.CAPTION, open: @.OPEN})"
      history: { from: $.kpi_hist, columns: { label: LABEL, date: DATE, value: VALUE } }
      fmt: compact
  - use: core/exceptions-list@1
    as: exc
    area: exc
    with:
      title: Needs a look
      rows: { from: $.exc, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/change-feed@1
    as: chg
    area: chg
    with:
      title: Since
      since: "first($.meta).SINCE"
      rows: { from: $.chg, columns: { key: SUBJECT, measure: MEASURE, before: THEN, after: NOW, change: CHANGE, why: WHY, kind: KIND, open: COMMAND } }
  - use: core/data-table@1
    as: mnem
    area: rail
    with:
      title: Quick mnemonics
      search: false
      limit: 12
      rows: $.mnem
      columns: [ { label: Mnemonic, bind: "@.MNEMONIC" }, { label: About, bind: "@.ABOUT" } ]
