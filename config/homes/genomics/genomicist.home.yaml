# A Home (docs/architecture/ROLE_HOME_SUTRAS.md, 1): the genomicist's. The cards of Your Home are the genomics module's own (its console plugin.yaml); this
# file makes the Home exist for the roles that name it, so the module's figures, tables and Needs-you items are served to them and to no one else.
home: genomicist
title: Genomicist
description: "Cohort status, the strongest associations, ClinVar updates for the genes you follow, data loads, files that failed validation"
modules: [ genomics ]                      # offered only while the genomics module is on
sutra: genomicist.sutra.yaml
arrange: allow
measures: genomicist.measures.yaml
