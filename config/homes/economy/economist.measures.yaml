# What the economist's Home follows. The indicators are answered by the economy module's own home table (home_indicators): no KPI of the
# risk engines applies, so kpis and follow are empty; the change detection has no measures here until the module names some.
home: economist
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis: []
follow: []
events: [ load ]
exceptions:
  - { when: load-failed, severity: medium, text: "{subject} failed the load check",     open: "LOADS" }
  - { when: feed-late,   severity: low,    text: "{subject} is {minutes} minutes late", open: "FEEDS" }
mnemonics:
  - { mnemonic: "WEO", about: "World economic outlook" }
  - { mnemonic: "FRED", about: "US economic series" }
  - { mnemonic: "ECO", about: "Economic indicators" }
