# What the operations Home follows (ROLE_HOME_SUTRAS 4). Same layout as risk-manager.measures.yaml; measure codes are answered by the engines' own
# views (VAR, ES, LIM_USE, PNL_DAY, BREACHES: var; PFE, EXPOSURE: exposure); a code with no view yet answers nothing and its figure is left out.
home: operations
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis:
follow:
events: [ load, limit-state ]
exceptions:
  - { when: load-failed,       severity: medium, text: "{subject} failed the load check",         open: "LOADS" }
  - { when: feed-late,         severity: low,    text: "{subject} is {minutes} minutes late",     open: "FEEDS" }
mnemonics:
  - { mnemonic: "LOADS", about: "Loads and their checks" }
  - { mnemonic: "FEEDS", about: "Data feeds" }
  - { mnemonic: "HEALTH", about: "Server health" }
  - { mnemonic: "APPROVALS", about: "Held and pending changes" }
