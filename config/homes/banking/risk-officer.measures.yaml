# What the risk-officer Home follows (ROLE_HOME_SUTRAS 4). Same layout as risk-manager.measures.yaml; measure codes are answered by the engines' own
# views (VAR, ES, LIM_USE, PNL_DAY, BREACHES: var; PFE, EXPOSURE: exposure); a code with no view yet answers nothing and its figure is left out.
home: risk-officer
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis:
  - { label: Firm VaR, engine: var, measure: VAR, args: { level: 0.99, horizon: 1, scope: firm }, fmt: compact, history: 30 }
  - { label: Expected shortfall, engine: var, measure: ES, args: { scope: firm }, fmt: compact, history: 30 }
  - { label: Limit use, engine: var, measure: LIM_USE, args: { scope: firm }, fmt: pct0, history: 30 }
  - { label: Exposure (PFE), engine: exposure, measure: PFE, args: { scope: firm, quantile: 0.95 }, fmt: compact, history: 30 }
  - { label: Breaches, engine: var, measure: BREACHES, args: { scope: firm, window: 250 }, fmt: amount0, history: 30 }
follow:
  - { measure: VAR,      engine: var,      subjects: desk,         min-abs: 100000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data, rolled-window] }
  - { measure: LIM_USE,  engine: var,      subjects: desk,         min-abs: 0,      min-rel: 0.05 }
  - { measure: EXPOSURE, engine: exposure, subjects: counterparty, min-abs: 500000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data] }
events: [ limit-state, load ]
exceptions:
  - { when: "LIM_USE >= 0.95", severity: high,   text: "{subject} {measure} at {value} of limit", open: "VAR {subject}" }
  - { when: "LIM_USE >= 0.80", severity: medium, text: "{subject} {measure} at {value} of limit", open: "VAR {subject}" }
  - { when: load-failed,       severity: medium, text: "{subject} failed the load check",         open: "LOADS" }
  - { when: feed-late,         severity: low,    text: "{subject} is {minutes} minutes late",     open: "FEEDS" }
mnemonics:
  - { mnemonic: "VAR", about: "VaR of a scope" }
  - { mnemonic: "VHIST", about: "VaR and backtest history" }
  - { mnemonic: "EXP", about: "Exposure of a counterparty" }
  - { mnemonic: "LIM", about: "Limits and their use" }
  - { mnemonic: "STRESS", about: "Stress results" }
