# The risk manager's Home (milestone H1, the hybrid): the mnemonic bar is the console's own command line; below it the KPI strip, exceptions
# first beside what changed since yesterday's cut-off, the working area, and a right rail. Built only from library fragments
# (core, finance of drishti-rachana): no panel is written here. Every table it reads is a "home" table the server serves for the person
# (docs/architecture/ROLE_HOME_SUTRAS.md, 2); each is already filtered by the person's role and lens rules. Not yet run.
rachana: 1.2
sutra: home-risk-manager
version: 1
libraries: [core@1, finance@1]
title: { id: "'Risk manager'" }
data:
  meta:      { table: home_meta }              # one row: BUSINESS_DATE, SINCE (the reference cut-off in words)
  kpis:      { table: home_kpis,      key: [LABEL] }
  kpi_hist:  { table: home_kpi_history }
  exc:       { table: home_exceptions }
  chg:       { table: home_changes }
  desks:     { table: home_desk_limits, key: [DESK] }
  cpty:      { table: home_exposure,    key: [CPTY] }
  stress:    { table: home_stress }
  mnem:      { table: home_mnemonics }
  cal:       { table: home_calendar }
  news:      { table: home_news }
layout:
  user-can-arrange: true                     # "arrange my Home": the person's own order and sizes, kept per person (ROLE_HOME_SUTRAS 3)
  areas:
    - "kpis kpis kpis"
    - "exc chg rail"
    - "desks cpty rail"
    - "stress stress rail"
  columns: [4, 5, 3]
  phone: [kpis, exc, chg, desks, cpty, stress, rail]
panels:
  - use: core/kpi-strip@1
    as: kpi
    area: kpis
    with:
      items: "map($.kpis, {label: @.LABEL, value: @.VALUE, delta: @.DELTA, caption: @.CAPTION})"
      history: { from: $.kpi_hist, columns: { label: LABEL, date: DATE, value: VALUE } }
      fmt: compact
  - use: core/exceptions-list@1
    as: exc
    area: exc
    with:
      title: Exceptions first
      rows: { from: $.exc, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/change-feed@1
    as: chg
    area: chg
    with:
      title: Since
      since: "first($.meta).SINCE"
      rows: { from: $.chg, columns: { key: SUBJECT, measure: MEASURE, before: THEN, after: NOW, change: CHANGE, why: WHY, kind: KIND, open: COMMAND } }
  - use: core/use-bar-table@1
    as: desks
    area: desks
    requires: mnemonic.VAR
    with:
      title: Desk VaR and limits
      name-label: Desk
      rows: { from: $.desks, columns: { name: DESK, value: VAR, limit: LIMIT, change: CHANGE } }
  - use: core/use-bar-table@1
    as: cpty
    area: cpty
    requires: mnemonic.EXP
    with:
      title: Exposure by counterparty
      name-label: Counterparty
      rows: { from: $.cpty, columns: { name: CPTY, value: EXPOSURE, limit: LIMIT, change: CHANGE } }
  - use: finance/stress-tiles@1
    as: stress
    area: stress
    requires: mnemonic.STRESS
    with:
      rows: { from: $.stress, columns: { scenario: SCENARIO, pnl: PNL, limit: LIMIT } }
  - use: core/data-table@1
    as: mnem
    area: rail
    with:
      title: Quick mnemonics
      search: false
      limit: 12
      rows: $.mnem
      columns: [ { label: Mnemonic, bind: "@.MNEMONIC" }, { label: About, bind: "@.ABOUT" } ]
  - use: core/calendar-list@1
    as: cal
    area: rail
    with:
      rows: { from: $.cal, columns: { date: DATE, time: TIME, title: TITLE, kind: KIND, open: COMMAND } }
  - use: core/headline-rail@1
    as: news
    area: rail
    with:
      rows: { from: $.news, columns: { date: AT, headline: HEADLINE, source: SOURCE, link: LINK } }
