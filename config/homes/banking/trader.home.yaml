# A Home (docs/architecture/ROLE_HOME_SUTRAS.md, 1): a name that roles point to. The screen is the Sutra named below; the rest is the Home's
# own facts (the modules it needs, the menus it puts first, who may arrange it). Never hides anything the distribution has.
home: trader
title: Trader
description: "Positions and P&L, pre-deal check, market tiles, with exceptions and changes first"
modules: [ banking ]                       # offered only while these modules are on
sutra: trader.sutra.yaml                      # the Home screen, built only from library fragments
arrange: allow                             # allow | locked: whether a person may arrange their own Home (user-can-arrange); an administrator may lock it
measures: trader.measures.yaml                # what this Home follows: the KPIs and the measures the change detection compares
