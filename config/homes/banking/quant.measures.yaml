# What the quant Home follows (ROLE_HOME_SUTRAS 4). Same layout as risk-manager.measures.yaml; measure codes are answered by the engines' own
# views (VAR, ES, LIM_USE, PNL_DAY, BREACHES: var; PFE, EXPOSURE: exposure); a code with no view yet answers nothing and its figure is left out.
home: quant
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis:
  - { label: Firm VaR, engine: var, measure: VAR, args: { level: 0.99, horizon: 1, scope: firm }, fmt: compact, history: 30, open: "VAR BANK" }
  - { label: Expected shortfall, engine: var, measure: ES, args: { scope: firm }, fmt: compact, history: 30, open: "VAR BANK" }
  - { label: Breaches, engine: var, measure: BREACHES, args: { scope: firm, window: 250 }, fmt: amount0, history: 30, open: "VHIST BANK" }
follow:
  - { measure: VAR, engine: var, subjects: desk, min-abs: 100000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data, rolled-window] }
events: [ load ]
exceptions:
  - { when: load-failed,       severity: medium, text: "{subject} failed the load check",         open: "LOADS" }
  - { when: feed-late,         severity: low,    text: "{subject} is {minutes} minutes late",     open: "FEEDS" }
mnemonics:
  - { mnemonic: "VAR", about: "VaR of a scope" }
  - { mnemonic: "PLAY", about: "Playground" }
  - { mnemonic: "VHIST", about: "VaR and backtest history" }
  - { mnemonic: "FEEDS", about: "Data freshness" }
