# The Operations Home (milestone H1): KPI strip and exceptions first, what changed since the cut-off, the role's working area, a right rail.
# Built only from library fragments (core, finance of drishti-rachana); every table is a home table served for the person
# (ROLE_HOME_SUTRAS.md 2). Not yet run.
rachana: 1.2
sutra: home-operations
version: 1
libraries: [core@1, finance@1]
title: { id: "'Operations'" }
data:
  meta:      { table: home_meta }
  kpis:      { table: home_kpis,      key: [LABEL] }
  kpi_hist:  { table: home_kpi_history }
  exc:       { table: home_exceptions }
  chg:       { table: home_changes }
  loads:     { table: home_loads }
  held:      { table: home_held_changes }
  mnem:      { table: home_mnemonics }
  cal:       { table: home_calendar }
  news:      { table: home_news }
layout:
  user-can-arrange: true                     # "arrange my Home": the person's own order and sizes, kept per person (ROLE_HOME_SUTRAS 3)
  areas:
    - "exc chg rail"
    - "loads held rail"
  columns: [4, 5, 3]
  phone: [exc, chg, loads, held, rail]
panels:
  - use: core/exceptions-list@1
    as: exc
    area: exc
    with:
      title: Exceptions first
      rows: { from: $.exc, columns: { severity: SEVERITY, message: MESSAGE, key: SUBJECT, open: COMMAND } }
  - use: core/change-feed@1
    as: chg
    area: chg
    with:
      title: Since
      since: "first($.meta).SINCE"
      rows: { from: $.chg, columns: { key: SUBJECT, measure: MEASURE, before: THEN, after: NOW, change: CHANGE, why: WHY, kind: KIND, open: COMMAND } }
  - use: core/data-table@1
    as: loads
    area: loads
    with:
      title: Loads and feeds
      search: true
      limit: 50
      rows: $.loads
      columns: [ { label: Pack, bind: "@.PACK" }, { label: Kind, bind: "@.KIND" }, { label: Business date, bind: "@.BUSINESS_DATE" }, { label: State, bind: "@.STATE" }, { label: Deadline, bind: "@.DEADLINE" } ]
  - use: core/held-changes@1
    as: held
    area: held
    with:
      changes: { from: $.held, columns: { change: CHANGE, state: STATE, summary: SUMMARY, by: BY, at: AT, message: MESSAGE } }
  - use: core/data-table@1
    as: mnem
    area: rail
    with:
      title: Quick mnemonics
      search: false
      limit: 12
      rows: $.mnem
      columns: [ { label: Mnemonic, bind: "@.MNEMONIC" }, { label: About, bind: "@.ABOUT" } ]
  - use: core/calendar-list@1
    as: cal
    area: rail
    with:
      rows: { from: $.cal, columns: { date: DATE, time: TIME, title: TITLE, kind: KIND, open: COMMAND } }
  - use: core/headline-rail@1
    as: news
    area: rail
    with:
      rows: { from: $.news, columns: { date: AT, headline: HEADLINE, source: SOURCE, link: LINK } }
