# What the risk manager's Home follows (ROLE_HOME_SUTRAS 4): the figures of the KPI strip and the measures the change detection
# compares between the reference cut-off and now. Each names the engine that computes it (its Admin switch is the one in
# config/engines/<engine>.yaml; an engine that is off drops its rows) and the driver groups that engine offers for "why".
# Thresholds are the smallest move worth a row; a measure with none uses the change engine's defaults.
# Measure codes and what answers them today (VarHomeMeasures, ExposureHomeMeasures in the banking module; the hosted engines replace the
# calls at R2 with the same codes): VAR, ES = the VaR headline and the hierarchy's desk nodes; LIM_USE = the headline's and the nodes' limitUse;
# PNL_DAY = the newest day of the VaR history; BREACHES = the history's exception days; PFE = the exposure scope's peakPfe; EXPOSURE = the
# counterparty nodes' peakPfe against the credit limit.
home: risk-manager
reference: { cut-off: "17:00", zone: site, day: previous-business-day }   # yesterday 17:00 in the site's time zone, as the plan's cut-off
kpis:
  - { label: Firm VaR,        engine: var,      measure: VAR,      args: { level: 0.99, horizon: 1, scope: firm },  fmt: compact, history: 30, open: "VAR BANK" }
  - { label: Expected shortfall, engine: var,  measure: ES,       args: { level: 0.975, horizon: 1, scope: firm },  fmt: compact, history: 30, open: "VAR BANK" }
  - { label: Day P&L,         engine: var,      measure: PNL_DAY,  args: { scope: firm },                          fmt: compact, history: 30, open: "VHIST BANK" }
  - { label: Limit use,       engine: var,      measure: LIM_USE,  args: { scope: firm },                          fmt: pct0,    history: 30 }
  - { label: Exposure (PFE),  engine: exposure, measure: PFE,      args: { scope: firm, quantile: 0.95 },          fmt: compact, history: 30, open: "EXP BANK" }
  - { label: Breaches,        engine: var,      measure: BREACHES, args: { scope: firm, window: 250 },             fmt: amount0, history: 30, open: "VHIST BANK" }
follow:                                   # what the change detection compares, by subject kind
  - { measure: VAR,      engine: var,      subjects: desk,         min-abs: 100000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data, rolled-window] }
  - { measure: LIM_USE,  engine: var,      subjects: desk,         min-abs: 0,      min-rel: 0.05 }
  - { measure: EXPOSURE, engine: exposure, subjects: counterparty, min-abs: 500000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data] }
events: [ new-trade, amended-trade, load, limit-state ]
exceptions:                                # what puts a row in "Exceptions first": rule, severity, command
  - { when: "LIM_USE >= 0.95", severity: high,   text: "{subject} {measure} at {value} of limit", open: "VAR {subject}" }
  - { when: "LIM_USE >= 0.80", severity: medium, text: "{subject} {measure} at {value} of limit", open: "VAR {subject}" }
  - { when: load-failed,       severity: medium, text: "{subject} failed the load check",         open: "LOADS" }
  - { when: feed-late,         severity: low,    text: "{subject} is {minutes} minutes late",     open: "FEEDS" }
