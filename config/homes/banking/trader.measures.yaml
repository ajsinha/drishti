# What the trader's Home follows (ROLE_HOME_SUTRAS 4). The same layout as risk-manager.measures.yaml; the subjects are the person's own
# books (row rules decide which), and only the person's own trades appear as events.
home: trader
reference: { cut-off: "17:00", zone: site, day: previous-business-day }
kpis:
  - { label: Day P&L,    engine: var, measure: PNL_DAY,  args: { scope: own-books }, fmt: compact, history: 30 }
  - { label: MTD P&L,    engine: var, measure: PNL_MTD,  args: { scope: own-books }, fmt: compact, history: 30 }
  - { label: Desk VaR,   engine: var, measure: VAR,      args: { level: 0.99, horizon: 1, scope: own-desk }, fmt: compact, history: 30 }
  - { label: Limit use,  engine: var, measure: LIM_USE,  args: { scope: own-desk }, fmt: pct0, history: 30 }
  - { label: Open risk,  engine: var, measure: DV01,     args: { scope: own-books }, fmt: compact, history: 30 }
follow:
  - { measure: VAR,     engine: var, subjects: book,       min-abs: 50000, min-rel: 0.05, drivers: [new-trades, amended-trades, market-data, rolled-window] }
  - { measure: PNL_DAY, engine: var, subjects: book,       min-abs: 25000, min-rel: 0.10 }
  - { measure: POSITION, engine: var, subjects: instrument, min-abs: 0,     min-rel: 0.01 }
events: [ new-trade, amended-trade, limit-state ]
exceptions:
  - { when: "LIM_USE >= 0.95", severity: high,   text: "{subject} {measure} at {value} of limit", open: "LIM {subject}" }
  - { when: order-rejected,    severity: medium, text: "{subject} order was rejected",            open: "ORD {subject}" }
