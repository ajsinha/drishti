# A Home (docs/architecture/ROLE_HOME_SUTRAS.md, 1): a name that roles point to; the screen is the Sutra named below. Never hides anything the distribution has.
home: quant
title: Quant and analyst
description: "Model runs, backtests, playground entries, data freshness"
modules: [ banking ]                       # offered only while these modules are on
sutra: quant.sutra.yaml                      # the Home screen, built only from library fragments
arrange: allow                             # allow | locked: whether a person may arrange their own Home (user-can-arrange); an administrator may lock it
measures: quant.measures.yaml                # what this Home follows
