# The demo profile (docs/admin/CONFIGURATION.md, "Profiles"): the offline demo on the demo lakes. Named after your own settings file:
#   IntelliJ  -Ddrishti.settings.file=$USER_HOME$/drishti-envs/dev.ini,$PROJECT_DIR$/config/profiles/demo.ini   (Drishti server (demo lakes))
#   terminal  python tools/drishti.py --settings ~/drishti-envs/dev.ini start server --demo   (--demo is --profile demo)
# The one place the demo is described: the launchers, start server --demo and the cluster read this file; nothing repeats it.
# DEVELOPMENT ONLY: sign-in on with the development administrator (drishti-dev-admin), never a shared or production server.

[demo]
# sign-in on (the development administrator is the product default, drishti-dev-admin / drishti-dev-admin123)
drishti.security.enabled=true
# read the demo lakes (drishti.py lake demo), generate nothing; offline: the captured news and quotes, no internet
drishti.sources.plugins.demo.enabled=false
drishti.offline.enabled=true
# the packs of every module that is on (default), and those that read a lake the demo builds (off by default in their modules)
drishti.packs.enabled=default,us-equities,gleif,funds
# the demo's system baskets, imported once into an empty store; Studio saves Sutras to the site folder
DRISHTI_VAR_SYSTEM_BASKETS_SEED=true
drishti.rachana.studio-save=true
# the data inbox: files dropped in <data>/dataload/inbox with a .ready marker are loaded into the lake (DATA_GUIDE.md); this node runs it
DRISHTI_DATALOAD_ENABLED=true
DRISHTI_DATALOAD_OWNER=true
# the server's heap: the launchers and drishti.py start server read it (a JVM option, not a server setting)
drishti.launch.heap=4g

# the console of this demo: sign-in on, plain HTTP on this machine
[console.auth]
enabled=true
secure_cookie=false
