# The samples profile (docs/admin/CONFIGURATION.md, "Profiles"): a first look before any lake is built. The packs' small built-in samples
# (the demo source on, its product default), sign-in on. Drishti server (built-in samples) and Drishti console name it.
# DEVELOPMENT ONLY: the development administrator (drishti-dev-admin / drishti-dev-admin123), never a shared or production server.

[samples]
drishti.security.enabled=true
drishti.rachana.studio-save=true
drishti.launch.heap=2g

[console.auth]
enabled=true
secure_cookie=false
