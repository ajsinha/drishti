# The QA profile (docs/admin/CONFIGURATION.md, "Profiles"; IDE_GUIDE.md section 3.9): a second server and console beside the default pair,
# on their own ports and their own data folder under the install, so QA never touches data/. The packs' samples, sign-in on.
#   IntelliJ  Drishti server (QA, port 18580); PyCharm Drishti console (QA, port 17580) and Drishti doctor (QA)
#   terminal  python tools/drishti.py --settings ~/drishti-envs/dev.ini --profile qa start server   (and start console)

[qa]
server.port=18580
drishti.data.dir=${drishti.home}/data/qa/data
drishti.security.enabled=true
drishti.rachana.studio-save=true
drishti.launch.heap=2g

[console.server]
port=17580

[console.auth]
enabled=true
secure_cookie=false
