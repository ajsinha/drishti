# The under-construction registry (docs/admin/UNDER_CONSTRUCTION.md, generated from this file by tools/under_construction.py): every
# figure, panel, menu item, help page, contract or decision that depends on work not built yet, and how a person meets it.
#   treatment: under-construction   shown, with the words "Under construction" (a chip) in place of its value
#   treatment: hidden               left out
# The data stays in the lake; only what is displayed changes. The server rewrites a kind's Sutra when it is matched (strip items and kv or
# table columns by their bind, panels by their id); the console hides or marks the menu items and help pages named here. A new item that
# depends on unbuilt work is registered here in the same change (PACK_DEVELOPER_GUIDE.md, "Unbuilt work: the under-construction registry").
#
# Each item: id, what (field | panel | menu item | help page | contract | decision | engine | test), about, release (the release that builds it),
# treatment, and where it appears: sutras (kind, binds, panels), menus (menu item ids), help (help page slugs), contracts (contract
# documents and their sections, for the record); screenshots: the shipped pictures that still show the item's old value (to retake).
items:
  - id: sa-ccr-figures
    what: field
    about: "SA-CCR exposure at default, replacement cost, add-ons, multiplier and RWA: stored figures of the sa-ccr kind, not computed by an SA-CCR engine"
    release: 2.9.11.k
    treatment: under-construction
    sutras:
      - kind: sa-ccr
        binds: [$.REPLACEMENT_COST, $.ADD_ON, $.MULTIPLIER, $.EAD, $.RWA]
        panels: [addons, hedging, checks]
    help: [docs-contracts-saccr]
    contracts: [docs/contracts/SACCR.md]

  - id: cva-figures
    what: field
    about: "CVA, DVA, FVA, KVA and CS01 with their components and sensitivities: stored figures of the cva kind, not computed by an xVA engine"
    release: "the xVA engine (planned)"
    treatment: under-construction
    sutras:
      - kind: cva
        binds: [$.CVA, $.DVA, $.FVA, $.KVA, $.CS01]
        panels: [components, sens]
      - kind: netting-set
        binds: [$.CVA]
    help: [docs-contracts-cva]
    contracts: [docs/contracts/CVA.md]

  - id: credit-limit-usage
    what: field
    about: "A credit limit's used amount and utilisation as stored, not measured against the exposure engine's figure"
    release: 2.9.11.k
    treatment: under-construction
    sutras:
      - kind: credit-limit
        binds: [$.USED, $.UTILISATION, "@.USED", "@.UTILISATION", "$.LIMIT - $.USED", "$.LIMIT > 0 ? $.USED / $.LIMIT : null",
                "$.LIMIT > 0 ? $.USED / $.LIMIT - $.UTILISATION : null"]
        panels: [util]

  - id: counterparty-stored-net-mtm
    what: field
    about: "The counterparty master's stored net MTM: the computed one, from the trade valuations, is shown beside it and stays"
    release: "decided by the product owner (computed, or lifted from stored data)"
    treatment: under-construction
    sutras:
      - kind: counterparty
        binds: [$.NET_MTM, "@.NET_MTM", "$src.NET_MTM - $.NET_MTM"]

  - id: pre-deal-limit-decision
    what: decision
    about: "The pre-deal decision against every limit a candidate trade touches: SA-CCR's incremental EAD and EAD limits, soft and hard limits, warnings and the maximum size (the decision against the counterparty's credit limit on its exposure measure and tenor buckets is built: PREDEAL, POST /api/v1/exposure/predeal)"
    release: 2.9.11.k
    treatment: under-construction
    contracts: ["docs/contracts/LIM.md#64-pre-deal-check"]

  - id: pnl-explain-waterfall
    what: panel
    about: "The P&L explain's waterfall: a generator's stored steps that disagree with the Attribution bars on new trades (F19); the computed explain (by trade events, then by risk factor) is PNL.md's"
    release: "the P&L explain (docs/architecture/LENSES.md TL4, PNL.md)"
    treatment: under-construction
    sutras:
      - kind: pnl-explain
        panels: [explain]
    contracts: ["docs/contracts/PNL.md#1-summary"]

  - id: wwr-contract
    what: contract
    about: "Wrong-way risk: the contract of its inputs and results, planned"
    release: "the wrong-way risk engine (planned)"
    treatment: under-construction
    help: [docs-contracts-wwr]
    contracts: [docs/contracts/WWR.md]

  - id: collateral-contract
    what: contract
    about: "Collateral: the planned contract of the computed collateral figures"
    release: "the collateral engine (planned)"
    treatment: under-construction
    help: [docs-contracts-coll]
    contracts: [docs/contracts/COLL.md]

  - id: margin-call-contract
    what: contract
    about: "Margin calls: the planned contract of the computed margin call"
    release: "the collateral engine (planned)"
    treatment: under-construction
    help: [docs-contracts-mc]
    contracts: [docs/contracts/MC.md]

  - id: flight-cluster-end-to-end
    what: test
    about: "Arrow Flight on a three-node cluster, end to end (endpoints on every node, a node stopped mid-read, a VaR stream through an intraday batch): not measured yet; the single-node reads, the stream, Stop and resume are run (tutorial 17)"
    release: "a later heavy run (needs a three-node scratch cluster)"
    treatment: under-construction
    contracts: ["docs/guides/FLIGHT_GUIDE.md#13-testing"]

  - id: ccr-cube-preset
    what: menu item
    about: "The CCR cube, the Pivot's preset ccr (Counterparties → CCR cube, /pivot?preset=ccr): the preset, its door and its landing are defined; its source, the CCR provider (each netting set's exposure paths netted and collateralised first, then summed per cell), comes with the counterparty engines"
    release: 2.9.14
    treatment: under-construction
    menus: [ccr-cube]
    contracts: ["docs/guides/PIVOT_GUIDE.md#28-presets-the-risk-cubes", "docs/architecture/ARCHITECTURE.md#264-the-providers"]


  - id: approvals-access-kinds
    what: decision
    about: "The Approvals queue's access kinds: users and roles, API keys, captures, pack changes and admin configuration as four-eyes items (today each takes effect at once, by an administrator, audited); the queue and its API take a new kind as one more ApprovalSource"
    release: 2.9.11.i
    treatment: under-construction
    contracts: ["docs/guides/USER_GUIDE.md#approvals", "docs/architecture/SHARED_SCREENS.md#2-one-approvals-queue"]

  - id: approvals-effect-on-risk
    what: decision
    about: "A correction's effect if approved, in risk numbers: a scope's VaR and limit use before and after (the mock-up's example); today the effect is the impact service's list of what reads the record downstream"
    release: 2.9.11.k
    treatment: under-construction
    contracts: ["docs/guides/USER_GUIDE.md#approvals"]

  - id: platform-alert-lifecycle-shared
    what: decision
    about: "A platform alert's acknowledgement, owner and snooze are kept in the memory of the member it opened on: a restart forgets them (the alert itself opens again if it still holds), and another member of a cluster does not see them"
    release: 2.9.11.i
    treatment: under-construction
    contracts: ["docs/guides/USER_GUIDE.md#alerts"]
  - id: explain-why-es-parametric
    what: panel
    about: "Explain › Why it moved for ES, parametric VaR, parametric ES and the fat-tail gap: the exact attribution steps are VaR's only (the drawer says so; VaR's own Why it moved is built)"
    release: "2.9.11.k (risk engines II)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: explain-official-check
    what: panel
    about: "Explain's check 'equal to the official capture' (VaR and exposure): the captures are on each page's Captured results tab; the drawer does not compare yet"
    release: "2.9.11.k (risk engines II)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: explain-exposure-why
    what: panel
    about: "Explain › Why it moved for an exposure figure (peak PFE, EPE, EEPE, EE, CE, EAD): the attribution between two dates is not built; the formula, inputs, lineage and checks are"
    release: "2.9.11.k (risk engines II)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: explain-exposure-workbook
    what: panel
    about: "Explain › Workbook for an exposure figure: no exposure playground with a live-formula workbook yet"
    release: "2.9.11.k (risk engines II)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: explain-pivot-workbook
    what: panel
    about: "Explain › Workbook for a pivot cell's move: the steps are on the screen and in the API; no live-formula workbook yet"
    release: "a later release (the pivot playground)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: explain-more-kinds
    what: panel
    about: "Explain for a BI measure, a Sutra metric, an FRTB-SA or a SIMM figure: no explainer of these kinds is registered yet (GET /api/v1/explain/kinds lists the ones that are: var, exposure, pivot); FRTB-SA and SIMM keep their own step-by-step explanation on their pages"
    release: "2.9.11.g (the Build home's rest)"
    treatment: under-construction
    contracts: ["docs/architecture/SHARED_SCREENS.md#3-one-explain-for-every-number"]

  - id: build-home-model-lineage
    what: field
    about: "The Build home's lineage of a semantic model's tables and of a Sutra's pack: the tables editor's object list names a table's connector but not a model's tables (that answer is BI's, changed by bi-delete); a model shows what uses it, not yet what it uses"
    release: "2.9.11.g (the Build home's rest)"
    treatment: under-construction
    contracts: ["docs/guides/USER_GUIDE.md#the-build-home-everything-you-build-in-one-place"]

  - id: config-editor-cluster
    what: decision
    about: "Admin -> Configuration on a cluster: proposals are kept by the server the console asks (its data folder, not replicated), an approved server key is written to that server's application.local.yaml only, and a console key by the approving console only; the other nodes are changed by hand until the cluster's settings are one replicated document"
    release: 2.9.11.i
    treatment: under-construction
    contracts: ["docs/guides/OPERATIONS_GUIDE.md#62-admin--configuration-the-configuration-editor"]

  - id: reporting-currency-setting
    what: decision
    about: "The everyday tier's reporting currency: no setting holds it today (the VaR and exposure pages start in USD, then the person's last choice); a site-wide reporting currency joins the everyday tier when it exists"
    release: 2.9.11.k
    treatment: under-construction
    contracts: ["docs/guides/OPERATIONS_GUIDE.md#62-admin--configuration-the-configuration-editor"]
