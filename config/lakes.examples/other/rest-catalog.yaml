# config/lakes.examples/other/rest-catalog.yaml: an example lake file (docs/guides/DATA_LAKE_GUIDE.md), the lake the connector files of
# config/connectors.examples/other/ name. Copy it to config/lakes/rest-catalog.yaml. Secrets only as ${ENV} or file:/path references.
lake: rest-catalog
format: iceberg
storage: {endpoint: 'https://minio.example.com:9000', region: us-east-1, access-key: '${LAKE_ACCESS_KEY}', secret-key: '${LAKE_SECRET_KEY}'}
catalog: {type: rest, uri: 'http://catalog.example.com:8181', warehouse: 's3://lake/warehouse', namespace: risk}
tables: {risk.trade: null}
