# config/lakes.examples/memory/news.yaml: an example lake file (docs/guides/LAKE_GUIDE.md), the lake the connector files of
# config/connectors.examples/memory/ name. Copy it to config/lakes/news.yaml. Secrets only as ${ENV} or file:/path references.
lake: news
format: delta
root: mem://news
memory: {max-mb: '${DRISHTI_NEWS_MEMORY_MB:256}', chunk-kb: 64, contract: '${DRISHTI_NEWS_CONTRACT:NEWS-MEMORY-ONLY}'}
tables:
  news.news-topic: {path: news-topic}
  news.listed-company: {path: listed-company}
  news.news: {path: news}
  news.quote: {path: quote}
