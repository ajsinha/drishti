# Data contract of the path-sum kind (command PSUM): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap path-sum`; owned by people from then on: confirm the review points, then remove them.
kind: path-sum
mnemonic: PSUM
pack: compute-demo
version: '1.0'
class: computed
status: active
title: Book path (Python)
description: Book path (Python) (the path-sum kind of the compute-demo pack)
source: 'computed by Drishti: the reactive connector path-sum-python (python engine)'
grain: One answer per question (the id asked for and its parameters), computed when asked.
key: []
dated-by: on request
cadence:
  frequency: on change
  due: computed on request and on its triggers
storage:
  connector: path-sum-python
  plugin: reactive
fields:
- name: SUM
  type: amount
  presence: required
  description: 'The sum over every scenario day of the book''s total path (the members'' P&L added day by day).'
- name: WORST
  type: amount
  presence: required
  description: 'The lowest day of the book''s total path.'
links: []
validation:
- rule: required
  fields:
  - SUM
  - WORST
notes:
- 'No stored key: an answer''s id is the question asked (the id in the request), the id of the path-book it reads.'
review:
- 'no samples or test data ship for this kind: the fields are those its Sutras show (and its declared result); state every field''s type and presence.'
