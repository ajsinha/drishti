# Data contract of the path-book kind (command PBOOK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap path-book`; owned by people from then on: confirm the review points, then remove them.
kind: path-book
mnemonic: PBOOK
pack: compute-demo
version: '1.0'
class: input
status: active
title: Path book
description: 'A book of synthetic P&L strips, and the sum of their paths computed when the page asks: by a Python engine and by its Java twin.'
source: synthetic
grain: One row per path book, keyed by BOOK_ID.
key:
- BOOK_ID
id-pattern:
- ^BOOK-(RATES|FX|CREDIT)$
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: compute-demo-store
  plugin: delta
  domain: compute-demo
  table: <root>/compute-demo/path-book/
  columns:
  - BOOK_ID
  - NAME
  - DESK
  - STRIP_COUNT
  test-data:
  - config/packs/compute-demo/samples
fields:
- name: BOOK_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: BOOK-CREDIT
  pattern: ^BOOK-(RATES|FX|CREDIT)$
  link: path-book
- name: NAME
  type: text
  presence: required
  description: 'The book''s display name.'
  example: Credit book
- name: DESK
  type: id
  presence: required
  description: 'The desk that owns the book, a plain desk code of the demo (CREDIT, RATES …); not a core desk id.'
  example: CREDIT
  link: desk
- name: STRIP_COUNT
  type: integer
  presence: required
  description: 'How many path strips (path-strip rows) the book holds.'
  example: 30
- name: MEMBERS
  type: text list
  presence: required
  description: 'The ids of the book''s P&L strips (path-strip records).'
- name: PATH_ID
  type: id
  presence: required
  description: 'The id the book''s computed path is asked under (PSUM or PSUMJ <PATH_ID>).'
  example: BOOK-CREDIT
links:
- field: BOOK_ID
  kind: path-book
- field: DESK
  kind: desk
validation:
- rule: required
  fields:
  - BOOK_ID
  - NAME
  - DESK
  - STRIP_COUNT
  - MEMBERS
  - PATH_ID
- rule: unique
  key:
  - BOOK_ID
  per: snapshot
- rule: pattern
  field: BOOK_ID
  pattern: ^BOOK-(RATES|FX|CREDIT)$
- rule: link
  field: BOOK_ID
  kind: path-book
- rule: link
  field: DESK
  kind: desk
- rule: range
  field: STRIP_COUNT
  min: 0
notes: []
review:
- 'required inferred from 100% coverage in 3 documents (3 samples): confirm each required field is mandatory upstream, and each optional one may
  be empty.'
- 'key BOOK_ID is the field holding the sample catalogue''s id (BOOK-CREDIT): confirm it is the business key.'
- 'source ''synthetic'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'the pack also names ''Synthetic P&L strips (a seeded random walk, config/packs/compute-demo/tools/make_samples.py)'' for this kind (path-book,
  path-strip): state when each source applies.'
