# Data contract of the path-strip kind (command PSTRIP): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap path-strip`; owned by people from then on: confirm the review points, then remove them.
kind: path-strip
mnemonic: PSTRIP
pack: compute-demo
version: '1.0'
class: input
status: active
title: P&L strip
description: P&L strip (the path-strip kind of the compute-demo pack)
source: synthetic
grain: One row per p&l strip, keyed by STRIP_ID.
key:
- STRIP_ID
id-pattern:
- ^STRIP-
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: compute-demo-store
  plugin: delta
  domain: compute-demo
  table: <root>/compute-demo/path-strip/
  columns:
  - STRIP_ID
  - BOOK_ID
  - INSTRUMENT
  - DAYS
  test-data:
  - config/packs/compute-demo/samples
fields:
- name: STRIP_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: STRIP-RATES-001
  pattern: ^STRIP-
- name: BOOK_ID
  type: id
  presence: required
  description: 'Book: the path-book it refers to'
  example: BOOK-RATES
  pattern: ^BOOK-(RATES|FX|CREDIT)$
  link: path-book
- name: DESK
  type: id
  presence: required
  description: 'Desk: the desk it refers to'
  example: RATES
  link: desk
- name: INSTRUMENT
  type: text
  presence: required
  example: SWAPTION
- name: DAYS
  type: integer
  presence: required
  example: 250
- name: PNL
  type: vector
  presence: required
  note: 250 values in the test data
links:
- field: BOOK_ID
  kind: path-book
- field: DESK
  kind: desk
validation:
- rule: required
  fields:
  - STRIP_ID
  - BOOK_ID
  - DESK
  - INSTRUMENT
  - DAYS
  - PNL
- rule: unique
  key:
  - STRIP_ID
  per: snapshot
- rule: pattern
  field: STRIP_ID
  pattern: ^STRIP-
- rule: link
  field: BOOK_ID
  kind: path-book
- rule: link
  field: DESK
  kind: desk
- rule: vector-length
  field: PNL
  same: every row of one business date
notes: []
review:
- 'required inferred from 100% coverage in 120 documents (120 samples): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'key STRIP_ID is the field holding the sample catalogue''s id (STRIP-RATES-001): confirm it is the business key.'
- 'source ''synthetic'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'the pack also names ''Synthetic P&L strips (a seeded random walk, config/packs/compute-demo/tools/make_samples.py)'' for this kind (path-book,
  path-strip): state when each source applies.'
- 'no description in about.yaml or the Sutras for INSTRUMENT, DAYS, PNL: write them in the pack''s config/about.yaml glossary.'
