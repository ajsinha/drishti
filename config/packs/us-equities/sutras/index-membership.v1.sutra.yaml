# Hand-written from the Drishti UI kit (config/ui-kit/fragments) and the pack's own fragments (sutras/common).
rachana: 1
sutra: index-membership
version: 1
description: "An equity index's members (Dow 30, Nasdaq-100, S&P 500) as Wikidata records them; a click opens the member's summary beside."
doc:
  summary: "An index's members, filterable; a click opens the member's key facts and financials beside the table."
  description: >-
    The members of one index, one row a company: ticker, name, SIC division, latest revenue and the date Wikidata gives for its
    entry. Every column filters (type in the heading). Clicking a member fires open with its ticker; its key facts and its
    revenue and net income over the years open beside the table. The right column counts the members by SIC division. Membership
    only: index weights and levels are proprietary and not included.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/index-membership/SP500"
    - "IDX DJIA"
  since: "2.7.0"
match: { kind: index-membership, priority: 10 }
title: { pill: US equities · Index, id: $.INDEX, with: $.NAME }
strip:
  - { label: Index, bind: $.NAME }
  - { label: Members, bind: $.MEMBERS, fmt: amount0, emphasis: true }
  - { label: SIC divisions, bind: $.SECTORS }
  - { label: Members' revenue, bind: $.REVENUE, fmt: compact }
  - { label: Members' net income, bind: $.NET_INCOME, fmt: compact, tone: sign }
panels:
  - use: row-picker@1
    with: { id: members, title: "Members (a click opens the company beside)", rows: $.ROWS, event: open, key: TICKER, key-label: Ticker, ref: SIC,
            a: NAME, a-label: Company, b: SECTOR, b-label: SIC division, amount: REVENUE, amount-label: "Revenue, latest FY", amount-fmt: compact,
            date: SINCE, date-label: Member since, empty: No members recorded, code: MEM }
    children:
      - place: detail-right
        source: { kind: us-company, id: "@parent.open.id" }
        waits: Pick a member to see its summary
        panels:
          - { use: us-equities/company-card@1, with: { id: member, title: "${@parent.open.id}", rec: $src } }
          - { use: series-line@1, with: { id: member-revenue, title: "Revenue by fiscal year, USD", rows: $src.FINANCIALS, x: YEAR, y: REVENUE, fmt: compact } }
  - { use: ranked-bars@1, with: { id: by-sector, title: Members by SIC division, rows: $.BY_SECTOR, fmt: amount0, area: right, key: F3 } }
  - use: explainer-note@1
    with:
      title: About this list
      area: right
      text: "Index membership as Wikidata (CC0) records it: a statement that the company is part of the index, with no end date. It can lag a change by days or weeks and is not an authoritative constituent list. Index weights and levels are proprietary to the index providers and are not included. The bank lists (BANKS-US, BANKS-CA, BANKS-UK) are kept by Drishti and hold the banks that file with the SEC; a Canadian or UK bank reports in its own currency, and the totals add USD reporters only. Company figures: SEC EDGAR (public domain)."
  - { use: field-list@1, with: { id: source, title: Data source and licence, rows: $.PROVENANCE, area: right } }
  - { use: data-provenance@1 }
keys: { F9: raw }
