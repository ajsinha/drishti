# Hand-written from the Drishti UI kit (config/ui-kit/fragments) and the pack's own fragments (sutras/common).
rachana: 1
sutra: index-membership
version: 1
description: "An equity index's members (Dow 30, Nasdaq-100, S&P 500) as its tracking ETF reports holding them; a click opens the member's summary beside."
doc:
  summary: "An index's members, filterable; a click opens the member's key facts and financials beside the table."
  description: >-
    The members of one index, one row a company: ticker, name, SIC division, latest revenue and the date Wikidata gives for its
    entry (where it has one). Every column filters (type in the heading). Clicking a member fires open with its ticker; its key facts and its
    revenue and net income over the years open beside the table. The right column counts the members by SIC division. Membership
    only: index weights and levels are proprietary and not included.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/index-membership/SP500"
    - "IDX DJIA"
  since: "2.7.0"
match: { kind: index-membership, priority: 10 }
title: { pill: US equities · Index, id: $.INDEX, with: $.NAME }
strip:
  - { label: Index, bind: $.NAME }
  - { label: Members, bind: $.MEMBERS, fmt: amount0, emphasis: true }
  - { label: SIC divisions, bind: "size(group($.ROWS, 'SECTOR'))" }
  - { label: Members' revenue, bind: "sum($.ROWS[?@.CURRENCY == 'USD'], 'REVENUE')", fmt: compact }
  - { label: Members' net income, bind: "sum($.ROWS[?@.CURRENCY == 'USD'], 'NET_INCOME')", fmt: compact, tone: sign }
panels:
  - use: row-picker@1
    with: { id: members, title: "Members (a click opens the company beside)", rows: $.ROWS, event: open, key: TICKER, key-label: Ticker, ref: SIC,
            a: NAME, a-label: Company, b: SECTOR, b-label: SIC division, amount: REVENUE, amount-label: "Revenue, latest FY", amount-fmt: compact,
            date: SINCE, date-label: Member since, empty: No members recorded, code: MEM }
    children:
      - place: detail-right
        source: { kind: us-company, id: "@parent.open.id" }
        waits: Pick a member to see its summary
        panels:
          - { use: us-equities/company-card@1, with: { id: member, title: "${@parent.open.id}", rec: $src } }
          - { use: series-line@1, with: { id: member-revenue, title: "Revenue by fiscal year, USD", rows: $src.FINANCIALS, x: YEAR, y: REVENUE, fmt: compact } }
  - id: tracked-by
    kind: table
    title: "ETFs and funds tracking it (the funds pack; a fund opens its page)"
    area: right
    key: F4
    code: ETF
    when: "$.INDEX != 'BANKS-US' && $.INDEX != 'BANKS-CA' && $.INDEX != 'BANKS-UK'"     # a bank list is no index a fund tracks
    source: { pack: funds, kind: index-funds, id: $.INDEX }
    rows: $src.ROWS
    search: false
    empty: No fund of the funds pack tracks it (or the pack is off)
    columns:
      - { label: Fund, bind: "link(@.FUND, 'fund', @.FUND)" }
      - { label: Type, bind: "@.TYPE" }
      - { label: Net assets, bind: "@.NET_ASSETS", fmt: compact }
      - { label: "Expense ratio (%)", bind: "@.EXPENSE_RATIO", fmt: amount2 }
  - { use: ranked-bars@1, with: { id: by-sector, title: Members by SIC division, rows: "group($.ROWS, 'SECTOR')", label: label, value: value, fmt: amount0, area: right, key: F3 } }
  - use: explainer-note@1
    with:
      title: About this list
      area: right
      text: "Index membership as the index's tracking ETF (SPY for the S&P 500, QQQ for the Nasdaq-100, DIA for the Dow) reported holding it in its newest Form N-PORT (SEC, public domain); the source below names the filing and its date. A change to the index shows up to a quarter late. Index weights and levels are proprietary to the index providers and are not included. The bank lists (BANKS-US, BANKS-CA, BANKS-UK) are kept by Drishti and hold the banks that file with the SEC; a Canadian or UK bank reports in its own currency, and the totals add USD reporters only. Company figures: SEC EDGAR (public domain)."
  - { use: field-list@1, with: { id: source, title: Data source and licence, rows: $.PROVENANCE, area: right } }
  - { use: data-provenance@1 }
keys: { F9: raw }
