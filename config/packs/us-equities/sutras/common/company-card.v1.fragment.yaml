# The us-equities pack's own fragment (SUTRA_NEXT.md 3a), hand-written, used as { use: us-equities/company-card@1 }.
rachana: 1
fragment: company-card
version: 1
description: "A listed US company's key facts: identity, listing, sector, latest fiscal year and identifiers."
params: { id: card, title: Key facts, rec: $, code: '', key: '', area: '' }
doc:
  summary: "A listed US company's key facts: identity, listing, sector, latest fiscal year and identifiers."
  description: >-
    One us-company record as label and value pairs: its name and ticker (a link to the company page), exchange and listing
    market, SIC code (a link to the sector) and division, the indexes it belongs to, the latest fiscal year's revenue, net
    income and net margin, and its CIK, LEI (a link to its record in the gleif pack), headquarters, founding date and website. rec names the record: $ on the company's
    own page, $src in a child that reads the company as its source.
  params:
    id: { type: id, default: card, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: Key facts, meaning: "The title over the list" }
    rec: { type: expression, default: $, meaning: "The us-company record: $ on its page, $src under a source" }
    code: { type: key, default: '', meaning: "The panel's mnemonic code, typed in the command line to jump to it; none when empty" }
    key: { type: key, default: '', meaning: "The function key (F2 to F12) that brings the panel forward; none when empty" }
    area: { type: area, default: '', meaning: "Where the panel sits: main (the default when empty) or right" }
  emits: []
  expects: []
  examples:
    - { use: company-card@1, with: { area: right } }
    - { use: company-card@1, with: { id: member, title: Company, rec: $src } }
  since: "2.7.0"
panels:
  - id: %{id}
    kind: kv
    title: "%{title}"
    code: %{code}
    key: %{key}
    area: %{area}
    columns:
      - { label: Company, bind: "link(%{rec}.TICKER, 'us-company', %{rec}.NAME)" }
      - { label: Exchange, bind: "%{rec}.EXCHANGE" }
      - { label: Listing, bind: "%{rec}.LISTING" }
      - { label: SIC, bind: "link(%{rec}.SIC, 'sic-sector', %{rec}.SIC + ' · ' + %{rec}.SIC_DESCRIPTION)" }
      - { label: Division, bind: "%{rec}.SECTOR" }
      - { label: Indexes, bind: "%{rec}.INDEX_TEXT" }
      - { label: Fiscal year, bind: "%{rec}.FISCAL_YEAR" }
      - { label: Revenue, bind: "%{rec}.REVENUE", fmt: compact }
      - { label: Net income, bind: "%{rec}.NET_INCOME", fmt: compact, tone: sign }
      - { label: Net margin, bind: "%{rec}.REVENUE ? %{rec}.NET_INCOME / %{rec}.REVENUE * 100 : null", fmt: margin1, tone: sign }
      - { label: Diluted EPS (USD), bind: "%{rec}.EPS_DILUTED", fmt: price2 }
      - { label: Shares outstanding, bind: "%{rec}.SHARES_OUTSTANDING", fmt: compact }
      - { label: CIK, bind: "%{rec}.CIK" }
      - { label: LEI, bind: "link(%{rec}.LEI, 'lei-entity', %{rec}.LEI)" }          # the gleif pack's LEI record, when that pack is on
      - { label: Incorporated in, bind: "%{rec}.STATE_OF_INCORPORATION" }
      - { label: Fiscal year end (MM-DD), bind: "%{rec}.FISCAL_YEAR_END" }
      - { label: Reporting currency, bind: "%{rec}.CURRENCY" }
      - { label: Headquarters, bind: "nonblank(%{rec}.HEADQUARTERS, %{rec}.BUSINESS_ADDRESS)" }
      - { label: Founded, bind: "%{rec}.FOUNDED" }
      - { label: Website, bind: "%{rec}.WEBSITE" }
