# US equities formats. Percentages are stored as published (12.3 means 12.3%), so these add the sign and the suffix without scaling.
formats:
  margin1: { type: number, decimals: 1, suffix: " %" }
  growth1: { type: number, decimals: 1, sign: always, suffix: " %" }
