# Data contract of the filing-feed kind (command EDGAR): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap filing-feed`; owned by people from then on: confirm the review points, then remove them.
kind: filing-feed
mnemonic: EDGAR
pack: us-equities
version: '1.0'
class: fundamental
status: active
title: EDGAR filings browser
description: 'The filings browser: the latest SEC filings of the covered companies, of every form or one; a click opens a filing beside.'
source: 'public data: SEC EDGAR, Nasdaq Trader, GLEIF and Wikidata (tools/publicdata/us_equities.py)'
grain: One row per edgar filings browser, keyed by FEED.
key:
- FEED
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: us-equities-store
  plugin: delta
  domain: us-equities
  table: <root>/us-equities/filing-feed/
  columns:
  - FEED
  - NAME
  - FILINGS
  test-data:
  - data/testdata/us-equities/filing-feed
fields:
- name: FEED
  type: id
  presence: required
  description: The record's id (the business key)
  example: 8-K
- name: NAME
  type: text
  presence: required
  description: 'The feed''s name: Every form, Annual reports (10-K), Quarterly reports (10-Q), Current reports (8-K), Insider transactions (Form 4) or Proxy statements (DEF 14A).'
  example: Current reports
- name: FORM
  type: text
  presence: optional
  description: 'The SEC form type the feed shows; empty for the feed of every form (ALL).'
  example: 8-K
- name: FILINGS
  type: integer
  presence: required
  description: How many filings ROWS holds (the latest filings, at most 300).
  example: 300
- name: COMPANIES
  type: integer
  presence: required
  description: How many different companies filed the filings in ROWS.
  example: 222
- name: LATEST
  type: date
  presence: required
  description: The filing date of the newest filing in ROWS, YYYY-MM-DD.
  example: '2026-10-23'
- name: EARLIEST
  type: date
  presence: required
  description: The filing date of the oldest filing in ROWS, YYYY-MM-DD.
  example: '2026-10-02'
- name: ROWS
  type: record list
  presence: required
  description: 'The feed''s filings, newest first, one element each: ACCESSION, FILED, COMPANY, COMPANY_NAME, FORM and DESCRIPTION.'
- name: BY
  type: record list
  presence: required
  description: 'The filings counted by form (the ALL feed) or by company (a form''s feed), at most 15, most first: LABEL and VALUE (a count); BY_TITLE says which.'
- name: BY_TITLE
  type: text
  presence: required
  description: 'The title of the BY chart: Filings by form (the ALL feed) or Filings by company.'
  example: Filings by company
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the feed comes from, one object: SOURCE (SEC EDGAR submissions), RETRIEVED_AT (YYYY-MM-DD) and LICENCE.'
nested:
  ROWS[]:
  - name: ACCESSION
    type: text
    presence: required
    description: 'The SEC accession number of the filing: the filing record''s key.'
    example: 0001628280-26-067044
  - name: FILED
    type: date
    presence: required
    description: 'The date the filing was filed (YYYY-MM-DD).'
    example: '2026-10-23'
  - name: COMPANY
    type: id
    presence: required
    description: 'The filer: a TICKER of the us-company kind.'
    example: PNC
    link: us-company
  - name: COMPANY_NAME
    type: text
    presence: required
    description: The filer's name as the pack shows it (Wikidata's label, else EDGAR's name).
    example: PNC Financial Services
  - name: FORM
    type: text
    presence: required
    description: 'The SEC form type.'
    example: 8-K
  - name: DESCRIPTION
    type: text
    presence: required
    description: 'The form type in words.'
    example: Current report
  BY[]:
  - name: LABEL
    type: text
    presence: required
    description: 'A form type (the ALL feed) or a company ticker (a one-form feed).'
    example: NWSA
  - name: VALUE
    type: amount
    presence: required
    description: 'How many of the feed''s filings have that form or company (the 15 largest).'
    example: 9
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: 'The public source the feed is built from (SEC EDGAR submissions).'
    example: U.S. Securities and Exchange Commission, EDGAR (submissions…
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: 'The date the source was retrieved (YYYY-MM-DD).'
    example: '2026-10-24'
  - name: LICENCE
    type: text
    presence: required
    description: 'The licence of the source.'
    example: Public domain (U.S. Government work); SEC EDGAR fair access…
links:
- field: ROWS[].COMPANY
  kind: us-company
validation:
- rule: required
  fields:
  - FEED
  - NAME
  - FILINGS
  - COMPANIES
  - LATEST
  - EARLIEST
  - ROWS
  - BY
  - BY_TITLE
  - PROVENANCE
- rule: unique
  key:
  - FEED
  per: snapshot
- rule: link
  field: ROWS[].COMPANY
  kind: us-company
notes: []
review:
- 'required inferred from 100% coverage in 7 documents (1 samples and 6 test-data documents (data/testdata/us-equities/filing-feed/snapshot-2026-10-24.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'a snapshot refreshed when tools/publicdata/us_equities.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: ROWS[].FORM, ROWS[].DESCRIPTION: confirm they are closed lists.'
- 'number types decided by the field''s name: BY[].VALUE amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts BY[].VALUE (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
