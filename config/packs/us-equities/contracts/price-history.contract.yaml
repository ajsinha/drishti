# Data contract of the price-history kind (command PXH): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap price-history`; owned by people from then on: confirm the review points, then remove them.
kind: price-history
mnemonic: PXH
pack: us-equities
version: '1.0'
class: fundamental
status: active
title: Price history (live, internal use only)
description: 'A company''s quote and a year of daily prices, read live by the us-equities-prices connector: off as shipped, internal use only.'
source: 'public data: Yahoo Finance (us-equities-prices connector, yfinance plugin)'
grain: One row per price history (live, internal use only), keyed by a key to be confirmed.
key: []
id-pattern:
- ^PX-
dated-by: snapshot
cadence:
  frequency: intraday
  due: on demand, when the connector is on
storage:
  connector: us-equities-prices
  plugin: yfinance
fields:
- name: AS_OF
  type: unknown
  presence: optional
  description: As of
- name: CHANGE
  type: unknown
  presence: optional
  description: Change
- name: CHANGE_PCT
  type: unknown
  presence: optional
  description: Change %
- name: CURRENCY
  type: unknown
  presence: optional
  description: Currency
- name: DAY_HIGH
  type: unknown
  presence: optional
  description: Day high
- name: DAY_LOW
  type: unknown
  presence: optional
  description: Day low
- name: EXCHANGE
  type: unknown
  presence: optional
  description: Exchange
- name: FIFTY_TWO_WEEK_HIGH
  type: unknown
  presence: optional
  description: 52-week high
- name: FIFTY_TWO_WEEK_LOW
  type: unknown
  presence: optional
  description: 52-week low
- name: MARKET_STATE
  type: unknown
  presence: optional
  description: Market
- name: PRICE
  type: unknown
  presence: optional
  description: Price
- name: VOLUME
  type: unknown
  presence: optional
  description: Volume
- name: ANALYTICS
  type: record
  presence: derived
  description: 'Computed from the closes when the history is read (PXH analytics, since 2.9.2): nested ANALYTICS'
links: []
validation: []
notes:
- 'ANALYTICS is computed by the yfinance plugin from the history it has just read (PriceAnalytics, docs/guides/GROUPINGS_ANALYTICS_GUIDE.md section
  17): nothing is stored, and the figures are internal use only like the prices; the connector is off as shipped.'
review:
- 'no key could be read from the test data, the catalogue or the layout: name the business key.'
- 'read live through the yfinance connector when it is on: confirm the cadence (intraday, on demand).'
- 'no samples or test data ship for this kind: the fields are those its Sutras show (and its declared result); state every field''s type and presence.'
nested:
  ANALYTICS:
  - name: OBSERVATIONS
    type: integer
    presence: derived
    description: The daily closes the history holds
  - name: RETURN_1M
    type: rate
    presence: derived
    description: close / close 21 trading days earlier - 1 (empty when the history is shorter)
  - name: RETURN_3M
    type: rate
    presence: derived
    description: the same over 63 trading days
  - name: RETURN_6M
    type: rate
    presence: derived
    description: the same over 126 trading days
  - name: RETURN_PERIOD
    type: rate
    presence: derived
    description: the last close over the first - 1
  - name: VOLATILITY
    type: rate
    presence: derived
    description: the sample standard deviation of the daily log returns x sqrt(252)
  - name: MAX_DRAWDOWN
    type: rate
    presence: derived
    description: the largest fall from a running high to a later close, negative
  - name: BENCHMARK
    type: text
    presence: derived
    description: The symbol beta is measured against (the connector setting benchmark, SPY as shipped)
  - name: BETA
    type: amount
    presence: derived
    description: cov(daily log returns, the benchmark's) / var(the benchmark's), on their common dates; empty with fewer than 21 common closes
  - name: CORRELATION
    type: rate
    presence: derived
    description: the correlation of the daily log returns with the benchmark's
