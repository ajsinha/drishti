# Data contract of the sic-sector kind (command SIC): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap sic-sector`; owned by people from then on: confirm the review points, then remove them.
kind: sic-sector
mnemonic: SIC
pack: us-equities
version: '1.0'
class: computed
status: retiring
retiring-in: 2.9.0 or 2.10.0
replaced-by: docs/contracts/GROUPINGS_AND_ANALYTICS.md
title: SIC sector
description: 'A sector by its SIC code: its companies ranked by revenue; a click opens a company''s summary beside.'
source: 'public data: SEC EDGAR, Nasdaq Trader, GLEIF and Wikidata (tools/publicdata/us_equities.py)'
grain: One row per sic sector, keyed by SIC.
key:
- SIC
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: us-equities-store
  plugin: delta
  domain: us-equities
  table: <root>/us-equities/sic-sector/
  columns:
  - SIC
  - DESCRIPTION
  - SECTOR
  - COMPANIES
  test-data:
  - data/testdata/us-equities/sic-sector
fields:
- name: SIC
  type: id
  presence: required
  description: SIC
  example: '3711'
- name: DESCRIPTION
  type: text
  presence: required
  description: Industry
  example: Motor Vehicles & Passenger Car Bodies
- name: DIVISION
  type: text
  presence: optional
  example: D
- name: SECTOR
  type: text
  presence: required
  description: Division
  example: Manufacturing
- name: COMPANIES
  type: integer
  presence: derived
  description: Companies
  example: 4
  note: computed by the SIC sector grouping; removed when retired
- name: REVENUE
  type: amount
  presence: derived
  description: Revenue
  example: 495557800000
  note: computed by the SIC sector grouping; removed when retired
- name: NET_INCOME
  type: amount
  presence: derived
  description: Net income
  example: 704800000
  note: computed by the SIC sector grouping; removed when retired
- name: ROWS
  type: record list
  presence: derived
  description: 'Nested: see nested ROWS[]'
  note: computed by the SIC sector grouping; removed when retired
- name: BY_REVENUE
  type: record list
  presence: derived
  description: 'Nested: see nested BY_REVENUE[]'
  note: computed by the SIC sector grouping; removed when retired
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
- name: CODES
  type: integer
  presence: optional
  description: SIC codes
  example: 181
- name: CODES_LIST
  type: record list
  presence: optional
  description: 'Nested: see nested CODES_LIST[]'
- name: BY_DIVISION
  type: record list
  presence: optional
  description: 'Nested: see nested BY_DIVISION[]'
nested:
  ROWS[]:
  - name: TICKER
    type: text
    presence: required
    example: F
  - name: NAME
    type: text
    presence: required
    example: Ford Motor Company
  - name: EXCHANGE
    type: text
    presence: required
    example: NYSE, NYSE, NYSE, NYSE
  - name: INDEX_TEXT
    type: text
    presence: required
    example: S&P 500
  - name: REVENUE
    type: amount
    presence: optional
    example: 187267000000
  - name: NET_INCOME
    type: amount
    presence: required
    example: -8162000000
  - name: NET_MARGIN
    type: rate
    presence: optional
    example: -4.36
  - name: CURRENCY
    type: text
    presence: required
    example: USD
    enum:
    - CAD
    - EUR
    - GBP
    - USD
  - name: FISCAL_YEAR
    type: integer
    presence: required
    example: 2025
  BY_REVENUE[]:
  - name: LABEL
    type: text
    presence: required
    example: F
  - name: VALUE
    type: amount
    presence: required
    example: 187267000000
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    example: U.S. Securities and Exchange Commission, EDGAR (Standard In…
  - name: RETRIEVED_AT
    type: date
    presence: required
    example: '2026-10-24'
  - name: LICENCE
    type: text
    presence: required
    example: Public domain (U.S. Government work); SEC EDGAR fair access…
  CODES_LIST[]:
  - name: SIC
    type: id
    presence: required
    description: The record's id (the business key)
    example: '6324'
  - name: DESCRIPTION
    type: text
    presence: required
    description: Industry
    example: Hospital & Medical Service Plans
  - name: SECTOR
    type: text
    presence: required
    description: Division
    example: Finance, Insurance and Real Estate
  - name: COMPANIES
    type: integer
    presence: required
    description: Companies
    example: 5
  - name: REVENUE
    type: amount
    presence: required
    description: Revenue, latest FY
    example: 1246033000000
  BY_DIVISION[]:
  - name: LABEL
    type: text
    presence: required
    example: Manufacturing
  - name: VALUE
    type: amount
    presence: required
    example: 5609615057000
links: []
validation:
- rule: required
  fields:
  - SIC
  - DESCRIPTION
  - SECTOR
  - PROVENANCE
- rule: unique
  key:
  - SIC
  per: snapshot
- rule: enum
  field: ROWS[].CURRENCY
  values:
  - CAD
  - EUR
  - GBP
  - USD
notes:
- 'Retiring in 2.9.0 or 2.10.0: the stored kind is removed and computed instead by the SIC sector grouping (docs/contracts/GROUPINGS_AND_ANALYTICS.md);
  old ids and links open the computed page.'
review:
- 'required inferred from 100% coverage in 183 documents (1 samples and 182 test-data documents (data/testdata/us-equities/sic-sector/snapshot-2026-10-24.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'a snapshot refreshed when tools/publicdata/us_equities.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: ROWS[].CURRENCY: confirm they are closed lists.'
- 'number types decided by the field''s name: REVENUE amount, NET_INCOME amount, ROWS[].REVENUE amount, ROWS[].NET_INCOME amount, ROWS[].NET_MARGIN
  rate, BY_REVENUE[].VALUE amount, CODES_LIST[].REVENUE amount, BY_DIVISION[].VALUE amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts REVENUE, NET_INCOME, ROWS[].REVENUE, ROWS[].NET_INCOME, BY_REVENUE[].VALUE, CODES_LIST[].REVENUE, BY_DIVISION[].VALUE
  (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
- 'no description in about.yaml or the Sutras for DIVISION, ROWS[].TICKER, ROWS[].NAME, ROWS[].EXCHANGE, ROWS[].INDEX_TEXT, ROWS[].REVENUE, ROWS[].NET_INCOME,
  ROWS[].NET_MARGIN, ROWS[].CURRENCY, ROWS[].FISCAL_YEAR, BY_REVENUE[].LABEL, BY_REVENUE[].VALUE and 5 more: write them in the pack''s config/about.yaml
  glossary.'
- 'The release is 2.9.0 or 2.10.0 (Track B, shipped as each is ready): confirm which.'
