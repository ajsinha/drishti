# Data contract of the index-membership kind (command IDX): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap index-membership`; owned by people from then on: confirm the review points, then remove them.
kind: index-membership
mnemonic: IDX
pack: us-equities
version: '1.0'
class: fundamental
status: active
title: Index members
description: An equity index's members (Dow 30, Nasdaq-100, S&P 500) as their tracking ETF reports holding them; a click opens the member's summary beside.
source: 'public data: SEC EDGAR (with the tracking ETFs'' Form N-PORT), Nasdaq Trader, GLEIF and Wikidata (tools/publicdata/us_equities.py)'
grain: One row per index members, keyed by INDEX.
key:
- INDEX
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: us-equities-store
  plugin: delta
  domain: us-equities
  table: <root>/us-equities/index-membership/
  columns:
  - INDEX
  - NAME
  - MEMBERS
  test-data:
  - data/testdata/us-equities/index-membership
fields:
- name: INDEX
  type: id
  presence: required
  description: The record's id (the business key)
  example: DJIA
- name: NAME
  type: text
  presence: required
  description: Index
  example: Dow Jones Industrial Average
- name: MEMBERS
  type: integer
  presence: required
  description: Members
  example: 34
- name: ROWS
  type: record list
  presence: required
  description: 'Nested: see nested ROWS[]'
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
nested:
  ROWS[]:
  - name: TICKER
    type: text
    presence: required
    example: AAPL
  - name: NAME
    type: text
    presence: required
    example: Apple Inc.
  - name: SECTOR
    type: text
    presence: required
    example: Manufacturing
    enum:
    - Construction
    - Finance, Insurance and Real Estate
    - Manufacturing
    - Mining
    - Retail Trade
    - Services
    - Transportation, Communications, Electric, Gas and Sanitary Services
  - name: SIC
    type: text
    presence: required
    example: '3571'
  - name: SIC_DESCRIPTION
    type: text
    presence: required
    example: Electronic Computers
  - name: EXCHANGE
    type: text
    presence: required
    example: Nasdaq
  - name: REVENUE
    type: amount
    presence: optional
    example: 416161000000
  - name: NET_INCOME
    type: amount
    presence: optional
    example: 112010000000
  - name: CURRENCY
    type: text
    presence: required
    example: USD
  - name: FISCAL_YEAR
    type: integer
    presence: optional
    example: 2025
  - name: SINCE
    type: date
    presence: optional
    example: '2000-06-05'
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    example: SEC Form N-PORT of DIA (SPDR DOW JONES INDUSTRIAL AVERAGE ETF TRUST), the…
  - name: LICENCE
    type: text
    presence: required
    example: Public domain (SEC EDGAR); CC0 1.0 (Wikidata)
  - name: NOTE
    type: text
    presence: required
    example: Membership only. Index weights and levels are proprietary t…
  - name: RETRIEVED_AT
    type: date
    presence: required
    example: '2026-10-24'
links: []
validation:
- rule: required
  fields:
  - INDEX
  - NAME
  - MEMBERS
  - ROWS
  - PROVENANCE
- rule: unique
  key:
  - INDEX
  per: snapshot
- rule: enum
  field: ROWS[].SECTOR
  values:
  - Finance, Insurance and Real Estate
  - Manufacturing
  - Retail Trade
  - Services
  - Transportation, Communications, Electric, Gas and Sanitary Services
notes:
- 'ROWS[].NET_MARGIN left the record in 2.9.2: a member''s net margin is computed from its revenue and net income (docs/guides/GROUPINGS_ANALYTICS_GUIDE.md
  section 16).'
- 'SECTORS, REVENUE, NET_INCOME and BY_SECTOR left the record in 2.9.2: the page sums the members'' rows (USD reporters) and counts their SIC
  divisions (docs/guides/GROUPINGS_ANALYTICS_GUIDE.md section 16). The membership (ROWS) and MEMBERS stay.'
review:
- 'required inferred from 100% coverage in 7 documents (1 samples and 6 test-data documents (data/testdata/us-equities/index-membership/snapshot-2026-10-24.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'a snapshot refreshed when tools/publicdata/us_equities.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: ROWS[].SECTOR: confirm they are closed lists.'
