  values:
  - GLEIF, LEI from Wikidata
  - GLEIF, matched by legal name
  - Wikidata
- rule: enum
  field: CURRENCY
  values:
  - CAD
  - EUR
  - GBP
  - USD
- rule: link
  field: EQUITY
  kind: equity
- rule: link
  field: INDEX_IDS
  kind: index-membership
- rule: link
  field: FACT_IDS
  kind: financial-fact
- rule: link
  field: FILING_IDS
  kind: filing
- rule: link
  field: SIC_SECTOR
  kind: sic-sector
- rule: link
  field: ECONOMY
  kind: economy
- rule: link
  field: MARKET_WATCH
  kind: listed-company
- rule: enum
