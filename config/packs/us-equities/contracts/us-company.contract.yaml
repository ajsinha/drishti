  values:
  - BANKS-CA
  - BANKS-UK
  - BANKS-US
  - DJIA
  - NDX
  - SP500
- rule: enum
  field: INDEXES[].NAME
  values:
  - Canadian banks
  - Dow Jones Industrial Average
  - Major UK banks
  - Major US banks
  - Nasdaq-100
  - S&P 500
- rule: link
  field: FINANCIALS[].EQUITY
  kind: equity
