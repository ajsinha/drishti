# US equities · real public data on the companies of the Dow 30, the Nasdaq-100 and the S&P 500, and on major US, Canadian and UK
# banks that file with the SEC (the pack's bank lists): SEC EDGAR (public domain) for the
# companies, their SIC sectors, filings and annual XBRL financials; Wikidata (CC0) for index membership, headquarters and founding;
# GLEIF (CC0) for the LEI; the Nasdaq Trader symbol directory for the listing market. Hand-written; tools/packgen/us_equities/make.py
# writes the data (data/testdata/us-equities/<kind>/, built into the lake by tools/build_demo_lakes.py and served by the Delta
# connector us-equities-store below), a few reference samples and guides/us-equities.md from the cache tools/packgen/us_equities/fetch.py
# fills. No index weights or levels, no GICS, and no prices: price-history is read live by an off-by-default connector, for internal use only.
pack: us-equities
version: 1.0.0
code: USEQS            # typed alone, opens this pack's overview
title: US equities
description: >-
  Public data on the companies of the Dow 30, the Nasdaq-100 and the S&P 500, and on major US, Canadian and UK banks that file with
  the SEC: SEC EDGAR companies, SIC sectors, filings and ten years of annual XBRL financials, LEIs from GLEIF and index membership
  from Wikidata. Prices are not shipped: the price-history kind is read
  live by a connector that is off by default and for internal use only.
kinds: [us-company, index-membership, sic-sector, filing-feed, filing, financial-fact, price-history]
formats: config/formats.yaml
mnemonics:
  USEQ:   { kind: us-company, label: US company }
  IDX:    { kind: index-membership, label: Index members }
  SIC:    { kind: sic-sector, label: SIC sector }
  EDGAR:  { kind: filing-feed, label: EDGAR filings browser }
  FILING: { kind: filing, label: SEC filing }
  FACT:   { kind: financial-fact, label: Financial fact }
  PXH:    { kind: price-history, label: "Price history (live, internal use only)" }
graph:
  id-patterns:
    - { pattern: "^PX-", kind: price-history }
    - { pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$", kind: filing }
  fields:
    COMPANY:       { kind: us-company, label: Company }
    SIC_SECTOR:    { kind: sic-sector, label: SIC sector }
    ECONOMY:       { kind: economy, label: Economy }
    MARKET_WATCH:  { kind: listed-company, label: Market watch }
    LEGAL_ENTITY:  { kind: legal-entity, label: Legal entity }
    FILING_IDS:    { kind: filing, label: Filing }               # lists of ids: each one a link
    FACT_IDS:      { kind: financial-fact, label: Financial fact }
    INDEX_IDS:     { kind: index-membership, label: Index }
    US_COMPANY:    { kind: us-company, label: US listed company }   # the gleif pack's lei-entity names its company by ticker
  badges:
    us-company: "$.TICKER + ' · ' + $.SIC_DESCRIPTION"
    filing: "$.FORM + ' · ' + $.FILED"
    financial-fact: "$.LABEL + ' ' + $.LATEST_YEAR"
    index-membership: "$.MEMBERS + ' members'"
    sic-sector: "$.COMPANIES + ' companies'"
roles:
  equity-analyst: { kinds: [us-company, index-membership, sic-sector, filing-feed, filing, financial-fact, price-history], raw: true }
form:                          # FORM us-equities: the search form of each kind
  us-company:
    - { path: TICKER, type: id, group: Identity, help: "One or many: paste a list." }
    - { path: NAME, type: text, group: Identity }
    - { path: CIK, type: text, group: Identity }
    - { path: LEI, type: text, group: Identity }
    - { path: EXCHANGE, type: enum, group: Listing }
    - { path: INDEX_TEXT, label: Indexes, type: text, group: Listing, help: "Nasdaq-100 finds its members." }
    - { path: SECTOR, label: SIC division, type: enum, group: Sector }
    - { path: SIC_DESCRIPTION, label: SIC industry, type: text, group: Sector }
    - { path: STATE_OF_INCORPORATION, type: enum, group: Sector }
    - { path: REVENUE, type: number, group: Financials }
  filing:
    - { path: ACCESSION, type: id, group: Filing }
    - { path: COMPANY, type: text, group: Filing }
    - { path: FORM, type: enum, group: Filing }
    - { path: FILED, type: date, group: Filing }
console:
  examples:
    - ["USEQ AAPL", "Apple · key facts, ten years of financials, recent filings, index memberships"]
    - ["USEQ JPM", "JPMorgan Chase · a bank's financials"]
    - ["IDX SP500", "S&P 500 · the members, filterable; a click opens the company beside"]
    - ["IDX DJIA", "Dow Jones Industrial Average · thirty members"]
    - ["IDX BANKS-CA", "Canadian banks that file with the SEC · financials in CAD"]
    - ["SIC 3674", "Semiconductors, computed from the companies · the companies of one SIC code by revenue"]
    - ["SIC ALL", "Every SIC code covered, by revenue (computed)"]
    - ["EDGAR 8-K", "The latest current reports; a click opens the filing beside"]
    - ["FACT AAPL-REVENUE", "Apple's revenue over ten fiscal years"]
  help: config/help.yaml
columns:
  us-company: [TICKER, NAME, EXCHANGE, SIC_DESCRIPTION, INDEX_TEXT, REVENUE]
  filing: [ACCESSION, COMPANY, FORM, FILED, REPORT_DATE]
  financial-fact: [FACT_ID, COMPANY_NAME, LABEL, LATEST, LATEST_YEAR]
  sic-sector: [SIC, DESCRIPTION, SECTOR, COMPANIES]
  index-membership: [INDEX, NAME, MEMBERS]
  filing-feed: [FEED, NAME, FILINGS]
# The pack's data: the committed snapshot data/testdata/us-equities/<kind>/ built into <lake>/us-equities/<kind>/ by
# tools/build_demo_lakes.py (drishti.py lake demo), one Delta table per kind keyed by its id field (TICKER, ACCESSION, FACT_ID ...).
# The promoted columns answer the search form; the type-ahead also matches a company's name and LEI (layout.<kind>.type-ahead).
# TEMPLATE: written once to config/connectors/us-equities-prices.yaml, DISABLED. INTERNAL USE ONLY: free price feeds forbid
# redistribution; turning it on sends every ticker opened to Yahoo Finance. Nothing it reads is committed.
connectors:
  us-equities-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [us-company, index-membership, filing-feed, filing, financial-fact]
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: us-equities
      layout:
        us-company:
          columns: [TICKER, NAME, LEI_LEGAL_NAME, CIK, LEI, EXCHANGE, INDEX_TEXT, SECTOR, SIC, SIC_DESCRIPTION, STATE_OF_INCORPORATION,
                    REVENUE]
          type-ahead: [NAME, LEI, LEI_LEGAL_NAME]
        index-membership:
          columns: [INDEX, NAME, MEMBERS]
          type-ahead: [NAME]
        filing-feed:
          columns: [FEED, NAME, FILINGS]
          type-ahead: [NAME]
        filing:
          columns: [ACCESSION, COMPANY, COMPANY_NAME, FORM, FILED, REPORT_DATE]
          type-ahead: [COMPANY, FORM]
        financial-fact:
          columns: [FACT_ID, COMPANY, COMPANY_NAME, CONCEPT, LABEL, LATEST, LATEST_YEAR]
          type-ahead: [COMPANY_NAME, LABEL]
  us-equities-prices:
    plugin: yfinance
    enabled: ${DRISHTI_US_EQUITIES_PRICES_ENABLED:false}
    kinds: [price-history]
    settings:
      base-url: ${DRISHTI_YFINANCE_URL:https://query1.finance.yahoo.com/v8/finance/chart}
      id-prefix: PX-
      kind: price-history
      source-name: us-equities-prices (internal use only)
      range: 1y
      interval: 1d
      timeout-seconds: 10
      cache-ttl-seconds: 300
      cache-max-symbols: 200
      user-agent: ${drishti.branding.product:Drishti} us-equities prices (internal use only)
      benchmark: ${DRISHTI_US_EQUITIES_BENCHMARK:SPY}     # beta and correlation are measured against it (PXH analytics, computed when read)
  # SIC: computed from the companies when asked (since 2.9.2; docs/guides/GROUPINGS_ANALYTICS_GUIDE.md). A company is in its SIC code's
  # sector and in ALL (the directory, which keeps its aggregates only). Totals add the USD reporters only (CAD, GBP and EUR filers are
  # counted, not summed); a company's net margin is its net income over its revenue.
  us-equities-groupings:
    plugin: derived
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [sic-sector]
    settings:
      refresh: 60s
      source-name: us-equities-groupings
      sic-sector:
        from: us-company
        group-by: $.SIC
        also-group-by: { all: "'ALL'" }
        unlisted: ALL
        id-field: SIC
        search-fields: DESCRIPTION          # SIC semicon: the type-ahead finds a sector by its description
        members: TICKERS
        max-members: 100000
        rows-field: ROWS
        fields:
          COMPANIES: count
          DESCRIPTIONS: distinct $.SIC_DESCRIPTION
          DIVISIONS: distinct $.DIVISION
          SECTORS: distinct $.SECTOR
          CODE_LIST: distinct $.SIC
          REVENUE: "sum $.CURRENCY == 'USD' ? $.REVENUE : null"
          NET_INCOME: "sum $.CURRENCY == 'USD' ? $.NET_INCOME : null"
          NON_USD: "sum $.CURRENCY != 'USD' ? 1 : 0"
          PROVENANCE: first $.PROVENANCE
        rows:
          TICKER: $.TICKER
          NAME: $.NAME
          EXCHANGE: $.EXCHANGE
          INDEX_TEXT: $.INDEX_TEXT
          SECTOR: $.SECTOR
          REVENUE: $.REVENUE
          NET_INCOME: $.NET_INCOME
          NET_MARGIN: "$.REVENUE ? $.NET_INCOME / $.REVENUE * 100 : null"
          CURRENCY: $.CURRENCY
          FISCAL_YEAR: $.FISCAL_YEAR
        then:
          DESCRIPTION: "$.SIC == 'ALL' ? 'Every SIC code of the companies covered' : first($.DESCRIPTIONS)"
          DIVISION: "$.SIC == 'ALL' ? '' : first($.DIVISIONS)"
          SECTOR: "$.SIC == 'ALL' ? 'All divisions' : first($.SECTORS)"
          CODES: size($.CODE_LIST)
          NET_MARGIN: "$.REVENUE ? $.NET_INCOME / $.REVENUE * 100 : null"
          BY_REVENUE: "$.ROWS[?@.CURRENCY == 'USD' && @.REVENUE > 0]"
          BY_DIVISION: "group($.ROWS[?@.CURRENCY == 'USD'], 'SECTOR', 'REVENUE')"
        sort:
          ROWS: REVENUE desc
          BY_REVENUE: REVENUE desc 15
          BY_DIVISION: value desc
routes:
  us-company: us-equities-store
  index-membership: us-equities-store
  sic-sector: us-equities-groupings
  filing-feed: us-equities-store
  filing: us-equities-store
  financial-fact: us-equities-store
  price-history: us-equities-prices
