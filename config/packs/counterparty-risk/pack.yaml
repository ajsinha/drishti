      kind: sa-ccr
      label: SA-CCR
    SIMM:
      kind: simm
      label: SIMM
  badges:
    csa: '''threshold '' + fmt($.THRESHOLD_THEM, ''compact'')'
    netting-set: '''PFE '' + fmt($.PFE_PEAK, ''compact'')'
