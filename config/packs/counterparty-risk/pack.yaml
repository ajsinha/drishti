console:
  examples:
  - - AGR AGR-NORTHBRIDGE-ISDA
    - ISDA master agreement · elections
  - - NSET NS-ALDERSHOT-NY
    - Netting set · its trades, the exposure computed from the paths, CVA
  - - LIM LIM-SUMMIT
    - Credit limit · utilisation by tenor
  - - CVA CVA-SUMMIT-NY
    - CVA / XVA
  - - SACCR SACCR-SUMMIT-NY
    - SA-CCR exposure at default
  - - EXP NSET:NS-ALDERSHOT-FRA
    - Exposure profile of a netting set · EE, PFE 95 and 99, EPE, EEPE computed from the paths
  - - EXP CPTY:CP-ALDERSHOT
    - A counterparty's exposure · its four netting sets summed path by path (PFE is not a sum of PFEs)
  help: config/help.yaml
python:
  enabled: true
roles:
