# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Counterparty credit risk pack for Drishti.
pack: counterparty-risk
version: 1.0.0
code: CCR
title: Counterparty credit risk
description: ISDA master agreements and CSAs, netting sets, exposure and PFE, CVA/XVA, SA-CCR, credit limits, collateral, margin calls and SIMM.
extends:
- trading
kinds:
- agreement
- csa
- netting-set
- credit-limit
- cva
- sa-ccr
- collateral-balance
- margin-call
- simm
- simulation-run
- exposure-path
- exposure-result
sutras: sutras
formats: config/formats.yaml
mnemonics:
  AGR:
    kind: agreement
    label: Master agreement
  CSA:
    kind: csa
    label: Credit support annex
  NSET:
    kind: netting-set
    label: Netting set
  LIM:
    kind: credit-limit
    label: Credit limit
  CVA:
    kind: cva
    label: CVA / XVA
  SACCR:
    kind: sa-ccr
    label: SA-CCR exposure
  COLL:
    kind: collateral-balance
    label: Collateral balance
  MC:
    kind: margin-call
    label: Margin call
  SIMM:
    kind: simm
    label: ISDA SIMM initial margin
  XRUN:
    kind: simulation-run
    label: Exposure simulation run
  XPATH:
    kind: exposure-path
    label: Exposure path (a trade's MtM on every path at a grid date)
  EXP:
    kind: exposure-result
    label: Exposure profile of a scope (computed)
graph:
  id-patterns:
  - pattern: ^AGR-
    kind: agreement
  - pattern: ^CSA-
    kind: csa
  - pattern: ^NS-
    kind: netting-set
  - pattern: ^LIM-
    kind: credit-limit
  - pattern: ^CVA-
    kind: cva
  - pattern: ^SACCR-
    kind: sa-ccr
  - pattern: ^COLL-
    kind: collateral-balance
  - pattern: ^MC-
    kind: margin-call
  - pattern: ^SIMM-
    kind: simm
  - pattern: ^XR-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$
    kind: simulation-run
  - pattern: ^XR-[^~]+~.+~[0-9]+$
    kind: exposure-path
  fields:
    AGREEMENT:
      kind: agreement
      label: Agreement
    COLLATERAL_BALANCE:
      kind: collateral-balance
      label: Collateral
    COLLATERAL_BALANCES:
      kind: collateral-balance
      label: Collateral
    CREDIT_LIMIT:
      kind: credit-limit
      label: Credit limit
    CSA:
      kind: csa
      label: CSA
    CVA_RESULT:
      kind: cva
      label: CVA
    NETTING_SET:
      kind: netting-set
      label: Netting set
    NETTING_SETS:
      kind: netting-set
      label: Netting set
    RUN_ID:
      kind: simulation-run
      label: Simulation run
    SACCR:
      kind: sa-ccr
      label: SA-CCR
    SIMM:
      kind: simm
      label: SIMM
  badges:
    csa: '''threshold '' + fmt($.THRESHOLD_THEM, ''compact'')'
    netting-set: '''net '' + fmt($.NET_MTM, ''compact'')'
    credit-limit: fmt($.UTILISATION, 'pct0') + ' used'
  impact:
    follow:
    - NETTING_SET
    - CREDIT_LIMIT
    measures:
      netting-set: $.NET_MTM
      credit-limit: $.LIMIT
    formats:
      netting-set: signed0
      credit-limit: compact
connectors:
  legal-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - agreement
    - csa
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: legal
      mode.agreement: effective
      mode.csa: effective
  credit-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - netting-set
    - credit-limit
    - cva
    - sa-ccr
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: credit
  collateral-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - collateral-balance
    - margin-call
    - simm
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: collateral
  exposure-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - simulation-run
    - exposure-path
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: risk
      layout:
        simulation-run:
          columns:
          - RUN_ID
          - CALIBRATION
          - PATHS
          - STATUS
          - BATCH_ID
        exposure-path:
          columns:
          - TRADE_ID
          - NETTING_SET
          - COUNTERPARTY
          - LEGAL_ENTITY
          - DESK
          - TT_BOOK
          - ASSET_CLASS
          - PRODUCT
          - SOURCE_SYSTEM
          - MATURITY_DATE
          - NOTIONAL
          - GRID_INDEX
          - GRID_DATE
          - RUN_ID
          - BATCH_ID
          - STATUS
          vectors:
          - MTM
  exposure-engine:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_EXPOSURE_ENABLED:true}
    description: 'Exposure profiles (EE, ENE, EEE, PFE 95 and 99, EPE, EEPE) of any counterparty scope, computed when asked by the server''s exposure
      engine from the exposure paths, as the viewer: EXP <scope> <GO>'
    kinds:
      exposure-result:
        compute: exposure-result
        params:
          q:
            type: decimal
            default: 0.95
            min: 0.5
            max: 0.9999
          collateral:
            type: enum
            options:
            - lagged
            - current
            - none
            default: lagged
          run:
            type: text
            default: ''
        result:
          required:
          - SCOPE
          - STATUS
          - PROFILE
          types:
            EPE: number
            PEAK_PFE: number
    engine:
      type: java
      class: com.ash.drishti.server.exposure.ExposureResultEngine
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - simulation-run
      - exposure-path
      - netting-set
      - csa
      - collateral-balance
      affects: all
    coalesce:
      quiet: 1s
      max-wait: 10s
    cache:
      results: 1000
      ttl: 1h
    limits:
      timeout: 60s
      wait: 5s
      max-inflight-per-user: 4
routes:
  agreement: legal-store
  csa: legal-store
  netting-set: credit-store
  credit-limit: credit-store
  cva: credit-store
  sa-ccr: credit-store
  collateral-balance: collateral-store
