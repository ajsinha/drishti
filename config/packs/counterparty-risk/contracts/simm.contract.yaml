# Data contract of the simm kind (command SIMM): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap simm`; owned by people from then on: confirm the review points, then remove them.
kind: simm
mnemonic: SIMM
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: ISDA SIMM initial margin
description: Initial margin by risk class and product class.
source: margin-engine
grain: One row per isda simm initial margin per business date, keyed by CALC_ID.
key:
- CALC_ID
id-pattern:
- ^SIMM-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: collateral-store
  plugin: delta
  domain: collateral
  table: <root>/collateral/simm/
  test-data:
  - data/testdata/counterparty-risk/simm
fields:
- name: CALC_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: SIMM-ALDERSHOT
  pattern: ^SIMM-
- name: TOTAL
  type: amount
  presence: required
  unit: USD
  description: The margin the ISDA SIMM model requires, built from the sensitivities of the trades by risk class and product class.
  example: 7068571
- name: POSTED
  type: amount
  presence: required
  unit: USD
  description: The initial margin the bank has delivered to the counterparty or a custodian.
  example: 6856514
- name: RECEIVED
  type: amount
  presence: required
  unit: USD
  description: The initial margin the counterparty has delivered to the bank.
  example: 7209942
- name: VERSION
  type: text
  presence: required
  description: The version of the ISDA Standard Initial Margin Model the calculation used; the model is recalibrated each year.
  example: ISDA SIMM 2.7
- name: RISK_CLASSES
  type: record list
  presence: required
  description: 'The initial margin by SIMM risk class, one element per class (Interest rate, Credit qualifying, Equity, Commodity, FX): RISK_CLASS and IM in USD.'
- name: NETTING_SET
  type: id
  presence: required
  description: 'The netting set the initial margin is exchanged for: a NETTING_SET_ID of the netting-set kind (NS-<counterparty>-<legal entity>).'
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
  link: netting-set
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The counterparty the initial margin is calculated with: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
nested:
  RISK_CLASSES[]:
  - name: RISK_CLASS
    type: text
    presence: required
    description: 'The ISDA SIMM risk class: Interest rate, Credit qualifying, Credit non-qualifying, Equity, Commodity or FX.'
    example: Interest rate
    enum:
    - Commodity
    - Credit qualifying
    - Equity
    - FX
    - Interest rate
  - name: IM
    type: amount
    presence: required
    unit: USD
    description: 'The initial margin of one SIMM risk class: interest rate, credit qualifying, credit non-qualifying, equity, commodity or FX.'
    example: 3180857
links:
- field: NETTING_SET
  kind: netting-set
- field: COUNTERPARTY
  kind: counterparty
validation:
- rule: required
  fields:
  - CALC_ID
  - TOTAL
  - POSTED
  - RECEIVED
  - VERSION
  - RISK_CLASSES
  - NETTING_SET
  - COUNTERPARTY
- rule: unique
  key:
  - CALC_ID
  per: business_date
- rule: pattern
  field: CALC_ID
  pattern: ^SIMM-
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: enum
  field: RISK_CLASSES[].RISK_CLASS
  values:
  - Commodity
  - Credit qualifying
  - Equity
  - FX
  - Interest rate
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 42 documents (18 samples and 24 test-data documents (data/testdata/counterparty-risk/simm/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/simm/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'source ''margin-engine'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: RISK_CLASSES[].RISK_CLASS: confirm they are closed lists.'
