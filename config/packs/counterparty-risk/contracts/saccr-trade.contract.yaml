# Data contract of the saccr-trade kind (command SACT): docs/contracts/README.md section 16; the measure's contract is
# docs/contracts/SACCR.md (section 3.3). Drafted by `drishti.py contract bootstrap saccr-trade`, completed by hand.
kind: saccr-trade
mnemonic: SACT
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: SA-CCR classification row (a derivative's asset class, hedging set and terms)
description: One derivative's SA-CCR classification and terms per business date and risk driver (asset class, hedging set, transaction
  type, direction, notional, dates, option and tranche terms); the SA-CCR engine computes every supervisory figure and EAD from it. A row that
  carries a computed figure is refused.
source: the bank's capital or product-control process (classification signed off upstream); the demo's rows are derived by rules from the
  trade valuations (tools/packgen/ccr/make_saccr_data.py, DERIVED_BY rules)
grain: One row per live derivative and risk driver per BUSINESS_DATE, keyed by SACCR_ROW_ID (<TRADE_ID>~<DRIVER>).
key:
- SACCR_ROW_ID
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: with the trade valuations of the business date (SACCR.md section 3.4, open question 2)
storage:
  connector: exposure-store
  plugin: delta
  domain: risk
  table: <root>/risk/saccr-trade/
  columns:
  - SACCR_ROW_ID
  - TRADE_ID
  - SOURCE_SYSTEM
  - DRIVER
  - NETTING_SET
  - COUNTERPARTY
  - LEGAL_ENTITY
  - ASSET_CLASS
  - HEDGING_SET
  - TRANSACTION_TYPE
  - REFERENCE
  - IS_INDEX
  - CREDIT_QUALITY
  - DIRECTION
  - NOTIONAL_USD
  - QUANTITY
  - UNDERLYING_PRICE
  - START_DATE
  - END_DATE
  - MATURITY_DATE
  - OPTION_TYPE
  - BOUGHT_SOLD
  - EXERCISE_DATE
  - STRIKE
  - UNDERLYING_FORWARD
  - SHIFT
  - ATTACHMENT
  - DETACHMENT
  - CLEARED
  - SPECIFIC_WWR
  - DERIVED_BY
  - PRODUCT_TYPE
  - BATCH_ID
  test-data:
  - data/testdata/counterparty-risk/saccr-trade
fields:
- name: SACCR_ROW_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: CLY-3000020~0
- name: BUSINESS_DATE
  type: date
  presence: required
  example: '2026-09-30'
- name: TRADE_ID
  type: id
  presence: required
  description: 'Trade: the trade it refers to'
  example: CLY-3000020
  link: trade
- name: SOURCE_SYSTEM
  type: text
  presence: required
  example: CALYPSO
  enum:
  - CALYPSO
  - ENDUR
  - MUREX
- name: DRIVER
  type: integer
  presence: required
  description: 0 the primary risk driver; 1, 2 … further drivers of a complex trade, each its own row.
  example: 0
- name: NETTING_SET
  type: id
  presence: required
  description: 'Netting set: the netting-set it refers to'
  example: NS-ALDERSHOT-LDN
  pattern: ^NS-
  link: netting-set
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'Counterparty: the counterparty it refers to'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'Legal entity: the legal-entity it refers to'
  example: LE-LDN
  pattern: ^LE-
  link: legal-entity
- name: ASSET_CLASS
  type: text
  presence: required
  description: 'IR, FX, CREDIT, EQUITY or COMMODITY: the class of the trade''s primary risk driver (CRE52.25).'
  example: FX
  enum:
  - COMMODITY
  - CREDIT
  - EQUITY
  - FX
  - IR
- name: TRANSACTION_TYPE
  type: text
  presence: required
  description: 'LINEAR, OPTION, CDO_TRANCHE, BASIS or VOLATILITY: how the supervisory delta and factor are taken.'
  example: LINEAR
  enum:
  - BASIS
  - CDO_TRANCHE
  - LINEAR
  - OPTION
  - VOLATILITY
- name: DIRECTION
  type: text
  presence: optional
  description: 'LONG or SHORT in the primary risk factor: a payer swap and sold protection are long; a receiver swap and bought protection short.'
  example: LONG
  enum:
  - LONG
  - SHORT
- name: NOTIONAL_USD
  type: amount
  presence: required
  unit: USD
  description: 'The adjusted-notional basis: IR and credit the trade notional, FX the foreign leg, equity and commodity units times price.'
  example: 232000000.0
- name: MATURITY_DATE
  type: date
  presence: required
  example: '2038-08-04'
- name: CLEARED
  type: boolean
  presence: required
  example: false
- name: DERIVED_BY
  type: text
  presence: required
  description: upstream (the bank's capital process delivered the row) or rules (derived from the trade master by configured rules).
  example: rules
- name: PRODUCT_TYPE
  type: text
  presence: required
  example: FX_SWAP
- name: BATCH_ID
  type: id
  presence: required
  example: SB-2026-09-30-01
- name: HEDGING_SET
  type: text
  presence: required
  description: 'The trades that may offset one another: IR the currency, FX the pair, credit and equity one set, commodity energy, metals, agricultural
    or other; a basis or volatility transaction its own (CRE52.27 to CRE52.29).'
  example: CHFUSD
- name: BOUGHT_SOLD
  type: text
  presence: optional
  example: BOUGHT
  enum:
  - BOUGHT
  - SOLD
- name: OPTION_TYPE
  type: text
  presence: optional
  example: PUT
  enum:
  - CALL
  - PUT
- name: UNDERLYING_FORWARD
  type: amount
  presence: optional
  example: 0.7465
- name: STRIKE
  type: rate
  presence: optional
  example: 0.7265
- name: EXERCISE_DATE
  type: date
  presence: optional
  example: '2027-06-15'
- name: REFERENCE
  type: text
  presence: optional
  description: 'Credit and equity: the entity or index; commodity: the commodity type (ELECTRICITY has its own factor).'
  example: EQ-SLRS
- name: IS_INDEX
  type: boolean
  presence: optional
  example: false
- name: START_DATE
  type: date
  presence: optional
  example: '2026-09-30'
- name: END_DATE
  type: date
  presence: optional
  example: '2036-02-14'
- name: SHIFT
  type: amount
  presence: optional
  example: 0.01
- name: CREDIT_QUALITY
  type: text
  presence: optional
  example: IG
  enum:
  - A
  - B
  - BB
  - BBB
  - IG
  - SG
- name: ATTACHMENT
  type: amount
  presence: optional
  example: 0.03
- name: DETACHMENT
  type: amount
  presence: optional
  example: 0.07
links:
- field: TRADE_ID
  kind: trade
- field: NETTING_SET
  kind: netting-set
- field: COUNTERPARTY
  kind: counterparty
- field: LEGAL_ENTITY
  kind: legal-entity
validation:
- rule: required
  fields:
  - SACCR_ROW_ID
  - BUSINESS_DATE
  - TRADE_ID
  - SOURCE_SYSTEM
  - DRIVER
  - NETTING_SET
  - COUNTERPARTY
  - LEGAL_ENTITY
  - ASSET_CLASS
  - TRANSACTION_TYPE
  - NOTIONAL_USD
  - MATURITY_DATE
  - CLEARED
  - DERIVED_BY
  - PRODUCT_TYPE
  - BATCH_ID
  - HEDGING_SET
- rule: unique
  key:
  - SACCR_ROW_ID
  per: BUSINESS_DATE
- rule: link
  field: TRADE_ID
  kind: trade
- rule: enum
  field: SOURCE_SYSTEM
  values:
  - CALYPSO
  - ENDUR
  - MUREX
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: enum
  field: ASSET_CLASS
  values:
  - COMMODITY
  - CREDIT
  - EQUITY
  - FX
  - IR
- rule: enum
  field: TRANSACTION_TYPE
  values:
  - BASIS
  - CDO_TRANCHE
  - LINEAR
  - OPTION
  - VOLATILITY
- rule: enum
  field: DIRECTION
  values:
  - LONG
  - SHORT
- rule: enum
  field: BOUGHT_SOLD
  values:
  - BOUGHT
  - SOLD
- rule: enum
  field: OPTION_TYPE
  values:
  - CALL
  - PUT
- rule: enum
  field: CREDIT_QUALITY
  values:
  - AAA
  - AA
  - A
  - BBB
  - BB
  - B
  - CCC
  - IG
  - SG
notes: []
review: []
