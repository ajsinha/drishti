# Data contract of the sa-ccr kind (command SACCR): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap sa-ccr`; owned by people from then on: confirm the review points, then remove them.
kind: sa-ccr
mnemonic: SACCR
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: SA-CCR exposure
description: 'Regulatory EAD: replacement cost, PFE add-ons by asset class, multiplier.'
source: capital-engine
grain: One row per sa-ccr exposure per business date, keyed by CALC_ID.
key:
- CALC_ID
id-pattern:
- ^SACCR-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: credit-store
  plugin: delta
  domain: credit
  table: <root>/credit/sa-ccr/
  test-data:
  - data/testdata/counterparty-risk/sa-ccr
fields:
- name: CALC_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: SACCR-ALDERSHOT-FRA
  pattern: ^SACCR-
- name: REPLACEMENT_COST
  type: amount
  presence: required
  unit: USD
  description: The loss if the counterparty defaulted today and the trades were replaced at current market value, less collateral; never below
    zero.
  example: 0
- name: ADD_ON
  type: amount
  presence: required
  unit: USD
  description: The potential increase in exposure over the next year, built from the add-ons of each asset class with supervisory factors and
    correlations.
  example: 791562
- name: MULTIPLIER
  type: rate
  presence: required
  unit: factor
  description: A factor between 5% and 1 that reduces the add-on when the netting set is over-collateralised or its value is negative.
  example: 0.933
- name: EAD
  type: amount
  presence: required
  unit: USD
  description: 'The SA-CCR exposure: 1.4 times the replacement cost plus the potential future exposure, where the potential future exposure is
    the multiplier times the add-on.'
  example: 1033938
- name: RWA
  type: amount
  presence: required
  unit: USD
  description: The exposure at default multiplied by the risk weight of the counterparty. Capital is a percentage of it.
  example: 206788
- name: ADD_ONS
  type: record list
  presence: required
  description: 'The potential-future-exposure add-ons, one element per asset class present (Interest rate, Foreign exchange, Credit, Equity, Commodity): ASSET_CLASS and ADD_ON in USD.'
- name: HEDGING_SETS
  type: record list
  presence: required
  description: 'The hedging sets of the calculation, one element per asset class and hedging set (a currency for rates and FX): EFFECTIVE_NOTIONAL in USD and the supervisory factor SF (a fraction).'
- name: NETTING_SET
  type: id
  presence: required
  description: 'The netting set the calculation is for: a NETTING_SET_ID of the netting-set kind (NS-<counterparty>-<legal entity>).'
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
  link: netting-set
- name: ALPHA
  type: rate
  presence: required
  unit: 'factor'
  description: 'The SA-CCR alpha multiplier applied to replacement cost plus PFE (regulatory 1.4).'
  example: 1.4
nested:
  ADD_ONS[]:
  - name: ASSET_CLASS
    type: text
    presence: required
    description: 'The SA-CCR asset class: Interest rate, Foreign exchange, Credit, Equity or Commodity.'
    example: Interest rate
    enum:
    - Commodity
    - Credit
    - Equity
    - Foreign exchange
    - Interest rate
  - name: ADD_ON
    type: amount
    presence: required
    unit: 'USD'
    description: 'The asset class''s aggregate add-on (sum of its hedging sets'' effective notionals times their supervisory factors).'
    example: 791562
  HEDGING_SETS[]:
  - name: ASSET_CLASS
    type: text
    presence: required
    description: 'The regulatory asset class: interest rate, FX, credit, equity or commodity.'
    example: Interest rate
    enum:
    - Commodity
    - Credit
    - Equity
    - Foreign exchange
    - Interest rate
  - name: HEDGING_SET
    type: text
    presence: required
    description: The group of trades within an asset class that can offset one another, for example by currency for interest rates.
    example: JPY
    enum:
    - AUD
    - CAD
    - CHF
    - EUR
    - GBP
    - JPY
    - USD
  - name: EFFECTIVE_NOTIONAL
    type: amount
    presence: required
    unit: USD
    description: The hedging set's notional after supervisory delta and maturity adjustments and netting inside the set.
    example: -89605479
  - name: SF
    type: amount
    presence: required
    unit: fraction of the effective notional (0.005 is 0.5%)
    description: The supervisory factor, as a fraction, applied to the effective notional to get the add-on.
    example: 0.005
links:
- field: NETTING_SET
  kind: netting-set
validation:
- rule: required
  fields:
  - CALC_ID
  - REPLACEMENT_COST
  - ADD_ON
  - MULTIPLIER
  - EAD
  - RWA
  - ADD_ONS
  - HEDGING_SETS
  - NETTING_SET
  - ALPHA
- rule: unique
  key:
  - CALC_ID
  per: business_date
- rule: pattern
  field: CALC_ID
  pattern: ^SACCR-
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: enum
  field: ADD_ONS[].ASSET_CLASS
  values:
  - Commodity
  - Credit
  - Equity
  - Foreign exchange
  - Interest rate
- rule: enum
  field: HEDGING_SETS[].ASSET_CLASS
  values:
  - Commodity
  - Credit
  - Equity
  - Foreign exchange
  - Interest rate
- rule: enum
  field: HEDGING_SETS[].HEDGING_SET
  values:
  - AUD
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 142 documents (66 samples and 76 test-data documents (data/testdata/counterparty-risk/sa-ccr/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/sa-ccr/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'source ''capital-engine'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'EAD is a column a compute engine produces (docs/contracts/README.md section 14) on a record that keeps it: confirm whether it is computed and
  removed.'
- 'enum values inferred from the data, not from a glossary: ADD_ONS[].ASSET_CLASS, HEDGING_SETS[].ASSET_CLASS, HEDGING_SETS[].HEDGING_SET: confirm
  they are closed lists.'
- 'number types decided by the field''s name: ALPHA rate, ADD_ONS[].ADD_ON amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts ADD_ONS[].ADD_ON (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
- 'ALPHA (1.4) is a regulatory parameter: confirm it becomes a setting of the SA-CCR engine.'
