# Data contract of the exposure-path kind (command XPATH): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap exposure-path`; completed by hand (2.9.0); the measure's contract is docs/guides/EXPOSURE_GUIDE.md (section 3).
kind: exposure-path
mnemonic: XPATH
pack: counterparty-risk
version: '1.1'
class: input
status: active
title: Exposure path (a trade's MtM on every path at a grid date)
description: One trade's mark to market on every path of a simulation run at one grid date, in USD (the vector column MTM); the grain every exposure
  is netted, collateralised and counted from (EXPOSURE_GUIDE.md section 15.3).
source: 'the upstream exposure simulator (test data: tools/packgen/ccr/make_ccr_data.py)'
grain: One row per trade, grid date and run per business date, keyed by PATH_ROW_ID (<run>~<trade>~<grid index>); sparse by maturity.
key:
- PATH_ROW_ID
id-pattern:
- ^XR-[^~]+~.+~[0-9]+$
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be agreed with the simulator's owner (EXPOSURE_GUIDE.md open question 1); a bank's run often lands 04:00-07:00
storage:
  connector: exposure-store
  plugin: delta
  domain: risk
  table: <root>/risk/exposure-path/
  columns:
  - TRADE_ID
  - NETTING_SET
  - COUNTERPARTY
  - LEGAL_ENTITY
  - DESK
  - TT_BOOK
  - LIMIT_LETTER
  - ASSET_CLASS
  - PRODUCT
  - SOURCE_SYSTEM
  - MATURITY_DATE
  - NOTIONAL
  - GRID_INDEX
  - GRID_DATE
  - RUN_ID
  - BATCH_ID
  - STATUS
  vectors:
  - MTM
  test-data:
  - data/testdata/counterparty-risk/exposure-path
fields:
- name: PATH_ROW_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: XR-2026-09-30-01~CLY-3000280~0
  pattern: ^XR-[^~]+~.+~[0-9]+$
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business the run starts from (t0); the lake''s partition.'
  example: '2026-09-30'
- name: RUN_ID
  type: id
  presence: required
  description: 'The simulation run the row belongs to: a RUN_ID of the simulation-run kind (XR-<date>-<nn>), the same on every row of the run.'
  example: XR-2026-09-30-01
  pattern: ^XR-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$
  link: simulation-run
- name: TRADE_ID
  type: id
  presence: required
  description: 'The trade valued on the paths: a TRADE_ID of the trading pack''s trade kind (ENDUR digits, CLY-…, MX-…), as text.'
  example: CLY-3000280
  pattern: ^((MX|CLY)-)?\d+$
  link: trade
- name: SOURCE_SYSTEM
  type: text
  presence: required
  description: 'The trade''s booking system: ENDUR, CALYPSO or MUREX.'
  example: CALYPSO
  enum:
  - CALYPSO
  - ENDUR
  - MUREX
- name: NETTING_SET
  type: id
  presence: required
  description: The netting set the trade belongs to (its membership wins when they differ).
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
  link: netting-set
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The trade''s counterparty, denormalised from its netting set: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'The bank''s legal entity that booked the trade: an ENTITY_ID of the core pack''s legal-entity kind (LE-…).'
  example: LE-FRA
  pattern: ^LE-
  link: legal-entity
- name: DESK
  type: id
  presence: required
  description: 'The desk the trade is booked on: a DESK_ID of the core pack''s desk kind (DESK-…).'
  example: DESK-SFT
  pattern: ^DESK-
  link: desk
- name: TT_BOOK
  type: id
  presence: required
  description: 'The book the trade is booked in: a BOOK_ID of the core pack''s book kind (BOOK-…).'
  example: BOOK-SFT-1
  pattern: ^BOOK-
  link: book
- name: LIMIT_LETTER
  type: text
  presence: optional
  description: 'The trade''s limit letter (2.9.5), as its VaR records carry it: the level column of the hierarchy LL (LIMIT_LETTER > DESK,
    VAR_GUIDE.md section 16). When a hierarchy is built from it, every row carries it (a row that leaves it empty is refused, DRS-5211; a table
    without the column skips that hierarchy alone, with a DRS-5211 warning).'
  example: LL-0003
- name: ASSET_CLASS
  type: text
  presence: required
  description: 'The trade''s asset class, denormalised from the netting set''s member row (used by the asset scope).'
  example: Securities financing
  enum:
  - Commodity
  - Credit
  - Equity
  - FX
  - Fixed income
  - Inflation
  - Money market
  - Rates
  - Securities financing
  - Structured
- name: PRODUCT
  type: text
  presence: required
  description: 'The trade''s product name, denormalised from the netting set''s member row (e.g. Basis swap (float/float)).'
  example: Tri-party repo
- name: NOTIONAL
  type: amount
  presence: required
  unit: 'trade currency'
  description: 'The trade''s notional as its netting set lists it, in the trade''s currency; denormalised for people and checks.'
  example: 237000000.0
- name: MATURITY_DATE
  type: date
  presence: required
  description: 'The trade''s maturity: after it plus 10 business days a missing grid row means the trade is worth 0.'
  example: '2027-02-15'
- name: GRID_INDEX
  type: integer
  presence: required
  description: The position of the date in the run's grid.
  example: 0
- name: GRID_DATE
  type: date
  presence: required
  description: The future date the values are for.
  example: '2026-10-07'
- name: MTM
  type: vector
  presence: required
  unit: USD
  description: The trade's mark to market on each simulated path at the grid date, from the bank's side.
  note: 200 values in the test data
- name: STATUS
  type: text
  presence: required
  description: ok, proxied (an approximate model) or failed (no values).
  example: ok
- name: PRICER
  type: text
  presence: required
  description: 'The pricer the simulator valued the trade with (testgen-factor-walk in the test data).'
  example: testgen-factor-walk
- name: BATCH_ID
  type: id
  presence: required
  description: 'The run''s batch: equal to the simulation-run''s BATCH_ID.'
  example: XB-2026-09-30-01
links:
- field: RUN_ID
  kind: simulation-run
- field: TRADE_ID
  kind: trade
- field: NETTING_SET
  kind: netting-set
- field: COUNTERPARTY
  kind: counterparty
- field: LEGAL_ENTITY
  kind: legal-entity
- field: DESK
  kind: desk
- field: TT_BOOK
  kind: book
validation:
- rule: required
  fields:
  - PATH_ROW_ID
  - BUSINESS_DATE
  - RUN_ID
  - TRADE_ID
  - SOURCE_SYSTEM
  - NETTING_SET
  - COUNTERPARTY
  - LEGAL_ENTITY
  - DESK
  - TT_BOOK
  - ASSET_CLASS
  - PRODUCT
  - NOTIONAL
  - MATURITY_DATE
  - GRID_INDEX
  - GRID_DATE
  - MTM
  - STATUS
  - PRICER
  - BATCH_ID
- rule: unique
  key:
  - PATH_ROW_ID
  per: BUSINESS_DATE
- rule: pattern
  field: PATH_ROW_ID
  pattern: ^XR-[^~]+~.+~[0-9]+$
- rule: link
  field: RUN_ID
  kind: simulation-run
- rule: link
  field: TRADE_ID
  kind: trade
- rule: enum
  field: SOURCE_SYSTEM
  values:
  - CALYPSO
  - ENDUR
  - MUREX
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: TT_BOOK
  kind: book
- rule: enum
  field: ASSET_CLASS
  values:
  - Commodity
  - Credit
  - Equity
  - FX
  - Fixed income
  - Inflation
  - Money market
  - Rates
  - Securities financing
  - Structured
- rule: vector-length
  field: MTM
  same: every row of one business date
notes:
- One trade's MtM on every path of the run at one grid date (EXPOSURE_GUIDE.md section 15.3), the vector column MTM; sparse by maturity (no row after maturity
  plus 10 business days). DESK, TT_BOOK, ASSET_CLASS, PRODUCT, NOTIONAL and MATURITY_DATE are denormalised for the scopes and checks (as built,
  2.9.0).
- '1.1: SOURCE_SYSTEM and ASSET_CLASS list every value of the test data (ENDUR trades have paths too).'
review:
- 'required inferred from 100% coverage in 2001 documents (1 samples and 2000 test-data documents (data/testdata/counterparty-risk/exposure-path/cob-2026-09-30.part-001.jsonl.gz,
  data/testdata/counterparty-risk/exposure-path/cob-2026-09-30.part-002.jsonl.gz)): confirm each required field is mandatory upstream, and each
  optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: SOURCE_SYSTEM, ASSET_CLASS: confirm they are closed lists.'
- 'number types decided by the field''s name: NOTIONAL amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts NOTIONAL (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
