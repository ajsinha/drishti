# Data contract of the netting-set kind (command NSET): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap netting-set`; owned by people from then on: confirm the review points, then remove them.
kind: netting-set
mnemonic: NSET
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: Netting set
description: Trades that net on close-out under one agreement and CSA, with exposure and collateral.
source: xva-engine
grain: One row per netting set per business date, keyed by NETTING_SET_ID.
key:
- NETTING_SET_ID
id-pattern:
- ^NS-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: credit-store
  plugin: delta
  domain: credit
  table: <root>/credit/netting-set/
  test-data:
  - data/testdata/counterparty-risk/netting-set
fields:
- name: NETTING_SET_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
- name: TRADE_COUNT
  type: integer
  presence: required
  description: The number of trades that are netted together under the agreement.
  example: 3
- name: NET_MTM
  type: amount
  presence: required
  unit: USD
  description: The sum of the members' mark to market, positive and negative together. Netting lets a loss on one trade cancel a gain on another
    if the counterparty defaults.
  example: -339550
- name: COLLATERAL
  type: amount
  presence: required
  unit: USD
  description: 'The net collateral against the netting set after haircut: what is held less what has been posted, each holding at its
    collateral value (market value less the CSA haircut; 2.9.6, F3). Equal to the collateral balance''s NET.'
  example: -229552
- name: LIMIT
  type: amount
  presence: required
  unit: USD
  description: The limit on the counterparty's peak potential future exposure approved for this netting set.
  example: 5000000.0
- name: CVA
  type: amount
  presence: required
  unit: USD
  description: The reduction in the value of the trades for the risk that the counterparty defaults before they mature.
  example: -7
- name: TRADES
  type: record list
  presence: required
  description: The netting set's member trades, one element per trade with its status, product, asset class, currency, book, notional and MtM; empty when the set has no live trade on the date.
- name: BY_ASSET
  type: record list
  presence: required
  description: 'The set''s MtM by asset class, one element per class present: ASSET and MTM in USD.'
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The counterparty of the netting set: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
- name: AGREEMENT
  type: id
  presence: required
  description: 'The master agreement whose close-out netting defines the set: an AGREEMENT_ID of the agreement kind (AGR-…).'
  example: AGR-ALDERSHOT-ISDA
  pattern: ^AGR-
  link: agreement
- name: CSA
  type: id
  presence: required
  description: 'The CSA margining the set: a CSA_ID of the csa kind (CSA-…), one per agreement and bank legal entity (2.9.6, decision 9);
    absent for an unmargined set.'
  example: CSA-ALDERSHOT-FRA
  pattern: ^CSA-
  link: csa
- name: CREDIT_LIMIT
  type: id
  presence: required
  description: 'The counterparty''s credit limit: a LIMIT_ID of the credit-limit kind (LIM-…).'
  example: LIM-ALDERSHOT
  pattern: ^LIM-
  link: credit-limit
- name: CVA_RESULT
  type: id
  presence: required
  description: 'The set''s valuation adjustments: a RESULT_ID of the cva kind (CVA-<counterparty>-<legal entity>).'
  example: CVA-ALDERSHOT-FRA
  pattern: ^CVA-
  link: cva
- name: SACCR
  type: id
  presence: required
  description: 'The set''s SA-CCR exposure calculation: a CALC_ID of the sa-ccr kind (SACCR-…).'
  example: SACCR-ALDERSHOT-FRA
  pattern: ^SACCR-
  link: sa-ccr
- name: SIMM
  type: id
  presence: required
  description: 'The counterparty''s SIMM initial-margin calculation: a CALC_ID of the simm kind (SIMM-…).'
  example: SIMM-ALDERSHOT
  pattern: ^SIMM-
  link: simm
- name: COLLATERAL_BALANCE
  type: id
  presence: required
  description: 'The set''s collateral balance: a BALANCE_ID of the collateral-balance kind (COLL-…).'
  example: COLL-ALDERSHOT-FRA
  pattern: ^COLL-
  link: collateral-balance
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'The bank''s legal entity on the bank''s side of the set: an ENTITY_ID of the core pack''s legal-entity kind (LE-…).'
  example: LE-FRA
  pattern: ^LE-
  link: legal-entity
- name: NETTING_ENFORCEABLE
  type: boolean
  presence: required
  description: 'true when a legal opinion confirms close-out netting is enforceable for the set; false treats the trades gross.'
  example: true
- name: TRADE_IDS
  type: id list
  presence: optional
  description: The member trades' ids, the same trades as TRADES[].TRADE_ID, as text (ENDUR digits, CLY-…, MX-…); empty when the set has no live trade on the date.
  link: trade
nested:
  TRADES[]:
  - name: TRADE_ID
    type: id
    presence: required
    description: 'The member trade: a TRADE_ID of the trading pack''s trade kind, as text.'
    example: CLY-3000280
    pattern: ^((MX|CLY)-)?\d+$
    link: trade
  - name: STATUS
    type: text
    presence: required
    description: 'The member trade''s status on the date: NEW, VALIDATED or AMENDED as booked, or LIVE.'
    example: LIVE
  - name: PRODUCT
    type: text
    presence: required
    description: The kind of instrument the trade is.
    example: Tri-party repo
  - name: ASSET_CLASS
    type: text
    presence: required
    description: 'The member trade''s asset class.'
    example: Securities financing
  - name: CURRENCY
    type: text
    presence: required
    description: 'The member trade''s currency, ISO 4217.'
    example: JPY
    enum:
    - AUD
    - CAD
    - CHF
    - EUR
    - GBP
    - JPY
    - USD
  - name: BOOK
    type: id
    presence: required
    description: 'The book the member trade sits in: a BOOK_ID of the core pack''s book kind (BOOK-…).'
    example: BOOK-SFT-1
    pattern: ^BOOK-
    link: book
  - name: NOTIONAL
    type: amount
    presence: required
    unit: trade currency
    description: The reference amount of the trade, in the trade's own currency.
    example: 237000000.0
  - name: MATURITY
    type: date
    presence: required
    description: The date the trade ends.
    example: '2027-02-15'
  - name: MATURITY_BUCKET
    type: text
    presence: required
    description: 'The remaining maturity bucket of the trade: 0-1Y, 1-2Y, 2-5Y, 5-10Y or 10Y+.'
    example: 0-1Y
    enum:
    - 0-1Y
    - 1-2Y
    - 10Y+
    - 2-5Y
    - 5-10Y
  - name: MTM
    type: amount
    presence: required
    unit: USD
    description: The trade's current value, from the bank's side.
    example: -708216
  BY_ASSET[]:
  - name: ASSET
    type: text
    presence: required
    description: 'An asset class of the set''s trades.'
    example: Securities financing
  - name: MTM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The net mark to market of the set''s trades in that asset class, from the bank''s side.'
    example: -339550
links:
- field: COUNTERPARTY
  kind: counterparty
- field: AGREEMENT
  kind: agreement
- field: CSA
  kind: csa
- field: CREDIT_LIMIT
  kind: credit-limit
- field: CVA_RESULT
  kind: cva
- field: SACCR
  kind: sa-ccr
- field: SIMM
  kind: simm
- field: COLLATERAL_BALANCE
  kind: collateral-balance
- field: LEGAL_ENTITY
  kind: legal-entity
- field: TRADE_IDS
  kind: trade
- field: TRADES[].TRADE_ID
  kind: trade
- field: TRADES[].BOOK
  kind: book
validation:
- rule: required
  fields:
  - NETTING_SET_ID
  - TRADE_COUNT
  - NET_MTM
  - COLLATERAL
  - LIMIT
  - CVA
  - TRADES
  - BY_ASSET
  - COUNTERPARTY
  - AGREEMENT
  - CSA
  - CREDIT_LIMIT
  - CVA_RESULT
  - SACCR
  - SIMM
  - COLLATERAL_BALANCE
  - LEGAL_ENTITY
  - NETTING_ENFORCEABLE
- rule: unique
  key:
  - NETTING_SET_ID
  per: business_date
- rule: pattern
  field: NETTING_SET_ID
  pattern: ^NS-
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: AGREEMENT
  kind: agreement
- rule: link
  field: CSA
  kind: csa
- rule: link
  field: CREDIT_LIMIT
  kind: credit-limit
- rule: link
  field: CVA_RESULT
  kind: cva
- rule: link
  field: SACCR
  kind: sa-ccr
- rule: link
  field: SIMM
  kind: simm
- rule: link
  field: COLLATERAL_BALANCE
  kind: collateral-balance
- rule: link
