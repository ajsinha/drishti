# Data contract of the collateral-balance kind (command COLL): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap collateral-balance`; owned by people from then on: confirm the review points, then remove them.
kind: collateral-balance
mnemonic: COLL
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: Collateral balance
description: Collateral held and posted under a CSA, by asset, after haircuts.
source: collateral-system
grain: One row per collateral balance per business date, keyed by BALANCE_ID.
key:
- BALANCE_ID
id-pattern:
- ^COLL-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: collateral-store
  plugin: delta
  domain: collateral
  table: <root>/collateral/collateral-balance/
  test-data:
  - data/testdata/counterparty-risk/collateral-balance
fields:
- name: BALANCE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: COLL-ALDERSHOT-FRA
  pattern: ^COLL-
- name: HELD
  type: amount
  presence: required
  unit: USD
  description: 'The collateral the bank has received from the counterparty, after haircut: the sum of its Held positions'' VALUE
    (market value less the CSA haircut; 2.9.6, F3).'
  example: 0
- name: POSTED
  type: amount
  presence: required
  unit: USD
  description: 'The collateral the bank has delivered to the counterparty, after haircut: the sum of its Posted positions'' VALUE
    (2.9.6, F3).'
  example: 228402
- name: NET
  type: amount
  presence: required
  unit: USD
  description: 'HELD minus POSTED after haircuts: positive when the bank holds more collateral than it has posted, negative when it has posted more.'
  example: -228402
- name: AS_OF
  type: date
  presence: required
  description: 'The date the balance is valued on: the business date of the file.'
  example: '2026-09-30'
- name: POSITIONS
  type: record list
  presence: required
  description: The collateral assets behind the balance, one element per asset held or posted, with its market value, haircut and value after the haircut.
- name: CSA
  type: id
  presence: required
  description: 'The CSA the collateral is exchanged under: a CSA_ID of the csa kind (CSA-…).'
  example: CSA-ALDERSHOT-FRA
  pattern: ^CSA-
  link: csa
- name: NETTING_SET
  type: id
  presence: required
  description: 'The netting set the collateral secures: a NETTING_SET_ID of the netting-set kind (NS-<counterparty>-<legal entity>).'
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
  link: netting-set
nested:
  POSITIONS[]:
  - name: ASSET
    type: text
    presence: required
    description: The cash or security that is held or posted.
    example: Solaris Energy Corp. 2031
  - name: DIRECTION
    type: text
    presence: required
    description: Whether the bank posted the asset or received it.
    example: Posted
    enum:
    - Posted
    - Received
    - Held
  - name: MARKET_VALUE
    type: amount
    presence: required
    unit: USD
    description: The current market value of the asset before the haircut.
    example: 76517
  - name: HAIRCUT
    type: rate
    presence: required
    unit: fraction of the market value (0.005 is 0.5%)
    description: The share taken off the market value to allow for the price moving before the asset can be sold. The CSA sets it by asset
      type and maturity.
    example: 0.005
  - name: VALUE
    type: amount
    presence: required
    unit: USD
    description: The market value after the haircut, the amount that counts as collateral.
    example: 76134
links:
- field: CSA
  kind: csa
- field: NETTING_SET
  kind: netting-set
validation:
- rule: required
  fields:
  - BALANCE_ID
  - HELD
  - POSTED
  - NET
  - AS_OF
  - POSITIONS
  - CSA
  - NETTING_SET
- rule: unique
  key:
  - BALANCE_ID
  per: business_date
- rule: pattern
  field: BALANCE_ID
  pattern: ^COLL-
- rule: link
  field: CSA
  kind: csa
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: enum
  field: POSITIONS[].DIRECTION
  values:
  - Posted
  - Received
  - Held
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 218 documents (66 samples and 152 test-data documents (data/testdata/counterparty-risk/collateral-balance/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/collateral-balance/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each
  optional one may be empty.'
- 'source ''collateral-system'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'POSITIONS[].DIRECTION: the data holds Held, which the glossary''s values (Posted, Received) do not describe: correct the data or the glossary.'
- 'POSITIONS[].HAIRCUT is a CSA term: confirm it is kept on the holding or read from the CSA.'
