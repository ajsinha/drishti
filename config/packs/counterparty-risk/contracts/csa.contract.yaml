# Data contract of the csa kind (command CSA): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap csa`; owned by people from then on: confirm the review points, then remove them.
kind: csa
mnemonic: CSA
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: Credit support annex
description: 'Collateral terms: thresholds, minimum transfer, eligible collateral and haircuts.'
source: legal-docs
grain: One row per credit support annex per business date, keyed by CSA_ID.
key:
- CSA_ID
id-pattern:
- ^CSA-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: legal-store
  plugin: delta
  domain: legal
  table: <root>/legal/csa/
  test-data:
  - data/testdata/counterparty-risk/csa
fields:
- name: CSA_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: CSA-ALDERSHOT
  pattern: ^CSA-
- name: MARGIN_TYPE
  type: text
  presence: required
  description: Variation margin (VM) covers today's value; initial margin (IM) covers how it may move before a default is closed out.
  example: VM
  enum:
  - VM
  - VM + IM
- name: THRESHOLD_US
  type: amount
  presence: required
  unit: USD
  description: The exposure the counterparty may have to the bank before the bank must post collateral.
  example: 10000000.0
- name: THRESHOLD_THEM
  type: amount
  presence: required
  unit: USD
  description: The exposure the bank accepts before the counterparty must post collateral.
  example: 10000000.0
- name: MTA
  type: integer
  presence: required
  unit: USD
  description: The smallest collateral movement either side may call.
  example: 500000
- name: INDEPENDENT_AMOUNT
  type: amount
  presence: required
  unit: USD
  description: Collateral posted up front, whatever the exposure.
  example: 0
- name: FREQUENCY
  type: text
  presence: required
  description: How often margin is called.
  example: Daily
- name: MPOR
  type: text
  presence: required
  description: The time assumed between the last margin received and closing out a defaulted counterparty.
  example: 10 business days
- name: ELIGIBLE
  type: record list
  presence: required
  description: 'The collateral the CSA accepts, one element per asset class: ASSET (text) and its HAIRCUT (a fraction).'
- name: AGREEMENT
  type: id
  presence: required
  description: 'The master agreement the CSA belongs to: an AGREEMENT_ID of the agreement kind (AGR-…).'
  example: AGR-ALDERSHOT-ISDA
  pattern: ^AGR-
  link: agreement
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The counterparty of the CSA: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
- name: NETTING_SETS
  type: id list
  presence: required
  description: 'The netting sets margined under the CSA: NETTING_SET_IDs of the netting-set kind (NS-<counterparty>-<legal entity>).'
  link: netting-set
- name: COLLATERAL_BALANCES
  type: id list
  presence: required
  description: 'The collateral balances held or posted under the CSA, one per netting set: BALANCE_IDs of the collateral-balance kind (COLL-…).'
  link: collateral-balance
nested:
  ELIGIBLE[]:
  - name: ASSET
    type: text
    presence: required
    description: An asset the counterparty may deliver as collateral.
    example: USD, EUR, GBP cash
    enum:
    - G7 government bonds 1-5Y
    - G7 government bonds 5-10Y
    - G7 government bonds < 1Y
    - USD, EUR, GBP cash
  - name: HAIRCUT
    type: rate
    presence: required
    description: The share taken off the asset's value when it is counted as collateral.
    example: 0.0
links:
- field: AGREEMENT
  kind: agreement
- field: COUNTERPARTY
  kind: counterparty
- field: NETTING_SETS
  kind: netting-set
- field: COLLATERAL_BALANCES
  kind: collateral-balance
validation:
- rule: required
  fields:
  - CSA_ID
  - MARGIN_TYPE
  - THRESHOLD_US
  - THRESHOLD_THEM
  - MTA
  - INDEPENDENT_AMOUNT
  - FREQUENCY
  - MPOR
  - ELIGIBLE
  - AGREEMENT
  - COUNTERPARTY
  - NETTING_SETS
  - COLLATERAL_BALANCES
- rule: unique
  key:
  - CSA_ID
  per: business_date
- rule: pattern
  field: CSA_ID
  pattern: ^CSA-
- rule: enum
  field: MARGIN_TYPE
  values:
  - VM
  - VM + IM
- rule: link
  field: AGREEMENT
  kind: agreement
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: NETTING_SETS
  kind: netting-set
- rule: link
  field: COLLATERAL_BALANCES
  kind: collateral-balance
- rule: enum
  field: ELIGIBLE[].ASSET
  values:
  - G7 government bonds 1-5Y
  - G7 government bonds 5-10Y
  - G7 government bonds < 1Y
  - USD, EUR, GBP cash
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 42 documents (18 samples and 24 test-data documents (data/testdata/counterparty-risk/csa/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/csa/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'source ''legal-docs'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: MARGIN_TYPE, ELIGIBLE[].ASSET: confirm they are closed lists.'
- 'number types decided by the field''s name: ELIGIBLE[].HAIRCUT rate: confirm amount, rate or integer.'
