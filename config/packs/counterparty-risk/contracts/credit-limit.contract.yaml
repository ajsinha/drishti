# Data contract of the credit-limit kind (command LIM): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap credit-limit`; owned by people from then on: confirm the review points, then remove them.
kind: credit-limit
mnemonic: LIM
pack: counterparty-risk
version: '1.0'
class: fundamental
status: active
title: Credit limit
description: PFE limit by tenor bucket for a counterparty, with utilisation.
source: limits-system
grain: One row per credit limit per business date, keyed by LIMIT_ID.
key:
- LIMIT_ID
id-pattern:
- ^LIM-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: credit-store
  plugin: delta
  domain: credit
  table: <root>/credit/credit-limit/
  test-data:
  - data/testdata/counterparty-risk/credit-limit
fields:
- name: LIMIT_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: LIM-ALDERSHOT
  pattern: ^LIM-
- name: COUNTERPARTY_NAME
  type: text
  presence: required
  description: The legal entity the limit applies to.
  example: Aldershot Pension Trust
- name: MEASURE
  type: text
  presence: required
  description: The exposure measure the limit is set on, for example the peak of the 95th-percentile potential future exposure.
  example: PFE 95 peak
- name: LIMIT
  type: amount
  presence: required
  unit: USD
  description: The most exposure the bank accepts to the counterparty on this measure.
  example: 337000000.0
- name: USED
  type: amount
  presence: required
  unit: USD
  description: The exposure measured today against the limit.
  example: 224800213
- name: UTILISATION
  type: rate
  presence: required
  unit: fraction of the limit (0.6671 is 66.71%)
  description: 'The share of the limit that is used: USED divided by LIMIT, as a fraction. Above 1 is a breach.'
  example: 0.6671
- name: STATUS
  type: text
  presence: required
  description: 'The limit''s state from UTILISATION: Within limit below 80% used, Early warning from 80% to 100%, Breach above 100%.'
  example: Within limit
  enum:
  - Early warning
  - Within limit
- name: BUCKETS
  type: record list
  presence: required
  description: 'The limit and its use by maturity bucket, one element per bucket (0-1Y, 1-3Y, 3-5Y, 5-10Y, 10Y+): LIMIT, USED and UTILISATION.'
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The counterparty the limit is set for: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-ALDERSHOT
  pattern: ^CP-
  link: counterparty
- name: APPROVED_BY
  type: text
  presence: required
  description: 'The committee or officer that approved the limit.'
  example: Credit Risk Committee
- name: REVIEW_DUE
  type: date
  presence: required
  description: 'The date the limit is next due for credit review (YYYY-MM-DD).'
  example: '2027-03-19'
nested:
  BUCKETS[]:
  - name: BUCKET
    type: text
    presence: required
    description: The range of years to maturity the limit is split into; exposure on trades that mature within it is counted against it.
    example: 0-1Y
    enum:
    - 0-1Y
    - 1-3Y
    - 10Y+
    - 3-5Y
    - 5-10Y
  - name: LIMIT
    type: amount
    presence: required
    unit: USD
    description: The limit that applies to this tenor bucket.
    example: 337000000
  - name: USED
    type: amount
    presence: required
    unit: USD
    description: The exposure in this tenor bucket.
    example: 191080181
  - name: UTILISATION
    type: rate
    presence: required
    unit: fraction of the limit (0.567 is 56.7%)
    description: 'The share of the bucket''s limit that is used: USED divided by LIMIT, as a fraction. Above 1 is a breach.'
    example: 0.567
links:
- field: COUNTERPARTY
  kind: counterparty
validation:
- rule: required
  fields:
  - LIMIT_ID
  - COUNTERPARTY_NAME
  - MEASURE
  - LIMIT
  - USED
  - UTILISATION
  - STATUS
  - BUCKETS
  - COUNTERPARTY
  - APPROVED_BY
  - REVIEW_DUE
- rule: unique
  key:
  - LIMIT_ID
  per: business_date
- rule: pattern
  field: LIMIT_ID
  pattern: ^LIM-
- rule: enum
  field: STATUS
  values:
  - Early warning
  - Within limit
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: enum
  field: BUCKETS[].BUCKET
  values:
  - 0-1Y
  - 1-3Y
  - 10Y+
  - 3-5Y
  - 5-10Y
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 66 documents (18 samples and 48 test-data documents (data/testdata/counterparty-risk/credit-limit/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/credit-limit/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'source ''limits-system'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: STATUS, BUCKETS[].BUCKET: confirm they are closed lists.'
- 'STATUS (Within limit, ...) follows from UTILISATION: confirm it is computed, not set by the limits system.'
