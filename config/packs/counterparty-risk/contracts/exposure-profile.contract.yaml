# Data contract of the exposure-profile kind (command EXP): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap exposure-profile`; owned by people from then on: confirm the review points, then remove them.
kind: exposure-profile
mnemonic: EXP
pack: counterparty-risk
version: '1.0'
class: computed
status: retiring
retiring-in: 2.10.0
replaced-by: docs/contracts/EXP.md
title: Exposure profile
description: Simulated EE, EPE, ENE and PFE by time bucket for a netting set.
source: xva-engine
grain: One row per exposure profile per business date, keyed by PROFILE_ID.
key:
- PROFILE_ID
id-pattern:
- ^EXP-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: credit-store
  plugin: delta
  domain: credit
  table: <root>/credit/exposure-profile/
  test-data:
  - data/testdata/counterparty-risk/exposure-profile
fields:
- name: PROFILE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: EXP-ALDERSHOT-FRA
  pattern: ^EXP-
- name: EPE
  type: amount
  presence: derived
  unit: USD
  description: The average of the expected exposure over the life of the trades (or the first year); it is the exposure the CVA and the internal-model
    capital are built on.
  example: 26290
  note: computed by the exposure engine (EXP); removed when retired
- name: EEPE
  type: amount
  presence: derived
  unit: USD
  description: The average over the first year of the effective expected exposure, which cannot fall from one date to the next. It is the exposure
    used for the internal-model capital.
  example: 141750
  note: computed by the exposure engine (EXP); removed when retired
- name: PFE_PEAK
  type: amount
  presence: derived
  unit: USD
  description: The highest value of the 95th-percentile exposure over the life of the trades.
  example: 347288
  note: computed by the exposure engine (EXP); removed when retired
- name: PATHS
  type: integer
  presence: required
  description: The number of Monte Carlo scenarios of the market that were simulated. More paths means a smoother tail.
  example: 5000
- name: RUN_DATE
  type: date
  presence: required
  description: The date of the market data the simulation started from.
  example: '2026-09-30'
- name: BUCKETS
  type: record list
  presence: derived
  description: 'Nested: see nested BUCKETS[]'
  note: computed by the exposure engine (EXP); removed when retired
- name: NETTING_SET
  type: id
  presence: required
  description: 'Netting set: the netting-set it refers to'
  example: NS-ALDERSHOT-FRA
  pattern: ^NS-
  link: netting-set
- name: MODEL
  type: text
  presence: required
  example: Hull-White 1F rates, GBM FX and equity, 5,000 paths
- name: CONFIDENCE
  type: rate
  presence: required
  example: 0.95
nested:
  BUCKETS[]:
  - name: TENOR
    type: text
    presence: required
    description: The point in time, counted from the run date, the exposure is measured at.
    example: '0'
  - name: EE
    type: amount
    presence: required
    unit: USD
    description: The average, over the scenarios, of the netting set's value at this date, counting only positive values (what the bank would
      lose).
    example: 39314
  - name: ENE
    type: amount
    presence: required
    unit: USD
    description: The average of the netting set's value at this date counting only negative values, what the bank would owe. It is the basis of
      the debit valuation adjustment.
    example: -139484
  - name: PFE_95
    type: amount
    presence: required
    unit: USD
    description: The exposure that is exceeded on 5 of 100 scenarios at this date.
    example: 121929
  - name: PFE_99
    type: amount
    presence: required
    unit: USD
    description: The exposure that is exceeded on 1 of 100 scenarios at this date.
    example: 163624
links:
- field: NETTING_SET
  kind: netting-set
validation:
- rule: required
  fields:
  - PROFILE_ID
  - PATHS
  - RUN_DATE
  - NETTING_SET
  - MODEL
  - CONFIDENCE
- rule: unique
  key:
  - PROFILE_ID
  per: business_date
- rule: pattern
  field: PROFILE_ID
  pattern: ^EXP-
- rule: link
  field: NETTING_SET
  kind: netting-set
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'Retiring in 2.10.0: the stored kind is removed and computed instead by the exposure engine (EXP) (docs/contracts/EXP.md); old ids and links
  open the computed page.'
review:
- 'required inferred from 100% coverage in 218 documents (66 samples and 152 test-data documents (data/testdata/counterparty-risk/exposure-profile/snapshot-2026-07-08.jsonl.gz,
  data/testdata/counterparty-risk/exposure-profile/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each
  optional one may be empty.'
- 'source ''xva-engine'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'number types decided by the field''s name: CONFIDENCE rate: confirm amount, rate or integer.'
- 'no description in about.yaml or the Sutras for MODEL, CONFIDENCE: write them in the pack''s config/about.yaml glossary.'
- 'PATHS, MODEL and CONFIDENCE describe the simulation run: confirm they move to the exposure-path input''s run metadata (EXP.md).'
