# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: netting-set
version: 1
description: "Trades that net on close-out under one agreement and CSA, with exposure and collateral."
doc:
  summary: "Trades that net on close-out under one agreement and CSA, with exposure and collateral."
  description: >-
    Trades that net on close-out under one agreement and CSA, with exposure and collateral. One page per netting set, its
    panels: exposure profile (computed from the paths, USD); how the exposure was computed; member trades; net MTM by asset
    class; computed from the trade valuations, beside the stored figures; net MTM by product group (computed); live-status
    trades past their maturity date (data quality: in no total); how the view was built; the entities it links to. The strip
    gives Trades, Net MTM, Collateral (+ held, − posted), EPE (engine), PFE 95 peak (engine), Limit and CVA. Linked entities:
    counterparty (counterparty), agreement (agreement), CSA (csa), credit limit (credit-limit), CVA (cva), SA-CCR (sa-ccr), SIMM
    (simm) and collateral (collateral-balance).
  params:
    asset: { type: text, default: '', meaning: "The Asset class control" }
    product: { type: text, default: '', meaning: "The Product control" }
    minNotional: { type: text, default: '', meaning: "The Notional at least control" }
    status: { type: text, default: '', meaning: "The Status control" }
  emits: []
  expects: []
  examples:
    - "/v/netting-set/NS-ALDERSHOT-FRA"
    - "NSET NS-ALDERSHOT-FRA"
  since: "2.7.0"
match: { kind: netting-set, priority: 10 }
title: { pill: Exposure and capital · Netting set, id: $.NETTING_SET_ID }
strip:
  - { label: Trades, bind: $.TRADE_COUNT }
  - { label: Net MTM, bind: $.NET_MTM, fmt: signed0, tone: sign }
  - { label: "Collateral (+ held, − posted)", bind: $.COLLATERAL, fmt: signed0 }
  - { label: EPE (engine), bind: $.EXPOSURE_ENGINE.EPE, fmt: compact }
  - { label: PFE 95 peak (engine), bind: $.EXPOSURE_ENGINE.PEAK_PFE, fmt: compact, emphasis: true }
  - { label: Limit, bind: $.LIMIT, fmt: compact }
  - { label: CVA, bind: $.CVA, fmt: signed0, tone: sign }
controls:
  - { id: asset, kind: dropdown, label: Asset class, options: "$.BY_ASSET[*].ASSET", placement: header, panel: trades }
  - { id: product, kind: multi-select, label: Product, options: "$.TRADES[*].PRODUCT", placement: header, panel: trades }
  - { id: minNotional, kind: slider, label: Notional at least, min: 0, max: "max($.TRADES[*].NOTIONAL)", step: 1000000, placement: header, panel: trades }
  - { id: status, kind: multi-select, label: Status, options: "$.TRADES[*].STATUS", default: all, placement: header, panel: trades }
panels:
  - id: exposure
    kind: area
    title: "Exposure profile (computed from the paths, USD)"
    code: EXP
    key: F2
    rows: $.EXPOSURE_ENGINE.PROFILE
    x: TENOR
    limit: $.LIMIT
    series:
      - { label: Expected exposure, value: EE, tone: link }
      - { label: PFE 95, value: PFE, tone: accent }
      - { label: PFE 99, value: PFE_99, tone: neg }
  - id: exposureEngine
    kind: kv
    title: How the exposure was computed
    area: right
    columns:
      - { label: Status, bind: $.EXPOSURE_ENGINE.STATUS, tone: status }
      - { label: Business date, bind: $.EXPOSURE_ENGINE.BUSINESS_DATE, fmt: date }
      - { label: Run, bind: $.EXPOSURE_ENGINE.RUN_ID }
      - { label: Paths, bind: $.EXPOSURE_ENGINE.PATHS, fmt: amount0 }
      - { label: Current exposure, bind: $.EXPOSURE_ENGINE.CE, fmt: compact }
      - { label: EEPE, bind: $.EXPOSURE_ENGINE.EEPE, fmt: compact }
      - { label: Peak PFE date, bind: $.EXPOSURE_ENGINE.PEAK_PFE_DATE, fmt: date }
      - { label: Note, bind: $.EXPOSURE_ENGINE.NOTE }
  - id: trades
    kind: table
    title: "Member trades (${size($.TRADES)} of ${$.TRADE_COUNT})${ctl.asset ? ' · ' + ctl.asset : ''}"
    code: TRD
    key: F3
    rows: $.TRADES
    where: "(ctl.asset == '' || @.ASSET_CLASS == ctl.asset) && oneOf(@.PRODUCT, ctl.product) && oneOf(@.STATUS, ctl.status) && (ctl.minNotional == '' || @.NOTIONAL >= ctl.minNotional)"
    pivot:
      fields: [PRODUCT, ASSET_CLASS, CURRENCY, BOOK, MATURITY_BUCKET, { field: MATURITY, label: Maturity date }, { field: NOTIONAL, fmt: compact }, { field: MTM, label: MTM (USD), fmt: signed0 }, TRADE_ID]
      rows: [PRODUCT]
      columns: [MATURITY_BUCKET]
      values: [{ field: NOTIONAL, agg: sum }]
      filters: [CURRENCY, ASSET_CLASS]
    columns:
      - { label: Trade, bind: "@.TRADE_ID" }
      - { label: Status, bind: "@.STATUS", tone: status }
      - { label: Product, bind: "@.PRODUCT" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: compact }
      - { label: Maturity, bind: "@.MATURITY", fmt: date }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - id: byAsset
    kind: hbar
    title: Net MTM by asset class
    area: right
    rows: $.BY_ASSET
    on-select: { by: asset, field: ASSET, filter: [trades] }
    label: ASSET
    value: MTM
    fmt: signed0
    tone: sign
  - id: computed
    kind: kv
    title: "Computed from the trade valuations, beside the stored figures"
    code: CMP
    key: F4
    source: { kind: nset-mtm, id: $.NETTING_SET_ID }
    columns:
      - { label: Net MTM (computed), bind: $src.NET_MTM, fmt: signed0, tone: sign }
      - { label: Net MTM (stored), bind: $.NET_MTM, fmt: signed0 }
      - { label: Net MTM difference, bind: $src.NET_MTM - $.NET_MTM, fmt: signed0, tone: sign }
      - { label: "Trades (computed: live)", bind: $src.TRADE_COUNT, fmt: amount0 }
      - { label: Trades (stored), bind: $.TRADE_COUNT, fmt: amount0 }
      - { label: Gross positive MTM, bind: $src.GROSS_POSITIVE_MTM, fmt: signed0 }
      - { label: Gross negative MTM, bind: $src.GROSS_NEGATIVE_MTM, fmt: signed0 }
      - { label: Netting benefit, bind: $src.NETTING_BENEFIT, fmt: compact }
      - { label: Net-to-gross ratio, bind: $src.NET_TO_GROSS, fmt: pct0 }
      - { label: "Current exposure, uncollateralised", bind: $src.CE_UNCOLLATERALISED, fmt: compact }
      - { label: "Members' MTM (check)", bind: "sum($.TRADES, 'MTM')", fmt: signed0 }
      - { label: Current exposure from the stored figures (check), bind: "max($.NET_MTM - $.COLLATERAL, 0)", fmt: compact }
      - { label: "Past maturity, not matured (data quality)", bind: $src.PAST_MATURITY_COUNT, fmt: amount0 }
      - { label: Sum currency, bind: $src.CURRENCY_NOTE }
  - id: byProductGroup
    kind: hbar
    title: Net MTM by product group (computed)
    area: right
    rows: $src.BY_PRODUCT_GROUP
    label: label
    value: value
    fmt: signed0
    tone: sign
    source: { kind: nset-mtm, id: $.NETTING_SET_ID }
  - id: pastMaturity
    kind: table
    title: "Live-status trades past their maturity date (data quality: in no total)"
    rows: $src.PAST_MATURITY
    source: { kind: nset-mtm, id: $.NETTING_SET_ID }
    columns:
      - { label: Trade, bind: "@.TRADE_ID" }
      - { label: Status, bind: "@.TRADE_STATUS", tone: status }
      - { label: Product, bind: "@.PRODUCT_TYPE" }
      - { label: Maturity, bind: "@.MATURITY_DATE", fmt: date }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.COUNTERPARTY, 'counterparty')", F8: impact, F9: raw }
