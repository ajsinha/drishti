# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: credit-limit
version: 1
description: "PFE limit by tenor bucket for a counterparty, with utilisation."
doc:
  summary: "PFE limit by tenor bucket for a counterparty, with utilisation."
  description: >-
    PFE limit by tenor bucket for a counterparty, with utilisation. One page per credit limit, its panels: by tenor bucket;
    utilisation; how the view was built; the entities it links to. The strip gives Counterparty, Measure, Limit, Used,
    Utilisation and Status. Linked entities: counterparty (counterparty).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/credit-limit/LIM-ALDERSHOT"
    - "LIM LIM-ALDERSHOT"
  since: "2.7.0"
match: { kind: credit-limit, priority: 10 }
title: { pill: Exposure and capital · Credit limit, id: $.LIMIT_ID }
strip:
  - { label: Counterparty, bind: $.COUNTERPARTY_NAME }
  - { label: Measure, bind: $.MEASURE }
  - { label: Limit, bind: $.LIMIT, fmt: compact }
  - { label: Used, bind: $.USED, fmt: compact }
  - { label: Utilisation, bind: $.UTILISATION, fmt: pct0, emphasis: true }
  - { label: Status, bind: $.STATUS, tone: status }
panels:
  - id: buckets
    kind: table
    title: By tenor bucket
    key: F2
    rows: $.BUCKETS
    form:
      title: Bucket limits
      key: bucket
      edit: cells
      fields:
        - { id: bucket, label: Bucket, bind: BUCKET, readonly: true, reason: "the tenor buckets are set by the limits policy" }
        - { id: limit, label: Limit, bind: LIMIT, type: number, min: 0, required: true, fmt: amount0 }
        - { id: used, label: Used, bind: USED, type: number, readonly: true, reason: "measured by the exposure engine" }
      rules:
        - { rule: "limit >= used", fields: [limit], message: "The new limit is below what's already used: raise it, or ask the owner first." }
        - { rule: "limit <= used * 3", severity: warn, fields: [limit], message: "More than three times what's used: the credit committee reviews it." }
    columns:
      - { label: Bucket, bind: "@.BUCKET" }
      - { label: Limit, bind: "@.LIMIT", fmt: compact }
      - { label: Used, bind: "@.USED", fmt: compact }
      - { label: Utilisation, bind: "@.UTILISATION", fmt: pct0 }
  - { use: ranked-bars@1, with: { id: util, title: Utilisation, area: right, rows: $.BUCKETS, label: BUCKET, value: UTILISATION, fmt: pct0 } }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.COUNTERPARTY, 'counterparty')", F8: impact, F9: raw }
