# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: collateral-balance
version: 1
description: "Collateral held and posted under a CSA, by asset, after haircuts."
doc:
  summary: "Collateral held and posted under a CSA, by asset, after haircuts."
  description: >-
    Collateral held and posted under a CSA, by asset, after haircuts. One page per collateral balance, its panels: positions;
    checks: collateral after haircut, from the positions; how the view was built; the entities it links to. The strip gives Held
    (we hold), Posted (we posted), Net (held − posted) and As of. Linked entities: CSA (csa) and netting set (netting-set).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/collateral-balance/COLL-ALDERSHOT-FRA"
    - "COLL COLL-ALDERSHOT-FRA"
  since: "2.7.0"
match: { kind: collateral-balance, priority: 10 }
title: { pill: Collateral and margin · Collateral balance, id: $.BALANCE_ID }
strip:
  - { label: Held (we hold), bind: $.HELD, fmt: compact }
  - { label: Posted (we posted), bind: $.POSTED, fmt: compact }
  - { label: "Net (held − posted)", bind: $.NET, fmt: signed0, tone: sign, emphasis: true }
  - { label: As of, bind: $.AS_OF, fmt: date }
panels:
  - id: positions
    kind: table
    title: Positions
    key: F2
    rows: $.POSITIONS
    pivot:
      rows: [DIRECTION]
      values: [{ field: MARKET_VALUE, agg: sum }, { field: VALUE, agg: sum }]
      filters: [ASSET]
    columns:
      - { label: Asset, bind: "@.ASSET" }
      - { label: Direction, bind: "@.DIRECTION" }
      - { label: Market value, bind: "@.MARKET_VALUE", fmt: amount0, total: true }
      - { label: Haircut, bind: "@.HAIRCUT", fmt: pct2 }
      - { label: Collateral value, bind: "@.VALUE", fmt: amount0, total: true }
  - id: checks
    kind: kv
    title: "Checks: collateral after haircut, from the positions"
    area: right
    columns:
      - { label: Held after haircut (check), bind: "sum($.POSITIONS[?@.DIRECTION == 'Held'], 'VALUE')", fmt: amount0 }
      - { label: Posted after haircut (check), bind: "sum($.POSITIONS[?@.DIRECTION == 'Posted'], 'VALUE')", fmt: amount0 }
      - { label: Net after haircut (check), bind: "sum($.POSITIONS[?@.DIRECTION == 'Held'], 'VALUE') - sum($.POSITIONS[?@.DIRECTION == 'Posted'], 'VALUE')", fmt: signed0, tone: sign }
      - { label: Haircut taken, bind: "sum($.POSITIONS, 'MARKET_VALUE') - sum($.POSITIONS, 'VALUE')", fmt: amount0 }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.CSA, 'csa')", F8: impact, F9: raw }
