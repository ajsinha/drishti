# Data contract of the lei-country kind (command LEIC): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap lei-country`; completed by hand (2.9.2).
kind: lei-country
mnemonic: LEIC
pack: gleif
version: '1.0'
class: computed
status: active
title: LEI country
description: 'A country''s legal entities in the pack, computed from the entities when asked: the entities, the groups present, legal forms and
  cities.'
source: 'computed by Drishti: the derived connector gleif-groupings over the kind lei-entity'
grain: One record per COUNTRY of the lei-entity records, computed when asked.
key:
- COUNTRY
dated-by: on request
cadence:
  frequency: on change
  due: recomputed from its source kind (connector refresh 60s)
storage:
  connector: gleif-groupings
  plugin: derived
fields:
- name: COUNTRY
  type: id
  presence: required
  description: The value the lei-entity records are grouped by ($.LEI_COUNTRY; each also joins 'ALL')
- name: MEMBER_LEIS
  type: id list
  presence: derived
  description: The ids of the grouped lei-entity records (at most 100000)
- name: ENTITIES
  type: integer
  presence: derived
  description: 'The entities with a legal address in the country: every lei-entity whose LEI_COUNTRY is the key (no row cap)'
- name: NAMES
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.COUNTRY_NAME'
- name: COUNTRY_LIST
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI_COUNTRY'
- name: GROUP_LIST
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI_GROUP'
- name: GROUPS_HEADQUARTERED
  type: integer
  presence: derived
  description: Members that are their own ultimate parent (LEI equals LEI_GROUP)
- name: LAPSED
  type: integer
  presence: derived
  description: Members whose registration is LAPSED
- name: LATE_RENEWALS
  type: integer
  presence: derived
  description: Members whose LEI renewal is late
- name: PROVENANCE
  type: record
  presence: derived
  description: The first member's source and licence
- name: ROWS
  type: record list
  presence: derived
  description: One row per grouped lei-entity record
- name: NAME
  type: text
  presence: derived
  description: The country's name ('Every country of the entities in the pack' for ALL)
- name: COUNTRIES
  type: integer
  presence: derived
  description: The number of countries among the members (1, or every country on ALL)
- name: GROUPS_PRESENT
  type: integer
  presence: derived
  description: The number of ownership groups with a member here
- name: BY_LEGAL_FORM
  type: record list
  presence: derived
  description: 'Members by legal form: label, value, count; the top 15'
- name: BY_CITY
  type: record list
  presence: derived
  description: Members by legal-address city; the top 15
- name: GROUP_ROWS
  type: record list
  presence: derived
  description: 'Members by ownership group: label (the group key, an LEI), value (members here), largest first'
- name: BY_COUNTRY
  type: record list
  presence: derived
  description: Members by country name; the top 20 (ALL)
- name: COUNTRY_ROWS
  type: record list
  presence: derived
  description: 'ALL only: every country code with its members, largest first'
nested:
  ROWS[]:
  - name: LEI
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI'
  - name: NAME
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.NAME'
  - name: COUNTRY
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI_COUNTRY'
  - name: COUNTRY_NAME
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.COUNTRY_NAME'
  - name: CITY
    type: unknown
    presence: optional
    description: 'From the lei-entity record: nonblank($.LEGAL_CITY, ''Not given'')'
  - name: LEGAL_FORM
    type: unknown
    presence: optional
    description: 'From the lei-entity record: nonblank($.LEGAL_FORM, ''Not given'')'
  - name: GROUP
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI_GROUP'
    link: counterparty-group
  - name: STATUS
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.REGISTRATION_STATUS'
  - name: LATE
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.RENEWAL_LATE ? ''late'' : null'
links:
- field: ROWS[].GROUP
  kind: counterparty-group
validation:
- rule: required
  fields:
  - COUNTRY
- rule: unique
  key:
  - COUNTRY
  per: snapshot
- rule: link
  field: ROWS[].GROUP
  kind: counterparty-group
notes:
- 'Computed when asked by the derived connector gleif-groupings from every lei-entity (since 2.9.2, which retired the stored page and its 400-row
  cap): docs/guides/PACK_DEVELOPER_GUIDE.md › Part VII. Groupings and analytics, computed (its Part II).'
review: []
