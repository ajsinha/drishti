# Data contract of the lei-group kind (command LEIG): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap lei-group`; owned by people from then on: confirm the review points, then remove them.
kind: lei-group
mnemonic: LEIG
pack: gleif
version: '1.0'
class: computed
status: retiring
retiring-in: 2.9.0 or 2.10.0
replaced-by: docs/contracts/GROUPINGS_AND_ANALYTICS.md
title: LEI ownership group
description: 'An ownership group: the ultimate parent with its whole tree, every member, and counts by country and legal form.'
source: 'public data: GLEIF LEI records, relationship records and mapping files (tools/publicdata/gleif.py)'
grain: One row per lei ownership group, keyed by GROUP_ID.
key:
- GROUP_ID
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: gleif-store
  plugin: delta
  domain: gleif
  table: <root>/gleif/lei-group/
  columns:
  - GROUP_ID
  - NAME
  - LEI_COUNTRY
  - SEGMENT
  - MEMBERS
  test-data:
  - data/testdata/gleif/lei-group
fields:
- name: GROUP_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: 8I5DZWZKVSZI1NUHU748
- name: NAME
  type: text
  presence: required
  example: JPMORGAN CHASE & CO.
- name: ENTITY_LEI
  type: id
  presence: optional
  description: 'LEI record: the lei-entity it refers to'
  example: 8I5DZWZKVSZI1NUHU748
  pattern: ^[0-9A-Z]{18}[0-9]{2}$
  link: lei-entity
- name: COUNTRY
  type: text
  presence: optional
  example: US
- name: COUNTRY_NAME
  type: text
  presence: optional
  example: United States of America (the)
- name: LEI_COUNTRY
  type: id
  presence: optional
  description: Country
  example: US
  link: lei-country
- name: LEGAL_FORM
  type: text
  presence: optional
  description: Legal form
  example: Corporation
- name: SEGMENT
  type: text
  presence: optional
  description: Segment
  example: G-SIB, US equities
- name: MEMBERS
  type: integer
  presence: derived
  description: Members (pack)
  example: 50
  note: computed by the GLEIF ownership grouping; removed when retired
- name: MEMBERS_IN_GLEIF
  type: integer
  presence: derived
  description: Members (GLEIF)
  example: 173
  note: computed by the GLEIF ownership grouping; removed when retired
- name: CAPPED
  type: boolean
  presence: derived
  example: true
  note: computed by the GLEIF ownership grouping; removed when retired
- name: CAP_NOTE
  type: text
  presence: derived
  example: The group has 173 entities in GLEIF; the pack keeps 50 (at …
  note: computed by the GLEIF ownership grouping; removed when retired
- name: LEVELS
  type: integer
  presence: derived
  description: Levels
  example: 2
  note: computed by the GLEIF ownership grouping; removed when retired
- name: COUNTRIES
  type: integer
  presence: derived
  description: Countries
  example: 13
  note: computed by the GLEIF ownership grouping; removed when retired
- name: LATE_RENEWALS
  type: integer
  presence: derived
  example: 5
  note: computed by the GLEIF ownership grouping; removed when retired
- name: SEEDS
  type: record list
  presence: optional
  description: 'Nested: see nested SEEDS[]'
- name: US_COMPANY
  type: id
  presence: optional
  description: 'US listed company: the us-company it refers to'
  example: JPM
  link: us-company
- name: TREE
  type: record list
  presence: derived
  description: 'Nested: see nested TREE[]'
  note: computed by the GLEIF ownership grouping; removed when retired
- name: ROWS
  type: record list
  presence: derived
  description: 'Nested: see nested ROWS[]'
  note: computed by the GLEIF ownership grouping; removed when retired
- name: BY_COUNTRY
  type: record list
  presence: derived
  description: 'Nested: see nested BY_COUNTRY[]'
  note: computed by the GLEIF ownership grouping; removed when retired
- name: BY_LEGAL_FORM
  type: record list
  presence: derived
  description: 'Nested: see nested BY_LEGAL_FORM[]'
  note: computed by the GLEIF ownership grouping; removed when retired
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
- name: GROUPS
  type: integer
  presence: optional
  description: Groups
  example: 590
- name: ENTITIES
  type: integer
  presence: optional
  description: Entities
  example: 9937
- name: CAPPED_GROUPS
  type: integer
  presence: optional
  description: Groups capped
  example: 85
- name: BY_SEGMENT
  type: record list
  presence: optional
  description: 'Nested: see nested BY_SEGMENT[]'
nested:
  SEEDS[]:
  - name: LEI
    type: text
    presence: required
    example: 8I5DZWZKVSZI1NUHU748
  - name: LABEL
    type: text
    presence: required
    example: JPMorgan Chase
  - name: SEGMENT
    type: text
    presence: required
    description: Segment
    example: US equities
    enum:
    - Asset manager
    - Bank
    - G-SIB
    - Insurer
    - Market infrastructure
    - US equities
  - name: TICKER
    type: text
    presence: optional
    example: JPM
  TREE[]:
  - name: LEI
    type: text
    presence: required
    description: LEI
    example: 8I5DZWZKVSZI1NUHU748
  - name: NAME
    type: text
    presence: required
    example: JPMORGAN CHASE & CO.
  - name: COUNTRY
    type: text
    presence: required
    description: Country
    example: US
  - name: CHILDREN
    type: record list
    presence: optional
    description: 'Nested: see nested TREE[].CHILDREN[]'
  TREE[].CHILDREN[]:
  - name: LEI
    type: text
    presence: required
    example: 213800GI1LKW2KY84R66
  - name: NAME
    type: text
    presence: required
    example: J.P. MORGAN PERSONAL INVESTING LIMITED
  - name: COUNTRY
    type: text
    presence: required
    example: GB
  - name: CHILDREN
    type: record list
    presence: optional
    description: 'Nested: see nested TREE[].CHILDREN[].CHILDREN[]'
  TREE[].CHILDREN[].CHILDREN[]:
  - name: LEI
    type: text
    presence: required
    example: 2BIX7481YGGUUDUCU943
  - name: NAME
    type: text
    presence: required
    example: JPMORGAN CHASE FUNDING INC.
  - name: COUNTRY
    type: text
    presence: required
    example: US
  - name: CHILDREN
    type: record list
    presence: optional
    description: 'Nested: see nested TREE[].CHILDREN[].CHILDREN[].CHILDREN[]'
  ROWS[]:
  - name: LEI
    type: text
    presence: optional
    example: 8I5DZWZKVSZI1NUHU748
  - name: NAME
    type: text
    presence: required
    description: Group
    example: JPMORGAN CHASE & CO.
  - name: COUNTRY
    type: text
    presence: required
    description: Home
    example: US
  - name: LEVEL
    type: integer
    presence: optional
    example: 0
  - name: LATE
    type: text
    presence: optional
    example: late
  - name: GROUP_ID
    type: id
    presence: optional
    description: The record's id (the business key)
    example: 549300V9QSIG4WX4GJ96
  - name: SEGMENT
    type: text
    presence: optional
    description: Segment
    example: US equities
  - name: MEMBERS
    type: integer
    presence: optional
    description: Members
    example: 51
  - name: MEMBERS_IN_GLEIF
    type: integer
    presence: optional
    description: In GLEIF
    example: 75
  BY_COUNTRY[]:
  - name: LABEL
    type: text
    presence: required
    example: United States of America (the)
  - name: VALUE
    type: amount
    presence: required
    example: 27
  BY_LEGAL_FORM[]:
  - name: LABEL
    type: text
    presence: required
    example: Corporation
  - name: VALUE
    type: amount
    presence: required
    example: 12
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    example: GLEIF, the Global Legal Entity Identifier Foundation (LEI r…
  - name: RETRIEVED_AT
    type: date
    presence: required
    example: '2026-10-25'
  - name: LICENCE
    type: text
    presence: required
    example: 'CC0 1.0 (GLEIF''s terms: free of charge, no restriction; att…'
  - name: URL
    type: text
    presence: required
    example: https://search.gleif.org/#/record/8I5DZWZKVSZI1NUHU748
  BY_SEGMENT[]:
  - name: LABEL
    type: text
    presence: required
    example: US equities
  - name: VALUE
    type: amount
    presence: required
    example: 481
links:
- field: ENTITY_LEI
  kind: lei-entity
- field: LEI_COUNTRY
  kind: lei-country
- field: US_COMPANY
  kind: us-company
validation:
- rule: required
  fields:
  - GROUP_ID
  - NAME
  - PROVENANCE
- rule: unique
  key:
  - GROUP_ID
  per: snapshot
- rule: link
  field: ENTITY_LEI
  kind: lei-entity
- rule: link
  field: LEI_COUNTRY
  kind: lei-country
- rule: link
  field: US_COMPANY
  kind: us-company
- rule: enum
  field: SEEDS[].SEGMENT
  values:
  - Asset manager
  - Bank
  - G-SIB
  - Insurer
  - Market infrastructure
  - US equities
notes:
- 'Retiring in 2.9.0 or 2.10.0: the stored kind is removed and computed instead by the GLEIF ownership grouping (docs/contracts/GROUPINGS_AND_ANALYTICS.md);
  old ids and links open the computed page.'
review:
- 'required inferred from 100% coverage in 592 documents (1 samples and 591 test-data documents (data/testdata/gleif/lei-group/snapshot-2026-10-25.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'a snapshot refreshed when tools/publicdata/gleif.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: SEEDS[].SEGMENT: confirm they are closed lists.'
- 'number types decided by the field''s name: BY_COUNTRY[].VALUE amount, BY_LEGAL_FORM[].VALUE amount, BY_SEGMENT[].VALUE amount: confirm amount,
  rate or integer.'
- 'no unit stated for the amounts BY_COUNTRY[].VALUE, BY_LEGAL_FORM[].VALUE, BY_SEGMENT[].VALUE (docs/contracts/README.md section 7: USD unless
  stated): confirm the currency.'
- 'no description in about.yaml or the Sutras for NAME, COUNTRY, COUNTRY_NAME, CAPPED, CAP_NOTE, LATE_RENEWALS, SEEDS[].LEI, SEEDS[].LABEL, SEEDS[].TICKER,
  TREE[].NAME, TREE[].CHILDREN[].LEI, TREE[].CHILDREN[].NAME and 17 more: write them in the pack''s config/about.yaml glossary.'
- 'The release is 2.9.0 or 2.10.0 (Track B, shipped as each is ready): confirm which.'
