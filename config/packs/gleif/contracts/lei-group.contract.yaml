# Data contract of the lei-group kind (command LEIG): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap lei-group`; completed by hand (2.9.2).
kind: lei-group
mnemonic: LEIG
pack: gleif
version: '1.0'
class: computed
status: active
title: LEI ownership group
description: 'An ownership group, computed from the entities when asked: the ultimate parent with its whole tree, every member, and counts by
  country and legal form.'
source: 'computed by Drishti: the derived connector gleif-groupings over the kind lei-entity'
grain: One record per GROUP_ID of the lei-entity records, computed when asked.
key:
- GROUP_ID
dated-by: on request
cadence:
  frequency: on change
  due: recomputed from its source kind (connector refresh 60s)
storage:
  connector: gleif-groupings
  plugin: derived
fields:
- name: GROUP_ID
  type: id
  presence: required
  description: The value the lei-entity records are grouped by ($.LEI_GROUP; each also joins 'ALL')
- name: MEMBER_LEIS
  type: id list
  presence: derived
  description: The ids of the grouped lei-entity records (at most 100000)
- name: MEMBERS
  type: integer
  presence: derived
  description: 'The entities in the group: every lei-entity whose LEI_GROUP is the key (no cap)'
- name: LATE_RENEWALS
  type: integer
  presence: derived
  description: Members whose LEI renewal is late (RENEWAL_LATE)
- name: LAPSED
  type: integer
  presence: derived
  description: Members whose registration is LAPSED
- name: COUNTRY_LIST
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI_COUNTRY'
- name: GROUP_LIST
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI_GROUP'
- name: ROOT_NAME
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.NAME : null'
- name: ROOT_COUNTRY
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.LEI_COUNTRY : null'
- name: ROOT_COUNTRY_NAME
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.COUNTRY_NAME : null'
- name: ROOT_LEGAL_FORM
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.LEGAL_FORM : null'
- name: ROOT_SEGMENT
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.SEGMENT : null'
- name: ROOT_US_COMPANY
  type: text list
  presence: derived
  description: 'A helper of the page fields: distinct over the group of: $.LEI == $.LEI_GROUP ? $.US_COMPANY : null'
- name: GLEIF_GROUP_SIZE
  type: integer
  presence: derived
  description: 'The ultimate parent''s GLEIF_GROUP_SIZE: the group''s size in GLEIF''s golden copy (an input)'
- name: PROVENANCE
  type: record
  presence: derived
  description: The first member's source and licence (GLEIF, CC0)
- name: ROWS
  type: record list
  presence: derived
  description: One row per grouped lei-entity record
- name: TREE
  type: record list
  presence: derived
  description: 'The group as a tree from the ultimate parent: each node a row with its CHILDREN; a member whose direct parent is outside the group
    hangs under the ultimate parent'
- name: LEVELS
  type: integer
  presence: derived
  description: The deepest level of the tree (the ultimate parent is 0)
- name: NAME
  type: text
  presence: derived
  description: The ultimate parent's legal name ('Every ownership group of the pack' for ALL)
- name: ENTITY_LEI
  type: id
  presence: derived
  description: The ultimate parent (the key; empty for ALL)
- name: LEI_COUNTRY
  type: text
  presence: derived
  description: The ultimate parent's legal-address country
- name: COUNTRY_NAME
  type: text
  presence: derived
  description: That country's name
- name: LEGAL_FORM
  type: text
  presence: derived
  description: The ultimate parent's legal form
- name: SEGMENT
  type: text
  presence: derived
  description: The ultimate parent's segment when it is a seed (US equities, G-SIB, bank, ...)
- name: US_COMPANY
  type: id
  presence: derived
  description: The ultimate parent's us-equities ticker, when listed
- name: COUNTRIES
  type: integer
  presence: derived
  description: The number of different legal-address countries among the members
- name: GROUPS
  type: integer
  presence: derived
  description: The number of ownership groups among the members (1 on a group page; every group on ALL)
- name: MEMBERS_IN_GLEIF
  type: integer
  presence: derived
  description: The larger of GLEIF_GROUP_SIZE and MEMBERS
- name: CAPPED
  type: boolean
  presence: derived
  description: True when GLEIF has more members than the lake holds (the committed snapshot keeps at most 50 a group)
- name: BY_COUNTRY
  type: record list
  presence: derived
  description: 'Members by country code: rows of label, value (members) and count, largest first, the top 20'
- name: BY_LEGAL_FORM
  type: record list
  presence: derived
  description: Members by legal form, largest first, the top 15
- name: GROUP_ROWS
  type: record list
  presence: derived
  description: 'ALL only: the rows of every group''s ultimate parent, largest in GLEIF first (empty on a group page)'
- name: BY_SEGMENT
  type: record list
  presence: derived
  description: The seeded members by segment
nested:
  ROWS[]:
  - name: LEI
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI'
  - name: NAME
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.NAME'
  - name: COUNTRY
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI_COUNTRY'
  - name: CITY
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEGAL_CITY'
  - name: LEGAL_FORM
    type: unknown
    presence: optional
    description: 'From the lei-entity record: nonblank($.LEGAL_FORM, ''Not given'')'
  - name: PARENT
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.DIRECT_PARENT'
  - name: STATUS
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.REGISTRATION_STATUS'
  - name: LATE
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.RENEWAL_LATE ? ''late'' : null'
  - name: SEGMENT
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.SEGMENT'
  - name: GROUP
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.LEI_GROUP'
    link: counterparty-group
  - name: GLEIF_GROUP_SIZE
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.GLEIF_GROUP_SIZE'
  - name: US_COMPANY
    type: unknown
    presence: optional
    description: 'From the lei-entity record: $.US_COMPANY'
    link: us-company
  - name: LEVEL
    type: integer
    presence: derived
    description: The row's depth in the group's tree, built from PARENT (the key 0)
links:
- field: ROWS[].GROUP
  kind: counterparty-group
- field: ROWS[].US_COMPANY
  kind: us-company
validation:
- rule: required
  fields:
  - GROUP_ID
- rule: unique
  key:
  - GROUP_ID
  per: snapshot
- rule: link
  field: ROWS[].GROUP
  kind: counterparty-group
- rule: link
  field: ROWS[].US_COMPANY
  kind: us-company
notes:
- 'Computed when asked by the derived connector gleif-groupings from every lei-entity (since 2.9.2, which retired the stored page and its 50-member
  cap): the formulas, the inputs and the reconciliation with the retired page are in docs/guides/PACK_DEVELOPER_GUIDE.md › Part VII. Groupings and analytics, computed (its Part II).'
review: []
