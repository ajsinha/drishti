# Hand-written from the Drishti UI kit (config/ui-kit/fragments). Matches the one lei-group record ALL, before the group page.
rachana: 1
sutra: lei-browse
version: 1
description: "Search and browse the pack's legal entities: a search box over every entity, every ownership group, groups by segment and entities by country."
doc:
  summary: "Search the legal entities by name or LEI, and browse every ownership group (a click opens the group's summary beside)."
  description: >-
    The pack's front page (LEIG ALL). The search box finds legal entities by name, LEI, city or legal form across the whole pack
    (the first 50 found; each name a link to its page). The groups table lists every ownership group, largest first, with its
    home country, segment (US equities, G-SIB, bank, insurer, asset manager, market infrastructure), the members the pack keeps and
    the members GLEIF has; a click opens the group's facts and its members by country beside it. On the right: groups by segment,
    entities by country, and the source.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/lei-group/ALL"
    - "LEIG ALL"
  since: "2.7.0"
match: { kind: lei-group, where: "$.GROUP_ID == 'ALL'", priority: 20 }
title: { pill: GLEIF · Search and browse, id: $.GROUP_ID, with: $.NAME }
controls:
  - { id: q, kind: search, label: Find entities, default: bank, placement: header, panel: found }
strip:
  - { label: Entities, bind: $.ENTITIES, fmt: entities0, emphasis: true }
  - { label: Groups, bind: $.GROUPS, fmt: entities0 }
  - { label: Countries, bind: $.COUNTRIES }
  - { label: Groups capped, bind: $.CAPPED_GROUPS }
  - { label: Late renewals, bind: "$.LATE_RENEWALS + ' late: renewal failed'", tone: status }
panels:
  - id: found
    kind: table
    title: "Entities found${ctl.q ? ' for ' + ctl.q : ''} (the first 50)"
    key: F2
    code: FIND
    source: { kind: lei-entity, search: "ctl.q", limit: 50 }
    rows: $src
    empty: Nothing found; try part of a legal name, a city or an LEI
    columns:
      - { label: Legal name, bind: "link(@.LEI, 'lei-entity', @.NAME)" }
      - { label: Country, bind: "@.LEI_COUNTRY" }
      - { label: City, bind: "@.LEGAL_CITY" }
      - { label: Legal form, bind: "@.LEGAL_FORM" }
      - { label: Registration, bind: "@.REGISTRATION_STATUS" }
      - { label: Group, bind: "link(@.LEI_GROUP, 'lei-group')" }
  - id: groups
    kind: table
    title: Every ownership group, largest first (a click opens it beside)
    key: F3
    code: GRPS
    rows: $.ROWS
    columns:
      - { label: Group, bind: "@.NAME" }
      - { label: Home, bind: "@.COUNTRY" }
      - { label: Segment, bind: "@.SEGMENT" }
      - { label: Members, bind: "@.MEMBERS", fmt: entities0, total: true }
      - { label: In GLEIF, bind: "@.MEMBERS_IN_GLEIF", fmt: entities0 }
    emits:
      - { name: open, on: row-click, payload: { id: { bind: "@.GROUP_ID", type: id }, ref: { bind: "@.COUNTRY", type: text } } }
    children:
      - place: detail-right
        source: { kind: lei-group, id: "@parent.open.id" }
        waits: Pick a group to see it
        panels:
          - id: picked-group
            kind: kv
            title: "Group ${@parent.open.id}"
            columns:
              - { label: Ultimate parent, bind: "link($src.ENTITY_LEI, 'lei-entity', $src.NAME)" }
              - { label: Group page, bind: "link($src.GROUP_ID, 'lei-group', 'Open the group tree')" }
              - { label: Home, bind: "link($src.LEI_COUNTRY, 'lei-country', $src.COUNTRY_NAME)" }
              - { label: Segment, bind: $src.SEGMENT }
              - { label: Members kept, bind: $src.MEMBERS, fmt: entities0 }
              - { label: Members in GLEIF, bind: $src.MEMBERS_IN_GLEIF, fmt: entities0 }
              - { label: Levels, bind: $src.LEVELS }
              - { label: Late renewals, bind: $src.LATE_RENEWALS }
          - { use: ranked-bars@1, with: { id: picked-countries, title: Members by country, rows: $src.BY_COUNTRY, fmt: entities0 } }
  - { use: ranked-bars@1, with: { id: by-segment, title: Groups by segment, rows: $.BY_SEGMENT, fmt: entities0, area: right, key: F4 } }
  - { use: ranked-bars@1, with: { id: by-country, title: Entities by country (top 20), rows: $.BY_COUNTRY, fmt: entities0, area: right } }
  - use: explainer-note@1
    with:
      title: About this pack
      area: right
      text: "Legal Entity Identifiers from GLEIF (CC0 1.0; attribution appreciated): the ownership groups of the us-equities companies and of large banks (the FSB's G-SIBs and others), insurers, asset managers and market infrastructures, at most 50 entities a group. LEIC ALL lists the countries; LEI <code> opens an entity."
  - { use: field-list@1, with: { id: source, title: Data source and licence, rows: $.PROVENANCE, area: right } }
  - { use: data-provenance@1 }
keys: { F6: "link('ALL', 'lei-country', 'Countries')", F9: raw }
