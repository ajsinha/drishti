# Generated by tools/packgen/genomics/make.py. Edit the generator, not this file.
rachana: 1
sutra: clinical-trial
version: 1
description: "A targeted-therapy trial: phase, biomarker, arms and enrolment against target."
match: { kind: clinical-trial, priority: 10 }
title: { pill: Genomics and biology · Clinical trial, id: $.trialId }
strip:
  - { label: Trial, bind: $.title }
  - { label: Phase, bind: $.phase }
  - { label: Status, bind: $.status, tone: status }
  - { label: Enrolled, bind: $.enrolled, fmt: amount0, emphasis: true }
  - { label: Target, bind: $.target, fmt: amount0 }
  - { label: Biomarker, bind: $.biomarkerName }
panels:
  - id: enrolment
    kind: line
    title: Cumulative enrolment
    key: F2
    rows: $.enrolment
    x: month
    y: patients
    fmt: amount0
  - id: arms
    kind: table
    title: Arms
    key: F3
    rows: $.arms
    columns:
      - { label: Arm, bind: "@.arm" }
      - { label: Intervention, bind: "@.intervention" }
      - { label: Patients, bind: "@.patients", fmt: amount0 }
      - { label: Response rate, bind: "@.orr", fmt: pct0 }
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.gene, 'gene')", F8: impact, F9: raw }
