# Generated by tools/packgen/genomics/make.py. Edit the generator, not this file.
rachana: 1
sutra: sequencing-run
version: 1
description: "An instrument run: yield, quality by cycle, and the samples it carried."
match: { kind: sequencing-run, priority: 10 }
title: { pill: Genomics and biology · Sequencing run, id: $.runId }
strip:
  - { label: Instrument, bind: $.instrument }
  - { label: Flow cell, bind: $.flowcell }
  - { label: Yield (Gb), bind: $.yieldGb, fmt: price2, emphasis: true }
  - { label: Q30, bind: $.q30, fmt: pct2 }
  - { label: Clusters PF, bind: $.clustersPf, fmt: pct2 }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: quality
    kind: line
    title: Mean quality score by cycle
    key: F2
    rows: $.qualityByCycle
    x: cycle
    y: q
    fmt: price2
  - id: samples
    kind: table
    title: Samples
    key: F3
    rows: $.samples
    columns:
      - { label: Sample, bind: "@.sample" }
      - { label: Reads (M), bind: "@.readsM", fmt: price2, total: true }
      - { label: Mean coverage, bind: "@.coverage", fmt: amount0 }
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
