# National statistics · the economy module's public-sector national statistics pack (docs/guides/PUBLIC_SECTOR_GUIDE.md): Statistics Canada's
# headline series by vector, filled daily by the national-statistics feed (config/feeds/national-statistics.yaml) into worldlake.
pack: national-statistics
domain: economy   # the economy module's (its Public sector lens; docs/architecture/ACCESS_MODEL.md)
version: 1.0.0
code: STCAN
title: National statistics
description: >-
  Statistics Canada's headline statistics by vector from its Web Data Service (Statistics Canada Open Licence): the consumer price index,
  unemployment, monthly GDP, population, housing starts and the overnight money market rate. Each series shows its latest value, the
  change on the period and on the year, and its history. Filled daily by the national-statistics feed into the worldlake lake; more
  vectors are a line each in the feed's YAML.
kinds: [statistics-series]
sutras: sutras
mnemonics:
  NSTAT: { kind: statistics-series, label: National statistic }
graph:
  id-patterns:
    - { pattern: "^NSTAT-", kind: statistics-series }
  badges:
    statistics-series: "fmt($.LATEST, 'price2') + ' ' + $.UNIT"
connectors:
  statistics-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [statistics-series]
    settings:
      lake: worldlake
      lake-tables: statistics.statistics-series
lake:                  # the recommended entries of its lake tables (the shipped lake file holds the same)
  tables:
    statistics.statistics-series:
      id: SERIES_ID
      promote:
      - VECTOR
      - TITLE
      - TABLE_ID
      - TOPIC
      - UNIT
      - LATEST
      - LATEST_PERIOD
      - CHANGE_PCT
      - YEAR_ON_YEAR_PCT
      - RELEASED
      retention: 260
routes:                # the connector that answers each kind
  statistics-series: statistics-store
form:                          # FORM national-statistics: the search form of its kind
  statistics-series:
    - { path: SERIES_ID, label: Series id, type: id, group: Identity }
    - { path: TITLE, type: text, group: Identity }
    - { path: TOPIC, type: enum, group: Identity }
    - { path: TABLE_ID, label: Table, type: text, group: Identity }
    - { path: FREQUENCY, type: enum, group: Identity }
    - { path: YEAR_ON_YEAR_PCT, label: "On the year, %", type: number, group: Latest }
console:
  examples:
    - ["NSTAT NSTAT-V41690973", "Canada's consumer price index · the change on the month and the year"]
    - ["NSTAT NSTAT-V2062815", "Canada's unemployment rate, seasonally adjusted"]
    - ["NSTAT NSTAT-V1", "The population of Canada, quarterly"]
  help: config/help.yaml
