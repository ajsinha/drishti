console:
  examples:
  - - TRD MX-20000001
    - Interest rate swap (Murex) · legs side by side, flows and fixings
  - - TRD 1000001
    - Commodity swap (Endur) · legs, resets, events
  - - TRD CLY-3000086
    - Single-name CDS (Calypso) · premium leg payments
  - - TRD 1000015
    - Warehouse warrants (Endur) · inventory, delivery and payment legs
  - - CTRD CP-ALDERSHOT
    - A counterparty's trades in every system · payments, notional by product
