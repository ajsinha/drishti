# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: cmd-apo
version: 1
description: Option on the monthly average price.
match: { kind: trade, where: "$.productType == 'CMD_APO'", priority: 10 }
title: { pill: Commodity · Average price option (APO), id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Delta (USD), bind: $.risk.delta, fmt: signed0, tone: sign }
  - { label: Vega (USD), bind: $.risk.vega, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Option type, bind: $.terms.optionType }
      - { label: Exercise, bind: $.terms.exerciseStyle }
      - { label: Expiry, bind: $.terms.expiryDate, fmt: date }
      - { label: Strike, bind: $.terms.strike, fmt: price2 }
      - { label: Averaging, bind: $.terms.averagingPeriod }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: schedule
    kind: table
    title: Fixings
    code: FIX
    key: F3
    rows: $.schedule
    pivot:
      rows: [status]
      values: [{ field: payoff, agg: sum }, { field: payoff, agg: count }]
      filters: [index]
    columns:
      - { label: Fixing date, bind: "@.fixingDate", fmt: date }
      - { label: Period, bind: "@.period" }
      - { label: Index, bind: "@.index" }
      - { label: Rate, bind: "@.rate", fmt: pct4 }
      - { label: Payoff, bind: "@.payoff", fmt: signed0, tone: sign, total: true }
      - { label: Status, bind: "@.status", tone: status }
  - id: explain
    kind: waterfall
    title: "P&L explain (USD, opening to closing MTM)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Commodity forward curve: Forward curve"
    code: CMDC
    key: F4
    area: right
    source: "link($.commodityCurve, 'commodity-curve')"
    rows: points
    x: month
    y: price
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: Delta by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: delta
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
