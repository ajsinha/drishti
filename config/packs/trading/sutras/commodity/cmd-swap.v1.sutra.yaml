# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: cmd-swap
version: 1
description: "Fixed price against the average of a floating index, with a fee and, on some trades, a location differential: three or four legs."
match: { kind: trade, where: "$.productType == 'CMD_SWAP'", priority: 10 }
title: { pill: Commodity · Commodity swap, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Delta (USD), bind: $.risk.delta, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
  - { label: Book, bind: "link($.book, 'book')" }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Fixed price, bind: $.terms.fixedPrice, fmt: price2 }
      - { label: Quantity per period, bind: $.terms.quantityPerPeriod, fmt: amount0 }
      - { label: Averaging, bind: $.terms.averaging }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: legs
    kind: tabs
    title: Legs
    each: $.legs
    tabTitle: "'Leg ' + @.leg + ' · ' + @.label"
    panels:
      - id: leg-terms
        kind: kv
        title: Leg terms
        columns:
          - { label: Pay/receive, bind: "@.payReceive" }
          - { label: Leg type, bind: "@.type" }
          - { label: Index, bind: "@.index" }
          - { label: Price, bind: "@.rate", fmt: price2 }
          - { label: Quantity, bind: "@.quantity", fmt: amount0 }
          - { label: Per, bind: "@.quantityUnit" }
          - { label: Frequency, bind: "@.frequency" }
          - { label: Resets, bind: "@.resetFrequency" }
          - { label: Business day, bind: "@.businessDayConvention" }
          - { label: Calendar, bind: "@.calendar" }
          - { label: Payment lag, bind: "@.paymentLag" }
          - { label: Currency, bind: "@.currency" }
          - { label: Notional, bind: "@.notional", fmt: amount0 }
          - { label: Leg PV, bind: "@.pv", fmt: signed0, tone: sign }
      - id: leg-cashflows
        kind: table
        title: Cashflows and fixings
        rows: "@.cashflows"
        children: "@.fixings"
        expand: 1
        columns:
          - { label: Period start / fixing, bind: "coalesce(@.periodStart, @.fixingDate)", fmt: date }
          - { label: Period end, bind: "@.periodEnd", fmt: date }
          - { label: Pay date, bind: "@.payDate", fmt: date }
          - { label: Type, bind: "coalesce(@.type, @.index)" }
          - { label: Accrual, bind: "@.accrualFactor" }
          - { label: Rate, bind: "@.rate", fmt: price2 }
          - { label: Amount, bind: "@.amount", fmt: signed0, tone: sign }
          - { label: DF, bind: "@.discountFactor", fmt: df4 }
          - { label: PV, bind: "@.pv", fmt: signed0, tone: sign }
          - { label: Status, bind: "@.status", tone: status }
          - { label: Tenor, bind: "@.tenor" }
          - { label: Source, bind: "@.source" }
  - id: schedule
    kind: ladder
    title: Cashflows
    code: CF
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    pivot:
      rows: [type]
      columns: [leg]
      values: [{ field: pv, agg: sum }, { field: amount, agg: sum }]
      filters: [payDate]
    columns:
      - { label: Pay date, bind: "@.payDate", fmt: date }
      - { label: Leg, bind: "@.leg" }
      - { label: Type, bind: "@.type" }
      - { label: Rate, bind: "@.rate", fmt: pct4 }
      - { label: Amount, bind: "@.amount", fmt: signed0, tone: sign }
      - { label: PV, bind: "@.pv", fmt: signed0, tone: sign, total: true }
  - id: explain
    kind: waterfall
    title: "P&L explain (USD, opening to closing MTM)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Commodity forward curve: Forward curve"
    code: CMDC
    key: F4
    area: right
    source: "link($.commodityCurve, 'commodity-curve')"
    rows: points
    x: month
    y: price
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: Delta by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: delta
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
