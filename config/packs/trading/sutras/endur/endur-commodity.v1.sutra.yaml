# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: endur-commodity
version: 1
description: "An Endur physical commodity deal: a delivery leg in the commodity's unit and a payment leg."
doc:
  summary: "An Endur physical commodity deal: a delivery leg in the commodity's unit and a payment leg."
  description: >-
    An Endur physical commodity deal: a delivery leg in the commodity's unit and a payment leg. One deal screen per ENDUR
    Physical commodity trade (matched on SOURCE_SYSTEM and PRODUCT_TYPE): the deal ticket (DES), the legs side by side, every
    cash flow in one schedule, the events by leg and as a table filtered by the Legs and Between controls, the netted payment
    ladder and payments by month, how the view was built and the linked entities (F7 opens the counterparty's trades). The strip
    gives the source, side, notional, quantity, trade date, maturity, status and portfolio.
  params:
    legs: { type: text, default: all, meaning: "The Legs control: the legs whose events the table lists" }
    when: { type: text, default: '', meaning: "The Between control: the dates whose events the table lists" }
  emits: []
  expects: []
  examples:
    - "/v/trade/1000013"
    - "TRD 1000013"
  since: "2.7.0"
match: { kind: trade, where: "$.SOURCE_SYSTEM == 'ENDUR' && $.PRODUCT_TYPE == 'Commodity'", priority: 10 }
title: { pill: "Commodity · Physical commodity", id: $.TRADE_ID, with: "link($.COUNTERPARTY, 'counterparty')" }
strip:
  - { label: Source, bind: $.SOURCE_SYSTEM }
  - { label: Side, bind: "$.BUY_SELL_CODE == 'B' ? 'Buy' : ($.BUY_SELL_CODE == 'S' ? 'Sell' : nonblank($.BUY_SELL_CODE, '–'))" }
  - { label: Notional, bind: "$.CURRENCY + ' ' + fmt(first($.LEGS).NOTIONAL, 'amount0')", emphasis: true }
  - { label: Quantity, bind: "fmt($.QUANTITY, 'amount0') + (nonblank(first($.LEGS).PRICE_UNIT) ? ' ' + first($.LEGS).PRICE_UNIT : '')" }
  - { label: Trade date, bind: $.TRADE_DATE, fmt: date }
  - { label: Maturity, bind: $.MATURITY_DATE, fmt: date }
  - { label: Status, bind: "nonblank($.TRADE_STATUS, '–') + (nonblank($.TRADE_VERSION) ? ' v' + $.TRADE_VERSION : '')", tone: status }
  - { label: Portfolio, bind: "link($.PORTFOLIO, 'book')" }
controls:                       # the events by leg and by date: a trader's 'what is paid when, on which leg'
  - { id: legs, kind: multi-select, label: Legs, options: "$.LEGS[*].LEG_ID", default: all, placement: header, panel: event-list, remember: user }
  - { id: when, kind: date-range, label: Between, placement: header, panel: event-list }
panels:
  - { use: trading/deal-ticket@1, with: { rate-fmt: price4, product: "Physical commodity" } }
  - id: delivery
    kind: kv
    title: "Physical delivery at the hub"
    code: DLV
    when: "$.PRODUCT_SUB_TYPE == 'NGX-COMM-PHYS'"
    columns:
      - { label: "Hub", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].PHYSICAL_LOCATION_NAME, '–')" }
      - { label: "Index location", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].INDEX_LOCATION_NAME, '–')" }
      - { label: "Daily volume", bind: "$.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].DAILY_VOLUME", fmt: amount0 }
      - { label: "Unit", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].PRICE_UNIT, '–')" }
      - { label: "Delivery from", bind: "$.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].CASH_FLOWS[0].START_DATE", fmt: date }
      - { label: "Delivery to", bind: "last($.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].CASH_FLOWS).END_DATE", fmt: date }
      - { label: "Settlement", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'PHYSICAL'][0].SETTLEMENT_TYPE, '–')" }
  - id: inventory
    kind: kv
    title: "Warehouse warrants (inventory)"
    code: INV
    when: "$.PRODUCT_SUB_TYPE == 'COMM-WARRANTS-INV'"
    columns:
      - { label: "Vault", bind: "nonblank($.VAULT_LOCATION_ALLOCATION, '–')" }
      - { label: "Registered", bind: "nonblank($.REGISTRY_DELIVERY_DATE, '–')" }
      - { label: "Quantity", bind: "fmt($.QUANTITY, 'amount0') + ' ' + nonblank(first($.LEGS).PRICE_UNIT, '')" }
      - { label: "Price", bind: "$.PRICE", fmt: price4 }
      - { label: "Lease perpetuity", bind: "nonblank($.LEASE_PERPETUITY_FLAG, '–')" }
      - { label: "Precious metal", bind: "nonblank($.PRECIOUS_METAL_FLAG, '–')" }
  - { use: trading/legs@1, with: { rate-fmt: price4 } }
  - { use: trading/flow-schedule@1, with: { rate-fmt: price4 } }
  - { use: trading/events@1 }
  - { use: trading/payments@1 }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.COUNTERPARTY, 'counterparty-trades')", F8: impact, F9: raw }
