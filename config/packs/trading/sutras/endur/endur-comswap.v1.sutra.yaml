# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: endur-comswap
version: 1
description: "An Endur commodity swap: fixed price against the average of a floating index (or two indexes, a basis), month by month."
doc:
  summary: "An Endur commodity swap: fixed price against the average of a floating index (or two indexes, a basis), month by month."
  description: >-
    An Endur commodity swap: fixed price against the average of a floating index (or two indexes, a basis), month by month. One
    deal screen per ENDUR Commodity swap trade (matched on SOURCE_SYSTEM and PRODUCT_TYPE): the deal ticket (DES), the legs side
    by side, every cash flow in one schedule, the events by leg and as a table filtered by the Legs and Between controls, the
    netted payment ladder and payments by month, how the view was built and the linked entities (F7 opens the counterparty's
    trades). The strip gives the trade currency, side, notional, quantity, trade date, maturity, status and portfolio.
  params:
    legs: { type: text, default: all, meaning: "The Legs control: the legs whose events the table lists" }
    when: { type: text, default: '', meaning: "The Between control: the dates whose events the table lists" }
  emits: []
  expects: []
  examples:
    - "/v/trade/1000001"
    - "TRD 1000001"
  since: "2.7.0"
match: { kind: trade, where: "$.SOURCE_SYSTEM == 'ENDUR' && $.PRODUCT_TYPE == 'ComSwap'", priority: 10 }
title: { pill: "Commodity · Commodity swap", id: $.TRADE_ID, with: "link($.COUNTERPARTY, 'counterparty')" }
strip:
  - { label: Trade currency, bind: "nonblank($.RISK_LINKS.TRADE_CURRENCY) ? $.RISK_LINKS.TRADE_CURRENCY + ($.RISK_LINKS.TRADE_CURRENCY_FROM == 'its scenario PVs' ? ' · as priced' : ' · as booked') : nonblank($.CURRENCY, '–') + ' · as booked'" }
  - { label: Side, bind: "$.BUY_SELL_CODE == 'B' ? 'Buy' : ($.BUY_SELL_CODE == 'S' ? 'Sell' : nonblank($.BUY_SELL_CODE, '–'))" }
  - { label: Notional, bind: "$.CURRENCY + ' ' + fmt(first($.LEGS).NOTIONAL, 'amount0')", emphasis: true }
  - { label: Quantity, bind: "fmt($.QUANTITY, 'amount0') + (nonblank(first($.LEGS).PRICE_UNIT) ? ' ' + first($.LEGS).PRICE_UNIT : '')" }
  - { label: Trade date, bind: $.TRADE_DATE, fmt: date }
  - { label: Maturity, bind: $.MATURITY_DATE, fmt: date }
  - { label: Status, bind: "nonblank($.TRADE_STATUS, '–') + (nonblank($.TRADE_VERSION) ? ' v' + $.TRADE_VERSION : '')", tone: status }
  - { label: Portfolio, bind: "link($.PORTFOLIO, 'book')" }
controls:                       # the events by leg and by date: a trader's 'what is paid when, on which leg'
  - { id: legs, kind: multi-select, label: Legs, options: "$.LEGS[*].LEG_ID", default: all, placement: header, panel: event-list, remember: user }
  - { id: when, kind: date-range, label: Between, placement: header, panel: event-list }
panels:
  - { use: trading/deal-ticket@1, with: { rate-fmt: price4, product: "Commodity swap" } }
  - id: fixed-float
    kind: kv
    title: "Fixed against floating"
    code: SWAP
    when: "$.PRODUCT_SUB_TYPE == 'ENGY-SWAP'"
    columns:
      - { label: "Fixed price", bind: "$.LEGS[?@.LEG_TYPE == 'FIXED'][0].CASH_FLOWS[0].STRIKE_PRICE", fmt: price4 }
      - { label: "Floating index", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'FLOAT'][0].INDEX.NAME, '–')" }
      - { label: "Averaging", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'FLOAT'][0].RESET_CONVENTION, '–')" }
      - { label: "Price unit", bind: "nonblank($.LEGS[?@.LEG_TYPE == 'FIXED'][0].PRICE_UNIT, '–')" }
      - { label: "Periods", bind: "size($.LEGS[?@.LEG_TYPE == 'FIXED'][0].CASH_FLOWS)" }
  - id: basis
    kind: kv
    title: "Basis: one index against another"
    code: BAS
    when: "$.PRODUCT_SUB_TYPE == 'ENGY-B-SWAP'"
    columns:
      - { label: "Index, leg 1", bind: "nonblank($.LEGS[0].INDEX.NAME, '–')" }
      - { label: "Index, leg 2", bind: "nonblank($.LEGS[1].INDEX.NAME, '–')" }
      - { label: "Spread, leg 2", bind: "$.LEGS[1].FLOAT_SPREAD", fmt: price4 }
      - { label: "Location", bind: "nonblank($.LEGS[1].INDEX_LOCATION_NAME, '–')" }
      - { label: "Averaging", bind: "nonblank($.LEGS[0].RESET_CONVENTION, '–')" }
  - { use: trading/legs@1, with: { rate-fmt: price4 } }
  - { use: trading/flow-schedule@1, with: { rate-fmt: price4 } }
  - { use: trading/events@1 }
  - { use: trading/payments@1 }
  - { use: data-provenance@1 }
  - { use: risk-links@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.COUNTERPARTY, 'counterparty-trades')", F8: impact, F9: raw }
