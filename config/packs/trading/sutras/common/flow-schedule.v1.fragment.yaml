# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
fragment: flow-schedule
version: 1
description: "Every cash flow of every leg in one schedule."
params: { rate-fmt: price4 }
doc:
  summary: "Every cash flow of every leg in one schedule."
  description: >-
    Every cash flow of every leg in one schedule. Use it where a trader reads the whole schedule at once rather than leg by leg.
  params:
    rate-fmt: { type: format, default: price4, meaning: "The named format of rates and prices: pct4 for rates (a fraction a year), price4 for prices per unit" }
  emits: []
  expects: []
  examples:
    - { use: flow-schedule@1, with: { rate-fmt: pct4 } }
  since: "2.7.0"
panels:
  - id: flows
    kind: table
    title: Cash-flow schedule, every leg
    code: FLOWS
    key: F4
    rows: "flatten($.LEGS[*].CASH_FLOWS)"
    columns:
      - { label: Flow, bind: "@.FLOW_ID" }
      - { label: Start, bind: "@.START_DATE", fmt: date }
      - { label: End, bind: "@.END_DATE", fmt: date }
      - { label: Payment, bind: "@.PAYMENT_DATE", fmt: date }
      - { label: Fixing, bind: "nonblank(@.RATE_DETERMINATION_DATE, '–')" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: amount0, total: true }
      - { label: Rate / price, bind: "nonblank(@.RATE) ? @.RATE : (size(@.RESETS[?nonblank(@.RATE)]) > 0 ? sum(@.RESETS[?nonblank(@.RATE)], 'RATE') / size(@.RESETS[?nonblank(@.RATE)]) : '')", fmt: "%{rate-fmt}" }
      - { label: Resets, bind: "size(@.RESETS)" }
