doc:
  summary: "The payments of the next 7, 30 and 90 days as three metrics side by side, each with its count of events."
  description: >-
    Three metrics a third of the row each: the signed sum of the payments due in the next 7, 30 and 90 days (paid negative,
    received positive), each captioned with how many events it adds up. It reads PAY_7D, PAY_30D, PAY_90D and their _EVENTS
    counts, which the trading pack's derived connector computes over every member trade of a counterparty's, portfolio's, legal
    entity's or index's page. Use it first on any such page.
