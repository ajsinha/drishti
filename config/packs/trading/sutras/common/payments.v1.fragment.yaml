# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
fragment: payments
version: 1
description: "The netted payment ladder (cash events by date, paid below the line) and payments by month."
doc:
  summary: "The netted payment ladder (cash events by date, paid below the line) and payments by month."
  description: >-
    The netted payment ladder (cash events by date, paid below the line, received above) and the same payments by month, both on
    the right. Use it on any deal screen whose trade carries EVENTS with amounts and dates.
  params: {}
  emits: []
  expects: []
  examples:
    - { use: payments@1 }
  since: "2.7.0"
panels:
  - id: ladder
    kind: hbar
    title: Netted payments by date (paid − / received +)
    code: PAY
    key: F6
    area: right
    rows: "group($.EVENTS[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)], 'EVENT_DATE', 'AMOUNT')"
    fmt: signed0
    tone: sign
  - id: by-month
    kind: hbar
    title: Payments by month
    code: PAYM
    area: right
    rows: "group($.EVENTS[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)], 'EVENT_DATE', 'AMOUNT', 'month')"
    fmt: signed0
    tone: sign
