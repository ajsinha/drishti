# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
fragment: deal-ticket
version: 1
description: "The deal ticket (DES): deal, product, parties, dates and settlement, as a booking system's ticket groups them."
params: { rate-fmt: price4, product: '' }
doc:
  summary: "The deal ticket (DES): deal, product, parties, dates and settlement, as a booking system's ticket groups them."
  description: >-
    The deal ticket (DES) of a production-shaped trade, as a booking system's ticket groups it: the deal (trade id, version,
    status, source system, product type and sub type), the parties (counterparty, legal entity, trader, portfolio), the dates
    and the settlement, each a label and its value. Use it first on any deal screen of the trading pack's trade (the common
    UPPER_SNAKE trade schema).
  params:
    rate-fmt: { type: format, default: price4, meaning: "The named format of rates and prices: pct4 for rates (a fraction a year), price4 for prices per unit" }
    product: { type: text, default: '', meaning: "The product type in words (the Sutra's), shown on the ticket" }
  emits: []
  expects: []
  examples:
    - { use: deal-ticket@1, with: { rate-fmt: pct4, product: "Interest rate swap" } }
  since: "2.7.0"
panels:
  - id: ticket
    kind: kv
    title: Deal ticket
    code: DES
    key: F2
    columns:
      - { label: Trade id, bind: $.TRADE_ID }
      - { label: Transaction, bind: "nonblank($.TRANSACTION_ID, '–')" }
      - { label: Version, bind: "nonblank($.TRADE_VERSION, '–')" }
      - { label: Action, bind: "nonblank($.TRADE_ACTION, '–')" }
      - { label: Package, bind: "nonblank($.PACKAGE_ID, '–')" }
      - { label: Source system, bind: $.SOURCE_SYSTEM }
      - { label: Updated, bind: "nonblank($.SOURCE_UPDATE_TIME, '–')" }
      - { label: Product, bind: "nonblank('%{product}') ? '%{product} (' + $.PRODUCT_TYPE + ')' : $.PRODUCT_TYPE" }
      - { label: Sub type, bind: "nonblank($.PRODUCT_SUB_TYPE, '–')" }
      - { label: Group, bind: "nonblank($.PRODUCT_GROUP, '–') + \" / \" + nonblank($.PRODUCT_SUB_GROUP, '–')" }
      - { label: Option, bind: "nonblank($.OPTION_TYPE, '–')" }
      - { label: Strike, bind: $.STRIKE_PRICE, fmt: "%{rate-fmt}" }
      - { label: Price, bind: $.PRICE, fmt: "%{rate-fmt}" }
      - { label: Quantity, bind: $.QUANTITY, fmt: amount2 }
      - { label: Counterparty, bind: "link($.COUNTERPARTY, 'counterparty')" }
      - { label: UEN, bind: "nonblank($.COUNTERPARTY_UEN, '–')" }
      - { label: Country of risk, bind: "nonblank($.COUNTERPARTY_COUNTRY_OF_RISK, '–')" }
      - { label: Original counterparty, bind: "nonblank($.ORIGINAL_COUNTERPARTY) ? link($.ORIGINAL_COUNTERPARTY, 'counterparty') : '–'" }
      - { label: Internal / external, bind: "nonblank($.INTERNAL_EXTERNAL_CODE, '–')" }
      - { label: Legal entity, bind: "nonblank($.LEGAL_ENTITY) ? link($.LEGAL_ENTITY, 'legal-entity') : '–'" }
      - { label: Transit, bind: "nonblank($.TRANSIT, '–')" }
      - { label: Portfolio, bind: "link($.PORTFOLIO, 'book')" }
      - { label: Trader, bind: "link($.TRADER_ID, 'trader', nonblank($.TRADER_FIRST_NAME + ' ' + $.TRADER_LAST_NAME, $.TRADER_ID))" }
      - { label: Trade date, bind: $.TRADE_DATE, fmt: date }
      - { label: Input date, bind: "nonblank($.INPUT_DATE, '–')" }
      - { label: Start, bind: $.START_DATE, fmt: date }
      - { label: Maturity, bind: $.MATURITY_DATE, fmt: date }
      - { label: Settlement, bind: "nonblank($.SETTLEMENT_DATE, '–')" }
      - { label: Currency, bind: $.CURRENCY }
      - { label: DVP, bind: "nonblank($.DELIVERY_VERSUS_PAYMENT, '–')" }
      - { label: Book (TT), bind: "nonblank($.TT_BOOK, '–')" }
