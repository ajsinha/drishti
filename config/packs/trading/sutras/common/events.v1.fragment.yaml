# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
fragment: events
version: 1
description: "The events by leg (a timeline) and as a table filtered by the Sutra's legs and dates controls (ctl.legs, ctl.when)."
doc:
  summary: "The events by leg (a timeline) and as a table filtered by the Sutra's legs and dates controls (ctl.legs, ctl.when)."
  description: >-
    The trade's events by leg as a timeline (the event, its leg or the deal, its payment and amount), then as a table filtered
    by the Sutra's Legs and Between controls (ctl.legs, ctl.when): a Sutra using it declares those two controls with panel:
    event-list.
  params: {}
  emits: []
  expects: []
  examples:
    - { use: events@1 }
  since: "2.7.0"
panels:
  - id: events
    kind: timeline
    title: Events by leg
    code: EVT
    key: F5
    rows: "$.EVENTS[?nonblank(@.EVENT_DATE)]"
    date: EVENT_DATE
    label: "@.EVENT_TYPE + (nonblank(@.LEG_ID) ? ' · leg ' + @.LEG_ID : ' · deal')"
    detail: "nonblank(@.PAYMENT_TYPE, '') + (nonblank(@.AMOUNT) ? ' ' + @.CURRENCY + ' ' + fmt(@.AMOUNT, 'signed2') : '')"
  - id: event-list
    kind: table
    title: "Events${ctl.when ? ' · ' + ctl.when : ''}"
    code: EVTL
    rows: $.EVENTS
    where: "(!nonblank(@.LEG_ID) || oneOf(@.LEG_ID, ctl.legs)) && within(@.EVENT_DATE, ctl.when)"
    empty: No events booked
    columns:
      - { label: Leg, bind: "nonblank(@.LEG_ID, 'deal')" }
      - { label: Event, bind: "nonblank(@.EVENT_ID, '–')" }
      - { label: Type, bind: "nonblank(@.EVENT_TYPE, '–')" }
      - { label: Payment type, bind: "nonblank(@.PAYMENT_TYPE, '–')" }
      - { label: Date, bind: "nonblank(@.EVENT_DATE, '–')" }
      - { label: Amount, bind: "@.AMOUNT", fmt: signed2, tone: sign, total: true }
      - { label: Currency, bind: "nonblank(@.CURRENCY, '–')" }
