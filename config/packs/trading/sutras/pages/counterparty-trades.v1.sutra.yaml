# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: counterparty-trades
version: 1
description: "Every trade with a counterparty, from every source system: its trades (every status, a status filter), upcoming payments, notional by product type and index, maturities, payments by month."
match: { kind: counterparty-trades, priority: 10 }
title: { pill: "Counterparty trades", id: $.COUNTERPARTY, with: "link($.COUNTERPARTY, 'counterparty')" }
strip:
  - { label: Trades, bind: $.TRADE_COUNT, emphasis: true }
  - { label: Notional (all currencies), bind: $.NOTIONAL, fmt: compact }
  - { label: Source systems, bind: "size($.SOURCE_SYSTEMS)" }
  - { label: Product types, bind: "size($.PRODUCT_TYPES)" }
  - { label: Currencies, bind: "size($.CURRENCIES)" }
  - { label: Last maturity, bind: $.LAST_MATURITY, fmt: date }
controls:                       # which trades the table lists: every status by default, or only the live ones
  - { id: status, kind: multi-select, label: Status, options: "$.TRADES[*].TRADE_STATUS", default: all, placement: header, panel: trades, remember: user }
panels:
  - id: pay7
    kind: metric
    title: Payments, next 7 days
    value: "sum(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 7], 'AMOUNT')"
    fmt: signed0
    tone: sign
    caption: "${size(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 7])} events"
    span: 4
  - id: pay30
    kind: metric
    title: Payments, next 30 days
    value: "sum(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 30], 'AMOUNT')"
    fmt: signed0
    tone: sign
    caption: "${size(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 30])} events"
    span: 4
  - id: pay90
    kind: metric
    title: Payments, next 90 days
    value: "sum(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 90], 'AMOUNT')"
    fmt: signed0
    tone: sign
    caption: "${size(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 90])} events"
    span: 4
  - id: trades
    kind: table
    title: "Trades (${size($.TRADES[?oneOf(@.TRADE_STATUS, ctl.status)])} of ${$.TRADE_COUNT})"
    code: TRD
    where: "oneOf(@.TRADE_STATUS, ctl.status)"
    key: F2
    rows: $.TRADES
    pivot: { rows: [PRODUCT_TYPE], columns: [SOURCE_SYSTEM], values: [{ field: NOTIONAL, agg: sum }], filters: [CURRENCY] }
    columns:
      - { label: Trade, bind: "link(@.TRADE_ID, 'trade')" }
      - { label: Source, bind: "@.SOURCE_SYSTEM" }
      - { label: Product, bind: "@.PRODUCT_TYPE" }
      - { label: Side, bind: "@.BUY_SELL_CODE == 'B' ? 'Buy' : (@.BUY_SELL_CODE == 'S' ? 'Sell' : nonblank(@.BUY_SELL_CODE, '–'))" }
      - { label: Currency, bind: "@.CURRENCY" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: amount0, total: true }
      - { label: Index, bind: "nonblank(@.INDEX_NAME, '–')" }
      - { label: Maturity, bind: "@.MATURITY_DATE", fmt: date }
      - { label: Status, bind: "nonblank(@.TRADE_STATUS, '–')", tone: status }
  - id: upcoming
    kind: ladder
    title: Upcoming payments, next 90 days
    code: PAY
    key: F3
    rows: "flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0 && days(today(), @.EVENT_DATE) <= 90]"
    empty: No payments in the next 90 days
    columns:
      - { label: Date, bind: "@.EVENT_DATE", fmt: date }
      - { label: In days, bind: "days(today(), @.EVENT_DATE)" }
      - { label: Type, bind: "nonblank(@.PAYMENT_TYPE, @.EVENT_TYPE, '–')" }
      - { label: Leg, bind: "nonblank(@.LEG_ID, 'deal')" }
      - { label: Currency, bind: "@.CURRENCY" }
      - { label: Amount, bind: "@.AMOUNT", fmt: signed0, tone: sign, total: true }
  - id: by-product
    kind: hbar
    title: Notional by product type
    code: PROD
    key: F4
    area: right
    shape: donut
    rows: "group($.TRADES, 'PRODUCT_TYPE', 'NOTIONAL')"
    fmt: compact
  - id: by-index
    kind: hbar
    title: Notional by index
    code: IDX
    area: right
    rows: "group($.TRADES[?nonblank(@.INDEX_NAME)], 'INDEX_NAME', 'NOTIONAL')"
    fmt: compact
  - id: maturities
    kind: hbar
    title: Maturity ladder (notional by year)
    code: MAT
    key: F5
    area: right
    rows: "group($.TRADES, 'MATURITY_DATE', 'NOTIONAL', 'year')"
    fmt: compact
  - id: by-month
    kind: hbar
    title: Payments by month (paid − / received +)
    code: PAYM
    key: F6
    rows: "group(flatten($.TRADES[*].EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)], 'EVENT_DATE', 'AMOUNT', 'month')"
    fmt: signed0
    tone: sign
  - { id: built, kind: provenance, title: How this view was built }
keys: { F7: "link($.COUNTERPARTY, 'counterparty')", F9: raw }
