# Hand-written (RACHANA_REFERENCE.md › Sutra Next: fragments, events, children, sources, layout and forms, phases 2 and 3: events, sources over several packs, nested children). Not generated: the generator
# writes portfolio-trades only. Opened as /v/portfolio-trades/<book>?sutra=book-desk (portfolio-trades stays the book's page).
rachana: 1
sutra: book-desk
version: 1
description: "A book's desk: its trades; a click opens the trade's cash flows under its row, with the counterparty and its credit limit beside."
doc:
  summary: "A book's trades; a click opens a trade's cash flows under its row, its counterparty and credit limit beside"
  description: >-
    The trades of one book (portfolio) from every source system. Clicking a trade fires open with the trade's id and its
    counterparty: the trade's cash flows open under the row (read from the trade itself, trading pack), and the counterparty
    (core pack) and its credit limit with the utilisation by tenor bucket (counterparty-risk pack) fill the right column. A new
    click replaces them; until the first click the right column says what to do. Everything is read as the reader: a counterparty
    masked for the reader stays masked, and the counterparty and limit panels that would follow it say "hidden for you".
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/portfolio-trades/BOOK-RATES-2?sutra=book-desk"
  since: "2.7.0"
match: { kind: portfolio-trades, priority: 1 }
title: { pill: "Book desk", id: $.PORTFOLIO, with: "link($.PORTFOLIO, 'book')" }
strip:
  - { label: Trades, bind: $.TRADE_COUNT, emphasis: true }
  - { label: Notional (all currencies), bind: $.NOTIONAL, fmt: compact }
  - { label: Product types, bind: "size($.PRODUCT_TYPES)" }
  - { label: Last maturity, bind: $.LAST_MATURITY, fmt: date }
panels:
  - use: row-picker@1
    with: { id: trades, title: Trades of the book, rows: $.TRADES, event: open, key: TRADE_ID, key-label: Trade, ref: COUNTERPARTY,
            a: PRODUCT_TYPE, a-label: Product, b: COUNTERPARTY, b-label: Counterparty, amount: NOTIONAL, amount-label: Notional,
            date: MATURITY_DATE, date-label: Maturity, empty: No trades in this book, code: TRD }
    form:                                     # RACHANA_REFERENCE.md 10: edit a trade beside the table, start a new one in a drawer
      title: Edit trade
      key: trade_id
      edit: beside
      new: drawer
      new-label: New trade
      save:                                   # 2.8.0 write-back (WRITE_BACK.md 18.1): Submit sends a trade's correction, kept in Drishti
        kind: trade                           # over the booking system's value (an overlay), after one approver (never the submitter)
        target: overlay
        approval: one
        reason: required
      steps: [ { id: who, label: Who }, { id: what, label: What }, { id: check, label: Check } ]
      fields:
        - { id: trade_id, label: Trade, bind: TRADE_ID, readonly: true, reason: "set by the booking system", new: false }
        - id: counterparty
          label: Counterparty
          bind: COUNTERPARTY
          type: lookup
          required: true
          readonly: true
          step: who
          options:
            source: { pack: counterparty-risk, kind: credit-limit, where: "nonblank(@.COUNTERPARTY)" }
            value: COUNTERPARTY
            label: COUNTERPARTY_NAME
            carry: [LIMIT, USED]
        - { id: product_type, label: Product, bind: PRODUCT_TYPE, type: enum, options: [IRS, OIS, XCCY, FRA, ComSwap, Swaption], readonly: true,
            reason: "the product is fixed once booked", required: true, step: what }
        - id: legal_entity
          label: Booked in
          bind: LEGAL_ENTITY
          type: entity                        # a linked record of another pack's kind: its id kept, its name shown
          readonly: true
          reason: "the booking entity is fixed once booked"
          step: who
          options: { source: { pack: core, kind: legal-entity }, label: NAME }
        - { id: notional, label: Notional, bind: NOTIONAL, type: money, currency: currency, min: 0, required: true, fmt: amount0, step: what }
        - { id: currency, label: Currency, bind: CURRENCY, type: enum, options: [USD, EUR, GBP, JPY, CHF, CAD, AUD], step: what }
        - { id: upfront_fee, label: Upfront fee, bind: UPFRONT_FEE, type: money, currency: currency, min: 0, default: "=notional * 0.001",
            fmt: amount0, step: what }
        - { id: executed_at, label: Executed, bind: EXECUTED_AT, type: datetime, tz: Europe/London, step: what }
        - { id: maturity_date, label: Maturity, bind: MATURITY_DATE, type: date, min: today, required: true, step: what }
        - { id: trade_status, label: Status, bind: TRADE_STATUS, type: enum, options: [PENDING, VALIDATED, AMENDED], editable-by: [middle-office],
            new: false }
        - { id: comment, label: Comment, bind: COMMENT, type: textarea, max-length: 500, placeholder: Reason for the change, step: check }
      rules:
        - { rule: "notional <= 30000000", severity: warn, fields: [notional],
            message: "Above the desk limit of 30,000,000: a second approver is needed." }
        - { rule: "not (notional > 30000000 and empty(comment))", fields: [comment],
            message: "Say why the trade is above the desk limit: the second approver reads it." }
      hints:
        - { label: "PFE limit after this trade", value: "counterparty.USED + notional", of: "counterparty.LIMIT", fmt: amount0, step: what }
    children:
      - place: expand-row
        source: { pack: trading, kind: trade, id: "@parent.open.id" }
        waits: Pick a trade to see its cash flows
        panels:
          - use: cashflow-ladder@1
            with: { id: flows, title: "Cash flows of ${@parent.open.id}", rows: $src.EVENTS, date: EVENT_DATE, type: PAYMENT_TYPE, amount: AMOUNT }
  - id: counterparty
    kind: kv
    title: Counterparty
    area: right
    waits: Pick a trade to see its counterparty and credit limit
    source: { pack: core, kind: counterparty, id: "@trades.open.ref" }
    columns:
      - { label: Name, bind: $src.NAME }
      - { label: Rating, bind: $src.RATING }
      - { label: Sector, bind: $src.SECTOR }
      - { label: Country, bind: $src.COUNTRY }
  - id: limit
    kind: kv
    title: Credit limit
    area: right
    waits: Pick a trade to see its counterparty and credit limit
    source: { pack: counterparty-risk, kind: credit-limit, where: "@.COUNTERPARTY == @trades.open.ref", limit: 1 }
    columns:
      - { label: Measure, bind: "$src[0].MEASURE" }
      - { label: Limit, bind: "$src[0].LIMIT", fmt: compact }
      - { label: Used, bind: "$src[0].USED", fmt: compact }
      - { label: Utilisation, bind: "$src[0].UTILISATION", fmt: pct0 }
      - { label: Status, bind: "$src[0].STATUS", tone: status }
  - use: ranked-bars@1
    with: { id: buckets, title: Utilisation by tenor, rows: "$src[0].BUCKETS", label: BUCKET, value: UTILISATION, fmt: pct0, area: right }
    source: { pack: counterparty-risk, kind: credit-limit, where: "@.COUNTERPARTY == @trades.open.ref", limit: 1 }
    waits: Pick a trade to see its counterparty and credit limit
  - { use: data-provenance@1 }
