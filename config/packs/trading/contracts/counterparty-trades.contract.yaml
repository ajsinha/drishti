# Data contract of the counterparty-trades kind (command CTRD): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap counterparty-trades`; owned by people from then on: confirm the review points, then remove them.
kind: counterparty-trades
mnemonic: CTRD
pack: trading
version: '1.0'
class: computed
status: active
title: Counterparty trades (derived from trades)
description: 'Every trade with a counterparty, from every source system: its trades (every status, a status filter), upcoming payments, notional
  by product type and index, maturities, payments by month.'
source: 'computed by Drishti: the derived connector trade-pages over the kind trade'
grain: One record per COUNTERPARTY of the trade records, computed when asked.
key:
- COUNTERPARTY
dated-by: on request
cadence:
  frequency: on change
  due: recomputed from its source kind (connector refresh 60s)
storage:
  connector: trade-pages
  plugin: derived
fields:
- name: COUNTERPARTY
  type: id
  presence: required
  description: The value the trade records are grouped by ($.COUNTERPARTY)
  link: counterparty
- name: TRADE_IDS
  type: id list
  presence: derived
  description: The ids of the grouped trade records (at most 1000)
- name: TRADE_COUNT
  type: integer
  presence: optional
  description: The number of records in the group
- name: NOTIONAL
  type: amount
  presence: optional
  description: 'sum over the group of: first($.LEGS).NOTIONAL'
- name: SOURCE_SYSTEMS
  type: text list
  presence: optional
  description: 'distinct over the group of: $.SOURCE_SYSTEM'
- name: PRODUCT_TYPES
  type: text list
  presence: optional
  description: 'distinct over the group of: $.PRODUCT_TYPE'
- name: CURRENCIES
  type: text list
  presence: optional
  description: 'distinct over the group of: $.CURRENCY'
- name: LAST_MATURITY
  type: date
  presence: optional
  description: 'max over the group of: $.MATURITY_DATE'
- name: PAY_7D
  type: amount
  presence: optional
  description: 'sum over the group of: sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 7], ''AMOUNT'')'
- name: PAY_7D_EVENTS
  type: amount
  presence: optional
  description: 'sum over the group of: size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 7])'
- name: PAY_30D
  type: amount
  presence: optional
  description: 'sum over the group of: sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 30], ''AMOUNT'')'
- name: PAY_30D_EVENTS
  type: amount
  presence: optional
  description: 'sum over the group of: size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 30])'
- name: PAY_90D
  type: amount
  presence: optional
  description: 'sum over the group of: sum(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 90], ''AMOUNT'')'
- name: PAY_90D_EVENTS
  type: amount
  presence: optional
  description: 'sum over the group of: size(flatten($.EVENTS)[?nonblank(@.AMOUNT) && nonblank(@.EVENT_DATE)][?days(today(), @.EVENT_DATE) >= 0
    && days(today(), @.EVENT_DATE) <= 90])'
- name: TRADES
  type: record list
  presence: derived
  description: One row per grouped trade record
nested:
  TRADES[]:
  - name: TRADE_ID
    type: unknown
    presence: optional
    description: 'From the trade record: $.TRADE_ID'
    link: trade
  - name: SOURCE_SYSTEM
    type: unknown
    presence: optional
    description: 'From the trade record: $.SOURCE_SYSTEM'
  - name: PRODUCT_TYPE
    type: unknown
    presence: optional
    description: 'From the trade record: $.PRODUCT_TYPE'
  - name: BUY_SELL_CODE
    type: unknown
    presence: optional
    description: 'From the trade record: $.BUY_SELL_CODE'
  - name: CURRENCY
    type: unknown
    presence: optional
    description: 'From the trade record: $.CURRENCY'
  - name: NOTIONAL
    type: unknown
    presence: optional
    description: 'From the trade record: first($.LEGS).NOTIONAL'
  - name: MATURITY_DATE
    type: unknown
    presence: optional
    description: 'From the trade record: $.MATURITY_DATE'
  - name: TRADE_STATUS
    type: unknown
    presence: optional
    description: 'From the trade record: $.TRADE_STATUS'
  - name: INDEX_NAME
    type: unknown
    presence: optional
    description: 'From the trade record: nonblank($.LEGS[0].INDEX.NAME, $.LEGS[1].INDEX.NAME, '''')'
  - name: COUNTERPARTY
    type: unknown
    presence: optional
    description: 'From the trade record: $.COUNTERPARTY'
    link: counterparty
  - name: PORTFOLIO
    type: unknown
    presence: optional
    description: 'From the trade record: $.PORTFOLIO'
    link: book
  - name: LEGAL_ENTITY
    type: unknown
    presence: optional
    description: 'From the trade record: $.LEGAL_ENTITY'
    link: legal-entity
  - name: EVENTS
    type: unknown
    presence: optional
    description: 'From the trade record: $.EVENTS'
links:
- field: COUNTERPARTY
  kind: counterparty
- field: TRADES[].TRADE_ID
  kind: trade
- field: TRADES[].COUNTERPARTY
  kind: counterparty
- field: TRADES[].PORTFOLIO
  kind: book
- field: TRADES[].LEGAL_ENTITY
  kind: legal-entity
validation:
- rule: required
  fields:
  - COUNTERPARTY
- rule: unique
  key:
  - COUNTERPARTY
  per: snapshot
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: link
  field: TRADES[].TRADE_ID
  kind: trade
- rule: link
  field: TRADES[].COUNTERPARTY
  kind: counterparty
- rule: link
  field: TRADES[].PORTFOLIO
  kind: book
- rule: link
  field: TRADES[].LEGAL_ENTITY
  kind: legal-entity
notes: []
review:
- 'field types of a derived kind are read from its connector''s expressions (count, sum, distinct): confirm; rows copy the trade record''s fields,
  whose contract states their types.'
