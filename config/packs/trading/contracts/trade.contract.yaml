notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'Several source systems: the connector trade-endur and trade-calypso, trade-murex each serve this kind from a table of their own with the same
  layout; the storage above is the first one''s.'
- '1.1: TRADE_VERSION is any version number (the enum inferred from a sample is gone); LEGS[].FLOAT_SPREAD, LEGS[].CASH_FLOWS[].RATE, LEGS[].CASH_FLOWS[].FLOAT_SPREAD and LEGS[].CASH_FLOWS[].RESETS[].RATE are numbers (rate); some extracts write them as numeric text.'
review:
- 'required inferred from 100% coverage in 2763 documents (765 samples and 1998 test-data documents (data/testdata/trades/endur/snapshot-2026-07-08.jsonl.gz,
  data/testdata/trades/calypso/snapshot-2026-07-08.jsonl.gz, data/testdata/trades/murex/snapshot-2026-07-08.jsonl.gz)): confirm each required
  field is mandatory upstream, and each optional one may be empty.'
- 'source ''murex, calypso'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'the id pattern ^(MX|CLY)-\d+$ does not match every TRADE_ID in the data (for example 1000001): widen the pattern or state the id rule.'
- 'enum values inferred from the data, not from a glossary: SOURCE_SYSTEM, TRADE_STATUS, TRADE_ACTION, TRADE_VERSION, BUY_SELL_CODE, OPTION_TYPE,
  INTERNAL_EXTERNAL_CODE, TRANSIT, CURRENCY, DELIVERY_VERSUS_PAYMENT, VAULT_LOCATION_ALLOCATION, LEASE_PERPETUITY_FLAG, LEGS[].LEG_TYPE, LEGS[].LEG_ECONOMIC_TYPE,
  LEGS[].CURRENCY, LEGS[].RESET_FIXING_SHIFT, LEGS[].RESET_HOLIDAY_SCHEDULE, LEGS[].RESET_CONVENTION, LEGS[].SETTLEMENT_TYPE, EVENTS[].CURRENCY:
  confirm they are closed lists.'
- 'number types decided by the field''s name: PRICE amount, STRIKE_PRICE rate, LEGS[].NOTIONAL amount, LEGS[].CASH_FLOWS[].NOTIONAL amount, LEGS[].CASH_FLOWS[].STRIKE_PRICE
  rate, EVENTS[].AMOUNT amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts QUANTITY, PRICE, LEGS[].NOTIONAL, LEGS[].CASH_FLOWS[].NOTIONAL, LEGS[].CASH_FLOWS[].RESETS[].ACCRUAL, EVENTS[].AMOUNT
  (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
