# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1.2
sutra: ccp
version: 1
description: A clearing house with its default fund and margin model.
doc:
  summary: "A clearing house with its default fund and margin model."
  description: >-
    A clearing house with its default fund and margin model. One page per central counterparty, its panels: clearing accounts;
    how the view was built. The strip gives Name, Default fund, IM posted and Model.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/ccp/CCP-CME"
    - "CCP CCP-CME"
  category: "Counterparty and legal"
  tags: ["ccp", "counterparty-and-legal", "table"]
  use-when: "You have one central counterparty (its id, or a link from another screen) and want to read it in full: A clearing house with its default fund and margin model."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One central counterparty record (kind ccp); the page reads CCP_ID, NAME, DEFAULT_FUND, IM_POSTED, MARGIN_MODEL, ACCOUNTS."
    sample-row: {"CCP_ID": "CCP-CME", "NAME": "CME Clearing", "DEFAULT_FUND": 720000000.0, "IM_POSTED": 43200000, "MARGIN_MODEL": "SPAN 2"}
  example: "CCP CCP-CME"
  keywords: ["ccp", "central counterparty", "counterparty and legal"]
  since: "2.7.0"
match: { kind: ccp, priority: 10 }
title: { pill: Counterparty and legal · Central counterparty, id: $.CCP_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Default fund, bind: $.DEFAULT_FUND, fmt: compact }
  - { label: IM posted, bind: $.IM_POSTED, fmt: compact, emphasis: true }
  - { label: Model, bind: $.MARGIN_MODEL }
panels:
  - id: accounts
    kind: table
    title: Clearing accounts
    key: F2
    rows: $.ACCOUNTS
    columns:
      - { label: Account, bind: "@.ID", link: true }
      - { label: IM, bind: "@.IM", fmt: compact, total: true }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
