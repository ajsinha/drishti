# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: trader
version: 1
description: A trader and their books.
doc:
  summary: "A trader and their books."
  description: >-
    A trader and their books. One page per trader, its panels: books; how the view was built; the entities it links to. The
    strip gives Name, Desk and Trades. Linked entities: desk (desk).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/trader/TRDR-ASHAH"
    - "TRDR TRDR-ASHAH"
  since: "2.7.0"
match: { kind: trader, priority: 10 }
title: { pill: Organisation · Trader, id: $.TRADER_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Desk, bind: $.DESK_NAME }
  - { label: Trades, bind: $.TRADE_COUNT, emphasis: true }
panels:
  - id: books
    kind: table
    title: Books
    key: F2
    rows: $.BOOKS
    columns:
      - { label: Book, bind: "@.ID", link: true }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.DESK, 'desk')", F8: impact, F9: raw }
