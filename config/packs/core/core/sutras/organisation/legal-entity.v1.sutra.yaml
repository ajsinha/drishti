# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: legal-entity
version: 1
description: "The bank's own booking entity."
doc:
  summary: "The bank's own booking entity."
  description: >-
    The bank's own booking entity. One page per bank legal entity, its panels: desks; risk and return (books: VaR against
    today's P&L, USD); how the view was built. The strip gives Name, LEI, Jurisdiction, Regulator and VaR 99% 1D (engine).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/legal-entity/LE-FRA"
    - "LE LE-FRA"
  since: "2.7.0"
match: { kind: legal-entity, priority: 10 }
title: { pill: Organisation · Bank legal entity, id: $.ENTITY_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: LEI, bind: $.LEI }
  - { label: Jurisdiction, bind: $.JURISDICTION }
  - { label: Regulator, bind: $.REGULATOR }
  - { label: VaR 99% 1D (engine), bind: $.VAR_ENGINE.VAR, fmt: compact, emphasis: true }
panels:
  - id: desks
    kind: table
    title: Desks
    key: F2
    rows: $.DESKS
    columns:
      - { label: Desk, bind: "@.ID", link: true }
      - { label: Name, bind: "@.NAME" }
  - id: riskReturn
    kind: scatter
    title: "Risk and return (books: VaR against today's P&L, USD)"
    code: RR
    key: F3
    rows: $.VAR_ENGINE.BOOKS
    x: VAR
    y: PNL
    label: BOOK
    fmt: signed0
    size: TRADES
    group: DESK
    xFmt: compact
    xLabel: VaR 99% 1D (USD)
    yLabel: "P&L 1D (USD)"
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
