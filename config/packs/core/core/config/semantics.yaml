# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# How banking field names read as labels, and what they hold (tried before the core roles: formats for drafted screens).
roles:
- role: signed-money
  pattern: (^|_)(mtm|npv|pv)$|^(mtm|npv|pv)|market_?value|fair_?value
  fmt: signed0
  tone: sign
  weight: 90
- role: money
  pattern: notional|principal|nominal|premium|exposure|face_?(value|amount)
  fmt: amount0
  weight: 80
- role: rate
  pattern: rate$|spread$|coupon|yield
  fmt: pct4
  weight: 70
  fractionOnly: true
- role: price
  pattern: price$|strike|fixing|rate$|spread$|(^|_)px$
  fmt: price4
  weight: 75
