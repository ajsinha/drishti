# Data contract of the book kind (command BOOK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap book`; owned by people from then on: confirm the review points, then remove them.
kind: book
mnemonic: BOOK
pack: core
version: '1.1'
class: fundamental
status: active
title: Book
description: 'A trading book: owner desk, trades and risk.'
source: org-master
grain: One row per book per business date, keyed by BOOK_ID.
key:
- BOOK_ID
id-pattern:
- ^BOOK-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
binding-hint:
  lake-table: reference.book
  test-data:
  - data/testdata/core/book
fields:
- name: BOOK_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: BOOK-COMM-1
  pattern: ^BOOK-
  link: path-book
- name: NAME
  type: text
  presence: required
  description: 'The book''s display name: its desk''s name and the book''s number (Commodities · book 1).'
  example: Commodities · book 1
- name: DESK_NAME
  type: text
  presence: derived
  description: 'The name of the desk the book sits under (the desk''s NAME).'
  example: Commodities
  note: 'the NAME of the book''s DESK, looked up by Drishti; a master file does not carry it'
- name: TRADE_COUNT
  type: integer
  presence: derived
  description: 'How many trades are booked in the book.'
  example: 28
  note: 'a roll-up Drishti computes from the book''s trade valuations; a master file does not carry it and an upstream value is ignored'
- name: MTM
  type: amount
  presence: derived
  unit: 'USD'
  description: 'The sum of the MTM of the book''s trades, in the bank''s reporting currency (USD in the demo).'
  example: 7760837
  note: 'a roll-up Drishti computes from the book''s trade valuations; a master file does not carry it and an upstream value is ignored'
- name: DV01
  type: amount
  presence: derived
  unit: 'USD per bp'
  description: 'The sum of the DV01 of the book''s trades: the change in value for a one basis point rise in rates, in the bank''s reporting currency (USD in the demo) per bp; negative loses when rates rise.'
  example: 0
  note: 'a roll-up Drishti computes from the book''s sensitivities; a master file does not carry it and an upstream value is ignored'
- name: TOP_TRADES
  type: record list
  presence: derived
  description: 'The book''s largest trades by absolute MTM, at most ten: one object per trade, largest first.'
  note: 'a roll-up Drishti computes from the book''s trade valuations; a master file does not carry it and an upstream value is ignored'
- name: DESK
  type: id
  presence: required
  description: 'The desk the book sits under: a DESK_ID of the core pack''s desk kind (DESK-…).'
  example: DESK-COMM
  pattern: ^DESK-
  link: desk
- name: ACCOUNTING_TREATMENT
  type: text
  presence: optional
  description: 'The accounting classification of the book''s positions, e.g. Fair value (FVTPL).'
  example: Fair value (FVTPL)
- name: REGULATORY_BOOK
  type: text
  presence: optional
  description: 'Trading book or banking book, as the book is classified for regulatory capital.'
  example: Trading book
- name: VOLCKER
  type: text
  presence: optional
  description: 'The book''s Volcker-rule permitted activity (e.g. Market making).'
  example: Market making
nested:
  TOP_TRADES[]:
  - name: TRADE_ID
    type: id
    presence: required
    description: 'The trade: a TRADE_ID of the trading pack''s trade kind (text).'
    example: MX-20000340
    link: trade
  - name: STATUS
    type: text
    presence: required
    description: 'The trade''s life-cycle status (NEW, VALIDATED, AMENDED, ...), upper case.'
    example: LIVE
  - name: PRODUCT
    type: text
    presence: required
    description: 'The trade''s product name (Calendar spread, Interest rate swap …).'
    example: Calendar spread
  - name: ASSET_CLASS
    type: text
    presence: required
    description: 'The trade''s asset class (Rates, FX, Credit, Equity, Commodity, Inflation, Fixed income, Money market, Securities financing, Structured).'
    example: Commodity
  - name: CURRENCY
    type: text
    presence: required
    description: 'The trade''s currency, ISO 4217.'
    example: USD
  - name: BOOK
    type: id
    presence: required
    description: 'The book the trade is held in (a BOOK_ID of this pack).'
    example: BOOK-COMM-1
  - name: NOTIONAL
    type: amount
    presence: required
    unit: 'trade currency'
    description: 'The trade''s notional, in the trade''s own currency.'
    example: 143000000.0
  - name: MATURITY
    type: date
    presence: required
    description: 'The trade''s maturity date.'
    example: '2026-10-07'
  - name: MATURITY_BUCKET
    type: text
    presence: required
    description: 'The remaining maturity bucket of the trade: 0-1Y, 1-2Y, 2-5Y, 5-10Y or 10Y+.'
    example: 0-1Y
  - name: MTM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The trade''s MTM, in the bank''s reporting currency (USD in the demo).'
    example: 3656838
links:
- field: BOOK_ID
  kind: path-book
- field: DESK
  kind: desk
- field: TOP_TRADES[].TRADE_ID
  kind: trade
validation:
- rule: required
  fields:
  - BOOK_ID
  - NAME
  - DESK
- rule: unique
  key:
  - BOOK_ID
  per: business_date
- rule: pattern
  field: BOOK_ID
  pattern: ^BOOK-
- rule: link
  field: BOOK_ID
  kind: path-book
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: TOP_TRADES[].TRADE_ID
  kind: trade
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 90 documents (30 samples and 60 test-data documents (data/testdata/core/book/book.2026-07-08.jsonl.gz,
  data/testdata/core/book/book.2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source ''org-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: TOP_TRADES[].STATUS, TOP_TRADES[].CURRENCY, TOP_TRADES[].MATURITY_BUCKET: confirm
  they are closed lists.'
- 'number types decided by the field''s name: MTM amount, DV01 amount, TOP_TRADES[].NOTIONAL amount, TOP_TRADES[].MTM amount: confirm amount,
  rate or integer.'
- 'no unit stated for the amounts MTM, DV01, TOP_TRADES[].NOTIONAL, TOP_TRADES[].MTM (docs/contracts/README.md section 7: USD unless stated):
  confirm the currency.'
