# Data contract of the book kind (command BOOK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap book`; owned by people from then on: confirm the review points, then remove them.
kind: book
mnemonic: BOOK
pack: core
version: '1.0'
class: fundamental
status: active
title: Book
description: 'A trading book: owner desk, trades and risk.'
source: org-master
grain: One row per book per business date, keyed by BOOK_ID.
key:
- BOOK_ID
id-pattern:
- ^BOOK-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/book/
  test-data:
  - data/testdata/core/book
fields:
- name: BOOK_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: BOOK-COMM-1
  pattern: ^BOOK-
  link: path-book
- name: NAME
  type: text
  presence: required
  description: Name
  example: Commodities · book 1
- name: DESK_NAME
  type: text
  presence: required
  description: Desk
  example: Commodities
- name: TRADE_COUNT
  type: integer
  presence: derived
  description: Trades
  example: 28
  retiring-in: 2.8.0
  note: computed by the scope engine (counts, MtM and DV01 summed from the trades and their valuations) from 2.8.0; removed from the stored record
    then
- name: MTM
  type: amount
  presence: derived
  description: MTM
  example: 7760837
  retiring-in: 2.8.0
  note: computed by the scope engine (counts, MtM and DV01 summed from the trades and their valuations) from 2.8.0; removed from the stored record
    then
- name: DV01
  type: amount
  presence: derived
  description: DV01
  example: 0
  retiring-in: 2.8.0
  note: computed by the scope engine (counts, MtM and DV01 summed from the trades and their valuations) from 2.8.0; removed from the stored record
    then
- name: TOP_TRADES
  type: record list
  presence: derived
  description: 'Nested: see nested TOP_TRADES[]'
  retiring-in: 2.8.0
  note: computed by the scope engine (counts, MtM and DV01 summed from the trades and their valuations) from 2.8.0; removed from the stored record
    then
- name: DESK
  type: id
  presence: required
  description: 'Desk: the desk it refers to'
  example: DESK-COMM
  pattern: ^DESK-
  link: desk
- name: ACCOUNTING_TREATMENT
  type: text
  presence: required
  example: Fair value (FVTPL)
- name: REGULATORY_BOOK
  type: text
  presence: required
  example: Trading book
- name: VOLCKER
  type: text
  presence: required
  example: Market making
nested:
  TOP_TRADES[]:
  - name: TRADE_ID
    type: id
    presence: required
    description: Trade
    example: MX-20000340
    pattern: ^(MX|CLY)-\d+$
    link: trade
  - name: STATUS
    type: text
    presence: required
    example: LIVE
    enum:
    - AMENDED
    - LIVE
    - NEW
    - VALIDATED
  - name: PRODUCT
    type: text
    presence: required
    description: Product
    example: Calendar spread
  - name: ASSET_CLASS
    type: text
    presence: required
    example: Commodity
  - name: CURRENCY
    type: text
    presence: required
    example: USD
    enum:
    - AUD
    - CAD
    - CHF
    - EUR
    - GBP
    - JPY
    - USD
  - name: BOOK
    type: id
    presence: required
    example: BOOK-COMM-1
  - name: NOTIONAL
    type: amount
    presence: required
    description: Notional
    example: 143000000.0
  - name: MATURITY
    type: date
    presence: required
    description: Maturity
    example: '2026-10-07'
  - name: MATURITY_BUCKET
    type: text
    presence: required
    example: 0-1Y
    enum:
    - 0-1Y
    - 1-2Y
    - 10Y+
    - 2-5Y
    - 5-10Y
  - name: MTM
    type: amount
    presence: required
    description: MTM
    example: 3656838
links:
- field: BOOK_ID
  kind: path-book
- field: DESK
  kind: desk
- field: TOP_TRADES[].TRADE_ID
  kind: trade
validation:
- rule: required
  fields:
  - BOOK_ID
  - NAME
  - DESK_NAME
  - DESK
  - ACCOUNTING_TREATMENT
  - REGULATORY_BOOK
  - VOLCKER
- rule: unique
  key:
  - BOOK_ID
  per: business_date
- rule: pattern
  field: BOOK_ID
  pattern: ^BOOK-
- rule: link
  field: BOOK_ID
  kind: path-book
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: TOP_TRADES[].TRADE_ID
  kind: trade
- rule: enum
  field: TOP_TRADES[].STATUS
  values:
  - AMENDED
  - LIVE
  - NEW
  - VALIDATED
- rule: enum
  field: TOP_TRADES[].CURRENCY
  values:
  - AUD
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- rule: enum
  field: TOP_TRADES[].MATURITY_BUCKET
  values:
  - 0-1Y
  - 1-2Y
  - 10Y+
  - 2-5Y
  - 5-10Y
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'Terms kept, figures computed from 2.8.0 (docs/contracts/VAR.md): the fields marked derived are computed by the scope engine (counts, MtM and
  DV01 summed from the trades and their valuations) and leave the stored record then.'
review:
- 'required inferred from 100% coverage in 90 documents (30 samples and 60 test-data documents (data/testdata/core/book/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/book/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source ''org-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: TOP_TRADES[].STATUS, TOP_TRADES[].CURRENCY, TOP_TRADES[].MATURITY_BUCKET: confirm
  they are closed lists.'
- 'number types decided by the field''s name: MTM amount, DV01 amount, TOP_TRADES[].NOTIONAL amount, TOP_TRADES[].MTM amount: confirm amount,
  rate or integer.'
- 'no unit stated for the amounts MTM, DV01, TOP_TRADES[].NOTIONAL, TOP_TRADES[].MTM (docs/contracts/README.md section 7: USD unless stated):
  confirm the currency.'
- 'no description in about.yaml or the Sutras for ACCOUNTING_TREATMENT, REGULATORY_BOOK, VOLCKER, TOP_TRADES[].STATUS, TOP_TRADES[].ASSET_CLASS,
  TOP_TRADES[].CURRENCY, TOP_TRADES[].BOOK, TOP_TRADES[].MATURITY_BUCKET: write them in the pack''s config/about.yaml glossary.'
