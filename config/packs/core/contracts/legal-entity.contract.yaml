# Data contract of the legal-entity kind (command LE): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap legal-entity`; owned by people from then on: confirm the review points, then remove them.
kind: legal-entity
mnemonic: LE
pack: core
version: '1.0'
class: fundamental
status: active
title: Bank legal entity
description: The bank's own booking entity.
source: entity-master
grain: One row per bank legal entity per business date, keyed by ENTITY_ID.
key:
- ENTITY_ID
id-pattern:
- ^LE-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/legal-entity/
  test-data:
  - data/testdata/core/legal-entity
fields:
- name: ENTITY_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: LE-FRA
  pattern: ^LE-
- name: NAME
  type: text
  presence: required
  description: 'The legal entity''s registered name.'
  example: Drishti Bank Europe AG
  enum:
  - Drishti Bank Europe AG
  - Drishti Bank Securities Inc.
  - Drishti Bank plc
  - Drishti Securities Japan K.K.
- name: LEI
  type: text
  presence: required
  description: 'The entity''s Legal Entity Identifier: 20 characters, ISO 17442.'
  example: 549300Z9DXU4T18OK744
  enum:
  - 549300BLAOJ55ZE6F474
  - 549300O1N13GO2II2096
  - 549300Z8F6KKOGHS7Q83
  - 549300Z9DXU4T18OK744
- name: JURISDICTION
  type: id
  presence: required
  description: 'The country the entity is incorporated and regulated in, ISO 3166-1 alpha-2.'
  example: DE
  link: jurisdiction
- name: REGULATOR
  type: text
  presence: required
  description: 'The entity''s prudential and conduct regulators, separated by '' / '' (ECB / BaFin, PRA / FCA …).'
  example: ECB / BaFin
  enum:
  - ECB / BaFin
  - JFSA
  - PRA / FCA
  - SEC / CFTC / FINRA
- name: DESKS
  type: record list
  presence: required
  description: 'The desks that book in the entity: one object per desk.'
- name: BOOKS
  type: record list
  presence: required
  description: 'The books of those desks that hold trades: one object per book, with its P&L, MTM and trade count.'
nested:
  DESKS[]:
  - name: ID
    type: id
    presence: required
    description: 'The desk: a DESK_ID of the core pack''s desk kind (DESK-…).'
    example: DESK-SFT
  - name: NAME
    type: text
    presence: required
    description: 'The desk''s name (its desk NAME).'
    example: Repo and securities lending
  BOOKS[]:
  - name: BOOK
    type: id
    presence: required
    description: 'The book: a BOOK_ID of the core pack''s book kind (BOOK-…).'
    example: BOOK-SFT-1
    pattern: ^BOOK-
    link: book
  - name: DESK
    type: id
    presence: required
    description: 'The NAME of the book''s desk (a name such as Repo and securities lending, not a DESK_ID, although the contract links it to desk).'
    example: Repo and securities lending
    link: desk
  - name: PNL
    type: amount
    presence: required
    unit: 'USD'
    description: 'The book''s one-day P&L: the sum of its trades'' PNL_1D, gain positive.'
    example: -327989
  - name: MTM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The book''s mark to market: the sum of its trades'' MTM, from the bank''s side (positive is owed to the bank).'
    example: 8879873
  - name: TRADES
    type: integer
    presence: required
    description: 'The number of trades in the book.'
    example: 17
links:
- field: JURISDICTION
  kind: jurisdiction
- field: BOOKS[].BOOK
  kind: book
- field: BOOKS[].DESK
  kind: desk
validation:
- rule: required
  fields:
  - ENTITY_ID
  - NAME
  - LEI
  - JURISDICTION
  - REGULATOR
  - DESKS
  - BOOKS
- rule: unique
  key:
  - ENTITY_ID
  per: business_date
- rule: pattern
  field: ENTITY_ID
  pattern: ^LE-
- rule: enum
  field: NAME
  values:
  - Drishti Bank Europe AG
  - Drishti Bank Securities Inc.
  - Drishti Bank plc
  - Drishti Securities Japan K.K.
- rule: enum
  field: LEI
  values:
  - 549300BLAOJ55ZE6F474
  - 549300O1N13GO2II2096
  - 549300Z8F6KKOGHS7Q83
  - 549300Z9DXU4T18OK744
- rule: link
  field: JURISDICTION
  kind: jurisdiction
- rule: enum
  field: REGULATOR
  values:
  - ECB / BaFin
  - JFSA
  - PRA / FCA
  - SEC / CFTC / FINRA
- rule: link
  field: BOOKS[].BOOK
  kind: book
- rule: link
  field: BOOKS[].DESK
  kind: desk
notes:
- 'The legal entity''s VaR and its books'' are the VaR engine''s (LE:<id>, BOOK:<id>), computed as the page opens (VAR_ENGINE); BOOKS[].VAR
  left the record in 2.9.2 (a stored figure, never the engine''s).'
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 12 documents (4 samples and 8 test-data documents (data/testdata/core/legal-entity/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/legal-entity/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may
  be empty.'
- 'source ''entity-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: NAME, LEI, REGULATOR: confirm they are closed lists.'
- 'number types decided by the field''s name: BOOKS[].PNL amount, BOOKS[].MTM amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts BOOKS[].PNL, BOOKS[].MTM (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
