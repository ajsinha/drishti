# Data contract of the counterparty kind (command CPTY): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap counterparty`; owned by people from then on: confirm the review points, then remove them.
kind: counterparty
mnemonic: CPTY
pack: core
version: '1.0'
class: fundamental
status: active
title: Counterparty
description: 'A legal entity the bank trades with: identifiers (LEI, UEN), rating, sector, country of risk and parent group.'
source: counterparty-master
grain: One row per counterparty per business date, keyed by COUNTERPARTY_ID.
key:
- COUNTERPARTY_ID
id-pattern:
- ^CP-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/counterparty/
  test-data:
  - data/testdata/core/counterparty
fields:
- name: COUNTERPARTY_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: CP-ALDERSHOT
  pattern: ^CP-
- name: NAME
  type: text
  presence: required
  description: Name
  example: Aldershot Pension Trust
- name: LEI
  type: text
  presence: required
  description: LEI
  example: 549300H5KZ2QJHEAMB55
- name: RATING
  type: text
  presence: required
  description: Rating
  example: AA-
- name: SECTOR
  type: text
  presence: required
  description: Sector
  example: Pensions
- name: COUNTRY
  type: text
  presence: required
  example: GB
- name: TYPE
  type: text
  presence: required
  description: Type
  example: Pension fund
- name: COUNTRY_OF_RISK
  type: text
  presence: required
  description: Country of risk
  example: GB
- name: UEN
  type: text
  presence: required
  description: UEN
  example: UEN0100037
- name: ECONOMY
  type: id
  presence: required
  description: 'Economy: the economy it refers to'
  example: ECON-GBR
  pattern: ^ECON-
  link: economy
- name: NEWS_ID
  type: id
  presence: required
  description: 'Headlines: the news it refers to'
  example: NEWS-Aldershot_Pension_Trust
  pattern: ^NEWS-
  link: news
- name: NET_MTM
  type: amount
  presence: required
  description: Net MTM
  example: 15036789
- name: PFE_PEAK
  type: amount
  presence: required
  example: 145548971
- name: NETTING_SETS
  type: record list
  presence: required
  description: 'Netting set: the netting-set it refers to'
  link: netting-set
- name: KYC
  type: record
  presence: required
  description: 'Nested: see nested KYC'
- name: GROUP
  type: id
  presence: required
  description: 'Group: the counterparty-group it refers to'
  example: GRP-ALDERSHOT
  pattern: ^GRP-
  link: counterparty-group
- name: CREDIT_LIMIT
  type: id
  presence: required
  description: 'Credit limit: the credit-limit it refers to'
  example: LIM-ALDERSHOT
  pattern: ^LIM-
  link: credit-limit
- name: HIERARCHY
  type: record
  presence: required
  description: 'Nested: see nested HIERARCHY'
- name: CREDIT_CURVE
  type: id
  presence: optional
  description: 'Credit curve: the credit-curve it refers to'
  example: CDS-CASCADIA
  pattern: ^CDS-
  link: credit-curve
- name: LEGAL_ENTITY
  type: id
  presence: optional
  description: 'Legal entity: the legal-entity it refers to'
  example: LE-NY
  pattern: ^LE-
  link: legal-entity
nested:
  NETTING_SETS[]:
  - name: ID
    type: id
    presence: required
    description: Netting set
    example: NS-ALDERSHOT-FRA
  - name: AGREEMENT
    type: id
    presence: required
    description: Agreement
    example: AGR-ALDERSHOT-ISDA
    pattern: ^AGR-
    link: agreement
  - name: TRADES
    type: integer
    presence: required
    description: Trades
    example: 3
  - name: NET_MTM
    type: amount
    presence: required
    description: Net MTM
    example: -339550
  KYC:
  - name: STATUS
    type: text
    presence: required
    description: Status
    example: Approved
  - name: RISK_RATING
    type: text
    presence: required
    description: Risk rating
    example: Standard
    enum:
    - Enhanced
    - Standard
  - name: LAST_REVIEW
    type: date
    presence: required
    description: Last review
    example: '2026-02-11'
  - name: EMIR_CLASSIFICATION
    type: text
    presence: required
    description: EMIR classification
    example: FC
    enum:
    - FC
    - NFC-
  - name: PD_1Y
    type: rate
    presence: required
    description: PD (1 year)
    example: 0.0004
  HIERARCHY:
  - name: NODES
    type: record list
    presence: required
    description: 'Nested: see nested HIERARCHY.NODES[]'
  - name: EDGES
    type: record list
    presence: required
    description: 'Nested: see nested HIERARCHY.EDGES[]'
  HIERARCHY.NODES[]:
  - name: ID
    type: id
    presence: required
    example: GRP-ALDERSHOT
  - name: LABEL
    type: text
    presence: required
    example: Aldershot Pension Trust
  - name: TYPE
    type: text
    presence: required
    example: Group (ultimate parent)
    enum:
    - Agreement
    - CSA
    - Counterparty
    - Group (ultimate parent)
    - Netting set
  HIERARCHY.EDGES[]:
  - name: FROM
    type: id
    presence: required
    example: GRP-ALDERSHOT
  - name: TO
    type: id
    presence: required
    example: CP-ALDERSHOT
  - name: LABEL
    type: text
    presence: required
    example: parent of
    enum:
    - nets
    - parent of
    - secured by
    - signed
links:
- field: ECONOMY
  kind: economy
- field: NEWS_ID
  kind: news
- field: NETTING_SETS
  kind: netting-set
- field: GROUP
  kind: counterparty-group
- field: CREDIT_LIMIT
  kind: credit-limit
- field: CREDIT_CURVE
  kind: credit-curve
- field: LEGAL_ENTITY
  kind: legal-entity
- field: NETTING_SETS[].AGREEMENT
  kind: agreement
validation:
- rule: required
  fields:
  - COUNTERPARTY_ID
  - NAME
  - LEI
  - RATING
  - SECTOR
  - COUNTRY
  - TYPE
  - COUNTRY_OF_RISK
  - UEN
  - ECONOMY
  - NEWS_ID
  - NET_MTM
  - PFE_PEAK
  - NETTING_SETS
  - KYC
  - GROUP
  - CREDIT_LIMIT
  - HIERARCHY
- rule: unique
  key:
  - COUNTERPARTY_ID
  per: business_date
- rule: pattern
  field: COUNTERPARTY_ID
  pattern: ^CP-
- rule: link
  field: ECONOMY
  kind: economy
- rule: link
  field: NEWS_ID
  kind: news
- rule: link
  field: NETTING_SETS
  kind: netting-set
- rule: link
  field: GROUP
  kind: counterparty-group
- rule: link
  field: CREDIT_LIMIT
  kind: credit-limit
- rule: link
  field: CREDIT_CURVE
  kind: credit-curve
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: link
  field: NETTING_SETS[].AGREEMENT
  kind: agreement
- rule: enum
  field: KYC.RISK_RATING
  values:
  - Enhanced
  - Standard
- rule: enum
  field: KYC.EMIR_CLASSIFICATION
  values:
  - FC
  - NFC-
- rule: enum
  field: HIERARCHY.NODES[].TYPE
  values:
  - Agreement
  - CSA
  - Counterparty
  - Group (ultimate parent)
  - Netting set
- rule: enum
  field: HIERARCHY.EDGES[].LABEL
  values:
  - nets
  - parent of
  - secured by
  - signed
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 66 documents (18 samples and 48 test-data documents (data/testdata/core/counterparty/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/counterparty/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may
  be empty.'
- 'source ''counterparty-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: KYC.RISK_RATING, KYC.EMIR_CLASSIFICATION, HIERARCHY.NODES[].TYPE, HIERARCHY.EDGES[].LABEL:
  confirm they are closed lists.'
- 'number types decided by the field''s name: NET_MTM amount, PFE_PEAK amount, NETTING_SETS[].NET_MTM amount, KYC.PD_1Y rate: confirm amount,
  rate or integer.'
- 'no unit stated for the amounts NET_MTM, PFE_PEAK, NETTING_SETS[].NET_MTM (docs/contracts/README.md section 7: USD unless stated): confirm the
  currency.'
- 'no description in about.yaml or the Sutras for COUNTRY, PFE_PEAK, HIERARCHY.NODES[].ID, HIERARCHY.NODES[].LABEL, HIERARCHY.NODES[].TYPE, HIERARCHY.EDGES[].FROM,
  HIERARCHY.EDGES[].TO, HIERARCHY.EDGES[].LABEL: write them in the pack''s config/about.yaml glossary.'
- 'NET_MTM, PFE_PEAK and NETTING_SETS[].NET_MTM are computed figures on a fundamental master (docs/contracts/README.md section 3): confirm they
  are removed when NSET''s figures are computed (2.10.0).'
