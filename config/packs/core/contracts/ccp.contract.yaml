# Data contract of the ccp kind (command CCP): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap ccp`; owned by people from then on: confirm the review points, then remove them.
kind: ccp
mnemonic: CCP
pack: core
version: '1.0'
class: fundamental
status: active
title: Central counterparty
description: A clearing house with its default fund and margin model.
source: clearing-system
grain: One row per central counterparty per business date, keyed by CCP_ID.
key:
- CCP_ID
id-pattern:
- ^CCP-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/ccp/
  test-data:
  - data/testdata/core/ccp
fields:
- name: CCP_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: CCP-CME
  pattern: ^CCP-
- name: NAME
  type: text
  presence: required
  description: 'The central counterparty''s name (CME Clearing, LCH Ltd, Eurex Clearing AG …).'
  example: CME Clearing
- name: DEFAULT_FUND
  type: amount
  presence: required
  unit: 'USD'
  description: 'The CCP''s default fund size, in the bank''s reporting currency (USD in the demo).'
  example: 720000000.0
- name: IM_POSTED
  type: amount
  presence: required
  unit: 'USD'
  description: 'The initial margin the bank has posted to the CCP, in the bank''s reporting currency (USD in the demo).'
  example: 43200000
- name: MARGIN_MODEL
  type: text
  presence: required
  description: 'The CCP''s initial-margin model (SPAN 2, Prisma, IRM 2 …).'
  example: SPAN 2
- name: ACCOUNTS
  type: record list
  presence: required
  description: 'The bank''s clearing accounts at the CCP: one object per account.'
nested:
  ACCOUNTS[]:
  - name: ID
    type: id
    presence: required
    description: 'The account: an ACCOUNT_ID of the core pack''s clearing-account kind (CLR-…).'
    example: CLR-CME-1
  - name: IM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The initial margin posted on the account, in the bank''s reporting currency (USD in the demo).'
    example: 43200000
links: []
validation:
- rule: required
  fields:
  - CCP_ID
  - NAME
  - DEFAULT_FUND
  - IM_POSTED
  - MARGIN_MODEL
  - ACCOUNTS
- rule: unique
  key:
  - CCP_ID
  per: business_date
- rule: pattern
  field: CCP_ID
  pattern: ^CCP-
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 10 documents (5 samples and 5 test-data documents (data/testdata/core/ccp/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/ccp/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source ''clearing-system'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'number types decided by the field''s name: IM_POSTED amount, ACCOUNTS[].IM amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts DEFAULT_FUND, IM_POSTED, ACCOUNTS[].IM (docs/contracts/README.md section 7: USD unless stated): confirm the
  currency.'
