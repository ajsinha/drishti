# Data contract of the counterparty-group kind (command GRP): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap counterparty-group`; owned by people from then on: confirm the review points, then remove them.
kind: counterparty-group
mnemonic: GRP
pack: core
version: '1.0'
class: fundamental
status: active
title: Counterparty group
description: Economic group of related counterparties (obligor group).
source: counterparty-master
grain: One row per counterparty group per business date, keyed by GROUP_ID.
key:
- GROUP_ID
id-pattern:
- ^GRP-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/counterparty-group/
  test-data:
  - data/testdata/core/counterparty-group
fields:
- name: GROUP_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: GRP-ALDERSHOT
  pattern: ^GRP-
- name: NAME
  type: text
  presence: required
  description: 'The group''s name: its ultimate parent''s name.'
  example: Aldershot Pension Trust
- name: LIMIT
  type: amount
  presence: required
  unit: 'USD'
  description: 'The group''s credit limit: the sum of its members'' credit limits (credit-limit LIMIT), in the bank''s reporting currency (USD in the demo).'
  example: 337000000.0
- name: UTILISATION
  type: rate
  presence: required
  unit: 'fraction'
  description: 'The share of LIMIT in use: the members'' used amounts over LIMIT, as a fraction (0.6671 is 66.71%).'
  example: 0.6671
- name: MEMBERS
  type: record list
  presence: required
  description: 'The counterparties in the group: one object per member.'
nested:
  MEMBERS[]:
  - name: ID
    type: id
    presence: required
    description: 'The member: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
    example: CP-ALDERSHOT
  - name: NAME
    type: text
    presence: required
    description: 'The member''s legal name (its counterparty NAME).'
    example: Aldershot Pension Trust
  - name: RATING
    type: text
    presence: required
    description: 'The member''s credit rating, S&P-style (AA-, BBB+ …).'
    example: AA-
links: []
validation:
- rule: required
  fields:
  - GROUP_ID
  - NAME
  - LIMIT
  - UTILISATION
  - MEMBERS
- rule: unique
  key:
  - GROUP_ID
  per: business_date
- rule: pattern
  field: GROUP_ID
  pattern: ^GRP-
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 62 documents (17 samples and 45 test-data documents (data/testdata/core/counterparty-group/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/counterparty-group/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'source ''counterparty-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'UTILISATION is a column a compute engine produces (docs/contracts/README.md section 14) on a record that keeps it: confirm whether it is computed
  and removed.'
- 'number types decided by the field''s name: LIMIT amount, UTILISATION rate: confirm amount, rate or integer.'
- 'no unit stated for the amounts LIMIT (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
