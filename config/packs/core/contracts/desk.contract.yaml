# Data contract of the desk kind (command DESK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap desk`; owned by people from then on: confirm the review points, then remove them.
kind: desk
mnemonic: DESK
pack: core
version: '1.0'
class: fundamental
status: active
title: Desk
description: 'A trading desk: books, limits and risk results.'
source: org-master
grain: One row per desk per business date, keyed by DESK_ID.
key:
- DESK_ID
id-pattern:
- ^DESK-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: reference-store
  plugin: delta
  domain: reference
  table: <root>/reference/desk/
  test-data:
  - data/testdata/core/desk
fields:
- name: DESK_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: DESK-COMM
  pattern: ^DESK-
- name: NAME
  type: text
  presence: required
  description: 'The desk''s name (Commodities, G10 and EM FX …).'
  example: Commodities
- name: HEAD
  type: text
  presence: required
  description: 'The desk head''s name, initial and last name.'
  example: T. Brennan
- name: BOOKS
  type: record list
  presence: required
  description: 'The desk''s books: one object per book.'
- name: MTM
  type: amount
  presence: required
  unit: 'USD'
  description: 'The sum of the MTM of the desk''s trades, in the bank''s reporting currency (USD in the demo).'
  example: 14609595
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'The bank''s legal entity the desk books in: an ENTITY_ID of the core pack''s legal-entity kind (LE-…).'
  example: LE-NY
  pattern: ^LE-
  link: legal-entity
- name: ASSET_CLASSES
  type: text list
  presence: required
  description: 'The asset classes the desk trades (Rates, FX, Credit, Equity, Commodity, Inflation, Fixed income, Money market, ...).'
- name: POSITIONS
  type: record list
  presence: required
  description: 'Every trade of the desk''s books, by book then trade id: one object per trade.'
nested:
  BOOKS[]:
  - name: ID
    type: id
    presence: required
    description: 'The book: a BOOK_ID of the core pack''s book kind (BOOK-…).'
    example: BOOK-COMM-1
  - name: TRADES
    type: integer
    presence: required
    description: 'How many trades the book holds.'
    example: 28
  - name: MTM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The sum of the book''s trades'' MTM, in the bank''s reporting currency (USD in the demo).'
    example: 7760837
  POSITIONS[]:
  - name: TRADE_ID
    type: id
    presence: required
    description: 'The trade: a TRADE_ID of the trading pack''s trade kind (text).'
    example: MX-20000291
    pattern: ^((MX|CLY)-)?\d+$
    link: trade
  - name: BOOK
    type: id
    presence: required
    description: 'The trade''s book: a BOOK_ID of the core pack''s book kind (BOOK-…).'
    example: BOOK-COMM-1
    pattern: ^BOOK-
    link: book
  - name: CURRENCY
    type: text
    presence: required
    description: 'The trade''s currency, ISO 4217.'
    example: USD
    enum:
    - AUD
    - CAD
    - CHF
    - EUR
    - GBP
    - JPY
    - USD
  - name: FAMILY
    type: text
    presence: required
    description: 'The trade''s product family (swap, option, future, bond, linear, exotic, sft, money …).'
    example: future
  - name: MTM
    type: amount
    presence: required
    unit: 'USD'
    description: 'The trade''s MTM, in the bank''s reporting currency (USD in the demo).'
    example: 324697
links:
- field: LEGAL_ENTITY
  kind: legal-entity
- field: POSITIONS[].TRADE_ID
  kind: trade
- field: POSITIONS[].BOOK
  kind: book
validation:
- rule: required
  fields:
  - DESK_ID
  - NAME
  - HEAD
  - BOOKS
  - MTM
  - LEGAL_ENTITY
  - ASSET_CLASSES
  - POSITIONS
- rule: unique
  key:
  - DESK_ID
  per: business_date
- rule: pattern
  field: DESK_ID
  pattern: ^DESK-
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: link
  field: POSITIONS[].TRADE_ID
  kind: trade
- rule: link
  field: POSITIONS[].BOOK
  kind: book
- rule: enum
  field: POSITIONS[].CURRENCY
  values:
  - AUD
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- The desk's VaR is the engine's (DESK:<id>), computed as the page opens (VAR_ENGINE); VAR_99 and VAR_RESULT left the record in 2.8.0.
review:
- 'required inferred from 100% coverage in 30 documents (10 samples and 20 test-data documents (data/testdata/core/desk/snapshot-2026-07-08.jsonl.gz,
  data/testdata/core/desk/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source ''org-master'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: POSITIONS[].CURRENCY: confirm they are closed lists.'
- 'number types decided by the field''s name: MTM amount, BOOKS[].MTM amount, POSITIONS[].MTM amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts MTM, BOOKS[].MTM, POSITIONS[].MTM (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
