# Hand-written from the Drishti UI kit (config/ui-kit/fragments) and the pack's own fragments (sutras/common).
rachana: 1
sutra: lei-country
version: 1
description: "A country's legal entities in the pack, computed from the entities when asked: the entities, the groups present, legal forms and cities."
doc:
  summary: "The pack's entities with a legal address in one country (a click opens one beside), the groups present, legal forms, cities."
  description: >-
    One page per country of the entities' legal addresses, computed when it is opened from every entity in the lake with a legal
    address there (since 2.9.2; docs/guides/GROUPINGS_ANALYTICS_GUIDE.md). The strip counts the entities, the groups present and
    those headquartered there, the lapsed registrations and the late renewals. The entities table lists every one of them by name,
    with the city and the late-renewal flag; a click opens the entity's key facts beside the table. The groups table counts each
    group's entities in the country, a link to the group. On the right: entities by legal form and by city, and the source.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/lei-country/GB"
    - "LEIC US"
  since: "2.7.0"
match: { kind: lei-country, where: "$.COUNTRY != 'ALL'", priority: 10 }
title: { pill: GLEIF · Country (computed), id: $.COUNTRY, with: $.NAME }
strip:
  - { label: Entities, bind: $.ENTITIES, fmt: entities0, emphasis: true }
  - { label: Groups present, bind: $.GROUPS_PRESENT }
  - { label: Groups headquartered, bind: "nonblank($.GROUPS_HEADQUARTERED, 0)" }
  - { label: Lapsed, bind: "nonblank($.LAPSED, 0)" }
  - { label: Late renewals, bind: "nonblank($.LATE_RENEWALS, 0) > 0 ? $.LATE_RENEWALS + ' late: renewal failed' : 'None late'", tone: status }
panels:
  - use: gleif/entity-list@1
    with: { id: entities, title: "Entities, by name (a click opens one beside)", rows: $.ROWS, b: CITY, b-label: City, c: LATE, c-label: Renewal, key: F2, code: ENT }
    children:
      - place: detail-right
        source: { kind: lei-entity, id: "@parent.open.id" }
        waits: Pick an entity to see its key facts
        panels:
          - { use: gleif/entity-card@1, with: { id: picked, title: "${@parent.open.id}", rec: $src } }
  - id: groups
    kind: table
    title: Groups present (entities here)
    key: F3
    rows: $.GROUP_ROWS
    columns:
      - { label: Group (ultimate parent LEI), bind: "link(@.label, 'lei-group')" }
      - { label: Entities here, bind: "@.value", fmt: entities0, total: true }
  - id: note
    kind: kv
    title: The list
    area: right
    columns:
      - { label: Entities listed, bind: "'Every entity of the country in the lake (' + $.ENTITIES + ')'" }
      - { label: Directory, bind: "link('ALL', 'lei-country', 'Every country')" }
  - { use: ranked-bars@1, with: { id: by-form, title: Entities by legal form, rows: $.BY_LEGAL_FORM, label: label, value: value, fmt: entities0, area: right, key: F4 } }
  - { use: ranked-bars@1, with: { id: by-city, title: Entities by city, rows: $.BY_CITY, label: label, value: value, fmt: entities0, area: right } }
  - { use: field-list@1, with: { id: source, title: Data source and licence, rows: $.PROVENANCE, area: right } }
  - { use: data-provenance@1 }
keys: { F9: raw }
