# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: desk
version: 1
description: "A trading desk: books, limits and risk results."
doc:
  summary: "A trading desk: books, limits and risk results."
  description: >-
    A trading desk: books, limits and risk results. One page per desk, its panels: books; MTM grid (by book and currency, USD);
    trades by book and product family; trades by book; how the view was built; the entities it links to. The strip gives Name,
    Head, Books, VaR 99% 1D (engine) and MTM. Linked entities: legal entity (legal-entity).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/desk/DESK-COMM"
    - "DESK DESK-COMM"
  since: "2.7.0"
match: { kind: desk, priority: 10 }
title: { pill: Organisation · Desk, id: $.DESK_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Head, bind: $.HEAD }
  - { label: Books, bind: size($.BOOKS) }
  - { label: VaR 99% 1D (engine), bind: $.VAR_ENGINE.VAR, fmt: compact, emphasis: true }
  - { label: MTM, bind: $.MTM, fmt: signed0, tone: sign }
panels:
  - id: books
    kind: table
    title: Books
    key: F2
    rows: $.BOOKS
    columns:
      - { label: Book, bind: "@.ID", link: true }
      - { label: Trades, bind: "@.TRADES", fmt: amount0, total: true }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - id: mtmGrid
    kind: pivot
    title: "MTM grid (by book and currency, USD)"
    code: PIV
    key: F3
    rows: $.POSITIONS
    fmt: compact
    tone: sign
    by: BOOK
    across: CURRENCY
    value: MTM
    agg: sum
    heat: true
  - id: tradeCount
    kind: pivot
    title: Trades by book and product family
    rows: $.POSITIONS
    by: BOOK
    across: FAMILY
    agg: count
  - id: positions
    kind: table
    title: Trades by book
    code: TRD
    key: F4
    rows: $.POSITIONS
    pivot:
      rows: [BOOK]
      columns: [CURRENCY]
      values: [{ field: MTM, agg: sum }]
      filters: [FAMILY]
      heat: true
    columns:
      - { label: Trade, bind: "@.TRADE_ID" }
      - { label: Book, bind: "@.BOOK" }
      - { label: Currency, bind: "@.CURRENCY" }
      - { label: Family, bind: "@.FAMILY" }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.LEGAL_ENTITY, 'legal-entity')", F8: impact, F9: raw }
