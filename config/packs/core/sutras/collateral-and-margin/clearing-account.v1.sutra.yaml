# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: clearing-account
version: 1
description: An account at a CCP holding cleared trades and margin.
doc:
  summary: "An account at a CCP holding cleared trades and margin."
  description: >-
    An account at a CCP holding cleared trades and margin. One page per clearing account, its panels: cleared trades; how the
    view was built; the entities it links to. The strip gives CCP, IM, VM today and Excess. Linked entities: CCP (ccp).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/clearing-account/CLR-CME-1"
    - "CLR CLR-CME-1"
  since: "2.7.0"
match: { kind: clearing-account, priority: 10 }
title: { pill: Collateral and margin · Clearing account, id: $.ACCOUNT_ID }
strip:
  - { label: CCP, bind: $.CCP_NAME }
  - { label: IM, bind: $.IM, fmt: compact, emphasis: true }
  - { label: VM today, bind: $.VM_TODAY, fmt: signed0, tone: sign }
  - { label: Excess, bind: $.EXCESS, fmt: compact }
panels:
  - id: trades
    kind: table
    title: Cleared trades
    key: F2
    rows: $.TRADES
    pivot:
      fields: [PRODUCT, ASSET_CLASS, CURRENCY, BOOK, MATURITY_BUCKET, { field: MATURITY, label: Maturity date }, { field: NOTIONAL, fmt: compact }, { field: MTM, label: MTM (USD), fmt: signed0 }, TRADE_ID]
      rows: [PRODUCT]
      columns: [MATURITY_BUCKET]
      values: [{ field: NOTIONAL, agg: sum }]
      filters: [CURRENCY, ASSET_CLASS]
    columns:
      - { label: Trade, bind: "@.TRADE_ID" }
      - { label: Product, bind: "@.PRODUCT" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: compact }
      - { label: Maturity, bind: "@.MATURITY", fmt: date }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.CCP, 'ccp')", F8: impact, F9: raw }
