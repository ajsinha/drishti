rachana: 1
sutra: ccp
version: 1
description: A clearing house with its default fund and margin model.
doc:
  summary: "A clearing house with its default fund and margin model."
  description: >-
    A clearing house with its default fund and margin model. One page per central counterparty, its panels: clearing accounts;
    how the view was built. The strip gives Name, Default fund, IM posted and Model.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/ccp/CCP-CME"
    - "CCP CCP-CME"
  since: "2.7.0"
match: { kind: ccp, priority: 10 }
title: { pill: Counterparty and legal · Central counterparty, id: $.CCP_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Default fund, bind: $.DEFAULT_FUND, fmt: compact }
  - { label: IM posted, bind: $.IM_POSTED, fmt: compact, emphasis: true }
  - { label: Model, bind: $.MARGIN_MODEL }
panels:
  - id: accounts
    kind: table
    title: Clearing accounts
    key: F2
    rows: $.ACCOUNTS
    columns:
      - { label: Account, bind: "@.ID", link: true }
      - { label: IM, bind: "@.IM", fmt: compact, total: true }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
