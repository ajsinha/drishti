# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: issuer
version: 1
description: Issuer of bonds and reference entity for CDS.
doc:
  summary: "Issuer of bonds and reference entity for CDS."
  description: >-
    Issuer of bonds and reference entity for CDS. One page per issuer, its panels: bonds outstanding; how the view was built;
    the entities it links to. The strip gives Name, Rating, Sector and Country. Linked entities: credit curve (credit-curve) and
    equity (equity).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/issuer/ISS-BUND"
    - "ISS ISS-BUND"
  since: "2.7.0"
match: { kind: issuer, priority: 10 }
title: { pill: Counterparty and legal · Issuer, id: $.ISSUER_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Rating, bind: $.RATING, emphasis: true }
  - { label: Sector, bind: $.SECTOR }
  - { label: Country, bind: $.COUNTRY }
panels:
  - id: bonds
    kind: table
    title: Bonds outstanding
    key: F2
    rows: $.BONDS
    columns:
      - { label: ISIN, bind: "@.ISIN" }
      - { label: Coupon, bind: "@.COUPON", fmt: pct2 }
      - { label: Maturity, bind: "@.MATURITY", fmt: date }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.CREDIT_CURVE, 'credit-curve')", F8: impact, F9: raw }
