# Data contract of the development-profile kind (command WDI): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap development-profile`; owned by people from then on: confirm the review points, then remove them.
kind: development-profile
mnemonic: WDI
pack: world-development
version: '1.0'
class: fundamental
status: active
title: Development profile
description: 'One country''s World Development Indicators: the latest of each, the world map shaded by GDP per head, each series one click away.'
source: 'public data: World Bank, World Development Indicators, pulled by the world-development feed (config/feeds/world-development.yaml, tools/feeds/publicsector/)'
grain: One row per development profile, keyed by PROFILE_ID.
key:
- PROFILE_ID
id-pattern:
- ^WDI-
dated-by: snapshot
cadence:
  frequency: daily
  due: the world-development feed's schedule (30 6 * * * UTC); a pull with nothing new writes nothing and the lake keeps its latest date
storage:
  connector: development-store
  plugin: delta
  domain: development
  table: <root>/development/development-profile/
  test-data:
  - config/packs/world-development/samples
fields:
- name: PROFILE_ID
  type: id
  presence: required
  description: WDI- and the country's ISO 3166 alpha-3 code.
  example: WDI-AUS
  pattern: ^WDI-
- name: NAME
  type: text
  presence: required
  description: The economy's name as the World Bank writes it.
  example: Australia
- name: ISO3
  type: text
  presence: required
  description: The country's ISO 3166-1 alpha-3 code, the key the map shades by.
  example: AUS
- name: ISO2
  type: text
  presence: required
  description: The country's ISO 3166-1 alpha-2 code (the World Bank's own id).
  example: AU
- name: COUNTRY_NAME
  type: text
  presence: optional
  description: The economy's name as the World Bank writes it.
  example: Australia
- name: REGION
  type: id
  presence: required
  description: The World Bank region the economy belongs to (East Asia & Pacific, Sub-Saharan Africa ...).
  example: East Asia & Pacific
  link: region
- name: INCOME_GROUP
  type: id
  presence: required
  description: The World Bank income group by GNI per head (Low, Lower middle, Upper middle, High income).
  example: High income
  link: country-group
- name: CAPITAL
  type: text
  presence: optional
  description: The capital city as the World Bank lists it.
  example: Canberra
- name: POPULATION
  type: amount
  presence: optional
  unit: persons
  description: Total population, mid-year (SP.POP.TOTL), the latest year with a value.
  example: 27614411.0
- name: GDP_PER_CAPITA
  type: amount
  presence: optional
  unit: USD
  description: GDP divided by mid-year population, current US dollars (NY.GDP.PCAP.CD), the latest year.
  example: 65129.7227990563
- name: GDP_GROWTH
  type: rate
  presence: optional
  unit: '% a year'
  description: Annual growth of GDP at constant prices (NY.GDP.MKTP.KD.ZG), the latest year.
  example: 1.35039785076631
- name: INFLATION
  type: rate
  presence: optional
  unit: '% a year'
  description: Consumer price inflation (FP.CPI.TOTL.ZG), the latest year.
  example: 2.87403791660173
- name: UNEMPLOYMENT
  type: amount
  presence: optional
  unit: '% of labour force'
  description: Unemployed share of the labour force, ILO modelled estimate (SL.UEM.TOTL.ZS), the latest year.
  example: 4.09
- name: LIFE_EXPECTANCY
  type: amount
  presence: optional
  unit: years
  description: Life expectancy at birth (SP.DYN.LE00.IN), the latest year.
  example: 83.0512195121951
- name: POVERTY_HEADCOUNT
  type: amount
  presence: optional
  unit: '% of population'
  description: Share living below the World Bank's international poverty line (SI.POV.DDAY), the latest survey year.
  example: 0.9
- name: ELECTRICITY_ACCESS
  type: amount
  presence: optional
  unit: '% of population'
  description: Share of the population with access to electricity (EG.ELC.ACCS.ZS), the latest year.
  example: 100.0
- name: INTERNET_USERS
  type: amount
  presence: optional
  unit: '% of population'
  description: Share of the population using the internet (IT.NET.USER.ZS), the latest year.
  example: 96.13140106
- name: CENTRAL_GOVERNMENT_DEBT
  type: amount
  presence: optional
  unit: '% of GDP'
  description: Central government debt, total (GC.DOD.TOTL.GD.ZS), the latest year; empty for most economies that do not report it.
  example: 57.8834285733848
- name: INDICATORS
  type: record list
  presence: required
  description: 'Every indicator the feed pulled for the economy, one row each: INDICATOR, UNIT, LATEST, YEAR, CODE and WDI_SERIES.'
  link: macro-indicator
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
- name: DATA_YEAR
  type: text
  presence: optional
  description: The most recent year any indicator of the economy has a value for.
  example: '2025'
- name: INDICATOR_COUNT
  type: integer
  presence: required
  description: How many indicators have at least one value for the economy.
  example: 10
nested:
  INDICATORS[]:
  - name: INDICATOR
    type: text
    presence: required
    description: The indicator's name as the World Bank publishes it.
    example: Population, total
  - name: UNIT
    type: text
    presence: required
    description: What the value measures (the feed's YAML names it).
    example: persons
  - name: LATEST
    type: amount
    presence: required
    description: The latest published value, in the unit shown.
    example: 27614411.0
    unit: the row's UNIT
  - name: YEAR
    type: text
    presence: required
    description: The calendar year of the latest value.
    example: '2025'
  - name: CODE
    type: text
    presence: required
    description: The indicator's code in the World Bank API (SP.POP.TOTL).
    example: SP.POP.TOTL
  - name: WDI_SERIES
    type: id
    presence: required
    description: The development-series page with the history (WDIS-<ISO3>-<code>).
    example: WDIS-AUS-SP_POP_TOTL
    pattern: ^WDIS-
    link: development-series
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation whose published data the record holds.
    example: World Bank, World Development Indicators
  - name: DATASET
    type: text
    presence: required
    description: The named dataset and its vintage (the release the numbers come from).
    example: World Development Indicators (updated 2026-10-08)
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse, as recorded in the feed's YAML.
    example: CC BY 4.0
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'The World Bank: World Development Indicators (CC BY 4.0).'
  - name: URL
    type: text
    presence: required
    description: The source's page for this record.
    example: https://data.worldbank.org/country/AU
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: True when the source's terms forbid redistribution outside the organisation (Export data refuses the record).
    example: false
links:
- field: REGION
  kind: region
- field: INCOME_GROUP
  kind: country-group
- field: INDICATORS
  kind: macro-indicator
- field: INDICATORS[].WDI_SERIES
  kind: development-series
validation:
- rule: required
  fields:
  - PROFILE_ID
  - NAME
  - ISO3
  - ISO2
  - REGION
  - INCOME_GROUP
  - INDICATORS
  - PROVENANCE
  - INDICATOR_COUNT
- rule: unique
  key:
  - PROFILE_ID
  per: snapshot
- rule: pattern
  field: PROFILE_ID
  pattern: ^WDI-
- rule: link
  field: REGION
  kind: region
- rule: link
  field: INCOME_GROUP
  kind: country-group
- rule: link
  field: INDICATORS
  kind: macro-indicator
- rule: range
  field: INDICATOR_COUNT
  min: 0
- rule: link
  field: INDICATORS[].WDI_SERIES
  kind: development-series
notes:
- Stored in the worldlake lake (config/lakes/worldlake.yaml), table <data>/delta/worldlake/development/development-profile/, one JSONL.gz a business date
  loaded with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
