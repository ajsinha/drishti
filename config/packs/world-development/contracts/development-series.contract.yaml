# Data contract of the development-series kind (command WDIS): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap development-series`; owned by people from then on: confirm the review points, then remove them.
kind: development-series
mnemonic: WDIS
pack: world-development
version: '1.0'
class: fundamental
status: active
title: Development indicator series
description: 'One World Development Indicator of one country by year: the history, the latest value and the change.'
source: 'public data: World Bank, World Development Indicators, pulled by the world-development feed (config/feeds/world-development.yaml, tools/feeds/sources/)'
grain: One row per development indicator series, keyed by SERIES_ID.
key:
- SERIES_ID
id-pattern:
- ^WDIS-
dated-by: snapshot
cadence:
  frequency: daily
  due: the world-development feed's schedule (30 6 * * * UTC); a pull with nothing new writes nothing and the lake keeps its latest date
storage:
  connector: development-store
  plugin: delta
  domain: development
  table: <root>/development/development-series/
  test-data:
  - config/packs/world-development/samples
fields:
- name: SERIES_ID
  type: id
  presence: required
  description: WDIS-, the country's ISO alpha-3 code and the indicator's code with its dots as underscores.
  example: WDIS-CAN-EG_ELC_ACCS_ZS
  pattern: ^WDIS-
- name: NAME
  type: text
  presence: required
  description: The country and the indicator, as one name.
  example: Canada · Access to electricity (% of population)
- name: WDI_PROFILE
  type: id
  presence: optional
  description: The country's development-profile page (WDI-<ISO3>); empty for a World Bank aggregate (the world, a region, an income
    group), which has series but no profile.
  example: WDI-CAN
  pattern: ^WDI-
  link: development-profile
- name: ISO3
  type: text
  presence: required
  description: The country's ISO 3166-1 alpha-3 code, or the World Bank aggregate's code (WLD the world, EAS ... SSF the regions, HIC
    ... LIC the income groups).
  example: CAN
- name: COUNTRY_NAME
  type: text
  presence: optional
  description: The economy's name as the World Bank writes it.
  example: Canada
- name: INDICATOR_CODE
  type: text
  presence: required
  description: The indicator's code in the World Bank API.
  example: EG.ELC.ACCS.ZS
- name: INDICATOR
  type: text
  presence: required
  description: The indicator's name as the World Bank publishes it.
  example: Access to electricity (% of population)
- name: UNIT
  type: text
  presence: required
  description: What the value measures (the feed's YAML names it).
  example: '% of population'
- name: DEFINITION
  type: text
  presence: optional
  description: The World Bank's source note for the indicator, cut at 600 characters.
  example: Access to electricity is the percentage of population with …
- name: LATEST
  type: amount
  presence: required
  description: The latest published value, in the unit shown.
  example: 100.0
  unit: the record's UNIT
- name: LATEST_YEAR
  type: text
  presence: required
  description: The calendar year of the latest value.
  example: '2024'
- name: PREVIOUS
  type: amount
  presence: optional
  description: The value of the year before the latest one with a value; empty for a one-year series.
  example: 100.0
  unit: the record's UNIT
- name: PREVIOUS_YEAR
  type: text
  presence: optional
  description: The year of the previous value.
  example: '2023'
- name: CHANGE
  type: amount
  presence: optional
  description: The latest value less the previous one, in the unit shown.
  example: 0.0
  unit: the record's UNIT
- name: HISTORY
  type: record list
  presence: required
  description: The value by year, oldest first, over the feed's window (YEAR, VALUE).
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
nested:
  HISTORY[]:
  - name: YEAR
    type: text
    presence: required
    description: The calendar year of the value.
    example: '2019'
  - name: VALUE
    type: amount
    presence: required
    description: The published value for that year, in the unit shown.
    example: 100.0
    unit: the record's UNIT
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation whose published data the record holds.
    example: World Bank, World Development Indicators
  - name: DATASET
    type: text
    presence: required
    description: The named dataset and its vintage (the release the numbers come from).
    example: World Development Indicators (updated 2026-10-08)
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse, as recorded in the feed's YAML.
    example: CC BY 4.0
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'The World Bank: World Development Indicators (CC BY 4.0).'
  - name: URL
    type: text
    presence: required
    description: The source's page for this record.
    example: https://data.worldbank.org/indicator/EG.ELC.ACCS.ZS?locatio…
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: True when the source's terms forbid redistribution outside the organisation (Export data refuses the record).
    example: false
links:
- field: WDI_PROFILE
  kind: development-profile
validation:
- rule: required
  fields:
  - SERIES_ID
  - NAME
  - ISO3
  - INDICATOR_CODE
  - INDICATOR
  - UNIT
  - LATEST
  - LATEST_YEAR
  - HISTORY
  - PROVENANCE
- rule: unique
  key:
  - SERIES_ID
  per: snapshot
- rule: pattern
  field: SERIES_ID
  pattern: ^WDIS-
- rule: link
  field: WDI_PROFILE
  kind: development-profile
notes:
- Stored in the worldlake lake (config/lakes/worldlake.yaml), table <data>/delta/worldlake/development/development-series/, one JSONL.gz a business date
  loaded with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
