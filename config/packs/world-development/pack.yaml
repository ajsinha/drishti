# World development · the public-sector module's World Bank pack (docs/guides/PUBLIC_SECTOR_GUIDE.md): World Development Indicators by
# country and year, filled daily by the world-development feed (config/feeds/world-development.yaml) into the worldlake lake.
pack: world-development
domain: publicsector   # the public-sector module's (docs/architecture/ACCESS_MODEL.md): it loads only while that module is on
version: 1.0.0
code: WDEV             # typed alone, opens this pack's overview
title: World development
description: >-
  World Bank World Development Indicators by country and year: population, GDP per head and growth, inflation, unemployment, life
  expectancy, poverty, access to electricity, internet use and central government debt for every economy, from the World Bank's API
  (CC BY 4.0). A country's profile shows the latest of each indicator and the world map shaded by GDP per head; each series shows its
  history by year. Filled daily by the world-development feed into the worldlake lake.
kinds: [development-profile, development-series]
sutras: sutras
mnemonics:
  WDI:  { kind: development-profile, label: Development profile }
  WDIS: { kind: development-series, label: Development indicator series }
graph:
  id-patterns:
    - { pattern: "^WDI-", kind: development-profile }
    - { pattern: "^WDIS-", kind: development-series }
  fields:
    WDI_PROFILE: { kind: development-profile, label: Development profile }
    WDI_SERIES:  { kind: development-series, label: Series }
  badges:
    development-profile: "$.INCOME_GROUP"
    development-series: "fmt($.LATEST, 'price2') + ' ' + $.UNIT"
connectors:
  development-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [development-profile, development-series]
    settings:
      lake: worldlake
      lake-tables: development.development-profile,development.development-series
routes:                # the connector that answers each kind
  development-profile: development-store
  development-series: development-store
console:
  examples:
    - ["WDI WDI-CAN", "Canada · the latest of every indicator, the world map by GDP per head"]
    - ["WDI WDI-NGA", "Nigeria · a lower-middle-income economy"]
    - ["WDIS WDIS-IND-NY_GDP_MKTP_KD_ZG", "India · real GDP growth by year"]
    - ["WDIS WDIS-BRA-SI_POV_DDAY", "Brazil · poverty headcount by year"]
  help: config/help.yaml
