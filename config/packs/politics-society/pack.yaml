# Generated by tools/packgen/politics/make.py. Edit the generator, not this file.
# Politics and society pack for Drishti.
pack: politics-society
version: 1.0.0
code: POLS
title: Politics and society
description: 'Real public data on governments and societies for about 200 countries: government type, office holders, elections, parties with
  seats, and social and governance indicators (CIA World Factbook, World Bank, UNDP).'
extends: []
kinds:
- jurisdiction
- party
- office-holder
- election
- region
- social-indicator
sutras: sutras
mnemonics:
  JUR:
    kind: jurisdiction
    label: Jurisdiction
  PARTY:
    kind: party
    label: Party
  OFFC:
    kind: office-holder
    label: Office holder
  ELEC:
    kind: election
    label: Election
  REGN:
    kind: region
    label: World region
  SOCI:
    kind: social-indicator
    label: Social indicator
graph:
  id-patterns:
  - pattern: ^JUR-
    kind: jurisdiction
  - pattern: ^PARTY-
    kind: party
  - pattern: ^OFFC-
    kind: office-holder
  - pattern: ^ELEC-
    kind: election
  - pattern: ^REGN-
    kind: region
  - pattern: ^SOCI-
    kind: social-indicator
  fields:
    chiefOfState:
      kind: office-holder
      label: Chief of state
    election:
      kind: election
      label: Election
    elections:
      kind: election
      label: Elections
    headOfGovernment:
      kind: office-holder
      label: Head of government
    jurisdiction:
      kind: jurisdiction
      label: Country
    lastElection:
      kind: election
      label: Last election
    memberStates:
      kind: jurisdiction
      label: Countries
    parties:
      kind: party
      label: Parties with seats
    region:
      kind: region
      label: World region
    socialIndicators:
      kind: social-indicator
      label: Indicators
  badges:
    party: fmt($.seats, 'amount0') + ' seats'
connectors:
  civic-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - jurisdiction
    - party
    - office-holder
    - election
    - region
    - social-indicator
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: civic
routes:
  jurisdiction: civic-store
  party: civic-store
  office-holder: civic-store
  election: civic-store
  region: civic-store
  social-indicator: civic-store
console:
  examples:
  - - JUR JUR-IND
    - India · government, legislature, governance indicators
  - - JUR JUR-USA
    - United States · the same view
  - - ELEC ELEC-BRA-LOW
    - Brazil · lower-chamber result
  - - OFFC OFFC-JPN-HOG
    - Japan · head of government
  - - PARTY PARTY-IND-01
    - India · largest party in the lower chamber
  - - REGN REGN-SSF
    - Sub-Saharan Africa · a World Bank region
  - - SOCI SOCI-NGA-WGI-LAW
    - Nigeria · rule of law
  help: config/help.yaml
