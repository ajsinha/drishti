# Liquidity risk pack for Drishti.
pack: liquidity-risk
version: 1.0.0
code: LIQ
title: Liquidity risk
description: LCR and NSFR by legal entity, maturity ladders, HQLA holdings, funding sources, liquidity stress survival and intraday liquidity.
extends:
- trading
kinds:
- lcr
- nsfr
- maturity-ladder
- hqla-holding
- funding-source
- liquidity-stress
- intraday-liquidity
sutras: sutras
mnemonics:
  LCR:
    kind: lcr
    label: Liquidity coverage ratio
  NSFR:
    kind: nsfr
    label: Net stable funding ratio
  MLAD:
    kind: maturity-ladder
    label: Maturity ladder
  HQLA:
    kind: hqla-holding
    label: HQLA holding
  FUND:
    kind: funding-source
    label: Funding source
  LST:
    kind: liquidity-stress
    label: Liquidity stress result
  IDL:
    kind: intraday-liquidity
    label: Intraday liquidity
graph:
  id-patterns:
  - pattern: ^LCR-
    kind: lcr
  - pattern: ^NSFR-
    kind: nsfr
  - pattern: ^MLAD-
    kind: maturity-ladder
  - pattern: ^HQLA-
    kind: hqla-holding
  - pattern: ^FUND-
    kind: funding-source
  - pattern: ^LST-
    kind: liquidity-stress
  - pattern: ^IDL-
    kind: intraday-liquidity
  fields:
    bond:
      kind: bond
      label: Bond
  badges:
    lcr: fmt($.lcr, 'pct0') + ' LCR'
    nsfr: fmt($.nsfr, 'pct0') + ' NSFR'
    liquidity-stress: $.survivalDays + ' days'
connectors:
  liquidity-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - lcr
    - nsfr
    - maturity-ladder
    - hqla-holding
    - funding-source
    - liquidity-stress
    - intraday-liquidity
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: liquidity
routes:
  lcr: liquidity-store
  nsfr: liquidity-store
  maturity-ladder: liquidity-store
  hqla-holding: liquidity-store
  funding-source: liquidity-store
  liquidity-stress: liquidity-store
  intraday-liquidity: liquidity-store
console:
  examples:
  - - LCR LCR-NY
    - Liquidity coverage ratio · HQLA by level, outflows, 30-day trend
  - - NSFR NSFR-LDN
    - Net stable funding ratio
  - - MLAD MLAD-LDN-GBP
    - Maturity ladder · net gap by bucket
  - - LST LST-COMB-NY
    - Liquidity stress · survival horizon
  - - IDL IDL-NY-USD
