# Generated by tools/packgen/economics/make.py. Edit the generator, not this file.
rachana: 1
sutra: economy
version: 1
description: "An economy: output, growth, prices, jobs, debt and external balance, and output by sector, from World Bank, IMF and CIA data."
match: { kind: economy, priority: 10 }
title: { pill: Economics · Economy, id: $.economyId }
strip:
  - { label: Economy, bind: $.name }
  - { label: Region, bind: $.regionName }
  - { label: GDP (USD bn), bind: $.gdpUsdBn, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.gdpPerCapita, fmt: amount0 }
  - { label: Real growth, bind: $.growth, fmt: pc2, tone: sign, emphasis: true }
  - { label: Inflation, bind: $.inflation, fmt: pc2 }
  - { label: Unemployment, bind: $.unemployment, fmt: pc2 }
  - { label: Debt / GDP, bind: $.debtToGdp, fmt: pc1 }
panels:
  - id: geography
    kind: map
    title: Where it is
    highlight: $.iso3
    link: { kind: economy, id: "ECON-{iso3}" }
    shade: { kind: economy, field: $.gdpPerCapita, by: $.iso3, fmt: amount0, label: GDP per capita (USD) }
    height: 11
  - id: growthPath
    kind: line
    title: "Real GDP growth, % a year"
    key: F2
    rows: $.growthPath
    x: year
    y: growth
    fmt: pc2
  - id: sectors
    kind: hbar
    title: "Output by sector, % of GDP"
    key: F3
    area: right
    rows: $.sectors
    label: sector
    value: share
    fmt: pc1
  - id: gdpPath
    kind: line
    title: "GDP, USD bn"
    key: F4
    rows: $.gdpPath
    x: year
    y: gdp
    fmt: amount0
  - id: source
    kind: kv
    title: Data source and licence
    area: right
    rows: $.provenance
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.regionGroup, 'country-group')", F8: impact, F9: raw }
