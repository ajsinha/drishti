# Generated by tools/packgen/economics/make.py. Edit the generator, not this file.
rachana: 1
sutra: economic-forecast
version: 1
description: "A forecast for the next two years with baseline, upside and downside scenarios."
match: { kind: economic-forecast, priority: 10 }
title: { pill: Economics · Economic forecast, id: $.forecastId }
strip:
  - { label: Economy, bind: $.economyName }
  - { label: Vintage, bind: $.vintage }
  - { label: Growth 2027, bind: $.growth2027, fmt: pct2, tone: sign, emphasis: true }
  - { label: Inflation 2027, bind: $.inflation2027, fmt: pct2 }
  - { label: Recession probability, bind: $.recessionProbability, fmt: pct0 }
panels:
  - id: scenarios
    kind: table
    title: Scenarios
    key: F2
    rows: $.scenarios
    columns:
      - { label: Scenario, bind: "@.scenario" }
      - { label: Weight, bind: "@.weight", fmt: pct0 }
      - { label: Growth 2026, bind: "@.growth2026", fmt: pct2, tone: sign }
      - { label: Growth 2027, bind: "@.growth2027", fmt: pct2, tone: sign, total: true }
      - { label: Inflation 2027, bind: "@.inflation2027", fmt: pct2 }
      - { label: Unemployment 2027, bind: "@.unemployment2027", fmt: pct2 }
  - id: path
    kind: line
    title: Baseline quarterly growth
    area: right
    rows: $.path
    x: quarter
    y: growth
    fmt: pct2
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.economy, 'economy')", F8: impact, F9: raw }
