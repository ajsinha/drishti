# Economics pack for Drishti.
pack: economics
version: 1.0.0
code: ECO
title: Economics
description: 'Real public economic data for about 200 economies: output, growth, prices, jobs, debt and external balance (World Bank, IMF, CIA
  World Factbook), IMF forecasts, and World Bank regions and income groups.'
extends: []
kinds:
- economy
- macro-indicator
- economic-forecast
- labour-market
- fiscal-position
- country-group
- region-economy
