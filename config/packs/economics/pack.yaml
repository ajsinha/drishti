    economy: fmt($.growth, 'pc2') + ' growth'
    macro-indicator: fmt($.latest, 'price2') + ' ' + $.unit
connectors:
  macro-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - economy
    - macro-indicator
    - economic-forecast
    - labour-market
    - fiscal-position
    - country-group
    - region-economy
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: macro
routes:
  economy: macro-store
  macro-indicator: macro-store
  economic-forecast: macro-store
  labour-market: macro-store
  fiscal-position: macro-store
  country-group: macro-store
  region-economy: macro-store
console:
  examples:
  - - ECON ECON-IND
    - India · growth path, output by sector
  - - ECON ECON-USA
    - United States · the same view
  - - MACRO MACRO-BRA-GDP-GROWTH
    - Brazil · one indicator with history and rank
  - - FCST FCST-JPN-WEO
    - Japan · IMF outlook to 2031
  - - LABR LABR-NGA
    - Nigeria · labour market
  - - FISC FISC-USA
    - United States · debt and balance
  - - ECG ECG-SAS
    - South Asia · a World Bank region
  - - REGE REGE-AU-NSW
    - New South Wales · an illustrative regional sample
  help: config/help.yaml
