    A World Bank region: its countries, population, life expectancy, women in parliament, Internet use and the government types
    found in it. One page per world region, its panels: government types (number of countries); life expectancy at birth, years;
    internet users, % of population; data source and licence; how the view was built; the entities it links to. The strip gives
