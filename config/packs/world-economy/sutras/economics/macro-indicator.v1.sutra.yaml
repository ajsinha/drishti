# Hand-written since 2.7.0 (Sutra Next phase 1): built from the shared fragment library (core pack, sutras/library).
# tools/packgen/world/make.py leaves it alone (hand_written); SutraNextEquivalenceTest proves it draws exactly what the generated
# layout drew.
rachana: 1
sutra: macro-indicator
version: 1
description: "One headline statistic of one economy: the series, the latest value, the change and the rank among economies."
doc:
  summary: "One headline statistic of one economy: its history, the latest value, the change and its rank among economies."
  description: >-
    One page per indicator of an economy (GDP growth, inflation, debt): its history by year, what the series is, the data
    source and licence, how the view was built and its links (F7 opens the economy). The strip gives the indicator, the
    latest value, its unit and year, the previous value and the rank among economies.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/macro-indicator/MACRO-BRA-GDP-GROWTH"
    - "MACRO MACRO-BRA-GDP-GROWTH"
  since: "2.7.0"
match: { kind: macro-indicator, priority: 10 }
title: { pill: Economics · Macro indicator, id: $.INDICATOR_ID }
strip:
  - { label: Indicator, bind: $.NAME }
  - { label: Latest, bind: $.LATEST, fmt: price2, emphasis: true }
  - { label: Unit, bind: $.UNIT }
  - { label: Year, bind: $.LATEST_YEAR }
  - { label: Previous, bind: $.PREVIOUS, fmt: price2 }
  - { label: Rank, bind: $.RANK, fmt: amount0 }
panels:
  - { use: series-line@1, with: { id: history, title: History, key: F2, rows: $.HISTORY, x: YEAR, y: VALUE, fmt: price2 } }
  - { use: field-list@1, with: { id: facts, title: About this series, area: right, rows: $.FACTS } }
  - { use: source-footer@1 }
keys: { F7: "link($.ECONOMY, 'economy')", F8: impact, F9: raw }
