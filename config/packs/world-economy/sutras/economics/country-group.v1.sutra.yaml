# Generated by tools/packgen/world/make.py. Edit the generator, not this file.
rachana: 1
sutra: country-group
version: 1
description: "A World Bank region or income group (or the world): output, population, growth and its largest economies."
match: { kind: country-group, priority: 10 }
title: { pill: Economics · Country group, id: $.groupId }
strip:
  - { label: Group, bind: $.name }
  - { label: Type, bind: $.groupType }
  - { label: Economies, bind: $.economies, fmt: amount0 }
  - { label: GDP (USD bn), bind: $.gdpUsdBn, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.gdpPerCapita, fmt: amount0 }
  - { label: Population (m), bind: $.populationM, fmt: price2 }
  - { label: Real growth, bind: $.growth, fmt: pc2, tone: sign, emphasis: true }
panels:
  - id: growthPath
    kind: line
    title: "Real GDP growth, % a year"
    key: F2
    rows: $.growthPath
    x: year
    y: growth
    fmt: pc2
  - id: topEconomies
    kind: table
    title: Largest economies
    key: F3
    rows: $.topEconomies
    columns:
      - { label: Economy, bind: "@.economy" }
      - { label: GDP (USD bn), bind: "@.gdpUsdBn", fmt: amount0, total: true }
      - { label: "Growth, %", bind: "@.growth", fmt: pc2, tone: sign }
  - id: gdpPath
    kind: line
    title: "GDP, USD bn"
    area: right
    rows: $.gdpPath
    x: year
    y: gdp
    fmt: amount0
  - id: source
    kind: kv
    title: Data source and licence
    area: right
    rows: $.provenance
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.memberEconomies, 'economy')", F8: impact, F9: raw }
