# Hand-written since 2.7.0 (Sutra Next phase 1): built from the shared fragment library (core pack, sutras/library).
# tools/packgen/world/make.py leaves it alone (hand_written); SutraNextEquivalenceTest proves it draws exactly what the generated
# layout drew.
rachana: 1
sutra: country-group
version: 1
description: "A World Bank region or income group (or the world): output, population, growth and its largest economies."
doc:
  summary: "A World Bank region or income group: its output, population and growth, and its largest economies."
  description: >-
    One page per World Bank region or income group (and the world): the real GDP growth path, its largest economies by GDP
    with their growth, the GDP path beside it, the data source and licence, how the view was built and its links (F7 opens
    its member economies). The strip gives the group, its type, the number of economies, GDP, GDP per capita, population
    and real growth.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/country-group/ECG-SAS"
    - "ECG ECG-SAS"
  since: "2.7.0"
match: { kind: country-group, priority: 10 }
title: { pill: Economics · Country group, id: $.GROUP_ID }
strip:
  - { label: Group, bind: $.NAME }
  - { label: Type, bind: $.GROUP_TYPE }
  - { label: Economies, bind: $.ECONOMIES, fmt: amount0 }
  - { label: GDP (USD bn), bind: $.GDP_USD_BN, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.GDP_PER_CAPITA, fmt: amount0 }
  - { label: Population (m), bind: $.POPULATION_M, fmt: price2 }
  - { label: Real growth, bind: $.GROWTH, fmt: pc2, tone: sign, emphasis: true }
panels:
  - { use: series-line@1, with: { id: growthPath, title: "Real GDP growth, % a year", key: F2, rows: $.GROWTH_PATH, x: YEAR, y: GROWTH, fmt: pc2 } }
  - use: measure-table@1
    with: { id: topEconomies, title: Largest economies, key: F3, rows: $.TOP_ECONOMIES, name-label: Economy, name: ECONOMY,
            first-label: GDP (USD bn), first: GDP_USD_BN, first-fmt: amount0, second-label: "Growth, %", second: GROWTH, second-fmt: pc2, second-tone: sign }
  - { use: series-line@1, with: { id: gdpPath, title: "GDP, USD bn", area: right, rows: $.GDP_PATH, x: YEAR, y: GDP, fmt: amount0 } }
  - { use: source-footer@1 }
keys: { F7: "link($.MEMBER_ECONOMIES, 'economy')", F8: impact, F9: raw }
