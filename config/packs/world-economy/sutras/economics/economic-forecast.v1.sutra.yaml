# Hand-written since 2.7.0 (Sutra Next phase 1): built from the Drishti UI kit (config/ui-kit/fragments, loaded by every server).
# tools/packgen/world/make.py leaves it alone (hand_written); SutraNextEquivalenceTest proves it draws exactly what the generated
# layout drew.
rachana: 1
sutra: economic-forecast
version: 1
description: "The IMF World Economic Outlook: growth, inflation, unemployment, external balance and debt, outturn and projections to 2031."
doc:
  summary: "An economy's IMF World Economic Outlook: growth, prices, jobs, external balance and debt, outturn and projections."
  description: >-
    One page per economy's IMF World Economic Outlook vintage: every IMF series by year, outturn and projection to 2031
    (growth, inflation, unemployment, current account, debt, net lending, GDP), the growth path beside it, the data source
    and licence, how the view was built and its links (F7 opens the economy). The strip gives the economy, the vintage,
    growth and inflation in 2027 and debt to GDP in 2030. IMF data: internal demonstrations only.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/economic-forecast/FCST-JPN-WEO"
    - "FCST FCST-JPN-WEO"
  since: "2.7.0"
match: { kind: economic-forecast, priority: 10 }
title: { pill: Economics · Economic forecast, id: $.FORECAST_ID }
strip:
  - { label: Economy, bind: $.ECONOMY_NAME }
  - { label: Vintage, bind: $.VINTAGE }
  - { label: Growth 2027, bind: $.GROWTH_2027, fmt: pc2, tone: sign, emphasis: true }
  - { label: Inflation 2027, bind: $.INFLATION_2027, fmt: pc2 }
  - { label: Debt / GDP 2030, bind: $.DEBT_2030, fmt: pc1 }
panels:
  - id: projections          # nine columns of one source: written in place (a fragment's columns are fixed)
    kind: table
    title: IMF series by year
    key: F2
    rows: $.PROJECTIONS
    columns:
      - { label: Year, bind: "@.YEAR" }
      - { label: Basis, bind: "@.BASIS" }
      - { label: "Growth, %", bind: "@.GROWTH", fmt: pc2, tone: sign }
      - { label: "Inflation, %", bind: "@.INFLATION", fmt: pc2 }
      - { label: "Unemployment, %", bind: "@.UNEMPLOYMENT", fmt: pc2 }
      - { label: "Current account, % GDP", bind: "@.CURRENT_ACCOUNT", fmt: pc2, tone: sign }
      - { label: "Debt, % GDP", bind: "@.DEBT", fmt: pc1 }
      - { label: "Net lending, % GDP", bind: "@.NET_LENDING", fmt: pc2, tone: sign }
      - { label: "GDP, USD bn", bind: "@.GDP", fmt: amount0 }
  - { use: series-line@1, with: { id: path, title: "Real GDP growth, % a year (to 2031)", area: right, rows: $.PATH, x: YEAR, y: GROWTH, fmt: pc2 } }
  - { use: source-footer@1 }
keys: { F7: "link($.ECONOMY, 'economy')", F8: impact, F9: raw }
