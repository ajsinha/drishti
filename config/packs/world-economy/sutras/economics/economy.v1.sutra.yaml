# Hand-written since 2.7.0 (Sutra Next phase 1): built from the shared fragment library (core pack, sutras/library).
# tools/packgen/world/make.py leaves it alone (hand_written); SutraNextEquivalenceTest proves it draws exactly what the generated
# layout drew.
rachana: 1
sutra: economy
version: 1
description: "An economy: output, growth, prices, jobs, debt and external balance, and output by sector, from World Bank, IMF and CIA data."
doc:
  summary: "An economy: output, growth, prices, jobs and debt, where it is on the map, and its output by sector."
  description: >-
    One page per economy: the world map with it highlighted and every economy shaded by GDP per capita (a click opens that
    economy), the real GDP growth path, output by sector as a share of GDP, the GDP path, the data source and licence, how
    the view was built and its links (F7 opens its region). The strip gives the economy, its region, GDP, GDP per capita,
    real growth, inflation, unemployment and debt to GDP.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/economy/ECON-IND"
    - "ECON ECON-USA"
  since: "2.7.0"
match: { kind: economy, priority: 10 }
title: { pill: Economics · Economy, id: $.ECONOMY_ID }
strip:
  - { label: Economy, bind: $.NAME }
  - { label: Region, bind: $.REGION_NAME }
  - { label: GDP (USD bn), bind: $.GDP_USD_BN, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.GDP_PER_CAPITA, fmt: amount0 }
  - { label: Real growth, bind: $.GROWTH, fmt: pc2, tone: sign, emphasis: true }
  - { label: Inflation, bind: $.INFLATION, fmt: pc2 }
  - { label: Unemployment, bind: $.UNEMPLOYMENT, fmt: pc2 }
  - { label: Debt / GDP, bind: $.DEBT_TO_GDP, fmt: pc1 }
panels:
  - use: region-map@1
    with: { highlight: $.ISO3, link-kind: economy, link-id: "ECON-{iso3}", shade-kind: economy, shade-field: $.GDP_PER_CAPITA, shade-by: $.ISO3,
            shade-fmt: amount0, shade-label: GDP per capita (USD) }
  - { use: series-line@1, with: { id: growthPath, title: "Real GDP growth, % a year", key: F2, rows: $.GROWTH_PATH, x: YEAR, y: GROWTH, fmt: pc2 } }
  - { use: ranked-bars@1, with: { id: sectors, title: "Output by sector, % of GDP", key: F3, area: right, rows: $.SECTORS, label: SECTOR, value: SHARE, fmt: pc1 } }
  - { use: series-line@1, with: { id: gdpPath, title: "GDP, USD bn", key: F4, rows: $.GDP_PATH, x: YEAR, y: GDP, fmt: amount0 } }
  - { use: source-footer@1 }
keys: { F7: "link($.REGION_GROUP, 'country-group')", F8: impact, F9: raw }
