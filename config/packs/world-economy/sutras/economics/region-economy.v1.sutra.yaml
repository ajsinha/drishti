# Hand-written since 2.7.0 (Sutra Next phase 1): built from the shared fragment library (core pack, sutras/library).
# tools/packgen/world/make.py leaves it alone (hand_written); SutraNextEquivalenceTest proves it draws exactly what the generated
# layout drew.
rachana: 1
sutra: region-economy
version: 1
description: "A state or territory (ISO 3166-2): population, GDP and GDP per head. An illustrative sample, rounded from public figures, not for reporting."
doc:
  summary: "A state or territory (ISO 3166-2): its population, GDP and GDP per head, an illustrative sample."
  description: >-
    One page per state or territory: what the figures are, the data source and licence, how the view was built and its
    links (F7 opens the country's economy). The strip gives the region, its ISO 3166-2 code, the country, population, GDP
    and GDP per capita. An illustrative sample rounded from public figures, not for reporting.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/region-economy/REGE-AU-NSW"
    - "REGE REGE-AU-NSW"
  since: "2.7.0"
match: { kind: region-economy, priority: 10 }
title: { pill: Economics · Region economy, id: $.REGION_ID }
strip:
  - { label: Region, bind: $.NAME }
  - { label: Code, bind: $.REGION_CODE }
  - { label: Country, bind: $.COUNTRY_NAME }
  - { label: Population (m), bind: $.POPULATION_M, fmt: price2 }
  - { label: GDP (USD bn), bind: $.GDP_USD_BN, fmt: amount0 }
  - { label: GDP per capita (USD), bind: $.GDP_PER_CAPITA, fmt: amount0, emphasis: true }
panels:
  - { use: field-list@1, with: { id: facts, title: About these figures, rows: $.FACTS } }
  - { use: source-footer@1 }
keys: { F7: "link($.ECONOMY, 'economy')", F8: impact, F9: raw }
