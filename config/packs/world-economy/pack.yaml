console:
  examples:
  - - ECON ECON-IND
    - India · growth path, output by sector
  - - ECON ECON-USA
    - United States · the same view
  - - MACRO MACRO-BRA-GDP-GROWTH
    - Brazil · one indicator with history and rank
  - - FCST FCST-JPN-WEO
    - Japan · IMF outlook to 2031
  - - LABR LABR-NGA
    - Nigeria · labour market
  - - FISC FISC-USA
    - United States · debt and balance
  - - ECG ECG-SAS
    - South Asia · a World Bank region
  - - REGE REGE-AU-NSW
    - New South Wales · an illustrative regional sample
  - - JUR JUR-IND
    - India · government, legislature, governance indicators
  - - JUR JUR-USA
    - United States · the same view
  - - ELEC ELEC-BRA-LOW
    - Brazil · lower-chamber result
  - - OFFC OFFC-JPN-HOG
    - Japan · head of government
  - - PARTY PARTY-IND-01
    - India · largest party in the lower chamber
  - - REGN REGN-SSF
    - Sub-Saharan Africa · a World Bank region
  - - SOCI SOCI-NGA-WGI-LAW
    - Nigeria · rule of law
