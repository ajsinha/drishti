# Generated by tools/packgen/world/make.py. Edit the generator, not this file.
# About this page: what the pack's kinds mean.
about: 1
vocabulary:
  gdp:
    term: GDP, current prices
    means: 'Gross domestic product at purchasers'' prices: the sum of gross value added by all resident producers plus product taxes less subsidies, in current US dollars converted
      at market exchange rates.'
    unit: USD bn
  gdp_pc:
    term: GDP per capita, current prices
    means: GDP divided by mid-year population, in current US dollars.
    unit: USD
  gdp_growth:
    term: Real GDP growth
    means: Annual percentage growth rate of GDP at market prices based on constant local currency, so inflation is removed.
    unit: '% a year'
  inflation:
    term: Inflation, consumer prices
    means: Annual percentage change in the cost to the average consumer of a basket of goods and services (consumer price index).
    unit: '% a year'
  unemployment:
    term: Unemployment rate
    means: Share of the labour force without work but available for and seeking employment (ILO modelled estimate).
    unit: '% of labour force'
  population:
    term: Population
    means: 'Total population: all residents regardless of legal status or citizenship, mid-year estimate.'
    unit: millions
  current_account:
    term: Current account balance
    means: Net exports of goods and services plus net primary and secondary income, as a share of GDP; negative means the country borrows from abroad.
    unit: '% of GDP'
  reserves:
    term: Total reserves incl. gold
    means: Holdings of monetary gold, special drawing rights, reserve position in the IMF and foreign exchange held by monetary authorities, in current US dollars.
    unit: USD bn
  trade:
    term: Trade
    means: Exports plus imports of goods and services as a share of GDP; a measure of openness.
    unit: '% of GDP'
  exports:
    term: Exports of goods and services
    means: Value of all goods and other market services provided to the rest of the world, as a share of GDP.
    unit: '% of GDP'
  imports:
    term: Imports of goods and services
    means: Value of all goods and other market services received from the rest of the world, as a share of GDP.
    unit: '% of GDP'
  fdi:
    term: Foreign direct investment, net inflows
    means: Net inflows of investment to acquire a lasting management interest (10 percent or more of voting stock) in a firm in another economy, as a share of GDP.
    unit: '% of GDP'
  co2:
    term: CO2 emissions per capita
    means: Carbon dioxide emissions excluding land use, in tonnes of CO2 equivalent per person.
    unit: t CO2e
  real_interest:
    term: Real interest rate
    means: The lending interest rate adjusted for inflation by the GDP deflator.
    unit: '% a year'
  agriculture:
    term: Agriculture, value added
    means: Value added of agriculture, forestry and fishing as a share of GDP.
    unit: '% of GDP'
  industry:
    term: Industry, value added
    means: Value added of mining, manufacturing, construction, electricity, water and gas as a share of GDP.
    unit: '% of GDP'
  services:
    term: Services, value added
    means: Value added of wholesale and retail trade, transport, government, financial, professional and personal services as a share of GDP.
    unit: '% of GDP'
  lfp:
    term: Labour force participation rate
    means: Share of the population aged 15 and over that supplies labour for the production of goods and services (ILO modelled estimate).
    unit: '% of population 15+'
  youth_unemployment:
    term: Youth unemployment rate
    means: Share of the labour force aged 15-24 without work but available for and seeking employment.
    unit: '% of labour force 15-24'
  employment_ratio:
    term: Employment to population ratio
    means: Share of the population aged 15 and over that is employed.
    unit: '% of population 15+'
  female_lfp:
    term: Female labour force participation rate
    means: Share of women aged 15 and over that supplies labour for the production of goods and services.
    unit: '% of women 15+'
  vulnerable:
    term: Vulnerable employment
    means: 'Own-account and contributing family workers as a share of total employment: jobs with the least formal protection.'
    unit: '% of employment'
  emp_agriculture:
    term: Employment in agriculture
    means: Share of total employment in agriculture, forestry and fishing.
    unit: '% of employment'
  emp_industry:
    term: Employment in industry
    means: Share of total employment in mining, manufacturing, construction and utilities.
    unit: '% of employment'
  emp_services:
    term: Employment in services
    means: Share of total employment in services.
    unit: '% of employment'
  debt:
    term: General government gross debt
    means: All liabilities that require payment of interest or principal by the general government (central, state and local), as a share of GDP.
    unit: '% of GDP'
  net_lending:
    term: General government net lending/borrowing
    means: Revenue minus total expenditure of the general government; negative is a deficit.
    unit: '% of GDP'
  tax_revenue:
    term: Tax revenue
    means: Compulsory transfers to the central government for public purposes, as a share of GDP (central government, excluding social contributions).
    unit: '% of GDP'
  revenue:
    term: Revenue, excluding grants
    means: Central government cash receipts from taxes, social contributions and other revenue, excluding grants, as a share of GDP.
    unit: '% of GDP'
  expense:
    term: Expense
    means: Central government cash payments for operating activities (wages, goods and services, interest, subsidies, transfers), as a share of GDP.
    unit: '% of GDP'
  military:
    term: Military expenditure
    means: All current and capital spending on the armed forces, as a share of GDP (SIPRI).
    unit: '% of GDP'
  life_expectancy:
    term: Life expectancy at birth
    means: Number of years a newborn would live if prevailing patterns of mortality at the time of birth stayed the same throughout life.
    unit: years
  hdi:
    term: Human Development Index
    means: Composite of life expectancy, expected and mean years of schooling, and gross national income per capita; 0 is lowest, 1 highest (UNDP).
    unit: index 0-1
  fertility:
    term: Fertility rate
    means: Births per woman if she lived to the end of her childbearing years and bore children at current age-specific rates.
    unit: births per woman
  infant_mortality:
    term: Infant mortality rate
    means: Number of infants dying before reaching one year of age, per 1,000 live births.
    unit: per 1,000 live births
  under5_mortality:
    term: Under-5 mortality rate
    means: Probability per 1,000 that a newborn dies before reaching age five.
    unit: per 1,000 live births
  urban:
    term: Urban population
    means: People living in urban areas as defined by national statistical offices, as a share of the total population.
    unit: '% of population'
  pop_growth:
    term: Population growth
    means: Annual percentage change of the mid-year population.
    unit: '% a year'
  gini:
    term: Gini index
    means: 'Extent to which the distribution of income among households departs from perfect equality: 0 is perfect equality, 100 perfect inequality.'
    unit: index 0-100
  poverty:
    term: Extreme poverty headcount
    means: Share of the population living below the international poverty line (2021 purchasing power parity prices).
    unit: '% of population'
  literacy:
    term: Adult literacy rate
    means: Share of people aged 15 and above who can read and write a short simple statement about their everyday life.
    unit: '% of people 15+'
  secondary_enrolment:
    term: Secondary school enrolment
    means: Total enrolment in secondary education, regardless of age, as a share of the official secondary-school-age population (can exceed 100).
    unit: '% gross'
  internet:
    term: Individuals using the Internet
    means: Share of the population that used the Internet from any location in the last three months.
    unit: '% of population'
  electricity:
    term: Access to electricity
    means: Share of the population with access to electricity.
    unit: '% of population'
  health_spend:
    term: Current health expenditure
    means: Public and private spending on health care, as a share of GDP.
    unit: '% of GDP'
  education_spend:
    term: Government expenditure on education
    means: General government spending on education, as a share of GDP.
    unit: '% of GDP'
  women_parliament:
    term: Women in national parliament
    means: Share of parliamentary seats in a single or lower chamber held by women (Inter-Parliamentary Union).
    unit: '% of seats'
  wgi_voice:
    term: Voice and accountability
    means: Perceptions of the extent to which citizens can participate in selecting their government, and of freedom of expression, association and a free media. Higher is
      better.
    unit: index -2.5 to 2.5
  wgi_stability:
    term: Political stability and absence of violence
    means: Perceptions of the likelihood that the government will be destabilised or overthrown by unconstitutional or violent means, including terrorism. Higher is better.
    unit: index -2.5 to 2.5
  wgi_effectiveness:
    term: Government effectiveness
    means: Perceptions of the quality of public services, the civil service and its independence from political pressure, and policy formulation and implementation. Higher
      is better.
    unit: index -2.5 to 2.5
  wgi_regulatory:
    term: Regulatory quality
    means: Perceptions of the government's ability to formulate and implement sound policies and regulations that permit and promote private-sector development. Higher is better.
    unit: index -2.5 to 2.5
  wgi_law:
    term: Rule of law
    means: 'Perceptions of confidence in and abidance by the rules of society: contract enforcement, property rights, the police and the courts, and the likelihood of crime
      and violence. Higher is better.'
    unit: index -2.5 to 2.5
  wgi_corruption:
    term: Control of corruption
    means: Perceptions of the extent to which public power is exercised for private gain, including petty and grand corruption and capture of the state by elites. Higher is
      better.
    unit: index -2.5 to 2.5
kinds:
  economy:
    title: Economy
    about: ${$.NAME} (${$.REGION_NAME}) had a GDP of ${fmt($.GDP_USD_BN, 'amount0')} billion USD in ${$.YEAR}; real GDP grew ${fmt($.GROWTH, 'pc2')}, inflation was ${fmt($.INFLATION,
      'pc2')} and unemployment ${fmt($.UNEMPLOYMENT, 'pc2')}. Figures are published World Bank, IMF and CIA data.
    guide: world-economy
    glossary:
      NAME:
        term: Economy
        means: The country or territory, with the name the World Bank uses.
      REGION_NAME:
        term: World Bank region
        means: The World Bank geographic region the economy belongs to.
      GDP_USD_BN:
        term: Gross domestic product
        means: The value of all goods and services produced in the economy in a year, in current US dollars at market exchange rates.
        unit: USD billions
      GDP_PER_CAPITA:
        term: GDP per capita
        means: GDP divided by the mid-year population, in current US dollars.
        unit: USD
      GROWTH:
        term: Real GDP growth
        means: The yearly change of GDP after removing inflation, so it measures the growth of output rather than of prices.
        unit: '% a year'
        sign: Negative is a contraction.
      INFLATION:
        term: Inflation
        means: The yearly change of consumer prices (the consumer price index).
        unit: '% a year'
      UNEMPLOYMENT:
        term: Unemployment rate
        means: The share of the labour force without work but available for and seeking employment (ILO modelled estimate).
        unit: '% of labour force'
      DEBT_TO_GDP:
        term: Government debt to GDP
        means: General government gross debt as a share of a year's GDP (IMF), the usual measure of how heavy public debt is.
        unit: '% of GDP'
      CURRENT_ACCOUNT:
        term: Current account balance
        means: Net exports of goods and services plus net income and transfers, as a share of GDP.
        unit: '% of GDP'
        sign: Negative means the economy borrows from abroad.
      GROWTH_PATH.YEAR:
        term: Year
        means: The calendar year of the observation.
      GROWTH_PATH.GROWTH:
        term: Real GDP growth
        means: Real GDP growth in that year.
        unit: '% a year'
        sign: Negative is a contraction.
      GDP_PATH.YEAR:
        term: Year
        means: The calendar year of the observation.
      GDP_PATH.GDP:
        term: GDP
        means: GDP in current US dollars in that year.
        unit: USD billions
      SECTORS.SECTOR:
        term: Sector
        means: Agriculture, industry or services, as the World Bank groups value added.
      SECTORS.SHARE:
        term: Share of GDP
        means: The sector's value added as a share of GDP.
        unit: '% of GDP'
      PROVENANCE.SOURCE:
        term: Source
        means: The organisation or organisations whose published data this view shows.
      PROVENANCE.DATASET:
        term: Dataset
        means: The named dataset and its vintage (the release the numbers come from).
      PROVENANCE.RETRIEVED_AT:
        term: Retrieved
        means: The date the data was downloaded by tools/realdata.
      PROVENANCE.LICENCE:
        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
  macro-indicator:
    title: Macro indicator
    about: ${$.NAME} was ${fmt($.LATEST, 'price2')} (${$.UNIT}) in ${$.LATEST_YEAR}; its rank among economies with recent data is ${fmt($.RANK, 'amount0')}.
    guide: world-economy
    glossary:
      NAME:
        term: Indicator
