        term: Licence
        means: The terms under which the source allows reuse; attribution is required.
      PROVENANCE.ATTRIBUTION:
        term: Attribution
        means: The credit line to repeat when the data is shown or republished.
      PROVENANCE.URL:
        term: Source address
        means: The web page of the dataset.
