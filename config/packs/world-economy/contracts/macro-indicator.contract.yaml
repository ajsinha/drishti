# Data contract of the macro-indicator kind (command MACRO): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap macro-indicator`; owned by people from then on: confirm the review points, then remove them.
kind: macro-indicator
mnemonic: MACRO
pack: world-economy
version: '1.0'
class: fundamental
status: active
title: Macro indicator
description: 'One headline statistic of one economy: the series, the latest value, the change and the rank among economies.'
source: 'public data: World Bank, World Development Indicators'
grain: One row per macro indicator, keyed by INDICATOR_ID.
key:
- INDICATOR_ID
id-pattern:
- ^MACRO-
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: macro-store
  plugin: delta
  domain: macro
  table: <root>/macro/macro-indicator/
  test-data:
  - config/packs/world-economy/samples
fields:
- name: INDICATOR_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: MACRO-ABW-AGRICULTURE
  pattern: ^MACRO-
- name: NAME
  type: text
  presence: required
  description: The economy and the statistic, as one name.
  example: Aruba · Agriculture, value added
- name: INDICATOR
  type: text
  presence: required
  description: The indicator's name as the World Bank publishes it (Agriculture, value added).
  example: Agriculture, value added
- name: COUNTRY_NAME
  type: text
  presence: required
  description: The economy's name (Aruba).
  example: Aruba
- name: UNIT
  type: text
  presence: required
  description: 'What the value measures: a rate, a share of GDP, a level in US dollars.'
  example: '% of GDP'
  enum:
  - '% a year'
  - '% of GDP'
  - USD
  - USD bn
  - millions
  - t CO2e
- name: DEFINITION
  type: text
  presence: required
  description: 'The source''s definition of the indicator.'
  example: Value added of agriculture, forestry and fishing as a share…
- name: LATEST
  type: amount
  presence: required
  description: The most recent published value of the statistic, in the unit shown.
  example: 0.0395295
- name: LATEST_YEAR
  type: text
  presence: required
  description: The calendar year the latest value refers to.
  example: '2023'
- name: PREVIOUS
  type: amount
  presence: optional
  description: The value one year before the latest observation, where published.
  example: 0.0341749
- name: PREVIOUS_YEAR
  type: text
  presence: optional
  description: 'The year of the previous value the change is measured from.'
  example: '2022'
- name: RANK
  type: integer
  presence: optional
  description: The position of the economy among all economies with a value from 2022 or later, highest value first.
  example: 193
- name: OF_COUNT
  type: integer
  presence: optional
  description: 'How many economies the rank is among.'
  example: 196
- name: HISTORY
  type: record list
  presence: required
  description: 'The indicator by year, oldest first, one element per year: YEAR (text) and VALUE in the unit of FACTS.UNIT.'
- name: FACTS
  type: record
  presence: required
  description: 'About the indicator, one object: INDICATOR, UNIT (% of GDP, t CO2e …), LATEST_YEAR, RANK ("34 of 182", highest value first) and WORLD_BANK_CODE.'
- name: ECONOMY
  type: id
  presence: required
  description: 'The economy: an id of the economy kind (ECON-<ISO3>).'
  example: ECON-ABW
  pattern: ^ECON-
  link: economy
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE (World Bank WDI), DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION and URL.'
nested:
  HISTORY[]:
  - name: YEAR
    type: text
    presence: required
    description: The calendar year of the observation.
    example: '2015'
  - name: VALUE
    type: amount
    presence: required
    description: The published value for that year, in the unit shown.
    example: 0.0125198
  FACTS:
  - name: INDICATOR
    type: text
    presence: required
    description: The indicator's name, the same as INDICATOR.
    example: Agriculture, value added
  - name: UNIT
    type: text
    presence: required
    description: What the value measures.
    example: '% of GDP'
    enum:
    - '% a year'
    - '% of GDP'
    - USD
    - USD bn
    - millions
    - t CO2e
  - name: LATEST_YEAR
    type: text
    presence: required
    description: The year of the latest value.
    example: '2023'
  - name: RANK
    type: text
    presence: required
    description: The economy's position among economies with recent data, highest value first.
    example: 193 of 196
  - name: WORLD_BANK_CODE
    type: text
    presence: required
    description: The indicator code in the World Bank API, for looking the series up at the source.
    example: NV.AGR.TOTL.ZS
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation or organisations whose published data this view shows.
    example: World Bank, World Development Indicators
  - name: DATASET
    type: text
    presence: required
    description: The named dataset and its vintage (the release the numbers come from).
    example: World Development Indicators (updated 2026-10-08)
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The date the data was downloaded by tools/realdata.
    example: '2026-10-10'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse; attribution is required.
    example: CC BY 4.0
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'The World Bank: World Development Indicators (CC BY 4.0).'
  - name: URL
    type: text
    presence: required
    description: The web page of the dataset.
    example: https://databank.worldbank.org/source/world-development-ind…
links:
- field: ECONOMY
  kind: economy
validation:
- rule: required
  fields:
  - INDICATOR_ID
  - NAME
  - INDICATOR
  - COUNTRY_NAME
  - UNIT
  - DEFINITION
  - LATEST
  - LATEST_YEAR
  - HISTORY
  - FACTS
  - ECONOMY
  - PROVENANCE
- rule: unique
  key:
  - INDICATOR_ID
  per: snapshot
- rule: pattern
  field: INDICATOR_ID
  pattern: ^MACRO-
- rule: enum
  field: UNIT
  values:
  - '% a year'
  - '% of GDP'
  - USD
  - USD bn
  - millions
  - t CO2e
- rule: range
  field: OF_COUNT
  min: 0
- rule: link
  field: ECONOMY
  kind: economy
- rule: enum
  field: FACTS.UNIT
  values:
  - '% a year'
  - '% of GDP'
  - USD
  - USD bn
  - millions
  - t CO2e
notes: []
review:
- 'required inferred from 100% coverage in 3119 documents (3119 samples): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'key INDICATOR_ID is the field holding the sample catalogue''s id (MACRO-ABW-AGRICULTURE): confirm it is the business key.'
- 'a snapshot refreshed when tools/publicdata/world_economy.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: UNIT, FACTS.UNIT: confirm they are closed lists.'
- 'number types decided by the field''s name: HISTORY[].VALUE amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts LATEST, PREVIOUS, HISTORY[].VALUE (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
