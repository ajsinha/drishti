# Data contract of the office-holder kind (command OFFC): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap office-holder`; owned by people from then on: confirm the review points, then remove them.
kind: office-holder
mnemonic: OFFC
pack: world-economy
version: '1.0'
class: fundamental
status: active
title: Office holder
description: The chief of state or head of government of a country as the CIA World Factbook publishes them, with how the office is filled.
source: 'public data: CIA, The World Factbook (factbook.json mirror, CC0)'
grain: One row per office holder, keyed by OFFICE_ID.
key:
- OFFICE_ID
id-pattern:
- ^OFFC-
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: civic-store
  plugin: delta
  domain: civic
  table: <root>/civic/office-holder/
  test-data:
  - config/packs/world-economy/samples
fields:
- name: OFFICE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: OFFC-ABW-COS
  pattern: ^OFFC-
- name: COUNTRY_NAME
  type: text
  presence: required
  description: The country the office belongs to.
  example: Aruba
- name: ROLE
  type: text
  presence: required
  description: Chief of state (the ceremonial or constitutional head) or head of government (who leads the executive).
  example: Chief of state
  enum:
  - Chief of state
  - Head of government
- name: HOLDER
  type: text
  presence: required
  description: The title and name of the office holder as the Factbook publishes them; surnames are in capitals.
  example: King WILLEM-ALEXANDER of the Netherlands; represented by Go…
- name: SINCE
  type: text
  presence: optional
  description: The date the holder took office, as published.
  example: 30 April 2013
- name: PUBLISHED
  type: text
  presence: required
  example: King WILLEM-ALEXANDER of the Netherlands (since 30 April 20…
- name: PROCESS
  type: text
  presence: optional
  example: the monarchy is hereditary; governor general appointed by t…
- name: ELECTION_HELD
  type: text
  presence: optional
  example: 6 December 2024
- name: NEXT_ELECTION
  type: text
  presence: optional
  example: by December 2028
- name: RESULTS
  type: text
  presence: optional
  example: Mike EMAN (AVP) elected prime minister; percent of Staten v…
- name: GOVERNMENT_TYPE
  type: text
  presence: required
  description: The form of government.
  example: parliamentary democracy; part of the Kingdom of the Netherl…
- name: CABINET
  type: text
  presence: optional
  example: Council of Ministers elected by the Legislature (Staten)
- name: JURISDICTION
  type: id
  presence: required
  description: 'Country: the jurisdiction it refers to'
  example: JUR-ABW
  pattern: ^JUR-
  link: jurisdiction
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
- name: MANDATE
  type: record
  presence: required
  description: 'Nested: see nested MANDATE'
nested:
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation or organisations whose published data this view shows.
    example: CIA, The World Factbook (factbook.json mirror, CC0)
  - name: DATASET
    type: text
    presence: required
    description: The named dataset and its vintage (the release the numbers come from).
    example: The World Factbook (mirror commit 144d6977b2)
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The date the data was downloaded by tools/realdata.
    example: '2026-10-10'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse; attribution is required.
    example: Public domain (U.S. Government work); the factbook.json mir…
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: Central Intelligence Agency, The World Factbook (public dom…
  - name: URL
    type: text
    presence: required
    description: The web page of the dataset.
    example: https://www.cia.gov/the-world-factbook/
  MANDATE:
  - name: SELECTION
    type: text
    presence: optional
    description: How the office is filled.
    example: the monarchy is hereditary; governor general appointed by t…
  - name: HELD_ON
    type: text
    presence: optional
    description: When the office was last filled by election, as published.
    example: 6 December 2024
  - name: NEXT_ELECTION
    type: text
    presence: optional
    description: When the next election is due, as published.
    example: by December 2028
  - name: RESULTS
    type: text
    presence: optional
    description: The result of the last election, as published.
    example: Mike EMAN (AVP) elected prime minister; percent of Staten v…
  - name: AS_PUBLISHED
    type: text
    presence: required
    description: The Factbook's full entry for the office holder.
    example: King WILLEM-ALEXANDER of the Netherlands (since 30 April 20…
  - name: CABINET
    type: text
    presence: optional
    description: How the cabinet is chosen.
    example: Council of Ministers elected by the Legislature (Staten)
links:
- field: JURISDICTION
  kind: jurisdiction
validation:
- rule: required
  fields:
  - OFFICE_ID
  - COUNTRY_NAME
  - ROLE
  - HOLDER
  - PUBLISHED
  - GOVERNMENT_TYPE
  - JURISDICTION
  - PROVENANCE
  - MANDATE
- rule: unique
  key:
  - OFFICE_ID
  per: snapshot
- rule: pattern
  field: OFFICE_ID
  pattern: ^OFFC-
- rule: enum
  field: ROLE
  values:
  - Chief of state
  - Head of government
- rule: link
  field: JURISDICTION
  kind: jurisdiction
notes: []
review:
- 'required inferred from 100% coverage in 430 documents (430 samples): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'key OFFICE_ID is the field holding the sample catalogue''s id (OFFC-ABW-COS): confirm it is the business key.'
- 'a snapshot refreshed when tools/publicdata/world_economy.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: ROLE: confirm they are closed lists.'
- 'no description in about.yaml or the Sutras for PUBLISHED, PROCESS, ELECTION_HELD, NEXT_ELECTION, RESULTS, CABINET: write them in the pack''s
  config/about.yaml glossary.'
