# Data contract of the social-indicator kind (command SOCI): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap social-indicator`; owned by people from then on: confirm the review points, then remove them.
kind: social-indicator
mnemonic: SOCI
pack: world-economy
version: '1.0'
class: fundamental
status: active
title: Social indicator
description: 'A social or governance statistic of one country over time, with the regional comparison: health, education, inequality, rights and
  rule of law.'
source: 'public data: World Bank, World Development Indicators'
grain: One row per social indicator, keyed by INDICATOR_ID.
key:
- INDICATOR_ID
id-pattern:
- ^SOCI-
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: civic-store
  plugin: delta
  domain: civic
  table: <root>/civic/social-indicator/
  test-data:
  - config/packs/world-economy/samples
fields:
- name: INDICATOR_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: SOCI-ABW-EDUCATION-SPEND
  pattern: ^SOCI-
- name: NAME
  type: text
  presence: required
  description: The country and the statistic.
  example: Aruba · Government expenditure on education
- name: INDICATOR
  type: text
  presence: required
  example: Government expenditure on education
- name: COUNTRY_NAME
  type: text
  presence: required
  example: Aruba
- name: THEME
  type: text
  presence: required
  example: Society
  enum:
  - Governance
  - Society
- name: LATEST
  type: amount
  presence: required
  description: The most recent published value.
  example: 3.61856
- name: LATEST_YEAR
  type: text
  presence: required
  description: The year of the latest value.
  example: '2021'
- name: UNIT
  type: text
  presence: required
  description: What the value measures.
  example: '% of GDP'
- name: CHANGE_5Y
  type: amount
  presence: optional
  description: The latest value minus the value about five years earlier.
  example: -1.8728
- name: SOURCE_NAME
  type: text
  presence: required
  description: The dataset the series comes from.
  example: World Bank, World Development Indicators
  enum:
  - 'UNDP, Human Development Report: composite indices time series'
  - World Bank, World Development Indicators
  - World Bank, Worldwide Governance Indicators
- name: DEFINITION
  type: text
  presence: required
  example: General government spending on education, as a share of GDP.
- name: SERIES
  type: record list
  presence: required
  description: 'Nested: see nested SERIES[]'
- name: BY_REGION
  type: record list
  presence: required
  description: 'Nested: see nested BY_REGION[]'
- name: REGION_NAME
  type: text
  presence: required
  example: Latin America & Caribbean
  enum:
  - East Asia & Pacific
  - Europe & Central Asia
  - Latin America & Caribbean
  - Middle East, North Africa, Afghanistan & Pakistan
  - North America
  - South Asia
  - Sub-Saharan Africa
- name: JURISDICTION
  type: id
  presence: required
  description: 'Country: the jurisdiction it refers to'
  example: JUR-ABW
  pattern: ^JUR-
  link: jurisdiction
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
- name: MEANING
  type: record
  presence: required
  description: 'Nested: see nested MEANING'
nested:
  SERIES[]:
  - name: YEAR
    type: text
    presence: required
    description: The calendar year.
    example: '2015'
  - name: VALUE
    type: amount
    presence: required
    description: The published value in that year.
    example: 5.88827
  BY_REGION[]:
  - name: COUNTRY
    type: text
    presence: required
    description: The country, from the same World Bank region.
    example: Cuba
  - name: VALUE
    type: amount
    presence: required
    description: The latest value (2022 or later) for that country.
    example: 8.44086
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation or organisations whose published data this view shows.
    example: World Bank, World Development Indicators
    enum:
    - 'UNDP, Human Development Report: composite indices time series'
    - World Bank, World Development Indicators
    - World Bank, Worldwide Governance Indicators
  - name: DATASET
    type: text
    presence: required
    description: The named dataset and its vintage (the release the numbers come from).
    example: World Development Indicators (updated 2026-10-08)
    enum:
    - Human Development Index time series (2025 report)
    - World Development Indicators (updated 2026-10-08)
    - Worldwide Governance Indicators (updated 2026-09-25)
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The date the data was downloaded by tools/realdata.
    example: '2026-10-10'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse; attribution is required.
    example: CC BY 4.0
    enum:
    - CC BY 3.0 IGO
    - CC BY 4.0
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'The World Bank: World Development Indicators (CC BY 4.0).'
    enum:
    - 'The World Bank: World Development Indicators (CC BY 4.0).'
    - 'The World Bank: Worldwide Governance Indicators (CC BY 4.0).'
    - UNDP, Human Development Report 2025 data (CC BY 3.0 IGO).
  - name: URL
    type: text
    presence: required
    description: The web page of the dataset.
    example: https://databank.worldbank.org/source/world-development-ind…
    enum:
    - https://databank.worldbank.org/source/world-development-indicators
    - https://hdr.undp.org/data-center/documentation-and-downloads
    - https://www.worldbank.org/en/publication/worldwide-governance-indicators
  MEANING:
  - name: INDICATOR
    type: text
    presence: required
    description: The statistic's name.
    example: Government expenditure on education
  - name: UNIT
    type: text
    presence: required
    description: What the value measures.
    example: '% of GDP'
  - name: DEFINITION
    type: text
    presence: required
    description: The source's definition of the statistic.
    example: General government spending on education, as a share of GDP.
  - name: COMPARED_WITH
    type: text
    presence: required
    description: The countries the bar chart compares with.
    example: countries of Latin America & Caribbean (latest value, 2022 …
    enum:
    - countries of East Asia & Pacific (latest value, 2022 or later)
    - countries of Europe & Central Asia (latest value, 2022 or later)
    - countries of Latin America & Caribbean (latest value, 2022 or later)
    - countries of Middle East, North Africa, Afghanistan & Pakistan (latest value, 2022 or later)
    - countries of North America (latest value, 2022 or later)
    - countries of South Asia (latest value, 2022 or later)
    - countries of Sub-Saharan Africa (latest value, 2022 or later)
links:
- field: JURISDICTION
  kind: jurisdiction
validation:
- rule: required
  fields:
  - INDICATOR_ID
  - NAME
  - INDICATOR
  - COUNTRY_NAME
  - THEME
  - LATEST
  - LATEST_YEAR
  - UNIT
  - SOURCE_NAME
  - DEFINITION
  - SERIES
  - BY_REGION
  - REGION_NAME
  - JURISDICTION
  - PROVENANCE
  - MEANING
- rule: unique
  key:
  - INDICATOR_ID
  per: snapshot
- rule: pattern
  field: INDICATOR_ID
  pattern: ^SOCI-
- rule: enum
  field: THEME
  values:
  - Governance
  - Society
- rule: enum
  field: SOURCE_NAME
  values:
  - 'UNDP, Human Development Report: composite indices time series'
  - World Bank, World Development Indicators
  - World Bank, Worldwide Governance Indicators
- rule: enum
  field: REGION_NAME
  values:
  - East Asia & Pacific
  - Europe & Central Asia
  - Latin America & Caribbean
  - Middle East, North Africa, Afghanistan & Pakistan
  - North America
  - South Asia
  - Sub-Saharan Africa
- rule: link
  field: JURISDICTION
  kind: jurisdiction
- rule: enum
  field: PROVENANCE.SOURCE
  values:
  - 'UNDP, Human Development Report: composite indices time series'
  - World Bank, World Development Indicators
  - World Bank, Worldwide Governance Indicators
- rule: enum
  field: PROVENANCE.DATASET
  values:
  - Human Development Index time series (2025 report)
  - World Development Indicators (updated 2026-10-08)
  - Worldwide Governance Indicators (updated 2026-09-25)
- rule: enum
  field: PROVENANCE.LICENCE
  values:
  - CC BY 3.0 IGO
  - CC BY 4.0
- rule: enum
  field: PROVENANCE.ATTRIBUTION
  values:
  - 'The World Bank: World Development Indicators (CC BY 4.0).'
  - 'The World Bank: Worldwide Governance Indicators (CC BY 4.0).'
  - UNDP, Human Development Report 2025 data (CC BY 3.0 IGO).
- rule: enum
  field: PROVENANCE.URL
  values:
  - https://databank.worldbank.org/source/world-development-indicators
  - https://hdr.undp.org/data-center/documentation-and-downloads
  - https://www.worldbank.org/en/publication/worldwide-governance-indicators
- rule: enum
  field: MEANING.COMPARED_WITH
  values:
  - countries of East Asia & Pacific (latest value, 2022 or later)
  - countries of Europe & Central Asia (latest value, 2022 or later)
  - countries of Latin America & Caribbean (latest value, 2022 or later)
  - countries of Middle East, North Africa, Afghanistan & Pakistan (latest value, 2022 or later)
  - countries of North America (latest value, 2022 or later)
  - countries of South Asia (latest value, 2022 or later)
  - countries of Sub-Saharan Africa (latest value, 2022 or later)
notes: []
review:
- 'required inferred from 100% coverage in 4297 documents (4297 samples): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'key INDICATOR_ID is the field holding the sample catalogue''s id (SOCI-ABW-EDUCATION-SPEND): confirm it is the business key.'
- 'a snapshot refreshed when tools/publicdata/world_economy.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: THEME, SOURCE_NAME, REGION_NAME, PROVENANCE.SOURCE, PROVENANCE.DATASET, PROVENANCE.LICENCE,
  PROVENANCE.ATTRIBUTION, PROVENANCE.URL, MEANING.COMPARED_WITH: confirm they are closed lists.'
- 'number types decided by the field''s name: SERIES[].VALUE amount, BY_REGION[].VALUE amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts LATEST, CHANGE_5Y, SERIES[].VALUE, BY_REGION[].VALUE (docs/contracts/README.md section 7: USD unless stated):
  confirm the currency.'
- 'no description in about.yaml or the Sutras for INDICATOR, COUNTRY_NAME, THEME, DEFINITION, REGION_NAME: write them in the pack''s config/about.yaml
  glossary.'
