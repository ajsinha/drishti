  summary: "A country:"
  description: >-
    A country: government type, capital, legislature and seats by party, office holders, elections and governance indicators,
    from the CIA World Factbook, World Bank and UNDP. One page per jurisdiction, its panels: where it is; seats by party, lower
    chamber; society and governance (latest); profile; political parties (as published); data source and licence; how the view
    was built; the entities it links to. The strip gives Country, Capital, Government, Population (m), Area (km2) and Currency.
    Linked entities: world region (region), chief of state (office-holder), head of government (office-holder), last election
    (election), elections (election), parties with seats (party) and indicators (social-indicator).
