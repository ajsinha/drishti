# Data contract of the press-release kind (command PREL): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap press-release`; owned by people from then on: confirm the review points, then remove them.
kind: press-release
mnemonic: PREL
pack: official-news
version: '1.0'
class: fundamental
status: active
title: Press release
description: 'One official press release: its title, publisher, date, summary and the link to the original.'
source: 'public data: Federal Reserve Board; European Central Bank; Bank of Canada; Bank of England; US Securities and Exchange Commission; OSFI; US Federal
  Register; Canada Gazette, Part II; Canada Gazette, Part I, pulled by the official-news feed (config/feeds/official-news.yaml, tools/feeds/sources/)'
grain: One row per press release, keyed by RELEASE_ID.
key:
- RELEASE_ID
id-pattern:
- ^PREL-
dated-by: snapshot
cadence:
  frequency: daily
  due: the official-news feed's schedule (0 23 * * * UTC); a pull with nothing new writes nothing and the lake keeps its latest date
binding-hint:
  lake-table: officialnews.press-release
  test-data:
  - config/packs/economy/official-news/samples
fields:
- name: RELEASE_ID
  type: id
  presence: required
  description: PREL-, the publisher's id and the first ten hex digits of the SHA-1 of the release's address.
  example: PREL-FED-0224349908
  pattern: ^PREL-
- name: TITLE
  type: text
  presence: required
  description: The release's title as the publisher's feed gives it.
  example: Federal Reserve Board announces termination of enforcement …
- name: PUBLISHED
  type: timestamp
  presence: optional
  description: When the release was published, in UTC.
  example: '2026-11-05T16:00:00Z'
- name: DATE
  type: date
  presence: optional
  description: The day it was published (UTC).
  example: '2026-11-05'
- name: URL
  type: text
  presence: required
  description: 'The release on the publisher''s site: open it for the full text.'
  example: https://www.federalreserve.gov/newsevents/pressreleases/enf…
- name: SUMMARY
  type: text
  presence: optional
  description: The summary the publisher's feed gives, as plain text cut at 400 characters; empty when the feed gives none.
  example: Federal Reserve Board announces termination of enforcement …
- name: CATEGORY
  type: text
  presence: optional
  description: 'The publisher''s category (the Federal Register: the document type and agencies).'
  example: Enforcement Actions
- name: RELEASE_SOURCE
  type: id
  presence: required
  description: The publisher's page (PRESS-<id>).
  example: PRESS-FED
  pattern: ^PRESS-
  link: release-source
- name: PUBLISHER_NAME
  type: text
  presence: required
  description: The publisher's name.
  example: Federal Reserve Board
- name: PUBLISHER_TYPE
  type: text
  presence: required
  description: What the publisher is.
  example: central bank
  enum:
  - central bank
  - regulator
  - government
- name: COUNTRY
  type: text
  presence: required
  description: The ISO 3166-1 alpha-3 code of the publisher's country (EMU for the euro area).
  example: USA
- name: INTERNAL_ONLY
  type: boolean
  presence: required
  description: 'True when the publisher''s terms allow no commercial reuse: the record stays inside the organisation (Export data refuses it).'
  example: false
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
nested:
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The publisher.
    example: Federal Reserve Board
  - name: DATASET
    type: text
    presence: required
    description: The publisher's feed the record was read from.
    example: 'Federal Reserve Board: press releases'
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The publisher's terms of reuse, as recorded in the feed's YAML.
    example: Public domain (US government work); cite the Board as the s…
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the release is shown or republished.
    example: 'Source: Board of Governors of the Federal Reserve System.'
  - name: URL
    type: text
    presence: required
    description: The original on the publisher's site.
    example: https://www.federalreserve.gov/newsevents/pressreleases/enf…
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: 'True when the publisher''s terms allow no commercial reuse: the record stays inside the organisation (Export data refuses it).'
    example: false
links:
- field: RELEASE_SOURCE
  kind: release-source
validation:
- rule: required
  fields:
  - RELEASE_ID
  - TITLE
  - URL
  - RELEASE_SOURCE
  - PUBLISHER_NAME
  - PUBLISHER_TYPE
  - COUNTRY
  - INTERNAL_ONLY
  - PROVENANCE
- rule: unique
  key:
  - RELEASE_ID
  per: snapshot
- rule: pattern
  field: RELEASE_ID
  pattern: ^PREL-
- rule: link
  field: RELEASE_SOURCE
  kind: release-source
- rule: enum
  field: PUBLISHER_TYPE
  values:
  - central bank
  - regulator
  - government
notes:
- Stored in the newslake lake (config/lakes/newslake.yaml), table <data>/delta/newslake/officialnews/press-release/, one JSONL.gz a business date loaded
  with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
