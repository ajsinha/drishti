# Data contract of the release-source kind (command PRESS): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap release-source`; owned by people from then on: confirm the review points, then remove them.
kind: release-source
mnemonic: PRESS
pack: official-news
version: '1.0'
class: fundamental
status: active
title: Official press releases
description: 'One publisher of official news (a central bank, a regulator, a government): its latest releases newest first, each a link, and its terms.'
source: 'public data: Federal Reserve Board; European Central Bank; Bank of Canada; Bank of England; US Securities and Exchange Commission; OSFI; US Federal
  Register; Canada Gazette, Part II; Canada Gazette, Part I, pulled by the official-news feed (config/feeds/official-news.yaml, tools/feeds/sources/)'
grain: One row per official press releases, keyed by SOURCE_ID.
key:
- SOURCE_ID
id-pattern:
- ^PRESS-
dated-by: snapshot
cadence:
  frequency: daily
  due: the official-news feed's schedule (0 23 * * * UTC); a pull with nothing new writes nothing and the lake keeps its latest date
storage:
  connector: officialnews-store
  plugin: delta
  domain: officialnews
  table: <root>/officialnews/release-source/
  test-data:
  - config/packs/economy/official-news/samples
fields:
- name: SOURCE_ID
  type: id
  presence: required
  description: PRESS- and the publisher's id in the feed's YAML (FED, ECB, BOC, BOE, SEC, OSFI, FEDREG, GAZETTE1, GAZETTE2).
  example: PRESS-BOC
  pattern: ^PRESS-
- name: NAME
  type: text
  presence: required
  description: The publisher's name.
  example: Bank of Canada
- name: PUBLISHER_TYPE
  type: text
  presence: required
  description: What the publisher is.
  example: central bank
  enum:
  - central bank
  - regulator
  - government
- name: COUNTRY
  type: text
  presence: required
  description: The ISO 3166-1 alpha-3 code of the publisher's country (EMU for the euro area).
  example: CAN
- name: WEBSITE
  type: text
  presence: optional
  description: The publisher's page of releases.
  example: https://www.bankofcanada.ca/press/press-releases/
- name: FEED_URL
  type: text
  presence: required
  description: The address the feed reads (RSS, Atom, or the Federal Register's API).
  example: https://www.bankofcanada.ca/content_type/press-releases/fee…
- name: LICENCE
  type: text
  presence: required
  description: The publisher's terms of reuse, as recorded in the feed's YAML.
  example: 'Bank of Canada terms of use: free to use, copy, distribute …'
- name: TERMS_URL
  type: text
  presence: optional
  description: The publisher's terms page.
  example: https://www.bankofcanada.ca/terms/
- name: INTERNAL_ONLY
  type: boolean
  presence: required
  description: 'True when the publisher''s terms allow no commercial reuse: the record stays inside the organisation (Export data refuses it).'
  example: false
- name: WHY_INTERNAL
  type: text
  presence: optional
  description: Why the publisher's releases are internal only, in words; empty when they are not.
  example: The Bank of England allows personal and internal non-commer…
- name: RELEASES
  type: integer
  presence: required
  description: How many releases are kept (the last keep-days, at most keep-per-source).
  example: 5
- name: LAST_PUBLISHED
  type: timestamp
  presence: optional
  description: When the newest kept release was published (UTC).
  example: '2026-11-05T16:00:19Z'
- name: LAST_PULL
  type: text
  presence: required
  description: ok, or failed (the kept releases are shown) when the publisher's feed could not be read.
  example: ok
- name: LATEST
  type: record list
  presence: required
  description: 'The newest 25 releases, newest first: PUBLISHED, TITLE, URL, CATEGORY and PRESS_RELEASE.'
- name: BY_CATEGORY
  type: record list
  presence: required
  description: The kept releases counted by category (CATEGORY, COUNT), the largest first.
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
nested:
  LATEST[]:
  - name: PUBLISHED
    type: timestamp
    presence: required
    description: When the release was published (UTC).
    example: '2026-11-05T16:00:19Z'
  - name: TITLE
    type: text
    presence: required
    description: The release's title.
    example: Joint Statement of the Government of Canada and the Bank of…
  - name: URL
    type: text
    presence: required
    description: The release on the publisher's site.
    example: https://www.bankofcanada.ca/2026/11/joint-statement-of-the-…
  - name: CATEGORY
    type: text
    presence: optional
    description: The publisher's category for it, where its feed gives one.
    example: Enforcement Actions
  - name: PRESS_RELEASE
    type: id
    presence: required
    description: The release's page in Drishti (PREL-...).
    example: PREL-BOC-539E907647
    pattern: ^PREL-
    link: press-release
  BY_CATEGORY[]:
  - name: CATEGORY
    type: text
    presence: required
    description: The category, Uncategorised when the feed gives none.
    example: Uncategorised
  - name: COUNT
    type: integer
    presence: required
    description: How many kept releases have that category.
    example: 5
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The publisher.
    example: Bank of Canada
  - name: DATASET
    type: text
    presence: required
    description: The publisher's feed the record was read from.
    example: 'Bank of Canada: press releases'
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The publisher's terms of reuse, as recorded in the feed's YAML.
    example: 'Bank of Canada terms of use: free to use, copy, distribute …'
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the release is shown or republished.
    example: 'Source: Bank of Canada.'
  - name: URL
    type: text
    presence: required
    description: The original on the publisher's site.
    example: https://www.bankofcanada.ca/press/press-releases/
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: 'True when the publisher''s terms allow no commercial reuse: the record stays inside the organisation (Export data refuses it).'
    example: false
links:
- field: LATEST[].PRESS_RELEASE
  kind: press-release
validation:
- rule: required
  fields:
  - SOURCE_ID
  - NAME
  - PUBLISHER_TYPE
  - COUNTRY
  - FEED_URL
  - LICENCE
  - INTERNAL_ONLY
  - RELEASES
  - LAST_PULL
  - LATEST
  - BY_CATEGORY
  - PROVENANCE
- rule: unique
  key:
  - SOURCE_ID
  per: snapshot
- rule: pattern
  field: SOURCE_ID
  pattern: ^PRESS-
- rule: enum
  field: PUBLISHER_TYPE
  values:
  - central bank
  - regulator
  - government
- rule: link
  field: LATEST[].PRESS_RELEASE
  kind: press-release
- rule: range
  field: BY_CATEGORY[].COUNT
  min: 0
notes:
- Stored in the newslake lake (config/lakes/newslake.yaml), table <data>/delta/newslake/officialnews/release-source/, one JSONL.gz a business date loaded
  with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
