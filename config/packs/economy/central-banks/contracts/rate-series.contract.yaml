# Data contract of the rate-series kind (command CBSER): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap rate-series`; owned by people from then on: confirm the review points, then remove them.
kind: rate-series
mnemonic: CBSER
pack: central-banks
version: '1.0'
class: fundamental
status: active
title: Central bank series
description: 'One central-bank or market series from FRED or the Bank of Canada: the history, the latest value, the change on the day and on the year.'
source: 'public data: FRED, Federal Reserve Bank of St. Louis; Bank of Canada, pulled by the central-banks feed (config/feeds/central-banks.yaml, tools/feeds/sources/)'
grain: One row per central bank series, keyed by SERIES_ID.
key:
- SERIES_ID
id-pattern:
- ^CBSER-
dated-by: snapshot
cadence:
  frequency: daily
  due: the central-banks feed's schedule (15 22 * * 1-5 UTC); a pull with nothing new writes nothing and the lake keeps its latest date
binding-hint:
  lake-table: centralbank.rate-series
  test-data:
  - config/packs/economy/central-banks/samples
fields:
- name: SERIES_ID
  type: id
  presence: required
  description: CBSER-, the source (FRED or BOC) and the source's series code with dots as underscores.
  example: CBSER-BOC-AVG_INTWO
  pattern: ^CBSER-
- name: NAME
  type: text
  presence: required
  description: The series' title, as NAME for search.
  example: CORRA, Canadian overnight repo rate average
- name: SOURCE
  type: text
  presence: required
  description: 'The source the series is read from: FRED (Federal Reserve Bank of St. Louis) or the Bank of Canada.'
  example: Bank of Canada
  enum:
  - Bank of Canada
  - FRED, Federal Reserve Bank of St. Louis
- name: CODE
  type: text
  presence: required
  description: The series' code at its source (DGS10, V39079).
  example: AVG.INTWO
- name: CENTRAL_BANK
  type: id
  presence: required
  description: The central-bank page the series belongs to (CBANK-<id>).
  example: CBANK-BOC
  pattern: ^CBANK-
  link: central-bank
- name: TITLE
  type: text
  presence: required
  description: The series' title in the feed's YAML, else the source's own.
  example: CORRA, Canadian overnight repo rate average
- name: DESCRIPTION
  type: text
  presence: optional
  description: The source's description of the series (FRED's notes, the Valet description), cut at 600 characters.
  example: A measure of the cost of overnight general collateral fundi…
- name: UNIT
  type: text
  presence: required
  description: What the series measures (%, percentage points, an index, USD millions, CAD per USD).
  example: '%'
- name: FREQUENCY
  type: text
  presence: optional
  description: How often the source publishes the series, in its own words.
  example: Business daily
- name: LATEST
  type: amount
  presence: required
  description: The latest observation, in the series' unit.
  example: 2.52
  unit: the record's UNIT
- name: LATEST_DATE
  type: date
  presence: required
  description: The date of the latest observation.
  example: '2026-11-05'
- name: PREVIOUS
  type: amount
  presence: optional
  description: The observation before the latest one.
  example: 2.52
  unit: the record's UNIT
- name: PREVIOUS_DATE
  type: date
  presence: optional
  description: The date of the previous observation.
  example: '2026-11-04'
- name: CHANGE
  type: amount
  presence: optional
  description: The latest observation less the previous one, in the series' unit.
  example: 0.0
  unit: the record's UNIT
- name: CHANGE_1Y
  type: amount
  presence: optional
  description: The latest observation less the last one at least a year before it; empty when the window is shorter.
  example: 0.25
  unit: the record's UNIT
- name: HIGH
  type: amount
  presence: required
  description: The highest observation in the history window.
  example: 2.56
  unit: the record's UNIT
- name: LOW
  type: amount
  presence: required
  description: The lowest observation in the history window.
  example: 2.24
  unit: the record's UNIT
- name: OBSERVATIONS
  type: integer
  presence: required
  description: How many observations the history holds.
  example: 273
- name: HISTORY
  type: record list
  presence: required
  description: The observations over the window (the feed's history-days), oldest first (DATE, VALUE).
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
nested:
  HISTORY[]:
  - name: DATE
    type: date
    presence: required
    description: The observation's date (a monthly series is dated the first of its month).
    example: '2025-10-02'
  - name: VALUE
    type: amount
    presence: required
    description: The observation, in the series' unit.
    example: 2.56
    unit: the record's UNIT
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation whose published data the record holds.
    example: Bank of Canada
  - name: DATASET
    type: text
    presence: required
    description: The source and the series (or the bank) the record was built from.
    example: 'Bank of Canada: AVG.INTWO'
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse, as recorded in the feed's YAML.
    example: 'Bank of Canada terms of use: free to use, copy, distribute …'
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'Source: Bank of Canada.'
  - name: URL
    type: text
    presence: required
    description: The source's page for this record.
    example: https://www.bankofcanada.ca/valet/series/AVG.INTWO
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: True when the source's terms forbid redistribution outside the organisation (Export data refuses the record).
    example: false
links:
- field: CENTRAL_BANK
  kind: central-bank
validation:
- rule: required
  fields:
  - SERIES_ID
  - NAME
  - SOURCE
  - CODE
  - CENTRAL_BANK
  - TITLE
  - UNIT
  - LATEST
  - LATEST_DATE
  - HIGH
  - LOW
  - OBSERVATIONS
  - HISTORY
  - PROVENANCE
- rule: unique
  key:
  - SERIES_ID
  per: snapshot
- rule: pattern
  field: SERIES_ID
  pattern: ^CBSER-
- rule: enum
  field: SOURCE
  values:
  - Bank of Canada
  - FRED, Federal Reserve Bank of St. Louis
- rule: link
  field: CENTRAL_BANK
  kind: central-bank
notes:
- Stored in the worldlake lake (config/lakes/worldlake.yaml), table <data>/delta/worldlake/centralbank/rate-series/, one JSONL.gz a business date loaded
  with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
