# Data contract of the central-bank kind (command CBANK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap central-bank`; owned by people from then on: confirm the review points, then remove them.
kind: central-bank
mnemonic: CBANK
pack: central-banks
version: '1.0'
class: fundamental
status: active
title: Central bank
description: 'One central bank: its policy rate, the last move, the rate''s history and the market series around it.'
source: 'public data: FRED, Federal Reserve Bank of St. Louis; Bank of Canada, pulled by the central-banks feed (config/feeds/central-banks.yaml, tools/feeds/sources/)'
grain: One row per central bank, keyed by BANK_ID.
key:
- BANK_ID
id-pattern:
- ^CBANK-
dated-by: snapshot
cadence:
  frequency: daily
  due: the central-banks feed's schedule (15 22 * * 1-5 UTC); a pull with nothing new writes nothing and the lake keeps its latest date
storage:
  connector: centralbank-store
  plugin: delta
  domain: centralbank
  table: <root>/centralbank/central-bank/
  test-data:
  - config/packs/economy/central-banks/samples
fields:
- name: BANK_ID
  type: id
  presence: required
  description: CBANK- and the bank's short id in the feed's YAML (FED, BOC).
  example: CBANK-BOC
  pattern: ^CBANK-
- name: NAME
  type: text
  presence: required
  description: The central bank's name.
  example: Bank of Canada
- name: COUNTRY
  type: text
  presence: required
  description: The ISO 3166-1 alpha-3 code of the bank's country.
  example: CAN
- name: COUNTRY_NAME
  type: text
  presence: optional
  description: The bank's country.
  example: Canada
- name: CURRENCY
  type: text
  presence: optional
  description: The ISO 4217 code of the bank's currency.
  example: CAD
- name: WEBSITE
  type: text
  presence: optional
  description: The bank's website.
  example: https://www.bankofcanada.ca
- name: POLICY_RATE
  type: rate
  presence: optional
  unit: '%'
  description: 'The latest value of the bank''s policy-rate series (the Fed: the target range''s upper limit; the Bank of Canada: the target for the overnight
    rate).'
  example: 2.5
- name: POLICY_RATE_DATE
  type: date
  presence: optional
  description: The date of that value.
  example: '2026-11-05'
- name: POLICY_SERIES
  type: id
  presence: optional
  description: The rate-series page of the policy rate.
  example: CBSER-BOC-V39079
  pattern: ^CBSER-
  link: rate-series
- name: LAST_MOVE_DATE
  type: date
  presence: optional
  description: The first date the policy rate took its current value, within the history window; empty when it did not move in the window.
  example: '2026-10-29'
- name: LAST_MOVE_BP
  type: amount
  presence: optional
  unit: bp
  description: 'The size of that move: the new rate less the old one, in basis points (negative for a cut).'
  example: 25.0
- name: POLICY_HISTORY
  type: record list
  presence: required
  description: The policy rate by date over the window, oldest first (DATE, VALUE).
- name: SERIES
  type: record list
  presence: required
  description: 'Every series of the bank the feed follows, one row each: RATE_SERIES, TITLE, LATEST, DATE, CHANGE, UNIT.'
- name: PRESS
  type: id
  presence: optional
  description: The bank's publisher page in the official-news pack (PRESS-<id>).
  example: PRESS-BOC
  pattern: ^PRESS-
  link: release-source
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE, DATASET, RETRIEVED_AT, LICENCE, ATTRIBUTION, URL and INTERNAL_ONLY.'
nested:
  POLICY_HISTORY[]:
  - name: DATE
    type: date
    presence: required
    description: The observation's date (a monthly series is dated the first of its month).
    example: '2025-10-02'
  - name: VALUE
    type: amount
    presence: required
    description: The observation, in the series' unit.
    example: 2.5
    unit: the record's UNIT
  SERIES[]:
  - name: RATE_SERIES
    type: id
    presence: required
    description: The rate-series page (CBSER-<source>-<code>).
    example: CBSER-BOC-V39079
    pattern: ^CBSER-
    link: rate-series
  - name: TITLE
    type: text
    presence: required
    description: The series' title in the feed's YAML.
    example: Bank of Canada target for the overnight rate
  - name: LATEST
    type: amount
    presence: required
    description: The series' latest value, in its unit.
    example: 2.5
    unit: the row's UNIT
  - name: DATE
    type: date
    presence: required
    description: The date of the latest value.
    example: '2026-11-05'
  - name: CHANGE
    type: amount
    presence: optional
    description: The latest value less the previous observation.
    example: 0.0
    unit: the row's UNIT
  - name: UNIT
    type: text
    presence: required
    description: What the series measures.
    example: '%'
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: The organisation whose published data the record holds.
    example: Bank of Canada
  - name: DATASET
    type: text
    presence: required
    description: The source and the series (or the bank) the record was built from.
    example: 'Bank of Canada: policy rate and market series'
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: The business date of the feed's pull that wrote the record.
    example: '2026-11-06'
  - name: LICENCE
    type: text
    presence: required
    description: The terms under which the source allows reuse, as recorded in the feed's YAML.
    example: 'Bank of Canada terms of use: free to use, copy, distribute …'
  - name: ATTRIBUTION
    type: text
    presence: required
    description: The credit line to repeat when the data is shown or republished.
    example: 'Source: Bank of Canada.'
  - name: URL
    type: text
    presence: required
    description: The source's page for this record.
    example: https://www.bankofcanada.ca
  - name: INTERNAL_ONLY
    type: boolean
    presence: required
    description: True when the source's terms forbid redistribution outside the organisation (Export data refuses the record).
    example: false
links:
- field: POLICY_SERIES
  kind: rate-series
- field: PRESS
  kind: release-source
- field: SERIES[].RATE_SERIES
  kind: rate-series
validation:
- rule: required
  fields:
  - BANK_ID
  - NAME
  - COUNTRY
  - POLICY_HISTORY
  - SERIES
  - PROVENANCE
- rule: unique
  key:
  - BANK_ID
  per: snapshot
- rule: pattern
  field: BANK_ID
  pattern: ^CBANK-
- rule: link
  field: POLICY_SERIES
  kind: rate-series
- rule: link
  field: PRESS
  kind: release-source
- rule: link
  field: SERIES[].RATE_SERIES
  kind: rate-series
notes:
- Stored in the worldlake lake (config/lakes/worldlake.yaml), table <data>/delta/worldlake/centralbank/central-bank/, one JSONL.gz a business date loaded
  with mode replace (a rerun of a day is idempotent).
- 'Delivered as JSON Lines: one document a line, UTF-8, gzipped, with a .ready file naming the lake, pack, kind, connector, business date, mode, key, sha256
  and row count (DATA_LAKE_GUIDE.md section 4).'
review: []
