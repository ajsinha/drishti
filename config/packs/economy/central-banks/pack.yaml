# Central banks · the economy module's public-sector policy-rate pack (docs/guides/WORLD_DATA_GUIDE.md): policy rates and market series from
# FRED and the Bank of Canada's Valet API, filled daily by the central-banks feed (config/feeds/central-banks.yaml) into worldlake.
pack: central-banks
domain: economy   # the economy module's (its Public sector lens; docs/architecture/ACCESS_MODEL.md)
version: 1.0.0
code: CBNK
title: Central banks
description: >-
  Policy rates and the market series around them: the Federal Reserve's target range and effective rate, Treasury yields, the curve's
  slope, US inflation, unemployment and the Fed's balance sheet (FRED, Federal Reserve Bank of St. Louis), and the Bank of Canada's
  target rate, CORRA, Government of Canada yields and USD/CAD (Bank of Canada Valet). A bank's page shows its policy rate, its last
  move and its series; each series shows two years of history. Filled daily by the central-banks feed into the worldlake lake; FRED needs
  a free key in DRISHTI_FRED_API_KEY.
kinds: [central-bank, rate-series]
sutras: sutras
mnemonics:
  CBANK: { kind: central-bank, label: Central bank }
  CBSER: { kind: rate-series, label: Central bank series }
graph:
  id-patterns:
    - { pattern: "^CBANK-", kind: central-bank }
    - { pattern: "^CBSER-", kind: rate-series }
  fields:
    CENTRAL_BANK:  { kind: central-bank, label: Central bank }
    POLICY_SERIES: { kind: rate-series, label: Policy rate series }
    RATE_SERIES:   { kind: rate-series, label: Series }
    PRESS:         { kind: release-source, label: Press releases }
  badges:
    central-bank: "fmt($.POLICY_RATE, 'price2') + '% policy rate'"
    rate-series: "fmt($.LATEST, 'price2') + ' ' + $.UNIT"
connectors:
  centralbank-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [central-bank, rate-series]
    settings:
      lake: worldlake
      lake-tables: centralbank.central-bank,centralbank.rate-series
lake:                  # the recommended entries of its lake tables (the shipped lake file holds the same)
  tables:
    centralbank.central-bank:
      id: BANK_ID
      promote:
      - NAME
      - COUNTRY
      - POLICY_RATE
      - POLICY_RATE_DATE
      - LAST_MOVE_DATE
      - LAST_MOVE_BP
      retention: 260
    centralbank.rate-series:
      id: SERIES_ID
      promote:
      - SOURCE
      - CODE
      - CENTRAL_BANK
      - TITLE
      - UNIT
      - LATEST
      - LATEST_DATE
      - CHANGE
      retention: 260
routes:                # the connector that answers each kind
  central-bank: centralbank-store
  rate-series: centralbank-store
form:                          # FORM central-banks: the search form of each kind
  central-bank:
    - { path: BANK_ID, label: Bank id, type: id, group: Identity }
    - { path: NAME, type: text, group: Identity }
    - { path: POLICY_RATE, label: "Policy rate, %", type: number, group: Policy }
    - { path: LAST_MOVE_DATE, label: Last move, type: date, group: Policy }
  rate-series:
    - { path: SERIES_ID, label: Series id, type: id, group: Identity }
    - { path: TITLE, type: text, group: Identity }
    - { path: SOURCE, type: enum, group: Identity }
    - { path: CENTRAL_BANK, label: Central bank, type: id, group: Identity }
    - { path: LATEST, type: number, group: Latest }
    - { path: LATEST_DATE, label: Latest date, type: date, group: Latest }
console:
  examples:
    - ["CBANK CBANK-FED", "The Federal Reserve · the target range, its last move, the Treasury curve and the balance sheet"]
    - ["CBANK CBANK-BOC", "The Bank of Canada · the target rate, CORRA, Canada's yields and USD/CAD"]
    - ["CBSER CBSER-FRED-DGS10", "The US 10-year Treasury yield · two years of daily history"]
    - ["CBSER CBSER-BOC-V39079", "The Bank of Canada's target for the overnight rate"]
  help: config/help.yaml
