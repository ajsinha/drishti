# Built from the Drishti UI kit only (config/ui-kit/fragments): no screen code of its own.
rachana: 1
sutra: oecd-series
version: 1
description: "One OECD measure of one member by period: the history, the latest value and the change."
doc:
  summary: "An OECD series: its monthly or quarterly history, the latest value and period, the change."
  description: >-
    One page per member and measure: the strip gives the measure, the latest value with its unit and period, the previous value and the
    change; the chart draws the history; the dataflow it came from is in the facts; F7 opens the member.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/oecd-series/OECDS-USA-CLI"
    - "OECDS OECDS-USA-CLI"
  since: "2.9.11"
match: { kind: oecd-series, priority: 10 }
title: { pill: Public sector · OECD series, id: $.SERIES_ID, with: $.NAME }
strip:
  - { label: Measure, bind: $.TITLE }
  - { label: Latest, bind: $.LATEST, fmt: amount2, emphasis: true }
  - { label: Unit, bind: $.UNIT }
  - { label: Period, bind: $.LATEST_PERIOD }
  - { label: Change, bind: $.CHANGE, fmt: signed2 }
panels:
  - { use: series-line@1, with: { id: history, title: History, key: F2, rows: $.HISTORY, x: PERIOD, y: VALUE, fmt: amount2 } }
  - id: about
    kind: kv
    title: About this series
    area: right
    columns:
      - { label: Member, bind: "link($.OECD_COUNTRY, 'oecd-country', $.COUNTRY_NAME)" }
      - { label: Frequency, bind: $.FREQUENCY }
      - { label: Dataflow, bind: $.DATAFLOW }
  - { use: source-footer@1 }
keys: { F7: "link($.OECD_COUNTRY, 'oecd-country')", F9: raw }
