# Built from the Drishti UI kit only (config/ui-kit/fragments): no screen code of its own.
rachana: 1
sutra: development-series
version: 1
description: "One World Development Indicator of one country by year: the history, the latest value and the change."
doc:
  summary: "One World Bank indicator of one country: its history by year, the latest value, the change, the definition."
  description: >-
    One page per country and indicator: the strip gives the indicator, the latest value with its unit and year, the previous value and
    the change; the chart draws the history by year; the definition is the World Bank's own; F7 opens the country's profile.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/development-series/WDIS-IND-NY_GDP_MKTP_KD_ZG"
    - "WDIS WDIS-IND-NY_GDP_MKTP_KD_ZG"
  since: "2.9.11"
match: { kind: development-series, priority: 10 }
title: { pill: Public sector · Development indicator, id: $.SERIES_ID, with: $.NAME }
strip:
  - { label: Indicator, bind: $.INDICATOR }
  - { label: Latest, bind: $.LATEST, fmt: amount2, emphasis: true }
  - { label: Unit, bind: $.UNIT }
  - { label: Year, bind: $.LATEST_YEAR }
  - { label: Previous, bind: $.PREVIOUS, fmt: amount2 }
  - { label: Change, bind: $.CHANGE, fmt: signed2 }
panels:
  - { use: series-line@1, with: { id: history, title: "History by year", key: F2, rows: $.HISTORY, x: YEAR, y: VALUE, fmt: amount2 } }
  - id: about
    kind: kv
    title: About this indicator
    area: right
    columns:
      - { label: Country, bind: "link($.WDI_PROFILE, 'development-profile', $.COUNTRY_NAME)" }
      - { label: World Bank code, bind: $.INDICATOR_CODE }
      - { label: Definition, bind: $.DEFINITION }
  - { use: source-footer@1 }
keys: { F7: "link($.WDI_PROFILE, 'development-profile')", F9: raw }
