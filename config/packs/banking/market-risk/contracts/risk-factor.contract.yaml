# Data contract of the risk-factor dictionary (command RFAC): docs/architecture/SENSITIVITIES_AND_FRTB_SA.md section 3;
# the MR cube's D9 (docs/lenses/MR_CUBE_LENS.md section 7.10). Demo data: tools/packgen/sensitivity/factor_dictionary.py.
kind: risk-factor
mnemonic: RFAC
pack: market-risk
version: '1.0'
class: fundamental
status: active
title: 'Risk factor dictionary'
description: 'Every risk factor the bank''s sensitivities use, named by the factor naming standard, with its parts (class, qualifier,
  curve, underlying, tenor), its FRTB standardised mapping (risk class and bucket, Basel MAR21), its ISDA SIMM mapping (risk class,
  bucket and labels), its liquidity horizon (MAR33.12) and the names the source systems give it. A sensitivity whose factor is not
  here, or whose source name maps to no factor, is refused. Read by the server''s FRTB-SA engine with the sensitivities
  (docs/guides/FRTB_SA_GUIDE.md).'
source: The bank's risk-factor master (often kept in the market-data system or the FRTB engine)
grain: One row per risk factor and business date (a slowly changing table; a date without a delivery keeps the last), keyed by RISK_FACTOR.
key:
- RISK_FACTOR
id-pattern:
- ^(IR|INF|CR|FX|EQ|CM|VOL)/
dated-by: BUSINESS_DATE
cadence:
  frequency: on change
  due: before the first business date a new factor or mapping applies to; a change takes effect from VALID_FROM
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/risk-factor/
  columns:
  - RISK_FACTOR
  - FACTOR_TYPE
  - RISK_CLASS
  - QUALIFIER
  - TENOR
  - FRTB_BUCKET
  - SIMM_RISK_CLASS
  - SIMM_BUCKET
  test-data:
  - data/testdata/market-risk/risk-factor
fields:
- name: RISK_FACTOR
  type: id
  presence: required
  description: 'The factor''s standard name, slash-separated: IR/CURVE/<ccy>/<curve>/<tenor> (a curve point), IR/CURVE/<ccy> (the
    currency, every curve shifted together: the GIRR curvature factor, MAR21.8), IR/BASIS/<ccy> (the cross-currency basis), INF/<index>
    (the inflation factor, no tenor in FRTB) and INF/<index>/<tenor>, CR/SPREAD/<issuer or index>[/<BOND or CDS>/<tenor>] (without the
    tenor: the issuer, the CSR curvature factor), FX/SPOT/<ccy>, EQ/SPOT/<underlying>, EQ/REPO/<name>, CM/PRICE/<underlying>/<location>/<tenor>
    and CM/PRICE/<underlying> (the commodity, every location and tenor: the commodity curvature factor, MAR21.13),
    VOL/<class>/<underlying>/<expiry>[/<underlying tenor>].'
  example: IR/CURVE/USD/SOFR/10Y
  pattern: ^(IR|INF|CR|FX|EQ|CM|VOL)/
- name: FACTOR_TYPE
  type: text
  presence: required
  description: 'The kind of factor: CURVE (an interest-rate curve or its point), BASIS (a cross-currency basis), INFLATION, SPREAD (a
    credit spread), SPOT (an FX rate or equity price), REPO (an equity repo rate), PRICE (a commodity forward) or VOL (an implied
    volatility).'
  example: CURVE
  enum:
  - CURVE
  - BASIS
  - INFLATION
  - SPREAD
  - SPOT
  - REPO
  - PRICE
  - VOL
- name: RISK_CLASS
  type: text
  presence: required
  description: 'The FRTB risk class (MAR21.1): GIRR (interest rates and inflation), CSR_NS (credit spread, non-securitisation),
    CSR_SEC_NCTP and CSR_SEC_CTP (securitisations), EQ, COMM, FX. A volatility''s class is its underlying''s.'
  example: GIRR
  enum:
  - GIRR
  - CSR_NS
  - CSR_SEC_NCTP
  - CSR_SEC_CTP
  - EQ
  - COMM
  - FX
- name: QUALIFIER
  type: text
  presence: required
  description: 'What the factor is of: the currency (GIRR, FX), the issuer or index (credit), the underlying (equity, commodity).'
  example: USD
- name: CURVE
  type: text
  presence: optional
  description: The curve (SOFR, ESTR), the instrument curve of a credit factor (BOND or CDS), the delivery location of a commodity, or the index of an inflation factor.
  example: SOFR
- name: UNDERLYING
  type: text
  presence: optional
  description: The underlying of an equity, commodity, FX or volatility factor (an index, a name, a commodity, a currency pair).
  example: SPX
- name: TENOR
  type: text
  presence: optional
  description: The tenor (curve point) or the option expiry (a volatility); empty for a spot or a whole curve.
  example: 10Y
- name: UNDERLYING_TENOR
  type: text
  presence: optional
  description: The tenor of the underlying swap of an interest-rate volatility (a swaption's 10Y).
  example: 10Y
- name: FRTB_BUCKET
  type: text
  presence: required
  description: 'The FRTB bucket: the currency for GIRR and FX (MAR21.39, MAR21.86), 1 to 18 for CSR non-securitisation (MAR21.51), 1 to
    13 for equity (MAR21.72), 1 to 11 for commodity (MAR21.82).'
  example: USD
- name: SIMM_RISK_CLASS
  type: text
  presence: required
  description: 'The ISDA SIMM risk class: InterestRate, CreditQ, CreditNonQ, Equity, Commodity or FX.'
  example: InterestRate
  enum:
  - InterestRate
  - CreditQ
  - CreditNonQ
  - Equity
  - Commodity
  - FX
- name: SIMM_BUCKET
  type: text
  presence: required
  description: 'The SIMM bucket (the currency''s volatility group for interest rates, the sector and quality for credit and equity,
    the commodity group); Residual when none applies.'
  example: '1'
- name: SIMM_LABEL1
  type: text
  presence: optional
  description: 'SIMM''s Label1: the tenor (2w … 30y) of a rate or credit factor, the expiry of a volatility; Inf for inflation.'
  example: 10y
- name: SIMM_LABEL2
  type: text
  presence: optional
  description: 'SIMM''s Label2: the sub-curve of a rate (OIS, Libor3m, Prime) or the credit instrument (BOND, CDS).'
  example: OIS
- name: SECTOR
  type: text
  presence: optional
  description: The sector of a credit issuer or equity name, as the bucket grids use it.
  example: Financials including government-backed financials
- name: CREDIT_QUALITY
  type: text
  presence: optional
  description: IG (investment grade) or HY (high yield and not rated) for a credit factor.
  example: IG
  enum:
  - IG
  - HY
- name: SENIORITY
  type: text
  presence: optional
  description: The seniority of a credit factor's curve (SIMM credit qualifiers and the CRIF are per issuer and seniority; the DRC nets by
    seniority, MAR22.19). SENIOR in the demo.
  example: SENIOR
  enum:
  - COVERED
  - SENIOR
  - NON_SENIOR
- name: MARKET_CAP
  type: text
  presence: optional
  description: LARGE or SMALL for an equity (MAR21.72's market capitalisation test).
  example: LARGE
  enum:
  - LARGE
  - SMALL
- name: ECONOMY
  type: text
  presence: optional
  description: ADVANCED or EMERGING for an equity (MAR21.72).
  example: ADVANCED
  link: economy
  enum:
  - ADVANCED
  - EMERGING
- name: LIQUIDITY_HORIZON
  type: integer
  presence: required
  unit: business days
  description: The liquidity horizon of the factor (MAR33.12), 10, 20, 40, 60 or 120; the vega risk weights scale with it (MAR21.92).
  example: 10
  enum:
  - 10
  - 20
  - 40
  - 60
  - 120
- name: MODELLABLE
  type: boolean
  presence: optional
  description: Whether the factor passes the risk factor eligibility test on the date (MAR31; for the internal models approach).
  example: true
- name: PROXY_OF
  type: id
  presence: optional
  description: The factor this one is proxied by, when its data is proxied.
  example: VOL/EQ/SPX/1Y
- name: MARKET_DATA_REF
  type: text
  presence: optional
  description: Where the factor's level comes from in the market data (for explain and repricing).
  example: CRV-USD-SOFR#10Y
- name: SOURCE_NAMES
  type: text list
  presence: required
  description: 'The names the source systems give this factor (the bank''s mapping to the standard): each maps to exactly one factor; a
    sensitivity delivered under a name in no list is refused.'
  example: IR.CURVE.USD.SOFR.10Y
- name: VALID_FROM
  type: date
  presence: required
  description: The first business date the row applies to.
  example: '2026-01-02'
- name: VALID_TO
  type: date
  presence: optional
  description: The last business date the row applies to; empty while it applies.
- name: BUSINESS_DATE
  type: date
  presence: required
  description: The business date of the delivery (YYYY-MM-DD); the lake's partition.
  example: '2026-09-30'
- name: SOURCE
  type: text
  presence: required
  description: The system the dictionary row came from.
  example: demo-factor-master
validation:
- rule: required
  fields:
  - RISK_FACTOR
  - FACTOR_TYPE
  - RISK_CLASS
  - QUALIFIER
  - FRTB_BUCKET
  - SIMM_RISK_CLASS
  - SIMM_BUCKET
  - LIQUIDITY_HORIZON
  - SOURCE_NAMES
  - VALID_FROM
  - BUSINESS_DATE
  - SOURCE
- rule: unique
  key:
  - RISK_FACTOR
  per: BUSINESS_DATE
- rule: pattern
  field: RISK_FACTOR
  pattern: ^(IR|INF|CR|FX|EQ|CM|VOL)/
- rule: enum
  field: FACTOR_TYPE
  values:
  - CURVE
  - BASIS
  - INFLATION
  - SPREAD
  - SPOT
  - REPO
  - PRICE
  - VOL
- rule: enum
  field: RISK_CLASS
  values:
  - GIRR
  - CSR_NS
  - CSR_SEC_NCTP
  - CSR_SEC_CTP
  - EQ
  - COMM
  - FX
- rule: enum
  field: SIMM_RISK_CLASS
  values:
  - InterestRate
  - CreditQ
  - CreditNonQ
  - Equity
  - Commodity
  - FX
- rule: enum
  field: CREDIT_QUALITY
  values:
  - IG
  - HY
- rule: enum
  field: SENIORITY
  values:
  - COVERED
  - SENIOR
  - NON_SENIOR
- rule: enum
  field: MARKET_CAP
  values:
  - LARGE
  - SMALL
- rule: enum
  field: ECONOMY
  values:
  - ADVANCED
  - EMERGING
- rule: link
  field: ECONOMY
  kind: economy
- rule: enum
  field: LIQUIDITY_HORIZON
  values:
  - 10
  - 20
  - 40
  - 60
  - 120
notes:
- 'JSON Lines, one row per line (UTF-8, gzip). Example line: {"RISK_FACTOR":"IR/CURVE/USD/SOFR/10Y","FACTOR_TYPE":"CURVE","RISK_CLASS":"GIRR","QUALIFIER":"USD","CURVE":"SOFR","TENOR":"10Y","FRTB_BUCKET":"USD","SIMM_RISK_CLASS":"InterestRate","SIMM_BUCKET":"1","SIMM_LABEL1":"10y","SIMM_LABEL2":"OIS","LIQUIDITY_HORIZON":10,"MARKET_DATA_REF":"CRV-USD-SOFR#10Y","SOURCE_NAMES":["MX:IR:CURVE-USD-SOFR-10Y","IR.CURVE.USD.SOFR.10Y","10Y_SOFR_USD_CURVE_IR"],"VALID_FROM":"2026-01-02","BUSINESS_DATE":"2026-09-30","SOURCE":"demo-factor-master"}'
- 'LIQUIDITY_HORIZON of a volatility factor is the vega liquidity horizon of MAR21.92 (GIRR 60, CSR 120, equity large-cap and index 20,
  small-cap and other 60, commodity 120, FX 40); of the other factors the IMA horizon of MAR33.12.'
- 'Decided (2026-11-01, decision 5): a credit index is one SIMM qualifier now (Residual in the demo); look-through to the constituents later.'
- 'The bucket here is the default; the bucket grids of the configuration (FRTB, SIMM and the bank''s own limit grids) decide, and a
  factor falls in exactly one bucket of each grid (checked at start, overlaps refused).'
review:
- 'Whether the bank keeps the mapping from its system names in this table (SOURCE_NAMES) or in a separate mapping file per source.'
