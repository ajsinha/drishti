# Data contract of the scenario-set kind (command SSET): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap scenario-set`; owned by people from then on: confirm the review points, then remove them.
kind: scenario-set
mnemonic: SSET
pack: market-risk
version: '1.1'
class: input
status: active
title: Scenario set
description: 'The historical scenario days of a business date, oldest first: index i of every P&L vector, scenario-PV vector and FX scenario of the date is SCENARIO_DATES[i]. A date has one normal set and may have one stress set (SET_TYPE STRESS, for stressed VaR: today''s trades revalued under the moves of a 12-month stress period, VAR_GUIDE.md section 18.8), whose rows carry its own SCENARIO_SET_ID in the same tables.'
source: Synthetic sample data (tools/packgen/banking)
grain: One row per scenario set per BUSINESS_DATE (the normal set, and the stress set when the batch sends one), keyed by SCENARIO_SET_ID.
key:
- SCENARIO_SET_ID
id-pattern:
- ^HS-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
binding-hint:
  lake-table: risk.scenario-set
  test-data:
  - data/testdata/market-risk/scenario-set
fields:
- name: SCENARIO_SET_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: HS-509
  pattern: ^HS-
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business whose vectors the set orders (YYYY-MM-DD).'
  example: '2026-09-30'
- name: SCENARIO_DATES
  type: date list
  presence: required
  description: 'The historical days whose moves make the scenarios, oldest first: position i of every P&L vector is day i. A stress
    set''s days are those of its stress period (2008-07-01 to 2009-06-30 in the demo).'
- name: SCENARIO_COUNT
  type: integer
  presence: required
  description: 'N, the number of scenario days: the length of SCENARIO_DATES and of every vector of the date.'
  example: 509
- name: WINDOW_START
  type: date
  presence: required
  description: The oldest scenario day.
  example: '2024-09-17'
- name: WINDOW_END
  type: date
  presence: required
  description: 'The newest scenario day: the business day before the business date.'
  example: '2026-09-29'
- name: HORIZON_DAYS
  type: integer
  presence: required
  description: 'The holding period of the scenario moves, in business days (1).'
  example: 1
- name: REVALUATION
  type: text
  presence: required
  description: full (every trade repriced under each scenario) or sensitivities (a Taylor expansion), as the batch did it.
  example: full
- name: WEIGHTS
  type: unknown
  presence: optional
  description: 'Age weights for a weighted method, one per scenario in SCENARIO_DATES order; null for equal weights (not used by the engine).'
- name: SOURCE_BATCH
  type: text
  presence: required
  description: 'The risk batch that produced the set and its vectors (the date''s BATCH_ID).'
  example: B-2026-09-30-01
- name: DESCRIPTION
  type: text
  presence: required
  description: 'A description of the set in words.'
  example: Historical simulation, 509 business days, equal weights
- name: SET_TYPE
  type: text
  presence: optional
  description: 'STRESS for the date''s stress scenario set (stressed VaR, VAR_GUIDE.md section 18.8); absent or HISTORICAL for the normal
    set. A set that does not say is the stress set when its id starts with drishti.var.stress.id-prefix (HS-STRESS-).'
  enum: [HISTORICAL, STRESS]
  example: STRESS
- name: SYNTHETIC
  type: boolean
  presence: optional
  description: 'True when the set''s moves are synthetic rather than market history (the demo''s stress set): every stressed answer says so.'
  example: true
links: []
validation:
- rule: required
  fields:
  - SCENARIO_SET_ID
  - BUSINESS_DATE
  - SCENARIO_DATES
  - SCENARIO_COUNT
  - WINDOW_START
  - WINDOW_END
  - HORIZON_DAYS
  - REVALUATION
  - SOURCE_BATCH
  - DESCRIPTION
- rule: unique
  key:
  - SCENARIO_SET_ID
  per: BUSINESS_DATE
- rule: pattern
  field: SCENARIO_SET_ID
  pattern: ^HS-
- rule: range
  field: SCENARIO_COUNT
  min: 0
- rule: enum
  field: SET_TYPE
  values:
  - HISTORICAL
  - STRESS
notes: []
review:
- 'required inferred from 100% coverage in 2 documents (1 samples and 1 test-data documents (data/testdata/market-risk/scenario-set/scenario-set.tar)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
