connectors:
  legal-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - agreement
    - csa
    settings:
      lake: demo
      lake-tables: legal.agreement,legal.csa
      mode.agreement: effective
      mode.csa: effective
  credit-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - netting-set
    - credit-limit
    - cva
    - sa-ccr
    settings:
      lake: demo
      lake-tables: credit.netting-set,credit.credit-limit,credit.cva,credit.sa-ccr
  collateral-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - collateral-balance
    - margin-call
    - simm
    settings:
      lake: demo
      lake-tables: collateral.collateral-balance,collateral.margin-call,collateral.simm
  ccr-derived:
    plugin: derived
    enabled: ${DRISHTI_CCR_DERIVED_ENABLED:true}
    description: 'Netting-set and counterparty MtM totals derived from the trade valuations of live trades (a live status, not past maturity),
      once per business date: shown beside the stored figures until the netting-set engine computes them'
    kinds:
    - nset-mtm
    - cpty-mtm
    settings:
      refresh: 60s
      nset-mtm:
        from: trade-valuation
        where: nonblank($.NETTING_SET) && ($.TRADE_STATUS == 'NEW' || $.TRADE_STATUS == 'VALIDATED' || $.TRADE_STATUS == 'AMENDED')
        group-by: $.NETTING_SET
        id-field: NETTING_SET_ID
        members: TRADE_IDS
        max-members: 100000
        rows-field: TRADES
        fields:
          STATUS_LIVE_COUNT: count
          COUNTERPARTY: first $.COUNTERPARTY
          COUNTERPARTIES: distinct $.COUNTERPARTY
          MTM_CURRENCIES: distinct $.MTM_CURRENCY
          VALUATION_DATES: distinct $.VALUATION_DATE
        rows:
          TRADE_ID: $.TRADE_ID
          TRADE_STATUS: $.TRADE_STATUS
          PRODUCT_TYPE: $.PRODUCT_TYPE
          PRODUCT_GROUP: $.PRODUCT_GROUP
          CURRENCY: $.CURRENCY
          BOOK: $.PORTFOLIO
          NOTIONAL: $.NOTIONAL
          MATURITY_DATE: $.MATURITY_DATE
          MTM: $.MTM
          MTM_CURRENCY: $.MTM_CURRENCY
          LIVE: '!nonblank($.MATURITY_DATE) || days($.VALUATION_DATE, $.MATURITY_DATE) >= 0'
        then:
          TRADE_COUNT: size($.TRADES[?@.LIVE])
          NET_MTM: sum($.TRADES[?@.LIVE], 'MTM')
          GROSS_POSITIVE_MTM: sum($.TRADES[?@.LIVE && @.MTM > 0], 'MTM')
          GROSS_NEGATIVE_MTM: sum($.TRADES[?@.LIVE && @.MTM < 0], 'MTM')
          CE_UNCOLLATERALISED: max(sum($.TRADES[?@.LIVE], 'MTM'), 0)
          NETTING_BENEFIT: sum($.TRADES[?@.LIVE && @.MTM > 0], 'MTM') - max(sum($.TRADES[?@.LIVE], 'MTM'), 0)
          NET_TO_GROSS: 'sum($.TRADES[?@.LIVE && @.MTM > 0], ''MTM'') > 0 ? max(sum($.TRADES[?@.LIVE], ''MTM''), 0) / sum($.TRADES[?@.LIVE &&
            @.MTM > 0], ''MTM'') : 0'
          BY_PRODUCT_GROUP: group($.TRADES[?@.LIVE], 'PRODUCT_GROUP', 'MTM')
          PAST_MATURITY_COUNT: size($.TRADES[?!@.LIVE])
          PAST_MATURITY_MTM: sum($.TRADES[?!@.LIVE], 'MTM')
          PAST_MATURITY: $.TRADES[?!@.LIVE]
          SUM_CURRENCY: '''USD'''
          CURRENCY_NOTE: 'size($.MTM_CURRENCIES) == 1 && first($.MTM_CURRENCIES) == ''USD'' ? ''USD: every member in USD, no conversion'' : ''not
            converted: members in '' + size($.MTM_CURRENCIES) + '' currencies, the converted total comes from the netting-set engine'''
        sort:
          TRADES: MTM desc
          BY_PRODUCT_GROUP: value desc
      cpty-mtm:
        from: trade-valuation
        where: nonblank($.NETTING_SET) && ($.TRADE_STATUS == 'NEW' || $.TRADE_STATUS == 'VALIDATED' || $.TRADE_STATUS == 'AMENDED')
        group-by: $.COUNTERPARTY
        id-field: COUNTERPARTY
        members: TRADE_IDS
        max-members: 100000
        rows-field: TRADES
        fields:
          STATUS_LIVE_COUNT: count
          MTM_CURRENCIES: distinct $.MTM_CURRENCY
          VALUATION_DATES: distinct $.VALUATION_DATE
        rows:
          TRADE_ID: $.TRADE_ID
          NETTING_SET: $.NETTING_SET
          MTM: $.MTM
          LIVE: '!nonblank($.MATURITY_DATE) || days($.VALUATION_DATE, $.MATURITY_DATE) >= 0'
        then:
          TRADE_COUNT: size($.TRADES[?@.LIVE])
          NET_MTM: sum($.TRADES[?@.LIVE], 'MTM')
          GROSS_POSITIVE_MTM: sum($.TRADES[?@.LIVE && @.MTM > 0], 'MTM')
          GROSS_NEGATIVE_MTM: sum($.TRADES[?@.LIVE && @.MTM < 0], 'MTM')
          NETTING_SETS: group($.TRADES[?@.LIVE], 'NETTING_SET', 'MTM')
          NETTING_SET_COUNT: size(group($.TRADES[?@.LIVE], 'NETTING_SET', 'MTM'))
          CE_UNCOLLATERALISED: sum(group($.TRADES[?@.LIVE], 'NETTING_SET', 'MTM')[?@.value > 0], 'value')
          PAST_MATURITY_COUNT: size($.TRADES[?!@.LIVE])
          SUM_CURRENCY: '''USD'''
          CURRENCY_NOTE: 'size($.MTM_CURRENCIES) == 1 && first($.MTM_CURRENCIES) == ''USD'' ? ''USD: every member in USD, no conversion'' : ''not
            converted: members in '' + size($.MTM_CURRENCIES) + '' currencies, the converted total comes from the netting-set engine'''
        sort:
          NETTING_SETS: value desc
          TRADES: MTM desc
  exposure-results:
    plugin: delta
    enabled: ${DRISHTI_EXPOSURE_ENABLED:true}
    description: 'The official end-of-day exposure of every netting set, counterparty and group the server publishes (risk-results/exposure-official-cpty),
      read only: for BI and other readers, never an engine''s input'
    kinds:
    - exposure-official-cpty
    settings:
      lake: ccr-official
      lake-tables: risk-results.exposure-official-cpty
  exposure-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - simulation-run
    - exposure-path
    settings:
      lake: demo
      lake-tables: risk.simulation-run,risk.exposure-path
  exposure-engine:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_EXPOSURE_ENABLED:true}
    description: 'Exposure profiles (EE, ENE, EEE, PFE 95 and 99, EPE, EEPE) of any counterparty scope, computed when asked by the server''s exposure
      engine from the exposure paths, as the viewer: EXP <scope> <GO>'
    kinds:
      exposure-result:
        compute: exposure-result
        params:
          q:
            type: decimal
            default: 0.95
            min: 0.5
            max: 0.9999
          collateral:
            type: enum
            options:
            - lagged
            - current
            - none
            default: lagged
          run:
            type: text
            default: ''
        result:
          required:
          - SCOPE
          - STATUS
          - PROFILE
          types:
            EPE: number
            PEAK_PFE: number
    engine:
      type: java
      class: com.ash.drishti.banking.exposure.ExposureResultEngine
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - simulation-run
      - exposure-path
      - netting-set
      - csa
      - collateral-balance
      - trade-valuation
      - credit-limit
      affects: all
    coalesce:
      quiet: 1s
      max-wait: 10s
    cache:
      results: 1000
      ttl: 1h
    limits:
      timeout: 60s
      wait: 5s
      max-inflight-per-user: 4
