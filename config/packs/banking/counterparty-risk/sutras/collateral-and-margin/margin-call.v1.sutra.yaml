# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: margin-call
version: 1
description: A variation or initial margin call and its settlement status.
doc:
  summary: "A variation or initial margin call and its settlement status."
  description: >-
    A variation or initial margin call and its settlement status. One page per margin call, its panels: workflow; how the view
    was built; the entities it links to. The strip gives Date, Type, Direction, Amount, Status and Dispute. Linked entities:
    netting set (netting-set) and CSA (csa).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/margin-call/MC-ALDERSHOT-FRA-1"
    - "MC MC-ALDERSHOT-FRA-1"
  since: "2.7.0"
match: { kind: margin-call, priority: 10 }
title: { pill: Collateral and margin · Margin call, id: $.CALL_ID }
strip:
  - { label: Date, bind: $.CALL_DATE, fmt: date }
  - { label: Type, bind: $.MARGIN_TYPE }
  - { label: Direction, bind: $.DIRECTION }
  - { label: Amount, bind: $.AMOUNT, fmt: amount0, emphasis: true }
  - { label: Status, bind: $.STATUS, tone: status }
  - { label: Dispute, bind: $.DISPUTE_AMOUNT, fmt: amount0 }
panels:
  - id: events
    kind: ladder
    title: Workflow
    key: F2
    rows: $.EVENTS
    columns:
      - { label: Time, bind: "@.AT" }
      - { label: Event, bind: "@.EVENT" }
      - { label: By, bind: "@.BY" }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.NETTING_SET, 'netting-set')", F8: impact, F9: raw }
