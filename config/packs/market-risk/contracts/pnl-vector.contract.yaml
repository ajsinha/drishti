# Data contract of the pnl-vector kind (command PNLV): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap pnl-vector`; owned by people from then on: confirm the review points, then remove them.
kind: pnl-vector
mnemonic: PNLV
pack: market-risk
version: '1.0'
class: input
status: active
title: P&L vector (509 scenarios)
description: P&L vector of a trade
source: Synthetic sample data (tools/packgen/banking)
grain: One row per p&l vector (509 scenarios) per BUSINESS_DATE, keyed by VECTOR_ID.
key:
- VECTOR_ID
id-pattern:
- ^PV-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/pnl-vector/
  columns:
  - TRADE_ID
  - SECURITY_ID
  - INSTRUMENT
  - LEGAL_ENTITY
  - DIVISION
  - DESK
  - TT_BOOK
  - PORTFOLIO
  - STRATEGY
  - PRODUCT_GROUP
  - PRODUCT_TYPE
  - CURRENCY
  - COUNTERPARTY
  - DIRECTION
  - QUANTITY
  - PV
  - TAGS
  - TRADE_STATUS
  - MATURITY_DATE
  - STATUS
  - REPORTING_CCY
  - SCENARIO_SET_ID
  - BATCH_ID
  - RUN_KIND
  - COMPUTED_AT
  vectors:
  - PNL
  test-data:
  - data/testdata/market-risk/pnl-vector
fields:
- name: VECTOR_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: PV-MX-20000274-HS-509
  pattern: ^PV-
- name: TRADE_ID
  type: id
  presence: required
  description: 'Trade: the trade it refers to'
  example: MX-20000274
  pattern: ^((MX|CLY)-)?\d+$
  link: trade
- name: SECURITY_ID
  type: id
  presence: optional
  description: 'The security or exchange contract the trade is in (securities and listed products): Drishti keys the trade''s position by book
    and security.'
  example: SEC-WARRANT-USD-01
- name: INSTRUMENT
  type: text
  presence: required
  example: Equity warrant USD 2027-05
- name: BUSINESS_DATE
  type: date
  presence: required
  example: '2026-09-30'
- name: SCENARIO_SET_ID
  type: id
  presence: required
  example: HS-509
- name: SOURCE_SYSTEM
  type: text
  presence: required
  example: MUREX
  enum:
  - CALYPSO
  - MUREX
- name: TRADE_VERSIONS
  type: text
  presence: required
  example: v4
- name: TRADE_STATUS
  type: text
  presence: required
  description: 'The trade''s status the batch priced: NEW, VALIDATED and AMENDED count on the date; others are left out.'
  example: AMENDED
  enum:
  - AMENDED
  - VALIDATED
- name: MATURITY_DATE
  type: date
  presence: required
  example: '2027-05-26'
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'Legal entity: the legal-entity it refers to'
  example: LE-LDN
  pattern: ^LE-
  link: legal-entity
- name: DIVISION
  type: id
  presence: required
  example: DIV-MARKETS
- name: DESK
  type: id
  presence: required
  description: 'Desk: the desk it refers to'
  example: DESK-EQD
  pattern: ^DESK-
  link: desk
- name: TT_BOOK
  type: id
  presence: required
  description: 'Book: the book it refers to'
  example: BOOK-EQD-2
  pattern: ^BOOK-
  link: book
- name: PORTFOLIO
  type: id
  presence: required
  description: 'Portfolio: the book it refers to'
  example: BOOK-EQD-2
  pattern: ^BOOK-
  link: book
- name: STRATEGY
  type: unknown
  presence: optional
- name: PRODUCT_GROUP
  type: text
  presence: required
  example: Equity
  enum:
  - Equity
  - FX
  - Securities financing
- name: PRODUCT_TYPE
  type: text
  presence: required
  example: WARRANT
- name: CURRENCY
  type: text
  presence: required
  example: USD
  enum:
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'Counterparty: the counterparty it refers to'
  example: CP-SUMMIT
  pattern: ^CP-
  link: counterparty
- name: DIRECTION
  type: text
  presence: required
  example: SHORT
  enum:
  - LONG
  - SHORT
- name: QUANTITY
  type: amount
  presence: required
  description: 'The trade''s quantity: positive for a buy, negative for a sell.'
  example: -179000000.0
- name: TAGS
  type: text
  presence: optional
  example: option
- name: REPORTING_CCY
  type: text
  presence: required
  example: USD
- name: PV
  type: amount
  presence: required
  unit: USD
  description: The trade's value on the business date.
  example: 3143714
- name: PNL
  type: vector
  presence: required
  unit: USD
  description: 'The trade''s P&L under each historical scenario day, oldest first: index i is the scenario set''s day i.'
  note: 509 values in the test data
- name: STATUS
  type: text
  presence: required
  description: 'ok, proxied (priced by a proxy) or failed (no vector: counted, never taken as zero).'
  example: ok
- name: PRICER
  type: text
  presence: required
  example: demo-factor-model
- name: MODEL_VERSION
  type: text
  presence: required
  example: demo-2
- name: COMPUTED_AT
  type: timestamp
  presence: required
  example: '2026-09-30T06:00:00Z'
- name: BATCH_ID
  type: id
  presence: required
  example: B-2026-09-30-01
- name: RESTATEMENT
  type: integer
  presence: required
  example: 0
- name: RUN_KIND
  type: text
  presence: optional
  description: 'Which run the row belongs to (2.9.4, VAR_GUIDE.md section 8.4): FULL (or none) for the day''s full run; INTRADAY for an
    update a pricing system sends during the day: only the changed trades, amended, new or cancelled, priced over the same scenario
    set; each intraday batch has its own BATCH_ID and a later COMPUTED_AT, and the latest COMPUTED_AT per trade wins. A cancel is an
    INTRADAY row whose TRADE_STATUS is not live (CANCELLED), its PVs empty.'
  example: FULL
  enum: [FULL, INTRADAY]
links:
- field: TRADE_ID
  kind: trade
- field: LEGAL_ENTITY
  kind: legal-entity
- field: DESK
  kind: desk
- field: TT_BOOK
  kind: book
- field: PORTFOLIO
  kind: book
- field: COUNTERPARTY
  kind: counterparty
validation:
- rule: required
  fields:
  - VECTOR_ID
  - TRADE_ID
  - INSTRUMENT
  - BUSINESS_DATE
  - SCENARIO_SET_ID
  - SOURCE_SYSTEM
  - TRADE_VERSIONS
  - TRADE_STATUS
  - MATURITY_DATE
  - LEGAL_ENTITY
  - DIVISION
  - DESK
  - TT_BOOK
  - PORTFOLIO
  - PRODUCT_GROUP
  - PRODUCT_TYPE
  - CURRENCY
  - COUNTERPARTY
  - DIRECTION
  - QUANTITY
  - REPORTING_CCY
  - PV
  - PNL
  - STATUS
  - PRICER
  - MODEL_VERSION
  - COMPUTED_AT
  - BATCH_ID
  - RESTATEMENT
- rule: unique
  key:
  - VECTOR_ID
  per: BUSINESS_DATE
- rule: pattern
  field: VECTOR_ID
  pattern: ^PV-
- rule: link
  field: TRADE_ID
  kind: trade
- rule: enum
  field: SOURCE_SYSTEM
  values:
  - CALYPSO
  - MUREX
- rule: enum
  field: TRADE_STATUS
  values:
  - AMENDED
  - VALIDATED
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: TT_BOOK
  kind: book
- rule: link
  field: PORTFOLIO
  kind: book
- rule: enum
  field: PRODUCT_GROUP
  values:
  - Equity
  - FX
  - Securities financing
- rule: enum
  field: CURRENCY
  values:
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: enum
  field: DIRECTION
  values:
  - LONG
  - SHORT
- rule: vector-length
  field: PNL
  same: every row of one business date
notes: []
notes:
- 'Delivery format (product owner, 2026-10-27): JSONL: one JSON object per line, UTF-8, one row of this contract a line, exactly its fields (no other); a file is .jsonl, or .jsonl.gz. This is the contract a pricing system sends; tools/pvgen writes it (docs/guides/VAR_GUIDE.md section 15.12). The vector of the examples below is cut to its first 3 values: a row carries all 509.'
- 'Example line, a full run''s row: {"VECTOR_ID":"PV-MX-20000300-HS-509","TRADE_ID":"MX-20000300","SECURITY_ID":null,"INSTRUMENT":"Commodity forward USD 2026-10","BUSINESS_DATE":"2026-09-30","SCENARIO_SET_ID":"HS-509","SOURCE_SYSTEM":"MUREX","TRADE_VERSIONS":"v1","TRADE_STATUS":"VALIDATED","MATURITY_DATE":"2026-10-07","LEGAL_ENTITY":"LE-NY","DIVISION":"DIV-MARKETS","DESK":"DESK-COMM","TT_BOOK":"BOOK-COMM-1","PORTFOLIO":"BOOK-COMM-1","STRATEGY":"","PRODUCT_GROUP":"Commodity","PRODUCT_TYPE":"CMD_FORWARD","CURRENCY":"USD","COUNTERPARTY":"CP-NORTHBRIDGE","DIRECTION":"LONG","QUANTITY":345225.0,"TAGS":"","REPORTING_CCY":"USD","PV":1033434,"PNL":[-268529,278946,184056],"STATUS":"ok","PRICER":"demo-factor-model","MODEL_VERSION":"demo-2","COMPUTED_AT":"2026-09-30T06:00:00Z","BATCH_ID":"B-2026-09-30-01","RESTATEMENT":0,"RUN_KIND":"FULL"}'
review:
- 'required inferred from 100% coverage in 2001 documents (1 samples and 2000 test-data documents (data/testdata/market-risk/pnl-vector/cob-2026-09-30.part-001.jsonl.gz,
  data/testdata/market-risk/pnl-vector/cob-2026-09-30.part-002.jsonl.gz, data/testdata/market-risk/pnl-vector/cob-2026-09-30.part-003.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: SOURCE_SYSTEM, TRADE_STATUS, PRODUCT_GROUP, CURRENCY, DIRECTION: confirm they are
  closed lists.'
- 'no unit stated for the amounts QUANTITY (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
- 'no description in about.yaml or the Sutras for INSTRUMENT, BUSINESS_DATE, SCENARIO_SET_ID, SOURCE_SYSTEM, TRADE_VERSIONS, MATURITY_DATE, DIVISION,
  STRATEGY, PRODUCT_GROUP, PRODUCT_TYPE, CURRENCY, DIRECTION and 7 more: write them in the pack''s config/about.yaml glossary.'
