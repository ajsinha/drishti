  - Commodity
  - Credit
  - Equity
  - FX
  - Fixed income
  - Inflation
  - Money market
  - Rates
  - Securities financing
  - Structured
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: enum
  field: DIRECTION
