# Data contract of the position kind (command POS): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap position`; owned by people from then on: confirm the review points, then remove them.
kind: position
mnemonic: POS
pack: market-risk
version: '1.0'
class: drishti-owned
status: active
title: Position
description: 'A position: one security held in one book (or one OTC trade), the trades that build or reduce it, and its VaR computed as the page
  opens.'
source: Drishti (the VaR engine derives positions from the trades of pnl-vector when a date loads, docs/guides/VAR_GUIDE.md section 15.6)
grain: One position per business date, derived (never stored); POS-<TT_BOOK>~<security> or POS-<TT_BOOK>~<trade>.
key:
- POSITION_ID
id-pattern:
- ^POS-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: when the date's pnl-vector rows are loaded (derived at once)
storage:
  connector: var-positions
  plugin: var-positions
fields:
- name: POSITION_ID
  type: id
  presence: required
  description: 'The position''s id, derived by Drishti: POS-<TT_BOOK>~<security> for securities and listed products, POS-<TT_BOOK>~<TRADE_ID> for an OTC trade.'
  example: POS-BOOK-EQD-2~SEC-WARRANT-USD-01
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business the position is derived for (YYYY-MM-DD).'
  example: '2026-09-30'
- name: POSITION_RULE
  type: text
  presence: required
  description: 'How Drishti keyed the position (the market-risk pack''s positions: rules): securities by book and security, listed by book and
    contract, otc one per trade.'
  example: securities
- name: SECURITY_ID
  type: id
  presence: optional
  description: The security or exchange contract the position holds; empty for a position of one OTC trade.
  example: SEC-WARRANT-USD-01
- name: INSTRUMENT_ID
  type: id
  presence: required
  description: 'What the position is in: the security or contract id for a securities position (SEC-…), else the trade''s own id for an OTC trade that is its own position.'
  example: SEC-WARRANT-USD-01
- name: INSTRUMENT
  type: text
  presence: required
  description: 'What the position holds: the security, or for one OTC trade its product, currency and maturity.'
  example: Equity warrant USD 2027-05
- name: POSITION_TYPE
  type: text
  presence: required
  description: 'fungible when several trades build the position, single-trade when one does.'
  example: fungible
- name: DIRECTION
  type: text
  presence: required
  description: 'LONG when the position''s net quantity is above zero (more bought than sold), SHORT when below. Its trades may be of both directions:
    they net.'
  example: SHORT
- name: QUANTITY
  type: amount
  presence: required
  description: 'The signed sum of the position''s trades'' quantities (notional for swaps, units for securities): a buy adds, a sell takes away.'
  example: -1772145212.5
- name: GROSS_QUANTITY
  type: amount
  presence: required
  description: 'The sum of the absolute signed quantities of the position''s trades.'
  example: 2816087612.5
- name: TRADE_COUNT
  type: integer
  presence: required
  description: How many trades the position holds (the length of TRADE_IDS).
  example: 9
- name: LONG_TRADES
  type: integer
  presence: required
  description: 'How many of the position''s trades are bought (signed quantity above zero).'
  example: 2
- name: SHORT_TRADES
  type: integer
  presence: required
  description: 'How many of the position''s trades are sold (signed quantity below zero).'
  example: 7
- name: TRADE_IDS
  type: id list
  presence: required
  description: 'The position''s trades: TRADE_IDs of the trading pack''s trade kind, as text.'
  link: trade
- name: TRADES
  type: record list
  presence: required
  description: The position's trades, one element per trade with its signed QUANTITY, DIRECTION, PV in USD, product type, counterparty and currency.
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: The bank's legal entity that holds the book.
  example: LE-LDN
  pattern: ^LE-
  link: legal-entity
- name: DIVISION
  type: id
  presence: required
  description: 'The division of the position''s desk, from its first trade.'
  example: DIV-MARKETS
- name: DESK
  type: id
  presence: required
  description: The desk the book belongs to.
  example: DESK-EQD
  pattern: ^DESK-
  link: desk
- name: TT_BOOK
  type: id
  presence: required
  description: 'The book the position is held in: its trades are all booked there.'
  example: BOOK-EQD-2
  pattern: ^BOOK-
  link: book
- name: PORTFOLIO
  type: id
  presence: required
  description: 'The book the position sits in: a BOOK_ID of the core pack''s book kind (BOOK-…).'
  example: BOOK-EQD-2
  pattern: ^BOOK-
  link: book
- name: STRATEGY
  type: unknown
  presence: optional
  description: 'The trading strategy of the position''s first trade, when there is one.'
- name: COUNTERPARTY
  type: id
  presence: required
  description: The counterparty of the position's trades when they all share one; empty otherwise.
  example: CP-SUMMIT
  pattern: ^CP-
  link: counterparty
- name: PRODUCT_GROUP
  type: text
  presence: required
  description: 'The product group of the position''s first trade.'
  example: Equity
- name: PRODUCT_TYPE
  type: text
  presence: required
  description: The product of the instrument, as the booking systems name it.
  example: WARRANT
- name: CURRENCY
  type: text
  presence: required
  description: The instrument's currency. Every P&L and value is in USD, the reporting currency.
  example: USD
- name: COUNTERPARTIES
  type: text list
  presence: required
  description: 'Every counterparty among the position''s trades.'
- name: MARKET_VALUE
  type: amount
  presence: required
  unit: USD
  description: The sum of the trades' present values (their mark-to-market) on the business date.
  example: 41691425
- name: NOTIONAL
  type: amount
  presence: required
  description: The sum of the trades' quantities without their signs.
  example: 2816087612
- name: TAGS
  type: list
  presence: required
  description: 'The union of the position''s trades'' tags.'
- name: STATUS
  type: text
  presence: required
  description: 'open when the net quantity is not zero, flat when it is.'
  example: open
- name: SCENARIO_SET_ID
  type: id
  presence: required
  description: 'The scenario set of the date the position was derived from.'
  example: HS-509
- name: VAR_SCOPE
  type: text
  presence: required
  description: 'The VaR scope that names this position (POS:<POSITION_ID>), for the explorer and VRES.'
  example: POS:POS-BOOK-EQD-2~SEC-WARRANT-USD-01
nested:
  TRADES[]:
  - name: TRADE_ID
    type: id
    presence: required
    description: 'The trade: a TRADE_ID of the trading pack''s trade kind, as text.'
    example: MX-20000274
    pattern: ^((MX|CLY)-)?\d+$
    link: trade
  - name: QUANTITY
    type: amount
    presence: required
    description: 'The trade''s signed quantity in the position: a buy positive, a sell negative.'
    example: -179000000.0
  - name: DIRECTION
    type: text
    presence: required
    description: LONG (quantity zero or more) or SHORT (quantity below zero).
    example: SHORT
  - name: PV
    type: amount
    presence: required
    unit: USD
    description: The trade's present value on the business date, from its P&L-vector or scenario-PV row.
    example: 3143714.0
  - name: PRODUCT_TYPE
    type: text
    presence: required
    description: 'The product type of the member trade.'
    example: WARRANT
  - name: COUNTERPARTY
    type: id
    presence: required
    description: 'The trade''s counterparty: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
    example: CP-SUMMIT
    pattern: ^CP-
    link: counterparty
  - name: TRADE_CURRENCY
    type: text
    presence: optional
    description: 'The trade''s currency (2.9.4): the currency its scenario PVs come in, else its own CURRENCY (a P&L vector, sent in USD).'
    example: EUR
links:
- field: TRADE_IDS
  kind: trade
- field: LEGAL_ENTITY
  kind: legal-entity
- field: DESK
  kind: desk
- field: TT_BOOK
  kind: book
- field: PORTFOLIO
  kind: book
- field: COUNTERPARTY
  kind: counterparty
- field: TRADES[].TRADE_ID
  kind: trade
- field: TRADES[].COUNTERPARTY
  kind: counterparty
validation:
- rule: required
  fields:
  - POSITION_ID
  - BUSINESS_DATE
  - POSITION_RULE
  - INSTRUMENT_ID
  - INSTRUMENT
  - POSITION_TYPE
  - DIRECTION
  - QUANTITY
  - GROSS_QUANTITY
  - TRADE_COUNT
  - LONG_TRADES
  - SHORT_TRADES
  - TRADE_IDS
  - TRADES
  - LEGAL_ENTITY
  - DIVISION
  - DESK
  - TT_BOOK
  - PORTFOLIO
  - COUNTERPARTY
  - PRODUCT_GROUP
  - PRODUCT_TYPE
  - CURRENCY
  - COUNTERPARTIES
  - MARKET_VALUE
  - NOTIONAL
  - TAGS
  - STATUS
  - SCENARIO_SET_ID
  - VAR_SCOPE
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: link
  field: TRADE_IDS
  kind: trade
- rule: link
  field: LEGAL_ENTITY
  kind: legal-entity
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: TT_BOOK
  kind: book
- rule: link
  field: PORTFOLIO
  kind: book
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: TRADES[].TRADE_ID
  kind: trade
- rule: link
  field: TRADES[].COUNTERPARTY
  kind: counterparty
notes:
- 'Positions are derived by Drishti when a date loads (docs/guides/VAR_GUIDE.md section 15.6), by the market-risk pack''s positions: rules (securities
  by book and security id, listed by book and contract, OTC by book and trade), and served from the VaR engine''s memory by the var-positions
  connector: no upstream delivers them and nothing stores them. Their VaR figures are computed as the page opens (VAR_ENGINE), never stored.'
review:
- 'required inferred from 100% coverage in 2 documents (2 samples): confirm each required field is mandatory upstream, and each optional one may
  be empty.'
- 'no key could be read from the test data, the catalogue or the layout: name the business key.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'number types decided by the field''s name: NOTIONAL amount, TRADES[].PV amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts QUANTITY, GROSS_QUANTITY, NOTIONAL, TRADES[].QUANTITY, TRADES[].PV (docs/contracts/README.md section 7: USD
  unless stated): confirm the currency.'
