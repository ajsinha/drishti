# Data contract of the stress-result kind (command STR): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap stress-result`; owned by people from then on: confirm the review points, then remove them.
kind: stress-result
mnemonic: STR
pack: market-risk
version: '1.0'
class: fundamental
status: active
title: Stress result
description: P&L of a desk under a scenario, by book.
source: stress-engine
grain: One row per stress result per business date, keyed by RESULT_ID.
key:
- RESULT_ID
id-pattern:
- ^STR-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/stress-result/
  test-data:
  - data/testdata/market-risk/stress-result
fields:
- name: RESULT_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: STR-COVID2020-COMM
  pattern: ^STR-
- name: SCENARIO_NAME
  type: text
  presence: required
  description: The stress scenario the portfolio was revalued under.
  example: COVID-19 March 2020
  enum:
  - Bear steepener 2s10s +75 bp
  - COVID-19 March 2020
  - Emerging-market crisis
  - Global financial crisis 2008
  - Inflation surprise
  - Oil supply shock
  - Parallel rates +200 bp
  - USD +15% vs all
- name: PNL
  type: amount
  presence: required
  unit: USD
  description: The change in value over the period of the result. In a stress result, the revaluation of the portfolio under the scenario.
  example: -79098347
- name: LIMIT
  type: amount
  presence: required
  unit: USD
  description: 'The largest loss the desk accepts under this scenario, a positive magnitude (2.9.7, F5: every limit is positive). A loss
    (-PNL) above the limit is a breach; the limit use is max(-PNL, 0) / LIMIT.'
  example: 75700000.0
- name: BY_BOOK
  type: record list
  presence: required
  description: 'The scenario''s P&L by book, one element per book of the desk: BOOK and PNL in USD, a loss negative.'
- name: SCENARIO
  type: id
  presence: required
  description: 'The stress scenario applied: a SCENARIO_ID of the stress-scenario kind (SCN-…).'
  example: SCN-COVID2020
  pattern: ^SCN-
  link: stress-scenario
- name: DESK
  type: id
  presence: required
  description: 'The desk the result is for: a DESK_ID of the core pack''s desk kind (DESK-…).'
  example: DESK-COMM
  pattern: ^DESK-
  link: desk
nested:
  BY_BOOK[]:
  - name: BOOK
    type: id
    presence: required
    description: 'The book: a BOOK_ID of the core pack''s book kind (BOOK-…).'
    example: BOOK-COMM-1
    pattern: ^BOOK-
    link: book
  - name: PNL
    type: amount
    presence: required
    unit: USD
    description: The book's share of the scenario P&L.
    example: -25019855
links:
- field: SCENARIO
  kind: stress-scenario
- field: DESK
  kind: desk
- field: BY_BOOK[].BOOK
  kind: book
validation:
- rule: required
  fields:
  - RESULT_ID
  - SCENARIO_NAME
  - PNL
  - LIMIT
  - BY_BOOK
  - SCENARIO
  - DESK
- rule: unique
  key:
  - RESULT_ID
  per: business_date
- rule: pattern
  field: RESULT_ID
  pattern: ^STR-
- rule: enum
  field: SCENARIO_NAME
  values:
  - Bear steepener 2s10s +75 bp
  - COVID-19 March 2020
  - Emerging-market crisis
  - Global financial crisis 2008
  - Inflation surprise
  - Oil supply shock
  - Parallel rates +200 bp
  - USD +15% vs all
- rule: link
  field: SCENARIO
  kind: stress-scenario
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: BY_BOOK[].BOOK
  kind: book
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 160 documents (80 samples and 80 test-data documents (data/testdata/market-risk/stress-result/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-risk/stress-result/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'source ''stress-engine'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: SCENARIO_NAME: confirm they are closed lists.'
