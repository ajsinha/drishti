# Data contract of the var-result kind (command VRES): docs/contracts/README.md section 16; the measure's contract is
# docs/guides/VAR_GUIDE.md (section 8). Drafted by `drishti.py contract bootstrap var-result`, completed by hand (2.8.0).
kind: var-result
mnemonic: VRES
pack: market-risk
version: '1.1'
class: computed
status: active
title: VaR of a scope (computed)
description: The VaR, ES, decomposition, worst scenarios and P&L vector of any scope (the scope grammar of VAR_GUIDE.md section 5), computed
  when asked by the server's VaR engine as the person asking; never stored.
source: 'computed by Drishti: the reactive connector var-engine (java engine com.ash.drishti.server.var.VarResultEngine)'
grain: One answer per question (the scope asked for and the business date), computed when asked.
key: []
dated-by: on request
cadence:
  frequency: on change
  due: computed on request and again when the date's inputs load (data-version trigger)
storage:
  connector: var-engine
  plugin: reactive
fields:
- name: SCOPE
  type: text
  presence: required
  description: The scope as asked (the id; a ~ inside a node id is written %7E).
  example: DESK:RATES
- name: CANONICAL
  type: text
  presence: required
  description: The scope's canonical text (VAR_GUIDE.md section 5.2).
- name: SCOPE_KIND
  type: text
  presence: required
  description: 'What kind of scope was asked for (node, position, trade, portfolio, basket, capture, rule, counterparty, legal-entity, adhoc).'
  enum: [node, position, trade, portfolio, basket, capture, rule, counterparty, legal-entity, adhoc]
- name: LABEL
  type: text
  presence: required
  description: 'The scope''s display label.'
- name: NODE
  type: id
  presence: optional
  description: The hierarchy node when the scope is exactly one node.
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The business date answered (YYYY-MM-DD).'
- name: CURRENCY
  type: text
  presence: required
  description: 'The reporting currency of every amount of the answer (2.9.4): the parameter ccy, USD by default (VRES DESK:RATES~ccy=EUR);
    VAR_GUIDE.md section 15.10.'
  example: USD
- name: VAR
  type: amount
  presence: required
  unit: CURRENCY
  description: VaR at CONFIDENCE, positive for a loss (VAR_GUIDE.md section 18.1).
- name: ES
  type: amount
  presence: required
  unit: CURRENCY
  description: Expected shortfall at ES_CONFIDENCE (VAR_GUIDE.md section 18.2).
- name: CONFIDENCE
  type: rate
  presence: required
  description: 'The VaR confidence level, as a fraction (0.99): the parameter confidence (2.9.7, one of drishti.var.confidences), else
    drishti.var.confidence.'
  example: 0.99
- name: ES_CONFIDENCE
  type: rate
  presence: required
  description: 'The expected shortfall confidence level, as a fraction (0.975): the parameter es-confidence (2.9.7, one of
    drishti.var.es-confidences), else drishti.var.es-confidence.'
  example: 0.975
- name: HORIZON
  type: text
  presence: optional
  description: 'The horizon of every figure (2.9.7, VAR_GUIDE.md section 18.6): 1D, or 10D with the parameter horizon=10d (VRES
    BANK~horizon=10d~method=sum), from the same 1-day scenario P&Ls (no other input).'
  enum: [1D, 10D]
  example: 1D
- name: METHOD
  type: text
  presence: optional
  description: 'How a 10-day figure is made (2.9.7): SQRT10 (the 1-day figures × √10) or SUM (each scenario the sum of 10 consecutive
    1-day scenario P&Ls, 509 scenarios giving 500 overlapping windows; then SCENARIOS is the windows and PNL the windows'' sums); empty at 1 day.'
  enum: [SQRT10, SUM]
- name: K
  type: integer
  presence: required
  description: The VaR rank (the 6th worst of 509 at 99%; the 26th at 95%; the 5th of the 500 windows of the 10-day sum at 99%).
- name: ES_COUNT
  type: integer
  presence: required
  description: 'The number of worst scenarios averaged into the ES.'
- name: SCENARIOS
  type: integer
  presence: required
  description: 'The number of scenarios in the scope''s P&L vector (the scenario set''s SCENARIO_COUNT).'
- name: LIMIT
  type: amount
  presence: optional
  description: 'The scope''s VaR limit (a node''s or portfolio''s), converted to the answer''s currency; null when it has none.'
  unit: CURRENCY
- name: LIMIT_USE
  type: rate
  presence: optional
  description: 'VAR / LIMIT, as a fraction; null without a limit.'
- name: SUM_STANDALONE
  type: amount
  presence: optional
  description: 'The sum of the standalone VaRs of the scope''s children; null when it has none.'
  unit: CURRENCY
- name: DIVERSIFICATION
  type: amount
  presence: optional
  description: 'SUM_STANDALONE minus VAR: what the children''s offsets save; null when there are no children.'
  unit: CURRENCY
- name: BACKTEST
  type: record
  presence: required
  description: DAYS, EXCEPTIONS, LIGHT, KUPIEC_LR, KUPIEC_P_VALUE, CHRISTOFFERSEN_LR, CHRISTOFFERSEN_P_VALUE (VAR_GUIDE.md section 18.4).
- name: CHILDREN
  type: record list
  presence: required
  description: The default parts (VAR_GUIDE.md section 11.3) with KEY, SCOPE, LABEL, KIND, STANDALONE_VAR, COMPONENT_VAR, COMPONENT_ES,
    INCREMENTAL_VAR, PCT.
- name: WORST
  type: record list
  presence: required
  description: The 25 worst scenarios (RANK, INDEX, DATE, PNL).
- name: PNL
  type: vector
  presence: required
  unit: CURRENCY
  description: The scope's P&L under each scenario day, oldest first (unrounded).
- name: PROVENANCE
  type: record
  presence: required
  description: The headline's provenance in UPPER_SNAKE (VAR_GUIDE.md section 11.2), with TIER saying where the vector came from.
links: []
validation:
- rule: required
  fields:
  - VAR
  - ES
  - PNL
notes:
- 'No stored key: an answer''s id is the scope asked (the id in the request); VAR <scope> <GO> opens the same answer in the explorer.'
- Computed as the viewer with the explorer's entitlements (VAR_GUIDE.md section 9); cached per view signature, data version and scope.
review: []
