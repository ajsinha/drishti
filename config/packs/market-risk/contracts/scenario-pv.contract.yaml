# Data contract of the scenario-pv kind (command SPV): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap scenario-pv`; owned by people from then on: confirm the review points, then remove them.
kind: scenario-pv
mnemonic: SPV
pack: market-risk
version: '1.1'
class: input
status: active
title: Scenario PVs of a trade (509 scenarios, its currency)
description: 'A trade''s present value under each historical scenario and its base PV of the same run, in the trade''s own currency: the
  form of a trade''s scenario P&L a bank may send instead of a P&L vector (2.9.4; VAR_GUIDE.md section 15.9). The VaR engine turns it
  into the trade''s USD P&L when it loads the date: P&L(s) = PV(s) x FX(s) - PV(base) x FX(base).'
source: Synthetic sample data (tools/packgen/var/make_var_data.py, scenario_fx.py)
grain: One row per trade, business date and scenario set (BUSINESS_DATE), keyed by SCENARIO_PV_ID; a trade is in this kind or in pnl-vector,
  never both on one date.
key:
- SCENARIO_PV_ID
id-pattern:
- ^SPV-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/scenario-pv/
  columns:
  - VALUE_TYPE
  - GRAIN
  - TRADE_ID
  - POSITION_ID
  - CURRENCY
  - SOURCE_SYSTEM
  - SECURITY_ID
  - INSTRUMENT
  - LEGAL_ENTITY
  - DIVISION
  - DESK
  - TT_BOOK
  - LIMIT_LETTER
  - PORTFOLIO
  - STRATEGY
  - PRODUCT_GROUP
  - PRODUCT_TYPE
  - COUNTERPARTY
  - DIRECTION
  - QUANTITY
  - BASE_PV
  - VALUATION_DATE
  - BASE_VALUATION_DATE
  - TAGS
  - TRADE_STATUS
  - MATURITY_DATE
  - STATUS
  - SCENARIO_SET_ID
  - BATCH_ID
  - RUN_KIND
  - COMPUTED_AT
  - TRADE_IDS
  vectors:
  - SCENARIO_PV
  test-data:
  - data/testdata/market-risk/scenario-pv
fields:
- name: VALUE_TYPE
  type: text
  presence: required
  description: 'What the values are (2.9.4, VAR_GUIDE.md section 15.13): PV, scenario PVs and BASE_PV in CURRENCY; PNL, a P&L vector.
    It must be the record''s payload (refused as DRS-5208 when it is not) and agree with its system''s pin when drishti.var.inputs pins
    one (DRS-5209).'
  example: PV
  enum: [PV, PNL]
- name: GRAIN
  type: text
  presence: required
  description: 'What one record is (2.9.4, VAR_GUIDE.md section 15.13): TRADE, one trade, with its TRADE_ID (its position derived by
    the pack''s rules); POSITION, one position its source system sends whole, with its POSITION_ID, placed by its book (LEGAL_ENTITY,
    DESK, TT_BOOK) and naming its trades in TRADE_IDS when it knows them. It must match the id (DRS-5208) and the pin (DRS-5209); one
    source system sends one form and one grain on one date (DRS-5210).'
  example: TRADE
  enum: [TRADE, POSITION]
- name: TRADE_ID
  type: id
  presence: optional
  description: 'Trade: the trade it refers to, at GRAIN TRADE (required then)'
  example: '1000054'
  link: trade
- name: POSITION_ID
  type: id
  presence: optional
  description: 'The position, at GRAIN POSITION (required then, and no TRADE_ID): used as it is, never derived from trades. At GRAIN
    TRADE it is absent (the engine derives the trade''s position).'
  example: POS-ENDUR-BOOK-COMM-1-ComSwap-USD
  link: position
- name: CURRENCY
  type: text
  presence: required
  description: 'The currency both PVs are in: the trade''s own currency (one stated currency for a whole file is the same thing).'
  example: EUR
  enum:
  - CAD
  - EUR
  - USD
- name: SOURCE_SYSTEM
  type: text
  presence: required
  description: 'The booking system the trade comes from (ENDUR in the demo); kept for people and audit, not read by the engine.'
  example: ENDUR
- name: SCENARIO_PV_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: SPV-1000054-HS-509
  pattern: ^SPV-
  link: scenario-pv
- name: SECURITY_ID
  type: id
  presence: optional
  description: 'The security or exchange contract the trade is in (securities and listed products): Drishti keys the trade''s position by book and security.'
  example: XCH-ComFut-USD-08
- name: INSTRUMENT
  type: text
  presence: required
  description: 'The instrument''s name, the position''s label on the pages.'
  example: ENGY-SWAP EUR 2026-09
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business the PVs belong to (YYYY-MM-DD); the lake''s business_date partition.'
  example: '2026-09-30'
- name: SCENARIO_SET_ID
  type: id
  presence: required
  description: 'The scenario set whose SCENARIO_DATES order SCENARIO_PV; it must be the date''s set, the same for both forms (DRS-5203).'
  example: HS-509
- name: TRADE_VERSIONS
  type: text
  presence: optional
  description: 'The trade version the batch priced, as v<TRADE_VERSION>; kept for audit, not read by the engine.'
  example: v2
- name: TRADE_STATUS
  type: text
  presence: required
  description: 'The trade''s status the batch priced: only the live statuses (NEW, VALIDATED, AMENDED by default) count; a row with no status counts. An intraday row whose status is not live (CANCELLED), its PVs empty, removes the trade from then on.'
  example: VALIDATED
  enum:
  - AMENDED
  - CANCELLED
  - NEW
  - VALIDATED
- name: MATURITY_DATE
  type: date
  presence: required
  description: 'The trade''s maturity date (YYYY-MM-DD); a trade matured before the business date does not count.'
  example: '2026-09-30'
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: 'The bank''s legal entity that booked the trade: an ENTITY_ID of the core pack''s legal-entity kind (LE-…). Must be a promoted column.'
  example: LE-NY
  pattern: ^LE-
  link: legal-entity
- name: DIVISION
  type: id
  presence: required
  description: 'The division of the desk the trade is booked in.'
  example: DIV-MARKETS
- name: DESK
  type: id
  presence: required
  description: 'The desk the trade is booked on: a DESK_ID of the core pack''s desk kind (DESK-…). Must be a promoted column.'
  example: DESK-COMM
  pattern: ^DESK-
  link: desk
- name: TT_BOOK
  type: id
  presence: required
  description: 'The book the trade is booked in: a BOOK_ID of the core pack''s book kind (BOOK-…); a trade without a book is in no hierarchy node. Must be a promoted column.'
  example: BOOK-COMM-1
  pattern: ^BOOK-
  link: book
- name: LIMIT_LETTER
  type: text
  presence: optional
  description: 'The limit letter (2.9.5): the letter of authority the record''s VaR limit is granted under. A hierarchy may be built from
    it (the market-risk pack''s LL, LIMIT_LETTER > DESK, VAR_GUIDE.md section 16): when one is, every row carries it (a row that leaves
    it empty is refused, DRS-5211; a table without the column skips that hierarchy alone, with a DRS-5211 warning, and the rest loads).
    Per row, so a letter may hold part of a book.'
  example: LL-0003
- name: PORTFOLIO
  type: id
  presence: required
  description: 'The booking portfolio on the trade as the source system names it: a BOOK_ID of the core pack''s book kind (BOOK-…), the same as TT_BOOK in the demo.'
  example: BOOK-COMM-1
  pattern: ^BOOK-
  link: book
- name: STRATEGY
  type: unknown
  presence: optional
  description: 'The trading strategy on the trade, when the booking system has one (empty in the demo).'
- name: PRODUCT_GROUP
  type: text
  presence: required
  description: 'The product group: picks the position rule that groups the trade into a position.'
  example: Commodity
- name: PRODUCT_TYPE
  type: text
  presence: required
  description: 'The product type as booked in the source system (ComSwap, ComFut ...): picks the position rule when no group does.'
  example: ComSwap
  enum:
  - CallNot
  - Cash
  - ComFut
  - ComSwap
  - Commodity
- name: COUNTERPARTY
  type: id
  presence: optional
  description: 'The trade''s counterparty: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…); the CPTY: scope.'
  example: CP-NORTHPLAINS
  pattern: ^CP-
  link: counterparty
- name: DIRECTION
  type: text
  presence: required
  description: 'LONG when QUANTITY is zero or more, SHORT when it is negative.'
  example: SHORT
  enum:
  - LONG
  - SHORT
- name: QUANTITY
  type: amount
  presence: required
  description: 'The signed quantity or notional: positive bought, negative sold (the batch applies the sign of BUY_SELL_CODE).'
  example: -18000.0
- name: TAGS
  type: text
  presence: optional
  description: 'The trade''s tags joined by | (for example internal, option); empty when none.'
  example: option
- name: BASE_PV
  type: amount
  presence: required
  unit: the trade's currency (CURRENCY)
  description: The trade's present value on the business date, from the same run as the scenario PVs.
  example: 14997.44
- name: VALUATION_DATE
  type: date
  presence: required
  description: 'The date the scenario PVs are valued on: the business date.'
  example: '2026-09-30'
- name: BASE_VALUATION_DATE
  type: date
  presence: required
  description: 'The date the base PV is valued on: the same as the scenario PVs'', the business date.'
  example: '2026-09-30'
- name: SCENARIO_PV
  type: vector
  presence: optional
  unit: the trade's currency (CURRENCY)
  description: 'The trade''s present value under each historical scenario day, oldest first: index i is the scenario set''s day i. A scenario
    that failed to price is null: the trade is then not loaded (DRS-5206), never filled with zero.'
  note: 509 values in the test data
- name: STATUS
  type: text
  presence: required
  description: 'ok, proxied (priced by a proxy) or failed (no scenario PVs: counted, never taken as zero).'
  example: ok
- name: PRICER
  type: text
  presence: required
  description: 'The pricer that valued the trade; kept for audit, not read by the engine.'
  example: demo-factor-model
- name: MODEL_VERSION
  type: text
  presence: required
  description: 'The pricer''s model version; kept for audit, not read by the engine.'
  example: demo-2
- name: COMPUTED_AT
  type: timestamp
  presence: required
  description: 'When the run priced the row, ISO-8601 UTC. For an intraday update it is later than the morning run''s, and the latest per trade wins.'
  unit: 'UTC'
  example: '2026-09-30T06:00:00Z'
- name: BATCH_ID
  type: id
  presence: required
  description: 'The risk run that produced the row: one batch per date for the full run across both forms (DRS-5203); each intraday batch has its own.'
  example: B-2026-09-30-01
- name: RESTATEMENT
  type: integer
  presence: required
  description: '0 for the first run of the date, then 1, 2, ... each time the date is restated.'
  example: 0
- name: RUN_KIND
  type: text
  presence: optional
  description: 'Which run the row belongs to (2.9.4, VAR_GUIDE.md section 8.4): FULL (or none) for the day''s full run; INTRADAY for an
    update a pricing system sends during the day: only the changed trades, amended, new or cancelled, priced over the same scenario
    set; each intraday batch has its own BATCH_ID and a later COMPUTED_AT, and the latest COMPUTED_AT per trade wins. A cancel is an
    INTRADAY row whose TRADE_STATUS is not live (CANCELLED), its PVs empty.'
  example: FULL
  enum: [FULL, INTRADAY]
- name: TRADE_IDS
  type: id list
  presence: optional
  description: 'At GRAIN POSITION, the trades the position aggregates when its source system knows them: kept for navigation (the
    position page lists them; a trade page links its position); none of them may be sent on its own as well (DRS-5210).'
  example: '["1000279", "1000280"]'
  link: trade
