# Data contract of the var-node kind (command VNODE): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap var-node`; owned by people from then on: confirm the review points, then remove them.
kind: var-node
mnemonic: VNODE
pack: market-risk
version: '1.0'
class: computed
status: retiring
retiring-in: 2.8.0
replaced-by: docs/contracts/VAR.md
title: Official VaR of a hierarchy node
description: Official VaR of a node
source: Synthetic sample data (tools/packgen/banking)
grain: One row per official var of a hierarchy node per BUSINESS_DATE, keyed by VAR_NODE_ID.
key:
- VAR_NODE_ID
id-pattern:
- ^VN-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/var-node/
  columns:
  - NODE_ID
  - HIERARCHY
  - LEVEL
  - NAME
  - PARENT_ID
  - VAR_99
  - ES_975
  - HYPO_PNL
  - LIMIT
  - POSITION_COUNT
  - TRADE_COUNT
  vectors:
  - PNL
  test-data:
  - data/testdata/market-risk/var-node
fields:
- name: VAR_NODE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: VN-MGMT~DESK-RATES
  pattern: ^VN-
- name: NODE_ID
  type: id
  presence: required
  description: 'Hierarchy node: the risk-hierarchy it refers to'
  example: MGMT~DESK-RATES
  pattern: ^(MGMT|LEGAL)~
  link: risk-hierarchy
- name: HIERARCHY
  type: text
  presence: required
  example: MGMT
  enum:
  - LEGAL
  - MGMT
- name: LEVEL
  type: text
  presence: required
  example: desk
  enum:
  - bank
  - book
  - desk
- name: NAME
  type: text
  presence: required
  example: Rates · Swaps and options
- name: PARENT_ID
  type: id
  presence: optional
  example: MGMT~DIV-MARKETS
- name: BUSINESS_DATE
  type: date
  presence: required
  example: '2026-09-29'
- name: SCENARIO_SET_ID
  type: id
  presence: required
  example: HS-509
- name: VAR_99
  type: amount
  presence: derived
  unit: USD
  description: The loss the portfolio is expected not to exceed on 99 of 100 trading days, read from the 1st percentile of the revalued scenario
    P&L (historical simulation).
  example: 2938233
  note: computed by the VaR engine; removed when retired
- name: ES_975
  type: amount
  presence: derived
  unit: USD
  description: The average loss on the worst 2.5% of scenario days. It looks into the tail that VaR ignores, and it is the measure the FRTB internal-models
    approach uses for capital.
  example: 3599094
  note: computed by the VaR engine; removed when retired
- name: HYPO_PNL
  type: amount
  presence: derived
  unit: USD
  description: 'The node''s P&L of the day with its positions of the day before unchanged: what the backtest compares with VaR.'
  example: 388197
  note: computed by the VaR engine; removed when retired
- name: EXCEPTION
  type: boolean
  presence: derived
  description: True when the day's loss was larger than the previous day's VaR.
  example: false
  note: computed by the VaR engine; removed when retired
- name: PREVIOUS_VAR
  type: amount
  presence: derived
  example: 2919754
  note: computed by the VaR engine; removed when retired
- name: LIMIT
  type: amount
  presence: required
  unit: USD
  description: The node's VaR limit on the day.
  example: 4200000
- name: LIMIT_USE
  type: rate
  presence: derived
  example: 0.6996
  note: computed by the VaR engine; removed when retired
- name: POSITION_COUNT
  type: integer
  presence: derived
  example: 24
  note: computed by the VaR engine; removed when retired
- name: TRADE_COUNT
  type: integer
  presence: derived
  example: 172
  note: computed by the VaR engine; removed when retired
- name: BATCH_ID
  type: id
  presence: required
  example: B-2026-09-29-01
- name: OFFICIAL
  type: boolean
  presence: required
  example: true
- name: PNL
  type: vector
  presence: derived
  note: computed by the VaR engine; removed when retired; 509 values in the test data
- name: EXCEPTIONS_250
  type: integer
  presence: derived
  example: 2
  note: computed by the VaR engine; removed when retired
links:
- field: NODE_ID
  kind: risk-hierarchy
validation:
- rule: required
  fields:
  - VAR_NODE_ID
  - NODE_ID
  - HIERARCHY
  - LEVEL
  - NAME
  - BUSINESS_DATE
  - SCENARIO_SET_ID
  - LIMIT
  - BATCH_ID
  - OFFICIAL
- rule: unique
  key:
  - VAR_NODE_ID
  per: BUSINESS_DATE
- rule: pattern
  field: VAR_NODE_ID
  pattern: ^VN-
- rule: link
  field: NODE_ID
  kind: risk-hierarchy
- rule: enum
  field: HIERARCHY
  values:
  - LEGAL
  - MGMT
- rule: enum
  field: LEVEL
  values:
  - bank
  - book
  - desk
- rule: range
  field: POSITION_COUNT
  min: 0
- rule: range
  field: TRADE_COUNT
  min: 0
- rule: vector-length
  field: PNL
  same: every row of one business date
notes:
- 'Retiring in 2.8.0: the stored kind is removed and computed instead by the VaR engine (docs/contracts/VAR.md); old ids and links open the computed
  page.'
review:
- 'required inferred from 100% coverage in 2002 documents (2 samples and 2000 test-data documents (data/testdata/market-risk/var-node/history-2025-10-01-to-2026-09-30.part-001.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: HIERARCHY, LEVEL: confirm they are closed lists.'
- 'number types decided by the field''s name: PREVIOUS_VAR amount, LIMIT_USE rate: confirm amount, rate or integer.'
- 'no unit stated for the amounts PREVIOUS_VAR (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
- 'no description in about.yaml or the Sutras for HIERARCHY, LEVEL, NAME, PARENT_ID, BUSINESS_DATE, SCENARIO_SET_ID, PREVIOUS_VAR, LIMIT_USE,
  POSITION_COUNT, TRADE_COUNT, BATCH_ID, OFFICIAL and 2 more: write them in the pack''s config/about.yaml glossary.'
- 'LIMIT is a term: confirm it is read from the risk hierarchy (LIMIT_VAR) after retirement. HYPO_PNL: confirm it is a computed figure and not
  an upstream input of the backtest.'
