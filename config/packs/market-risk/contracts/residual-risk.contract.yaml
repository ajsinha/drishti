# Planned data contract of the residual-risk input (proposed command RRAI): docs/contracts/FRTB.md section 3.4,
# docs/contracts/FRTB_DATA_STRUCTURES.md section 7; read by the FRTB-SA engine's residual risk add-on (MAR23) when a connector serves it.
kind: residual-risk
mnemonic: RRAI
pack: market-risk
version: '1.0'
class: input
status: planned
title: 'Residual risk inputs (the RRAO, per trade)'
description: 'The residual risk add-on''s inputs (Basel MAR23): one row per trade and business date with its class (an exotic
  underlying, other residual risks, or none), its gross notional and the exclusion flags no trade master holds. Optional: without it the
  engine derives the RRAO from each position''s PRODUCT_TYPE (the parameter file''s mapping) and its notional. Planned: no command and no
  data yet; the engine reads it when a connector serves the kind (docs/guides/FRTB_SA_GUIDE.md).'
source: The bank's product control or risk system (the instruments with residual risk and their exclusions)
grain: One row per trade and BUSINESS_DATE, keyed by RESIDUAL_RISK_ID (RRAO-<TRADE_ID>-<BATCH_ID>).
key:
- RESIDUAL_RISK_ID
id-pattern:
- ^RRAO-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: with the position sensitivities of the date
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/residual-risk/
  columns:
  - RESIDUAL_RISK_ID
  - TRADE_ID
  - POSITION_ID
  - RRAO_CLASS
  - GROSS_NOTIONAL
  - CURRENCY
fields:
- name: RESIDUAL_RISK_ID
  type: id
  presence: required
  description: The row's id, RRAO-<TRADE_ID>-<BATCH_ID> (the business key).
  example: RRAO-MX-20000311-B-RRAO-2026-09-30-01
  pattern: ^RRAO-
- name: BUSINESS_DATE
  type: date
  presence: required
  description: The business date (YYYY-MM-DD).
  example: '2026-09-30'
- name: TRADE_ID
  type: id
  presence: required
  description: The trade.
  example: MX-20000311
- name: POSITION_ID
  type: id
  presence: optional
  description: The position the trade belongs to.
  example: POS-BOOK-FX-1~MX-20000311
  pattern: ^POS-
  link: position
- name: BATCH_ID
  type: id
  presence: required
  description: The delivery's batch.
  example: B-RRAO-2026-09-30-01
- name: RRAO_CLASS
  type: text
  presence: required
  description: 'EXOTIC (an exotic underlying, MAR23.3: 1.0%), OTHER (gap, correlation or behavioural risk, MAR23.4 and MAR23.5: 0.1%) or
    NONE (out of scope); overrides the product-type mapping.'
  example: OTHER
  enum:
  - EXOTIC
  - OTHER
  - NONE
- name: RISK_TYPE
  type: text
  presence: optional
  description: The residual risk named (longevity, weather, natural-disaster, future-realised-volatility, gap, correlation, behavioural).
  example: gap
- name: GROSS_NOTIONAL
  type: amount
  presence: required
  unit: CURRENCY
  description: The gross notional, absolute (MAR23.8).
  example: 50000000
- name: CURRENCY
  type: text
  presence: required
  description: The currency of GROSS_NOTIONAL (ISO 4217).
  example: USD
- name: BACK_TO_BACK_OF
  type: id
  presence: optional
  description: The trade it exactly matches with a third party; both are excluded entirely (MAR23.7).
  example: MX-20000312
- name: LISTED_OR_CLEARABLE
  type: boolean
  presence: optional
  description: Listed or eligible for central clearing; excluded from the other-residual part only (an exotic underlying stays in, MAR23.7).
  example: false
- name: REASON
  type: text
  presence: optional
  description: Why the trade is in scope.
  example: knock-out barrier
validation:
- rule: required
  fields:
  - RESIDUAL_RISK_ID
  - BUSINESS_DATE
  - TRADE_ID
  - BATCH_ID
  - RRAO_CLASS
  - GROSS_NOTIONAL
  - CURRENCY
- rule: unique
  key:
  - RESIDUAL_RISK_ID
  per: BUSINESS_DATE
- rule: pattern
  field: RESIDUAL_RISK_ID
  pattern: ^RRAO-
notes:
- 'JSON Lines, one row per line (UTF-8, gzip). Example line: {"RESIDUAL_RISK_ID":"RRAO-MX-20000311-B-RRAO-2026-09-30-01","BUSINESS_DATE":"2026-09-30","TRADE_ID":"MX-20000311","BATCH_ID":"B-RRAO-2026-09-30-01","RRAO_CLASS":"OTHER","RISK_TYPE":"gap","GROSS_NOTIONAL":50000000,"CURRENCY":"USD","LISTED_OR_CLEARABLE":false,"REASON":"knock-out barrier"}'
review:
- 'Which product control system flags back-to-back trades and listed or centrally clearable instruments at the bank.'
