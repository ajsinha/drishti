notes:
- 'JSON Lines, one record per line (UTF-8, gzip). Example line: {"SENSITIVITY_ID":"SENS-POS-BOOK-RATES-1~MX-20000002-B-SENS-2026-09-30-01","GRAIN":"POSITION","POSITION_ID":"POS-BOOK-RATES-1~MX-20000002","SOURCE_SYSTEM":"MUREX","BUSINESS_DATE":"2026-09-30","BATCH_ID":"B-SENS-2026-09-30-01","RUN_KIND":"FULL","COMPUTED_AT":"2026-09-30T06:10:00Z","RESTATEMENT":0,"STATUS":"ok","LEGAL_ENTITY":"LE-NY","DIVISION":"DIV-MARKETS","DESK":"DESK-RATES","TT_BOOK":"BOOK-RATES-1","PRODUCT_GROUP":"Rates","PRODUCT_TYPE":"IRS_FIXFLOAT","TRADE_STATUS":"NEW","MATURITY_DATE":"2031-04-15","CURRENCY":"EUR","SENSITIVITIES":[{"RISK_FACTOR":"IR/CURVE/EUR/ESTR/5Y","MEASURE":"DV01","VALUE":-19565.62,"CURRENCY":"USD"}]}'
- 'Refusals, each counted per source: a factor name not in the dictionary or not mapped (the element); VALUE null, NaN or infinite
  (the element); a currency without FX on the date (the element); the same factor and measure twice (the record); a second full run of
  a source on a date (the run). Warnings: a curvature without SHOCK_SIZE or with a shock other than the bucket''s; a position with
  vectors and no sensitivities, or the reverse (completeness, by desk); a bucket that differs from the dictionary''s.'
- 'Decided (2026-11-01, decision 3): rates vega in lognormal volatility points by default; a source sending normal volatility declares
  VOL_CONVENTION NORMAL on its records (VEGA per basis point of normal volatility, IMPLIED_VOL in basis points) and is converted on load:
  the vega risk sensitivity is VEGA × IMPLIED_VOL.'
- 'Decided (2026-11-01 and 2026-11-02, decisions 2 and 7): curvature is revalued (CURVATURE_UP and CURVATURE_DOWN) where the source can;
  a source that cannot sends GAMMA and the curvature Drishti derives is an estimate, an analysis figure until the supervisor accepts it.'
- 'Conventions turned into the regulatory sensitivities by Drishti (docs/architecture/SENSITIVITIES_AND_FRTB_SA.md section 2.3): FRTB
  s_k = DV01 × 10,000 (MAR21.8''s per-unit definition), s_k = DELTA × 100, the vega risk sensitivity VEGA × 100 × IMPLIED_VOL; SIMM takes
  DV01 and CS01 per basis point and DELTA per one per cent as delivered.'
review:
- 'The due time of the full run and of intraday batches at the bank.'
