  fields:
  - SENSITIVITY_ID
  - GRAIN
  - SOURCE_SYSTEM
  - BUSINESS_DATE
  - BATCH_ID
  - RUN_KIND
  - COMPUTED_AT
  - RESTATEMENT
  - STATUS
  - LEGAL_ENTITY
  - DIVISION
  - DESK
  - TT_BOOK
  - PRODUCT_GROUP
  - PRODUCT_TYPE
  - TRADE_STATUS
  - MATURITY_DATE
  - CURRENCY
  - SENSITIVITIES
- rule: unique
  key:
  - SENSITIVITY_ID
  per: BUSINESS_DATE
- rule: pattern
  field: SENSITIVITY_ID
  pattern: ^SENS-
- rule: enum
  field: GRAIN
  values:
  - POSITION
  - TRADE
- rule: link
  field: POSITION_ID
  kind: position
- rule: link
  field: TRADE_ID
  kind: trade
- rule: link
  field: TRADE_IDS
  kind: trade
- rule: enum
  field: RUN_KIND
  values:
  - FULL
  - INTRADAY
- rule: enum
