# Data contract of the trade-valuation kind (command TVAL): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap trade-valuation`; owned by people from then on: confirm the review points, then remove them.
kind: trade-valuation
mnemonic: TVAL
pack: market-risk
version: '1.0'
class: fundamental
status: active
title: Trade valuation
description: 'A trade''s valuation from the risk engine, for every source system: MTM, one-day P&L and DV01, with what it values (source system,
  portfolio, desk, product).'
source: risk-engine
grain: One row per trade valuation per business date, keyed by VALUATION_ID.
key:
- VALUATION_ID
id-pattern:
- ^TVAL-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/trade-valuation/
  columns:
  - VALUATION_ID
  - TRADE_ID
  - SOURCE_SYSTEM
  - PRODUCT_TYPE
  - PRODUCT_GROUP
  - PORTFOLIO
  - DESK
  - COUNTERPARTY
  - NETTING_SET
  - TRADER_ID
  - BUY_SELL_CODE
  - TRADE_STATUS
  - CURRENCY
  - NOTIONAL
  - MTM
  - MTM_CURRENCY
  - PNL_1D
  - DV01
  - TRADE_DATE
  - MATURITY_DATE
  - VALUATION_DATE
  test-data:
  - data/testdata/market-risk/trade-valuation
fields:
- name: VALUATION_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: TVAL-1000001
  pattern: ^TVAL-
- name: TRADE_ID
  type: id
  presence: required
  description: 'The trade valued: a TRADE_ID of the trading pack''s trade kind, as text (ENDUR digits, CLY-…, MX-…).'
  example: '1000001'
  link: trade
- name: SOURCE_SYSTEM
  type: text
  presence: required
  description: 'The trade''s booking system: ENDUR, CALYPSO or MUREX.'
  example: ENDUR
  enum:
  - CALYPSO
  - ENDUR
  - MUREX
- name: PRODUCT_TYPE
  type: text
  presence: required
  description: The trade's product type as booked (ComSwap, IRS_FIXFLOAT …), the trade's PRODUCT_TYPE.
  example: ComSwap
- name: PRODUCT_GROUP
  type: text
  presence: required
  description: The trade's product group (Commodity, Rates, FX, Credit, Equity …).
  example: Commodity
- name: PORTFOLIO
  type: id
  presence: required
  description: 'The book the trade sits in: a BOOK_ID of the core pack''s book kind (BOOK-…).'
  example: BOOK-COMM-2
  pattern: ^BOOK-
  link: book
- name: DESK
  type: id
  presence: required
  description: 'The desk of the trade''s book: a DESK_ID of the core pack''s desk kind (DESK-…).'
  example: DESK-COMM
  pattern: ^DESK-
  link: desk
- name: COUNTERPARTY
  type: id
  presence: required
  description: 'The trade''s counterparty: a COUNTERPARTY_ID of the core pack''s counterparty kind (CP-…).'
  example: CP-HARBORPT
  pattern: ^CP-
  link: counterparty
- name: NETTING_SET
  type: id
  presence: optional
  description: 'The netting set the trade belongs to: a NETTING_SET_ID of the counterparty-risk pack''s netting-set kind (NS-<counterparty>-<legal entity>).'
  example: NS-BRAMBLE-LDN
  pattern: ^NS-
  link: netting-set
- name: TRADER_ID
  type: id
  presence: required
  description: 'The trader of the trade: a TRADER_ID of the core pack''s trader kind (TRDR-…).'
  example: TRDR-FROSSI
  pattern: ^TRDR-
  link: trader
- name: BUY_SELL_CODE
  type: text
  presence: required
  description: 'B when the bank bought (or receives), S when it sold.'
  example: S
  enum:
  - B
  - S
- name: TRADE_STATUS
  type: text
  presence: required
  description: 'The trade''s status on the valuation date: NEW, VALIDATED, AMENDED, MATURED or CANCELLED; a trade that ends keeps a row on that date with its last value.'
  example: VALIDATED
  enum:
  - AMENDED
  - CANCELLED
  - MATURED
  - NEW
  - VALIDATED
- name: CURRENCY
  type: text
  presence: required
  description: The trade's own currency, ISO 4217 (MTM is in USD whatever it is).
  example: USD
  enum:
  - AUD
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- name: NOTIONAL
  type: amount
  presence: required
  unit: USD
  description: The trade's current notional in USD, absolute (the first leg's).
  example: 167969743.2
- name: MTM
  type: amount
  presence: required
  unit: USD
  description: The trade's mark-to-market on the valuation date in USD, dirty (accrued included); positive is an asset of the bank.
  example: 4121280
- name: MTM_CURRENCY
  type: text
  presence: required
  description: 'The currency MTM, PNL_1D and DV01 are reported in (USD in the demo).'
  example: USD
- name: PNL_1D
  type: amount
  presence: required
  unit: USD
  description: The valuation engine's own one-day P&L of the trade in USD, gain positive.
  example: -277804
- name: DV01
  type: amount
  presence: required
  unit: USD per basis point
  description: The change of MTM in USD for a +1 bp parallel shift of every rate curve (a receiver swap's is positive); 0 when the trade has no rate risk.
  example: 0
- name: TRADE_DATE
  type: date
  presence: required
  description: 'The date the trade was dealt (YYYY-MM-DD).'
  example: '2025-06-20'
- name: MATURITY_DATE
  type: date
  presence: required
  description: The trade's maturity date.
  example: '2028-07-31'
- name: VALUATION_DATE
  type: date
  presence: required
  description: 'The date the trade is valued on: the business date of the file.'
  example: '2026-09-30'
links:
- field: TRADE_ID
  kind: trade
- field: PORTFOLIO
  kind: book
- field: DESK
  kind: desk
- field: COUNTERPARTY
  kind: counterparty
- field: NETTING_SET
  kind: netting-set
- field: TRADER_ID
  kind: trader
validation:
- rule: required
  fields:
  - VALUATION_ID
  - TRADE_ID
  - SOURCE_SYSTEM
  - PRODUCT_TYPE
  - PRODUCT_GROUP
  - PORTFOLIO
  - DESK
  - COUNTERPARTY
  - TRADER_ID
  - BUY_SELL_CODE
  - TRADE_STATUS
  - CURRENCY
  - NOTIONAL
  - MTM
  - MTM_CURRENCY
  - PNL_1D
  - DV01
  - TRADE_DATE
  - MATURITY_DATE
  - VALUATION_DATE
- rule: unique
  key:
  - VALUATION_ID
  per: business_date
- rule: pattern
  field: VALUATION_ID
  pattern: ^TVAL-
- rule: link
  field: TRADE_ID
  kind: trade
- rule: enum
  field: SOURCE_SYSTEM
  values:
  - CALYPSO
  - ENDUR
  - MUREX
- rule: link
  field: PORTFOLIO
  kind: book
- rule: link
  field: DESK
  kind: desk
- rule: link
  field: COUNTERPARTY
  kind: counterparty
- rule: link
  field: NETTING_SET
  kind: netting-set
- rule: link
  field: TRADER_ID
  kind: trader
- rule: enum
  field: BUY_SELL_CODE
  values:
  - B
  - S
- rule: enum
  field: TRADE_STATUS
  values:
  - AMENDED
  - CANCELLED
  - MATURED
  - NEW
  - VALIDATED
- rule: enum
  field: CURRENCY
  values:
  - AUD
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'The boundary (IMPLEMENTATION_PLAN.md): a trade''s MtM stays an input from the upstream engines; what TVAL computes is the valuation totals
  over any scope, so no field of this per-trade record is marked derived.'
review:
- 'required inferred from 100% coverage in 2765 documents (765 samples and 2000 test-data documents (data/testdata/market-risk/trade-valuation/snapshot-2026-07-08.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source ''risk-engine'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: SOURCE_SYSTEM, BUY_SELL_CODE, TRADE_STATUS, CURRENCY: confirm they are closed lists.'
- 'number types decided by the field''s name: NOTIONAL amount, MTM amount, PNL_1D amount, DV01 amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts NOTIONAL, MTM, PNL_1D, DV01 (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
