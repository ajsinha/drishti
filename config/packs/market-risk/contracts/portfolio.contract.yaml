# Data contract of the portfolio kind (command PORT): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap portfolio`; owned by people from then on: confirm the review points, then remove them.
kind: portfolio
mnemonic: PORT
pack: market-risk
version: '1.0'
class: input
status: active
title: Portfolio
description: 'A portfolio in terms of the positions inside it: longs and shorts, market value, VaR, ES and each position''s contribution.'
source: Synthetic sample data (tools/packgen/banking)
grain: One row per portfolio per BUSINESS_DATE, keyed by PORTFOLIO_ID.
key:
- PORTFOLIO_ID
id-pattern:
- ^PF-
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/portfolio/
  columns:
  - PORTFOLIO_ID
  - NAME
  - TYPE
  - OWNER
  - LIMIT_VAR
  test-data:
  - data/testdata/market-risk/portfolio
fields:
- name: PORTFOLIO_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: PF-ASHA-UNWIND
  pattern: ^PF-
  link: portfolio
- name: NAME
  type: text
  presence: required
  description: 'The portfolio''s display name.'
  example: Unwind candidates (Asha)
- name: OWNER
  type: text
  presence: required
  description: Who keeps the portfolio's definition.
  example: asha
- name: TYPE
  type: text
  presence: required
  description: 'HIERARCHY: a node of the bank''s hierarchy (a desk, a legal entity, a book). RULE: every position whose columns meet a condition.
    BASKET: positions and trades someone picked.'
  example: BASKET
  enum:
  - BASKET
  - HIERARCHY
  - RULE
- name: DEFINITION
  type: record
  presence: required
  description: 'What the portfolio holds, one object whose shape follows TYPE: a BASKET lists MEMBERS (POSITION_ID or TRADE_ID each), a HIERARCHY names a NODE (a NODE_ID such as MGMT~BOOK-COMM-1), a RULE gives a RULE expression over the trades'' columns (CURRENCY == ''EUR'').'
- name: ROLLS_UP_TO
  type: record
  presence: required
  description: 'The hierarchy node the portfolio reports under, one object: KIND (bank, division, legal-entity, desk, book) and ID (BANK, DIV-…, LE-…, DESK-…, BOOK-…).'
- name: LIMIT_VAR
  type: amount
  presence: required
  unit: USD
  description: The VaR the portfolio may take.
  example: 1800000
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business the definition belongs to (YYYY-MM-DD).'
  example: '2026-09-30'
- name: VALID_FROM
  type: date
  presence: required
  description: The first business date the portfolio's definition applies to; an earlier date uses the definition then in force.
  example: '2026-01-02'
- name: VALID_TO
  type: unknown
  presence: optional
  description: 'The last date the definition is valid (YYYY-MM-DD); null while it is open-ended. Informational.'
nested:
  DEFINITION:
  - name: MEMBERS
    type: record list
    presence: optional
    description: 'For a BASKET portfolio: the positions and trades someone picked (a trade brings that part of its position).'
  - name: NODE
    type: text
    presence: optional
    description: 'For a HIERARCHY portfolio: the node of the bank''s hierarchy whose positions it holds (every book under it).'
    example: MGMT~DESK-RATES
  - name: RULE
    type: text
    presence: optional
    description: 'For a RULE portfolio: the condition a position''s columns must meet to be in it, checked on each business date.'
    example: PRODUCT_GROUP in ('Rates', 'Fixed income', 'Money market') …
  DEFINITION.MEMBERS[]:
  - name: POSITION_ID
    type: id
    presence: optional
    description: 'A position in a BASKET: a position id as Drishti derives it (POS-<book>~<trade or security>); give it or TRADE_ID.'
    example: POS-BOOK-RATES-1~MX-20000002
    pattern: ^POS-
    link: position
  - name: TRADE_ID
    type: id
    presence: optional
    description: 'A trade in a BASKET: a TRADE_ID of the trading pack''s trade kind, as text; it brings its part of its position.'
    example: CLY-3000087
    link: trade
  ROLLS_UP_TO:
  - name: KIND
    type: text
    presence: required
    description: 'The kind of the node the portfolio reports under (bank, division, desk, legal-entity, book).'
    example: division
  - name: ID
    type: id
    presence: required
    description: The desk or book the portfolio reports under.
    example: DIV-MARKETS
links:
- field: PORTFOLIO_ID
  kind: portfolio
- field: DEFINITION.MEMBERS[].POSITION_ID
  kind: position
- field: DEFINITION.MEMBERS[].TRADE_ID
  kind: trade
validation:
- rule: required
  fields:
  - PORTFOLIO_ID
  - NAME
  - OWNER
  - TYPE
  - DEFINITION
  - ROLLS_UP_TO
  - LIMIT_VAR
  - BUSINESS_DATE
  - VALID_FROM
- rule: unique
  key:
  - PORTFOLIO_ID
  per: BUSINESS_DATE
- rule: pattern
  field: PORTFOLIO_ID
  pattern: ^PF-
- rule: link
  field: PORTFOLIO_ID
  kind: portfolio
- rule: enum
  field: TYPE
  values:
  - BASKET
  - HIERARCHY
  - RULE
- rule: link
  field: DEFINITION.MEMBERS[].POSITION_ID
  kind: position
- rule: link
  field: DEFINITION.MEMBERS[].TRADE_ID
  kind: trade
notes:
- The portfolio definitions are an engine input (IMPLEMENTATION_PLAN.md); the figures of the retired stored record (VaR, ES, positions, contributions,
  P&L) are computed as the page opens (VAR_ENGINE), never stored.
review:
- 'required inferred from 100% coverage in 31 documents (3 samples and 28 test-data documents (data/testdata/market-risk/portfolio/cob-2026-09-30.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: TYPE: confirm they are closed lists.'
