# Data contract of the risk-hierarchy kind (command HIER): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap risk-hierarchy`; owned by people from then on: confirm the review points, then remove them.
kind: risk-hierarchy
mnemonic: HIER
pack: market-risk
version: '1.0'
class: input
status: active
title: Risk hierarchy node
description: 'One node of a VaR hierarchy (MGMT or LEGAL): its level, parent, children, the books under it and its VaR limit.'
source: Synthetic sample data (tools/packgen/banking)
grain: One row per risk hierarchy node per BUSINESS_DATE, keyed by NODE_ID.
key:
- NODE_ID
id-pattern:
- ^(MGMT|LEGAL)~
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: risk-store
  plugin: delta
  domain: risk
  table: <root>/risk/risk-hierarchy/
  columns:
  - NODE_ID
  - HIERARCHY
  - LEVEL
  - PARENT_ID
  - NAME
  - LIMIT_VAR
  test-data:
  - data/testdata/market-risk/risk-hierarchy
fields:
- name: NODE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: LEGAL~LE-NY
  pattern: ^[A-Z][A-Z0-9_]*~
  link: risk-hierarchy
- name: HIERARCHY
  type: text
  presence: required
  description: 'The hierarchy''s id (2.9.5: any name, A-Z, digits, _). The demo''s: MGMT (bank, division, desk, book) and LEGAL (bank,
    legal entity, desk, book); a book is in one leaf of each. A hierarchy may instead be built from the trades'' columns (VAR_GUIDE.md section
    16): its rows here are then not read.'
  example: LEGAL
  pattern: ^[A-Z][A-Z0-9_]*$
- name: LEVEL
  type: text
  presence: required
  description: 'The node''s level, a name of the hierarchy''s own (2.9.5): bank, division, legal-entity, desk or book in the demo.'
  example: legal-entity
- name: PARENT_ID
  type: id
  presence: optional
  description: 'The parent node''s NODE_ID (null at the root); the engine builds the tree from it.'
  example: LEGAL~BANK
- name: NAME
  type: text
  presence: required
  description: 'The node''s display name.'
  example: LE-NY
- name: REF
  type: record
  presence: optional
  description: 'The master record the node stands for, one object: KIND (legal-entity, desk, book) and ID (LE-…, DESK-…, BOOK-…); null for the bank and division nodes.'
- name: CHILDREN
  type: text list
  presence: required
  description: 'The child nodes'' ids; informational, the engine uses PARENT_ID.'
- name: BOOKS
  type: text list
  presence: required
  description: 'Every book beneath the node: its positions are the node''s.'
- name: LIMIT_VAR
  type: amount
  presence: required
  unit: USD
  description: The 1-day 99% VaR the node may take.
  example: 8500000
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The close of business the node belongs to (YYYY-MM-DD): a past date''s VaR uses that date''s hierarchy.'
  example: '2026-09-30'
- name: VALID_FROM
  type: date
  presence: required
  description: 'The first date the node is valid (YYYY-MM-DD). Informational.'
  example: '2026-01-02'
- name: VALID_TO
  type: unknown
  presence: optional
  description: 'The last date the node is valid (YYYY-MM-DD); null while it is open-ended. Informational.'
nested:
  REF:
  - name: KIND
    type: text
    presence: required
    description: 'The kind of master record the node is (legal-entity, desk, book).'
    example: legal-entity
    enum:
    - book
    - desk
    - legal-entity
  - name: ID
    type: id
    presence: required
    description: 'The id of the master record the node is (a legal entity, desk or book id).'
    example: LE-NY
links:
- field: NODE_ID
  kind: risk-hierarchy
validation:
- rule: required
  fields:
  - NODE_ID
  - HIERARCHY
  - LEVEL
  - NAME
  - CHILDREN
  - BOOKS
  - LIMIT_VAR
  - BUSINESS_DATE
  - VALID_FROM
- rule: unique
  key:
  - NODE_ID
  per: BUSINESS_DATE
- rule: pattern
  field: NODE_ID
  pattern: ^[A-Z][A-Z0-9_]*~
- rule: link
  field: NODE_ID
  kind: risk-hierarchy
- rule: enum
  field: REF.KIND
  values:
  - book
  - desk
  - legal-entity
notes: []
review:
- 'required inferred from 100% coverage in 90 documents (2 samples and 88 test-data documents (data/testdata/market-risk/risk-hierarchy/cob-2026-09-30.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'source is the pack''s first listed source (its README): confirm.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: REF.KIND: confirm it is a closed list (HIERARCHY and LEVEL are open since 2.9.5).'
