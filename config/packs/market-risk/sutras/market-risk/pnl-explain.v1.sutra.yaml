# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: pnl-explain
version: 1
description: "Daily P&L attributed to risk factors, new trades and residual."
doc:
  summary: "Daily P&L attributed to risk factors, new trades and residual."
  description: >-
    Daily P&L attributed to risk factors, new trades and residual. One page per p&L explain, its panels: attribution; P&L
    waterfall (risk factors to actual, USD); how the view was built; the entities it links to. The strip gives Date, Actual,
    Explained and Unexplained. Linked entities: book (book).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/pnl-explain/PNL-COMM-1"
    - "PNL PNL-COMM-1"
  since: "2.7.0"
match: { kind: pnl-explain, priority: 10 }
title: { pill: "Market risk · P&L explain", id: $.RESULT_ID }
strip:
  - { label: Date, bind: $.DATE, fmt: date }
  - { label: Actual, bind: $.ACTUAL, fmt: signed0, tone: sign, emphasis: true }
  - { label: Explained, bind: $.EXPLAINED, fmt: signed0, tone: sign }
  - { label: Unexplained, bind: $.UNEXPLAINED, fmt: signed0, tone: sign }
panels:
  - { use: ranked-bars@1, with: { id: attribution, title: Attribution, key: F2, rows: $.ATTRIBUTION, label: FACTOR, value: PNL, tone: sign } }
  - id: explain
    kind: waterfall
    title: "P&L waterfall (risk factors to actual, USD)"
    code: PNLX
    key: F3
    rows: $.EXPLAIN_STEPS
    label: STEP
    value: PNL
    fmt: signed0
    sum: Actual
    unit: USD
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.BOOK, 'book')", F8: impact, F9: raw }
