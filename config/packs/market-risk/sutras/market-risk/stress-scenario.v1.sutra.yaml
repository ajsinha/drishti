# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: stress-scenario
version: 1
description: A named historical or hypothetical shock set.
doc:
  summary: "A named historical or hypothetical shock set."
  description: >-
    A named historical or hypothetical shock set. One page per stress scenario, its panels: shocks; bank P&L under this scenario
    (the desks' results added); desks under this scenario; how the view was built. The strip gives Name, Type and Severity.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/stress-scenario/SCN-COVID2020"
    - "SCN SCN-COVID2020"
  since: "2.7.0"
match: { kind: stress-scenario, priority: 10 }
title: { pill: Market risk · Stress scenario, id: $.SCENARIO_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Type, bind: $.TYPE }
  - { label: Severity, bind: $.SEVERITY, emphasis: true }
panels:
  - id: shocks
    kind: table
    title: Shocks
    key: F2
    rows: $.SHOCKS
    columns:
      - { label: Risk factor, bind: "@.FACTOR" }
      - { label: Shock, bind: "@.SHOCK" }
  - id: bank
    kind: kv
    title: "Bank P&L under this scenario (the desks' results added)"
    code: BANK
    key: F3
    area: right
    source: { kind: stress-scenario-pnl, id: $.SCENARIO_ID }
    columns:
      - { label: "P&L (all desks)", bind: $src.PNL, fmt: signed0, tone: sign }
      - { label: Desks, bind: $src.DESK_COUNT, fmt: amount0 }
      - { label: "Worst desk P&L", bind: $src.WORST_DESK_PNL, fmt: signed0, tone: sign }
      - { label: Desks in breach, bind: $src.BREACHES, fmt: amount0 }
      - { label: Worst limit use, bind: $src.WORST_LIMIT_USE, fmt: pct0 }
  - id: desks
    kind: table
    title: Desks under this scenario
    rows: $src.DESKS
    source: { kind: stress-scenario-pnl, id: $.SCENARIO_ID }
    columns:
      - { label: Result, bind: "@.RESULT_ID" }
      - { label: Desk, bind: "@.DESK" }
      - { label: "P&L", bind: "@.PNL", fmt: signed0, tone: sign, total: true }
      - { label: Limit, bind: "@.LIMIT", fmt: compact }
      - { label: Limit use, bind: "@.LIMIT_USE", fmt: pct0 }
      - { label: Status, bind: "@.STATUS", tone: status }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
