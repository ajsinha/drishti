# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: trade-valuation
version: 1
description: "A trade's valuation from the risk engine, for every source system: MTM, one-day P&L and DV01, with what it values (source system, portfolio, desk, product)."
doc:
  summary: "A trade's valuation from the risk engine, for every source system:"
  description: >-
    A trade's valuation from the risk engine, for every source system: MTM, one-day P&L and DV01, with what it values (source
    system, portfolio, desk, product). One page per trade valuation, its panels: valuation; how the view was built; the entities
    it links to. The strip gives Trade, Source, MTM, P&L 1D, DV01, Notional and Valued. Linked entities: trade (trade), desk
    (desk) and netting set (netting-set).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/trade-valuation/TVAL-1000001"
    - "TVAL TVAL-1000001"
  since: "2.7.0"
match: { kind: trade-valuation, priority: 10 }
title: { pill: Market risk · Trade valuation, id: $.VALUATION_ID }
strip:
  - { label: Trade, bind: "link($.TRADE_ID, 'trade')" }
  - { label: Source, bind: $.SOURCE_SYSTEM }
  - { label: MTM, bind: $.MTM, fmt: signed0, tone: sign, emphasis: true }
  - { label: "P&L 1D", bind: $.PNL_1D, fmt: signed0, tone: sign }
  - { label: DV01, bind: $.DV01, fmt: signed0, tone: sign }
  - { label: Notional, bind: $.NOTIONAL, fmt: compact }
  - { label: Valued, bind: $.VALUATION_DATE, fmt: date }
panels:
  - id: valuation
    kind: kv
    title: Valuation
    key: F2
    columns:
      - { label: Trade, bind: "link($.TRADE_ID, 'trade')" }
      - { label: Source system, bind: $.SOURCE_SYSTEM }
      - { label: Product, bind: $.PRODUCT_TYPE }
      - { label: Group, bind: $.PRODUCT_GROUP }
      - { label: Portfolio, bind: "link($.PORTFOLIO, 'book')" }
      - { label: Desk, bind: "link($.DESK, 'desk')" }
      - { label: Counterparty, bind: "link($.COUNTERPARTY, 'counterparty')" }
      - { label: Currency, bind: $.CURRENCY }
      - { label: Notional, bind: $.NOTIONAL, fmt: amount0 }
      - { label: MTM (USD), bind: $.MTM, fmt: signed0, tone: sign }
      - { label: "P&L 1D (USD)", bind: $.PNL_1D, fmt: signed0, tone: sign }
      - { label: DV01 (USD), bind: $.DV01, fmt: signed0, tone: sign }
      - { label: Status, bind: $.TRADE_STATUS, tone: status }
      - { label: Maturity, bind: $.MATURITY_DATE, fmt: date }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.TRADE_ID, 'trade')", F8: impact, F9: raw }
