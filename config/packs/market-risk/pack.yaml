# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Market risk pack for Drishti.
pack: market-risk
version: 1.0.0
code: MRSK
title: Market risk
description: Value at risk, stress testing, FRTB sensitivities and P&L explain.
extends:
- market-data
- trading
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
- trade-valuation
sutras: sutras
formats: config/formats.yaml
mnemonics:
  VAR:
    kind: var
    label: VaR / expected shortfall
  SCN:
    kind: stress-scenario
    label: Stress scenario
  STR:
    kind: stress-result
    label: Stress result
  FRTB:
    kind: frtb-sensitivity
    label: FRTB sensitivities
  PNL:
    kind: pnl-explain
    label: P&L explain
  TVAL:
    kind: trade-valuation
    label: Trade valuation
graph:
  id-patterns:
  - pattern: ^VAR-
    kind: var
  - pattern: ^SCN-
    kind: stress-scenario
  - pattern: ^STR-
    kind: stress-result
  - pattern: ^FRTB-
    kind: frtb-sensitivity
  - pattern: ^PNL-
    kind: pnl-explain
  - pattern: ^TVAL-
    kind: trade-valuation
  fields:
    SCENARIO:
      kind: stress-scenario
      label: Scenario
    VAR_RESULT:
      kind: var
      label: VaR
  badges:
    var: fmt($.VAR_99, 'compact')
  impact:
    measures:
      trade-valuation: $.MTM
    formats:
      trade-valuation: signed0
connectors:
  risk-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - var
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: risk
      layout:
        trade-valuation:
          columns:
          - VALUATION_ID
          - TRADE_ID
          - SOURCE_SYSTEM
          - PRODUCT_TYPE
          - PRODUCT_GROUP
          - PORTFOLIO
          - DESK
          - COUNTERPARTY
          - NETTING_SET
          - TRADER_ID
          - BUY_SELL_CODE
          - TRADE_STATUS
          - CURRENCY
          - NOTIONAL
          - MTM
          - MTM_CURRENCY
          - PNL_1D
          - DV01
          - TRADE_DATE
          - MATURITY_DATE
          - VALUATION_DATE
          sort-by: id
          file-rows: 250000
          row-group-rows: 1000
routes:
  var: risk-store
  stress-scenario: risk-store
  stress-result: risk-store
  frtb-sensitivity: risk-store
  pnl-explain: risk-store
  trade-valuation: risk-store
form:
  var:
  - path: RESULT_ID
    label: Result id
    type: id
  - path: VAR_99
    label: VaR 99
    type: text
  - path: ES_975
    label: ES 975
    type: text
  - path: SVAR
    label: Svar
    type: text
  - path: LIMIT
    label: Limit
    type: amount
  - path: EXCEPTIONS
    label: Exceptions
    type: text
  stress-scenario:
  - path: SCENARIO_ID
    label: Scenario id
    type: id
  - path: NAME
    label: Name
    type: text
  - path: TYPE
    label: Type
    type: enum
  - path: SEVERITY
    label: Severity
    type: enum
  stress-result:
  - path: RESULT_ID
    label: Result id
    type: id
  - path: SCENARIO_NAME
    label: Scenario name
    type: text
  - path: PNL
    label: P&L
    type: amount
  - path: LIMIT
    label: Limit
    type: amount
  frtb-sensitivity:
  - path: RESULT_ID
    label: Result id
    type: id
  - path: BOOK
    label: Book
    type: enum
  - path: DELTA_CHARGE
    label: Delta charge
    type: text
  - path: VEGA_CHARGE
    label: Vega charge
    type: text
  - path: CURVATURE_CHARGE
    label: Curvature charge
    type: text
  - path: TOTAL
    label: Total
    type: text
  pnl-explain:
  - path: RESULT_ID
    label: Result id
    type: id
  - path: DATE
    label: Date
    type: date
  - path: ACTUAL
    label: Actual
    type: text
  - path: EXPLAINED
    label: Explained
    type: text
  - path: UNEXPLAINED
    label: Unexplained
    type: text
  trade-valuation:
  - path: VALUATION_ID
    label: Valuation id
    type: id
  - path: TRADE_ID
    label: Trade id
    type: id
  - path: SOURCE_SYSTEM
    label: Source system
    type: text
  - path: MTM
    label: MTM
    type: amount
  - path: PNL_1D
    label: P&L 1d
    type: amount
  - path: DV01
    label: DV01
    type: amount
  - path: NOTIONAL
    label: Notional
    type: amount
  - path: VALUATION_DATE
    label: Valuation date
    type: date
console:
  examples:
  - - VAR VAR-RATES
    - Rates desk VaR · P&L series, contributions
  - - STR STR-GFC2008-RATES
    - Stress · 2008 crisis on the rates desk
  - - PNL PNL-RATES-1
    - P&L explain
  - - FRTB FRTB-RATES-1
    - FRTB sensitivities and charges
  help: config/help.yaml
python:
  enabled: true
roles:
  market-risk:
    kinds:
    - '*'
    raw: true
    calc: true
