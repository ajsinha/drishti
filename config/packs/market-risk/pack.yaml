          - MTM
          - MTM_CURRENCY
          - PNL_1D
          - DV01
          - TRADE_DATE
          - MATURITY_DATE
          - VALUATION_DATE
          sort-by: id
          file-rows: 250000
          row-group-rows: 1000
        pnl-vector:
          columns:
          - TRADE_ID
          - SECURITY_ID
          - INSTRUMENT
          - LEGAL_ENTITY
          - DIVISION
          - DESK
          - TT_BOOK
          - PORTFOLIO
          - STRATEGY
          - PRODUCT_GROUP
          - PRODUCT_TYPE
          - CURRENCY
          - COUNTERPARTY
          - DIRECTION
          - QUANTITY
          - PV
          - TAGS
          - TRADE_STATUS
          - MATURITY_DATE
          - STATUS
          - REPORTING_CCY
          - SCENARIO_SET_ID
          - BATCH_ID
          vectors:
          - PNL
        risk-hierarchy:
          columns:
          - NODE_ID
          - HIERARCHY
          - LEVEL
          - PARENT_ID
          - NAME
          - LIMIT_VAR
        portfolio:
          columns:
          - PORTFOLIO_ID
          - NAME
          - TYPE
          - OWNER
          - LIMIT_VAR
  var-results:
    plugin: delta
    enabled: ${DRISHTI_VAR_ENABLED:true}
    description: 'The official end-of-day VaR results the server publishes (risk-results/var-official), read only: for BI and other readers, never
      an engine''s input'
    kinds:
    - var-official
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: risk-results
      layout:
        var-official:
          columns:
          - HIERARCHY
          - NODE_ID
          - NODE_NAME
          - PARENT_ID
          - LEVEL
          - CAPTURE_ID
          - RESULT_VERSION
          - VAR
          - ES
          - LIMIT
          - LIMIT_USE
          - DIVERSIFICATION
          - HYPO_PNL
          - EXCEPTIONS_250
          - TRAFFIC_LIGHT
  var-positions:
    plugin: var-positions
    enabled: ${DRISHTI_VAR_ENABLED:true}
    kinds:
    - position
  var-engine:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_VAR_ENABLED:true}
    description: 'The VaR of any scope, computed when asked by the server''s VaR engine (the additive aggregation over the hot store), as the
      viewer: VRES <scope> <GO>'
    kinds:
      var-result:
        compute: var-result
        result:
          required:
          - VAR
          - ES
          - PNL
          types:
            VAR: number
            ES: number
    engine:
      type: java
      class: com.ash.drishti.server.var.VarResultEngine
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - pnl-vector
      - risk-hierarchy
      - scenario-set
      - portfolio
      affects: all
    coalesce:
      quiet: 250ms
      max-wait: 2s
    cache:
      results: 2000
      ttl: 1h
    limits:
      timeout: 60s
      wait: 5s
      max-inflight-per-user: 4
  var-whatif:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_VAR_ENABLED:true}
    description: 'A scope''s VaR before and after hypothetical trades (a private sandbox) and its stressed window, computed by the Python VaR
      engine in the compute pool var from the scope''s var-result: VWIF <scope> <GO>'
    kinds:
      var-whatif:
        compute: var-whatif
        params:
          sandbox:
            type: sandbox-ref
          stress-window:
            type: int
            default: 250
            min: 0
            max: 5000
          component-window:
            type: int
            default: 5
            min: 1
            max: 51
        result:
          required:
          - BEFORE_VAR
          - AFTER_VAR
          types:
            BEFORE_VAR: number
            AFTER_VAR: number
    reads:
    - kind: var-result
      as: base
      id: '{id}'
    engine:
      type: python
      entry: drishti_compute.var.whatif:VarWhatIfEngine
      pool: var
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - pnl-vector
      - risk-hierarchy
      - scenario-set
      - portfolio
      affects: all
    coalesce:
      quiet: 250ms
      max-wait: 2s
    cache:
      results: 500
      ttl: 1h
    limits:
      timeout: 60s
      wait: 250ms
      max-inflight-per-user: 2
