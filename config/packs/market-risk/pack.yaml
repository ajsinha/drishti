# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Market risk pack for Drishti.
pack: market-risk
version: 1.0.0
code: MRSK
title: Market risk
description: Value at risk, stress testing, FRTB sensitivities and P&L explain.
extends:
- market-data
- trading
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
- trade-valuation
sutras: sutras
formats: config/formats.yaml
mnemonics:
  VAR:
    kind: var
    label: VaR / expected shortfall
  SCN:
    kind: stress-scenario
    label: Stress scenario
  STR:
    kind: stress-result
    label: Stress result
  FRTB:
    kind: frtb-sensitivity
    label: FRTB sensitivities
  PNL:
    kind: pnl-explain
    label: P&L explain
  TVAL:
    kind: trade-valuation
    label: Trade valuation
graph:
  id-patterns:
  - pattern: ^VAR-
    kind: var
  - pattern: ^SCN-
    kind: stress-scenario
  - pattern: ^STR-
    kind: stress-result
  - pattern: ^FRTB-
    kind: frtb-sensitivity
  - pattern: ^PNL-
    kind: pnl-explain
  - pattern: ^TVAL-
    kind: trade-valuation
  fields:
    scenario:
      kind: stress-scenario
      label: Scenario
    varResult:
      kind: var
      label: VaR
  badges:
    var: fmt($.var99, 'compact')
  impact:
    measures:
      trade-valuation: $.MTM
    formats:
      trade-valuation: signed0
connectors:
  risk-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - var
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: risk
routes:
  var: risk-store
  stress-scenario: risk-store
  stress-result: risk-store
  frtb-sensitivity: risk-store
  pnl-explain: risk-store
  trade-valuation: risk-store
form:
  var:
  - path: resultId
    label: Result id
    type: id
  - path: var99
    label: Var99
    type: text
  - path: es975
    label: Es975
    type: text
  - path: svar
    label: Svar
    type: text
  - path: limit
    label: Limit
    type: amount
  - path: exceptions
    label: Exceptions
    type: text
  stress-scenario:
  - path: scenarioId
    label: Scenario id
    type: id
  - path: name
    label: Name
    type: text
  - path: type
    label: Type
    type: enum
  - path: severity
    label: Severity
    type: enum
  stress-result:
  - path: resultId
    label: Result id
    type: id
  - path: scenarioName
    label: Scenario name
    type: text
  - path: pnl
    label: Pnl
    type: amount
  - path: limit
    label: Limit
    type: amount
  frtb-sensitivity:
  - path: resultId
    label: Result id
    type: id
  - path: book
