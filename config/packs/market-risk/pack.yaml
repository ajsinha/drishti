connectors:
  risk-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    - portfolio
    - pnl-vector
    - scenario-pv
    - fx-scenario
    - scenario-set
    - risk-hierarchy
    - var-limit
    - desk-pnl
    - pnl-history
    - position-sensitivity
    - risk-factor
    settings:
      lake: demo
      lake-tables: risk.stress-scenario,risk.stress-result,risk.frtb-sensitivity,risk.pnl-explain,risk.trade-valuation,risk.portfolio,risk.pnl-vector,risk.scenario-pv,risk.fx-scenario,risk.scenario-set,risk.risk-hierarchy,risk.var-limit,risk.desk-pnl,risk.pnl-history,risk.position-sensitivity,risk.risk-factor
  mr-derived:
    plugin: derived
    enabled: ${DRISHTI_MR_DERIVED_ENABLED:true}
    description: 'The bank''s stress P&L per scenario: the desks'' stress results added, with each desk''s limit use and breaches, once per business
      date (until the stress engine computes it)'
    kinds:
    - stress-scenario-pnl
    settings:
      refresh: 60s
      stress-scenario-pnl:
        from: stress-result
        group-by: $.SCENARIO
        id-field: SCENARIO_ID
        members: RESULT_IDS
        max-members: 1000
        rows-field: DESKS
        fields:
          DESK_COUNT: count
          PNL: sum $.PNL
          WORST_DESK_PNL: min $.PNL
          SCENARIO_NAME: first $.SCENARIO_NAME
          LIMIT: sum $.LIMIT
        rows:
          RESULT_ID: $.RESULT_ID
          DESK: $.DESK
          PNL: $.PNL
          LIMIT: $.LIMIT
          LIMIT_USE: '$.LIMIT > 0 ? max(-$.PNL, 0) / $.LIMIT : null'
          STATUS: '$.LIMIT > 0 ? (max(-$.PNL, 0) / $.LIMIT > 1 ? ''BREACH'' : ''OK'') : null'
        then:
          BREACHES: size($.DESKS[?@.LIMIT_USE > 1])
          WORST_LIMIT_USE: max($.DESKS[*].LIMIT_USE)
          BY_DESK: group($.DESKS, 'DESK', 'PNL')
        sort:
          DESKS: PNL asc
          BY_DESK: value asc
  var-results:
    plugin: delta
    enabled: ${DRISHTI_VAR_ENABLED:true}
    description: 'The official end-of-day VaR results the server publishes (risk-results/var-official), read only: for BI and other readers, never
      an engine''s input'
    kinds:
    - var-official
    settings:
      lake: var-official
