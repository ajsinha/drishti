# History queries (TRD 1000015 30, docs/architecture/DATA_ARCHITECTURE.md › History queries: an entity over time, section 6): how this pack's kinds look over time.
# Only the shape: any dated kind has a history without an entry here.
history:
  trade-valuation:
    columns: [MTM, PNL_1D, DV01, NOTIONAL]
  pnl-explain:
    columns: [ACTUAL, EXPLAINED, UNEXPLAINED]
  # the VaR engine's kinds (VAR_GUIDE.md): a position (derived by Drishti) and a portfolio's definition over time; their VaR history is
  # the official end-of-day captures (VAR <scope> <GO>, History tab), never a stored column
  position:
    columns: [QUANTITY, MARKET_VALUE, TRADE_COUNT]

# How Drishti derives positions from the trades of a business date when it loads the date (docs/guides/VAR_GUIDE.md section 15.6): the
# VaR engine reads this section (else its drishti.var.positions setting). A trade counts when its TRADE_STATUS is live and it has not
# matured; the first rule whose groups (PRODUCT_GROUP) or types (PRODUCT_TYPE) hold it keys its position by the first of the rule's key
# fields the trade carries: POSITION_ID = POS-<TT_BOOK>~<key>, so a security's trades in one book are one fungible position. No key
# (or no rule): one position per trade, POS-<TT_BOOK>~<TRADE_ID> (OTC). tools/packgen/var/make_var_data.py reads it too.
positions:
  live-statuses: [NEW, VALIDATED, AMENDED]
  rules:
    - name: securities                  # bonds, notes, bills, shares and warrants: by book and security
      groups: [Fixed income]
      types: [EQ_CASH, WARRANT, CONVERTIBLE_BOND, INFL_LINKED_BOND, T_BILL, COMMERCIAL_PAPER, CERT_DEPOSIT]
      key: [SECURITY_ID, ISIN, TICKER]
    - name: listed                      # exchange-traded futures and options: by book and contract
      types: [BOND_FUTURE, STIR_FUTURE, STIR_FUT_OPT, EQ_FUTURE_SINGLE, EQ_INDEX_FUTURE, EQ_OPTION_LISTED, EQ_INDEX_OPTION, CMD_FUTURE,
              CMD_FUT_OPTION, ComFut, EMISSIONS_FUTURE]
      key: [SECURITY_ID, CONTRACT]
    - name: otc                         # everything else: one position per trade

# The hierarchies the VaR and exposure engines build (docs/guides/VAR_GUIDE.md section 16); drishti.var.hierarchies in the
# server's settings wins over this block. source: risk-hierarchy reads the risk-hierarchy rows (book-based: each node lists its books,
# with its name); source: columns (the default when levels are given) builds the nodes from the trades' own columns, every
# distinct path of values a node under one root (LL~BANK), its members the rows (a letter may hold part of a book). ids: path (default,
# LL~LL-0003/DESK-RATES) or leaf (LL~DESK-RATES, when each value has one parent). word: the scope word naming a node (LL:LL-0003).
# limits: the kind the nodes' VaR limits come from (var-limit, by hierarchy and node id; a node without one has no limit). Every VaR
# limit lives in var-limit, with its currency (decision 8 of docs/architecture/COMPUTED_ATTRIBUTES.md): the risk-hierarchy rows
# and the portfolios carry none (a portfolio's limit is the var-limit row of hierarchy PORTFOLIO and its id).
hierarchies:
  MGMT: { title: Management, source: risk-hierarchy, limits: var-limit }
  LEGAL: { title: Legal entities, source: risk-hierarchy, limits: var-limit }
  LL: { title: Limit letters, levels: "LIMIT_LETTER > DESK", word: LL, limits: var-limit }
