    label: Valuation date
    type: date
console:
  examples:
  - - VAR VAR-RATES
    - Rates desk VaR · P&L series, contributions
  - - STR STR-GFC2008-RATES
    - Stress · 2008 crisis on the rates desk
  - - PNL PNL-RATES-1
    - P&L explain
  - - FRTB FRTB-RATES-1
    - FRTB sensitivities and charges
  help: config/help.yaml
python:
