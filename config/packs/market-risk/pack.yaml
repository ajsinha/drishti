    type: enum
  - path: deltaCharge
    label: Delta charge
    type: text
  - path: vegaCharge
    label: Vega charge
    type: text
  - path: curvatureCharge
    label: Curvature charge
    type: text
  - path: total
    label: Total
    type: text
  pnl-explain:
  - path: resultId
    label: Result id
