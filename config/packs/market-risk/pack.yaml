connectors:
  risk-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    - portfolio
    - pnl-vector
    - scenario-set
    - risk-hierarchy
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: risk
      layout:
        trade-valuation:
          columns:
          - VALUATION_ID
          - TRADE_ID
          - SOURCE_SYSTEM
          - PRODUCT_TYPE
          - PRODUCT_GROUP
          - PORTFOLIO
