# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# About this page: what the pack's kinds mean.
about: 1
vocabulary:
  var99:
    term: "Value at risk, 99%, 1 day"
    means: "The loss the portfolio is expected not to exceed on 99 of 100 trading days, read from the 1st percentile of the revalued scenario P&L (historical simulation)."
    unit: "USD"
    sign: "A loss, written as a positive number."
  es975:
    term: "Expected shortfall, 97.5%"
    means: "The average loss on the worst 2.5% of scenario days. It looks into the tail that VaR ignores, and it is the measure the FRTB internal-models approach uses for capital."
    unit: "USD"
    sign: "A loss, written as a positive number."
  svar:
    term: "Stressed VaR"
    means: "VaR calculated with the same model but over a 12-month period of significant stress for the portfolio, instead of the recent past. It feeds the market-risk capital requirement (Basel 2.5)."
    unit: "USD"
    sign: "A loss, written as a positive number."
  pnl:
    term: "Profit and loss"
    means: "The change in value over the period of the result. In a stress result, the revaluation of the portfolio under the scenario."
    unit: "USD"
    sign: "Positive is a gain, negative a loss."
kinds:
  stress-scenario:
    title: Stress scenario
    about: >-
      ${$.NAME} is a ${lower($.TYPE)} stress scenario of ${lower($.SEVERITY)} severity: ${size($.SHOCKS)} risk factors are shocked
      together and the portfolio is revalued.
    guide: market-risk
    glossary:
      TYPE:
        term: "Scenario type"
        means: "A historical scenario replays the moves of a past episode; a hypothetical one is a designed set of moves that need not have happened."
        values:
          Historical: "Replays the market moves of a past episode."
          Hypothetical: "A designed set of moves chosen by risk managers."
      SEVERITY:
        term: "Severity"
        means: "The rating the risk function gives the scenario, which decides how it is used in limits and reporting."
        values:
          Severe: "An extreme but plausible market event."
          Moderate: "A material move in one or a few markets."
          Mild: "A small or narrow move."
      SHOCKS.FACTOR:
        term: "Risk factor"
        means: "The market variable the scenario moves, such as an equity index, a spread or a curve."
      SHOCKS.SHOCK:
        term: "Shock"
        means: "How far the factor moves. The unit follows the factor: a proportional change for prices and spreads, percentage points for interest rates, points for volatility."
        sign: "Positive raises the factor, negative lowers it."
    panels:
      shocks: { about: "These are the moves applied together; the stress results of ${$.NAME} revalue each desk's books under them." }
  stress-result:
    title: Stress result
    about: >-
      ${$.RESULT_ID}: under "${$.SCENARIO_NAME}" the portfolio changes in value by ${fmt($.PNL, 'compact')} USD against a limit of
      ${fmt($.LIMIT, 'compact')}.
    guide: market-risk
    glossary:
      SCENARIO_NAME:
        term: "Scenario"
        means: "The stress scenario the portfolio was revalued under."
      PNL: { use: "pnl" }
      LIMIT:
        term: "Stress loss limit"
        means: "The largest loss the desk accepts under this scenario. A P&L below the limit is a breach."
        unit: "USD"
        sign: "Negative, like the loss it caps."
      BY_BOOK.PNL:
        term: "P&L of the book"
        means: "The book's share of the scenario P&L."
        unit: "USD"
        sign: "Positive is a gain."
    panels:
      books: { about: "The books add up to the desk's stress P&L of ${fmt($.PNL, 'compact')} USD." }
  frtb-sensitivity:
    title: FRTB sensitivities-based charge
    about: >-
      ${$.RESULT_ID} is the FRTB standardised sensitivities-based method for ${$.BOOK}: delta ${fmt($.DELTA_CHARGE, 'compact')},
      vega ${fmt($.VEGA_CHARGE, 'compact')} and curvature ${fmt($.CURVATURE_CHARGE, 'compact')} add up to ${fmt($.TOTAL, 'compact')} USD.
    guide: market-risk
    glossary:
      BOOK:
        term: "Book"
        means: "The trading book the charge is computed for."
      DELTA_CHARGE:
        term: "Delta risk charge"
        means: "Capital for the first-order sensitivity of the book to its risk factors, after the regulatory risk weights and the correlations within and between buckets."
        unit: "USD"
        sign: "A capital charge, positive."
      VEGA_CHARGE:
        term: "Vega risk charge"
        means: "Capital for the sensitivity of option values to implied volatility, aggregated like delta."
        unit: "USD"
        sign: "A capital charge, positive."
      CURVATURE_CHARGE:
        term: "Curvature risk charge"
        means: "Capital for the loss that delta alone does not capture when an option's value is not linear in the underlying move (the gamma risk)."
        unit: "USD"
        sign: "A capital charge, positive."
      TOTAL:
        term: "Sensitivities-based charge"
        means: "The sum of the delta, vega and curvature charges of the book. The full standardised charge adds the default-risk and residual-risk add-ons."
        unit: "USD"
        sign: "A capital charge, positive."
      SENSITIVITIES.RISK_CLASS:
        term: "Risk class"
        means: "One of the regulatory risk classes: general interest-rate, credit spread (non-securitisation, securitisation), equity, commodity or FX."
      SENSITIVITIES.BUCKET:
        term: "Bucket"
        means: "The regulatory grouping of risk factors inside a risk class, such as a sector, rating or tenor group, with its own risk weight and correlation."
      SENSITIVITIES.MEASURE:
        term: "Measure"
        means: "Which risk the sensitivity measures: delta (to the price or rate), vega (to volatility) or curvature."
        values:
          Delta: "The first-order change for a small move in the risk factor."
          Vega: "The change for a small move in implied volatility."
          Curvature: "The loss beyond the linear estimate under the prescribed up and down shocks."
      SENSITIVITIES.VALUE:
        term: "Sensitivity"
        means: "The change in the value of the book's positions for the prescribed unit move in the factor, before the risk weight is applied."
        unit: "USD"
        sign: "Positive gains when the factor rises, negative loses."
      BY_CLASS.CHARGE:
        term: "Charge by risk class"
        means: "The class's contribution to the book's sensitivities-based charge."
        unit: "USD"
  pnl-explain:
    title: P&L explain
    about: >-
      On ${$.DATE} ${$.BOOK} made ${fmt($.ACTUAL, 'signed0')} USD. Its risk factors explain ${fmt($.EXPLAINED, 'signed0')};
      ${fmt($.UNEXPLAINED, 'signed0')} is unexplained.
    guide: market-risk
    glossary:
      DATE:
        term: "Business date"
        means: "The trading day the P&L belongs to."
      ACTUAL:
        term: "Actual P&L"
        means: "The change in the book's value over the day as booked, including new trades, fees and carry."
        unit: "USD"
        sign: "Positive is a gain."
      EXPLAINED:
        term: "Explained P&L"
        means: "The part of the actual P&L that the risk factors account for: each sensitivity multiplied by that day's move in its factor, plus carry and roll-down."
        unit: "USD"
        sign: "Positive is a gain."
      UNEXPLAINED:
        term: "Unexplained P&L"
        means: "Actual minus explained. A large or persistent residual points to a missing risk factor, a stale parameter or a pricing difference between the front office and risk."
        unit: "USD"
        sign: "Positive means the book did better than its risk factors predict."
      ATTRIBUTION.PNL:
        term: "P&L from the factor"
        means: "The explained P&L assigned to this risk factor."
        unit: "USD"
        sign: "Positive is a gain."
      EXPLAIN_STEPS.PNL:
        term: "Step in the waterfall"
        means: "Each step moves the running total from zero to the actual P&L; the last step is the unexplained rest."
        unit: "USD"
        sign: "Positive adds, negative subtracts."
  trade-valuation:
    title: Trade valuation
    about: >-
      The risk engine values ${$.TRADE_ID} (${$.PRODUCT_TYPE}, booked in ${$.SOURCE_SYSTEM}) at ${fmt($.MTM, 'signed0')} USD on ${$.VALUATION_DATE};
      it moved ${fmt($.PNL_1D, 'signed0')} USD over the last day.
    guide: market-risk
    glossary:
      MTM: { use: "MTM" }
  position:
    title: Position
    about: >-
      ${$.POSITION_ID} holds ${fmt($.QUANTITY, 'compact')} of ${$.INSTRUMENT} in ${$.TT_BOOK}: ${$.DIRECTION}, built from ${$.TRADE_COUNT} trade(s).
      Drishti derives it from the trades by the ${$.POSITION_RULE} rule; its VaR is the engine's, computed as the page opens.
    guide: market-risk
    glossary:
      DIRECTION:
        term: "Direction"
        means: "LONG when the position's net quantity is above zero (more bought than sold), SHORT when below. Its trades may be of both directions: they net."
      QUANTITY:
        term: "Net quantity"
        means: "The signed sum of the position's trades' quantities (notional for swaps, units for securities): a buy adds, a sell takes away."
      MARKET_VALUE:
        term: "Market value"
        means: "The sum of the trades' present values (their mark-to-market) on the business date."
        unit: "USD"
        sign: "Positive is an asset."
      POSITION_RULE:
        term: "Position rule"
        means: "How Drishti keyed the position (the market-risk pack's positions: rules): securities by book and security, listed by book and contract, otc one per trade."
      SECURITY_ID: { term: "Security", means: "The security or exchange contract the position holds; empty for a position of one OTC trade." }
      INSTRUMENT:
        term: "Instrument"
        means: "What the position holds: the security, or for one OTC trade its product, currency and maturity."
      TRADES.QUANTITY:
        term: "Trade quantity"
        means: "The trade's signed quantity in the position: a buy positive, a sell negative."
      TRADES.PV: { term: "Trade PV", means: "The trade's present value on the business date, as the risk batch priced it.", unit: "USD" }
      TRADE_COUNT: { term: "Trades", means: "The trades that make the position on the business date." }
      INSTRUMENT_ID: { term: "Instrument id", means: "The key the position rule took: the security or contract, or for an OTC position the trade itself." }
      TT_BOOK: { term: "Book", means: "The book the position is held in: its trades are all booked there." }
      DESK: { term: "Desk", means: "The desk the book belongs to." }
      LEGAL_ENTITY: { term: "Legal entity", means: "The bank's legal entity that holds the book." }
      PRODUCT_TYPE: { term: "Product type", means: "The product of the instrument, as the booking systems name it." }
      CURRENCY: { term: "Currency", means: "The instrument's currency. Every P&L and value is in USD, the reporting currency." }
      COUNTERPARTY: { term: "Counterparty", means: "The counterparty of the position's trades when they all share one; empty otherwise." }
      NOTIONAL: { term: "Gross notional", means: "The sum of the trades' quantities without their signs." }
      VAR_ENGINE.VAR: { use: "var99" }
      VAR_ENGINE.ES: { use: "es975" }
      VAR_ENGINE.COMPONENT_VAR:
        term: "Component VaR"
        means: "The position's share of its book's VaR (Euler allocation), computed by the VaR engine as the page opens: the shares of a book's positions add up to its VaR; a hedge has a negative share."
        unit: "USD"
      VAR_ENGINE.PNL: { term: "P&L vector", means: "The position's P&L under each historical scenario day (509 of them): the sum of its trades' vectors, computed as the page opens.", unit: "USD", sign: "Positive is a gain." }
  pnl-vector:
    title: P&L vector of a trade
    about: >-
      ${$.TRADE_ID}'s P&L under each of the ${size($.PNL)} scenario days of ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}, in USD: the grain every
      VaR is summed from. The trade is ${$.DIRECTION} in ${$.TT_BOOK}; Drishti derives its position from it.
    guide: market-risk
    glossary:
      PNL: { term: "P&L vector", means: "The trade's P&L under each historical scenario day, oldest first: index i is the scenario set's day i.", unit: "USD", sign: "Positive is a gain." }
      SECURITY_ID: { term: "Security", means: "The security or exchange contract the trade is in (securities and listed products): Drishti keys the trade's position by book and security." }
      TRADE_STATUS: { term: "Trade status", means: "The trade's status the batch priced: NEW, VALIDATED and AMENDED count on the date; others are left out." }
      QUANTITY: { term: "Signed quantity", means: "The trade's quantity: positive for a buy, negative for a sell." }
      PV: { term: "Present value", means: "The trade's value on the business date.", unit: "USD" }
      STATUS: { term: "Batch status", means: "ok, proxied (priced by a proxy) or failed (no vector: counted, never taken as zero)." }
  scenario-pv:
    title: Scenario PVs of a trade
    about: >-
      ${$.TRADE_ID}'s value under each of the ${size($.SCENARIO_PV)} scenario days of ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}, in its own
      currency ${$.CURRENCY}, beside its base PV of the same run: Drishti turns them into the trade's USD P&L when it loads the date
      (P&L = PV under the scenario x the scenario's FX - base PV x today's FX), and into any reporting currency when asked.
    guide: market-risk
    glossary:
      SCENARIO_PV: { term: "Scenario PVs", means: "The trade's present value under each historical scenario day, oldest first: index i is the scenario set's day i. A scenario that failed to price is null: the trade is then not loaded (DRS-5206), never filled with zero.", unit: "the trade's currency (CURRENCY)" }
      BASE_PV: { term: "Base PV", means: "The trade's present value on the business date, from the same run as the scenario PVs.", unit: "the trade's currency (CURRENCY)" }
      CURRENCY: { term: "Currency", means: "The currency both PVs are in: the trade's own currency (one stated currency for a whole file is the same thing)." }
      VALUATION_DATE: { term: "Valuation date", means: "The date the scenario PVs are valued on: the business date." }
      BASE_VALUATION_DATE: { term: "Base valuation date", means: "The date the base PV is valued on: the same as the scenario PVs', the business date." }
      STATUS: { term: "Batch status", means: "ok, proxied (priced by a proxy) or failed (no scenario PVs: counted, never taken as zero)." }
  fx-scenario:
    title: Scenario FX of a currency
    about: >-
      ${$.CURRENCY} against USD under each of the ${size($.RATES)} scenario days of ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}, and today's
      rate ${$.RATE} (USD per 1 ${$.CURRENCY}): the rates the VaR engine converts scenario PVs and reporting currencies with. Without them
      Drishti derives the rates from the FX history (today's rate moved by each scenario day's 1-day move).
    guide: market-risk
    glossary:
      RATE: { term: "Rate today", means: "USD per one unit of the currency on the business date.", unit: "USD per unit" }
      RATES: { term: "Scenario rates", means: "USD per one unit of the currency under each scenario, oldest first: index i is the scenario set's day i. Every cross rate goes through USD.", unit: "USD per unit" }
      CURRENCY: { term: "Currency", means: "The currency the rates are for (ISO code)." }
  scenario-set:
    title: Scenario set
    about: >-
      ${$.SCENARIO_SET_ID} on ${$.BUSINESS_DATE}: ${$.SCENARIO_COUNT} historical scenario days from ${$.WINDOW_START} to ${$.WINDOW_END}, each
      day's market move applied to the business date's market, ${$.HORIZON_DAYS}-day horizon.
    guide: market-risk
    glossary:
      SCENARIO_DATES: { term: "Scenario days", means: "The historical days whose moves make the scenarios, oldest first: position i of every P&L vector is day i." }
      WINDOW_START: { term: "Window start", means: "The oldest scenario day." }
      WINDOW_END: { term: "Window end", means: "The newest scenario day: the business day before the business date." }
      REVALUATION: { term: "Revaluation", means: "full (every trade repriced under each scenario) or sensitivities (a Taylor expansion), as the batch did it." }
  risk-hierarchy:
    title: Risk hierarchy node
    about: >-
      ${$.NAME} is a ${$.LEVEL} of the ${$.HIERARCHY} hierarchy, under ${coalesce($.PARENT_ID, 'nothing: the root')}, with
      ${size($.BOOKS)} book(s) beneath it and a VaR limit of ${fmt($.LIMIT_VAR, 'compact')} USD.
    guide: market-risk
    glossary:
      HIERARCHY: { term: "Hierarchy", means: "MGMT: bank, division, desk, book. LEGAL: bank, legal entity, desk, book. A book is in one leaf of each." }
      LEVEL: { term: "Level", means: "bank, division, legal-entity, desk or book." }
      BOOKS: { term: "Books", means: "Every book beneath the node: its positions are the node's." }
      LIMIT_VAR: { term: "VaR limit", means: "The 1-day 99% VaR the node may take.", unit: "USD" }
  portfolio:
    title: Portfolio
    about: >-
      ${$.NAME} is a ${$.TYPE} portfolio owned by ${$.OWNER}, with a VaR limit of ${fmt($.LIMIT_VAR, 'compact')} USD. Its positions,
      VaR, ES and contributions are the engine's, computed as the page opens (PORT ${$.PORTFOLIO_ID} in the VaR explorer).
    guide: market-risk
    glossary:
      TYPE:
        term: "Portfolio type"
        means: "HIERARCHY: a node of the bank's hierarchy (a desk, a legal entity, a book). RULE: every position whose columns meet a condition. BASKET: positions and trades someone picked."
      LIMIT_VAR: { term: "VaR limit", means: "The VaR the portfolio may take.", unit: "USD" }
      VAR_ENGINE.VAR: { use: "var99" }
      VAR_ENGINE.ES: { use: "es975" }
      VAR_ENGINE.LIMIT_USE: { term: "Limit use", means: "The VaR over the portfolio's VaR limit." }
      VAR_ENGINE.POSITION_COUNT: { term: "Positions", means: "The positions in the portfolio on the business date (a basket naming one trade of a position holds that part of it)." }
      VAR_ENGINE.GROSS_MV: { term: "Gross market value", means: "The sum of the positions' market values without their signs.", unit: "USD" }
      VAR_ENGINE.NET_MV: { term: "Net market value", means: "The sum of the positions' market values: longs and shorts offset.", unit: "USD", sign: "Positive is a net asset." }
      VAR_ENGINE.POSITIONS.COMPONENT_VAR:
        term: "Component VaR"
        means: "The position's share of the portfolio's VaR (Euler): the shares add up to the portfolio's VaR; a hedge has a negative share."
        unit: "USD"
      VAR_ENGINE.POSITIONS.VAR: { term: "VaR on its own", means: "The position's own 1-day 99% VaR, as if it were alone.", unit: "USD" }
      VAR_ENGINE.POSITIONS.PCT_OF_VAR: { term: "Share of VaR", means: "The component VaR over the portfolio's VaR." }
      DEFINITION.NODE: { term: "Hierarchy node", means: "For a HIERARCHY portfolio: the node of the bank's hierarchy whose positions it holds (every book under it)." }
      DEFINITION.RULE: { term: "Rule", means: "For a RULE portfolio: the condition a position's columns must meet to be in it, checked on each business date." }
      DEFINITION.MEMBERS: { term: "Members", means: "For a BASKET portfolio: the positions and trades someone picked (a trade brings that part of its position)." }
      ROLLS_UP_TO.ID: { term: "Rolls up to", means: "The desk or book the portfolio reports under." }
      VALID_FROM: { term: "Valid from", means: "The first business date the portfolio's definition applies to; an earlier date uses the definition then in force." }
      OWNER: { term: "Owner", means: "Who keeps the portfolio's definition." }
  var-result:
    title: VaR of a scope
    about: >-
      ${$.LABEL} on ${$.BUSINESS_DATE}: a 1-day VaR of ${fmt($.VAR, 'compact')} USD at ${$.CONFIDENCE} confidence and an expected
      shortfall of ${fmt($.ES, 'compact')} USD, computed when asked by the server's VaR engine from every trade's P&L vector, as you see
      them (VAR ${$.CANONICAL} opens the same answer in the explorer).
    guide: market-risk
    glossary:
      SCOPE: { term: "Scope", means: "The set of trades asked about, in the scope grammar: BANK, DESK:RATES, POS:<id>, PORT:<id>, BANK - DESK:CREDIT." }
      VAR: { use: "var99" }
      ES: { use: "es975" }
      K: { term: "VaR rank", means: "Which worst scenario the VaR is: the 6th worst of 509 at 99%." }
      SUM_STANDALONE: { term: "Sum of standalone VaRs", means: "The VaRs of the parts, each as if alone, added up.", unit: "USD" }
      DIVERSIFICATION: { term: "Diversification", means: "The sum of the parts' standalone VaRs minus the scope's VaR: what holding them together saves.", unit: "USD" }
      LIMIT_USE: { term: "Limit use", means: "The VaR over the node's or portfolio's VaR limit." }
      PNL: { term: "P&L vector", means: "The scope's P&L under each historical scenario day, oldest first: the sum of its trades' vectors.", unit: "USD" }
      PROVENANCE.TIER: { term: "Tier", means: "Where the vector came from: a node's float64 aggregate, the date's memory-mapped hot file (float32 rows summed in float64), or the heap." }
  var-official:
    title: VaR official result
    about: >-
      ${$.NODE_NAME} (${$.LEVEL}, ${$.HIERARCHY}) on ${$.BUSINESS_DATE}: the official end-of-day 1-day VaR of ${fmt($.VAR, 'compact')} USD
      and expected shortfall of ${fmt($.ES, 'compact')} USD, result version ${$.RESULT_VERSION}, as the server captured and published it
      (read only; VAR NODE:${$.NODE_ID} opens the explorer at the node).
    guide: market-risk
    glossary:
      NODE_ID: { term: "Hierarchy node", means: "The node of the MGMT or LEGAL hierarchy the row is for." }
      VAR: { use: "var99" }
      ES: { use: "es975" }
      RESULT_VERSION: { term: "Result version", means: "1, then 2, 3 ... when the date is restated; the latest version is the date's figure." }
      HYPO_PNL: { term: "Hypothetical P&L", means: "The node's P&L for the date on its positions of the day before (the backtest's input).", unit: "USD" }
      LIMIT_USE: { term: "Limit use", means: "The VaR over the node's VaR limit." }
      EXCEPTIONS_250: { term: "Backtest exceptions", means: "Days in the official history (up to 250) whose loss exceeded the VaR of the day before." }
      TRAFFIC_LIGHT: { term: "Traffic light", means: "The Basel backtesting zone: green, amber or red." }
  var-whatif:
    title: VaR what-if
    about: >-
      ${$.CANONICAL} on ${$.BUSINESS_DATE}: VaR ${fmt($.BEFORE_VAR, 'compact')} USD before and ${fmt($.AFTER_VAR, 'compact')} USD after the
      ${$.ITEMS} hypothetical trade(s) of your sandbox, computed by the Python VaR engine; the stressed window over
      ${$.STRESS_WINDOW} scenario days.
    guide: market-risk
    glossary:
      BEFORE_VAR: { term: "VaR before", means: "The scope's 1-day 99% VaR as booked.", unit: "USD" }
      AFTER_VAR: { term: "VaR after", means: "The scope's VaR with the sandbox's hypothetical trades added.", unit: "USD" }
      CHANGE_VAR: { term: "Change in VaR", means: "VaR after minus VaR before: what the trades do to the scope's VaR.", unit: "USD" }
      STRESSED_VAR_BEFORE: { term: "Stressed VaR", means: "The largest VaR over every run of the stress window's consecutive scenario days.", unit: "USD" }
      ITEMS: { term: "What-if trades", means: "The hypothetical trades of your private sandbox, each with its P&L over the scenarios." }
