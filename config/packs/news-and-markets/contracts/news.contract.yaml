# Data contract of the news kind (command NEWS): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap news`; owned by people from then on: confirm the review points, then remove them.
kind: news
mnemonic: NEWS
pack: news-and-markets
version: '1.0'
class: fundamental
status: active
title: Headlines
description: 'The headlines for one name, as the news connector computed them: newest first, filtered for relevance, duplicates removed.'
source: 'public data: Google News (news connector)'
grain: One row per headlines, keyed by NEWS_ID.
key:
- NEWS_ID
id-pattern:
- ^NEWS-
dated-by: snapshot
cadence:
  frequency: intraday
  due: on demand, when the connector is on
storage:
  connector: news
  plugin: news
  other-connectors:
  - news-store
  test-data:
  - data/testdata/news-and-markets/news
fields:
- name: NEWS_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: NEWS-Alphabet
  pattern: ^NEWS-
  link: news
- name: ENTITY
  type: text
  presence: required
  description: The company or topic the headlines are about, as searched (Alphabet, Federal Reserve).
  example: Alphabet
- name: ALIASES
  type: text list
  presence: required
  description: 'Other names of the entity; a headline must name the entity or one of these to pass the relevance step.'
- name: EDITION
  type: text
  presence: required
  description: 'The Google News edition the headlines come from: language and country (en-US, de-DE, ja-JP).'
  example: en-US
  enum:
  - de-DE
  - en-US
  - ja-JP
- name: RELEVANCE_FILTER
  type: text
  presence: required
  description: on when headlines not about ENTITY were dropped (the pipeline's relevance step), off for the ~all record.
  example: 'on'
  enum:
  - 'off'
  - 'on'
- name: COUNT
  type: integer
  presence: required
  description: 'How many headlines ITEMS holds: at most the news connector''s max-items setting (15 in the snapshot).'
  example: 15
- name: FETCHED_AT
  type: text
  presence: required
  description: 'When the headlines were fetched, as text: date and time in UTC, and in the snapshot "(snapshot captured <date>)".'
  example: 2026-10-18 03:25 UTC (snapshot captured 2026-10-18)
  enum:
  - 2026-10-18 03:25 UTC (snapshot captured 2026-10-18)
  - 2026-10-18 03:26 UTC (snapshot captured 2026-10-18)
  - 2026-10-18 03:27 UTC (snapshot captured 2026-10-18)
- name: ITEMS
  type: record list
  presence: required
  description: 'The headlines, newest first, one element each: PUBLISHED, SOURCE (the publisher), TITLE and LINK.'
- name: BY_SOURCE
  type: record list
  presence: required
  description: 'How many of the headlines each publisher wrote, one element per publisher: SOURCE and COUNT.'
- name: PIPELINE
  type: record list
  presence: required
  description: 'What each step of the news pipeline did, one element per step in order (relevance, duplicates …): STEP, KEPT and DROPPED (headline counts).'
- name: FETCHED
  type: integer
  presence: required
  description: 'How many headlines the feed returned before the pipeline (relevance, duplicates, limit) filtered them.'
  example: 100
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the headlines come from, one object: FEED (Google News RSS), FETCHED, CACHED_FOR, TERMS and SNAPSHOT.'
- name: SNAPSHOT
  type: text
  presence: required
  description: 'Says the document is a committed snapshot: when it was captured and from where (tools/testdata/capture_market.py).'
  example: Snapshot captured 2026-10-18 03:24 UTC from Google News
- name: SNAPSHOT_CAPTURED_AT
  type: timestamp
  presence: required
  description: 'When the snapshot was captured, ISO-8601 UTC.'
  example: '2026-10-18T03:24:33Z'
nested:
  ITEMS[]:
  - name: PUBLISHED
    type: text
    presence: required
    description: 'When the headline was published, as text (YYYY-MM-DD HH:MM UTC).'
    example: 2026-10-18 01:37 UTC
  - name: SOURCE
    type: text
    presence: required
    description: 'The publisher of the headline.'
    example: Simply Wall Street
  - name: TITLE
    type: text
    presence: required
    description: The headline as the publisher wrote it.
    example: Alphabet (GOOGL) Plans Toronto Robotaxi Service By 2028
  - name: LINK
    type: text
    presence: required
    description: 'The link to the article (a Google News redirect URL).'
    example: https://news.google.com/rss/articles/CBMiugFBVV95cUxOWF9ZUU…
  - name: SNIPPET
    type: unknown
    presence: optional
    description: 'The feed''s short summary of the article, when it gives one.'
  BY_SOURCE[]:
  - name: SOURCE
    type: text
    presence: required
    description: 'A publisher among ITEMS.'
    example: The Motley Fool
  - name: COUNT
    type: integer
    presence: required
    description: 'How many of ITEMS that publisher has.'
    example: 3
  PIPELINE[]:
  - name: DROPPED
    type: integer
    presence: required
    description: 'How many headlines the step removed.'
    example: 4
  - name: KEPT
    type: integer
    presence: required
    description: 'How many headlines remained after the step.'
    example: 96
  - name: STEP
    type: text
    presence: required
    description: 'The pipeline step, in order: relevance (the title names the entity or an alias), duplicates (the same story or headline from the same publisher kept once, the newest), limit (at most the connector''s max-items); sources (deny or allow lists) when set.'
    example: relevance
    enum:
    - duplicates
    - limit
    - relevance
  PROVENANCE:
  - name: FEED
    type: text
    presence: required
    description: 'The feed the headlines came from (Google News RSS).'
    example: Google News RSS (news.google.com)
  - name: FETCHED
    type: text
    presence: required
    description: 'When the connector fetched the feed, as text (YYYY-MM-DD HH:MM UTC).'
    example: 2026-10-18 03:25 UTC
    enum:
    - 2026-10-18 03:25 UTC
    - 2026-10-18 03:26 UTC
    - 2026-10-18 03:27 UTC
  - name: CACHED_FOR
    type: text
    presence: required
    description: 'How long the connector caches a fetch (its cache TTL), as text.'
    example: 3600 s
  - name: TERMS
    type: text
    presence: required
    description: 'The terms the headlines may be shown under.'
    example: Headlines and links belong to their publishers; shown for i…
  - name: SNAPSHOT
    type: text
    presence: required
    description: 'Says the document is served from the committed snapshot in the demo lake, not live.'
    example: Snapshot captured 2026-10-18 03:24 UTC from Google News; se…
links:
- field: NEWS_ID
  kind: news
validation:
- rule: required
  fields:
  - NEWS_ID
  - ENTITY
  - ALIASES
  - EDITION
  - RELEVANCE_FILTER
  - COUNT
  - FETCHED_AT
  - ITEMS
  - BY_SOURCE
  - PIPELINE
  - FETCHED
  - PROVENANCE
  - SNAPSHOT
  - SNAPSHOT_CAPTURED_AT
- rule: unique
  key:
  - NEWS_ID
  per: snapshot
- rule: pattern
  field: NEWS_ID
  pattern: ^NEWS-
- rule: link
  field: NEWS_ID
  kind: news
- rule: enum
  field: EDITION
  values:
  - de-DE
  - en-US
  - ja-JP
- rule: enum
  field: RELEVANCE_FILTER
  values:
  - 'off'
  - 'on'
- rule: range
  field: COUNT
  min: 0
- rule: enum
  field: FETCHED_AT
  values:
  - 2026-10-18 03:25 UTC (snapshot captured 2026-10-18)
  - 2026-10-18 03:26 UTC (snapshot captured 2026-10-18)
  - 2026-10-18 03:27 UTC (snapshot captured 2026-10-18)
- rule: range
  field: BY_SOURCE[].COUNT
  min: 0
- rule: enum
  field: PIPELINE[].STEP
  values:
  - duplicates
  - limit
  - relevance
- rule: enum
  field: PROVENANCE.FETCHED
  values:
  - 2026-10-18 03:25 UTC
  - 2026-10-18 03:26 UTC
  - 2026-10-18 03:27 UTC
notes:
- 'Several source systems: the connector news and news-store each serve this kind from a table of their own with the same layout; the storage
  above is the first one''s.'
review:
- 'required inferred from 100% coverage in 71 documents (0 samples and 71 test-data documents (data/testdata/news-and-markets/news/snapshot-2026-10-18.jsonl.gz)):
  confirm each required field is mandatory upstream, and each optional one may be empty.'
- 'read live through the news connector when it is on: confirm the cadence (intraday, on demand).'
- 'enum values inferred from the data, not from a glossary: EDITION, RELEVANCE_FILTER, FETCHED_AT, PIPELINE[].STEP, PROVENANCE.FETCHED: confirm
  they are closed lists.'
