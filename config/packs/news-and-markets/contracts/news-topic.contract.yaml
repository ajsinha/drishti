# Data contract of the news-topic kind (command TOPIC): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap news-topic`; owned by people from then on: confirm the review points, then remove them.
kind: news-topic
mnemonic: TOPIC
pack: news-and-markets
version: '1.0'
class: fundamental
status: active
title: News topic
description: 'A topic and the news about it: headlines (newest first) with their publishers and links, a count by source, and how the headlines
  were chosen.'
source: reference
grain: One row per news topic, keyed by TOPIC_ID.
key:
- TOPIC_ID
id-pattern:
- ^TOPIC-
dated-by: snapshot
cadence:
  frequency: static
  due: to be confirmed
storage:
  connector: news-store
  plugin: delta
  domain: news
  table: <root>/news/news-topic/
  test-data:
  - config/packs/news-and-markets/samples
fields:
- name: TOPIC_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: TOPIC-FED
  pattern: ^TOPIC-
- name: NAME
  type: text
  presence: required
  description: The topic's name as searched (Federal Reserve, Bank of Japan).
  example: Federal Reserve
- name: CATEGORY
  type: text
  presence: required
  description: 'What the topic is: Central bank, Theme, Country or Company.'
  example: Central bank
  enum:
  - Central bank
  - Company
  - Country
  - Theme
- name: ALIASES
  type: text list
  presence: required
  description: 'Other names of the topic the news connector accepts in a headline (its relevance step).'
- name: ALIAS_TEXT
  type: text
  presence: required
  description: Other names the headlines may use for the topic, comma-separated ("Fed, FOMC, Powell").
  example: Fed, FOMC, Powell
- name: EDITION
  type: text
  presence: required
  description: The Google News edition searched (en-US, de-DE, ja-JP), or default for the connector's own.
  example: default
- name: NEWS_ID
  type: id
  presence: required
  description: 'The topic''s headlines with the relevance filter on: a NEWS_ID of the news kind (NEWS-<name>).'
  example: NEWS-Federal_Reserve
  pattern: ^NEWS-
  link: news
- name: NEWS_ALL_ID
  type: id
  presence: required
  description: 'The topic''s headlines without the relevance filter: a NEWS_ID of the news kind (NEWS-<name>~all).'
  example: NEWS-Federal_Reserve~all
  pattern: ^NEWS-
  link: news
- name: ECONOMY
  type: id
  presence: optional
  description: 'The economy the topic belongs to: an id of the world-economy pack''s economy kind (ECON-<ISO 3166-1 alpha-3>).'
  example: ECON-IND
  pattern: ^ECON-
  link: economy
links:
- field: NEWS_ID
  kind: news
- field: NEWS_ALL_ID
  kind: news
- field: ECONOMY
  kind: economy
validation:
- rule: required
  fields:
  - TOPIC_ID
  - NAME
  - CATEGORY
  - ALIASES
  - ALIAS_TEXT
  - EDITION
  - NEWS_ID
  - NEWS_ALL_ID
- rule: unique
  key:
  - TOPIC_ID
  per: snapshot
- rule: pattern
  field: TOPIC_ID
  pattern: ^TOPIC-
- rule: enum
  field: CATEGORY
  values:
  - Central bank
  - Company
  - Country
  - Theme
- rule: link
  field: NEWS_ID
  kind: news
- rule: link
  field: NEWS_ALL_ID
  kind: news
- rule: link
  field: ECONOMY
  kind: economy
notes: []
review:
- 'required inferred from 100% coverage in 15 documents (15 samples): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'key TOPIC_ID is the field holding the sample catalogue''s id (TOPIC-FED): confirm it is the business key.'
- 'source ''reference'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'the pack also names ''Hand-written reference data (topics and listed companies)'' for this kind (news-topic, listed-company): state when each
  source applies.'
- 'a snapshot refreshed when tools/publicdata/news_and_markets.py runs: confirm the refresh cadence.'
- 'enum values inferred from the data, not from a glossary: CATEGORY: confirm they are closed lists.'
