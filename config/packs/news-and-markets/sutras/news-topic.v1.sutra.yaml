rachana: 1
sutra: news-topic
version: 1
description: "A topic and the news about it: headlines (newest first) with their publishers and links, a count by source, and how the headlines were chosen. The headlines are computed on demand by the news connector."
doc:
  summary: "A news topic: its headlines newest first, a count by source, how they were chosen and everything the feed returned."
  description: >-
    One page per topic (a central bank, an economy, a theme): the headlines about it newest first with their publishers and
    links, the count of headlines by source, how the headlines were chosen (each relevance step, what it kept and dropped),
    everything the feed returned for the name with no relevance filter, a note on where the headlines come from, how the view
    was built and its links (F7 opens the news page). The headlines are computed on demand by the news connector, or served
    from the demo lake's snapshot while it is off. The strip gives the topic, its category, other names and edition.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/news-topic/TOPIC-FED"
    - "TOPIC TOPIC-ECB"
  since: "2.7.0"
match: { kind: news-topic, priority: 10 }
title: { pill: "News · Topic", id: $.TOPIC_ID }
strip:
  - { label: Topic, bind: $.NAME }
  - { label: Category, bind: $.CATEGORY }
  - { label: Other names, bind: $.ALIAS_TEXT }
  - { label: Edition, bind: $.EDITION }
  - { label: Headlines, bind: "link($.NEWS_ID, 'news')" }
panels:
  - id: headlines
    kind: table
    title: "Headlines, newest first"
    code: NEWS
    key: F2
    source: "link($.NEWS_ID, 'news')"
    rows: $.ITEMS
    columns:
      - { label: Published, bind: "@.PUBLISHED" }
      - { label: Source, bind: "@.SOURCE" }
      - { label: Headline, bind: "@.TITLE" }
      - { label: Link, bind: "@.LINK" }
  - id: bySource
    kind: hbar
    title: "Headlines by source"
    key: F3
    area: right
    source: "link($.NEWS_ID, 'news')"
    rows: $.BY_SOURCE
    label: SOURCE
    value: COUNT
    fmt: amount0
  - id: pipeline
    kind: table
    title: "How the headlines were chosen"
    key: F4
    area: right
    source: "link($.NEWS_ID, 'news')"
    rows: $.PIPELINE
    columns:
      - { label: Step, bind: "@.STEP" }
      - { label: Kept, bind: "@.KEPT", fmt: amount0 }
      - { label: Dropped, bind: "@.DROPPED", fmt: amount0 }
  - id: everything
    kind: table
    title: "Everything the feed returned for this name (no relevance filter)"
    key: F5
    source: "link($.NEWS_ALL_ID, 'news')"
    rows: $.ITEMS
    columns:
      - { label: Published, bind: "@.PUBLISHED" }
      - { label: Source, bind: "@.SOURCE" }
      - { label: Headline, bind: "@.TITLE" }
      - { label: Link, bind: "@.LINK" }
  - use: explainer-note@1
    with: { title: "About these headlines", area: right,
            text: "Sample pack. Headlines are fetched when this page opens, by the news connector, from Google News; turning it on (Admin, Connectors: news) sends the name of this topic to Google. While the connector is off (its shipped state) or the server runs in offline mode (DRISHTI_OFFLINE=true), the demo lake serves a captured snapshot of the same headlines (the news page, F7, says when it was captured), and without a lake the tables above stay empty." }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.NEWS_ID, 'news')", F9: raw }
