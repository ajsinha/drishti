# The news-and-markets pack's own fragment (SUTRA_NEXT.md 3a), hand-written, used as { use: news-and-markets/price-bars@1 }.
rachana: 1
fragment: price-bars
version: 1
description: "Every bar of a price history as a table: date, open, high, low, close and volume."
params: { id: bars, title: Price history, rows: $.HISTORY, code: '', key: '', area: '' }
doc:
  summary: "Every bar of a price history as a table: date, open, high, low, close and volume."
  description: >-
    A price history one row a bar, in the order of the list: its date, open, high, low and close as prices and its
    volume as a whole number. It reads the yfinance connector's HISTORY rows (DATE, OPEN, HIGH, LOW, CLOSE, VOLUME).
    Use it under a closing price line, for the reader who wants the numbers.
  params:
    id: { type: id, default: bars, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: Price history, meaning: "The title over the table" }
    rows: { type: expression, default: $.HISTORY, meaning: "The list of bars" }
    code: { type: key, default: '', meaning: "The panel's mnemonic code, typed in the command line to jump to it; none when empty" }
    key: { type: key, default: '', meaning: "The function key (F2 to F12) that brings the panel forward; none when empty" }
    area: { type: area, default: '', meaning: "Where the panel sits: main (the default when empty) or right" }
  emits: []
  expects: []
  examples:
    - { use: price-bars@1, with: { key: F4 } }
  since: "2.7.0"
panels:
  - id: %{id}
    kind: table
    title: "%{title}"
    code: %{code}
    key: %{key}
    area: %{area}
    rows: %{rows}
    columns:
      - { label: Date, bind: "@.DATE" }
      - { label: Open, bind: "@.OPEN", fmt: price2 }
      - { label: High, bind: "@.HIGH", fmt: price2 }
      - { label: Low, bind: "@.LOW", fmt: price2 }
      - { label: Close, bind: "@.CLOSE", fmt: price2 }
      - { label: Volume, bind: "@.VOLUME", fmt: amount0 }
