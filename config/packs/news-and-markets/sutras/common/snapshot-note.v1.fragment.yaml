# The news-and-markets pack's own fragment (RACHANA_REFERENCE.md 3a), hand-written, used as { use: news-and-markets/snapshot-note@1 }.
rachana: 1
fragment: snapshot-note
version: 1
description: "A note, only on a snapshot, that the data is served offline from the demo lake, not live."
params: { id: snapshot, title: Snapshot, area: '' }
doc:
  summary: "A note, only on a snapshot, that the data is served offline from the demo lake, not live."
  description: >-
    Shown only when the record carries SNAPSHOT (the demo lake's captured quotes and headlines): the snapshot's label
    and that it is served offline from the demo lake (news-store), because the live connector is off or the server runs
    offline. Use it on any page the news or yfinance connector answers.
  params:
    id: { type: id, default: snapshot, meaning: "The panel id, unique on the screen" }
    title: { type: text, default: Snapshot, meaning: "The title over the note" }
    area: { type: area, default: '', meaning: "Where the panel sits: main (the default when empty) or right" }
  emits: []
  expects: []
  examples:
    - { use: snapshot-note@1, with: { area: right } }
  since: "2.7.0"
panels:
  - id: %{id}
    kind: markdown
    title: "%{title}"
    area: %{area}
    when: "nonblank($.SNAPSHOT)"
    text: "${$.SNAPSHOT}. Served offline from the demo lake (news-store), not live: the live connector is off or the server runs in offline mode (DRISHTI_OFFLINE=true)."
