rachana: 1
sutra: listed-company
version: 1
description: "A listed company: its live quote and price history (yfinance connector) and its news headlines (news connector), both computed on demand."
match: { kind: listed-company, priority: 10 }
title: { pill: "Market watch · Company", id: $.COMPANY_ID, with: $.NAME }
strip:
  - { label: Ticker, bind: $.TICKER, emphasis: true }
  - { label: Exchange, bind: $.EXCHANGE }
  - { label: Sector, bind: $.SECTOR }
  - { label: Country, bind: $.COUNTRY }
  - { label: Other names, bind: $.ALIAS_TEXT }
  - { label: Quote, bind: "link($.QUOTE_ID, 'quote')" }
panels:
  - id: quote
    kind: kv
    title: "Quote"
    code: QUOTE
    key: F2
    source: "link($.QUOTE_ID, 'quote')"
    columns:
      - { label: Price, bind: $.PRICE, fmt: price2 }
      - { label: Currency, bind: $.CURRENCY }
      - { label: Change, bind: $.CHANGE, fmt: signed2, tone: sign }
      - { label: Change %, bind: $.CHANGE_PCT, fmt: pc2, tone: sign }
      - { label: Market, bind: $.MARKET_STATE }
      - { label: Day range, bind: $.DAY_RANGE }
      - { label: 52-week range, bind: $.FIFTY_TWO_WEEK_RANGE }
      - { label: Volume, bind: $.VOLUME, fmt: amount0 }
      - { label: Market cap, bind: $.MARKET_CAP, fmt: compact }
      - { label: As of, bind: $.AS_OF }
  - id: history
    kind: line
    title: "Closing price"
    key: F3
    source: "link($.QUOTE_ID, 'quote')"
    rows: $.HISTORY
    x: DATE
    y: CLOSE
    fmt: price2
  - id: headlines
    kind: table
    title: "Headlines, newest first"
    code: NEWS
    key: F4
    source: "link($.NEWS_ID, 'news')"
    rows: $.ITEMS
    columns:
      - { label: Published, bind: "@.PUBLISHED" }
      - { label: Source, bind: "@.SOURCE" }
      - { label: Headline, bind: "@.TITLE" }
      - { label: Link, bind: "@.LINK" }
  - id: bySource
    kind: hbar
    title: "Headlines by source"
    area: right
    source: "link($.NEWS_ID, 'news')"
    rows: $.BY_SOURCE
    label: SOURCE
    value: COUNT
    fmt: amount0
  - id: note
    kind: markdown
    title: "About this page"
    area: right
    text: "Sample pack for internal demonstrations. The quote and history come from Yahoo Finance's unofficial public endpoint and the headlines from Google News, each by its own connector, both off until a site enables them (Admin, Connectors: yfinance and news). Turning them on sends this ticker to Yahoo and this company's name to Google. With the connectors off (their shipped state) or the server in offline mode (DRISHTI_OFFLINE=true), the demo lake serves a captured snapshot of the same quote, history and headlines: the quote's As of then ends in (snapshot captured <date>), and without a lake the panels above stay empty."
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.QUOTE_ID, 'quote')", F8: "link($.NEWS_ID, 'news')", F9: raw }
