rachana: 1
sutra: listed-company
version: 1
description: "A listed company: its live quote and price history (yfinance connector) and its news headlines (news connector), both computed on demand."
match: { kind: listed-company, priority: 10 }
title: { pill: "Market watch · Company", id: $.companyId, with: $.name }
strip:
  - { label: Ticker, bind: $.ticker, emphasis: true }
  - { label: Exchange, bind: $.exchange }
  - { label: Sector, bind: $.sector }
  - { label: Country, bind: $.country }
  - { label: Other names, bind: $.aliasText }
  - { label: Quote, bind: "link($.quoteId, 'quote')" }
panels:
  - id: quote
    kind: kv
    title: "Quote"
    code: QUOTE
    key: F2
    source: "link($.quoteId, 'quote')"
    columns:
      - { label: Price, bind: $.price, fmt: price2 }
      - { label: Currency, bind: $.currency }
      - { label: Change, bind: $.change, fmt: signed2, tone: sign }
      - { label: Change %, bind: $.changePct, fmt: pc2, tone: sign }
      - { label: Market, bind: $.marketState }
      - { label: Day range, bind: $.dayRange }
      - { label: 52-week range, bind: $.fiftyTwoWeekRange }
      - { label: Volume, bind: $.volume, fmt: amount0 }
      - { label: Market cap, bind: $.marketCap, fmt: compact }
      - { label: As of, bind: $.asOf }
  - id: history
    kind: line
    title: "Closing price"
    key: F3
    source: "link($.quoteId, 'quote')"
    rows: $.history
    x: date
    y: close
    fmt: price2
  - id: headlines
    kind: table
    title: "Headlines, newest first"
    code: NEWS
    key: F4
    source: "link($.newsId, 'news')"
    rows: $.items
    columns:
      - { label: Published, bind: "@.published" }
      - { label: Source, bind: "@.source" }
      - { label: Headline, bind: "@.title" }
      - { label: Link, bind: "@.link" }
  - id: bySource
    kind: hbar
    title: "Headlines by source"
    area: right
    source: "link($.newsId, 'news')"
    rows: $.bySource
    label: source
    value: count
    fmt: amount0
  - id: note
    kind: markdown
    title: "About this page"
    area: right
    text: "Sample pack for internal demonstrations. The quote and history come from Yahoo Finance's unofficial public endpoint and the headlines from Google News, each by its own connector, both off until a site enables them (Admin, Connectors: yfinance and news). Turning them on sends this ticker to Yahoo and this company's name to Google. While the connectors are off (their shipped state) the panels above stay empty."
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.quoteId, 'quote')", F8: "link($.newsId, 'news')", F9: raw }
