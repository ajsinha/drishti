rachana: 1
sutra: news
version: 1
description: "The headlines for one name, as the news connector computed them: newest first, filtered for relevance, duplicates removed."
doc:
  summary: "The headlines for one name: newest first, a count by source, how they were chosen, and a snapshot note."
  description: >-
    One page per name (a company, a person, a theme; any name works, not only the listed ones): the headlines newest first
    with their publishers and links, the count of headlines by source, how the headlines were chosen (each relevance step, what
    it kept and dropped), a note when they are served from the demo lake's snapshot, the data source and its terms, and how
    the view was built. The headlines are computed on demand by the news connector, filtered for relevance and with duplicates
    removed. The strip gives the entity, the edition, the relevance filter, the number of headlines and when they were fetched.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/news/NEWS-Bitcoin"
    - "NEWS NEWS-Bitcoin"
  since: "2.7.0"
match: { kind: news, priority: 10 }
title: { pill: "News · Headlines", id: $.NEWS_ID }
strip:
  - { label: Entity, bind: $.ENTITY }
  - { label: Edition, bind: $.EDITION }
  - { label: Relevance filter, bind: $.RELEVANCE_FILTER }
  - { label: Headlines, bind: $.COUNT, fmt: amount0, emphasis: true }
  - { label: Fetched, bind: $.FETCHED_AT }
panels:
  - { use: news-and-markets/headlines@1, with: { key: F2 } }
  - { use: ranked-bars@1, with: { id: bySource, title: "Headlines by source", key: F3, area: right, rows: $.BY_SOURCE, label: SOURCE, value: COUNT, fmt: amount0 } }
  - { use: news-and-markets/headline-pipeline@1, with: { key: F4, area: right } }
  - { use: news-and-markets/snapshot-note@1, with: { area: right } }
  - { use: field-list@1, with: { id: source, title: Data source and terms, area: right, rows: $.PROVENANCE } }
  - { use: data-provenance@1 }
keys: { F9: raw }
