rachana: 1
sutra: quote
version: 1
description: "A quote and recent price history for a ticker, as the yfinance connector computed them."
match: { kind: quote, priority: 10 }
title: { pill: "Market watch · Quote", id: $.QUOTE_ID, with: $.NAME }
strip:
  - { label: Price, bind: $.PRICE, fmt: price2, emphasis: true }
  - { label: Currency, bind: $.CURRENCY }
  - { label: Change, bind: $.CHANGE, fmt: signed2, tone: sign }
  - { label: Change %, bind: $.CHANGE_PCT, fmt: pc2, tone: sign }
  - { label: Market, bind: $.MARKET_STATE }
  - { label: Exchange, bind: $.EXCHANGE }
panels:
  - id: history
    kind: line
    title: "Closing price"
    key: F2
    rows: $.HISTORY
    x: DATE
    y: CLOSE
    fmt: price2
  - id: range
    kind: kv
    title: "Ranges and size"
    key: F3
    area: right
    columns:
      - { label: Day range, bind: $.DAY_RANGE }
      - { label: 52-week range, bind: $.FIFTY_TWO_WEEK_RANGE }
      - { label: Volume, bind: $.VOLUME, fmt: amount0 }
      - { label: Market cap, bind: $.MARKET_CAP, fmt: compact }
      - { label: Previous close, bind: $.PREVIOUS_CLOSE, fmt: price2 }
      - { label: As of, bind: $.AS_OF }
  - id: bars
    kind: table
    title: "Price history"
    key: F4
    rows: $.HISTORY
    columns:
      - { label: Date, bind: "@.DATE" }
      - { label: Open, bind: "@.OPEN", fmt: price2 }
      - { label: High, bind: "@.HIGH", fmt: price2 }
      - { label: Low, bind: "@.LOW", fmt: price2 }
      - { label: Close, bind: "@.CLOSE", fmt: price2 }
      - { label: Volume, bind: "@.VOLUME", fmt: amount0 }
  - id: snapshot
    kind: markdown
    title: "Snapshot"
    area: right
    when: "nonblank($.SNAPSHOT)"
    text: "${$.SNAPSHOT}. Served offline from the demo lake (news-store), not live: the live connector is off or the server runs in offline mode (DRISHTI_OFFLINE=true)."
  - { id: source, kind: kv, title: Data source and terms, area: right, rows: $.PROVENANCE }
  - { id: built, kind: provenance, title: How this view was built }
keys: { F9: raw }
