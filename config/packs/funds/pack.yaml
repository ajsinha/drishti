# Funds and ETFs · the 200 largest US mutual funds and ETFs by net assets, with their holdings, from SEC public data (public domain):
# Form N-PORT (holdings with CUSIP, ISIN and LEI, derivatives and their counterparties, flows, monthly returns), Form N-CEN (the census:
# ETF facts, adviser, custodian, auditor, authorised participants), the prospectus risk/return summaries (expense ratio, turnover,
# calendar-year returns), the SEC and Nasdaq Trader ticker files and GLEIF's fund relationships (CC0). Linked to us-equities (a
# holding opens its company; a company lists the funds that hold it; an index lists the funds that track it) and to gleif (LEIs).
# Hand-written; tools/packgen/funds/make.py writes the data (data/testdata/funds/<kind>/, gzipped parts, built into the lake by
# tools/build_demo_lakes.py and served by the Delta connector funds-store below), a few reference samples, the README and
# guides/funds.md, from the downloads tools/publicdata/funds.py keeps in the data folder. No prices or NAV history.
pack: funds
version: 1.0.0
code: FUNDS            # typed alone, opens this pack's overview
title: Funds and ETFs
description: >-
  The 200 largest US mutual funds and ETFs by net assets with their holdings, from SEC public data: Form N-PORT holdings,
  derivatives and counterparties, flows and monthly returns; Form N-CEN census facts; prospectus fees, turnover and calendar-year
  returns. A holding opens its company (us-equities), a company lists the funds that hold it, an index the funds that track it.
kinds: [fund, fund-holder, index-funds]
formats: config/formats.yaml
mnemonics:
  FUND:  { kind: fund, label: Fund or ETF }
  HELD:  { kind: fund-holder, label: Funds holding a company }
  TRACK: { kind: index-funds, label: Funds tracking an index }
graph:
  fields:
    FUND:               { kind: fund, label: Fund }
    MOST_HELD_COMPANY:  { kind: us-company, label: Largest company held }
  badges:
    fund: "$.TYPE + ' · ' + $.TICKERS"
    fund-holder: "$.FUNDS + ' funds'"
    index-funds: "$.FUNDS + ' funds'"
roles:
  fund-analyst: { kinds: [fund, fund-holder, index-funds], raw: true }
form:                          # FORM funds: the search form of each kind
  fund:
    - { path: TICKER, type: id, group: Identity, help: "One or many: paste a list." }
    - { path: NAME, type: text, group: Identity }
    - { path: TICKERS, label: Share class tickers, type: text, group: Identity, help: "VTSAX finds the Vanguard Total Stock Market fund (VTI)." }
    - { path: TYPE, type: enum, group: Fund }
    - { path: ADVISER, type: text, group: Fund }
    - { path: INDEX_ID, label: Tracked index, type: enum, group: Fund }
    - { path: NET_ASSETS, type: number, group: Size and cost }
    - { path: EXPENSE_RATIO, label: "Expense ratio (%)", type: number, group: Size and cost }
    - { path: HOLDING_COUNT, label: Holdings, type: number, group: Size and cost }
console:
  examples:
    - ["FUND QQQ", "Invesco QQQ · fact sheet; tabs: look-through holdings with derivatives and who else holds the largest company, and the ETF against the Nasdaq-100"]
    - ["FUND VTI", "Vanguard Total Stock Market (VTI, VTSAX, ...) · the largest fund, 3,500 holdings"]
    - ["FUND SPY", "SPDR S&P 500 ETF Trust · a unit investment trust against the S&P 500"]
    - ["FUND AGG", "iShares Core U.S. Aggregate Bond ETF · a bond fund: debt by issuer type, no index tab"]
    - ["HELD AAPL", "Apple · every fund of the pack that holds it, by value, and the share of Apple they own"]
    - ["TRACK SP500", "The S&P 500 · the funds that track it, by net assets, with their expense ratio and active share"]
  help: config/help.yaml
columns:
  fund: [TICKER, NAME, TYPE, NET_ASSETS, EXPENSE_RATIO, HOLDING_COUNT]
  fund-holder: [TICKER, NAME, FUNDS, TOTAL_VALUE, PCT_OF_SHARES]
  index-funds: [INDEX, NAME, FUNDS, TOTAL_NET_ASSETS]
# The pack's data: the committed snapshot data/testdata/funds/<kind>/ (fund in gzipped parts of about 1.2 MB) built into
# <lake>/funds/<kind>/ by tools/build_demo_lakes.py (drishti.py lake demo), one Delta table per kind keyed by its id field (TICKER,
# TICKER, INDEX). The promoted columns answer the search form; the type-ahead also matches a fund's name and every share class ticker.
connectors:
  funds-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [fund, fund-holder, index-funds]
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: funds
      layout:
        fund:
          columns: [TICKER, NAME, TYPE, TICKERS, ADVISER, INDEX_ID, NET_ASSETS, EXPENSE_RATIO, HOLDING_COUNT, REPORT_DATE, RANK]
          type-ahead: [NAME, TICKERS]
        fund-holder:
          columns: [TICKER, NAME, FUNDS, TOTAL_VALUE, PCT_OF_SHARES]
          type-ahead: [NAME]
        index-funds:
          columns: [INDEX, NAME, FUNDS, TOTAL_NET_ASSETS]
          type-ahead: [NAME]
routes:
  fund: funds-store
  fund-holder: funds-store
  index-funds: funds-store
