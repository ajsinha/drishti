# Generated by tools/packgen/funds/make.py from tools/packgen/funds/glossary.py. Edit the glossary, not this file.
about: 1
kinds:
  fund:
    title: Fund or ETF
    about: ${$.NAME} (${$.TICKER}) is a ${$.TYPE} with ${fmt($.NET_ASSETS, 'compact')} USD of net assets and ${fmt($.HOLDING_COUNT, 'amount0')}
      holdings on ${$.REPORT_DATE}, as filed on Form N-PORT.
    guide: funds
    glossary:
      TICKER:
        term: Ticker
        means: 'The fund''s ticker: its ETF share class where it has one, else its oldest share class; a unit investment trust''s listed ticker.
          Source: SEC company_tickers_mf.json, N-CEN SECURITY_EXCHANGE, the Nasdaq Trader directory, company_tickers_exchange.json.'
      NAME:
        term: Name
        means: 'The series name as filed (upper-case names title-cased). Source: N-PORT FUND_REPORTED_INFO.SERIES_NAME.'
      TYPE:
        term: Type
        means: 'ETF, Mutual fund, Mutual fund with an ETF share class, or ETF (unit investment trust). Source: N-CEN FUND_REPORTED_INFO.IS_ETF,
          ETF.tsv, the Nasdaq Trader directory.'
        values:
          ETF: An exchange-traded fund
          Mutual fund: An open-end fund with no exchange-traded class
          Mutual fund with an ETF share class: An open-end fund one of whose classes is exchange-traded (Vanguard's)
          ETF (unit investment trust): An ETF organised as a unit investment trust (SPY, DIA)
      FUND_KEY:
        term: Fund key
        means: 'The SEC series id, or CIK<cik> for a fund without one (a unit investment trust). Source: N-PORT FUND_REPORTED_INFO.SERIES_ID,
          REGISTRANT.CIK.'
      SERIES_ID:
        term: SEC series
        means: 'The SEC series id (S and nine digits). Source: N-PORT FUND_REPORTED_INFO.SERIES_ID.'
      CIK:
        term: CIK
        means: 'The registrant''s SEC Central Index Key (ten digits). Source: N-PORT REGISTRANT.CIK.'
      REGISTRANT:
        term: Registrant
        means: 'The trust or company the series belongs to. Source: N-PORT REGISTRANT.REGISTRANT_NAME.'
      LEI:
        term: Fund LEI
        means: 'The fund''s (series'') LEI; opens its GLEIF record. Source: N-PORT FUND_REPORTED_INFO.SERIES_LEI.'
      REGISTRANT_LEI:
        term: Registrant LEI
        means: 'The registrant''s LEI. Source: N-PORT REGISTRANT.LEI.'
      TICKERS:
        term: Share class tickers
        means: 'Every share class ticker, the fund''s own first; the type-ahead matches any of them (FUND VTSAX opens VTI). Source: SEC company_tickers_mf.json.'
      CLASSES:
        term: Share classes
        means: 'Each share class: id, ticker, name, expense ratio and three-month return. Source: company_tickers_mf.json, N-CEN SHARES_OUTSTANDING,
          risk/return summary, N-PORT MONTHLY_TOTAL_RETURN.'
      CLASSES.CLASS_ID:
        term: Class id
        means: 'The SEC class id (C and nine digits). Source: company_tickers_mf.json classId.'
      CLASSES.TICKER:
        term: Class ticker
        means: 'The share class''s ticker. Source: company_tickers_mf.json symbol.'
      CLASSES.CLASS_NAME:
        term: Class name
        means: 'The class''s name (Admiral Shares, Class A ...). Source: N-CEN SHARES_OUTSTANDING.CLASS_NAME.'
      CLASSES.EXPENSE_RATIO:
        term: Class expense ratio
        means: 'The class''s net expense ratio (gross where no net one is filed). Source: risk/return summary NetExpensesOverAssets, ExpensesOverAssets.'
        unit: '%'
      CLASSES.RETURN_3M:
        term: Class return, three months
        means: 'The class''s three monthly returns compounded. Source: N-PORT MONTHLY_TOTAL_RETURN.'
        unit: '%'
      CLASS_COUNT:
        term: Share classes
        means: 'How many share classes the fund has. Source: company_tickers_mf.json.'
        unit: classes
      PRIMARY_CLASS:
        term: Class of the ticker
        means: 'The class id of TICKER; its fees and returns are the page''s. Source: company_tickers_mf.json.'
      IS_ETF:
        term: ETF
        means: 'True when the fund is, or has, an exchange-traded share class. Source: N-CEN IS_ETF, ETF.tsv, SECURITY_EXCHANGE; the Nasdaq Trader
          directory.'
      IS_INDEX:
        term: Index fund
        means: 'True when the fund says it is an index fund, or its name names a tracked index. Source: N-CEN FUND_REPORTED_INFO.IS_INDEX.'
      IS_FUND_OF_FUNDS:
        term: Fund of funds
        means: 'True when the fund invests in other funds. Source: N-CEN FUND_REPORTED_INFO.IS_FUND_OF_FUND.'
      IS_TARGET_DATE:
        term: Target date
        means: 'True for a target-date fund. Source: N-CEN FUND_REPORTED_INFO.IS_TARGET_DATE.'
      IS_MASTER_FEEDER:
        term: Master-feeder
        means: 'True when the fund is part of a master-feeder structure. Source: N-CEN FUND_REPORTED_INFO.IS_MASTER_FEEDER.'
