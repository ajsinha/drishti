        means: 'The adviser''s LEI; opens its GLEIF record. Source: N-CEN ADVISER.ADVISER_LEI.'
      SUB_ADVISERS:
        term: Sub-advisers
        means: 'Up to six sub-advisers. Source: N-CEN ADVISER (sub-advisers).'
      CUSTODIAN:
        term: Custodian
        means: 'The fund''s custodian (not a sub-custodian). Source: N-CEN CUSTODIAN.CUSTODIAN_NAME.'
      CUSTODIAN_LEI:
        term: Custodian LEI
        means: 'The custodian''s LEI. Source: N-CEN CUSTODIAN.CUSTODIAN_LEI.'
      ADMINISTRATOR:
