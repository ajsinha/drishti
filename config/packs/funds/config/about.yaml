        term: Authorised participants
        means: 'The ten most active authorised participants by purchases and redemptions. Source: N-CEN AUTHORIZED_PARTICIPANT.'
      AUTHORISED_PARTICIPANTS.NAME:
        term: Participant
        means: 'The authorised participant. Source: N-CEN AUTHORIZED_PARTICIPANT.PARTICIPANT_NAME.'
      AUTHORISED_PARTICIPANTS.LEI:
        term: Participant LEI
        means: 'Its LEI. Source: N-CEN AUTHORIZED_PARTICIPANT.PARTICIPANT_LEI.'
      AUTHORISED_PARTICIPANTS.PURCHASES:
