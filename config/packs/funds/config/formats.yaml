# Funds formats. Weights, returns and ratios are stored as filed, in percent (7.1 means 7.1%), so these add the suffix without scaling.
formats:
  weight2: { type: number, decimals: 2, suffix: " %" }
  weight3: { type: number, decimals: 3, suffix: " %" }
  ratio2:  { type: number, decimals: 2, suffix: " %" }
  tilt2:   { type: number, decimals: 2, sign: always, suffix: " pts" }
  return2: { type: number, decimals: 2, sign: always, suffix: " %" }
