# Data contract of the fund kind (command FUND): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap fund`; reviewed by the pack owner (2.9.2): the review points are resolved in notes.
kind: fund
mnemonic: FUND
pack: funds
version: '1.0'
class: fundamental
status: active
title: Fund or ETF
description: 'A US mutual fund or ETF from SEC public data: the fact sheet, the look-through holdings with derivatives and counterparties, and
  the fund against its index.'
source: 'public data: SEC Form N-PORT, Form N-CEN and risk/return summary data sets, SEC and Nasdaq Trader ticker files, GLEIF (tools/publicdata/funds.py)'
grain: One row per fund or etf, keyed by TICKER.
key:
- TICKER
dated-by: snapshot
cadence:
  frequency: static
  due: quarterly, when the SEC publishes the data sets (tools/publicdata/funds.py)
storage:
  connector: funds-store
  plugin: delta
  domain: funds
  table: <root>/funds/fund/
  columns:
  - TICKER
  - NAME
  - TYPE
  - TICKERS
  - ADVISER
  - INDEX_ID
  - NET_ASSETS
  - EXPENSE_RATIO
  - HOLDING_COUNT
  - REPORT_DATE
  - RANK
  test-data:
  - data/testdata/funds/fund
fields:
- name: TICKER
  type: id
  presence: required
  description: 'The fund''s ticker: its ETF share class where it has one, else its oldest share class; a unit investment trust''s listed ticker.
    Source: SEC company_tickers_mf.json, N-CEN SECURITY_EXCHANGE, the Nasdaq Trader directory, company_tickers_exchange.json.'
  example: QQQ
- name: NAME
  type: text
  presence: required
  description: 'The series name as filed (upper-case names title-cased). Source: N-PORT FUND_REPORTED_INFO.SERIES_NAME.'
  example: Invesco QQQ Trust, Series 1
- name: TYPE
  type: text
  presence: required
  description: 'ETF, Mutual fund, Mutual fund with an ETF share class, or ETF (unit investment trust). Source: N-CEN FUND_REPORTED_INFO.IS_ETF,
    ETF.tsv, the Nasdaq Trader directory.'
  example: ETF
  enum:
  - ETF
  - Mutual fund
  - Mutual fund with an ETF share class
  - ETF (unit investment trust)
- name: FUND_KEY
  type: text
  presence: required
  description: 'The SEC series id, or CIK<cik> for a fund without one (a unit investment trust). Source: N-PORT FUND_REPORTED_INFO.SERIES_ID,
    REGISTRANT.CIK.'
  example: S000101292
- name: SERIES_ID
  type: id
  presence: optional
  description: 'The SEC series id (S and nine digits). Source: N-PORT FUND_REPORTED_INFO.SERIES_ID.'
  example: S000101292
- name: CIK
  type: text
  presence: required
  description: 'The registrant''s SEC Central Index Key (ten digits). Source: N-PORT REGISTRANT.CIK.'
  example: 0001067839
- name: REGISTRANT
  type: text
  presence: required
  description: 'The trust or company the series belongs to. Source: N-PORT REGISTRANT.REGISTRANT_NAME.'
  example: Invesco QQQ Trust, Series 1
- name: LEI
  type: text
  presence: required
  description: 'The fund''s (series'') LEI; opens its GLEIF record. Source: N-PORT FUND_REPORTED_INFO.SERIES_LEI.'
  example: 549300VY6FEJBCIMET58
- name: REGISTRANT_LEI
  type: text
  presence: required
  description: 'The registrant''s LEI. Source: N-PORT REGISTRANT.LEI.'
  example: 549300VY6FEJBCIMET58
- name: TICKERS
  type: text
  presence: required
  description: 'Every share class ticker, the fund''s own first; the type-ahead matches any of them (FUND VTSAX opens VTI). Source: SEC company_tickers_mf.json.'
  example: QQQ
- name: CLASSES
  type: record list
  presence: required
  description: 'Each share class: id, ticker, name, expense ratio and three-month return. Source: company_tickers_mf.json, N-CEN SHARES_OUTSTANDING,
    risk/return summary, N-PORT MONTHLY_TOTAL_RETURN.'
- name: CLASS_COUNT
  type: integer
  presence: required
  unit: classes
  description: 'How many share classes the fund has. Source: company_tickers_mf.json.'
  example: 1
- name: PRIMARY_CLASS
  type: text
  presence: optional
  description: 'The class id of TICKER; its fees and returns are the page''s. Source: company_tickers_mf.json.'
  example: C000271435
- name: IS_ETF
  type: boolean
  presence: required
  description: 'True when the fund is, or has, an exchange-traded share class. Source: N-CEN IS_ETF, ETF.tsv, SECURITY_EXCHANGE; the Nasdaq Trader
    directory.'
  example: true
- name: IS_INDEX
  type: boolean
  presence: required
  description: 'True when the fund says it is an index fund, or its name names a tracked index. Source: N-CEN FUND_REPORTED_INFO.IS_INDEX.'
  example: true
- name: IS_FUND_OF_FUNDS
  type: boolean
  presence: required
  description: 'True when the fund invests in other funds. Source: N-CEN FUND_REPORTED_INFO.IS_FUND_OF_FUND.'
  example: false
- name: IS_TARGET_DATE
  type: boolean
  presence: required
  description: 'True for a target-date fund. Source: N-CEN FUND_REPORTED_INFO.IS_TARGET_DATE.'
  example: false
- name: IS_MASTER_FEEDER
  type: boolean
  presence: required
  description: 'True when the fund is part of a master-feeder structure. Source: N-CEN FUND_REPORTED_INFO.IS_MASTER_FEEDER.'
  example: false
- name: INDEX_ID
  type: id
  presence: optional
  description: 'The us-equities index the fund tracks (SP500, NDX, DJIA), matched by its name; opens IDX. Source: computed from the name (N-CEN
    says whether a fund is an index fund, not which index).'
  example: NDX
- name: EXCHANGE
  type: text
  presence: optional
  description: 'Where the ETF share class lists. Source: the Nasdaq Trader directory; N-CEN SECURITY_EXCHANGE.'
  example: Nasdaq
- name: CREATION_UNIT
  type: amount
  presence: optional
  unit: shares
  description: 'Shares in one creation unit of the ETF. Source: N-CEN ETF.NUM_SHARES_PER_CREATION_UNIT.'
  example: 100000.0
- name: AP_COUNT
  type: integer
  presence: optional
  unit: firms
  description: 'How many authorised participants the ETF reports. Source: N-CEN AUTHORIZED_PARTICIPANT.'
  example: 40
- name: AUTHORISED_PARTICIPANTS
  type: record list
  presence: required
  description: 'The ten most active authorised participants by purchases and redemptions. Source: N-CEN AUTHORIZED_PARTICIPANT.'
- name: ADVISER
  type: text
  presence: optional
  description: 'The fund''s investment adviser. Source: N-CEN ADVISER.ADVISER_NAME.'
  example: The Vanguard Group, Inc.
- name: ADVISER_LEI
  type: text
  presence: optional
  description: 'The adviser''s LEI; opens its GLEIF record. Source: N-CEN ADVISER.ADVISER_LEI.'
  example: 5493002789CX3L0CJP65
- name: SUB_ADVISERS
  type: text
  presence: optional
  description: 'Up to six sub-advisers. Source: N-CEN ADVISER (sub-advisers).'
  example: Geode Capital Management, LLC
- name: CUSTODIAN
  type: text
  presence: optional
  description: 'The fund''s custodian (not a sub-custodian). Source: N-CEN CUSTODIAN.CUSTODIAN_NAME.'
  example: JPMorgan Chase Bank NA
- name: CUSTODIAN_LEI
  type: text
  presence: optional
  description: 'The custodian''s LEI. Source: N-CEN CUSTODIAN.CUSTODIAN_LEI.'
  example: 7H6GLXDRUGQFU57RNE97
- name: ADMINISTRATOR
  type: text
  presence: optional
  description: 'The fund''s administrator (not a sub-administrator). Source: N-CEN ADMIN.ADMIN_NAME.'
  example: THE VANGUARD GROUP, INC.
- name: TRANSFER_AGENT
  type: text
  presence: optional
  description: 'The fund''s transfer agent. Source: N-CEN TRANSFER_AGENT.TRANSFERAGENT_NAME.'
  example: The Vanguard Group, Inc.
- name: AUDITOR
  type: text
  presence: optional
  description: 'The registrant''s independent public accountant. Source: N-CEN PUBLIC_ACCOUNTANT.PUB_ACCOUNTANT_NAME.'
  example: PRICEWATERHOUSECOOPERS LLP
- name: AUDITOR_LEI
  type: text
  presence: optional
  description: 'The accountant''s LEI. Source: N-CEN PUBLIC_ACCOUNTANT.PUB_ACCOUNTANT_LEI.'
  example: 5493002GVO7EO8RNNS37
- name: LENDS_SECURITIES
  type: boolean
  presence: required
  description: 'True when the fund lent securities in the year. Source: N-CEN FUND_REPORTED_INFO.DID_LEND_SECURITIES.'
  example: false
- name: NCEN_PERIOD
  type: date
  presence: optional
  description: 'The fiscal year end of the N-CEN report used. Source: N-CEN SUBMISSION.REPORT_ENDING_PERIOD.'
  example: '2025-12-31'
- name: NCEN_ACCESSION
  type: text
  presence: optional
  description: 'The N-CEN filing used. Source: N-CEN SUBMISSION.ACCESSION_NUMBER.'
  example: 0000036405-26-000103
- name: GLEIF_RELATIONSHIPS
  type: record list
  presence: required
  description: 'The fund''s relationships in GLEIF: managed by, sub-fund of (its umbrella), feeder to. Source: GLEIF golden copy level 2 (rr.csv).'
- name: RANK
  type: integer
  presence: required
  description: 'The fund''s rank by net assets among the funds with a ticker. Source: computed.'
  example: 7
- name: REPORT_DATE
  type: date
  presence: required
  description: 'The date the N-PORT report is as of. Source: N-PORT SUBMISSION.REPORT_DATE.'
  example: '2026-06-30'
- name: FILED
  type: date
  presence: required
  description: 'The date the N-PORT report was filed. Source: N-PORT SUBMISSION.FILING_DATE.'
  example: '2026-08-28'
- name: ACCESSION
  type: text
  presence: required
  description: 'The N-PORT filing used. Source: N-PORT SUBMISSION.ACCESSION_NUMBER.'
  example: 0001067839-26-000030
- name: NPORT_URL
  type: text
  presence: required
  description: 'The filing''s folder on EDGAR. Source: computed from CIK and ACCESSION.'
  example: https://www.sec.gov/Archives/edgar/data/1067839/00010678392…
- name: TOTAL_ASSETS
  type: amount
  presence: required
  unit: USD
  description: 'Total assets. Source: N-PORT FUND_REPORTED_INFO.TOTAL_ASSETS.'
  example: 492478331787.0
- name: NET_ASSETS
  type: amount
  presence: required
  unit: USD
  description: 'Net assets: what the 200 are chosen by. Source: N-PORT FUND_REPORTED_INFO.NET_ASSETS.'
  example: 490103179942.0
- name: EXPENSE_RATIO
  type: rate
  presence: optional
  unit: '%'
  description: 'The net expense ratio of the fund''s share class (gross where no net one is filed). Source: risk/return summary NetExpensesOverAssets,
    ExpensesOverAssets.'
  example: 0.18
- name: GROSS_EXPENSE_RATIO
  type: rate
  presence: optional
  unit: '%'
  description: 'Total annual operating expenses before waivers. Source: risk/return summary ExpensesOverAssets.'
  example: 0.18
- name: MANAGEMENT_FEE
  type: amount
  presence: optional
  unit: '%'
  description: 'The management fee. Source: risk/return summary ManagementFeesOverAssets.'
  example: 0.18
- name: TURNOVER
  type: amount
  presence: optional
  unit: '%'
  description: 'Portfolio turnover in the last fiscal year. Source: risk/return summary PortfolioTurnoverRate.'
  example: 7.98
- name: PROSPECTUS_FILED
  type: date
  presence: optional
  description: 'The date of the risk/return summary used. Source: risk/return summary sub.tsv filed.'
  example: '2025-12-19'
- name: ANNUAL_RETURNS
  type: record list
  presence: required
  description: 'Up to ten calendar-year total returns of the share class (the prospectus bar chart). Source: risk/return summary AnnualReturnPercent,
    AnnlRtrPct.'
- name: RETURN_LAST_YEAR
  type: amount
  presence: optional
  unit: '%'
  description: 'The latest calendar-year return filed. Source: risk/return summary AnnualReturnPercent, AnnlRtrPct.'
  example: 25.58
- name: RETURN_YEAR
  type: integer
  presence: optional
  description: 'The year of RETURN_LAST_YEAR. Source: risk/return summary.'
  example: 2024
- name: RETURN_3M
  type: amount
  presence: required
  unit: '%'
  description: 'The share class''s three monthly returns of the report compounded. Source: N-PORT MONTHLY_TOTAL_RETURN.'
  example: 27.64
- name: FLOWS
  type: record list
  presence: required
  description: 'Each of the report''s three months: sales, reinvestments, redemptions, net flow and the class''s return. Source: N-PORT FUND_REPORTED_INFO
    SALES_FLOW_MON1-3 ....'
- name: SALES
  type: amount
  presence: required
  unit: USD
  description: 'The three months'' sales. Source: N-PORT SALES_FLOW_MON1-3.'
  example: 216564959011.07
- name: REDEMPTIONS
  type: amount
  presence: required
  unit: USD
  description: 'The three months'' redemptions. Source: N-PORT REDEMPTION_FLOW_MON1-3.'
  example: 205720139470.74
- name: REINVESTMENT
  type: amount
  presence: required
  unit: USD
  description: 'The three months'' reinvested distributions. Source: N-PORT REINVESTMENT_FLOW_MON1-3.'
  example: 0
- name: NET_FLOW
  type: amount
  presence: required
  unit: USD
  description: 'Sales plus reinvestment less redemptions over the three months. Source: computed.'
  example: 10844819540.33
- name: HOLDING_COUNT
  type: integer
  presence: required
  unit: holdings
  description: 'Every holding the fund reported. Source: N-PORT FUND_REPORTED_HOLDING.'
  example: 105
- name: HOLDINGS_SHOWN
  type: integer
  presence: required
  unit: holdings
  description: 'Holdings kept in HOLDINGS (the 600 largest by value). Source: computed.'
  example: 105
- name: HOLDINGS_REST_COUNT
  type: integer
  presence: required
  unit: holdings
  description: 'Holdings not kept. Source: computed.'
  example: 0
- name: HOLDINGS_REST_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The weight of the holdings not kept. Source: computed.'
  example: 0
- name: HOLDINGS_REST_VALUE
  type: amount
  presence: required
  unit: USD
  description: 'The value of the holdings not kept. Source: computed.'
  example: 0
- name: TOP10_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The weight of the ten largest holdings. Source: computed.'
  example: 45.0
- name: TOP50_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The weight of the fifty largest holdings. Source: computed.'
  example: 87.448
- name: HHI
  type: amount
  presence: required
  description: 'The sum of the squared weights (as fractions): 1 is one holding, near 0 is many small ones. Source: computed.'
  example: 0.02927
- name: LARGEST
  type: text
  presence: required
  description: 'The largest holding by value. Source: computed.'
  example: NVIDIA Corp.
- name: LARGEST_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The largest holding''s weight. Source: computed.'
  example: 7.596757
- name: WITH_LEI
  type: integer
  presence: required
  unit: holdings
  description: 'Holdings whose issuer LEI was filed. Source: computed.'
  example: 101
- name: EQUITY_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The weight of common equity (asset category EC). Source: computed.'
  example: 99.927
- name: US_COMPANY_PCT
  type: rate
  presence: required
  unit: '% of net assets'
  description: 'The weight of the holdings that are us-equities companies. Source: computed.'
  example: 91.196
- name: US_COMPANIES
  type: integer
  presence: required
  unit: companies
  description: 'How many us-equities companies the fund holds. Source: computed.'
  example: 79
- name: BY_ASSET
  type: record list
  presence: required
  description: 'The weight by N-PORT asset category. Source: computed.'
- name: BY_ISSUER_TYPE
  type: record list
  presence: required
  description: 'The weight by issuer type. Source: computed.'
- name: BY_COUNTRY
  type: record list
  presence: required
  description: 'The weight by country, the largest ten. Source: computed.'
- name: BY_SECTOR
  type: record list
  presence: required
  description: 'The weight of the us-equities companies held, by SIC division. Source: computed.'
- name: DERIVATIVE_COUNT
  type: integer
  presence: required
  unit: positions
  description: 'How many derivatives the fund holds. Source: computed.'
  example: 1
- name: DERIVATIVES_NOTIONAL
  type: amount
  presence: required
  unit: USD
  description: 'The notionals added up, by size. Source: computed.'
  example: 327348711.0
- name: DERIVATIVES
  type: record list
  presence: required
  description: 'The fifty largest derivative positions by notional, with their counterparties. Source: N-PORT part C.11.'
- name: COUNTERPARTIES
  type: record list
  presence: required
  description: 'The counterparties of the derivatives and repos, by notional: positions, notional, value. Source: N-PORT DERIVATIVE_COUNTERPARTY,
    REPURCHASE_COUNTERPARTY.'
- name: COUNTERPARTY_COUNT
  type: integer
  presence: required
  unit: counterparties
  description: 'How many counterparties. Source: computed.'
  example: 1
- name: HOLDINGS
  type: record list
  presence: required
  description: 'The 600 largest holdings by value, each with its identifiers and links. Source: N-PORT FUND_REPORTED_HOLDING, IDENTIFIERS.'
- name: VIEWS
  type: record list
  presence: required
  description: 'The page''s tabs: Look-through holdings, and the fund against its index when there is one. Source: computed.'
- name: PROVENANCE
  type: record
  presence: required
  description: 'Where the record comes from, one object: SOURCE (the SEC data sets read), LICENCE, RETRIEVED_AT (the date the data was downloaded, YYYY-MM-DD) and NOTE.'
- name: MOST_HELD_COMPANY
  type: id
  presence: optional
  description: 'The largest us-equities company the fund holds. Source: computed.'
  example: NVDA
  link: us-company
- name: MOST_HELD_NAME
  type: text
  presence: optional
  description: 'That company''s name. Source: us-equities.'
  example: Nvidia
- name: ALSO_HELD_BY
  type: record list
  presence: required
  description: 'The ten other funds holding that company the most, by value. Source: computed from fund-holder.'
- name: VS_INDEX
  type: record
  presence: optional
  description: 'The fund against its tracked index (or the S&P 500 for reference); index weights computed from SEC data. Source: computed.'
- name: ACTIVE_SHARE
  type: rate
  presence: optional
  unit: '%'
  description: 'Half the sum of the differences between the fund''s and the index''s weights (VS_INDEX). Source: computed.'
  example: 11.21
nested:
  CLASSES[]:
  - name: CLASS_ID
    type: id
    presence: required
    description: 'The SEC class id (C and nine digits). Source: company_tickers_mf.json classId.'
    example: C000271435
  - name: TICKER
    type: id
    presence: required
    description: 'The share class''s ticker. Source: company_tickers_mf.json symbol.'
    example: QQQ
  - name: EXPENSE_RATIO
    type: rate
    presence: optional
    unit: '%'
    description: 'The class''s net expense ratio (gross where no net one is filed). Source: risk/return summary NetExpensesOverAssets, ExpensesOverAssets.'
    example: 0.18
  - name: RETURN_3M
    type: amount
    presence: optional
    unit: '%'
    description: 'The class''s three monthly returns compounded. Source: N-PORT MONTHLY_TOTAL_RETURN.'
    example: 27.64
  - name: CLASS_NAME
    type: text
    presence: optional
    description: 'The class''s name (Admiral Shares, Class A ...). Source: N-CEN SHARES_OUTSTANDING.CLASS_NAME.'
    example: Investor Shares
  GLEIF_RELATIONSHIPS[]:
  - name: TYPE
    type: text
    presence: required
    description: 'Managed by, Sub-fund of or Feeder to. Source: GLEIF rr.csv Relationship.RelationshipType.'
    example: Managed by
    enum:
    - Managed by
    - Sub-fund of
    - Feeder to
  - name: LEI
    type: text
    presence: required
    description: 'The manager''s, umbrella''s or master fund''s LEI. Source: GLEIF rr.csv Relationship.EndNode.NodeID.'
    example: EJW8VXOT5RJ3PPMVEB49
  - name: STATUS
    type: text
    presence: required
    description: 'ACTIVE or INACTIVE. Source: GLEIF rr.csv Relationship.RelationshipStatus.'
    example: ACTIVE
  ANNUAL_RETURNS[]:
  - name: YEAR
    type: text
    presence: required
    description: 'The calendar year. Source: risk/return summary num.tsv ddate.'
    example: '2015'
  - name: RETURN
    type: amount
    presence: required
    unit: '%'
    description: 'The year''s total return. Source: risk/return summary AnnualReturnPercent, AnnlRtrPct.'
    example: 9.53
  FLOWS[]:
  - name: MONTH
    type: text
    presence: required
    description: 'The month (yyyy-mm), the third being the report''s. Source: computed from REPORT_DATE.'
    example: 2026-04
  - name: SALES
    type: amount
    presence: required
    unit: USD
    description: 'Shares sold (subscriptions), by value. Source: N-PORT FUND_REPORTED_INFO.SALES_FLOW_MONn.'
    example: 56960297589.31
  - name: REINVESTMENT
    type: amount
    presence: required
    unit: USD
    description: 'Distributions reinvested. Source: N-PORT FUND_REPORTED_INFO.REINVESTMENT_FLOW_MONn.'
    example: 0.0
  - name: REDEMPTIONS
    type: amount
    presence: required
    unit: USD
    description: 'Shares redeemed, by value. Source: N-PORT FUND_REPORTED_INFO.REDEMPTION_FLOW_MONn.'
    example: 46510905488.86
  - name: NET_FLOW
    type: amount
    presence: required
    unit: USD
    description: 'Sales plus reinvestment less redemptions. Source: computed.'
    example: 10449392100.45
  - name: RETURN
    type: amount
    presence: required
    unit: '%'
    description: 'The share class''s total return in the month. Source: N-PORT MONTHLY_TOTAL_RETURN.MONTHLY_TOTAL_RETURNn.'
    example: 15.656032
  BY_ASSET[]:
  - name: KEY
    type: text
    presence: required
    description: 'The code grouped by (an asset category, issuer type, country or SIC division). Source: computed.'
    example: EC
  - name: LABEL
    type: text
    presence: required
    description: 'The code in words; Other (n) gathers the smallest. Source: computed.'
    example: Common equity
  - name: PCT
    type: rate
    presence: required
    unit: '% of net assets'
    description: 'The holdings'' weight added up. Source: computed from N-PORT PERCENTAGE.'
    example: 99.927
  - name: VALUE
    type: amount
    presence: required
    unit: USD
    description: 'The holdings'' value added up. Source: computed from N-PORT CURRENCY_VALUE.'
    example: 489744804272.0
  - name: COUNT
    type: integer
    presence: required
    unit: holdings
    description: 'The number of holdings in the group. Source: computed.'
    example: 102
  BY_ISSUER_TYPE[]:
  - name: KEY
    type: text
    presence: required
    description: 'The code grouped by (an asset category, issuer type, country or SIC division). Source: computed.'
    example: CORP
  - name: LABEL
    type: text
    presence: required
    description: 'The code in words; Other (n) gathers the smallest. Source: computed.'
    example: Corporate
  - name: PCT
    type: rate
    presence: required
    unit: '% of net assets'
    description: 'The holdings'' weight added up. Source: computed from N-PORT PERCENTAGE.'
    example: 99.927
  - name: VALUE
    type: amount
    presence: required
