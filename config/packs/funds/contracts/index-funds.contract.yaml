# Data contract of the index-funds kind (command TRACK): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap index-funds`; reviewed by the pack owner (2.9.2): the review points are resolved in notes.
kind: index-funds
mnemonic: TRACK
pack: funds
version: '1.0'
class: fundamental
status: active
title: Funds tracking an index
description: The funds and ETFs of the pack that track one us-equities index, by net assets, with their cost and how closely they follow it.
source: 'public data: SEC Form N-PORT, Form N-CEN and risk/return summary data sets, SEC and Nasdaq Trader ticker files, GLEIF (tools/publicdata/funds.py)'
grain: One row per funds tracking an index, keyed by INDEX.
key:
- INDEX
dated-by: snapshot
cadence:
  frequency: static
  due: quarterly, when the SEC publishes the data sets (tools/publicdata/funds.py)
storage:
  connector: funds-store
  plugin: delta
  domain: funds
  table: <root>/funds/index-funds/
  columns:
  - INDEX
  - NAME
  - FUNDS
  - TOTAL_NET_ASSETS
  test-data:
  - data/testdata/funds/index-funds
fields:
- name: INDEX
  type: id
  presence: required
  description: 'The us-equities index code (SP500, NDX, DJIA). Source: us-equities index-membership.INDEX.'
  example: NDX
- name: NAME
  type: text
  presence: required
  description: 'The index''s name. Source: us-equities index-membership.NAME.'
  example: Nasdaq-100
- name: FUNDS
  type: integer
  presence: required
  unit: funds
  description: 'How many of the pack''s funds track it. Source: computed.'
  example: 2
- name: ETFS
  type: integer
  presence: required
  unit: funds
  description: 'How many of them are ETFs. Source: computed.'
  example: 2
- name: TOTAL_NET_ASSETS
  type: amount
  presence: required
  unit: USD
  description: 'Their net assets added up. Source: computed from N-PORT NET_ASSETS.'
  example: 587254661099.0
- name: LARGEST
  type: text
  presence: required
  description: 'The largest tracking fund. Source: computed.'
  example: QQQ
- name: ROWS
  type: record list
  presence: required
  description: 'The tracking funds by net assets. Source: computed.'
- name: PROVENANCE
  type: record
  presence: required
  description: 'Nested: see nested PROVENANCE'
nested:
  ROWS[]:
  - name: FUND
    type: id
    presence: required
    description: 'The fund''s ticker; opens FUND. Source: computed.'
    example: QQQ
    link: fund
  - name: NAME
    type: text
    presence: required
    description: 'Its name. Source: N-PORT SERIES_NAME.'
    example: Invesco QQQ Trust, Series 1
  - name: TYPE
    type: text
    presence: required
    description: 'Its type. Source: N-CEN IS_ETF.'
    example: ETF
    enum:
    - ETF
    - Mutual fund
    - Mutual fund with an ETF share class
    - ETF (unit investment trust)
  - name: NET_ASSETS
    type: amount
    presence: required
    unit: USD
    description: 'Its net assets. Source: N-PORT NET_ASSETS.'
    example: 490103179941.66
  - name: EXPENSE_RATIO
    type: rate
    presence: optional
    unit: '%'
    description: 'Its net expense ratio. Source: risk/return summary NetExpensesOverAssets.'
    example: 0.18
  - name: MEMBERS_HELD
    type: amount
    presence: required
    unit: companies
    description: 'Listed members it holds. Source: computed.'
    example: 55
  - name: ACTIVE_SHARE
    type: rate
    presence: required
    unit: '%'
    description: 'Against the computed index weights. Source: computed.'
    example: 27.31
  - name: REPORT_DATE
    type: date
    presence: required
    description: 'Its N-PORT report date. Source: N-PORT REPORT_DATE.'
    example: '2026-06-30'
  - name: IS_ETF
    type: boolean
    presence: required
    description: 'True for an ETF. Source: N-CEN IS_ETF.'
    example: true
  PROVENANCE:
  - name: SOURCE
    type: text
    presence: required
    description: 'Where the data comes from. Source: written by tools/packgen/funds/build.py.'
    example: 'U.S. Securities and Exchange Commission: Form N-PORT, Form …'
  - name: LICENCE
    type: text
    presence: required
    description: 'The source''s licence (public domain). Source: written by tools/packgen/funds/build.py.'
    example: Public domain (U.S. Government work); SEC fair access polic…
  - name: RETRIEVED_AT
    type: date
    presence: required
    description: 'The date the data sets were downloaded. Source: the download cache.'
    example: '2026-10-26'
  - name: NOTE
    type: text
    presence: required
    description: 'What the document holds and from which filings. Source: written by tools/packgen/funds/build.py.'
    example: The pack's funds whose name names this index (N-CEN says wh…
links:
- field: ROWS[].FUND
  kind: fund
validation:
- rule: required
  fields:
  - INDEX
  - NAME
  - FUNDS
  - ETFS
  - TOTAL_NET_ASSETS
  - LARGEST
  - ROWS
  - PROVENANCE
- rule: unique
  key:
  - INDEX
  per: snapshot
- rule: link
  field: ROWS[].FUND
  kind: fund
- rule: enum
  field: ROWS[].TYPE
  values:
  - ETF
  - Mutual fund
  - Mutual fund with an ETF share class
  - ETF (unit investment trust)
notes:
- "Reviewed by the pack owner (2.9.2): every figure is as the SEC data sets publish it; amounts are US dollars as N-PORT reports them (CURRENCY_VALUE), weights and ratios are in percent as filed (a weight of 7.1 is 7.1% of net assets)."
- "A holding's BALANCE is in its UNIT (NS shares, PA principal amount, NC contracts) and a derivative's NOTIONAL in the currency it was filed in; neither is converted."
- "A snapshot: refreshed when tools/publicdata/funds.py runs (the SEC publishes each data set quarterly); the same documents on every business day of the demo lake."
- "Optional fields are empty where the fund did not file them: N-CEN facts for a fund whose census is not in the four quarters read, fees and returns for a fund without a risk/return summary (a unit investment trust)."
review: []
