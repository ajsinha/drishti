# The packs a server enables when neither DRISHTI_PACKS (drishti.packs.enabled) nor a lens names them: the full Drishti, by module
# (docs/architecture/DOMAIN_MODULES.md section 8); a module that is off brings none of its packs. The one list: the server reads it from its
# jar (drishti-packs copies this file in at build), the console from this folder; Docker and the stack pass DRISHTI_PACKS through only when
# it is set.
packs:
  core: [core]                                                       # the core's packs
  banking: [market-data, trading, counterparty-risk, market-risk]    # the banking module's (loaded only while it is on)
  economy: [world-economy, news-and-markets]                         # the economy module's (loaded only while it is on)
