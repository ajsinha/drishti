# GDELT events · the public-sector module's world-events pack (docs/guides/PUBLIC_SECTOR_GUIDE.md): the GDELT Project's daily events
# reduced to events and tone by country and CAMEO category, filled daily by the gdelt-events feed (config/feeds/gdelt-events.yaml) into
# the newslake lake.
pack: gdelt-events
domain: publicsector
version: 1.0.0
code: GDLT
title: GDELT events
description: >-
  What the world's news reported about each country yesterday, from the GDELT Project's daily event files: the number of events whose
  first actor is the country, how widely they were reported, their average tone and Goldstein scale, the share of conflict and of
  cooperation, the events by CAMEO category, thirty days of history and the most-mentioned stories, each a link to the original. The
  world map is shaded by tone. Free and open with a citation (GDELT terms). Filled daily by the gdelt-events feed into the newslake lake.
kinds: [event-country]
sutras: sutras
mnemonics:
  GDELT: { kind: event-country, label: World events by country }
graph:
  id-patterns:
    - { pattern: "^GDELT-", kind: event-country }
  badges:
    event-country: "fmt($.AVG_TONE, 'price2') + ' tone'"
connectors:
  gdelt-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds: [event-country]
    settings:
      lake: newslake
      lake-tables: gdelt.event-country
lake:                  # the recommended entries of its lake tables (the shipped lake file holds the same)
  tables:
    gdelt.event-country:
      id: EVENT_COUNTRY_ID
      promote:
      - ISO3
      - COUNTRY_NAME
      - DATE
      - EVENTS
      - MENTIONS
      - AVG_TONE
      - AVG_GOLDSTEIN
      - CONFLICT_SHARE
      retention: 90
routes:                # the connector that answers each kind
  event-country: gdelt-store
form:                          # FORM gdelt-events: the search form of its kind
  event-country:
    - { path: EVENT_COUNTRY_ID, label: Country id, type: id, group: Identity }
    - { path: COUNTRY_NAME, label: Country, type: text, group: Identity }
    - { path: AVG_TONE, label: Average tone, type: number, group: The day }
    - { path: CONFLICT_SHARE, label: "Conflict, %", type: number, group: The day }
    - { path: EVENTS, type: number, group: The day }
console:
  examples:
    - ["GDELT GDELT-USA", "The United States · yesterday's events, tone, the conflict share, by category, the top stories"]
    - ["GDELT GDELT-GBR", "The United Kingdom"]
    - ["GDELT GDELT-CAN", "Canada"]
  help: config/help.yaml
