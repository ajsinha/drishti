# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: bond
version: 1
description: "A listed bond: terms, price, yield, spreads and analytics."
doc:
  summary: "A listed bond: terms, price, yield, spreads and analytics."
  description: >-
    A listed bond: terms, price, yield, spreads and analytics. One page per bond (security master), its panels: terms; coupons;
    price, last 30 days; how the view was built; the entities it links to. The strip gives Issuer, Coupon, Maturity, Price,
    Yield, Z-spread, Duration and Rating. Linked entities: issuer (issuer) and benchmark curve (ir-curve).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/bond/BND-BRVERD054608"
    - "BND BND-BRVERD054608"
  since: "2.7.0"
match: { kind: bond, priority: 10 }
title: { pill: Market data · Bond (security master), id: $.ISIN }
strip:
  - { label: Issuer, bind: $.ISSUER_NAME }
  - { label: Coupon, bind: $.COUPON, fmt: pct4 }
  - { label: Maturity, bind: $.MATURITY, fmt: date }
  - { label: Price, bind: $.PRICE, fmt: price2, emphasis: true }
  - { label: Yield, bind: $.YIELD, fmt: pct4 }
  - { label: Z-spread, bind: $.Z_SPREAD, fmt: bp1 }
  - { label: Duration, bind: $.MOD_DURATION, fmt: price2 }
  - { label: Rating, bind: $.RATING }
panels:
  - { use: field-list@1, with: { id: terms, title: Terms, key: F2, rows: $.TERMS } }
  - id: coupons
    kind: table
    title: Coupons
    key: F3
    rows: $.COUPONS
    columns:
      - { label: Date, bind: "@.DATE", fmt: date }
      - { label: Coupon, bind: "@.AMOUNT", fmt: amount2 }
  - { use: series-line@1, with: { id: history, title: "Price, last 30 days", area: right, rows: $.HISTORY, x: DATE, y: PRICE } }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.ISSUER, 'issuer')", F8: impact, F9: raw }
