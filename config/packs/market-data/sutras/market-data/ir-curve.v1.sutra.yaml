# Hand-written since 2.7.0 (Sutra Next phase 1): the first screen built from the Drishti UI kit (config/ui-kit/fragments,
# loaded by every server). tools/packgen/banking/make_sutras.py leaves it alone (HAND_WRITTEN); SutraNextEquivalenceTest proves it
# draws exactly what the generated layout drew.
rachana: 1
sutra: ir-curve
version: 1
description: "Discounting (OIS), projection (IBOR/term RFR), government or basis curve for a currency."
doc:
  summary: "An interest rate curve: its zero rates, its pillars and its 1Y forwards, with the 10Y level and the 2s10s slope."
  description: >-
    One page per curve (discounting OIS, projection IBOR or term RFR, government or basis) for a currency: the zero-rate
    curve, the pillars it was built from (instrument, market quote, zero rate, discount factor), the 1Y forward curve beside
    it, how the view was built and the entities it links to (its calendar). The strip gives the currency, curve type, index,
    the 10Y zero rate, the 2s10s slope in basis points, the number of pillars and the as-of date.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/ir-curve/CRV-USD-OIS"
    - "CRV CRV-AUD-OIS"
  since: "2.7.0"
match: { kind: ir-curve, priority: 10 }
title: { pill: Market data · Interest rate curve, id: $.CURVE_ID }
strip:
  - { label: Currency, bind: $.CURRENCY }
  - { label: Type, bind: $.CURVE_TYPE }
  - { label: Index, bind: $.INDEX }
  - { label: "10Y", bind: $.TEN_Y, fmt: pct4, emphasis: true }
  - { label: "2s10s", bind: $.SLOPE_2S_10S, fmt: bp1, tone: sign }
  - { label: Points, bind: size($.POINTS) }
  - { label: As of, bind: $.AS_OF, fmt: date }
panels:
  - { use: curve-overview@1, with: { curve-code: CRV, curve-key: F2, table-key: F3 } }    # the zero-rate line, then the pillars
  - { use: series-line@1, with: { id: forwards, title: "1Y forward rates (%)", area: right, rows: $.FORWARDS, x: TENOR, y: RATE, fmt: price2 } }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.CALENDAR, 'calendar')", F8: impact, F9: raw }
