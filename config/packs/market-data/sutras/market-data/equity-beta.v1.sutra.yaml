# Hand-written (2.9.2): the computed kind equity-beta (EQB), an equity's beta against its index worked out by the server's Java engine
# (the reactive connector equity-analytics, tools/packgen/banking/corr_kinds.py) when the page opens; never stored. Without a Sutra the
# inferred layout rounded the beta, alpha and correlation to whole numbers ("0"): the figures here carry the EQ page's formats.
rachana: 1
sutra: equity-beta
version: 1
description: "An equity's beta, alpha, correlation and R squared against its index, computed from both price histories when asked."
doc:
  summary: "An equity's beta against its index, computed from both price histories when the page opens."
  description: >-
    One page per equity asked for (EQB EQ-NVTK; the window rides on the id, EQB EQ-NVTK~window=60): the strip gives the beta, the
    index it is measured against, the correlation, R squared and the window; the regression panel the beta, the alpha (the intercept,
    a daily log return), the correlation and R squared to four decimals and both annualised volatilities; the window panel the returns
    the two histories allow and the dates they span (docs/guides/GROUPINGS_ANALYTICS_GUIDE.md section 17). The equity's own page (EQ)
    shows the same beta in its Beta panel.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/equity-beta/EQ-NVTK"
    - "EQB EQ-NVTK"
  since: "2.9.2"
match: { kind: equity-beta, priority: 10 }
title: { pill: Market data · Equity beta (computed), id: $.EQUITY }
strip:
  - { label: Beta, bind: $.BETA, fmt: price2, emphasis: true }
  - { label: Index, bind: $.INDEX }
  - { label: Correlation, bind: $.CORRELATION, fmt: price2 }
  - { label: R squared, bind: $.R_SQUARED, fmt: price2 }
  - { label: Returns, bind: $.AVAILABLE, fmt: amount0 }
panels:
  - id: regression
    kind: kv
    title: The regression of the daily log returns
    key: F2
    columns:
      - { label: Equity, bind: $.EQUITY }
      - { label: Index, bind: $.INDEX }
      - { label: Beta, bind: $.BETA, fmt: price4 }
      - { label: "Alpha (a daily log return)", bind: $.ALPHA, fmt: pct4 }
      - { label: Correlation, bind: $.CORRELATION, fmt: price4 }
      - { label: R squared, bind: $.R_SQUARED, fmt: price4 }
      - { label: "Volatility (annualised)", bind: $.VOLATILITY, fmt: pct2 }
      - { label: "Index volatility (annualised)", bind: $.INDEX_VOLATILITY, fmt: pct2 }
  - id: window
    kind: kv
    title: The window
    area: right
    columns:
      - { label: "Window (0: every return)", bind: $.WINDOW, fmt: amount0 }
      - { label: Returns available, bind: $.AVAILABLE, fmt: amount0 }
      - { label: From, bind: $.FROM, fmt: date }
      - { label: To, bind: $.TO, fmt: date }
  - { use: data-provenance@1 }
keys: { F9: raw }
