rachana: 1
sutra: commodity-vol-surface
version: 1
description: Implied vols by delivery month and moneyness.
doc:
  summary: "Implied vols by delivery month and moneyness."
  description: >-
    Implied vols by delivery month and moneyness. One page per commodity volatility surface, its panels: implied vol by contract
    × moneyness (%); vol (%); ATM by month; how the view was built. The strip gives Commodity and Front ATM.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/commodity-vol-surface/CMDV-BRENT"
    - "CMDV CMDV-BRENT"
  since: "2.7.0"
match: { kind: commodity-vol-surface, priority: 10 }
title: { pill: Market data · Commodity volatility surface, id: $.SURFACE_ID }
strip:
  - { label: Commodity, bind: $.COMMODITY }
  - { label: Front ATM, bind: $.ATM_FRONT, fmt: price2, emphasis: true }
panels:
  - id: surface
    kind: surface
    title: Implied vol by contract × moneyness (%)
    code: SURF
    key: F4
    rows: $.GRID
    y: MONTH
    columns:
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: "100%", bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
  - id: grid
    kind: table
    title: Vol (%)
    key: F2
    rows: $.GRID
    columns:
      - { label: Month, bind: "@.MONTH" }
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: ATM, bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
  - { use: series-line@1, with: { id: atm, title: ATM by month, area: right, rows: $.GRID, x: MONTH, y: M_100 } }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
