# Hand-written since 2.9.2 (tools/packgen/banking/make_sutras.py HAND_WRITTEN): a correlation set keeps its factors only; its
# correlations are the computed kind correlation-result (corr_kinds.py), read here with the page's window and estimator.
rachana: 1
sutra: correlation-matrix
version: 1
description: "A factor set's pairwise correlations, computed when the page opens from the factors' price history, for a window and an estimator."
doc:
  summary: "A correlation set: its factors and their correlations computed from price history, with the window and the estimator to pick."
  description: >-
    One page per correlation set (basket, quanto and spread products name one). The set keeps only its factors (equities and FX
    pairs); the correlations are computed when the page opens (since 2.9.2; docs/guides/PACK_DEVELOPER_GUIDE.md) from each
    factor's daily closes in the lake, aligned on the dates every factor has: the daily log returns over the window (All: every
    return the history holds; or the last 20 or 10), correlated by the estimator (Pearson, the sample correlation, by default; or
    Ledoit-Wolf, shrunk toward no correlation by the optimal intensity). The strip gives the set, its size, the average pairwise
    correlation and the window used; the pairs table and the factors' returns and volatilities follow, with how the answer was
    computed.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/correlation-matrix/CORR-EU-EQ"
    - "CORR CORR-G10FX"
  since: "2.7.0"
match: { kind: correlation-matrix, priority: 10 }
title: { pill: Market data · Correlation matrix (computed), id: $.MATRIX_ID, with: $.NAME }
controls:
  - { id: window, kind: segmented, label: Window (daily returns), options: ["0", "20", "10"], default: "0" }
  - { id: estimator, kind: segmented, label: Estimator, options: ["pearson", "ledoit-wolf"], default: "pearson" }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Size, bind: size($.FACTORS) }
panels:
  - id: average
    kind: metric
    title: Average pairwise correlation
    key: F2
    source: { kind: correlation-result, id: "$.MATRIX_ID", params: { window: ctl.window, estimator: ctl.estimator } }
    value: "$src.AVERAGE"
    label: "Average ρ"
    fmt: price2
    caption: "${$src.ESTIMATOR}, ${$src.WINDOW} daily returns, ${$src.FROM} to ${$src.TO} · lowest ${fmt($src.MIN_RHO, 'price2')}, highest ${fmt($src.MAX_RHO, 'price2')}"
  - id: pairs
    kind: table
    title: Pairs (ρ of the daily log returns)
    key: F3
    source: { kind: correlation-result, id: "$.MATRIX_ID", params: { window: ctl.window, estimator: ctl.estimator } }
    rows: "$src.PAIRS"
    columns:
      - { label: Factor 1, bind: "@.A" }
      - { label: Factor 2, bind: "@.B" }
      - { label: "ρ", bind: "@.RHO", fmt: price2, tone: sign }
  - id: factors
    kind: table
    title: The factors over the window
    key: F4
    source: { kind: correlation-result, id: "$.MATRIX_ID", params: { window: ctl.window, estimator: ctl.estimator } }
    rows: "$src.FACTOR_STATS"
    columns:
      - { label: Factor, bind: "@.FACTOR" }
      - { label: Last, bind: "@.LAST", fmt: price2 }
      - { label: Return, bind: "@.RETURN", fmt: pct2, tone: sign }
      - { label: Volatility (annualised), bind: "@.VOLATILITY", fmt: pct2 }
  - id: stamp
    kind: kv
    title: How the answer was computed
    area: right
    source: { kind: correlation-result, id: "$.MATRIX_ID", params: { window: ctl.window, estimator: ctl.estimator } }
    rows: "$src.STAMP"
  - use: explainer-note@1
    with:
      title: How the correlations are computed
      area: right
      text: "Computed when the page opens from each factor's daily closes in the lake (an equity's close, an FX pair's mid), aligned on the dates every factor has: the daily log returns over the window (0 is every return the history holds), correlated by Pearson (the sample correlation) or Ledoit-Wolf (shrunk toward no correlation; SHRINKAGE says how far). Nothing is stored; the set keeps only its factors."
  - { use: field-list@1, with: { id: set, title: The set, rows: $, area: right } }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
