# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: credit-curve
version: 1
description: "CDS par spreads by tenor, recovery and implied default probabilities."
doc:
  summary: "CDS par spreads by tenor, recovery and implied default probabilities."
  description: >-
    CDS par spreads by tenor, recovery and implied default probabilities. One page per credit curve, its panels: par spreads
    (bp); term structure; how the view was built; the entities it links to. The strip gives Reference entity, 5Y spread,
    Recovery, Seniority, Doc clause and 1Y PD. Linked entities: reference entity (issuer).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/credit-curve/CDS-BUND"
    - "CDS CDS-BUND"
  since: "2.7.0"
match: { kind: credit-curve, priority: 10 }
title: { pill: Market data · Credit curve, id: $.CURVE_ID }
strip:
  - { label: Reference entity, bind: $.ISSUER_NAME }
  - { label: "5Y spread", bind: $.SPREAD_5Y, fmt: bp1, emphasis: true }
  - { label: Recovery, bind: $.RECOVERY, fmt: pct0 }
  - { label: Seniority, bind: $.SENIORITY }
  - { label: Doc clause, bind: $.DOC_CLAUSE }
  - { label: "1Y PD", bind: $.PD_1Y, fmt: pct2 }
panels:
  - { use: series-line@1, with: { id: spreads, title: Par spreads (bp), key: F2, y: SPREAD } }
  - id: points
    kind: table
    title: Term structure
    key: F3
    rows: $.POINTS
    columns:
      - { label: Tenor, bind: "@.TENOR" }
      - { label: Spread (bp), bind: "@.SPREAD", fmt: price2 }
      - { label: Hazard, bind: "@.HAZARD", fmt: pct2 }
      - { label: Survival, bind: "@.SURVIVAL", fmt: df4 }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.ISSUER, 'issuer')", F8: impact, F9: raw }
