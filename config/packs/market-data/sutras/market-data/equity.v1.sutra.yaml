# Hand-written since 2.9.2 (tools/packgen/banking/make_sutras.py HAND_WRITTEN): the beta is the computed kind equity-beta (EQB), worked out
# from the equity's and its index's price histories when the page opens (corr_kinds.py), not the security master's stored BETA.
rachana: 1
sutra: equity
version: 1
description: "A listed stock: price, dividends, sector and identifiers."
doc:
  summary: "A listed stock: price, dividends, sector and identifiers."
  description: >-
    A listed stock: price, dividends, sector and identifiers. One page per equity, its panels: price, last 30 days; its beta against
    its index, computed when the page opens from both price histories (since 2.9.2, docs/guides/PACK_DEVELOPER_GUIDE.md › Part VII. Groupings and analytics, computed, section
    17); identifiers; daily bars (last 60 days); how the view was built; the entities it links to. The strip gives Name, Price, 1D,
    Market cap, Sector, Exchange and Currency. Linked entities: issuer (issuer), vol surface (equity-vol-surface), dividends
    (dividend-curve) and index (equity-index).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/equity/EQ-CSCA"
    - "EQ EQ-CSCA"
  since: "2.7.0"
match: { kind: equity, priority: 10 }
title: { pill: Market data · Equity, id: $.TICKER }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Price, bind: $.PRICE, fmt: price2, emphasis: true }
  - { label: "1D", bind: $.CHANGE_1D, fmt: pct2, tone: sign }
  - { label: Market cap, bind: $.MARKET_CAP, fmt: compact }
  - { label: Sector, bind: $.SECTOR }
  - { label: Exchange, bind: $.EXCHANGE }
  - { label: Currency, bind: $.CURRENCY }
panels:
  - { use: series-line@1, with: { id: history, title: "Price, last 30 days", key: F2, rows: $.HISTORY, x: DATE, y: CLOSE } }
  - id: beta
    kind: metric
    title: Beta against its index (computed from both price histories)
    area: right
    source: { kind: equity-beta, id: "$.TICKER" }
    value: "$src.BETA"
    label: Beta
    fmt: price2
    caption: "against ${$src.INDEX}, ${$src.WINDOW} daily returns, ${$src.FROM} to ${$src.TO} · correlation ${fmt($src.CORRELATION, 'price2')}, R² ${fmt($src.R_SQUARED, 'price2')}"
  - { use: field-list@1, with: { id: ids, title: Identifiers, area: right, rows: $.IDENTIFIERS } }
  - id: ohlc
    kind: candlestick
    title: Daily bars (last 60 days)
    code: OHLC
    key: F3
    rows: $.OHLC
    x: DATE
    fmt: price2
    volume: VOLUME
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.ISSUER, 'issuer')", F8: impact, F9: raw }
