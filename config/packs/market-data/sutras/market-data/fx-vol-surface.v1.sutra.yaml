# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: fx-vol-surface
version: 1
description: "Implied vols by expiry and delta (ATM, 25D RR/BF)."
doc:
  summary: "Implied vols by expiry and delta (ATM, 25D RR/BF)."
  description: >-
    Implied vols by expiry and delta (ATM, 25D RR/BF). One page per fX volatility surface, its panels: smile surface (vol %);
    ATM vol term structure; surface (vol %); how the view was built; the entities it links to. The strip gives Pair, 1M ATM, 1Y
    ATM and 1Y 25D RR. Linked entities: spot (fx-spot).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/fx-vol-surface/FXV-AUDUSD"
    - "FXV FXV-AUDUSD"
  since: "2.7.0"
match: { kind: fx-vol-surface, priority: 10 }
title: { pill: Market data · FX volatility surface, id: $.SURFACE_ID }
strip:
  - { label: Pair, bind: $.PAIR }
  - { label: "1M ATM", bind: $.ATM_1M, fmt: price2, emphasis: true }
  - { label: "1Y ATM", bind: $.ATM_1Y, fmt: price2 }
  - { label: "1Y 25D RR", bind: $.RR_1Y, fmt: price2, tone: sign }
panels:
  - id: smile
    kind: surface
    title: Smile surface (vol %)
    code: SURF
    key: F4
    rows: $.GRID
    y: EXPIRY
    columns:
      - { label: "10D P", bind: "@.P_10", fmt: price2 }
      - { label: "25D P", bind: "@.P_25", fmt: price2 }
      - { label: ATM, bind: "@.ATM", fmt: price2 }
      - { label: "25D C", bind: "@.C_25", fmt: price2 }
      - { label: "10D C", bind: "@.C_10", fmt: price2 }
  - { use: series-line@1, with: { id: atm, title: ATM vol term structure, key: F2, rows: $.GRID, x: EXPIRY, y: ATM } }
  - id: grid
    kind: table
    title: Surface (vol %)
    key: F3
    rows: $.GRID
    columns:
      - { label: Expiry, bind: "@.EXPIRY" }
      - { label: "10D P", bind: "@.P_10", fmt: price2 }
      - { label: "25D P", bind: "@.P_25", fmt: price2 }
      - { label: ATM, bind: "@.ATM", fmt: price2 }
      - { label: "25D C", bind: "@.C_25", fmt: price2 }
      - { label: "10D C", bind: "@.C_10", fmt: price2 }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.FX_SPOT, 'fx-spot')", F8: impact, F9: raw }
