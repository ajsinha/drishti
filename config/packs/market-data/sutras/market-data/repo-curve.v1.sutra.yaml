# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: repo-curve
version: 1
description: General-collateral or specials repo rates by term.
doc:
  summary: "General-collateral or specials repo rates by term."
  description: >-
    General-collateral or specials repo rates by term. One page per repo curve, its panels: repo rates (%); terms; how the view
    was built. The strip gives Currency, Collateral, O/N and As of.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/repo-curve/REPO-AUD"
    - "REPO REPO-AUD"
  since: "2.7.0"
match: { kind: repo-curve, priority: 10 }
title: { pill: Market data · Repo curve, id: $.CURVE_ID }
strip:
  - { label: Currency, bind: $.CURRENCY }
  - { label: Collateral, bind: $.COLLATERAL }
  - { label: O/N, bind: $.OVERNIGHT, fmt: pct4, emphasis: true }
  - { label: As of, bind: $.AS_OF, fmt: date }
panels:
  - { use: series-line@1, with: { id: curve, title: Repo rates (%), key: F2, y: RATE } }
  - id: points
    kind: table
    title: Terms
    rows: $.POINTS
    columns:
      - { label: Term, bind: "@.TENOR" }
      - { label: Rate (%), bind: "@.RATE", fmt: price2 }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
