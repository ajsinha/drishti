# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: repo-curve
version: 1
description: General-collateral or specials repo rates by term.
match: { kind: repo-curve, priority: 10 }
title: { pill: Market data · Repo curve, id: $.curveId }
strip:
  - { label: Currency, bind: $.currency }
  - { label: Collateral, bind: $.collateral }
  - { label: O/N, bind: $.overnight, fmt: pct4, emphasis: true }
  - { label: As of, bind: $.asOf, fmt: date }
panels:
  - id: curve
    kind: line
    title: Repo rates (%)
    key: F2
    rows: $.points
    x: tenor
    y: rate
    fmt: price2
  - id: points
    kind: table
    title: Terms
    rows: $.points
    columns:
      - { label: Term, bind: "@.tenor" }
      - { label: Rate (%), bind: "@.rate", fmt: price2 }
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
