connectors:
  market-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - ir-curve
    - repo-curve
    - fx-spot
    - fx-forward-curve
    - fx-vol-surface
    - ir-vol-cube
    - cap-vol-surface
    - equity
    - equity-index
    - dividend-curve
    - equity-vol-surface
    - credit-curve
    - inflation-index
    - inflation-curve
    - commodity
    - commodity-curve
    - commodity-vol-surface
    - rate-fixing
    - bond
    - correlation-matrix
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: market
  nyfed-sofr-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_NYFED_SOFR:false}
    kinds:
    - rate-fixing
    settings:
      feed: nyfed-sofr
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  ecb-estr-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_ECB_ESTR:false}
    kinds:
    - rate-fixing
    settings:
      feed: ecb-estr
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  ecb-fx-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_ECB_FX:false}
    kinds:
    - fx-spot
    settings:
      feed: ecb-fx
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  us-treasury-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_US_TREASURY:false}
    kinds:
    - ir-curve
    settings:
      feed: us-treasury
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  fred-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_FRED:false}
    kinds:
    - rate-fixing
    settings:
      feed: fred
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
      api-key: ${FRED_API_KEY:}
      series: ${DRISHTI_FRED_SERIES:DGS10,DFF}
  correlation-engine:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    description: 'The correlations of a factor set computed when asked from its factors'' daily closes (log returns over a window, Pearson or
      Ledoit-Wolf), by the server''s Java engine, as the viewer: CORRC CORR-EU-EQ <GO>'
    kinds:
      correlation-result:
        compute: correlation
        params:
          window:
            type: int
            default: 0
            min: 0
            max: 5000
          estimator:
            type: enum
            options:
            - pearson
            - ledoit-wolf
            default: pearson
        result:
          required:
          - AVERAGE
          - PAIRS
          - WINDOW
          types:
            AVERAGE: number
            PAIRS: list
            WINDOW: number
    reads:
    - kind: correlation-matrix
      as: set
      id: '{id}'
    - kind: equity
      as: equities
      ids: '{inputs.set.EQUITY_IDS}'
      limit: 200
    - kind: fx-spot
      as: fx
      ids: '{inputs.set.FX_IDS}'
      limit: 200
    engine:
      type: java
      class: com.ash.drishti.compute.reactive.analytics.CorrelationEngine
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - correlation-matrix
      - equity
      - fx-spot
      affects: all
    coalesce:
      quiet: 250ms
      max-wait: 2s
    cache:
      results: 500
      ttl: 1h
    limits:
      timeout: 30s
      wait: 5s
      max-inflight-per-user: 4
  equity-analytics:
    plugin: reactive
    mode: reactive
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    description: 'An equity''s beta against its index computed when asked from both price histories (the regression of the daily log returns),
      by the server''s Java engine, as the viewer: EQB EQ-NVTK <GO>'
    kinds:
      equity-beta:
        compute: beta
        params:
          window:
            type: int
            default: 0
            min: 0
            max: 5000
        result:
          required:
          - BETA
          - INDEX
          - WINDOW
          types:
            BETA: number
            INDEX: text
            WINDOW: number
    reads:
    - kind: equity
      as: equity
      id: '{id}'
    - kind: equity-index
      as: index
      ids: '{inputs.equity.EQUITY_INDEX}'
      limit: 1
    engine:
      type: java
      class: com.ash.drishti.compute.reactive.analytics.BetaEngine
      version: '1.0'
    triggers:
    - 'on': data-version
      kinds:
      - equity
      - equity-index
      affects: all
    coalesce:
      quiet: 250ms
      max-wait: 2s
    cache:
      results: 500
      ttl: 1h
    limits:
      timeout: 30s
      wait: 5s
      max-inflight-per-user: 4
