connectors:
  market-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - ir-curve
    - repo-curve
    - fx-spot
    - fx-forward-curve
    - fx-vol-surface
    - ir-vol-cube
    - cap-vol-surface
