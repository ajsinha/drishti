console:
  examples:
  - - CRV CRV-USD-OIS
    - SOFR discount curve · zero rates, pillars, forwards
  - - FXV FXV-EURUSD
    - EUR/USD vol surface · smile by expiry
  - - EQ EQ-NVTK
    - Equity · price history, identifiers
  - - CDS CDS-SOLARIS
    - Credit curve · spreads, hazard rates
  - - CMDC CMDC-WTI
    - WTI futures curve · backwardation
  - - CORR CORR-EU-EQ
    - European equities · correlations computed from the factors' price history (window and estimator on the page)
  - - CORRC CORR-G10FX~estimator=ledoit-wolf
    - 'The computed kind itself: G10 FX correlations, Ledoit-Wolf shrinkage'
  - - EQB EQ-NVTK
    - Novatek's beta against the Nasdaq-100, computed from both price histories
  help: config/help.yaml
python:
  enabled: true

# History queries (TRD 1000015 30, docs/architecture/DATA_ARCHITECTURE.md › History queries: an entity over time, section 6): how this pack's kinds look over time.
# Only the shape: any dated kind has a history without an entry here.
history:
  equity:
    chart: [{path: PRICE, format: price2}]
    columns: [PRICE, {path: CHANGE_1D, format: pct2}, {path: MARKET_CAP, format: compact}, NAME, EXCHANGE, CURRENCY]
    exclude: [OHLC]
    series: {path: HISTORY, date: DATE, value: CLOSE}       # when no source keeps daily documents
  equity-index:
    chart: [{path: LEVEL, format: price2}]
    columns: [LEVEL, {path: CHANGE_1D, format: pct2}, CONSTITUENT_COUNT]
    series: {path: HISTORY, date: DATE, value: CLOSE}
  fx-spot:
    chart: [{path: MID, format: rate5}]
    columns: [MID, BID, ASK, {path: CHANGE_1D, format: pct2}]
    series: {path: HISTORY, date: DATE, value: MID}
  ir-curve:
    chart: [TEN_Y, SLOPE_2S_10S]
    columns: [TEN_Y, SLOPE_2S_10S]
    parts: [POINTS]
  credit-curve:
    chart: [SPREAD_5Y, PD_1Y]
    columns: [SPREAD_5Y, RECOVERY, PD_1Y]
    parts: [POINTS]
  commodity:
    chart: [{path: FRONT, format: price2}]
    columns: [FRONT]
    exclude: [OHLC]
  bond:
    chart: [PRICE, YIELD]
    headline: PRICE
    columns: [PRICE, YIELD, Z_SPREAD, MOD_DURATION, COUPON]
    series: {path: HISTORY, date: DATE, value: PRICE}
  inflation-index:
    chart: [LATEST, YOY]
    columns: [LATEST, YOY]
    parts: [FIXINGS]
