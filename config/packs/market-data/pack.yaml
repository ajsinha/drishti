    - credit-curve
    - inflation-index
    - inflation-curve
    - commodity
    - commodity-curve
    - commodity-vol-surface
    - rate-fixing
    - bond
    - correlation-matrix
    settings:
      root: ${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}
      domain: market
  nyfed-sofr-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_NYFED_SOFR:false}
    kinds:
    - rate-fixing
    settings:
      feed: nyfed-sofr
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  ecb-estr-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_ECB_ESTR:false}
    kinds:
    - rate-fixing
    settings:
      feed: ecb-estr
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  ecb-fx-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_ECB_FX:false}
    kinds:
    - fx-spot
    settings:
      feed: ecb-fx
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  us-treasury-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_US_TREASURY:false}
    kinds:
    - ir-curve
    settings:
      feed: us-treasury
      user-agent: ${drishti.branding.product:feed} public data feed connector
      stale-after: 4d
      refresh-minutes: 60
  fred-feed:
    plugin: feed
    enabled: ${DRISHTI_FEED_FRED:false}
