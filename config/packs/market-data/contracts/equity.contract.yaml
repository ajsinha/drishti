# Data contract of the equity kind (command EQ): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap equity`; owned by people from then on: confirm the review points, then remove them.
kind: equity
mnemonic: EQ
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Equity
description: 'A listed stock: price, dividends, sector and identifiers.'
source: md-hub
grain: One row per equity per business date, keyed by TICKER.
key:
- TICKER
id-pattern:
- ^EQ-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/equity/
  test-data:
  - data/testdata/market-data/equity
fields:
- name: TICKER
  type: id
  presence: required
  description: The record's id (the business key)
  example: EQ-CSCA
  pattern: ^EQ-
- name: NAME
  type: text
  presence: required
  description: 'The issuing company''s name.'
  example: Cascadia Airlines Inc.
- name: PRICE
  type: amount
  presence: required
  unit: 'CURRENCY'
  description: 'The share price (the last OHLC close), in CURRENCY per share.'
  example: 21.84
- name: CHANGE_1D
  type: amount
  presence: required
  unit: 'fraction'
  description: 'The day''s move of PRICE, as a fraction (0.03852 is +3.852%).'
  example: 0.03852
- name: MARKET_CAP
  type: integer
  presence: required
  unit: 'USD'
  description: 'The market capitalisation (price times shares outstanding), converted to USD.'
  example: 34324492441
- name: SECTOR
  type: text
  presence: required
  description: 'The company''s sector (Airlines, Technology …).'
  example: Airlines
- name: EXCHANGE
  type: text
  presence: required
  description: 'The listing exchange (NYSE, NASDAQ, LSE, TSX …).'
  example: TSX
  enum:
  - Euronext Paris
  - LSE
  - NASDAQ
  - NYSE
  - SIX
  - TSE
  - TSX
  - Xetra
- name: CURRENCY
  type: text
  presence: required
  description: 'The currency the share is quoted in, ISO 4217.'
  example: CAD
  enum:
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- name: HISTORY
  type: record list
  presence: required
  description: 'The daily closes, oldest first: one object per business day (the last 30 of OHLC).'
- name: OHLC
  type: record list
  presence: required
  description: 'The daily bars, oldest first: one object per business day (open, high, low, close in CURRENCY, volume in shares).'
- name: IDENTIFIERS
  type: record
  presence: required
  description: 'The share''s other identifiers: ISIN, Bloomberg ticker, RIC and FIGI.'
- name: ISSUER
  type: id
  presence: required
  description: 'The issuing company: an ISSUER_ID of the core pack''s issuer kind (ISS-…).'
  example: ISS-CASCADIA
  pattern: ^ISS-
  link: issuer
- name: EQUITY_VOL_SURFACE
  type: id
  presence: required
  description: 'Its volatility surface: a SURFACE_ID of the market-data pack''s equity-vol-surface kind (EQV-…).'
  example: EQV-CSCA
  pattern: ^EQV-
  link: equity-vol-surface
- name: DIVIDEND_CURVE
  type: id
  presence: required
  description: 'Its dividend curve: a CURVE_ID of the market-data pack''s dividend-curve kind (DIV-…).'
  example: DIV-CSCA
  pattern: ^DIV-
  link: dividend-curve
- name: EQUITY_INDEX
  type: id
  presence: optional
  description: 'The index it belongs to, when one: an INDEX_ID of the market-data pack''s equity-index kind (EQX-…).'
  example: EQX-UKX
  pattern: ^EQX-
  link: equity-index
nested:
  HISTORY[]:
  - name: DATE
    type: date
    presence: required
    description: 'A business day of the close history, oldest first, ending at the record''s date.'
    example: '2026-08-19'
  - name: CLOSE
    type: amount
    presence: required
    unit: 'equity currency'
    description: 'The share''s closing price that day, in the equity''s currency.'
    example: 18.95
  OHLC[]:
  - name: DATE
    type: date
    presence: required
    description: 'A business day of the daily bars, oldest first, ending at the record''s date.'
    example: '2026-07-08'
  - name: OPEN
    type: amount
    presence: required
    unit: 'equity currency'
    description: 'The day''s opening price, in the equity''s currency.'
    example: 18.94
  - name: HIGH
    type: amount
    presence: required
    unit: 'equity currency'
    description: 'The day''s high price.'
    example: 19.5
  - name: LOW
    type: amount
    presence: required
    unit: 'equity currency'
    description: 'The day''s low price.'
    example: 18.85
  - name: CLOSE
    type: amount
    presence: required
    unit: 'equity currency'
    description: 'The day''s closing price.'
    example: 19.38
  - name: VOLUME
    type: integer
    presence: required
    unit: 'shares'
    description: 'The number of shares traded that day.'
    example: 7737428
  IDENTIFIERS:
  - name: ISIN
    type: text
    presence: required
    description: 'The share''s ISIN (synthetic in the test data).'
    example: CA0CSCA00012
  - name: BLOOMBERG
    type: text
    presence: required
    description: 'The Bloomberg ticker (ticker, exchange code, Equity).'
    example: CSCA TS Equity
  - name: RIC
    type: text
    presence: required
    description: 'The Refinitiv instrument code.'
    example: CSCA.T
  - name: FIGI
    type: text
    presence: required
    description: 'The Financial Instrument Global Identifier (12 characters).'
    example: BBG2033A30F5
links:
- field: ISSUER
  kind: issuer
- field: EQUITY_VOL_SURFACE
  kind: equity-vol-surface
- field: DIVIDEND_CURVE
  kind: dividend-curve
- field: EQUITY_INDEX
  kind: equity-index
validation:
- rule: required
  fields:
  - TICKER
  - NAME
  - PRICE
  - CHANGE_1D
  - MARKET_CAP
  - SECTOR
  - EXCHANGE
  - CURRENCY
  - HISTORY
  - OHLC
  - IDENTIFIERS
  - ISSUER
  - EQUITY_VOL_SURFACE
  - DIVIDEND_CURVE
- rule: unique
  key:
  - TICKER
  per: business_date
- rule: pattern
  field: TICKER
  pattern: ^EQ-
- rule: enum
  field: EXCHANGE
  values:
  - Euronext Paris
  - LSE
  - NASDAQ
  - NYSE
  - SIX
  - TSE
  - TSX
  - Xetra
- rule: enum
  field: CURRENCY
  values:
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- rule: link
  field: ISSUER
  kind: issuer
- rule: link
  field: EQUITY_VOL_SURFACE
  kind: equity-vol-surface
- rule: link
  field: DIVIDEND_CURVE
  kind: dividend-curve
- rule: link
  field: EQUITY_INDEX
  kind: equity-index
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'BETA left the record in 2.9.2: the computed kind equity-beta (EQB) works it out from the equity''s and its index''s price histories (docs/guides/PACK_DEVELOPER_GUIDE.md › Part VII. Groupings and analytics, computed,
  section 17).'
review:
- 'required inferred from 100% coverage in 30 documents (10 samples and 20 test-data documents (data/testdata/market-data/equity/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/equity/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may
  be empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: EXCHANGE, CURRENCY: confirm they are closed lists.'
- 'no unit stated for the amounts PRICE, CHANGE_1D, HISTORY[].CLOSE, OHLC[].OPEN, OHLC[].HIGH, OHLC[].LOW, OHLC[].CLOSE (docs/contracts/README.md
  section 7: USD unless stated): confirm the currency.'
