# Data contract of the correlation-matrix kind (command CORR): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap correlation-matrix`; owned by people from then on: confirm the review points, then remove them.
kind: correlation-matrix
mnemonic: CORR
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Correlation matrix
description: 'A correlation set: the factors whose pairwise correlations basket, quanto and spread products use. Since 2.9.2 the set keeps its
  definition only; the correlations are the computed kind correlation-result (CORRC), worked out from the factors'' price history when asked.'
source: md-hub
grain: One row per correlation matrix per business date, keyed by MATRIX_ID.
key:
- MATRIX_ID
id-pattern:
- ^CORR-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/correlation-matrix/
  test-data:
  - data/testdata/market-data/correlation-matrix
fields:
- name: MATRIX_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: CORR-EU-EQ
  pattern: ^CORR-
- name: NAME
  type: text
  presence: required
  description: 'The correlation set''s name (European equities …): the matrix itself is computed from its factors'' price history when asked.'
  example: European equities
- name: FACTORS
  type: text list
  presence: required
  description: 'The factors of the set, in matrix order: equity tickers and FX pairs (EURUSD) by their market-data names; the correlations are computed from their price histories.'
- name: EQUITY_IDS
  type: id list
  presence: required
  description: 'The factors that are equities (their price history: HISTORY[].CLOSE)'
  link: equity
- name: FX_IDS
  type: id list
  presence: required
  description: 'The factors that are FX pairs (their history: HISTORY[].MID)'
  link: fx-spot
links: []
validation:
- rule: required
  fields:
  - MATRIX_ID
  - NAME
  - FACTORS
  - EQUITY_IDS
  - FX_IDS
- rule: unique
  key:
  - MATRIX_ID
  per: business_date
- rule: pattern
  field: MATRIX_ID
  pattern: ^CORR-
- rule: link
  field: EQUITY_IDS
  kind: equity
- rule: link
  field: FX_IDS
  kind: fx-spot
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
- 'AVERAGE, PAIRS, WINDOW and ESTIMATOR left the record in 2.9.2: the correlations are computed (correlation-result, docs/guides/PACK_DEVELOPER_GUIDE.md › Part VII. Groupings and analytics, computed,
  section 15).'
review:
- 'required inferred from 100% coverage in 6 documents (3 samples and 3 test-data documents (data/testdata/market-data/correlation-matrix/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/correlation-matrix/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'number types decided by the field''s name: AVERAGE rate, PAIRS[].RHO rate: confirm amount, rate or integer.'
- 'The release is 2.9.0 or 2.10.0 (Track B, shipped as each is ready): confirm which.'
