# Data contract of the dividend-curve kind (command DIV): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap dividend-curve`; owned by people from then on: confirm the review points, then remove them.
kind: dividend-curve
mnemonic: DIV
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Dividend curve
description: Expected dividends by year (implied from dividend futures and forwards).
source: md-hub
grain: One row per dividend curve per business date, keyed by CURVE_ID.
key:
- CURVE_ID
id-pattern:
- ^DIV-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/dividend-curve/
  test-data:
  - data/testdata/market-data/dividend-curve
fields:
- name: CURVE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: DIV-CSCA
  pattern: ^DIV-
- name: UNDERLIER
  type: id
  presence: required
  description: 'The equity or index the dividends are paid on: a TICKER of the equity kind (EQ-…) or an INDEX_ID of the equity-index kind (EQX-…).'
  example: EQ-CSCA
- name: DIVIDEND_YIELD
  type: rate
  presence: required
  unit: 'fraction'
  description: 'The annual dividend yield, as a fraction (0.0275 is 2.75%).'
  example: 0.0275
- name: POINTS
  type: record list
  presence: required
  description: 'The projected dividends: one object per calendar year, earliest first (YEAR, and AMOUNT per share or index point in the underlier''s currency).'
- name: UNDERLYING_EQUITY
  type: id
  presence: optional
  description: 'The same underlier when it is a share: a TICKER of the market-data pack''s equity kind (EQ-…).'
  example: EQ-CSCA
  pattern: ^EQ-
  link: equity
- name: UNDERLYING_INDEX
  type: id
  presence: optional
  description: 'The same underlier when it is an index: an INDEX_ID of the market-data pack''s equity-index kind (EQX-…).'
  example: EQX-NDX
  pattern: ^EQX-
  link: equity-index
nested:
  POINTS[]:
  - name: YEAR
    type: text
    presence: required
    description: 'The calendar year (as text) the expected dividends are paid in.'
    example: '2026'
    enum:
    - '2026'
    - '2027'
    - '2028'
    - '2029'
    - '2030'
    - '2031'
  - name: AMOUNT
    type: amount
    presence: required
    unit: 'underlier currency per share'
    description: 'The expected dividends of that year, per share (or index point), in the underlier''s currency.'
    example: 0.6
links:
- field: UNDERLYING_EQUITY
  kind: equity
- field: UNDERLYING_INDEX
  kind: equity-index
validation:
- rule: required
  fields:
  - CURVE_ID
  - UNDERLIER
  - DIVIDEND_YIELD
  - POINTS
- rule: unique
  key:
  - CURVE_ID
  per: business_date
- rule: pattern
  field: CURVE_ID
  pattern: ^DIV-
- rule: link
  field: UNDERLYING_EQUITY
  kind: equity
- rule: link
  field: UNDERLYING_INDEX
  kind: equity-index
- rule: enum
  field: POINTS[].YEAR
  values:
  - '2026'
  - '2027'
  - '2028'
  - '2029'
  - '2030'
  - '2031'
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 30 documents (15 samples and 15 test-data documents (data/testdata/market-data/dividend-curve/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/dividend-curve/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: POINTS[].YEAR: confirm they are closed lists.'
- 'number types decided by the field''s name: DIVIDEND_YIELD rate, POINTS[].AMOUNT amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts POINTS[].AMOUNT (docs/contracts/README.md section 7: USD unless stated): confirm the currency.'
