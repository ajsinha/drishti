# Data contract of the bond kind (command BND): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap bond`; owned by people from then on: confirm the review points, then remove them.
kind: bond
mnemonic: BND
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Bond (security master)
description: 'A listed bond: terms, price, yield, spreads and analytics.'
source: md-hub
grain: One row per bond (security master) per business date, keyed by ISIN.
key:
- ISIN
id-pattern:
- ^BND-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/bond/
  test-data:
  - data/testdata/market-data/bond
fields:
- name: ISIN
  type: id
  presence: required
  description: The record's id (the business key)
  example: BND-BRVERD054608
  pattern: ^BND-
- name: ISIN_CODE
  type: text
  presence: required
  description: 'The bond''s 12-character ISIN (without the BND- prefix of the record id).'
  example: BRVERD054608
- name: ISSUER_NAME
  type: text
  presence: required
  description: 'The issuer''s legal name.'
  example: Verdant Agri Holdings
- name: COUPON
  type: rate
  presence: required
  unit: 'fraction'
  description: 'The annual coupon rate, as a fraction (0.0579 is 5.79%).'
  example: 0.0579
- name: MATURITY
  type: date
  presence: required
  description: 'The bond''s maturity date.'
  example: '2031-09-15'
- name: PRICE
  type: amount
  presence: required
  unit: 'per 100 face'
  description: 'The bond''s price per 100 of face value, in the bond''s currency (TERMS.CURRENCY).'
  example: 94.302
- name: YIELD
  type: rate
  presence: required
  unit: 'fraction'
  description: 'The yield to maturity, as a fraction (0.071 is 7.1%).'
  example: 0.071
- name: Z_SPREAD
  type: rate
  presence: required
  unit: 'bp'
  description: 'The zero-volatility spread over the benchmark curve, in basis points.'
  example: 323.0
- name: MOD_DURATION
  type: amount
  presence: required
  unit: 'years'
  description: 'The modified duration, in years.'
  example: 4.35
- name: RATING
  type: text
  presence: required
  description: 'The bond''s credit rating, S&P-style (BB-, A+ …).'
  example: BB-
- name: TERMS
  type: record
  presence: required
  description: 'The bond''s static terms: currency, coupon frequency, day count, issue date, amount issued, seniority, callable, CUSIP.'
- name: COUPONS
  type: record list
  presence: required
  description: 'The bond''s next coupon payments, at most six, earliest first: one object per payment.'
- name: HISTORY
  type: record list
  presence: required
  description: 'The bond''s daily price history, oldest first: one object per business day.'
- name: ISSUER
  type: id
  presence: required
  description: 'The issuer: an ISSUER_ID of the core pack''s issuer kind (ISS-…).'
  example: ISS-VERDANT
  pattern: ^ISS-
  link: issuer
- name: BENCHMARK_CURVE
  type: id
  presence: required
  description: 'The government curve the bond is spread over: a CURVE_ID of the market-data pack''s ir-curve kind (CRV-<ccy>-GOVT).'
  example: CRV-USD-GOVT
  pattern: ^CRV-
  link: ir-curve
nested:
  TERMS:
  - name: CURRENCY
    type: text
    presence: required
    description: 'The bond''s currency, ISO 4217.'
    example: USD
    enum:
    - CAD
    - CHF
    - EUR
    - GBP
    - JPY
    - USD
  - name: COUPON_FREQUENCY
    type: text
    presence: required
    description: 'How often the coupon is paid: Annual or Semi-annual.'
    example: Semi-annual
    enum:
    - Annual
    - Semi-annual
  - name: DAY_COUNT
    type: text
    presence: required
    description: 'The coupon''s day-count convention (e.g. ACT/ACT).'
    example: ACT/ACT
  - name: ISSUE_DATE
    type: date
    presence: required
    description: 'The bond''s issue date.'
    example: '2021-09-15'
  - name: AMOUNT_ISSUED
    type: amount
    presence: required
    unit: 'bond currency'
    description: 'The face amount issued, in the bond''s currency.'
    example: 5100000000
  - name: SENIORITY
    type: text
    presence: required
    description: 'The bond''s ranking: Sovereign or Senior unsecured.'
    example: Senior unsecured
    enum:
    - Senior unsecured
    - Sovereign
  - name: CALLABLE
    type: boolean
    presence: required
    description: 'true when the issuer may redeem the bond early.'
    example: false
  - name: CUSIP
    type: text
    presence: optional
    description: 'The 9-character CUSIP, for US issues; null otherwise.'
    example: 0UST03005
  COUPONS[]:
  - name: DATE
    type: date
    presence: required
    description: 'The coupon''s payment date.'
    example: '2027-09-15'
  - name: AMOUNT
    type: amount
    presence: required
    unit: 'per 100 face'
    description: 'The coupon paid on that date per 100 of face value (the annual coupon divided by the payments a year).'
    example: 2.895
  HISTORY[]:
  - name: DATE
    type: date
    presence: required
    description: 'A business day of the price history, oldest first, ending at the record''s date.'
    example: '2026-08-19'
  - name: PRICE
    type: amount
    presence: required
    unit: 'per 100 face'
    description: 'The bond''s clean price that day, per 100 of face.'
    example: 95.492
links:
- field: ISSUER
  kind: issuer
- field: BENCHMARK_CURVE
  kind: ir-curve
validation:
- rule: required
  fields:
  - ISIN
  - ISIN_CODE
  - ISSUER_NAME
  - COUPON
  - MATURITY
  - PRICE
  - YIELD
  - Z_SPREAD
  - MOD_DURATION
  - RATING
  - TERMS
  - COUPONS
  - HISTORY
  - ISSUER
  - BENCHMARK_CURVE
- rule: unique
  key:
  - ISIN
  per: business_date
- rule: pattern
  field: ISIN
  pattern: ^BND-
- rule: link
  field: ISSUER
  kind: issuer
- rule: link
  field: BENCHMARK_CURVE
  kind: ir-curve
- rule: enum
  field: TERMS.CURRENCY
  values:
  - CAD
  - CHF
  - EUR
  - GBP
  - JPY
  - USD
- rule: enum
  field: TERMS.COUPON_FREQUENCY
  values:
  - Annual
  - Semi-annual
- rule: enum
  field: TERMS.SENIORITY
  values:
  - Senior unsecured
  - Sovereign
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 96 documents (32 samples and 64 test-data documents (data/testdata/market-data/bond/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/bond/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one may be
  empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: TERMS.CURRENCY, TERMS.COUPON_FREQUENCY, TERMS.SENIORITY: confirm they are closed lists.'
- 'number types decided by the field''s name: COUPON rate, PRICE amount, YIELD rate, Z_SPREAD rate, TERMS.AMOUNT_ISSUED amount, COUPONS[].AMOUNT
  amount, HISTORY[].PRICE amount: confirm amount, rate or integer.'
- 'no unit stated for the amounts PRICE, MOD_DURATION, TERMS.AMOUNT_ISSUED, COUPONS[].AMOUNT, HISTORY[].PRICE (docs/contracts/README.md section
  7: USD unless stated): confirm the currency.'
