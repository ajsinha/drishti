# Data contract of the equity-vol-surface kind (command EQV): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap equity-vol-surface`; owned by people from then on: confirm the review points, then remove them.
kind: equity-vol-surface
mnemonic: EQV
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Equity volatility surface
description: Implied vols by expiry and moneyness.
source: md-hub
grain: One row per equity volatility surface per business date, keyed by SURFACE_ID.
key:
- SURFACE_ID
id-pattern:
- ^EQV-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/equity-vol-surface/
  test-data:
  - data/testdata/market-data/equity-vol-surface
fields:
- name: SURFACE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: EQV-CSCA
  pattern: ^EQV-
- name: UNDERLIER
  type: id
  presence: required
  description: 'The equity or index: a TICKER of the equity kind (EQ-…) or an INDEX_ID of the equity-index kind (EQX-…).'
  example: EQ-CSCA
- name: ATM_1M
  type: amount
  presence: required
  unit: 'percent'
  description: 'The 1-month at-the-money implied volatility, in percent a year.'
  example: 37.54
- name: ATM_1Y
  type: amount
  presence: required
  unit: 'percent'
  description: 'The 1-year at-the-money implied volatility, in percent a year.'
  example: 36.67
- name: SKEW_1Y
  type: amount
  presence: required
  unit: 'vol points'
  description: 'The 1-year skew: the volatility at 90% moneyness minus the volatility at 110%, in volatility points.'
  example: 3.63
- name: GRID
  type: record list
  presence: required
  description: 'The surface: one object per expiry, shortest first, with the volatilities at 80% to 120% moneyness.'
- name: MODEL
  type: text
  presence: required
  description: 'The smile model and quoting of the surface (e.g. SVI, moneyness-quoted).'
  example: SVI, moneyness-quoted
nested:
  GRID[]:
  - name: EXPIRY
    type: text
    presence: required
    description: 'The option expiry of the row (1M, 3M … 5Y).'
    example: 1M
    enum:
    - 1M
    - 1Y
    - 2Y
    - 3M
    - 5Y
    - 6M
  - name: M_80
    type: amount
    presence: required
    unit: 'percent'
    description: 'The implied volatility at a strike of 80% of spot, in percent a year.'
    example: 43.17
  - name: M_90
    type: amount
    presence: required
    unit: 'percent'
    description: 'The implied volatility at a strike of 90% of spot, in percent a year.'
    example: 40.35
  - name: M_100
    type: amount
    presence: required
    unit: 'percent'
    description: 'The at-the-money implied volatility (strike 100% of spot), in percent a year.'
    example: 37.54
  - name: M_110
    type: amount
    presence: required
    unit: 'percent'
    description: 'The implied volatility at a strike of 110% of spot, in percent a year.'
    example: 36.64
  - name: M_120
    type: amount
    presence: required
    unit: 'percent'
    description: 'The implied volatility at a strike of 120% of spot, in percent a year.'
    example: 35.74
links: []
validation:
- rule: required
  fields:
  - SURFACE_ID
  - UNDERLIER
  - ATM_1M
  - ATM_1Y
  - SKEW_1Y
  - GRID
  - MODEL
- rule: unique
  key:
  - SURFACE_ID
  per: business_date
- rule: pattern
  field: SURFACE_ID
  pattern: ^EQV-
- rule: enum
  field: GRID[].EXPIRY
  values:
  - 1M
  - 1Y
  - 2Y
  - 3M
  - 5Y
  - 6M
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 30 documents (15 samples and 15 test-data documents (data/testdata/market-data/equity-vol-surface/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/equity-vol-surface/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional
  one may be empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: GRID[].EXPIRY: confirm they are closed lists.'
- 'no unit stated for the amounts ATM_1M, ATM_1Y, SKEW_1Y, GRID[].M_80, GRID[].M_90, GRID[].M_100, GRID[].M_110, GRID[].M_120 (docs/contracts/README.md
  section 7: USD unless stated): confirm the currency.'
