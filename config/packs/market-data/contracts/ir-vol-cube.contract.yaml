# Data contract of the ir-vol-cube kind (command IRV): docs/contracts/README.md section 16.
# Drafted by `drishti.py contract bootstrap ir-vol-cube`; owned by people from then on: confirm the review points, then remove them.
kind: ir-vol-cube
mnemonic: IRV
pack: market-data
version: '1.0'
class: fundamental
status: active
title: Swaption volatility cube
description: Normal (bp) swaption vols by expiry × tenor.
source: md-hub
grain: One row per swaption volatility cube per business date, keyed by CUBE_ID.
key:
- CUBE_ID
id-pattern:
- ^IRV-
dated-by: business_date
cadence:
  frequency: daily
  due: to be confirmed
storage:
  connector: market-store
  plugin: delta
  domain: market
  table: <root>/market/ir-vol-cube/
  test-data:
  - data/testdata/market-data/ir-vol-cube
fields:
- name: CUBE_ID
  type: id
  presence: required
  description: The record's id (the business key)
  example: IRV-AUD
  pattern: ^IRV-
- name: CURRENCY
  type: text
  presence: required
  description: 'The currency of the swaptions the cube prices, ISO 4217.'
  example: AUD
- name: MODEL
  type: text
  presence: required
  description: 'The volatility model the quotes are in (Normal (Bachelier), SABR smile).'
  example: Normal (Bachelier), SABR smile
- name: V_1Y_10Y
  type: amount
  presence: required
  unit: 'bp (normal vol)'
  description: 'The 1-year into 10-year at-the-money swaption volatility: a normal volatility in basis points a year.'
  example: 137.22
- name: V_5Y_5Y
  type: amount
  presence: required
  unit: 'bp (normal vol)'
  description: 'The 5-year into 5-year at-the-money swaption volatility: a normal volatility in basis points a year.'
  example: 132.72
- name: GRID
  type: record list
  presence: required
  description: 'The at-the-money swaption grid: one object per option expiry, shortest first, with a column per underlying swap tenor.'
nested:
  GRID[]:
  - name: EXPIRY
    type: text
    presence: required
    description: 'The option expiry of the row (1M, 3M … 10Y).'
    example: 1M
    enum:
    - 10Y
    - 1M
    - 1Y
    - 2Y
    - 3M
    - 5Y
    - 6M
  - name: T_1Y
    type: amount
    presence: required
    unit: 'bp (normal vol)'
    description: 'The volatility of the swaption on a 1-year swap: normal, basis points a year.'
    example: 148.55
  - name: T_2Y
    type: amount
    presence: required
    unit: 'bp (normal vol)'
    description: 'The volatility of the swaption on a 2-year swap: normal, basis points a year.'
    example: 146.78
  - name: T_5Y
    type: amount
    presence: required
    unit: 'bp (normal vol)'
    description: 'The volatility of the swaption on a 5-year swap: normal, basis points a year.'
    example: 143.74
  - name: T_10Y
    type: amount
    presence: required
    unit: 'bp (normal vol)'
    description: 'The volatility of the swaption on a 10-year swap: normal, basis points a year.'
    example: 141.09
  - name: T_30Y
    type: amount
    presence: required
    unit: 'bp (normal vol)'
    description: 'The volatility of the swaption on a 30-year swap: normal, basis points a year.'
    example: 136.56
links: []
validation:
- rule: required
  fields:
  - CUBE_ID
  - CURRENCY
  - MODEL
  - V_1Y_10Y
  - V_5Y_5Y
  - GRID
- rule: unique
  key:
  - CUBE_ID
  per: business_date
- rule: pattern
  field: CUBE_ID
  pattern: ^IRV-
- rule: enum
  field: GRID[].EXPIRY
  values:
  - 10Y
  - 1M
  - 1Y
  - 2Y
  - 3M
  - 5Y
  - 6M
notes:
- 'Dated by the lake''s business_date partition: `drishti.py lake build` writes each test-data file''s day into it; the documents carry no date
  field of their own.'
review:
- 'required inferred from 100% coverage in 14 documents (7 samples and 7 test-data documents (data/testdata/market-data/ir-vol-cube/snapshot-2026-07-08.jsonl.gz,
  data/testdata/market-data/ir-vol-cube/changes-2026-09-30.jsonl.gz)): confirm each required field is mandatory upstream, and each optional one
  may be empty.'
- 'source ''md-hub'' is the test data''s _meta.source (synthetic): name the production system that delivers it.'
- 'due time of each business date is not known: state it (for example, by 06:00 New York the next business day).'
- 'enum values inferred from the data, not from a glossary: GRID[].EXPIRY: confirm they are closed lists.'
- 'no unit stated for the amounts V_1Y_10Y, V_5Y_5Y, GRID[].T_1Y, GRID[].T_2Y, GRID[].T_5Y, GRID[].T_10Y, GRID[].T_30Y (docs/contracts/README.md
  section 7: USD unless stated): confirm the currency.'
