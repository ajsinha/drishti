# Drishti Public Sector: the public-sector module's lens (docs/guides/PUBLIC_SECTOR_GUIDE.md): development indicators, central banks'
# rates, national statistics, the OECD, official press releases and world events, each pack filled daily by its feed into worldlake or
# newslake. Chosen by drishti.edition: publicsector on every server (DRISHTI_EDITION=publicsector), or offered as a lens beside the others
# (drishti.lenses: risk,world,publicsector); offered only while the publicsector module is on. The site's configuration wins over any key
# (drishti.edition-spec.<key> on the server, edition.<key> in the console). docs/admin/EDITIONS.md (how to run an edition).
edition: publicsector
title: Drishti Public Sector
description: Development indicators, central banks, national statistics, the OECD, official news and world events, from public sources

packs:
  enabled: [world-development, central-banks, national-statistics, oecd, official-news, gdelt-events]
  allow-only: true                       # Admin -> Packs, Deploy archive and the registry refuse any other pack (DRS-1017)

commands:                                # what people may type and see (command line, FUNC, type-ahead, examples, pages)
  allow:
    # development: a country's profile, an indicator's history (World Bank WDI)
    [WDI, WDIS,
    # central banks: a bank, a series (FRED, Bank of Canada)
     CBANK, CBSER,
    # national statistics (Statistics Canada), the OECD's members and series
     NSTAT, OECD, OECDS,
    # free news: official press releases, world events (GDELT)
     PRESS, PREL, GDELT]
  words: { BI: on, RUPAKA: off, FORM: on, FUNC: on, WHAT: on, DATAMAP: on, DATA: on, VAR: off, EXP: off, SMAT: off, PLAY: off }

features:                                # presets of existing switches (config/editions/features.yaml); not named: the product's default
  bi: edition                            # BI with the datasets below only
  var: off
  exposure: off
  calc: off
  python: off
  designer: off
  build: off
  forms: on
  datamap: on
  data: on                               # Export data (EXPORT, /data): every dataset, a simple selection, a day as .jsonl.gz
  internal-only-data: off                # Export data refuses records marked internal only (the Bank of England, OSFI, the Canada Gazette)
  layouts: on
  workspaces: on
  monitors: on
  alerts: on
  reports: on
  lakes: on
  ai: off
  embed: off

bi:                                      # no BI dataset or model ships yet: these names keep BI to the module's own (none until one is added)
  datasets: [bi.publicsector_*]
  models: [publicsector]

menus:                                   # by id, per menu; a menu not named shows every item its switches allow
  top: [views, bi, admin, help]          # the top menus by id, in order; one not named is not drawn
  views: [terminal, search, forms, functions, datamap, data, reports, workspaces, monitors, alerts]
  help: [help-centre, knowledge, install, about]
  footer: [help, about, release-notes]
  placeholder: "WDI WDI-CAN, CBANK CBANK-FED, NSTAT NSTAT-V41690973, OECD OECD-CAN, PRESS PRESS-FED, GDELT GDELT-USA …  then <GO>"

home:
  sections: { stats: off, grammar: off, pipeline: off, capabilities: off, views: off }   # the product's Home with the cards below
  cards:                                 # quick cards on Home (replace ui.home_cards)
    - { title: "A country's development: the latest indicators, the world map by GDP per head", cmd: WDI WDI-CAN, icon: globe }
    - { title: "A central bank: its policy rate, the last move, its series", cmd: CBANK CBANK-FED, icon: bank }
    - { title: "Canada's consumer price index, month by month", cmd: NSTAT NSTAT-V41690973, icon: bar-chart }
    - { title: "An OECD member: the cycle, jobs, prices, growth", cmd: OECD OECD-CAN, icon: globe2 }
    - { title: "Official press releases: the Federal Reserve's latest", cmd: PRESS PRESS-FED, icon: newspaper }
    - { title: "World events: what the news said about a country yesterday", cmd: GDELT GDELT-USA, icon: activity }

help:
  categories: [get-started, analytics, data, operate, reference, knowledge, internal]   # the help sections kept (config/help.yaml): Build and risk hidden
  knowledge: [world-development, central-banks, national-statistics, oecd, official-news, gdelt-events]
  unlisted-slugs: refuse                 # a guide not in the help centre answers 404 (no reaching hidden guides by URL)

admin:                                   # the Admin pages shown; the others answer 404 (and are off the menu and the tab strip)
  pages: [users, roles, packs, commands, tokens, access, connectors, artifacts, loads, lakes, audit, net, engines, health, caches, capacity, bi, configuration]

branding:                                # Drishti's name and eye mark kept; a licensee may override in site configuration
  product: Drishti Public Sector
  tagline: Development, central banks, statistics and official news from public sources
