# config/lakes/demo.yaml: the demo lake (docs/guides/LAKE_GUIDE.md section 3). The demo lake is a lake like any other: drishti.py lake
# demo, tools/build_demo_lakes.py, the data inbox and the demo's connectors all write and read through this file. Every table is
# partitioned by business_date first, always; partition-by names only what comes after it. A table's entry is the truth: an administrator
# edits it here, never in a connector file or on a command line (a --partition-by that disagrees is refused, naming both).
lake: demo
format: delta
root: ${DRISHTI_DELTA_ROOT:./data/delta}
defaults: {load-mode: replace}
tables:
  trading.trade_endur:
    kind: trade
    partition-by: [PRODUCT_TYPE]
    promote: [TRADE_ID, SOURCE_SYSTEM, PRODUCT_TYPE, PRODUCT_SUB_TYPE, PRODUCT_GROUP, TRADE_STATUS, TRADE_VERSION, BUY_SELL_CODE, CURRENCY, QUANTITY, TRADE_DATE, MATURITY_DATE, COUNTERPARTY, LEGAL_ENTITY,
      PORTFOLIO, TRADER_ID, NOTIONAL, INDEX_NAME]
    id: TRADE_ID
    sort-by: [id]
    file-rows: 250000
    row-group-rows: 1000
  trading.trade_calypso:
    kind: trade
    partition-by: [PRODUCT_TYPE]
    promote: [TRADE_ID, SOURCE_SYSTEM, PRODUCT_TYPE, PRODUCT_SUB_TYPE, PRODUCT_GROUP, TRADE_STATUS, TRADE_VERSION, BUY_SELL_CODE, CURRENCY, QUANTITY, TRADE_DATE, MATURITY_DATE, COUNTERPARTY, LEGAL_ENTITY,
      PORTFOLIO, TRADER_ID, NOTIONAL, INDEX_NAME]
    id: TRADE_ID
    sort-by: [id]
    file-rows: 250000
    row-group-rows: 1000
  trading.trade_murex:
    kind: trade
    partition-by: [PRODUCT_TYPE]
    promote: [TRADE_ID, SOURCE_SYSTEM, PRODUCT_TYPE, PRODUCT_SUB_TYPE, PRODUCT_GROUP, TRADE_STATUS, TRADE_VERSION, BUY_SELL_CODE, CURRENCY, QUANTITY, TRADE_DATE, MATURITY_DATE, COUNTERPARTY, LEGAL_ENTITY,
      PORTFOLIO, TRADER_ID, NOTIONAL, INDEX_NAME]
    id: TRADE_ID
    sort-by: [id]
    file-rows: 250000
    row-group-rows: 1000
  legal.agreement: {id: AGREEMENT_ID}
  market.bond: {id: ISIN}
  reference.book: {id: BOOK_ID}
  reference.calendar: {id: CALENDAR_ID}
  market.cap-vol-surface: {id: SURFACE_ID}
  reference.ccp: {id: CCP_ID}
  reference.clearing-account: {id: ACCOUNT_ID}
  collateral.collateral-balance: {id: BALANCE_ID}
  market.commodity: {id: COMMODITY_ID}
  market.commodity-curve: {id: CURVE_ID}
  market.commodity-vol-surface: {id: SURFACE_ID}
  market.correlation-matrix: {id: MATRIX_ID}
  reference.counterparty: {id: COUNTERPARTY_ID}
  reference.counterparty-group: {id: GROUP_ID}
  market.credit-curve: {id: CURVE_ID}
  credit.credit-limit: {id: LIMIT_ID}
  legal.csa: {id: CSA_ID}
  credit.cva: {id: RESULT_ID}
  reference.desk: {id: DESK_ID}
  market.dividend-curve: {id: CURVE_ID}
  market.equity: {id: TICKER}
  market.equity-index: {id: INDEX_ID}
  market.equity-vol-surface: {id: SURFACE_ID}
  risk.frtb-sensitivity: {id: RESULT_ID}
  market.fx-forward-curve: {id: CURVE_ID}
  market.fx-spot: {id: PAIR}
  market.fx-vol-surface: {id: SURFACE_ID}
  market.inflation-curve: {id: CURVE_ID}
  market.inflation-index: {id: INDEX_ID}
  market.ir-curve: {id: CURVE_ID}
  market.ir-vol-cube: {id: CUBE_ID}
  reference.issuer: {id: ISSUER_ID}
  reference.legal-entity: {id: ENTITY_ID}
  collateral.margin-call: {id: CALL_ID}
  credit.netting-set: {id: NETTING_SET_ID}
  risk.pnl-explain: {id: RESULT_ID}
  market.rate-fixing: {id: INDEX_ID}
  market.repo-curve: {id: CURVE_ID}
  credit.sa-ccr: {id: CALC_ID}
  collateral.simm: {id: CALC_ID}
  risk.stress-result: {id: RESULT_ID}
  risk.stress-scenario: {id: SCENARIO_ID}
  risk.trade-valuation:
