# config/lakes/var-official.yaml: the official results the server publishes (docs/contracts/VAR.md section 5), read only by BI's reader. Its format, root and
# storage are the publisher's own settings (drishti.var.official.format, .root, .storage), so the reader follows wherever and however they are
# published (Delta by default; Iceberg: the server makes the reader an Iceberg connector). docs/guides/LAKE_GUIDE.md.
lake: var-official
format: ${drishti.var.official.format:delta}
root: ${drishti.var.official.root:${DRISHTI_DELTA_ROOT:${drishti.data.dir:./data}/delta}}
storage: {region: '${drishti.var.official.storage.s3.region:}', endpoint: '${drishti.var.official.storage.s3.endpoint:}', path-style: '${drishti.var.official.storage.s3.path-style:}',
  access-key: '${drishti.var.official.storage.s3.access-key:}', secret-key: '${drishti.var.official.storage.s3.secret-key:}'}
tables:
  risk-results.var-official:
    promote: [HIERARCHY, NODE_ID, NODE_NAME, PARENT_ID, LEVEL, CAPTURE_ID, RESULT_VERSION, VAR, ES, LIMIT, LIMIT_USE, DIVERSIFICATION, HYPO_PNL,
      EXCEPTIONS_250, TRAFFIC_LIGHT, CONFIDENCE, ES_CONFIDENCE]
