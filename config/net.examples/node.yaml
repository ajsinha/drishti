# Example: copy to config/net/node.yaml (the server's drishti.net.dir) to make this server a member of a Drishti*net cluster
# (docs/guides/OPERATIONS_GUIDE.md). Applied live: enabled false -> true joins, true -> false leaves cleanly. Without this file the server is a
# single server exactly as before.
enabled: true
# node-id: drishti-b                 # empty: generated once and kept in <data dir>/net/node-id
advertise-url: https://drishti-b.internal:8480   # the address peers and consoles call this node at: a name or the machine's real IP,
                                     # never localhost, 127.x.x.x, ::1, 0.0.0.0 or :: (refused). Left out: this machine's primary IPv4
                                     # address (the default route's interface) with the server's port, e.g. http://192.168.1.20:8480
tags: [region:emea, tier:risk]       # for nodes per role (access.yaml)
peer-only-packs: []                  # packs served to peers only, hidden from this node's own users
memory-stores: []                    # the in-memory lake's stores this node owns (fills, compacts and serves; docs/guides/DATA_LAKE_GUIDE.md): the
                                     # packs reading them are bound here and the other nodes forward their requests here. []: each store's owner setting
secret: ${DRISHTI_NET_SECRET}        # the cluster key: an environment reference only, at least 32 bytes, the same on every node
cluster-port: 7946                   # the membership's TCP port (JGroups, TCP only, never multicast): a number, open it between the nodes,
                                     # and cluster-port + 100 (the failure detector's socket). Left out: [net.node] cluster-port, else 7946
# agreement-port: 7947               # the agreement's port, ratis mode only (mutual TLS required). Left out: [net.node] agreement-port, 7947
seeds: [drishti-a.internal:7946, drishti-c.internal:7946]   # host:cluster-port of members to dial when joining (real addresses, never
                                     # loopback). Left out: [net.cluster] seeds; the members of <data dir>/net/members.json are dialled too
# role: server                       # server, or witness (membership and agreement only). Left out: [net.node] role
