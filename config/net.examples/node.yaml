# Example: copy to config/net/node.yaml (the server's drishti.net.dir) to make this server a member of a Drishti*net cluster
# (docs/admin/NET.md). Applied live: enabled false -> true joins, true -> false leaves cleanly. Without this file the server is a
# single server exactly as before.
enabled: true
# node-id: drishti-b                 # empty: generated once and kept in <data dir>/net/node-id
advertise-url: https://drishti-b.internal:8480   # the address peers and consoles call this node at: a name or the machine's real IP,
                                     # never localhost, 127.x.x.x, ::1, 0.0.0.0 or :: (refused). Left out: this machine's primary IPv4
                                     # address (the default route's interface) with the server's port, e.g. http://192.168.1.20:8480
tags: [region:emea, tier:risk]       # for nodes per role (access.yaml)
peer-only-packs: []                  # packs served to peers only, hidden from this node's own users
secret: ${DRISHTI_NET_SECRET}        # the cluster key: an environment reference only, at least 32 bytes, the same on every node
gossip-port: auto                    # gossip, probes and digests on a port of their own with their own platform threads, so a server busy
                                     # with queries is never wrongly suspected (2.6.7): auto (a free port, advertised through gossip), a
                                     # number (a firewall that must name it: open it between the nodes), or off (the server's port)
# previous-secret: ${DRISHTI_NET_PREVIOUS_SECRET}   # also accepted during a key rollover (NET.md, "Rotating the key")
# tls:                               # mutual TLS between nodes, the shared tls settings (docs/connectors/TLS.md)
#   keystore: /etc/drishti/net/node.p12
#   keystore-password: ${DRISHTI_NET_KEYSTORE_PASSWORD}
#   truststore: /etc/drishti/net/cluster-ca.p12
#   truststore-password: ${DRISHTI_NET_TRUSTSTORE_PASSWORD}
