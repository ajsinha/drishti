# The annual report's trading VaR table (the pilot pack, docs/guides/VAR_GUIDE.md section 18.14): 1-day 99% VaR by risk type with
# diversification; period end, average, high and low over the fiscal year, from the official records. On the demo every desk trades
# one asset class, so each row is a desk; a bank names the nodes of its own risk-type hierarchy instead.
report: annual-report-var
title: Trading VaR by risk type (annual report)
description: 1-day 99% VaR by risk type with diversification; period end, average, high and low over the fiscal year
type: var-table
period: fiscal-year
measure: var
units: thousands
rows:
  - { label: Interest rate, code: IR, node: MGMT~DESK-RATES }
  - { label: Inflation, code: INF, node: MGMT~DESK-INFL }
  - { label: Fixed income, code: FI, node: MGMT~DESK-FI }
  - { label: Money market, code: MM, node: MGMT~DESK-MM }
  - { label: Securities financing, code: SFT, node: MGMT~DESK-SFT }
  - { label: Foreign exchange, code: FX, node: MGMT~DESK-FX }
  - { label: Equity, code: EQ, node: MGMT~DESK-EQD }
  - { label: Structured, code: STR, node: MGMT~DESK-STRUCT }
  - { label: Commodity, code: CMD, node: MGMT~DESK-COMM }
  - { label: Credit spread, code: CS, node: MGMT~DESK-CREDIT }
  - { label: Diversification, compute: diversification }
  - { label: Total trading VaR, node: MGMT~BANK, total: true }
columns: [period-end, average, high, low, prior-period-end, movement]
checks:
  - total-equals-official
  - rows-sum-to-total
  - no-missing-records
  - { check: same-total-as, report: var-backtesting-chart }
  - { check: movement-needs-note, threshold: 0.10 }
  - backtesting-exceptions
outputs: [xlsx, csv, pdf]
sign-off: [maker, checker, approver]
step-titles: { approver: CRO }
