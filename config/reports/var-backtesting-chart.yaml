# The bank's backtesting chart (the pilot pack, docs/guides/VAR_GUIDE.md section 18.14): the official 1-day 99% and 97.5% VaR of the day
# before against the actual and hypothetical P&L over the last 250 business days to the period end, the exceptions, the zone and the
# capital multiplier.
report: var-backtesting-chart
title: Backtesting chart, the bank, 250 days
description: The bank's official VaR against its actual and hypothetical P&L over 250 business days; exceptions, zone and multiplier
type: backtesting-chart
period: fiscal-year
node: MGMT~BANK
checks:
  - total-equals-official
  - { check: same-total-as, report: annual-report-var }
  - window-complete
  - no-missing-records
  - backtesting-exceptions
outputs: [xlsx, csv, pdf]
sign-off: [maker, checker, approver]
step-titles: { approver: CRO }
