# A lens is a workspace (docs/guides/ADMIN_GUIDE.md, the three layers of switches; LENSES.md): a person opens it for their own
# session and it arranges what the distribution has for a role: the starting Home (landings, cards), the menus' order (the ones it
# names first, nothing left out) and default screens. It never hides anything: what exists is the distribution's
# (config/distributions/drishti.<name>.yaml), what runs where is the module and engine switches'.
edition: world
title: Drishti World
description: Economies, markets, companies, legal entities and funds, from public data, in one place

menus:                                   # by id, per menu: the order this lens puts first; nothing is left out
  top: [views, economies, markets, companies, bi, admin, help]  # the top menus it puts first, in order; the others follow
  markets: [news, quote, idx]          # the Markets menu's news and quotes (its market-data columns are for the trading lens)
  views: [terminal, search, forms, functions, datamap, data, reports, workspaces, monitors, alerts]
  help: [help-centre, knowledge, install, about]
  footer: [help, about, release-notes]
  placeholder: "ECON CAN, NEWS rates, USEQ AAPL, LEIC US, FUND SPY …  then <GO>"

home:
  landing: desk                          # the default landing: desk (A, World desk), explorer (B, Explorer), map (C, World map); today: the product's Home
  landings: [desk, explorer, map]        # the landings a person may pick on Home (their choice is kept in their settings)
  template: economy:world_landing.html   # the page that draws them: the economy module's (its console part, modules/economy/console/; its script and style)
  titles: { desk: World desk, explorer: Explorer, map: World map }
  landing-by-role: {}                    # {role: landing}: read, wins over the person's choice when set; wired to role-based access later
  topics: [TOPIC-RATES, TOPIC-INFLATION, TOPIC-OIL, TOPIC-FED, TOPIC-ECB, TOPIC-AI]   # A's news by topic (each topic's latest stories)
  sections: { stats: off, grammar: off, pipeline: off, capabilities: off, views: off }   # the product's Home (signed out, or landing=today)

