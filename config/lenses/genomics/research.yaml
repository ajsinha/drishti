# A lens is a workspace (docs/guides/ADMIN_GUIDE.md, the three layers of switches; LENSES.md): a person opens it for their own
# session and it arranges what the distribution has for a role: the starting Home (landings, cards), the menus' order (the ones it
# names first, nothing left out) and default screens. It never hides anything: what exists is the distribution's
# (config/distributions/drishti.<name>.yaml), what runs where is the module and engine switches'.
edition: research
title: Research
description: Variants, genes, samples and cohorts from VCF files, with BI on top

menus:
  top: [genomics, views, bi, admin, help]
  views: [terminal, search, forms, functions, datamap, data, reports, workspaces, monitors, alerts]
  help: [help-centre, install, about]
  footer: [help, about, release-notes]
  placeholder: "GENE TP53, COHORT COH-A, VARIANT HX-A001 …  then <GO>"
