# Research: Drishti Genomics' lens (docs/architecture/DISTRIBUTIONS.md section 4): the genomics module's variants, genes and cohorts,
# with BI and the data pages; no finance anywhere (no risk engine, no trades, no counterparty).

edition: research
title: Research
description: Variants, genes, samples and cohorts from VCF files, with BI on top

packs:
  none: true                             # no pack: the kernel's are left out (Drishti Genomics takes none); the module serves its own kinds

commands:                                # what people may type and see
  allow: [VARIANT, GENE, COHORT]
  words: { BI: on, RUPAKA: off, FORM: on, FUNC: on, WHAT: on, DATAMAP: on, DATA: on, VAR: off, EXP: off, SMAT: off, PLAY: off }

features:                                # presets of existing switches (config/lenses/features.yaml)
  var: off
  exposure: off
  calc: off
  python: off
  designer: off
  build: off
  forms: on
  datamap: on
  data: on
  layouts: on
  workspaces: on
  monitors: on
  alerts: on
  reports: on
  lakes: on
  ai: off
  embed: off

menus:
  top: [genomics, views, bi, admin, help]
  views: [terminal, search, forms, functions, datamap, data, reports, workspaces, monitors, alerts]
  help: [help-centre, install, about]
  footer: [help, about, release-notes]
  placeholder: "GENE TP53, COHORT COH-A, VARIANT HX-A001 …  then <GO>"
