# A lens is a workspace (docs/guides/ADMIN_GUIDE.md, the three layers of switches; LENSES.md): a person opens it for their own
# session and it arranges what the distribution has for a role: the starting Home (landings, cards), the menus' order (the ones it
# names first, nothing left out) and default screens. It never hides anything: what exists is the distribution's
# (config/distributions/drishti.<name>.yaml), what runs where is the module and engine switches'.
edition: risk
title: Drishti Risk  # the lens's name, in the lens menu and on Home
description: VaR and counterparty exposure, from your own pricing data, in one place  # one line on what the lens is for (the lens menu)

phone:                                   # the phone display in this lens (docs/guides/BUILD_GUIDE.md), over the site's ui.phone
  rules:                                 # tiers and caps by panel, kind, title, Sutra or entity kind (globs): a VaR contribution panel waits under More
    - { title: "*contribution*", tier: more }
  pages: {}                              # the VaR and exposure pages' parts, as ui.phone.pages: { var: { hist: glance } }

menus:                                   # by id, per menu: the order this lens puts first; nothing is left out
  top: [views, risk, counterparties, bi, admin, help]  # the top menus it puts first, in order; the others follow
  # the Views menu's items by id, in order (drishti-console/config/sitemap.yaml)
  views: [terminal, search, functions, datamap, data, reports, workspaces, monitors, alerts]
  # the Risk and Counterparties menus' items by id: the VaR and exposure engines' pages (their switches and status: Admin -> Engines)
  risk: [my-var, vlim, pnlv, var-explorer, var-explain, play-var, smat, var-reports, backtesting, stress-window, var-results, var-official,
         exp-explorer, exp-cpty, exp-nset]
  counterparties: [cpty, nset, lim, predeal, exp]   # the Counterparties menu's items by id
  help: [help-centre, knowledge, install, about]  # the Help menu's items by id
  footer: [help, about, release-notes]  # the footer's links by id
  placeholder: "VAR BANK, VAR DESK RATES, EXP CPTY:CP-ALDERSHOT, VRES DESK:RATES …  then <GO>"  # the command line's placeholder text

home:
  landing: desk                          # the default landing: desk (A, Risk desk), command (B, Command first), map (C, Risk map); today: the product's Home
  landings: [desk, command, map]         # the landings a person may pick on Home (their choice is kept in their settings)
  template: home/risk_landing.html       # the page that draws them (it names its script and style: drishti_risk-landing.js, drishti_risk-landing.css)
  titles: { desk: Risk desk, command: Command first, map: Risk map }  # the landings' names, by landing
  landing-by-role: {}                    # {role: landing}: read, wins over the person's choice when set; wired to role-based access later
  hierarchies: [MGMT]                    # the hierarchy the Risk map opens on (its switch lists every hierarchy the engine holds)
  sections: { stats: off, grammar: off, pipeline: off, capabilities: off, views: off }   # the product's Home (signed out, or landing=today)

