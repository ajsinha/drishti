# A lens is a workspace (docs/guides/ADMIN_GUIDE.md, the three layers of switches; LENSES.md): a person opens it for their own
# session and it arranges what the distribution has for a role: the starting Home (landings, cards), the menus' order (the ones it
# names first, nothing left out) and default screens. It never hides anything: what exists is the distribution's
# (config/distributions/drishti.<name>.yaml), what runs where is the module and engine switches'.
edition: market
title: Drishti Market
description: Curves, surfaces, fixings and prices, the market data that feeds risk and valuations, in one place

menus:                                   # by id, per menu: the order this lens puts first; nothing is left out
  top: [views, markets, bi, admin, help]  # the top menus it puts first, in order; the others follow
  views: [terminal, search, forms, functions, datamap, data, reports, workspaces, monitors, alerts]
  help: [help-centre, knowledge, install, about]
  footer: [help, about, release-notes]
  placeholder: "CRV CRV-USD-OIS, FXV FXV-EURUSD, IRV IRV-USD, CDS where SPREAD_5Y > 100 …  then <GO>"

home:
  landing: desk                          # the default landing: desk (A, Market desk), explorer (B, Explorer), quality (C, Quality); today: the product's Home
  landings: [desk, explorer, quality]    # the landings a person may pick on Home (their choice is kept in their settings)
  template: home/market_landing.html     # the page that draws them (it names its script and style: drishti_market-landing.js, drishti_market-landing.css)
  titles: { desk: Market desk, explorer: Explorer, quality: Quality }
  landing-by-role: {}                    # {role: landing}: read, wins over the person's choice when set; wired to role-based access later
  sections: { stats: off, grammar: off, pipeline: off, capabilities: off, views: off }   # the product's Home (signed out, or landing=today)

quality:                                 # the Quality landing's checks (LENSES.md › The design); read-only, from the pack's own answers
  stale-days: 2                          # stale: data older than the business date by more than this many business days

