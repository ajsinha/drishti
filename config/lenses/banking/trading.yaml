# A lens is a workspace (docs/guides/ADMIN_GUIDE.md, the three layers of switches; LENSES.md): a person opens it for their own
# session and it arranges what the distribution has for a role: the starting Home (landings, cards), the menus' order (the ones it
# names first, nothing left out) and default screens. It never hides anything: what exists is the distribution's
# (config/distributions/drishti.<name>.yaml), what runs where is the module and engine switches'.
edition: trading
title: Drishti Trading
description: Your books, P&L, VaR and limits, today's trades and your counterparties, for traders and desk heads

menus:                                   # by id, per menu: the order this lens puts first; nothing is left out
  # the top menus it puts first, in order; the others follow. BI and Admin are reached by command (BI <GO>, ADMIN <GO>), not from the bar
  top: [views, markets, blotter, positions, risk, counterparties, help]
  markets: [crv, repo, fix, irv, cpv, fxv, fx-spot, fxf, cds, bnd, eq, eqx, cmd, cmdc]   # the one Markets menu: rates, vols, FX, credit, equities and commodities
  views: [terminal, search, functions, data, reports, workspaces, monitors, alerts]
  # the Risk menu's items by id: the book's risk, then the VaR, exposure, FRTB-SA and SIMM engines' pages (switches and status: Admin -> Engines)
  risk: [my-var, vlim, tval, pnlv, dpnl, pnl, sens, var-explorer, var-explain, play-var, smat, var-reports, backtesting, stress-window, var-results,
         exp-explorer, exp-cpty, exp-nset, frsa, play-frtb, simm, play-simm]
  help: [help-centre, knowledge, install, about]
  footer: [help, about, release-notes]
  placeholder: "TRD 1000001, BOOK BOOK-RATES-1, VAR BOOK BOOK-RATES-1, EXP CPTY:CP-ALDERSHOT, CTRD CP-ALDERSHOT …  then <GO>"

home:
  landing: trader                        # the default landing: trader (A, Trader desk), desk (B, Desk head), explorer (C, Explorer)
  landings: [trader, desk, explorer]     # the landings a person may pick on Home (their choice is kept in their settings)
  template: home/trading_landing.html    # the page that draws them (it names its script and style: drishti_trading-landing.js, drishti_trading-landing.css)
  titles: { trader: Trader desk, desk: Desk head, explorer: Explorer }
  landing-by-role: {}                    # {access role: landing}: wins over the person's choice when set (the RBAC hook, as the others)
  sections: { stats: off, grammar: off, pipeline: off, capabilities: off, views: off }   # the product's Home (signed out, or landing=today)

trading:                                 # the Trading landings (LENSES.md › The design); read-only, as the person, with their roles and masks
  # "my" scope: who is who. A person named here sees their trader's books (trader) or their desk (desk); role: desk-head opens the
  # Desk head landing first. The console's own trading.people (application.local.yaml) adds people and wins for a name in both.
  # A person not named: a trader record whose TRADER_ID or NAME is theirs (match-records), else the "View as" picker, remembered in their
  # settings (tradingView). An administrator may always pick. Scoping only chooses what the landing shows: it never widens access.
  people:
    drishti-dev-admin: { trader: TRDR-ASHAH }        # the demo's administrator reads A. Shah's books (the demo data's rates trader)
    # t.brennan: { desk: DESK-COMM, role: desk-head }
  match-records: true                    # fall back to a matching trader record (TRADER_ID = TRDR-<USER>, or the same NAME)
  landing-by-role: { desk-head: desk, trader: trader }   # the same {role: landing} hook for the trading role: below the person's own choice
  live-statuses: [NEW, VALIDATED, AMENDED]                # a trade counts in DV01, top lists and the check when its status is one of these
  limit-days: 5                          # the Desk head's limit use by book: this many business dates (the official records)
  pnl-var-days: 60                       # the Desk head's P&L against VaR: this many days of the desk's official history
  max-rows: 20000                        # the most trade valuations read per date for a scope (more: the figures say partial)

