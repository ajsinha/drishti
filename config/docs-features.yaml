# The documentation's feature register (the documentation rules, docs/architecture/IMPLEMENTATION_PLAN.md): every major feature of the product with its ONE guide
# and its ONE tutorial (paths under docs/), its domain module (core, banking, capitalmarkets, economy), the lenses whose Help shows it
# (all: every lens) and the line budgets of both. drishti-console/tests/test_docs_gates.py holds the files to it:
#   - every guide and tutorial named here exists, and every guide under docs/guides/ and tutorial under docs/tutorials/ is named here
#     once (or is a reference: references:);
#   - a feature whose guide or tutorial is not written yet says so with `guide: after <release>` / `tutorial: after <release>`;
#   - a page over its budget by more than 10% is reported (a warning: the budgets are targets the rewrite works toward).
# A feature's Help rows are help.yaml's (or its module's help.yaml); `domain:` here and on the Help row agree.

features:
  # Start and analyse (core)
