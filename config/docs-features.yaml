# The feature register of the documentation: every major feature has exactly one guide and one tutorial (the owner's rule: one guide and
# one tutorial per major feature, nothing more for users). Read by tools/docs/docs_gates.py, the docs gates (warn mode until the end of
# 2.9.11.g, then fail): a feature whose guide or tutorial is missing, a guide or tutorial over its budget by more than 10%, and the counts
# over their caps are reported.
#
# Per feature: id; name; who; guide (the target path under docs/) and guide_budget (hand-written lines); tutorial (the target path, or
# "after <release>" when it waits for one) and tutorial_budget; domain (core, risk, world); lenses (who sees it in Help: all, or lens
# ids); section (the Help section); contracts (the contract pages it links to); sources (today's documents that fold into it).

caps:                       # the count caps the gates check
  guides: 24
  tutorials: 23
  reference: 10
  contracts: 30
  knowledge: 5
  help-entries: 65
budget-tolerance: 0.10      # a guide or tutorial over its budget by more than this is reported

