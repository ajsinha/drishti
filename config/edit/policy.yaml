# Write-back's approval policy (docs/guides/WRITE_BACK.md › The design and its reasons, sections 9 and 12). A form's save: may ask for more approvals, never fewer.
policy:
  approval:
    overlay: none        # none | one | two: a correction kept in Drishti
    owned: none          # Drishti's own records
    source: one          # an amendment sent to a source system through a connector's writes:
  approver-roles: []     # who approves; empty: holders of the approve power and administrators
  self-approval: false   # four eyes: nobody approves their own change
  restate-role: restate  # a change to a past business date (a restatement) needs this role
  override-role: override   # "Apply mine anyway" on a conflict needs this role
  # kinds:               # per kind, stricter only
  #   trade: { approval: { overlay: one } }
