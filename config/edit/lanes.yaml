# Write-back's lanes (docs/architecture/WRITE_BACK.md section 7): each record's changes go through one lane, in order; lanes apply in parallel.
lanes:
  lanes: 64              # P, a power of two; change it only with the lanes drained (new changes wait, the lanes empty, P changes)
  max-lane-depth: 1000   # a lane deeper than this refuses new changes: "busy, try again" (DRS-9304); the draft is kept
  lane-warn: 2s          # Admin -> Edits warns when a lane's oldest change has waited longer
  lane-lease: 10s        # a lane's owner renews its lease every third of this; another node may take the lane only after it runs out
  command-timeout: 30s   # a source command sent and not confirmed for longer is shown as unconfirmed on Admin -> Edits
