# The kernel's own part of every distribution (docs/architecture/DISTRIBUTIONS.md section 10): its packs, its command words and its top
# menus. The modules a distribution lists describe themselves in their own manifests (modules/<id>/module.yaml for a content module, a
# module jar's META-INF/drishti/module.yaml); the kernel and the console read both the same way.
format: 1

kernel:                                    # in every distribution
  packs: [core]
  words: [BI, RUPAKA, FORM, FUNC, WHAT, DATAMAP, DATA, EXPORT, PIVOT]
  menus: [views, bi, build, admin, help, me]
