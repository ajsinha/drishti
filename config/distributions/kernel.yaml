# The kernel's own part of every distribution (docs/architecture/DISTRIBUTIONS.md section 10): its packs, its command words, its top
# menus and the feature switches a distribution's features: presets. The modules a distribution lists describe themselves in their own manifests (modules/<id>/module.yaml for a content module, a
# module jar's META-INF/drishti/module.yaml); the kernel and the console read both the same way.
format: 1

kernel:                                    # in every distribution
  packs: [core]
  words: [BI, RUPAKA, FORM, FUNC, WHAT, DATAMAP, DATA, EXPORT, PIVOT]
  menus: [views, bi, build, admin, help, me]

# What each feature a distribution names (features: in config/distributions/drishti.<name>.yaml) presets, on the server and in the console
# (docs/guides/ADMIN_GUIDE.md, the three layers of switches). A value of off presets false; any other value (on) presets true. A setting the
# product writes as ${VARIABLE:default} keeps its variable, so the site still wins. A feature a distribution does not name keeps the
# product's default. The console's features.* flags are the console-only switches (all on by default). A lens never presets anything.
features:
  bi:            { server: [drishti.bi.enabled], console: [bi.enabled] }
  calc:          { server: [drishti.calc.enabled], console: [labs.calc] }       # Labs: Calc, Python in the browser, a scratch pad; off as shipped
  layouts:       { server: [drishti.layouts.enabled], console: [layouts.enabled] }
  pivot:         { server: [drishti.pivot.enabled] }
  reports:       { server: [drishti.reports.enabled], console: [features.reports] }
  collaboration: { server: [drishti.collab.enabled], console: [features.collaboration] }
  var:           { server: [drishti.engines.var.enabled] }        # an engine: off only (it does not exist here); where it runs is its engine switch (config/engines/<id>.yaml)
  exposure:      { server: [drishti.engines.exposure.enabled] }
  frtb-sa:       { server: [drishti.engines.frtb-sa.enabled] }
  simm:          { server: [drishti.engines.simm.enabled] }
  governance:    { server: [drishti.governance.enabled] }
  ai:            { server: [drishti.ai.enabled], console: [ai.enabled] }
  mcp:           { server: [drishti.mcp.enabled], console: [mcp.enabled] }
  embed:         { server: [drishti.embed.enabled], console: [embed.enabled] }
  python:        { server: [drishti.bi.transform.enabled] }
  designer:      { console: [ui.designer] }
  facts:         { console: [ui.facts.enabled] }
  build:         { console: [features.build] }          # Build: new screens, new packs, designs, reviews, changes
  forms:         { console: [features.forms] }          # query by form (FORM, /forms)
  datamap:       { console: [features.datamap] }        # the data map (DATAMAP, /datamap)
  data:          { server: [drishti.data-view.enabled], console: [features.data] }   # Export data (EXPORT, /data): every dataset, a day as .jsonl.gz
  internal-only-data: { server: [drishti.data-view.internal-only-download] }        # off: Export data refuses datasets marked internal only
  workspaces:    { console: [features.workspaces] }     # /w
  monitors:      { console: [features.monitors] }       # /m
  alerts:        { console: [features.alerts] }         # /alerts
  lakes:         { console: [features.lakes] }          # Admin -> Lakes
