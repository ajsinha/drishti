# Drishti Genomics (docs/architecture/DISTRIBUTIONS.md section 4): the sample that proves the kernel carries no finance. The kernel and
# the genomics module (modules/genomics: a VCF reader; kinds variant, sample, gene, cohort; VARIANT, GENE, COHORT), nothing else: none of
# the kernel's packs (no counterparty, book or desk), the Research lens.
format: 1
distribution: drishti.genomics
version: 1.0.0
kernel: ">=2.9.11 <2.10"

brand:
  product: Drishti Genomics
  product_native: दृष्टि
  tagline: What is in this cohort's data?
  owner: Ashutosh Sinha
  copyright: Copyright © 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
  notice: Unauthorised copying, use or distribution is prohibited.
  logo: ""
  favicon: ""
  about: ""
  support: { email: "", url: "" }

theme: { tokens: green, mode: light, density: comfortable }

modules:
  - { id: genomics }

kernel-packs: []                           # none of the kernel's packs: the module serves its own kinds

lenses:
  offered: [research]
  default: research

menus:
  top: [genomics, views, bi, admin, help]
  placeholder: "GENE TP53, COHORT COH-A, VARIANT HX-A001 …  then <GO>"

docs: { title: Drishti Genomics Help }
demo: { ships: false, enabled: false }
locale: { language: en }
