# Drishti Finance (docs/architecture/DISTRIBUTIONS.md section 3): investment and research analysts, economists, portfolio and fund
# analysts. "What are these companies, funds and economies doing, and what moves them?" No VaR or any other risk number (decision 1):
# the banking module's commands, words, menus, Help and AI tools do not exist here; market data is shared with Drishti Risk (decision 2).
format: 1
distribution: drishti.finance
version: 1.0.0
kernel: ">=2.9.11 <2.10"

brand:
  product: Drishti Finance
  product_native: दृष्टि
  tagline: Companies, funds, markets and economies. One grammar.
  owner: Ashutosh Sinha
  copyright: Copyright © 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
  notice: Unauthorised copying, use or distribution is prohibited.
  logo: ""
  favicon: ""
  about: ""
  support: { email: "", url: "" }

theme: { tokens: light, mode: light, density: comfortable }   # slate and teal, light, comfortable

modules:
  - { id: capital-markets, required: true }
  - { id: economy,         required: true }
  - { id: market-data,     required: true }

lenses:
  offered: [world]                         # the Markets lens joins when capital-markets ships as a module (wave 2)
  default: world

menus:
  top: [views, economies, markets, companies, curves, volatility, fx, credit, bi, admin, help]
  placeholder: "USEQ AAPL, FUND SPY, ECON CAN, NEWS rates, CRV USD-SOFR …  then <GO>"

home:
  cards: [USEQ AAPL, FUND SPY, ECON CAN, NEWS rates]

features: { internal-only-data: off }      # IMF data and US equity prices stay internal-only, as today

docs: { title: Drishti Finance Help }
demo: { ships: true, enabled: true }
locale: { language: en }
