# Drishti Risk (docs/architecture/DISTRIBUTIONS.md section 2): traders, risk analysts, risk managers, middle office, model validation.
# "What is my risk, why did it move, am I within limits?" Banking plus the shared market data; no economy or capital-markets command,
# menu, Help page or AI tool exists here.
format: 1
distribution: drishti.risk
version: 1.0.0
kernel: ">=2.9.11 <2.10"

brand:
  product: Drishti Risk
  product_native: दृष्टि
  tagline: VaR, exposure and limits from your own pricing data
  owner: Ashutosh Sinha
  copyright: Copyright © 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
  notice: Unauthorised copying, use or distribution is prohibited.
  logo: ""
  favicon: ""
  about: ""
  support: { email: "", url: "" }

theme: { tokens: terminal-blue, mode: dark, density: compact }   # navy, dark, terminal density

modules:
  - { id: banking,     required: true }
  - { id: market-data, required: true }

lenses:
  offered: [risk, trading, market]
  default: risk

menus:
  top: [views, domains, create, admin, help]
  placeholder: "VAR BANK, VRES DESK:RATES, EXP CPTY:CP-ALDERSHOT, CRV USD-SOFR …  then <GO>"

home:
  cards: [VAR BANK, VAR DESK RATES, "VRES DESK:RATES", "EXP CPTY:CP-ALDERSHOT"]

docs: { title: Drishti Risk Help }
demo: { ships: true, enabled: true }
locale: { language: en }
