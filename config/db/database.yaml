# The Drishti database (docs/architecture/DATA_ARCHITECTURE.md, "The Drishti database"): ONE relational database for every table
# Drishti owns: users, roles, sessions, tokens and the audit trail; the write-back edit log, lanes and change requests; governance;
# BI workspaces, items and runs; compute approvals; collaboration; and the content store when its backend is `database`.
# The server reads this file at start (application.yaml imports it; DRISHTI_DATABASE_CONFIG names another file); a missing file or key
# means the value shown here. Every node of a cluster must use the same settings, and a cluster needs PostgreSQL.
#
# The schema is two complete files in the server (db/schema-sqlite.sql, db/schema-postgres.sql), applied at every start; there are no
# migrations. Upgrading the schema or switching between SQLite and PostgreSQL is a copy into a fresh database:
#   drishti.py db copy --from config/db/database.yaml --to new-database.yaml       (docs/admin/OPERATIONS.md, "Upgrading the Drishti database")
drishti:
  database:
    kind: ${DRISHTI_DB_KIND:sqlite}         # sqlite (one file, nothing to install; one node) | postgres (several nodes, production)
    sqlite:
      file: ${DRISHTI_DB_FILE:${drishti.data.dir:./data}/identity/drishti.db}   # the database file, under the data folder
    postgres:
      url: ${DRISHTI_DB_URL:}               # e.g. jdbc:postgresql://db.example.internal:5432/drishti (required with kind postgres)
      user: ${DRISHTI_DB_USER:drishti}      # the database user
      password: ${DRISHTI_DB_PASSWORD:}     # its password, from the environment only
    pool:                                   # a key left out is the site's drishti.db.pool.* (application.yaml)
      # size: 20                            # most connections; unset: drishti.db.pool.size (20) on PostgreSQL, 8 on SQLite (one writer)
      # min-idle: 2                         # idle connections kept when quiet
      # idle-timeout: 10m                   # an idle connection beyond min-idle is closed after this long
      # max-lifetime: 30m                   # a connection is replaced after this long
      # connection-timeout: 10s             # a caller waits this long for a free connection, then fails
      # leak-threshold: 60s                 # a connection borrowed longer than this is logged with the borrower's stack (0 = off)
      # statement-timeout: 5m               # longest one statement may run (PostgreSQL only; 0 = none)
