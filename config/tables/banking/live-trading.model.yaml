# Migrated from config/bi/models/live-trading.model.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
model: live-trading
version: 1.0.0
title: Live trading desk
description: "The trades as they tick: counts, notional, mark-to-market and P&L by desk, book, product and currency, kept up to date by the live feed. Traders are masked for readers without the raw power."
sample: true
endorsement: promoted
tags: [sample, trading, live, streaming, tutorial]
tables:
  trade: { table: banking.live_trading_trade, role: fact }
measures:
  Trades:         { expr: count(trade), description: Number of trades followed. }
  Notional:       { expr: sum(trade.NOTIONAL), format: amount0 }
  MTM:            { expr: sum(trade.MTM), format: signed0, description: Net mark-to-market in USD. }
  PnL 1d:         { expr: sum(trade.PNL_1D), format: signed0 }
  Losses:         { expr: "sum(trade.MTM, where = trade.MTM < 0)", format: signed0, description: The negative marks only. }
  Worst trade:    { expr: min(trade.MTM), format: signed0 }
  Best trade:     { expr: max(trade.MTM), format: signed0 }
  MTM history:    { expr: sum(history.MTM), format: signed0, description: "the sampled values of MTM added up at each sample time; chart it by history.ts" }
  Losses history: { expr: sum(history.Losses), format: signed0, description: "the sampled values of Losses added up at each sample time; chart it by history.ts" }
  Trades history: { expr: sum(history.Trades), description: "the sampled values of Trades added up at each sample time; chart it by history.ts" }
hierarchies:
  Desk and book: [trade.DESK, trade.PORTFOLIO]
rollups: [{ name: byDeskBook, table: trade, by: [DESK, PORTFOLIO, PRODUCT_TYPE, CURRENCY], measures: [Trades, Notional, MTM, PnL 1d, Worst trade, Best trade] }]
history: { every: "10s", keep: 360, measures: [MTM, Losses, Trades] }
