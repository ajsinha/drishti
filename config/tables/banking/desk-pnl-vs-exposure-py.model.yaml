# Migrated from config/bi/models/desk-pnl-vs-exposure-py.model.yaml by drishti.py tables migrate (docs/architecture/ARCHITECTURE.md §28 section 4).
rachana: 3
model: desk-pnl-vs-exposure-py
version: 1.0.0
title: "Desk P&L vs counterparty exposure (Python)"
description: "The same table as desk-pnl-vs-exposure, made by a Python Transform from the P&L of trading-risk and the exposure of counterparty-exposure."
sample: true
endorsement: promoted
tags: [sample, multi-dataset, derived, python, counterparty-risk]
tables:
  result: { table: banking.desk_pnl_vs_exposure_py_result, role: fact }
measures:
  Desk P&L:           { expr: sum(result.desk_pnl), format: signed0 }
  Exposure (EE peak): { expr: sum(result.ee_peak), format: amount0, description: "The netting sets' computed peak expected exposure (counterparty-exposure's measure, from the official results) summed per counterparty: a reporting sum of the sets' peaks." }
  P&L per exposure:   { expr: "ratio(sum(result.desk_pnl), sum(result.ee_peak))", format: signed2, description: Computed in YAML over the frame the Transform returned. }
  Counterparties:     { expr: count(result) }
