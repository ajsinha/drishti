# Migrated from config/bi/datasets/trading-cashflows-cashflows.dataset.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
table: banking.trading_cashflows_cashflows
was: trading-cashflows-cashflows
version: 1.0.0
title: "Trade legs and cashflows: cashflows"
description: The cashflows table of the model trading-cashflows.
sample: true
endorsement: promoted
tags: [sample, trading, nested, cashflows]
from: { kind: trade }
grain: "$.LEGS[*].CASH_FLOWS[*]"
columns:
  LEG_ID:       { path: "^.LEG_ID", type: integer }
  CURRENCY:     { path: "^.CURRENCY", type: string }
  FLOW_TYPE:    { path: "@.FLOW_TYPE", type: string }
  FLOW_ID:      { path: "@.FLOW_ID", type: integer }
  PAYMENT_DATE: { path: "@.PAYMENT_DATE", type: date }
  START_DATE:   { path: "@.START_DATE", type: date }
  END_DATE:     { path: "@.END_DATE", type: date }
  NOTIONAL:     { path: "@.NOTIONAL", type: decimal, format: amount0 }
  RATE:         { path: "@.RATE", type: decimal }
refresh: { on-load: true }
materialize: on-load
