# Migrated from config/bi/datasets/trading-cashflows-payments.dataset.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
table: banking.trading_cashflows_payments
was: trading-cashflows-payments
version: 1.0.0
title: "Trade legs and cashflows: payments"
description: "The payments (EVENTS) of the trades of the model trading-cashflows: paid − / received +, in the event's currency."
sample: true
endorsement: promoted
tags: [sample, trading, nested, cashflows]
from: { kind: trade }
grain: "$.EVENTS[*]"
columns:
  EVENT_ID:     { path: "@.EVENT_ID", type: integer }
  LEG_ID:       { path: "@.LEG_ID", type: integer }
  EVENT_TYPE:   { path: "@.EVENT_TYPE", type: string }
  PAYMENT_TYPE: { path: "@.PAYMENT_TYPE", type: string }
  EVENT_DATE:   { path: "@.EVENT_DATE", type: date }
  AMOUNT:       { path: "@.AMOUNT", type: decimal, format: signed0 }
  CURRENCY:     { path: "@.CURRENCY", type: string }
refresh: { on-load: true }
materialize: on-load
