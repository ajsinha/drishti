# Migrated from config/bi/models/live-exposure.model.yaml by drishti.py tables migrate (docs/architecture/ARCHITECTURE.md §28 section 4).
rachana: 3
model: live-exposure
version: 1.0.0
title: Live exposure
description: "Netting sets with their net mark-to-market, collateral, limit and trade count, updated as they tick. The computed exposure (EE and PFE peaks) is not live: it is the exposure engine's official end-of-day result, in the models counterparty-exposure and trading-risk."
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, live, streaming]
tables:
  netting: { table: banking.live_exposure_netting, role: fact }
measures:
  Netting sets:  { expr: count(netting) }
  Net MTM:       { expr: sum(netting.NET_MTM), format: signed0 }
  Collateral:    { expr: sum(netting.COLLATERAL), format: signed0 }
  Trades:        { expr: sum(netting.TRADE_COUNT), format: amount0 }
  Worst net MTM: { expr: min(netting.NET_MTM), format: signed0 }
