# Migrated from config/bi/models/trading-cashflows.model.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
model: trading-cashflows
version: 1.0.0
title: Trade legs and cashflows
description: "Legs and scheduled cashflows of the trading pack's trades as tables (one row per array element), joined to their trade. Shows cashflow amount by pay month, notional by leg direction and a nested model. Reads documents once per business date (arrays cannot come from promoted columns), so it is slower to build than the other samples."
sample: true
endorsement: promoted
tags: [sample, trading, nested, cashflows]
tables:
  trades:    { table: banking.trading_cashflows_trades, role: dimension }
  legs:      { table: banking.trading_cashflows_legs, role: fact }
  cashflows: { table: banking.trading_cashflows_cashflows, role: fact }
  payments:  { table: banking.trading_cashflows_payments, role: fact }
relationships:
  - { from: legs.id, to: trades.id }
  - { from: cashflows.id, to: trades.id }
  - { from: payments.id, to: trades.id }
measures:
  Cashflow amount:       { expr: "sum(payments.AMOUNT * (payments.CURRENCY == 'JPY' ? 1 / 148.2 : payments.CURRENCY == 'EUR' ? 1.174 : payments.CURRENCY == 'GBP' ? 1.348 : payments.CURRENCY == 'CAD' ? 1 / 1.389 : payments.CURRENCY == 'CHF' ? 1 / 0.796 : payments.CURRENCY == 'AUD' ? 0.661 : payments.CURRENCY == 'USD' ? 1 : null))", format: signed0, description: "Net payments in USD equivalent: the trades' EVENTS amounts, paid − / received +, each converted from its own currency at the sample spot." }
  Payments:              { expr: count(payments), description: Payment events (EVENTS) of the trades. }
  Largest payment:       { expr: "max(abs(payments.AMOUNT * (payments.CURRENCY == 'JPY' ? 1 / 148.2 : payments.CURRENCY == 'EUR' ? 1.174 : payments.CURRENCY == 'GBP' ? 1.348 : payments.CURRENCY == 'CAD' ? 1 / 1.389 : payments.CURRENCY == 'CHF' ? 1 / 0.796 : payments.CURRENCY == 'AUD' ? 0.661 : payments.CURRENCY == 'USD' ? 1 : null)))", format: amount0, description: "The largest single payment, either way, in USD equivalent." }
  Scheduled notional:    { expr: "sum(cashflows.NOTIONAL * (cashflows.CURRENCY == 'JPY' ? 1 / 148.2 : cashflows.CURRENCY == 'EUR' ? 1.174 : cashflows.CURRENCY == 'GBP' ? 1.348 : cashflows.CURRENCY == 'CAD' ? 1 / 1.389 : cashflows.CURRENCY == 'CHF' ? 1 / 0.796 : cashflows.CURRENCY == 'AUD' ? 0.661 : cashflows.CURRENCY == 'USD' ? 1 : null))", format: amount0, description: "The cashflows' period principal in USD equivalent: every period carries its notional, so this is scheduled exposure (notional times periods), not cash." }
  Trade notional:        { expr: sum(trades.NOTIONAL), format: amount0, description: "The trades' notional (first leg), in the trades' own currencies: group by trades.CURRENCY before reading it as money." }
  Trades:                { expr: count(trades), description: "Trades of every source system (ENDUR, CALYPSO, MUREX): group by trades.SOURCE_SYSTEM to see each." }
  Cashflows:             { expr: count(cashflows) }
  Average cashflow:      { expr: "avg(cashflows.NOTIONAL * (cashflows.CURRENCY == 'JPY' ? 1 / 148.2 : cashflows.CURRENCY == 'EUR' ? 1.174 : cashflows.CURRENCY == 'GBP' ? 1.348 : cashflows.CURRENCY == 'CAD' ? 1 / 1.389 : cashflows.CURRENCY == 'CHF' ? 1 / 0.796 : cashflows.CURRENCY == 'AUD' ? 0.661 : cashflows.CURRENCY == 'USD' ? 1 : null))", format: amount0, description: "A period's principal in USD equivalent, on average." }
  Largest cashflow:      { expr: "max(cashflows.NOTIONAL * (cashflows.CURRENCY == 'JPY' ? 1 / 148.2 : cashflows.CURRENCY == 'EUR' ? 1.174 : cashflows.CURRENCY == 'GBP' ? 1.348 : cashflows.CURRENCY == 'CAD' ? 1 / 1.389 : cashflows.CURRENCY == 'CHF' ? 1 / 0.796 : cashflows.CURRENCY == 'AUD' ? 0.661 : cashflows.CURRENCY == 'USD' ? 1 : null))", format: amount0, description: The largest period principal in USD equivalent. }
  Legs:                  { expr: count(legs) }
  Leg notional:          { expr: sum(legs.NOTIONAL), format: amount0 }
  Trades with cashflows: { expr: distinct(cashflows.id) }
hierarchies:
  Pay date: [payments.EVENT_DATE.year, payments.EVENT_DATE.quarter, payments.EVENT_DATE.month, payments.EVENT_DATE]
  Cashflow date: [cashflows.PAYMENT_DATE.year, cashflows.PAYMENT_DATE.quarter, cashflows.PAYMENT_DATE.month, cashflows.PAYMENT_DATE]
