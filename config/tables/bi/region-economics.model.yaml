# Migrated from config/bi/models/region-economics.model.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
model: region-economics
version: 1.0.0
title: Region economics
description: "Population and GDP of the Australian states and territories and the US states, by country and ISO 3166-2 region code, so a map can shade the regions. Illustrative, rounded from public figures, not for reporting (population to the nearest 10,000, GDP to the nearest US$ billion)."
sample: true
endorsement: promoted
tags: [sample, economics, illustrative, map]
tables:
  regions: { table: bi.region_economics_regions, role: fact }
measures:
  Population:         { expr: sum(regions.POPULATION), format: amount0, description: "People living in the region, rounded to the nearest 10,000. Illustrative." }
  GDP (USD bn):       { expr: sum(regions.GDP_USD_BN), format: amount0, description: "Output in US dollars, billions, rounded to the nearest billion. Illustrative, not for reporting." }
  GDP per head (USD): { expr: "ratio(sum(regions.GDP_USD_BN), sum(regions.POPULATION)) * 1000000000", format: amount0, description: "GDP over population: for a country, its regions' total GDP over their total population. Illustrative." }
hierarchies:
  Country and region: [regions.COUNTRY_NAME, regions.NAME]
