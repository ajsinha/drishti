# Migrated from config/bi/models/world-economics.model.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
model: world-economics
version: 1.0.0
title: World economics
description: "Output, growth, prices, jobs and population for about 200 economies (World Bank, latest year published), by country, World Bank region and income group. The country is an ISO 3166-1 alpha-3 code, so a map visual can shade it."
sample: true
endorsement: promoted
tags: [sample, economics, real-data, map]
tables:
  economies: { table: bi.world_economics_economies, role: fact }
measures:
  Economies:            { expr: count(economies), description: How many economies. }
  GDP (USD bn):         { expr: sum(economies.GDP_USD_BN), format: amount0, description: "Gross domestic product at current prices, USD billions." }
  Population (m):       { expr: sum(economies.POPULATION_M), format: price2, description: "Population, millions." }
  GDP per capita (USD): { expr: "ratio(sum(economies.GDP_USD_BN), sum(economies.POPULATION_M)) * 1000", format: amount0, description: "GDP over population: for a region, its total GDP over its total population." }
  Average growth:       { expr: avg(economies.GROWTH), format: pc2, description: "The simple average of the economies' real GDP growth, % a year." }
  Average inflation:    { expr: avg(economies.INFLATION), format: pc2, description: "The simple average of consumer-price inflation, % a year." }
  Average unemployment: { expr: avg(economies.UNEMPLOYMENT), format: pc2, description: "The simple average of the unemployment rate, % of the labour force." }
