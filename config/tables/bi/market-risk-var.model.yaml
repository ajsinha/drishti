# Migrated from config/bi/models/market-risk-var.model.yaml by drishti.py tables migrate (docs/architecture/BI_FOUNDATION_2911E.md section 4).
rachana: 3
model: market-risk-var
version: 1.0.0
title: "Market risk: VaR (official)"
description: "The official end-of-day 1-day VaR (99%) and expected shortfall (97.5%) of every node of the bank's hierarchies, by node, level (bank, legal entity, division, desk, book), hierarchy and business date, with each node's VaR limit, limit use, hypothetical P&L and backtest. VaR is not additive: every measure reads a node's own value, never a sum across nodes."
sample: true
endorsement: promoted
tags: [sample, market-risk, var]
tables:
  nodes: { table: bi.market_risk_var_latest, role: fact }
measures:
  "VaR 99%":           { expr: max(nodes.VAR), format: amount0, additive: false, description: "The node's official 1-day VaR at 99%, USD. Not additive: at one node and date it is that node's own figure (max over its one row); over several nodes it is the largest of them, never their sum. Group by node or filter to one." }
  "ES 97.5%":          { expr: max(nodes.ES), format: amount0, additive: false, description: "The node's official expected shortfall at 97.5%, USD. Not additive, read as VaR 99% is: the node's own figure, never a sum across nodes." }
  Bank VaR:            { expr: "max(nodes.VAR, where = nodes.NODE_ID == 'MGMT~BANK')", format: amount0, additive: false, description: "The bank's own official VaR (the MGMT hierarchy's root), not a sum of its parts." }
  Bank ES:             { expr: "max(nodes.ES, where = nodes.NODE_ID == 'MGMT~BANK')", format: amount0, additive: false, description: "The bank's own official expected shortfall (the MGMT hierarchy's root)." }
  VaR limit:           { expr: max(nodes.LIMIT), format: amount0, additive: false, description: "The node's VaR limit from the hierarchy (the node's own value, never summed)." }
  Limit use:           { expr: max(nodes.LIMIT_USE), format: pct, additive: false, description: "The node's VaR over its limit (the node's own value; over several nodes, the highest)." }
  Hypothetical P&L:    { expr: max(nodes.HYPO_PNL), format: signed0, additive: false, description: "The node's hypothetical P&L for the date, the backtest's input (the node's own value, never summed)." }
  Diversification:     { expr: max(nodes.DIVERSIFICATION), format: amount0, additive: false, description: "The sum of the node's children's standalone VaRs minus its VaR: what holding them together saves." }
  Backtest exceptions: { expr: max(nodes.EXCEPTIONS_250), additive: false, description: "Days in the official history (up to 250) whose loss exceeded the VaR of the day before, for the node." }
  Nodes:               { expr: count(nodes), description: How many nodes (one row per node and date). }
  VaR confidence:      { expr: max(nodes.CONFIDENCE), format: pct, additive: false, description: "The confidence the official VaR is at (2.9.7: each row says it; 99% unless drishti.var.confidence is set otherwise). Every official figure is 1-day (nodes.HORIZON 1D, nodes.METHOD empty): a future 10-day record will say 10D and its method." }
  ES confidence:       { expr: max(nodes.ES_CONFIDENCE), format: pct, additive: false, description: "The confidence of the official expected shortfall (97.5% unless set otherwise)." }
hierarchies:
  Node: [nodes.HIERARCHY, nodes.LEVEL, nodes.NODE_NAME]
