# Example: a laptop or demo machine (one node, a small heap). Copy over config/runs/runs.yaml. Keys left out keep their defaults
# (config/runs/runs.yaml, docs/architecture/BI_RUNS.md section 15).
inline:
  wait: 2s
workers: 1                         # one run at a time beside interactive work
engine:
  memory-limit: 768MB
  threads: 1
  max-spill: 4GB
store:
  max-bytes: 4GB
  max-bytes-per-user: 1GB
retention:
  days: 7
