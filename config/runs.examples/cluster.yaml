# Example: a node of a Drishti*net cluster with a shared identity database. Copy over config/runs/runs.yaml on every node. Keys left
# out keep their defaults (config/runs/runs.yaml, docs/architecture/BI_RUNS.md sections 13 and 15).
workers: 4
queue:
  per-user: 10
  max: 500
engine:
  memory-limit: 8GB
  threads: 4
  max-spill: 100GB
store:
  dir: /mnt/efs/drishti/bi-runs   # a folder every node sees at the same path (AWS EFS): any node reads any result
  max-bytes: 200GB
  max-bytes-per-user: 10GB
lease:
  renew: 10s
  ttl: 45s
workspace-visibility: members
