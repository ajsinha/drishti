# Example settings file for a developer machine (docs/admin/CONFIGURATION.md, "The settings file").
# README: nothing reads this folder automatically. Copy a file out, edit the paths, and name it on the command line:
#   -Ddrishti.settings.file=/full/absolute/path/to/your-dev.ini[,/full/absolute/path/to/your-secrets.ini]
# (an IDE's VM options, python tools/drishti.py --settings FILE start server). An explicit -D beats every file; a later
# file beats an earlier one. Every path is absolute. Passwords and tokens go in a second file (secrets.ini), never here.
#
# A section without a dot ([roots]
# The checkout, its data folder and its modules. Windows: C:/Users/you/IdeaProjects/drishti (forward slashes, or doubled backslashes).
drishti.home=/path/to/drishti
drishti.data.dir=/path/to/drishti/data
drishti.modules.home=/path/to/drishti/modules

# Site overrides of module files (docs/architecture/KERNEL_AND_MODULES.md section 18.10): a file at <module>/<path inside the module>
# in this folder replaces the module's file at start (a Sutra, a pack's YAML, console/plugin.yaml ...; never module.yaml, java/ or the
# connector templates). Several folders: comma-separated, the right-most wins. Admin -> Health lists every overridden file.
# drishti.overrides.dir=/path/to/drishti-overrides

# The console's own settings (run_drishti_web.py --settings, python tools/drishti.py --settings FILE start console): it reads only the keys under console.,
# so nothing else in this file moves the console.
[console.backend]
url=http://127.0.0.1:18480

# ---- optional: everything below is left out on a plain developer or QA machine --------------------------------------------------------
# The IDE launchers set the server's port (-Dserver.port or DRISHTI_PORT); give one here only to move every launcher at once.
# [server]
# server.port=18480

# The demo lake (config/lakes/demo.yaml) somewhere other than <data>/delta/demo.
# [lake.demo]
# root=/path/to/drishti/data/delta/demo

# A second lake for the trading pack's own data: a lake file you add, config/lakes/trading.yaml, holds its tables (none is shipped); this
# says where it is. With [pack.trading] the trading pack's connectors read that lake instead of the demo lake: build it first, or every
# trade reads as none.
# [lake.trading]
# root=/path/to/drishti/data/delta/trading
# [pack.trading]
# lake=trading

# No broker is needed: a stream connector whose broker does not answer waits (Admin shows "waiting for broker") and the rest works.
# The broker the shipped streaming templates name (broker: default), when you run a Kafka on this machine:
# [broker.default]
# type=kafka
# bootstrap-servers=localhost:9092

# The demo's RabbitMQ (deploy/docker/compose.data.yaml), for a rabbitmq connector that says broker: rabbit-local.
# [broker.rabbit-local]
# type=rabbitmq
# uri=amqp://localhost:5672/%2f
