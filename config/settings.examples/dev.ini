# Example settings file for a developer machine (docs/admin/CONFIGURATION.md, "The settings file").
# README: nothing reads this folder automatically. Copy a file out, edit the paths, and name it on the command line:
#   -Ddrishti.settings.file=/full/absolute/path/to/your-dev.ini[,/full/absolute/path/to/your-secrets.ini]
# (an IDE's VM options, bin/start-server --settings, python tools/drishti.py --settings). An explicit -D beats every file; a later
# file beats an earlier one. Every path is absolute. Passwords and tokens go in a second file (secrets.ini), never here.
#
# A section without a dot ([roots], [server]) is a label: its keys are full names. A section with a dot is a namespace:
# root= under [lake.trading] is lake.trading.root (docs/admin/CONFIGURATION.md, "Named lakes, databases and brokers").

[roots]
drishti.home=/path/to/drishti
drishti.data.dir=/path/to/drishti-dev/data
drishti.modules.home=/path/to/drishti/modules

[server]
server.port=18480

# The demo lake (config/lakes/demo.yaml): where its tables are. Unset: <data>/delta/demo.
[lake.demo]
root=/path/to/drishti-dev/data/delta/demo

# A second lake for the trading pack's own data: config/lakes/trading.yaml holds its tables; this says where it is.
[lake.trading]
root=/path/to/drishti-dev/data/delta/trading

# The trading pack's connectors that read the shared demo lake read the trading lake instead; no other pack moves.
[pack.trading]
lake=trading

# The broker the shipped streaming templates name (broker: default): a Kafka on this machine, no security.
[broker.default]
type=kafka
bootstrap-servers=localhost:9092

# The demo's RabbitMQ (deploy/docker/compose.data.yaml), for a rabbitmq connector that says broker: rabbit-local.
[broker.rabbit-local]
type=rabbitmq
uri=amqp://localhost:5672/%2f

# The console's own settings (run_drishti_web.py --settings, bin/start-console --settings): it reads only the keys under console.,
# so the server's server.port above never moves the console.
[console.server]
port=17480

[console.backend]
url=http://127.0.0.1:18480
