# Example settings file for a developer machine (docs/admin/CONFIGURATION.md, "The settings file"). `python tools/drishti.py setup`
# copies it to ~/drishti-envs/dev.ini with your folders filled in; every launcher and `drishti.py --settings` names that copy.
# A later file beats an earlier one and an explicit -D beats every file. Every path is absolute (Windows: forward slashes).
# Passwords and tokens go in a second file (secrets.ini), never here. A profile (config/profiles/demo.ini, samples.ini, qa.ini)
# is named after this file and holds what makes the demo, the samples or the QA server.
#
# This machine's three folders (IDE_GUIDE.md section 2.1): drishti.home is your clone (lib/, config/, modules/), drishti.data.dir
# is where Drishti writes (lakes, databases, logs, temp), drishti.modules.home holds the .dmod packages `drishti.py build modules` makes.
drishti.home=/path/to/drishti
drishti.data.dir=/path/to/drishti/data
drishti.modules.home=/path/to/drishti/modules
# drishti.java.home=C:/jdk-21   (the JDK 21 the tools use; set it when JAVA_HOME names an older Java)

# Site overrides of module files (docs/architecture/KERNEL_AND_MODULES.md section 18.10): a file at <module>/<path inside the module>
# in this folder replaces the module's file at start (a Sutra, a pack's YAML, console/plugin.yaml ...; never module.yaml, java/ or the
# connector templates). Several folders: comma-separated, the right-most wins. Admin -> Health lists every overridden file.
# drishti.overrides.dir=/path/to/drishti-overrides

# ---- optional: everything below is left out on a plain developer or QA machine --------------------------------------------------------
# The console's own keys are under console. ([console.server] port=17481, [console.backend] url=...); the defaults are 17480 and the
# server on this machine's 18480. A port for the server ([server] server.port=18481) moves the server, the console's server address
# and the tools' --server default together.

# The demo lake (config/lakes/demo.yaml) somewhere other than <data>/delta/demo. Commented on purpose: by default the demo lake is
# <drishti.data.dir>/delta/demo; uncomment both lines only to move it.
# [lake.demo]
# root=/path/to/drishti/data/delta/demo

# A second lake for the trading pack's own data: a lake file you add, config/lakes/trading.yaml, holds its tables (none is shipped); this
# says where it is. With [pack.trading] the trading pack's connectors read that lake instead of the demo lake: build it first, or every
# trade reads as none.
# [lake.trading]
# root=/path/to/drishti/data/delta/trading
# [pack.trading]
# lake=trading

# No broker is needed: a stream connector whose broker does not answer waits (Admin shows "waiting for broker") and the rest works.
# The broker the shipped streaming templates name (broker: default), when you run a Kafka on this machine:
# [broker.default]
# type=kafka
# bootstrap-servers=localhost:9092

# The demo's RabbitMQ (deploy/docker/compose.data.yaml), for a rabbitmq connector that says broker: rabbit-local.
# [broker.rabbit-local]
# type=rabbitmq
# uri=amqp://localhost:5672/%2f
