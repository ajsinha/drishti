# Example settings file for a developer machine. Nothing reads this folder automatically:
# copy a file out, edit the paths, and name it with -Ddrishti.settings.file=/full/absolute/path/to/your.ini
# (python tools/drishti.py --settings /full/path/your.ini ...). An explicit -D beats the file; the file beats the defaults.
# Secrets never go here: keep them in secrets.env and give its path.

[roots]
drishti.data.dir=/path/to/drishti-dev/data
drishti.modules.home=/path/to/drishti/modules

[server]
server.port=18480
