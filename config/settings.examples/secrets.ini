# Example secrets file: only passwords, tokens and keys, under the same sections and keys as prod.ini (docs/admin/CONFIGURATION.md,
# "The settings file"). README: nothing reads this folder automatically. Give it as the LAST file so it wins:
#   -Ddrishti.settings.file=/etc/drishti/prod.ini,/etc/drishti/secrets.ini
# Keep it readable by the server's user only (chmod 600), out of version control. Every value here is shown as •••• in logs and
# Admin. A value may still be a ${VARIABLE} reference (resolved from the environment, e.g. deploy/stack/secrets.env) or be replaced
# by its <key>-file twin naming a mounted secret (sasl.password-file=/run/secrets/kafka-scram).

[db.identity]
password=change-me

[db.store]
password=change-me

[db.reporting]
password=${REPORTING_DB_PASSWORD}

[lake.risk]
storage.s3.access-key=AKIA-change-me
storage.s3.secret-key=change-me

[broker.kafka-eu]
tls.key-password=change-me

[broker.kafka-stores]
tls.truststore-password=change-me
tls.keystore-password=change-me
tls.key-password=change-me

[broker.kafka-plain]
sasl.password=change-me

[broker.kafka-scram]
sasl.password-file=/run/secrets/kafka-scram

[broker.kafka-oauth]
sasl.oauth.client-secret=change-me

[broker.confluent]
api-key=change-me
api-secret=change-me

[broker.activemq]
password=change-me

[broker.activemq-mtls]
tls.keystore-password=change-me

[broker.rabbit]
password=change-me
