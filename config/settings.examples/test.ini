# Example settings file for running tests from an IDE (IntelliJ: Run > Edit Configurations > templates > JUnit > VM options:
#   -Ddrishti.settings.file=/full/absolute/path/to/your-test.ini ).
# README: nothing reads this folder automatically. Only needed to pin roots: without it a test finds the repository and its module
# from its own code location. Every path is absolute (docs/admin/CONFIGURATION.md, "The settings file").

[roots]
drishti.repo.root=/path/to/drishti
drishti.data.dir=/path/to/drishti/target/ide-test-data

# A test lake apart from the developer's demo lake, so a test run never writes where the dev server reads.
[lake.demo]
root=/path/to/drishti/target/ide-test-data/delta/demo

# A local Kafka for the streaming tests that need a real broker (most start their own embedded one).
[broker.default]
type=kafka
bootstrap-servers=localhost:9092
