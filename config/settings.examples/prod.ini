# Example settings file for a production server (docs/admin/CONFIGURATION.md, "The settings file" and "Named lakes, databases and
# brokers"). README: nothing reads this folder automatically. Start with both files, the secrets last so they win:
#   -Ddrishti.settings.file=/etc/drishti/prod.ini,/etc/drishti/secrets.ini
# Every path is absolute. No password, token or key is written here: each lives in secrets.ini under the same section and key (or
# as a ${VARIABLE} reference resolved from the environment, or as a <key>-file naming a mounted secret). Every value may use
# ${key}, ${key:default} placeholders, resolved by the one resolver (-D, the settings files, the environment, the default).
# Admin -> Configuration -> Resolved paths shows each key with the file it came from; secrets are shown as ••••.

[roots]
# the production profile: the server and the console refuse to start while anything unsafe is set (docs/admin/PRODUCTION_STANDARD.md)
drishti.profile=production
# TLS ends at a proxy in front (the console binds 127.0.0.1 behind it); with server.ssl set up instead, leave this out
drishti.production.tls=proxy
drishti.home=/opt/drishti
# the site folder: every site file and every Admin change (connector overrides, engine and module switches, licence, lakes, approved settings);
# the release folder (drishti.home) is never written. Production refuses to start without it.
drishti.site.dir=/etc/drishti
drishti.data.dir=/var/lib/drishti/data
# the modules folder holds the packages (*.dmod) and first-party.yaml, beside the server jar in /opt/drishti/lib
drishti.modules.home=/opt/drishti/modules

# ---- lakes: one section per lake; config/lakes/<name>.yaml keeps its tables, this says where it is ----------------------------

[lake.demo]
root=/var/lib/drishti/data/delta/demo

[lake.risk]
root=s3://bank-risk-lake/drishti
storage.s3.region=us-east-1
storage.s3.endpoint=https://s3.us-east-1.amazonaws.com

[lake.trading]
root=/mnt/efs/lakes/trading

# ---- packs and connectors: bound by name ------------------------------------------------------------------------------------------

# Every market-risk connector that reads the shared demo lake reads the risk lake; the trading pack stays where it is.
[pack.market-risk]
lake=risk

[pack.trading]
lake=trading

# One connector's own settings, key by key over its template: Murex's live trades come from the EU cluster on their own topic.
[connector.trade-murex-live]
broker=kafka-eu
topics=murex.trades.v2

# The Endur stream on the SCRAM cluster; the Calypso stream on Confluent Cloud.
[connector.trade-endur-live]
broker=kafka-scram

[connector.trade-calypso-live]
broker=confluent

# ---- databases: url, user (the password is in secrets.ini) ------------------------------------------------------------------------

# The identity database (users, roles, workspaces, audit): drishti.identity.database-url reads db.identity.url.
[db.identity]
url=jdbc:postgresql://db.bank.internal:5432/drishti
user=drishti

# The content store's database (config/store/store.yaml, backend: postgres).
[db.store]
url=jdbc:postgresql://db.bank.internal:5432/drishti
user=drishti_store

# A reporting database a jdbc connector names with db: reporting.
[db.reporting]
url=jdbc:postgresql://reporting.bank.internal:5432/risk?sslmode=verify-full
user=drishti_reader

# ---- brokers: one per security form; a connector names one with broker: <name> -----------------------------------------------------

# Kafka, PLAINTEXT (a development cluster).
[broker.default]
type=kafka
bootstrap-servers=kafka-dev.bank.internal:9092

# Kafka over TLS: the bank's private CA (PEM), hostname verification on (the default).
[broker.kafka-tls]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9093,kafka-2.bank.internal:9093
security.protocol=SSL
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# Kafka, mutual TLS with PEM files: the client certificate and its key (an encrypted key's password is in secrets.ini).
[broker.kafka-eu]
type=kafka
bootstrap-servers=kafka-eu-1.bank.internal:9093,kafka-eu-2.bank.internal:9093
security.protocol=SSL
tls.ca-file=/etc/drishti/tls/bank-ca.pem
tls.cert-file=/etc/drishti/tls/drishti-client.pem
tls.key-file=/etc/drishti/tls/drishti-client.key

# Kafka, mutual TLS from a PKCS12 key store (one alias of it) and a JKS trust store; hostname verification off for an IP-named lab.
[broker.kafka-stores]
type=kafka
bootstrap-servers=10.20.0.11:9093
security.protocol=SSL
tls.truststore=/etc/drishti/tls/truststore.jks
tls.truststore-type=JKS
tls.keystore=/etc/drishti/tls/drishti.p12
tls.keystore-type=PKCS12
tls.key-alias=drishti
tls.verify-hostname=false

# Kafka, SASL PLAIN over TLS.
[broker.kafka-plain]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9094
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.username=drishti
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# Kafka, SCRAM-SHA-512 over TLS (SCRAM-SHA-256 alike).
[broker.kafka-scram]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9094,kafka-2.bank.internal:9094
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.username=drishti
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# Kafka, OAUTHBEARER (client-credentials flow against the bank's identity provider).
[broker.kafka-oauth]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9095
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.oauth.token-endpoint=https://idp.bank.internal/oauth2/token
sasl.oauth.client-id=drishti
sasl.oauth.scope=kafka
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# Kafka, Kerberos (GSSAPI) with a keytab.
[broker.kafka-kerberos]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9096
security.protocol=SASL_SSL
sasl.mechanism=GSSAPI
sasl.kerberos.principal=drishti@BANK.INTERNAL
sasl.kerberos.keytab=/etc/drishti/kerberos/drishti.keytab
sasl.kerberos.service-name=kafka
sasl.kerberos.krb5-conf=/etc/krb5.conf
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# Kafka, Kerberos from the ticket cache (after kinit), over plain SASL inside the data centre.
[broker.kafka-kinit]
type=kafka
bootstrap-servers=kafka-1.bank.internal:9097
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.use-ticket-cache=true

# Confluent Cloud: the flavour sets SASL_SSL and PLAIN; the API key and secret are in secrets.ini. client.* is any Kafka property.
[broker.confluent]
type=kafka
flavour=confluent
bootstrap-servers=pkc-xxxxx.us-east-1.aws.confluent.cloud:9092
client.max.poll.records=500
client.client.rack=use1-az1

# ActiveMQ (OpenWire) over TLS with the private CA; user name here, password in secrets.ini.
[broker.activemq]
type=activemq
broker-url=failover:(ssl://amq-1.bank.internal:61617,ssl://amq-2.bank.internal:61617)
user=drishti
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# ActiveMQ, mutual TLS from a PKCS12 key store.
[broker.activemq-mtls]
type=activemq
broker-url=ssl://amq-3.bank.internal:61617
tls.ca-file=/etc/drishti/tls/bank-ca.pem
tls.keystore=/etc/drishti/tls/drishti.p12
tls.keystore-type=PKCS12

# RabbitMQ over TLS, user name and password: the plugin reads them from the uri, so the uri refers to the password by its key and
# secrets.ini gives it ([broker.rabbit] password=...).
[broker.rabbit]
type=rabbitmq
uri=amqps://drishti:${broker.rabbit.password}@rabbit.bank.internal:5671/risk
tls.ca-file=/etc/drishti/tls/bank-ca.pem

# RabbitMQ, the client certificate is the log-in (EXTERNAL).
[broker.rabbit-cert]
type=rabbitmq
uri=amqps://rabbit.bank.internal:5671/risk
auth-mechanism=external
tls.ca-file=/etc/drishti/tls/bank-ca.pem
tls.cert-file=/etc/drishti/tls/drishti-client.pem
tls.key-file=/etc/drishti/tls/drishti-client.key
