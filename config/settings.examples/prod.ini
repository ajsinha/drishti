# Example settings file for a production server. Nothing reads this folder automatically; start with
#   -Ddrishti.settings.file=/etc/drishti/prod.ini
# Paths are absolute. Secrets stay out of this file: they live in secrets.env, which is referenced by its path.

[roots]
drishti.data.dir=/var/lib/drishti/data
drishti.modules.home=/opt/drishti/modules
