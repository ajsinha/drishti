# config/engines/memory-lake.yaml: the in-memory lake (docs/guides/DATA_LAKE_GUIDE.md). Read at start, imported by application.yaml after the jar's copy of this
# file, so a key here wins over the shipped one and application.local.yaml and the environment win over both
# (docs/guides/ADMIN_GUIDE.md section 3). Admin -> Engines writes the switch and changed: only; every other key is edited here.
drishti:
  engines:
    memory-lake:
      enabled: ${DRISHTI_MEMORY_LAKE_ENABLED:false}   # run the in-memory lake on this node; off as shipped: turning it on needs a restart (the stores' caps set the direct-memory limit at start)
      changed: { by: "", at: "", reason: "" }   # the last change made from Admin -> Engines or drishti.py (written by the server)
  lake:
    memory:                          # the in-memory lake (docs/guides/DATA_LAKE_GUIDE.md): Delta tables held in memory only by contract, never on a disk
      stores: {}                     # the old place of the memory stores, read for one more release with a warning: a store is now a lake, config/lakes/<store>.yaml with root: mem://<store> and memory: { max-mb (the hard cap), chunk-kb (1024), contract, owner (true), idle-trim-minutes (10) } (docs/guides/DATA_LAKE_GUIDE.md); the caps add to -XX:MaxDirectMemorySize
      tables: []                     # the tables and their replenish jobs: name, store, folder, source { connector, kind, file, url, headers, ids, ids-from }, mode (replace, append, merge), key, sort-by, business-date, columns, every or cron, signal, warm-up, pin, keep-versions (2), codec (zstd), retention { ttl, on, max-rows } (none: rows kept; the compaction drops older rows)
      history-keep: 50               # the runs kept per table for Admin -> Lakes and drishti.py lake memory jobs (in memory)
      job-threads: 2                 # replenish jobs that may run at once (one per table at most)
      compaction:                    # automated compaction: the memory optimizes itself (docs/architecture/DATA_ARCHITECTURE.md section 13a)
        enabled: true                # rewrite a table when it would save memory: small files merged, replaced rows dropped, appends re-sorted
        idle-only: false             # true: only while no request is being answered
        idle-seconds: 30             # the quiet that counts as idle
        headroom-mb: 512             # memory kept free for a rewrite's new files beside the old (at most a quarter of the store): compaction never causes an eviction
        small-file-mb: 8             # files below this are merged
        dead-rows: 0.2               # a merge-mode table is rewritten when this share of its rows was replaced since its last rewrite
        resort-after: 20             # appends after which a table is rewritten sorted by its sort-by
        every-seconds: 60            # how often the compactor looks, besides after every commit
