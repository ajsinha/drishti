# config/engines/sensitivities.yaml: position sensitivities and the factor dictionary (docs/guides/FRTB_SA_GUIDE.md section 9). Read at start, imported by application.yaml after the jar's copy of this
# file, so a key here wins over the shipped one and application.local.yaml and the environment win over both
# (docs/architecture/COMPUTE_ENGINES.md section 3). Admin -> Engines writes the switch and changed: only; every other key is edited here.
drishti:
  engines:
    sensitivities:
      enabled: ${DRISHTI_SENSITIVITIES_ENABLED:true}   # run position sensitivities on this node: /api/v1/sensitivities, /api/v1/risk-factors; FRTB-SA and SIMM need it (live)
      changed: { by: "", at: "", reason: "" }   # the last change made from Admin -> Engines or drishti.py (written by the server)
  sensitivities:                     # read by FRTB-SA and SIMM; the old names drishti.frtb.sensitivity-kind, factor-kind and cache-minutes still work
    sensitivity-kind: position-sensitivity   # the position sensitivities (SENS)
    factor-kind: risk-factor         # the factor dictionary (RFAC)
    cache-minutes: 10                # how long a date's sensitivities stay in memory after they are read
