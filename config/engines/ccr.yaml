# config/engines/ccr.yaml: Drishti Risk's counterparty engine (docs/architecture/ENGINES_IN_DRISHTI.md; docs/plans/R2_CUT_PLAN.md). The engine
# comes from drishti-risk-ccr-<version>.jar in <home>/lib/engines; without the JAR this file reads "not installed" and nothing else is
# affected. Inputs are bound to the counterparty-risk pack's kinds (trade-valuation from the market-risk pack).
drishti:
  engines:
    ccr:
      enabled: true
      changed: { by: "", at: "", reason: "" }
      inputs:
        simulation-run: { kinds: [ simulation-run ] }
        exposure-path: { kinds: [ exposure-path ] }
        netting-set: { kinds: [ netting-set ] }
        csa: { kinds: [ csa ], as-of: on-or-before }   # a reference kind: each CSA as last loaded on or before the date (in-tree reads it so)
        collateral-balance: { kinds: [ collateral-balance ] }
        trade-valuation: { kinds: [ trade-valuation ] }
        credit-limit: { kinds: [ credit-limit ] }
        credit-limit-bucket: { kinds: [ credit-limit ], as-of: on-or-before, field: BUCKETS }   # each limit's tenor buckets: the items of its BUCKETS list, under its LIMIT_ID
        # SIMM (R2): every input a lake table known by its kind; the licensed parameter files are the simm-parameters kind (one row a
        # version, TEXT the file as delivered), never a host folder; the elements are the items of each sensitivity record's SENSITIVITIES list
        sensitivity-element: { kinds: [ position-sensitivity ], field: SENSITIVITIES }
        risk-factor: { kinds: [ risk-factor ] }
        simm-parameters: { kinds: [ simm-parameters ] }
        fx-spot: { kinds: [ fx-spot ] }
      options:
        # the netting-set matrices as the exposure tier keeps them (drishti.ccr.exposure.tier): mapped = float32 rows as the hot file, so the two paths agree to the bit
        vector-tier: ${drishti.ccr.exposure.tier:${DRISHTI_EXPOSURE_TIER:mapped}}
      snapshot: { hot: 1 }               # one business date's session kept open (its books released when another date is asked)
      limits: { memory-mb: 768, request-seconds: 300 }   # one date's paths and the book built from them for each visibility asked; the first ask of a date reads its paths
      access:
        visibility: row-rules
