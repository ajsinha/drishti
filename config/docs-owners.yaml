# The one home of a kind of command (tools/docs/dup_check.py, plan DOCS_CONSOLIDATION.md on wip/i7b-products section 3.2).
# A fenced-block line matching a pattern is allowed only in its home (and in a tutorial: a tutorial shows the commands of its steps).
owners:
  - {pattern: 'drishti\.py\s+setup\b|\bpip\s+install\b|\bgit\s+clone\b', home: docs/DEPLOYMENT_AND_QA_GUIDE.md, why: install and first start}
  - {pattern: '\bsystemctl\b|\bpg_dump\b|\bjournalctl\b', home: docs/guides/OPERATIONS_GUIDE.md, why: production, backup, upgrade}
  - {pattern: 'drishti\.py\s+(start|stop)\s+cluster\b', home: docs/guides/CLUSTER_GUIDE.md, why: the local cluster}
  - {pattern: '\.run\.xml\b', home: docs/guides/IDE_GUIDE.md, why: launchers}
# A repeated command run that is allowed in both places: [path, path, reason].
allow_runs: []
