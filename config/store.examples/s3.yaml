# A cluster on S3 or an S3-compatible store that honours conditional writes (If-Match / If-None-Match), such as MinIO.
# Copy to config/store/store.yaml on every node. Empty keys: the AWS default credentials chain (instance role, environment).
backend: s3
s3:
  bucket: drishti-content
  prefix: prod
  region: us-east-1
  endpoint: ""                     # e.g. http://minio.example.internal:9000 for MinIO
  path-style: false                # true for MinIO
  access-key: ${DRISHTI_STORE_ACCESS_KEY:}
  secret-key: ${DRISHTI_STORE_SECRET_KEY:}
