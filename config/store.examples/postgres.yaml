# A cluster on PostgreSQL (no shared disk needed): usually the Drishti database itself; the table drishti_content is in
# its complete schema file and is created at start. Copy to config/store/store.yaml on every node.
backend: postgres
postgres:
  url: jdbc:postgresql://db.example.internal:5432/drishti
  user: drishti
  password: ${DRISHTI_STORE_PASSWORD:}
  pool: 4
