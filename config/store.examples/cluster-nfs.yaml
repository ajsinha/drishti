# A Drishti*net cluster on a shared mount: the SAME folder, at the same path, on every node (NFS v3+, EFS or SMB).
# A local folder per node would give each node its own content again. Copy to config/store/store.yaml on every node.
backend: filesystem
filesystem:
  root: /mnt/drishti-shared/fstore
