# SAMPLE NOTEBOOK (multi-dataset): the join of "Desk P&L vs counterparty exposure" done by hand, in pandas, over TWO masked extracts. `dataset`/`fields` is the
# first extract (the trades of trading-risk, the table `extract` and the frame `df`); `extracts` lists the others, which a Python cell reads as extract("name") and a
# SQL cell as a table of that name. Every extract is the rows the person opening the notebook may see (row rules and masks applied by the server), so a notebook
# shared with someone else shows their rows. When the pandas join is what you want to keep, "Promote to a Transform" on the Python cell writes it as a Python
# Transform draft; a derived dataset then makes it a table reports can use (config/bi/datasets/desk-pnl-vs-exposure-py.dataset.yaml).
# Reference: docs/guides/ANALYSE.md section 2.

rachana: 1
notebook: pnl-vs-exposure-pandas
title: Desk P&L vs counterparty exposure, in pandas
description: One-day P&L of the trades by counterparty joined to expected exposure by counterparty, from two datasets, in a Python cell and again in a SQL cell.
sample: true
endorsement: promoted
tags: [sample, multi-dataset, python, counterparty-risk]
dataset: mq:trading-risk@1          # the model trading-risk (2.2): the trades of the first extract
fields: [trades.COUNTERPARTY, trades.DESK, trades.PNL_1D]
extracts:
  - { name: exposure, dataset: mq:trading-risk@1, fields: [netting_sets.counterparty, netting_sets.eePeak, netting_sets.pfePeak] }   # the netting sets of the same model
cells:
  - type: python
    source: |
      # df is the trades (first extract); extract("exposure") is the netting sets of the second dataset: both are what YOU may see.
      pnl = df.groupby("COUNTERPARTY", as_index=False)["PNL_1D"].sum().rename(columns={"COUNTERPARTY": "counterparty", "PNL_1D": "desk_pnl"})
      ee = extract("exposure").groupby("counterparty", as_index=False)["eePeak"].sum().rename(columns={"eePeak": "ee_peak"})
      joined = pnl.merge(ee, on="counterparty", how="left")
      joined["pnl_per_exposure"] = joined["desk_pnl"] / joined["ee_peak"]
      result = joined.sort_values("ee_peak", ascending=False).head(15)
    target: server
  - type: sql
    source: |
      SELECT p.counterparty, p.desk_pnl, e.ee_peak
      FROM (SELECT COUNTERPARTY AS counterparty, SUM(PNL_1D) AS desk_pnl FROM extract GROUP BY COUNTERPARTY) AS p
      JOIN (SELECT counterparty, SUM(eePeak) AS ee_peak FROM exposure GROUP BY counterparty) AS e ON e.counterparty = p.counterparty
      ORDER BY e.ee_peak DESC LIMIT 10
