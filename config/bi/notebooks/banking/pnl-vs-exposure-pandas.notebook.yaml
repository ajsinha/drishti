# SAMPLE NOTEBOOK (multi-dataset): the join of "Desk P&L vs counterparty exposure" done by hand, in pandas, over TWO masked extracts. `dataset`/`fields` is the
# first extract (the trades of trading-risk, the frame `df`); `extracts` lists the others, which a Python cell reads as extract("name"). The SQL cell is
# Drishti SQL over the model, run by the server: the same join, each fact added up first. Every extract is the rows the person opening the notebook may see (row rules and masks applied by the server), so a notebook
# shared with someone else shows their rows. When the pandas join is what you want to keep, "Promote to a Transform" on the Python cell writes it as a Python
# Transform draft; a derived dataset then makes it a table reports can use (config/bi/datasets/desk-pnl-vs-exposure-py.dataset.yaml).
# Reference: docs/guides/USER_GUIDE.md › The Notebook, section 2.

rachana: 1
notebook: pnl-vs-exposure-pandas
title: Desk P&L vs counterparty exposure, in pandas
description: One-day P&L of the trades by counterparty joined to expected exposure by counterparty, from two extracts in a Python cell, and from the model in a SQL cell run by the server.
sample: true
endorsement: promoted
tags: [sample, multi-dataset, python, counterparty-risk]
dataset: mq:trading-risk@1          # the model trading-risk (2.2): the trades of the first extract
fields: [trades.COUNTERPARTY, trades.DESK, trades.PNL_1D]
extracts:
  - { name: exposure, dataset: mq:trading-risk@1, fields: [set_exposure.COUNTERPARTY, set_exposure.PEAK_EE, set_exposure.PEAK_PFE_95] }   # the netting sets' computed exposure (the official results) in the same model
cells:
  - type: python
    source: |
      # df is the trades (first extract); extract("exposure") is the netting sets' computed exposure (the exposure engine's official end-of-day results): both are what YOU may see.
      pnl = df.groupby("COUNTERPARTY", as_index=False)["PNL_1D"].sum().rename(columns={"COUNTERPARTY": "counterparty", "PNL_1D": "desk_pnl"})
      ee = extract("exposure").groupby("COUNTERPARTY", as_index=False)["PEAK_EE"].sum().rename(columns={"COUNTERPARTY": "counterparty", "PEAK_EE": "ee_peak"})
      joined = pnl.merge(ee, on="counterparty", how="left")
      joined["pnl_per_exposure"] = joined["desk_pnl"] / joined["ee_peak"]
      result = joined.sort_values("ee_peak", ascending=False).head(15)
    target: server
  - type: sql
    source: |
      SELECT counterparties.id, MEASURE('P&L 1d') AS desk_pnl, MEASURE('Exposure (EE peak)') AS ee_peak
      FROM trades JOIN counterparties JOIN set_exposure
      GROUP BY counterparties.id
      ORDER BY ee_peak DESC LIMIT 10
