# STORED SAMPLE 1 of 3 (two live samples follow): "hello world". One table, four measures, one hierarchy. Read it top to bottom; every part is explained.
# Worked examples: docs/guides/DATASETS.md section 17. Reference: docs/guides/DATASETS.md. Start with docs/guides/BI_GUIDE.md.
#
# A dataset is a MODEL that reports sit on: tables (from pack kinds, read through a connector by its logical name), the
# relationships between them, measures (named calculations) and the rules about who sees which rows and fields.

# CONVERTED from datasets/trades-basic.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
model: trades-basic
version: 1.0.0
title: "Trades, the basics"
description: "The simplest useful model: one table (the trading pack's trade) with four measures (Notional, MTM, Trades and average MTM per trade) and a desk-to-book hierarchy. Start here."
sample: true
endorsement: "promoted"
tags: [sample, trading, tutorial]

datasets:                       # alias: the dataset it reads, and its role (a fact is added up; a dimension groups and filters)
  trade: { dataset: trades-basic-trade, role: fact }

measures:
  Notional:              { expr: "sum(trade.NOTIONAL)", format: amount0, description: "Total notional of the trades, in the trade's own currency units." }
  MTM:                   { expr: "sum(trade.MTM)", format: signed0, description: "Mark-to-market in USD, signed." }
  Trades:                { expr: "count(trade)", description: "Number of trades." }
  Average MTM per trade: { expr: "measure('MTM') / measure('Trades')", format: signed0, description: "MTM divided by the number of trades (a measure built from measures)." }
  Desk P&L volatility:   { python: desk-pnl-volatility, inputs: [trade.PNL_1D], by: [trade.DESK], description: "Standard deviation of the one-day P&L per desk, computed in Python. Shown by a python visual (docs/guides/PYTHON_BI.md); a query cannot use it." }

hierarchies:
  Desk and book: [trade.DESK, trade.PORTFOLIO]
