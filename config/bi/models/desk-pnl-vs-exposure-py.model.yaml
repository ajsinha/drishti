# STORED SAMPLE (multi-dataset, built the Python way): "Desk P&L vs counterparty exposure" as a DERIVED DATASET. The two sources are asked as the reader,
# exactly as in the composed dataset desk-pnl-vs-exposure; but the join is not YAML, it is a Python Transform (config/bi/python/pnl-vs-exposure.python.yaml)
# that receives the two answers as masked pandas frames and returns one. The frame is the dataset's table `result`; its columns are declared here (a contract
# the run is checked against; leave `columns:` out and the columns of the first successful run are kept instead). Measures are YAML over it, as always.
# The result is kept per reader and version of the inputs and is rebuilt when a source is reloaded. Reference: docs/guides/BI_GUIDE.md › Datasets: the YAML, the expression language and the security rules, section 11.

# CONVERTED from datasets/desk-pnl-vs-exposure-py.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_DESIGN.md › The model layer: the specification of wave W1, section 8). The model keeps the old name and table names as aliases, so fields read as before.

# EDITED AFTER CONVERSION (2.9.0): the retired stored exposure (EE_PEAK, PFE_PEAK) left the netting set; exposure is read from the
# published official results (counterparty-exposure-official-*, docs/guides/BI_GUIDE.md "Exposure in BI"). This file is no longer the converter's output.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/BI_LANGUAGE_REFERENCE.md)
model: desk-pnl-vs-exposure-py
version: 1.0.0
title: "Desk P&L vs counterparty exposure (Python)"
description: "The same table as desk-pnl-vs-exposure, made by a Python Transform from the P&L of trading-risk and the exposure of counterparty-exposure."
sample: true
endorsement: "promoted"
tags: [sample, multi-dataset, derived, python, counterparty-risk]

datasets:                       # alias: the dataset it reads, and its role (a fact is added up; a dimension groups and filters)
  result: { dataset: desk-pnl-vs-exposure-py-result, role: fact }

measures:
  Desk P&L:           { expr: "sum(result.desk_pnl)", format: signed0 }
  Exposure (EE peak): { expr: "sum(result.ee_peak)", format: amount0, description: "The netting sets' computed peak expected exposure (counterparty-exposure's measure, from the official results) summed per counterparty: a reporting sum of the sets' peaks." }
  P&L per exposure:   { expr: "ratio(sum(result.desk_pnl), sum(result.ee_peak))", format: signed2, description: "Computed in YAML over the frame the Transform returned." }
  Counterparties:     { expr: "count(result)" }
