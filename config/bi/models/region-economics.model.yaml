# STORED SAMPLE 7: "Region economics". One table over the economics pack's region-economy kind: population and GDP for the Australian states and territories and the US states
# and DC, coded by ISO 3166-2 (AU-NSW, US-CA) so a map visual can shade the regions. THE FIGURES ARE ILLUSTRATIVE, ROUNDED FROM PUBLIC FIGURES, NOT FOR REPORTING: population to the
# nearest 10,000 and GDP to the nearest US$ billion (sources named in each row: ABS, US Census Bureau, BEA). Ratio measures are worked out from sums, so a country's GDP per head
# is its GDP over its population. Report: config/bi/reports/region-economics.report.yaml. Reference: docs/guides/DATASETS.md, docs/guides/REAL_DATA.md.

# CONVERTED from datasets/region-economics.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
model: region-economics
version: 1.0.0
title: "Region economics"
description: "Population and GDP of the Australian states and territories and the US states, by country and ISO 3166-2 region code, so a map can shade the regions. Illustrative, rounded from public figures, not for reporting (population to the nearest 10,000, GDP to the nearest US$ billion)."
sample: true
endorsement: "promoted"
tags: [sample, economics, illustrative, map]

datasets:                       # alias: the dataset it reads, and its role (a fact is added up; a dimension groups and filters)
  regions: { dataset: region-economics-regions, role: fact }

measures:
  Population:         { expr: "sum(regions.population)", format: amount0, description: "People living in the region, rounded to the nearest 10,000. Illustrative." }
  GDP (USD bn):       { expr: "sum(regions.gdpUsdBn)", format: amount0, description: "Output in US dollars, billions, rounded to the nearest billion. Illustrative, not for reporting." }
  GDP per head (USD): { expr: "ratio(sum(regions.gdpUsdBn), sum(regions.population)) * 1000000000", format: amount0, description: "GDP over population: for a country, its regions' total GDP over their total population. Illustrative." }

hierarchies:
  Country and region: [regions.countryName, regions.name]
