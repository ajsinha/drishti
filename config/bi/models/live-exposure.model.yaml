# SAMPLE (streaming): live counterparty exposure. The counterparty-risk pack's netting sets as they tick, kept in memory like live-trading. It is the second
# dataset of the "Desk wall" board, to show a wall of tiles from several reports over several datasets.
# Tutorial: docs/tutorials/10-first-bi-report.md. Reference: docs/guides/DATASETS.md (live tables), docs/guides/REPORTS.md.

# CONVERTED from datasets/live-exposure.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

# EDITED AFTER CONVERSION (2.9.0): the retired stored exposure (EE_PEAK, PFE_PEAK) left the netting set; exposure is read from the
# published official results (counterparty-exposure-official-*, docs/guides/BI_GUIDE.md "Exposure in BI"). This file is no longer the converter's output.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
model: live-exposure
version: 1.0.0
title: "Live exposure"
description: "Netting sets with their net mark-to-market, collateral and limit utilisation, updated as they tick. The computed exposure (EE and PFE peaks) is not live: it is the exposure engine's official end-of-day result, in the models counterparty-exposure and trading-risk."
sample: true
endorsement: "promoted"
tags: [sample, counterparty-risk, live, streaming]

datasets:                       # alias: the dataset it reads, and its role (a fact is added up; a dimension groups and filters)
  netting: { dataset: live-exposure-netting, role: fact }

measures:
  Netting sets:    { expr: "count(netting)" }
  Net MTM:         { expr: "sum(netting.NET_MTM)", format: signed0 }
  Collateral:      { expr: "sum(netting.COLLATERAL)", format: signed0 }
  Max utilisation: { expr: "max(netting.UTILISATION)" }
  Worst net MTM:   { expr: "min(netting.NET_MTM)", format: signed0 }
