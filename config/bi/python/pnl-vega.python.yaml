# SAMPLE PYTHON VISUAL (Vega-Lite): the one-day P&L of each desk as a strip of dots with the desk's median drawn over it. Reference: docs/guides/PYTHON_BI.md
# ("Vega-Lite output" and "Tests shipped with an item").
#
# A VISUAL may return a Vega-Lite specification (a dict) when the manifest says `output: vega-lite`. The data goes inside the specification, as `data.values`: the page
# loads nothing from a URL (a `url` or a `loader` anywhere in the specification is refused), draws it with the vendored Vega-Lite and its expression interpreter (no
# eval, so the page keeps the strict content security policy), and puts it in the theme's colours.
#
# `tests:` ship with the item. Check runs them in the console's sandbox and a publish through the console is refused while one fails.
rachana: 1
python: pnl-vega
title: P&L by desk (Vega-Lite)
description: One dot for each trade's one-day P&L, grouped by desk, with each desk's median as a tick, returned as a Vega-Lite specification.
sample: true
endorsement: none
tags: [sample, trading, python, vega-lite]
interface: visual
output: vega-lite
inputs: [DESK, PNL_1D]
packages: [pandas]
target: server
timeout: 10
memory: 256
params: { max_points: 400 }
tests:
  - name: a dot for every trade and a median for every desk
    input:
      columns: [DESK, PNL_1D]
      rows: [[FX, 10.0], [FX, 30.0], [RATES, -5.0]]
    expect: { kind: vega-lite, has: { layer.0.mark.type: circle, layer.1.mark.type: tick, "layer.0.data.values.2.desk": RATES } }
  - name: at most max_points dots
    input:
      columns: [DESK, PNL_1D]
      rows: [[FX, 1.0], [FX, 2.0], [FX, 3.0]]
    params: { max_points: 2 }
    expect: { kind: vega-lite, has: { layer.0.data.values.1.pnl1d: 2.0 } }
source: |
  def render(table, params):
      limit = int(params.get("max_points", 400))
      rows = table.dropna(subset=["PNL_1D"]).head(limit)
      dots = [{"desk": str(r.DESK), "pnl1d": float(r.PNL_1D)} for r in rows.itertuples()]
      medians = [{"desk": str(d), "median": float(v)} for d, v in rows.groupby("DESK")["PNL_1D"].median().items()]
      return {
          "width": "container", "height": "container",
          "layer": [
              {"data": {"values": dots}, "mark": {"type": "circle", "opacity": 0.6, "size": 40},
               "encoding": {"x": {"field": "pnl1d", "type": "quantitative", "title": "One-day P&L"}, "y": {"field": "desk", "type": "nominal", "title": None}}},
              {"data": {"values": medians}, "mark": {"type": "tick", "thickness": 3, "size": 22, "color": "#d9534f"},
               "encoding": {"x": {"field": "median", "type": "quantitative"}, "y": {"field": "desk", "type": "nominal"}}},
          ],
      }
