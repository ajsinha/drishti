# SAMPLE PYTHON TRANSFORM: two frames in (one-day P&L by counterparty from trading-risk, exposure by counterparty from counterparty-exposure: since 2.9.0 the exposure engine's computed peaks, its official end-of-day results), one frame out.
# The frames are pandas DataFrames of what the person running it may see (their row rules, their masks): the server asks the two datasets as them and
# hands the answers over. The frame it returns is the table of the derived dataset desk-pnl-vs-exposure-py. Reference: docs/guides/BI_GUIDE.md › Python in BI: measures, visuals and data prep written in Python, section 13.

rachana: 1
python: pnl-vs-exposure
title: P&L against exposure (Transform)
description: Joins the P&L frame to the exposure frame on the counterparty and adds P&L per unit of exposure and the rank of the exposure.
sample: true
version: 1
interface: transform            # a table in, a table out; the other interfaces are measure and visual
inputs: [pnl, exposure]         # the inputs of the Python dataset desk-pnl-vs-exposure-py-result (model queries), in the order its function receives them
packages: [pandas]
target: server                  # a Transform runs on the server and its result is kept for the reader
timeout: 20                     # seconds
memory: 512                     # megabytes
params: { floor: 1.0 }          # the dataset may override these (derived.params)
source: |
  def run(pnl, exposure, params):
      """pnl: counterparty, name, Desk P&L, Trades.  exposure: counterparty, sector, Exposure (EE peak), Exposure (PFE peak)."""
      # Since 2.2 the Python dataset desk-pnl-vs-exposure-py-result hands over model-query answers, each column named by the last part of its field or
      # measure name (counterparties.id is id); the 2.1 derived dataset renamed them with `as`. Both shapes are accepted (a missing name is left alone).
      # The columns of the trading packs are UPPER_SNAKE (counterparties.NAME is NAME); the table this returns keeps its own lower-case names.
      pnl = pnl.rename(columns={"id": "counterparty", "P&L 1d": "Desk P&L", "NAME": "name"})
      exposure = exposure.rename(columns={"id": "counterparty", "SECTOR": "sector"})
      m = pnl.merge(exposure, on="counterparty", how="left")
      m = m.rename(columns={"Desk P&L": "desk_pnl", "Exposure (EE peak)": "ee_peak", "Exposure (PFE peak)": "pfe_peak"})
      floor = float(params.get("floor", 1.0))
      m["pnl_per_exposure"] = m["desk_pnl"] / m["ee_peak"].clip(lower=floor)
      m["exposure_rank"] = m["ee_peak"].rank(ascending=False, method="min")
      return m[["counterparty", "name", "sector", "desk_pnl", "Trades", "ee_peak", "pfe_peak", "pnl_per_exposure", "exposure_rank"]].rename(columns={"Trades": "trades"})
