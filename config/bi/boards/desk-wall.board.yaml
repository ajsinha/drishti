# SAMPLE BOARD: "Desk wall". A wall of live tiles from two reports over two live datasets, for a screen on the wall: open it, press the kiosk button (or add
# ?kiosk=1 to the address) and it fills the screen, hides the menus and turns its pages every 20 seconds. A tile changes colour when its number crosses a
# threshold; nothing is sent anywhere (notifications arrive with distribution, phase 7).
# Reference: docs/guides/BOARDS.md. Tutorial: docs/guides/BI_TUTORIAL.md, "A wall for the desk".
#
# A board holds no data and no query: each tile names a report and one of its visuals, and the board asks that report for the data, as the person looking.

rachana: 1
board: desk-wall
version: 1
title: Desk wall
description: The trading desk and the counterparty exposure on one live wall. Tiles turn amber and red as the numbers cross their thresholds.
sample: true
endorsement: promoted
tags: [sample, trading, counterparty-risk, live, streaming, tutorial]
rotate: 20s

pages:
  - id: desk
    title: Trading desk
    tiles:
      - { id: net-mtm, report: live-trading-desk, visual: mtm,     title: Net MTM,  at: { x: 0, y: 0, w: 3, h: 3 },
          alert: { on: MTM, warn: { op: lt, value: 150000000 }, crit: { op: lt, value: 100000000 } } }
      - { id: losses,  report: live-trading-desk, visual: losses,  title: Losses,   at: { x: 3, y: 0, w: 3, h: 3 },
          alert: { on: Losses, warn: { op: lt, value: -500000000 }, crit: { op: lt, value: -750000000 } } }
      - { id: trades,  report: live-trading-desk, visual: trades,  title: Trades,   at: { x: 6, y: 0, w: 2, h: 3 } }
      - { id: rolling, report: live-trading-desk, visual: rolling, at: { x: 8, y: 0, w: 4, h: 6 } }
      - { id: by-desk, report: live-trading-desk, visual: by-desk, at: { x: 0, y: 3, w: 8, h: 6 } }
      - { id: movers,  report: live-trading-desk, visual: movers,  at: { x: 8, y: 6, w: 4, h: 6 } }
      - { id: latest,  report: live-trading-desk, visual: latest,  at: { x: 0, y: 9, w: 8, h: 4 } }

  - id: exposure
    title: Counterparty exposure
    tiles:
      - { id: sets,   report: live-exposure, visual: sets,   at: { x: 0, y: 0, w: 3, h: 3 } }
      - { id: netmtm, report: live-exposure, visual: netmtm, at: { x: 3, y: 0, w: 3, h: 3 },
          alert: { on: Net MTM, warn: { op: lt, value: 0 }, crit: { op: lt, value: -300000000 } } }
      - { id: ee,     report: live-exposure, visual: ee,     at: { x: 6, y: 0, w: 3, h: 3 } }
      - { id: pfe,    report: live-exposure, visual: pfe,    at: { x: 9, y: 0, w: 3, h: 3 } }
      - { id: worst,  report: live-exposure, visual: worst,  at: { x: 0, y: 3, w: 6, h: 7 } }
      - { id: limits, report: live-exposure, visual: limits, at: { x: 6, y: 3, w: 6, h: 7 } }
