# SAMPLE REPORT (streaming): "Live exposure". The counterparty-risk pack's netting sets as they tick: totals as cards, the netting sets with the most negative
# net MTM, and the busiest limits. Reads the live dataset live-exposure. It is the second report of the "Desk wall" board.

rachana: 1
report: live-exposure
version: 1
title: Live exposure
description: Netting sets, net MTM, collateral, expected and potential future exposure and limit utilisation, redrawn as they tick.
sample: true
endorsement: promoted
tags: [sample, counterparty-risk, live, streaming]
dataset: live-exposure
theme: { palette: default }

pages:
  - id: exposure
    title: Exposure
    visuals:
      - { id: sets,    type: card, title: Netting sets,  at: { x: 0, y: 0, w: 3, h: 2 }, wells: { values: [Netting sets] } }
      - { id: netmtm,  type: card, title: Net MTM,       at: { x: 3, y: 0, w: 3, h: 2 }, wells: { values: [Net MTM] },
          format: { conditional: [{ measure: Net MTM, op: lt, value: 0, colour: "#b3261e" }] } }
      - { id: ee,      type: card, title: EE peak,       at: { x: 6, y: 0, w: 3, h: 2 }, wells: { values: [EE peak] } }
      - { id: pfe,     type: card, title: PFE peak,      at: { x: 9, y: 0, w: 3, h: 2 }, wells: { values: [PFE peak] } }
      - id: worst
        type: bar
        title: Most negative net MTM
        at: { x: 0, y: 2, w: 6, h: 6 }
        wells: { axis: [netting.NETTING_SET_ID], values: [Net MTM] }
        sort: { by: Net MTM, desc: false }
        limit: 10
        format: { labels: false }
        alt: Bar chart of the ten netting sets with the most negative net mark to market
      - id: limits
        type: table
        title: Highest limit utilisation
        at: { x: 6, y: 2, w: 6, h: 6 }
        wells: { columns: [netting.NETTING_SET_ID, netting.COUNTERPARTY, Max utilisation, Net MTM] }
        sort: { by: Max utilisation, desc: true }
        limit: 10
