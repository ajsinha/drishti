# SAMPLE THEME: "Print". White paper, black text and a palette that stays apart in grey, for exports and statements that are printed. A report takes it with
# `theme: print`. Reference: docs/guides/BI_GUIDE.md › Reports: the YAML, the visuals and how they behave, section 5.2.

rachana: 1
theme: print
version: 1
title: Print
description: Black on white with a palette that prints apart in grey; no shadows, thin borders.
sample: true
tags: [sample, theme]
palette: ["#000000", "#555555", "#999999", "#1b5e20", "#b71c1c", "#0d47a1"]
background: "#ffffff"
foreground: "#111111"
good: "#1b5e20"
bad: "#b71c1c"
font: { family: serif, size: 12 }
visuals:
  chart: { labels: true, legend: bottom }
  card: { border: true }
  table: { border: true, rowBanding: false }
