# SAMPLE THEME: "Corporate". A report takes it with `theme: corporate` (or picks it under Format, Report, Theme in the designer): its series colours, its
# good and bad colours (a KPI against its target, a gradient's ends) and the format defaults of each visual family. A visual's own format wins over them.
# Reference: docs/guides/BI_GUIDE.md › Reports: the YAML, the visuals and how they behave, section 5.2. A theme is an item like any other: copy it into a workspace to make your own, review and publish it.

rachana: 1
theme: corporate
version: 1
title: Corporate
description: Navy and slate series colours, green and red for good and bad, labelled charts and banded tables, for desk packs and client decks.
sample: true
tags: [sample, theme]
palette: ["#1f4e79", "#2e75b6", "#9dc3e6", "#c55a11", "#70ad47", "#7f7f7f", "#ffc000", "#5b9bd5"]
good: "#2e7d32"
bad: "#c62828"
font: { family: sans, size: 12 }
visuals:
  chart: { labels: true, legend: bottom, valueAxis: { gridlines: true } }
  table: { rowBanding: true }
  matrix: { rowBanding: true, stepped: true }
  card: { calloutSize: 30 }
