# STORED SAMPLE 3 of 3: a nested model. A trade document holds ARRAYS: its legs and its payment schedule. A table with `each:` has one row
# per array element, so legs and cashflows become tables in their own right, one-to-many from the trade.
# Tutorial: docs/tutorials/../guides/BI_RECIPES.md. Reference: docs/guides/DATASETS.md.

# CONVERTED from datasets/trading-cashflows.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: trading-cashflows-legs
version: 1.0.0
title: "Trade legs and cashflows: legs"
description: "The legs table of the model trading-cashflows."
sample: true
endorsement: "promoted"
tags: [sample, trading, nested, cashflows]
source: { kind: trade, each: LEGS }
refresh: { on-load: true }
columns:
  LEG_ID:            { type: integer }
  LEG_TYPE:          { type: string }
  LEG_ECONOMIC_TYPE: { type: string }
  INDEX_NAME:        { type: string, path: INDEX.NAME }
  FLOAT_SPREAD:      { type: decimal }
  PRICE_UNIT:        { type: string }
  SETTLEMENT_TYPE:   { type: string }
  CURRENCY:          { type: string }
  NOTIONAL:          { type: decimal, format: amount0 }
