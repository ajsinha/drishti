# STORED SAMPLE 1 of 3 (two live samples follow): "hello world". One table, four measures, one hierarchy. Read it top to bottom; every part is explained.
# Worked examples: docs/guides/BI_GUIDE.md › Datasets: the YAML, the expression language and the security rules, section 17. Reference: docs/guides/BI_GUIDE.md. Start with docs/guides/BI_GUIDE.md.
#
# A dataset is a MODEL that reports sit on: tables (from pack kinds, read through a connector by its logical name), the
# relationships between them, measures (named calculations) and the rules about who sees which rows and fields.

# CONVERTED from datasets/trades-basic.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_DESIGN.md › The model layer: the specification of wave W1, section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/BI_LANGUAGE_REFERENCE.md)
dataset: trades-basic-trade
version: 1.0.0
title: "Trades, the basics: trade"
description: "The trade table of the model trades-basic."
sample: true
endorsement: "promoted"
tags: [sample, trading, tutorial]
source: { connector: risk-store, kind: trade-valuation }
refresh: { on-load: true }
columns:
  VALUATION_ID:    { type: string, role: key }
  TRADE_ID:        { type: string }
  SOURCE_SYSTEM:   { type: string }
  DESK:            { type: string }
  PORTFOLIO:       { type: string }
  PRODUCT_TYPE:    { type: string }
  CURRENCY:        { type: string }
  TRADE_STATUS:    { type: string }
  NOTIONAL:        { type: decimal, format: amount0 }
  MTM:             { type: decimal, format: signed0 }
  PNL_1D:          { type: decimal, format: signed0 }
  TRADE_DATE:      { type: date }
  MTM_IN_MILLIONS: { type: decimal, expr: "MTM / 1000000", description: "MTM in millions of USD" }
