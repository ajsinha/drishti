# STORED SAMPLE (multi-dataset, built the Python way): "Desk P&L vs counterparty exposure" as a DERIVED DATASET. The two sources are asked as the reader,
# exactly as in the composed dataset desk-pnl-vs-exposure; but the join is not YAML, it is a Python Transform (config/bi/python/pnl-vs-exposure.python.yaml)
# that receives the two answers as masked pandas frames and returns one. The frame is the dataset's table `result`; its columns are declared here (a contract
# the run is checked against; leave `columns:` out and the columns of the first successful run are kept instead). Measures are YAML over it, as always.
# The result is kept per reader and version of the inputs and is rebuilt when a source is reloaded. Reference: docs/guides/DATASETS.md section 11.

# CONVERTED from datasets/desk-pnl-vs-exposure-py.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: desk-pnl-vs-exposure-py-result
version: 1.0.0
title: "Desk P&L vs counterparty exposure (Python): the Transform's table"
description: "The table the Python Transform pnl-vs-exposure makes from model queries (the derived dataset desk-pnl-vs-exposure-py before 2.2)."
sample: true
endorsement: "promoted"
tags: [sample, multi-dataset, derived, python, counterparty-risk]
source:
  python: pnl-vs-exposure
  inputs:                       # each a model query, asked as the reader (their row rules and masks)
    pnl: { model: trading-risk@1, select: { fields: [counterparties.id, counterparties.NAME], measures: [P&L 1d, Trades] } }
    exposure: { model: counterparty-exposure@1, select: { fields: [counterparties.id, counterparties.SECTOR], measures: [Exposure (EE peak), Exposure (PFE peak)] } }   # the computed peaks (2.9.0): the sets' EE peaks summed, the counterparty's own PFE
  params: { floor: 1.0 }
grain: { keys: [counterparty] }   # the converter takes the first column as the key: check it says what one row is
columns:
  counterparty:     { type: string }
  name:             { type: string }
  sector:           { type: string }
  desk_pnl:         { type: decimal }
  trades:           { type: integer }
  ee_peak:          { type: decimal }
  pfe_peak:         { type: decimal }
  pnl_per_exposure: { type: decimal }
  exposure_rank:    { type: decimal }
