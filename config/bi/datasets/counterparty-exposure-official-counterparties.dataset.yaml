# STORED SAMPLE (2.9.0): the official exposure of each COUNTERPARTY on each business date (all its netting sets netted path by path by the
# engine), the LATEST result version only, as counterparty-exposure-official-netting-sets is for the sets. A counterparty's true PFE is this
# row's, never a sum of its netting sets' PFEs: the models read "Exposure (PFE peak)" from here.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: counterparty-exposure-official-counterparties
version: 1.0.0
title: "Exposure official results: counterparties (latest version)"
description: "One row per counterparty and business date: the latest result version of the official end-of-day exposure published to risk-results/exposure-official-cpty (the counterparty's own figures, its netting sets netted path by path)."
sample: true
endorsement: "promoted"
tags: [sample, counterparty-risk, exposure]
extends: counterparty-exposure-official@^1
where: "HIERARCHY == 'CPTY'"
grain: { one-row-per: NODE_ID, keep: latest by RESULT_VERSION }
