# The payments table of the model trading-cashflows: one row per element of a trade's EVENTS, the amounts the deal page nets by date. AMOUNT is signed
# as the booking says (paid −, received +) and in the event's own CURRENCY; the model converts it to a USD equivalent.
# Reference: docs/guides/BI_GUIDE.md.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/BI_LANGUAGE_REFERENCE.md)
dataset: trading-cashflows-payments
version: 1.0.0
title: "Trade legs and cashflows: payments"
description: "The payments (EVENTS) of the trades of the model trading-cashflows: paid − / received +, in the event's currency."
sample: true
endorsement: "promoted"
tags: [sample, trading, nested, cashflows]
source: { kind: trade, each: EVENTS }
refresh: { on-load: true }
columns:
  EVENT_ID:     { type: integer }
  LEG_ID:       { type: integer }
  EVENT_TYPE:   { type: string }
  PAYMENT_TYPE: { type: string }
  EVENT_DATE:   { type: date }
  AMOUNT:       { type: decimal, format: signed0 }
  CURRENCY:     { type: string }
