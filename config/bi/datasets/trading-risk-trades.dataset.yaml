# STORED SAMPLE 2 of 3: the "real" example. A cross-pack model: trades (trading pack) joined to counterparties and desks and books
# (banking-core pack) and to netting sets (counterparty-risk pack), using the links the packs already declare.
# It also shows a date hierarchy, a rollup, a row rule per role and masked columns.
# Tutorial: docs/tutorials/../guides/BI_RECIPES.md, 4 and 8. Reference: docs/guides/DATASETS.md.

# CONVERTED from datasets/trading-risk.dataset.yaml (rachana: 1) by the dataset-to-model converter (drishti.py bi migrate --models;
# docs/architecture/BI_MODEL_SPEC.md section 8). The model keeps the old name and table names as aliases, so fields read as before.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: trading-risk-trades
version: 1.0.0
title: "Trading and counterparty risk: trades"
description: "The trades table of the model trading-risk."
sample: true
endorsement: "promoted"
tags: [sample, trading, counterparty-risk, cross-pack]
source: { connector: trading-store, kind: trade }
refresh: { on-load: true }
columns:
  tradeId:          { type: string, role: key }
  desk:             { type: string }
  book:             { type: string }
  nettingSet:       { type: string }
  counterpartyId:   { type: string, path: counterparty.id }
  counterpartyName: { type: string, path: counterparty.name }
  productType:      { type: string }
  assetClass:       { type: string }
  currency:         { type: string }
  status:           { type: string }
  notional:         { type: decimal, format: amount0 }
  mtm:              { type: decimal, format: signed0 }
  pnl1d:            { type: decimal, format: signed0 }
  dv01:             { type: decimal, path: risk.dv01, format: signed0 }
  tradeDate:        { type: date }
  maturityDate:     { type: date }
security:
  rows:
    - { role: desk-head, where: "desk in user.desks" }
    - { role: [risk, analyst, admin], where: "True" }
  masked: [counterpartyName]
