# STORED SAMPLE (2.9.0): the published official end-of-day VaR results, as the server appends them to risk-results/var-official
# (docs/guides/VAR_GUIDE.md section 19), read through the market-risk pack's read-only Delta connector var-results (kind var-official).
# Every result version of a date is a row here: the dataset market-risk-var-latest keeps the latest version of each node and date, and the
# model market-risk-var reads that one.
# The business date is the built-in column businessDate (the table's partition); every column below is promoted in the connector's
# layout, so the table is scanned as columns. VaR is never stored as a record: these are the numbers of record the VaR engine captured.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/BI_LANGUAGE_REFERENCE.md)
dataset: market-risk-var-official
version: 1.0.0
title: "VaR official results (every version)"
description: "The official end-of-day VaR and ES of every node of the MGMT and LEGAL hierarchies, one row per node, business date and result version (a restated date adds a version), as published to risk-results/var-official."
sample: true
endorsement: "promoted"
tags: [sample, market-risk, var]
source: { connector: var-results, kind: var-official }
refresh: { on-load: true }
columns:
  HIERARCHY:      { type: string }
  NODE_ID:        { type: string, references: risk-hierarchy }   # a cell opens the node in the terminal
  NODE_NAME:      { type: string }
  PARENT_ID:      { type: string, references: risk-hierarchy }
  LEVEL:          { type: string }
  CAPTURE_ID:     { type: string }
  RESULT_VERSION: { type: integer }
  VAR:            { type: decimal, format: amount0, additive: false }   # VaR and ES are not additive: never summed across nodes or dates
  ES:             { type: decimal, format: amount0, additive: false }
  LIMIT:          { type: decimal, format: amount0, additive: false }
  LIMIT_USE:      { type: decimal, format: pct, additive: false }
  DIVERSIFICATION: { type: decimal, format: amount0, additive: false }
  HYPO_PNL:       { type: decimal, format: signed0, additive: false }
  EXCEPTIONS_250: { type: integer, additive: false }
  TRAFFIC_LIGHT:  { type: string }
