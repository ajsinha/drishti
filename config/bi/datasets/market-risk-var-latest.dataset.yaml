# STORED SAMPLE (2.9.0): the official VaR of each node on each business date, the LATEST result version only. The published table is
# append-only, so a restated date has two versions of every node; this dataset keeps the highest RESULT_VERSION of each node within each
# business date (an explicit de-duplication, docs/guides/DATASETS.md section 14), so the model market-risk-var never sees a node twice.

rachana: 2
expressions: 2                  # DEL v2, the Python-like expression language (docs/guides/EXPRESSIONS.md)
dataset: market-risk-var-latest
version: 1.0.0
title: "VaR official results (latest version)"
description: "One row per hierarchy node and business date: the latest result version of the official end-of-day VaR and ES published to risk-results/var-official."
sample: true
endorsement: "promoted"
tags: [sample, market-risk, var]
extends: market-risk-var-official@^1
grain: { one-row-per: NODE_ID, keep: latest by RESULT_VERSION }
# 2.9.7 (VAR_GUIDE.md section 18.6): what horizon the figures are for. Official records are 1-day, so HORIZON is 1D and METHOD (the 10-day
# method: SQRT10, SUM, or FULL for a full revaluation) is empty. The rows published since 2.9.7 carry the same in their own HORIZON and
# METHOD columns; a table written before 2.9.7 has no such column (the lake writer never adds a column to a table), so the dataset says
# it. When a 10-day official record is built, these two read the columns instead.
derive:
  HORIZON: { expr: "'1D'", type: string }
  METHOD:  { expr: "None", type: string }
