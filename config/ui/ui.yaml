# The UI Board (2.7.0, docs/architecture/UI_BOARD.md). Its folder is drishti.ui.dir (DRISHTI_UI_DIR, default ./config/ui);
# the seed chips are in chips/ beside this file. A missing file or key means the default shown. Read at start.

limits:
  board-bytes: 65536          # the largest board document (DRS-2075 past it)
  chips: 40                   # chip instances per board
  traces: 120                 # traces per board
  boards-per-person: 500      # saved personal boards per person
  revisions: 50               # earlier saves kept per board

# Shared workspaces take published chips by default; name a workspace here to take certified chips only.
workspaces: {}
#  risk-desk: { certified-only: true }

# Rendering (UI_BOARD.md 6 and 7.3; phase P3). Durations: 10s, 10m, 7d.
render:
  rows-per-chip: 10000        # rows painted per chip; the footer says the rest were left out
  chip-budget: 10s            # a chip's first paint; past it a non-BI supplier is DRS-2077, a BI question shows its run card
  board-budget: 30s           # the whole board to 'done'; chips not painted by then report DRS-2077
  dynamic-per-minute: 30      # unsaved (dynamic) renders per person a minute (DRS-2076 past it, with Retry-After)
  dynamic-at-once: 4          # unsaved renders per person painting at once (DRS-2076)
  sessions-per-person: 8      # open render sessions per person; the oldest is closed past it (DRS-2079 on it)
  session-idle: 10m           # a render session ends after this long without a pin change
  reuse: 30s                  # a model answer is shared this long by access profile (0 never)
  keep-dynamic: 7d            # dynamic documents kept by hash for an auditor under <data>/ui/dynamic (0 not kept)

# Converted screens (UI_BOARD.md 11.3; phase P5): per pack, 'boards' serves the pack's entity pages from their converted boards, 'sutras'
# (the default) from the Sutras as before. Switch only a pack whose proof passed (POST /api/v1/ui/migrate/proof); switching back is
# immediate. An administrator may also switch at run time (PUT /api/v1/ui/packs/<pack>, this node, until the next start).
packs:                             # every pack served as boards (product owner, 2026-10-21: "convert everything"); sutras switches one back
  core: boards
  trading: boards
  counterparty-risk: boards
  market-data: boards
  market-risk: boards
  world-economy: boards
  news-and-markets: boards
