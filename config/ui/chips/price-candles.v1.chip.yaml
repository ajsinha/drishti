# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: price-candles
version: 1
title: Price candles
category: chart
tags:
- time-series
- ohlc
- prices
- volume
- record
- generic
manual:
  purpose: Daily open, high, low and close bars from one list in the record, with the volume beneath.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns x (date, required), volume (measure) to the row
      fields. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'candlestick' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says
    otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The price candles on the commodity page
    board: |
      params:
        id: {type: id, of: market-data/commodity, required: true}
      chips:
        c:
          use: price-candles@1
          supply:
            connector: market-data/commodity
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: OHLC, rows.x: DATE, rows.volume: VOLUME}
          controls: {fmt: price2}
  not-for: The close alone (use series-line).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: rows with a date, open, high, low, close and volume
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: date
          required: true
        volume:
          type: measure
    fmt:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: candlestick
    title: '%{title|Price candles}'
    rows: '@rows'
    x: '%{rows.x}'
    volume: '%{rows.volume}'
    fmt: '%{fmt}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
