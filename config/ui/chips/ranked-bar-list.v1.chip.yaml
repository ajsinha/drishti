# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: ranked-bar-list
version: 1
title: Ranked bar list
category: chart
tags:
- ranking
- comparison
- breakdown
- bars
- record
- generic
manual:
  purpose: 'Horizontal bars over one list in the record: a bar per label, as long as the value.'
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns label (dimension, required), value (measure, required)
      to the row fields. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    tone: 'How values are coloured: sign (red below zero), status, or empty for none.'
    on-select: 'What a click does: {by, field, filter: [panel ids]} filters other panels of the page. Empty: nothing.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: The grammar's 'hbar' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The ranked bar list on the simm page
    board: |
      params:
        id: {type: id, of: counterparty-risk/simm, required: true}
      chips:
        c:
          use: ranked-bar-list@1
          supply:
            connector: counterparty-risk/simm
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: RISK_CLASSES, rows.label: RISK_CLASS, rows.value: IM}
          controls: {fmt: compact}
  not-for: A series in order (use series-line); steps to a total (use step-waterfall).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: rows with a label and a measure
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
          required: true
        value:
          type: measure
          required: true
    fmt:
      role: control
      type: text
    tone:
      role: control
      type: text
    on-select:
      role: control
      type: spec
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: hbar
    title: '%{title|Ranked bar list}'
    rows: '@rows'
    label: '%{rows.label}'
    value: '%{rows.value}'
    fmt: '%{fmt}'
    tone: '%{tone}'
    on-select: '%{on-select}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
