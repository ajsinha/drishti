# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-area
version: 1
title: Area
category: charts
tags:
- panel
- area
- limit
manual:
  purpose: Several bands over one axis against a limit. The grammar's 'area' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    title: The chip's title. Empty shows the default title.
  behaviour: Hover shows each band's value.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A area of the trading pack
    board: |
      chips:
        c:
          use: panel-area@1
          supply: {connector: trading/trade-search}
          map: {rows.x: TRADE_DATE, rows.series: BOOK, rows.value: MTM_USD, rows.limit: LIMIT_USD}
  not-for: One series (use panel-line).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: dimension
          required: true
        series:
          type: dimension
        value:
          type: measure
          required: true
        limit:
          type: measure
    title:
      role: control
      type: text
body:
  panels:
  - id: area
    kind: area
    title: '%{title|Area}'
    rows: '@rows'
    x: '@.x'
    series: '@.series'
    limit: '@.limit'
