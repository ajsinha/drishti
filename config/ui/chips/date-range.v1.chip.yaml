# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: date-range
version: 1
title: Date range
category: controls
tags:
- date
- period
- control
manual:
  purpose: Two dates the person picks; other chips follow the range.
  pins:
    default-from: The first date before the person picks. Empty means no lower bound.
    default-to: The last date before the person picks. Empty means no upper bound.
    from: Out. The first date.
    to: Out. The last date.
    period: Out. The range as one period.
    title: The chip's title. Empty shows the default title.
  behaviour: Picking a date sends 'from', 'to' and 'period'.
  defaults: The default dates, else no bounds.
  limits: Dates from 1900 to 2199.
  examples:
  - title: A date range bounding a table
    board: |
      chips:
        c: {use: date-range@1}
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.date: TRADE_DATE}
      traces:
      - {from: c.from, to: trades.date-from}
      - {from: c.to, to: trades.date-to}
  not-for: One date (use a board param of type date).
  accessibility: Two labelled date fields; the calendar is reachable by keyboard.
pins:
  in:
    default-from:
      role: control
      type: date
    default-to:
      role: control
      type: date
    title:
      role: control
      type: text
  out:
    from:
      type: date
    to:
      type: date
    period:
      type: period
body:
  panels:
  - id: range
    kind: date-range
    title: '%{title|Dates}'
    from: '%{default-from|}'
    to: '%{default-to|}'
    on-change:
    - emits: from
    - emits: to
    - emits: period
