# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-table
version: 1
title: Table
category: tables
tags:
- panel
- table
- rows
manual:
  purpose: A list of similar rows with sortable columns, a search box and totals of the measure columns. The grammar's 'table' panel kind as a
    chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    selected: Out. The id of what the person selected; empty until they select one.
    visible: Out. The rows after every filter, for another chip to follow.
  behaviour: Clicking a row selects it and sends 'selected'; typing in the search box filters; 'visible' carries the rows after the filter.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A table of the trading pack
    board: |
      chips:
        c:
          use: panel-table@1
          supply: {connector: trading/trade-search}
          map:
            rows.id: TRADE_ID
            rows.label: COUNTERPARTY_NAME
            rows.measures: [NOTIONAL, MTM_USD]
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: One record (use panel-kv); a list where one row matters most (use panel-ladder).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
          required: true
        label:
          type: dimension
        measures:
          type: measure
          many: true
  out:
    selected:
      type: id
    visible:
      type: rowset
      shape-of: rows
body:
  panels:
  - id: table
    kind: table
    title: '%{title|Table}'
    rows: '@rows'
    search: true
    columns:
    - label: Id
      bind: '@.id'
    - label: Name
      bind: '@.label'
      optional: true
    - each: measures
      label: '@name'
      bind: '@.value'
      fmt: amount0
      total: true
    on-select:
      emits: selected
      value: '@.id'
    exposes:
      visible: '@filtered'
