# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: legs
version: 1
title: Legs
category: trading
tags:
- block
- trading
- legs
manual:
  purpose: 'The legs side by side: each leg''s terms, notional profile, fixings and cash flows opening to their resets. The trading pack''s ''legs''
    block as a chip; its GenUI slots are its control pins.'
  pins:
    doc: The trade document. Required; the block reads its legs, flows and parties.
    rate-fmt: 'How rates are shown: pct4 for rates (a fraction a year), price4 for prices per unit. Default price4.'
  behaviour: 'As the block on today''s trade pages: tables sort, sections open and close.'
  defaults: Every leg and date; rates as price4.
  limits: 'As the block''s panels: tables page past 10,000 rows.'
  examples:
  - title: The legs of a trade
    board: |
      chips:
        c:
          use: legs@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
  not-for: A trade list (use filterable-table); one field (use panel-kv).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    doc:
      role: data
      type: document
      of: trading/trade
      required: true
      shape:
        id:
          type: id
          required: true
        title:
          type: text
        fields:
          type: dimension
          many: true
    rate-fmt:
      role: control
      type: enum
      values:
      - price4
      - pct4
      default: price4
body:
  panels:
  - id: legs
    use: legs@1
    of: '@doc'
    params:
      rate-fmt: '%{rate-fmt}'
