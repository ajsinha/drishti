# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-button
version: 1
title: Button
category: static
tags:
- bi
- visual
- button
manual:
  purpose: A button that sends an action. The BI 'button' visual type as a chip; its wells are its pins.
  pins:
    content: The button's label.
    action: Out. The action, sent when the person presses the button.
  behaviour: Pressing the button sends 'action'.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The button over the trading-risk model
    board: |
      chips:
        c: {use: bi-button@1}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    content:
      role: control
      type: text
      required: true
      default: ''
  out:
    action:
      type: text
body:
  panels:
  - id: visual
    kind: visual
    type: button
    title: '%{title|Button}'
    content: '%{content}'
    on-click:
      emits: action
      value: '%{content}'
