# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-line
version: 1
title: Record line
category: charts
tags:
- record
- line
- generic
manual:
  purpose: 'A line over one list in the record: the x column in order, the y column as the value. The grammar''s ''line'' panel over the page''s
    record; the board names every field.'
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns x (dimension, required), y (measure, required) to
      the row fields. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'line' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The record line on the ir-curve page
    board: |
      params:
        id: {type: id, of: market-data/ir-curve, required: true}
      chips:
        c:
          use: record-line@1
          supply:
            connector: market-data/ir-curve
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: POINTS, rows.x: TENOR, rows.y: ZERO_RATE}
          controls: {fmt: price2}
  not-for: Several series (use record-area); amounts by label (use record-hbar).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: dimension
          required: true
        y:
          type: measure
          required: true
    fmt:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: line
    title: '%{title|Record line}'
    rows: '@rows'
    x: '%{rows.x}'
    y: '%{rows.y}'
    fmt: '%{fmt}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
