# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: dated-steps-ladder
version: 1
title: Dated steps ladder
category: ladder
tags:
- ladder
- timeline
- workflow
- events
- record
- generic
manual:
  purpose: The rows of one list in the record as a ladder (dated steps, newest first).
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns id (id) to the row fields. Required.'
    columns: 'The columns, each {label, bind: ''@.FIELD'', fmt}. Required.'
    empty: 'What the ladder says when the list is empty. Empty: the kind''s own words.'
    highlight: 'The step to highlight, a condition over the row (#index == @doc.NEXT_INDEX). Empty: none.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'ladder' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The dated steps ladder on the margin-call page
    board: |
      params:
        id: {type: id, of: counterparty-risk/margin-call, required: true}
      chips:
        c:
          use: dated-steps-ladder@1
          supply:
            connector: counterparty-risk/margin-call
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: EVENTS}
          controls:
            columns:
            - {label: Time, bind: '@.AT'}
            - {label: Event, bind: '@.EVENT'}
  not-for: Rows without an order that matters (use list-table).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
  fits: rows with a time and what happened
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
    columns:
      role: control
      type: spec
      required: true
    empty:
      role: control
      type: text
    highlight:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    height:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: ladder
    title: '%{title|Dated steps ladder}'
    rows: '@rows'
    columns: '%{columns}'
    empty: '%{empty}'
    highlight: '%{highlight}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
    height: '%{height}'
