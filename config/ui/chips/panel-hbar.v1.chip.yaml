# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-hbar
version: 1
title: Bars
category: charts
tags:
- panel
- bar
- ranking
manual:
  purpose: A few labelled amounts as horizontal bars. The grammar's 'hbar' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    selected: Out. The id of what the person selected; empty until they select one.
  behaviour: Clicking a bar selects it and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A bars of the trading pack
    board: |
      chips:
        c:
          use: panel-hbar@1
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME, rows.value: MTM_USD}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: Amounts that add up to a total (use panel-waterfall).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
        label:
          type: dimension
          required: true
        value:
          type: measure
          required: true
  out:
    selected:
      type: id
body:
  panels:
  - id: hbar
    kind: hbar
    title: '%{title|Bars}'
    rows: '@rows'
    label: '@.label'
    value: '@.value'
    on-select:
      emits: selected
      value: '@.id'
