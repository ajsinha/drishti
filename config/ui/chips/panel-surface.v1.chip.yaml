# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-surface
version: 1
title: Surface
category: market
tags:
- panel
- surface
- volatility
manual:
  purpose: A grid of numbers over two axes (a volatility surface). The grammar's 'surface' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
  behaviour: Switches between grid and 3D.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A surface of the trading pack
    board: |
      chips:
        c:
          use: panel-surface@1
          supply: {connector: trading/trade-search}
          map: {rows.x: TRADE_DATE, rows.y: MTM_USD, rows.value: MTM_USD}
  not-for: A grid aggregated from rows (use panel-pivot).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: dimension
          required: true
        y:
          type: dimension
          required: true
        value:
          type: measure
          required: true
body:
  panels:
  - id: surface
    kind: surface
    title: '%{title|Surface}'
    rows: '@rows'
    y: '@.y'
    view: grid
