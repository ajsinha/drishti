# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: kv-list
version: 1
title: Label and value list
category: kv
tags:
- summary
- attributes
- key-value
- record
- generic
manual:
  purpose: Label and value pairs from one list in the record (each row a label and a value).
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns label (dimension), value (dimension) to the row
      fields. Required.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: The grammar's 'kv' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The label and value list on the agreement page
    board: |
      params:
        id: {type: id, of: counterparty-risk/agreement, required: true}
      chips:
        c:
          use: kv-list@1
          supply:
            connector: counterparty-risk/agreement
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: ELECTIONS}
  not-for: Named fields of the record itself (use kv-summary).
  accessibility: Read in document order; each label is tied to its value for screen readers.
  fits: rows with a label and a value
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
        value:
          type: dimension
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: kv
    title: '%{title|Label and value list}'
    rows: '@rows'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
