# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-links
version: 1
title: Links
category: relationships
tags:
- panel
- links
- references
manual:
  purpose: The entities a record refers to, each a link to its own board. The grammar's 'links' panel kind as a chip.
  pins:
    doc: The record to show. Required; its fields are the rows of the panel.
    title: The chip's title. Empty shows the default title.
  behaviour: Each link opens the entity.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A links of the trading pack
    board: |
      chips:
        c:
          use: panel-links@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
  not-for: Structure between entities (use panel-graph).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
    title:
      role: control
      type: text
body:
  panels:
  - id: links
    kind: links
    title: '%{title|Links}'
    of: '@doc'
