# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: search-box
version: 1
title: Search box
category: controls
tags:
- search
- filter
- control
manual:
  purpose: A box the person types in; the text becomes a structured filter on the named columns for other chips.
  pins:
    columns: The columns the text filters on, comma-separated. Default id,label.
    filter-out: 'Out. The filter built from the text (never free text): column contains value, or-ed over the columns.'
    title: The chip's title. Empty shows the default title.
  behaviour: Typing sends 'filter-out' after a short pause; Escape clears it.
  defaults: 'Empty box: no filter.'
  limits: Up to 200 characters.
  examples:
  - title: A search box filtering a table
    board: |
      chips:
        c: {use: search-box@1}
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME}
      traces:
      - {from: c.filter-out, to: trades.filter}
  not-for: Choosing from a list of values (use bi-slicer).
  accessibility: A labelled search field; the result count is announced.
pins:
  in:
    columns:
      role: control
      type: text
      default: id,label
    title:
      role: control
      type: text
  out:
    filter-out:
      type: filter
body:
  panels:
  - id: search
    kind: search
    title: '%{title|Search}'
    'on': '%{columns}'
    emits: filter-out
