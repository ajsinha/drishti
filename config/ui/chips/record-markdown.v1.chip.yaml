# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-markdown
version: 1
title: Record note
category: records
tags:
- record
- markdown
- generic
manual:
  purpose: A note in Markdown that may quote the record's fields, shown only when a condition on the record holds. The grammar's 'markdown' panel
    over the page's record; the board names every field.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    text: The note; ${@doc.FIELD} quotes a field. Required.
    when: 'A condition on the record (nonblank(@doc.FIELD)). Empty: always shown.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'markdown' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The record note on the news page
    board: |
      params:
        id: {type: id, of: news-and-markets/news, required: true}
      chips:
        c:
          use: record-markdown@1
          supply:
            connector: news-and-markets/news
            query: {id: '%{board.params.id}'}
          map: {doc.id: id}
          controls: {text: 'Served from ${@doc.SNAPSHOT}.'}
  not-for: A static note without fields (use panel-markdown).
  accessibility: Headings and lists keep their structure for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    text:
      role: control
      type: text
      required: true
    when:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: markdown
    title: '%{title|Record note}'
    text: '%{text}'
    when: '%{when}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
