# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-metric
version: 1
title: Record figure
category: records
tags:
- record
- metric
- generic
manual:
  purpose: One figure of the record, large, with its format, tone and a caption that may quote other fields. The grammar's 'metric' panel over
    the page's record; the board names every field.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    value: 'The figure: map value: <the record''s field>. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    tone: 'How values are coloured: sign (red below zero), status, or empty for none.'
    caption: 'A line under the figure; ${@doc.FIELD} quotes a field. Empty: none.'
    span: 'How many of the 12 columns the figure takes. Empty: the kind''s default.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'metric' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The record figure on the counterparty-trades page
    board: |
      params:
        id: {type: id, of: trading/counterparty-trades, required: true}
      chips:
        c:
          use: record-metric@1
          supply:
            connector: trading/counterparty-trades
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, value: PAY_7D}
          controls: {fmt: signed0, tone: sign}
  not-for: A figure against a maximum (use panel-gauge); several figures (use record-fields).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    value:
      role: data
      type: measure
      required: true
    fmt:
      role: control
      type: text
    tone:
      role: control
      type: text
    caption:
      role: control
      type: text
    span:
      role: control
      type: number
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: metric
    title: '%{title|Record figure}'
    value: '@value'
    fmt: '%{fmt}'
    tone: '%{tone}'
    caption: '%{caption}'
    span: '%{span}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
