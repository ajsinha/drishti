# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: deal-footer
version: 1
title: Deal footer
category: trading
tags:
- block
- trading
- deal-footer
manual:
  purpose: How the view was built and the entities the deal refers to. The trading pack's 'deal-footer' block as a chip; its GenUI slots are its
    control pins.
  pins:
    doc: The trade document. Required; the block reads its legs, flows and parties.
    title: The chip's title. Empty shows the default title.
  behaviour: 'As the block on today''s trade pages: tables sort, sections open and close.'
  defaults: Every leg and date; rates as price4.
  limits: 'As the block''s panels: tables page past 10,000 rows.'
  examples:
  - title: The deal footer of a trade
    board: |
      chips:
        c:
          use: deal-footer@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
  not-for: A trade list (use filterable-table); one field (use panel-kv).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    doc:
      role: data
      type: document
      of: trading/trade
      required: true
    title:
      role: control
      type: text
body:
  panels:
  - id: deal-footer
    use: deal-footer@1
    of: '@doc'
