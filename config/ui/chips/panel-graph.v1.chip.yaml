# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-graph
version: 1
title: Relation graph
category: relationships
tags:
- panel
- graph
- network
manual:
  purpose: Entities and how they relate, as nodes and edges. The grammar's 'graph' panel kind as a chip.
  pins:
    rows: The edges. Required.
    selected: Out. The id of what the person selected; empty until they select one.
  behaviour: Clicking a node selects it and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A relation graph of the trading pack
    board: |
      chips:
        c:
          use: panel-graph@1
          supply: {connector: trading/trade-search}
          map: {rows.from: TRADE_ID, rows.to: COUNTERPARTY_ID, rows.label: COUNTERPARTY_NAME}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: References without structure (use panel-links).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        from:
          type: id
          required: true
        to:
          type: id
          required: true
        label:
          type: dimension
  out:
    selected:
      type: id
body:
  panels:
  - id: graph
    kind: graph
    title: '%{title|Relation graph}'
    nodes: '@rows'
    edges: '@rows'
    on-select:
      emits: selected
      value: '@.from'
