# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: cross-tab-grid
version: 1
title: Cross-tab grid
category: table
tags:
- pivot
- aggregation
- heatmap
- cross-tab
- record
- generic
manual:
  purpose: 'A grid aggregated from one list in the record: a row per value of ''by'', a column per value of ''across'', the value column added
    up (or the rows counted).'
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns by (dimension, required), across (dimension, required),
      value (measure) to the row fields. Required.'
    agg: 'How the cell is made: sum, count, avg, min or max. Empty: sum.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    tone: 'How values are coloured: sign (red below zero), status, or empty for none.'
    heat: 'True shades the cells by value. Empty: no shading.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'pivot' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The cross-tab grid on the desk page
    board: |
      params:
        id: {type: id, of: core/desk, required: true}
      chips:
        c:
          use: cross-tab-grid@1
          supply:
            connector: core/desk
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: POSITIONS, rows.by: BOOK, rows.across: CURRENCY, rows.value: MTM}
          controls: {agg: sum}
  not-for: A list of rows (use list-table).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
  fits: rows with two labels and a measure
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        by:
          type: dimension
          required: true
        across:
          type: dimension
          required: true
        value:
          type: measure
    agg:
      role: control
      type: text
    fmt:
      role: control
      type: text
    tone:
      role: control
      type: text
    heat:
      role: control
      type: bool
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: pivot
    title: '%{title|Cross-tab grid}'
    rows: '@rows'
    by: '%{rows.by}'
    across: '%{rows.across}'
    value: '%{rows.value}'
    agg: '%{agg}'
    fmt: '%{fmt}'
    tone: '%{tone}'
    heat: '%{heat}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
