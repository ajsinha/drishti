# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-perspective-pivot
version: 1
title: Perspective pivot
category: perspective
tags:
- bi
- visual
- perspective-pivot
manual:
  purpose: 'A 2.1 type kept so old reports open: drawn as Drishti''s grid. The BI ''perspective-pivot'' visual type as a chip; its wells are its
    pins.'
  pins:
    rows: 'The rows of the wells: rows (dimension, several, required), columns (dimension, several), values (measure, several, required). Required.'
    selected: Out. The mark the person clicked (a bar, a row, a point) as a filter on its first field; empty until they click. Traced into other
      chips' filter pins it is the page's cross-filter; a drill down the hierarchy sends the level clicked.
    filter: 'The filters other chips send: a slicer''s choice or a clicked mark (their ''filter-out'' or ''selected''). Several traces may feed
      it; they combine (all must hold). Empty: no cross-filter.'
    format: 'The visual''s format block as the report writes it (colours, labels, run, spec). Empty: defaults.'
    alt: 'The text alternative read to screen readers. Empty: the title.'
    filters: 'Filters on this visual only, as the report writes them. Empty: none.'
    sort: 'The sort, {by, order}. Empty: the visual type''s default.'
    limit: 'At most this many members (top N after the sort). Empty: no limit.'
    hierarchy: 'The drill levels of the axis. Empty: no drill.'
    alert: 'The alert colours by threshold. Empty: none.'
    drillthrough: 'The page a right-click drills through to, with the fields it carries. Empty: none.'
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The perspective pivot over the trading-risk model
    board: |
      chips:
        c:
          use: bi-perspective-pivot@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: []
          map:
            rows.rows: [trades.DESK]
            rows.columns: [trades.DESK, MTM_USD]
            rows.values: [MTM_USD]
        other:
          use: bi-perspective-pivot@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: []
          map:
            rows.rows: [trades.DESK]
            rows.columns: [trades.DESK, MTM_USD]
            rows.values: [MTM_USD]
      traces:
      - {from: c.selected, to: other.filter}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        rows:
          type: dimension
          required: true
          many: true
        columns:
          type: dimension
          many: true
        values:
          type: measure
          required: true
          many: true
    filter:
      role: control
      type: filter
    format:
      role: control
      type: spec
    alt:
      role: control
      type: text
    filters:
      role: control
      type: spec
    sort:
      role: control
      type: spec
    limit:
      role: control
      type: number
    hierarchy:
      role: control
      type: spec
    alert:
      role: control
      type: spec
    drillthrough:
      role: control
      type: spec
  out:
    selected:
      type: filter
body:
  panels:
  - id: visual
    kind: visual
    type: perspective-pivot
    title: '%{title|Perspective pivot}'
    rows: '@rows'
    wells:
      rows: '@rows.rows'
      columns: '@rows.columns'
      values: '@rows.values'
    on-select:
      emits: selected
      value: '@.rows'
    format: '%{format}'
    alt: '%{alt}'
    filters: '%{filters}'
    sort: '%{sort}'
    limit: '%{limit}'
    hierarchy: '%{hierarchy}'
    alert: '%{alert}'
    drillthrough: '%{drillthrough}'
