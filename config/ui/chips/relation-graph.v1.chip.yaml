# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: relation-graph
version: 1
title: Relation graph
category: chart
tags:
- hierarchy
- network
- tree
- graph
- record
- generic
manual:
  purpose: Nodes and edges from two lists in the record, laid out as a tree or a network.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    nodes: 'The rows of one list in the record: map nodes: <the list''s field>, and its columns label (dimension, required), group (dimension)
      to the row fields. Required.'
    edges: 'The rows of one list in the record: map edges: <the list''s field>, and its columns from (id) to the row fields. Required.'
    layout: 'tree or network. Empty: network.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'graph' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The relation graph on the counterparty page
    board: |
      params:
        id: {type: id, of: core/counterparty, required: true}
      chips:
        c:
          use: relation-graph@1
          supply:
            connector: core/counterparty
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, nodes: HIERARCHY.NODES, edges: HIERARCHY.EDGES, nodes.label: LABEL}
          controls: {layout: tree}
  not-for: References without structure (use linked-entities).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: a list of nodes and a list of edges
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    nodes:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
          required: true
        group:
          type: dimension
    edges:
      role: data
      type: rowset
      required: true
      shape:
        from:
          type: id
    layout:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: graph
    title: '%{title|Relation graph}'
    nodes: '@nodes'
    edges: '@edges'
    label: '%{nodes.label}'
    group: '%{nodes.group}'
    layout: '%{layout}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
