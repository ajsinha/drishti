# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: area-series
version: 1
title: Area series
category: chart
tags:
- time-series
- profile
- limit
- area
- record
- generic
manual:
  purpose: Filled series over one list in the record along the x column, with an optional limit line.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns x (dimension, required) to the row fields. Required.'
    series: 'The series, each {label, value: FIELD, tone}. Required.'
    limit: 'A limit line, usually a record field (@doc.LIMIT). Empty: none.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'area' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The area series on the exposure-profile page
    board: |
      params:
        id: {type: id, of: counterparty-risk/exposure-profile, required: true}
      chips:
        c:
          use: area-series@1
          supply:
            connector: counterparty-risk/exposure-profile
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: BUCKETS, rows.x: TENOR}
          controls:
            series:
            - {label: EE, value: EE, tone: link}
  not-for: One series (use series-line).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: rows with an ordered x and several measures
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: dimension
          required: true
    series:
      role: control
      type: spec
      required: true
    limit:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: area
    title: '%{title|Area series}'
    rows: '@rows'
    x: '%{rows.x}'
    series: '%{series}'
    limit: '%{limit}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
