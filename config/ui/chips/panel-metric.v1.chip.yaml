# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-metric
version: 1
title: Metric
category: records
tags:
- panel
- kpi
- number
manual:
  purpose: The one number a screen is about, with its change, unit and caption. The grammar's 'metric' panel kind as a chip.
  pins:
    value: The number. Required.
    delta: Its change, shown signed and coloured. Empty shows no change.
    title: The chip's title. Empty shows the default title.
  behaviour: Read-only.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A metric of the trading pack
    board: |
      chips:
        c:
          use: panel-metric@1
          supply: {connector: trading/trade-search}
          map: {}
  not-for: A number against a maximum (use panel-gauge).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    value:
      role: data
      type: measure
      required: true
    delta:
      role: control
      type: measure
    title:
      role: control
      type: text
body:
  panels:
  - id: metric
    kind: metric
    title: '%{title|Metric}'
    value: '%{value}'
    delta: '%{delta|}'
