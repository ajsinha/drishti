# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: event-timeline
version: 1
title: Event timeline
category: timeline
tags:
- timeline
- events
- lifecycle
- history
- record
- generic
manual:
  purpose: 'The rows of one list in the record as events in order: a label and a detail per event.'
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns label (dimension, required), detail (dimension)
      to the row fields. Required.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'timeline' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The event timeline on the trade page
    board: |
      params:
        id: {type: id, of: trading/trade, required: true}
      chips:
        c:
          use: event-timeline@1
          supply:
            connector: trading/trade
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: LIFECYCLE.TIMELINE, rows.label: EVENT, rows.detail: DESCRIPTION}
  not-for: Rows with many columns (use list-table); dated steps (use dated-steps-ladder).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
  fits: rows with an event and its detail
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
          required: true
        detail:
          type: dimension
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    height:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: timeline
    title: '%{title|Event timeline}'
    rows: '@rows'
    label: '%{rows.label}'
    detail: '%{rows.detail}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
    height: '%{height}'
