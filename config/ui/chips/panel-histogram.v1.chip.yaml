# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-histogram
version: 1
title: Histogram
category: risk
tags:
- panel
- distribution
- risk
manual:
  purpose: Many numbers whose spread matters, counted in bands. The grammar's 'histogram' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
  behaviour: Hover shows each band's count.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A histogram of the trading pack
    board: |
      chips:
        c:
          use: panel-histogram@1
          supply: {connector: trading/trade-search}
          map: {rows.value: MTM_USD}
  not-for: Order along an axis (use panel-line).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        value:
          type: measure
          required: true
body:
  panels:
  - id: histogram
    kind: histogram
    title: '%{title|Histogram}'
    rows: '@rows'
    value: '@.value'
    bins: 20
