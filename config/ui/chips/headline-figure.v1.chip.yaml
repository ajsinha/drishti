# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: headline-figure
version: 1
title: Headline figure
category: kv
tags:
- figure
- kpi
- summary
- record
- generic
manual:
  purpose: One figure of the record, large, with its format, tone and a caption that may quote other fields.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    value: 'The figure: map value: <the record''s field>. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    tone: 'How values are coloured: sign (red below zero), status, or empty for none.'
    caption: 'A line under the figure; ${@doc.FIELD} quotes a field. Empty: none.'
    label: 'The label over the figure. Empty: the title.'
    unit: 'The unit shown with the figure (USD). Empty: none.'
    delta: 'A change shown beside the figure, usually a record field (@doc.PNL1D). Empty: none.'
    delta-fmt: 'The number format of the change (the panel''s deltaFmt). Empty: as fmt.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'metric' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The headline figure on the counterparty-trades page
    board: |
      params:
        id: {type: id, of: trading/counterparty-trades, required: true}
      chips:
        c:
          use: headline-figure@1
          supply:
            connector: trading/counterparty-trades
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, value: PAY_7D}
          controls: {fmt: signed0, tone: sign}
  not-for: A figure against a maximum (use panel-gauge); several figures (use kv-summary).
  accessibility: Read in document order; each label is tied to its value for screen readers.
  fits: one number of a record, with an optional caption
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    value:
      role: data
      type: measure
      required: true
    fmt:
      role: control
      type: text
    tone:
      role: control
      type: text
    caption:
      role: control
      type: text
    label:
      role: control
      type: text
    unit:
      role: control
      type: text
    delta:
      role: control
      type: text
    delta-fmt:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    height:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: metric
    title: '%{title|Headline figure}'
    value: '@value'
    fmt: '%{fmt}'
    tone: '%{tone}'
    caption: '%{caption}'
    label: '%{label}'
    unit: '%{unit}'
    delta: '%{delta}'
    deltaFmt: '%{delta-fmt}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
    height: '%{height}'
