# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-scatter
version: 1
title: Record scatter
category: charts
tags:
- record
- scatter
- generic
manual:
  purpose: 'A point per row of one list in the record: x against y, sized and grouped by optional columns. The grammar''s ''scatter'' panel over
    the page''s record; the board names every field.'
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns x (measure, required), y (measure, required), label
      (dimension), size (measure), group (dimension) to the row fields. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    x-fmt: 'The x axis format (the panel''s xFmt). Empty: as fmt.'
    x-label: 'The x axis label (xLabel). Empty: none.'
    y-label: 'The y axis label (yLabel). Empty: none.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'scatter' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The record scatter on the legal-entity page
    board: |
      params:
        id: {type: id, of: core/legal-entity, required: true}
      chips:
        c:
          use: record-scatter@1
          supply:
            connector: core/legal-entity
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: BOOKS, rows.x: VAR, rows.y: PNL, rows.label: BOOK}
          controls: {fmt: signed0}
  not-for: One measure (use record-hbar).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: measure
          required: true
        y:
          type: measure
          required: true
        label:
          type: dimension
        size:
          type: measure
        group:
          type: dimension
    fmt:
      role: control
      type: text
    x-fmt:
      role: control
      type: text
    x-label:
      role: control
      type: text
    y-label:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: scatter
    title: '%{title|Record scatter}'
    rows: '@rows'
    x: '%{rows.x}'
    y: '%{rows.y}'
    label: '%{rows.label}'
    size: '%{rows.size}'
    group: '%{rows.group}'
    fmt: '%{fmt}'
    xFmt: '%{x-fmt}'
    xLabel: '%{x-label}'
    yLabel: '%{y-label}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
