# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: map-highlight
version: 1
title: Map with a highlighted place
category: map
tags:
- geo
- choropleth
- places
- map
- record
- generic
manual:
  purpose: A world map with the record's place highlighted, places linking to their pages and an optional shading by a field of the kind.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    highlight: The place to highlight, usually @doc.ISO3. Required.
    link: 'Where a click on a place goes: {kind, id: ''PREFIX-{iso3}''}. Empty: nowhere.'
    shade: 'Shading by a field of every record of a kind: {kind, field, by, fmt, label}. Empty: none.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'map' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The map with a highlighted place on the jurisdiction page
    board: |
      params:
        id: {type: id, of: world-economy/jurisdiction, required: true}
      chips:
        c:
          use: map-highlight@1
          supply:
            connector: world-economy/jurisdiction
            query: {id: '%{board.params.id}'}
          map: {doc.id: id}
          controls:
            highlight: '@doc.ISO3'
            link: {kind: jurisdiction, id: 'JUR-{iso3}'}
  not-for: Values by place from a model (use bi-map).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: a record with a place code (ISO3)
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    highlight:
      role: control
      type: text
      required: true
    link:
      role: control
      type: spec
    shade:
      role: control
      type: spec
    height:
      role: control
      type: number
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: map
    title: '%{title|Map with a highlighted place}'
    highlight: '%{highlight}'
    link: '%{link}'
    shade: '%{shade}'
    height: '%{height}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
