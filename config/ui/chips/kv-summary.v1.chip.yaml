# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: kv-summary
version: 1
title: Key fields summary
category: kv
tags:
- summary
- fields
- attributes
- key-value
- record
- generic
manual:
  purpose: Named fields of the page's record as label and value pairs, each with its format and tone; a field may link to its own page.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    columns: 'The fields, each {label, bind: ''@doc.FIELD'' or link(@doc.FIELD, ''kind''), fmt, tone}. Required.'
    when: 'A condition on the record (@doc.TYPE == ''X''): the panel shows only when it holds. Empty: always.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'kv' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The key fields summary on the counterparty page
    board: |
      params:
        id: {type: id, of: core/counterparty, required: true}
      chips:
        c:
          use: kv-summary@1
          supply:
            connector: core/counterparty
            query: {id: '%{board.params.id}'}
          map: {doc.id: id}
          controls:
            columns:
            - {label: Status, bind: '@doc.KYC.STATUS', tone: status}
  not-for: A list of rows (use list-table).
  accessibility: Read in document order; each label is tied to its value for screen readers.
  fits: named fields of one record
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    columns:
      role: control
      type: spec
      required: true
    when:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: kv
    title: '%{title|Key fields summary}'
    columns: '%{columns}'
    when: '%{when}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
