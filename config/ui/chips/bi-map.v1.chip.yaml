# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-map
version: 1
title: Map visual
category: geo
tags:
- bi
- visual
- map
manual:
  purpose: Countries shaded by the measure, or a point at each latitude and longitude. The BI 'map' visual type as a chip; its wells are its pins.
  pins:
    rows: 'The rows of the wells: location (dimension), latitude (dimension), longitude (dimension), details (dimension), values (measure, required).
      Required.'
    selected: Out. The value of the first field the person clicked (a bar, a row, a point); empty until they click.
    title: The chip's title. Empty shows the default title.
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The map visual over the trading-risk model
    board: |
      chips:
        c:
          use: bi-map@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: [trades.COUNTRY, trades.LAT, trades.LON, trades.TRADE_ID]
          map: {rows.location: trades.COUNTRY, rows.latitude: trades.LAT, rows.longitude: trades.LON, rows.details: trades.TRADE_ID, rows.values: MTM_USD}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        location:
          type: dimension
        latitude:
          type: dimension
        longitude:
          type: dimension
        details:
          type: dimension
        values:
          type: measure
          required: true
    title:
      role: control
      type: text
  out:
    selected:
      type: dimension
body:
  panels:
  - id: visual
    kind: visual
    type: map
    title: '%{title|Map visual}'
    rows: '@rows'
    wells:
      location: '@rows.location'
      latitude: '@rows.latitude'
      longitude: '@rows.longitude'
      details: '@rows.details'
      values: '@rows.values'
    on-select:
      emits: selected
      value: '@.location'
