# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-status
version: 1
title: Status
category: records
tags:
- panel
- status
- state
manual:
  purpose: Operational states (confirmed, cleared, settled), each value coloured by its meaning. The grammar's 'status' panel kind as a chip.
  pins:
    doc: The record to show. Required; its fields are the rows of the panel.
    title: The chip's title. Empty shows the default title.
  behaviour: Read-only; each state shows its tone (good, warning, bad).
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A status of the trading pack
    board: |
      chips:
        c:
          use: panel-status@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
  not-for: Plain fields without a meaning per value (use panel-kv).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
    title:
      role: control
      type: text
body:
  panels:
  - id: status
    kind: status
    title: '%{title|Status}'
    fields: '@doc.fields'
