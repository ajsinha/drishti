# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-timeline
version: 1
title: Timeline
category: operations
tags:
- panel
- events
- dates
manual:
  purpose: Dated events in order, each with its status. The grammar's 'timeline' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    selected: Out. The id of what the person selected; empty until they select one.
    title: The chip's title. Empty shows the default title.
  behaviour: Clicking an event selects it and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A timeline of the trading pack
    board: |
      chips:
        c:
          use: panel-timeline@1
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.date: TRADE_DATE, rows.label: COUNTERPARTY_NAME, rows.status: STATUS}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: Rows with many columns (use panel-table).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
        date:
          type: date
          required: true
        label:
          type: dimension
          required: true
        status:
          type: dimension
    title:
      role: control
      type: text
  out:
    selected:
      type: id
body:
  panels:
  - id: timeline
    kind: timeline
    title: '%{title|Timeline}'
    rows: '@rows'
    date: '@.date'
    label: '@.label'
    status: '@.status'
    on-select:
      emits: selected
      value: '@.id'
