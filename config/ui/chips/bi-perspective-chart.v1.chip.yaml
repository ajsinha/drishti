# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-perspective-chart
version: 1
title: Perspective chart
category: perspective
tags:
- bi
- visual
- perspective-chart
manual:
  purpose: 'A 2.1 type kept so old reports open: drawn as Drishti''s grid. The BI ''perspective-chart'' visual type as a chip; its wells are its
    pins.'
  pins:
    rows: 'The rows of the wells: rows (dimension, several, required), columns (dimension, several), values (measure, several, required). Required.'
    selected: Out. The value of the first field the person clicked (a bar, a row, a point); empty until they click.
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The perspective chart over the trading-risk model
    board: |
      chips:
        c:
          use: bi-perspective-chart@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: []
          map:
            rows.rows: [trades.DESK]
            rows.columns: [trades.DESK, MTM_USD]
            rows.values: [MTM_USD]
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        rows:
          type: dimension
          required: true
          many: true
        columns:
          type: dimension
          many: true
        values:
          type: measure
          required: true
          many: true
  out:
    selected:
      type: dimension
body:
  panels:
  - id: visual
    kind: visual
    type: perspective-chart
    title: '%{title|Perspective chart}'
    rows: '@rows'
    wells:
      rows: '@rows.rows'
      columns: '@rows.columns'
      values: '@rows.values'
    on-select:
      emits: selected
      value: '@.rows'
