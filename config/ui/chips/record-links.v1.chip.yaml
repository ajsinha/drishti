# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-links
version: 1
title: Linked entities
category: relations
tags:
- record
- links
- generic
manual:
  purpose: The entities the record refers to, each opening its own page. The grammar's 'links' panel over the page's record; the board names every
    field.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'links' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The linked entities on the ir-curve page
    board: |
      params:
        id: {type: id, of: market-data/ir-curve, required: true}
      chips:
        c:
          use: record-links@1
          supply:
            connector: market-data/ir-curve
            query: {id: '%{board.params.id}'}
          map: {doc.id: id}
          controls: {code: REFS, area: right}
  not-for: Structure between entities (use record-graph).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: links
    title: '%{title|Linked entities}'
    of: '@doc'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
