# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-markdown
version: 1
title: Note
category: records
tags:
- panel
- note
- text
manual:
  purpose: A note for the reader, in Markdown. The grammar's 'markdown' panel kind as a chip.
  pins:
    text: The note, in Markdown. Empty shows nothing.
  behaviour: Read-only; links open.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A note of the trading pack
    board: |
      chips:
        c: {use: panel-markdown@1}
  not-for: A title that says too much (use the chip title).
  accessibility: Headings and lists keep their structure for screen readers.
pins:
  in:
    text:
      role: control
      type: text
      required: true
      default: ''
body:
  panels:
  - id: markdown
    kind: markdown
    title: '%{title|Note}'
    text: '%{text}'
