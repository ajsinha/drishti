# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: status-fields
version: 1
title: Status fields
category: kv
tags:
- status
- state
- workflow
- fields
- record
- generic
manual:
  purpose: Named state fields of the page's record (confirmed, cleared, settled), each coloured by its meaning.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    fields: 'The fields, each {label, bind: ''@doc.FIELD'', tone}. Required.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'status' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The status fields on the trade page
    board: |
      params:
        id: {type: id, of: trading/trade, required: true}
      chips:
        c:
          use: status-fields@1
          supply:
            connector: trading/trade
            query: {id: '%{board.params.id}'}
          map: {doc.id: id}
          controls:
            fields:
            - {label: Confirmation, bind: '@doc.CONFIRMATION.STATUS', tone: status}
  not-for: Fields without a meaning per value (use kv-summary).
  accessibility: Read in document order; each label is tied to its value for screen readers.
  fits: state fields of one record with a meaning per value
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    fields:
      role: control
      type: spec
      required: true
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    height:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: status
    title: '%{title|Status fields}'
    fields: '%{fields}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
    height: '%{height}'
