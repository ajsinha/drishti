# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-waterfall
version: 1
title: Waterfall chart
category: charts
tags:
- bi
- visual
- waterfall
manual:
  purpose: Each step from the running total, and a total. The BI 'waterfall' visual type as a chip; its wells are its pins.
  pins:
    rows: 'The rows of the wells: axis (dimension, required), values (measure, required). Required.'
    selected: Out. The value of the first field the person clicked (a bar, a row, a point); empty until they click.
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The waterfall chart over the trading-risk model
    board: |
      chips:
        c:
          use: bi-waterfall@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: [trades.DESK]
          map: {rows.axis: trades.DESK, rows.values: MTM_USD}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        axis:
          type: dimension
          required: true
        values:
          type: measure
          required: true
  out:
    selected:
      type: dimension
body:
  panels:
  - id: visual
    kind: visual
    type: waterfall
    title: '%{title|Waterfall chart}'
    rows: '@rows'
    wells:
      axis: '@rows.axis'
      values: '@rows.values'
    on-select:
      emits: selected
      value: '@.axis'
