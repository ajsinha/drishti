# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-waterfall
version: 1
title: Waterfall
category: pnl
tags:
- panel
- waterfall
- pnl
manual:
  purpose: A start value, signed contributions and an end value, with the running total. The grammar's 'waterfall' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
  behaviour: Hover shows each step and the running total.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A waterfall of the trading pack
    board: |
      chips:
        c:
          use: panel-waterfall@1
          supply: {connector: trading/trade-search}
          map: {rows.label: COUNTERPARTY_NAME, rows.value: MTM_USD}
  not-for: Amounts that do not add up (use panel-hbar).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
          required: true
        value:
          type: measure
          required: true
body:
  panels:
  - id: waterfall
    kind: waterfall
    title: '%{title|Waterfall}'
    rows: '@rows'
    label: '@.label'
    value: '@.value'
    total: true
