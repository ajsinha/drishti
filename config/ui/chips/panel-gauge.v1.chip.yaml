# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-gauge
version: 1
title: Gauge
category: charts
tags:
- panel
- gauge
- limit
manual:
  purpose: One number against a maximum, as a dial. The grammar's 'gauge' panel kind as a chip.
  pins:
    value: The number. Required.
    max: The maximum of the dial. Empty uses 100.
    title: The chip's title. Empty shows the default title.
  behaviour: Read-only.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A gauge of the trading pack
    board: |
      chips:
        c:
          use: panel-gauge@1
          supply: {connector: trading/trade-search}
          map: {}
  not-for: A number without a maximum (use panel-metric).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    value:
      role: data
      type: measure
      required: true
    max:
      role: control
      type: number
    title:
      role: control
      type: text
body:
  panels:
  - id: gauge
    kind: gauge
    title: '%{title|Gauge}'
    value: '%{value}'
    max: '%{max|100}'
