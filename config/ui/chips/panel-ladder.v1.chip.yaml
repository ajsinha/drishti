# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-ladder
version: 1
title: Ladder
category: tables
tags:
- panel
- ladder
- schedule
manual:
  purpose: 'A list where one row matters most (the next payment): every row shown, the important one highlighted. The grammar''s ''ladder'' panel
    kind as a chip.'
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    selected: Out. The id of what the person selected; empty until they select one.
  behaviour: Clicking a row selects it and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A ladder of the trading pack
    board: |
      chips:
        c:
          use: panel-ladder@1
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.date: TRADE_DATE, rows.amount: AMOUNT}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: Rows to filter and page (use panel-table).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
          required: true
        date:
          type: date
          required: true
        amount:
          type: measure
  out:
    selected:
      type: id
body:
  panels:
  - id: ladder
    kind: ladder
    title: '%{title|Ladder}'
    rows: '@rows'
    on-select:
      emits: selected
      value: '@.id'
