# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: filterable-table
version: 2
title: Filterable table
category: tables
tags:
- table
- filter
- selection
- master
compatible-with:
- 1
manual:
  purpose: A table of rows of one shape with an id, an optional date, a label and up to six measure columns. The person filters it by typing or
    by the control pins; selecting a row sends its id out, so a detail chip can follow the selection.
  pins:
    rows: The rows to show. Required. Each row must give an id; the other columns are optional.
    filter: A filter from another chip (a slicer, a search box). Empty means no filter.
    date-from: Show rows on or after this date. Empty means no lower bound.
    date-to: Show rows on or before this date. Empty means no upper bound.
    page-size: Rows per page, 10 to 200. Default 50.
    selected: Out. The id of the row the person selected; empty until they select one.
    visible: Out. The rows after every filter, for a chart or a total chip to follow.
    filter-out: Out. The filter the person typed, for other chips to share.
  behaviour: Clicking a row selects it (one at a time) and sends 'selected'. Typing in the search box filters on the label and id columns and
    sends 'filter-out'. Column headers sort. Measure columns are totalled.
  defaults: No filter, no date bounds, 50 rows a page, sorted by the date column descending, else by id.
  limits: Paints at most 10,000 rows (the server pages the rest; the footer says 'first 10,000 of N'). Measures are summed in the supplier's currency;
    rows of mixed currencies show no total.
  examples:
  - title: Trades of a book, detail follows the selection
    board: |
      chips:
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map:
            rows.id: TRADE_ID
            rows.date: TRADE_DATE
            rows.label: COUNTERPARTY
            rows.measures: [NOTIONAL, MTM]
        ticket:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID}
      traces:
      - {from: trades.selected, to: ticket.id}
  not-for: One record (use entity-card); a pivot (use bi-matrix); more than six measures (use panel-table).
  accessibility: Arrow keys move the row cursor, Enter selects; the selection is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
          required: true
        date:
          type: date
        label:
          type: dimension
        measures:
          type: measure
          many: true
          max: 6
    filter:
      role: control
      type: filter
    date-from:
      role: control
      type: date
    date-to:
      role: control
      type: date
    page-size:
      role: control
      type: number
      min: 10
      max: 200
      default: 50
  out:
    selected:
      type: id
      of: rows.id
    visible:
      type: rowset
      shape-of: rows
    filter-out:
      type: filter
limits:
  rows: 10000
body:
  panels:
  - id: table
    kind: table
    title: '%{title|Rows}'
    rows: '@rows'
    where:
    - '@rows.date >= %{date-from|-inf}'
    - '@rows.date <= %{date-to|+inf}'
    - '%{filter|true}'
    page-size: '%{page-size}'
    columns:
    - label: Id
      bind: '@.id'
      link: '%{rows.id.kind}'
    - label: Date
      bind: '@.date'
      fmt: date
      optional: true
    - label: Name
      bind: '@.label'
      optional: true
    - each: measures
      label: '@name'
      bind: '@.value'
      fmt: amount0
      total: true
    search:
      'on':
      - id
      - label
      emits: filter-out
    on-select:
      emits: selected
      value: '@.id'
    exposes:
      visible: '@filtered'
