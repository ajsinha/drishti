# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-candlestick
version: 1
title: Candlestick
category: market
tags:
- panel
- prices
- ohlc
manual:
  purpose: Prices with open, high, low and close by date. The grammar's 'candlestick' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
  behaviour: Hover shows the day's prices.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A candlestick of the trading pack
    board: |
      chips:
        c:
          use: panel-candlestick@1
          supply: {connector: trading/trade-search}
          map: {rows.x: TRADE_DATE, rows.open: OPEN, rows.high: HIGH, rows.low: LOW, rows.close: CLOSE, rows.volume: VOLUME}
  not-for: The close alone (use panel-line).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        x:
          type: date
          required: true
        open:
          type: measure
          required: true
        high:
          type: measure
          required: true
        low:
          type: measure
          required: true
        close:
          type: measure
          required: true
        volume:
          type: measure
body:
  panels:
  - id: candlestick
    kind: candlestick
    title: '%{title|Candlestick}'
    rows: '@rows'
    x: '@.x'
    open: '@.open'
    high: '@.high'
    low: '@.low'
    close: '@.close'
    volume: '@.volume'
