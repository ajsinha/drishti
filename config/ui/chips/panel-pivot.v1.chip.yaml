# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-pivot
version: 1
title: Pivot
category: tables
tags:
- panel
- pivot
- totals
manual:
  purpose: Rows totalled by one field across another, with totals on both axes. The grammar's 'pivot' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
  behaviour: Groups open and close.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A pivot of the trading pack
    board: |
      chips:
        c:
          use: panel-pivot@1
          supply: {connector: trading/trade-search}
          map: {rows.by: BOOK, rows.across: CCY, rows.value: MTM_USD}
  not-for: One dimension (use panel-table with totals).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        by:
          type: dimension
          required: true
        across:
          type: dimension
          required: true
        value:
          type: measure
          required: true
body:
  panels:
  - id: pivot
    kind: pivot
    title: '%{title|Pivot}'
    rows: '@rows'
    by: '@.by'
    across: '@.across'
    value: '@.value'
    totals: true
