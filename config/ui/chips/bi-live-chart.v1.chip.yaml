# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-live-chart
version: 1
title: Live chart
category: live
tags:
- bi
- visual
- live-chart
manual:
  purpose: 'A rolling line: each update of a live table adds a point per measure. The BI ''live-chart'' visual type as a chip; its wells are its
    pins.'
  pins:
    rows: 'The rows of the wells: values (measure, several, required). Required.'
    format: 'The visual''s format block as the report writes it (colours, labels, run, spec). Empty: defaults.'
    alt: 'The text alternative read to screen readers. Empty: the title.'
    filters: 'Filters on this visual only, as the report writes them. Empty: none.'
    sort: 'The sort, {by, order}. Empty: the visual type''s default.'
    limit: 'At most this many members (top N after the sort). Empty: no limit.'
    hierarchy: 'The drill levels of the axis. Empty: no drill.'
    alert: 'The alert colours by threshold. Empty: none.'
    drillthrough: 'The page a right-click drills through to, with the fields it carries. Empty: none.'
  behaviour: Read-only; hover shows the values.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The live chart over the trading-risk model
    board: |
      chips:
        c:
          use: bi-live-chart@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: []
          map:
            rows.values: [MTM_USD]
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        values:
          type: measure
          required: true
          many: true
    format:
      role: control
      type: spec
    alt:
      role: control
      type: text
    filters:
      role: control
      type: spec
    sort:
      role: control
      type: spec
    limit:
      role: control
      type: number
    hierarchy:
      role: control
      type: spec
    alert:
      role: control
      type: spec
    drillthrough:
      role: control
      type: spec
body:
  panels:
  - id: visual
    kind: visual
    type: live-chart
    title: '%{title|Live chart}'
    rows: '@rows'
    wells:
      values: '@rows.values'
    format: '%{format}'
    alt: '%{alt}'
    filters: '%{filters}'
    sort: '%{sort}'
    limit: '%{limit}'
    hierarchy: '%{hierarchy}'
    alert: '%{alert}'
    drillthrough: '%{drillthrough}'
