# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: entity-card
version: 1
title: Entity card
category: records
tags:
- entity
- record
- detail
manual:
  purpose: 'One entity as a card: its title and chosen fields, opened by id. The detail side of a master-detail board.'
  pins:
    doc: The entity document, read by the supplier for the id. Required.
    id: The id to open (usually traced from a table's 'selected'). Empty shows a prompt to select one.
    title: The chip's title. Empty shows the default title.
  behaviour: Read-only; the title links to the entity's own board.
  defaults: 'No id: a prompt to select a row.'
  limits: One entity; at most 60 fields.
  examples:
  - title: A trade ticket following a table
    board: |
      chips:
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME}
        ticket:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: trades.selected, to: ticket.id}
  not-for: A list of entities (use filterable-table).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
    id:
      role: control
      type: id
    title:
      role: control
      type: text
body:
  panels:
  - id: card
    kind: kv
    title: '%{title|@doc.title}'
    fields: '@doc.fields'
    when: '%{id|}'
