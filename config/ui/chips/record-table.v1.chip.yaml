# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: record-table
version: 1
title: Record table
category: tables
tags:
- record
- table
- generic
manual:
  purpose: The rows of one list in the record, as columns the board names, with totals, an optional pivot view and an optional row filter. The
    grammar's 'table' panel over the page's record; the board names every field.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns id (id) to the row fields. Required.'
    columns: 'The columns, each {label, bind: ''@.FIELD'', fmt, tone, total, link}. Required.'
    pivot: 'The pivot view the person may switch to: {fields, rows, columns, values, filters, heat}. Empty: none.'
    where: 'A row filter over the row (@.FIELD) and the page controls. Empty: every row.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
  behaviour: As the grammar's 'table' panel (PANELS.md); read-only unless a setting says otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The record table on the ccp page
    board: |
      params:
        id: {type: id, of: core/ccp, required: true}
      chips:
        c:
          use: record-table@1
          supply:
            connector: core/ccp
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: ACCOUNTS}
          controls:
            columns:
            - {label: Account, bind: '@.ID'}
            - {label: IM, bind: '@.IM', fmt: compact, total: true}
  not-for: Rows from a search or a model (use panel-table or filterable-table); one record's fields (use record-fields).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
    columns:
      role: control
      type: spec
      required: true
    pivot:
      role: control
      type: spec
    where:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
body:
  panels:
  - id: '%{panel-id}'
    kind: table
    title: '%{title|Record table}'
    rows: '@rows'
    columns: '%{columns}'
    pivot: '%{pivot}'
    where: '%{where}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
