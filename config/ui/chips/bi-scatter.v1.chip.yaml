# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-scatter
version: 1
title: Scatter chart
category: charts
tags:
- bi
- visual
- scatter
manual:
  purpose: A point per value of details. The BI 'scatter' visual type as a chip; its wells are its pins.
  pins:
    rows: 'The rows of the wells: details (dimension, required), x (measure, required), y (measure, required), size (measure). Required.'
    selected: Out. The value of the first field the person clicked (a bar, a row, a point); empty until they click.
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The scatter chart over the trading-risk model
    board: |
      chips:
        c:
          use: bi-scatter@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD, NOTIONAL]
              dimensions: [trades.TRADE_ID]
          map: {rows.details: trades.TRADE_ID, rows.x: NOTIONAL, rows.y: MTM_USD, rows.size: NOTIONAL}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        details:
          type: dimension
          required: true
        x:
          type: measure
          required: true
        y:
          type: measure
          required: true
        size:
          type: measure
  out:
    selected:
      type: dimension
body:
  panels:
  - id: visual
    kind: visual
    type: scatter
    title: '%{title|Scatter chart}'
    rows: '@rows'
    wells:
      details: '@rows.details'
      x: '@rows.x'
      y: '@rows.y'
      size: '@rows.size'
    on-select:
      emits: selected
      value: '@.details'
