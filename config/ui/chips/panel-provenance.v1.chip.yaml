# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-provenance
version: 1
title: How this view was built
category: records
tags:
- panel
- lineage
- audit
manual:
  purpose: 'Where the view came from: the sources read, their freshness and the Sutra version. The grammar''s ''provenance'' panel kind as a chip.'
  pins:
    doc: The record to show. Required; its fields are the rows of the panel.
  behaviour: Read-only; each source opens its details.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A how this view was built of the trading pack
    board: |
      chips:
        c:
          use: panel-provenance@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
  not-for: Business data (use panel-kv).
  accessibility: Read in document order; each label is tied to its value for screen readers.
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
        title:
          type: text
        fields:
          type: dimension
          many: true
body:
  panels:
  - id: provenance
    kind: provenance
    title: '%{title|How this view was built}'
    of: '@doc'
