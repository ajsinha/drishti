# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-scatter
version: 1
title: Scatter
category: risk
tags:
- panel
- scatter
- compare
manual:
  purpose: Rows with two measures to compare, one point each. The grammar's 'scatter' panel kind as a chip.
  pins:
    rows: The rows to show. Required. Each row must give the required columns; the others are optional.
    selected: Out. The id of what the person selected; empty until they select one.
    title: The chip's title. Empty shows the default title.
  behaviour: Clicking a point selects it and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A scatter of the trading pack
    board: |
      chips:
        c:
          use: panel-scatter@1
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.x: TRADE_DATE, rows.y: MTM_USD, rows.size: NOTIONAL, rows.label: COUNTERPARTY_NAME}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: One measure (use panel-hbar).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
        x:
          type: measure
          required: true
        y:
          type: measure
          required: true
        size:
          type: measure
        label:
          type: dimension
    title:
      role: control
      type: text
  out:
    selected:
      type: id
body:
  panels:
  - id: scatter
    kind: scatter
    title: '%{title|Scatter}'
    rows: '@rows'
    x: '@.x'
    y: '@.y'
    size: '@.size'
    on-select:
      emits: selected
      value: '@.id'
