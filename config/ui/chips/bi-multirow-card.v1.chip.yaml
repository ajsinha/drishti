# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-multirow-card
version: 1
title: Multi-row card
category: cards
tags:
- bi
- visual
- multirow-card
manual:
  purpose: A row per value of the axis. The BI 'multirow-card' visual type as a chip; its wells are its pins.
  pins:
    rows: 'The rows of the wells: axis (dimension), values (measure, several, required). Required.'
    selected: Out. The value of the first field the person clicked (a bar, a row, a point); empty until they click.
    title: The chip's title. Empty shows the default title.
  behaviour: Clicking a mark selects it and sends 'selected', which may cross-filter other chips.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The multi-row card over the trading-risk model
    board: |
      chips:
        c:
          use: bi-multirow-card@1
          supply:
            model: trading-risk
            query:
              measures: [MTM_USD]
              dimensions: [trades.DESK]
          map:
            rows.axis: trades.DESK
            rows.values: [MTM_USD]
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        axis:
          type: dimension
        values:
          type: measure
          required: true
          many: true
    title:
      role: control
      type: text
  out:
    selected:
      type: dimension
body:
  panels:
  - id: visual
    kind: visual
    type: multirow-card
    title: '%{title|Multi-row card}'
    rows: '@rows'
    wells:
      axis: '@rows.axis'
      values: '@rows.values'
    on-select:
      emits: selected
      value: '@.axis'
