# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: panel-tabs
version: 1
title: Tabs
category: layout
tags:
- panel
- tabs
- legs
manual:
  purpose: Two to four similar objects (legs, tranches), one tab each, each tab showing that object's fields. The grammar's 'tabs' panel kind
    as a chip.
  pins:
    rows: The objects, one tab each. Required.
    selected: Out. The id of what the person selected; empty until they select one.
  behaviour: Opening a tab selects its object and sends 'selected'.
  defaults: 'No control input: the panel kind''s own defaults (PANELS.md).'
  limits: Paints at most 10,000 rows; the server pages the rest and the footer says so.
  examples:
  - title: A tabs of the trading pack
    board: |
      chips:
        c:
          use: panel-tabs@1
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME}
        detail:
          use: entity-card@1
          supply: {connector: trading/trade}
          map: {doc.id: TRADE_ID, doc.title: DEAL_NUMBER}
      traces:
      - {from: c.selected, to: detail.id}
  not-for: More than four objects (use panel-table).
  accessibility: 'Tabs are a tab list: arrow keys move between tabs, Enter opens one.'
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        id:
          type: id
          required: true
        label:
          type: dimension
  out:
    selected:
      type: id
body:
  panels:
  - id: tabs
    kind: tabs
    title: '%{title|Tabs}'
    each: '@rows'
    tabTitle: '@.label'
    on-select:
      emits: selected
      value: '@.id'
