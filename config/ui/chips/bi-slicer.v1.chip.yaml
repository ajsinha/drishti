# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: bi-slicer
version: 1
title: Slicer
category: slicers
tags:
- bi
- visual
- slicer
manual:
  purpose: A list of a field's values; the person's choice filters other chips. The BI 'slicer' visual type as a chip; its wells are its pins.
  pins:
    rows: 'The rows of the wells: field (dimension, required). Required.'
    filter-out: Out. The filter the person chose (field in values), for other chips to share.
    format: 'The visual''s format block as the report writes it (colours, labels, run, spec). Empty: defaults.'
    alt: 'The text alternative read to screen readers. Empty: the title.'
    filters: 'Filters on this visual only, as the report writes them. Empty: none.'
    sort: 'The sort, {by, order}. Empty: the visual type''s default.'
    limit: 'At most this many members (top N after the sort). Empty: no limit.'
    hierarchy: 'The drill levels of the axis. Empty: no drill.'
    alert: 'The alert colours by threshold. Empty: none.'
    drillthrough: 'The page a right-click drills through to, with the fields it carries. Empty: none.'
  behaviour: Choosing values sends 'filter-out'.
  defaults: The visual type's defaults (REPORTS.md section 3); no control input.
  limits: Paints at most 10,000 rows; the BI engine aggregates before painting. A question that runs long becomes a BI run card.
  examples:
  - title: The slicer over the trading-risk model
    board: |
      chips:
        c:
          use: bi-slicer@1
          supply:
            model: trading-risk
            query:
              measures: []
              dimensions: [trades.DESK]
          map: {rows.field: trades.DESK}
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME}
      traces:
      - {from: c.filter-out, to: trades.filter}
  not-for: A grammar panel over entity data (use the panel-* chips).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        field:
          type: dimension
          required: true
    format:
      role: control
      type: spec
    alt:
      role: control
      type: text
    filters:
      role: control
      type: spec
    sort:
      role: control
      type: spec
    limit:
      role: control
      type: number
    hierarchy:
      role: control
      type: spec
    alert:
      role: control
      type: spec
    drillthrough:
      role: control
      type: spec
  out:
    filter-out:
      type: filter
body:
  panels:
  - id: visual
    kind: visual
    type: slicer
    title: '%{title|Slicer}'
    rows: '@rows'
    wells:
      field: '@rows.field'
    emits: filter-out
    format: '%{format}'
    alt: '%{alt}'
    filters: '%{filters}'
    sort: '%{sort}'
    limit: '%{limit}'
    hierarchy: '%{hierarchy}'
    alert: '%{alert}'
    drillthrough: '%{drillthrough}'
