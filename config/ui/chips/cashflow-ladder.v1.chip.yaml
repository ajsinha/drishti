# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: cashflow-ladder
version: 1
title: Cash-flow ladder
category: tables
tags:
- cashflow
- ladder
- payments
manual:
  purpose: Cash flows by date, grouped by currency or leg, the next payment highlighted and a running total per group.
  pins:
    rows: 'The flows. Required: a date and an amount; a group (currency, leg) and the trade id are optional.'
    filter: A filter, usually a trade id traced from a table (transform filter-on rows.trade). Empty shows every flow.
    selected: Out. The date the person clicked.
  behaviour: Clicking a date sends 'selected'.
  defaults: Every flow, grouped by the group column, dates ascending.
  limits: Paints at most 10,000 flows.
  examples:
  - title: The selected trade's flows
    board: |
      chips:
        trades:
          use: filterable-table@2
          supply: {connector: trading/trade-search}
          map: {rows.id: TRADE_ID}
        flows:
          use: cashflow-ladder@1
          supply:
            model: trading-risk
            query:
              measures: [FLOW_AMOUNT]
              dimensions: [cashflows.PAY_DATE, cashflows.CCY]
          map: {rows.date: cashflows.PAY_DATE, rows.group: cashflows.CCY, rows.amount: FLOW_AMOUNT, rows.trade: cashflows.TRADE_ID}
      traces:
      - from: trades.selected
        to: flows.filter
        transform: {filter-on: rows.trade}
  not-for: Flows of one trade with resets (use the flow-schedule chip).
  accessibility: Arrow keys move the row cursor and Enter selects; the selection is announced; column headers are buttons that sort.
pins:
  in:
    rows:
      role: data
      type: rowset
      required: true
      shape:
        date:
          type: date
          required: true
        group:
          type: dimension
        amount:
          type: measure
          required: true
        trade:
          type: id
    filter:
      role: control
      type: filter
  out:
    selected:
      type: date
body:
  panels:
  - id: ladder
    kind: ladder
    title: '%{title|Cash flows}'
    rows: '@rows'
    where:
    - '%{filter|true}'
    on-select:
      emits: selected
      value: '@.date'
