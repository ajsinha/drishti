# A seed chip of the Chip Store (UI_BOARD.md 9.4): shipped certified and read-only. Generated by tools/ui_seed_chips.py.
rachana: 1
chip: step-waterfall
version: 1
title: Step waterfall
category: chart
tags:
- attribution
- bridge
- breakdown
- waterfall
- record
- generic
manual:
  purpose: Steps from one list in the record adding up to a total.
  pins:
    doc: The page's record as the viewer may see it (masks applied). Required; settings may read its fields as @doc.FIELD.
    rows: 'The rows of one list in the record: map rows: <the list''s field>, and its columns label (dimension, required), value (measure, required)
      to the row fields. Required.'
    fmt: 'The number format of the values (price2, pct4, compact, signed0, ...). Empty: the kind''s default.'
    sum: 'The label of the total bar. Empty: Total.'
    unit: 'The unit shown with the values (USD). Empty: none.'
    panel-id: 'The panel''s id on the page when it is not the instance name (an old page''s camelCase id). Empty: the instance name.'
    key: 'The function key that jumps to the panel (F2 to F12). Empty: no key.'
    code: 'The terminal mnemonic that opens the panel (REFS, CRV). Empty: none.'
    area: 'The page column: main (the default) or right.'
    span: 'How many of the page''s 12 columns the panel takes. Empty: the kind''s default.'
    height: 'The panel''s height in rows. Empty: the kind''s default.'
    page: 'The page controls, traced from the page header''s ''page'' pin: the settings read them as ctl.<id> (a row filter, a title). Empty:
      the page has none.'
  behaviour: The grammar's 'waterfall' panel over the page's record (PANELS.md); the board names every field. Read-only unless a setting says
    otherwise.
  defaults: Every empty setting is left out of the panel, so the kind's own default applies.
  limits: Paints at most 10,000 rows of the list; the record is read once per page.
  examples:
  - title: The step waterfall on the pnl-explain page
    board: |
      params:
        id: {type: id, of: market-risk/pnl-explain, required: true}
      chips:
        c:
          use: step-waterfall@1
          supply:
            connector: market-risk/pnl-explain
            query: {id: '%{board.params.id}'}
          map: {doc.id: id, rows: EXPLAIN_STEPS, rows.label: STEP, rows.value: PNL}
          controls: {sum: Actual}
  not-for: Amounts that do not add up (use ranked-bar-list).
  accessibility: The chart has a text alternative (its rows as a table) reached with the keyboard; a selected point is announced.
  fits: rows with a label and an amount that add up to a total
pins:
  in:
    doc:
      role: data
      type: document
      required: true
      shape:
        id:
          type: id
          required: true
    rows:
      role: data
      type: rowset
      required: true
      shape:
        label:
          type: dimension
          required: true
        value:
          type: measure
          required: true
    fmt:
      role: control
      type: text
    sum:
      role: control
      type: text
    unit:
      role: control
      type: text
    panel-id:
      role: control
      type: text
    key:
      role: control
      type: text
    code:
      role: control
      type: text
    area:
      role: control
      type: text
    span:
      role: control
      type: number
    height:
      role: control
      type: number
    page:
      role: control
      type: spec
body:
  panels:
  - id: '%{panel-id}'
    kind: waterfall
    title: '%{title|Step waterfall}'
    rows: '@rows'
    label: '%{rows.label}'
    value: '%{rows.value}'
    fmt: '%{fmt}'
    sum: '%{sum}'
    unit: '%{unit}'
    key: '%{key}'
    code: '%{code}'
    area: '%{area}'
    span: '%{span}'
    height: '%{height}'
