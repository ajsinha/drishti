# Example: copy to config/connectors/risk-store.yaml to read the risk-store data from aerospike. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: aerospike
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
description: risk-store read from aerospike (the former application-aerospike.yaml profile)
settings:
  domain: risk
  hosts: ${DRISHTI_AEROSPIKE_HOSTS:localhost:3000}
  namespace: ${DRISHTI_AEROSPIKE_NAMESPACE:test}
