# Example: copy to config/connectors/<name>.yaml to read this domain from AWS S3 Tables (Iceberg through the S3 Tables REST
# endpoint, requests signed with SigV4) instead of Delta. It replaces the pack's connector of the same name (settings are not
# merged). Set DRISHTI_S3TABLES_ARN to the table bucket's ARN (deploy/aws/s3-tables/s3-tables.sh create prints it); until then the
# connector stays idle. The endpoint, the signing, the region and the namespace (the domain) follow from the ARN; the kinds are
# read from the S3 Tables tables of the same names with underscores (pnl-vector is pnl_vector). No key is written here:
# credentials come from the AWS default chain (the ECS task role, a profile, AWS_ACCESS_KEY_ID). Guide: plugins/drishti-plugin-iceberg/README.md section 20.
# The lake (iceberg, its root or catalog, storage and tables) is config/lakes.examples/s3tables/s3tables.yaml: copy it to
# config/lakes/s3tables.yaml beside this file (docs/guides/DATA_LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: iceberg
kinds:
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
- trade-valuation
- portfolio
- pnl-vector
- scenario-pv
- fx-scenario
- scenario-set
- var-limit
- desk-pnl
- pnl-history
description: risk-store read from AWS S3 Tables (the market-risk pack's risk domain with its P&L vectors, scenario PVs and limits)
settings:
  lake: s3tables
  lake-tables: risk.stress-scenario,risk.stress-result,risk.frtb-sensitivity,risk.pnl-explain,risk.trade-valuation,risk.portfolio,risk.pnl-vector,risk.scenario-pv,risk.fx-scenario,risk.scenario-set,risk.var-limit,risk.desk-pnl,risk.pnl-history
  engine: native
