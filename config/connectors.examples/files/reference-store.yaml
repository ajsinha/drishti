# Example: copy to config/connectors/reference-store.yaml to read the reference-store data from files. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: file
kinds:
- counterparty
- counterparty-group
- issuer
- agreement
- ccp
- legal-entity
- book
- desk
- trader
- calendar
- csa
- clearing-account
description: reference-store read from files (the former application-files.yaml profile)
settings:
  root: ${DRISHTI_FILES_ROOT:${drishti.data.dir:./data}/files}
  domain: reference
  mode.counterparty: effective
  mode.counterparty-group: effective
  mode.issuer: effective
  mode.agreement: effective
  mode.ccp: effective
  mode.legal-entity: effective
  mode.book: effective
  mode.desk: effective
  mode.trader: effective
  mode.calendar: effective
  mode.csa: effective
  mode.clearing-account: effective
