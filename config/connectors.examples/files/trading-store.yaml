# Example: copy to config/connectors/trading-store.yaml to read the trading-store data from files. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: file
kinds:
- trade
description: trading-store read from files (the former application-files.yaml profile)
settings:
  root: ${DRISHTI_FILES_ROOT:${drishti.data.dir:./data}/files}
  domain: trading
