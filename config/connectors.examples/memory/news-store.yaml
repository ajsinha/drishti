# Example: copy to config/connectors/news-store.yaml to hold the news-and-markets pack's four kinds in the server's memory only
# (mem://news), never on a disk. It replaces the pack's connector of the same name (settings are not merged). The memory store and the
# replenish jobs that fill it are server settings: copy config/examples/in-memory-lake.yaml into application.local.yaml (or set the
# drishti.lake.memory.* keys) and restart. Nothing else changes for the pages, the search, BI or Export data. Being memory-only, this
# connector keeps no disk cache, no id-map files and no index segments; scheduled reports, mail and pictures of its data are refused and
# only a user's download leaves. Guide: docs/guides/IN_MEMORY_LAKE_GUIDE.md.
# The lake (delta, its root or catalog, storage and tables) is config/lakes.examples/memory/news.yaml: copy it to
# config/lakes/news.yaml beside this file (docs/guides/LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: delta
kinds:
- news-topic
- listed-company
- news
- quote
description: news-store held in memory only (mem://news), filled by the in-memory lake's replenish jobs
settings:
  lake: news
  lake-tables: news.news-topic,news.listed-company,news.news,news.quote
