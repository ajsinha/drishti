# Example: copy to config/connectors/risk-store.yaml to read the risk-store data from cassandra. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: cassandra
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
description: risk-store read from Apache Cassandra (loaded by tools/load-cassandra.sh)
settings:
  domain: risk
  contact-points: ${DRISHTI_CASSANDRA_CONTACT_POINTS:localhost:9042}
  local-datacenter: ${DRISHTI_CASSANDRA_DATACENTER:datacenter1}
  username: ${DRISHTI_CASSANDRA_USERNAME:}
  password: ${DRISHTI_CASSANDRA_PASSWORD:}
