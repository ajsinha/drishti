# Example: copy to config/connectors/market-store.yaml to read the market-store data from cassandra. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: cassandra
kinds:
- ir-curve
- repo-curve
- fx-spot
- fx-forward-curve
- fx-vol-surface
- ir-vol-cube
- cap-vol-surface
- equity
- equity-index
- dividend-curve
- equity-vol-surface
- credit-curve
- inflation-index
- inflation-curve
- commodity
- commodity-curve
- commodity-vol-surface
- rate-fixing
- bond
- correlation-matrix
description: market-store read from Apache Cassandra (loaded by tools/load-cassandra.sh)
settings:
  domain: market
  contact-points: ${DRISHTI_CASSANDRA_CONTACT_POINTS:localhost:9042}
  local-datacenter: ${DRISHTI_CASSANDRA_DATACENTER:datacenter1}
  username: ${DRISHTI_CASSANDRA_USERNAME:}
  password: ${DRISHTI_CASSANDRA_PASSWORD:}
