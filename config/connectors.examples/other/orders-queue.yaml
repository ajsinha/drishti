# Example: a RabbitMQ queue of orders over TLS (amqps).
plugin: rabbitmq
kinds: [order]
description: Orders from the order-management broker
settings:
  uri: amqps://oms-broker.example.com:5671/drishti
  queues: [orders]
  tls:
    enabled: true
    truststore:
      path: /etc/drishti/tls/ca.p12
      password: ${RABBIT_TRUSTSTORE_PASSWORD}
