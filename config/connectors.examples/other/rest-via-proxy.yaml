# Example: a vendor's HTTPS API reached through the company's forward proxy with a login. Copy to config/connectors/rest-via-proxy.yaml.
# The https target is tunnelled with CONNECT and keeps its own TLS (tls.* below is optional). Leave the proxy: block out to use the site
# default (drishti.http.proxy.*), or write `proxy: none` to go direct. See docs/connectors/TLS.md.
plugin: rest
kinds: [price]
description: Prices from a vendor API through the corporate proxy
settings:
  base-url: https://api.vendor.example/v1
  header.Authorization: Bearer ${VENDOR_TOKEN}
  proxy:
    url: http://proxy.corp.example:3128
    username: svc-drishti
    password: ${PROXY_PASSWORD}        # an environment variable, never the password itself
    no-proxy: [intranet.example, .corp.example, 10.0.0.0/8]
