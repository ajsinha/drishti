# Example: an Iceberg REST catalog whose object store (MinIO, Ceph) has a certificate from a private CA. tls.* secures the object
# store; the catalog's own https connection uses the JVM's truststore. Copy to config/connectors/iceberg-rest-private-ca.yaml.
# See plugins/drishti-plugin-iceberg/README.md, section Security.
# The lake (iceberg, its root or catalog, storage and tables) is config/lakes.examples/other/rest-catalog.yaml: copy it to
# config/lakes/rest-catalog.yaml beside this file (docs/guides/DATA_LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: iceberg
description: Iceberg tables behind a REST catalog, object store over TLS
settings:
  lake: rest-catalog
  lake-tables: risk.trade
  tls.ca-file: /etc/drishti/tls/ca.pem
