# Example: documents in an S3 bucket reached through the company's forward proxy. Copy to config/connectors/s3-via-proxy.yaml.
# The same proxy: block works for delta and iceberg on S3. See docs/connectors/PROXY.md and docs/connectors/S3_CONNECTOR.md.
plugin: s3
kinds: [trade]
description: Trade documents in S3, through the corporate proxy
settings:
  bucket: risk-docs
  prefix: trading
  region: eu-west-1
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  proxy:
    url: http://proxy.corp.example:3128
    username: svc-drishti
    password: ${PROXY_PASSWORD}
    no-proxy: [.corp.example]
