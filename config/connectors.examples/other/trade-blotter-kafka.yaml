# Example: the demo trade blotter's live side and its write-back (modules/trading/docs/guide.md sections 3 and 8). Copy to
# config/connectors/trade-kafka.yaml, start the demo broker and stream (deploy/docker/compose.data.yaml; tools/samplegen/stream.py, whose
# trades carry a numeric TRADE_VERSION and UPDATED_BY), and bind the kind with live: in config/bindings.yaml:
#   trade: { read: [trade-endur, trade-murex], union: true, live: trade-kafka }
# An amended trade is written back to the same topic as the whole record at its next version, so the stream brings it back and the row
# ticks. Writes are off until an administrator switches them on (Admin -> Edits); edit.enabled must be true (config/edit/edit.yaml).
plugin: kafka
kinds: [trade]
description: The demo's live trades, and the trade blotter's amendments written back to them
settings:
  bootstrap-servers: ${DRISHTI_KAFKA_BOOTSTRAP:localhost:9092}
  topics: [drishti.trading.trades]
  kind: trade
  id-field: TRADE_ID
writes:
  amend-trade:
    kind: trade
    kafka:
      topic: drishti.trading.trades
      shape: document
      version-field: TRADE_VERSION
      changed-by: UPDATED_BY
      changed-at: SOURCE_UPDATE_TIME
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
