# Example: the news connector, a connector that is code rather than a store. It computes headlines for a named entity when asked,
# from Google News RSS (no API key). DISABLED as shipped: the entity names you ask about leave your network to Google when it is on.
# Ids are NEWS-<name with underscores>, for example NEWS-Federal_Reserve; NEWS-Toyota@ja-JP picks another edition; ~all turns the relevance filter off.
plugin: news
enabled: false
kinds: [news]
settings:
  base-url: https://news.google.com/rss/search
  language: en
  country: US
  max-items: 15
  timeout-seconds: 10
  cache-ttl-seconds: 600
  cache-max-entities: 200
  relevance: title                       # keep headlines whose title names the entity or an alias; off keeps everything
  deny-sources: Example Spam Site        # publishers never shown
  aliases.Federal_Reserve: Fed, FOMC     # other names that also count as naming the entity
  retries: 2
