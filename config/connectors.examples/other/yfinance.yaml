# Example: the yfinance connector, a connector that is code rather than a store. It computes a quote and recent price history for a ticker
# when asked, from Yahoo Finance's public chart endpoint (no API key). DISABLED as shipped. The endpoint is unofficial and Yahoo's terms
# restrict its use: samples and internal demonstrations only, not production or redistribution. Ids are QUOTE-<TICKER>, for example QUOTE-AAPL.
plugin: yfinance
enabled: false
kinds: [quote]
settings:
  base-url: https://query1.finance.yahoo.com/v8/finance/chart
  range: 6mo
  interval: 1d
  timeout-seconds: 10
  cache-ttl-seconds: 60
  cache-max-symbols: 100
  retries: 2
