# Example: a Kafka topic of trades over TLS with a client certificate (mutual TLS), PKCS12 stores. Copy to
# config/connectors/trading-stream.yaml and name it in a pack (connectors: [trading-stream]; routes: {trade: trading-stream}).
# Passwords are environment references. The PEM form is in kafka-mtls-pem.yaml. See docs/connectors/TLS.md.
plugin: kafka
kinds: [trade]
description: Live trades from the trading Kafka cluster
settings:
  bootstrap-servers: kafka-1.example.com:9093,kafka-2.example.com:9093
  topics: [trades]
  kind: trade
  id-field: tradeId
  security.protocol: SSL
  tls:
    truststore: /etc/drishti/tls/ca.p12
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD}
    keystore: /etc/drishti/tls/client.p12
    keystore-password: ${KAFKA_KEYSTORE_PASSWORD}
