# Example: MongoDB over TLS. The connection string carries no credentials; they come from the environment.
plugin: mongodb
kinds: [position]
settings:
  uri: mongodb://mongo.example.com:27017/?tls=true
  database: drishti
  collection: positions
  tls:
    truststore:
      path: /etc/drishti/tls/ca.p12
      password: ${MONGO_TRUSTSTORE_PASSWORD}
