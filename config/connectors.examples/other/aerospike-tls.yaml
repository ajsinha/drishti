# Example: Aerospike Enterprise over mutual TLS with certificate (PKI) log-in. tls-name is the name the server certificate carries
# (the server's tls-name). Copy to config/connectors/aerospike-tls.yaml. See docs/connectors/AEROSPIKE_CONNECTOR.md, section Security.
plugin: aerospike
kinds: [trade]
description: Trades in Aerospike over mutual TLS
settings:
  hosts: as-1.example.com:4333,as-2.example.com:4333
  namespace: drishti
  tls-name: aerospike.example.com
  auth-mode: pki
  tls:
    enabled: true
    ca-file: /etc/drishti/tls/ca.pem
    cert-file: /etc/drishti/tls/client.pem
    key-file: /etc/drishti/tls/client.key
