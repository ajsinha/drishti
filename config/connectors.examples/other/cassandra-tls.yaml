# Example: Apache Cassandra over mutual TLS (client_encryption_options with require_client_auth: true) and a password log-in.
# The node certificates must name the addresses the driver connects to (the contact points and the nodes' rpc addresses).
# Copy to config/connectors/cassandra-tls.yaml. See docs/connectors/CASSANDRA_CONNECTOR.md, section Security.
plugin: cassandra
kinds: [trade]
description: Trades in Cassandra over mutual TLS
settings:
  domain: trading
  contact-points: cass-1.example.com:9142,cass-2.example.com:9142,cass-3.example.com:9142
  local-datacenter: dc-east
  username: drishti_reader
  password: ${DRISHTI_CASSANDRA_PASSWORD}
  layout.trade.columns: TRADE_ID,SOURCE_SYSTEM,PRODUCT_TYPE,PORTFOLIO,COUNTERPARTY,CURRENCY,QUANTITY
  tls:
    enabled: true
    ca-file: /etc/drishti/tls/ca.pem
    cert-file: /etc/drishti/tls/client.pem
    key-file: /etc/drishti/tls/client.key
