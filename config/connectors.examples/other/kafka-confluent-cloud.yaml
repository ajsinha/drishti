# Example: Confluent Cloud. The flavour gives SASL_SSL with PLAIN; Confluent's brokers use public CAs, so no tls.* is needed.
# The API key and secret, and the Schema Registry key and secret, are environment references. Copy to
# config/connectors/kafka-confluent-cloud.yaml. See docs/connectors/KAFKA_CONNECTOR.md.
plugin: kafka
kinds: [trade]
description: Trades from Confluent Cloud, Avro through Schema Registry
settings:
  flavour: confluent
  bootstrap-servers: pkc-xxxxx.us-east-1.aws.confluent.cloud:9092
  api-key: ${CONFLUENT_API_KEY}
  api-secret: ${CONFLUENT_API_SECRET}
  topics: [trades]
  kind: trade
  id-field: tradeId
  schema-registry.url: https://psrc-xxxxx.us-east-1.aws.confluent.cloud
  schema-registry.basic-auth: ${CONFLUENT_SR_KEY}:${CONFLUENT_SR_SECRET}
