# Example: PostgreSQL over verified TLS with a private CA, logging in by password. The driver is configured through the shared
# tls.* settings (sslmode becomes verify-full, so the server name is checked). Copy to config/connectors/postgres-tls.yaml.
# See docs/connectors/POSTGRES_CONNECTOR.md, section Security.
plugin: jdbc
kinds: [trade]
description: Trades in PostgreSQL, verified TLS
settings:
  url: jdbc:postgresql://db.example.com:5432/drishti
  user: drishti
  password: ${DRISHTI_DB_PASSWORD}
  table: entities
  tls:
    enabled: true
    ca-file: /etc/drishti/tls/ca.pem
