# Example: ActiveMQ destinations with a user and a password taken from the environment.
plugin: activemq
kinds: [event]
settings:
  broker-url: ssl://activemq.example.com:61617
  destinations: [events]
  user: ${ACTIVEMQ_USER}
  password: ${ACTIVEMQ_PASSWORD}
  tls:
    enabled: true
    truststore:
      path: /etc/drishti/tls/ca.p12
      password: ${ACTIVEMQ_TRUSTSTORE_PASSWORD}
