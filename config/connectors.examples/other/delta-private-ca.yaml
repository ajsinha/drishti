# Example: a Delta Lake on S3-compatible storage behind a certificate from a private CA. tls.* is read by the native engine (the
# default). Copy to config/connectors/delta-private-ca.yaml. See docs/connectors/DELTA_CONNECTOR.md, section Security.
# The lake (delta, its root or catalog, storage and tables) is config/lakes.examples/other/customer-lake-tls.yaml: copy it to
# config/lakes/customer-lake-tls.yaml beside this file (docs/guides/LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: delta
kinds:
- customer
description: Customer tables in the data lake over TLS
settings:
  lake: customer-lake-tls
  lake-tables: customer.customer
  tls.ca-file: /etc/drishti/tls/ca.pem
