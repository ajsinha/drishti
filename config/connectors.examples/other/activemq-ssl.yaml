# Example: ActiveMQ Classic over an ssl:// transport, trusting a private CA, with a user name and password from the
# environment. Copy to config/connectors/activemq-ssl.yaml. See docs/connectors/ACTIVEMQ_CONNECTOR.md.
plugin: activemq
kinds: [order]
description: Orders from ActiveMQ over SSL
settings:
  broker-url: failover:(ssl://activemq.example.com:61617)?initialReconnectDelay=1000
  destinations: [queue:orders]
  user: drishti
  password: ${ACTIVEMQ_PASSWORD}
  tls:
    ca-file: /etc/drishti/tls/ca.pem
