# Example: copy to config/connectors/vendor-prices.yaml to serve tables a data provider shares through the open Delta Sharing protocol
# (docs/connectors/LAKEHOUSE_CONNECTORS.md). The provider's profile file holds the endpoint; its bearerToken must be an environment
# reference ("bearerToken": "${VENDOR_SHARING_TOKEN}"), never the token itself. No storage keys.
plugin: delta-sharing
kinds:
- price
description: end-of-day prices a market-data vendor shares
settings:
  profile: ${VENDOR_SHARING_PROFILE:/etc/drishti/shares/vendor.share}
  tables:
    price:
      table: market_data.eod.prices             # share.schema.table
      id: [ISIN, CURRENCY]
      date: PRICE_DATE
  hints.market_data.eod.prices: PRICE_DATE >= 2026-01-01
