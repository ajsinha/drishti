# Example: Kafka over mutual TLS with PEM files (a private CA, cert-manager or Vault). The key may be encrypted: its password is
# an environment reference or a file. Copy to config/connectors/kafka-mtls-pem.yaml. See docs/connectors/KAFKA_CONNECTOR.md.
plugin: kafka
kinds: [trade]
description: Trades over mutual TLS, PEM certificates
settings:
  bootstrap-servers: kafka-1.example.com:9093,kafka-2.example.com:9093
  topics: [trades]
  kind: trade
  id-field: tradeId
  security.protocol: SSL
  tls:
    ca-file: /etc/drishti/tls/ca-bundle.pem
    cert-file: /etc/drishti/tls/client.pem
    key-file: /etc/drishti/tls/client.key
    key-password-file: /run/secrets/kafka-client-key-password
