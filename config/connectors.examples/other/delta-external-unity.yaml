# Example: copy to config/connectors/trade-unity.yaml to serve plain Delta tables named in Unity Catalog (catalog.schema.table): Drishti
# asks Unity where each table is and for its temporary credentials (credential vending), then reads it in place
# (docs/connectors/LAKEHOUSE_CONNECTORS.md, docs/guides/DATA_LAKE_GUIDE.md section 10). The service principal needs USE CATALOG,
# USE SCHEMA, SELECT and EXTERNAL USE SCHEMA; the metastore must allow external data access. Secrets as ${ENV_VAR} references.
plugin: delta-external
kinds:
- trade
description: Unity Catalog tables main.risk.*, read with vended credentials
settings:
  unity.host: ${UC_HOST:https://adb-1234567890.12.azuredatabricks.net}
  unity.client-id: ${UC_CLIENT_ID:}
  unity.client-secret: ${UC_CLIENT_SECRET:}
  unity.catalog: main
  unity.schema: risk
  s3.region: ${UC_TABLES_REGION:eu-west-2}
  tables:
    trade:
      table: trades                             # main.risk.trades
      id: TRADE_ID
