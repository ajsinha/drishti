# Example: a Delta Lake on S3-compatible storage. The access keys are environment references (or file: references).
plugin: delta
kinds: [customer]
description: Customer tables in the data lake
settings:
  root: s3://lake-prod/delta
  domain: customer
  s3:
    endpoint: https://s3.example.com
    region: eu-west-1
    access-key: ${LAKE_ACCESS_KEY}
    secret-key: file:/run/secrets/lake-secret-key
