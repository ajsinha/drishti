# Example: Redis over TLS with a client certificate (the server runs with tls-auth-clients yes). A rediss:// address turns TLS on.
# Copy to config/connectors/redis-tls.yaml. See docs/connectors/REDIS_CONNECTOR.md, section Security.
plugin: redis
kinds: [trade]
description: Trades in Redis over mutual TLS
settings:
  domain: trading
  uri: rediss://redis.example.com:6380
  user: drishti
  password: ${DRISHTI_REDIS_PASSWORD}
  tls:
    ca-file: /etc/drishti/tls/ca.pem
    cert-file: /etc/drishti/tls/client.pem
    key-file: /etc/drishti/tls/client.key
