# Example: MongoDB over TLS where the client certificate is the log-in (MONGODB-X509). The certificate's subject must exist as a
# user in the $external database. No user name or password. Copy to config/connectors/mongodb-x509.yaml.
# See docs/connectors/MONGODB_CONNECTOR.md, section Security.
plugin: mongodb
kinds: [position]
description: Positions in MongoDB, certificate log-in
settings:
  uri: mongodb://mongo-1.example.com:27017,mongo-2.example.com:27017/?replicaSet=rs0
  database: drishti
  collection: positions
  auth-mechanism: x509
  tls:
    enabled: true
    ca-file: /etc/drishti/tls/ca.pem
    cert-file: /etc/drishti/tls/client.pem
    key-file: /etc/drishti/tls/client.key
