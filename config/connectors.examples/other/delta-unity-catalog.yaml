# Example: copy to config/connectors/trade-endur-unity.yaml to read a Drishti-shaped Delta table (id, doc, business_date, promoted
# columns: DELTA_CONNECTOR.md section 5) that Databricks writes and Unity Catalog names, with Unity's vended credentials
# (docs/connectors/DELTA_CONNECTOR.md, Unity Catalog). Secrets as ${ENV_VAR} references.
plugin: delta
kinds:
- trade
description: the Endur trades table main.trading.trade_endur in Unity Catalog
settings:
  unity.host: ${UC_HOST:https://adb-1234567890.12.azuredatabricks.net}
  unity.token: ${UC_TOKEN:}
  s3.region: ${UC_TABLES_REGION:eu-west-2}
  table.trade: main.trading.trade_endur
  layout.trade.columns: TRADE_ID,SOURCE_SYSTEM,PRODUCT_TYPE,DESK,BOOK,COUNTERPARTY_ID
