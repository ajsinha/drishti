# Example: DataStax Astra through its secure connect bundle (it carries the addresses, the data centre and the TLS material)
# and an application token. Copy to config/connectors/cassandra-astra.yaml. See docs/connectors/CASSANDRA_CONNECTOR.md.
plugin: cassandra
kinds: [trade]
description: Trades in DataStax Astra
settings:
  domain: trading
  keyspace: drishti_trading
  secure-connect-bundle: /etc/drishti/astra/secure-connect-drishti.zip
  token: ${DRISHTI_ASTRA_TOKEN}
