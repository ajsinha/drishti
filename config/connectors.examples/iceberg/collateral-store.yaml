# Example: copy to config/connectors/collateral-store.yaml to read the collateral-store data from iceberg. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: iceberg
kinds:
- collateral-balance
- margin-call
- simm
description: collateral-store read from iceberg (the former application-iceberg.yaml profile)
settings:
  root: ${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}
  domain: collateral
  catalog: ${DRISHTI_ICEBERG_CATALOG:hadoop}
  uri: ${DRISHTI_ICEBERG_URI:}
  warehouse: ${DRISHTI_ICEBERG_WAREHOUSE:}
  credential: ${DRISHTI_ICEBERG_CREDENTIAL}
