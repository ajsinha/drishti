# Example: copy to config/connectors/risk-store.yaml to read the risk-store data from iceberg. It replaces the
# Example: copy to config/connectors/risk-store.yaml to read the risk domain from Iceberg instead of Delta (Delta is the default;
# Iceberg only by configuration). It replaces the market-risk pack's risk-store connector (settings are not merged), with the same
# kinds and layouts: the P&L and scenario-PV vectors are list<double> columns (layout.<kind>.vectors), as `lake build --format iceberg`
# and `build_demo_lakes.py --store risk=iceberg` write them. Credentials are ${ENV_VAR} references.
# The lake (iceberg, its root or catalog, storage and tables) is config/lakes.examples/iceberg/iceberg.yaml: copy it to
# config/lakes/iceberg.yaml beside this file (docs/guides/DATA_LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: iceberg
description: risk-store read from Iceberg (the market-risk pack's risk domain; Delta stays the default)
settings:
  lake: iceberg
  lake-tables: risk.stress-scenario,risk.stress-result,risk.frtb-sensitivity,risk.pnl-explain,risk.trade-valuation,risk.pnl-vector,risk.scenario-pv,risk.fx-scenario,risk.scenario-set,risk.var-limit,risk.pnl-history
