# Example: copy to config/connectors/trading-store.yaml to read the trading-store data from iceberg. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: iceberg
kinds:
- trade
description: trading-store read from iceberg (the former application-iceberg.yaml profile)
settings:
  root: ${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}
  domain: trading
  layout.trade.columns: tradeId,productType,productName,direction,currency,notional,mtm,pnl1d,maturityDate,tradeDate,book,desk,status,assetClass,counterparty.id,counterparty.name,nettingSet,risk.dv01,sourceSystem
  layout.trade.sort-by: id
  layout.trade.file-rows: 250000
  layout.trade.row-group-rows: 1000
  catalog: ${DRISHTI_ICEBERG_CATALOG:hadoop}
  uri: ${DRISHTI_ICEBERG_URI:}
  warehouse: ${DRISHTI_ICEBERG_WAREHOUSE:}
  credential: ${DRISHTI_ICEBERG_CREDENTIAL}
