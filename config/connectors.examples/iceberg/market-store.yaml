# Example: copy to config/connectors/market-store.yaml to read the market-store data from iceberg. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: iceberg
kinds:
- ir-curve
- repo-curve
- fx-spot
- fx-forward-curve
- fx-vol-surface
- ir-vol-cube
- cap-vol-surface
- equity
- equity-index
- dividend-curve
- equity-vol-surface
- credit-curve
- inflation-index
- inflation-curve
- commodity
- commodity-curve
- commodity-vol-surface
- rate-fixing
- bond
- correlation-matrix
description: market-store read from iceberg (the former application-iceberg.yaml profile)
settings:
  root: ${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}
  domain: market
  catalog: ${DRISHTI_ICEBERG_CATALOG:hadoop}
  uri: ${DRISHTI_ICEBERG_URI:}
  warehouse: ${DRISHTI_ICEBERG_WAREHOUSE:}
  credential: ${DRISHTI_ICEBERG_CREDENTIAL}
