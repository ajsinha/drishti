# Example: copy to config/connectors/trade-endur.yaml to read the trades from iceberg. The trading pack routes kind trade to
# trade-endur, so this file replaces that Delta connector (settings are not merged); the loader puts every source system's trades
# in one table, so trade-calypso and trade-murex may be disabled. Credentials are ${ENV_VAR} references; an empty default
# (${X:}) is a store with no sign-in, as a development node.
plugin: iceberg
kinds:
- trade
description: trades read from Iceberg (loaded by tools/load-iceberg.sh)
settings:
  root: ${DRISHTI_ICEBERG_ROOT:${drishti.data.dir:./data}/iceberg}
  domain: trading
  layout.trade.columns: TRADE_ID,SOURCE_SYSTEM,PRODUCT_TYPE,PRODUCT_SUB_TYPE,PRODUCT_GROUP,TRADE_STATUS,TRADE_VERSION,BUY_SELL_CODE,CURRENCY,QUANTITY,TRADE_DATE,MATURITY_DATE,COUNTERPARTY,LEGAL_ENTITY,PORTFOLIO,TRADER_ID
  layout.trade.sort-by: id
  layout.trade.file-rows: 250000
  layout.trade.row-group-rows: 1000
  catalog: ${DRISHTI_ICEBERG_CATALOG:hadoop}
  uri: ${DRISHTI_ICEBERG_URI:}
  warehouse: ${DRISHTI_ICEBERG_WAREHOUSE:}
  credential: ${DRISHTI_ICEBERG_CREDENTIAL:}
