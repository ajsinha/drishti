# Example: copy to config/connectors/reference-store.yaml to read the reference-store data from iceberg. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
# The lake (iceberg, its root or catalog, storage and tables) is config/lakes.examples/iceberg/iceberg.yaml: copy it to
# config/lakes/iceberg.yaml beside this file (docs/guides/LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: iceberg
kinds:
- counterparty
- counterparty-group
- issuer
- agreement
- ccp
- legal-entity
- book
- desk
- trader
- calendar
- csa
- clearing-account
description: reference-store read from iceberg (the former application-iceberg.yaml profile)
settings:
  lake: iceberg
  lake-tables: reference.counterparty,reference.counterparty-group,reference.issuer,reference.agreement,reference.ccp,reference.legal-entity,reference.book,reference.desk,reference.trader,reference.calendar,reference.csa,reference.clearing-account
  mode.counterparty: effective
  mode.counterparty-group: effective
  mode.issuer: effective
  mode.agreement: effective
  mode.ccp: effective
  mode.legal-entity: effective
  mode.book: effective
  mode.desk: effective
  mode.trader: effective
  mode.calendar: effective
  mode.csa: effective
  mode.clearing-account: effective
