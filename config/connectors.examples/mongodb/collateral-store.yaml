# Example: copy to config/connectors/collateral-store.yaml to read the collateral-store data from mongodb. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: mongodb
kinds:
- collateral-balance
- margin-call
- simm
description: collateral-store read from mongodb (the former application-mongodb.yaml profile)
settings:
  domain: collateral
  uri: ${DRISHTI_MONGODB_URI:mongodb://localhost:27017}
  database: ${DRISHTI_MONGODB_DATABASE:drishti}
