# Example: copy to config/connectors/<name>.yaml to read this domain from Delta Lake tables in AWS S3 (s3://<bucket>/<prefix>/
# <domain>/<table>) instead of the local lake. It replaces the pack's connector of the same name (settings are not merged). Set
# DRISHTI_DELTA_S3_BUCKET and DRISHTI_DELTA_S3_PREFIX (deploy/aws/delta-s3/delta-s3.sh create makes them) and AWS_REGION. No key is
# written here: credentials come from the AWS default chain (the ECS task role, a profile, AWS_ACCESS_KEY_ID); an S3-compatible
# store adds s3.endpoint and keys as ${ENV} references (other/customer-lake.yaml). Guide: DELTA_CONNECTOR.md section 17.
# The trading pack routes kind trade to trade-endur, trade-calypso and trade-murex as a union: this file replaces the first.
# The lake (delta, its root or catalog, storage and tables) is config/lakes.examples/delta-s3/s3.yaml: copy it to
# config/lakes/s3.yaml beside this file (docs/guides/LAKE_GUIDE.md). This file keeps only what the connector reads.
plugin: delta
kinds:
- trade
description: trades (Endur) read from Delta Lake on AWS S3
settings:
  lake: s3
  lake-tables: trading.trade_endur
  engine: native
  source-name: trade-endur
