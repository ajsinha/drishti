# Example: copy to config/connectors/risk-store.yaml to read the risk-store data from postgres. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: jdbc
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
description: risk-store read from postgres (the former application-postgres.yaml profile)
settings:
  domain: risk
  url: ${DRISHTI_PG_URL:jdbc:postgresql://localhost:5432/drishti}
  user: ${DRISHTI_PG_USER:drishti}
  password: ${DRISHTI_PG_PASSWORD}
  table: risk.entities
  pool-size: '4'
