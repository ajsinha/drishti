# Example: copy to config/connectors/risk-store.yaml to read the risk-store data from duckdb. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: duckdb
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
description: risk-store read from duckdb (the former application-duckdb.yaml profile)
settings:
  domain: risk
  path: ${DRISHTI_DUCKDB_PATH:${drishti.data.dir:./data}/duckdb/drishti.duckdb}
  memory-limit: ${DRISHTI_DUCKDB_MEMORY:1GB}
  table: risk.entities
  pool-size: '4'
