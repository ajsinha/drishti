# Example: copy to config/connectors/market-store.yaml to read the market-store data from duckdb. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: duckdb
kinds:
- ir-curve
- repo-curve
- fx-spot
- fx-forward-curve
- fx-vol-surface
- ir-vol-cube
- cap-vol-surface
- equity
- equity-index
- dividend-curve
- equity-vol-surface
- credit-curve
- inflation-index
- inflation-curve
- commodity
- commodity-curve
- commodity-vol-surface
- rate-fixing
- bond
- correlation-matrix
description: market-store read from duckdb (the former application-duckdb.yaml profile)
settings:
  domain: market
  path: ${DRISHTI_DUCKDB_PATH:data/duckdb/drishti.duckdb}
  memory-limit: ${DRISHTI_DUCKDB_MEMORY:1GB}
  table: market.entities
  pool-size: '4'
