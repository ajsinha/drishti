# Example: copy to config/connectors/credit-store.yaml to read the credit-store data from duckdb. It replaces the
# connector file of the same name (settings are not merged). Credentials are ${ENV_VAR} references.
plugin: duckdb
kinds:
- netting-set
- credit-limit
- exposure-profile
- cva
- sa-ccr
description: credit-store read from duckdb (the former application-duckdb.yaml profile)
settings:
  domain: credit
  path: ${DRISHTI_DUCKDB_PATH:data/duckdb/drishti.duckdb}
  memory-limit: ${DRISHTI_DUCKDB_MEMORY:1GB}
  table: credit.entities
  pool-size: '4'
