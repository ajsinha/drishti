# Generated by tools/packgen/retail/make.py. Edit the generator, not this file.
# About this page: what the pack's kinds mean.
about: 1
vocabulary:
  balance: { term: "Balance", means: "The amount owed on the account, or held in it for a deposit account, on the date shown.", unit: "account currency" }
  daysPastDue: { term: "Days past due", means: "The number of days the oldest unpaid amount has been overdue. It drives the delinquency stage and the provisioning.", unit: "days" }
  holderName: { term: "Account holder", means: "The customer who owns the account." }
  borrowerName: { term: "Borrower", means: "The customer who owes the loan." }
kinds:
  customer:
    title: Retail customer
    about: >-
      ${$.name} is a ${lower($.segment)} customer since ${$.since}, with ${fmt($.totalDeposits, 'compact')} on deposit and ${fmt($.totalLending, 'compact')} borrowed;
      the KYC risk rating is ${lower($.kycRisk)}.
    guide: retail-banking
    glossary:
      segment: { term: "Customer segment", means: "The group the bank serves with a common offer and pricing, chosen from income and assets.", values: { "Mass market": "Everyday banking customers with standard products.", "Mass affluent": "Customers with higher income or savings who get extra services.", "Private": "High-net-worth customers with a dedicated adviser." } }
      totalDeposits: { term: "Total deposits", means: "The sum of the customer's deposit balances across the bank.", unit: "account currency" }
      totalLending: { term: "Total lending", means: "The sum of what the customer owes on loans, mortgages and cards.", unit: "account currency" }
      kycRisk: { term: "KYC risk rating", means: "The customer's rating under know-your-customer rules, from their identity, activity and location. It sets how often they are reviewed and how closely their transactions are monitored.", values: { "Low": "Standard due diligence.", "Medium": "Periodic review.", "High": "Enhanced due diligence and closer monitoring." } }
      since: { term: "Customer since", means: "The date the customer opened their first account." }
      products.product: { term: "Product", means: "The account or loan the customer holds." }
      products.id: { term: "Account identifier", means: "The identifier of the account or loan." }
      products.balance: { term: "Balance", means: "What the product holds or owes.", unit: "account currency", sign: "Negative is owed by the customer." }
  deposit-account:
    title: Deposit account
    about: >-
      ${$.accountId} is a ${lower($.type)} of ${$.holderName} holding ${fmt($.balance, 'amount2')} ${$.currency} at ${fmt($.rate, 'pct2')} interest;
      it is ${lower($.status)}.
    guide: retail-banking
    glossary:
      type: { term: "Account type", means: "A current account is for everyday payments; a savings account pays more interest and limits use." }
      holderName: { use: "holderName" }
      balance: { use: "balance" }
      currency: { term: "Account currency", means: "The currency the balance is kept in." }
      rate: { term: "Interest rate", means: "The annual rate of interest the account pays on the balance.", unit: "% a year" }
      status: { term: "Account status", means: "Whether the account is in use or has had no activity for long enough to be classed as dormant.", values: { "Active": "In normal use.", "Dormant": "No customer-initiated activity for the dormancy period; restricted until the customer contacts the bank." } }
      transactions.date: { term: "Date", means: "The day the transaction was booked." }
      transactions.description: { term: "Description", means: "The payee or narrative of the transaction." }
      transactions.amount: { term: "Amount", means: "The size of the transaction.", unit: "account currency", sign: "Negative leaves the account." }
      transactions.balance: { term: "Balance after", means: "The account balance after the transaction.", unit: "account currency" }
  mortgage:
    title: Mortgage
    about: >-
      ${$.loanId} is a mortgage of ${$.borrowerName}: ${fmt($.balance, 'compact')} outstanding at ${fmt($.rate, 'pct2')} on a property valued at
      ${fmt($.property.valuation, 'compact')} (a loan to value of ${fmt($.ltv, 'pct0')}), with ${$.remainingYears} years left and ${$.daysPastDue} days past due.
    guide: retail-banking
    glossary:
      borrowerName: { use: "borrowerName" }
      balance: { term: "Outstanding balance", means: "The principal still to be repaid.", unit: "loan currency" }
      rate: { term: "Interest rate", means: "The annual rate currently charged on the balance.", unit: "% a year" }
      ltv: { term: "Loan to value", means: "The outstanding balance divided by the current value of the property. The higher it is, the less equity cushions a fall in house prices.", unit: "% of property value" }
      remainingYears: { term: "Remaining term", means: "The years left until the mortgage is scheduled to be repaid in full.", unit: "years" }
      daysPastDue: { use: "daysPastDue" }
      amortisation.balance: { term: "Scheduled balance", means: "The balance expected at the end of the year if every payment is made on time.", unit: "loan currency" }
      amortisation.year: { term: "Year", means: "The year of the scheduled balance." }
      payments.due: { term: "Due date", means: "The date the payment was due." }
      payments.amount: { term: "Payment", means: "The amount of the monthly payment, which covers interest and principal.", unit: "loan currency" }
      payments.paid: { term: "Paid on", means: "The date the payment was received." }
      payments.status: { term: "Payment status", means: "Whether the payment was made, is late or was missed." }
  personal-loan:
    title: Personal loan
    about: >-
      ${$.loanId} is a ${lower($.purpose)} loan to ${$.borrowerName}: ${fmt($.balance, 'amount2')} outstanding, repaid in instalments of ${fmt($.instalment, 'amount2')}
      at ${fmt($.rate, 'pct2')}, ${$.daysPastDue} days past due.
    guide: retail-banking
    glossary:
      borrowerName: { use: "borrowerName" }
      purpose: { term: "Purpose", means: "What the borrower said the loan is for. The loan is unsecured: nothing is pledged against it." }
      balance: { term: "Outstanding balance", means: "The principal still to be repaid.", unit: "loan currency" }
      instalment: { term: "Instalment", means: "The fixed amount paid each month; it covers the interest and repays part of the principal.", unit: "loan currency" }
      rate: { term: "Interest rate", means: "The annual rate charged on the outstanding balance.", unit: "% a year" }
      daysPastDue: { use: "daysPastDue" }
      schedule.due: { term: "Due date", means: "The date the instalment is due." }
      schedule.principal: { term: "Principal", means: "The part of the instalment that repays the loan.", unit: "loan currency" }
      schedule.interest: { term: "Interest", means: "The part of the instalment that is interest on the balance.", unit: "loan currency" }
      schedule.balance: { term: "Balance after", means: "The balance left after the instalment is paid.", unit: "loan currency" }
  card-account:
    title: Credit card account
    about: >-
      ${$.cardId} is a ${$.product} of ${$.holderName} with a balance of ${fmt($.balance, 'amount2')} on a limit of ${fmt($.limit, 'amount0')}, ${fmt($.utilisation, 'pct0')} used,
      at ${fmt($.apr, 'pct2')} APR; the account is ${lower($.status)}.
    guide: retail-banking
    glossary:
      holderName: { use: "holderName" }
      product: { term: "Card product", means: "The card the customer holds, which sets its fees, rewards and rate." }
      balance: { term: "Balance", means: "What the customer currently owes on the card, including interest and fees.", unit: "card currency" }
      limit: { term: "Credit limit", means: "The most the customer may owe on the card.", unit: "card currency" }
      utilisation: { term: "Utilisation", means: "The balance as a share of the limit. High utilisation signals stress and lowers credit scores.", unit: "% of limit" }
      apr: { term: "Annual percentage rate", means: "The yearly cost of borrowing on the card, including interest, as a percentage of the balance.", unit: "% a year" }
      status: { term: "Account status", means: "Whether the account is in order or has missed payments.", values: { "Active": "Payments are up to date.", "Delinquent": "At least one payment is overdue." } }
      statements.closing: { term: "Statement date", means: "The day the billing cycle closed and the statement was produced." }
      statements.balance: { term: "Statement balance", means: "The balance on the statement date.", unit: "card currency" }
      statements.minimum: { term: "Minimum payment", means: "The least the customer must pay by the due date to keep the account in good standing.", unit: "card currency" }
      statements.paid: { term: "Amount paid", means: "What the customer paid against the statement.", unit: "card currency" }
  collections-case:
    title: Collections case
    about: >-
      ${$.caseId}: ${$.customerName} is ${$.daysPastDue} days past due with ${fmt($.arrears, 'amount2')} in arrears, in the stage "${$.stage}";
      the strategy is ${lower($.strategy)} and the case is ${lower($.status)}.
    guide: retail-banking
    glossary:
      customerName: { term: "Customer", means: "The customer who is behind on payments." }
      arrears: { term: "Arrears", means: "The overdue amount, the sum of the payments that were due and not paid.", unit: "account currency" }
      daysPastDue: { use: "daysPastDue" }
      stage: { term: "Collections stage", means: "The group of the case by days past due, which decides how firmly the bank contacts the customer.", values: { "Early (30-59)": "Between 30 and 59 days past due: reminders and offers to help.", "Mid (60-89)": "Between 60 and 89 days past due: direct contact and repayment plans." } }
      strategy: { term: "Collection strategy", means: "The approach chosen for the case, such as automated reminders, calls from an agent or a payment plan." }
      status: { term: "Case status", means: "Whether the case is being worked, resolved or written off." }
      contacts.date: { term: "Contact date", means: "The day the customer was approached." }
      contacts.channel: { term: "Channel", means: "How the customer was contacted: text message, call or letter." }
      contacts.outcome: { term: "Outcome", means: "What came of the contact, such as no answer or a promise to pay." }
  branch:
    title: Branch
    about: >-
      ${$.name} in ${$.city} serves ${fmt($.customers, 'amount0')} customers with ${fmt($.deposits, 'compact')} of deposits and ${fmt($.lending, 'compact')} of lending;
      its net promoter score is ${$.nps}.
    guide: retail-banking
    glossary:
      city: { term: "City", means: "The town or city the branch is in." }
      customers: { term: "Customers", means: "The number of customers whose home branch this is." }
      deposits: { term: "Deposits", means: "The deposit balances of the branch's customers.", unit: "reporting currency" }
      lending: { term: "Lending", means: "The loans, mortgages and card balances of the branch's customers.", unit: "reporting currency" }
      nps: { term: "Net promoter score", means: "The share of customers who would recommend the bank minus the share who would not, on a scale from -100 to +100.", unit: "points (-100 to +100)" }
  retail-portfolio:
    title: Retail portfolio segment
    about: >-
      ${$.name} has ${fmt($.exposure, 'compact')} of exposure and an expected credit loss allowance of ${fmt($.ecl, 'compact')}, a coverage of ${fmt($.coverage, 'pct2')};
      ${fmt($.dpd30, 'pct2')} of it is 30 or more days past due.
    guide: retail-banking
    glossary:
      exposure: { term: "Exposure", means: "The amount outstanding on the segment's loans.", unit: "reporting currency" }
      ecl: { term: "Expected credit loss", means: "The allowance for credit losses under IFRS 9: the probability-weighted expected loss, over 12 months for stage 1 and over the lifetime of the loan for stages 2 and 3.", unit: "reporting currency" }
      coverage: { term: "Coverage", means: "The expected credit loss as a share of the exposure.", unit: "% of exposure" }
      dpd30: { term: "30+ days past due rate", means: "The share of the exposure that is at least 30 days overdue, a common early sign of deterioration.", unit: "% of exposure" }
      stages.stage: { term: "IFRS 9 stage", means: "Stage 1 holds loans whose credit risk has not increased much since origination, stage 2 those whose risk has increased significantly and stage 3 those that are credit-impaired." }
      stages.exposure: { term: "Exposure in the stage", means: "The amount outstanding on loans in the stage.", unit: "reporting currency" }
      stages.pd: { term: "Probability of default", means: "The estimated chance that a loan of the stage defaults within the horizon of the allowance.", unit: "%" }
      stages.lgd: { term: "Loss given default", means: "The share of the exposure expected to be lost if the borrower defaults, after recoveries and collateral.", unit: "% of exposure" }
      stages.ecl: { term: "Expected credit loss of the stage", means: "The stage's exposure multiplied by its probability of default and loss given default, over the horizon that applies.", unit: "reporting currency" }
      delinquency.rate: { term: "Delinquency rate", means: "The share of the exposure that was 30 or more days past due in the month.", unit: "% of exposure" }
