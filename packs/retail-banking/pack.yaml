# Generated by tools/packgen/retail/make.py. Edit the generator, not this file.
# Retail banking pack for Drishti.
pack: retail-banking
version: 1.0.0
title: Retail banking
description: Customers, deposit accounts, mortgages, cards, personal loans, branches, collections and IFRS 9 portfolio segments.
extends:
- banking-core
kinds:
- customer
- deposit-account
- mortgage
- card-account
- personal-loan
- branch
- collections-case
- retail-portfolio
sutras: sutras
mnemonics:
  CUST:
    kind: customer
    label: Customer
  ACCT:
    kind: deposit-account
    label: Deposit account
  MTG:
    kind: mortgage
    label: Mortgage
  CARD:
    kind: card-account
    label: Card account
  PLN:
    kind: personal-loan
    label: Personal loan
  BRN:
    kind: branch
    label: Branch
  COLC:
    kind: collections-case
    label: Collections case
  RPF:
    kind: retail-portfolio
    label: Retail portfolio (IFRS 9)
graph:
  id-patterns:
  - pattern: ^CUST-
    kind: customer
  - pattern: ^ACCT-
    kind: deposit-account
  - pattern: ^MTG-
    kind: mortgage
  - pattern: ^CARD-
    kind: card-account
  - pattern: ^PLN-
    kind: personal-loan
  - pattern: ^BRN-
    kind: branch
  - pattern: ^COLC-
    kind: collections-case
  - pattern: ^RPF-
    kind: retail-portfolio
  fields:
    branch:
      kind: branch
      label: Home branch
    card:
      kind: card-account
      label: Card
    customer:
      kind: customer
      label: Customer
    loan:
      kind: personal-loan
      label: Loan
  badges:
    customer: $.segment
    deposit-account: fmt($.balance, 'compact')
    mortgage: fmt($.ltv, 'pct0') + ' LTV'
    card-account: fmt($.utilisation, 'pct0') + ' used'
connectors:
  retail-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - customer
    - deposit-account
    - mortgage
    - card-account
    - personal-loan
    - branch
    - collections-case
    - retail-portfolio
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: retail
routes:
  customer: retail-store
  deposit-account: retail-store
  mortgage: retail-store
  card-account: retail-store
  personal-loan: retail-store
  branch: retail-store
  collections-case: retail-store
  retail-portfolio: retail-store
console:
  examples:
  - - CUST CUST-100231
    - Customer · products held and profile
  - - ACCT ACCT-100231-CUR
    - Current account · transactions (live)
  - - MTG MTG-100231
    - Mortgage · amortisation, property, payments
  - - CARD CARD-100238
    - Credit card · spend by category, statements
  - - BRN BRN-LDN-CITY
    - Branch · product mix and NPS
  - - RPF RPF-US-CARD
    - IFRS 9 · ECL by stage, delinquency
  help: config/help.yaml
roles:
  retail:
    kinds:
    - customer
    - deposit-account
    - mortgage
    - card-account
    - personal-loan
    - branch
    - collections-case
    - retail-portfolio
    - legal-entity
    raw: true
