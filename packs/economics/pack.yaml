# Generated by tools/packgen/economics/make.py. Edit the generator, not this file.
# Economics pack for Drishti.
pack: economics
version: 1.0.0
title: Economics
description: Economies, macro indicators and releases, central-bank decisions, forecasts, trade flows, labour markets, fiscal positions and price
  baskets.
requires: []
kinds:
- economy
- macro-indicator
- central-bank-decision
- economic-forecast
- trade-flow
- labour-market
- fiscal-position
- price-basket
sutras: sutras
mnemonics:
  ECON:
    kind: economy
    label: Economy
  MACRO:
    kind: macro-indicator
    label: Macro indicator
  CBD:
    kind: central-bank-decision
    label: Central-bank decision
  FCST:
    kind: economic-forecast
    label: Economic forecast
  TFLOW:
    kind: trade-flow
    label: Trade flow
  LABR:
    kind: labour-market
    label: Labour market
  FISC:
    kind: fiscal-position
    label: Fiscal position
  CPIB:
    kind: price-basket
    label: Consumer-price basket
graph:
  id-patterns:
  - pattern: ^ECON-
    kind: economy
  - pattern: ^MACRO-
    kind: macro-indicator
  - pattern: ^CBD-
    kind: central-bank-decision
  - pattern: ^FCST-
    kind: economic-forecast
  - pattern: ^TFLOW-
    kind: trade-flow
  - pattern: ^LABR-
    kind: labour-market
  - pattern: ^FISC-
    kind: fiscal-position
  - pattern: ^CPIB-
    kind: price-basket
  fields:
    basket:
      kind: price-basket
      label: Consumer prices
    centralBank:
      kind: central-bank-decision
      label: Last policy decision
    economy:
      kind: economy
      label: Economy
    fiscal:
      kind: fiscal-position
      label: Fiscal position
    labour:
      kind: labour-market
      label: Labour market
    outlook:
      kind: economic-forecast
      label: Forecast
    partner:
      kind: economy
      label: Partner
  badges:
    economy: fmt($.growth, 'pct2') + ' growth'
    macro-indicator: fmt($.latest, 'price2') + ' ' + $.unit
    central-bank-decision: $.decision
connectors:
  macro-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - economy
    - macro-indicator
    - central-bank-decision
    - economic-forecast
    - trade-flow
    - labour-market
    - fiscal-position
    - price-basket
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: macro
routes:
  economy: macro-store
  macro-indicator: macro-store
  central-bank-decision: macro-store
  economic-forecast: macro-store
  trade-flow: macro-store
  labour-market: macro-store
  fiscal-position: macro-store
  price-basket: macro-store
console:
  examples:
  - - ECON ECON-US
    - Economy · growth path, output by sector
  - - MACRO MACRO-EA-CPI
    - Indicator · history and release surprises
  - - CBD CBD-FED-2026-09
    - Central-bank decision · rate path and guidance
  - - FCST FCST-UK-2026Q3
    - Forecast · baseline, upside and downside
  - - TFLOW TFLOW-US-CN
    - Trade flow · balance and main exports
  - - CPIB CPIB-JP
    - Consumer prices · contributions by component
  help: config/help.yaml
roles:
  economist:
    kinds:
    - economy
    - macro-indicator
    - central-bank-decision
    - economic-forecast
    - trade-flow
    - labour-market
    - fiscal-position
    - price-basket
    raw: true
