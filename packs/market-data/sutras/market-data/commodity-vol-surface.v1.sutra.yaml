# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: commodity-vol-surface
version: 1
description: Implied vols by delivery month and moneyness.
match: { kind: commodity-vol-surface, priority: 10 }
title: { pill: Market data · Commodity volatility surface, id: $.surfaceId }
strip:
  - { label: Commodity, bind: $.commodity }
  - { label: Front ATM, bind: $.atmFront, fmt: price2, emphasis: true }
panels:
  - id: surface
    kind: surface
    title: Implied vol by contract × moneyness (%)
    code: SURF
    key: F4
    rows: $.grid
    y: month
    columns:
      - { label: "90%", bind: "@.m90", fmt: price2 }
      - { label: "100%", bind: "@.m100", fmt: price2 }
      - { label: "110%", bind: "@.m110", fmt: price2 }
  - id: grid
    kind: table
    title: Vol (%)
    key: F2
    rows: $.grid
    columns:
      - { label: Month, bind: "@.month" }
      - { label: "90%", bind: "@.m90", fmt: price2 }
      - { label: ATM, bind: "@.m100", fmt: price2 }
      - { label: "110%", bind: "@.m110", fmt: price2 }
  - id: atm
    kind: line
    title: ATM by month
    area: right
    rows: $.grid
    x: month
    y: m100
    fmt: price2
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
