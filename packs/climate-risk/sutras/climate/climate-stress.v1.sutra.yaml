    kind: hbar
    title: Loss by sector (2030)
    key: F2
    rows: $.bySector
    label: sector
    value: loss
    fmt: signed0
    tone: sign
  - id: horizon
    kind: line
    title: Loss by horizon
    area: right
    rows: $.byHorizon
    x: year
    y: loss
    fmt: compact
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.climateScenario, 'climate-scenario')", F8: impact, F9: raw }
