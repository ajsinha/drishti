# Generated by tools/packgen/climate/make.py. Edit the generator, not this file.
# Climate risk pack for Drishti.
pack: climate-risk
version: 1.0.0
title: Climate risk
description: Counterparty climate profiles, PCAF financed emissions, NGFS scenarios, climate stress, physical-risk assets and the green asset
  ratio.
requires:
- trading
kinds:
- climate-profile
- financed-emissions
- climate-scenario
- climate-stress
- physical-asset
- taxonomy-alignment
sutras: sutras
mnemonics:
  CLIM:
    kind: climate-profile
    label: Climate profile
  FE:
    kind: financed-emissions
    label: Financed emissions
  NGFS:
    kind: climate-scenario
    label: Climate scenario
  CST:
    kind: climate-stress
    label: Climate stress result
  PHY:
    kind: physical-asset
    label: Physical-risk asset
  GAR:
    kind: taxonomy-alignment
    label: Green asset ratio
graph:
  id-patterns:
  - pattern: ^CLIM-
    kind: climate-profile
  - pattern: ^FE-
    kind: financed-emissions
  - pattern: ^NGFS-
    kind: climate-scenario
  - pattern: ^CST-
    kind: climate-stress
  - pattern: ^PHY-
    kind: physical-asset
  - pattern: ^GAR-
    kind: taxonomy-alignment
  fields:
    climateScenario:
      kind: climate-scenario
      label: Scenario
  badges:
    climate-profile: '''transition '' + $.transitionScore'
connectors:
  climate-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - climate-profile
    - financed-emissions
    - climate-scenario
    - climate-stress
    - physical-asset
    - taxonomy-alignment
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: climate
routes:
  climate-profile: climate-store
  financed-emissions: climate-store
  climate-scenario: climate-store
  climate-stress: climate-store
  physical-asset: climate-store
  taxonomy-alignment: climate-store
console:
  examples:
  - - CLIM CLIM-SOLARIS
    - Climate profile · emissions by scope, transition and physical risk
  - - FE FE-RATES-1
    - Financed emissions of a book
  - - NGFS NGFS-DELAYED
    - NGFS scenario · carbon price path, sector shocks
  - - CST CST-DELAYED-COMM
    - Climate stress on the commodities desk
  - - PHY PHY-002
    - Physical risk · hazards at a refinery
  - - GAR GAR-FRA
    - EU taxonomy green asset ratio
  help: config/help.yaml
roles:
  climate-analyst:
    kinds:
    - climate-profile
    - financed-emissions
    - climate-scenario
    - climate-stress
    - physical-asset
    - taxonomy-alignment
    - counterparty
    - book
    - desk
    - legal-entity
    raw: true
