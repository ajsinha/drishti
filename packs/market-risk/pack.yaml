# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Market risk pack for Drishti.
pack: market-risk
version: 1.0.0
title: Market risk
description: Value at risk, stress testing, FRTB sensitivities and P&L explain.
requires:
- trading
kinds:
- var
- stress-scenario
- stress-result
- frtb-sensitivity
- pnl-explain
sutras: sutras
formats: config/formats.yaml
mnemonics:
  VAR:
    kind: var
    label: VaR / expected shortfall
  SCN:
    kind: stress-scenario
    label: Stress scenario
  STR:
    kind: stress-result
    label: Stress result
  FRTB:
    kind: frtb-sensitivity
    label: FRTB sensitivities
  PNL:
    kind: pnl-explain
    label: P&L explain
graph:
  id-patterns:
  - pattern: ^VAR-
    kind: var
  - pattern: ^SCN-
    kind: stress-scenario
  - pattern: ^STR-
    kind: stress-result
  - pattern: ^FRTB-
    kind: frtb-sensitivity
  - pattern: ^PNL-
    kind: pnl-explain
  fields:
    scenario:
      kind: stress-scenario
      label: Scenario
    varResult:
      kind: var
      label: VaR
  badges:
    var: fmt($.var99, 'compact')
connectors:
  risk-lake:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - var
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: risk
routes:
  var: risk-lake
  stress-scenario: risk-lake
  stress-result: risk-lake
  frtb-sensitivity: risk-lake
  pnl-explain: risk-lake
console:
  examples:
  - - VAR VAR-RATES
    - Rates desk VaR · P&L series, contributions
  - - STR STR-GFC2008-RATES
    - Stress · 2008 crisis on the rates desk
  - - PNL PNL-RATES-1
    - P&L explain
  - - FRTB FRTB-RATES-1
    - FRTB sensitivities and charges
  help: config/help.yaml
roles:
  market-risk:
    kinds:
    - '*'
    raw: true
