# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: covered-bond
version: 1
description: Bank bond backed by a cover pool of mortgages.
match: { kind: trade, where: "$.productType == 'COVERED_BOND'", priority: 10 }
title: { pill: Fixed income · Covered bond, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: DV01 (USD), bind: $.risk.dv01, fmt: signed0, tone: sign }
  - { label: CS01 (USD), bind: $.risk.cs01, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Coupon, bind: $.terms.coupon, fmt: pct4 }
      - { label: Coupon frequency, bind: $.terms.couponFrequency }
      - { label: Face amount, bind: $.terms.faceAmount, fmt: amount0 }
      - { label: Clean price, bind: $.terms.cleanPrice, fmt: price2 }
      - { label: Yield, bind: $.terms.yield, fmt: pct4 }
      - { label: Cover pool, bind: $.terms.coverPool }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: schedule
    kind: ladder
    title: Coupons
    code: CPN
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Coupon, bind: "@.rate", fmt: pct4 }
      - { label: Amount, bind: "@.amount", fmt: amount0, total: true }
      - { label: Status, bind: "@.status", tone: status }
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Interest rate curve: Zero rates (%)"
    code: CRV
    key: F4
    area: right
    source: "link($.benchmarkCurve, 'ir-curve')"
    rows: points
    x: tenor
    y: zeroRate
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: DV01 by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: dv01
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
