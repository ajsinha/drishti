# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: tarn-rates
version: 1
description: Terminates once cumulative coupons reach a target.
match: { kind: trade, where: "$.productType == 'TARN_RATES'", priority: 10 }
title: { pill: Rates · Target redemption note (rates), id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: DV01 (USD), bind: $.risk.dv01, fmt: signed0, tone: sign }
  - { label: Vega (USD), bind: $.risk.vega, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Target coupon, bind: $.terms.target, fmt: pct2 }
      - { label: Coupon, bind: $.terms.couponFormula }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: legs
    kind: tabs
    title: Legs
    each: $.legs
    layout: columns
    tabTitle: "'Leg ' + @.leg + ' · ' + @.label"
    body:
      kind: kv
      columns:
        - { label: Pay/receive, bind: "@.payReceive" }
        - { label: Rate type, bind: "@.rateType" }
        - { label: Index, bind: "@.index" }
        - { label: Rate, bind: "@.rate", fmt: pct4 }
        - { label: Spread, bind: "@.spread", fmt: bp1 }
        - { label: Frequency, bind: "@.frequency" }
        - { label: Day count, bind: "@.dayCount" }
        - { label: Currency, bind: "@.currency" }
        - { label: Notional, bind: "@.notional", fmt: amount0 }
  - id: schedule
    kind: ladder
    title: Observations
    code: OBS
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Level, bind: "@.level", fmt: price2 }
      - { label: Trigger, bind: "@.trigger", fmt: price2 }
      - { label: Performance, bind: "@.performance", fmt: pct2, tone: sign }
      - { label: Outcome, bind: "@.outcome", tone: status }
  - id: explain
    kind: waterfall
    title: "P&L explain (USD, opening to closing MTM)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Interest rate curve: Zero rates (%)"
    code: CRV
    key: F4
    area: right
    source: "link($.discountCurve, 'ir-curve')"
    rows: points
    x: tenor
    y: zeroRate
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: DV01 by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: dv01
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
