# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: fx-double-barrier
version: 1
description: Knocked out if either of two barriers trades.
match: { kind: trade, where: "$.productType == 'FX_DOUBLE_BARRIER'", priority: 10 }
title: { pill: FX · FX double-barrier option, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: FX delta (USD), bind: $.risk.fxDelta, fmt: signed0, tone: sign }
  - { label: Vega (USD), bind: $.risk.vega, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Option type, bind: $.terms.optionType }
      - { label: Exercise, bind: $.terms.exerciseStyle }
      - { label: Expiry, bind: $.terms.expiryDate, fmt: date }
      - { label: Premium, bind: $.terms.premium, fmt: amount0 }
      - { label: Strike, bind: $.terms.strike, fmt: rate5 }
      - { label: Lower barrier, bind: $.terms.lowerBarrier, fmt: rate5 }
      - { label: Upper barrier, bind: $.terms.upperBarrier, fmt: rate5 }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: schedule
    kind: ladder
    title: Observations
    code: OBS
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Level, bind: "@.level", fmt: price2 }
      - { label: Trigger, bind: "@.trigger", fmt: price2 }
      - { label: Performance, bind: "@.performance", fmt: pct2, tone: sign }
      - { label: Outcome, bind: "@.outcome", tone: status }
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "FX spot rate: Last 30 days"
    code: FX
    key: F4
    area: right
    source: "link($.fxSpot, 'fx-spot')"
    rows: history
    x: date
    y: mid
    fmt: rate5
  - id: sensitivities
    kind: hbar
    title: FX delta by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: fxDelta
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
