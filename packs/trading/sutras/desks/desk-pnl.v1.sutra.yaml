# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: desk-pnl
version: 1
description: "A desk’s P&L derived from its trades: totals, and every trade with a Pivot tab (MTM by book and currency)."
match: { kind: desk-pnl, priority: 10 }
title: { pill: Desk P&L, id: $.desk }
strip:
  - { label: Trades, bind: $.tradeCount }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: "P&L 1D (USD)", bind: $.pnl1d, fmt: signed0, tone: sign }
  - { label: DV01 (USD), bind: $.dv01, fmt: signed0, tone: sign }
  - { label: Worst trade MTM, bind: $.worstMtm, fmt: signed0, tone: sign }
  - { label: Books, bind: size($.books) }
  - { label: Currencies, bind: size($.currencies) }
panels:
  - id: trades
    kind: table
    title: Trades on the desk
    code: TRD
    key: F2
    rows: $.rows
    pivot:
      rows: [book]
      columns: [currency]
      values: [{ field: mtm, agg: sum }]
      filters: [product]
      heat: true
    columns:
      - { label: Trade, bind: "@.trade" }
      - { label: Product, bind: "@.product" }
      - { label: Book, bind: "@.book" }
      - { label: Currency, bind: "@.currency" }
      - { label: MTM (USD), bind: "@.mtm", fmt: signed0, tone: sign, total: true }
      - { label: "P&L 1D (USD)", bind: "@.pnl1d", fmt: signed0, tone: sign, total: true }
  - { id: built, kind: provenance, title: How this view was built }
keys: { F7: "link($.desk, 'desk')", F9: raw }
