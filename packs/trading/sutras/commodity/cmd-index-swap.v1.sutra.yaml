# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: cmd-index-swap
version: 1
description: "Total return on a commodity index (BCOM, S&P GSCI)."
match: { kind: trade, where: "$.productType == 'CMD_INDEX_SWAP'", priority: 10 }
title: { pill: Commodity · Commodity index swap, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Delta (USD), bind: $.risk.delta, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
  - { label: Book, bind: "link($.book, 'book')" }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Index, bind: $.terms.index }
      - { label: Fee, bind: $.terms.fundingSpread, fmt: bp1 }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: legs
    kind: tabs
    title: Legs
    each: $.legs
    layout: columns
    tabTitle: "'Leg ' + @.leg + ' · ' + @.label"
    body:
      kind: kv
      columns:
        - { label: Pay/receive, bind: "@.payReceive" }
        - { label: Rate type, bind: "@.rateType" }
        - { label: Index, bind: "@.index" }
        - { label: Rate, bind: "@.rate", fmt: pct4 }
        - { label: Spread, bind: "@.spread", fmt: bp1 }
        - { label: Frequency, bind: "@.frequency" }
        - { label: Day count, bind: "@.dayCount" }
        - { label: Currency, bind: "@.currency" }
        - { label: Notional, bind: "@.notional", fmt: amount0 }
  - id: schedule
    kind: ladder
    title: Cashflows
    code: CF
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    columns:
      - { label: Pay date, bind: "@.payDate", fmt: date }
      - { label: Leg, bind: "@.leg" }
      - { label: Type, bind: "@.type" }
      - { label: Rate, bind: "@.rate", fmt: pct4 }
      - { label: Amount, bind: "@.amount", fmt: signed0, tone: sign }
      - { label: PV, bind: "@.pv", fmt: signed0, tone: sign, total: true }
  - id: explain
    kind: waterfall
    title: "P&L explain, opening to closing MTM (USD)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Commodity forward curve: Forward curve"
    code: CMDC
    key: F4
    area: right
    source: "link($.commodityCurve, 'commodity-curve')"
    rows: points
    x: month
    y: price
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: Delta by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: delta
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
