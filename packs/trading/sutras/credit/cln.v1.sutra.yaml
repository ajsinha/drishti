# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: cln
version: 1
description: Note whose principal is reduced by a credit event on a reference entity.
match: { kind: trade, where: "$.productType == 'CLN'", priority: 10 }
title: { pill: Credit · Credit-linked note, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: CS01 (USD), bind: $.risk.cs01, fmt: signed0, tone: sign }
  - { label: Jump to default (USD), bind: $.risk.jtd, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Coupon, bind: $.terms.coupon, fmt: pct4 }
      - { label: Issue price, bind: $.terms.issuePrice, fmt: price2 }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: schedule
    kind: ladder
    title: Coupons
    code: CPN
    key: F3
    rows: $.schedule
    highlight: "#index == $.nextIndex"
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Coupon, bind: "@.rate", fmt: pct4 }
      - { label: Amount, bind: "@.amount", fmt: amount0, total: true }
      - { label: Status, bind: "@.status", tone: status }
  - id: explain
    kind: waterfall
    title: "P&L explain, opening to closing MTM (USD)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Credit curve: Par spreads (bp)"
    code: CDS
    key: F4
    area: right
    source: "link($.creditCurve, 'credit-curve')"
    rows: points
    x: tenor
    y: spread
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: CS01 by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: cs01
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
