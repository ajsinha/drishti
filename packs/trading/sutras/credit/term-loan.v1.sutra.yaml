# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: term-loan
version: 1
description: "Drawn loan amortising or bullet, floating over SOFR."
match: { kind: trade, where: "$.productType == 'TERM_LOAN'", priority: 10 }
title: { pill: Credit · Term loan, id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Notional, bind: "$.currency + ' ' + fmt($.notional, 'amount0')" }
  - { label: Direction, bind: $.direction }
  - { label: Trade date, bind: $.tradeDate, fmt: date }
  - { label: Maturity, bind: $.maturityDate, fmt: date }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: CS01 (USD), bind: $.risk.cs01, fmt: signed0, tone: sign }
  - { label: DV01 (USD), bind: $.risk.dv01, fmt: signed0, tone: sign }
  - { label: Status, bind: $.status, tone: status }
panels:
  - id: terms
    kind: kv
    title: Terms
    code: TRM
    key: F2
    columns:
      - { label: Margin, bind: $.terms.margin, fmt: bp1 }
      - { label: Facility, bind: $.terms.facilityType }
      - { label: Amortisation, bind: $.terms.amortisation }
      - { label: Effective, bind: $.effectiveDate, fmt: date }
      - { label: Counterparty, bind: $.counterparty.name }
  - id: schedule
    kind: table
    title: Amortisation
    code: AMT
    key: F3
    rows: $.schedule
    pivot:
      rows: [date]
      values: [{ field: principal, agg: sum }, { field: interest, agg: sum }]
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Opening notional, bind: "@.opening", fmt: amount0 }
      - { label: Principal, bind: "@.principal", fmt: amount0, total: true }
      - { label: Closing notional, bind: "@.closing", fmt: amount0 }
      - { label: Interest, bind: "@.interest", fmt: amount0, total: true }
  - id: explain
    kind: waterfall
    title: "P&L explain (USD, opening to closing MTM)"
    code: PNLX
    key: F5
    rows: $.pnlExplain
    label: step
    value: pnl
    sum: Closing MTM
    fmt: signed0
  - id: lifecycle
    kind: timeline
    title: Lifecycle
    code: LIFE
    key: F6
    rows: $.lifecycle.timeline
    detail: description
  - { id: built, kind: provenance, title: How this view was built }
  - id: marketData
    kind: line
    title: "Interest rate curve: Zero rates (%)"
    code: CRV
    key: F4
    area: right
    source: "link($.discountCurve, 'ir-curve')"
    rows: points
    x: tenor
    y: zeroRate
    fmt: price2
  - id: sensitivities
    kind: hbar
    title: CS01 by bucket (USD)
    code: SENS
    area: right
    rows: $.sensitivities
    label: bucket
    value: cs01
    fmt: signed0
    tone: sign
  - id: pnl
    kind: line
    title: Daily P&L, last 20 days (USD)
    code: PNL
    area: right
    rows: $.pnlHistory
    x: date
    y: pnl
    fmt: signed0
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.nettingSet, 'netting-set')", F8: impact, F9: raw }
