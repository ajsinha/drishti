# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Trading pack for Drishti.
pack: trading
version: 1.0.0
title: Trading
description: Trades in 125 products across rates, FX, credit, equity, commodities, inflation, fixed income, securities financing, money markets
  and structured products.
extends:
- banking-core
- market-data
kinds:
- trade
sutras: sutras
formats: config/formats.yaml
mnemonics:
  TRD:
    kind: trade
    label: Trade
graph:
  id-patterns:
  - pattern: ^T-
    kind: trade
  fields: {}
  impact:
    measures:
      trade: $.mtm
    formats:
      trade: signed0
connectors:
  trading-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - trade
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: trading
  trading-stream:
    plugin: kafka
    enabled: ${DRISHTI_STREAM_TRADING:false}
    kinds:
    - trade
    settings:
      bootstrap-servers: ${DRISHTI_KAFKA_BOOTSTRAP:localhost:9092}
      topics: ${DRISHTI_TRADING_TOPIC:drishti.trading.trades}
      kind: trade
      id-field: tradeId
      disk-cache.enabled: ${DRISHTI_STREAM_DISK_CACHE:true}
      disk-cache.root: ${DRISHTI_CACHE_ROOT:./data/cache}
      disk-cache.max-gb: ${DRISHTI_STREAM_CACHE_GB:10}
      disk-cache.reset-at: ${DRISHTI_CACHE_RESET_AT:02:00}
      disk-cache.zone: America/New_York
routes:
  trade: trading-store
columns:                       # key fields shown beside each trade in pick lists (TRD T-100) and searches
  trade: [productType, direction, currency, notional, mtm, maturityDate, book]
console:
  examples:
  - - TRD T-10001
    - Interest rate swap · legs and every cashflow
  - - TRD T-10181
    - FX option
  - - TRD T-10241
    - Single-name CDS
  - - TRD T-10343
    - OTC equity option
  - - TRD T-10379
    - Autocallable note · observation schedule
  help: config/help.yaml
roles:
  trader:
    kinds:
    - trade
    - ir-curve
    - repo-curve
    - fx-spot
    - fx-forward-curve
    - fx-vol-surface
    - ir-vol-cube
    - cap-vol-surface
    - equity
    - equity-index
    - dividend-curve
    - equity-vol-surface
    - credit-curve
    - inflation-index
    - inflation-curve
    - commodity
    - commodity-curve
    - commodity-vol-surface
    - rate-fixing
    - bond
    - correlation-matrix
    - counterparty
    - counterparty-group
    - issuer
    - book
    - desk
    - trader
    - legal-entity
    - calendar
    - agreement
    - csa
    - ccp
    - clearing-account
