# Logistics pack semantic hints, tried before the core roles.
roles:
  - { role: delay,       pattern: "delay|late", fmt: hours0, tone: sign, weight: 88 }
  - { role: weight,      pattern: "weight|kg$", fmt: amount0, weight: 72 }
  - { role: temperature, pattern: "celsius|temp|c$", fmt: temp1, weight: 75 }
  - { role: speed,       pattern: "knots", fmt: knots1, weight: 60 }
  - { role: capacity,    pattern: "teu", fmt: amount0, weight: 58 }
  - { role: date,        pattern: "eta|departed|arrived", fmt: date, weight: 62, dateOnly: true }
  - { role: label,       pattern: "incoterm|commodity|carrier|flag|mode", weight: 64 }
idFields: ["shipmentId", "containerId", "vesselId", "portId"]
