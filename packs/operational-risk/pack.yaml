# Operational and non-financial risk pack for Drishti.
pack: operational-risk
version: 1.0.0
code: OPR
title: Operational and non-financial risk
description: Loss events, RCSA, key risk indicators, issues and actions, scenarios, third-party and cyber risk, and SMA operational-risk capital.
extends:
- banking-core
kinds:
- loss-event
- risk-control
- key-risk-indicator
- issue
- oprisk-scenario
- third-party
- cyber-incident
- oprisk-capital
sutras: sutras
mnemonics:
  LOSS:
    kind: loss-event
    label: Operational loss event
  RCSA:
    kind: risk-control
    label: Risk and control assessment
  KRI:
    kind: key-risk-indicator
    label: Key risk indicator
  ISSUE:
    kind: issue
    label: Issue and action
  OPSCN:
    kind: oprisk-scenario
    label: Operational-risk scenario
  VEND:
    kind: third-party
    label: Third-party (vendor)
  CYBER:
    kind: cyber-incident
    label: Cyber incident
  OPCAP:
    kind: oprisk-capital
    label: Operational-risk capital
graph:
  id-patterns:
  - pattern: ^LOSS-
    kind: loss-event
  - pattern: ^RCSA-
    kind: risk-control
  - pattern: ^KRI-
    kind: key-risk-indicator
  - pattern: ^ISSUE-
    kind: issue
  - pattern: ^OPSCN-
    kind: oprisk-scenario
  - pattern: ^VEND-
    kind: third-party
  - pattern: ^CYBER-
    kind: cyber-incident
  - pattern: ^OPCAP-
    kind: oprisk-capital
  fields:
    relatedLoss:
      kind: loss-event
      label: Related loss
    rootCauseControl:
      kind: risk-control
      label: Failed control
  badges:
    loss-event: fmt($.netLoss, 'compact')
    risk-control: $.residual
    key-risk-indicator: $.status
connectors:
  oprisk-store:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - loss-event
    - risk-control
    - key-risk-indicator
    - issue
    - oprisk-scenario
    - third-party
    - cyber-incident
    - oprisk-capital
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: oprisk
routes:
  loss-event: oprisk-store
  risk-control: oprisk-store
  key-risk-indicator: oprisk-store
