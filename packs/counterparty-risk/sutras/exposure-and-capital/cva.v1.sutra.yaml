    kind: hbar
    title: Adjustments
    key: F2
    rows: $.components
    label: name
    value: amount
    fmt: signed0
    tone: sign
  - id: sens
    kind: table
    title: Sensitivities
    rows: $.sensitivities
    columns:
      - { label: Risk factor, bind: "@.factor" }
      - { label: Bump, bind: "@.bump" }
      - { label: "Δ CVA", bind: "@.delta", fmt: signed0, tone: sign }
