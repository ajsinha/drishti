# Generated by tools/packgen/banking/make_packs.py from the taxonomy. Edit the generator, not this file.
# Counterparty credit risk pack for Drishti.
pack: counterparty-risk
version: 1.0.0
title: Counterparty credit risk
description: Netting sets, exposure and PFE, CVA/XVA, SA-CCR, credit limits, collateral, margin calls and SIMM.
requires:
- trading
kinds:
- netting-set
- credit-limit
- exposure-profile
- cva
- sa-ccr
- collateral-balance
- margin-call
- simm
sutras: sutras
formats: config/formats.yaml
mnemonics:
  NSET:
    kind: netting-set
    label: Netting set
  LIM:
    kind: credit-limit
    label: Credit limit
  EXP:
    kind: exposure-profile
    label: Exposure profile
  CVA:
    kind: cva
    label: CVA / XVA
  SACCR:
    kind: sa-ccr
    label: SA-CCR exposure
  COLL:
    kind: collateral-balance
    label: Collateral balance
  MC:
    kind: margin-call
    label: Margin call
  SIMM:
    kind: simm
    label: ISDA SIMM initial margin
graph:
  id-patterns:
  - pattern: ^NS-
    kind: netting-set
  - pattern: ^LIM-
    kind: credit-limit
  - pattern: ^EXP-
    kind: exposure-profile
  - pattern: ^CVA-
    kind: cva
  - pattern: ^SACCR-
    kind: sa-ccr
  - pattern: ^COLL-
    kind: collateral-balance
  - pattern: ^MC-
    kind: margin-call
  - pattern: ^SIMM-
    kind: simm
  fields:
    collateralBalance:
      kind: collateral-balance
      label: Collateral
    creditLimit:
      kind: credit-limit
      label: Credit limit
    cvaResult:
      kind: cva
      label: CVA
    exposureProfile:
      kind: exposure-profile
      label: Exposure profile
    nettingSet:
      kind: netting-set
      label: Netting set
    saccr:
      kind: sa-ccr
      label: SA-CCR
    simm:
      kind: simm
      label: SIMM
  badges:
    netting-set: '''PFE '' + fmt($.pfePeak, ''compact'')'
    credit-limit: fmt($.utilisation, 'pct0') + ' used'
  impact:
    follow:
    - nettingSet
    - creditLimit
    measures:
      netting-set: $.netMtm
      credit-limit: $.limit
    formats:
      netting-set: signed0
      credit-limit: compact
connectors:
  credit-lake:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - netting-set
    - credit-limit
    - exposure-profile
    - cva
    - sa-ccr
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: credit
  collateral-lake:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    kinds:
    - collateral-balance
    - margin-call
    - simm
    settings:
      root: ${DRISHTI_DELTA_ROOT:./data/delta}
      domain: collateral
routes:
  netting-set: credit-lake
  credit-limit: credit-lake
  exposure-profile: credit-lake
  cva: credit-lake
  sa-ccr: credit-lake
  collateral-balance: collateral-lake
  margin-call: collateral-lake
  simm: collateral-lake
console:
  examples:
  - - NSET NS-SUMMIT-NY
    - Netting set · 108 trades, exposure, CVA
  - - LIM LIM-SUMMIT
    - Credit limit · utilisation by tenor
  - - CVA CVA-SUMMIT-NY
    - CVA / XVA
  - - SACCR SACCR-SUMMIT-NY
    - SA-CCR exposure at default
  help: config/help.yaml
roles:
  credit-risk:
    kinds:
    - '*'
    raw: true
