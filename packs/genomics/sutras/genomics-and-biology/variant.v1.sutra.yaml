# Generated by tools/packgen/genomics/make.py. Edit the generator, not this file.
rachana: 1
sutra: variant
version: 1
description: "A sequence variant: HGVS names, consequence, clinical significance and population frequencies."
match: { kind: variant, priority: 10 }
title: { pill: Genomics and biology · Variant, id: $.variantId }
strip:
  - { label: Gene, bind: $.geneSymbol }
  - { label: Protein change, bind: $.proteinChange, emphasis: true }
  - { label: HGVS, bind: $.hgvsC }
  - { label: Consequence, bind: $.consequence }
  - { label: Significance, bind: $.significance }
  - { label: dbSNP, bind: $.rsid }
panels:
  - id: frequencies
    kind: hbar
    title: Allele frequency by population
    key: F2
    rows: $.frequencies
    label: population
    value: af
    fmt: pct4
  - id: evidence
    kind: table
    title: Evidence
    key: F3
    rows: $.evidence
    columns:
      - { label: Source, bind: "@.source" }
      - { label: Assertion, bind: "@.assertion" }
      - { label: Review stars, bind: "@.stars", fmt: amount0 }
      - { label: Last evaluated, bind: "@.date", fmt: date }
  - id: annotation
    kind: kv
    title: Annotation
    area: right
    rows: $.annotation
  - { id: built, kind: provenance, title: How this view was built }
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
keys: { F7: "link($.gene, 'gene')", F8: impact, F9: raw }
