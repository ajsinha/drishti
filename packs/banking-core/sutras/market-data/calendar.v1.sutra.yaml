# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: calendar
version: 1
description: "Business-day calendar (USNY, TARGET, GBLO, JPTO…)."
match: { kind: calendar, priority: 10 }
title: { pill: Market data · Holiday calendar, id: $.calendarId }
strip:
  - { label: Name, bind: $.name }
  - { label: Holidays (2026), bind: size($.holidays), emphasis: true }
panels:
  - id: holidays
    kind: table
    title: Holidays
    key: F2
    rows: $.holidays
    columns:
      - { label: Date, bind: "@.date", fmt: date }
      - { label: Holiday, bind: "@.name" }
  - { id: built, kind: provenance, title: How this view was built }
keys: { F8: impact, F9: raw }
