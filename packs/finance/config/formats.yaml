# Finance pack formats, added to the core formats.
formats:
  pct4:     { type: number, decimals: 4, scale: 100, suffix: "%" }
  rate5:    { type: number, decimals: 5, grouping: false }
  pips1:    { type: number, decimals: 1, sign: always }
  df4:      { type: number, decimals: 4 }
  bp1:      { type: number, decimals: 1, sign: always, suffix: " bp" }
