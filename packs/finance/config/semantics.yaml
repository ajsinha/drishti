# Finance pack semantic hints, tried before the core roles.
roles:
  - { role: signed-money, pattern: "(^|_)(mtm|pv|dv01|pv01|cs01|vega|gamma|variationmargin|netmtm|pvusd)$|mtm$|pv$", fmt: signed0, tone: sign, weight: 90 }
  - { role: money,        pattern: "notional|margin|collateral|exposure|limit|ee(peak)?$|pfe|principal", fmt: amount0, weight: 80 }
  - { role: rate,         pattern: "rate$|spread|yield|coupon|fixing|strike", fmt: pct4, weight: 70, fractionOnly: true }
  - { role: fx-rate,      pattern: "(near|far|spot|fwd|forward)rate$|^rate$", fmt: rate5, weight: 70 }
  - { role: price,        pattern: "price|settle|px$", fmt: price2, weight: 70 }
  - { role: points,       pattern: "points|pips", fmt: pips1, weight: 60 }
  - { role: df,           pattern: "^df$|discount", fmt: df4, weight: 20 }
  - { role: date,         pattern: "maturity|effective|valuedate|reset|value$", fmt: date, weight: 60, dateOnly: true }
  - { role: count,        pattern: "lots|trades|flows", fmt: amount0, weight: 55 }
  - { role: label,        pattern: "product|direction|pair|contract|book|desk", weight: 65 }
# Listed-contract months (Z6) and overnight tenors also make chart axes.
tenorPattern: "^(ON|TN|SN|[FGHJKMNQUVXZ]\\d{1,2}|0)$"
idFields: ["tradeId"]
