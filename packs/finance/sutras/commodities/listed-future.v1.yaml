sutra: listed-future
version: 1
description: Exchange-traded future with daily settlement and variation margin (mockup drishti-commodity-future.png).
match: { kind: trade, where: "$.productType == 'FUT'", priority: 10 }
title: { pill: "Trade · Commodity future", id: $.tradeId, with: "link($.counterparty.id, 'counterparty', $.counterparty.name)" }
strip:
  - { label: Contract, bind: $.contract }
  - { label: Direction, bind: $.direction }
  - { label: Lots, bind: $.lots, fmt: amount0 }
  - { label: Trade price, bind: $.tradePrice, fmt: price2 }
  - { label: Last price, bind: $.lastPrice, fmt: price2, emphasis: true }
  - { label: MTM (USD), bind: $.mtm, fmt: signed0, tone: sign, emphasis: true }
  - { label: Last trade, bind: $.lastTrade, fmt: date }
  - { label: Book, bind: "link($.book, 'book')" }
panels:
  - { id: contract, kind: kv, title: Contract, key: F2, rows: $.contractTerms }
  - id: settlements
    kind: ladder
    title: Daily settlement and variation margin
    code: VM · ladder
    rows: $.settlements
    highlight: "@.intraday"
    totalLabel: Total since trade
    columns:
      - { label: Date, bind: "@.date + (@.intraday ? ' (intraday)' : '')" }
      - { label: Settle (USD/bbl), bind: "@.settle", fmt: price2 }
      - { label: Change, bind: "@.change", fmt: signed2, tone: sign }
      - { label: Variation margin (USD), bind: "@.variationMargin", fmt: signed0, tone: sign, total: true }
      - { label: Cumulative (USD), bind: "@.cumulative", fmt: signed0, tone: sign }
  - id: margin
    kind: kv
    title: Margin
    code: MRG
    key: F3
    columns:
      - { label: Initial margin, bind: $.margin.initialMargin }
      - { label: Variation margin today, bind: $.margin.variationMarginToday, fmt: signed0 }
      - { label: Delta (bbl), bind: $.margin.deltaBbl, fmt: signed0 }
      - { label: USD per $1 move, bind: $.margin.usdPerDollarMove, fmt: amount0 }
  - { id: built, kind: provenance, title: How this view was built }
  - id: curve
    kind: line
    title: WTI futures curve (USD/bbl)
    code: CRV
    key: F4
    area: right
    source: "link($.forwardCurve, 'curve')"
    rows: points
    x: tenor
    y: price
    fmt: price2
    mark: "'Z6'"
  - { id: refs, kind: links, title: Linked entities, code: REFS, area: right }
  - id: changes
    kind: hbar
    title: Daily price change (USD/bbl)
    code: HIST
    area: right
    rows: $.settlements
    label: date
    value: change
    fmt: signed2
    tone: sign
keys: { F7: "link($.clearingAccount, 'clearing-account')", F8: impact, F9: raw }
