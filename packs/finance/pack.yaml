# Finance · capital markets pack for Drishti.
pack: finance
version: 1.0.0
code: FIN             # typed alone, opens this pack's overview
title: Finance · capital markets
description: >-
  Trades (interest rate swaps, FX swaps, listed futures and more), netting sets, CSAs, master agreements,
  curves, credit limits, clearing accounts and books, with the four reference Sutras, finance vocabulary for
  inference, and live sample data behind the mockups.
kinds: [trade, netting-set, csa, agreement, curve, counterparty, credit-limit, clearing-account, contract-spec, index, fx-spot, book, fixing]
sutras: sutras
formats: config/formats.yaml
semantics: config/semantics.yaml
samples: samples
mnemonics:                      # <MNEMONIC> <ID> <GO>
  TRD:  { kind: trade, label: Trade }
  NSET: { kind: netting-set, label: Netting set }
  CSA:  { kind: csa, label: Credit support annex }
  AGR:  { kind: agreement, label: Master agreement }
  CRV:  { kind: curve, label: Curve }
  CPTY: { kind: counterparty, label: Counterparty }
  LIM:  { kind: credit-limit, label: Credit limit }
  CLR:  { kind: clearing-account, label: Clearing account }
  SPEC: { kind: contract-spec, label: Contract specification }
  IDX:  { kind: index, label: Rate index }
  FXS:  { kind: fx-spot, label: FX spot }
  BOOK: { kind: book, label: Book }
  FIX:  { kind: fixing, label: Rate fixings (feed file) }
graph:
  id-patterns:                  # identifiers whose kind is not stated
    - { pattern: "^(IRS|FXS|CFT|XCS|SWPT)-\\d+$", kind: trade }
    - { pattern: "^NS-", kind: netting-set }
    - { pattern: "^CSA-", kind: csa }
    - { pattern: "^ISDA-", kind: agreement }
    - { pattern: "^CP-", kind: counterparty }
    - { pattern: "^LIM-", kind: credit-limit }
    - { pattern: "^CLR-", kind: clearing-account }
  fields:                       # document field -> linked entity
    nettingSet:      { kind: netting-set, label: Netting set }
    agreement:       { kind: agreement, label: Agreement }
    csa:             { kind: csa, label: CSA }
    creditLimit:     { kind: credit-limit, label: Credit limit }
    discountCurve:   { kind: curve, label: Discount curve }
    discountCurves:  { kind: curve, label: Discount curve }
    forwardCurve:    { kind: curve, label: Forward curve }
    index:           { kind: index, label: Index }
    spot:            { kind: fx-spot, label: Spot }
    clearingAccount: { kind: clearing-account, label: Clearing account }
    contractSpec:    { kind: contract-spec, label: Contract spec }
    book:            { kind: book, label: Book }
  impact:                       # F8: what depends on an entity
    follow: [nettingSet, creditLimit]          # roll dependents up into their netting sets and limits
    measures: { trade: "$.mtm", netting-set: "$.netMtm", credit-limit: "$.limit" }
    formats:  { trade: signed0, netting-set: signed0, credit-limit: compact }
  badges:                       # kind -> Rachana-EL over the linked document
    netting-set: "'EE ' + fmt($.eePeak, 'compact')"
    csa: "'threshold ' + $.threshold"
    curve: "$.status"
    fx-spot: "$.status"
    credit-limit: "fmt($.limit, 'compact')"
    clearing-account: "'IM limit ' + fmt($.imLimit, 'pct0')"
    contract-spec: "$.exchange"
connectors:                     # history for the business-date picker (build it with tools/samplegen/lake.py --domain finance)
  finance-lake:
    plugin: delta
    enabled: ${DRISHTI_LAKE_ENABLED:true}
    settings: { root: "${DRISHTI_DELTA_ROOT:./data/delta}", domain: finance, lookback-days: 10 }
roles:
  trader: { kinds: [trade, curve, fx-spot, index, book, contract-spec, clearing-account, counterparty, fixing] }
  risk:   { kinds: ["*"], raw: true }
alerts:                         # suggested alert rules, offered per kind
  - { kind: netting-set, name: "PFE near limit", when: "$.utilisation > 0.8", severity: warn, message: "${$.nettingSetId}: utilisation ${fmt($.utilisation, 'pct0')} of limit" }
  - { kind: netting-set, name: "Net MTM below −1.5m", when: "$.netMtm < -1500000", severity: warn, message: "${$.nettingSetId}: net MTM ${fmt($.netMtm, 'signed0')}" }
  - { kind: trade, name: "MTM below −450k", when: "$.mtm < -450000", severity: warn, message: "${$.tradeId}: MTM ${fmt($.mtm, 'signed0')}" }
  - { kind: trade, name: "Variation margin above 100k today", when: "$.margin.variationMarginToday > 100000", severity: info, message: "${$.tradeId}: VM today ${fmt($.margin.variationMarginToday, 'signed0')}" }
console:                        # read by the console
  examples:
    - ["TRD IRS-48213", "Interest rate swap · legs, cashflows, SOFR curve, DV01"]
    - ["TRD FXS-20931", "FX swap · near and far legs, forward points"]
    - ["TRD CFT-77120", "Commodity future · settlements and variation margin"]
    - ["NSET NS-NORTH-01", "Netting set · exposure profile, member trades, CSA"]
    - ["TRD IRS-47102", "A trade with no Sutra · laid out by inference alone"]
    - ["CRV USD-SOFR", "A curve · inferred"]
    - ["FIX SOFR-HISTORY", "A feed file (CSV) · inferred"]
  workspaces: config/workspaces.yaml
  help: config/help.yaml
  monitors:
    Credit watch: [ { kind: netting-set, id: NS-NORTH-01 }, { kind: netting-set, id: NS-HARB-02 }, { kind: trade, id: IRS-48213 }, { kind: trade, id: FXS-20931 }, { kind: trade, id: CFT-77120 } ]
