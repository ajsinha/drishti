# The VaR change explanation workbook template (VAR_GUIDE.md section 3.11), on the VaR Playground frame (docs/architecture/VAR_PLAYGROUND.md section 5): the look
# properties (docProps/*.xml, branding placeholders filled from drishti.branding.*) and the words of the Explain tab (explain.txt). The
# sheets and every formula are generated for the explanation asked; the style names below are the VaR Playground's.
name=var-explain
version=1.0
# the cell formats of xl/styles.xml the generator uses, by name: the index of each in cellXfs
style.default=0
style.title=1
style.band=2
style.head=3
style.text=4
style.note=5
style.input.money=6
style.input.text=7
style.input.int=8
style.input.dec=9
style.input.rate=10
style.money=11
style.money.bold=12
style.int=13
style.pct=14
style.rate=15
style.check=16
style.date=17
style.label=18
style.mark=19
style.total=20
style.band.status=21
style.wrap=22
style.label.wrap=23
# the differential formats (dxfs) the check cells turn to: passed, failed
dxf.pass=0
dxf.fail=1
