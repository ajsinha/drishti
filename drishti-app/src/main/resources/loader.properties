# Spring Boot PropertiesLauncher (layout ZIP): every jar in the external library folder joins the class path at start.
# The base is DRISHTI_EXTERNAL_LIB (default: external_lib under the working directory); -Dloader.path overrides it.
loader.path=${drishti.external-lib:${DRISHTI_EXTERNAL_LIB:external_lib}}/java
