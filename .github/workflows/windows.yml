name: windows
# Drishti on Windows with the native Delta engine (no Hadoop, no winutils.exe): build, the Delta engine's, the Delta
# connector's and the server's tests, then the Python commands an administrator runs (build jar, setup, setup --check,
# start server, status, stop server) with the server on a generated lake asked for a view, a search and a past business
# date. Testcontainers tests skip themselves (no Docker on Windows runners).
on:
  push: { branches: [develop, main, 'release/**', 'i7k/**', 'i7l/**', 'i8/**'] }
  pull_request:
  workflow_dispatch:
jobs:
  native-delta:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DRISHTI_PORT: '18480'
      TOOLS_TAG: v1.1.0-ide2          # the products are built from their release tags, never fetched from Maven Central (see fast.yml)
      RACHANA_TAG: v1.0.1-ide2
      LAKE_TAG: i8/catalogue          # the pom wants lake 0.9.2, not tagged yet: its branch until then (set to the tag when it is cut)
    defaults:
      run: { shell: pwsh }
    steps:
      # LF in the checkout, as on Linux: commit JSON, Parquet fixtures and Spotless see the same bytes
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Build Drishti Tools, Rachana and Lake from their release tags
        run: |
          foreach ($spec in @("drishti-tools:$env:TOOLS_TAG", "drishti-rachana:$env:RACHANA_TAG", "drishti-lake:$env:LAKE_TAG")) {
            $repo, $tag = $spec -split ':'
            git clone -q --depth 1 --branch $tag "https://github.com/drishti-platform/$repo.git" "$env:RUNNER_TEMP/$repo"
            if ($LASTEXITCODE -ne 0) { throw "clone of $repo $tag failed" }
            Push-Location "$env:RUNNER_TEMP/$repo/java"
            ./mvnw.cmd -B -q install -DskipTests
            if ($LASTEXITCODE -ne 0) { throw "build of $repo $tag failed" }
            Pop-Location
          }
      # the engine API, host and sample (0.1.0-SNAPSHOT: no tag yet), from develop; the kit's TCK module (built on an older Rachana) is not needed
      - name: Build the engine API and host from develop
        run: |
          git clone -q --depth 1 --branch develop https://github.com/drishti-platform/drishti-engine.git "$env:RUNNER_TEMP/drishti-engine"
          if ($LASTEXITCODE -ne 0) { throw 'clone of drishti-engine develop failed' }
          Push-Location "$env:RUNNER_TEMP/drishti-engine/java"
          ./mvnw.cmd -B -q install -DskipTests -pl :engine-bom,:engine-api,:engine-host,:engine-sample -am
          if ($LASTEXITCODE -ne 0) { throw 'build of drishti-engine failed' }
          Pop-Location
      - name: Build (no tests)
        run: ./mvnw.cmd -B -q install -DskipTests
      - name: Tests of the lake host, the Delta and Iceberg connectors and the server
        run: ./mvnw.cmd -B -fae verify -pl :drishti-api,:drishti-lake-host,plugins/drishti-plugin-delta,plugins/drishti-plugin-iceberg,plugins/drishti-plugin-iceberg-external,:drishti-server
      # its own step (everything is installed above): a failure here never hides the server suite's result, nor the other way round
      - name: Tests of the identity stores (users, preferences, designs)
        if: ${{ !cancelled() }}
        run: ./mvnw.cmd -B verify -pl :drishti-identity
      # the tools read where everything is from the kernel jar: it is built into lib/ first (python tools/drishti.py build jar)
      - name: Build the server jar into lib/ (python tools/drishti.py build jar)
        run: python tools/drishti.py build jar --offline
      - name: A small lake (the banking packs' samples, ten business days)
        run: |
          python -m pip install --quiet deltalake pyarrow pyyaml
          python tools/packgen/banking/make_data.py --lake data/delta/demo --rows data/build/lake-rows --no-load
          if ($LASTEXITCODE -ne 0) { throw "make_data failed ($LASTEXITCODE)" }
          python tools/samplegen/load_rows.py --root data/delta/demo --rows data/build/lake-rows/banking-history.jsonl --restated data/build/lake-rows/banking-restated.jsonl
          if ($LASTEXITCODE -ne 0) { throw "load_rows failed ($LASTEXITCODE)" }
          if (-not (Test-Path data/delta/demo/trading/trade_endur/_delta_log)) { throw 'no trade table was written' }
      # the Python commands, as an administrator runs them on Windows (docs/DEPLOYMENT_AND_QA_GUIDE.md section 7): the jar into lib/ by
      # build jar (never copied by hand), the machine prepared and checked, the server started, asked, shown in status and stopped
      - name: Prepare and check this machine (setup, then setup --check)
        run: |
          python tools/drishti.py setup drishti
          python tools/drishti.py setup drishti --check
          if ($LASTEXITCODE -ne 0) { throw 'setup --check found something to do' }
      - name: The server on the lake (start server), asked for a view, a search and a past date; status; stop server
        env:
          DRISHTI_PACKS: market-risk
        run: |
          python tools/drishti.py start server --background --heap 1g --wait 240
          if ($LASTEXITCODE -ne 0) { throw "start server failed ($LASTEXITCODE)" }
          $pidFile = 'data/run/server.pid'
          $serverPid = [int](Get-Content $pidFile -TotalCount 1)
          try {
            $b = 'http://localhost:18480'
            Start-Sleep -Seconds 5                                   # the lake's first index
            $health = Invoke-RestMethod "$b/api/v1/admin/health"
            $lake = $health.sources | Where-Object { $_.name -eq 'trading-store' }
            Write-Host "trading-store: $($lake.health) $($lake.cache | ConvertTo-Json -Compress)"
            if ($lake.health -notlike 'UP (engine: native*') { throw "trading-store is not up on the native engine: $($lake.health)" }
            $view = Invoke-RestMethod "$b/api/v1/views/trade/MX-20000001"
            Write-Host "view: $($view.title) from $($view.provenance | ConvertTo-Json -Compress)"
            if (-not $view.strip) { throw 'the view has no strip' }
            $q = [uri]::EscapeDataString('TRD where mtm > 1m order by mtm desc limit 3')
            $search = Invoke-RestMethod "$b/api/v1/search?q=$q"
            Write-Host "search: matched $($search.matched) of $($search.scanned), partial $($search.partial)"
            if ($search.matched -lt 1) { throw 'the search matched nothing' }
            $past = Invoke-RestMethod "$b/api/v1/entities/trade/MX-20000001/raw" -Headers @{ 'X-Drishti-As-Of' = '2026-09-29' }
            Write-Host "past: $($past.provenance | ConvertTo-Json -Compress)"
            if ($past.provenance.businessDate -ne '2026-09-29') { throw "the past date read $($past.provenance.businessDate), not 2026-09-29" }
            python tools/drishti.py status
          } finally {
            $stopped = (python tools/drishti.py stop server --timeout 60 | Out-String)
            Write-Host $stopped
          }
          # the launcher's stop asked the server over HTTP: it is gone, its pid file removed, the port free
          if (Test-Path $pidFile) { throw 'stop server left the pid file' }
          if (Get-Process -Id $serverPid -ErrorAction SilentlyContinue) { throw "the server (pid $serverPid) still runs after stop server" }
          if ($stopped -match 'stopped by force') { throw "the server did not stop by itself: $stopped" }
      - name: Server log
        if: always()
        run: |
          if (Test-Path data/logs/server.log) { Get-Content data/logs/server.log -Tail 200 }
          if (Test-Path data/logs/server.out) { Get-Content data/logs/server.out -Tail 50 }
