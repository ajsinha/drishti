name: fast
# The quick check on every push to develop, main and release/**, and on every pull request. The three products Drishti needs are built
# from THEIR release tags (never from Maven Central or PyPI: the owner publishes nowhere); only third-party libraries come from Central.
# What stays in the drill: the full Java test suite (./mvnw verify), the browser tests and the console's whole test suite.
on:
  push: { branches: [develop, main, 'release/**', 'i7k/**'] }
  pull_request:
concurrency: { group: 'fast-${{ github.ref }}', cancel-in-progress: true }
env:
  TOOLS_TAG: v1.1.0-ide2        # the product tags of the platform release (platform.yaml / COMPATIBILITY.md in drishti-platform/drishti-platform)
  RACHANA_TAG: v1.0.1-ide2
  LAKE_TAG: v0.9.1-ide2
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: drishti-console/requirements-test.txt }
      - name: Maven repository cache (the three products are keyed on their tags)
        id: m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ env.TOOLS_TAG }}-${{ env.RACHANA_TAG }}-${{ env.LAKE_TAG }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-${{ env.TOOLS_TAG }}-${{ env.RACHANA_TAG }}-${{ env.LAKE_TAG }}-
      - name: Build Drishti Tools, Rachana and Lake from their release tags
        run: |
          for spec in "drishti-tools:$TOOLS_TAG" "drishti-rachana:$RACHANA_TAG" "drishti-lake:$LAKE_TAG"; do
            repo=${spec%%:*}; tag=${spec##*:}
            git clone -q --depth 1 --branch "$tag" "https://github.com/drishti-platform/$repo.git" "$RUNNER_TEMP/$repo"
            (cd "$RUNNER_TEMP/$repo/java" && ./mvnw -B -q install -DskipTests)
          done
      - name: Build Drishti (packages the server jar and the modules, no tests)
        run: ./mvnw -B -q package -DskipTests
      - run: pip install -r drishti-console/requirements-test.txt
      - name: Copyright headers
        run: python tools/license_headers.py
      - name: Every generated document is current
        run: python tools/drishti.py docs generate --check
      - name: Docs and Help tests of the console
        run: python -m pytest -q -p no:randomly drishti-console/tests/test_docs_*.py drishti-console/tests/test_help*.py drishti-console/tests/test_settings_catalogue.py drishti-console/tests/test_tools_guide.py -m "not browser"
      - name: Docs consolidation
        run: python -m pytest -q tools/test_docs_consolidation.py
      - name: Generated docs
        run: python -m pytest -q tools/test_docs_generated.py
      - name: README standard
        run: python -m pytest -q tools/test_readmes.py
  compile-25:
    # Java 21 bytecode must also build and run on the newest JDK; the tests themselves run on 21 in the drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Maven repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-25-${{ runner.os }}-${{ env.TOOLS_TAG }}-${{ env.RACHANA_TAG }}-${{ env.LAKE_TAG }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-25-${{ runner.os }}-${{ env.TOOLS_TAG }}-${{ env.RACHANA_TAG }}-${{ env.LAKE_TAG }}-
      - name: Build the products from their tags, then Drishti
        run: |
          for spec in "drishti-tools:$TOOLS_TAG" "drishti-rachana:$RACHANA_TAG" "drishti-lake:$LAKE_TAG"; do
            repo=${spec%%:*}; tag=${spec##*:}
            git clone -q --depth 1 --branch "$tag" "https://github.com/drishti-platform/$repo.git" "$RUNNER_TEMP/$repo"
            (cd "$RUNNER_TEMP/$repo/java" && ./mvnw -B -q install -DskipTests)
          done
          ./mvnw -B -q package -DskipTests
