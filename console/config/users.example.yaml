# Copy to config/users.yaml (git-ignored) and replace the hashes:
#   python console/tools/hash_password.py
# Roles must exist in the server's drishti.security.roles.
users:
  ash:
    display: Ash
    desk: Rates desk
    roles: [author]
    password: pbkdf2_sha256$240000$<salt-hex>$<hash-hex>
  tina:
    display: Tina
    desk: FX desk
    roles: [trader]
    password: pbkdf2_sha256$240000$<salt-hex>$<hash-hex>
