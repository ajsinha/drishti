# The help centre catalogue. A guide is a console guide (web/guides/<slug>.md) or, with `doc:`, a repository
# document rendered as-is (so the in-app reference is the repository's docs). Order here is display order.
# Every other document under docs/ (and the top-level *.md) is reachable unlisted at a slug made from its path
# (docs/architecture/adr/016-one-console-many-servers.md -> /help/docs-architecture-adr-016-one-console-many-servers),
# so a link between documents always opens in the help centre (DOC-18; tests/test_help_links.py crawls them all).
categories:
  - id: start
    name: Getting started
    icon: flag
    blurb: Open your first view, learn the command line and the keys, and read what a view is telling you.
    guides:
      - { slug: quickstart, doc: guides/QUICKSTART.md, title: Quickstart, icon: lightning, summary: "Ten minutes from a fresh clone to a live view: build, start, and eight commands to try." }
      - { slug: windows, doc: guides/WINDOWS.md, title: Drishti on Windows, icon: windows, summary: "Building, starting and running Drishti on Windows: the PowerShell scripts, paths and what differs." }
      - { slug: install-and-run, doc: guides/GETTING_STARTED.md, title: Install and run, icon: download, summary: "From nothing to your first view: build, start, sign in, and the first commands to type, step by step." }
      - { slug: impact, title: F8 · Impact, icon: diagram-3, summary: "What depends on an entity: its dependents, what they roll into, and the amount at stake." }
      - { slug: monitors-and-alerts, title: Monitors and alerts, icon: bell, summary: "Live watchlists, and rules the server checks on every change: alerted once, re-armed when clear." }
      - { slug: workspaces, title: Workspaces, icon: grid-1x2, summary: "Several live views on one screen, panes that follow each other, views dragged into panes, dividers to resize, saved per user." }
      - { slug: layout-mode, title: "Layout mode · arrange a view", icon: grid-3x3-gap, summary: "Alt+L: drag, resize and hide a view's panels for yourself, kept as your layout of its Sutra; authors promote it for review." }
      - { slug: pivot-tab, title: "The Pivot tab · slice a table", icon: table, summary: "Where a Sutra or pack offers it: drag fields into rows, columns, values and filters; totals, drill-down, chart, Excel; saved for you." }
      - { slug: python-calc, doc: guides/PYTHON_CALC.md, title: "Calc · Python on any view", icon: filetype-py, summary: "Alt+C: Python in your browser on the screen you are on. The drishti module, tables and charts, packs' snippets, roles, limits." }
      - { slug: using-the-terminal, doc: guides/USER_GUIDE.md, title: Using the terminal, icon: terminal, summary: "Commands, type-ahead, every key, and how to read the strip, panels, links and provenance." }
  - id: layouts
    name: Layouts, Rachana and Sutras
    icon: braces
    blurb: How screens are described instead of coded. Rachana is the grammar; each Sutra is one layout written in it.
    guides:
      - { slug: rachana-guide, doc: guides/RACHANA_GUIDE.md, title: Rachana, step by step, icon: mortarboard, summary: "A tutorial from your first Sutra to a full trade view: strips, panels, tables, charts, keys, conditions, matching and review." }
      - { slug: sutra-guide, title: The Sutra guide, icon: journal-richtext, summary: "Everything about writing Sutras: anatomy, labels and taxonomies, paths, formats, all twenty panel kinds, matching, inference, Studio." }
      - { slug: panel-kinds, title: The twenty panel kinds, icon: grid-1x2, summary: "What each panel kind shows, when to use it, and the Sutra that produces it." }
      - { slug: examples, doc: guides/examples/README.md, title: Examples, icon: collection, summary: "Ten working Sutras with their data, covering all twenty panel kinds, nested pivots and tree rows: read them here, open them in Studio." }
      - { slug: panels, doc: guides/PANELS.md, title: Panels in depth, icon: bar-chart, summary: "Every panel kind in detail: the data it needs, every option, what the server computes, how it is drawn, limits and common mistakes." }
      - { slug: sutra-studio, title: "Tutorial 3 · Sutra Studio", kind: tutorial, icon: stars, summary: "Start from inference, edit with live preview, fix problems by line, and save." }
      - { slug: nested-data, title: "Tutorial 4 · Nested documents", kind: tutorial, icon: diagram-2, summary: "Paths of any depth, tables over nested arrays, tabs per element, and a whole Sutra over a real trade." }
      - { slug: rachana-reference, doc: guides/RACHANA_REFERENCE.md, title: Rachana reference, icon: book, summary: "Every key, panel option, format, tone, Rachana-EL expression and problem code." }
      - { slug: inference, doc: architecture/INFERENCE.md, title: Inference, icon: diagram-3, summary: "The rules that lay out data with no Sutra, how they are scored, and how they fill a Sutra's gaps." }
