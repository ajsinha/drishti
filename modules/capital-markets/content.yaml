# What the packer brings in from the repository (paths from this folder) and what it trims from the module's own folder, so each file keeps
# one home: `trim` strips a pack of what a module does not carry (its connector templates: a module carries no connector; tests, tools,
# samples), `copy` brings in the lens and the tutorial. This list itself is not packed.
trim:
- path: packs/us-equities
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/funds
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
copy:
- from: ../../config/lenses/capitalmarkets/markets.yaml
  to: lenses/markets.yaml
- from: ../../docs/tutorials/13-world-data.md
  to: tutorials/13-world-data.md
