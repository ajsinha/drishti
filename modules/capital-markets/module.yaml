# The capital-markets module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 4; DISTRIBUTIONS.md): content only, no code.
# The distribution files list it by id, and their visibility filter reads this file: its packs, functions, menus and Help.
format: 1
id: capitalmarkets
version: 1.0.0
title: Capital markets
about: US equities (SEC EDGAR filings and facts, indices, sectors) and the largest US funds and ETFs with their holdings; the Markets lens
domain: capitalmarkets
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: capitalmarkets
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=1.4 <2'
requires:
  optional:
    market-data: '>=1.0 <2'
provides:
  kinds:
    us-equities:
    - us-company
    - index-membership
    - sic-sector
    - filing-feed
    - filing
    - financial-fact
    - price-history
    funds:
    - fund
    - fund-holder
    - index-funds
packs:
  folder: packs
  list:
  - us-equities
  - funds
data:
  needs: data/needs.yaml
console:
  plugin: console/plugin.yaml
  # the module's own top menus, in the console sitemap's form (drishti-console/config/sitemap.yaml); a menu of another module's
  # id adds its columns to that menu (the one Markets menu). The one home of these menus.
  menus:
  - id: markets
    columns:
    - title: News and quotes
      items:
      - id: idx
        cmd: IDX
        icon: list-ol
        label: Indices
        desc: Index membership
        requires: ['cmd:IDX']
  - id: companies
    domain: banking
    label: Companies
    icon: building
    subject: true
    columns:
    - title: Companies
      items:
      - id: useq
        cmd: USEQ
        icon: building
        label: US equities
        desc: US listed companies, their sector and figures
        requires: ['cmd:USEQ']
      - id: edgar
        cmd: EDGAR
        icon: file-earmark-text
        label: Filings
        desc: The filings feed of US companies
        requires: ['cmd:EDGAR']
      - id: leic
        cmd: LEIC
        icon: globe
        label: Legal entities
        desc: Legal entities by country (LEI)
        requires: ['cmd:LEIC']
      - id: fund
        cmd: FUND
        icon: pie-chart
        label: Funds and ETFs
        desc: Funds and ETFs and what they hold
        requires: ['cmd:FUND']
functions:
- USEQS
- USEQ
- IDX
- SIC
- EDGAR
- FILING
- FACT
- PXH
- FUNDS
- FUND
- HELD
- TRACK
lenses: lenses/markets.yaml
docs:
  readme: docs/README.md
  help: docs/help.yaml
  domains:
  - capitalmarkets
  guides:
  - packs/us-equities/guides/us-equities.md
  - packs/funds/guides/funds.md
  tutorials:
  - tutorials/13-world-data.md
resources:
  memory-mb: 64
