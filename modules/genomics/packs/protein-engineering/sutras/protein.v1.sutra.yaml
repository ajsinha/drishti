# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: protein
version: 1
description: 'Protein: One invented protein: its sequence, family and active site.'
doc:
  summary: One protein, as a record.
  description: 'One invented protein: its sequence, family and active site. Four proteins; Helixase-7, the enzyme of gene HLXK7 (312 amino acids),
    is the one the cohort screen and the design campaign are about. The page is the plain record view: the strip gives the headline fields and
    the table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/protein/HLXK7
  - PROT HLXK7
  category: "Protein engineering"
  tags: ["protein", "protein-engineering", "record"]
  use-when: "You have one protein (its id, or a link from another screen) and want to read it in full: one protein, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One protein record (kind protein); the page reads PROTEIN, NAME, LENGTH, FAMILY, DESIGN_ROUNDS, GENE, SEQUENCE, ACTIVE_SITE."
    sample-row: {"PROTEIN": "HLXK7", "GENE": "HLXK7", "NAME": "Helixase-7", "LENGTH": 312, "FAMILY": "Helicase-like kinase", "DESIGN_ROUNDS": 8}
  example: "PROT HLXK7"
  see-also: ["study-gene"]
  keywords: ["protein", "protein engineering"]
  since: 2.9.11
match:
  kind: protein
  priority: 10
title:
  pill: Protein engineering · Protein
  id: $.PROTEIN
strip:
- label: Protein
  bind: $.PROTEIN
- label: Name
  bind: $.NAME
- label: Length
  bind: $.LENGTH
- label: Family
  bind: $.FAMILY
- label: Design rounds
  bind: $.DESIGN_ROUNDS
  fmt: amount0
  emphasis: true
panels:
- id: record
  kind: kv
  title: Protein
  columns:
  - label: Protein
    bind: $.PROTEIN
  - label: Gene
    bind: link($.GENE, 'study-gene')
  - label: Name
    bind: $.NAME
  - label: Length
    bind: $.LENGTH
  - label: Family
    bind: $.FAMILY
  - label: Sequence
    bind: $.SEQUENCE
  - label: Active site
    bind: $.ACTIVE_SITE
  - label: Design rounds
    bind: $.DESIGN_ROUNDS
    fmt: amount0
keys:
  F9: raw
