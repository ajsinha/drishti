# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: design-round
version: 1
description: 'Design round: One round of the campaign: how the designs were made, how many, and how well the round did.'
doc:
  summary: One design round, as a record.
  description: 'One round of the campaign: how the designs were made, how many, and how well the round did. Eight rounds. The page is the plain
    record view: the strip gives the headline fields and the table every field, a linked field opens its kind; the showcase''s own screens are
    drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/design-round/HLXK7-R8
  - DROUND HLXK7-R8
  category: "Protein engineering"
  tags: ["design-round", "protein-engineering", "record"]
  use-when: "You have one design round (its id, or a link from another screen) and want to read it in full: one design round, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One design round record (kind design-round); the page reads ROUND_ID, ROUND, METHOD, BEST_ACTIVITY, MEDIAN_ACTIVITY, PROTEIN, STARTED, DESIGNS, BEST_DESIGN, TRAPPED, NOTE."
    sample-row: {"ROUND_ID": "HLXK7-R8", "PROTEIN": "HLXK7", "ROUND": 8, "METHOD": "Final polish around the lead", "STARTED": "2026-04-20", "DESIGNS": 1500, "BEST_DESIGN": "DSG-HLXK7-R8-0901", "BEST_ACTIVITY": 16.07}
  example: "DROUND HLXK7-R8"
  see-also: ["protein", "design"]
  keywords: ["design round", "protein engineering"]
  since: 2.9.11
match:
  kind: design-round
  priority: 10
title:
  pill: Protein engineering · Design round
  id: $.ROUND_ID
strip:
- label: Round id
  bind: $.ROUND_ID
- label: Round
  bind: $.ROUND
  fmt: amount0
- label: Method
  bind: $.METHOD
- label: Best activity
  bind: $.BEST_ACTIVITY
- label: Median activity
  bind: $.MEDIAN_ACTIVITY
  emphasis: true
panels:
- id: record
  kind: kv
  title: Design round
  columns:
  - label: Round id
    bind: $.ROUND_ID
  - label: Protein
    bind: link($.PROTEIN, 'protein')
  - label: Round
    bind: $.ROUND
    fmt: amount0
  - label: Method
    bind: $.METHOD
  - label: Started
    bind: $.STARTED
    fmt: date
  - label: Designs
    bind: $.DESIGNS
    fmt: amount0
  - label: Best design
    bind: link($.BEST_DESIGN, 'design')
  - label: Best activity
    bind: $.BEST_ACTIVITY
  - label: Median activity
    bind: $.MEDIAN_ACTIVITY
  - label: Trapped
    bind: $.TRAPPED
    fmt: amount0
  - label: Note
    bind: $.NOTE
keys:
  F9: raw
