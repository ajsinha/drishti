# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: dms-score
version: 1
description: 'Deep mutational scan score: One measurement of the scan: what changing one position of a protein to one amino acid did to one assay.'
doc:
  summary: One deep mutational scan score, as a record.
  description: 'One measurement of the scan: what changing one position of a protein to one amino acid did to one assay. Every position, every
    one of the 20 amino acids, two assays: 47,840 experiments. The page is the plain record view: the strip gives the headline fields and the
    table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/dms-score/HLXK7:177:A:ACTIVITY
  - DMS HLXK7:177:A:ACTIVITY
  since: 2.9.11
match:
  kind: dms-score
  priority: 10
title:
  pill: Protein engineering · Deep mutational scan score
  id: $.SCORE_ID
strip:
- label: Score id
  bind: $.SCORE_ID
- label: Mutation
  bind: $.MUTATION
- label: Assay
  bind: $.ASSAY
- label: Score
  bind: $.SCORE
- label: Se
  bind: $.SE
  emphasis: true
panels:
- id: record
  kind: kv
  title: Deep mutational scan score
  columns:
  - label: Score id
    bind: $.SCORE_ID
  - label: Protein
    bind: link($.PROTEIN, 'protein')
  - label: Pos
    bind: $.POS
    fmt: amount0
  - label: Aa ref
    bind: $.AA_REF
  - label: Aa
    bind: $.AA
  - label: Mutation
    bind: $.MUTATION
  - label: Assay
    bind: $.ASSAY
  - label: Score
    bind: $.SCORE
  - label: Se
    bind: $.SE
  - label: Replicates
    bind: $.REPLICATES
    fmt: amount0
keys:
  F9: raw
