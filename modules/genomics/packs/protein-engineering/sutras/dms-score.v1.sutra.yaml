# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: dms-score
version: 1
description: 'Deep mutational scan score: One measurement of the scan: what changing one position of a protein to one amino acid did to one assay.'
doc:
  summary: One deep mutational scan score, as a record.
  description: 'One measurement of the scan: what changing one position of a protein to one amino acid did to one assay. Every position, every
    one of the 20 amino acids, two assays: 47,840 experiments. The page is the plain record view: the strip gives the headline fields and the
    table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/dms-score/HLXK7:177:A:ACTIVITY
  - DMS HLXK7:177:A:ACTIVITY
  category: "Protein engineering"
  tags: ["dms-score", "protein-engineering", "record"]
  use-when: "You have one deep mutational scan score (its id, or a link from another screen) and want to read it in full: one deep mutational scan score, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One deep mutational scan score record (kind dms-score); the page reads SCORE_ID, MUTATION, ASSAY, SCORE, SE, PROTEIN, POS, AA_REF, AA, REPLICATES."
    sample-row: {"SCORE_ID": "HLXK7:177:A:ACTIVITY", "PROTEIN": "HLXK7", "POS": 177, "AA_REF": "H", "AA": "A", "MUTATION": "H177A", "ASSAY": "activity", "SCORE": -3.2}
  example: "DMS HLXK7:177:A:ACTIVITY"
  see-also: ["protein"]
  keywords: ["dms score", "deep mutational scan score", "protein engineering"]
  since: 2.9.11
match:
  kind: dms-score
  priority: 10
title:
  pill: Protein engineering · Deep mutational scan score
  id: $.SCORE_ID
strip:
- label: Score id
  bind: $.SCORE_ID
- label: Mutation
  bind: $.MUTATION
- label: Assay
  bind: $.ASSAY
- label: Score
  bind: $.SCORE
- label: Se
  bind: $.SE
  emphasis: true
panels:
- id: record
  kind: kv
  title: Deep mutational scan score
  columns:
  - label: Score id
    bind: $.SCORE_ID
  - label: Protein
    bind: link($.PROTEIN, 'protein')
  - label: Pos
    bind: $.POS
    fmt: amount0
  - label: Aa ref
    bind: $.AA_REF
  - label: Aa
    bind: $.AA
  - label: Mutation
    bind: $.MUTATION
  - label: Assay
    bind: $.ASSAY
  - label: Score
    bind: $.SCORE
  - label: Se
    bind: $.SE
  - label: Replicates
    bind: $.REPLICATES
    fmt: amount0
keys:
  F9: raw
