# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: residue
version: 1
description: 'Residue: One amino acid position of a protein: what it is, where it sits in the fold, how buried it is, whether it is in the active
  site, its place in space and the mean effect of changing it.'
doc:
  summary: One residue, as a record.
  description: 'One amino acid position of a protein: what it is, where it sits in the fold, how buried it is, whether it is in the active site,
    its place in space and the mean effect of changing it. Coordinates, burial and the means are written by the generator. The page is the plain
    record view: the strip gives the headline fields and the table every field, a linked field opens its kind; the showcase''s own screens are
    drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/residue/HLXK7:177
  - RESIDUE HLXK7:177
  since: 2.9.11
match:
  kind: residue
  priority: 10
title:
  pill: Protein engineering · Residue
  id: $.RESIDUE_ID
strip:
- label: Residue id
  bind: $.RESIDUE_ID
- label: Aa
  bind: $.AA
- label: Secondary
  bind: $.SECONDARY
- label: Domain
  bind: $.DOMAIN
- label: Burial
  bind: $.BURIAL
  emphasis: true
panels:
- id: record
  kind: kv
  title: Residue
  columns:
  - label: Residue id
    bind: $.RESIDUE_ID
  - label: Protein
    bind: link($.PROTEIN, 'protein')
  - label: Pos
    bind: $.POS
    fmt: amount0
  - label: Aa
    bind: $.AA
  - label: Secondary
    bind: $.SECONDARY
  - label: Domain
    bind: $.DOMAIN
  - label: Burial
    bind: $.BURIAL
  - label: Active site
    bind: $.ACTIVE_SITE
  - label: X
    bind: $.X
  - label: Y
    bind: $.Y
  - label: Z
    bind: $.Z
  - label: Mean activity
    bind: $.MEAN_ACTIVITY
  - label: Mean stability
    bind: $.MEAN_STABILITY
keys:
  F9: raw
