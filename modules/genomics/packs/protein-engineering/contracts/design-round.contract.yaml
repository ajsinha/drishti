# Data contract of the design-round kind (command DROUND): docs/contracts/README.md section 16.
# Written by tools/packgen/genomics_showcase/make.py from tools/packgen/genomics_showcase/spec.py: edit those, not this file.
kind: design-round
mnemonic: DROUND
pack: protein-engineering
version: '1.0'
class: fundamental
status: active
title: Design round
description: 'One round of the campaign: how the designs were made, how many, and how well the round did. Eight rounds.'
source: 'synthetic: the seeded generator tools/packgen/genomics_showcase/make.py (nothing real: the genes, patients, protein and designs are invented)'
grain: One row per protein and round, keyed by ROUND_ID.
key: &id001
- ROUND_ID
dated-by: snapshot
cadence:
  frequency: static
  due: regenerated only when the generator or its seed changes; the same documents on every business day
binding-hint:
  lake-table: protein-engineering.design-round
  columns:
  - ROUND_ID
  - PROTEIN
  - ROUND
  - METHOD
  test-data:
  - data/testdata/protein-engineering/design-round
fields:
- name: ROUND_ID
  type: id
  presence: required
  description: The protein, a dash, R and the round.
  example: HLXK7-R8
- name: PROTEIN
  type: id
  presence: required
  description: The protein; opens PROT.
  example: HLXK7
  link: protein
- name: ROUND
  type: integer
  presence: required
  description: The round, 1 to 8.
  example: 8
- name: METHOD
  type: text
  presence: required
  description: How the round's designs were chosen.
  example: Model-guided with the scan as the prior
- name: STARTED
  type: date
  presence: required
  description: The day the round started.
  example: '2026-04-20'
- name: DESIGNS
  type: integer
  presence: required
  unit: designs
  description: How many designs the round tested.
  example: 1500
- name: BEST_DESIGN
  type: id
  presence: required
  description: The round's best design; opens DESIGN.
  example: DSG-HLXK7-R8-0412
  link: design
- name: BEST_ACTIVITY
  type: amount
  presence: required
  unit: x natural
  description: Its activity.
  example: 15.2
- name: MEDIAN_ACTIVITY
  type: amount
  presence: required
  unit: x natural
  description: The median activity of the round's designs.
  example: 6.8
- name: TRAPPED
  type: integer
  presence: required
  unit: designs
  description: How many designs were caught on the false peak.
  example: 0
- name: NOTE
  type: text
  presence: required
  description: What happened in the round.
  example: The campaign reaches the summit.
links:
- field: PROTEIN
  kind: protein
- field: BEST_DESIGN
  kind: design
validation:
- rule: required
  fields:
  - ROUND_ID
  - PROTEIN
  - ROUND
  - METHOD
  - STARTED
  - DESIGNS
  - BEST_DESIGN
  - BEST_ACTIVITY
  - MEDIAN_ACTIVITY
  - TRAPPED
  - NOTE
- rule: unique
  key: *id001
  per: snapshot
- rule: link
  field: PROTEIN
  kind: protein
- rule: link
  field: BEST_DESIGN
  kind: design
notes:
- 'Synthetic and seeded: the same seed gives the same documents, byte for byte. Nothing in it is real: the gene, protein, patients and designs
  are invented, and every screen that shows it says so.'
- 'A snapshot: the same documents on every business day of the demo lake.'
review: []
