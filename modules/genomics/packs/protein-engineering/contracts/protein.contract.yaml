# Data contract of the protein kind (command PROT): docs/contracts/README.md section 16.
# Written by tools/packgen/genomics_showcase/make.py from tools/packgen/genomics_showcase/spec.py: edit those, not this file.
kind: protein
mnemonic: PROT
pack: protein-engineering
version: '1.0'
class: fundamental
status: active
title: Protein
description: 'One invented protein: its sequence, family and active site. Four proteins; Helixase-7, the enzyme of gene HLXK7 (312 amino acids),
  is the one the cohort screen and the design campaign are about.'
source: 'synthetic: the seeded generator tools/packgen/genomics_showcase/make.py (nothing real: the genes, patients, protein and designs are invented)'
grain: One row per protein, keyed by PROTEIN (the symbol of its gene).
key: &id001
- PROTEIN
dated-by: snapshot
cadence:
  frequency: static
  due: regenerated only when the generator or its seed changes; the same documents on every business day
binding-hint:
  lake-table: protein-engineering.protein
  columns:
  - PROTEIN
  - GENE
  - NAME
  - LENGTH
  - FAMILY
  - DESIGN_ROUNDS
  test-data:
  - data/testdata/protein-engineering/protein
fields:
- name: PROTEIN
  type: id
  presence: required
  description: 'The protein''s id: the symbol of its gene.'
  example: HLXK7
- name: GENE
  type: id
  presence: required
  description: The gene that codes for it; opens SGENE.
  example: HLXK7
  link: study-gene
- name: NAME
  type: text
  presence: required
  description: The protein's name.
  example: Helixase-7
- name: LENGTH
  type: integer
  presence: required
  unit: amino acids
  description: The amino acids in it.
  example: 312
- name: FAMILY
  type: text
  presence: required
  description: The family it belongs to.
  example: Helicase-like kinase
- name: SEQUENCE
  type: text
  presence: required
  description: The amino acid sequence, one letter each.
  example: MKTAYIAKQR
- name: ACTIVE_SITE
  type: vector
  presence: required
  description: The positions of the active site's residues.
- name: DESIGN_ROUNDS
  type: integer
  presence: required
  unit: rounds
  description: How many rounds of design the campaign ran on it; 0 for a protein never designed.
  example: 8
links:
- field: GENE
  kind: study-gene
validation:
- rule: required
  fields:
  - PROTEIN
  - GENE
  - NAME
  - LENGTH
  - FAMILY
  - SEQUENCE
  - ACTIVE_SITE
  - DESIGN_ROUNDS
- rule: unique
  key: *id001
  per: snapshot
- rule: link
  field: GENE
  kind: study-gene
- rule: vector-length
  field: ACTIVE_SITE
  same: every row of one business date
notes:
- 'Synthetic and seeded: the same seed gives the same documents, byte for byte. Nothing in it is real: the gene, protein, patients and designs
  are invented, and every screen that shows it says so.'
- 'A snapshot: the same documents on every business day of the demo lake.'
review: []
