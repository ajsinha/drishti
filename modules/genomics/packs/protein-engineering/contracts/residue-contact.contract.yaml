# Data contract of the residue-contact kind (command CONTACT): docs/contracts/README.md section 16.
# Written by tools/packgen/genomics_showcase/make.py from tools/packgen/genomics_showcase/spec.py: edit those, not this file.
kind: residue-contact
mnemonic: CONTACT
pack: protein-engineering
version: '1.0'
class: fundamental
status: active
title: Residue contact
description: 'Two positions of a protein that sit close in space though they are not neighbours in the chain: the contact map''s cells. The nearest
  pairs at least three positions apart, as many as the generator keeps for the protein.'
source: 'synthetic: the seeded generator tools/packgen/genomics_showcase/make.py (nothing real: the genes, patients, protein and designs are invented)'
grain: One row per contact, keyed by CONTACT_ID.
key:
- CONTACT_ID
dated-by: snapshot
cadence:
  frequency: static
  due: regenerated only when the generator or its seed changes; the same documents on every business day
binding-hint:
  lake-table: protein-engineering.residue-contact
  columns:
  - CONTACT_ID
  - PROTEIN
  - POS_A
  - POS_B
  test-data:
  - data/testdata/protein-engineering/residue-contact
fields:
- name: CONTACT_ID
  type: id
  presence: required
  description: The protein, a colon, the two positions joined by a dash.
  example: HLXK7:12-45
- name: PROTEIN
  type: id
  presence: required
  description: The protein; opens PROT.
  example: HLXK7
  link: protein
- name: POS_A
  type: integer
  presence: required
  description: The lower position.
  example: 12
- name: POS_B
  type: integer
  presence: required
  description: The higher position.
  example: 45
- name: DISTANCE
  type: amount
  presence: required
  unit: angstrom
  description: How far apart the two residues are.
  example: 5.9
links:
- field: PROTEIN
  kind: protein
validation:
- rule: required
  fields:
  - CONTACT_ID
  - PROTEIN
  - POS_A
  - POS_B
  - DISTANCE
- rule: unique
  key:
  - CONTACT_ID
  per: snapshot
- rule: link
  field: PROTEIN
  kind: protein
notes:
- 'Synthetic and seeded: the same seed gives the same documents, byte for byte. Nothing in it is real: the gene, protein, patients and designs
  are invented, and every screen that shows it says so.'
- 'A snapshot: the same documents on every business day of the demo lake.'
review: []
