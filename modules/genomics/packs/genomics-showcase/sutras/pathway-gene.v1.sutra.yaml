# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: pathway-gene
version: 1
description: 'Pathway membership: One gene in one biological pathway and the part it plays there.'
doc:
  summary: One pathway membership, as a record.
  description: 'One gene in one biological pathway and the part it plays there. Twelve invented pathways, 500 memberships. The page is the plain
    record view: the strip gives the headline fields and the table every field, a linked field opens its kind; the showcase''s own screens are
    drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/pathway-gene/PWG-0001
  - PATHWAY PWG-0001
  since: 2.9.11
match:
  kind: pathway-gene
  priority: 10
title:
  pill: Genomics · Pathway membership
  id: $.PATHWAY_GENE_ID
strip:
- label: Pathway gene id
  bind: $.PATHWAY_GENE_ID
- label: Pathway
  bind: $.PATHWAY
- label: Gene
  bind: link($.GENE, 'study-gene')
- label: Role in pathway
  bind: $.ROLE_IN_PATHWAY
  emphasis: true
panels:
- id: record
  kind: kv
  title: Pathway membership
  columns:
  - label: Pathway gene id
    bind: $.PATHWAY_GENE_ID
  - label: Pathway
    bind: $.PATHWAY
  - label: Gene
    bind: link($.GENE, 'study-gene')
  - label: Role in pathway
    bind: $.ROLE_IN_PATHWAY
keys:
  F9: raw
