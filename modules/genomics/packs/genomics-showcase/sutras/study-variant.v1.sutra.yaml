# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: study-variant
version: 1
description: 'Study variant: One variant site of the synthetic genome: its place, the change it makes to the gene''s protein (the amino acids
  before and after, the key into the protein workbench''s scan) and how many samples carry it.'
doc:
  summary: One study variant, as a record.
  description: 'One variant site of the synthetic genome: its place, the change it makes to the gene''s protein (the amino acids before and after,
    the key into the protein workbench''s scan) and how many samples carry it. The page is the plain record view: the strip gives the headline
    fields and the table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/study-variant/HX-004928
  - SVARIANT HX-004928
  category: "Genomics"
  tags: ["study-variant", "genomics", "record"]
  use-when: "You have one study variant (its id, or a link from another screen) and want to read it in full: one study variant, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One study variant record (kind study-variant); the page reads VARIANT_ID, GENE, CONSEQUENCE, IMPACT, CARRIERS, CHROM, POS, REF, ALT, PROTEIN_POS, AA_REF, AA_ALT."
    sample-row: {"VARIANT_ID": "HX-004928", "CHROM": "7", "POS": 92703082, "REF": "G", "ALT": "A", "GENE": "HLXK7", "CONSEQUENCE": "missense_variant", "IMPACT": "MODERATE"}
  example: "SVARIANT HX-004928"
  see-also: ["study-gene"]
  keywords: ["study variant", "genomics"]
  since: 2.9.11
match:
  kind: study-variant
  priority: 10
title:
  pill: Genomics · Study variant
  id: $.VARIANT_ID
strip:
- label: Variant id
  bind: $.VARIANT_ID
- label: Gene
  bind: link($.GENE, 'study-gene')
- label: Consequence
  bind: $.CONSEQUENCE
- label: Impact
  bind: $.IMPACT
- label: Carriers
  bind: $.CARRIERS
  fmt: amount0
  emphasis: true
panels:
- id: record
  kind: kv
  title: Study variant
  columns:
  - label: Variant id
    bind: $.VARIANT_ID
  - label: Chrom
    bind: $.CHROM
  - label: Pos
    bind: $.POS
    fmt: amount0
  - label: Ref
    bind: $.REF
  - label: Alt
    bind: $.ALT
  - label: Gene
    bind: link($.GENE, 'study-gene')
  - label: Consequence
    bind: $.CONSEQUENCE
  - label: Impact
    bind: $.IMPACT
  - label: Protein pos
    bind: $.PROTEIN_POS
    fmt: amount0
  - label: Aa ref
    bind: $.AA_REF
  - label: Aa alt
    bind: $.AA_ALT
  - label: Carriers
    bind: $.CARRIERS
    fmt: amount0
keys:
  F9: raw
