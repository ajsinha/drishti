# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: study-sample
version: 1
description: 'Study sample: One patient''s sample of the 1,500 of cohort ONC-1: the clinical tracks, the response to therapy, the cluster it belongs
  to and its place on the two-dimensional map of samples (precomputed, never projected at view time).'
doc:
  summary: One study sample, as a record.
  description: 'One patient''s sample of the 1,500 of cohort ONC-1: the clinical tracks, the response to therapy, the cluster it belongs to and
    its place on the two-dimensional map of samples (precomputed, never projected at view time). The page is the plain record view: the strip
    gives the headline fields and the table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/study-sample/S0001
  - SSAMPLE S0001
  category: "Genomics"
  tags: ["study-sample", "genomics", "record"]
  use-when: "You have one study sample (its id, or a link from another screen) and want to read it in full: one study sample, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One study sample record (kind study-sample); the page reads SAMPLE_ID, TUMOUR_TYPE, STAGE, RESPONSE, CLUSTER, COHORT, AGE_BAND, TOXICITY, RELAPSE, EMB_X, EMB_Y, MUTATION_COUNT."
    sample-row: {"SAMPLE_ID": "S0001", "COHORT": "ONC-1", "TUMOUR_TYPE": "Breast", "STAGE": "III", "AGE_BAND": "60-69", "RESPONSE": "non-responder", "TOXICITY": "severe", "RELAPSE": "relapsed"}
  example: "SSAMPLE S0001"
  keywords: ["study sample", "genomics"]
  since: 2.9.11
match:
  kind: study-sample
  priority: 10
title:
  pill: Genomics · Study sample
  id: $.SAMPLE_ID
strip:
- label: Sample id
  bind: $.SAMPLE_ID
- label: Tumour type
  bind: $.TUMOUR_TYPE
- label: Stage
  bind: $.STAGE
- label: Response
  bind: $.RESPONSE
- label: Cluster
  bind: $.CLUSTER
  emphasis: true
panels:
- id: record
  kind: kv
  title: Study sample
  columns:
  - label: Sample id
    bind: $.SAMPLE_ID
  - label: Cohort
    bind: $.COHORT
  - label: Tumour type
    bind: $.TUMOUR_TYPE
  - label: Stage
    bind: $.STAGE
  - label: Age band
    bind: $.AGE_BAND
  - label: Response
    bind: $.RESPONSE
  - label: Toxicity
    bind: $.TOXICITY
  - label: Relapse
    bind: $.RELAPSE
  - label: Cluster
    bind: $.CLUSTER
  - label: Emb x
    bind: $.EMB_X
  - label: Emb y
    bind: $.EMB_Y
  - label: Mutation count
    bind: $.MUTATION_COUNT
    fmt: amount0
keys:
  F9: raw
