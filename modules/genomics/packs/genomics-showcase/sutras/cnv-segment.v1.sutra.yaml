# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1.2
sutra: cnv-segment
version: 1
description: 'Copy-number segment: One stretch of a sample''s genome with a copy number other than two: an amplification or a deletion over a
  driver gene, or a broad gain or loss.'
doc:
  summary: One copy-number segment, as a record.
  description: 'One stretch of a sample''s genome with a copy number other than two: an amplification or a deletion over a driver gene, or a broad
    gain or loss. The page is the plain record view: the strip gives the headline fields and the table every field, a linked field opens its kind;
    the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/cnv-segment/CNV-00001
  - CNV CNV-00001
  category: "Genomics"
  tags: ["cnv-segment", "genomics", "record"]
  use-when: "You have one copy-number segment (its id, or a link from another screen) and want to read it in full: one copy-number segment, as a record."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One copy-number segment record (kind cnv-segment); the page reads SEGMENT_ID, SAMPLE_ID, CHROM, COPY_NUMBER, CALL, START, END, GENE."
    sample-row: {"SEGMENT_ID": "CNV-00001", "SAMPLE_ID": "S0002", "CHROM": "14", "START": 44226374, "END": 79520595, "COPY_NUMBER": 1, "CALL": "loss"}
  example: "CNV CNV-00001"
  see-also: ["study-sample", "study-gene"]
  keywords: ["cnv segment", "copy-number segment", "genomics"]
  since: 2.9.11
match:
  kind: cnv-segment
  priority: 10
title:
  pill: Genomics · Copy-number segment
  id: $.SEGMENT_ID
strip:
- label: Segment id
  bind: $.SEGMENT_ID
- label: Sample id
  bind: link($.SAMPLE_ID, 'study-sample')
- label: Chrom
  bind: $.CHROM
- label: Copy number
  bind: $.COPY_NUMBER
  fmt: amount0
- label: Call
  bind: $.CALL
  emphasis: true
panels:
- id: record
  kind: kv
  title: Copy-number segment
  columns:
  - label: Segment id
    bind: $.SEGMENT_ID
  - label: Sample id
    bind: link($.SAMPLE_ID, 'study-sample')
  - label: Chrom
    bind: $.CHROM
  - label: Start
    bind: $.START
    fmt: amount0
  - label: End
    bind: $.END
    fmt: amount0
  - label: Copy number
    bind: $.COPY_NUMBER
    fmt: amount0
  - label: Call
    bind: $.CALL
  - label: Gene
    bind: link($.GENE, 'study-gene')
keys:
  F9: raw
