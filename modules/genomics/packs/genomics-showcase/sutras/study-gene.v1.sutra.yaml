# Written by tools/packgen/genomics_showcase/make.py from the kinds table: the plain record view of the kind.
rachana: 1
sutra: study-gene
version: 1
description: 'Study gene: One gene of the synthetic genome: where it sits, what it does, how long its protein is and how many samples of the cohort
  carry a damaging change in it.'
doc:
  summary: One study gene, as a record.
  description: 'One gene of the synthetic genome: where it sits, what it does, how long its protein is and how many samples of the cohort carry
    a damaging change in it. 24 of the 2,000 genes are the planted drivers, led by HLXK7. The page is the plain record view: the strip gives the
    headline fields and the table every field, a linked field opens its kind; the showcase''s own screens are drawn from the same data.'
  params: {}
  emits: []
  expects: []
  examples:
  - /v/study-gene/HLXK7
  - SGENE HLXK7
  since: 2.9.11
match:
  kind: study-gene
  priority: 10
title:
  pill: Genomics · Study gene
  id: $.GENE
strip:
- label: Gene
  bind: $.GENE
- label: Chrom
  bind: $.CHROM
- label: Role
  bind: $.ROLE
- label: Protein length
  bind: $.PROTEIN_LENGTH
- label: Altered fraction
  bind: $.ALTERED_FRACTION
  emphasis: true
panels:
- id: record
  kind: kv
  title: Study gene
  columns:
  - label: Gene
    bind: $.GENE
  - label: Chrom
    bind: $.CHROM
  - label: Start
    bind: $.START
    fmt: amount0
  - label: End
    bind: $.END
    fmt: amount0
  - label: Strand
    bind: $.STRAND
  - label: Role
    bind: $.ROLE
  - label: Protein length
    bind: $.PROTEIN_LENGTH
  - label: Driver
    bind: $.DRIVER
  - label: Variants
    bind: $.VARIANTS
    fmt: amount0
  - label: Altered samples
    bind: $.ALTERED_SAMPLES
    fmt: amount0
  - label: Altered fraction
    bind: $.ALTERED_FRACTION
keys:
  F9: raw
