# Data contract of the variant-call kind (command VCALL): docs/contracts/README.md section 16.
# Written by tools/packgen/genomics_showcase/make.py from tools/packgen/genomics_showcase/spec.py: edit those, not this file.
kind: variant-call
mnemonic: VCALL
pack: genomics-showcase
version: '1.0'
class: fundamental
status: active
title: Variant call
description: 'One sample carrying one variant: the genotype, the fraction of reads that show it and the read depth. 45,000 calls over 1,500 samples;
  the association tests are computed from them.'
source: 'synthetic: the seeded generator tools/packgen/genomics_showcase/make.py (nothing real: the genes, patients, protein and designs are invented)'
grain: One row per sample and variant, keyed by CALL_ID.
key: &id001
- CALL_ID
id-pattern:
- ^CALL-
dated-by: snapshot
cadence:
  frequency: static
  due: regenerated only when the generator or its seed changes; the same documents on every business day
binding-hint:
  lake-table: genomics-showcase.variant-call
  columns:
  - CALL_ID
  - SAMPLE_ID
  - VARIANT_ID
  - GENE
  - GENOTYPE
  - VAF
  test-data:
  - data/testdata/genomics-showcase/variant-call
fields:
- name: CALL_ID
  type: id
  presence: required
  description: CALL- and six digits, in sample and variant order.
  example: CALL-012345
- name: SAMPLE_ID
  type: id
  presence: required
  description: The sample; opens SSAMPLE.
  example: S0042
  link: study-sample
- name: VARIANT_ID
  type: id
  presence: required
  description: The variant; opens SVARIANT.
  example: HX-004711
  link: study-variant
- name: GENE
  type: id
  presence: required
  description: The gene the variant lies in; opens SGENE.
  example: HLXK7
  link: study-gene
- name: GENOTYPE
  type: text
  presence: required
  description: 0/1 heterozygous, 1/1 homozygous for the variant.
  example: 0/1
  enum: &id002
  - 0/1
  - 1/1
- name: VAF
  type: rate
  presence: required
  unit: fraction
  description: 'The variant allele fraction: the share of reads that show the variant.'
  example: 0.412
- name: DEPTH
  type: integer
  presence: required
  unit: reads
  description: How many reads cover the site.
  example: 187
links:
- field: SAMPLE_ID
  kind: study-sample
- field: VARIANT_ID
  kind: study-variant
- field: GENE
  kind: study-gene
validation:
- rule: required
  fields:
  - CALL_ID
  - SAMPLE_ID
  - VARIANT_ID
  - GENE
  - GENOTYPE
  - VAF
  - DEPTH
- rule: unique
  key: *id001
  per: snapshot
- rule: link
  field: SAMPLE_ID
  kind: study-sample
- rule: link
  field: VARIANT_ID
  kind: study-variant
- rule: link
  field: GENE
  kind: study-gene
- rule: enum
  field: GENOTYPE
  values: *id002
notes:
- 'Synthetic and seeded: the same seed gives the same documents, byte for byte. Nothing in it is real: the gene, protein, patients and designs
  are invented, and every screen that shows it says so.'
- 'A snapshot: the same documents on every business day of the demo lake.'
review: []
