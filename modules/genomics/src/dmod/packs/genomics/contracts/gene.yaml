# The data contract of the kind gene (section 5.2).
contract-format: 1
kind: gene
version: "1.0"
binding-hint: computed by the module from gene.jsonl (one JSON object per gene) beside the VCF files, and the variants in the gene
fields:
  - {name: GENE, type: string, key: true, means: "the HGNC symbol"}
  - {name: CHROM, type: string}
  - {name: START, type: integer}
  - {name: PROTEIN_LENGTH, type: integer, means: "amino acids (the lollipop's axis)"}
  - {name: DOMAINS, type: list, means: "protein domains: NAME, FROM, TO"}
  - {name: VARIANTS, type: integer}
