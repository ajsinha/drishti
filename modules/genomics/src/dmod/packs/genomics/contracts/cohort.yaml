# The data contract of the kind cohort (section 5.2).
contract-format: 1
kind: cohort
version: "1.0"
binding-hint: computed by the module from the samples' cohorts (##SAMPLE Cohort) and the variants they carry
fields:
  - {name: COHORT_ID, type: string, key: true}
  - {name: SAMPLES, type: integer}
  - {name: MEMBERS, type: list}
  - {name: VARIANTS, type: integer, means: "variants carried by any member"}
  - {name: GENES, type: list, means: "genes those variants fall in"}
