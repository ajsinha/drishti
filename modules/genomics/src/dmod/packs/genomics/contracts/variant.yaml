# The data contract of the kind variant (section 5.2): no storage, a hint for the data administrator.
contract-format: 1
kind: variant
version: "1.0"
binding-hint: served by the module's own VCF reader (genomics-vcf) from VCF 4.x files; one row per position and alternate allele
fields:
  - {name: VARIANT_ID, type: string, key: true, means: "the VCF ID column, else CHROM-POS-REF-ALT"}
  - {name: CHROM, type: string}
  - {name: POS, type: integer, means: "1-based position on the chromosome (GRCh38)"}
  - {name: REF, type: string}
  - {name: ALT, type: string}
  - {name: QUAL, type: number}
  - {name: FILTER, type: string}
  - {name: GENE, type: string, means: "INFO GENE"}
  - {name: CONSEQUENCE, type: string, means: "INFO CSQ (missense_variant, stop_gained ...)"}
  - {name: IMPACT, type: string, means: "INFO IMPACT: HIGH, MODERATE or LOW"}
  - {name: PROTEIN_POS, type: integer, means: "INFO AAPOS: the amino acid position (the lollipop's x)"}
  - {name: CARRIERS, type: integer, means: "samples with a non-reference genotype"}
  - {name: AF, type: number, means: "CARRIERS over the samples genotyped"}
  - {name: SAMPLES, type: list, means: "the carriers' sample ids"}
