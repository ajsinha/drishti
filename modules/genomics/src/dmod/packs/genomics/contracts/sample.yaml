# The data contract of the kind sample (section 5.2).
contract-format: 1
kind: sample
version: "1.0"
binding-hint: served by the module's own VCF reader from each file's sample columns and their ##SAMPLE lines
fields:
  - {name: SAMPLE_ID, type: string, key: true}
  - {name: COHORT, type: string, means: "##SAMPLE Cohort"}
  - {name: SEX, type: string}
  - {name: POPULATION, type: string}
  - {name: VARIANTS, type: integer, means: "variants the sample carries"}
