# The module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3). Its id and version are the pom's (drishti:validate).
# The genomics sample (docs/architecture/DISTRIBUTIONS.md section 4): a third party's module built from the Module SDK alone; it uses
# drishti-kernel-api and the plugin API (com.ash.drishti.api) and nothing else of the kernel (conformance C1).
format: 1
id: genomics
version: 0.1.0
title: Genomics
about: Variants, genes, samples and cohorts read from VCF files by the module's own reader; synthetic samples; the variant lollipop visual
domain: genomics
publisher: {name: Helix Lab (a sample publisher), id: org.helixlab}
licence: {feature: genomics}
kernel: ">=0.2 <1.0"
rachana: ">=1.0"
contracts: ">=1.0"
plugin-api: ">=2.0"
elements: ">=1.4 <2"
provides: {kinds: {genomics: [variant, sample, gene, cohort]}}
api: {prefix: genomics}
java: {jars: [genomics.jar], lib: [], entry: org.helixlab.genomics.GenomicsModule, spring: [org.helixlab.genomics.ModuleConfig]}
console: {plugin: console/plugin.yaml, menus: [genomics]}
data: {needs: data/needs.yaml}
functions: [{word: VARIANT}, {word: GENE}, {word: COHORT}]
docs:
  readme: docs/README.md
  help: docs/help.yaml
  guides: [docs/guide.md]
  tutorials: [docs/tutorial.md]
  domains: [genomics]
resources: {memory-mb: 64}
