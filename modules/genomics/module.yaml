# The module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3). Its id and version are the pom's (drishti.py module verify --manifest-only).
# The genomics sample (docs/architecture/KERNEL_AND_MODULES.md section 4): a third party's module built from the Module SDK alone; it uses
# drishti-kernel-api and the plugin API (com.ash.drishti.api) and nothing else of the kernel (conformance C1).
format: 1
id: genomics
version: 0.1.0
title: Genomics
about: Variants, genes, samples and cohorts read from the genomics lake (the loader puts your VCF files and tables there); synthetic samples; the variant lollipop visual; the
  showcase's two packs, genomics-showcase and protein-engineering (a seeded, invented cohort and protein campaign of 200,000 rows)
domain: genomics
publisher: {name: Helix Lab (a sample publisher), id: org.helixlab}
licence: {feature: genomics}
# shipped with the product (packaging/dist packs it beside the others): its hash list is in first-party.yaml, so it installs by default, and
# the distribution files decide who sees it. It still reaches no kernel internals: no allowance, and C1 is the same.
origin: first-party
kernel: ">=0.2 <1.0"
rachana: ">=1.0"
contracts: ">=1.0"
plugin-api: ">=2.0"
elements: ">=3.3 <4"
provides:
  kinds:
    genomics: [variant, sample, gene, cohort]
    genomics-showcase: [study-gene, study-sample, study-variant, variant-call, association, cnv-segment, pathway-gene]
    protein-engineering: [protein, residue, residue-contact, dms-score, design, design-mutation, design-round]
packs: {folder: packs, list: [genomics, genomics-showcase, protein-engineering]}
api: {prefix: genomics}
java: {jars: [genomics.jar], lib: [], entry: org.helixlab.genomics.GenomicsModule, spring: [org.helixlab.genomics.ModuleConfig]}
console: {plugin: console/plugin.yaml, menus: [genomics]}
data: {needs: data/needs.yaml}
functions: [{word: VARIANT}, {word: GENE}, {word: COHORT}, {word: GWAS}, {word: PROTEIN}, {word: DESIGNS}]
docs:
  readme: docs/README.md
  help: docs/help.yaml
  guides: [docs/guide.md]
  tutorials: [docs/guide.md]
  domains: [genomics]
resources: {memory-mb: 64}
