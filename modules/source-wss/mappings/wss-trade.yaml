format: 1
system: WSS
kind: trade
about: WSS native fields to the canonical trade fields. A path is a dotted path into the native document; first-of takes the first present; values
  translates a code; scale multiplies; as reads a date or time written in another form.
map:
  TRADE_ID: dealRef
  TRADE_VERSION: dealVer
  TRADE_STATUS:
    from: dealState
    values:
      Verified: NEW
      Amended: AMENDED
      Cancelled: CANCELLED
  PRODUCT_TYPE: dealType
  PRODUCT_GROUP:
    from: family
    values:
      FX: FX
      MONEY: Money markets
      TREASURY: Treasury
  BUY_SELL_CODE:
    from: dir
    values:
      BUY: B
      SELL: S
  QUANTITY:
    first-of:
    - buyAmt
    - principal
  PRICE:
    first-of:
    - rate
    - ratePct
  CURRENCY:
    first-of:
    - buyCcy
    - ccy
  COUNTERPARTY: cpty.code
  LEGAL_ENTITY: legalEntity
  PORTFOLIO: bookRef
  TRADER_ID: dealer
  TRADE_DATE: tradedOn
  START_DATE: valueDate
  MATURITY_DATE: maturityDate
  SOURCE_UPDATE_TIME: lastUpd
