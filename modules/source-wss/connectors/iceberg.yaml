# Template: copy to config/connectors/trade-wss.yaml to read WSS's trades from Iceberg (the shared table trading.trades_shared, split by where:).
# The lake (config/lakes/iceberg.yaml) is config/lakes.examples/iceberg/iceberg.yaml. Credentials are ${ENV_VAR} references.
plugin: iceberg
kinds:
- trade
description: WSS trades read from Iceberg
settings:
  lake: iceberg
  lake-tables: trading.trades_shared
  union: true
  source-name: trade-wss
  where: SOURCE_SYSTEM = 'WSS'
  set:
    SOURCE_SYSTEM: WSS
  map: mappings/wss-trade.yaml
