# Template: copy to config/connectors/trade-wss.yaml to read WSS's trades from JSON Lines files under the files root.
plugin: file
kinds:
- trade
description: WSS trades read from files
settings:
  root: ${DRISHTI_FILES_ROOT:${drishti.data.dir:./data}/files}
  domain: trading
  source-name: trade-wss
  where: SOURCE_SYSTEM = 'WSS'
  set:
    SOURCE_SYSTEM: WSS
  map: mappings/wss-trade.yaml
