# The template of trade-wss-live (a module that is on brings it; KERNEL_AND_MODULES.md section 18.5): off until DRISHTI_STREAM_<SYSTEM>=true or a site override (config/connectors/trade-wss-live.yaml: enabled: true) switches it on.
# WSS's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
# trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
# until an administrator switches them on (Admin -> Edits).
name: trade-wss-live                      # the connector this template defines (KERNEL_AND_MODULES.md section 18.5)
plugin: kafka
companion-of: trade-wss                  # the data connector whose rows this feed changes (docs/architecture/LIVE_CONNECTORS_DESIGN.md section 2.2)
enabled: ${DRISHTI_STREAM_WSS:false}
kinds:
- trade
description: WSS's live trades, and the trade blotter's amendments written back to them
settings:
  broker: default
  topics:
  - ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
  stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
  source-name: trade-wss-live
  where: SOURCE_SYSTEM = 'WSS'
  set:
    SOURCE_SYSTEM: WSS
  map: mappings/wss-trade.yaml
writes:
  amend-trade:                          # the trade blotter's command (modules/trading/blotters/trade.blotter.yaml): one name, each system's own connector
    kind: trade
    kafka:
      topic: ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
      shape: document
      version-field: DEAL_VERSION
      changed-by: UPDATED_BY
      changed-at: LAST_UPD
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
