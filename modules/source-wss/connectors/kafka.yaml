# Template: copy to config/connectors/trade-wss-live.yaml and bind the kind with live: trade-wss-live in config/bindings.yaml.
# WSS's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
# trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
# until an administrator switches them on (Admin -> Edits).
plugin: kafka
enabled: ${DRISHTI_STREAM_WSS:false}
kinds:
- trade
description: WSS's live trades, and the trade blotter's amendments written back to them
settings:
  bootstrap-servers: ${DRISHTI_KAFKA_BOOTSTRAP:localhost:9092}
  topics:
  - ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
  kind: trade
  id-field: dealRef
  stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
  source-name: trade-wss-live
  where: SOURCE_SYSTEM = 'WSS'
  set:
    SOURCE_SYSTEM: WSS
  map: mappings/wss-trade.yaml
writes:
  amend-wss-trade:
    kind: trade
    kafka:
      topic: ${DRISHTI_WSS_TOPIC:drishti.trading.wss.trades}
      shape: document
      version-field: dealVer
      changed-by: UPDATED_BY
      changed-at: lastUpd
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
