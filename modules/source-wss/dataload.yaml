# The inbox routing rules of the WSS source module (same format as config/dataload.yaml; the inbox reads a module's rules after the site's own).
# A file named wss-<date>.jsonl.gz goes to the trade-wss table; the connector's set: stamps SOURCE_SYSTEM = WSS into each stored row.
dataload:
  rules:
  - match: "wss-*.jsonl.gz"
    pack: trading
    kind: trade
    connector: trade-wss
    date-from: name
    date-pattern: '-(\d{4}-\d{2}-\d{2})\.'          # the date inside the name: one capture group, YYYY-MM-DD (date-format: YYYYMMDD for 20261103)
    key: DEAL_REF
