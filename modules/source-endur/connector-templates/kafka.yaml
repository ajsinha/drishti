# Template: copy to config/connectors/trade-endur-live.yaml and bind the kind with live: trade-endur-live in config/bindings.yaml.
# Endur's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
# trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
# until an administrator switches them on (Admin -> Edits).
plugin: kafka
enabled: ${DRISHTI_STREAM_ENDUR:false}
kinds:
- trade
description: Endur's live trades, and the trade blotter's amendments written back to them
settings:
  bootstrap-servers: ${DRISHTI_KAFKA_BOOTSTRAP:localhost:9092}
  topics:
  - ${DRISHTI_ENDUR_TOPIC:drishti.trading.endur.trades}
  kind: trade
  id-field: TRADE_ID
  stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
  source-name: trade-endur-live
writes:
  amend-endur-trade:
    kind: trade
    kafka:
      topic: ${DRISHTI_ENDUR_TOPIC:drishti.trading.endur.trades}
      shape: document
      version-field: TRADE_VERSION
      changed-by: UPDATED_BY
      changed-at: SOURCE_UPDATE_TIME
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
