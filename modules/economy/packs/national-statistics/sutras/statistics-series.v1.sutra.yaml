# Built from the Drishti UI kit only (config/ui-kit/fragments): no screen code of its own.
rachana: 1
sutra: statistics-series
version: 1
description: "One Statistics Canada series by vector: the latest value, the change on the period and the year, the history."
doc:
  summary: "A national statistic: its latest value and period, the change on the period and on the year, the release time, the history."
  description: >-
    One page per Statistics Canada vector the national-statistics feed follows (prices, labour, output, population, housing, money
    markets): the strip gives the latest value with its period and unit, the change on the previous period in units and per cent, the
    change on the year in per cent and the release time; the chart draws the history; the table and the source close the page.
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/statistics-series/NSTAT-V41690973"
    - "NSTAT NSTAT-V41690973"
  since: "2.9.11"
match: { kind: statistics-series, priority: 10 }
title: { pill: Public sector · National statistic, id: $.SERIES_ID, with: $.TITLE }
strip:
  - { label: Latest, bind: $.LATEST, fmt: amount2, emphasis: true }
  - { label: Unit, bind: $.UNIT }
  - { label: Period, bind: $.LATEST_PERIOD }
  - { label: Change, bind: $.CHANGE, fmt: signed2 }
  - { label: "Change, %", bind: $.CHANGE_PCT, fmt: signed2 }
  - { label: "On the year, %", bind: $.YEAR_ON_YEAR_PCT, fmt: signed2 }
  - { label: Released, bind: $.RELEASED }
panels:
  - { use: series-line@1, with: { id: history, title: History, key: F2, rows: $.HISTORY, x: PERIOD, y: VALUE, fmt: amount2 } }
  - id: about
    kind: kv
    title: About this series
    area: right
    columns:
      - { label: Topic, bind: $.TOPIC }
      - { label: Table, bind: $.TABLE_ID }
      - { label: Table title, bind: $.TABLE_TITLE }
      - { label: Members, bind: $.MEMBERS }
      - { label: Vector, bind: $.VECTOR }
      - { label: Frequency, bind: $.FREQUENCY }
      - { label: Scale, bind: $.SCALE }
  - { use: source-footer@1 }
keys: { F9: raw }
