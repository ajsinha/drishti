# What the packer brings in from the repository (paths from this folder) and what it trims from the module's own folder, so each file keeps
# one home: `trim` strips a pack of what a module does not carry (its connector templates: a module carries no connector; tests, tools,
# samples), `copy` brings in the lens and the tutorial. This list itself is not packed.
trim:
- path: packs/world-economy
  leave-out:
  - tests
  - tools
  - samples
  sections-out:
  - connectors
- path: packs/news-and-markets
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/world-development
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/central-banks
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/national-statistics
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/oecd
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/official-news
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
- path: packs/gdelt-events
  leave-out:
  - tests
  - tools
  sections-out:
  - connectors
copy:
- from: ../../config/lenses/economy/world.yaml
  to: lenses/world.yaml
- from: ../../docs/tutorials/14-public-sector-data.md
  to: tutorials/14-public-sector-data.md
