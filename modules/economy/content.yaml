# What the packer brings in from the repository (paths from this folder) and what it trims from the module's own folder, so each file keeps
# one home: `trim` strips a pack of what a module does not carry (tests, tools; never its samples, the records a read falls back to when no lake
# is built, so an install answers what the source tree answers; its connector templates travel
# with it, the read-only templates the site's connector files are merged over), `copy` brings in the lens and the tutorial. This list itself is not packed.
trim:
- path: packs/world-economy
  leave-out:
  - tests
  - tools
- path: packs/news-and-markets
  leave-out:
  - tests
  - tools
- path: packs/world-development
  leave-out:
  - tests
  - tools
- path: packs/central-banks
  leave-out:
  - tests
  - tools
- path: packs/national-statistics
  leave-out:
  - tests
  - tools
- path: packs/oecd
  leave-out:
  - tests
  - tools
- path: packs/official-news
  leave-out:
  - tests
  - tools
- path: packs/gdelt-events
  leave-out:
  - tests
  - tools
# Files the package may never carry, each with the licence reason (the packer refuses a restriction with no reason, or one that names
# no file): the IMF World Economic Outlook figures are for internal demos only. The rest of world-economy's samples travel (JUR-AUS...).
restricted:
- path: packs/world-economy/samples/catalog.jsonl
  reason: IMF World Economic Outlook data, internal demos only; never shipped
- path: packs/world-economy/samples/economic-forecast.jsonl
  reason: IMF World Economic Outlook data, internal demos only; never shipped
- path: packs/world-economy/samples/economy.jsonl
  reason: IMF World Economic Outlook data, internal demos only; never shipped
- path: packs/world-economy/samples/fiscal-position.jsonl
  reason: IMF World Economic Outlook data, internal demos only; never shipped
- path: packs/world-economy/samples/macro-indicator.jsonl
  reason: IMF World Economic Outlook data, internal demos only; never shipped
copy:
- from: ../../config/lenses/economy/world.yaml
  to: lenses/world.yaml
- from: ../../docs/guides/WORLD_DATA_GUIDE.md
  to: guides/WORLD_DATA_GUIDE.md
