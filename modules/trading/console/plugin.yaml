# The trading module's console part (plugin.yaml format 2): its menu. The blotter's page is the kernel's page for any declaration,
# /live/<id> (the live mode of drishti-grid), so the module declares no route of its own; the menu entry links to it.
format: 2
module: trading
title: Trading
routes: []
menus:
  - {menu: blotter, column: Trades, label: "Trade blotter", href: /live/trade, icon: table, desc: "Trades ticking as they arrive, edited with a reason, written back to the source"}
