# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1.2
sutra: cert-deposit
version: 1
description: "Bank time deposit in negotiable form."
doc:
  summary: "Bank time deposit in negotiable form."
  description: >-
    Bank time deposit in negotiable form. One deal screen per CALYPSO Certificate of deposit trade (matched on SOURCE_SYSTEM and
    PRODUCT_TYPE): the deal ticket (DES), the legs side by side, every cash flow in one schedule, the events by leg and as a
    table filtered by the Legs and Between controls, the netted payment ladder and payments by month, how the view was built and
    the linked entities (F7 opens the counterparty's trades). The strip gives the trade currency, side, notional, quantity,
    trade date, maturity, status and portfolio.
  params:
    legs: { type: text, default: all, meaning: "The Legs control: the legs whose events the table lists" }
    when: { type: text, default: '', meaning: "The Between control: the dates whose events the table lists" }
  emits: []
  expects: []
  examples:
    - "/v/trade/CLY-3000247"
    - "TRD CLY-3000247"
  category: "Money market"
  tags: ["trade", "money-market"]
  use-when: "You have one certificate of deposit (its id, or a link from another screen) and want to read it in full: bank time deposit in negotiable form."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One certificate of deposit record (kind trade, SOURCE_SYSTEM = CALYPSO, PRODUCT_TYPE = CERT_DEPOSIT); the page reads TRADE_ID, COUNTERPARTY, RISK_LINKS, CURRENCY, BUY_SELL_CODE, LEGS, QUANTITY, TRADE_DATE, MATURITY_DATE, TRADE_STATUS, TRADE_VERSION, PORTFOLIO."
    sample-row: {"SOURCE_SYSTEM": "CALYPSO", "SOURCE_UPDATE_TIME": "2026-09-30T18:30:00Z", "TRADE_DATE": "2026-09-22", "INPUT_DATE": "2026-09-22", "TRADE_ID": "CLY-3000247", "TRADE_STATUS": "VALIDATED", "TRADE_ACTION": "NEW", "TRADE_VERSION": "1"}
  example: "TRD CLY-3000247"
  see-also: ["counterparty-trades", "book", "counterparty"]
  keywords: ["trade", "certificate of deposit", "money market"]
  since: "2.7.0"
match: { kind: trade, where: "$.SOURCE_SYSTEM == 'CALYPSO' && $.PRODUCT_TYPE == 'CERT_DEPOSIT'", priority: 10 }
title: { pill: "Money market · Certificate of deposit", id: $.TRADE_ID, with: "link($.COUNTERPARTY, 'counterparty')" }
strip:
  - { label: Trade currency, bind: "nonblank($.RISK_LINKS.TRADE_CURRENCY) ? $.RISK_LINKS.TRADE_CURRENCY + ($.RISK_LINKS.TRADE_CURRENCY_FROM == 'its scenario PVs' ? ' · as priced' : ' · as booked') : nonblank($.CURRENCY, '–') + ' · as booked'" }
  - { label: Side, bind: "$.BUY_SELL_CODE == 'B' ? 'Buy' : ($.BUY_SELL_CODE == 'S' ? 'Sell' : nonblank($.BUY_SELL_CODE, '–'))" }
  - { label: Notional, bind: "$.CURRENCY + ' ' + fmt(first($.LEGS).NOTIONAL, 'amount0')", emphasis: true }
  - { label: Quantity, bind: "fmt($.QUANTITY, 'amount0') + (nonblank(first($.LEGS).PRICE_UNIT) ? ' ' + first($.LEGS).PRICE_UNIT : '')" }
  - { label: Trade date, bind: $.TRADE_DATE, fmt: date }
  - { label: Maturity, bind: $.MATURITY_DATE, fmt: date }
  - { label: Status, bind: "nonblank($.TRADE_STATUS, '–') + (nonblank($.TRADE_VERSION) ? ' v' + $.TRADE_VERSION : '')", tone: status }
  - { label: Portfolio, bind: "link($.PORTFOLIO, 'book')" }
controls:                       # the events by leg and by date: a trader's 'what is paid when, on which leg'
  - { id: legs, kind: multi-select, label: Legs, options: "$.LEGS[*].LEG_ID", default: all, placement: header, panel: event-list, remember: user }
  - { id: when, kind: date-range, label: Between, placement: header, panel: event-list }
panels:
  - { use: trading/deal-ticket@1, with: { rate-fmt: pct4, product: "Certificate of deposit" } }
  - { use: trading/legs@1, with: { rate-fmt: pct4 } }
  - { use: trading/flow-schedule@1, with: { rate-fmt: pct4 } }
  - { use: trading/events@1 }
  - { use: trading/payments@1 }
  - { use: data-provenance@1 }
  - { use: risk-links@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.COUNTERPARTY, 'counterparty-trades')", F8: impact, F9: raw }
