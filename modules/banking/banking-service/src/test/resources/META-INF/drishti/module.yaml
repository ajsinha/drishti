# The banking module's manifest (docs/architecture/ACCESS_MODEL.md, DOMAIN_MODULES.md): shipped in its jar, so the module is installed
# exactly when the jar is on the class path. The access registry reads it; nothing else does. A site switches the module with
# config/modules/banking.yaml (enabled: true|false, written by POST /api/v1/admin/modules) or DRISHTI_MODULES_BANKING_ENABLED; a licence names it by its feature.
# Off (not installed, not licensed or switched off): no bean, engine, job or API of it is loaded, its packs and connectors do not load, its
# functions are gone, and its API answers 404 DRS-1025.
module:
  id: banking
  domain: banking
  title: Banking and risk
  about: "VaR and ES (historical, parametric, regulatory), exposure and CCR, FRTB-SA, ISDA SIMM, sensitivities, the MR cube, the official risk results"
  feature: banking
  enabled: true
  requires: [market-data]                 # the market-data module (modules/market-data): the engines read its curves and surfaces
  contributes:
    packages: [com.ash.drishti.banking]
    engines: [var, exposure, sensitivities, frtb-sa, simm, mr-cube]
    packs: [trading, market-risk, counterparty-risk]
    # what a distribution's visibility filter reads besides the packs and functions (DISTRIBUTIONS.md): the top menus and Help it owns
    menus: [blotter, positions, risk, counterparties]
    help: [banking]
    connectors: [var-engine, var-positions, var-pv-stream, exposure-engine]
    # the API (the old prefixes beside the new: answered for one release by the module, and refused with it when the module is off)
    api: [/api/v1/risk, /api/v1/var, /api/v1/exposure, /api/v1/frtb, /api/v1/simm, /api/v1/sensitivities, /api/v1/risk-factors, /api/v1/pivot/mr]
    # the functions (command words): the engines' words with the APIs behind them, then the packs' commands (their kinds' own APIs); the
    # market-data pack's commands are the market-data module's functions
    functions:
      - {word: VAR, api: [/api/v1/risk/var]}
      - PVAR
      - SMAT
      - SWIN
      - {word: PREDEAL, api: [/api/v1/risk/exposure/predeal]}
      - {word: EXP, api: [/api/v1/risk/exposure]}
      - {word: FRSA, api: [/api/v1/risk/frtb]}
      - {word: SIMM, api: [/api/v1/risk/simm]}
      - {word: MCUBE, api: [/api/v1/risk/mr]}
      - {word: SENS, api: [/api/v1/risk/sensitivities]}
      - {word: RFAC, api: [/api/v1/risk/risk-factors]}
      - PLAY                               # the playgrounds (PLAY VAR, PLAY FRTB, PLAY SIMM, PLAY EXP)
      - CCUBE                              # the counterparty cube
      # trading
      - TRD
      - CTRD
      - PTRD
      - LTRD
      - ITRD
      # market-risk
      - SCN
      - STR
      - FRTB
      - PNL
      - TVAL
      - POS
      - PORT
      - PNLV
      - SPV
      - FXS
      - SSET
      - VLIM
      - DPNL
      - PNLH
      - VRES
      - VOFF
      - SSPNL
      # counterparty-risk
      - AGR
      - CSA
      - NSET
      - LIM
      - CVA
      - SACCR
      - COLL
      - MC
      - XRUN
      - XPATH
      - XOFC
      - NSMTM
      - CPMTM
