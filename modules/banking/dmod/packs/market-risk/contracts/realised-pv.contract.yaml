# Planned data contract of the realised-pv input (proposed command RPV): docs/architecture/MARKET_RISK_I6_DESIGN.md section 6.
kind: realised-pv
mnemonic: RPV
pack: market-risk
version: '1.0'
class: input
status: planned
title: 'Realised-move PV of a position (the risk model, daily)'
description: 'The risk model''s value of each position of the previous business date under the market move that was realised on the
  business date: the same pricers, risk factors and approximations as the scenario PVs, applied to one more scenario, the day that
  happened. Drishti computes the risk-theoretical P&L (RTPL) from it: RTPL = REALISED_PV x FX(business date) - BASE_PV x FX(position
  date), or takes RTPL as sent (VALUE_TYPE PNL). It is its own kind and does not ride in scenario-pv: a scenario-PV row is valued on
  its business date for positions of that date and carries a vector of the window''s length, while this row is one number valued one day
  later for positions that are already history. Planned: no command, no data and no engine reads it yet.'
source: The bank's risk engine (the run that produces the scenario PVs, one day later)
grain: One row per position (GRAIN POSITION) or trade (GRAIN TRADE) and BUSINESS_DATE (the day the market moved), keyed by REALISED_PV_ID
  (RPV-<POSITION_ID or TRADE_ID>-<BUSINESS_DATE>); one complete file per date.
key:
- REALISED_PV_ID
id-pattern:
- ^RPV-
list:
  requires: [POSITION_ID, TRADE_ID, TT_BOOK, DESK]
  why: 'realised-move PVs are per position: give a position, trade, book or desk'
dated-by: BUSINESS_DATE
cadence:
  frequency: daily
  due: with the scenario PVs of the business date (the same run prices yesterday's positions on today's market)
binding-hint:
  lake-table: risk.realised-pv
  partition:
  - BUSINESS_DATE
  columns:
  - REALISED_PV_ID
  - VALUE_TYPE
  - GRAIN
  - POSITION_ID
  - TRADE_ID
  - POSITION_DATE
  - SOURCE_SYSTEM
  - LEGAL_ENTITY
  - DESK
  - TT_BOOK
  - REGULATORY_DESK_ID
  - CURRENCY
  - BASE_PV
  - REALISED_PV
  - RTPL
  - STATUS
  - BATCH_ID
  - COMPUTED_AT
fields:
- name: REALISED_PV_ID
  type: id
  presence: required
  description: The row's id, RPV-<POSITION_ID or TRADE_ID>-<BUSINESS_DATE> (the business key).
  example: RPV-POS-BOOK-RATES-1~MX-20000002-2026-09-30
  pattern: ^RPV-
- name: VALUE_TYPE
  type: text
  presence: required
  description: 'What the values are: PV (BASE_PV and REALISED_PV in CURRENCY, converted by Drishti) or PNL (RTPL as sent, in CURRENCY).
    The same form as the source system''s scenario rows.'
  example: PV
  enum: [PV, PNL]
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The day the market moved (YYYY-MM-DD): REALISED_PV is valued on this date''s closing risk factors.'
  example: '2026-09-30'
- name: POSITION_DATE
  type: date
  presence: required
  description: The business date whose end-of-day positions are valued (the business day before BUSINESS_DATE); BASE_PV is the BASE_PV
    of that date's scenario-pv row, and a difference beyond the tolerance is a warning naming both.
  example: '2026-09-29'
- name: GRAIN
  type: text
  presence: required
  description: POSITION (its POSITION_ID) or TRADE (its TRADE_ID), the grain of the source system's scenario PVs.
  example: POSITION
  enum: [TRADE, POSITION]
- name: POSITION_ID
  type: id
  presence: optional
  description: The position, at GRAIN POSITION (required then).
  example: POS-BOOK-RATES-1~MX-20000002
  pattern: ^POS-
  link: position
- name: TRADE_ID
  type: id
  presence: optional
  description: The trade, at GRAIN TRADE (required then).
  example: MX-20000002
  link: trade
- name: SOURCE_SYSTEM
  type: text
  presence: required
  description: The system that produced the row.
  example: MUREX
- name: LEGAL_ENTITY
  type: id
  presence: required
  description: The legal entity of the position on POSITION_DATE. Must be a promoted column.
  example: LE-NY
  pattern: ^LE-
  link: legal-entity
- name: DESK
  type: id
  presence: required
  description: The desk of the position on POSITION_DATE. Must be a promoted column.
  example: DESK-RATES
  pattern: ^DESK-
  link: desk
- name: TT_BOOK
  type: id
  presence: required
  description: The book of the position on POSITION_DATE. Must be a promoted column.
  example: BOOK-RATES-1
  pattern: ^BOOK-
  link: book
- name: REGULATORY_DESK_ID
  type: id
  presence: optional
  description: The regulatory trading desk when it differs from DESK.
  example: RD-RATES-NY
- name: CURRENCY
  type: text
  presence: required
  description: The currency of the values (ISO 4217).
  example: EUR
- name: BASE_PV
  type: amount
  presence: optional
  unit: CURRENCY
  description: The risk model's PV at the close of POSITION_DATE (required at VALUE_TYPE PV).
  example: 1120300.0
- name: REALISED_PV
  type: amount
  presence: optional
  unit: CURRENCY
  description: The risk model's PV of the same position on BUSINESS_DATE's closing risk factors, the valuation date moved by one day as
    the bank's HPL does (required at VALUE_TYPE PV unless STATUS is failed).
  example: 1066150.0
- name: RTPL
  type: amount
  presence: optional
  unit: CURRENCY
  description: The risk-theoretical P&L as sent (required at VALUE_TYPE PNL unless STATUS is failed); at VALUE_TYPE PV it is derived by
    Drishti and an upstream value is ignored.
  example: -54150.0
- name: RISK_MODEL
  type: text
  presence: required
  description: The risk model and version that valued the row; it must be the model of the date's scenario PVs (the P&L attribution
    test compares the model that produces the capital figure, not another).
  example: demo-factor-model/demo-2
- name: STATUS
  type: text
  presence: required
  description: ok, proxied or failed (no value; counted and named, never taken as zero).
  example: ok
  enum: [ok, proxied, failed]
- name: BATCH_ID
  type: id
  presence: required
  description: The run that produced the row.
  example: B-RPV-2026-09-30-01
- name: COMPUTED_AT
  type: timestamp
  presence: required
  description: When the run produced the row (UTC).
  example: '2026-10-01T05:55:00Z'
links:
- field: POSITION_ID
  kind: position
- field: TRADE_ID
  kind: trade
- field: LEGAL_ENTITY
  kind: legal-entity
- field: DESK
  kind: desk
- field: TT_BOOK
  kind: book
validation:
- rule: required
  fields:
  - REALISED_PV_ID
  - VALUE_TYPE
  - BUSINESS_DATE
  - POSITION_DATE
  - GRAIN
  - SOURCE_SYSTEM
  - LEGAL_ENTITY
  - DESK
  - TT_BOOK
  - CURRENCY
  - RISK_MODEL
  - STATUS
  - BATCH_ID
  - COMPUTED_AT
- rule: unique
  key:
  - REALISED_PV_ID
  per: BUSINESS_DATE
- rule: pattern
  field: REALISED_PV_ID
  pattern: ^RPV-
- rule: enum
  field: VALUE_TYPE
  values: [PV, PNL]
- rule: enum
  field: GRAIN
  values: [TRADE, POSITION]
- rule: enum
  field: STATUS
  values: [ok, proxied, failed]
notes:
- 'JSON Lines, one row per line (UTF-8; .jsonl or .jsonl.gz). Example line: {"REALISED_PV_ID":"RPV-POS-BOOK-RATES-1~MX-20000002-2026-09-30","VALUE_TYPE":"PV","BUSINESS_DATE":"2026-09-30","POSITION_DATE":"2026-09-29","GRAIN":"POSITION","POSITION_ID":"POS-BOOK-RATES-1~MX-20000002","SOURCE_SYSTEM":"MUREX","LEGAL_ENTITY":"LE-NY","DESK":"DESK-RATES","TT_BOOK":"BOOK-RATES-1","CURRENCY":"EUR","BASE_PV":1120300.0,"REALISED_PV":1066150.0,"RISK_MODEL":"demo-factor-model/demo-2","STATUS":"ok","BATCH_ID":"B-RPV-2026-09-30-01","COMPUTED_AT":"2026-10-01T05:55:00Z"}'
- 'FX: at VALUE_TYPE PV, RTPL in USD = REALISED_PV x FX(BUSINESS_DATE close) - BASE_PV x FX(POSITION_DATE close), both rates from the
  market-data pack''s fx-spot; a currency with no rate on either date refuses the row (counted, named).'
- 'Without this kind the P&L explain engine can still show an approximate RTPL (the newest scenario of the business date''s scenario
  PVs, which applies the realised move to the business date''s positions, not the previous date''s). That figure is labelled approximate
  everywhere and is never used for the P&L attribution test or a filed backtest.'
- 'Sizing: 1.3 million rows a date, about 35 MB as Parquet.'
review:
- 'Whether the bank''s risk engine can run yesterday''s positions on today''s market as one extra scenario (most can: it is the same
  batch with one more market state), and at what time it is delivered.'
