# Data contract of the pnl-history kind (command PNLH): docs/contracts/README.md section 16.
kind: pnl-history
mnemonic: PNLH
pack: market-risk
version: '1.0'
class: input
status: active
title: Long-history P&L of a hierarchy node (stress window selection)
description: Today's portfolio at one hierarchy node revalued over every business day of a long history (2007 to the day before the
  business date in the demo), one P&L per day in USD; the stress window selection values every 12-month window of it as a stressed VaR
  (VAR_GUIDE.md section 18.9)
source: Synthetic sample data (tools/packgen/var/pnl_history.py, run by make_var_data.py)
grain: One row per hierarchy node per BUSINESS_DATE (the positions date), keyed by HISTORY_ID (PNLH-<NODE_ID>).
key:
- HISTORY_ID
id-pattern:
- ^PNLH-
dated-by: BUSINESS_DATE
cadence:
  frequency: on change
  due: monthly at least, from a month-end run of the pricing system (the stress window review is monthly); any date may have one
binding-hint:
  lake-table: risk.pnl-history
  columns:
  - HIERARCHY
  - NODE_ID
  - LEVEL
  - CURRENCY
  - FIRST_DAY
  - LAST_DAY
  - DAY_COUNT
  vectors:
  - PNL
  test-data:
  - data/testdata/market-risk/pnl-history
fields:
- name: HISTORY_ID
  type: id
  presence: required
  description: The record's id, PNLH-<NODE_ID> (the business key)
  example: PNLH-MGMT~BANK
  pattern: ^PNLH-
- name: HIERARCHY
  type: text
  presence: required
  description: 'The hierarchy the node is in (MGMT, LEGAL in the demo): the tool''s Hierarchy picker offers the hierarchies the date''s
    rows name.'
  example: MGMT
  pattern: ^[A-Z][A-Z0-9_]*$
- name: NODE_ID
  type: id
  presence: required
  description: The node, its id as the engine builds it (MGMT~BANK, MGMT~DESK-RATES, LEGAL~LE-NY).
  example: MGMT~DESK-RATES
  pattern: ^[A-Z][A-Z0-9_]*~
- name: NAME
  type: text
  presence: optional
  description: The node's name, as the engine shows it (its reference entity's name, else its id).
  example: Rates
- name: LEVEL
  type: text
  presence: optional
  description: 'The node''s level: bank, division, legal-entity, desk (book rows are allowed; the demo sends none).'
  example: desk
- name: CURRENCY
  type: text
  presence: required
  description: 'The currency of PNL, ISO 4217: USD (the stress set''s own currency).'
  example: USD
  enum:
  - USD
- name: FIRST_DAY
  type: date
  presence: required
  description: The first day of the history (YYYY-MM-DD), HISTORY_DATES' first.
  example: '2007-01-02'
- name: LAST_DAY
  type: date
  presence: required
  description: The last day of the history (YYYY-MM-DD), HISTORY_DATES' last; before BUSINESS_DATE.
  example: '2026-09-29'
- name: DAY_COUNT
  type: integer
  presence: required
  description: The number of days, the length of HISTORY_DATES and of PNL.
  example: 4938
- name: HISTORY_DATES
  type: date list
  presence: required
  description: The days of the history, strictly increasing (YYYY-MM-DD), one per value of PNL.
- name: PNL
  type: vector
  presence: required
  unit: USD
  description: 'The node''s P&L of today''s portfolio under each day''s market moves, in USD, gains positive, in HISTORY_DATES'' order.
    A node''s values are the sum of its children''s. The days of the date''s stress scenario set should carry the stress set''s own P&L
    (so the configured window''s figure is the node''s stressed VaR), and the last days the normal set''s.'
- name: SYNTHETIC
  type: boolean
  presence: optional
  description: True when the moves are not market history (the demo's); every answer of the tool says so.
  example: true
- name: ANCHORS
  type: text list
  presence: optional
  description: The scenario sets whose days the history carries as they are (HS-STRESS-2008, HS-509 in the demo). Informational.
- name: SOURCE_BATCH
  type: text
  presence: optional
  description: The batch of the pricing system that produced the history. Informational.
  example: B-2026-09-30-HIST
- name: DESCRIPTION
  type: text
  presence: optional
  description: What the history is, in words.
- name: BUSINESS_DATE
  type: date
  presence: required
  description: 'The positions date (YYYY-MM-DD), whose portfolio was revalued over the history.'
  example: '2026-09-30'
validation:
- rule: required
  fields:
  - HISTORY_ID
  - HIERARCHY
  - NODE_ID
  - CURRENCY
  - FIRST_DAY
  - LAST_DAY
  - DAY_COUNT
  - HISTORY_DATES
  - PNL
  - BUSINESS_DATE
- rule: unique
  key:
  - HISTORY_ID
  per: BUSINESS_DATE
- rule: pattern
  field: HISTORY_ID
  pattern: ^PNLH-
- rule: enum
  field: CURRENCY
  values:
  - USD
- rule: range
  field: DAY_COUNT
  min: 0
- rule: vector-length
  field: PNL
  same: every row of one business date
notes:
- 'JSON Lines, one row per line (UTF-8). Example line (two days shown; a row holds every day): {"HISTORY_ID":"PNLH-MGMT~DESK-RATES","BUSINESS_DATE":"2026-09-30","HIERARCHY":"MGMT","NODE_ID":"MGMT~DESK-RATES","NAME":"Rates","LEVEL":"desk","CURRENCY":"USD","FIRST_DAY":"2007-01-02","LAST_DAY":"2007-01-03","DAY_COUNT":2,"HISTORY_DATES":["2007-01-02","2007-01-03"],"PNL":[-1250000.5,840000.25],"SYNTHETIC":true}'
- 'A row whose PNL and HISTORY_DATES differ in length, or whose dates are not increasing, is refused for the tool in words; a node
  without a row says so, never zero.'
review: []
