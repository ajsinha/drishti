# The banking module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3): first-party, with the code of
# modules/banking/banking-service and banking-compute, packed by the module tool into banking-1.0.0.dmod in the normal build.
format: 1
id: banking
version: 1.0.0
title: Banking and risk
about: VaR and ES (historical, parametric, regulatory), exposure and CCR, FRTB-SA, ISDA SIMM, sensitivities, the MR cube, the official risk results
domain: banking
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: banking
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=1.4 <2'
requires:
  market-data: '>=1.0 <2'
provides:
  kinds:
    trading:
    - trade
    - counterparty-trades
    - portfolio-trades
    - legal-entity-trades
    - index-trades
    market-risk:
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    - position
    - system-basket
    - pnl-vector
    - scenario-pv
    - fx-scenario
    - scenario-set
    - var-limit
    - desk-pnl
    - pnl-history
    - position-sensitivity
    - risk-factor
    - var-result
    - var-official
    - stress-scenario-pnl
    counterparty-risk:
    - agreement
    - csa
    - netting-set
    - credit-limit
    - cva
    - sa-ccr
    - collateral-balance
    - margin-call
    - simm
    - simulation-run
    - exposure-path
    - exposure-result
    - exposure-official-cpty
    - nset-mtm
    - cpty-mtm
java:
  jars:
  - drishti-banking.jar
  - drishti-compute-banking.jar
  lib: []
  spring:
  - com.ash.drishti.banking.BankingAutoConfiguration
  packages:
  - com.ash.drishti.banking
compute:
  engines:
  - id: var
  - id: exposure
  - id: sensitivities
  - id: frtb-sa
  - id: simm
  - id: mr-cube
  connectors:
  - var-engine
  - var-positions
  - var-pv-stream
  - exposure-engine
packs:
  folder: packs
  list:
  - trading
  - market-risk
  - counterparty-risk
data:
  needs: data/needs.yaml
api:
  prefix: risk
  # the old prefixes, answered as the new ones for one release (the module's ApiAlias beans); the registry reads them
  legacy:
  - /api/v1/var
  - /api/v1/exposure
  - /api/v1/frtb
  - /api/v1/simm
  - /api/v1/sensitivities
  - /api/v1/risk-factors
  - /api/v1/pivot/mr
console:
  plugin: console/plugin.yaml
  # the module's own top menus, in the console sitemap's form (drishti-console/config/sitemap.yaml); a menu of another module's
  # id adds its columns to that menu (the one Markets menu). The one home of these menus.
  menus:
  - id: blotter
    domain: banking
    label: Blotter
    icon: journal-text
    subject: true
    columns:
    - title: Trades
      items:
      - id: trd
        cmd: TRD
        icon: journal-text
        label: Trades
        desc: 'Every trade: pick one or filter'
        requires: ['cmd:TRD']
      - id: ctrd
        cmd: CTRD
        icon: building
        label: By counterparty
        desc: The trades of a counterparty
        requires: ['cmd:CTRD']
      - id: ptrd
        cmd: PTRD
        icon: folder2
        label: By portfolio
        desc: The trades of a portfolio
        requires: ['cmd:PTRD']
      - id: ltrd
        cmd: LTRD
        icon: bank
        label: By legal entity
        desc: The trades of a legal entity
        requires: ['cmd:LTRD']
  - id: positions
    domain: banking
    label: Positions
    icon: stack
    subject: true
    columns:
    - title: Books and positions
      items:
      - id: book
        cmd: BOOK
        icon: book
        label: Books
        desc: Every book, its trades and risk
        requires: ['cmd:BOOK']
      - id: desk
        cmd: DESK
        icon: people
        label: Desks
        desc: Every desk and its books
        requires: ['cmd:DESK']
      - id: trdr
        cmd: TRDR
        icon: person-badge
        label: Traders
        desc: Every trader and their books
        requires: ['cmd:TRDR']
      - id: pos
        cmd: POS
        icon: stack
        label: Positions
        desc: The positions of a book
        requires: ['cmd:POS']
  - id: risk
    domain: banking
    label: Risk
    icon: shield-check
    subject: true
    without-lens: true
    columns:
    - title: Risk on my book
      items:
      - id: my-var
        cmd: VAR
        icon: shield-check
        label: My VaR
        desc: The VaR of the books you trade
        match: /var
        requires: ['word:VAR']
      - id: vlim
        cmd: VLIM
        icon: speedometer2
        label: VaR limits
        desc: Each limit and how much of it is used
        requires: ['cmd:VLIM']
      - id: tval
        cmd: TVAL
        icon: currency-exchange
        label: Trade valuations
        desc: Each trade's value and its sensitivities
        requires: ['cmd:TVAL']
      - id: pnlv
        cmd: PNLV
        icon: bar-chart
        label: P&L vectors
        desc: Each position's P&L under every scenario
        requires: ['cmd:PNLV']
      - id: dpnl
        cmd: DPNL
        icon: cash-coin
        label: Desk P&L
        desc: Each desk's actual and hypothetical P&L, day by day
        requires: ['cmd:DPNL']
      - id: pnl
        cmd: PNL
        icon: bar-chart-steps
        label: P&L explain
        desc: A day's P&L by risk factor, new trades and residual
        requires: ['cmd:PNL']
      - id: sens
        cmd: SENS
        icon: speedometer
        label: Sensitivities
        desc: Delta, vega and curvature of each position by risk factor
        requires: ['cmd:SENS']
    - title: VaR
      items:
      - id: var-explorer
        href: /var
        cmd: VAR BANK
        icon: shield-check
        label: VaR explorer
        desc: The bank's VaR, then any desk, book or set of trades
        match: /var
        requires: ['engine:var', 'word:VAR']
      - id: var-explain
        cmd: VAR BANK EXPLAIN
        icon: arrow-left-right
        label: Why it moved
        desc: 'Day on day: the trades, factors and scenarios that moved it'
        requires: ['engine:var', 'word:VAR']
      - id: play-var
        cmd: PLAY VAR
        icon: calculator
        label: VaR Playground
        desc: Every figure worked in a grid and a workbook of formulas
        match: /play
        requires: ['engine:var', 'word:VAR', 'word:PLAY', 'route:/play']
      - id: smat
        cmd: SMAT
        href: /smat
        icon: grid-3x3
        label: Scenario matrix
        desc: Each scenario's P&L of a trade, position or scope
        match: /smat
        requires: ['engine:var', 'word:SMAT']
      - id: var-reports
        cmd: VAR REPORTS
        href: /var/reports
        icon: bank
        label: Regulatory reports
        desc: Canada and the US, to the cell, signed runs
        match: /var/reports
        requires: ['engine:var', 'word:VAR', 'route:/var/reports']
      - id: backtesting
        cmd: VAR BANK BACKTEST
        icon: activity
        label: Backtesting
        desc: VaR against the P&L, with the traffic light
        match: /var/backtesting
        requires: ['engine:var', 'word:VAR', 'route:/var/backtesting']
      - id: stress-window
        cmd: SWIN BANK
        icon: calendar-range
        label: Stress window
        desc: The most stressful year of history for stressed VaR
        match: /var/stress-window
        requires: ['engine:var', 'word:VAR']
      - id: var-results
        cmd: VRES
        icon: table
        label: VaR results
        desc: The stored results of every hierarchy node
        requires: ['engine:var', 'cmd:VRES']
      - id: mcube
        cmd: MCUBE
        href: /pivot?preset=mr
        icon: grid-3x3-gap
        label: Market-risk cube
        desc: 'The Pivot''s market-risk preset: desks by risk class with the right totals, the tail, why it moved, the DV01 ladder and a what-if · also MCUBE <GO>'
        requires: ['engine:var', 'word:VAR', 'word:PIVOT', 'word:MCUBE']
      - id: var-official
        cmd: VOFF
        icon: patch-check
        label: Official records
        desc: The signed-off VaR of each business date
        requires: ['engine:var', 'cmd:VOFF']
    - title: Exposure
      items:
      - id: exp-explorer
        href: /exposure
        cmd: EXP
        icon: graph-up
        label: Exposure explorer
        desc: EE, PFE and EPE of the bank, then any counterparty
        match: /exposure
        requires: ['engine:exposure', 'word:EXP']
      - id: exp-cpty
        fill: EXP CPTY
        icon: building
        label: A counterparty
        desc: Type the counterparty's id after the words
        requires: ['engine:exposure', 'word:EXP']
      - id: exp-nset
        fill: EXP NSET
        icon: diagram-2
        label: A netting set
        desc: Type the netting set's id after the words
        requires: ['engine:exposure', 'word:EXP']
    - title: Capital and margin
      items:
      - id: frsa
        cmd: FRSA BANK
        icon: bank2
        label: FRTB-SA capital
        desc: Standardised market-risk capital for any scope
        match: /frtb
        requires: ['engine:frtb-sa', 'word:VAR', 'route:/frtb']
      - id: play-frtb
        cmd: PLAY FRTB EXAMPLE
        icon: calculator
        label: FRTB-SA Playground
        desc: Every method choice a switch, compared
        match: /play/frtb
        requires: ['engine:frtb-sa', 'word:VAR', 'word:PLAY', 'route:/play/frtb']
      - id: simm
        cmd: SIMM
        icon: shield-lock
        label: SIMM by netting set
        desc: Initial margin per netting set, collect and post
        match: /simm
        requires: ['engine:simm', 'word:SIMM', 'route:/simm']
      - id: play-simm
        cmd: PLAY SIMM EXAMPLE
        icon: calculator
        label: SIMM Playground
        desc: Every SIMM figure worked in a grid and a workbook of formulas
        match: /play/simm
        requires: ['engine:simm', 'word:PLAY', 'route:/play/simm']
  - id: counterparties
    domain: banking
    label: Counterparties
    icon: building
    subject: true
    columns:
    - title: Counterparties
      items:
      - id: cpty
        cmd: CPTY
        icon: building
        label: Counterparties
        desc: Every counterparty, its trades and exposure
        requires: ['cmd:CPTY']
      - id: nset
        cmd: NSET
        icon: diagram-2
        label: Netting sets
        desc: Every netting set and its agreement
        requires: ['cmd:NSET']
      - id: lim
        cmd: LIM
        icon: speedometer2
        label: Credit limits
        desc: Each credit limit and how much of it is used
        requires: ['cmd:LIM']
      - id: predeal
        cmd: PREDEAL
        href: /predeal
        icon: sliders
        label: Pre-deal check
        desc: Does a new trade fit the counterparty's credit limit? within, near or over it per limit and bucket; approve, refer or decline · PREDEAL <counterparty> LIKE <trade> <notional>
        match: /predeal
        requires: ['word:EXP']
      - id: exp
        cmd: EXP
        icon: graph-up
        label: Exposure
        desc: EE, PFE and EPE of a counterparty or netting set
        match: /exposure
        requires: ['word:EXP']
      - id: ccr-cube
        cmd: CCUBE
        href: /pivot?preset=ccr
        icon: grid-3x3-gap
        label: Counterparty-risk cube
        desc: 'The Pivot''s counterparty preset: exposure by counterparty and tenor against limits, with the right totals · also CCUBE <GO>'
        requires: ['word:EXP', 'word:PIVOT']
functions:
- word: VAR
  api:
  - /api/v1/risk/var
- PVAR
- SMAT
- SWIN
- word: PREDEAL
  api:
  - /api/v1/risk/exposure/predeal
- word: EXP
  api:
  - /api/v1/risk/exposure
- word: FRSA
  api:
  - /api/v1/risk/frtb
- word: SIMM
  api:
  - /api/v1/risk/simm
- word: MCUBE
  api:
  - /api/v1/risk/mr
- word: SENS
  api:
  - /api/v1/risk/sensitivities
- word: RFAC
  api:
  - /api/v1/risk/risk-factors
- PLAY
- CCUBE
- TRD
- CTRD
- PTRD
- LTRD
- ITRD
- SCN
- STR
- FRTB
- PNL
- TVAL
- POS
- PORT
- PNLV
- SPV
- FXS
- SSET
- VLIM
- DPNL
- PNLH
- VRES
- VOFF
- SSPNL
- AGR
- CSA
- NSET
- LIM
- CVA
- SACCR
- COLL
- MC
- XRUN
- XPATH
- XOFC
- NSMTM
- CPMTM
lenses: lenses/risk.yaml
docs:
  readme: docs/README.md
  help: docs/help.yaml
  domains:
  - banking
  guides:
  - packs/trading/guides/trading-products.md
  - packs/trading/guides/trading.md
  - packs/market-risk/guides/market-risk.md
  - packs/counterparty-risk/guides/counterparty-risk.md
  tutorials:
  - tutorials/02-var-from-the-bank-to-a-trade.md
  - tutorials/03-exposure-from-the-bank-to-a-trade.md
  - tutorials/04-frtb-sa.md
  - tutorials/05-simm.md
resources:
  memory-mb: 2048
# The kernel internals banking still reaches (KERNEL_AND_MODULES.md section 3.3): the packer writes the list here from the file, and
# stamps kernel-build (the one kernel build this package loads on). Only a verified first-party module may declare it.
kernel-internals: ../kernel-internals.txt
