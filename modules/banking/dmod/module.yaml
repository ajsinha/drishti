# The banking module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3): first-party, with the code of
# modules/banking/banking-service and banking-compute, packed by the module tool into banking-1.0.0.dmod in the normal build.
format: 1
id: banking
version: 1.0.0
title: Banking and risk
about: VaR and ES (historical, parametric, regulatory), exposure and CCR, FRTB-SA, ISDA SIMM, sensitivities, the MR cube, the official risk results
domain: banking
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: banking
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=1.4 <2'
requires:
  market-data: '>=1.0 <2'
provides:
  kinds:
    trading:
    - trade
    - counterparty-trades
    - portfolio-trades
    - legal-entity-trades
    - index-trades
    market-risk:
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    - position
    - system-basket
    - pnl-vector
    - scenario-pv
    - fx-scenario
    - scenario-set
    - var-limit
    - desk-pnl
    - pnl-history
    - position-sensitivity
    - risk-factor
    - var-result
    - var-official
    - stress-scenario-pnl
    counterparty-risk:
    - agreement
    - csa
    - netting-set
    - credit-limit
    - cva
    - sa-ccr
    - collateral-balance
    - margin-call
    - simm
    - simulation-run
    - exposure-path
    - exposure-result
    - exposure-official-cpty
    - nset-mtm
    - cpty-mtm
java:
  jars:
  - drishti-banking.jar
  - drishti-compute-banking.jar
  lib: []
  spring:
  - com.ash.drishti.banking.BankingAutoConfiguration
  packages:
  - com.ash.drishti.banking
compute:
  engines:
  - id: var
  - id: exposure
  - id: sensitivities
  - id: frtb-sa
  - id: simm
  - id: mr-cube
  connectors:
  - var-engine
  - var-positions
  - var-pv-stream
  - exposure-engine
packs:
  folder: packs
  list:
  - trading
  - market-risk
  - counterparty-risk
data:
  needs: data/needs.yaml
api:
  prefix: risk
  # the old prefixes, answered as the new ones for one release (the module's ApiAlias beans); the registry reads them
  legacy:
  - /api/v1/var
  - /api/v1/exposure
  - /api/v1/frtb
  - /api/v1/simm
  - /api/v1/sensitivities
  - /api/v1/risk-factors
  - /api/v1/pivot/mr
console:
  plugin: console/plugin.yaml
  menus:
  - blotter
  - positions
  - risk
  - counterparties
functions:
- word: VAR
  api:
  - /api/v1/risk/var
- PVAR
- SMAT
- SWIN
- word: PREDEAL
  api:
  - /api/v1/risk/exposure/predeal
- word: EXP
  api:
  - /api/v1/risk/exposure
- word: FRSA
  api:
  - /api/v1/risk/frtb
- word: SIMM
  api:
  - /api/v1/risk/simm
- word: MCUBE
  api:
  - /api/v1/risk/mr
- word: SENS
  api:
  - /api/v1/risk/sensitivities
- word: RFAC
  api:
  - /api/v1/risk/risk-factors
- PLAY
- CCUBE
- TRD
- CTRD
- PTRD
- LTRD
- ITRD
- SCN
- STR
- FRTB
- PNL
- TVAL
- POS
- PORT
- PNLV
- SPV
- FXS
- SSET
- VLIM
- DPNL
- PNLH
- VRES
- VOFF
- SSPNL
- AGR
- CSA
- NSET
- LIM
- CVA
- SACCR
- COLL
- MC
- XRUN
- XPATH
- XOFC
- NSMTM
- CPMTM
lenses: lenses/risk.yaml
docs:
  readme: docs/README.md
  help: docs/help.yaml
  domains:
  - banking
  guides:
  - packs/trading/guides/trading-products.md
  - packs/trading/guides/trading.md
  - packs/market-risk/guides/market-risk.md
  - packs/counterparty-risk/guides/counterparty-risk.md
  - guides/VAR_GUIDE.md
  - guides/EXPOSURE_GUIDE.md
  - guides/FRTB_SA_GUIDE.md
  - guides/SIMM_GUIDE.md
  # a risk measure's one document holds its guide and its tutorial
  tutorials:
  - guides/VAR_GUIDE.md
  - guides/EXPOSURE_GUIDE.md
  - guides/FRTB_SA_GUIDE.md
  - guides/SIMM_GUIDE.md
resources:
  memory-mb: 2048
# The kernel internals banking still reaches (KERNEL_AND_MODULES.md section 3.3): the packer writes the list here from the file, and
# stamps kernel-build (the one kernel build this package loads on). Only a verified first-party module may declare it.
kernel-internals: ../kernel-internals.txt
