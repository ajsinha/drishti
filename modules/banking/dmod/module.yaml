# The banking module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 3.3): first-party, with the code of
# modules/banking/banking-service and banking-compute, packed by the module tool into banking-1.0.0.dmod in the normal build.
format: 1
id: banking
version: 1.0.0
title: Banking and risk
about: VaR and ES (historical, parametric, regulatory), exposure and CCR, FRTB-SA, ISDA SIMM, sensitivities, the MR cube, the official risk results
domain: banking
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: banking
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=1.4 <2'
requires:
  market-data: '>=1.0 <2'
provides:
  kinds:
    trading:
    - trade
    - counterparty-trades
    - portfolio-trades
    - legal-entity-trades
    - index-trades
    market-risk:
    - stress-scenario
    - stress-result
    - frtb-sensitivity
    - pnl-explain
    - trade-valuation
    - position
    - system-basket
    - pnl-vector
    - scenario-pv
    - fx-scenario
    - scenario-set
    - var-limit
    - desk-pnl
    - pnl-history
    - position-sensitivity
    - risk-factor
    - var-result
    - var-official
    - stress-scenario-pnl
    counterparty-risk:
    - agreement
    - csa
    - netting-set
    - credit-limit
    - cva
    - sa-ccr
    - collateral-balance
    - margin-call
    - simm
    - simulation-run
    - exposure-path
    - exposure-result
    - exposure-official-cpty
    - nset-mtm
    - cpty-mtm
java:
  jars:
  - drishti-banking.jar
  - drishti-compute-banking.jar
  lib: []
  spring:
  - com.ash.drishti.banking.BankingAutoConfiguration
  packages:
  - com.ash.drishti.banking
compute:
  engines:
  - id: var
  - id: exposure
  - id: sensitivities
  - id: frtb-sa
  - id: simm
  - id: mr-cube
  connectors:
  - var-engine
  - var-positions
  - var-pv-stream
  - exposure-engine
packs:
  folder: packs
  list:
  - trading
  - market-risk
  - counterparty-risk
data:
  needs: data/needs.yaml
api:
  prefix: risk
  # the old prefixes, answered as the new ones for one release (the module's ApiAlias beans); the registry reads them
  legacy:
  - /api/v1/var
  - /api/v1/exposure
  - /api/v1/frtb
  - /api/v1/simm
  - /api/v1/sensitivities
  - /api/v1/risk-factors
  - /api/v1/pivot/mr
console:
  plugin: console/plugin.yaml
  menus:
  - blotter
  - positions
  - risk
  - counterparties
functions:
- word: VAR
  api:
  - /api/v1/risk/var
- PVAR
- SMAT
- SWIN
- word: PREDEAL
  api:
  - /api/v1/risk/exposure/predeal
- word: EXP
  api:
  - /api/v1/risk/exposure
- word: FRSA
  api:
  - /api/v1/risk/frtb
- word: SIMM
  api:
  - /api/v1/risk/simm
- word: MCUBE
  api:
  - /api/v1/risk/mr
- word: SENS
  api:
  - /api/v1/risk/sensitivities
- word: RFAC
  api:
  - /api/v1/risk/risk-factors
- PLAY
- CCUBE
- TRD
- CTRD
- PTRD
- LTRD
- ITRD
- SCN
- STR
- FRTB
- PNL
- TVAL
- POS
- PORT
- PNLV
- SPV
- FXS
- SSET
- VLIM
- DPNL
- PNLH
- VRES
- VOFF
- SSPNL
- AGR
- CSA
- NSET
- LIM
- CVA
- SACCR
- COLL
- MC
- XRUN
- XPATH
- XOFC
- NSMTM
- CPMTM
settings:                               # read as drishti.module.banking.<key> (ModuleSettings); Admin -> Modules -> banking -> Settings lists them.
                                        # was: the server key it was before; read for one release (Health names the ones a site still sets).
  items:
  - { key: var.window, type: int, was: drishti.var.scenario-window, group: VaR, meaning: "The newest N scenarios of each date's set (250: one year, the Basel minimum)" }
  - { key: var.confidence, type: number, was: drishti.var.confidence, group: VaR, meaning: "VaR's confidence (0.99 or 0.95)" }
  - { key: var.es-confidence, type: number, was: drishti.var.es-confidence, group: VaR, meaning: "Expected shortfall's confidence" }
  - { key: var.ten-day-method, type: string, was: drishti.var.ten-day-method, group: VaR, meaning: "10-day VaR when the method is not named: sqrt10 or sum" }
  - { key: var.rank-rule, type: string, was: drishti.var.rank-rule, group: VaR, meaning: "kth-worst or interpolated" }
  - { key: var.threads, type: int, was: drishti.var.threads, group: VaR, meaning: "Cores the vector sums use (0: every core)" }
  - { key: var.hot-dates, type: int, was: drishti.var.hot-dates, group: VaR, meaning: "Business dates kept open" }
  - { key: var.root-name, type: string, was: drishti.var.root-name, group: Hierarchies, meaning: "The top of the VaR tree (every hierarchy's root node)" }
  - { key: var.hierarchy.empty-label, type: string, was: drishti.var.hierarchy.empty-label, group: Hierarchies, meaning: "The node a row with an empty level value sits under" }
  - { key: var.system-baskets.seed, type: boolean, was: drishti.var.system-baskets.seed, group: Hierarchies, meaning: "Import a loaded pack's system-basket seed once into an empty system scope at start" }
  - { key: exposure.limit-confidence, type: number, was: drishti.ccr.exposure.limit-confidence, group: Exposure, meaning: "The PFE confidence credit limits are set on" }
  - { key: exposure.rank-rule, type: string, was: drishti.ccr.exposure.rank-rule, group: Exposure, meaning: "kth or interpolated" }
  - { key: frtb.parameters-dir, type: string, was: drishti.frtb.parameters-dir, group: FRTB-SA, meaning: "The folder of the FRTB-SA parameter files" }
  - { key: simm.parameters-dir, type: string, was: drishti.simm.parameters-dir, group: SIMM, meaning: "The bank's licensed SIMM parameter files" }
  - { key: simm.default-version, type: string, was: drishti.simm.default-version, group: SIMM, meaning: "The SIMM version for a CSA naming none" }
  - { key: sensitivities.cache-minutes, type: int, was: drishti.sensitivities.cache-minutes, group: Sensitivities, meaning: "How long a date's sensitivities stay in memory" }
  - { key: mr-cube.sbm-max-cells, type: int, was: drishti.cube.mr.sbm-max-cells, group: MR cube, meaning: "The most cells whose FRTB-SA SBM one view computes" }
parts:                                  # what the deployer places, part by part (config/placement.yaml)
  api:
    class: light
  compute:
    class: heavy
    memory-mb: 6144
    paths:
    - /var
    - /exposure
    - /frtb
    - /simm
    - /sensitivities
    - /mr
  feeds:
    class: feed
lenses: lenses/risk.yaml
docs:
  readme: docs/README.md
  help: docs/help.yaml
  domains:
  - banking
  guides:
  - packs/trading/guides/trading-products.md
  - packs/trading/guides/trading.md
  - packs/market-risk/guides/market-risk.md
  - packs/counterparty-risk/guides/counterparty-risk.md
  tutorials:
  - tutorials/02-var-from-the-bank-to-a-trade.md
  - tutorials/03-exposure-from-the-bank-to-a-trade.md
  - tutorials/04-frtb-sa.md
  - tutorials/05-simm.md
resources:
  memory-mb: 2048
# The kernel internals banking still reaches (KERNEL_AND_MODULES.md section 3.3): the packer writes the list here from the file, and
# stamps kernel-build (the one kernel build this package loads on). Only a verified first-party module may declare it.
kernel-internals: ../kernel-internals.txt
