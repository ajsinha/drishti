  title: Playgrounds
- id: ccube
  path: /ccube
  sutra: banking/ccube
  function: CCUBE
  title: Counterparty cube
- id: trd
  path: /trading/trade/{id}
  sutra: trading/trade
  function: TRD
  title: Trade
- id: ctrd
  path: /trading/counterparty-trades/{id}
  sutra: trading/counterparty-trades
  function: CTRD
  title: Counterparty trades (derived from trades)
- id: ptrd
  path: /trading/portfolio-trades/{id}
  sutra: trading/portfolio-trades
  function: PTRD
  title: Portfolio trades (derived from trades)
- id: ltrd
