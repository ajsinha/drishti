# The module's pages: one per function, under /m/banking/ (KERNEL_AND_MODULES.md section 9.8). The console's own banking plugin
# (drishti-console/plugins/banking) draws them until the console part moves into the module (2.9.11.i5).
format: 2
module: banking
title: Banking and risk
routes:
- id: var
  path: /var
  sutra: banking/var
  function: VAR
  title: Value at risk
- id: pvar
  path: /pvar
  sutra: banking/pvar
  function: PVAR
  title: Parametric VaR
- id: smat
  path: /smat
  sutra: banking/smat
  function: SMAT
  title: Scenario matrix
- id: swin
  path: /swin
  sutra: banking/swin
  function: SWIN
  title: Stress window
- id: predeal
  path: /predeal
  sutra: banking/predeal
  function: PREDEAL
  title: Pre-deal check
- id: exp
  path: /counterparty-risk/exposure-result/{id}
  sutra: counterparty-risk/exposure-result
  function: EXP
  title: Exposure
- id: frsa
  path: /frsa
  sutra: banking/frsa
  function: FRSA
  title: FRTB standardised approach
- id: simm
  path: /counterparty-risk/simm/{id}
  sutra: counterparty-risk/simm
  function: SIMM
  title: ISDA SIMM
- id: mcube
  path: /mcube
  sutra: banking/mcube
  function: MCUBE
  title: Market risk cube
- id: sens
  path: /market-risk/position-sensitivity/{id}
  sutra: market-risk/position-sensitivity
  function: SENS
  title: Sensitivities
