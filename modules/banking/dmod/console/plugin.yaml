  title: Long-history P&L of a hierarchy node (stress window selection)
- id: vres
  path: /market-risk/var-result/{id}
  sutra: market-risk/var-result
  function: VRES
  title: VaR of a scope (computed)
- id: voff
  path: /market-risk/var-official/{id}
  sutra: market-risk/var-official
  function: VOFF
  title: VaR official results (published)
- id: sspnl
  path: /market-risk/stress-scenario-pnl/{id}
  sutra: market-risk/stress-scenario-pnl
  function: SSPNL
  title: Stress P&L of a scenario across desks (derived from the stress results)
- id: agr
  path: /counterparty-risk/agreement/{id}
  sutra: counterparty-risk/agreement
  function: AGR
  title: Master agreement
- id: csa
  path: /counterparty-risk/csa/{id}
  sutra: counterparty-risk/csa
  function: CSA
  title: Credit support annex
- id: nset
  path: /counterparty-risk/netting-set/{id}
  sutra: counterparty-risk/netting-set
  function: NSET
  title: Netting set
- id: lim
  path: /counterparty-risk/credit-limit/{id}
  sutra: counterparty-risk/credit-limit
  function: LIM
  title: Credit limit
- id: cva
  path: /counterparty-risk/cva/{id}
  sutra: counterparty-risk/cva
  function: CVA
  title: CVA / XVA
- id: saccr
  path: /counterparty-risk/sa-ccr/{id}
  sutra: counterparty-risk/sa-ccr
  function: SACCR
  title: SA-CCR exposure
- id: coll
  path: /counterparty-risk/collateral-balance/{id}
  sutra: counterparty-risk/collateral-balance
  function: COLL
  title: Collateral balance
- id: mc
  path: /counterparty-risk/margin-call/{id}
  sutra: counterparty-risk/margin-call
  function: MC
  title: Margin call
- id: xrun
  path: /counterparty-risk/simulation-run/{id}
  sutra: counterparty-risk/simulation-run
  function: XRUN
  title: Exposure simulation run
- id: xpath
  path: /counterparty-risk/exposure-path/{id}
  sutra: counterparty-risk/exposure-path
  function: XPATH
  title: Exposure path (a trade's MtM on every path at a grid date)
- id: xofc
  path: /counterparty-risk/exposure-official-cpty/{id}
  sutra: counterparty-risk/exposure-official-cpty
  function: XOFC
  title: Exposure official results by netting set and counterparty (published)
- id: nsmtm
  path: /counterparty-risk/nset-mtm/{id}
  sutra: counterparty-risk/nset-mtm
  function: NSMTM
  title: Netting-set MtM totals (derived from the trade valuations)
- id: cpmtm
  path: /counterparty-risk/cpty-mtm/{id}
  sutra: counterparty-risk/cpty-mtm
  function: CPMTM
  title: Counterparty MtM totals (derived from the trade valuations)
