  path: /trading/index-trades/{id}
  sutra: trading/index-trades
  function: ITRD
  title: Index trades (derived from trades)
- id: scn
  path: /market-risk/stress-scenario/{id}
  sutra: market-risk/stress-scenario
  function: SCN
  title: Stress scenario
- id: str
  path: /market-risk/stress-result/{id}
  sutra: market-risk/stress-result
  function: STR
  title: Stress result
- id: frtb
  path: /market-risk/frtb-sensitivity/{id}
  sutra: market-risk/frtb-sensitivity
  function: FRTB
  title: FRTB sensitivities
- id: pnl
  path: /market-risk/pnl-explain/{id}
  sutra: market-risk/pnl-explain
  function: PNL
  title: P&L explain
- id: tval
  path: /market-risk/trade-valuation/{id}
  sutra: market-risk/trade-valuation
  function: TVAL
  title: Trade valuation
- id: pos
  path: /market-risk/position/{id}
  sutra: market-risk/position
  function: POS
  title: Position
- id: port
  path: /market-risk/system-basket/{id}
  sutra: market-risk/system-basket
  function: PORT
  title: System basket (the bank's baskets, kept in Drishti)
- id: pnlv
  path: /market-risk/pnl-vector/{id}
  sutra: market-risk/pnl-vector
  function: PNLV
  title: P&L vector (509 scenarios)
- id: spv
  path: /market-risk/scenario-pv/{id}
  sutra: market-risk/scenario-pv
  function: SPV
  title: Scenario PVs of a trade (509 scenarios, its currency)
- id: fxs
  path: /market-risk/fx-scenario/{id}
  sutra: market-risk/fx-scenario
  function: FXS
  title: Scenario FX of a currency (509 scenarios)
- id: sset
  path: /market-risk/scenario-set/{id}
  sutra: market-risk/scenario-set
  function: SSET
  title: Scenario set
- id: vlim
  path: /market-risk/var-limit/{id}
  sutra: market-risk/var-limit
  function: VLIM
  title: VaR limit of a hierarchy node
- id: dpnl
  path: /market-risk/desk-pnl/{id}
  sutra: market-risk/desk-pnl
