# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: inflation-index
version: 1
description: "Published CPI fixings (US CPI-U NSA, HICPxT, UK RPI…)."
doc:
  summary: "Published CPI fixings (US CPI-U NSA, HICPxT, UK RPI…)."
  description: >-
    Published CPI fixings (US CPI-U NSA, HICPxT, UK RPI…). One page per inflation index, its panels: monthly fixings; how the
    view was built; the entities it links to. The strip gives Name, Latest, YoY and Publication lag. Linked entities: inflation
    curve (inflation-curve).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/inflation-index/INF-HICPX"
    - "INF INF-HICPX"
  since: "2.7.0"
match: { kind: inflation-index, priority: 10 }
title: { pill: Market data · Inflation index, id: $.INDEX_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Latest, bind: $.LATEST, fmt: price2, emphasis: true }
  - { label: YoY, bind: $.YOY, fmt: pct2, tone: sign }
  - { label: Publication lag, bind: $.LAG }
panels:
  - id: fixings
    kind: ladder
    title: Monthly fixings
    key: F2
    rows: $.FIXINGS
    columns:
      - { label: Month, bind: "@.MONTH" }
      - { label: Index, bind: "@.VALUE", fmt: price2 }
      - { label: YoY, bind: "@.YOY", fmt: pct2, tone: sign }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.INFLATION_CURVE, 'inflation-curve')", F8: impact, F9: raw }
