# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1
sutra: equity-index
version: 1
description: Index level with its largest constituents.
doc:
  summary: "Index level with its largest constituents."
  description: >-
    Index level with its largest constituents. One page per equity index, its panels: top constituents; level, last 30 days; how
    the view was built; the entities it links to. The strip gives Name, Level, 1D, Constituents and Currency. Linked entities:
    vol surface (equity-vol-surface) and dividends (dividend-curve).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/equity-index/EQX-NDX"
    - "EQX EQX-NDX"
  since: "2.7.0"
match: { kind: equity-index, priority: 10 }
title: { pill: Market data · Equity index, id: $.INDEX_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Level, bind: $.LEVEL, fmt: price2, emphasis: true }
  - { label: "1D", bind: $.CHANGE_1D, fmt: pct2, tone: sign }
  - { label: Constituents, bind: $.CONSTITUENT_COUNT }
  - { label: Currency, bind: $.CURRENCY }
panels:
  - id: constituents
    kind: table
    title: Top constituents
    key: F2
    rows: $.CONSTITUENTS
    columns:
      - { label: Equity, bind: "@.EQUITY" }
      - { label: Weight, bind: "@.WEIGHT", fmt: pct2 }
  - { use: series-line@1, with: { id: history, title: "Level, last 30 days", area: right, rows: $.HISTORY, x: DATE, y: CLOSE } }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.EQUITY_VOL_SURFACE, 'equity-vol-surface')", F8: impact, F9: raw }
