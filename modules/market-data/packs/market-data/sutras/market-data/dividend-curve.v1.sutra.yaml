  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One dividend curve record (kind dividend-curve); the page reads CURVE_ID, UNDERLIER, DIVIDEND_YIELD, POINTS, UNDERLYING_EQUITY."
    sample-row: {"CURVE_ID": "DIV-CSCA", "UNDERLIER": "EQ-CSCA", "DIVIDEND_YIELD": 0.0275, "UNDERLYING_EQUITY": "EQ-CSCA"}
  example: "DIV DIV-CSCA"
  see-also: ["equity"]
  keywords: ["dividend curve", "market data"]
