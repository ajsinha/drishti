  summary: "Expected dividends by year (implied from dividend futures and forwards)."
  description: >-
    Expected dividends by year (implied from dividend futures and forwards). One page per dividend curve, its panels: expected
    dividends; how the view was built; the entities it links to. The strip gives Underlier and Yield. Linked entities: underlier
    (equity) and underlier (equity-index).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/dividend-curve/DIV-CSCA"
    - "DIV DIV-CSCA"
  category: "Market data"
  tags: ["dividend-curve", "market-data"]
