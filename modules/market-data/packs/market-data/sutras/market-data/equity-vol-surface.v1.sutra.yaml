# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1.2
sutra: equity-vol-surface
version: 1
description: Implied vols by expiry and moneyness.
doc:
  summary: "Implied vols by expiry and moneyness."
  description: >-
    Implied vols by expiry and moneyness. One page per equity volatility surface, its panels: implied vol by expiry × moneyness
    (%); vol (%) by moneyness; ATM term structure; how the view was built. The strip gives Underlier, 1M ATM, 1Y ATM and 1Y skew
    (90–110).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/equity-vol-surface/EQV-CSCA"
    - "EQV EQV-CSCA"
  category: "Market data"
  tags: ["equity-vol-surface", "market-data", "chart", "table"]
  use-when: "You have one equity volatility surface (its id, or a link from another screen) and want to read it in full: implied vols by expiry and moneyness."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One equity volatility surface record (kind equity-vol-surface); the page reads SURFACE_ID, UNDERLIER, ATM_1M, ATM_1Y, SKEW_1Y, GRID."
    sample-row: {"SURFACE_ID": "EQV-CSCA", "UNDERLIER": "EQ-CSCA", "ATM_1M": 37.54, "ATM_1Y": 36.67, "SKEW_1Y": 3.63, "MODEL": "SVI, moneyness-quoted"}
  example: "EQV EQV-CSCA"
  keywords: ["equity vol surface", "equity volatility surface", "market data"]
  since: "2.7.0"
match: { kind: equity-vol-surface, priority: 10 }
title: { pill: Market data · Equity volatility surface, id: $.SURFACE_ID }
strip:
  - { label: Underlier, bind: $.UNDERLIER }
  - { label: "1M ATM", bind: $.ATM_1M, fmt: price2, emphasis: true }
  - { label: "1Y ATM", bind: $.ATM_1Y, fmt: price2 }
  - { label: "1Y skew (90–110)", bind: $.SKEW_1Y, fmt: price2, tone: sign }
panels:
  - id: surface
    kind: surface
    title: Implied vol by expiry × moneyness (%)
    code: SURF
    key: F4
    rows: $.GRID
    y: EXPIRY
    columns:
      - { label: "80%", bind: "@.M_80", fmt: price2 }
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: "100%", bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
      - { label: "120%", bind: "@.M_120", fmt: price2 }
  - id: grid
    kind: table
    title: Vol (%) by moneyness
    key: F2
    rows: $.GRID
    columns:
      - { label: Expiry, bind: "@.EXPIRY" }
      - { label: "80%", bind: "@.M_80", fmt: price2 }
      - { label: "90%", bind: "@.M_90", fmt: price2 }
      - { label: "100%", bind: "@.M_100", fmt: price2 }
      - { label: "110%", bind: "@.M_110", fmt: price2 }
      - { label: "120%", bind: "@.M_120", fmt: price2 }
  - { use: series-line@1, with: { id: atm, title: ATM term structure, area: right, rows: $.GRID, x: EXPIRY, y: M_100 } }
  - { use: data-provenance@1 }
keys: { F8: impact, F9: raw }
