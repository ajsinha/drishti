format: 1
system: ICI
kind: trade
about: ICI native fields to the canonical trade fields. A path is a dotted path into the native document; first-of takes the first present; values
  translates a code; scale multiplies; as reads a date or time written in another form.
map:
  TRADE_ID: TicketNo
  TRADE_VERSION: Header.Rev
  TRADE_STATUS:
    from: Header.State
    values:
      BOOKED: NEW
      AMENDED: AMENDED
      CANCELLED: CANCELLED
  PRODUCT_GROUP:
    from: Instrument.AssetClass
    values:
      RATES: Rates
      FX: FX
      EQUITY: Equity
      CREDIT: Credit
      COMMODITY: Commodity
  PRODUCT_TYPE: Instrument.Kind
  BUY_SELL_CODE: Instrument.Side
  QUANTITY: Instrument.Units
  PRICE: Instrument.Px
  CURRENCY: Instrument.Ccy
  COUNTERPARTY: Parties.Cpty
  LEGAL_ENTITY: Parties.Entity
  PORTFOLIO: Parties.Book
  TRADER_ID: Header.EnteredBy
  TRADE_DATE:
    from: Dates.Trade
    as: yyyymmdd
  START_DATE:
    from: Dates.Start
    as: yyyymmdd
  MATURITY_DATE:
    from: Dates.End
    as: yyyymmdd
  SOURCE_UPDATE_TIME:
    from: Header.LastChange
    as: yyyymmddhhmmss
