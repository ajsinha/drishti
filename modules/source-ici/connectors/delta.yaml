# Template: copy to config/connectors/trade-ici.yaml. ICI's trades from the demo Delta lake: the shared table trading.trades_shared, split by where:.
# map:, where: and set: are the trade kind's source options (modules/trading/docs/guide.md, "Source systems").
plugin: delta
enabled: ${DRISHTI_LAKE_ENABLED:true}
kinds:
- trade
description: 'ICI trades read from the shared table trading.trades_shared, split by where: in the Delta lake'
settings:
  lake: demo
  lake-tables: trading.trades_shared
  union: true
  source-name: trade-ici
  where: SOURCE_SYSTEM = 'ICI'
  set:
    SOURCE_SYSTEM: ICI
  map: mappings/ici-trade.yaml
