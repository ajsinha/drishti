# Template: copy to config/connectors/trade-ici.yaml. ICI's trades from the demo Delta lake: its own table trading.trade_ici (one table a trading system).
# map:, where: and set: are the trade kind's source options (docs/guides/BANK_DATA_GUIDE.md, "Source systems").
name: trade-ici                      # the connector this template defines (KERNEL_AND_MODULES.md section 18.5)
plugin: delta
enabled: ${DRISHTI_LAKE_ENABLED:true}
kinds:
- trade
description: ICI trades read from its own table trading.trade_ici in the Delta lake
settings:
  lake: demo
  lake-tables: trading.trade_ici
  union: true
  source-name: trade-ici
  set:
    SOURCE_SYSTEM: ICI
  map: mappings/ici-trade.yaml
