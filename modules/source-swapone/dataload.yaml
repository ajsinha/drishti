# The inbox routing rules of the SwapOne source module (same format as config/dataload.yaml; the inbox reads a module's rules after the site's own).
# A file named swapone-<date>.jsonl.gz goes to the trade-swapone table; the connector's set: stamps SOURCE_SYSTEM = SWAPONE into each stored row.
dataload:
  rules:
  - match: "swapone-*.jsonl.gz"
    pack: trading
    kind: trade
    connector: trade-swapone
    date-from: name                  # the name carries the business date: swapone-2026-11-03.jsonl.gz
    key: swap_id
