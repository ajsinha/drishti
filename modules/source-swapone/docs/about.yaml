readme: 1
front: |
  summary: SwapOne OTC swaps, in the shared trades table (mocked data)
  kinds: [trade]
body: |
  # Source SwapOne

  SwapOne is an OTC swaps system (mocked here: a synthetic look-alike, UPPER_SNAKE names like Endur, a swap as a pay leg and a receive leg, epoch-millisecond update times).
  The data is **mocked**: a synthetic look-alike written by `tools/samplegen/src_swapone.py` (never real data, banks or counterparties), a few hundred trades over sixty business days in the system's own native style, with no positions and no scenario P&L, so the VaR does not move.

  This module is one source of the canonical `trade` kind: its rows carry `SOURCE_SYSTEM = SWAPONE`. It requires the `trading` module and
  can be switched on or off on its own (`config/modules/source-swapone.yaml`, `enabled: false`).

  ## Data structures

  | Kind | Where | Native key | Canonical fields it fills |
  |---|---|---|---|
  | `trade` | its own table trading.trade_swapone (one table a trading system) | `SWAP_ID` | `TRADE_ID`, `TRADE_VERSION`, `TRADE_STATUS`, `PRODUCT_TYPE`, `BUY_SELL_CODE`, `QUANTITY`, `PRICE`, `CURRENCY`, `COUNTERPARTY`, `LEGAL_ENTITY`, `PORTFOLIO`, `TRADER_ID`, `TRADE_DATE`, `START_DATE`, `MATURITY_DATE`, `SOURCE_UPDATE_TIME` |

  The guide: the bank data guide (`docs/guides/BANK_DATA_GUIDE.md`, in the package `guides/BANK_DATA_GUIDE.md`; Help, this module's section).
