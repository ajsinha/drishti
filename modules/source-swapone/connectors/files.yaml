# Template: copy to config/connectors/trade-swapone.yaml to read SwapOne's trades from JSON Lines files under the files root.
plugin: file
kinds:
- trade
description: SwapOne trades read from files
settings:
  root: ${DRISHTI_FILES_ROOT:${drishti.data.dir:./data}/files}
  domain: trading
  source-name: trade-swapone
  where: SOURCE_SYSTEM = 'SWAPONE'
  set:
    SOURCE_SYSTEM: SWAPONE
  map: mappings/swapone-trade.yaml
