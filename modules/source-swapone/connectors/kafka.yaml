# Template: copy to config/connectors/trade-swapone-live.yaml and bind the kind with live: trade-swapone-live in config/bindings.yaml.
# SwapOne's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
# trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
# until an administrator switches them on (Admin -> Edits).
plugin: kafka
enabled: ${DRISHTI_STREAM_SWAPONE:false}
kinds:
- trade
description: SwapOne's live trades, and the trade blotter's amendments written back to them
settings:
  bootstrap-servers: ${DRISHTI_KAFKA_BOOTSTRAP:localhost:9092}
  topics:
  - ${DRISHTI_SWAPONE_TOPIC:drishti.trading.swapone.trades}
  kind: trade
  id-field: SWAP_ID
  stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
  source-name: trade-swapone-live
  where: SOURCE_SYSTEM = 'SWAPONE'
  set:
    SOURCE_SYSTEM: SWAPONE
  map: mappings/swapone-trade.yaml
writes:
  amend-swapone-trade:
    kind: trade
    kafka:
      topic: ${DRISHTI_SWAPONE_TOPIC:drishti.trading.swapone.trades}
      shape: document
      version-field: REVISION
      changed-by: UPDATED_BY
      changed-at: UPD_TS
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
