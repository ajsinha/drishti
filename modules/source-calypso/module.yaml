# The Calypso source module's manifest (modules/trading/docs/guide.md, "Source systems"; docs/architecture/KERNEL_AND_MODULES.md section 3.3): content
# only, no code. One module a trading system, feeding the one canonical `trade` kind (SOURCE_SYSTEM = CALYPSO). It ships the connector
# templates (connectors/: read from Delta, Iceberg and files, a Kafka live stream with its write-back), the mapping of the native
# fields to the canonical ones (mappings/calypso-trade.yaml) and the inbox routing rules (dataload.yaml). Switch it on or off on its own
# (config/modules/source-calypso.yaml): off, the system's trades leave the trade kind and nothing else changes.
format: 1
id: source-calypso
version: 1.0.0
title: Source Calypso
about: 'Calypso trades (rates, credit, structured), one table of their own'
domain: trading
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: trading
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=1.4 <2'
requires:
  trading: '>=1.0 <2'
data:
  needs: data/needs.yaml
dataload: dataload.yaml
connectors:
  folder: connectors
mappings:
  trade: mappings/calypso-trade.yaml
docs:
  readme: docs/README.md
  help: docs/help.yaml
  guides:
  - docs/guide.md
  tutorials:
  - docs/guide.md
resources:
  memory-mb: 16
