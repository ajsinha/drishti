# Template: copy to config/connectors/trade-calypso.yaml. Calypso's trades from the demo Delta lake: its own table trading.trade_calypso.
# map:, where: and set: are the trade kind's source options (modules/trading/docs/guide.md, "Source systems").
plugin: delta
enabled: ${DRISHTI_LAKE_ENABLED:true}
kinds:
- trade
description: Calypso trades read from its own table trading.trade_calypso in the Delta lake
settings:
  lake: demo
  lake-tables: trading.trade_calypso
  union: true
  source-name: trade-calypso
  set:
    SOURCE_SYSTEM: CALYPSO
  map: mappings/calypso-trade.yaml
