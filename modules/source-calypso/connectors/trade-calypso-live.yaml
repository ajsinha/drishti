# The template of trade-calypso-live (a module that is on brings it; KERNEL_AND_MODULES.md section 18.5): off until DRISHTI_STREAM_<SYSTEM>=true or a site override (config/connectors/trade-calypso-live.yaml: enabled: true) switches it on.
# Calypso's live trades from Kafka, and the write-back (the writes: form of config/connectors.examples/other/trade-blotter-kafka.yaml): an amended
# trade goes back to the same topic as the whole record at its next version, so the stream brings it back and the row ticks. Writes are off
# until an administrator switches them on (Admin -> Edits).
name: trade-calypso-live                      # the connector this template defines (KERNEL_AND_MODULES.md section 18.5)
plugin: kafka
enabled: ${DRISHTI_STREAM_CALYPSO:false}
kinds:
- trade
description: Calypso's live trades, and the trade blotter's amendments written back to them
settings:
  broker: default
  topics:
  - ${DRISHTI_CALYPSO_TOPIC:drishti.trading.calypso.trades}
  kind: trade
  id-field: TRADE_ID
  stale-after: ${DRISHTI_STREAM_STALE_AFTER:15m}
  source-name: trade-calypso-live
  set:
    SOURCE_SYSTEM: CALYPSO              # the record's system: its corrections go back to this connector (section 18.6)
writes:
  amend-trade:                          # the trade blotter's command (modules/trading/blotters/trade.blotter.yaml): one name, each system's own connector
    kind: trade
    kafka:
      topic: ${DRISHTI_CALYPSO_TOPIC:drishti.trading.calypso.trades}
      shape: document
      version-field: TRADE_VERSION
      changed-by: UPDATED_BY
      changed-at: SOURCE_UPDATE_TIME
      change-id-field: DRISHTI_CHANGE_ID
    confirm: reply
