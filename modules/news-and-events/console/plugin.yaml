# The module's pages: a Sutra page per function, under /m/news-and-events/ (KERNEL_AND_MODULES.md section 9.8).
format: 2
module: news-and-events
title: News and events
routes:
- id: nwmk
  path: /news-and-markets
  sutra: news-and-markets/catalog
  function: NWMK
  title: News and markets
- id: topic
  path: /news-and-markets/news-topic/{id}
  sutra: news-and-markets/news-topic
  function: TOPIC
  title: News topic
- id: news
  path: /news-and-markets/news/{id}
  sutra: news-and-markets/news
  function: NEWS
  title: Headlines
- id: co
  path: /news-and-markets/listed-company/{id}
  sutra: news-and-markets/listed-company
  function: CO
  title: Listed company
- id: quote
  path: /news-and-markets/quote/{id}
  sutra: news-and-markets/quote
  function: QUOTE
  title: Quote and price history
- id: onews
  path: /official-news
  sutra: official-news/catalog
  function: ONEWS
  title: Official news
- id: press
  path: /official-news/release-source/{id}
  sutra: official-news/release-source
  function: PRESS
  title: Official press releases
- id: prel
  path: /official-news/press-release/{id}
  sutra: official-news/press-release
  function: PREL
  title: Press release
- id: gdlt
  path: /gdelt-events
  sutra: gdelt-events/catalog
  function: GDLT
  title: GDELT events
- id: gdelt
  path: /gdelt-events/event-country/{id}
  sutra: gdelt-events/event-country
  function: GDELT
  title: World events by country
