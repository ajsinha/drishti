# The news-and-events module's manifest (docs/architecture/KERNEL_AND_MODULES.md section 4; docs/plans/MODULE_RATIONALISATION.md): content only, no code.
# The distribution files list it by id, and their visibility filter reads this file: its packs, functions, menus and Help.
format: 1
id: news-and-events
version: 1.0.0
title: News and events
about: Official press releases, news and quotes by topic, and GDELT world events
domain: news-and-events
origin: first-party
publisher:
  id: drishti
  name: Ashutosh Sinha
licence:
  feature: news-and-events
kernel: '>=0.2 <1.0'
rachana: '>=1.0'
contracts: '>=1.0'
plugin-api: '>=2.0'
elements: '>=3.3 <4'
requires:
  optional:
    market-data: '>=1.0 <2'
provides:
  kinds:
    news-and-markets:
    - news-topic
    - news
    - listed-company
    - quote
    official-news:
    - release-source
    - press-release
    gdelt-events:
    - event-country
packs:
  folder: packs
  list:
  - news-and-markets
  - official-news
  - gdelt-events
  off-by-default:
  - official-news
  - gdelt-events
data:
  needs: data/needs.yaml
console:
  plugin: console/plugin.yaml
  menus:
  - id: markets
    columns:
    - title: News and quotes
      items:
      - id: news
        cmd: NEWS
        icon: newspaper
        label: News
        desc: The news by topic
        requires:
        - cmd:NEWS
      - id: quote
        cmd: QUOTE
        icon: currency-dollar
        label: Quotes
        desc: Quotes of listed companies and indices
        requires:
        - cmd:QUOTE
functions:
- NWMK
- TOPIC
- NEWS
- CO
- QUOTE
- ONEWS
- PRESS
- PREL
- GDLT
- GDELT
docs:
  readme: docs/README.md
  help: docs/help.yaml
  domains:
  - news-and-events
  guides:
  - guides/WORLD_DATA_GUIDE.md
  tutorials:
  - guides/WORLD_DATA_GUIDE.md
resources:
  memory-mb: 64
