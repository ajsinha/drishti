# Generated by tools/packgen/banking/make_sutras.py from the taxonomy. Edit the taxonomy, not this file.
rachana: 1.2
sutra: book
version: 1
description: "A trading book: owner desk, trades and risk."
doc:
  summary: "A trading book: owner desk, trades and risk."
  description: >-
    A trading book: owner desk, trades and risk. One page per book, its panels: largest trades; how the view was built; the
    entities it links to. The strip gives Name, Desk, Trades, MTM and DV01. Linked entities: desk (desk).
  params: {}
  emits: []
  expects: []
  examples:
    - "/v/book/BOOK-COMM-1"
    - "BOOK BOOK-COMM-1"
  category: "Organisation"
  tags: ["book", "organisation", "table"]
  use-when: "You have one book (its id, or a link from another screen) and want to read it in full: A trading book: owner desk, trades and risk."
  avoid-when: "You want many records of this kind side by side: use the pack's list or the BI pivot; this page shows one."
  data:
    in-words: "One book record (kind book); the page reads BOOK_ID, NAME, DESK_NAME, TRADE_COUNT, MTM, DV01, TOP_TRADES, DESK."
    sample-row: {"BOOK_ID": "BOOK-COMM-1", "NAME": "Commodities · book 1", "DESK_NAME": "Commodities", "TRADE_COUNT": 28, "MTM": 7760837, "DV01": 0, "DESK": "DESK-COMM", "ACCOUNTING_TREATMENT": "Fair value (FVTPL)"}
  example: "BOOK BOOK-COMM-1"
  see-also: ["desk"]
  keywords: ["book", "organisation"]
  since: "2.7.0"
match: { kind: book, priority: 10 }
title: { pill: Organisation · Book, id: $.BOOK_ID }
strip:
  - { label: Name, bind: $.NAME }
  - { label: Desk, bind: $.DESK_NAME }
  - { label: Trades, bind: $.TRADE_COUNT }
  - { label: MTM, bind: $.MTM, fmt: signed0, tone: sign, emphasis: true }
  - { label: DV01, bind: $.DV01, fmt: signed0, tone: sign }
panels:
  - id: trades
    kind: table
    title: Largest trades
    key: F2
    rows: $.TOP_TRADES
    pivot:
      fields: [PRODUCT, ASSET_CLASS, CURRENCY, BOOK, MATURITY_BUCKET, { field: MATURITY, label: Maturity date }, { field: NOTIONAL, fmt: compact }, { field: MTM, label: MTM (USD), fmt: signed0 }, TRADE_ID]
      rows: [PRODUCT]
      columns: [CURRENCY]
      values: [{ field: MTM, agg: sum }]
      filters: [ASSET_CLASS, MATURITY_BUCKET]
      heat: true
    columns:
      - { label: Trade, bind: "@.TRADE_ID" }
      - { label: Product, bind: "@.PRODUCT" }
      - { label: Notional, bind: "@.NOTIONAL", fmt: compact }
      - { label: Maturity, bind: "@.MATURITY", fmt: date }
      - { label: MTM, bind: "@.MTM", fmt: signed0, tone: sign, total: true }
  - { use: data-provenance@1 }
  - { use: linked-entities@1 }
keys: { F7: "link($.DESK, 'desk')", F8: impact, F9: raw }
