# The banking module's compute engines (docs/architecture/COMPUTE_ENGINES.md section 2, DOMAIN_MODULES.md): the same shape as the
# core's engines/catalogue.yaml, read with it by EngineCatalogue (a module's entries first). The console's byte-equal copy is
# drishti-console/plugins/banking/engines.yaml. Absent (the module not installed), these engines are not in the catalogue at all.
engines:
  - id: var
    title: VaR
    about: "VaR, ES, stressed VaR, the what-if, why it moved, regulatory VaR (backtesting, report runs, sign-off)"
    file: var.yaml
    switch: drishti.engines.var.enabled
    env: DRISHTI_VAR_ENABLED
    aliases: [drishti.var.enabled]
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.var, drishti.regulatory]
    needs: []
    uses: []
    api: [/api/v1/risk/var]
    console: [/var, /api/var/, /smat, /api/smat/, "=/play", /api/play/, /admin/scopes]
    words: [VAR, "VAR EXPLAIN", PVAR, SMAT, "PLAY VAR", SWIN]
    menus: [var-explorer, var-parametric, smat, play-var, play-pvar, backtesting, stress-window]
    help: [docs-guides-var-guide, docs-tutorials-25-var-from-the-bank-to-a-trade, docs-tutorials-43-parametric-var-beside-historical, docs-guides-regulatory-var-reporting]
    landings: []
    tiles: [VaR of the bank, VaR of the rates desk]
    lenses: []
    bi: [bi.market_risk_var_]
    cli: [var, play var]
    playgrounds: [var, pvar]
    connectors: [var-engine, var-positions, var-pv-stream]
    kinds: [var-result]
    inputs: [pnl-vector, scenario-pv]
    ai-tools: []
  - id: exposure
    title: Exposure
    about: "EE, ENE, PFE, EPE, EEPE, the exposure what-if and its playground"
    file: exposure.yaml
    switch: drishti.engines.exposure.enabled
    env: DRISHTI_EXPOSURE_ENABLED
    aliases: [drishti.ccr.exposure.enabled]
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.ccr.exposure]
    needs: []
    uses: []
    api: [/api/v1/risk/exposure]
    console: [/exposure, /api/exposure/]
    words: [EXP, "PLAY EXP", PREDEAL]
    menus: [exp-explorer, exp-cpty, exp-nset, predeal]
    help: [docs-guides-exposure-guide]
    landings: []
    tiles: []
    lenses: []
    bi: [counterparty-exposure-, live-exposure]
    cli: [exposure]
    playgrounds: [exposure]
    connectors: [exposure-engine]
    kinds: [exposure-result]
    inputs: [exposure-path, simulation-run]
    ai-tools: []
  - id: sensitivities
    title: Sensitivities
    about: "Position sensitivities and the factor dictionary: load, checks, sums by bucket"
    file: sensitivities.yaml
    switch: drishti.engines.sensitivities.enabled
    env: DRISHTI_SENSITIVITIES_ENABLED
    aliases: []
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.sensitivities]
    needs: []
    uses: []
    api: [/api/v1/risk/sensitivities, /api/v1/risk/risk-factors]
    console: [/api/frtb/sensitivities, /api/frtb/risk-factors]
    words: []
    menus: []
    help: []
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [sens]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: [position-sensitivity]
    ai-tools: []
  - id: frtb-sa
    title: FRTB-SA
    about: "FRTB-SA: the sensitivities-based method, DRC, RRAO and its playground"
    file: frtb-sa.yaml
    switch: drishti.engines.frtb-sa.enabled
    env: DRISHTI_FRTB_ENABLED
    aliases: [drishti.frtb.enabled]
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.frtb]
    needs: [var, sensitivities]
    uses: []
    api: [/api/v1/risk/frtb]
    console: [/frtb, /play/frtb, /api/frtb/]
    words: [FRSA, "PLAY FRTB"]
    menus: [frsa, play-frtb]
    help: [docs-guides-frtb-sa-guide, docs-tutorials-30-frtb-sa-from-the-cases-to-a-desk]
    landings: []
    tiles: []
    lenses: []
    bi: [market-risk-frtb-]
    cli: [frtb, play frtb]
    playgrounds: [frtb]
    connectors: []
    kinds: []
    inputs: [default-risk, residual-risk]
    ai-tools: []
  - id: simm
    title: SIMM
    about: "ISDA SIMM initial margin per netting set and regime, collect and post, and its playground"
    file: simm.yaml
    switch: drishti.engines.simm.enabled
    env: DRISHTI_SIMM_ENABLED
    aliases: [drishti.simm.enabled]
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.simm]
    needs: [sensitivities]
    uses: [exposure]
    api: [/api/v1/risk/simm]
    console: [/simm, /play/simm, /api/simm]
    words: [SIMM, "PLAY SIMM"]
    menus: [simm, play-simm]
    help: [docs-guides-simm-guide, docs-tutorials-32-simm-from-the-examples-to-a-netting-set]
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [simm, play simm]
    playgrounds: [simm]
    connectors: []
    kinds: []
    inputs: [simm-addon, crif-external]
    ai-tools: []
  - id: mr-cube
    title: MR cube
    about: "The market-risk cube on the pivot engine: VaR by hierarchy and risk class, components, ladders, heat map, what-if, explain the move"
    file: mr-cube.yaml
    switch: drishti.engines.mr-cube.enabled
    env: DRISHTI_MR_CUBE_ENABLED
    aliases: []
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.cube.mr]
    needs: [var, pivot]
    uses: [sensitivities, frtb-sa]
    api: [/api/v1/risk/mr]
    console: [/mcube, /api/pivot/mr/]
    words: [MCUBE]
    menus: [mcube]
    help: [docs-guides-mr-cube-guide, docs-tutorials-38-the-mr-cube-on-the-pivot-engine]
    landings: [mr-cube]
    tiles: []
    lenses: [mr-cube]
    bi: []
    cli: [pivot mr]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
