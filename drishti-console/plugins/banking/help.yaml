# The banking module's Help (docs/architecture/DOMAIN_MODULES.md section 8): its section's head (placed in Help's order after the
# section named by after:) and its pages, in the shapes of the sitemap's help-sections: and help.yaml's sections:. Read only while the
# module is installed in the console (this folder); while it is off on the server, Help hides the section like any of the module's.
help-sections:
  - { id: risk, after: get-started, name: Risk measures, icon: shield-check, blurb: "VaR, regulatory VaR, exposure, FRTB-SA and SIMM: a guide and a tutorial each" }


sections:
  - id: risk
    groups:
      - title: "Value at risk"
        words: [VAR]
        guides:
          - { slug: docs-guides-var-guide, domain: banking, engine: var, doc: guides/VAR_GUIDE.md, title: "VaR: guide and tutorial", icon: graph-down-arrow, summary: "Value at risk for any set of trades: every measure with worked numbers, the explorer screen by screen (the scope tree, Explain › on every figure, including matured positions), positions, scopes, portfolios and baskets, captures, history and backtesting, what-if and VaR as a kind, who sees what, why VaR moved against a compare date you choose (steps that add up exactly, their drivers, the working in formulas); the CLI, the API and settings; hierarchies configured by columns and the limit letters; Delta or Iceberg for the inputs and the official results; the data contract (every column, formula, answer and error code, official results, retention); how the engine keeps a date in memory and on disk, sizing and the benchmark." }
          - { slug: docs-guides-regulatory-var-reporting, domain: banking, engine: var, doc: guides/REGULATORY_VAR_REPORTING.md, title: "Regulatory VaR reporting: Canada and the US", icon: bank, summary: "OSFI CAR chapter 9 (FRTB, internal models, backtesting), BCAR 90.010, Pillar 3 MR1 and MR2, the annual report's trading VaR table; 12 CFR 217 subpart F, FFIEC 102, FR Y-9C, the 217.212 disclosures and the Volcker metrics; FRTB in outline. Every report item by item: who files, when, the definition and formula, the inputs and their data contracts, the demo figure and what is built. Period statistics, backtesting and the multiplier tables, capital; hypothetical P&L from base PVs; report definitions, checks, frozen runs, maker-checker sign-off and files; the planned inputs a bank supplies; coverage and roadmap." }
      - title: "Counterparty"
        words: [EXP, SIMM]
        guides:
          - { slug: docs-guides-exposure-guide, domain: banking, engine: exposure, doc: guides/EXPOSURE_GUIDE.md, title: "Exposure: guide and tutorial", icon: shield-exclamation, summary: "Counterparty exposure for any scope (EE, ENE, EEE, PFE, EPE, EEPE, EAD): every measure with worked numbers, the explorer screen by screen, scopes, collateral and netting, captures and compare, the pre-deal what-if (exact paths or the proxy), exposure as a kind, who sees what, the CLI, the API and settings; the data contract (every column, formula, answer and error code, official results, retention, the 76 stored sets reconciled); how the engine keeps a date in memory and on disk, and the open items." }
          - { slug: docs-guides-simm-guide, domain: banking, engine: simm, doc: guides/SIMM_GUIDE.md, title: "SIMM: guide and tutorial", icon: shield-lock, summary: "ISDA SIMM initial margin per netting set, collect and post, from the same position sensitivities as FRTB-SA: the netting set's trades and its CSA's version, regimes, calculation currency and add-ons; delta, vega, curvature and base correlation with the concentration factors at the rules' grain (per currency, per issuer and seniority, per factor), the capped bucket nets and the residual buckets, the risk classes with ψ and the product classes added; the bank's licensed parameter file (none shipped) and its keys; the SIMM screen with the counterparty's call, the playground (PLAY SIMM) with its switches, comparisons, recipes and the workbook of live formulas; the API, the CLI, the settings and the refusal codes." }
      - title: "Capital"
        words: [FRSA]
        guides:
          - { slug: docs-guides-frtb-sa-guide, domain: banking, engine: frtb-sa, doc: guides/FRTB_SA_GUIDE.md, title: "FRTB-SA: guide and tutorial", icon: bank2, summary: "Market-risk capital by the FRTB standardised approach for any scope, computed from the positions' sensitivities: the sensitivities-based method (delta, vega and curvature per risk class, the three correlation scenarios, the binding one, the alternative specification), the default risk charge and the residual risk add-on with worked numbers; the capital screen (FRSA), the playground (PLAY FRTB) with every method choice a switch, comparisons explained by step, recipes replayed to the cent and the workbook of live formulas; the API, the CLI, the settings, the refusal codes and the data contract in short." }
