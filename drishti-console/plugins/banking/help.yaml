# The banking module's Help (docs/architecture/DOMAIN_MODULES.md section 8): its section's head (placed in Help's order after the
# section named by after:) and its pages, in the shapes of the sitemap's help-sections: and help.yaml's sections:. Read only while the
# module is installed in the console (this folder); while it is off on the server, Help hides the section like any of the module's.
help-sections:
  - { id: risk, after: get-started, name: Risk measures, icon: shield-check, blurb: "VaR, regulatory VaR, exposure, FRTB-SA and SIMM: a guide and a tutorial each" }

sections:
  - id: risk
    groups:
      - title: "Value at risk"
        words: [VAR]
        guides:
          - { slug: docs-guides-var-guide, engine: var, pair: docs-tutorials-25-var-from-the-bank-to-a-trade, doc: guides/VAR_GUIDE.md, title: "VaR guide", icon: graph-down-arrow, summary: "Value at risk for any set of trades: every measure with worked numbers, the explorer screen by screen, positions, scopes, portfolios and baskets, captures, history and backtesting, what-if and VaR as a kind, who sees what, why VaR moved between two dates (steps that add up exactly, their drivers, the working in formulas); the CLI, the API and settings; hierarchies configured by columns and the limit letters; Delta or Iceberg for the inputs and the official results; the data contract (every column, formula, answer and error code, official results, retention); how the engine keeps a date in memory and on disk, sizing and the benchmark." }
          - { slug: docs-tutorials-25-var-from-the-bank-to-a-trade, engine: var, doc: tutorials/25-var-from-the-bank-to-a-trade.md, title: "VaR tutorial: from the bank to a trade", icon: mortarboard, kind: tutorial, summary: "Fifteen hands-on steps on the test data, each in the UI, on the command line and in YAML: open the bank's VaR, drill to a trade, the P&L path and contributions, your own scopes, derived positions, a basket captured and compared, the backtest, the hot file, VRES and a pre-deal what-if by the server's engine, entitlements, intraday updates from a pricing system, the limit letters (a hierarchy from the trades' columns), the 10-day VaR by √10 and by the sum of days, another confidence." }
          - { slug: docs-tutorials-43-parametric-var-beside-historical, engine: var, doc: tutorials/43-parametric-var-beside-historical.md, title: "Parametric VaR tutorial: beside historical, the fat-tail gap", icon: mortarboard, kind: tutorial, summary: "Seven hands-on steps, each in the UI, on the command line and as JSON or YAML: the explorer's Parametric toggle (PVAR BANK opens it on) and its three tiles, a desk's ? read line by line, the normal curve over the P&L histogram and the N toggle, the tail bin by bin, the Euler components adding up to the cent and the correlation matrix, pvar() in the MR cube, the playground's Parametric tab and its workbook's checks." }
          - { slug: docs-guides-regulatory-var-reporting, engine: var, doc: guides/REGULATORY_VAR_REPORTING.md, title: "Regulatory VaR reporting: Canada and the US", icon: bank, summary: "OSFI CAR chapter 9 (FRTB, internal models, backtesting), BCAR 90.010, Pillar 3 MR1 and MR2, the annual report's trading VaR table; 12 CFR 217 subpart F, FFIEC 102, FR Y-9C, the 217.212 disclosures and the Volcker metrics; FRTB in outline. Every report item by item: who files, when, the definition and formula, the inputs and their data contracts, the demo figure and what is built. Period statistics, backtesting and the multiplier tables, capital; hypothetical P&L from base PVs; report definitions, checks, frozen runs, maker-checker sign-off and files; the planned inputs a bank supplies; coverage and roadmap." }
      - title: "Counterparty"
        words: [EXP, SIMM]
        guides:
          - { slug: docs-guides-exposure-guide, engine: exposure, pair: docs-tutorials-26-exposure-from-the-bank-to-a-trade, doc: guides/EXPOSURE_GUIDE.md, title: "Exposure guide", icon: shield-exclamation, summary: "Counterparty exposure for any scope (EE, ENE, EEE, PFE, EPE, EEPE, EAD): every measure with worked numbers, the explorer screen by screen, scopes, collateral and netting, captures and compare, the pre-deal what-if (exact paths or the proxy), exposure as a kind, who sees what, the CLI, the API and settings; the data contract (every column, formula, answer and error code, official results, retention, the 76 stored sets reconciled); how the engine keeps a date in memory and on disk, and the open items." }
          - { slug: docs-tutorials-26-exposure-from-the-bank-to-a-trade, engine: exposure, doc: tutorials/26-exposure-from-the-bank-to-a-trade.md, title: "Exposure tutorial: from the bank to a trade", icon: mortarboard, kind: tutorial, summary: "Eight hands-on steps on the demo lake, each in the UI, on the command line and in YAML: the bank, a legal entity's counterparty board, CP-ALDERSHOT and its netting sets, collateral and trades of NS-ALDERSHOT-LDN, a trade alone and in its set, a capture compared, a pre-deal what-if (exact and proxy), the official results." }
          - { slug: docs-guides-simm-guide, engine: simm, pair: docs-tutorials-32-simm-from-the-examples-to-a-netting-set, doc: guides/SIMM_GUIDE.md, title: "SIMM guide", icon: shield-lock, summary: "ISDA SIMM initial margin per netting set, collect and post, from the same position sensitivities as FRTB-SA: the netting set's trades and its CSA's version, regimes, calculation currency and add-ons; delta, vega, curvature and base correlation with the concentration factors at the rules' grain (per currency, per issuer and seniority, per factor), the capped bucket nets and the residual buckets, the risk classes with ψ and the product classes added; the bank's licensed parameter file (none shipped) and its keys; the SIMM screen with the counterparty's call, the playground (PLAY SIMM) with its switches, comparisons, recipes and the workbook of live formulas; the API, the CLI, the settings and the refusal codes." }
          - { slug: docs-tutorials-32-simm-from-the-examples-to-a-netting-set, engine: simm, doc: tutorials/32-simm-from-the-examples-to-a-netting-set.md, title: "SIMM tutorial: from the hand-built examples to a netting set", icon: mortarboard, kind: tutorial, summary: "Seven hands-on steps with the toy parameter file (not ISDA's), each in the UI, on the command line and in YAML: a version installed and the empty structure refused, the hand-built examples checked by hand, a demo netting set both ways with its concentration factors, a switch compared in words, the workbook with the side and the switches flipped in Config, a recipe replayed to the cent, the margin against the counterparty's call." }
      - title: "Capital"
        words: [FRSA]
        guides:
          - { slug: docs-guides-frtb-sa-guide, engine: frtb-sa, pair: docs-tutorials-30-frtb-sa-from-the-cases-to-a-desk, doc: guides/FRTB_SA_GUIDE.md, title: "FRTB-SA guide", icon: bank2, summary: "Market-risk capital by the FRTB standardised approach for any scope, computed from the positions' sensitivities: the sensitivities-based method (delta, vega and curvature per risk class, the three correlation scenarios, the binding one, the alternative specification), the default risk charge and the residual risk add-on with worked numbers; the capital screen (FRSA), the playground (PLAY FRTB) with every method choice a switch, comparisons explained by step, recipes replayed to the cent and the workbook of live formulas; the API, the CLI, the settings, the refusal codes and the data contract in short." }
          - { slug: docs-tutorials-30-frtb-sa-from-the-cases-to-a-desk, engine: frtb-sa, doc: tutorials/30-frtb-sa-from-the-cases-to-a-desk.md, title: "FRTB-SA tutorial: from the hand-built cases to a desk", icon: mortarboard, kind: tutorial, summary: "Six hands-on steps, each in the UI, on the command line and in YAML: the hand-built cases' capital and a bucket checked by hand, the three scenarios, a switch flipped and explained by step, the workbook recomputed with a switch flipped in Config, a recipe saved and replayed to the cent, the rates desk of the demo data with its contributions." }
