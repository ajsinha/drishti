  The Playground's sandbox (the frame the gallery runs edited code in): loaded with sandbox="allow-scripts" and no same-origin, so it has no
  cookies, no storage and no access to the page; served with a content security policy that allows no network at all. It waits for one message
  from its parent: the page to draw, written in place.
-->
<html><head><meta charset="utf-8"><title>Playground frame</title></head>
<body><script>
window.addEventListener('message', function (e) {
  if (e.source !== window.parent || !e.data || e.data.type !== 'drishti-playground-page') { return; }
  document.open();
  document.write(e.data.html);
  document.close();
});
window.parent.postMessage({ type: 'drishti-playground-ready' }, '*');
</script></body></html>
