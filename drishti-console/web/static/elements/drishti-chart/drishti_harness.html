  &level=USA to open a country) | link (a drishti-grid and a chart linked through the bus); &density=compact|comfortable|terminal,

<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drishti-chart · fixture harness</title>
<link rel="stylesheet" href="../../css/drishti_tokens.css">
<link rel="stylesheet" href="drishti_chart.css">
<link rel="stylesheet" href="../drishti-grid/drishti_grid.css">
<link rel="stylesheet" href="drishti_harness.css">
</head>
<body>
<header class="hx-top">
  <b class="hx-brand">drishti-chart</b>
  <span class="hx-seg" role="group" aria-label="View">
    <button type="button" data-view="board">Board (card)</button><button type="button" data-view="studio">Studio</button><button type="button" data-view="map">Map</button><button type="button" data-view="link">Linked with a grid</button>
  </span>
  <span class="hx-seg" role="group" aria-label="Density">
    <button type="button" data-density="comfortable">Comfortable</button><button type="button" data-density="compact">Compact</button><button type="button" data-density="terminal">Terminal</button>
  </span>
  <button type="button" id="hx-theme">Light / dark</button>
  <button type="button" id="hx-tick">Live tick</button>
  <span id="hx-log" class="hx-log" aria-live="off"></span>
</header>
<main id="hx-stage" class="hx-stage"></main>
<script src="../drishti-core/drishti_core.js"></script>
<script src="../../vendor/echarts/echarts.min.js"></script>
<script src="drishti_chart.js"></script>
<script src="../drishti-grid/drishti_grid.js"></script>
<script src="../drishti-risk/drishti_risk.js"></script>
<script src="drishti_harness.js"></script>
</body>
</html>
