  the shell (objects, Visual / YAML / Both, the header's actions, Propose for review to a stand-in approvals queue), the palette, the
  grid canvas, the inspector, the outline and the YAML pane kept in step both ways; below it a flow canvas (two columns of panels, as a
  screen is laid out). ?theme=light. Nothing inline: it runs under a strict CSP. The browser test is tests/test_elements_designer_browser.py.

<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drishti-designer · fixture harness</title>
<link rel="stylesheet" href="../../css/drishti_tokens.css">
<link rel="stylesheet" href="../drishti-inputs/drishti_inputs.css">
<link rel="stylesheet" href="../drishti-grid/drishti_grid.css">
<link rel="stylesheet" href="../drishti-tree/drishti_tree.css">
<link rel="stylesheet" href="drishti_designer.css">
<link rel="stylesheet" href="drishti_harness.css">
</head>
<body>
<header class="hx-top">
  <b class="hx-brand">drishti-designer</b>
  <button type="button" id="hx-theme">Light / dark</button>
  <span id="hx-log" class="hx-log" aria-live="off"></span>
</header>
<div id="hx-shell"></div>
<section class="hx-card" aria-labelledby="hx-h-flow">
  <h2 id="hx-h-flow">A flow layout: a screen's main and side columns</h2>
  <div id="hx-flow" class="hx-flow">
    <div class="hx-area" data-area="main"></div>
    <div class="hx-area hx-side" data-area="right"></div>
  </div>
</section>
<section class="hx-card" aria-labelledby="hx-h-area">
  <h2 id="hx-h-area">A page's code area (drishti-inputs makes it a code editor)</h2>
  <form id="hx-area-form"><textarea id="hx-area" name="body" data-di-code="yaml" rows="4" aria-label="An item's YAML">title: A page's own text area</textarea></form>
</section>
<script src="../drishti-core/drishti_core.js"></script>
<script src="../drishti-inputs/drishti_inputs.js"></script>
<script src="../drishti-grid/drishti_grid.js"></script>
<script src="../drishti-tree/drishti_tree.js"></script>
<script src="drishti_designer.js"></script>
<script src="drishti_harness.js"></script>
</body>
</html>
