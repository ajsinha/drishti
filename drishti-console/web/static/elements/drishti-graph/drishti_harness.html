  address: ?view=inspector (g5 A, the default) | table (B) | terminal (C) | lineage (the layered preset) | link (a drishti-grid and the
  graph linked through the bus) | big (5,000 nodes and 20,000 edges: the timings) | panel (a view's graph panel); &density=compact|

<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drishti-graph · fixture harness</title>
<link rel="stylesheet" href="../../css/drishti_tokens.css">
<link rel="stylesheet" href="../drishti-inputs/drishti_inputs.css">
<link rel="stylesheet" href="../drishti-grid/drishti_grid.css">
<link rel="stylesheet" href="drishti_graph.css">
<link rel="stylesheet" href="drishti_harness.css">
</head>
<body>
<header class="hx-top">
  <b class="hx-brand">drishti-graph</b>
  <span class="hx-seg" role="group" aria-label="View">
    <button type="button" data-view="inspector">A · Inspector</button><button type="button" data-view="table">B · Table</button><button type="button" data-view="terminal">C · Terminal</button><button type="button" data-view="lineage">Lineage</button><button type="button" data-view="link">Linked with a grid</button><button type="button" data-view="big">5,000 nodes</button><button type="button" data-view="panel">View panel</button>
  </span>
  <span class="hx-seg" role="group" aria-label="Density">
    <button type="button" data-density="comfortable">Comfortable</button><button type="button" data-density="compact">Compact</button><button type="button" data-density="terminal">Terminal</button>
  </span>
  <button type="button" id="hx-theme">Light / dark</button>
  <button type="button" id="hx-tick">Live tick</button>
  <span id="hx-log" class="hx-log" aria-live="off"></span>
</header>
<main id="hx-stage" class="hx-stage"></main>
<script src="../drishti-core/drishti_core.js"></script>
<script src="../drishti-inputs/drishti_inputs.js"></script>
<script src="../drishti-grid/drishti_grid.js"></script>
<script src="drishti_graph.js"></script>
<script src="drishti_harness.js"></script>
</body>
</html>
