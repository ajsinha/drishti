<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drishti-grid · fixture harness</title>
<link rel="stylesheet" href="../../css/drishti_tokens.css">
<link rel="stylesheet" href="drishti_grid.css">
<link rel="stylesheet" href="drishti_harness.css">
</head>
<body>
<header class="hx-top">
  <b class="hx-brand">drishti-grid</b>
  <span class="hx-seg" role="group" aria-label="Layout">
    <button type="button" data-layout="wells">Wells</button><button type="button" data-layout="panel">Panel</button><button type="button" data-layout="terminal">Terminal</button>
  </span>
  <span class="hx-seg" role="group" aria-label="Density">
    <button type="button" data-density="comfortable">Comfortable</button><button type="button" data-density="compact">Compact</button><button type="button" data-density="terminal">Terminal</button>
  </span>
  <button type="button" id="hx-theme">Light / dark</button>
  <button type="button" id="hx-tick">Tick</button>
  <button type="button" id="hx-stream" aria-pressed="false">Stream</button>
  <span id="hx-log" class="hx-log" aria-live="off"></span>
</header>
<main id="hx-stage" class="hx-stage"></main>
<script src="../drishti-core/drishti_core.js"></script>
<script src="drishti_grid.js"></script>
<script src="drishti_harness.js"></script>
</body>
</html>
