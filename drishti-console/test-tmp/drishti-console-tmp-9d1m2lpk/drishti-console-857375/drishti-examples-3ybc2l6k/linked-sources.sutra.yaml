rachana: 1
sutra: linked-sources
version: 1
description: >
  Panels that read other entities with `source`. These need the live demo packs (counterparty, netting set, desk),
  so unlike the other examples this one is not self-contained.
match: { kind: trade }
title: { pill: "Linked sources · ${$.PRODUCT_TYPE}", id: $.TRADE_ID }
panels:
  - id: sets
    kind: tabs
    title: The counterparty's netting sets
    span: 6
    source: "link($.COUNTERPARTY, 'counterparty')"
    each: $.NETTING_SETS
    tabTitle: "@.ID"
    body:
      kind: kv
      columns:
        - { label: Agreement, bind: "@.AGREEMENT", link: true }
        - { label: Trades, bind: "@.TRADES" }
        - { label: Net MTM, bind: "@.NET_MTM", fmt: signed0, tone: sign }
  - { id: assets, kind: hbar, title: "The netting set's MTM by asset (USD)", span: 6, source: "link($.NETTING_SET, 'netting-set')",
      rows: $.BY_ASSET, label: ASSET, value: MTM, fmt: signed0, tone: sign }
  - { id: grid, kind: pivot, title: "The desk's MTM by book and family (USD)", source: "link($.DESK, 'desk')",
      rows: $.POSITIONS, by: BOOK, across: FAMILY, value: MTM, heat: true, fmt: compact, tone: sign }
