# Generated at first start from the connector template of pack 'market-data'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
# drishti-template: pack=market-data template=d1dddfb2cf995cd7 text=d1dddfb2cf995cd7
plugin: feed
enabled: "${DRISHTI_FEED_FRED:false}"
kinds:
- rate-fixing
settings:
  feed: fred
  user-agent: "${drishti.branding.product:feed} public data feed connector"
  stale-after: 4d
  refresh-minutes: 60
  api-key: "${FRED_API_KEY:}"
  series: "${DRISHTI_FRED_SERIES:DGS10,DFF}"
