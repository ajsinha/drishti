# Generated at first start from the connector template of pack 'news-and-markets'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
# drishti-template: pack=news-and-markets template=0128cd73283c60d3 text=0128cd73283c60d3
plugin: yfinance
enabled: "${DRISHTI_YFINANCE_ENABLED:false}"
kinds:
- quote
settings:
  base-url: "${DRISHTI_YFINANCE_URL:https://query1.finance.yahoo.com/v8/finance/chart}"
  range: 6mo
  interval: 1d
  timeout-seconds: 10
  cache-ttl-seconds: 60
  cache-max-symbols: 100
  user-agent: "${drishti.branding.product:Drishti} yfinance connector (sample)"
