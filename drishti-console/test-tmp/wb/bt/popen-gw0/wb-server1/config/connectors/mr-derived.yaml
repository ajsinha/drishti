# Generated at first start from the connector template of pack 'market-risk'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
# drishti-template: pack=market-risk template=73b081fcdc3fda5e text=73b081fcdc3fda5e
plugin: derived
enabled: "${DRISHTI_MR_DERIVED_ENABLED:true}"
description: "The bank's stress P&L per scenario: the desks' stress results added,\
  \ with each desk's limit use and breaches, once per business date (until the stress\
  \ engine computes it)"
kinds:
- stress-scenario-pnl
settings:
  refresh: 60s
  stress-scenario-pnl.from: stress-result
  stress-scenario-pnl.group-by: $.SCENARIO
  stress-scenario-pnl.id-field: SCENARIO_ID
  stress-scenario-pnl.members: RESULT_IDS
  stress-scenario-pnl.max-members: 1000
  stress-scenario-pnl.rows-field: DESKS
  stress-scenario-pnl.fields.DESK_COUNT: count
  stress-scenario-pnl.fields.PNL: sum $.PNL
  stress-scenario-pnl.fields.WORST_DESK_PNL: min $.PNL
  stress-scenario-pnl.fields.SCENARIO_NAME: first $.SCENARIO_NAME
  stress-scenario-pnl.fields.LIMIT: sum $.LIMIT
  stress-scenario-pnl.rows.RESULT_ID: $.RESULT_ID
  stress-scenario-pnl.rows.DESK: $.DESK
  stress-scenario-pnl.rows.PNL: $.PNL
  stress-scenario-pnl.rows.LIMIT: $.LIMIT
  stress-scenario-pnl.rows.LIMIT_USE: "$.LIMIT > 0 ? max(-$.PNL, 0) / $.LIMIT : null"
  stress-scenario-pnl.rows.STATUS: "$.LIMIT > 0 ? (max(-$.PNL, 0) / $.LIMIT > 1 ?\
    \ 'BREACH' : 'OK') : null"
  stress-scenario-pnl.then.BREACHES: "size($.DESKS[?@.LIMIT_USE > 1])"
  stress-scenario-pnl.then.WORST_LIMIT_USE: "max($.DESKS[*].LIMIT_USE)"
  stress-scenario-pnl.then.BY_DESK: "group($.DESKS, 'DESK', 'PNL')"
  stress-scenario-pnl.sort.DESKS: PNL asc
  stress-scenario-pnl.sort.BY_DESK: value asc
