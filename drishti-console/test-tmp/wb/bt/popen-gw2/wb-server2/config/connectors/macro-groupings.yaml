# Generated at first start from the connector template of pack 'world-economy'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
# drishti-template: pack=world-economy template=cb0f48701260fa77 text=cb0f48701260fa77
plugin: derived
enabled: "${DRISHTI_LAKE_ENABLED:true}"
kinds:
- country-group
settings:
  refresh: 60s
  source-name: macro-groupings
  country-group.from: economy
  country-group.group-by: $.REGION_GROUP
  country-group.also-group-by.income: $.INCOME_GROUP
  country-group.also-group-by.world: '''ECG-WLD'''
  country-group.id-field: GROUP_ID
  country-group.search-fields: NAME
  country-group.members: MEMBER_ECONOMIES
  country-group.max-members: 100000
  country-group.rows-field: ROWS
  country-group.fields.ECONOMIES: count
  country-group.fields.GDP_USD_BN: sum $.GDP_USD_BN
  country-group.fields.POPULATION_M: sum $.POPULATION_M
  country-group.fields.GDP_PC_GDP: "sum $.POPULATION_M == null ? null : $.GDP_USD_BN"
  country-group.fields.GDP_PC_POP: "sum $.GDP_USD_BN == null ? null : $.POPULATION_M"
  country-group.fields.GROWTH_WEIGHTED: "sum $.GROWTH == null || $.GDP_USD_BN == null\
    \ ? null : $.GDP_USD_BN * $.GROWTH"
  country-group.fields.GROWTH_WEIGHT: "sum $.GROWTH == null || $.GDP_USD_BN == null\
    \ ? null : $.GDP_USD_BN"
  country-group.fields.INFLATION: median $.INFLATION
  country-group.fields.WITH_GROWTH: "sum $.GROWTH == null ? 0 : 1"
  country-group.fields.WITH_INFLATION: "sum $.INFLATION == null ? 0 : 1"
  country-group.fields.REGION_KEYS: distinct $.REGION_GROUP
  country-group.fields.REGION_NAMES: distinct $.REGION_NAME
  country-group.fields.INCOME_NAMES: distinct $.INCOME_NAME
  country-group.fields.YEARS: distinct $.YEAR
  country-group.fields.PROVENANCE: first $.PROVENANCE
  country-group.rows.ECONOMY_ID: $.ECONOMY_ID
  country-group.rows.ECONOMY: $.NAME
  country-group.rows.ISO3: $.ISO3
  country-group.rows.GDP_USD_BN: $.GDP_USD_BN
  country-group.rows.POPULATION_M: $.POPULATION_M
  country-group.rows.GDP_PER_CAPITA: $.GDP_PER_CAPITA
  country-group.rows.GROWTH: $.GROWTH
  country-group.rows.INFLATION: $.INFLATION
  country-group.rows.YEAR: $.YEAR
  country-group.rows.GDP_PATH: $.GDP_PATH
  country-group.then.NAME: "$.GROUP_ID == 'ECG-WLD' ? 'World' : (size($.REGION_KEYS)\
    \ == 1 && first($.REGION_KEYS) == $.GROUP_ID ? first($.REGION_NAMES) : first($.INCOME_NAMES))"
  country-group.then.GROUP_TYPE: "$.GROUP_ID == 'ECG-WLD' ? 'World' : (size($.REGION_KEYS)\
    \ == 1 && first($.REGION_KEYS) == $.GROUP_ID ? 'World Bank region' : 'World Bank\
    \ income group')"
  country-group.then.GDP_PER_CAPITA: "$.GDP_PC_POP > 0 ? $.GDP_PC_GDP * 1000 / $.GDP_PC_POP\
    \ : null"
  country-group.then.GROWTH: "$.GROWTH_WEIGHT > 0 ? $.GROWTH_WEIGHTED / $.GROWTH_WEIGHT\
    \ : null"
  country-group.then.YEAR: last($.YEARS)
  country-group.then.GDP_PATH: "group(flatten($.ROWS[*].GDP_PATH), 'YEAR', 'GDP')"
  country-group.then.TOP_ECONOMIES: $.ROWS
  country-group.sort.ROWS: GDP_USD_BN desc
  country-group.sort.TOP_ECONOMIES: GDP_USD_BN desc 10
