# Generated at first start from the connector template of pack 'market-risk'. Edit it freely: an edited file is never overwritten; an unedited one follows the pack's template at an upgrade.
# drishti-template: pack=market-risk template=a47194780ba1adc7 text=a47194780ba1adc7
plugin: reactive
mode: reactive
enabled: "${DRISHTI_VAR_ENABLED:true}"
description: "The VaR of any scope, computed when asked by the server's VaR engine\
  \ (the additive aggregation over the hot store), as the viewer: VRES <scope> <GO>"
kinds:
  var-result:
    compute: var-result
    params:
      ccy:
        type: text
        default: USD
      horizon:
        type: enum
        options:
        - 1d
        - 10d
        default: 1d
      method:
        type: enum
        options:
        - default
        - sqrt10
        - sum
        default: default
      confidence:
        type: decimal
        min: 0.5
        max: 0.9999
      es-confidence:
        type: decimal
        min: 0.5
        max: 0.9999
    result:
      required:
      - VAR
      - ES
      - PNL
      types:
        VAR: number
        ES: number
engine:
  type: java
  class: com.ash.drishti.server.var.VarResultEngine
  version: 1.0
triggers:
- "on": data-version
  kinds:
  - pnl-vector
  - scenario-pv
  - fx-scenario
  - risk-hierarchy
  - scenario-set
  - portfolio
  - var-limit
  affects: all
coalesce:
  quiet: 250ms
  max-wait: 2s
cache:
  results: 2000
  ttl: 1h
limits:
  timeout: 60s
  wait: 5s
  max-inflight-per-user: 4
