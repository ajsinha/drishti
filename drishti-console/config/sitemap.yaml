# The sitemap: the one home of navigation (2.9.11.e; docs/guides/USER_GUIDE.md › Finding your way). One file draws the top bar's menus,
# the Admin pages' tab strip (the admin menu), the BI rail (the bi menu), the Build home's links (the build menu), Help's sections
# (help-sections:) and the footer; core/menus.py draws each. tests/test_sitemap.py guards it: every page the console answers is listed
# here once (or is in-context: below, reached from a list it names), no id is used twice and no address is listed twice.
#
# Each item: id, href, icon, label, desc, match (the path prefix that marks it current; blank: the href only), tab (the Admin tab it
# marks, default its id) and requires: a list, every entry of which must hold:
#   admin                the person is an administrator          bi        BI is on for the person (the bi power, BI switched on)
#   bi-admin             the person holds the bi-admin power     designer  the Sutra designer is on (ui.designer)
#   feature:<name>       a feature switch (config/distributions/kernel.yaml features:; the console's features.* and the presets of an edition)
#   word:<WORD>          a reserved or console word the edition keeps (BI, FORM, FUNC, WHAT, DATAMAP, VAR, EXP)
#   admin-page:<id>      an Admin page the edition keeps          edition   only with an edition or a lens (a full Drishti hides it)
#   pack:<name>          a pack that is on for the person
#   cmd:<WORD>           a command the edition shows (its commands.allow, or a word it keeps)
#   route:<path>         the server has a page at that path
#   engine:<id>          the compute engine runs on a server of the cluster
#   module:<id>          the domain module is on for the person (ACCESS_MODEL.md)
# Visibility tags, on an item, a column or a menu (the innermost wins): domain: the domain module it belongs to (core when not said;
# banking, economy: drawn while the module is on for the person, as the server says: core/modules.py). What a person sees follows
# their role (requires:), per request: nothing is kept per person; a lens arranges the menus and hides nothing.
# also: [ids] on a menu draws items listed elsewhere in it (the Admin strip's BI settings and Commands, the BI rail's Pivot) without
# listing them twice. rail: false on a BI item keeps it out of the BI rail (the top bar's BI menu only).
# An edition (or a lens) lists the items it shows per menu (menus.<menu-id>: [item ids]); a menu it does not name keeps every item its
# requirements allow, and a menu with no item left is not drawn. {product} and {tutorials} are filled in.
# An edition's menus.top names its top menus by id, in order (a menu it does not name is not drawn); without one, every menu below in
# its order except the subject menus (subject: true), which only a menus.top draws. A menu's gather: [ids] puts the columns of those
# menus first in its own (the Markets menu), each item filtered as the gathering menu's (menus.<its id> in the edition).
menus:
  - id: views
    label: Views
    icon: grid-1x2
    columns:
      - title: Look up
        items:
          - { id: terminal, href: /t, icon: terminal, label: Terminal, desc: "Type a command or an id, then <GO>", match: /t }
          - { id: search, href: /s, icon: search, label: "Search & pick lists", desc: "TRD MX-200000, TRD PRODUCT_TYPE=FX_QUANTO, TRD where …", match: /s }
          - { id: forms, href: /forms, icon: card-checklist, label: Forms, desc: "Query by form: every pack with a search form, your recent forms and saved searches. Also: FORM <GO>", match: /form, requires: [feature:forms, word:FORM] }
          - { id: functions, href: /func, icon: list-ul, label: Functions, desc: "Every command you can use, what it does · also FUNC <GO>", match: /func, requires: [word:FUNC] }
          - { id: datamap, href: /datamap, icon: diagram-3, label: Data map, desc: "Every kind of data, how it joins and how much there is · also DATAMAP <GO>", match: /datamap, requires: [feature:datamap, word:DATAMAP] }
          - { id: data, href: /data, icon: cloud-arrow-down, label: Export data, desc: "Every dataset, its dates; choose columns and filters, download a day as .jsonl.gz · also EXPORT <GO> (or DATA)", match: /data/, requires: [feature:data, word:DATA] }
          - { id: pivot, cmd: PIVOT, href: /pivot, icon: grid-3x3-gap, label: Pivot, desc: "Any table, any entity document or VaR as a pivot: nested rows opened lazily, right totals, provenance, charts, Excel with formulas · also PIVOT <GO>", match: /pivot, requires: [word:PIVOT, route:/pivot] }
          - { id: reports, href: /reports, icon: file-earmark-bar-graph, label: Reports, desc: "Every report you have: scheduled reports, subscriptions, alerts, and BI reports", match: /reports, requires: [feature:reports] }
      - title: Watch
        items:
          - { id: workspaces, href: /w, icon: grid-1x2, label: Workspaces, desc: Several live views on one screen, match: /w, requires: [feature:workspaces] }
          - { id: monitors, href: /m, icon: list-columns, label: Monitors, desc: Live watchlists of entities, match: /m, requires: [feature:monitors] }
          - { id: alerts, href: /alerts, icon: bell, label: Alerts, desc: "Alerts raised for you (acknowledge, snooze, resolve) and your alert rules", match: /alerts, requires: [feature:alerts] }
          - { id: approvals, href: /approvals, icon: patch-check, label: Approvals, desc: "Everything waiting for your four eyes, of every kind, due soon on top", match: /approvals }
  # The modules' own menus (Blotter, Positions, Risk, Counterparties, Markets, Economies, Companies ...) are not here: each lives in
  # its module's manifest (console.menus: modules/<id>/module.yaml), drawn while the module is in the distribution and on.
  # The BI menu is also the BI rail (bi/shell.html), in this order; rail: false keeps an item to the top bar's menu; also: the rail's
  # links to items listed in other menus (the Pivot, the Build home).
  - id: bi
    label: BI
    icon: bar-chart-line
    also: [build-home, tables-models, pivot]
    columns:
      - title: Business intelligence
        items:
          - { id: bi-catalogue, href: /bi/catalogue, icon: collection, label: Catalogue, desc: "Every published report and board you may open. Also: RUPAKA CATALOGUE", match: /bi/catalogue, requires: [bi, word:BI] }
          - { id: bi-workspace, href: /bi/w/me, icon: person-workspace, label: My workspace, desc: "Your drafts, and the shared workspaces you belong to. Also: RUPAKA WORKSPACE", match: /bi/w/, requires: [bi, word:BI] }
          - { id: bi-runs, href: "/bi/w/me?tab=runs", icon: activity, label: My runs, desc: "Your BI questions queued or running, and the last ones answered", requires: [bi, word:BI] }
          - { id: bi-workspaces, href: /bi/workspaces, icon: diagram-3, label: Workspaces, desc: "Every shared workspace you belong to, and its members", match: /bi/workspaces, requires: [bi, word:BI] }
      - title: Analyse
        items:
          - { id: bi-models, href: /bi/models, icon: boxes, label: Models, desc: "Semantic models: their tables, relationships and measures", match: /bi/models, requires: [bi, word:BI] }
          - { id: bi-datasets, href: /bi/datasets, icon: hdd-stack, label: Datasets, desc: "The datasets reports read, with their refresh", match: /bi/datasets, requires: [bi, word:BI] }
          - { id: bi-designer, href: /bi/designer, icon: bounding-box, label: Report designer, desc: "Drag fields onto a canvas: a report or a board", match: /bi/designer, requires: [bi, word:BI] }
          - { id: bi-environments, href: /bi/environments, icon: arrow-left-right, label: "Promotion (test to live)", desc: "Move reports and models from one environment to the next", match: /bi/environments, requires: [bi, word:BI] }
          - { id: bi-notebook, href: /bi/notebook, icon: journal-code, label: Notebook, desc: "Questions in Python over the models, step by step", match: /bi/notebook, requires: [bi, word:BI] }
          - { id: bi-transform, href: /bi/transform, icon: funnel, label: Data prep, desc: "Python data preparation, step by step, with a snippets library", match: /bi/transform, requires: [bi, word:BI] }
      - title: Administer
        items:
          - { id: bi-settings, tab: bi, href: /admin/bi, icon: sliders, label: BI settings, desc: "Powers per role, who creates workspaces", match: /admin/bi, rail: false, requires: [bi, bi-admin, admin-page:bi] }
  # The Build menu: the one Build home (2.9.11.e, docs/architecture/SHARED_SCREENS.md section 1) and the guided starts. The home's rail
  # (Data, Screens, Analysis, Work) is the registry of object types (core/build_registry.py), not a list here.
  - id: build
    label: Build
    icon: braces
    columns:
      - title: Create
        items:
          - { id: build-home, href: /build, icon: house-gear, label: Build home, desc: "Everything you can build in one place: data, screens, analysis, your drafts and reviews", match: /build, requires: [feature:build] }
          - { id: new-screen, href: /build/new, icon: plus-square, label: New screen, desc: "Bring JSON files, a schema or stored entities, then design", match: /build/new, requires: [feature:build] }
          - { id: new-pack, href: /build/pack/designer, icon: box-seam, label: New pack, desc: "A folder of JSON Lines files in, a module with its Sutras designed, checked and deployed out", match: /build/pack, requires: [feature:build] }
          - { id: new-connector, href: /build/connector/designer, icon: plug, label: New connector, desc: "Pick a type, fill its settings, test it, preview real rows, bind it to kinds and apply: four eyes, no restart", match: /build/connector, requires: [admin, admin-page:connectors] }
          - { id: tables-models, href: /build/tables, icon: table, label: "Tables & models", desc: "Virtual tables, semantic models and Python-driven tables: one editor, live YAML, a preview as you may see it, review before live", match: /build/tables, requires: [bi, word:BI] }
          - { id: examples, href: "/build/new#examples", icon: journal-richtext, label: Examples, desc: Every example opens as your own copy, requires: [feature:build] }
      - title: Learn
        items:
          - { id: tutorials, href: /help/tutorials, icon: mortarboard, label: Tutorials, desc: "{tutorials} hands-on tutorials, a picture of every step", requires: [feature:build] }
          - { id: schema-to-pack, href: /help/build-guide#8-the-pack-designer-build--new-pack, icon: diagram-3, label: Pack designer guide, desc: "From JSON Lines files to a deployed module: the six steps", requires: [feature:build] }
          - { id: screen-designer, href: /help/rachana-reference#screen-designer-and-the-build-workbench, icon: bounding-box, label: Screen designer guide, desc: "From JSON files to a screen: the canvas, step by step", requires: [feature:build] }
          - { id: sutra-guide, href: /help/build-guide#11-what-a-sutra-is-and-when-one-applies, icon: journal-code, label: Screen developer guide, desc: "Writing a screen (a Sutra) end to end, by example", requires: [feature:build] }
          - { id: panels, href: /help/rachana-reference#panels-the-twenty-two-kinds-and-developing-a-new-one, icon: grid-1x2, label: Panel kinds, desc: "The 22 panel kinds, one entry each", requires: [feature:build] }
          - { id: rachana-reference, href: /help/rachana-reference, icon: book, label: Screen language reference, desc: "Rachana, the screen language: every key, panel option, format and problem code", requires: [feature:build] }
          - { id: pack-guide, href: /help/build-guide, icon: box-seam, label: Packs and screens guide, desc: "Bring a new domain in, step by step", requires: [feature:build] }
          - { id: elements-gallery, href: /elements, icon: puzzle, label: Elements gallery, desc: "Every {product} Elements component live: its options, code, events, API and accessibility", match: /elements, requires: [feature:build] }
  # The Admin menu is also the tab strip of every Admin page (admin/_nav.html), in this order; tab: the page's tab when it is not the
  # item's id; also: the strip's links to items listed in other menus.
  - id: admin
    label: Admin
    icon: shield-lock
    also: [bi-settings, functions, account]
    columns:
      - title: "People & access"
        items:
          - { id: users, href: /admin/users, icon: people, label: Users, desc: "Accounts, roles and packs per person", match: /admin/users, requires: [admin, admin-page:users] }
          - { id: roles, href: /admin/roles, icon: shield-lock, label: Roles, desc: What each role opens and may do, match: /admin/roles, requires: [admin, admin-page:roles] }
          - { id: tokens, href: /admin/tokens, icon: key, label: API tokens, desc: "Every person's tokens for programs and the command line; revoke", match: /admin/tokens, requires: [admin, admin-page:tokens] }
          - { id: access, href: /admin/access, icon: eye, label: Who looked at what, desc: "Every view of sensitive data, by person and page", match: /admin/access, requires: [admin, admin-page:access] }
          - { id: audit, href: /admin/audit, icon: journal-text, label: Audit log, desc: "Every sign-in and change, by whom", match: /admin/audit, requires: [admin, admin-page:audit] }
          - { id: scopes, href: /admin/scopes, icon: basket, label: Saved VaR baskets, desc: "Everyone's saved VaR baskets: filter by owner, delete with a reason", match: /admin/scopes, domain: banking, requires: [admin, admin-page:scopes, word:VAR] }
      - title: Data
        items:
          - { id: packs, href: /admin/packs, icon: box-seam, label: Packs, desc: "Switch domain packs on and off; deploy archives; the connectors each uses", match: /admin/packs, requires: [admin, admin-page:packs] }
          - { id: connectors, href: /admin/connectors, icon: plug, label: Connectors, desc: "Where each pack reads its data: create, test, change, switch off", match: /admin/connectors, requires: [admin, admin-page:connectors] }
          - { id: bindings, href: /admin/bindings, icon: diagram-3, label: Data bindings, desc: "Which connector or lake table serves each kind the modules need: one binding per kind, four eyes, applied without a restart", match: /admin/bindings, requires: [admin, admin-page:bindings] }
          - { id: loads, href: /admin/loads, icon: cloud-upload, label: Data loads, desc: "What your ETL announced, what is due, what is late", match: /admin/loads, requires: [admin, admin-page:loads] }
          - { id: lakes, href: /admin/lakes, icon: layers, label: Lakes, desc: "Delta tables: load a file, see every table, maintain them now or on a schedule", match: /admin/lakes, requires: [admin, admin-page:lakes, feature:lakes] }
          - { id: edits, href: /admin/edits, icon: pencil-square, label: Record edits, desc: "Write-back: who may correct which records, and the approvals each change needs", match: /admin/edits, requires: [admin, admin-page:edits] }
          - { id: data-out, href: /admin/data-out, icon: box-arrow-right, label: Data out, desc: "Arrow Flight: who reads the data from programs, live streams, limits", match: /admin/data-out, requires: [admin, admin-page:data-out, engine:flight] }
          - { id: artifacts, href: /admin/artifacts, icon: archive, label: Installed items, desc: "Everything installed (packs, reports, models, Sutras): disable, uninstall safely, restore, install", match: /admin/artifacts, requires: [admin, admin-page:artifacts] }
      - title: Platform
        items:
          - { id: configuration, href: /admin/configuration, icon: sliders2, label: Configuration, desc: "Every setting in three tiers (everyday, admin, expert): the value in effect, where it came from, and a change proposed for a second administrator to approve", match: /admin/configuration, requires: [admin, admin-page:configuration] }
          - { id: white-label, href: /admin/white-label, icon: palette, label: White label, desc: "The distributions side by side: brand, theme, modules, lenses, Home and Help of each, the running one marked", match: /admin/white-label, requires: [admin, admin-page:white-label] }
          - { id: modules, href: /admin/modules, icon: puzzle, label: Modules, desc: "The modules of the cluster: upload a .dmod once, plan where it goes, a second administrator applies; upgrade node by node, switch off, remove and reinstall", match: /admin/modules, requires: [admin, admin-page:modules] }
          - { id: engines, href: /admin/engines, icon: gear-wide-connected, label: Engines, desc: "Compute engines on or off on this server (the pivot engine, the in-memory lake and each module's own), each with its own file", match: /admin/engines, requires: [admin, admin-page:engines] }
          - { id: compute, href: /admin/compute, icon: cpu, label: Python workers, desc: "The Python worker pools, their environments and the requirements waiting for approval", match: /admin/compute, requires: [admin, admin-page:compute] }
          - { id: net, href: /admin/net, icon: diagram-3, label: Cluster, desc: "{product}*net: the servers acting as one, their packs and data, routing, access", match: /admin/net, requires: [admin, admin-page:net] }
          - { id: ai, href: /admin/ai, icon: stars, label: AI, desc: "Model providers, MCP servers and what the assistant may do", match: /admin/ai, requires: [admin, admin-page:ai] }
          - { id: collab, href: /admin/collab, icon: chat-square-text, label: Collaboration, desc: "Moderation, legal holds, export, mail outbox, bridges", match: /admin/collab, requires: [admin, admin-page:collab, feature:collaboration] }
          - { id: embedding, href: /admin/embedding, icon: window-stack, label: Embedded views, desc: Host applications that show views in their own pages, match: /admin/embedding, requires: [admin, admin-page:embedding] }
          - { id: health, href: /admin/health, icon: heart-pulse, label: Health, desc: "Connectors, packs, live streams", match: /admin/health, requires: [admin, admin-page:health] }
          - { id: caches, href: /admin/caches, icon: hdd-stack, label: Caches, desc: "What each cache holds; purge", match: /admin/caches, requires: [admin, admin-page:caches] }
          - { id: capacity, href: /admin/capacity, icon: speedometer, label: Capacity, desc: "Today against the plan: headroom, what breaks first, growth; the planner", match: /admin/capacity, requires: [admin, admin-page:capacity] }
  - id: help
    label: Help
    icon: question-circle
    columns:
      - title: Learn
        items:
          - { id: help-centre, href: /help, icon: question-circle, label: Help centre, desc: "Guides, concepts and reference (F1)", match: /help }
          - { id: knowledge, href: /what, icon: lightbulb, label: Knowledge, desc: "Market risk, counterparty risk and more, in plain words · WHAT <term>", requires: [word:WHAT] }
          - { id: install, href: /help/operations#2-install-and-run-on-one-machine, icon: flag, label: Install and run, desc: From nothing to your first view }
          - { id: release-notes, href: /help/release-notes, icon: tag, label: "What's new", desc: "The release notes: what changed in each release" }
          - { id: about, href: /about, icon: info-circle, label: "About {product}", desc: "Version, licence and credits", match: /about }
          - { id: competitive-analysis, href: /help/competitive-analysis, icon: binoculars, label: Competitive analysis, desc: "Vendor by vendor: banking and risk, and data platforms · internal, administrators only", requires: [admin] }
  # The person's own menu (the account button at the right of the top bar, not a top menu): listed here so the Admin strip can link to it.
  - id: me
    label: Me
    icon: person-circle
    personal: true
    columns:
      - title: Me
        items:
          - { id: account, href: /account, icon: person-circle, label: My account, desc: "Your password, tokens, theme and settings", match: /account }

# The footer: short links to items of the menus above (item: its id; label: the footer's shorter name).
footer:
  - { id: help, item: help-centre, label: Help }
  - { id: about, item: about, label: About }
  - { id: release-notes, item: release-notes, label: Release notes }

# The command line's placeholder (an edition's menus.placeholder, or ui.placeholder, wins)
placeholder: "TRD MX-20000001, CPTY north, TRD PRODUCT_TYPE=FX_QUANTO …  then <GO>"

# Help's sections, in order: a tile each on the help centre's front door, opening /help/section/<id>; their pages are listed in
# config/help.yaml (sections[].groups, by the section's id). roles: only those people (and administrators) see the section; domain: as
# for a menu item. An edition's (or lens's) help.categories names the sections it keeps.
help-sections:
  - { id: get-started, name: Get started, icon: flag, blurb: "Install, the first tour, sharing, and the tutorials" }
  - { id: analytics, name: Analytics and BI, icon: bar-chart-line, blurb: "Rupaka BI and its languages, groupings and analytics, funds and ETFs" }
  - { id: data, name: Data, icon: plug, blurb: "Connectors, loads and lakes, external data, the in-memory lake" }
  - { id: build, name: Build, icon: braces, blurb: "Packs, Sutras, write-back, connectors, views in any web page" }
  - { id: operate, name: Operate, icon: hdd-stack, blurb: "Configuration, editions, lenses, clusters, deploy, users, AI, troubleshooting" }
  - { id: reference, name: Reference, icon: book, blurb: "API, command line, tools, the Rachana and ViewModel references, release notes" }
  - { id: knowledge, name: Knowledge, icon: lightbulb, blurb: "What the words of a bank's data mean: eight domains and the glossary" }
  - { id: internal, name: Internal, icon: binoculars, roles: [admin], blurb: "Administrators only: the competitive analysis" }

