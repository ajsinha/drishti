# The top bar's menus and the footer, as data (docs/admin/EDITIONS.md › The design as built, section 5.4; core/menus.py draws them).
# Each item: id, href, icon, label, desc, match (the path prefix that marks it current; blank: the href only) and requires: a list,
# every entry of which must hold:
#   admin                the person is an administrator          bi        BI is on for the person (the bi power, BI switched on)
#   bi-admin             the person holds the bi-admin power     designer  the Sutra designer is on (ui.designer)
#   feature:<name>       a feature switch (config/editions/features.yaml; the console's features.* and the presets of an edition)
#   word:<WORD>          a reserved or console word the edition keeps (BI, FORM, FUNC, WHAT, DATAMAP, VAR, EXP)
#   admin-page:<id>      an Admin page the edition keeps          edition   only with an edition or a lens (a full Drishti hides it)
#   pack:<name>          a pack that is on for the person
#   cmd:<WORD>           a command the edition shows (its commands.allow, or a word it keeps)
#   route:<path>         the server has a page at that path
# An edition (or a lens) lists the items it shows per menu (menus.<menu-id>: [item ids]); a menu it does not name keeps every item its
# requirements allow, and a menu with no item left is not drawn. {product} and {tutorials} are filled in.
# An edition's menus.top names its top menus by id, in order (a menu it does not name is not drawn); without one, every menu below in
# its order except the subject menus (subject: true), which only a menus.top draws.
menus:
  - id: views
    label: Views
    icon: grid-1x2
    columns:
      - title: Look up
        items:
          - { id: terminal, href: /t, icon: terminal, label: Terminal, desc: "Type a command or an id, then <GO>", match: /t }
          - { id: search, href: /s, icon: search, label: "Search & pick lists", desc: "TRD MX-200000, TRD PRODUCT_TYPE=FX_QUANTO, TRD where …", match: /s }
          - { id: forms, href: /forms, icon: card-checklist, label: Forms, desc: "Query by form: every pack with a search form, your recent forms and saved searches. Also: FORM <GO>", match: /form, requires: [feature:forms, word:FORM] }
          - { id: functions, href: /func, icon: list-ul, label: Functions, desc: "Every command you can use, what it does · also FUNC <GO>", match: /func, requires: [word:FUNC] }
          - { id: datamap, href: /datamap, icon: diagram-3, label: Data map, desc: "Every kind of data, how it joins and how much there is · also DATAMAP <GO>", match: /datamap, requires: [feature:datamap, word:DATAMAP] }
          - { id: data, href: /data, icon: cloud-arrow-down, label: Data, desc: "Every dataset, its dates; choose columns and filters, download a day as .jsonl.gz · also DATA <GO>", match: /data/, requires: [feature:data, word:DATA] }
          - { id: pivot, cmd: PIVOT, href: /pivot, icon: grid-3x3-gap, label: Pivot, desc: "Any table or VaR as a pivot: nested rows opened lazily, right totals, provenance, charts, Excel with formulas · also PIVOT <GO>", match: /pivot, requires: [word:PIVOT, route:/pivot] }
          - { id: var, href: /var, icon: shield-check, label: VaR, desc: "Value at risk of the bank, a desk or any set of trades · also VAR <GO>", match: /var, requires: [edition, word:VAR] }
          - { id: exposure, href: /exposure, icon: graph-up, label: Exposure, desc: "EE, PFE and EPE of a counterparty or netting set · also EXP <GO>", match: /exposure, requires: [edition, word:EXP] }
          - { id: reports, href: /reports, icon: file-earmark-bar-graph, label: Reports, desc: "Every report you have: scheduled reports, subscriptions, alerts, and BI reports", match: /reports, requires: [feature:reports] }
      - title: Watch
        items:
          - { id: workspaces, href: /w, icon: grid-1x2, label: Workspaces, desc: Several live views on one screen, match: /w, requires: [feature:workspaces] }
          - { id: monitors, href: /m, icon: list-columns, label: Monitors, desc: Live watchlists of entities, match: /m, requires: [feature:monitors] }
          - { id: alerts, href: /alerts, icon: bell, label: Alerts, desc: Rules checked on every change, match: /alerts, requires: [feature:alerts] }
  # The subject menus of the lenses (docs/lenses/README.md, the lens menus): drawn only where an edition (or a lens) names them in its
  # menus.top. An item's cmd: is the command it runs (its link: /go?q=<cmd> <GO>, unless it has an href) and fill: the words it puts in the
  # command line for the person to finish; either is shown beside its label. cmd:<WORD> in requires: the edition shows that command.
  - id: var
    label: VaR
    icon: shield-check
    subject: true
    columns:
      - title: Value at risk
        items:
          - { id: var-explorer, cmd: VAR BANK, icon: shield-check, label: VaR explorer, desc: "The bank's VaR, then any desk, book or ad-hoc set of trades", requires: [word:VAR] }
          - { id: var-results, cmd: VRES, icon: table, label: VaR results, desc: "The stored results of every hierarchy node", requires: [cmd:VRES] }
          - { id: mcube, cmd: MCUBE, href: /mcube, icon: grid-3x3-gap, label: MR cube, desc: "Market risk on the pivot engine: desks by risk class with the right totals, the tail, why it moved, the DV01 ladder and a what-if · also MCUBE <GO>", match: /mcube, requires: [word:VAR, word:PIVOT, word:MCUBE, route:/mcube] }
          - { id: var-official, cmd: VOFF, icon: patch-check, label: Official records, desc: "The signed-off VaR of each business date", requires: [cmd:VOFF] }
          - { id: smat, cmd: SMAT, href: /smat, icon: grid-3x3, label: Scenario matrix, desc: "Each scenario's P&L of a trade, a position or a scope", match: /smat, requires: [word:SMAT] }
          - { id: hier, cmd: HIER, icon: diagram-3, label: Hierarchies and limit letters, desc: "The VaR hierarchies, their nodes and limits", requires: [cmd:HIER] }
      - title: Check and report
        items:
          - { id: play-var, cmd: PLAY VAR, icon: calculator, label: VaR Playground, desc: "Every VaR figure worked in a grid and a workbook of formulas", match: /play, requires: [word:VAR, word:PLAY, route:/play] }
          - { id: frsa, cmd: FRSA BANK, icon: bank2, label: FRTB-SA capital, desc: "Market-risk capital by the standardised approach for any scope", match: /frtb, requires: [word:VAR, route:/frtb] }
          - { id: play-frtb, cmd: PLAY FRTB EXAMPLE, icon: calculator, label: FRTB-SA Playground, desc: "Every method choice a switch, compared and reproduced; a workbook of formulas", match: /play/frtb, requires: [word:VAR, word:PLAY, route:/play/frtb] }
          - { id: backtesting, cmd: VAR BANK BACKTEST, icon: activity, label: Backtesting, desc: "VaR against the day's P&L, with the traffic light", match: /var/backtesting, requires: [word:VAR, route:/var/backtesting] }
          - { id: stress-window, cmd: SWIN BANK, icon: calendar-range, label: Stress window, desc: "The most stressful year of history for stressed VaR", match: /var/stress-window, requires: [word:VAR] }
