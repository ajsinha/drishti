          - { slug: docs-tutorials-17-data-out-with-arrow-flight, domain: core, engine: flight, doc: tutorials/17-data-out-with-arrow-flight.md, title: "Data out tutorial: from a token to pandas", icon: mortarboard, kind: tutorial, summary: "Eight hands-on steps, each in the UI, on the command line and in code: Flight on, a token with data:read, whoami, a desk's VaR scenario P&L in pandas and its positions' vectors, the same in Java and through JDBC, a live intraday stream resumed, Admin -> Data out with Stop." }
