# The help centre catalogue. A guide is a console guide (web/guides/<slug>.md) or, with `doc:`, a repository
# document rendered as-is (so the in-app reference is the repository's docs). Order here is display order.
# Six sections, one page per subject: the tutorials teach (docs/tutorials), the guides are reference.
# Every other document under docs/ (and the top-level *.md) is reachable unlisted at a slug made from its path
# (docs/architecture/adr/016-one-console-many-servers.md -> /help/docs-architecture-adr-016-one-console-many-servers),
# so a link between documents always opens in the help centre (DOC-18; tests/test_help_links.py crawls them all).
# The architecture documents, the per-plugin connector documents and the runbooks live there: in the repository,
# linked from docs/README.md and from the pages that need them, not in this list.
categories:
  - id: start
    name: Start
    icon: flag
    blurb: "Install it, run it, and learn it by doing."
    guides:
      - { slug: install-and-run, doc: guides/GETTING_STARTED.md, title: Install and run, icon: download, summary: "Prerequisites, build, the demo lakes in one command (lake demo), start the server and the console, sign in, a personal API token for the CLI, where Drishti keeps things, Docker, the IDE, a different configuration, and everything that differs on Windows." }
      - { slug: tutorials, doc: tutorials/README.md, title: Tutorials, icon: mortarboard, kind: tutorial, summary: "{tutorials} hands-on tutorials with real screenshots, one worked example each: from your first 15 minutes to BI, AI, embedding, running it in production and a cluster of three servers." }
  - id: use
    name: Use
    icon: terminal
    blurb: "Working in the console: commands, views, forms, reports, sharing, and Python on any screen."
    guides:
      - { slug: user-guide, doc: guides/USER_GUIDE.md, title: User guide, icon: terminal, summary: "The top bar, commands, type-ahead, every key, tables, filters, controls, layout mode, the Pivot tab, business dates, Compare, workspaces, monitors, alerts, the ten themes and how to choose one, settings, and what changes (nothing) when several servers act as one." }
      - { slug: query-by-form, doc: guides/QUERY_BY_FORM.md, title: Query by form, icon: card-checklist, summary: "Fill in boxes instead of writing a search: the forms home, the inputs, the search it writes, saving and scheduling it; a date with no data says so and offers the newest one." }
      - { slug: reports-page, doc: guides/SCHEDULED_REPORTS.md, title: Reports and subscriptions, icon: file-earmark-bar-graph, summary: "The Reports page: scheduled searches, when they run and where the file goes, export, and subscriptions by email." }
      - { slug: sharing-and-discussion, title: Sharing and collaboration, icon: chat-square-text, summary: "Send a view with a note, read your inbox, discuss a number: what travels is your words and a link, and everyone sees the view with their own permissions." }
      - { slug: python-calc, doc: guides/PYTHON_CALC.md, title: "Calc · Python on any view", icon: filetype-py, summary: "Alt+C: Python in your browser on the screen you are on. The drishti module, tables and charts, drishti_bi (ask a BI dataset as you) and Graphic Walker, packs' snippets, roles, limits." }
      # VaR is two pages (product owner, 2026-10-26): the one reference and the one tutorial. Their path slugs are kept, so the
      # explorer's F1 (contextual var below) and the tutorials page's links open the same pages.
      - { slug: docs-guides-var-guide, doc: guides/VAR_GUIDE.md, title: "VaR guide", icon: graph-down-arrow, summary: "Value at risk for any set of trades: every measure with worked numbers, the explorer screen by screen, positions, scopes, portfolios and baskets, captures, history and backtesting, what-if and VaR as a kind, who sees what, the CLI, the API and settings; the data contract (every column, formula, answer and error code, official results, retention); how the engine keeps a date in memory and on disk, sizing and the benchmark." }
      - { slug: docs-tutorials-25-var-from-the-bank-to-a-trade, doc: tutorials/25-var-from-the-bank-to-a-trade.md, title: "VaR tutorial: from the bank to a trade", icon: mortarboard, kind: tutorial, summary: "Twelve hands-on steps on the test data, each in the UI, on the command line and in YAML: open the bank's VaR, drill to a trade, the P&L path and contributions, your own scopes, derived positions, a basket captured and compared, the backtest, the hot file, VRES and a what-if by the Python engine, entitlements." }
      # Exposure is two pages too (the same rule, 2.9.0): the guide and tutorial 26; F1 on the exposure explorer (contextual exposure below).
      - { slug: docs-guides-exposure-guide, doc: guides/EXPOSURE_GUIDE.md, title: "Exposure guide", icon: shield-exclamation, summary: "Counterparty exposure for any scope (EE, ENE, EEE, PFE, EPE, EEPE, EAD): every measure with worked numbers, the explorer screen by screen, scopes, collateral and netting, captures and compare, the pre-deal what-if (exact paths or the proxy), exposure as a kind, who sees what, the CLI, the API and settings; the data contract (every column, formula, answer and error code, official results, retention, the 76 stored sets reconciled); how the engine keeps a date in memory and on disk, and the open items." }
      - { slug: docs-tutorials-26-exposure-from-the-bank-to-a-trade, doc: tutorials/26-exposure-from-the-bank-to-a-trade.md, title: "Exposure tutorial: from the bank to a trade", icon: mortarboard, kind: tutorial, summary: "Eight hands-on steps on the demo lake, each in the UI, on the command line and in YAML: the bank, a legal entity's counterparty board, CP-ALDERSHOT and its netting sets, collateral and trades of NS-ALDERSHOT-LDN, a trade alone and in its set, a capture compared, a pre-deal what-if (exact and proxy), the official results." }
      # Groupings and analytics are two pages too (the same rule, 2.9.2): the guide and tutorial 27.
      - { slug: docs-guides-groupings-analytics-guide, doc: guides/GROUPINGS_ANALYTICS_GUIDE.md, title: "Groupings and analytics guide", icon: diagram-3, summary: "LEIG, LEIC, SIC, ECG, CORR, an equity's beta (EQB), the USEQ ratios, FACT changes, IDX totals and the PXH analytics computed from the fundamental data when asked, never stored: each command with worked numbers; the data contract of every computed kind (every column, formula, input and error) and the reconciliation with the retired stored pages; how each is computed (the derived connector, the correlation engine, the price analytics) and where its inputs come from." }
      - { slug: docs-tutorials-27-groupings-and-analytics, doc: tutorials/27-groupings-and-analytics.md, title: "Groupings and analytics tutorial", icon: mortarboard, kind: tutorial, summary: "Ten hands-on steps on the committed data, each in the UI, on the command line and in YAML: an ownership group and every group, a country, a sector and the currency rule, a company's margin and growth, a World Bank region, correlations with a window and an estimator, an equity's beta, PXH off and internal, the guard." }
      - { slug: clients, doc: guides/CLIENTS.md, title: Scripts, notebooks and Excel, icon: filetype-py, summary: "Personal API tokens, the Python client, and Excel through Power Query: read anything you may open, from code." }
  - id: bi
    name: BI
    icon: bar-chart-line
    blurb: "Rupaka, business intelligence inside Drishti, and one reference for each part of it."
    guides:
      - { slug: bi-guide, doc: guides/BI_GUIDE.md, title: "Business intelligence (Rupaka)", icon: bar-chart-line, summary: "BI <GO> and the BI menu, the rail (Models, Designer, Analyse, Transforms, Python console), BI Studio (Explorer, tabs, Problems and Query), the catalogue by kind (Reports, Boards, Models, Datasets, Python, All), workspaces with roles, publish and review, certify, shipped files and BI settings; what is built and what is not." }
      - { slug: bi-recipes, doc: guides/BI_RECIPES.md, title: "BI recipes", icon: journal-check, summary: "A stack with four people, reading and querying the stored datasets, row rules and masks at work, a model started from the packs, the Model view." }
      - { slug: datasets, doc: guides/DATASETS.md, title: "Datasets", icon: database, summary: "Tables, relationships, measures, the expression language, window functions, several fact tables, a run as a snapshot, row rules, masks, layers and rollups, live tables and their history, refresh." }
      - { slug: expressions, doc: guides/EXPRESSIONS.md, title: "Expressions (DEL)", icon: braces, summary: "The Python-like language of measures, derived columns, filters and row rules: scopes, grammar, every function with examples and edge cases, problems and their fixes, DEL against Python and DAX, the converter, and fifty-odd finance and risk recipes." }
      - { slug: sql, doc: guides/SQL.md, title: "Drishti SQL", icon: filetype-sql, summary: "Read-only SQL over one model: tables are the model's aliases, MEASURE('name'), joins along the model's relationships, composite statements, AS OF and windows, EXPLAIN, SQL view datasets; one plan with the model query, your rules and masks always applied." }
      - { slug: reports, doc: guides/REPORTS.md, title: "BI reports", icon: bar-chart, summary: "Pages, visuals, wells, filters, slicers and sync groups, drill-down and drill-through, the typed format and the Format pane, conditional formatting, themes, interactions, tooltip pages, small multiples, the matrix, Vega-Lite, live visuals, phone and tablet layouts, expected-value tests, checks and codes; field parameters in the wells (a slicer switches the field) and statement pages on paper." }
      - { slug: boards, doc: guides/BOARDS.md, title: "Boards and live BI", icon: speedometer2, summary: "A board is a report page of live tiles beside the report's own visuals: the tile editor in the report designer, kiosk mode, tile alerts with hysteresis and notifications, Python tiles, live tables, and 2.3 boards converted." }
      - { slug: bi-governance, doc: guides/BI_GOVERNANCE.md, title: "Governance", icon: shield-check, summary: "Versions and diffs, review, certification, lineage, impact of a change (renames, types), bundles between environments and inside pack archives, rollback of an import." }
      - { slug: distribution, doc: guides/DISTRIBUTION.md, title: "Distribution: export, subscriptions, alerts, embedding", icon: envelope-paper, summary: "A report or view as PDF, PNG, Excel (with charts) or CSV; subscriptions by email with narrative summaries; alerts on a number with retries, webhook and text channels, each person on their own masks; a report embedded in another application; statements, page-exact PDF and Excel burst one per recipient." }
      - { slug: python-bi, doc: guides/PYTHON_BI.md, title: "Python in BI", icon: filetype-py, summary: "Measures, visuals and Transforms in Python as BI items: the manifest, the sandboxed runner on the console with warm workers, Vega-Lite output, tests, and data prep step by step in BI → Transforms (inputs through a connector, 21 snippets, a profile after every step)." }
      - { slug: analyse, doc: guides/ANALYSE.md, title: "Analyse: slice, SQL and Python", icon: binoculars, summary: "Open a dataset or model as your masked extract, then slice it, query it with SQL, work on it in Python, worked out by the console and the server; save a notebook and promote cells into report visuals. And the Python console: your own Python in the browser, promoted to the server." }
      - { slug: bi-ai, doc: guides/BI_AI.md, title: "AI in BI", icon: stars, summary: "Report from words, ask the data, explain this number, the designer copilot, the dataset helper and narrative summaries: what is sent to the model, the AI policy and the providers." }
  - id: data
    name: Data
    icon: plug
    blurb: "Where entities come from, how to connect them, and how to tell Drishti new data has landed."
    guides:
      - { slug: connectors, doc: connectors/CONNECTORS.md, title: Connectors, icon: plug, summary: "One reference with a section per plugin (file, Delta, Iceberg, DuckDB, PostgreSQL, MongoDB, Redis, Aerospike, Cassandra, S3, REST, feeds, news, Kafka, ActiveMQ, RabbitMQ, demo): when to use it and a connector file." }
      - { slug: connector-files, doc: connectors/CONNECTOR_FILES.md, title: Connector files and Admin → Connectors, icon: file-earmark-code, summary: "One YAML file per connector in config/connectors: the format, how packs suggest templates, several connectors serving one kind (the union of trade connectors), precedence, live reload, the Admin page, the API and the CLI." }
      - { slug: connector-tls, doc: connectors/TLS.md, title: "TLS and proxy", icon: lock, summary: "The shared tls settings (private CA, PEM, PKCS12 and JKS, mutual TLS, expiry, rotation) and the outbound HTTP proxy for connectors, AI providers and MCP servers." }
      - { slug: data-loads, doc: guides/DATA_LOADS.md, title: "Data loads", icon: cloud-arrow-down, summary: "Your ETL loads the data; Drishti acts on it. One call (API or drishti.py data landed) makes Drishti refresh, check expectations and alert on a missing load." }
  - id: build
    name: Build
    icon: braces
    blurb: "Packs, Rachana layouts (Sutras), panels, the Build workbench, connectors of your own, and putting Drishti in other applications."
    guides:
      - { slug: packs, doc: guides/PACKS.md, title: Packs, icon: box-seam, summary: "How industries plug in: what a pack contains, dependencies, connectors and routes, enabling packs, and writing your own." }
      - { slug: pack-developer-guide, doc: guides/PACK_DEVELOPER_GUIDE.md, title: Pack developer guide, icon: hammer, summary: "Build a domain pack end to end: pack.yaml, kinds, links, roles and masks, Sutras, samples, tests, extending a parent pack." }
      - { slug: schema-to-pack, doc: guides/SCHEMA_TO_PACK.md, title: "Schema to pack", icon: diagram-3, summary: "Schema files (and a folder of JSON Lines) in, a pack out: every rule, the x-drishti annotations, the New pack page and the command line twin." }
      - { slug: sutra-developer-guide, doc: guides/SUTRA_DEVELOPER_GUIDE.md, title: "Rachana guide: writing Sutras", icon: mortarboard, summary: "Writing Sutras end to end: anatomy, matching and priority, labels, paths and expressions, source, row groups, inference, testing and CI, UI-kit fragments (name@N, pack/name@N) with doc: docstrings, events and children, per-panel sources, refresh, layout: and form:, the Build workbench, and the common mistakes with their codes." }
      - { slug: rachana-reference, doc: guides/RACHANA_REFERENCE.md, title: Rachana reference, icon: book, summary: "Every key (fragments and use:, emits and @panel.event, source:, children, refresh:, layout:, form:), panel option, format, tone, Rachana-EL expression and problem code." }
      - { slug: panels, doc: guides/PANELS.md, title: Panels, icon: grid-1x2, summary: "Every panel kind (meaning, options, behaviour when empty, masked, live and on a phone, an example), and developing a new kind end to end." }
      - { slug: examples, doc: guides/examples/README.md, title: Sutra examples, icon: collection, summary: "Working Sutras with their data, covering every panel kind, nested pivots and tree rows: read them here, open each as a copy in the workbench." }
      - { slug: screen-designer, doc: guides/SCREEN_DESIGNER.md, title: "Screen designer and Build workbench", icon: bounding-box, summary: "The Sutra designer (when ui.designer is on): Customize the page you are on, Describe a screen in one line, Outline and Grid, refresh and freshness, letting people edit; and the Build workbench: data, panels and fields on the canvas, the inspector, the YAML, problems and tests, versions, rebase, ship; by mouse or keyboard." }
      - { slug: connector-developer-guide, doc: connectors/CONNECTOR_DEVELOPER_GUIDE.md, title: Connector developer guide, icon: plug, summary: "Which connector to use, the source SPI (manifest, capabilities, fetch, search, subscribe), the shared TLS and proxy modules, testing and a worked plugin." }
      - { slug: developer-guide, doc: guides/DEVELOPER_GUIDE.md, title: Developer guide, icon: tools, summary: "Repository map, building and testing from a fresh clone, the drill, project rules, the request path of a view, a live tick and a BI question (model query, DEL, SQL, live push), and recipes for endpoints, plugins, panel kinds and pages; IDE setup is in IDE_GUIDE.md." }
      - { slug: elements-guide, doc: guides/ELEMENTS.md, title: "Embedding: Drishti Elements", icon: window-stack, summary: "Put views, panels and BI reports in your own web application: a five-minute start, the token exchange, the registered host, the elements (view, panel, report, about, search), React, Vue and Angular samples, theming and limits." }
  - id: operate
    name: Operate
    icon: shield-lock
    blurb: "Configure it, run it, give people access, call it, and fix it when something goes wrong."
    guides:
      - { slug: configuration, doc: admin/CONFIGURATION.md, title: Configuration, icon: sliders, summary: "Every server and console setting with its default: the type-ahead index, the BI and Python settings, config/net/ for Drishti*net, the business calendars (CATO among them) and -Djava.io.tmpdir for the JVM." }
      - { slug: operations, doc: admin/OPERATIONS.md, title: Operations, icon: hdd-stack, summary: "Deploying, the security checklist, monitoring, capacity, connection pools, the type-ahead index, several console workers, several servers as one (Drishti*net: Admin → Net, real addresses only, drishti-stack), and shipping by copying; the runbooks." }
      - { slug: admin-artifacts, doc: admin/ARTIFACTS.md, title: "Artifacts: install and uninstall safely", icon: archive, summary: "Admin → Artifacts: every installed pack, connector file and BI file in one list; what depends on each; disable, uninstall to an archive, restore, install a BI file." }
      - { slug: user-management, doc: admin/USER_MANAGEMENT.md, title: Users and roles, icon: people, summary: "The seeded admin, managing users, roles and BI powers, password rules, lockout and the audit log." }
      - { slug: api, doc: guides/API_GUIDE.md, title: API, icon: braces-asterisk, summary: "REST endpoints (BI, Python data prep, themes, Drishti*net), the ViewModel contract and error codes." }
      - { slug: tools, doc: guides/TOOLS.md, title: "Tools", icon: tools, summary: "Every command, script and page that builds, loads and looks after Drishti: drishti.py, lake build for large JSON exports, loaders, maintenance, generators, scheduling and sizing." }
      - { slug: cli-guide, doc: guides/CLI_GUIDE.md, title: "Command line", icon: command, summary: "One program for the terminal and CI: JSON Lines to a pack, pack check with JUnit, loading data and packs, BI (models, SQL, Transforms, migrations), the demo lakes, drishti.py net, bi statement, data load --store cassandra, and the headless Sutra tool." }
      - { slug: ai-providers, doc: architecture/AI_PROVIDERS.md, title: "AI providers", icon: stars, summary: "Model providers (seventeen vendor types), one file each, off by default; TLS and Test connection; the admin page and API." }
      - { slug: troubleshooting, doc: guides/TROUBLESHOOTING.md, title: Troubleshooting, icon: life-preserver, summary: "Symptoms, likely causes and fixes." }
      - { slug: release-notes, doc: ../RELEASE_NOTES.md, title: Release notes, icon: tag, summary: "What each release contains and its known limits; the changelog and the third-party notices are linked from it." }

