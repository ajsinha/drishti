          - { slug: configuration, domain: core, doc: admin/CONFIGURATION.md, title: Configuration, icon: sliders, summary: "The one configuration document: every setting of every kind (server, console, connectors, packs, editions, stores, BI runs, write-back, {product}*net, AI) with its default, environment variable and meaning, searchable by key, variable or words; administrators see the value in effect and where it came from." }
