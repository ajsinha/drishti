          - { slug: docs-tutorials-25-computed-panels, domain: core, doc: tutorials/25-computed-panels.md, title: "Computed panels tutorial: a reactive connector", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: the compute workers and the sample pack, a panel that computes, the same from the command line, a refused parameter and an event that recomputes." }
