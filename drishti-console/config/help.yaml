          - { slug: cluster, domain: core, pair: docs-tutorials-22-a-cluster-of-three, doc: guides/CLUSTER_GUIDE.md, title: "Clusters and scale", icon: diagram-3, summary: "Several servers as one ({product}*net: real addresses only, the files of config/net, membership, routing, Admin → Cluster), a cluster of three (drishti-stack, step by step, in production), the roles and how many, sharding, high availability, load balancing, zero downtime and rolling upgrades, the daily cycle, security zones, operations and disaster recovery, {product} on AWS (ECS, EFS and S3), the Delta lake in S3 at scale, the scale strategy for one server, sizing (memory, CPU, disk, the sizing planner) and tuning." }
          - { slug: docs-tutorials-22-a-cluster-of-three, domain: core, doc: tutorials/22-a-cluster-of-three.md, title: "Cluster tutorial: a cluster of three", icon: mortarboard, kind: tutorial, summary: "Eight steps: each node's folder and key, one seed, three nodes starting and meeting, a trade only one node holds, the console with several servers, who may reach which node, draining and stopping a node, and what follows you." }
          - { slug: benchmark, domain: core, doc: admin/BENCHMARK.md, title: "Benchmark: every measurement and how to run it", icon: speedometer2, summary: "The one home of every benchmark: what is measured and why, the harness (tools/bench, the store-only benchmarks) and the exact commands to run each again, the machine and data; VaR at 200,000 positions on one server and a three-node cluster with 50 to 200 users, Java 21 and 25, G1 and ZGC; the VaR store, first open and cost per request; exposure; the Python and Java loaders; trades at scale; every store compared; memory and heap; scaling fits and extrapolations to 2.3M and 10M positions; how to read the numbers." }
