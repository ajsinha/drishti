          - { slug: docs-tutorials-08-reports-and-dashboards, domain: core, doc: tutorials/08-reports-and-dashboards.md, title: "Reports and dashboards tutorial", icon: mortarboard, kind: tutorial, summary: "Hands-on steps in seven parts, each in the UI, on the command line and in YAML: your first report from Pivot, several datasets in one report, statements and field parameters, BI that runs itself (schedules, subscriptions, alerts), scheduled searches and the Reports page, live BI and boards, and governance (review, certify, lineage)." }
          - { slug: notebook-guide, domain: core, pair: docs-tutorials-09-notebook-and-python, doc: guides/NOTEBOOK_GUIDE.md, title: "Notebook and Python", icon: journal-code, summary: "The Notebook (SQL and Python on the server), Python measures and visuals in reports, data prep in the Transform editor, the Python console, the command line and the administrator's compute pool." }
          - { slug: docs-tutorials-09-notebook-and-python, domain: core, doc: tutorials/09-notebook-and-python.md, title: "Notebook tutorial: Python and the Notebook", icon: mortarboard, kind: tutorial, summary: "Hands-on steps with the Notebook and Python in a report, each in the UI, on the command line and in YAML." }
          - { slug: approvals-guide, domain: core, pair: docs-tutorials-11-correct-and-approve, doc: guides/APPROVALS_GUIDE.md, title: "Corrections and approvals", icon: pencil-square, summary: "Correct a record in a form or a cell, drafts and submitting, the one Approvals queue, where a change goes, the edit log and Admin → Edits, writing back to a source, audit and retention." }
          - { slug: docs-tutorials-11-correct-and-approve, domain: core, doc: tutorials/11-correct-and-approve.md, title: "Approvals tutorial: correct a trade and approve it", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: correct a trade, submit it, approve it and read the audit trail, each in the UI, on the command line and in YAML." }
      - title: "Pivot"
        words: [PIVOT, MCUBE]
        guides:
          - { slug: docs-guides-pivot-guide, domain: core, pair: docs-tutorials-07-pivot-cubes-and-explain, doc: guides/PIVOT_GUIDE.md, title: "Pivot guide", icon: grid-3x3-gap, summary: "Any table of any pack, any entity document (its lists pivoted at their own grain by Rachana paths, a trade figure counted once per trade), or VaR, as a pivot computed by the server: the View picker in front of the compact line (Rows, Columns, Filters and Values on one line, a hierarchy as one chip with a level stepper, a picker behind each, the keys R C V F, Shift+V and Alt+arrows) and the Fields and Build panes behind Customize, the functions valid for each field in plain words (Sum, Count, Distinct count, Average, Weighted average, Min, Max, Median, Percentile, Std dev, custom formulas) and show value as, ready-made, my and shared views, nested rows opened lazily (only open nodes are computed), expand by a different field per member, top N with a correct Others, sorting per level, every total made from its own members (never a sum of the figures shown), exact or holistic marked, the provenance of every cell, the scan estimate, a chart of a selection that never stacks a non-additive measure, Excel with outline levels and formulas only where a figure adds up, CSV and Arrow, saved and shared views, cell references, custom functions in four languages with their harness, playground and approval, why did it move (steps that add up), what-if overlays, BI's totals on the engine, sketches (≈) with exact on request, rollups, progressive answers, the cluster's partial states, the screen's switches, live pivots, cell comments, the API, the CLI and the settings; and the MR cube preset (MCUBE): VaR, ES, component VaR, limits and sensitivities by any desk, book, risk class, position or trade, every cell the VaR engine's own figure, with the headline, time travel, the tail, the DV01 ladder and a what-if side by side." }
          - { slug: docs-tutorials-07-pivot-cubes-and-explain, domain: core, doc: tutorials/07-pivot-cubes-and-explain.md, title: "Pivot, cubes and explain tutorial", icon: mortarboard, kind: tutorial, summary: "Twenty-seven hands-on steps in three parts, each in the UI, on the command line and as the view's JSON or YAML. The pivot engine: a first pivot of the demo trades, rows opened lazily and expanded by a different field, the top N with its Others, a cell's provenance and rows, the legs with a document path, VaR by desk whose total is not the sum of the desks, a chart, a view saved and exported to Excel, Exact / Auto / ≈, rollups and Live, a comment on a cell. Custom functions: a formula, a function proven by its harness, an SQL macro, approval by someone else, why did it move, what-if, BI's totals from the engine. The MR cube: the landing checked against VAR BANK, the View picker, the Rows picker with the hierarchies, a value's functions and the panes, a cell's tail, the lens, a re-pivot, components and the waterfall, the DV01 ladder and a what-if, a view shared and exported." }
      - title: "Groupings and analytics"
        guides:
          - { slug: docs-guides-groupings-analytics-guide, domain: core, pair: docs-tutorials-06-groupings-and-analytics, doc: guides/GROUPINGS_ANALYTICS_GUIDE.md, title: "Groupings and analytics guide", icon: diagram-3, summary: "LEIG, LEIC, SIC, ECG, CORR, an equity's beta (EQB), the USEQ ratios, FACT changes, IDX totals and the PXH analytics computed from the fundamental data when asked, never stored: each command with worked numbers; the data contract of every computed kind (every column, formula, input and error) and the reconciliation with the retired stored pages; how each is computed (the derived connector, the correlation engine, the price analytics) and where its inputs come from." }
          - { slug: docs-tutorials-06-groupings-and-analytics, domain: core, doc: tutorials/06-groupings-and-analytics.md, title: "Groupings and analytics tutorial", icon: mortarboard, kind: tutorial, summary: "Ten hands-on steps on the committed data, each in the UI, on the command line and in YAML: an ownership group and every group, a country, a sector and the currency rule, a company's margin and growth, a World Bank region, correlations with a window and an estimator, an equity's beta, PXH off and internal, the guard." }
      - title: "Funds and ETFs"
        words: [FUND]
        guides:
          - { slug: docs-guides-funds-guide, domain: capitalmarkets, pair: docs-tutorials-13-world-data, doc: guides/FUNDS_GUIDE.md, title: "Funds and ETFs guide", icon: briefcase, summary: "The 200 largest US mutual funds and ETFs from SEC data (Form N-PORT, Form N-CEN, the prospectus risk/return summaries): FUND, the fact sheet with its Look-through holdings and against-its-index tabs; HELD, the funds holding a company (and USEQ's Held by funds tab); TRACK, the funds tracking an index; the data contract of every kind (every column, its SEC source, an example); where the data comes from, the 200 chosen, the refresh script on Linux and Windows, the gzipped snapshot." }
          - { slug: docs-tutorials-13-world-data, domain: capitalmarkets, doc: tutorials/13-world-data.md, title: "World data tutorial: economies, companies, funds, entities and news", icon: mortarboard, kind: tutorial, summary: "Fourteen hands-on steps in five parts on the committed public data, each in the UI, on the command line and in YAML: a counterparty's economy, its IMF outlook, its peers and its government; a US company and its five identifiers; the funds pack (a fund's fact sheet, its look-through with derivatives and counterparties, the fund against its index, finding funds by share class and index, the funds holding Apple, the funds tracking the S&P 500, a phone, refreshing the data); who owns whom from GLEIF; a listed company's quote and headlines from the committed snapshot." }
      - title: "Public sector"
        words: [WDI]
        guides:
          - { slug: docs-guides-public-sector-guide, domain: economy, pair: docs-tutorials-14-public-sector-data, doc: guides/PUBLIC_SECTOR_GUIDE.md, title: "Public sector guide", icon: bank, summary: "The public-sector module: government data and free news from public sources. Its lens and ten functions (WDI, CBANK, NSTAT, OECD, PRESS, GDELT ...), turning it on and off; the screens (a country's development with the world map by GDP per head, a central bank's policy rate and last move, Statistics Canada's series, the OECD members by inflation, official press releases with links, GDELT's world events by tone); the six packs and their data contracts; the six daily feeds on drishti-feeds (World Bank, FRED and the Bank of Canada, Statistics Canada, OECD, the publishers' feeds, GDELT) and the FRED key; every source's licence and what is internal only; changing what is pulled; tests; troubleshooting." }
          - { slug: docs-tutorials-14-public-sector-data, domain: economy, doc: tutorials/14-public-sector-data.md, title: "Public sector tutorial", icon: mortarboard, kind: tutorial, summary: "Nine hands-on steps, each in the UI, on the command line and in YAML: turn the packs on, run the six feeds, a country's development, a central bank, national statistics and the OECD, official press releases and what is internal only, GDELT's world events, scheduling the feeds daily, changing what a feed pulls." }
