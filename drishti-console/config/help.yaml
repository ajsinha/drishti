          - { slug: integration-guide, domain: core, pair: docs-tutorials-20-embed-drishti, doc: guides/INTEGRATION_GUIDE.md, title: "Integrate {product}: embed a view, take data out, call the API", icon: window-stack, summary: "Three ways in for other systems: views and reports in any web page with {product} Elements and Render (turning embedding on, signing in, the libraries in your own app, versions and integrity); {product}'s data to any Arrow Flight client, JDBC or ODBC tool as the person a token belongs to (tokens and scopes, every request form, the cluster, limits, audit); and the REST API from scripts, notebooks and Excel." }
          - { slug: docs-tutorials-20-embed-drishti, domain: core, doc: tutorials/20-embed-drishti.md, title: "Embed tutorial: a view in your page", icon: mortarboard, kind: tutorial, summary: "Hands-on steps to put a live view and a report in a page of your own." }
  - id: operate
    groups:
      - title: "Set up"
        guides:
          - { slug: configuration, domain: core, doc: admin/CONFIGURATION.md, title: Configuration, icon: sliders, summary: "The one configuration document: every setting of every kind (server, console, connectors, packs, editions, stores, BI runs, write-back, {product}*net, AI) with its default, environment variable and meaning, searchable by key, variable or words; administrators see the value in effect and where it came from." }
          - { slug: bank-data-guide, domain: banking, doc: guides/BANK_DATA_GUIDE.md, title: "Bank data: what a bank sends each day and how it is loaded", icon: upload, summary: "The PVF files (scenario PVs, portfolio, positions) and the CSV datasets of a day into the Delta lake, step by step: where to put the files, checking a day, loading one day or several, the daily runbook, removing old scenario PV dates safely; then the trading products, market data, the core pack and the banking data model, and the source-system modules (Endur, Calypso, Murex, SwapOne, WSS, ICI)." }
          - { slug: admin, domain: core, doc: guides/ADMIN_GUIDE.md, title: "Administration: people, access and lenses", icon: people, summary: "Signing in, your first ten minutes (add a person), roles and their powers (BI, Calc, layouts, pivots, discussion), packs per user, single sign-on (OpenID Connect), API tokens, embedding host applications, the access log, the identity database (SQLite or PostgreSQL) and the rules {product} enforces; what a lens is, running a whole instance as one lens or offering lenses to people, Home landings, the Risk, Trading, Market, World and Public sector lenses, customising and white-labelling, your own lens; Functions (FUNC): every command and turning one on or off; compute engines on or off (Admin → Engines); modules; troubleshooting." }
      - title: "Run"
        guides:
          - { slug: deployment-qa, domain: core, doc: DEPLOYMENT_AND_QA_GUIDE.md, title: "Deployment and QA guide", icon: clipboard-check, summary: "Step by step on Windows, Linux and macOS: prerequisites (Windows with nothing but Java and Python), the release, configuration (data folder, lakes, modules, lenses, secrets), the demo lake, starting the server and the console and running them as services (systemd, a scheduled task, launchd), verifying every part with what you should see (health, modules, sign-in, the Home of each lens, VaR, exposure, BI, the MR cube, the Elements gallery, the data inbox and feeds, modules off and on, the phone, logs and metrics), the QA checklist, a cluster of three end to end, offline QA with your own trade files, troubleshooting. Also as a PDF." }
