          - { slug: docs-guides-mr-cube-guide, engine: mr-cube, pair: docs-tutorials-38-the-mr-cube-on-the-pivot-engine, doc: guides/MR_CUBE_GUIDE.md, title: "MR cube guide", icon: grid-3x3-gap, summary: "Market risk as a pivot on the pivot engine (MCUBE): desks by risk class, books by currency, any hierarchy level, attribute, position or trade, where every cell and every total is the VaR of its own trades from their summed scenario P&L vectors, never a sum, with the diversification shown; component and incremental VaR, the limit and its use, stressed VaR, DV01, CS01 and SBM; the scope and the lens (horizon, confidence, stress set, currency) as the view's options; the landing (headline, slider, sparklines, a cell's tail and explain), tab B (components, waterfall, histogram, heat map), tab C (the DV01 ladder, the what-if side by side); the API, the settings, the engine switch." }
