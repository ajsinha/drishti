          - { slug: developer-quickstart, domain: core, doc: QUICKSTART_DEVELOPERS.md, title: "Developer quickstart", icon: rocket-takeoff, summary: "From a clean machine to your first change: clone, the JDK and Python on each operating system, the build, the server and console on the demo lake (and a cluster of three) with the bin/ scripts, the repository map, the fast checks, the rules a change must follow and a first change end to end. Also as a PDF." }
