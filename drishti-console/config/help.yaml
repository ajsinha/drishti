# The help centre's pages (2.9.11.a, mock-up help-hub/A): the main page is a search box, the most used pages and a tile per section;
# a tile opens the section's own page (/help/section/<id>) with its pages grouped, every guide beside its tutorial and a search of that
# section only. Every page belongs to exactly one section (tests/test_help.py). The sections themselves (their order, name, icon, line,
# roles, domain and lenses) are the sitemap's (config/sitemap.yaml help-sections:, the one home of navigation); here each section names
# its id and its groups of pages.
# A page is a console guide (web/guides/<slug>.md) or, with `doc:`, a repository document rendered as-is (so the in-app reference is the
# repository's docs). Its keys: slug, doc, title, icon, kind (guide, tutorial, knowledge), summary, packs, roles, engine, pair, domain and lenses:
#   engine: the compute engine the page is about (config/engines.yaml): left out while the engine runs on no server (an administrator
#           sees it greyed instead); Help is documentation, open to anyone who can open Help, whatever the Engines menu's opens: say;
#   pair:   the tutorial drawn beside a guide on its row (the tutorial is a page of the same group);
#   roles:  only people with one of these roles (or an administrator) see the page: hidden from the sections and search, 404 at its address.
#   domain: the domain module the page belongs to (core, banking, capitalmarkets, economy; config/docs-features.yaml agrees): while that
#           module is off for the person the page is not listed, searched or served (a module's own Help file: its pages are its own);
#   lenses: the lenses that show the page (none said: every lens; the full product, outside any lens, shows every page).
# A group's words: the command words shown beside its title.
# Every other document under docs/ (and the top-level *.md) is reachable unlisted at a slug made from its path
# (docs/architecture/adr/016-one-console-many-servers.md -> /help/docs-architecture-adr-016-one-console-many-servers), in the section
# documents: names for its top folder, so a link between documents always opens in the help centre (DOC-18; tests/test_help_links.py).
# Old addresses keep working: /help/<slug> as before, moved: below for retired slugs, and /help#cat-<old id> (aliases:).

# The most used pages, first under the search box (a page the person cannot see is left out); label: a shorter name on its chip.
most-used:
  - { slug: user-guide }
  - { slug: docs-guides-var-guide, label: VaR guide }
  - { slug: tutorials }
  - { slug: release-notes, label: "What's new" }

# Old section ids and other names, to the section that took them over: a pack's guide (its help.yaml category:), an edition's
# help.categories and the old addresses /help#cat-<id>.
aliases: { start: get-started, use: get-started, bi: analytics, packs: data, layouts: build }

# An unlisted document's section, by its top folder under docs/ ("" for the top-level *.md; any other folder: default).
documents: { connectors: data, contracts: data, admin: operate, guides: reference, architecture: build, tutorials: get-started,
             knowledge: knowledge, qa: build, "": operate, default: build }

# A pack's own guides join their section under this group, at its end.
pack-group: From the packs

sections:
  - id: get-started
    groups:
      - title: "Begin here"
        guides:
          - { slug: user-guide, domain: core, doc: guides/USER_GUIDE.md, title: User guide, icon: terminal, summary: "Home and its fact of the day, the top bar, commands, type-ahead, every key, tables, filters, controls, layout mode, the Pivot tab, business dates, Compare, workspaces, monitors, alerts, a page on a phone, the ten themes and how to choose one, settings, and what changes (nothing) when several servers act as one." }
          - { slug: sharing-and-discussion, domain: core, title: Sharing and collaboration, icon: chat-square-text, summary: "Send a view with a note, read your inbox, discuss a number: what travels is your words and a link, and everyone sees the view with their own permissions." }
          - { slug: tutorials, domain: core, doc: tutorials/README.md, title: Tutorials, icon: mortarboard, kind: tutorial, summary: "{tutorials} hands-on tutorials with real screenshots, one worked example each: from your first 15 minutes to BI, AI, embedding, running it in production and a cluster of three servers." }
  - id: analytics
