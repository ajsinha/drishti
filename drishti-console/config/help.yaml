          - { slug: data-lake-guide, domain: core, pair: docs-tutorials-16-load-your-own-data-into-a-new-lake, doc: guides/DATA_LAKE_GUIDE.md, title: "Data lake and data load guide", icon: database, summary: "One home for lakes and loading, with real examples: what a lake is (config/lakes/<lake>.yaml, each lake in its own folder data/delta/<lake>/), every key of the lake file with a worked risklake.yaml (trades, positions, scenario PVs, VaR nodes), why few partition columns (the folder-explosion arithmetic) and what to use instead, the file layout and its rules of thumb, retention and maintenance; loading three ways (the data inbox, drishti.py lake build, the parallel loader); every key of the .ready file including lake:, routing rules, business dates, replace and append, repeats and undo; pointing the connectors at a lake, the demo lake's one-time move, checking a load and troubleshooting, sizing a day of 1M trades and 50K positions x 509 scenarios; and reading a Databricks or Iceberg lakehouse (built and planned)." }
          - { slug: docs-tutorials-16-load-your-own-data-into-a-new-lake, domain: core, doc: tutorials/16-load-your-own-data-into-a-new-lake.md, title: "Lake tutorial: load your own data into a new lake", icon: mortarboard, kind: tutorial, summary: "Thirty-five hands-on steps in five parts, each in the UI, on the command line and in YAML: a new lake (config/lakes/risklake.yaml) routed, loaded with full .ready files, the connectors pointed at it, a load checked and undone; one file per lake, a contradicting --partition-by refused, an append table, lake check, an older connector file migrated; the data inbox (a routing rule, a file and its marker, ready.all, a failed file retried, the outbox and the ledger); news held in memory only (mem://news, the warm-up, the guard, the cap and Health); the risk lake and the official results on Iceberg, Admin -> Lakes and back to Delta." }
          - { slug: docs-tutorials-12-a-day-of-bank-data, doc: tutorials/12-a-day-of-bank-data.md, title: "A day of bank data: load it daily", icon: mortarboard, kind: tutorial, domain: banking, summary: "Hands-on steps, each in the UI, on the command line and in YAML: set an expectation, announce a day of trades as landed, watch the refresh and the checks, a late load and the alert, Admin -> Data loads." }
          - { slug: external-data, domain: core, doc: guides/EXTERNAL_DATA.md, title: "External data feeds", icon: cloud-download, summary: "drishti-feeds, one module for pulling external data into the lakes every day, and every external source it pulls: drishti.py feed list|run|status|schedule; incremental pulls, retries and resume; JSON Lines per dataset and business date; loading by the parallel loader, lake build or the data inbox; daily entries for cron, systemd and Windows Task Scheduler; the run ledger, Admin → Data loads → Feeds and the data-feed-failed alert; every key of the feed file; writing a feed; then each source of every pack (World Bank, IMF, UNDP, CIA Factbook, Yahoo Finance, Google News, ECB, US Treasury, NY Fed, SEC EDGAR, Wikidata, Nasdaq Trader, GLEIF), its licence, which are internal only, what its feed writes, checking and offline use." }
          - { slug: data-samples, domain: core, doc: contracts/samples/README.md, title: "Test data samples, field by field", icon: filetype-json, summary: "One page per domain, a section per data type a bank produces (trades by system, PV and P&L vectors in every form, scenario sets and FX, hierarchies, exposure paths, reference, market and counterparty data) and each public source: a real record as folded JSON, every field explained from its data contract, the fields of other rows, and a checklist for the production query that must emit it; the kinds {product} computes are listed apart." }
      - title: "Virtual tables"
        guides:
          - { slug: tables-guide, domain: core, pair: docs-tutorials-18-tables-and-models, doc: guides/TABLES_GUIDE.md, title: "Virtual tables and models", icon: table, summary: "Tables defined once over any kind, lake table, query or model (grain, paths, columns, keys, rules and masks), models of them with measures, materialisation (none, on-load, live), the checks, preview and lineage, and tables migrate: BI's datasets and models into the layer, DEL into Rachana, the null rule kept." }
          - { slug: docs-tutorials-18-tables-and-models, domain: core, doc: tutorials/18-tables-and-models.md, title: "Virtual tables tutorial: trade legs as a table, a model, BI migrated", icon: mortarboard, kind: tutorial, summary: "Six steps, each with the YAML, the command line and the screen: the legs of the trades as a table, its rows over samples, a column in dollars and a looked-up desk name, rules per reader, a model over it, and BI's samples migrated with a dry run first." }
