          - { slug: knowledge-world, domain: core, packs: [us-equities, funds, gleif, world-economy], doc: knowledge/world.md, title: "World", icon: globe, kind: knowledge, summary: "Companies, funds and ETFs: tickers, CIK, SIC codes and divisions, share classes (GOOG and GOOGL), EDGAR filings and XBRL facts; mutual funds, ETFs and unit investment trusts, NAV and net assets, look-through holdings, expense ratios, index funds, computed index weights and active share, fund overlap. Economies: GDP, growth, inflation, unemployment, debt and the current account; IMF forecasts, country groups and governments; how a counterparty links to its economy. Each on the demo data." }
