# An unlisted document's section, by its top folder under docs/ ("" for the top-level *.md; any other folder: default).
documents: { strategy: analytics, connectors: data, contracts: data, admin: operate, guides: reference, architecture: build, tutorials: get-started,
             knowledge: knowledge, qa: build, "": operate, default: build }

# A pack's own guides join their section under this group, at its end.
pack-group: From the packs

sections:
  - id: get-started
    groups:
      - title: "Begin here"
        guides:
          - { slug: how-it-fits, domain: core, doc: ../HOW_IT_FITS.md, title: "How Drishti fits together", icon: diagram-3, summary: "The kernel, the console and modules; what each YAML file and .dmod decides and how they point at each other; bindings, placement, deploy and distributions, with diagrams and VAR BANK traced through every file" }
          - { slug: user-guide, domain: core, doc: guides/USER_GUIDE.md, title: User guide, icon: terminal, summary: "Home and its fact of the day, the top bar, commands, type-ahead, every key, tables, filters, controls, layout mode, the Pivot tab, business dates, Compare, workspaces, monitors, alerts, a page on a phone, the ten themes and how to choose one, settings, and what changes (nothing) when several servers act as one." }
          - { slug: tutorials, domain: core, doc: tutorials/README.md, title: Tutorials, icon: mortarboard, kind: tutorial, summary: "{tutorials} hands-on tutorials with real screenshots, one worked example each: from your first 15 minutes to BI, AI, embedding, running it in production and a cluster of three servers." }
  - id: analytics
    groups:
      - title: "Business intelligence"
        words: [BI, PIVOT, MCUBE]
        guides:
          - { slug: bi-guide, domain: core, doc: guides/bi/README.md, title: "Business intelligence", icon: bar-chart-line, summary: "A section of eleven pages, each a guide with its tutorial, from one table to a dashboard: the pivot and its risk cubes, tables and models, reports and the designer, the report file and statements, the models behind reports, live reports and boards, distribution and alerts, governance and AI, the Notebook and Python, and the computed groupings and analytics. This index is the map and the place to start.", children: [
              { slug: bi-pivot, doc: guides/bi/PIVOT.md, title: "Pivot", icon: table, summary: "The one grid for slicing and totalling any table: the View picker, nested rows, top N with a correct Others, totals made from their own members, provenance, custom functions, why did it move and what-if; with the tutorial." },
              { slug: bi-pivot-cubes, doc: guides/bi/PIVOT_SCALE_AND_CUBES.md, title: "Pivot at scale and the risk cubes", icon: bar-chart-steps, summary: "Sketches, rollups, progressive answers and the cluster; the screen's switches, live pivots, cell comments, the pivot's data and presets, and the market-risk cube; with the tutorial." },
              { slug: bi-tables-models, doc: guides/bi/TABLES_AND_MODELS.md, title: "Tables and models", icon: table, summary: "Virtual tables and semantic models: where definitions live, a table key by key, paths and expressions, a model, materialisation, who sees what, checks, lineage, the editors and measures in a model; with the tutorial." },
              { slug: bi-reports, doc: guides/bi/REPORTS.md, title: "Reports and the designer", icon: bar-chart-line, summary: "What a report is, getting in, the four powers, the catalogue and workspaces, the viewer, which date a report reads, BI Studio and the report designer, Python in reports and the settings and problem codes; with the first-report tutorial." },
              { slug: bi-report-file, doc: guides/bi/REPORT_FILE_FORMAT_STATEMENTS.md, title: "The report file, formatting and statements", icon: file-earmark-richtext, summary: "The report YAML (pages, visuals, filters, slicers, interactions), the Format pane, conditional formatting and themes, field parameters, and statements: paginated reports, page-exact, one per reader; with the tutorial." },
              { slug: bi-live, doc: guides/bi/LIVE_REPORTS_AND_BOARDS.md, title: "Live reports, boards and background runs", icon: lightning-charge, summary: "Live reports and standing queries, boards of live tiles for a wall, kiosk mode, and background runs for long questions; with the live-BI tutorial." },
              { slug: bi-distribution, doc: guides/bi/DISTRIBUTION_AND_ALERTS.md, title: "Distribution, subscriptions and alerts", icon: send, summary: "The Reports page and scheduled searches, export (PDF, PNG, Excel, CSV), subscriptions, webhooks and text messages, alerts on numbers, and embedding a report; with the tutorials for BI that runs itself and for scheduled searches." },
              { slug: bi-govern-ai, doc: guides/bi/GOVERNANCE_AND_AI.md, title: "Governing BI", icon: shield-check, summary: "Publishing and governance (versions, review, certification, lineage, impact, environments); with the governance tutorial." },
              { slug: bi-python-notebook, doc: guides/bi/NOTEBOOK_AND_PYTHON.md, title: "The Notebook and Python", icon: journal-code, summary: "Where code runs; the Notebook (SQL and Python cells, extract, save, promote, profile); Python measures and visuals; Transforms and the Transform editor; the command line, the sandbox, limits and how an administrator turns Python on; with the tutorial." },
              { slug: bi-calc, doc: guides/bi/CALC.md, title: "Calc: Python in your own browser", icon: calculator, summary: "The Labs scratch pad: Python beside a view on that view's rows, in your browser. The panel and its keys, the drishti module, reading data, packages, roles, the security model, limits and troubleshooting." },
              { slug: bi-groupings, doc: guides/bi/GROUPINGS_AND_ANALYTICS.md, title: "Groupings and analytics", icon: diagram-2, summary: "The groupings and analytics computed instead of stored: LEIG, LEIC, SIC, ECG, CORR, EQB, PXH and the USEQ ratios, their data contract and how they are computed; with the tutorial." },
          ] }
          - { slug: docs-tutorials-11-correct-and-approve, domain: core, doc: tutorials/11-correct-and-approve.md, title: "Approvals tutorial: correct a trade and approve it", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: correct a trade, submit it, approve it and read the audit trail, each in the UI, on the command line and in YAML." }
      - title: "World and public data"
        words: [FUND, WDI]
        guides:
          - { slug: world-data-guide, domain: capitalmarkets, doc: guides/WORLD_DATA_GUIDE.md, title: "World and public data", icon: globe2, summary: "The public data of the world packs, each part a guide with its tutorial: funds and ETFs from SEC data (FUND, HELD, TRACK), every external feed with its licence and refresh script (drishti.py feed), and the public sector (WDI, CBANK, NSTAT, OECD, PRESS, GDELT): the screens, the packs, the daily feeds and what is internal only." }
  - id: data
    groups:
      - title: "Loads and lakes"
        guides:
          - { slug: data-guide, domain: core, pair: docs-tutorials-15-connect-your-data, doc: guides/DATA_GUIDE.md, title: "Data guide: connectors, the load signal, formats, external data, Export data", icon: cloud-arrow-down, summary: "Your ETL loads the data; {product} acts on it: one call (API or drishti.py data landed) marks a batch landed, the Data loads page, expectations and late data; JSON Lines as the standard and Arrow where it pays; every external source of every pack (World Bank, IMF, UNDP, CIA Factbook, Yahoo Finance, SEC, GLEIF ...) with its licence, the internal-only rule and one refresh script per pack; a pack from JSON Schema files or a folder of JSON Lines; and taking data out: Export data (EXPORT), every dataset with its dates, a simple selection and a day downloaded as .jsonl.gz, streamed and audited. Lakes, the data inbox and loading are the Data lake and data load guide." }
          - { slug: docs-tutorials-15-connect-your-data, domain: core, doc: tutorials/15-connect-your-data.md, title: "Connect your data tutorial", icon: mortarboard, kind: tutorial, summary: "Seven hands-on steps, each in the UI, on the command line and in YAML: look at the data, Admin -> Connectors, a file connector made in the page and from the command line, a connector that never holds a password, a connector that cannot connect (TLS, a pool, Test and retry), and tidying up." }
          - { slug: data-lake-guide, domain: core, pair: docs-tutorials-16-load-your-own-data-into-a-new-lake, doc: guides/DATA_LAKE_GUIDE.md, title: "Data lake and data load guide", icon: database, summary: "One home for lakes and loading, with real examples: what a lake is (config/lakes/<lake>.yaml, each lake in its own folder data/delta/<lake>/), every key of the lake file with a worked risklake.yaml (trades, positions, scenario PVs, VaR nodes), why few partition columns (the folder-explosion arithmetic) and what to use instead, the file layout and its rules of thumb, retention and maintenance; loading three ways (the data inbox, drishti.py lake build, the parallel loader); every key of the .ready file including lake:, routing rules, business dates, replace and append, repeats and undo; pointing the connectors at a lake, the demo lake's one-time move, checking a load and troubleshooting, sizing a day of 1M trades and 50K positions x 509 scenarios; and reading a Databricks or Iceberg lakehouse (built and planned)." }
          - { slug: docs-tutorials-16-load-your-own-data-into-a-new-lake, domain: core, doc: tutorials/16-load-your-own-data-into-a-new-lake.md, title: "Lake tutorial: load your own data into a new lake", icon: mortarboard, kind: tutorial, summary: "Hands-on steps in two parts, each in the UI, on the command line and in YAML: a new lake (config/lakes/risklake.yaml) routed, loaded with full .ready files, the connectors pointed at it, a load checked and undone; then load it every day: an expectation, the data-load signal from the command line and the API, a failed batch, what is due, an alert for a missing day, Admin -> Data loads, a day taken back out." }
          - { slug: docs-tutorials-13-one-file-per-lake, domain: core, doc: tutorials/13-one-file-per-lake.md, title: "Lake file tutorial: one file per lake", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: read the demo lake file, a connector that names a lake, a load that follows the lake file, a contradicting --partition-by refused, an append table, lake check and Admin -> Lakes." }
          - { slug: docs-tutorials-14-load-files-with-the-data-inbox, domain: core, doc: tutorials/14-load-files-with-the-data-inbox.md, title: "Data inbox tutorial: load files automatically", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: the inbox on, a routing rule, a data file and its .ready marker, ready.all, a failed file and Retry, the outbox and the ledger." }
          - { slug: docs-tutorials-18-news-held-in-memory, domain: core, doc: tutorials/18-news-held-in-memory.md, title: "In-memory tutorial: news held in memory only", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: a connector at mem://news, the replenish jobs and the warm-up, what the guard refuses, a refill, the cap and Health, and back to the disk lake." }
          - { slug: docs-tutorials-23-the-risk-lake-on-iceberg, domain: core, doc: tutorials/23-the-risk-lake-on-iceberg.md, title: "Iceberg tutorial: the risk lake and the official results", icon: mortarboard, kind: tutorial, summary: "Hands-on steps: the risk lake built into Iceberg, the official results published to Iceberg, each table format in Admin -> Lakes, BI following the official format, and back to Delta." }
      - title: "Data out (Arrow Flight)"
        guides:
          - { slug: docs-tutorials-17-data-out-with-arrow-flight, domain: core, engine: flight, doc: tutorials/17-data-out-with-arrow-flight.md, title: "Data out tutorial: from a token to pandas", icon: mortarboard, kind: tutorial, summary: "Eight hands-on steps, each in the UI, on the command line and in code: Flight on, a token with data:read, whoami, a desk's VaR scenario P&L in pandas and its positions' vectors, the same in Java and through JDBC, a live intraday stream resumed, Admin -> Data out with Stop." }
