# The board and chip examples of Build → Designer → New (/build/new#examples), beside the screen (Sutra) examples. Each opens as YOUR copy,
# unsaved, in the designer's Board or Chip mode: a board saves among your personal boards, a chip as your draft. An example is one of:
#   document:  the board or chip itself;
#   from:      a Chip Store chip (name@version), copied as <name>-mine@1;
#   sutra:     {name, version}: a pack's entity page converted into a board by P5's converter (POST /api/v1/ui/convert/sutra).
# Synthetic: no real data is held here.
examples:
  - name: book-trades
    kind: board
    title: Book trades (the guide's board)
    summary: A book's trades in a filterable table; the selected trade's ticket and its cash flows follow the selection.
    document:
      rachana: 1
      board: book-trades
      title: Book trades
      params:
        book: { type: id, of: trading/book, default: "FX-LDN-01" }
      chips:
        trades:
          use: filterable-table@2
          title: Trades
          supply: { connector: trading/trade-search, query: { book: "%{board.params.book}" } }
          map: { rows.id: TRADE_ID, rows.date: TRADE_DATE, rows.label: COUNTERPARTY_NAME, rows.measures: [NOTIONAL, MTM_USD] }
          controls: { page-size: 25 }
        ticket:
          use: entity-card@1
          title: Trade ticket
          supply: { connector: trading/trade }
          map: { doc.id: TRADE_ID, doc.title: DEAL_NUMBER, doc.fields: [INSTRUMENT_TYPE, BUY_SELL, CCY, NOTIONAL, MATURITY_DATE] }
        flows:
          use: cashflow-ladder@1
          title: Cash flows
          supply: { model: trading-risk, query: { measures: [FLOW_AMOUNT], dimensions: [cashflows.PAY_DATE, cashflows.CCY] } }
          map: { rows.date: cashflows.PAY_DATE, rows.group: cashflows.CCY, rows.amount: FLOW_AMOUNT, rows.trade: cashflows.TRADE_ID }
      traces:
        - { from: trades.selected, to: ticket.id }
        - { from: trades.selected, to: flows.filter, transform: { filter-on: rows.trade } }
      layout:
        desktop:
          columns: 12
          areas:
            - { chip: trades, at: [1, 1], span: [7, 8] }
            - { chip: ticket, at: [8, 1], span: [5, 4] }
            - { chip: flows,  at: [8, 5], span: [5, 4] }
        phone: { order: [trades, ticket, flows], collapsed: [flows] }

  - name: master-detail
    kind: board
    title: Master and detail
    summary: The smallest useful board, a search box filtering a list and a card following the selected row.
    document:
      rachana: 1
      board: master-detail
      title: Trades and one trade
      chips:
        search: { use: search-box@1, title: Search }
        list:
          use: filterable-table@2
          title: Trades
          supply: { connector: trading/trade-search }
          map: { rows.id: TRADE_ID, rows.label: COUNTERPARTY_NAME }
        card:
          use: entity-card@1
          title: The trade
          supply: { connector: trading/trade }
          map: { doc.id: TRADE_ID, doc.title: DEAL_NUMBER }
      traces:
        - { from: search.filter-out, to: list.filter }
        - { from: list.selected, to: card.id }
      layout:
        desktop:
          columns: 12
          areas:
            - { chip: search, at: [1, 1], span: [7, 2] }
            - { chip: list,   at: [1, 3], span: [7, 7] }
            - { chip: card,   at: [8, 1], span: [5, 9] }

  - name: curve-page
    kind: board
    title: A curve page (market-data, converted)
    summary: The market-data pack's interest-rate curve page, converted into a board by the converter as you open it.
    sutra: { name: ir-curve, version: 1 }

  - name: counterparty-page
    kind: board
    title: A counterparty's trades (trading, converted)
    summary: The trading pack's counterparty page converted into a board; its one-off panels are board-local chips, Chip Store candidates.
    sutra: { name: counterparty-trades, version: 1 }

  - name: economy-map
    kind: board
    title: An economy with its map (world-economy, converted)
    summary: The world-economy pack's economy page, map and indicators, converted into a board.
    sutra: { name: economy, version: 1 }

  - name: filterable-table
    kind: chip
    title: A simple chip (filterable-table)
    summary: The guide's filterable table, copied to change (one rowset pin, filter and date controls, the selection out).
    from: filterable-table@2

  - name: entity-list
    kind: chip
    title: A composite chip (a board with no connectors)
    summary: A record's card over a list of its rows, two chips inside one; data enters only through its pins.
    document:
      rachana: 1
      chip: entity-list
      version: 1
      title: Entity and its list
      category: modules
      tags: [composite, master, detail]
      manual:
        purpose: One entity's card above a list of its rows; selecting a row sends its id out.
        pins:
          doc: The entity, a document with an id and a title. Empty shows an empty card.
          rows: The rows of the list; each gives an id. Empty shows no rows.
          selected: Out. The id of the row selected; empty until one is.
        behaviour: Clicking a row selects it and sends selected.
        defaults: No row selected.
        limits: As its chips (the list paints at most 10,000 rows).
        examples:
          - title: A counterparty and its trades
            board: |
              chips:
                m: { use: entity-list@1, supply: { connector: trading/trade-search }, map: { rows.id: TRADE_ID } }
        not-for: A single record alone (use entity-card).
        accessibility: As its chips; the card is read before the list.
      pins:
        in:
          doc:  { role: data, type: document, required: true, shape: { id: { type: id, required: true }, title: { type: text } } }
          rows: { role: data, type: rowset, required: true, shape: { id: { type: id, required: true }, label: { type: dimension } } }
        out:
          selected: { type: id }
      body:
        board:
          chips:
            header: { use: entity-card@1, title: The entity }
            list:   { use: filterable-table@2, title: Its rows }
          traces: []
          layout:
            desktop:
              columns: 12
              areas:
                - { chip: header, at: [1, 1], span: [12, 3] }
                - { chip: list,   at: [1, 4], span: [12, 6] }
        wires: { doc: header.doc, rows: list.rows }
        exposes: { selected: list.selected }

  - name: chart-by-spec
    kind: chip
    title: A chip with a spec control
    summary: Bars or a donut of a value per label; the spec control pin chooses the shape, so one chip serves both.
    document:
      rachana: 1
      chip: chart-by-spec
      version: 1
      title: Value by label
      category: charts
      tags: [chart, spec]
      manual:
        purpose: A value per label as bars or a donut, chosen by the spec control.
        pins:
          rows: The rows, a label and a value each. Empty shows nothing.
          spec: The shape, bars or donut. Default bars.
          selected: Out. The label clicked.
        behaviour: Clicking a bar or a slice sends selected.
        defaults: Bars.
        limits: Up to 50 labels.
        examples:
          - title: Notional by counterparty, as a donut
            board: |
              chips:
                c: { use: chart-by-spec@1, supply: { connector: trading/trade-search }, map: { rows.label: COUNTERPARTY_NAME, rows.value: NOTIONAL }, controls: { spec: donut } }
        not-for: Series over time (use a line).
        accessibility: Read as a list of labels and values.
      pins:
        in:
          rows: { role: data, type: rowset, required: true, shape: { label: { type: dimension, required: true }, value: { type: measure, required: true } } }
          spec: { role: control, type: enum, values: [bars, donut], default: bars }
        out:
          selected: { type: dimension }
      body:
        panels:
          - id: chart
            kind: hbar
            rows: "@rows"
            label: "@.label"
            value: "@.value"
            shape: "%{spec}"
            on-select: { emits: selected, value: "@.label" }
