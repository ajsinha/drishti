# Drishti console configuration.
# Precedence (low -> high): this file, config/application.local.yaml (git-ignored),
# environment variables (DRISHTI_CONSOLE__SERVER__PORT=17481), --server.port=17481 arguments.
server:
  host: ${DRISHTI_CONSOLE_HOST:0.0.0.0}      # every interface, so other machines (and phones) can open it; 127.0.0.1 = this machine only
  port: ${DRISHTI_CONSOLE_PORT:17480}
backend:
  url: ${DRISHTI_BACKEND_URL:http://127.0.0.1:18480}
  timeout_seconds: 5
  pool_size: 64
collab:
  # Admin > Collaboration, bridge Test: how long the console waits for the server, which waits for the bridge's own timeout
  # (drishti.collab.bridges.timeout, default 10 s). Keep it longer than that.
  bridge_test_timeout_seconds: 30
# Several servers (ADR-016): list them and people pick one, then sign in to it. Without this list, backend.url is the
# one server. See docs/admin/CONFIGURATION.md, "servers".
# servers:
#   - { id: open, name: Drishti, url: "http://127.0.0.1:18480", color: "#2a9d8f" }
#   - { id: rates-desk, name: Rates desk, url: "http://127.0.0.1:18481", token_secret: "${DRISHTI_TOKEN_SECRET_RATES:}" }
ui:
  # About this page: fetch the page's explanation once the page is idle, so labels with a glossary entry are underlined before
  # the drawer opens. Costs the server one explain (a re-run of the view, cached for drishti.explain.cache-ttl) per page view;
  # set false on a busy installation and the labels are underlined when the drawer is first opened.
  about_prefetch: ${DRISHTI_ABOUT_PREFETCH:true}
  # What an error page advises, by the DRS code the server answered with ({kind} and {id} fill in); "default" for any other
  error_advice:
    DRS-1001: Check the identifier, or type part of it in the command line to see what exists.
    DRS-1002: "No source serves the kind '{kind}'. Check the kind (the command line completes the kinds that exist), or ask an administrator to connect a source for it."
    DRS-1003: The source behind it failed. Try again in a moment; if it keeps failing an administrator can read the server log.
    DRS-1004: The source took too long to answer. Try again in a moment; a first read of an earlier date can be slow.
    DRS-1007: That source keeps no earlier versions. Clear the 'as known at' time to read what it holds now.
    DRS-4003: Pick another business date (Reset in the date menu returns to live).
    DRS-4004: The search could not be read. Check its fields and syntax.
    default: Go back to the terminal and try again, or type part of an identifier in the command line.
  studio_example: all-panels-showcase   # the example Studio opens on (a name under studio.examples_dir); blank or missing: the first pack example
  default_theme: terminal        # terminal | light | wallstreet | blue | green | crimson | crimson-dark
  # The product's name and legal notices on every page; nothing user-visible names them in code. The server has the
  # same under drishti.branding.
  product: ${DRISHTI_PRODUCT:Drishti}
  tagline: Any data. Any domain. One grammar.
  product_native: दृष्टि             # the name in its own script, beside it on the About page (blank for none)
  product_meaning: Drishti (दृष्टि) means <em>sight</em>.
  copyright: Copyright © 2026 Ashutosh Sinha. All rights reserved. Proprietary and confidential.
  notice: Unauthorised copying, use or distribution is prohibited.
  user: ${DRISHTI_USER:ash}          # acting user until sign-in lands (Wave 10)
  user_display: Ash
  desk: Rates desk
  clock_tz: America/New_York
  clock_label: NY
  # The public landing page. Its example commands (the hero animation, "Keyboard first") are the example commands of the
  # packs switched on (each pack's console.examples), so they only name entities that exist; landing_examples caps them.
  # The showcase is the four screenshots under web/static/img/shot-<slug>.png; a caption names its command only when that
  # command is one of the packs' examples (the pictured pack is installed).
  landing_examples: 4
  showcase:
    - { slug: irs, title: Interest rate swap, cmd: TRD IRS-48213, sutra: irs-vanilla v3 }
    - { slug: fx-swap, title: FX swap, cmd: TRD FXS-20931, sutra: fx-swap v2 }
    - { slug: commodity-future, title: Commodity future, cmd: TRD CFT-77120, sutra: listed-future v1 }
    - { slug: netting-set, title: Netting set, cmd: NSET NS-NORTH-01, sutra: netting-set v1 }
# Embedded views for other web applications (docs/architecture/ELEMENTS.md). OFF by default: with enabled false nothing under
# /embed/ is served and no middleware behaves differently. Host applications are registered at the SERVER (Admin API
# /api/v1/admin/embed/apps; drishti.embed.* there), which makes the tokens and checks every call; the console only serves the
# embed routes and learns the registered origins (CORS) from the server, cached origins_ttl_seconds. Embedded calls always mask.
embed:
  enabled: ${DRISHTI_EMBED_ENABLED:false}
  origins_ttl_seconds: 60
auth:
  enabled: ${DRISHTI_AUTH_ENABLED:false}      # off for local development
  session_secret: ${DRISHTI_SESSION_SECRET:}  # >= 32 characters; from the environment only
  token_secret: ${DRISHTI_TOKEN_SECRET:}      # shared with the server (drishti.security.secret)
  token_ttl_seconds: 300
  session_hours: 10
  # How long the console reuses the server's answer to "does this session still stand, and who is the user now?"
  # (enabled, roles, password change due). Disabling, demoting or signing out takes effect within this time (at once on
  # the console an administrator used). 0 asks the server on every request.
  recheck_seconds: ${DRISHTI_SESSION_RECHECK_SECONDS:10}
  # State-changing requests must come from the console's own pages (Origin or Referer = the request's host). Behind a
  # proxy that changes the Host header, list the public origin(s) here, e.g. [https://drishti.bank.example].
  allowed_origins: []
  secure_cookie: ${DRISHTI_SECURE_COOKIE:true}
  oidc:                                       # single sign-on (W20); the server verifies the ID token (drishti.security.oidc)
    enabled: ${DRISHTI_OIDC_ENABLED:false}
    issuer: ${DRISHTI_OIDC_ISSUER:}           # e.g. https://login.bank.example/realms/staff
    client_id: ${DRISHTI_OIDC_CLIENT_ID:}
    client_secret: ${DRISHTI_OIDC_CLIENT_SECRET:}   # from the environment only; empty for a public client (PKCE alone)
    token_auth: client_secret_basic           # or client_secret_post
    scopes: openid profile email
    label: Sign in with single sign-on
    redirect_uri: ${DRISHTI_OIDC_REDIRECT_URI:}     # default: <console>/auth/oidc/callback
live:                        # live updates (docs/architecture/LIVE.md): each browser holds ONE channel, shared by its tabs
  # Subscriptions one browser's channel carries at most (views across all its tabs and workspace panes, the alerts bell,
  # monitors; a view open in several tabs counts once). Each holds one stream to the server from the backend pool
  # (backend.pool_size). Beyond it a view says it is not live, and why, instead of silently not ticking.
  max_subscriptions: ${DRISHTI_LIVE_MAX_SUBSCRIPTIONS:32}
studio:
  enabled: true
  examples_dir: ../docs/guides/examples   # the Rachana examples Studio and the help centre offer (docs/guides/examples/README.md)
builder:                     # Build workbench, New (/build/new); docs/architecture/BUILD_WORKBENCH.md
  # The upload limits, checked here before anything is sent on. Keep them at or under the server's drishti.builder limits,
  # which refuse the same way (413 DRS-5005).
  max_samples: 50            # files in one upload, and samples (a .jsonl line is one) in all
  max_file_mb: 5             # largest single file
  max_total_mb: 25           # all files together
  studio_kind: sample        # the kind a new Design and "Open in Studio" preview a brought document as (a pasted document has no kind of its own)
calc:                        # Calc: Python in the browser (docs/guides/PYTHON_CALC.md); also needs a role with calc
  enabled: ${DRISHTI_CALC_ENABLED:true}   # false: no view offers it, whatever packs and roles say
layouts:                     # layout mode (Alt+L): each user's own arrangement of a view's panels; also needs a role with layout
  enabled: ${DRISHTI_LAYOUTS_ENABLED:true}   # false: no view offers it and saved layouts are not applied
  min_span: 3                # the narrowest a panel can be made in layout mode, in columns of 12 (narrower is unreadable)
help:
  docs_dir: ../docs          # the repository docs rendered as the help centre's reference section
packs:
  dir: ${DRISHTI_PACKS_DIR:../packs}   # the same packs directory the server uses (one variable sets both)
  enabled: finance           # used only when the server cannot be asked which packs are enabled
  deploy_max_mb: 50          # largest pack archive Admin → Packs → Deploy archive takes (the server's drishti.packs.deploy.max-archive-mb refuses the same way, 413)
