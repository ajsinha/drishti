# The engine catalogue (docs/guides/ADMIN_GUIDE.md section 2): every compute engine of the product, what it needs and uses, and
# everything it brings to the screen. Part of the product: the server reads it from its jar (engines/catalogue.yaml), the console its copy
# (drishti-console/config/engines.yaml, the same bytes: a test checks it). A site's config/engines/<id>.yaml holds only the switch and the
# engine's settings. An engine still to be built is listed with installed: false: the switch framework knows it, Admin -> Engines shows it
# as not installed, and its build only registers its ComputeEngine bean (and sets installed: true here).
#
# Per engine: id, title, about, file (config/engines/<file>), switch (its key), env (the switch's environment variable), aliases (the old
# switch names, still accepted: DRS-1024), shipped (the switch as shipped), installed, live-on (false: turning it on needs a restart),
# prefixes (the settings it owns), needs (hard, on the same node: refused without them, DRS-1021), uses (soft: its parts that read the other
# are hidden), api (server path prefixes: 404 DRS-1020 when it runs nowhere), console (console path prefixes; "=/path" is that path only),
# words (command words; "PLAY VAR" is two), menus (item ids of drishti-console/config/sitemap.yaml), help (help.yaml slugs), landings, tiles
# (Home quick cards by title), lenses, bi (BI dataset id prefixes), cli (drishti.py commands), playgrounds, connectors (its own), kinds
# (computed here), inputs (engine-input kinds it reads: not read ahead on a node where no running engine reads them), ai-tools.
# The banking module's engines (VaR, exposure, sensitivities, FRTB-SA, SIMM, the MR cube) are in its jar's
# META-INF/drishti/engines.yaml (the same shape; the console's copy: its plugin's engines.yaml): a module's entries come first.
engines:
  - id: memory-lake
    title: In-memory lake
    about: "Delta tables held in memory only, with their replenish jobs"
    file: memory-lake.yaml
    switch: drishti.engines.memory-lake.enabled
    env: DRISHTI_MEMORY_LAKE_ENABLED
    aliases: []
    shipped: false
    installed: true
    live-on: false
    prefixes: [drishti.lake.memory]
    needs: []
    uses: []
    api: [/api/v1/admin/lakes/memory]
    console: [/admin/api/lakes/memory]
    words: []
    menus: []
    help: []                      # its guide is a section of the Data lake guide and its tutorial a part of the lake tutorial, never hidden with it
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [lake memory]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
  - id: dataload
    title: Data inbox
    about: "Files dropped in the inbox folder with a .ready marker, loaded into the lake every interval"
    file: dataload.yaml
    switch: drishti.engines.dataload.enabled
    env: DRISHTI_DATALOAD_ENABLED
    aliases: []
    shipped: false
    installed: true
    live-on: true
    prefixes: [drishti.dataload]
    needs: []
    uses: []
    api: [/api/v1/admin/dataload]
    console: [/admin/loads/inbox, /admin/api/dataload/]
    words: []
    menus: []
    help: []
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [dataload]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
  - id: pivot
    title: Pivot
    about: "The pivot engine: any table or VaR as a pivot, nested rows opened lazily, totals from their own members, exports"
    file: pivot.yaml
    switch: drishti.engines.pivot.enabled
    env: DRISHTI_PIVOT_ENGINE_ENABLED
    aliases: [drishti.pivot.enabled]
    shipped: true
    installed: true
    live-on: true
    prefixes: [drishti.pivot]
    needs: []
    uses: [var]
    api: [/api/v1/pivot]
    console: [/pivot, /api/pivot/]
    words: [PIVOT]
    menus: [pivot]
    help: [docs-guides-pivot-guide, docs-tutorials-07-pivot-cubes-and-explain, docs-tutorials-07-pivot-cubes-and-explain#part-b--custom-functions-why-did-it-move-and-what-if]
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [pivot]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
  - id: flight
    title: Arrow Flight
    about: "Drishti's data to any client as Arrow record batches: kinds, BI models, measures, the in-memory lake (TLS, tokens with data:read)"
    file: flight.yaml
    switch: drishti.engines.flight.enabled
    env: DRISHTI_FLIGHT_ENABLED
    aliases: []
    shipped: false
    installed: true
    live-on: false
    prefixes: [drishti.engines.flight]
    needs: []
    uses: []
    api: [/api/v1/admin/data-out]
    console: [/admin/data-out, /admin/api/data-out]
    words: []
    menus: []
    help: [flight-guide]
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: []
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
  - id: openblas
    title: "Linear algebra: OpenBLAS"
    about: "The bundled OpenBLAS (native) for many-scope VaR sums, off as shipped; off: the pure-Java kernels, the same figures (OPERATIONS_GUIDE.md section 2.1)"
    file: openblas.yaml
    switch: drishti.engines.openblas.enabled
    env: DRISHTI_OPENBLAS_ENABLED
    aliases: []
    shipped: false
    installed: true
    live-on: true
    prefixes: [drishti.native]
    needs: []
    uses: []
    api: []
    console: []
    words: []
    menus: []
    help: []                      # its docs are a section of Operations (2.1), which is never hidden with it
    landings: []
    tiles: []
    lenses: []
    bi: []
    cli: [server blas]
    playgrounds: []
    connectors: []
    kinds: []
    inputs: []
    ai-tools: []
