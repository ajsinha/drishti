# The pivot formula parity set (ARCHITECTURE.md section 26.5; PivotFormulaParityTest): every formula the product ships or a test writes, as
# it was written in DEL's syntax, each field renamed onto the test fixture's columns (REGION, DESK, CCY, TRADE_DATE, NOTIONAL, PNL, CPTY,
# SALARY, RATE_PCT), and every construct of the old grammar. The answers (answers.json) were recorded on the old parser before the fold;
# `rachana` is the text the saved-formula migration writes (when it differs), which must give the same answer, cell for cell.
formulas:
# FormulaFunctionTest, CustomFunctionsTest, ConsoleFiguresTest, PivotFunctionsApiTest (fields x, w, r, X, T, H, LAST, TO, FROM renamed)
- {formula: "sum(PNL) / sum(abs(PNL))", from: "FormulaFunctionTest"}
- {formula: "sum(NOTIONAL, where=DESK == 'RATES') / sum(NOTIONAL)", from: "FormulaFunctionTest, PIVOT_GUIDE"}
- {formula: "count(where=PNL < 0) / count()", from: "FormulaFunctionTest, PIVOT_GUIDE"}
- {formula: "sum(PNL) / sum(NOTIONAL)", from: "FormulaFunctionTest, ExplainAddsUpTest"}
- {formula: "median(PNL) - avg(PNL)", from: "FormulaFunctionTest"}
- {formula: "sum(PNL) - sum(NOTIONAL)", from: "FormulaFunctionTest"}
- {formula: "sum(PNL) / count()", from: "FormulaFunctionTest"}
- {formula: "sum(PNL, where=DESK == 'FX') / sum(abs(PNL))", from: "FormulaFunctionTest"}
- {formula: "sum(PNL) / sum(PNL, where=PNL > 100)", from: "FormulaFunctionTest"}
- {formula: "sum(RATE_PCT * NOTIONAL) / sum(NOTIONAL)", from: "tutorial 37, CustomFunctionsTest, PivotFunctionsApiTest, pivot.html, API_REFERENCE"}
- {formula: "sum(RATE_PCT * NOTIONAL) / sum(abs(NOTIONAL))", from: "CustomFunctionsTest"}
- {formula: "sum(PNL * NOTIONAL) / sum(NOTIONAL)", from: "FormulaFunctionTest"}
- {formula: "stddev(PNL) / avg(NOTIONAL)", from: "FormulaFunctionTest"}
- {formula: "sum(PNL, where=NOTIONAL > 50000) - sum(PNL, where=NOTIONAL <= 50000)", from: "FormulaFunctionTest"}
- {formula: "median(NOTIONAL) - median(PNL)", from: "ConsoleFiguresTest"}
- {formula: "abs(sum(NOTIONAL)) / stddev_pop(PNL)", from: "ConsoleFiguresTest"}
# the guides and tutorials
- {formula: "sum(NOTIONAL, where=NOTIONAL > 100000000) / sum(NOTIONAL)", from: "the pivot tutorial, Part B"}
- {formula: "sum(PNL, where=PNL < 0) / sum(abs(PNL))", from: "PIVOT_GUIDE"}
- {formula: "percentile(PNL, 0.99) - percentile(PNL, 0.01)", from: "PIVOT_GUIDE, PIVOT_ENGINE"}
- {formula: "wavg(PNL, NOTIONAL)", from: "PIVOT_ENGINE"}
# every construct of the formula grammar, DEL's spellings among them
- {formula: "sum(PNL, where=DESK == 'RATES' and PNL > 0) / sum(NOTIONAL)", from: "grammar", rachana: "sum(PNL, where = DESK == 'RATES' && PNL > 0) / sum(NOTIONAL)"}
- {formula: "sum(PNL, where=DESK == 'FX' or REGION == 'EMEA')", from: "grammar", rachana: "sum(PNL, where = DESK == 'FX' || REGION == 'EMEA')"}
- {formula: "count(where=not (PNL < 0))", from: "grammar", rachana: "count(where = !(PNL < 0))"}
- {formula: "count(where=not PNL < 0)", from: "grammar", rachana: "count(where = !(PNL < 0))"}
- {formula: "sum(PNL, where=PNL != None) / count(where=PNL == None)", from: "grammar", rachana: "sum(PNL, where = PNL != null) / count(where = PNL == null)"}
- {formula: "count(where=PNL == None)", from: "grammar", rachana: "count(where = PNL == null)"}
- {formula: "sum(PNL) if count() > 300 else 0", from: "grammar", rachana: "count() > 300 ? sum(PNL) : 0"}
