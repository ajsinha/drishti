- {formula: "sum(RATE_PCT ** 2)", from: "grammar", rachana: "sum(power(RATE_PCT, 2))"}
- {formula: "sum(PNL, where=DESK in ['RATES', 'FX']) / sum(NOTIONAL, where=DESK not in ['RATES'])", from: "grammar"}
