# Core semantic hints: domain-neutral. Packs prepend their own roles (see packs/<name>/config/semantics.yaml),
# so a pack's meaning of a field name wins over these. Roles are tried in order; the first whose name pattern
# matches (case-insensitive regex on the field name) wins. `weight` ranks candidates for the header strip.
# A site can replace this file with drishti.inference.semantics-file.
roles:
  - { role: signed-money, pattern: "(^|_)(pnl|profit|loss|change|delta|variance)$|pnl$|change$", fmt: signed0, tone: sign, weight: 90 }
  - { role: money,        pattern: "amount|value$|cost|price$|balance|revenue|total$|budget", fmt: amount0, weight: 80 }
  - { role: percent,      pattern: "utili[sz]ation|ratio|share$|pct$|percent", fmt: pct0, weight: 50 }
  - { role: rate,         pattern: "rate$", fmt: pct2, weight: 70, fractionOnly: true }
  - { role: date,         pattern: "date$|^date|at$|time$|expiry|asof|due", fmt: date, weight: 60, dateOnly: true }
  - { role: count,        pattern: "count|quantity|qty|units|items|^n$", fmt: amount0, weight: 55 }
  - { role: label,        pattern: "name|label|type|status|category|code$|currency|ccy|owner|region", weight: 65 }
# Axis-like values that become chart x-axes: tenors (1M, 5Y), hours (H1), periods (Q1, 2026-Q3).
tenorPattern: "^(\\d+[DWMY]|H\\d{1,3}|Q[1-4]|\\d{4}-Q[1-4])$"
datePattern: "^\\d{4}-\\d{2}-\\d{2}"
# Field names that identify the entity itself (used for the title); {kind} is the camel-case kind.
idFields: ["{kind}Id", "id", "code", "name"]
limits: { strip: 8, right: 4, main: 6, kvMaxFields: 16, tableMaxColumns: 9 }
