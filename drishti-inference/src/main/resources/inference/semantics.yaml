# Semantic hints: how inference recognises what a field means from its name and value.
# Roles are tried in order; the first whose name pattern matches (case-insensitive regex on the
# field name) wins. `weight` ranks candidates for the header strip (higher shows first).
# A site can override this file with drishti.inference.semantics-file.
roles:
  - { role: signed-money, pattern: "(^|_)(mtm|pv|pnl|dv01|pv01|cs01|vega|delta|gamma|change|variationmargin|netmtm|pvusd)$|mtm$|pv$|pnl$", fmt: signed0, tone: sign, weight: 90 }
  - { role: money,        pattern: "notional|amount|margin|collateral|exposure|limit|ee(peak)?$|pfe|balance|principal|value$", fmt: amount0, weight: 80 }
  - { role: percent,      pattern: "utili[sz]ation|ratio|share|weight", fmt: pct0, weight: 50 }
  - { role: rate,         pattern: "rate$|spread|yield|coupon|fixing|strike", fmt: pct4, weight: 70, fractionOnly: true }
  - { role: fx-rate,      pattern: "(near|far|spot|fwd|forward)rate$|^rate$", fmt: rate5, weight: 70 }
  - { role: price,        pattern: "price|settle|px$", fmt: price2, weight: 70 }
  - { role: points,       pattern: "points|pips", fmt: pips1, weight: 60 }
  - { role: df,           pattern: "^df$|discount", fmt: df4, weight: 20 }
  - { role: date,         pattern: "date$|^date|maturity|effective|valuedate|reset|expiry|asof|value$", fmt: date, weight: 60, dateOnly: true }
  - { role: count,        pattern: "lots|trades|count|flows|^n$|quantity|qty", fmt: amount0, weight: 55 }
  - { role: label,        pattern: "name|label|product|type|direction|status|pair|contract|currency|ccy|book|desk", weight: 65 }
# Values that look like tenors or listed-contract months become chart axes.
tenorPattern: "^(ON|TN|SN|\\d+[DWMY]|[FGHJKMNQUVXZ]\\d{1,2}|0)$"
datePattern: "^\\d{4}-\\d{2}-\\d{2}"
# Field names that identify the entity itself (used for the title) — {kind} is replaced by the camel-case kind.
idFields: ["{kind}Id", "id", "tradeId", "code", "name"]
# Layout density limits.
limits: { strip: 8, right: 4, main: 6, kvMaxFields: 16, tableMaxColumns: 9 }
